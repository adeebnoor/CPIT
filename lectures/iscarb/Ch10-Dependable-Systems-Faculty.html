in-top:auto;padding-top:18px;color:var(--dim);font-size:12px}.teach strong{color:var(--green)}.notes{display:none;margin-top:12px;border:1px dashed rgba(221,178,126,.45);border-radius:10px;padding:11px 13px;color:#d8cdbf;background:rgba(221,178,126,.05);font-size:12px;line-height:1.45}.notes.show{display:block}.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--line);background:#0c0a11}.nav{display:flex;gap:7px}.nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer}.nav button:disabled{opacity:.35}.progress{height:4px;background:#26202d;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--sand);width:5%;transition:width .2s}.hint{font-size:10px;color:var(--dim);white-space:nowrap}@media(max-width:700px){.top{padding:9px 11px}.brand{font-size:10px}.top a{font-size:9px;padding:6px}.slide{padding:20px 17px 12px}h1{margin-top:12px}.grid{grid-template-columns:1fr}.card{padding:12px}.card p,.card li{font-size:13px}.bar{gap:8px;padding:8px}.hint{display:none}.nav button{padding:8px 10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<header class="top"><div class="brand"><span>ISCARB</span> · CPIT-455 · CH10 Faculty Lane</div><div class="toplinks"><a href="../../iscarb.html">Hub</a><a href="Ch10-FBR-Student-Assignment.html">Student assignment</a></div></header>

<footer class="bar"><div class="nav"><button id="prev">←</button><button id="next">→</button><button id="noteBtn">Notes</button></div><div class="progress"><i id="prog"></i></div><div class="hint">← → navigate · N notes · swipe on mobile</div></footer>

<script>
const S=[
{p:'CRISIS',i:'INTERACTION 1 OF 3 · VERBAL POLL',t:'You sign before you know',s:'A coastal desalination control upgrade went live at 22:14 during peak demand.',c:[['Situation','Pump P-204 throws intermittent high-pressure alarms. The backup train switches automatically.'],['Human context','At shift handover, an operator silenced a repeating alarm to read the log.'],['Decision pressure','The regulator says the system is safe under normal operation. Tonight is not normal operation.']],q:'Ask only: What would you do, and what one piece of evidence would you demand?',n:'30 seconds. No writing. Do not explain the theory yet; create decision pressure first.'},
{p:'MAP',t:'The chapter is a decision map',s:'Six questions organize the theory you will use tonight.',c:[['Dependability','Can the system be trusted?'],['Failure causes','Where does failure start?'],['Sociotechnical','How far does the failure reach?'],['Redundancy & diversity','What do we add, and at what cost?'],['Dependable process','What proves it was built well?'],['Formal methods','What can actually be proved?']],n:'Use this as the roadmap. The purpose is orientation, not student activity.'},
{p:'THEORY',t:'Dependability is not one number',s:'Trust in a system is expressed through different properties, and they demand different kinds of evidence.',c:[['Availability','Probability that the system is operational when required.'],['Reliability','Probability of failure-free operation over a stated period or demand.'],['Safety','Judgment that catastrophic consequences are acceptably controlled.'],['Security','Judgment that the system resists threats to confidentiality, integrity and availability.'],['Resilience','Ability to continue, recover and adapt under disruption.']],q:'Probability language obliges measurement; judgment language obliges an argument to an accepted threshold.',n:'Emphasize that students must not use “99.9% dependable” as if every property were the same metric.'},
{p:'THEORY',t:'Fault → Error → Failure',s:'Three words for three different things. Confusing them corrupts every later argument.',c:[['Fault','The cause: a defect, incorrect action or adverse condition.'],['Error','The internal system state produced by the fault.'],['Failure','The externally observable deviation from required service.']],q:'A defensible incident explanation names all three in order.',n:'Say tonight’s incident aloud as fault → error → failure. No worksheet.'},
{p:'THEORY',t:'Failures do not start only in software',s:'Hardware, software and operational causes interact — especially in dependable systems.',c:[['Hardware','Physical component faults, sensors, power, wear or environmental effects.'],['Software','Specification, design, implementation or configuration faults.'],['Operational','Human action, handover, procedure, workload or organizational conditions.'],['Key discipline','Ask what log or artifact would defeat your preferred classification.']],n:'The upgrade makes “software” psychologically salient. Challenge that reflex with evidence.'},
{p:'THEORY',t:'The system is sociotechnical',s:'A failure can propagate far beyond the application boundary.',c:[['Equipment','Sensors, pumps, controllers, networks.'],['Application system','Software and configured automation.'],['Operators','Interpretation, alarm response, workarounds, handover.'],['Business process','Shift procedures, maintenance, release governance.'],['Organization / society','Management incentives, regulation, public consequences.']],q:'If your analysis stops at the application system, it is incomplete.',n:'Trace the desalination case upward at least three layers while you explain.'},
{p:'TRADE-OFF',i:'INTERACTION 2 OF 3 · FIT TRAP',t:'Two certified aircraft, two opposite answers',s:'Redundancy and diversity can improve dependability — and can also add complexity, cost and new failure modes.',c:[['Redundancy','Duplicate components or paths can tolerate individual failures.'],['Diversity','Different implementations can reduce common-mode faults.'],['Trade-off','More independence can mean more integration complexity, verification effort and operational burden.'],['Fit trap','“More redundancy is safer” is technically plausible but not universally fit for use.']],q:'Ask one student to defend adding diversity and another to defend not adding it.',n:'Keep this under three minutes. The teaching target is contextual fitness, not a universally “correct” architecture.'},
{p:'TRADE-OFF',t:'The next increment gets expensive',s:'Dependability costs tend to rise sharply as required assurance increases.',c:[['Why','Stronger assurance requires more review, testing, independence, evidence and control.'],['Professional question','Where does the next increment materially change risk or acceptance?'],['Evidence question','What metric or artifact would prove that increment rather than merely assert it?']],q:'A percentage without a defined metric and evidence regime is confidence wearing a decimal point.',n:'Do not invent numerical targets that are not in the source.'},
{p:'PROCESS',t:'A dependable process leaves a record',s:'A different engineer should be able to reconstruct what was done, why, by whom and with what evidence.',c:[['Auditable','Decisions and evidence are inspectable.'],['Repeatable','The process can be executed consistently.'],['Diverse review','Independent perspectives challenge common assumptions.'],['Controlled change','Baselines, approvals and changes are traceable.']],q:'For a regulated system, process evidence is part of the product.',n:'Ask which artifact proves the process attribute; do not accept “we followed the process.”'},
{p:'FORMAL METHODS',t:'What can actually be proved?',s:'Formal methods use mathematical representation and analysis to establish properties of models or implementations.',c:[['Can help','Expose ambiguity, inconsistency, unreachable states and violations of stated properties.'],['Cannot replace','Correct requirements, realistic assumptions, operational evidence or human accountability.'],['Adoption reality','Cost, skill, scale and integration constraints limit universal use.']],q:'Proof is conditional on the model and assumptions being the right ones.',n:'Connect formal proof back to the sociotechnical boundary.'},
{p:'FBR',t:'Fit–Bound–Refit Framework',s:'The lecture teaches the discipline. FBR is the recurring way students practise professional judgment after learning it.',c:[['FIT','Which valid knowledge or mechanism should govern responsible action here?'],['BOUND','Under what observable condition would that permission end?'],['ACT','What professional artifact, decision or change follows?'],['STRESS','What changed, and does it touch the boundary?'],['REFIT','Retain, revise or replace — with a defensible consequence.']],q:'Fit for use, not fit for you.',n:'Teach the framework; do not run the student worksheet in class.'},
{p:'FBR · FIT',t:'Fit for use is broader than technically correct',s:'A familiar or elegant answer can still be the wrong professional action.',c:[['Fit for you','Familiar, preferred, easy to explain, or comfortable for the team.'],['Fit for use','Appropriate to purpose, people, evidence, constraints, consequences, time and place.'],['Transferable','Clear enough that another professional can inspect, hand over and act on it.']],q:'Technically correct ≠ professionally fit.',n:'Use redundancy as the worked example: valid knowledge, conditional professional use.'},
{p:'FBR · BOUND',t:'Every professional action has an applicability boundary',s:'A strong engineer states where the current permission to act ends before reality tests it.',c:[['Support','What observable evidence makes the action fit now?'],['Boundary','What observable condition would make it no longer fit?'],['Not the same as uncertainty','Unknown = what we do not know. Boundary = what would reopen or change the action.']],q:'Knowledge can remain true while the action it once justified becomes wrong.',n:'Demonstrate one real boundary and one irrelevant change.'},
{p:'RISK',t:'Make uncertainty operational',s:'Do not write “we are not sure” and stop.',c:[['Known','Supported by an artifact that can be inspected.'],['Unknown','A decision-sensitive gap that could change the verdict.'],['Monitor','A signal, trigger value and named owner that tells the team when to act.'],['Professional discipline','A monitor without a trigger is only observation, not control.']],n:'Connect this to risk management and the evidence students will need after class.'},
{p:'ACCOUNTABILITY',t:'A dependable answer names who owns what',s:'The person who claims, the person who verifies and the authority who signs need not be the same person.',c:[['Decision owner','Owns the recommendation or operational decision.'],['Evidence owner','Owns the measurement, test, log or verification artifact.'],['Sign-off authority','Accepts the residual risk and authorizes action.']],q:'Ownership enables auditability; it should not be confused with blame.',n:'Use the plant case to name three roles.'},
{p:'HUMAN SYSTEM',t:'Engineering changes human work',s:'A technically safe design can still fail operationally if it creates unsustainable workload.',c:[['Review workload','Who validates evidence, exceptions and changes — and do they have the assumed capacity?'],['Alarm / handover load','Does the design increase cognitive burden at the worst moment?'],['Design response','Alarm rationalisation, handover protocol, automation guardrails, second review or clearer ownership.']],q:'Human consequences are part of fitness for use.',n:'Keep this as engineering, not a wellbeing aside: require a concrete design implication.'},
{p:'AI & ACCOUNTABILITY',t:'AI may assist; humans own the professional judgment',s:'Capabilities will change. Accountability for consequential engineering decisions still needs a named human owner.',c:[['AI may assist','Draft tests, summarize evidence, triage logs, propose failure modes and candidate controls.'],['AI may challenge','Surface counter-evidence and alternative mechanisms that test FIT and BOUND.'],['Human accountability','Define intended use, decide what evidence is enough, set the boundary, authorize action, communicate it and own consequences.']],q:'An unowned AI output is not assurance.',n:'Frame this as accountability, not as a permanent claim about what AI can or cannot cognitively do.'},
{p:'CAPABILITY',t:'How professional judgment develops',s:'The rubric rates judgment quality, not eloquence or field completion.',c:[['L1 · Descriptive','Correctly describes mechanisms and concepts.'],['L2 · Selective (Fit)','Justifies why selected knowledge is fit for this use now.'],['L3 · Bounded','States a clear, observable applicability boundary.'],['L4 · Adaptive (Refit)','Tests the boundary and makes a justified Retain / Revise / Replace decision with consequences.']],n:'The automated assignment can check presence of evidence; formal marking judges semantic quality.'},
{p:'FBR · REFIT',t:'Change does not automatically mean change your mind',s:'The professional question is whether the new condition crosses the boundary that justified the action.',c:[['1 · FIT','Restate what governs the action.'],['2 · BOUND','Restate when it stops fitting.'],['3 · STRESS','Introduce one changed condition.'],['4 · TEST','Did the change actually cross the boundary?'],['5 · REFIT','Retain, revise or replace — and state the consequence.']],q:'Appropriate retention can be as expert as appropriate revision.',n:'Demonstrate one example aloud only. The full submission happens after class.'},
{p:'PROCESS',t:'What survives of agile here?',s:'Iteration still matters, but a dependable system requires stronger evidence discipline around change.',c:[['Keep','Small increments, test-first habits, fast feedback and learning.'],['Add','Traceability, independent evidence, change control and explicit rollback / revert paths.'],['Ask','What was the change window at 22:14, and what should the revert path have been?']],q:'Speed without inspectable evidence is not professional agility in a consequential system.',n:'Bridge this to students’ software projects and release practice.'},
{p:'ASSIGNMENT',t:'After class: one professional decision, one page',s:'Students practise FBR outside the lecture so the class can remain focused on disciplinary teaching.',c:[['Part A','FIT → BOUND → ACT + EVIDENCE.'],['Commit','Part A is locked before new information appears.'],['Part B','STRESS is revealed only after commitment.'],['REFIT','Choose Retain / Revise / Replace and produce the final artifact.']],q:'The lecture teaches the discipline. The assignment practises professional judgment.',n:'Preview only. Do not collect written responses in class.'},
{p:'LAUNCH',i:'INTERACTION 3 OF 3 · ASSIGNMENT LAUNCH',t:'Now you own the decision',s:'Leave the lecture with the theory. Practise Fit–Bound–Refit after class in one bounded professional decision.',c:[['FIT','What is responsibly fit for this use, these people and these conditions?'],['BOUND','What observable condition ends that permission?'],['ACT','What do you build, decide, document or hand over?'],['STRESS','What changed — and does it matter to the boundary?'],['REFIT','Retain, revise or replace — and what action follows?']],q:'Open the separate Student FBR Assignment after class.',n:'Explain the submission format and deadline. No in-class writing. End here.'}
];
const stage=document.getElementById('stage'), prog=document.getElementById('prog'), prev=document.getElementById('prev'), next=document.getElementById('next'), noteBtn=document.getElementById('noteBtn');
let idx=0;
function esc(x){return x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){stage.innerHTML='';S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(i===idx?' on':'');el.innerHTML=`<div class="meta"><span class="phase">${esc(s.p)}</span><span>${s.i?`<span class="interaction">${esc(s.i)}</span> · `:''}${String(i+1).padStart(2,'0')} / ${S.length}</span></div><h1>${esc(s.t)}</h1><p class="sub">${esc(s.s)}</p><div class="grid">${s.c.map(x=>`<div class="card"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div>${s.q?`<div class="principle">${esc(s.q)}</div>`:''}<div class="teach"><strong>Faculty lane:</strong> explain the theory; student written work happens after class.</div><div class="notes" id="notes">${esc(s.n||'')}</div>`;stage.appendChild(el)});prog.style.width=((idx+1)/S.length*100)+'%';prev.disabled=idx===0;next.disabled=idx===S.length-1;}
function go(n){idx=Math.max(0,Math.min(S.length-1,n));render()}
prev.onclick=()=>go(idx-1);next.onclick=()=>go(idx+1);noteBtn.onclick=()=>document.querySelector('.slide.on .notes')?.classList.toggle('show');
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(idx+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}else if(e.key.toLowerCase()==='n')document.querySelector('.slide.on .notes')?.classList.toggle('show');else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1)});
let x0=null;stage.addEventListener('touchstart',e=>x0=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{if(x0==null)return;let d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>55)go(idx+(d<0?1:-1));x0=null},{passive:true});render();
</script>
