</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261015-req-v7c"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 14</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch14-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":14,"title":"Resilience Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch14-Resilience-Engineering.html","assignment":5,"points":5,"objectives":["Explain recognition, resistance, recovery and reinstatement.","Identify organizational and technical dependencies.","Interpret the Swiss Cheese model without assuming independence.","Perform the stages of survivability analysis.","Trade off degraded service against confidentiality and integrity."],"sections":["14.1 Cybersecurity","14.2 Sociotechnical resilience","14.3 Resilient systems design"],"case":{"headline":"The backup is running. The service still cannot be used.","text":"After a fictional disruption, a backup server starts. Authorized staff still cannot complete the critical task, because the access service is unavailable. The only trained recovery specialist is off shift.","question":"What has recovered, and what must still be restored?","mutation":"The alternate data copy is available, but it depends on the same unavailable identity service. Staff also sign in to the AI recovery assistant through that identity service, and its instructions assume the primary copy.","lens":"With the specialist off shift, staff turn to the organisation's AI recovery assistant. It is a vendor-hosted chatbot trained on past runbooks, and it gives confident step-by-step instructions. It has never been used in a recovery rehearsal. Hold that question: after the design slides, one slide shows how this chapter's methods apply to the assistant.","fictional":true,"answerKey":"identity restored through an independent audited route"},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Resilience Engineering","phase":"START","takeaway":"Resilience Engineering","full":"<p>Resilience Engineering<\/p>","sourceStart":1,"minutes":2,"tier":"core"},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1,"minutes":1,"tier":"core"},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1,"minutes":1.5,"tier":"core"},{"id":"X01","title":"Resilience starts where prevention is not enough","fig":null,"sourceRange":"3–9","bullets":[["Critical service","Identify what must continue despite disruption."],["Changed assumptions","Prepare for conditions not covered by normal operation."],["Sociotechnical","People, processes and technical systems contribute to recovery."],["Boundary","The source treats resilience as an expert judgment, not a single universal score."]],"question":"Why is a running backup not necessarily a recovered service?","answer":"Users may still lack access, trustworthy data, trained operators or a working process. Recovery is judged against the critical service.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Resilience is judged by whether critical services continue through disruption.","full":"<p>Sommerville defines resilience as a judgment of how well a system can maintain the continuity of its <b>critical services<\/b> in the presence of <b>disruptive events<\/b> such as equipment failure and cyberattacks. Critical services are those whose failure could have serious human, social or economic effects. There are no resilience metrics: resilience cannot be measured and can only be assessed by experts who examine the system and its operational processes.<\/p><p>Resilience engineering starts from two assumptions. Failures cannot be avoided entirely, so the aim is to limit their cost and recover from them. And good reliability engineering has already reduced technical faults, so more attention goes to failures caused by external events such as operator errors and cyberattacks. This is why a running backup server is not the same as a recovered service: the question is whether people can actually complete the critical task.<\/p>","sourceStart":3,"notes":"Start from the story: the server is up, but staff cannot work. Ask the class to define the critical service in one sentence before any mechanism is discussed. Students often equate resilience with redundancy; the definition is about service continuity.","minutes":1.5,"tier":"core","concept":"resilience as service continuity","answerKey":"a running backup is not a recovered service","commonError":"Students equate resilience with redundancy. The definition is about continuing the critical service; make them define that service in one sentence first."},{"id":"X02","title":"Recognition → resistance → recovery → reinstatement","fig":"ch14_resactivities","sourceRange":"3–9","bullets":[["Recognition","Detect symptoms of failure or attack."],["Resistance","Contain problems or repel an attack; service may be restricted."],["Recovery","Restore the critical services first."],["Reinstatement","Restore all services and normal operation in a controlled way."]],"question":"Which of the four resilience activities does the watchdog timer support?","answer":"Recognition: the timer notices that the system has stopped responding. A restart starts recovery, but it does not restore calls lost meanwhile or check that dispatch data is intact. Those need their own evidence.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/16a0f6456c570849.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Recognition, resistance, recovery and reinstatement are four different jobs with four different checks.","full":"<p>The chapter describes four related resilience activities:<\/p><ul><li><b>Recognition<\/b>: the system or its operators recognize the symptoms of a failure or an attack.<\/li><li><b>Resistance<\/b>: the system resists or contains the problem, for example by isolating critical parts, even if some services must be restricted.<\/li><li><b>Recovery<\/b>: critical services are restored quickly so that users can continue their essential work.<\/li><li><b>Reinstatement<\/b>: all services are restored and normal operation resumes in a controlled way.<\/li><\/ul><p>Each activity needs its own evidence. Having only the essential records available may satisfy recovery of a critical service, but reinstatement is not complete while other services remain restricted or while data changed during the disruption has not been reconciled.<\/p>","sourceStart":3,"notes":"Put the four words on the board and ask where our story is now. Most will say recovery; press them that recovery is not achieved while staff cannot sign in. Keep recovery and reinstatement apart—students merge them.","minutes":1.5,"tier":"core","commonError":"Students merge recovery and reinstatement, and say the story is already in recovery. Recovery is not achieved while staff cannot sign in.","transfer":true,"concept":"the four Rs applied to a mechanism","answerKey":"recognition by the watchdog timer"},{"id":"X02A","title":"Cyber-resilience planning","fig":"ch14_cyberplan","sourceRange":"10–17; 50–63","bullets":[["Classify assets","Distinguish critical, important and useful assets."],["Recognize and resist","Define detection, then the technical and operational actions that contain the threat."],["Recover and reinstate","Trustworthy copies for critical services first; then all assets, in a controlled way."],["Test and update","Exercise the strategy and revise it as assets, threats and operations change."]],"question":"Which evidence distinguishes “we have backups” from “we can recover”?","answer":"An executed recovery record for a stated system version and dataset, with access, integrity and service checks. A backup inventory alone is not enough.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/ch14-cyberplan-combined.jpg","caption":"Sommerville Ch.14 · both preserved source illustrations · select to enlarge","takeaway":"Cyber-resilience planning classifies assets first, then plans the four Rs for each.","full":"<p>Cybersecurity is broader than system security engineering: it concerns the protection of citizens, businesses and infrastructure from threats arising from their use of computers and networks. The chapter lists common contributors to failure—organizational ignorance of the problem, poor design and lax procedures, human carelessness and poor trade-offs between usability and security—and threats to the confidentiality, integrity and availability of assets.<\/p><p>Cyber-resilience planning then proceeds in steps. <b>Classify assets<\/b> (hardware, software and people) as critical, important or useful. <b>Identify threats<\/b> to the critical and important assets. For each threat, plan <b>recognition<\/b> and <b>resistance<\/b>, which may be technical or operational. Plan <b>recovery<\/b> of each critical asset and <b>reinstatement<\/b> of all assets. Finally, <b>test<\/b> the plan and update it as assets and threats change. Classification comes first because it decides what must survive; a new security tool cannot make that decision.<\/p>","sourceStart":10,"notes":"Ask what distinguishes “we have backups” from “we can recover”: an executed, recorded recovery of a stated version and dataset. Then ask which of our case’s assets is critical; the identity service usually surprises students.","minutes":2,"tier":"core","concept":"backups versus proven recovery","answerKey":"an executed, recorded recovery of a stated version","commonError":"Students accept a backup inventory as proof of recovery. Ask for the executed recovery record, and ask which asset the critical task cannot run without.","concept2":"asset classification before tools","answerKey2":"the required service sets the priorities","question2":"Why must asset classification come before buying another security tool?","answer2":"The required service and its consequences set the priorities. A tool does not say what must survive or which loss matters most.","lists":[{"source":16,"title":"Cyber-resilience planning","items":["Asset classification","Threat identification","Threat recognition","Threat resistance","Asset recovery","Asset reinstatement"]}]},{"id":"X03","title":"Resilience exists across organizational layers","fig":"ch14_nested","sourceRange":"18–27","bullets":[["Operators","May contain a technical failure before it becomes a service failure."],["Managers","Coordinate when local recovery is insufficient."],["Capabilities","Respond, monitor, anticipate and learn."],["Learning","Study successful adaptations as well as incidents."]],"question":"What becomes a system dependency when only one specialist can restore access?","answer":"That person’s availability, knowledge and authority. A resilient plan needs a realistic handover or alternative response.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/f082d48c0c892cff.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Resilience lives in the sociotechnical system: people and procedures can trap a technical failure.","full":"<p>To design a resilient system you have to think about the sociotechnical system, not only the software. Many adverse events are easier to deal with in the wider system. In the Mentcare example, attackers may use a legitimate user’s credentials. Stronger authentication irritates users and may even reduce security if people leave systems logged in, so organizational policies and education about credentials can be a better response.<\/p><p>Technical systems are nested inside sociotechnical systems. A failure in a technical system may be trapped by operators in the surrounding sociotechnical system, limiting organizational damage; if it is not, managers in the wider organization must deal with it. Resilient organizations show four characteristics: they can <b>respond<\/b> to events, <b>monitor<\/b> what is happening, <b>anticipate<\/b> future problems and <b>learn<\/b> from experience—including from successful recoveries, not only from incidents.<\/p>","sourceStart":18,"notes":"Ask what becomes a dependency when only one specialist can restore access: the person’s availability, knowledge and authority. This prepares the efficiency-versus-resilience slide.","minutes":1.5,"tier":"core","concept":"human dependency in recovery","answerKey":"the specialist's availability, knowledge and authority","commonError":"Students list only technical dependencies. The one specialist who can restore access is a dependency too: availability, knowledge and authority.","sourceFigs":[23],"lists":[{"source":24,"title":"Organizational resilience · slides 24–25","items":["The ability to respond: adapt processes and procedures to anticipated risks and detected threats","The ability to monitor: watch internal operations and the external environment for threats before they arise","The ability to anticipate: look beyond current operations to future events and changes","The ability to learn: learn from experience, especially from successful responses to adverse events"]}]},{"id":"CHECK1","title":"Checkpoint · name the service boundary","fig":null,"sourceRange":"3–27","bullets":[["Think","A backup starts but authorized staff still cannot retrieve records."],["Pair","State which service has—and has not—recovered."],["Record","Define the claim and the evidence needed at the user boundary."]],"question":"Which check shows recovery better than “the server process is running”?","answer":"A representative authorized user completes the specified critical task using data whose integrity is checked.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Judge recovery at the user boundary: can an authorized user complete the critical task?","full":"<p>“The backup server is running” describes a component. A useful acceptance check describes the service: a representative authorized user completes the critical task, with data whose integrity has been checked, within the time the service requires. In our case the server check passes but the user check fails, because the access service is unavailable. A bounded claim names what has recovered, what has not, and the evidence that would show the critical service is usable again.<\/p>","sourceStart":3,"notes":"Collect one claim per pair and ask which of them another engineer could verify during a rehearsal. Reward claims that name the user, the task and the integrity check.","minutes":1,"tier":"core","concept":"recovery judged at the user boundary","answerKey":"an authorized user completes the critical task on checked data","commonError":"Pairs offer “the server process is running” as the check. Reward claims that name the user, the task and the integrity check."},{"id":"X04","title":"Defensive layers can fail together","fig":"ch14_swiss","sourceRange":"28–32","bullets":[["Barriers","Several defenses may block a path to harm."],["Weaknesses","Each layer has limitations that can align."],["Common causes","Shared credentials, assumptions or infrastructure can affect multiple layers."],["Systems approach","Investigate why defenses failed, not only who made the final error."]],"question":"Why is “add another identical backup” an incomplete response to compromised credentials?","answer":"The same credentials may expose both copies. The design must address the shared access path as well as redundancy.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/fd384ab70c090c88.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Defensive layers fail when their holes line up, so each layer must fail in a different way.","full":"<p>Redundancy and diversity create defensive layers, where each layer uses a different approach to deter attackers or trap technical and human failures. In air traffic control, for example, a conflict-alert system, formal recording procedures and collaborative checking between controllers all protect against the same mistakes.<\/p><p>Reason’s <b>Swiss cheese model<\/b> pictures each layer as a slice with holes—its vulnerabilities. The holes are dynamic: their size and position change with operating conditions. A system fails when holes in every layer line up. Resilience therefore improves when you reduce the chance of the triggering event, add layers, make the layers diverse so that their holes are in different places, and reduce latent conditions. A second identical backup that uses the same compromised credentials adds a slice with the same hole.<\/p>","sourceStart":28,"notes":"Draw three slices and ask the class to name the holes in our story: shared identity service, one specialist, runbook that assumes the primary copy. Then ask which slice is missing entirely.","minutes":1.5,"tier":"core","concept":"defensive layers that fail together","answerKey":"shared credentials expose both copies","commonError":"Students answer compromised credentials with another identical backup. Draw the slices and ask which hole runs through both: the shared identity service."},{"id":"X05","title":"Efficiency and resilience can conflict","fig":null,"sourceRange":"33–41","bullets":[["Automation","Reduces routine work but can remove human flexibility."],["Specialization","Builds expertise but creates dependence on particular people."],["Information hiding","Protects data but can stop operators seeing a developing problem."],["Trade-off","Use consequences and plausible interventions to justify the balance."]],"question":"When might cross-training be preferable to maximum role specialization?","answer":"When the absence of one specialist prevents containment or recovery across interacting systems. The workload and training cost still need justification.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Efficient processes remove the slack that people use to cope with problems.","full":"<p>Operational and management processes are a defense in their own right, but designing them means balancing efficient operation against problem management. The chapter contrasts pairs of choices: process optimization and control versus flexibility; information hiding and security versus information sharing and visibility; automation with fewer operators versus manual processes with spare capacity; role specialization versus role sharing.<\/p><p>What looks inefficient is often what helps people cope. Air traffic controllers may print flight details as well as relying on the database, so they still have information if the database fails. A specialist-only role means that nobody else can act when the specialist is absent, while people who work across systems understand the dependencies between them. Use risk assessment to decide: for risks that are likely, or that could cause serious loss, favor resilience over efficiency.<\/p>","sourceStart":33,"notes":"Ask when cross-training beats specialization, using our off-shift specialist. Make the class state the risk that justifies the extra training cost rather than simply calling redundancy good.","minutes":1.5,"tier":"optional","concept":"efficiency versus resilience","answerKey":"cross-training when one absence blocks recovery","commonError":"Students call redundancy good without a reason. Make them state the risk that justifies the training cost: one absent specialist blocks recovery."},{"id":"D14","title":"Give people a usable recovery process","fig":null,"sourceRange":"33–41","bullets":[["Person approach","Attributes errors primarily to the individual."],["Systems approach","Examines workload, training, design and failed safeguards."],["Handover","Make state, responsibility and escalation visible."],["Evidence","Rehearse recovery under realistic staffing conditions."]],"question":"What should follow an operator missing a warning during several simultaneous alarms?","answer":"Investigate interface, workload, prioritization, training and escalation as well as the action. Propose a checkable design/process improvement.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Treat operator error as a symptom of the system, and rehearse recovery under realistic conditions.","full":"<p>The chapter contrasts two views of human error. The <b>person approach<\/b> treats errors as the responsibility of the individual—carelessness or inattention—and responds with warnings, retraining or blame. The <b>systems approach<\/b> assumes that people are fallible and asks why the system’s defenses did not trap the error: workload, interface design, training and procedures. Sommerville argues for the systems approach.<\/p><p>A usable recovery process makes the current state, responsibility and escalation visible, so that a handover does not lose information. It should be defined and rehearsed with realistic staffing, including the case where the usual expert is unavailable. An operator who misses a warning during several simultaneous alarms points to a design and workload problem to investigate, not only to an individual to correct.<\/p>","sourceStart":33,"notes":"Use the missed-warning question to practise the systems approach. Accept an answer only if it proposes a checkable design or process change, such as alarm prioritization or a rehearsal with a second trained person.","minutes":1.5,"tier":"optional","concept":"systems approach to human error","answerKey":"investigate interface, workload and training; propose a checkable change","commonError":"Students blame the operator who missed the warning. Accept an answer only if it proposes a checkable design or process change."},{"id":"EMERGENCY","title":"Emergency authority needs an audit trail","fig":null,"sourceRange":"16–17","bullets":[["Tension","Restricting privilege may obstruct urgent containment."],["Emergency mode","The source describes exceptional actions with recorded responsibility."],["Risk","An emergency path can itself become a vulnerability."],["Boundary","Define authorized scope, review and restoration of normal controls."]],"question":"Why should emergency access not be a permanently shared administrator account?","answer":"It hides who acted, widens exposure and makes review difficult. A proposed emergency process needs named responsibility and limited authority.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"An emergency mode lets people act fast, but it must record who acted and be restored afterwards.","full":"<p>Security controls can obstruct urgent action. The chapter’s example is a compromised account: the right response is to remove the user’s access at once, but procedures that limit managers’ power to change permissions may make that impossible. One option is an <b>emergency mode<\/b> in which normal checks are relaxed; instead of forbidding operations, the system logs what was done and who was responsible, so the audit trail can show whether the actions were justified.<\/p><p>Sommerville notes that an emergency mode is itself a potential vulnerability, so organizations must weigh possible losses against the benefit. A permanently shared administrator account is the opposite of a good emergency mode: it hides who acted, widens exposure and makes review almost impossible. A defensible design names the people who may use it, bounds what they can do, records every action and restores normal controls afterwards.<\/p>","sourceStart":16,"notes":"Ask what the audit trail must contain for a later reviewer to judge an emergency action. Then connect to the AI slide: an assistant should never hold standing emergency privileges.","minutes":1.5,"tier":"core","concept":"emergency authority with an audit trail","answerKey":"named responsibility and limited authority","commonError":"Students propose a shared admin account for emergencies. Ask what a reviewer could judge afterwards: who acted, with what authority, for how long."},{"id":"X06","title":"Survivability analysis identifies softspots","fig":"ch14_survivability","sourceRange":"42–49","bullets":[["Understand","Review the mission, requirements and architecture."],["Identify","Locate critical services and their supporting components."],["Simulate","Describe attacks and the components they could compromise."],["Analyze","Find essential-and-compromisable softspots; plan recognition, resistance and recovery."]],"question":"What is a softspot in this method?","answer":"A component that is both essential to a critical service and vulnerable in the considered attack scenario. It is a priority for survivability treatment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/34af5f8485dd7c6e.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Survivability analysis looks for softspots: components that are both essential and open to attack.","full":"<p>Resilient design starts by identifying the critical services and assets that let a system fulfill its primary purpose—in an ambulance dispatch system, taking calls and dispatching ambulances—and then designing components that support recognition, resistance, recovery and reinstatement, such as a watchdog timer that detects when the system stops responding.<\/p><p><b>Survivable systems analysis<\/b> has four stages: understand the system’s mission, requirements and architecture; identify the critical services and the components they depend on; simulate attacks with scenarios that show which components they would affect; and analyze survivability. The analysis looks for <b>softspots<\/b>—components that are both essential and compromisable—and proposes strategies of resistance, recognition and recovery for them. Its weakness for business systems is that it starts from requirements and architecture, which often do not describe the real operational dependencies.<\/p>","sourceStart":42,"notes":"Ask the class to name the softspot in our story. The identity service is essential to the critical task and it is the component that failed; the absent specialist is a human softspot.","minutes":2,"tier":"core","concept":"softspots in survivability analysis","answerKey":"essential and vulnerable component","commonError":"Students name the backup server as the softspot. Ask which component the critical task cannot run without, and which one an attacker can reach. The absent specialist is a human softspot.","lists":[{"source":43,"title":"Resilient systems design","items":["Identify critical services and assets","Design components that support recognition, resistance, recovery and reinstatement"]},{"source":44,"title":"Survivable systems analysis · stages 1–2","items":["System understanding: review goals, requirements and architecture","Critical service identification: the services that must always be maintained"]},{"source":45,"title":"Survivable systems analysis · stages 3–4","items":["Attack simulation: scenarios and the components they would affect","Survivability analysis: find essential and compromisable components; plan resistance, recognition and recovery"]}]},{"id":"CHECK2","title":"Checkpoint · choose the recovery mechanism","fig":null,"sourceRange":"28–49","bullets":[["Think","Compare one shared backup with a separately controlled recovery path."],["Pair","Name a common cause, staffing constraint and restoration check."],["Record","Add the mechanism and its limitations to the same card."]],"question":"The second path restores from a copy synchronised after the bad records arrived. What does it still share with the first path?","answer":"The corrupted data. Synchronisation copied the bad records, so both paths would restore the same wrong state. The second path needs a copy from before the fault, checked for integrity.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"A second recovery path only helps if it does not share the first path’s failure.","full":"<p>Compare one shared backup with a separately controlled recovery path. The second path is an advantage only if it avoids the causes that defeated the first: the same compromised credentials, the same corrupted data, the same failed identity service or the same unavailable specialist. A good answer names the mechanism, the common cause it avoids, the staffing it needs and the check that shows restoration worked.<\/p>","sourceStart":28,"notes":"Ask each pair to name the fact that would defeat their chosen path. If none can, ask whether the new path signs in through the same identity service.","minutes":1,"tier":"core","concept":"independence of the recovery data","answerKey":"the corrupted data copied by synchronisation","commonError":"Pairs assume any second copy is independent. Ask when the copy was taken, and whether the bad records were already in it."},{"id":"R18","title":"Prioritize critical services—not every feature","fig":null,"sourceRange":"50–63","bullets":[["Business purpose","Define the service that must be maintained."],["Dependencies","Identify the technical and human assets needed to deliver it."],["Degraded mode","Specify what remains available and what is suspended."],["Acceptance","Verify usefulness and integrity, then plan full reinstatement."]],"question":"Why might reporting be deferred while an essential operational task is restored?","answer":"A limited degraded mode can preserve the primary purpose with fewer dependencies. The deferred function and the restoration conditions must stay explicit.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Protect the minimum critical service first, and decide in advance what can wait.","full":"<p>To maintain availability you need to know which services are most critical, the minimum quality of service that must be maintained, how those services could be compromised and protected, and how to recover quickly. Critical assets—hardware, software, data and people—are identified during this service analysis.<\/p><p>In the Mentcare example, the critical services are the information service that gives a patient’s current diagnosis and treatment plan, and the warning service that flags patients who may be a danger to themselves or others. Access to the complete patient record is <b>not<\/b> critical, because routine information is rarely needed during a consultation. That decision is what makes a bounded degraded mode possible: deferred functions and the conditions for restoring them must be stated explicitly.<\/p>","sourceStart":50,"notes":"Ask which function in our case could be deferred during recovery and who must accept that decision. Students often try to restore everything at once.","minutes":1.5,"tier":"core","concept":"degraded mode and deferral","answerKey":"defer reporting; keep the explicit restoration condition","commonError":"Students try to restore everything at once. Ask which function can wait during recovery and who must accept that decision."},{"id":"B01","title":"Architecture for service continuity","fig":"ch14_clientserver","sourceRange":"50–63","bullets":[["Redundancy","Retain the resources and data needed for recovery."],["Diversity","Reduce shared failures across alternate paths."],["Recovery access","Ensure users and operators can actually use the fallback."],["Testing","Exercise resistance, recovery and reinstatement separately."]],"question":"What is missing when a recovery diagram shows only two servers?","answer":"Data state, access paths, detection, transfer, operator authority and the conditions that show the critical service is usable.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6e0ebc9195f92ac2.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"A continuity architecture needs usable fallbacks, and each recovery activity must be tested.","full":"<p>For the Mentcare system, the chapter maps each resilience activity to design choices. Normal operation depends on the patient-record database, the database server, the network, local clients and the clinicians themselves. Resilience strategies include keeping summary patient records on local clients, so that consultations can continue if the server or network is unavailable; a watchdog timer on each client that detects when the server stops responding; a backup server that takes regular snapshots and can take over; and integrity checking that restores corrupted data from backups and a transaction log.<\/p><p>Redundancy only helps if users and operators can actually use the fallback: someone must have the access, the authority and the procedure. Resistance, recovery and reinstatement should each be exercised in a rehearsal. A diagram that shows two servers says nothing about data state, access paths, detection, transfer, operator authority or the check that proves the critical service works.<\/p>","sourceStart":50,"notes":"Ask what is missing from a two-server diagram and write the answers around it. The list becomes the recovery plan the assignment asks for.","minutes":1.5,"tier":"core","concept":"continuity architecture","answerKey":"data state, access paths, detection, transfer, authority and usability checks","commonError":"Students think two servers on a diagram are a recovery plan. Write around the diagram what is missing: data state, access, detection, authority."},{"id":"R09","title":"Continuity must not erase confidentiality","fig":"ch14_mentcare","sourceRange":"50–63","bullets":[["Fallback risk","Copies and alternate access paths can expose sensitive data."],["Integrity","Prevent conflicting or lost changes during degraded operation."],["Reconciliation","Define how fallback records return to the authoritative system."],["Ownership","Name who accepts restricted service and checks reinstatement."]],"question":"Why does a paper fallback need more than a printer?","answer":"It needs access control, secure handling, version/state identification and a reconciliation procedure. The service can continue while these risks remain unresolved.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c2229a1d4226e9e6.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"A fallback must still protect confidentiality and integrity, and must be reconciled afterwards.","full":"<p>Degraded operation creates new risks. Local copies, paper records and alternate access paths keep a service running, but they can expose sensitive information, so they need access control; the security chapter suggests encrypting local copies. Changes made during degraded operation can conflict with the authoritative records or be lost, so each fallback needs a way to identify the version and state of the information and a reconciliation procedure that returns it to the main system.<\/p><p>These trade-offs need an owner. Someone must accept the restricted service, decide what is suspended, and check that reinstatement has restored both the data and the normal controls. A paper fallback therefore needs more than a printer: it needs secure handling, version identification and a defined path back.<\/p>","sourceStart":50,"notes":"Ask what could go wrong with a paper list of patients during an outage. Push for confidentiality, conflicting updates and who reconciles them afterwards.","minutes":1.5,"tier":"optional","concept":"confidentiality during fallback","answerKey":"access control, secure handling and reconciliation for the paper fallback","commonError":"Students see a paper fallback as risk-free. Push for confidentiality, conflicting updates and who reconciles them afterwards."},{"id":"AISYS","title":"02:00, no assistant: walk the timeline","phase":"LEARN","skin":"genai","banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · WALK THE TIMELINE","caption":"An assistant can stand in for missing knowledge—until it fails with everything else."},"takeaway":"Plan the recovery for the night the assistant is gone too.","fullTable":false,"bullets":[["Name the dependency","What does each step need?"],["Remove the assistant","Which step then fails?"],["Show the rehearsal","What record proves it worked?"]],"question":"Complete 02:20. What must your plan already contain so the critical task can be restored without the assistant?","answer":"A rehearsal record in which recovery succeeded with the assistant unavailable. Before that rehearsal can pass, the plan needs a versioned offline runbook that has been exercised. It needs a second cross-trained person and a defined degraded mode. It needs integrity checks and reconciliation for fallback data. It needs an emergency access route with named, limited and audited authority. The assistant can help when it is up. It must not sit on the critical path or hold standing emergency credentials. This is one defensible answer; others can be defensible if their dependencies and limits are explicit.","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source methods to an AI component","notes":"Allow about 6 minutes. Format: timeline. Read the three timestamps aloud, then give pairs 2 minutes to write the 02:20 step. New terms, at most two: deskilling and automation bias. Everything else in Full explanation is optional depth and is not assessed.","full":"<p>This slide is course-added. It walks one night of the opening case with the AI recovery assistant unavailable.<\/p><h3>How the slide uses the five objectives<\/h3><p>The four Rs: the assistant may speed recognition, but recovery must work without it. Dependencies: its sign-on, hosting and data are dependencies like any other. Swiss Cheese: trained on the organisation’s runbooks, its gaps are likely to line up with theirs. Survivability: if it is essential to recovery and can be lost or compromised, it is a softspot. Degraded service: its use in a fallback must not expose data or grant it emergency power.<\/p><p><b>Automation bias.<\/b> Under pressure, people tend to follow fluent, confident instructions without checking them against the current system state—for example, steps that assume the primary copy is usable.<\/p><p><b>Deskilling.<\/b> When a tool handles routine cases, people practise less, so their skill is weakest in the unusual situation where the tool fails. Classic work on the ironies of automation describes this pattern; it extends the source’s trade-off between automation and human flexibility.<\/p><p><b>Emergency authority.<\/b> An assistant, or an AI agent able to act, should not hold standing emergency privileges. The source’s rule applies: named responsibility, bounded scope, an audit trail and restoration of normal controls.<\/p><p class=\"small\">The case is course-created. Optional further reading: Bainbridge, L. (1983), <i>Ironies of Automation<\/i>, Automatica.<\/p>","sourceStart":1,"flow":true,"nodes":[["02:00 · Identity fails; no one can sign in",""],["02:10 · Assistant unreachable; specialist off shift",""],["02:20 · Your plan: what happens next?",""]],"minutes":3,"tier":"core","concept":"recovery without the assistant","answerKey":"a rehearsal in which recovery succeeded without the assistant","commonError":"Students let the assistant hold standing emergency credentials. It must not sit on the critical path; plan for the night it is down too.","added":true},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Another copy is not another path.","bullets":[["New information","The alternate copy and the AI assistant both need the failed identity service."],["Reassess","The recovery claim assumed an independent path."],["Revise","Restore identity through an audited emergency route first."],["Own","Name who holds emergency authority and informs users."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. Take the assistant off the critical path. Restore identity through an independent, audited emergency route. Tell the users of the critical service what is degraded and for how long.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The alternate data copy is available, but it depends on the same unavailable identity service.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Accept revisions that restore identity through an independent, audited route and take the assistant off the critical path. Ask who must tell the users of the critical service what is degraded and for how long.","minutes":1,"tier":"core","concept":"revising under new evidence","answerKey":"take the assistant off the critical path","commonError":"Students keep the assistant in the plan and add a backup copy. Ask who tells the users of the critical service what is degraded and for how long.","twist":true,"added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1,"minutes":2,"tier":"core"}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What has recovered, and what must still be restored?","pair":"Name one assumption and one given fact you need to support your answer.","write":"Write your claim and its evidence. Mark any test you only propose as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given facts. Ask which missing fact would change your claim. Decide whether the AI assistant can stand in for the absent specialist.","answer":"An answer with limits separates the given facts from the needed evidence. A source explanation supports a mechanism. It does not prove the fictional deployment passed a test. The assistant can suggest steps. It has no authority, has never been rehearsed and cannot verify that the critical task works for users. It does not replace a trained, authorised person.","no":1,"at":"CHECK1","seconds":210,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same card; nobody is marked on field length or a timer.","ai":["think"],"minutes":3.5,"tier":"core","concept":"what has recovered","answerKey":"nothing has recovered until an authorized user completes the task","rubric":{"criteria":[{"name":"Names the mechanism","levels":[[2,"Strong","Names the chapter mechanism that decides the case and says how it applies."],[1,"Partial","Names a mechanism but does not connect it to the case facts."],[0,"Missing","No chapter mechanism, or the wrong one."]]},{"name":"Uses only the given facts","levels":[[2,"Strong","Every statement rests on a given fact or is marked as an assumption."],[1,"Partial","Mostly given facts, but one invented or unmarked assumption."],[0,"Missing","Relies on facts the case does not give."]]},{"name":"Evidence another person can check","levels":[[2,"Strong","Names evidence a second engineer could inspect, and marks proposed tests as proposed."],[1,"Partial","Names evidence, but it is vague or its status is unclear."],[0,"Missing","Opinion or confidence instead of evidence."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"Recovered: the backup server process. Not recovered: the critical service, because no authorized user can sign in. Still needed: identity restored by someone with authority, then a user completing the task on checked data; both proposed.","why":"Judges recovery at the user boundary, uses only the given facts and names a checkable test."},"weak":{"text":"The service has recovered because the backup is up and the chatbot knows the runbook.","why":"Confuses a running process with a recovered service; treats the assistant as authority."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":true},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms: a separately controlled recovery path, or following the AI assistant's recovery steps. Which one would you choose?","pair":"Ask your partner to argue for the mechanism you rejected. Name one trade-off and one thing both mechanisms share.","write":"Write why your mechanism supports your claim, and what you are still unsure of.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism affects your claim. Then name a shared cause, a mismatch or a limit outside its evidence.","answer":"Tie the chosen mechanism to the required property. Say what the alternative improves or sacrifices. A shared dependency or a mismatched assumption can defeat a design that looks stronger. An assistant trained on the same runbooks shares their assumptions, so its holes line up with the plan's. That is the Swiss Cheese warning. A separately controlled path, rehearsed without the assistant, is more likely to fail for different reasons.","no":2,"at":"CHECK2","seconds":180,"ai":["think"],"minutes":3,"tier":"core","concept":"independent recovery path","answerKey":"the assistant shares the runbooks' assumptions","rubric":{"criteria":[{"name":"Links the mechanism to the property","levels":[[2,"Strong","Explains how the chosen mechanism affects the property at stake."],[1,"Partial","Names the mechanism without the link to the property."],[0,"Missing","No mechanism, or no property."]]},{"name":"Names a shared cause or limit","levels":[[2,"Strong","Names a specific shared cause, mismatch or limit that could defeat the mechanism."],[1,"Partial","Mentions a limit in general terms only."],[0,"Missing","Treats the mechanism as always enough."]]},{"name":"States the trade-off","levels":[[2,"Strong","Says what the alternative improves and what it costs."],[1,"Partial","Gives one side of the trade-off only."],[0,"Missing","No comparison with the alternative."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"A separately controlled, rehearsed recovery path, because it fails for different reasons than the primary plan. Its limit: it helps only if it was rehearsed without the assistant. It costs rehearsal time and a second trained person.","why":"Links the mechanism to continuity, names the shared runbook assumptions as the limit, states the cost."},"weak":{"text":"Follow the assistant; it is faster and knows every runbook.","why":"No link to the property, ignores that the assistant shares the runbooks' assumptions, no trade-off."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false},{"title":"Change the constraint; revise and own","think":"The alternate data copy is available, but it depends on the same unavailable identity service. Staff sign in to the AI recovery assistant through that service too, and its instructions assume the primary copy. Does your first decision still hold?","pair":"Explain what changes in your claim, your evidence or its scope.","write":"Record the new evidence and your revised decision with its limits. Say plainly what your first card got wrong. Name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your first answer. Name the changed assumption, the next evidence and the condition that would change your decision.","answer":"The new fact changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The copy cannot be used until someone can sign in. So restore identity first, through the audited emergency route, then the copy. The assistant signs in through the same service, so it cannot lead this step.","note":"Classroom version only. The assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"APPLY","seconds":180,"ai":["think"],"minutes":3,"tier":"core","concept":"dependency order in recovery","answerKey":"restore identity through the audited emergency route before using the copy","rubric":{"criteria":[{"name":"Says what the new fact changes","levels":[[2,"Strong","Names the assumption the new fact breaks and what it leaves intact."],[1,"Partial","Notes the new fact without saying which assumption it breaks."],[0,"Missing","Ignores or restates the new fact."]]},{"name":"Revises with a reason","levels":[[2,"Strong","Keeps, changes or replaces the decision for a reason from the new fact. Says what the first answer got wrong."],[1,"Partial","Changes the decision without a clear reason, or hides the first answer."],[0,"Missing","Repeats the first answer unchanged."]]},{"name":"Names the owner and who is told","levels":[[2,"Strong","Names the role that decides and the people who must be informed."],[1,"Partial","Names one of the two."],[0,"Missing","Names neither the owner nor who is told."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"My first card assumed the alternate copy was an independent path; it shares the identity service. Revise: restore identity through the audited emergency route first, then the copy. The on-call manager decides; ward staff are told what is degraded now.","why":"Names the broken assumption, revises with a reason, admits the first error, names owner and audience."},"weak":{"text":"Keep my plan and ask the assistant for the identity-reset steps.","why":"Ignores that the assistant also needs the failed service; names nobody."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X06"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X06","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Sociotechnical and organizational resilience","range":"18–23"},{"title":"Survivability analysis","range":"42–45"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Resilience, cybersecurity and planning","start":3,"end":17,"units":["X01","X02","X02A","CHECK1","EMERGENCY"]},{"title":"Sociotechnical and organizational resilience","start":18,"end":27,"units":["X03","CHECK1"]},{"title":"Defensive layers and operational processes","start":28,"end":41,"units":["X04","X05","D14","CHECK2"]},{"title":"Survivability analysis","start":42,"end":49,"units":["X06","CHECK2"]},{"title":"Critical service and resilient architecture","start":50,"end":63,"units":["X02A","R18","B01","R09"]}],"sourceCount":63,"original":"sources/Ch14-Original.pptx","textbook":"sources/Ch14-Textbook.pdf","bookPages":27,"quiz":[{"q":"Returning all services to normal operation in a controlled way after recovery is called:","options":["Recognition","Reinstatement","Resistance"],"answer":1,"why":"Recovery restores critical services first; reinstatement restores all services and normal operation.","concept":"reinstatement","answerKey":"reinstatement restores all services"},{"q":"Which of these is an organizational dependency for recovery?","options":["The authority and trained staff needed to activate a fallback","The disk controller in the backup server","The packet format used by the network"],"answer":0,"why":"People, authority, coordination and training affect whether a technical fallback can actually be used.","concept":"organizational dependency","answerKey":"authority and trained staff for the fallback","beyondCase":true},{"q":"What does Reason’s Swiss cheese model warn about?","options":["Every added layer blocks every failure it is designed for","Layers that look independent always fail independently","Weaknesses in several defensive layers can line up"],"answer":2,"why":"Accidents occur when the holes in several defensive layers align; diverse layers make that less likely.","concept":"Swiss cheese model","answerKey":"weaknesses in layers can line up","beyondCase":true},{"q":"Survivable systems analysis starts by:","options":["Understanding the system’s mission, requirements and architecture","Buying a second copy of every server","Simulating as many attacks as possible"],"answer":0,"why":"You must understand the system and its critical services before simulating attacks and finding softspots.","concept":"survivable systems analysis stages","answerKey":"start with mission, requirements and architecture","beyondCase":true},{"q":"A paper fallback keeps a service running. What else must be planned?","options":["Nothing, because the service is available again","Confidentiality, integrity and later reconciliation","Only the printing and storage of the paper forms"],"answer":1,"why":"Degraded operation must still protect information and must return changes to the authoritative system.","concept":"paper fallback risks","answerKey":"confidentiality, integrity and later reconciliation"}],"alignment":[{"objective":"Explain recognition, resistance, recovery and reinstatement.","evidence":"Explain and demonstrate: Explain recognition, resistance, recovery and reinstatement.","field":"FIT"},{"objective":"Identify organizational and technical dependencies.","evidence":"Explain and demonstrate: Identify organizational and technical dependencies.","field":"RECOVER"},{"objective":"Interpret the Swiss Cheese model without assuming independence.","evidence":"Explain and demonstrate: Interpret the Swiss Cheese model without assuming independence.","field":"transfer question + BOUND"},{"objective":"Perform the stages of survivability analysis.","evidence":"Explain and demonstrate: Perform the stages of survivability analysis.","field":"RECOVER + source application"},{"objective":"Trade off degraded service against confidentiality and integrity.","evidence":"Explain and demonstrate: Trade off degraded service against confidentiality and integrity.","field":"REFIT + EVIDENCE"}],"artifact":"Build a critical-service → dependency → degraded-mode → recovery/reinstatement check.","bridge":"Build a critical-service → dependency → degraded-mode → recovery/reinstatement check. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"X06","workload":"Consider specialist absence, simultaneous alarms and the transfer of authority during recovery.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","RECOVERYPLAN":"X02A"},"roadmap":{"question":"How can critical services continue through disruption?","connection":"Critical services set priorities; the four Rs organize the response; people, defenses and survivability analysis make recovery usable.","inClass":"Identify dependencies; compare degraded and recovered service.","deliverable":"A critical-service recovery and reinstatement plan.","success":"Explain what service users regain, not only which server restarts.","branches":[{"verb":"Choose what must continue","label":"Critical services","detail":"Resilience vs reliability · continuity priorities","target":"X01","units":["X01","R18"],"caseLens":"Which critical service is actually unavailable even though the backup server is running?"},{"verb":"Organize the response","label":"The four Rs","detail":"Recognition · resistance · recovery · reinstatement","target":"X02","units":["X02"],"caseLens":"Where are we in recognition → resistance → recovery → reinstatement?"},{"verb":"Protect organizational assets","label":"Cybersecurity","detail":"Assets · threats · cyber-resilience planning","target":"X02A","units":["X02A","R09"],"caseLens":"Which shared identity dependency creates a cyber-resilience soft spot?"},{"verb":"Enable people to adapt","label":"Sociotechnical resilience","detail":"Operators · layered defenses · emergency authority","target":"X03","units":["X03","CHECK1","X04","X05","D14","EMERGENCY"],"caseLens":"What can operators do when normal procedures are insufficient?"},{"verb":"Design and check continuity","label":"Resilient systems design","detail":"Survivability analysis · softspots · recovery design","target":"X06","units":["X06","CHECK2","B01","AISYS","APPLY"],"caseLens":"What architecture and recovery evidence restores usable service, not just servers?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"02:00. Systems down. The AI that knows the runbook is down too.","aiAssignment":{"title":"The after-hours bank chatbot","scenario":"A bank uses an AI chatbot as its only customer channel after hours. It answers from a retrieved knowledge base of fees, card blocking and branch procedures. Management asks for a resilience plan for the chatbot service.","facts":["The chatbot is hosted by a vendor; the knowledge base is hosted by the bank.","Card blocking through the chatbot calls the bank’s core system.","Staff have never practised serving customers without the chatbot."],"question":"Which critical service must survive, and what must the plan contain to recognise, resist, recover and reinstate it?","stress":"Ransomware encrypts the knowledge base. The only clean backup is three weeks old. The restored chatbot now states outdated fees and an old card-blocking number with full confidence.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition, something you would see, that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage).","rubric":{"criteria":[{"name":"FIT","levels":[[1,"Strong","Names the chapter concept that decides the case and shows why it fits these facts."],[0.75,"Adequate","Names the right concept, with only a partial link to the facts."],[0.5,"Developing","Names a concept but does not connect it to the case."],[0,"Missing","No chapter concept, or the wrong one."]]},{"name":"BOUND","levels":[[1,"Strong","States an observable condition that would end the claim."],[0.75,"Adequate","Names a condition, but nobody could easily observe it."],[0.5,"Developing","Gives a vague limit, such as “if it fails”."],[0,"Missing","Gives no limit."]]},{"name":"ACT + EVIDENCE","levels":[[1,"Strong","One concrete action with an owner, and evidence another engineer could inspect even if the AI is wrong."],[0.75,"Adequate","A concrete action, but the evidence is weak or its status is unclear."],[0.5,"Developing","General advice, or evidence that relies on the AI's own output."],[0,"Missing","No action and no evidence."]]},{"name":"REFIT","levels":[[1,"Strong","Uses the new information, names the assumption it broke and justifies retain, revise or replace."],[0.75,"Adequate","Uses the new information but does not name the broken assumption."],[0.5,"Developing","Keeps or changes the answer without a reason."],[0,"Missing","Ignores the new information."]]},{"name":"OWNER + AI USE","levels":[[1,"Strong","Names the role that accepts the risk and who must be told. Declares any AI help and how it was checked."],[0.75,"Adequate","Names a role, but not who must be told, or the AI declaration is incomplete."],[0.5,"Developing","Names “the team” or “the system” as owner."],[0,"Missing","No owner and no AI declaration."]]}],"marks":"Practice only · not graded · score yourself 1, 0.75, 0.5 or 0 per criterion","strong":{"text":"Critical service: card blocking after hours. The plan must work without the chatbot: a staffed phone line and an offline procedure. The claim ends if the knowledge base cannot be restored to a checked version. Action: the operations lead rehearses a night without the chatbot. Evidence: the rehearsal record, proposed. After the ransomware I revise: a three-week-old backup gives wrong fees, so answers stay offline until checked.","why":"Names the critical service and covers recovery without the AI. Gives an observable limit and an owner, and revises for stale data."},"weak":{"text":"Resilience means having a backup of the chatbot, so the plan is to restore it quickly.","why":"Equates a backup with resilience; ignores the critical service, stale data and who acts."},"other":"they use a chapter concept, rest on the given facts and name evidence someone else can check. A different verdict that meets these conditions is as strong as the strong example."}},"cs2023":[["SE-Reliability","Software Reliability","Fault tolerance and identifying single-point-of-failure dependencies."],["SEC","Security","Cyber-resilience: recognising, resisting and recovering from attacks."],["SE-Tools","Tools and Environments","Release and configuration management for recovery and reinstatement."],["SEP","Society, Ethics, and the Profession","Accountable emergency authority and informing affected users."]],"lectureMinutes":50,"budgetShare":0.85,"timeRule":"If the lecture runs over time, drop optional slides first, in reverse order, then the optional extras. Never drop a think point (checkpoint, station or Your call) and never drop the assumption-change slide. Station and vote minutes are separate from slide minutes: a checkpoint slide keeps 1 minute to show its question, and its station adds 3 minutes. Say which optional slide was dropped and point students to its full explanation.","glossary":[{"term":"claim","short":"a statement you say is true and can defend with evidence","ar":"ادعاء"},{"term":"resilience","short":"the ability to keep critical services going through disruption and to recover","ar":"المرونة"},{"term":"critical service","short":"the service the system exists to deliver; it must survive a disruption","ar":"الخدمة الحرجة"},{"term":"recognition","short":"noticing that an attack or failure is happening","ar":"التعرف"},{"term":"resistance","short":"containing the attack or failure so that critical services continue","ar":"المقاومة"},{"term":"recovery","short":"restoring the critical services first","ar":"الاستعادة"},{"term":"reinstatement","short":"restoring all services and normal operation in a controlled way","ar":"الإعادة الكاملة"},{"term":"softspot","short":"a component that is essential to a critical service and can be attacked","ar":"نقطة ضعف"},{"term":"degraded mode","short":"a reduced service that keeps the main purpose while other functions wait","ar":"وضع التشغيل المتدهور"},{"term":"common cause","short":"one shared cause that can make two defences fail together","ar":"سبب مشترك"},{"term":"runbook","short":"the written step-by-step recovery procedure","ar":"دليل إجراءات الاستعادة"},{"term":"reconciliation","short":"bringing records made during the outage back into the main system without loss or conflict","ar":"مطابقة السجلات"}],"transfer":{"title":"Transfer case · the textbook ambulance dispatch system","text":"In the textbook's ambulance dispatch system, the critical services are taking calls and dispatching ambulances. A watchdog timer detects when the system stops responding to events and restarts it. This is a different system from the hospital case.","source":"Source slide 43 (resilient systems design example)","fictional":false,"question":"Which of the four resilience activities does the watchdog timer support?","answer":"Recognition: the timer notices that the system has stopped responding. A restart starts recovery, but it does not restore calls lost meanwhile or check that dispatch data is intact. Those need their own evidence.","concept":"the four Rs applied to a mechanism","answerKey":"recognition by the watchdog timer","at":"X02","vote":{"q":"Textbook ambulance dispatch: a watchdog timer restarts the system when it stops responding. Which resilience activity does the timer support?","options":["Recognition: it notices that the system has stopped responding","Reinstatement: it restores every service and normal operation","Resistance: it prevents the failure from happening"],"answer":0,"why":"The timer detects that the system stopped responding. The restart begins recovery, but it does not restore lost calls or check dispatch data."}},"studyList":[{"topic":"Cybersecurity failure factors, threats and example controls","sources":[10,11,12,13,14],"book":{"page":5,"label":"14.1"},"note":"Four failure factors, three threat types and the control examples; redundancy and diversity for cyber-resilience."},{"topic":"The Mentcare resilience example: organisational policies instead of harder authentication","sources":[20],"book":{"page":9,"label":"14.2"},"note":"Why a sociotechnical response can beat a technical one."},{"topic":"Characteristics of resilient organisations","sources":[23,24,25],"book":{"page":9,"label":"14.2"},"note":"Hollnagel's four characteristics: respond, monitor, anticipate, learn."},{"topic":"Human error, the person and systems approaches, and ways to increase system resilience","sources":[26,27,32],"book":{"page":11,"label":"14.2.1"},"note":"Be able to contrast the two approaches and list the resilience measures."},{"topic":"Operational and management processes, process design, information provision and automation","sources":[33,34,35,36,38,39,40,41],"book":{"page":14,"label":"14.2.2"},"note":"Personal versus enterprise processes; the disadvantages of automation."},{"topic":"Problems for business systems and the streams of work in resilience engineering","sources":[47,49],"book":{"page":17,"label":"14.3"},"note":"Why survivability analysis is hard for business systems."},{"topic":"The Mentcare worked example: critical services, assets, adverse events, recognition and resistance strategies, architecture","sources":[51,53,54,55,56,58,59,60],"book":{"page":17,"label":"14.3"},"note":"Exam questions can ask you to apply the four Rs to the Mentcare tables."}],"activities":[{"id":"VOTE2","label":"Class vote · Act 2","at":"X02","minutes":3,"tier":"core"},{"id":"VOTE4","label":"Class vote · Act 4","at":"EMERGENCY","minutes":3,"tier":"core"},{"id":"EXTRAS","label":"Optional extras · real case, live lab and explain-it","at":"APPLY","minutes":7,"tier":"optional"}],"coverage":[{"cls":"no","reason":"Title slide of the source pack","n":1,"title":"Chapter 14 – Resilience Engineering"},{"cls":"no","reason":"Agenda slide; its topics are the chapter map","n":2,"title":"Topics covered"},{"cls":"full","unit":"X01","n"  may be to introduce organizational policies and procedures that emphasise the importance of not sharing login credentials and that tell users about easy ways to create and maintain strong passwords."],"n":20,"title":"Mentcare example"},{"cls":"slide","unit":"X03","kind":"figure","n":21,"title":"Nested technical and sociotechnical systems"},{"cls":"full","unit":"X03","kind":"prose","items":["A failure in system S1 may be trapped in the broader sociotechnical system ST1 through operator actions","Organizational damage is therefore limited","If the failure in S1 leads to a failure in ST1, then it is up to managers in the broader organization to deal with that failure."],"n":22,"title":"Failure hierarchy"},{"cls":"slide","unit":"X03","kind":"figure","n":23,"title":"Characteristics of resilient organizations"},{"cls":"slide","unit":"X03","n":24,"title":"Organizational resilience"},{"cls":"slide","unit":"X03","n":25,"title":"Organizational resilience"},{"cls":"full","reason":"TODO","unit":"D14","n":26,"title":"Human error"},{"cls":"full","unit":"X03","n":27,"title":"Systems approach"},{"cls":"slide","unit":"X04","n":28,"title":"Defensive layers"},{"cls":"full","unit":"X04","n":29,"title":"Defensive layers"},{"cls":"full","unit":"X04","n":30,"title":"Reason’s Swiss Cheese Model"},{"cls":"full","unit":"X04","n":31,"title":"Swiss Cheese model"},{"cls":"full","unit":"X04","n":32,"title":"Increasing system resilience"},{"cls":"full","reason":"TODO","unit":"X05","n":33,"title":"Operational and management processes"},{"cls":"full","unit":"X05","n":34,"title":"Operational processes"},{"cls":"full","unit":"X05","n":35,"title":"Personal and Enterprise IT processes"},{"cls":"full","unit":"X05","n":36,"title":"Process design"},{"cls":"slide","unit":"X05","n":37,"title":"Efficiency and resilience"},{"cls":"full","reason":"TODO","unit":"X05","n":38,"title":"Coping with failures"},{"cls":"full","reason":"TODO","unit":"X05","n":39,"title":"Information provision and management"},{"cls":"
