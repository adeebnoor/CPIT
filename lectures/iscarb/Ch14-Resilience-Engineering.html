</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261002-stage-v4"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 14</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch14-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":14,"title":"Resilience Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch14-Resilience-Engineering.html","assignment":5,"points":5,"objectives":["Explain recognition, resistance, recovery and reinstatement.","Identify organizational and technical dependencies.","Interpret the Swiss Cheese model without assuming independence.","Perform the stages of survivability analysis.","Trade off degraded service against confidentiality and integrity."],"sections":["14.1 Cybersecurity","14.2 Sociotechnical resilience","14.3 Resilient systems design"],"case":{"headline":"The backup is running. The service still cannot be used.","text":"After a fictional disruption, a backup server starts but authorized staff cannot complete the critical task because the access service is unavailable. The only trained recovery specialist is off shift.","question":"What has recovered, and what must still be restored?","mutation":"The alternate data copy is available, but it depends on the same unavailable identity service. Staff also sign in to the AI recovery assistant through that identity service, and its instructions assume the primary copy.","lens":"With the specialist off shift, staff turn to the organisation’s AI recovery assistant: a vendor-hosted chatbot trained on past runbooks that gives confident, step-by-step instructions. It has never been used in a recovery rehearsal. Hold that question: after the design slides, one slide shows how this chapter’s methods apply to the assistant."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Resilience Engineering","phase":"START","takeaway":"Resilience Engineering","full":"<p>Resilience Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Resilience starts where prevention is not enough","fig":null,"sourceRange":"3–9","bullets":[["Critical service","Identify what must continue despite disruption."],["Changed assumptions","Prepare for conditions not covered by normal operation."],["Sociotechnical","People, processes and technical systems contribute to recovery."],["Boundary","The source treats resilience as an expert judgment, not a single universal score."]],"question":"Why is a running backup not necessarily a recovered service?","answer":"Users may still lack access, trustworthy data, trained operators or a working process. Recovery is judged against the critical service.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Resilience is judged by whether critical services continue through disruption.","full":"<p>Sommerville defines resilience as a judgment of how well a system can maintain the continuity of its <b>critical services<\/b> in the presence of <b>disruptive events<\/b> such as equipment failure and cyberattacks. Critical services are those whose failure could have serious human, social or economic effects. There are no resilience metrics: resilience cannot be measured and can only be assessed by experts who examine the system and its operational processes.<\/p><p>Resilience engineering starts from two assumptions. Failures cannot be avoided entirely, so the aim is to limit their cost and recover from them. And good reliability engineering has already reduced technical faults, so more attention goes to failures caused by external events such as operator errors and cyberattacks. This is why a running backup server is not the same as a recovered service: the question is whether people can actually complete the critical task.<\/p>","sourceStart":3,"notes":"Start from the story: the server is up, but staff cannot work. Ask the class to define the critical service in one sentence before any mechanism is discussed. Students often equate resilience with redundancy; the definition is about service continuity."},{"id":"X02","title":"Recognition → resistance → recovery → reinstatement","fig":"ch14_resactivities","sourceRange":"3–9","bullets":[["Recognition","Detect symptoms of failure or attack."],["Resistance","Contain problems or repel an attack; service may be restricted."],["Recovery","Restore the critical services first."],["Reinstatement","Restore all services and normal operation in a controlled way."]],"question":"Which activity is complete when only the essential records are available?","answer":"Critical-service recovery may be achieved if its conditions are met. Full reinstatement is not complete while other services remain restricted.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/16a0f6456c570849.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Recognition, resistance, recovery and reinstatement are four different jobs with four different checks.","full":"<p>The chapter describes four related resilience activities:<\/p><ul><li><b>Recognition<\/b>: the system or its operators recognize the symptoms of a failure or an attack.<\/li><li><b>Resistance<\/b>: the system resists or contains the problem, for example by isolating critical parts, even if some services must be restricted.<\/li><li><b>Recovery<\/b>: critical services are restored quickly so that users can continue their essential work.<\/li><li><b>Reinstatement<\/b>: all services are restored and normal operation resumes in a controlled way.<\/li><\/ul><p>Each activity needs its own evidence. Having only the essential records available may satisfy recovery of a critical service, but reinstatement is not complete while other services remain restricted or while data changed during the disruption has not been reconciled.<\/p>","sourceStart":3,"notes":"Put the four words on the board and ask where our story is now. Most will say recovery; press them that recovery is not achieved while staff cannot sign in. Keep recovery and reinstatement apart—students merge them."},{"id":"X02A","title":"Cyber-resilience planning","fig":"ch14_cyberplan","sourceRange":"10–17; 50–63","bullets":[["Classify assets","Distinguish critical, important and useful assets."],["Recognize and resist","Define detection, then the technical and operational actions that contain the threat."],["Recover and reinstate","Trustworthy copies for critical services first; then all assets, in a controlled way."],["Test and update","Exercise the strategy and revise it as assets, threats and operations change."]],"question":"(1) Which evidence distinguishes “we have backups” from “we can recover”? (2) Why must asset classification precede buying another security tool?","answer":"(1) An executed recovery record for a stated system version and dataset, with access, integrity and service checks. A backup inventory alone is insufficient. (2) The required service and consequences determine priorities. A tool does not by itself identify what must survive or which loss matters most.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/ch14-cyberplan-combined.jpg","caption":"Sommerville Ch.14 · both preserved source illustrations · select to enlarge","takeaway":"Cyber-resilience planning classifies assets first, then plans the four Rs for each.","full":"<p>Cybersecurity is broader than system security engineering: it concerns the protection of citizens, businesses and infrastructure from threats arising from their use of computers and networks. The chapter lists common contributors to failure—organizational ignorance of the problem, poor design and lax procedures, human carelessness and poor trade-offs between usability and security—and threats to the confidentiality, integrity and availability of assets.<\/p><p>Cyber-resilience planning then proceeds in steps. <b>Classify assets<\/b> (hardware, software and people) as critical, important or useful. <b>Identify threats<\/b> to the critical and important assets. For each threat, plan <b>recognition<\/b> and <b>resistance<\/b>, which may be technical or operational. Plan <b>recovery<\/b> of each critical asset and <b>reinstatement<\/b> of all assets. Finally, <b>test<\/b> the plan and update it as assets and threats change. Classification comes first because it decides what must survive; a new security tool cannot make that decision.<\/p>","sourceStart":10,"notes":"Ask what distinguishes “we have backups” from “we can recover”: an executed, recorded recovery of a stated version and dataset. Then ask which of our case’s assets is critical; the identity service usually surprises students."},{"id":"X03","title":"Resilience exists across organizational layers","fig":"ch14_nested","sourceRange":"18–27","bullets":[["Operators","May contain a technical failure before it becomes a service failure."],["Managers","Coordinate when local recovery is insufficient."],["Capabilities","Respond, monitor, anticipate and learn."],["Learning","Study successful adaptations as well as incidents."]],"question":"What becomes a system dependency when only one specialist can restore access?","answer":"That person’s availability, knowledge and authority. A resilient plan needs a realistic handover or alternative response.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/f082d48c0c892cff.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Resilience lives in the sociotechnical system: people and procedures can trap a technical failure.","full":"<p>To design a resilient system you have to think about the sociotechnical system, not only the software. Many adverse events are easier to deal with in the wider system. In the Mentcare example, attackers may use a legitimate user’s credentials. Stronger authentication irritates users and may even reduce security if people leave systems logged in, so organizational policies and education about credentials can be a better response.<\/p><p>Technical systems are nested inside sociotechnical systems. A failure in a technical system may be trapped by operators in the surrounding sociotechnical system, limiting organizational damage; if it is not, managers in the wider organization must deal with it. Resilient organizations show four characteristics: they can <b>respond<\/b> to events, <b>monitor<\/b> what is happening, <b>anticipate<\/b> future problems and <b>learn<\/b> from experience—including from successful recoveries, not only from incidents.<\/p>","sourceStart":18,"notes":"Ask what becomes a dependency when only one specialist can restore access: the person’s availability, knowledge and authority. This prepares the efficiency-versus-resilience slide."},{"id":"CHECK1","title":"Checkpoint · name the service boundary","fig":null,"sourceRange":"3–27","bullets":[["Think","A backup starts but authorized staff still cannot retrieve records."],["Pair","State which service has—and has not—recovered."],["Record","Define the claim and the evidence needed at the user boundary."]],"question":"Which acceptance check is more useful than “server process is running”?","answer":"A representative authorized user completes the specified critical task using data whose integrity is checked.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Judge recovery at the user boundary: can an authorized user complete the critical task?","full":"<p>“The backup server is running” describes a component. A useful acceptance check describes the service: a representative authorized user completes the critical task, with data whose integrity has been checked, within the time the service requires. In our case the server check passes but the user check fails, because the access service is unavailable. A bounded claim names what has recovered, what has not, and the evidence that would show the critical service is usable again.<\/p>","sourceStart":3,"notes":"Collect one claim per pair and ask which of them another engineer could verify during a rehearsal. Reward claims that name the user, the task and the integrity check."},{"id":"X04","title":"Defensive layers can fail together","fig":"ch14_swiss","sourceRange":"28–32","bullets":[["Barriers","Several defenses may block a path to harm."],["Weaknesses","Each layer has limitations that can align."],["Common causes","Shared credentials, assumptions or infrastructure can affect multiple layers."],["Systems approach","Investigate why defenses failed, not only who made the final error."]],"question":"Why is “add another identical backup” an incomplete response to compromised credentials?","answer":"The same credentials may expose both copies. The design must address the shared access path as well as redundancy.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/fd384ab70c090c88.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Defensive layers fail when their holes line up, so each layer must fail in a different way.","full":"<p>Redundancy and diversity create defensive layers, where each layer uses a different approach to deter attackers or trap technical and human failures. In air traffic control, for example, a conflict-alert system, formal recording procedures and collaborative checking between controllers all protect against the same mistakes.<\/p><p>Reason’s <b>Swiss cheese model<\/b> pictures each layer as a slice with holes—its vulnerabilities. The holes are dynamic: their size and position change with operating conditions. A system fails when holes in every layer line up. Resilience therefore improves when you reduce the chance of the triggering event, add layers, make the layers diverse so that their holes are in different places, and reduce latent conditions. A second identical backup that uses the same compromised credentials adds a slice with the same hole.<\/p>","sourceStart":28,"notes":"Draw three slices and ask the class to name the holes in our story: shared identity service, one specialist, runbook that assumes the primary copy. Then ask which slice is missing entirely."},{"id":"X05","title":"Efficiency and resilience can conflict","fig":null,"sourceRange":"33–41","bullets":[["Automation","Reduces routine work but can remove human flexibility."],["Specialization","Builds expertise but creates dependence on particular people."],["Information hiding","Protects data but can stop operators seeing a developing problem."],["Trade-off","Use consequences and plausible interventions to justify the balance."]],"question":"When might cross-training be preferable to maximum role specialization?","answer":"When the absence of one specialist prevents containment or recovery across interacting systems. The workload and training cost still need justification.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Efficient processes remove the slack that people use to cope with problems.","full":"<p>Operational and management processes are a defense in their own right, but designing them means balancing efficient operation against problem management. The chapter contrasts pairs of choices: process optimization and control versus flexibility; information hiding and security versus information sharing and visibility; automation with fewer operators versus manual processes with spare capacity; role specialization versus role sharing.<\/p><p>What looks inefficient is often what helps people cope. Air traffic controllers may print flight details as well as relying on the database, so they still have information if the database fails. A specialist-only role means that nobody else can act when the specialist is absent, while people who work across systems understand the dependencies between them. Use risk assessment to decide: for risks that are likely, or that could cause serious loss, favor resilience over efficiency.<\/p>","sourceStart":33,"notes":"Ask when cross-training beats specialization, using our off-shift specialist. Make the class state the risk that justifies the extra training cost rather than simply calling redundancy good."},{"id":"D14","title":"Give people a usable recovery process","fig":null,"sourceRange":"33–41","bullets":[["Person approach","Attributes errors primarily to the individual."],["Systems approach","Examines workload, training, design and failed safeguards."],["Handover","Make state, responsibility and escalation visible."],["Evidence","Rehearse recovery under realistic staffing conditions."]],"question":"What should follow an operator missing a warning during several simultaneous alarms?","answer":"Investigate interface, workload, prioritization, training and escalation as well as the action. Propose a checkable design/process improvement.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Treat operator error as a symptom of the system, and rehearse recovery under realistic conditions.","full":"<p>The chapter contrasts two views of human error. The <b>person approach<\/b> treats errors as the responsibility of the individual—carelessness or inattention—and responds with warnings, retraining or blame. The <b>systems approach<\/b> assumes that people are fallible and asks why the system’s defenses did not trap the error: workload, interface design, training and procedures. Sommerville argues for the systems approach.<\/p><p>A usable recovery process makes the current state, responsibility and escalation visible, so that a handover does not lose information. It should be defined and rehearsed with realistic staffing, including the case where the usual expert is unavailable. An operator who misses a warning during several simultaneous alarms points to a design and workload problem to investigate, not only to an individual to correct.<\/p>","sourceStart":33,"notes":"Use the missed-warning question to practise the systems approach. Accept an answer only if it proposes a checkable design or process change, such as alarm prioritization or a rehearsal with a second trained person."},{"id":"EMERGENCY","title":"Emergency authority needs an audit trail","fig":null,"sourceRange":"16–17","bullets":[["Tension","Restricting privilege may obstruct urgent containment."],["Emergency mode","The source describes exceptional actions with recorded responsibility."],["Risk","An emergency path can itself become a vulnerability."],["Boundary","Define authorized scope, review and restoration of normal controls."]],"question":"Why should emergency access not be a permanently shared administrator account?","answer":"It obscures who acted, broadens exposure and makes review difficult. A proposed emergency process needs named responsibility and bounded authority.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"An emergency mode lets people act fast, but it must record who acted and be restored afterwards.","full":"<p>Security controls can obstruct urgent action. The chapter’s example is a compromised account: the right response is to remove the user’s access at once, but procedures that limit managers’ power to change permissions may make that impossible. One option is an <b>emergency mode<\/b> in which normal checks are relaxed; instead of forbidding operations, the system logs what was done and who was responsible, so the audit trail can show whether the actions were justified.<\/p><p>Sommerville notes that an emergency mode is itself a potential vulnerability, so organizations must weigh possible losses against the benefit. A permanently shared administrator account is the opposite of a good emergency mode: it hides who acted, widens exposure and makes review almost impossible. A defensible design names the people who may use it, bounds what they can do, records every action and restores normal controls afterwards.<\/p>","sourceStart":16,"notes":"Ask what the audit trail must contain for a later reviewer to judge an emergency action. Then connect to the AI slide: an assistant should never hold standing emergency privileges."},{"id":"X06","title":"Survivability analysis identifies softspots","fig":"ch14_survivability","sourceRange":"42–49","bullets":[["Understand","Review the mission, requirements and architecture."],["Identify","Locate critical services and their supporting components."],["Simulate","Describe attacks and the components they could compromise."],["Analyze","Find essential-and-compromisable softspots; plan recognition, resistance and recovery."]],"question":"What is a softspot in this method?","answer":"A component that is both essential to a critical service and vulnerable in the considered attack scenario. It is a priority for survivability treatment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/34af5f8485dd7c6e.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Survivability analysis looks for softspots: components that are both essential and open to attack.","full":"<p>Resilient design starts by identifying the critical services and assets that let a system fulfill its primary purpose—in an ambulance dispatch system, taking calls and dispatching ambulances—and then designing components that support recognition, resistance, recovery and reinstatement, such as a watchdog timer that detects when the system stops responding.<\/p><p><b>Survivable systems analysis<\/b> has four stages: understand the system’s mission, requirements and architecture; identify the critical services and the components they depend on; simulate attacks with scenarios that show which components they would affect; and analyze survivability. The analysis looks for <b>softspots<\/b>—components that are both essential and compromisable—and proposes strategies of resistance, recognition and recovery for them. Its weakness for business systems is that it starts from requirements and architecture, which often do not describe the real operational dependencies.<\/p>","sourceStart":42,"notes":"Ask the class to name the softspot in our story. The identity service is essential to the critical task and it is the component that failed; the absent specialist is a human softspot."},{"id":"CHECK2","title":"Checkpoint · choose the recovery mechanism","fig":null,"sourceRange":"28–49","bullets":[["Think","Compare one shared backup with a separately controlled recovery path."],["Pair","Name a common cause, staffing constraint and restoration check."],["Record","Add the mechanism and its limitations to the same card."]],"question":"What would defeat the claimed recovery advantage of the second path?","answer":"Evidence that it shares the compromised credentials, corrupted data, failed dependency or unavailable specialist.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"A second recovery path only helps if it does not share the first path’s failure.","full":"<p>Compare one shared backup with a separately controlled recovery path. The second path is an advantage only if it avoids the causes that defeated the first: the same compromised credentials, the same corrupted data, the same failed identity service or the same unavailable specialist. A good answer names the mechanism, the common cause it avoids, the staffing it needs and the check that shows restoration worked.<\/p>","sourceStart":28,"notes":"Ask each pair to name the fact that would defeat their chosen path. If none can, ask whether the new path signs in through the same identity service."},{"id":"R18","title":"Prioritize critical services—not every feature","fig":null,"sourceRange":"50–63","bullets":[["Business purpose","Define the service that must be maintained."],["Dependencies","Identify the technical and human assets needed to deliver it."],["Degraded mode","Specify what remains available and what is suspended."],["Acceptance","Verify usefulness and integrity, then plan full reinstatement."]],"question":"Why might reporting be deferred while an essential operational task is restored?","answer":"A bounded degraded mode can preserve the primary purpose with fewer dependencies. The deferred function and restoration conditions must stay explicit.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Protect the minimum critical service first, and decide in advance what can wait.","full":"<p>To maintain availability you need to know which services are most critical, the minimum quality of service that must be maintained, how those services could be compromised and protected, and how to recover quickly. Critical assets—hardware, software, data and people—are identified during this service analysis.<\/p><p>In the Mentcare example, the critical services are the information service that gives a patient’s current diagnosis and treatment plan, and the warning service that flags patients who may be a danger to themselves or others. Access to the complete patient record is <b>not<\/b> critical, because routine information is rarely needed during a consultation. That decision is what makes a bounded degraded mode possible: deferred functions and the conditions for restoring them must be stated explicitly.<\/p>","sourceStart":50,"notes":"Ask which function in our case could be deferred during recovery and who must accept that decision. Students often try to restore everything at once."},{"id":"B01","title":"Architecture for service continuity","fig":"ch14_clientserver","sourceRange":"50–63","bullets":[["Redundancy","Retain the resources and data needed for recovery."],["Diversity","Reduce shared failures across alternate paths."],["Recovery access","Ensure users and operators can actually use the fallback."],["Testing","Exercise resistance, recovery and reinstatement separately."]],"question":"What is missing when a recovery diagram shows only two servers?","answer":"Data state, access paths, detection, transfer, operator authority and the conditions that show the critical service is usable.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6e0ebc9195f92ac2.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"A continuity architecture needs usable fallbacks, and each recovery activity must be tested.","full":"<p>For the Mentcare system, the chapter maps each resilience activity to design choices. Normal operation depends on the patient-record database, the database server, the network, local clients and the clinicians themselves. Resilience strategies include keeping summary patient records on local clients, so that consultations can continue if the server or network is unavailable; a watchdog timer on each client that detects when the server stops responding; a backup server that takes regular snapshots and can take over; and integrity checking that restores corrupted data from backups and a transaction log.<\/p><p>Redundancy only helps if users and operators can actually use the fallback: someone must have the access, the authority and the procedure. Resistance, recovery and reinstatement should each be exercised in a rehearsal. A diagram that shows two servers says nothing about data state, access paths, detection, transfer, operator authority or the check that proves the critical service works.<\/p>","sourceStart":50,"notes":"Ask what is missing from a two-server diagram and write the answers around it. The list becomes the recovery plan the assignment asks for."},{"id":"R09","title":"Continuity must not erase confidentiality","fig":"ch14_mentcare","sourceRange":"50–63","bullets":[["Fallback risk","Copies and alternate access paths can expose sensitive data."],["Integrity","Prevent conflicting or lost changes during degraded operation."],["Reconciliation","Define how fallback records return to the authoritative system."],["Ownership","Name who accepts restricted service and checks reinstatement."]],"question":"Why does a paper fallback need more than a printer?","answer":"It needs access control, secure handling, version/state identification and a reconciliation procedure. The service can continue while these risks remain unresolved.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c2229a1d4226e9e6.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"A fallback must still protect confidentiality and integrity, and must be reconciled afterwards.","full":"<p>Degraded operation creates new risks. Local copies, paper records and alternate access paths keep a service running, but they can expose sensitive information, so they need access control; the security chapter suggests encrypting local copies. Changes made during degraded operation can conflict with the authoritative records or be lost, so each fallback needs a way to identify the version and state of the information and a reconciliation procedure that returns it to the main system.<\/p><p>These trade-offs need an owner. Someone must accept the restricted service, decide what is suspended, and check that reinstatement has restored both the data and the normal controls. A paper fallback therefore needs more than a printer: it needs secure handling, version identification and a defined path back.<\/p>","sourceStart":50,"notes":"Ask what could go wrong with a paper list of patients during an outage. Push for confidentiality, conflicting updates and who reconciles them afterwards."},{"id":"AISYS","title":"02:00, no assistant: walk the timeline","phase":"LEARN","skin":"genai","banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · WALK THE TIMELINE","caption":"An assistant can stand in for missing knowledge—until it fails with everything else."},"takeaway":"Plan the recovery for the night the assistant is gone too.","fullTable":false,"bullets":[["Name the dependency","What does each step need?"],["Remove the assistant","Which step then fails?"],["Show the rehearsal","What record proves it worked?"]],"question":"Complete 02:20. What must your plan already contain so the critical task can be restored without the assistant?","answer":"An independent emergency route to identity with named, bounded and audited authority; a versioned offline runbook that has been exercised; a second cross-trained person; a defined degraded mode; integrity checks and reconciliation for fallback data; and a rehearsal record in which recovery succeeded with the assistant unavailable. The assistant can help when it is up, but it must not sit on the critical path or hold standing emergency credentials. This is one defensible answer; others can be defensible if their dependencies and limits are explicit.","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source methods to an AI component","notes":"Allow about 6 minutes. Format: timeline. Read the three timestamps aloud, then give pairs 2 minutes to write the 02:20 step. New terms, at most two: deskilling and automation bias. Everything else in Full explanation is optional depth and is not assessed.","full":"<p>This slide is course-added. It walks one night of the opening case with the AI recovery assistant unavailable.<\/p><h3>How the slide uses the five objectives<\/h3><p>The four Rs: the assistant may speed recognition, but recovery must work without it. Dependencies: its sign-on, hosting and data are dependencies like any other. Swiss Cheese: trained on the organisation’s runbooks, its gaps are likely to line up with theirs. Survivability: if it is essential to recovery and can be lost or compromised, it is a softspot. Degraded service: its use in a fallback must not expose data or grant it emergency power.<\/p><p><b>Automation bias.<\/b> Under pressure, people tend to follow fluent, confident instructions without checking them against the current system state—for example, steps that assume the primary copy is usable.<\/p><p><b>Deskilling.<\/b> When a tool handles routine cases, people practise less, so their skill is weakest in the unusual situation where the tool fails. Classic work on the ironies of automation describes this pattern; it extends the source’s trade-off between automation and human flexibility.<\/p><p><b>Emergency authority.<\/b> An assistant, or an AI agent able to act, should not hold standing emergency privileges. The source’s rule applies: named responsibility, bounded scope, an audit trail and restoration of normal controls.<\/p><p class=\"small\">The case is course-created. Optional further reading: Bainbridge, L. (1983), <i>Ironies of Automation<\/i>, Automatica.<\/p>","sourceStart":1,"flow":true,"nodes":[["02:00 · Identity fails; no one can sign in",""],["02:10 · Assistant unreachable; specialist off shift",""],["02:20 · Your plan: what happens next?",""]]},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Another copy is not another path.","bullets":[["New information","The alternate copy and the AI assistant both need the failed identity service."],["Reassess","The recovery claim assumed an independent path."],["Revise","Restore identity through an audited emergency route first."],["Own","Name who holds emergency authority and informs users."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. Take the assistant off the critical path: restore identity through an independent, audited emergency route, and tell the users of the critical service what is degraded and for how long.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The alternate data copy is available, but it depends on the same unavailable identity service.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Accept revisions that restore identity through an independent, audited route and take the assistant off the critical path. Ask who must tell the users of the critical service what is degraded and for how long."},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What has recovered, and what must still be restored? Can the AI assistant stand in for the absent specialist?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the given facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. The assistant can suggest steps, but it has no authority, has never been rehearsed and cannot verify that the critical task works for users. It does not replace a trained, authorised person.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, a separately controlled recovery path, or following the AI assistant’s recovery steps.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X06"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X06","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose a
