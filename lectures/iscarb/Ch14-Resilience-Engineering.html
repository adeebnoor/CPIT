ractions. <a href="sources/Ch14-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":14,"title":"Resilience Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260921-classroom-v3","filename":"Ch14-Resilience-Engineering.html","assignment":5,"points":5,"objectives":["Explain recognition, resistance, recovery and reinstatement.","Identify organizational and technical dependencies.","Interpret the Swiss Cheese model without assuming independence.","Perform the stages of survivability analysis.","Trade off degraded service against confidentiality and integrity."],"sections":["14.1 Cybersecurity","14.2 Sociotechnical resilience","14.3 Resilient systems design"],"case":{"headline":"The backup is running. The service still cannot be used.","text":"After a fictional disruption, a backup server starts but authorized staff cannot complete the critical task because the access service is unavailable. The only trained recovery specialist is off shift.","question":"What has recovered, and what must still be restored?","mutation":"The alternate data copy is available, but it depends on the same unavailable identity service."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Resilience Engineering","phase":"START","takeaway":"Resilience Engineering","full":"<p>Resilience Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Resilience starts where prevention is not enough","fig":null,"sourceRange":"3–9","bullets":[["Critical service","Identify what must continue despite disruption."],["Changed assumptions","Prepare for conditions not covered by normal operation."],["Sociotechnical","People, processes and technical systems contribute to recovery."],["Boundary","The source treats resilience as an expert judgment, not a single universal score."]],"question":"Why is a running backup not necessarily a recovered service?","answer":"Users may still lack access, trustworthy data, trained operators or a working process. Recovery is judged against the critical service.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"The source treats resilience as an expert judgment, not a single universal score.","full":"<p><b>Critical service.<\/b> Identify what must continue despite disruption.<\/p><p><b>Changed assumptions.<\/b> Prepare for conditions not covered by normal operation.<\/p><p><b>Sociotechnical.<\/b> People, processes and technical systems contribute to recovery.<\/p><p><b>Boundary.<\/b> The source treats resilience as an expert judgment, not a single universal score.<\/p>","sourceStart":3},{"id":"X02","title":"Recognition → resistance → recovery → reinstatement","fig":"ch14_resactivities","sourceRange":"3–9","bullets":[["Recognition","Detect symptoms of failure or attack."],["Resistance","Contain problems or repel an attack; service may be restricted."],["Recovery","Restore the critical services first."],["Reinstatement","Restore all services and normal operation in a controlled way."]],"question":"Which activity is complete when only the essential records are available?","answer":"Critical-service recovery may be achieved if its conditions are met. Full reinstatement is not complete while other services remain restricted.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/16a0f6456c570849.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Restore all services and normal operation in a controlled way.","full":"<p><b>Recognition.<\/b> Detect symptoms of failure or attack.<\/p><p><b>Resistance.<\/b> Contain problems or repel an attack; service may be restricted.<\/p><p><b>Recovery.<\/b> Restore the critical services first.<\/p><p><b>Reinstatement.<\/b> Restore all services and normal operation in a controlled way.<\/p>","sourceStart":3},{"id":"X02A","title":"Cyber-resilience planning · identify and resist","fig":"ch14_cyberplan","sourceRange":"10–17","bullets":[["Classify assets","Distinguish critical, important and useful assets."],["Identify threats","Consider confidentiality, integrity and availability."],["Recognize","Define how symptoms or attacks will be detected."],["Resist","Specify technical and operational actions to contain the threat."]],"question":"Why must asset classification precede buying another security tool?","answer":"The required service and consequences determine priorities. A tool does not by itself identify what must survive or which loss matters most.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/ca462bf14ae229c7.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Specify technical and operational actions to contain the threat.","full":"<p><b>Classify assets.<\/b> Distinguish critical, important and useful assets.<\/p><p><b>Identify threats.<\/b> Consider confidentiality, integrity and availability.<\/p><p><b>Recognize.<\/b> Define how symptoms or attacks will be detected.<\/p><p><b>Resist.<\/b> Specify technical and operational actions to contain the threat.<\/p>","sourceStart":10},{"id":"RECOVERYPLAN","title":"Cyber-resilience planning · recover and reinstate","fig":"ch14_streams","sourceRange":"10–17; 50–63","bullets":[["Recover assets","Provide accessible, trustworthy redundant copies and supporting resources."],["Reinstate","Define restoration of all assets, not only the critical subset."],["Test","Exercise the recovery and reinstatement strategy."],["Update","Revise the plan as assets, threats and operations change."]],"question":"Which evidence distinguishes “we have backups” from “we can recover”?","answer":"An executed recovery record for a stated system version and dataset, with access, integrity and service checks. A backup inventory alone is insufficient.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/bc241e31aa930d98.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Revise the plan as assets, threats and operations change.","full":"<p><b>Recover assets.<\/b> Provide accessible, trustworthy redundant copies and supporting resources.<\/p><p><b>Reinstate.<\/b> Define restoration of all assets, not only the critical subset.<\/p><p><b>Test.<\/b> Exercise the recovery and reinstatement strategy.<\/p><p><b>Update.<\/b> Revise the plan as assets, threats and operations change.<\/p>","sourceStart":10},{"id":"X03","title":"Resilience exists across organizational layers","fig":"ch14_nested","sourceRange":"18–27","bullets":[["Operators","May contain a technical failure before it becomes a service failure."],["Managers","Coordinate when local recovery is insufficient."],["Capabilities","Respond, monitor, anticipate and learn."],["Learning","Study successful adaptations as well as incidents."]],"question":"What becomes a system dependency when only one specialist can restore access?","answer":"That person’s availability, knowledge and authority. A resilient plan needs a realistic handover or alternative response.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/f082d48c0c892cff.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Study successful adaptations as well as incidents.","full":"<p><b>Operators.<\/b> May contain a technical failure before it becomes a service failure.<\/p><p><b>Managers.<\/b> Coordinate when local recovery is insufficient.<\/p><p><b>Capabilities.<\/b> Respond, monitor, anticipate and learn.<\/p><p><b>Learning.<\/b> Study successful adaptations as well as incidents.<\/p>","sourceStart":18},{"id":"CHECK1","title":"Checkpoint · name the service boundary","fig":null,"sourceRange":"3–27","bullets":[["Think","A backup starts but authorized staff still cannot retrieve records."],["Pair","State which service has—and has not—recovered."],["Record","Define the claim and the evidence needed at the user boundary."]],"question":"Which acceptance check is more useful than “server process is running”?","answer":"A representative authorized user completes the specified critical task using data whose integrity is checked.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Define the claim and the evidence needed at the user boundary.","full":"<p><b>Think.<\/b> A backup starts but authorized staff still cannot retrieve records.<\/p><p><b>Pair.<\/b> State which service has—and has not—recovered.<\/p><p><b>Record.<\/b> Define the claim and the evidence needed at the user boundary.<\/p>","sourceStart":3},{"id":"X04","title":"Defensive layers can fail together","fig":"ch14_swiss","sourceRange":"28–32","bullets":[["Barriers","Several defenses may block a path to harm."],["Weaknesses","Each layer has limitations that can align."],["Common causes","Shared credentials, assumptions or infrastructure can affect multiple layers."],["Systems approach","Investigate why defenses failed, not only who made the final error."]],"question":"Why is “add another identical backup” an incomplete response to compromised credentials?","answer":"The same credentials may expose both copies. The design must address the shared access path as well as redundancy.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/fd384ab70c090c88.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Investigate why defenses failed, not only who made the final error.","full":"<p><b>Barriers.<\/b> Several defenses may block a path to harm.<\/p><p><b>Weaknesses.<\/b> Each layer has limitations that can align.<\/p><p><b>Common causes.<\/b> Shared credentials, assumptions or infrastructure can affect multiple layers.<\/p><p><b>Systems approach.<\/b> Investigate why defenses failed, not only who made the final error.<\/p>","sourceStart":28},{"id":"X05","title":"Efficiency and resilience can conflict","fig":null,"sourceRange":"33–41","bullets":[["Automation","Reduces routine work but can remove human flexibility."],["Specialization","Builds expertise but creates dependence on particular people."],["Standardization","Simplifies operations but may spread common weaknesses."],["Trade-off","Use consequences and plausible interventions to justify the balance."]],"question":"When might cross-training be preferable to maximum role specialization?","answer":"When the absence of one specialist prevents containment or recovery across interacting systems. The workload and training cost still need justification.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Use consequences and plausible interventions to justify the balance.","full":"<p><b>Automation.<\/b> Reduces routine work but can remove human flexibility.<\/p><p><b>Specialization.<\/b> Builds expertise but creates dependence on particular people.<\/p><p><b>Standardization.<\/b> Simplifies operations but may spread common weaknesses.<\/p><p><b>Trade-off.<\/b> Use consequences and plausible interventions to justify the balance.<\/p>","sourceStart":33},{"id":"D14","title":"Give people a usable recovery process","fig":null,"sourceRange":"33–41","bullets":[["Person approach","Attributes errors primarily to the individual."],["Systems approach","Examines workload, training, design and failed safeguards."],["Handover","Make state, responsibility and escalation visible."],["Evidence","Rehearse recovery under realistic staffing conditions."]],"question":"What should follow an operator missing a warning during several simultaneous alarms?","answer":"Investigate interface, workload, prioritization, training and escalation as well as the action. Propose a checkable design/process improvement.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Rehearse recovery under realistic staffing conditions.","full":"<p><b>Person approach.<\/b> Attributes errors primarily to the individual.<\/p><p><b>Systems approach.<\/b> Examines workload, training, design and failed safeguards.<\/p><p><b>Handover.<\/b> Make state, responsibility and escalation visible.<\/p><p><b>Evidence.<\/b> Rehearse recovery under realistic staffing conditions.<\/p>","sourceStart":33},{"id":"EMERGENCY","title":"Emergency authority needs an audit trail","fig":null,"sourceRange":"16–17","bullets":[["Tension","Restricting privilege may obstruct urgent containment."],["Emergency mode","The source describes exceptional actions with recorded responsibility."],["Risk","An emergency path can itself become a vulnerability."],["Boundary","Define authorized scope, review and restoration of normal controls."]],"question":"Why should emergency access not be a permanently shared administrator account?","answer":"It obscures who acted, broadens exposure and makes review difficult. A proposed emergency process needs named responsibility and bounded authority.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Define authorized scope, review and restoration of normal controls.","full":"<p><b>Tension.<\/b> Restricting privilege may obstruct urgent containment.<\/p><p><b>Emergency mode.<\/b> The source describes exceptional actions with recorded responsibility.<\/p><p><b>Risk.<\/b> An emergency path can itself become a vulnerability.<\/p><p><b>Boundary.<\/b> Define authorized scope, review and restoration of normal controls.<\/p>","sourceStart":16},{"id":"X06","title":"Survivability analysis identifies softspots","fig":"ch14_survivability","sourceRange":"42–49","bullets":[["Understand","Review the mission, requirements and architecture."],["Identify","Locate critical services and their supporting components."],["Simulate","Describe attacks and the components they could compromise."],["Analyze","Find essential-and-compromisable softspots; plan recognition, resistance and recovery."]],"question":"What is a softspot in this method?","answer":"A component that is both essential to a critical service and vulnerable in the considered attack scenario. It is a priority for survivability treatment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/34af5f8485dd7c6e.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Find essential-and-compromisable softspots; plan recognition, resistance and recovery.","full":"<p><b>Understand.<\/b> Review the mission, requirements and architecture.<\/p><p><b>Identify.<\/b> Locate critical services and their supporting components.<\/p><p><b>Simulate.<\/b> Describe attacks and the components they could compromise.<\/p><p><b>Analyze.<\/b> Find essential-and-compromisable softspots; plan recognition, resistance and recovery.<\/p>","sourceStart":42},{"id":"CHECK2","title":"Checkpoint · choose the recovery mechanism","fig":null,"sourceRange":"28–49","bullets":[["Think","Compare one shared backup with a separately controlled recovery path."],["Pair","Name a common cause, staffing constraint and restoration check."],["Record","Add the mechanism and its limitations to the same card."]],"question":"What would defeat the claimed recovery advantage of the second path?","answer":"Evidence that it shares the compromised credentials, corrupted data, failed dependency or unavailable specialist.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the mechanism and its limitations to the same card.","full":"<p><b>Think.<\/b> Compare one shared backup with a separately controlled recovery path.<\/p><p><b>Pair.<\/b> Name a common cause, staffing constraint and restoration check.<\/p><p><b>Record.<\/b> Add the mechanism and its limitations to the same card.<\/p>","sourceStart":28},{"id":"R18","title":"Prioritize critical services—not every feature","fig":null,"sourceRange":"50–63","bullets":[["Business purpose","Define the service that must be maintained."],["Dependencies","Identify the technical and human assets needed to deliver it."],["Degraded mode","Specify what remains available and what is suspended."],["Acceptance","Verify usefulness and integrity, then plan full reinstatement."]],"question":"Why might reporting be deferred while an essential operational task is restored?","answer":"A bounded degraded mode can preserve the primary purpose with fewer dependencies. The deferred function and restoration conditions must stay explicit.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Verify usefulness and integrity, then plan full reinstatement.","full":"<p><b>Business purpose.<\/b> Define the service that must be maintained.<\/p><p><b>Dependencies.<\/b> Identify the technical and human assets needed to deliver it.<\/p><p><b>Degraded mode.<\/b> Specify what remains available and what is suspended.<\/p><p><b>Acceptance.<\/b> Verify usefulness and integrity, then plan full reinstatement.<\/p>","sourceStart":50},{"id":"B01","title":"Architecture for service continuity","fig":"ch14_clientserver","sourceRange":"50–63","bullets":[["Redundancy","Retain the resources and data needed for recovery."],["Diversity","Reduce shared failures across alternate paths."],["Recovery access","Ensure users and operators can actually use the fallback."],["Testing","Exercise resistance, recovery and reinstatement separately."]],"question":"What is missing when a recovery diagram shows only two servers?","answer":"Data state, access paths, detection, transfer, operator authority and the conditions that show the critical service is usable.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6e0ebc9195f92ac2.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Exercise resistance, recovery and reinstatement separately.","full":"<p><b>Redundancy.<\/b> Retain the resources and data needed for recovery.<\/p><p><b>Diversity.<\/b> Reduce shared failures across alternate paths.<\/p><p><b>Recovery access.<\/b> Ensure users and operators can actually use the fallback.<\/p><p><b>Testing.<\/b> Exercise resistance, recovery and reinstatement separately.<\/p>","sourceStart":50},{"id":"R09","title":"Continuity must not erase confidentiality","fig":"ch14_mentcare","sourceRange":"50–63","bullets":[["Fallback risk","Copies and alternate access paths can expose sensitive data."],["Integrity","Prevent conflicting or lost changes during degraded operation."],["Reconciliation","Define how fallback records return to the authoritative system."],["Ownership","Name who accepts restricted service and checks reinstatement."]],"question":"Why does a paper fallback need more than a printer?","answer":"It needs access control, secure handling, version/state identification and a reconciliation procedure. The service can continue while these risks remain unresolved.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c2229a1d4226e9e6.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Name who accepts restricted service and checks reinstatement.","full":"<p><b>Fallback risk.<\/b> Copies and alternate access paths can expose sensitive data.<\/p><p><b>Integrity.<\/b> Prevent conflicting or lost changes during degraded operation.<\/p><p><b>Reconciliation.<\/b> Define how fallback records return to the authoritative system.<\/p><p><b>Ownership.<\/b> Name who accepts restricted service and checks reinstatement.<\/p>","sourceStart":50},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"The alternate data copy is available, but it depends on the same unavailable identity service.","bullets":[["Reassess","Explain the effect of the changed constraint."],["Evidence","Name the observation that would defeat the revised claim."],["Ownership","State who reviews and accepts the bounded scope."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role.","nodes":[["Initial claim","Bounded by assumptions"],["New condition","An assumption changes"],["Revised verdict","A reason and next evidence"]],"full":"<p>The alternate data copy is available, but it depends on the same unavailable identity service.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"What has recovered, and what must still be restored?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test.","no":1,"at":"CHECK1","seconds":180},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case.","pair":"Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design.","no":2,"at":"CHECK2","seconds":180},{"title":"Change the constraint; revise and own","think":"The alternate data copy is available, but it depends on the same unavailable identity service.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; name the responsible role.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X06"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X06","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four
