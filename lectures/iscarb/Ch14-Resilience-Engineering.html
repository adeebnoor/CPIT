model without assuming independence.","Perform the stages of survivability analysis.","Trade off degraded service against confidentiality and integrity."],"sections":["14.1 Cybersecurity","14.2 Sociotechnical resilience","14.3 Resilient systems design"],"case":{"headline":"The backup is running. The service still cannot be used.","text":"After a fictional disruption, a backup server starts but authorized staff cannot complete the critical task because the access service is unavailable. The only trained recovery specialist is off shift.","question":"What has recovered, and what must still be restored?","mutation":"The alternate data copy is available, but it depends on the same unavailable identity service. Staff also sign in to the AI recovery assistant through that identity service, and its instructions assume the primary copy.","lens":"With the specialist off shift, staff turn to the organisation’s AI recovery assistant: a vendor-hosted chatbot trained on past runbooks that gives confident, step-by-step instructions. It has never been used in a recovery rehearsal. Hold that question: after the design slides, one slide shows how this chapter’s methods apply to the assistant."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Resilience Engineering","phase":"START","takeaway":"Resilience Engineering","full":"<p>Resilience Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Resilience starts where prevention is not enough","fig":null,"sourceRange":"3–9","bullets":[["Critical service","Identify what must continue despite disruption."],["Changed assumptions","Prepare for conditions not covered by normal operation."],["Sociotechnical","People, processes and technical systems contribute to recovery."],["Boundary","The source treats resilience as an expert judgment, not a single universal score."]],"question":"Why is a running backup not necessarily a recovered service?","answer":"Users may still lack access, trustworthy data, trained operators or a working process. Recovery is judged against the critical service.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"The source treats resilience as an expert judgment, not a single universal score.","full":"<p><b>Critical service.<\/b> Identify what must continue despite disruption.<\/p><p><b>Changed assumptions.<\/b> Prepare for conditions not covered by normal operation.<\/p><p><b>Sociotechnical.<\/b> People, processes and technical systems contribute to recovery.<\/p><p><b>Boundary.<\/b> The source treats resilience as an expert judgment, not a single universal score.<\/p>","sourceStart":3},{"id":"X02","title":"Recognition → resistance → recovery → reinstatement","fig":"ch14_resactivities","sourceRange":"3–9","bullets":[["Recognition","Detect symptoms of failure or attack."],["Resistance","Contain problems or repel an attack; service may be restricted."],["Recovery","Restore the critical services first."],["Reinstatement","Restore all services and normal operation in a controlled way."]],"question":"Which activity is complete when only the essential records are available?","answer":"Critical-service recovery may be achieved if its conditions are met. Full reinstatement is not complete while other services remain restricted.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/16a0f6456c570849.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Restore all services and normal operation in a controlled way.","full":"<p><b>Recognition.<\/b> Detect symptoms of failure or attack.<\/p><p><b>Resistance.<\/b> Contain problems or repel an attack; service may be restricted.<\/p><p><b>Recovery.<\/b> Restore the critical services first.<\/p><p><b>Reinstatement.<\/b> Restore all services and normal operation in a controlled way.<\/p>","sourceStart":3},{"id":"X02A","title":"Cyber-resilience planning","fig":"ch14_cyberplan","sourceRange":"10–17; 50–63","bullets":[["Classify assets","Distinguish critical, important and useful assets."],["Recognize and resist","Define detection, then the technical and operational actions that contain the threat."],["Recover and reinstate","Trustworthy copies for critical services first; then all assets, in a controlled way."],["Test and update","Exercise the strategy and revise it as assets, threats and operations change."]],"question":"(1) Which evidence distinguishes “we have backups” from “we can recover”? (2) Why must asset classification precede buying another security tool?","answer":"(1) An executed recovery record for a stated system version and dataset, with access, integrity and service checks. A backup inventory alone is insufficient. (2) The required service and consequences determine priorities. A tool does not by itself identify what must survive or which loss matters most.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/ch14-cyberplan-combined.jpg","caption":"Sommerville Ch.14 · both preserved source illustrations · select to enlarge","takeaway":"Classify and resist first; then recover, reinstate, test and update the plan.","full":"<p><b>Classify assets.<\/b> Distinguish critical, important and useful assets.<\/p><p><b>Identify threats.<\/b> Consider confidentiality, integrity and availability.<\/p><p><b>Recognize.<\/b> Define how symptoms or attacks will be detected.<\/p><p><b>Resist.<\/b> Specify technical and operational actions to contain the threat.<\/p><p><b>Recover assets.<\/b> Provide accessible, trustworthy redundant copies and supporting resources.<\/p><p><b>Reinstate.<\/b> Define restoration of all assets, not only the critical subset.<\/p><p><b>Test.<\/b> Exercise the recovery and reinstatement strategy.<\/p><p><b>Update.<\/b> Revise the plan as assets, threats and operations change.<\/p>","sourceStart":10,"notes":""},{"id":"X03","title":"Resilience exists across organizational layers","fig":"ch14_nested","sourceRange":"18–27","bullets":[["Operators","May contain a technical failure before it becomes a service failure."],["Managers","Coordinate when local recovery is insufficient."],["Capabilities","Respond, monitor, anticipate and learn."],["Learning","Study successful adaptations as well as incidents."]],"question":"What becomes a system dependency when only one specialist can restore access?","answer":"That person’s availability, knowledge and authority. A resilient plan needs a realistic handover or alternative response.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/f082d48c0c892cff.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Study successful adaptations as well as incidents.","full":"<p><b>Operators.<\/b> May contain a technical failure before it becomes a service failure.<\/p><p><b>Managers.<\/b> Coordinate when local recovery is insufficient.<\/p><p><b>Capabilities.<\/b> Respond, monitor, anticipate and learn.<\/p><p><b>Learning.<\/b> Study successful adaptations as well as incidents.<\/p>","sourceStart":18},{"id":"CHECK1","title":"Checkpoint · name the service boundary","fig":null,"sourceRange":"3–27","bullets":[["Think","A backup starts but authorized staff still cannot retrieve records."],["Pair","State which service has—and has not—recovered."],["Record","Define the claim and the evidence needed at the user boundary."]],"question":"Which acceptance check is more useful than “server process is running”?","answer":"A representative authorized user completes the specified critical task using data whose integrity is checked.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Define the claim and the evidence needed at the user boundary.","full":"<p><b>Think.<\/b> A backup starts but authorized staff still cannot retrieve records.<\/p><p><b>Pair.<\/b> State which service has—and has not—recovered.<\/p><p><b>Record.<\/b> Define the claim and the evidence needed at the user boundary.<\/p>","sourceStart":3},{"id":"X04","title":"Defensive layers can fail together","fig":"ch14_swiss","sourceRange":"28–32","bullets":[["Barriers","Several defenses may block a path to harm."],["Weaknesses","Each layer has limitations that can align."],["Common causes","Shared credentials, assumptions or infrastructure can affect multiple layers."],["Systems approach","Investigate why defenses failed, not only who made the final error."]],"question":"Why is “add another identical backup” an incomplete response to compromised credentials?","answer":"The same credentials may expose both copies. The design must address the shared access path as well as redundancy.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/fd384ab70c090c88.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Investigate why defenses failed, not only who made the final error.","full":"<p><b>Barriers.<\/b> Several defenses may block a path to harm.<\/p><p><b>Weaknesses.<\/b> Each layer has limitations that can align.<\/p><p><b>Common causes.<\/b> Shared credentials, assumptions or infrastructure can affect multiple layers.<\/p><p><b>Systems approach.<\/b> Investigate why defenses failed, not only who made the final error.<\/p>","sourceStart":28},{"id":"X05","title":"Efficiency and resilience can conflict","fig":null,"sourceRange":"33–41","bullets":[["Automation","Reduces routine work but can remove human flexibility."],["Specialization","Builds expertise but creates dependence on particular people."],["Standardization","Simplifies operations but may spread common weaknesses."],["Trade-off","Use consequences and plausible interventions to justify the balance."]],"question":"When might cross-training be preferable to maximum role specialization?","answer":"When the absence of one specialist prevents containment or recovery across interacting systems. The workload and training cost still need justification.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Use consequences and plausible interventions to justify the balance.","full":"<p><b>Automation.<\/b> Reduces routine work but can remove human flexibility.<\/p><p><b>Specialization.<\/b> Builds expertise but creates dependence on particular people.<\/p><p><b>Standardization.<\/b> Simplifies operations but may spread common weaknesses.<\/p><p><b>Trade-off.<\/b> Use consequences and plausible interventions to justify the balance.<\/p>","sourceStart":33},{"id":"D14","title":"Give people a usable recovery process","fig":null,"sourceRange":"33–41","bullets":[["Person approach","Attributes errors primarily to the individual."],["Systems approach","Examines workload, training, design and failed safeguards."],["Handover","Make state, responsibility and escalation visible."],["Evidence","Rehearse recovery under realistic staffing conditions."]],"question":"What should follow an operator missing a warning during several simultaneous alarms?","answer":"Investigate interface, workload, prioritization, training and escalation as well as the action. Propose a checkable design/process improvement.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Rehearse recovery under realistic staffing conditions.","full":"<p><b>Person approach.<\/b> Attributes errors primarily to the individual.<\/p><p><b>Systems approach.<\/b> Examines workload, training, design and failed safeguards.<\/p><p><b>Handover.<\/b> Make state, responsibility and escalation visible.<\/p><p><b>Evidence.<\/b> Rehearse recovery under realistic staffing conditions.<\/p>","sourceStart":33},{"id":"EMERGENCY","title":"Emergency authority needs an audit trail","fig":null,"sourceRange":"16–17","bullets":[["Tension","Restricting privilege may obstruct urgent containment."],["Emergency mode","The source describes exceptional actions with recorded responsibility."],["Risk","An emergency path can itself become a vulnerability."],["Boundary","Define authorized scope, review and restoration of normal controls."]],"question":"Why should emergency access not be a permanently shared administrator account?","answer":"It obscures who acted, broadens exposure and makes review difficult. A proposed emergency process needs named responsibility and bounded authority.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Define authorized scope, review and restoration of normal controls.","full":"<p><b>Tension.<\/b> Restricting privilege may obstruct urgent containment.<\/p><p><b>Emergency mode.<\/b> The source describes exceptional actions with recorded responsibility.<\/p><p><b>Risk.<\/b> An emergency path can itself become a vulnerability.<\/p><p><b>Boundary.<\/b> Define authorized scope, review and restoration of normal controls.<\/p>","sourceStart":16},{"id":"X06","title":"Survivability analysis identifies softspots","fig":"ch14_survivability","sourceRange":"42–49","bullets":[["Understand","Review the mission, requirements and architecture."],["Identify","Locate critical services and their supporting components."],["Simulate","Describe attacks and the components they could compromise."],["Analyze","Find essential-and-compromisable softspots; plan recognition, resistance and recovery."]],"question":"What is a softspot in this method?","answer":"A component that is both essential to a critical service and vulnerable in the considered attack scenario. It is a priority for survivability treatment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/34af5f8485dd7c6e.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Find essential-and-compromisable softspots; plan recognition, resistance and recovery.","full":"<p><b>Understand.<\/b> Review the mission, requirements and architecture.<\/p><p><b>Identify.<\/b> Locate critical services and their supporting components.<\/p><p><b>Simulate.<\/b> Describe attacks and the components they could compromise.<\/p><p><b>Analyze.<\/b> Find essential-and-compromisable softspots; plan recognition, resistance and recovery.<\/p>","sourceStart":42},{"id":"CHECK2","title":"Checkpoint · choose the recovery mechanism","fig":null,"sourceRange":"28–49","bullets":[["Think","Compare one shared backup with a separately controlled recovery path."],["Pair","Name a common cause, staffing constraint and restoration check."],["Record","Add the mechanism and its limitations to the same card."]],"question":"What would defeat the claimed recovery advantage of the second path?","answer":"Evidence that it shares the compromised credentials, corrupted data, failed dependency or unavailable specialist.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the mechanism and its limitations to the same card.","full":"<p><b>Think.<\/b> Compare one shared backup with a separately controlled recovery path.<\/p><p><b>Pair.<\/b> Name a common cause, staffing constraint and restoration check.<\/p><p><b>Record.<\/b> Add the mechanism and its limitations to the same card.<\/p>","sourceStart":28},{"id":"R18","title":"Prioritize critical services—not every feature","fig":null,"sourceRange":"50–63","bullets":[["Business purpose","Define the service that must be maintained."],["Dependencies","Identify the technical and human assets needed to deliver it."],["Degraded mode","Specify what remains available and what is suspended."],["Acceptance","Verify usefulness and integrity, then plan full reinstatement."]],"question":"Why might reporting be deferred while an essential operational task is restored?","answer":"A bounded degraded mode can preserve the primary purpose with fewer dependencies. The deferred function and restoration conditions must stay explicit.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Verify usefulness and integrity, then plan full reinstatement.","full":"<p><b>Business purpose.<\/b> Define the service that must be maintained.<\/p><p><b>Dependencies.<\/b> Identify the technical and human assets needed to deliver it.<\/p><p><b>Degraded mode.<\/b> Specify what remains available and what is suspended.<\/p><p><b>Acceptance.<\/b> Verify usefulness and integrity, then plan full reinstatement.<\/p>","sourceStart":50},{"id":"B01","title":"Architecture for service continuity","fig":"ch14_clientserver","sourceRange":"50–63","bullets":[["Redundancy","Retain the resources and data needed for recovery."],["Diversity","Reduce shared failures across alternate paths."],["Recovery access","Ensure users and operators can actually use the fallback."],["Testing","Exercise resistance, recovery and reinstatement separately."]],"question":"What is missing when a recovery diagram shows only two servers?","answer":"Data state, access paths, detection, transfer, operator authority and the conditions that show the critical service is usable.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6e0ebc9195f92ac2.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Exercise resistance, recovery and reinstatement separately.","full":"<p><b>Redundancy.<\/b> Retain the resources and data needed for recovery.<\/p><p><b>Diversity.<\/b> Reduce shared failures across alternate paths.<\/p><p><b>Recovery access.<\/b> Ensure users and operators can actually use the fallback.<\/p><p><b>Testing.<\/b> Exercise resistance, recovery and reinstatement separately.<\/p>","sourceStart":50},{"id":"R09","title":"Continuity must not erase confidentiality","fig":"ch14_mentcare","sourceRange":"50–63","bullets":[["Fallback risk","Copies and alternate access paths can expose sensitive data."],["Integrity","Prevent conflicting or lost changes during degraded operation."],["Reconciliation","Define how fallback records return to the authoritative system."],["Ownership","Name who accepts restricted service and checks reinstatement."]],"question":"Why does a paper fallback need more than a printer?","answer":"It needs access control, secure handling, version/state identification and a reconciliation procedure. The service can continue while these risks remain unresolved.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c2229a1d4226e9e6.jpg","caption":"Sommerville Ch.14 · preserved source illustration","takeaway":"Name who accepts restricted service and checks reinstatement.","full":"<p><b>Fallback risk.<\/b> Copies and alternate access paths can expose sensitive data.<\/p><p><b>Integrity.<\/b> Prevent conflicting or lost changes during degraded operation.<\/p><p><b>Reconciliation.<\/b> Define how fallback records return to the authoritative system.<\/p><p><b>Ownership.<\/b> Name who accepts restricted service and checks reinstatement.<\/p>","sourceStart":50},{"id":"AISYS","title":"02:00, no assistant: walk the timeline","phase":"LEARN","skin":"genai","banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · WALK THE TIMELINE","caption":"An assistant can stand in for missing knowledge—until it fails with everything else."},"takeaway":"Plan the recovery for the night the assistant is gone too.","fullTable":false,"bullets":[["Name the dependency","What does each step need?"],["Remove the assistant","Which step then fails?"],["Show the rehearsal","What record proves it worked?"]],"question":"Complete 02:20. What must your plan already contain so the critical task can be restored without the assistant?","answer":"An independent emergency route to identity with named, bounded and audited authority; a versioned offline runbook that has been exercised; a second cross-trained person; a defined degraded mode; integrity checks and reconciliation for fallback data; and a rehearsal record in which recovery succeeded with the assistant unavailable. The assistant can help when it is up, but it must not sit on the critical path or hold standing emergency credentials. This is one defensible answer; others can be defensible if their dependencies and limits are explicit.","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source methods to an AI component","notes":"Allow about 6 minutes. Format: timeline. Read the three timestamps aloud, then give pairs 2 minutes to write the 02:20 step. New terms, at most two: deskilling and automation bias. Everything else in Full explanation is optional depth and is not assessed.","full":"<p>This slide is course-added. It walks one night of the opening case with the AI recovery assistant unavailable.<\/p><h3>How the slide uses the five objectives<\/h3><p>The four Rs: the assistant may speed recognition, but recovery must work without it. Dependencies: its sign-on, hosting and data are dependencies like any other. Swiss Cheese: trained on the organisation’s runbooks, its gaps are likely to line up with theirs. Survivability: if it is essential to recovery and can be lost or compromised, it is a softspot. Degraded service: its use in a fallback must not expose data or grant it emergency power.<\/p><p><b>Automation bias.<\/b> Under pressure, people tend to follow fluent, confident instructions without checking them against the current system state—for example, steps that assume the primary copy is usable.<\/p><p><b>Deskilling.<\/b> When a tool handles routine cases, people practise less, so their skill is weakest in the unusual situation where the tool fails. Classic work on the ironies of automation describes this pattern; it extends the source’s trade-off between automation and human flexibility.<\/p><p><b>Emergency authority.<\/b> An assistant, or an AI agent able to act, should not hold standing emergency privileges. The source’s rule applies: named responsibility, bounded scope, an audit trail and restoration of normal controls.<\/p><p class=\"small\">The case is course-created. Optional further reading: Bainbridge, L. (1983), <i>Ironies of Automation<\/i>, Automatica.<\/p>","sourceStart":1,"flow":true,"nodes":[["02:00 · Identity fails; no one can sign in",""],["02:10 · Assistant unreachable; specialist off shift",""],["02:20 · Your plan: what happens next?",""]]},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Another copy is not another path.","bullets":[["New information","The alternate copy and the AI assistant both need the failed identity service."],["Reassess","The recovery claim assumed an independent path."],["Revise","Restore identity through an audited emergency route first."],["Own","Name who holds emergency authority and informs users."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. Take the assistant off the critical path: restore identity through an independent, audited emergency route, and tell the users of the critical service what is degraded and for how long.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The alternate data copy is available, but it depends on the same unavailable identity service.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What has recovered, and what must still be restored? Can the AI assistant stand in for the absent specialist?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. The assistant can suggest steps, but it has no authority, has never been rehearsed and cannot verify that the critical task works for users. It does not replace a trained, authorised person.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, a separately controlled recovery path, or following the AI assistant’s recovery steps.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. An assistant trained on the same runbooks shares their assumptions, so its holes line up with the plan’s—the Swiss Cheese warning. A separately controlled, rehearsed path is more likely to fail for different reasons—provided it does not share the same identity service.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"The alternate data copy is available, but it depends on the same unavailable identity service. Staff also sign in to the AI recovery assistant through that identity service, and its instructions assume the primary copy.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The assistant is a third path through the same identity service, so it fails with everything else. Recovery must be planned and rehearsed with the assistant unavailable.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X06"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X06","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Sociotechnical and organizational resilience","range":"18–23"},{"title":"Survivability analysis","range":"42–45"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Resilience, cybersecurity and planning","start":3,"end":17,"units":["X01","X02","X02A","CHECK1","EMERGENCY"]},{"title":"Sociotechnical and organizational resilience","start":18,"end":27,"units":["X03","CHECK1"]},{"title":"Defensive layers and operational processes","start":28,"end":41,"units":["X04","X05","D14","CHECK2"]},{"title":"Survivability analysis","start":42,"end":49,"units":["X06","CHECK2"]},{"title":"Critical service and resilient architecture","start":50,"end":63,"units":["X02A","R18","B01","R09"]}],"sourceCount":63,"original":"sources/Ch14-Original.pptx","textbook":"sources/Ch14-Textbook.pdf","bookPages":27,"quiz":[{"q":"Returning to a stable normal operating condition after recovery is:","options":["Recognition","Reinstatement","Attack prediction"],"answer":1,"why":"Reinstatement includes the controlled return from degraded operation."},{"q":"Which is an organizational dependency?","options":["Authority and trained staff to activate a fallback","Only a disk controller","Only a packet format"],"answer":0,"why":"People, authority, coordination and training affect service continuity."},{"q":"What does the Swiss Cheese model warn about?","options":["Each layer always stops every failure","More layers guarantee independence","Weaknesses can align across defensive layers"],"answer":2,"why":"Shared causes and aligned weaknesses can allow a disruption through several layers."},{"q":"A survivability analysis should start by identifying:","options":["Essential services and the system context","A new server brand","The largest possible backup"],"answer":0,"why":"Essential services determine the consequences and priorities of disruption scenarios."},{"q":"A paper fallback keeps service running. What also needs consideration?","options":["No further checks","Confidentiality, integrity and later reconciliation","Only the paper color"],"answer":1,"why":"Useful degraded operation must still protect and reconcile information."}],"alignment":[{"objective":"Explain recognition, resistance, recovery and reinstatement.","evidence":"Explain and demonstrate: Explain recognition, resistance, recovery and reinstatement.","field":"FIT · practice/reviewer opportunity, not automatic attainment"},{"objective":"Identify organizational and technical dependencies.","evidence":"Explain and demonstrate: Identify organizational and technical dependencies.","field":"RECOVER / measure · practice/reviewer opportunity, not automatic attainment"},{"objective":"Interpret the Swiss Cheese model without assuming independence.","evidence":"Explain and demonstrate: Interpret the Swiss Cheese model without assuming independence.","field":"technical + BOUND · practice/reviewer opportunity, not automatic attainment"},{"objective":"Perform the stages of survivability analysis.","evidence":"Explain and demonstrate: Perform the stages of survivability analysis.","field":"RECOVER + sourceUse · practice/reviewer opportunity, not automatic attainment"},{"objective":"Trade off degraded service against confidentiality and integrity.","evidence":"Explain and demonstrate: Trade off degraded service against confidentiality and integrity.","field":"REFIT + EVIDENCE · practice/reviewer opportunity, not automatic attainment"}],"artifact":"Build a critical-service → dependency → degraded-mode → recovery/reinstatement check.","bridge":"Build a critical-service → dependency → degraded-mode → recovery/reinstatement check. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"X06","workload":"Consider specialist absence, simultaneous alarms and the transfer of authority during recovery.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","RECOVERYPLAN":"X02A"},"roadmap":{"question":"How can critical services continue through disruption?","connection":"Critical services set priorities; the four Rs organize the response; people, defenses and survivability analysis make recovery usable.","inClass":"Identify dependencies; compare degraded and recovered service.","deliverable":"A critical-service recovery and reinstatement plan.","success":"Explain what service users regain, not only which server restarts.","branches":[{"verb":"Choose what must continue","label":"Critical services","detail":"Resilience vs reliability · continuity priorities","target":"X01","units":["X01","R18"],"caseLens":"Which critical service is actually unavailable even though the backup server is running?"},{"verb":"Organize the response","label":"The four Rs","detail":"Recognition · resistance · recovery · reinstatement","target":"X02","units":["X02"],"caseLens":"Where are we in recognition → resistance → recovery → reinstatement?"},{"verb":"Protect organizational assets","label":"Cybersecurity","detail":"Assets · threats · cyber-resilience planning","target":"X02A","units":["X02A","R09"],"caseLens":"Which shared identity dependency creates a cyber-resilience soft spot?"},{"verb":"Enable people to adapt","label":"Sociotechnical resilience","detail":"Operators · layered defenses · emergency authority","target":"X03","units":["X03","CHECK1","X04","X05","D14","EMERGENCY"],"caseLens":"What can operators do when normal procedures are insufficient?"},{"verb":"Design and check continuity","label":"Resilient systems design","detail":"Survivability analysis · softspots · recovery design","target":"X06","units":["X06","CHECK2","B01","AISYS","APPLY"],"caseLens":"What architecture and recovery evidence restores usable service, not just servers?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"02:00. Systems down. The AI that knows the runbook is down too.","aiAssignment":{"title":"The after-hours bank chatbot","scenario":"A bank uses an AI chatbot as its only customer channel after hours. It answers from a retrieved knowledge base of fees, card blocking and branch procedures. Management asks for a resilience plan for the chatbot service.","facts":["The chatbot is hosted by a vendor; the knowledge base is hosted by the bank.","Card blocking through the chatbot calls the bank’s core system.","Staff have never practised serving customers without the chatbot."],"question":"Which critical service must survive, and what must the plan contain to recognise, resist, recover and reinstate it?","stress":"Ransomware encrypts the knowledge base. The only clean backup is three weeks old, so the restored chatbot now states outdated fees and an old card-blocking number with full confidence.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023"
