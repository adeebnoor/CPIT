<!doctype html><html lang="en" data-iscarb-standalone="1" data-course-release="20260921-classroom-v3" data-navigation="20260921-navigation-v1" data-mindmap="20260921-mindmap-v1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chapter 10: Dependable Systems. Twenty source-grounded classroom slides, required source review, and one iSCARB decision artifact."><title>iSCARB · Ch10 Dependable Systems</title><link rel="stylesheet" href="runtime/classroom-v3.css?v=20260921-mindmap-v1"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="../../iscarb.html">iSCARB<small>CPIT-455 · CH 10</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch10-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":10,"title":"Dependable Systems","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260921-classroom-v3","filename":"Ch10-Dependable-Systems.html","assignment":1,"points":4,"objectives":["Distinguish the five properties using one example.","Trace one failure through people, process and technology.","Explain redundancy, diversity and common-cause failure.","Identify evidence from a dependable process.","Explain what formal verification assumes and what it cannot establish."],"sections":["Dependability and failure","Dependability properties","Cost and criticality","Sociotechnical systems and regulation","Redundancy and diversity","Dependable processes","Formal methods"],"case":{"headline":"The alarm is sounding. Can the plant continue?","text":"A fictional coastal desalination control upgrade is live. Pressure alarms recur and an automatic failover occurs. The cause and independence of the sensing paths are not yet established.","question":"Which evidence separates a real pressure excursion from a sensing fault?","mutation":"Two nominally separate readings use the same transmitter and power supply."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Dependable Systems","phase":"ISCARB TOOLKIT","takeaway":"","bullets":[],"question":"Sit down. The decision starts in ninety seconds.","answer":"","sourceRange":"","notes":"Leave this up while the room settles. One sentence only: tonight you do not learn five definitions, you issue one engineering decision and defend it.","nodes":[],"full":"<p><\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"","bullets":[],"question":"","answer":"","sourceRange":"","notes":"","nodes":[],"full":"<p><\/p>","sourceStart":1},{"id":"START","title":"Your route through this chapter","phase":"LEARN","takeaway":"","bullets":[],"question":"","answer":"","sourceRange":"","notes":"","nodes":[],"full":"<p><\/p>","sourceStart":1},{"id":"X01","title":"Five dependability properties","phase":"LEARN","takeaway":"Dependability is the user’s degree of trust—not availability alone.","bullets":[["Availability / reliability","Useful service is ready when needed / behaves correctly."],["Safety / security","Avoid harm / resist intrusion."],["Resilience","Maintain critical services during disruption."],["Interaction","An available service can still be unsafe; match evidence to the property."]],"question":"A service is available but returns unsafe results. Which properties must you investigate, and why is availability alone insufficient?","answer":"Investigate reliability (correct service) and safety (harm), while checking the operating context. Availability concerns useful service being ready when required; it does not establish correctness or freedom from harm. Security and resilience may also matter if intrusion or disruption caused the unsafe results.","sourceRange":"3–6; 7–13","notes":"Teaching focus: Five dependability properties. The highest-value thirty seconds of the Understand phase, and it is a heading nowhere in the source: it falls out of reading p.8 and p.9 side by side. Probability language obliges you to measure; judgment language obliges you to argue to a threshold someone else accepts. Students who miss it write assignments full of unmeasured percentages.","nodes":[["Availability","Ready when needed"],["Reliability","Correct service"],["Safety","Avoid harm"],["Security","Resist attack"],["Resilience","Continue critical services"]],"full":"<p>Availability asks whether useful service is ready when needed; reliability asks whether that service behaves correctly. Safety concerns harm, security concerns intrusion, and resilience concerns continuity during disruption. These properties interact: an available service may still produce an unsafe result. State which property your evidence actually supports.<\/p>","figure":"assets/v3/ch10-props.svg","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":3},{"id":"X02","title":"Hardware, software and human failure","phase":"LEARN","takeaway":"Find the failure mechanism before choosing the fix.","bullets":[["Failure causes","Hardware: design, manufacture or wear. Software: specification, design or code."],["Operational failures","Investigate people, procedures and work conditions—not only the operator."],["Repairability / maintainability","Restore after failure / adapt to new requirements."],["Error tolerance","Avoid or tolerate user-input errors."]],"question":"Name the hardware, software and operational hypotheses for the alarms, then identify one observation that would distinguish two hypotheses.","answer":"Possible hypotheses include a faulty pressure transmitter, a defect in the upgrade, or a misleading alarm/hand-over procedure. An independently verified pressure reading compared with the alarm and switch-over log could help distinguish a true excursion from a sensor problem. These are hypotheses and requested observations, not completed tests.","sourceRange":"3–6; 10–11","notes":"Teaching focus: Hardware, software and human failure. Most of the room will say Software because a software upgrade happened. The source says operational error is now perhaps the largest single cause. Do not correct anyone — ask which log separates the two, and whether it exists. Usually it does not, and that absence is the real finding.","nodes":[["Hardware","Physical fault"],["Software","Design fault"],["Operation","People and process"]],"full":"<p>Hardware faults arise from design, manufacturing or wear; software faults from specification, design or implementation; operational failures involve people and procedures. Investigate work conditions, not just the operator. Repairability means restoring the system after failure. Maintainability means adapting it to new requirements. Error tolerance means avoiding or tolerating user-input errors.<\/p>","sourceStart":3},{"id":"X07","title":"Fault, error and failure","phase":"LEARN","takeaway":"A fault can create an error; an error can become a visible failure.","bullets":[["Fault","A defect or cause; it may remain dormant."],["Error","An activated fault can create an incorrect internal state."],["Failure","Delivered service deviates from what is required."],["Interruption","Detection, containment or recovery can stop this progression."]],"question":"Explain the difference between a dormant fault, an incorrect internal state and a visible service failure.","answer":"A fault is a defect or cause that may remain dormant. Activation can create an incorrect internal state—an error. A failure occurs when delivered service deviates from what is required. Detection, containment or recovery can interrupt the progression.","sourceRange":"","notes":"Teaching focus: Fault, error and failure. The sentence to make them write: most students write “the system failed because of a software error” and stop — that names two of the three terms and explains neither. The useful sentence names all three in order — this fault , reached under these conditions , put the system in this wrong state , which the user saw as this failure — and that is also the shape of a defensible incident report. Two minutes, and it is worth the two even though nothing here is new to a strong student — the weak half of the room has been using these three words as synonyms since first year, and the cost only shows up in the assignment. Do not read the tables aloud; that is what they are for. Instead ask one student to say tonight’s incident as the three-part sentence, and correct only the ordering. The second table is the one to point at when a student later writes “the system was unreliable” about an incident where the service stayed up: reliability and availability are different promises, and the right-hand column already says which one tonight actually threatens. This is a designated cut point: if behind, say the three-part sentence once and move on. The source ledger is at C01.","nodes":[["Fault","Defect or cause"],["Error","Incorrect state"],["Failure","Service deviates"]],"full":"<p>A fault is a defect or cause that may remain dormant. When activated, it can create an incorrect internal state: an error. A failure occurs when delivered service deviates from what is required. Detection, containment or recovery may interrupt this progression, so every fault need not become a visible failure.<\/p>","sourceStart":1},{"id":"X02A","title":"Avoid, detect and tolerate faults","phase":"LEARN","takeaway":"Dependability spans the whole lifecycle, including operation and recovery.","bullets":[["Prevent + discover","Avoid introducing faults; use verification and validation to find those remaining."],["Tolerate + protect","Continue despite some faults; resist attacks."],["Configure + recover","Fit the operating environment; restore service after failure."]],"question":"Name the six dependability moves, then choose the one that restores service after a failure.","answer":"Prevent, discover, tolerate, protect, configure and recover. Recovery restores service after a failure; tolerance aims to keep it operating while some faults occur.","sourceRange":"12–13","notes":"Teaching focus: Avoid, detect and tolerate faults. This slide is a visual compression of source pp.12–13, not an added framework. Keep the source verbs visible: avoid, discover, tolerate, guard/recognise, configure, recover. The grouping of the two cyberattack bullets under PROTECT is only for classroom readability; both original ideas remain explicit.","nodes":[["Prevent + discover","Reduce faults"],["Tolerate + protect","Limit disruption and attack"],["Configure + recover","Control change and restore"]],"full":"<p>Prevention reduces the faults introduced during development; verification and validation seek those that remain. Fault tolerance keeps service operating despite some faults, while protection resists attacks. Correct configuration fits the real environment. Recovery restores service after failure. Each technique addresses a different part of the lifecycle.<\/p>","sourceStart":12},{"id":"X03","title":"Sociotechnical systems and regulation","phase":"LEARN","takeaway":"The software is only one layer of the system.","bullets":[["Seven layers","Equipment → operating system → communications/data → applications → business processes → organization → society."],["Dependencies","Failures and changes cross layer boundaries."],["Limits","Correct software cannot fix every unsafe hand-over or shared dependency."],["Assurance scope","For regulated critical systems, the case supports approval of the sociotechnical system—not software alone."]],"question":"Trace the alarm from equipment through software to people and procedures. Why can a correct controller still be part of an undependable service?","answer":"A transmitter reading passes through communications and application software to an operator acting within procedures and organizational oversight. A controller can behave as specified while the sensor, interface, hand-over or procedure undermines the service. Investigate the interacting layers instead of attributing the failure to software alone.","sourceRange":"18–25","notes":"Teaching focus: Sociotechnical systems and regulation. Watch for traces that stop at Application system — exactly the mistake this chapter exists to correct. Push upward: does it reach Business processes, meaning the shift handover, and Society, meaning the regulator’s open file? Two traces aloud, no more.","nodes":[["Equipment","Physical operation"],["Software","Control decisions"],["People","Interpret and act"],["Organization","Rules and oversight"]],"full":"<p>The source stack runs from equipment through operating systems, communications/data and applications to business processes, organizations and society. Failures and changes cross these boundaries. A correct controller cannot compensate for every misleading interface, unsafe hand-over or shared dependency. Regulated critical systems need external approval supported by a safety/dependability case for the sociotechnical system—not only its software.<\/p>","figure":"assets/v3/ch10-layers.svg","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":18},{"id":"CHECK1","title":"Check 1 · recall before revealing","phase":"CHECK","takeaway":"A service is reachable but returns the wrong result. Which property failed?","bullets":[["Think","Answer from memory before the explanation."],["Pair","Explain a disagreement using the source."],["Record","Add the relevant reasoning to the same card."]],"question":"Think individually for 30 seconds, compare with a partner, then reveal the explanation.","answer":"Reliability failed. Availability alone says the service is accessible, not that the result is correct. Safety depends on whether the wrong result can cause harm.","sourceRange":"","notes":"","nodes":[],"full":"<p><\/p>","sourceStart":1},{"id":"R08","title":"Redundancy, diversity and common causes","phase":"LEARN","takeaway":"More copies help only against the failures they do not share.","bullets":[["Redundancy / diversity","Extra copies / different solutions—not guaranteed independence."],["Common cause","Shared power, requirements or assumptions can defeat every copy."],["Source comparison","Airbus uses redundancy and diversity; Boeing 777 has no software diversity."],["Trade-off","Diversity adds complexity; the source also describes simplicity with extensive V&V."]],"question":"Explain redundancy and diversity, then name one shared cause that could defeat both trains.","answer":"Redundancy adds copies or capacity; diversity makes their designs or solutions different. Neither proves independence. A shared pressure transmitter, shared power, or shared faulty requirements can defeat both trains. The case needs evidence about these dependencies, not just a count of copies.","sourceRange":"26–31","notes":"Teaching focus: Redundancy, diversity and common causes. Make a student argue the no-diversity position out loud. Most cannot, and that tells them their grasp of outcome 3 is a slogan rather than a capability. This is the antidote to the reflex that redundancy is always an improvement.","nodes":[["Redundancy","Extra capacity"],["Diversity","Different solutions"],["Shared cause","Can defeat both"]],"full":"<p>Redundancy provides extra copies; diversity makes the copies fail differently. Neither establishes independence by itself: shared power, requirements or assumptions can defeat every copy. The source contrasts two certified aircraft: Airbus flight control is redundant and diverse, while the Boeing 777 has no software diversity, and some engineers prefer simplicity plus extensive V&amp;V because diversity adds complexity.<\/p>","figure":"assets/v3/ch10-rd.svg","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":26},{"id":"X04","title":"The cost of dependability","phase":"LEARN","takeaway":"Spend on the failures whose consequences justify the extra assurance.","bullets":[["Cost","Higher dependability usually requires more engineering and assurance effort."],["Trade-off","Compare added cost with the consequences of failure."],["Curve limit","Qualitative—not a numerical target or break-even calculation."],["Decision inputs","Explicit service requirements, credible costs and residual risk."]],"question":"What information is missing before choosing a dependability target from this qualitative cost curve?","answer":"Specify the dependability property, service requirement, observation period and operating conditions, then obtain credible costs and failure consequences. The qualitative curve supplies neither a numerical target nor a break-even value. Do not infer a percentage from it.","sourceRange":"14–18","notes":"Teaching focus: The cost of dependability. If a student states a percentage, ask which page it is on. It is on none of them. This is where the class learns the difference between evidence and confidence, and it is the same discipline you apply to AI at activity R15. The closing line is from p.16 and bridges to activity R12.","nodes":[["Higher assurance","More effort"],["Residual risk","Still explicit"]],"full":"<p>Higher dependability usually requires more engineering and assurance effort. Compare that added cost with the consequences of failure in the actual service. This qualitative curve supplies neither a numerical target nor a break-even point. A defensible choice needs explicit service requirements, credible costs and the risk that remains.<\/p>","figure":"assets/v3/7b77c34e6cb8ac78.png","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":14},{"id":"X05","title":"Dependable processes and evidence","phase":"LEARN","takeaway":"Five distinct attributes—not five names for documentation.","bullets":[],"question":"Choose one process attribute and name an inspectable artifact that would support it in the plant case.","answer":"Choose the auditable-process row: request a dated change record linking the upgrade to its reviewed requirements, test results, independent reviewer and release decision. The filename, version and owner must let another engineer reconstruct how this specific release was approved.","sourceRange":"29; 32–39","notes":"Read each attribute as a different requirement on the process. Auditable concerns independent inspection; documentable concerns a defined process model and its records. Diverse requires different V&V activities. Robust concerns recovery when a process activity fails. Standardized concerns a comprehensive set of development standards. A source definition alone is not proof that a project followed it.","nodes":[["Specify","State obligations"],["Review","Find and resolve issues"],["Verify","Record the result"]],"full":"<p><\/p>","rows":[["Auditable","The process should be understandable by people apart from process participants, who can check that process standards are being followed and make suggestions for process improvement."],["Diverse","The process should include redundant and diverse verification and validation activities."],["Documentable","The process should have a defined process model that sets out the activities in the process and the documentation that is to be produced during these activities."],["Robust","The process should be able to recover from failures of individual process activities."],["Standardized","A comprehensive set of software development standards covering software production and documentation should be available."]],"heads":["ATTRIBUTE","MEANING"],"fullTable":true,"sourceStart":29},{"id":"R18","title":"Agile methods in dependable development","phase":"LEARN","takeaway":"Short iterations still need traceable safety and assurance evidence.","bullets":[["Keep iteration","Small changes, frequent feedback and automated checks."],["Keep assurance","Sufficient requirements, traceable evidence and controlled releases."],["Leave a record","What changed, what was verified and which assumptions remain."],["Boundary","Speed alone is not assurance."]],"question":"Name one agile practice you would keep, and the traceable record needed before releasing the change.","answer":"Test-first development or small reviewed changes can remain. Keep the relevant requirements, test results, change record and release decision linked to the same version. A planned rollback needs evidence that it was exercised, not merely described.","sourceRange":"32–39","notes":"Teaching focus: Agile methods in dependable development. Test-first is the practice that survives certification best, because it produces the artifact as a by-product rather than as extra work. Say that — it is the one thing on this slide students can use in their project next week. Then spend a full minute on the magenta card. The crisis that opened the hour was a deployment, and the room has spent seventy minutes arguing about the plant without once asking about the release that put them there. That is the most common mistake in industry as well as in the classroom: the failure gets attributed to the component that broke rather than to the change that exposed it. Three answers to look for — a change window with a named waiver authority, a revert that has been exercised and dated rather than documented, and a staged release that would have touched one train before both. A student who says “we would have tested more” has not answered; push for which of the three.","nodes":[["Small change","Bound the scope"],["Review and test","Inspect the evidence"],["Controlled release","Keep the record"]],"full":"<p>Agile iteration can support dependable development through small changes, frequent feedback and automated checks. Critical systems still need sufficiently complete requirements, traceable evidence and controlled releases. Documentation has a purpose: another reviewer must understand what changed, what was verified and which assumptions remain. Speed alone is not assurance.<\/p>","sourceStart":32},{"id":"CHECK2","title":"Check 2 · recall before revealing","phase":"CHECK","takeaway":"Two identical servers share the same faulty requirements. What does adding the second server protect against?","bullets":[["Think","Answer from memory before the explanation."],["Pair","Explain a disagreement using the source."],["Record","Add the relevant reasoning to the same card."]],"question":"Think individually for 30 seconds, compare with a partner, then reveal the explanation.","answer":"It can protect against some independent hardware failures. It does not remove a common specification or software fault. Identify the shared cause and justify any claimed independence.","sourceRange":"","notes":"","nodes":[],"full":"<p><\/p>","sourceStart":1},{"id":"X06","title":"Formal methods: four activities","phase":"LEARN","takeaway":"Make obligations precise before claiming that a program meets them.","bullets":[["Method","Use mathematical representation and analysis."],["Benefit","Expose inconsistencies early; fewer faults may reduce testing costs."],["Boundary","Precision still depends on stating the right requirements."]],"question":"Which activity checks the specification before code exists? Which checks a program against its specification?","answer":"Specification analysis and proof checks properties of the specification before implementation. Program verification checks the program against its specification. Neither answer, on its own, establishes that the original requirements captured every real-world need.","sourceRange":"40–44","notes":"Teach the four activities before comparing the two approaches on the next slide. Formal methods are based on mathematical representation and analysis. Keep the source terms: specification analysis and proof, transformational development, and program verification. Do not ask for model checking yet; it is introduced on X06B.","nodes":[],"full":"<p>Formal methods use mathematical representation and analysis. Writing a formal specification can expose inconsistencies and gaps early; the source describes fewer faults and possible reductions in testing costs. Precision still depends on stating the right requirements.<\/p>","rows":[["Formal specification","Express the system’s obligations mathematically."],["Specification analysis and proof","Check properties of the specification before implementation."],["Transformational development","Transform a specification toward an implementation through correct steps."],["Program verification","Prove that a program conforms to its specification."]],"heads":["ACTIVITY","MEANING"],"fullTable":false,"sourceStart":40},{"id":"X06A","title":"Two routes from specification to program","phase":"LEARN","takeaway":"Verify a relationship—or preserve it through each transformation.","bullets":[],"question":"A team keeps the specification and program separate and proves that they agree. Which approach is this, and how does refinement differ?","answer":"This is verification-based development. Refinement-based development instead builds a chain of correct transformations toward implementation. Both depend on the specification and assumptions; agreement with a specification does not show that every user need was captured.","sourceRange":"41; 45","notes":"Contrast proving a relationship between two representations with constructing a chain of justified transformations. These are the two source approaches, not alternatives to checking requirements with the problem owner.","nodes":[],"full":"<p><\/p>","approaches":[{"label":"VERIFICATION-BASED","title":"Prove that the representations agree","nodes":["Specification","Equivalence proof","Program"],"text":"A specification and an implementing program are separate representations. Prove that the program conforms to the specification."},{"label":"REFINEMENT-BASED","title":"Transform through correct steps","nodes":["Specification","Correct transformations","Lower-level program"],"text":"Systematically transform a representation into a lower-level one. Each correct transformation preserves equivalence."}],"fullTable":true,"extra":"In both routes, the specification and environmental assumptions still need justification.","sourceStart":41},{"id":"X06B","title":"Model checking—and what a proof does not establish","phase":"LEARN","takeaway":"A model can expose a violating trace; the real plant still needs evidence.","bullets":[["Model checking","Explore reachable states against a stated property, such as avoiding deadlock."],["Counterexample","A trace that violates the property."],["Model boundary","Does not establish sensor accuracy, complete requirements or safe operator behavior."],["Adoption limits","Stakeholder understanding, expertise, cost and scaling (source slide 45)."]],"question":"For the switch-over model, what would a counterexample show? Name one real-world assumption that the model cannot establish by itself.","answer":"A counterexample would show a reachable sequence violating the stated property—for example, both trains being unavailable while the model requires supply. That would challenge the modeled switch-over logic. Even without such a counterexample, sensor accuracy, a complete model of the environment, and actual operator behavior still require separate evidence. No model-checking run is claimed in this teaching example.","sourceRange":"43; 45","notes":"Define reachable states and counterexample before posing the task. The plant example is a course application, not a reported experiment. Retain the source’s adoption concerns: stakeholders may not be able to judge a mathematical specification, expertise and scaling are difficult, and costs and benefits are hard to balance. Source review contains the detailed historical discussion.","nodes":[["Model + property","State the claim precisely"],["Reachable states","Explore the possible behavior"],["Counterexample","A trace that violates the property"]],"full":"<p>Model checking explores the model’s reachable states for a stated property, such as avoiding deadlock. A violating trace is a counterexample. A result about the model does not establish sensor accuracy, complete requirements or safe operator behavior. The source also highlights limits in stakeholder understanding, expertise, cost and scaling (slide 45).<\/p>","sourceStart":43},{"id":"APPLY","title":"Apply it · defend one bounded decision","phase":"APPLY","takeaway":"A bounded decision requires evidence, not only an opinion.","bullets":[["Claim","State what can be justified now."],["Evidence","Name a real source or the supplied case observation."],["Boundary","Identify what is unknown and what would change the decision."]],"question":"Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.","answer":"One defensible request is an independently verified pressure reading matched to the alarm and switch-over log. It helps distinguish a real pressure excursion from a sensor fault. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.","sourceRange":"","notes":"","nodes":[["Claim","Specific and bounded"],["Evidence","Inspectable"],["Verdict","Owned and conditional"]],"full":"<p><\/p>","sourceStart":1},{"id":"CHALLENGE","title":"iSCARB checkpoint: revise, verify, own","phase":"CHECK","takeaway":"Two nominally separate readings use the same transmitter and power supply.","bullets":[["New information","Two agreeing readings share a single transmitter."],["Reassess","Agreement is not independent evidence."],["Own","Keep the revision, next check and responsible role."]],"question":"Revise one sentence, explain the change to a partner, and keep your response. This is required classroom practice, not a new graded submission.","answer":"The two readings share one cause, so agreement cannot establish independence. A defensible revision is to withhold an unqualified approval and request an independently verified pressure reading matched to the logs. Name the observation that could change that decision and a human reviewer. When AI is used, its draft is not completed verification evidence. Other bounded decisions can be defensible if their assumptions and limits are explicit.","sourceRange":"","notes":"Use this short checkpoint to enact the methodology without adding twenty mandatory activities. It applies the supplied shared-transmitter case and Rules 09, 15 and 17. Do not add a new grade or deadline; the LMS remains the authority for the assignment.","nodes":[["Initial assumption","Two independent readings"],["New evidence","One shared transmitter"],["Revision","Bound the claim"]],"full":"<p><\/p>","sourceStart":1},{"id":"END","title":"Dependable Systems","phase":"CHECK","takeaway":"","bullets":[],"question":"","answer":"","sourceRange":"","notes":"Finish with self-check, required source review and the after-class assignment.","nodes":[],"full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Which evidence separates a real pressure excursion from a sensing fault?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test.","no":1,"at":"CHECK1","seconds":180},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case.","pair":"Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design.","no":2,"at":"CHECK2","seconds":180},{"title":"Change the constraint; revise and own","think":"Two nominally separate readings use the same transmitter and power supply.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; name the responsible role.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"CHALLENGE","seconds":180}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["R08"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["R08","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets
