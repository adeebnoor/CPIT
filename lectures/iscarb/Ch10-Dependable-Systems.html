ple line, because a rule that demands a name is dangerous without it.</b> Ownership and blame are opposites and teams confuse them constantly. If being named is how the organisation decides who is at fault, then the rational move is to avoid being named &mdash; and within a year nobody reports the near-misses that would have shown you the failure while it was still cheap. The name answers <i>whose decision was this, and where is the reasoning recorded</i>; when it goes wrong the question is what let a reasonable person decide that, not who to replace. This is exactly the Rule 14 sentence about the operator, turned on the engineer, and if you skip it you have taught the room to hide.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about a system in the section of the source that answers it.", "title": "What Chapter 10 trains you to do", "sub": "Six questions the plant cannot answer tonight. Each one is a section of the chapter — and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "DEPENDABILITY", "txt": "Can it be trusted?", "src": "P1 · p.3"}, {"c": "sand", "lab": "FAILURE CAUSES", "txt": "Where does failure start?", "src": "P1 · p.5"}, {"c": "teal", "lab": "SOCIOTECHNICAL", "txt": "How far does it reach?", "src": "P1 · p.19"}, {"c": "sand", "lab": "REDUNDANCY / DIVERSITY", "txt": "What do we add, and at what cost?", "src": "P1 · p.27"}, {"c": "teal", "lab": "DEPENDABLE PROCESS", "txt": "What proves it was built well?", "src": "P1 · p.32"}, {"c": "sand", "lab": "FORMAL METHODS", "txt": "What can actually be proved?", "src": "P1 · p.40"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Ninety seconds, two answers, no more. Most students pick formal methods because it sounds hardest; the chapter&rsquo;s own answer is sociotechnical. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition — and every one of these is something you will do to the plant in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Explain dependability as trust across availability, reliability, safety, security and resilience."}, {"c": "teal", "lab": "2", "txt": "Trace a failure across technical and sociotechnical layers."}, {"c": "teal", "lab": "3", "txt": "Compare redundancy, diversity, process and formal-method options, and name the trade-off."}, {"c": "mag", "lab": "4", "txt": "Build a bounded verdict with inspectable evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when a constraint changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone — the artifact every other outcome feeds. Colouring all five differently made them read as five unrelated topics.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: an attractive answer is accepted without an inspectable artifact. JUDGMENT then fails because the team cannot show what supports the decision or what would reverse it.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing a failure from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Separate hardware, software and operational failure.", "src": "Rule 05 · X02"}, {"c": "mag", "lab": "", "txt": "Accept, revise or reject the upgrade.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Name an artifact, not an intention.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the failure up the sociotechnical stack.", "src": "X03"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A city drinks what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them, so the eye pairs each card with its capability. Recolouring them breaks the pairing, which is the only reason the diagram is there.", "task": "Which capability fails first when a team trusts an attractive answer without evidence?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE — an attractive answer fails not because nobody analysed it but because nobody made it inspectable. Do not give the answer; let two students argue it for thirty seconds.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: Availability is the promise to the city. It holds only if train B actually takes over within the stated window, AND nobody has measured switch-over time under peak load. The prediction is bounded by the missing measurement, not by the design.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which property fails first tonight?", "picker": {"g": "predict", "options": ["Avail.", "Rel.", "Safety", "Sec.", "Resil."]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. peak demand, no revert window, regulator file open"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment gateway, not from tonight:</i> &ldquo;This holds only if the retry queue drains faster than new requests arrive. If it does not, the queue is the thing that fails, not the payment service &mdash; and nobody has measured the drain rate under holiday load.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unmeasured</b>."}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the five property names &mdash; you have not met them yet. Start from the room. It is 22:14 at peak demand and the operator silenced a repeating alarm at handover to read the log. Ask what the plant promises the city, and which promise breaks first tonight. Then say which property that promise belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;. If you cannot finish it, the box that is actually empty is CONSTRAINT: name what stops you choosing differently tonight.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move; splitting them across two slides would let a student predict without deriving, which is the failure this rule exists to prevent.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes; one colour makes it read as four parallel boxes rather than four steps.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Three minutes. The DERIVE box is the one students skip — walk the room and refuse an empty one. This whole rule collapses if you reveal the source figure first; the reveal is the next slide and not a second earlier.", "appendix": true, "route": "toolkit"}, {"k": "H01", "noAnswer": true, "rule": "HELPER - while DERIVE needs development", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a blank derivation into a question they can answer, by starting from the situation rather than the vocabulary.", "showIf": {"thin": ["f:p_derive"], "minKey": "coachDeep"}, "title": "Three questions instead of the answer", "sub": "This slide is here because your derivation box is still blank, or holds a single clause. It does not contain the answer &mdash; the reveal is the next slide and it is worth more to you if you commit first.", "badge": {"c": "", "t": "SCAFFOLD", "s": "appears only if you need it"}, "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 &nbsp; WHAT IS PROMISED", "lead": "Which promise to the city breaks first tonight?", "txt": "A desalination plant promises a city drinkable water, continuously, without hurting anyone. Say which of those three promises tonight&rsquo;s alarms threaten first &mdash; and you have named the property without needing its textbook name."}, {"c": "sand", "lab": "2 &nbsp; WHO IS AWAKE", "lead": "A property that depends on someone noticing behaves differently at night.", "txt": "It is 22:14. One operator silenced a repeating alarm at handover so he could read the log. Ask what that tells you about how the failure will be <i>noticed</i>, not about how it starts. A property that depends on someone noticing behaves differently at night."}, {"c": "mag", "lab": "3 &nbsp; WHAT WOULD CHANGE YOUR MIND", "lead": "Finish the sentence &ldquo;I would drop this if I saw &hellip;&rdquo;.", "txt": "Finish this sentence: &ldquo;I would drop this prediction if I saw &hellip;&rdquo;. Whatever you put after &ldquo;if I saw&rdquo; is your constraint, and the reason it holds is your derivation. Write that sentence in the boxes on the previous slide."}]}, {"t": "principle", "c": "mag", "txt": "A blank box is not a gap in knowledge. It is usually a question asked at the wrong altitude."}], "timebox": "90 sec", "task": "Answer any one of the three out loud, then press &larr; and finish DERIVE properly. This slide stops appearing once DERIVE meets the shared scaffolding threshold; the instructor still checks the reasoning.", "notes": "You will usually not see this slide at all &mdash; it renders while DERIVE falls below the same scaffolding threshold used by the R05 coach, so it is the engine noticing that the room is stuck rather than you deciding in advance that it will be. Do not read all three questions aloud. Pick the one that matches what you saw while walking the room: question 1 for students who cannot start, question 2 for students who have written a property name with no reasoning under it, question 3 for students who wrote a confident sentence with nothing that could falsify it. Ninety seconds, then send them back. If you are behind, skip it and walk the room instead &mdash; the questions work spoken.", "appendix": true, "route": "toolkit"}, {"k": "QA1", "noAnswer": true, "rule": "RETRIEVAL LOOP - Understand", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the phase&rsquo;s load-bearing moves from memory: the evidence request, the chapter&rsquo;s six questions, the outcome currency and the four parts of the prediction gate.", "title": "Sixty seconds on Understand", "sub": "Before the source expansion opens: four questions, memory first. Reveal only to check, then score yourself honestly.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 01 &middot; 02 &middot; 03 &middot; 05", "items": [{"q": "It is 22:14 and the alarms are repeating. Name the one evidence request that separates a real pressure excursion from a transmitter fault.", "a": "An independently verified reading &mdash; a second measurement matched against the alarm and switch-over log. Until it exists the decision stays bounded: hold or revert, with a named owner and a condition for resuming operation."}, {"q": "Chapter 10 trains you to answer six questions about any system. Say any four.", "a": "Can it be trusted (dependability)? Where does failure start (failure causes)? How far does it reach (sociotechnical)? What do we add, and at what cost (redundancy / diversity)? What proves it was built well (a dependable process)? What can actually be proved (formal methods)?"}, {"q": "All five outcomes of this hour end in the same currency. What is it?", "a": "Evidence, not recognition &mdash; and outcome 4 is the one the others feed: a bounded verdict with inspectable evidence."}, {"q": "The prediction gate makes you commit to four things before the reveal. Name all four.", "a": "PREDICT the property &middot; state the CONSTRAINT &middot; DERIVE it from first principles &middot; NAME the principle used &mdash; then sign, so the reveal costs something."}]}], "timebox": "60 sec", "task": "Cover the answers. Say all four out loud from memory before you reveal anything &mdash; then score yourself honestly.", "notes": "Sixty seconds on the ring, and hold the discipline that makes retrieval work: the answer must come from memory, spoken or written, before any reveal. The four questions are the phase&rsquo;s load-bearing moves, not a quiz &mdash; a miss on question 1 means Rule 01 needs one more pass before the source expansion assumes it. The self-score is private and deliberately blunt: two honest misses beat four nodding yeses, and saying that once out loud is what makes the scoring honest.", "appendix": true, "route": "toolkit"}, {"k": "QA2", "noAnswer": true, "rule": "RETRIEVAL LOOP - Source", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the probability/judgment split, the largest single failure cause, the fault-error-failure chain and the dependency between the properties.", "title": "Sixty seconds on the source foundations", "sub": "Checkpoint before the rest of Chapter 10: four questions from the first source cluster &mdash; memory first, reveal second.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "X01 &middot; X02 &middot; X07", "items": [{"q": "Two dependability properties are probabilities; three are judgments. Which are which?", "a": "Availability and reliability are probabilities &mdash; measure them. Safety, security and resilience are judgments &mdash; argue them to a threshold someone else accepts."}, {"q": "Which failure class is now perhaps the largest single cause in sociotechnical systems &mdash; and what is the design answer?", "a": "Operational failure: human operators make mistakes (p.5). The design answer is error tolerance (p.10) &mdash; the operator who silenced the alarm is a finding, not a discipline problem."}, {"q": "One transmitter feeds both trains. Say tonight&rsquo;s incident as the three-part sentence: fault, error, failure.", "a": "The shared transmitter is the <b>fault</b> &mdash; a defect doing nothing yet. The controller believing the pressure is high on both trains is the <b>error</b>. The unnecessary switch-over that interrupts the promised supply is the <b>failure</b>."}, {"q": "Why can you never certify one property on its own?", "a": "The properties depend on each other (p.11): safe operation needs availability and reliability; an attack that corrupts data makes the system unreliable; denial of service makes it unavailable."}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop, now over the first source cluster. Question 3 is the one that pays all semester &mdash; the three-part sentence is the shape of a defensible incident report, and the notes on X07 carry the correction script if a student orders it wrong. If the room misses question 1, do not reteach it here: name it, and let the principle line on X01 do the work on the next pass. Sixty seconds, then move.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: a release causes repeated service outages. CRISIS: users lose access. MAP: trace the release, database, operations team and users. TRADE-OFF: rollback restores the old version but delays the fix. EVIDENCE: compare error logs, deployment records and recovery tests. VERDICT: roll back under a named owner, monitor recovery and define the evidence needed before redeployment.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source mechanisms into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies mechanisms; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "Alarms during a live upgrade on a public water supply."}, {"c": "teal", "lab": "2 MAP", "txt": "Equipment, software, operators, organisation, regulator."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Redundancy and diversity against complexity and cost."}, {"c": "violet", "lab": "4 EVIDENCE", "txt": "Test records, operator logs, a named sign-off."}, {"c": "green", "lab": "5 VERDICT", "txt": "Continue, hold, revert — bounded, with a monitor."}]}, {"t": "principle", "txt": "Predict -&gt; Constraint -&gt; Derive -&gt; Name"}], "timebox": "2 min", "hueOk": "CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide and in every later reference. This is the one place the palette is a vocabulary.", "task": "Use the flow to explain a failure you already know from software engineering.", "notes": "Two minutes in pairs. Their examples will be outages they have lived through. Insist that step 4 names an artifact — this is the rehearsal for Rule 07.", "appendix": true, "route": "toolkit"}, {"k": "R07", "answer": "Example claim: automatic operation is acceptable only after the backup path has been verified under the stated load and failure conditions. Counter-evidence: both trains use the same transmitter, or the recorded failover test excludes peak demand. Either observation would prevent the current evidence from supporting that claim.", "rule": "RULE 07 - Decision card", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Build a decision card a stranger could audit without hearing them explain it.", "title": "Your minimum inspectable artifact", "sub": "A good classroom answer can be audited without your oral explanation.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM", "field": {"id": "dc_claim", "core": true, "rows": 3, "ph": "What are you saying? e.g. loss of train A creates no safety event inside the operating envelope", "ex": "<i>Hospital case:</i> The infusion pump firmware may ship to the two pilot wards, but not hospital-wide."}}, {"c": "sand", "lab": "EVIDENCE", "field": {"id": "dc_evidence", "core": true, "rows": 3, "ph": "What supports it? Name an artifact with a date and an owner", "ex": "<i>Hospital case:</i> The 14 March bench-test report, signed by the biomedical lead, covering the two pump models the pilot wards actually hold."}}, {"c": "violet", "lab": "WARRANT", "field": {"id": "dc_warrant", "core": true, "rows": 3, "ph": "Why does that evidence support that claim?", "ex": "<i>Hospital case:</i> Because the report tested the exact models in those wards &mdash; so it supports a claim about those wards, and nothing wider."}}, {"c": "mag", "lab": "COUNTER-EVIDENCE", "field": {"id": "dc_counter", "core": true, "rows": 3, "ph": "What would defeat it?", "ex": "<i>Hospital case:</i> A single unlogged incident on either pilot ward would defeat it &mdash; and nobody has checked whether ward incident logs were kept during the test window."}}, {"c": "green", "lab": "UNCERTAINTY", "field": {"id": "dc_uncert", "core": true, "rows": 3, "ph": "What remains unknown?", "ex": "<i>Hospital case:</i> Whether night-shift staffing changes how the alarm is answered. Not tested, and it could change the verdict."}}, {"c": "teal", "lab": "VERDICT", "field": {"id": "dc_verdict", "core": true, "rows": 3, "ph": "Approve / revise / reject — and on what condition?", "ex": "<i>Hospital case:</i> Approve for the two pilot wards only, on condition that ward incident logs are reviewed weekly and the wider rollout returns for a second decision."}}]}], "loadOk": "Six fields, one artifact. The card is a single object and its shape is the lesson &mdash; a student who meets CLAIM and EVIDENCE on one slide and COUNTER-EVIDENCE on the next learns that counter-evidence is optional. It is filled across the whole hour, not in this timebox.", "timebox": "2 min", "hueOk": "The six colours are the six sections of one artifact, and the student learns to find COUNTER-EVIDENCE by its colour for the rest of the hour. Flattening them makes the card read as a wall of six identical boxes.", "task": "Write one claim and one piece of counter-evidence for the same decision. Press C at any time to see your card.", "notes": "The commonest failure is an EVIDENCE box that names an intention — &ldquo;we will test thoroughly&rdquo; — instead of an artifact. When you see it, ask only: what is its filename? This card is the spine of the session; every later rule adds a section to it.", "appendix": true, "route": "toolkit"}, {"k": "QA3", "noAnswer": true, "rule": "RETRIEVAL LOOP - Practise", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the six card slots, the sociotechnical reach, the falsification standard and the anatomy of a monitor.", "title": "Sixty seconds on the decision flow", "sub": "Application checkpoint: recall the artifact you have built so far before transfer and defense continue.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 07 &middot; 09 &middot; 10 &middot; X03", "items": [{"q": "The decision card has six slots. Name them in order.", "a": "CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &middot; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it."}, {"q": "A failure trace that stops at Application system has made which mistake?", "a": "It never reached the layers where tonight&rsquo;s failure actually lives: Business processes &mdash; the handover that allowed the alarm to be silenced &mdash; and Society &mdash; the regulator&rsquo;s open file."}, {"q": "What must a claim state so the evidence can prove it wrong?", "a": "The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending."}, {"q": "Turn &ldquo;we are not sure about the switch-over time&rdquo; into a monitor.", "a": "A measured quantity, an observation window, a trigger value, a named owner and a fallback action &mdash; the unknown becomes a monitored risk, and the 3&times;3 grid was only its evaluate step."}]}], "timebox": "60 sec", "task": "Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.", "notes": "The practise loop points at the artifact, not at trivia: every question here is a slot or a standard the decision card must carry. Question 4 is the quiet one to watch &mdash; a monitor without a trigger value and an owner is a decision to look away slowly, and that was Rule 10&rsquo;s whole point. If a student cannot name all six slots, the card they will defend at Rule 17 is missing walls; send them to C for ninety seconds, not to the slides.", "appendix": true, "route": "toolkit"}, {"k": "R11", "rule": "RULE 11 - Micro-case -> local case", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Reuse one mechanism-evidence-boundary chain in a different domain, and say what transfers and what breaks.", "title": "Scaffold first, then transfer", "sub": "Use the same mechanism-evidence-boundary chain twice — and the second time in a different domain.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MICRO-CASE — ISCARB SCAFFOLD", "txt": "Two redundant pumps are fed by one pressure transmitter on one loop. The backup switches automatically when the transmitter reports overpressure. What assumption fails, and what makes the two paths genuinely independent?", "field": {"id": "micro", "core": false, "rows": 3, "ph": "The failed assumption, and the independence you would need"}}, {"c": "mag", "lab": "TRANSFER — THE WEEK 01 HOSPITAL CASE", "txt": "Medical-device software passes all its tests, but organisational sign-off is weak. Run the same chain: which sociotechnical layer blocks approval, and does your desalination reasoning survive the change of domain?", "field": {"id": "transfer", "core": false, "rows": 3, "ph": "The blocking layer, and what transfers or breaks between the two domains"}}]}, {"t": "wide", "c": "violet", "ic": "pin", "tag": "{{flag}} &nbsp;{{localTag}}", "lab": "WHY BOTH CASES ARE LOCAL", "lead": "The evidence has a named destination — and that is what takes &ldquo;accept the failure cost&rdquo; off the menu.", "txt": "Desalination and hospital software are both regulated public services in {{country}}. {{accreditor}} links the field to {{bodies}}. That makes dependability a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording."}, {"t": "principle", "txt": "Mechanism -&gt; Evidence -&gt; Decision boundary"}], "timebox": "1 min + 3 min", "task": "Solve the micro-case, then reuse the same reasoning chain on the Week 01 hospital case, and name which of {{bodiesShort}} receives your evidence. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about pumps has learned a case, not a capability. The hospital case is the one they met in the kickoff, so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.", "appendix": true, "route": "toolkit"}, {"k": "R13", "rule": "RULE 13 - Breaking variable", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name the variable whose change would reverse their own verdict.", "title": "What change would break your solution?", "sub": "A robust answer exposes the variable that can reverse it.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "sand", "lab": "STAFFING", "txt": "One qualified reviewer instead of three; the night shift runs with a trainee."}, {"c": "sand", "lab": "DEADLINE", "txt": "The production window closes tonight; reverting costs a full day of supply."}, {"c": "sand", "lab": "DATA", "txt": "The commissioning test data turns out to be from a different firmware baseline."}, {"c": "sand", "lab": "REGULATION", "txt": "The regulator requires new evidence before the plant can run unattended."}]}, {"t": "raw", "html": "<div class=\"picker\" data-pick=\"breaker\"><button class=\"pick\" data-v=\"Staffing\" aria-pressed=\"false\">Staffing</button><button class=\"pick\" data-v=\"Deadline\" aria-pressed=\"false\">Deadline</button><button class=\"pick\" data-v=\"Data\" aria-pressed=\"false\">Data</button><button class=\"pick\" data-v=\"Regulation\" aria-pressed=\"false\">Regulation</button></div>"}, {"t": "pair", "id": "r13", "t1": "30 sec", "t2": "60 sec", "t3": "30 sec", "think": "Pick your variable and decide, silently, whether your verdict survives it.", "pair": "Swap variables with your neighbour and argue <i>their</i> variable against <i>your</i> verdict.", "share": "Hands up: whose verdict survived all four? That room is the one to question."}, {"t": "principle", "c": "mag", "txt": "If the verdict never changes, you probably have not named the real variable."}, {"t": "recall", "i": 0}], "timebox": "2 min", "task": "Pick one variable and state exactly how it would reverse your current verdict — then answer the question underneath from memory.", "notes": "Any student whose verdict survives all four has either designed something remarkable or has not committed to a verdict — almost always the second. This is the rehearsal for the live defense at Rule 17.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> decides, the <b>evidence owner</b> verifies, the <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What is a breaking variable?", "a": "The variable whose change would reverse your verdict &mdash; staffing, deadline, data baseline, regulation. If your verdict survives all four, you have not named the real one."}, {"q": "Your design adds four signed exception forms per shift. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. standing pre-approval below a stated risk band, a weekly batch instead of a queue."}, {"q": "Where may AI sit in the assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts, searches, checks. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense, so it rehearses the four moves the defense will press: ownership, the breaking variable, workload and the AI gate. Question 3 wants a design change, not sympathy &mdash; the same test Rule 14 itself applies. Question 4 is deliberately the exact sentence from the flow: AI prepares, never owns, a human signs &mdash; if the room can say that sentence cold, Rule 15 landed.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks — the mark follows the level.", "badge": {"c": "", "t": "READINESS", "s": "the gate is at Rule 20"}, "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "violet", "lab": "L1 &nbsp; ASSERTING", "lead": "A verdict with nothing behind it.", "txt": "States a verdict. Names no artifact, no counter-evidence, no owner. Right or wrong, it cannot be audited."}, {"c": "teal", "lab": "L2 &nbsp; REASONING", "lead": "The mechanism, cited — but nothing to inspect.", "txt": "Explains the mechanism from the source and cites the page. Still no artifact a stranger could inspect."}, {"c": "sand", "lab": "L3 &nbsp; JUSTIFYING", "lead": "A dated, owned artifact, and a stated way to be wrong.", "txt": "Names a dated, owned artifact, states what would falsify the claim, and bounds the residual risk."}, {"c": "green", "lab": "L4 &nbsp; ACCOUNTABLE", "lead": "L3, and it survives the constraint changing.", "txt": "All of L3, and the verdict survives a changed constraint — or the student explains exactly why it changes, and who re-signs."}]}, {"t": "levels"}, {"t": "wide", "c": "mag", "lab": "READINESS IS A GATE, NOT A LEVEL", "lead": "A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.", "txt": "Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight — LO1, 5 marks, {{assignmentDue}} — and its evidence policy is the same one: cite the source page, or mark the claim <i>unmeasured</i> with the measurement you would need."}], "hueOk": "Four levels on one rail, each with its own colour, is the scale itself — a two-colour version stops reading as an ordered ladder.", "timebox": "90 sec", "cut": true, "task": "Pick the level you think you are at, then read the line under it: it says what your card actually carries.", "notes": "The picker is self-assessment; the line under it is read from the boxes the student actually filled and cannot be talked up. Point at the gap between the two — it is always a specific empty box, which is why this is a teaching instrument rather than a mark. The semester grade weights belong to the Week 01 kickoff and repeating them here wastes ninety seconds — this slide answers the only question that matters tonight: what separates a weak answer from a defensible one in THIS chapter. Make each student name their own level out loud; most say L2 and are right, and the honesty is the point. Keep formal scoring off the live slide, as the peer-review rule requires. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constraint will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State architecture + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constraint changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the mechanism"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed evidence"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE — PICK ONE", "picker": {"g": "mutation", "options": ["It is a hospital oxygen plant", "The regulator withdraws approval mid-shift", "Budget halves: one lever only", "Train B is three years older"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses — and why"}}, {"t": "principle", "txt": "A strong design either survives mutation — or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses — stronger than a verdict that magically survives everything. Refusing to revise under a changed constraint is not robustness; it is not having reasoned in the first place.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the claim without trusting your explanation, or the AI or tool that prepared it?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card — your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the variable, counter-example, missing evidence or failure condition that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card — your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session — two questions only, which is precisely why the formal rubric stays off the live slide. Students who cannot answer Q1 about someone else&rsquo;s card usually discover the same gap in their own. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 1, 2. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line. Keep the instruments visible in sequence; use vertical scrolling for expansion.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, test and challenge, with a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use evidence and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "B01", "answer": "Illustrative project row: Requirement — the standby train must take over within an approved limit. Implementation — use independent sensing and a tested failover path. Tool — a controlled fault-injection test with timestamped measurements. Evidence — a dated failover-test-results.csv, linked to the requirement and reviewed by a named engineer. The last item names the file that must be produced; it does not claim the test has already passed.", "rule": "B01 - From requirement to something you can build", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a dependability requirement into a named mechanism, a concrete build, a tool that does it, and the artifact that proves it.", "title": "You decided. Now what do you actually build?", "sub": "The chapter names the property and the mechanism, then stops. This is the rest of the sentence.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "not in the chapter — that is the gap"}, "blocks": [{"t": "bridge"}, {"t": "wide", "c": "mag", "lab": "YOUR TURN — ONE ROW FOR YOUR OWN PROJECT", "field": {"id": "bridge_own", "core": true, "rows": 1, "ph": "Requirement &rarr; mechanism &rarr; what you build &rarr; the tool &rarr; the artifact a reviewer could open"}}], "loadOk": "One field, but the table above it is five parallel readings the student scans rather than answers; splitting it would break the comparison that makes the pattern visible.", "hueOk": "Each row is colour-matched to its property on X01 and X07 so the student recognises the same five things a third time — the colour is the index, not decoration.", "timebox": "3 min", "task": "Write one complete row for your own project. If the last cell is a promise rather than a file, the row is not finished.", "say": "Everything so far taught you to decide. This slide is the one that tells you what to type on Monday.", "notes": "Three minutes, and it is the slide students will thank you for. Two things to say and one trap to avoid. First: the tools are examples of <i>categories</i> &mdash; say that out loud, because a student who writes down &ldquo;SonarQube&rdquo; and not &ldquo;static analysis in the pipeline&rdquo; has learned a brand instead of a move, and brands change. Second: the last column is the whole reason this slide is allowed to exist in this course. A tool list is a magazine article; a tool list that ends in an artifact a reviewer could open is engineering, and it is the same discipline as Rule 09 two slides later. The trap: someone will ask which tool is best. Refuse the question and hand it back &mdash; best for what requirement, at what cost, with what evidence? That is Rule 08 and X04 again, and the fact that they can now ask it about a real tool rather than an aircraft is the measure of whether the hour worked. Walk the room during the field: the giveaway is a last cell that says &ldquo;we will test it&rdquo;, which is exactly the empty EVIDENCE box from Rule 07 wearing different clothes.", "appendix": true, "route": "toolkit"}, {"k": "R14", "rule": "RULE 14 - Practitioner workload", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name a workload cost their design creates for a practitioner, and the design change that reduces it.", "title": "Engineering changes human work", "sub": "A safe design can still fail operationally if it creates unsustainable workload.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "DOCUMENTATION BURDEN", "lead": "Who writes and maintains all of it?", "txt": "What must be produced, reviewed and maintained? &ldquo;It can be as expensive to develop the documentation for certification as it is to develop the system itself.&rdquo;", "src": "P1 · p.25"}, {"c": "sand", "lab": "REVIEW WORKLOAD", "txt": "Who validates evidence, exceptions and changes — and do they have the hours the process assumes?"}, {"c": "mag", "lab": "DELIVERY SPEED", "txt": "What schedule pressure is the team absorbing, and what does it push them to skip?"}, {"c": "violet", "ic": "spark", "lab": "WHO WRITES IT NOW", "lead": "Generated work moves the load; it does not remove it.", "txt": "Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing more that they did not write. Volume against attention: the silenced alarm again."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT, THIS IS THE MECHANISM — NOT A FOOTNOTE", "lead": "Blaming the operator ends the investigation. Workload as a design input continues it.", "txt": "The operator silenced a repeating alarm at shift handover in order to read the log. That is alarm load, shift timing and cognitive load acting as a system variable. The source calls operational error perhaps the largest single cause of failure in socio-technical systems (p.5), and offers error tolerance as the design response (p.10). Blaming the operator ends the investigation; treating workload as a design input continues it.", "field": {"id": "workload", "core": false, "rows": 2, "ph": "One workload cost your design creates, and the concrete design change that reduces it", "ex": "<i>Shape only:</i> &ldquo;My design adds a signed exception form per deviation. With generated drafts the team now files four times as many, so the reviewer becomes the bottleneck. Design change: exceptions below a stated risk band get a standing pre-approval, and the reviewer sees a weekly batch instead of a queue.&rdquo;"}}, {"t": "principle", "txt": "Trade-offs include people, process, evidence and time — not only code."}], "timebox": "90 sec", "task": "Name one workload cost your preferred design creates for a real practitioner, and the design change that reduces it.", "notes": "The rule with no equivalent in the textbook, and where ISCARB differs from a standard software-engineering lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change &mdash; alarm rationalisation, a handover protocol, a second pair of eyes on the night shift. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b> Every student in the room is already using generated code, and almost none of them has been asked what it did to the review load rather than to the writing load. Two things to say. First, the honest framing: the tool did not remove the work, it moved it &mdash; from writing, which is visible and estimated, to reviewing, which is neither. Second, connect it to the crisis: the operator silenced the alarm because there were too many alarms for the attention available, and a reviewer who approves without reading is the same failure with a keyboard. If a student answers &ldquo;it just makes us faster&rdquo;, ask who reviews the faster output and how many hours they have.", "appendix": true, "route": "toolkit"}, {"k": "X08", "answer": "Illustrative target, not a measured result or a value from the chapter: Monitor switch-over time on train B. Target: under 8 seconds, checked for each switch-over during a 7-day observation window. If the target is missed, alert the on-call engineer, invoke the agreed fallback procedure and re-test before returning to automatic operation. The target and fallback require approval for the actual system.", "rule": "X08 - The same ideas, the other vocabulary", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Say the dependability idea they have just used in the vocabulary a services team would use for it.", "title": "You already know these. You may not know their other names.", "sub": "Left column: what this chapter calls it. Right column: what the same argument is called where most of you will work. Same idea, different room.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "not in the chapter &mdash; the chapter predates the vocabulary"}, "blocks": [{"t": "compare", "head": ["In this chapter", "Where most of you will work", "What the second one adds"], "rows": [{"c": "teal", "cells": ["Availability, as a property", "A service level objective &mdash; a stated target over a stated window", "A number and a period, so the argument stops being about whether it is available and starts being about whether the target was met"]}, {"c": "teal", "cells": ["The cost curve rising steeply (X04)", "An error budget &mdash; the failure the target permits, spent deliberately", "It makes the trade-off a resource you allocate rather than a virtue you claim"]}, {"c": "sand", "cells": ["A monitor with a trigger value and an owner (Rule 10)", "An actionable alert", "The rule that an alert nobody acts on is deleted, not tuned"]}, {"c": "sand", "cells": ["Fault, error, failure (X07)", "The incident, and the post-incident review that follows it", "A written review with an owner and follow-up actions &mdash; the artifact this course keeps asking for"]}, {"c": "mag", "cells": ["Blaming the operator ends the investigation (Rule 14)", "A blameless review", "It is a rule with a procedure, not a value with a poster"]}, {"c": "violet", "cells": ["Redundancy and diversity (Rule 06, B01)", "Staged release, and limiting how much one change can touch", "It moves the defence from the failure to the change that causes most of them"]}]}, {"t": "wide", "c": "violet", "lab": "ONE LINE, IN THE OTHER VOCABULARY", "field": {"id": "vocab_own", "core": false, "rows": 1, "ph": "Take the monitor you wrote in Rule 10 and state it as a target, a window, and what happens when it is missed"}}], "hueOk": "Colours carry over from X07 and B01 so the student recognises which family each row belongs to; the row is a translation, and the colour is what says of what.", "timebox": "90 sec", "cut": true, "task": "Read the middle column. Then restate your own Rule 10 monitor in it.", "say": "Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.", "notes": "Ninety seconds, and resist expanding it &mdash; the point is recognition, not instruction. Two things worth saying. First, the honest history: this chapter was written before the vocabulary in the middle column existed as a discipline, so the gap is chronological rather than a disagreement, and the concepts map almost one to one. Second, the direction of the translation matters: a student who learns only the middle column can run a dashboard and cannot argue a certification, while a student who has both can do both, which is the actual advantage this degree gives them. If someone asks which vocabulary is right, the answer is the room you are in &mdash; a regulator will not accept an error budget and a service team will not accept a hazard log, and knowing which is which is the skill. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R15", "answer": "<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>", "rule": "RULE 15 - AI assist + human sign-off", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.", "title": "AI prepares evidence; humans own assurance", "sub": "AI is permitted for preparation, never for unowned approval.", "badge": {"c": "mag", "t": "AI MOMENT", "s": "assist, not assurance"}, "blocks": [{"t": "aiflow"}, {"t": "aigate"}], "timebox": "90 sec", "task": "Run the gate on the way you actually used AI this week — on a real output, not a hypothetical. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "The gate is the rule, not the three stations above it — make every student run it on something they really did this week, not on a hypothetical. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second &mdash; which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. It means the artifact you file is the test you ran and what it showed, never the prompt or the answer. A student who cannot say which of the two middle questions their own use passed has not yet understood what they filed. The remaining trap is yes / no / no: an output that becomes evidence and is neither re-derivable nor testable is exactly the unverifiable claim this course exists to refuse. Note what is deliberately absent: vendor benchmark numbers. If a student cites an accuracy figure or a mean-time-to-repair, ask which study. That is the break-even discipline from X04 applied to AI, and if you let it slide the session&rsquo;s whole argument about evidence collapses in its final ten minutes.", "appendix": true, "route": "toolkit"}], "appendixUnits": ["C01", "SRC00", "SRC01", "SRC02", "SRC03", "SRC04", "SRC05", "SRC06", "SRC07", "R01", "R02R03", "R09", "R10", "R12", "J02", "R02", "R03", "R04", "R05", "H01", "QA1", "QA2", "R06", "R07", "QA3", "R11", "R13", "QA4", "R16", "R17", "R19", "J01", "R20", "B01", "R14", "X08", "R15"], "mainUnits": ["TITLE", "START", "X01", "X02", "X02A", "X03", "CHECK1", "R08", "X04", "X05", "R18", "CHECK2", "X06", "X07", "APPLY", "END"], "path": {"chapter": 10, "assignment": 1, "exit": ["Distinguish the five properties using one example.", "Trace one failure through people, process and technology.", "Explain redundancy, diversity and common-cause failure.", "Identify evidence from a dependable process.", "Explain what formal verification assumes and what it cannot establish."], "sourceFile": "sources/Ch10-Original.pdf", "build": "20260921-learning-path-v1"}};

   A term a first-year student has not met yet costs the room its attention:
   they stop following the argument and start guessing the word. LECTURE.glossary
   defines each one once, and every occurrence in rendered card text carries its
   definition on hover or tap. Applied to assembled HTML, so it steps over tags
   and never rewrites an attribute or a term already inside a definition. */
var GL=(function(){
  var g=LECTURE.glossary||{}, out=[];

  if(!GL.length)return html;

    if(el.nodeType===3){nodes.push(el);return;}
    if(el.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA|BUTTON|A)$/.test(el.tagName)||el.classList.contains('gl'))return;
    if(el.namespaceURI&&el.namespaceURI!=='http://www.w3.org/1999/xhtml')return;   /* v10: svg figure labels are not prose */
    Array.from(el.childNodes).forEach(collect);

      var term=document.createElement('span');term.className='gl';term.textContent=m[2];term.setAttribute('data-def',definitions[key]);

/* ---------- v12 retrieval loop: 60 seconds at the close of every phase ------

var QA_C=326.7;                                  /* ring circumference, r=52  */
function rQa(b){

    '<div class="qa-side">'+
     '<button class="qa-ring" data-qa-ring="1" aria-label="Start the sixty-second retrieval timer">'+

      '<b class="qa-secs">60</b></button>'+

       '<button class="qa-tog" data-qa-tog="1" aria-expanded="false">Reveal</button></div>';
  }

}
function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
      var live=document.getElementById('tLive');
      if(live) live.textContent='The retrieval minute is over — reveal and compare.';

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(typeof ref!=='string') return '';
  if(ref==='@marks') return Object.keys(S.marks||{}).filter(function(k){return Array.isArray(S.marks[k])&&S.marks[k].length;}).join(' ');
  if(ref==='@gates'){var passed=GATE_DEFS.filter(function(g){return S.gates&&S.gates[g[0]];}).length;return passed?String(passed):'';}
  if(ref==='@signed'){var signed=Object.keys(S.sign||{}).filter(function(k){return S.sign[k];}).length;return signed?String(signed):'';}
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function policyThreshold(config,key){
  var policy=LECTURE.thresholds||{},name=(config&&config.minKey)||key;
  var value=config&&Number.isFinite(config.min)?config.min:policy[name];
  if(!Number.isFinite(value)||value<0)throw new Error('Invalid LECTURE.thresholds entry: '+name);
  return value;
}
function coachState(b){
  var w=b.watch||[], filled=0, thin=false, min=policyThreshold(b,'coachDeep'), deep=b.deep;
  for(var i=0;i<w.length;i++){
    var v=String(probe(w[i])||'').trim();
    /* only the boxes named in `deep` are held to a length — a NAME box is
       legitimately three words and must not be nagged for it */
    if(v){ filled++; if(w[i].indexOf('f:')===0 && (!deep||deep.indexOf(w[i])>=0) && v.length<min) thin=true; }
  }
  if(filled<policyThreshold(null,'coachMinFilled')) return 'empty';
  if(filled<w.length||thin) return 'thin';
  return 'ok';
}
function renderCoach(){
  var ws=document.querySelectorAll('[data-coach]');
  for(var i=0;i<ws.length;i++){
    var b=COACH[ws[i].getAttribute('data-coach')]; if(!b) continue;
    var st=coachState(b), lab=st==='ok'?'Committed':(st==='empty'?'Stuck?':'Nearly');
    ws[i].setAttribute('data-st',st);
    ws[i].innerHTML='<div class="coach-label">'+lab+'</div><div class="ct">'+T(b[st]||'')+'</div>';
  }
}

function rCoach(b){ COACH.push(b); return '<div class="coach" data-coach="'+(COACH.length-1)+'"></div>'; }

/* ---------- think · pair · share ----------

/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    var m=s.match(/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */

  var C=LECTURE.coverage; if(!C||!C.span) return [];

  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }

}

/* ---------- hidden model answer / instructor key ---------------------------
   Every question-bearing unit gets the same open/close affordance. The author
   defines u.answer for a model response. Learning objectives and spoken teaching
   cues are never relabelled as answers. noAnswer suppresses a pre-reveal key. */
function hasQuestion(u){
  if(!u||u.k==='TITLE'||u.k==='END'||u.noAnswer===true) return false;
  if(typeof u.answer==='string'&&u.answer.trim())return true;
  if(u.question===true)return true;
  var probe=' '+(u.task||'')+' '+JSON.stringify(u.blocks||[])+' ';
  return /\?|\bchoose\b|\bclassify\b|\bdecide\b|\bname\b|\bwhich\b|\bwhat\b|\bwhy\b|\bhow\b/i.test(strip(probe));
}
function answerKey(u){
  return T(u.answer||'State a bounded claim, identify supporting evidence and name an observation that would reverse the claim. Compare your response with the source and discuss the reasoning with the instructor.');
}
function rAnswer(u){
  if(!hasQuestion(u)) return '';
  var id='ans-'+u.k, hasFields=/"field"\s*:|"picker"\s*:/.test(JSON.stringify(u.blocks||[]));
  return '<div class="answer-wrap">'+(hasFields?'<span class="attempt-hint">Try your own answer, then compare.</span>':'')+
    '<button class="answer-toggle" data-answer-toggle="'+id+'" aria-controls="'+id+'" aria-expanded="false"'+(hasFields?' data-soft="1"':'')+'>Answer</button>'+
    '<div class="answer-box" id="'+id+'" data-answer-box="'+id+'" hidden><b>EXAMPLE EXPLANATION</b><br>'+answerKey(u)+'</div></div>';
}

  var cs=getComputedStyle(sl);
  var avail=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!(avail>0)) return;
  var h=fit.scrollHeight;
  if(h>avail+1){
    var f=avail/h;
    if(f<.55) f=.55;                     /* legibility floor — nothing unreadable */
    fit.style.transform='scale('+f+')';
    fit.style.transformOrigin='top center';
  }
}

/* ---------- author sanity check ---------------------------------------------
   Runtime guardrails for cloned/adapted lectures. Warnings never block class.
   Run ISCARB_SANITY() from DevTools at any time to re-check the current deck. */
function sanity(){
  var issues=[], declaredF={}, declaredP={}, usedImg={}, names=LECTURE.fieldNames||{};
  function walk(x){
    if(!x) return;
    if(Array.isArray(x)){ for(var i=0;i<x.length;i++) walk(x[i]); return; }
    if(typeof x!=='object') return;
    if(x.field&&x.field.id) declaredF[x.field.id]=1;
    if(x.picker&&x.picker.g) declaredP[x.picker.g]=1;
    if(x.t==='levels')declaredP.level=1;
    if(x.img&&typeof x.img==='string') usedImg[x.img]=1;
    if(x.t==='raw'&&typeof x.html==='string'){
      var re=/data-pick=["']([^"']+)["']/g,m;
      while((m=re.exec(x.html))) declaredP[m[1]]=1;
    }
    for(var k in x) if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]);
  }
  walk(LECTURE.units||[]);

  var fs=document.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var id=fs[i].getAttribute('data-f');
    if(!declaredF[id]&&!names['f:'+id]) issues.push('data-f "'+id+'" has no field declaration or fieldNames alias');
  }

  var cm=LECTURE.caseMap||[];
  for(var c=0;c<cm.length;c++){
    var parts=cm[c].parts||[];
    for(var p=0;p<parts.length;p++){
      var ref=parts[p][1]||'';
      if(ref.indexOf('p:')===0&&!declaredP[ref.slice(2)])
        issues.push('caseMap picker "'+ref+'" is not present in lecture blocks');
      if(ref.indexOf('f:')===0&&!declaredF[ref.slice(2)]&&!names[ref])
        issues.push('caseMap field "'+ref+'" is not present in lecture blocks');
    }
  }

  var exported={};
  cm.forEach(function(section){section.parts.forEach(function(part){exported[part[1]]=true;});});
  document.querySelectorAll('[data-f]').forEach(function(el){var ref='f:'+el.getAttribute('data-f');if(!exported[ref])issues.push('Unexported answer field: '+ref);});
  document.querySelectorAll('[data-pick]').forEach(function(el){var ref='p:'+el.getAttribute('data-pick');if(!exported[ref])issues.push('Unexported choice: '+ref);});
  LECTURE.units.forEach(function(u){if(u.showIf&&u.showIf.thin&&u.showIf.minKey&&!Object.prototype.hasOwnProperty.call(LECTURE.thresholds,u.showIf.minKey))issues.push('Unknown threshold key in '+u.k);});
  for(var img in usedImg)
    if(!Object.prototype.hasOwnProperty.call(FIG,img)) issues.push('figure key "'+img+'" is used but missing from FIG');

  var keys={};
  for(var u=0;u<(LECTURE.units||[]).length;u++){
    var uk=LECTURE.units[u].k;
    if(keys[uk]) issues.push('duplicate unit key "'+uk+'"');
    keys[uk]=1;
  }

  var unresolved=(document.getElementById('deck').innerHTML.match(/\{\{\s*[^}]+\s*\}\}/g)||[]);
  if(unresolved.length) issues.push('unresolved context token(s): '+unresolved.join(', '));

  var report={ok:issues.length===0,issues:issues,fields:Object.keys(declaredF).length,
    pickers:Object.keys(declaredP).length,figures:Object.keys(usedImg).length,units:(LECTURE.units||[]).length};
  try{
    if(window.console){
      if(report.ok){ if(typeof console.info==='function') console.info('[ISCARB sanity] OK',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] OK',report); }
      else { if(typeof console.warn==='function') console.warn('[ISCARB sanity] '+issues.length+' issue(s)',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] '+issues.length+' issue(s)',report); }
    }
  }catch(e){}
  window.ISCARB_SANITY_REPORT=report;
  return report;
}

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;
}
/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=policyThreshold(c,'thinDefault');
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}
  return true;
}

  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){

  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');

/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}

/* ---------- v12 quick view: the deck turns itself ---------------------------
   One button (or Q) auto-advances at a readable pace with a visible progress
   line on the bar — built for self-review, screen recording and sharing.
   Any manual navigation cancels it (the guard sits inside go()); it holds
   still while the tab is hidden or the student is typing, and it follows

var QV={on:false,driving:false,total:0,left:0,last:0,raf:0};
function qvDwell(i){
  var u=U[i]; if(!u) return 7000;
  if(u.k==='TITLE') return 5000;
  if(u.k==='END') return 6500;

  b.setAttribute('data-on',QV.on?'1':'0');

function qvStep(ts){
  if(!QV.on) return;
  if(document.hidden){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  var ae=document.activeElement;
  if(ae&&/^(textarea|input)$/i.test(ae.tagName)){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  QV.left-=(ts-QV.last); QV.last=ts; qvPaint();
  if(QV.left<=0){
    if(cur>=U.length-1||!visibleInDirection(1)){ qvStop(); note('Quick view finished.'); return; }
    QV.driving=true; go(cur+1); QV.driving=false;
    QV.total=QV.left=qvDwell(cur); qvPaint();
  }
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStart(){
  QV.on=true; QV.total=QV.left=qvDwell(cur); QV.last=performance.now();
  qvLabel(); qvPaint();
  note('Quick view on — the deck turns itself. Q or Esc stops it.');
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStop(){
  if(!QV.on) return;

}
