of design and manufacturing errors, or because components have reached the end of their natural life. Software fails due to errors in its specification, design or implementation. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02A", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain the engineering moves used to achieve dependability, from prevention through recovery.", "title": "Avoid, detect and tolerate faults", "sub": "The chapter turns dependability from a property into six engineering moves. Together they prevent faults, expose residual faults, survive disruption and restore service.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · PREVENT", "lead": "Avoid introducing accidental errors.", "txt": "Use disciplined development so accidental errors are not introduced into the system in the first place.", "src": "P1 · p.12"}, {"c": "sand", "lab": "2 · DISCOVER", "lead": "Find residual errors with V &amp; V.", "txt": "Design verification and validation processes that are effective in discovering residual errors in the system.", "src": "P1 · p.12"}, {"c": "violet", "lab": "3 · TOLERATE", "lead": "Keep operating when faults occur.", "txt": "Design the system to be fault tolerant so that it can continue in operation when faults occur.", "src": "P1 · p.12"}, {"c": "mag", "lab": "4 · PROTECT", "lead": "Guard against attacks — and recognise them.", "txt": "Use protection mechanisms against external attacks, and include capabilities to recognise and resist cyberattacks.", "src": "P1 · pp.12–13"}, {"c": "sand", "lab": "5 · CONFIGURE", "lead": "Fit the real operating environment.", "txt": "Configure the system correctly for its operating environment.", "src": "P1 · p.13"}, {"c": "green", "lab": "6 · RECOVER", "lead": "Restore normal service after failure.", "txt": "Include recovery mechanisms that help restore normal system service after a failure.", "src": "P1 · p.13"}]}, {"t": "principle", "txt": "Dependability is not one technique. It is a lifecycle strategy: prevent → discover → tolerate → protect → configure → recover."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Avoid, detect and tolerate faults. This slide is a visual compression of source pp.12–13, not an added framework. Keep the source verbs visible: avoid, discover, tolerate, guard/recognise, configure, recover. The grouping of the two cyberattack bullets under PROTECT is only for classroom readability; both original ideas remain explicit.", "appendix": false, "_iscarbRule": "X02A - Dependability achievement", "route": "core", "showIf": null, "sourceRange": "26–31", "answer": "Use disciplined development so accidental errors are not introduced into the system in the first place. Design verification and validation processes that are effective in discovering residual errors in the system. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X03", "loadOk": "The source stack and clickable layers form one trace-building activity. Students make one path across at least three layers; the text below explains its boundary. The mobile layout stacks the figure above the controls.", "answer": "One plausible trace to investigate is Equipment (a pressure transmitter reading) → Application system (the controller interprets that reading and raises an alarm) → Business processes (the handover procedure allows the alarm to be silenced) → Organization (operations must own escalation and release approval) → Society (continuity of the public water supply). This is a causal hypothesis; use pressure, alarm and handover records to test each link.", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Trace a failure upward through the sociotechnical layers, past the application system.", "title": "Sociotechnical systems and regulation", "sub": "The source figure becomes a failure-trace map: changes at one level ripple through the others.", "blocks": [{"t": "figure", "native": "layers", "mk": "p19", "cap": "p.19", "right": [{"t": "stack"}]}, {"t": "cards", "cols": 3, "items": [{"c": "sand", "lab": "NOT ISOLATED", "lead": "Software is one layer of a larger purpose.", "txt": "Software engineering is part of a broader systems engineering process — software systems are essential components of systems that have a human, social or organisational purpose.", "src": "P1 · p.18"}, {"c": "teal", "lab": "THE SEVEN LAYERS", "lead": "Each layer has one job.", "txt": "Equipment (hardware) → Operating system (common facilities) → Comms &amp; data (middleware to remote systems/DBs) → Application system (org-specific function) → Business processes (people + systems) → Organisation (strategic activity) → Society (law, regulation, culture).", "src": "P1 · p.20-21"}, {"c": "mag", "lab": "RIPPLE EFFECT", "lead": "A change rarely stays on one layer.", "txt": "A change at one layer ripples through the others — e.g. a change in regulation reshapes business processes and application software. Dependability requires containing software failures within the enclosing layers, and understanding how faults in adjacent layers can affect the software.", "src": "P1 · p.22"}]}, {"t": "principle", "txt": "Systems engineering spans the whole stack. Software engineering spans only Operating system to Application system. Dependability is claimed over the whole stack and defended from the middle of it."}], "timebox": "", "task": "Trace tonight&rsquo;s failure through at least three layers, ending above Application system. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Teaching focus: Sociotechnical systems and regulation. Watch for traces that stop at Application system — exactly the mistake this chapter exists to correct. Push upward: does it reach Business processes, meaning the shift handover, and Society, meaning the regulator&rsquo;s open file? Two traces aloud, no more.", "appendix": false, "_iscarbRule": "X03 - The sociotechnical systems stack", "route": "core", "showIf": null, "sourceRange": "19–25"}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A service is reachable but returns the wrong result. Which property failed?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "Reliability failed. Availability alone says the service is accessible, not that the result is correct. Safety depends on whether the wrong result can cause harm.", "timebox": "60 sec", "appendix": false}, {"k": "R08", "answer": "The position to defend is: keep the control architecture simple and invest in independent verification and validation unless evidence shows that diversity reduces common-mode risk more than the additional complexity increases it. Two plant trains alone do not establish independence, and the aircraft comparison does not certify this plant.", "rule": "", "phase": "LEARN", "accent": "mag", "learn": "Argue the case against adding redundancy, using two certified aircraft as the evidence.", "title": "Redundancy, diversity and common causes", "sub": "Your plant already has two RO trains. Before you spend the budget on making them differ, look at what two certified aircraft decided.", "blocks": [{"t": "figure", "native": "rd", "mk": "rd", "cap": "redundancy &amp; diversity strategies", "srcName": "Course deck &middot; CPIT-455 Class 2", "right": [{"t": "cards", "cols": 2, "items": [{"c": "violet", "ic": "plane", "lab": "AIRBUS", "lead": "Redundant <b>and</b> diverse.", "txt": "Flight control is redundant and diverse — the copies also fail differently. Certified, and flying.", "src": "P1 · p.30"}, {"c": "violet", "ic": "plane", "lab": "BOEING 777", "lead": "Redundant, <b>not</b> diverse.", "txt": "No software diversity. Some engineers advocate simplicity plus extensive V&amp;V instead.", "src": "P1 · p.30"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MAP", "lead": "A spare copy, versus a <i>different</i> copy. Independence is the whole trick.", "txt": "Redundancy keeps a second version available; diversity makes it fail differently. Both must be independent, or a common-mode failure defeats them.", "src": "P1 · p.27"}, {"c": "sand", "lab": "TRADE-OFF", "lead": "Every copy you add is complexity you also have to defend.", "txt": "Adding diversity and redundancy increases system complexity, which can increase the chance of error through unanticipated interactions between the redundant components.", "src": "P1 · p.30"}]}, {"t": "wide", "c": "violet", "lab": "EVERYDAY VERSIONS", "lead": "The plant is not the only place this shows up.", "txt": "Redundancy: where availability is critical (e.g. e-commerce), companies keep backup servers and switch to them automatically on failure. Diversity: for resilience against external attacks, different servers may run different operating systems (e.g. Windows and Linux).", "src": "P1 · p.28"}, {"t": "wide", "c": "green", "lab": "VERDICT", "txt": "The architecture does not settle the argument. The evidence regime around it does."}]}], "timebox": "", "hueOk": "The two violet aircraft cards ARE the EVIDENCE step of the Rule 06 flow — violet is kept so the student recognises the same four steps applied to a real case, then teal MAP, sand TRADE-OFF and the green VERDICT follow the same mapping.", "task": "Argue the Boeing position for tonight&rsquo;s plant in one sentence.", "notes": "Teaching focus: Redundancy, diversity and common causes. Make a student argue the no-diversity position out loud. Most cannot, and that tells them their grasp of outcome 3 is a slogan rather than a capability. This is the antidote to the reflex that redundancy is always an improvement.", "appendix": false, "_iscarbRule": "RULE 08 - 60-second source case", "route": "core", "showIf": null, "sourceRange": "26–31"}, {"k": "X04", "answer": "The curve gives no numerical target. For availability, measure uptime as a proportion of a defined observation period and specify what counts as downtime. For failover, measure interruption duration under peak demand and defined faults. A break-even estimate also needs incremental engineering costs and credible failure-cost estimates. State assumptions before choosing a level.", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Identify the band where the next increment of dependability changes the decision, and name the measurement needed to prove it.", "title": "The cost of dependability", "sub": "Dependability costs tend to increase exponentially as increasing levels of dependability are required.", "blocks": [{"t": "figure", "img": "p15", "cap": "p.15", "right": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "WHY IT RISES", "lead": "Higher dependability needs costlier methods and hardware.", "txt": "More expensive development techniques and hardware are required to achieve the higher levels.", "src": "P1 · p.14"}, {"c": "teal", "lab": "AND RISES AGAIN", "lead": "And costlier proof that you reached it.", "txt": "Increased testing and system validation is required to convince the client and the regulators that the required levels have been achieved.", "src": "P1 · p.14"}]}, {"t": "wide", "c": "sand", "lab": "BREAK-EVEN GUARD", "txt": "This curve is qualitative. It carries no 99%, no 99.9% and no currency values. Do not invent them — name the measurement you would need instead.", "picker": {"g": "curve", "options": ["Low", "Medium", "High", "Very high", "Ultra-high"]}, "field": {"id": "curve_metric", "core": false, "rows": 2, "ph": "The metric I would need before computing break-even, e.g. measured switch-over time of train B"}}]}, {"t": "wide", "c": "mag", "lab": "QUESTION FOR REFLECTION", "lead": "If you cannot name the metric, you cannot defend the target.", "txt": "A team asks for 99.99% dependability. Which property, observation period, operating conditions and measurement would make that claim testable?"}, {"t": "principle", "c": "mag", "src": "P1 &middot; p.16", "txt": "The source also says it may be more cost effective to accept untrustworthy systems and pay the failure costs — but that depends on social and political factors, and on system type. <span style=\"color:#DDB27E\">A regulated public water supply removes that option from the menu.</span>"}], "timebox": "", "task": "Mark the band where the next increment changes your decision, then name the metric you would need to prove it. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Teaching focus: The cost of dependability. If a student states a percentage, ask which page it is on. It is on none of them. This is where the class learns the difference between evidence and confidence, and it is the same discipline you apply to AI at Rule 15. The closing line is from p.16 and bridges to Rule 12.", "appendix": false, "_iscarbRule": "X04 - Cost / dependability curve", "route": "core", "showIf": null, "sourceRange": "14–18"}, {"k": "X05", "loadOk": "The source process table and four interpretation cards are one comparison. Students choose one row and identify one artifact, rather than completing four tasks. The column flows vertically and can scroll when expanded.", "answer": "Choose the auditable-process row: request a dated change record linking the upgrade to its reviewed requirements, test results, independent reviewer and release decision. The filename, version and owner must let another engineer reconstruct how this specific release was approved.", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Choose the process attribute that most changes a regulated decision, and name the artifact that verifies it.", "title": "Dependable processes and evidence", "sub": "A dependable process is one that a different engineer could repeat from the record alone.", "blocks": [{"t": "figure", "native": "table", "mk": "p34", "cap": "p.34", "right": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE-PRODUCING ACTIVITIES", "lead": "Activities that leave a record behind them.", "txt": "Requirements reviews for completeness and consistency; requirements management to control change; formal specification; system modeling with documented links to requirements.", "src": "P1 · p.35"}, {"c": "teal", "lab": "AND THE REST OF THE LADDER", "lead": "Checked by <i>different people</i>, not only by tests.", "txt": "Design and program inspections checked by different people; static analysis of source code; test planning managed to demonstrate coverage of requirements and correct application.", "src": "P1 · p.36"}, {"c": "sand", "lab": "PROCESS DIVERSITY", "lead": "Diversity in the <i>process</i>, not only the architecture — and far cheaper.", "txt": "Validation should not depend on a single approach such as testing. Multiple different activities complement each other and allow cross-checking, which avoids process errors that lead to software errors.", "src": "P1 · p.29"}, {"c": "green", "lab": "WHY IT IS AUDITABLE", "lead": "A stranger could repeat it from the record. That is what a regulator reads.", "txt": "A process that does not rely on individual interpretation can be repeated across projects and team members. Regulators use process information to check that good practice was used.", "src": "P1 · p.32-33"}]}]}, {"t": "principle", "txt": "Diversity is not only an architecture move. It is a process move — and it is far cheaper."}], "timebox": "", "task": "Choose the table row that most changes tonight&rsquo;s decision, and name the artifact that would verify it.", "notes": "Teaching focus: Dependable processes and evidence. Auditable is almost always the right answer for a regulated system and almost never the one students pick first — they pick Diverse because the trade-off phase made diversity salient. Name that contrast; it is a clean demonstration of recency bias in engineering judgment.", "appendix": false, "_iscarbRule": "X05 - Attributes of dependable processes", "route": "core", "showIf": null, "sourceRange": "32–39"}, {"k": "R18", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Name the agile practice that survives certification, and the evidence discipline it must add.", "title": "Agile methods in dependable development", "sub": "A strong process removes operational ambiguity before the day it is needed.", "blocks": [{"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.10 — the two claims", "items": [{"c": "teal", "lab": "THE CONFLICT", "lead": "Certification wants documents up front. Agile minimises both.", "txt": "Dependable software often requires certification, so both process and product documentation must be produced. Up-front requirements analysis is essential to discover conflicts that compromise safety and security. These conflict with agile&rsquo;s co-development of requirements and system, and with minimizing documentation.", "src": "P1 · p.37"}, {"c": "green", "lab": "WHAT SURVIVES", "lead": "Iteration and test-first survive. Pure agile does not.", "txt": "An agile process may be defined that includes iterative development, test-first development and user involvement. So long as the team follows that process and documents its actions, agile methods can be used. But additional documentation and planning is essential, so pure agile is impractical for dependable systems engineering.", "src": "P1 · p.38"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "not in the chapter — your context", "items": [{"t": "wide", "c": "mag", "lab": "BACK TO 22:14 — THE PART NOBODY CALLED A DESIGN DECISION", "lead": "The upgrade went live at peak demand with no revert window. That was a process choice, and it is the one you can actually change.", "txt": "The thing that put you in the room was a <i>change</i>: a control upgrade released at 22:14, at peak demand, with no way back. Three questions the process owes an answer to, none about the software. <b>When</b> may a change go live, and who may waive the window? <b>How</b> does it go back &mdash; a revert that was exercised and dated, not written down? <b>How much</b> does one change touch &mdash; could it have gone to one train before both? A defined process answers these in advance; an improvised one discovers them at 22:14."}]}}, {"t": "principle", "txt": "The line is not agile against not-agile. It is defined-and-recorded against improvised."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Agile methods in dependable development. Test-first is the practice that survives certification best, because it produces the artifact as a by-product rather than as extra work. Say that &mdash; it is the one thing on this slide students can use in their project next week. <b>Then spend a full minute on the magenta card.</b> The crisis that opened the hour was a deployment, and the room has spent seventy minutes arguing about the plant without once asking about the release that put them there. That is the most common mistake in industry as well as in the classroom: the failure gets attributed to the component that broke rather than to the change that exposed it. Three answers to look for &mdash; a change window with a named waiver authority, a revert that has been <i>exercised</i> and dated rather than documented, and a staged release that would have touched one train before both. A student who says &ldquo;we would have tested more&rdquo; has not answered; push for which of the three.", "appendix": false, "_iscarbRule": "RULE 18 - Make the system operable", "route": "core", "showIf": null, "sourceRange": "32–39", "answer": "Dependable software often requires certification, so both process and product documentation must be produced. Up-front requirements analysis is essential to discover conflicts that compromise safety and security. These conflict with agile’s co-development of requirements and system, and with minimizing documentation. An agile process may be defined that includes iterative development, test-first development and user involvement. So long as the team follows that process and documents its actions, agile methods can be used. But additional documentation and planning is essential, so pure agile is impractical for dependable systems engineering. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "Two identical servers share the same faulty requirements. What does adding the second server protect against?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "It can protect against some independent hardware failures. It does not remove a common specification or software fault. Identify the shared cause and justify any claimed independence.", "timebox": "60 sec", "appendix": false}, {"k": "X06", "loadOk": "The source diagram, two proof approaches, benefits and limits must remain together to avoid presenting proof without its assumptions. Students pin one step only; the model answer expands into normal flow.", "answer": "Model-check the switch-over logic against a precise safety condition, such as excluding a state in which both trains are unavailable while supply is required. Inspect any counterexample trace. A proof about the model still depends on its assumptions; it does not establish that a physical sensor is accurate or that operators follow the modeled procedure.", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Say what a formal method can prove, and why that is not the reason adoption stayed limited.", "title": "Formal methods and their limits", "blocks": [{"t": "deflist", "cap": "p.40", "title": "Formal methods", "def": "approaches to software development that are based on mathematical representation and analysis of software.", "items": [["Formal specification", "the system&rsquo;s obligations written as mathematics, not prose."], ["Specification analysis and proof", "properties of the specification itself checked before any code exists."], ["Transformational development", "the specification transformed, correctly, step by step toward implementation."], ["Program verification", "the program proved equivalent to its specification."]], "foot": "Formal methods significantly reduce some types of programming errors and can be cost-effective for dependable systems engineering.", "right": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "VERIFICATION-BASED", "lead": "Prove the program matches the specification.", "txt": "Different representations — a specification and a program implementing it — are proved equivalent. Demonstrates the absence of implementation errors.", "src": "P1 · p.41"}, {"c": "teal", "lab": "REFINEMENT-BASED", "lead": "Transform the specification down, correctly, step by step.", "txt": "A representation is systematically transformed into a lower-level one. If the transformation is correct, the representations are equivalent.", "src": "P1 · p.41"}, {"c": "green", "lab": "WHAT IT CATCHES", "lead": "Catches what testing cannot: states nobody thought to try.", "txt": "Specification and design errors and omissions — model checking can find undesirable states such as deadlock in a concurrent system — and inconsistencies between a specification and a program.", "src": "P1 · p.43"}, {"c": "sand", "lab": "WHY IT PAYS OFF", "lead": "Worth it exactly where failure is most expensive.", "txt": "The main benefit of formal methods is fewer faults, so their main area of applicability is dependable systems engineering — there have been several successful projects. Most cost-effective where high failure costs must be avoided.", "src": "P1 · p.42"}, {"c": "teal", "lab": "WHAT YOU GAIN", "lead": "Detail now, or debugging later.", "txt": "Writing a formal specification forces detailed analysis that surfaces problems, inconsistencies and gaps early; the formal language lets that be checked automatically. The B method can transform a specification into a &lsquo;correct&rsquo; program, and formal verification can cut testing costs.", "src": "P1 · p.44"}, {"c": "mag", "lab": "WHY ADOPTION STAYED LIMITED", "lead": "The blocker is not rigour. <b>The problem owner cannot read the proof.</b>", "txt": "Problem owners cannot understand a formal specification, so cannot assess whether it represents their requirements. Costs are easy to assess and benefits are hard. Engineers are unfamiliar. It is still hard to scale, and not compatible with agile.", "src": "P1 · p.45"}]}]}, {"t": "principle", "c": "mag", "txt": "The reason we do not simply prove the plant correct is not that proof is weak. It is that the problem owner cannot read the proof — a sociotechnical limitation, which is this chapter&rsquo;s whole thesis."}], "timebox": "", "task": "Pin the formal-method step that would expose the most dangerous error in tonight&rsquo;s crisis.", "notes": "Teaching focus: Formal methods and their limits. Three minutes; the limitation card is the part that gets examined and the part most lectures skip. Say the closing line aloud — it connects formal methods back to Rule 12 and to the sociotechnical stack.", "appendix": false, "_iscarbRule": "X06 - Formal specification", "route": "core", "showIf": null, "sourceRange": "40–47"}, {"k": "X07", "answer": "Illustrative causal hypothesis: a calibration defect in the pressure transmitter is the FAULT; an incorrect pressure value used by the controller is the ERROR; an unnecessary switch-over that interrupts the promised water supply would be the FAILURE. The alarm alone does not prove this chain. Verify the measurement and service records before presenting it as the actual incident.", "rule": "", "phase": "LEARN", "accent": "violet", "learn": "Distinguish fault, error and failure, and say which of the five properties an incident actually threatened.", "title": "Fault, error and failure", "sub": "Three words for three different things, and five properties students report interchangeably. Get these wrong and every later sentence is wrong with them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "vocabulary, not a source page"}, "blocks": [{"t": "compare", "head": ["Term", "What it is", "Where you would look for it", "Tonight&rsquo;s plant"], "rows": [{"c": "teal", "cells": ["Fault", "A defect sitting in the system, doing nothing yet.", "Code review, static analysis, a design walk-through.", "One transmitter feeding both trains."]}, {"c": "sand", "cells": ["Error", "The system in a wrong internal state, because a fault was reached.", "Logs, assertions, a value that should not be possible.", "The controller believing pressure is high on both trains."]}, {"c": "mag", "cells": ["Failure", "The service visibly not doing what was promised.", "The user, the alarm, the regulator&rsquo;s file.", "The plant switching trains at 22:14 and alarming."]}]}, {"t": "compare", "head": ["Property", "The question it answers", "Probability or judgment", "Broken tonight?"], "rows": [{"c": "teal", "cells": ["Availability", "Is it up when asked?", "Probability &mdash; measure it", "No: the backup train took over."]}, {"c": "teal", "cells": ["Reliability", "Is it correct when up?", "Probability &mdash; measure it", "Unknown: nobody checked the reading."]}, {"c": "sand", "cells": ["Safety", "Could it hurt anyone?", "Judgment &mdash; argue it", "The open question tonight."]}, {"c": "sand", "cells": ["Security", "Can it be broken into?", "Judgment &mdash; argue it", "Unaddressed: the fieldbus is unauthenticated."]}, {"c": "sand", "cells": ["Resilience", "Does the critical service survive the event?", "Judgment &mdash; argue it", "Partly: it survived, without evidence why."]}]}, {"t": "conceptflow", "items": [["FAULT", "Defect exists"], ["ERROR", "Wrong internal state"], ["FAILURE", "Service breaks"]]}, {"t": "principle", "c": "mag", "txt": "A fault nobody reaches causes nothing. A failure with no fault behind it does not exist."}], "hueOk": "Three terms and five properties each carry their own colour so the student can find the same row again on the comparison; one colour would make both tables read as undifferentiated lists.", "timebox": "", "cut": true, "task": "Write tonight&rsquo;s incident as one sentence naming the fault, the error and the failure in that order.", "say": "You will lose marks all semester for swapping these three words. Two minutes now saves that.", "notes": "Teaching focus: Fault, error and failure. <b>The sentence to make them write:</b> most students write &ldquo;the system failed because of a software error&rdquo; and stop &mdash; that names two of the three terms and explains neither. The useful sentence names all three in order &mdash; <i>this fault</i>, reached under <i>these conditions</i>, put the system in <i>this wrong state</i>, which the user saw as <i>this failure</i> &mdash; and that is also the shape of a defensible incident report. Two minutes, and it is worth the two even though nothing here is new to a strong student &mdash; the weak half of the room has been using these three words as synonyms since first year, and the cost only shows up in the assignment. Do not read the tables aloud; that is what they are for. Instead ask one student to say tonight&rsquo;s incident as the three-part sentence, and correct only the ordering. The second table is the one to point at when a student later writes &ldquo;the system was unreliable&rdquo; about an incident where the service stayed up: reliability and availability are different promises, and the right-hand column already says which one tonight actually threatens. This is a designated cut point: if behind, say the three-part sentence once and move on. The source ledger is at C01.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "7–13"}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "A coastal desalination control upgrade went live at 22:14, during peak demand."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is an independently verified pressure reading matched to the alarm and switch-over log. It helps distinguish a real pressure excursion from a sensor fault. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "C01", "title": "Source coverage and study checklist", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>47 supplied slides indexed.</b> Every original topic has a classroom location and a source review location. This map records material availability, not time actually taught or student mastery.</p><p>Five chapter objectives connect to supplied syllabus CLO 1, 2. Original concepts remain required even when detailed examples are completed after class.</p></div><div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Original topic</th><th>Source slides</th><th>Classroom location</th><th>Full source</th></tr></thead><tbody><tr><td>Opening and source outline</td><td>1–2</td><td><button class=\"lp-btn\" data-jump=\"START\">Your route through this chapter</button></td><td><button class=\"lp-btn\" data-jump=\"SRC00\">Read source</button></td></tr><tr><td>Dependability and failure</td><td>3–6</td><td><button class=\"lp-btn\" data-jump=\"X01\">Five dependability properties</button> · <button class=\"lp-btn\" data-jump=\"X02\">Hardware, software and human failure</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Dependability properties</td><td>7–13</td><td><button class=\"lp-btn\" data-jump=\"X01\">Five dependability properties</button> · <button class=\"lp-btn\" data-jump=\"X07\">Fault, error and failure</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Cost and criticality</td><td>14–18</td><td><button class=\"lp-btn\" data-jump=\"X04\">The cost of dependability</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Sociotechnical systems and regulation</td><td>19–25</td><td><button class=\"lp-btn\" data-jump=\"X03\">Sociotechnical systems and regulation</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr><tr><td>Redundancy and diversity</td><td>26–31</td><td><button class=\"lp-btn\" data-jump=\"X02A\">Avoid, detect and tolerate faults</button> · <button class=\"lp-btn\" data-jump=\"R08\">Redundancy, diversity and common causes</button></td><td><button class=\"lp-btn\" data-jump=\"SRC05\">Read source</button></td></tr><tr><td>Dependable processes</td><td>32–39</td><td><button class=\"lp-btn\" data-jump=\"X05\">Dependable processes and evidence</button> · <button class=\"lp-btn\" data-jump=\"R18\">Agile methods in dependable development</button></td><td><button class=\"lp-btn\" data-jump=\"SRC06\">Read source</button></td></tr><tr><td>Formal methods</td><td>40–47</td><td><button class=\"lp-btn\" data-jump=\"X06\">Formal methods and their limits</button></td><td><button class=\"lp-btn\" data-jump=\"SRC07\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 10 – Dependable systems</summary><div class=\"lp-source-text\">30/10/2014 Chapter 10 Dependable Systems 1</div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\n Dependability properties\n Sociotechnical systems\n Redundancy and diversity\n Dependable processes\n Formal methods and dependability\n30/10/2014 Chapter 10 Dependable Systems 2</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "Dependability and failure", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–6. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · System dependability</summary><div class=\"lp-source-text\">System dependability\n For many computer-based systems, the most important \nsystem property is the dependability of the system.\n The dependability of a system reflects the user’s degree \nof trust in that system. It reflects the extent of the user’s \nconfidence that it will operate as users expect and that it \nwill not ‘fail’ in normal use.\n Dependability covers the related systems attributes of \nreliability, availability and security. These are all inter-\ndependent.\n3Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · Importance of dependability</summary><div class=\"lp-source-text\">Importance of dependability\n System failures may have widespread effects with large \nnumbers of people affected by the failure.\n Systems that are not dependable and are unreliable, \nunsafe or insecure may be rejected by their users.\n The costs of system failure may be very high if the failure \nleads to economic losses or physical damage.\n Undependable systems may cause information loss with \na high consequent recovery cost.\n4Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · Causes of failure</summary><div class=\"lp-source-text\">Causes of failure\n Hardware failure\n▪ Hardware fails because of design and manufacturing errors or \nbecause components have reached the end of their natural life.\n Software failure\n▪ Software fails due to errors in its specification, design or \nimplementation.\n Operational failure\n▪ Human operators make mistakes. Now perhaps the largest \nsingle cause of system failures in socio-technical systems.\n5Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · Dependability properties</summary><div class=\"lp-source-text\">Dependability properties\n30/10/2014 Chapter 10 Dependable Systems 6</div></details>"}], "noAnswer": true, "sourceRange": "3–6", "appendix": true}, {"k": "SRC02", "title": "Dependability properties", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 7–13. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · The principal dependability properties</summary><div class=\"lp-source-text\">The principal dependability properties\n30/10/2014 Chapter 10 Dependable Systems 7</div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · Principal properties</summary><div class=\"lp-source-text\">Principal properties\n Availability\n▪ The probability that the system will be up and running and able \nto deliver useful services to users.\n Reliability\n▪ The probability that the system will correctly deliver services as \nexpected by users.\n Safety\n▪ A judgment of how likely it is that the system will cause damage \nto people or its environment.\n8Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · Principal properties</summary><div class=\"lp-source-text\">Principal properties\n Security\n▪ A judgment of how likely it is that the system can resist \naccidental or deliberate intrusions.\n Resilience\n▪ A judgment of how well a system can maintain the continuity of \nits critical services in the presence of disruptive events such as \nequipment failure and cyberattacks.\n30/10/2014 Chapter 10 Dependable Systems 9</div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · Other dependability properties</summary><div class=\"lp-source-text\">Other dependability properties\n Repairability\n▪ Reflects the extent to which the system can be repaired in the \nevent of a failure\n Maintainability\n▪ Reflects the extent to which the system can be adapted to new \nrequirements;\n Error tolerance\n▪ Reflects the extent to which user input errors can be avoided \nand tolerated.\n10Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · Dependability attribute dependencies</summary><div class=\"lp-source-text\">Dependability attribute dependencies\n Safe system operation depends on the system being \navailable and operating reliably.\n A system may be unreliable because its data has been \ncorrupted by an external attack.\n Denial of service attacks on a system are intended to \nmake it unavailable.\n If a system is infected with a virus, you cannot be \nconfident in its reliability or safety.</div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Dependability achievement</summary><div class=\"lp-source-text\">Dependability achievement\n Avoid the introduction of accidental errors when \ndeveloping the system.\n Design V &amp; V processes that are effective in discovering \nresidual errors in the system.\n Design systems to be fault tolerant so that they can \ncontinue in operation when faults occur\n Design protection mechanisms that guard against \nexternal attacks.</div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · Dependability achievement</summary><div class=\"lp-source-text\">Dependability achievement\n Configure the system correctly for its operating \nenvironment.\n Include system capabilities to recognise and resist \ncyberattacks.\n Include recovery mechanisms to help restore normal \nsystem service after a failure.\n30/10/2014 Chapter 10 Dependable Systems 13</div></details>"}], "noAnswer": true, "sourceRange": "7–13", "appendix": true}, {"k": "SRC03", "title": "Cost and criticality", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 14–18. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Dependability costs</summary><div class=\"lp-source-text\">Dependability costs\n Dependability costs tend to increase exponentially as \nincreasing levels of dependability are required.\n There are two reasons for this\n▪ The use of more expensive development techniques and \nhardware that are required to achieve the higher levels of \ndependability.\n▪ The increased testing and system validation that is required to \nconvince the system client and regulators that the required levels \nof dependability have been achieved.\n14Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Cost/dependability curve</summary><div class=\"lp-source-text\">Cost/dependability curve\n30/10/2014 Chapter 10 Dependable Systems 15</div></details><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · Dependability economics</summary><div class=\"lp-source-text\">Dependability economics\n Because of very high costs of dependability \nachievement, it may be more cost effective to accept \nuntrustworthy systems and pay for failure costs\n However, this depends on social and political factors. A \nreputation for products  that can’t be trusted may lose \nfuture business\n Depends on system type - for business systems in \nparticular, modest levels of dependability may be \nadequate\n16Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · Sociotechnical systems</summary><div class=\"lp-source-text\">Sociotechnical systems\n30/10/2014 Chapter 10 Dependable Systems 17</div></details><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · Systems and software</summary><div class=\"lp-source-text\">Systems and software\n Software engineering is not an isolated activity but is part \nof a broader systems engineering process.\n Software systems are therefore not isolated systems but \nare essential components of broader systems that have \na human, social or organizational purpose.\n Example\n▪ The wilderness weather system is part of broader weather \nrecording and forecasting systems\n▪ These include hardware and software, forecasting processes, \nsystem users, the organizations that depend on weather \nforecasts, etc.</div></details>"}], "noAnswer": true, "sourceRange": "14–18", "appendix": true}, {"k": "SRC04", "title": "Sociotechnical systems and regulation", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 19–25. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · The sociotechnical systems stack</summary><div class=\"lp-source-text\">The sociotechnical systems stack\n30/10/2014 Chapter 10 Dependable Systems 19</div></details><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Layers in the STS stack</summary><div class=\"lp-source-text\">Layers in the STS stack\n Equipment\n▪ Hardware devices, some of which may be computers. Most \ndevices will include an embedded system of some kind.\n Operating system\n▪ Provides a set of common facilities for higher levels in the \nsystem.\n Communications and data management\n▪ Middleware that provides access to remote systems and \ndatabases.\n Application systems\n▪ Specific functionality to meet some organization requirements.</div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · Layers in the STS stack</summary><div class=\"lp-source-text\">Layers in the STS stack\n Business processes\n▪ A set of processes involving people and computer systems that \nsupport the activities of the business.\n Organizations\n▪ Higher level strategic business activities that affect the operation \nof the system.\n Society\n▪ Laws, regulation and culture that affect the operation of the \nsystem.</div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · Holistic system design</summary><div class=\"lp-source-text\">Holistic system design\n There are interactions and dependencies between the \nlayers in a system and changes at one level ripple \nthrough the other levels\n▪ Example: Change in regulations (society) leads to changes in \nbusiness processes and application software.\n For dependability, a systems perspective is essential\n▪ Contain software failures within the enclosing layers of the STS \nstack.\n▪ Understand how faults and failures in adjacent layers may affect \nthe software in a system.</div></details><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · Regulation and compliance</summary><div class=\"lp-source-text\">Regulation and compliance\n The general model of economic organization that is now \nalmost universal in the world is that privately owned \ncompanies offer goods and services and make a profit \non these. \n To ensure the safety of their citizens, most governments \nregulate (limit the freedom of) privately owned \ncompanies so that they must follow certain standards to \nensure that their products are safe and secure. \n30/10/2014 Chapter 10 Dependable Systems 23</div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · Regulated systems</summary><div class=\"lp-source-text\">Regulated systems\n Many critical systems are regulated systems, which \nmeans that their use must be approved by an external \nregulator before the systems go into service. \n▪ Nuclear systems\n▪ Air traffic control systems\n▪ Medical devices\n A safety and dependability case has to be approved by \nthe regulator. Therefore, critical systems development \nhas to create the evidence to convince a regulator that \nthe system is dependable, safe and secure.</div></details><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · Safety regulation</summary><div class=\"lp-source-text\">Safety regulation\n Regulation and compliance (following the rules) applies \nto the sociotechnical system as a whole and not simply \nthe software element of that system. \n Safety-related systems may have to be certified as safe \nby the regulator.\n To achieve certification, companies that are developing \nsafety-critical systems have to produce an extensive \nsafety case that shows that rules and regulations have \nbeen followed. \n It can be as expensive develop the documentation for \ncertification as it is to develop the system itself. \n30/10/2014 Chapter 10 Dependable Systems 25</div></details>"}], "noAnswer": true, "sourceRange": "19–25", "appendix": true}, {"k": "SRC05", "title": "Redundancy and diversity", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 26–31. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Redundancy and diversity</summary><div class=\"lp-source-text\">Redundancy and diversity\n30/10/2014 Chapter 10 Dependable Systems 26</div></details><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · Redundancy and diversity</summary><div class=\"lp-source-text\">Redundancy and diversity\n Redundancy\n▪ Keep more than a single version of critical components so that if \none fails then a backup is available.\n Diversity\n▪ Provide the same functionality in different ways in different \ncomponents so that they will not fail in the same way. \n Redundant and diverse components should be \nindependent so that they will not suffer from ‘common-\nmode’ failures\n▪ For example, components implemented in different programming \nlanguages means that a compiler fault will not affect all of them.\n27Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · Diversity and redundancy examples</summary><div class=\"lp-source-text\">Diversity and redundancy examples\n Redundancy. Where availability is critical (e.g. in e-\ncommerce systems), companies normally keep backup \nservers and switch to these automatically if failure \noccurs.\n Diversity. To provide resilience against external attacks, \ndifferent servers may be implemented using different \noperating systems (e.g. Windows and Linux)\n28Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · Process diversity and redundancy</summary><div class=\"lp-source-text\">Process diversity and redundancy\n Process activities, such as validation, should not depend \non a single approach, such as testing, to validate the \nsystem.\n Redundant and diverse process activities are important \nespecially for verification and validation.\n Multiple, different process activities the complement \neach other and allow for cross-checking help to avoid \nprocess errors, which may lead to errors in the software.</div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · Problems with redundancy and diversity</summary><div class=\"lp-source-text\">Problems with redundancy and diversity\n Adding diversity and redundancy to a system increases \nthe system complexity.\n This can increase the chances of error because of \nunanticipated interactions and dependencies between \nthe redundant system components.\n Some engineers therefore advocate simplicity and \nextensive V &amp; V as a more effective route to software \ndependability.\n Airbus FCS architecture is redundant/diverse; Boeing \n777 FCS architecture has no software diversity\n30/10/2014 Chapter 10 Dependable Systems 30</div></details><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · Dependable processes</summary><div class=\"lp-source-text\">Dependable processes\n30/10/2014 Chapter 10 Dependable Systems 31</div></details>"}], "noAnswer": true, "sourceRange": "26–31", "appendix": true}, {"k": "SRC06", "title": "Dependable processes", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 32–39. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · Dependable processes</summary><div class=\"lp-source-text\">Dependable processes\n To ensure a minimal number of software faults, it is \nimportant to have a well-defined, repeatable software \nprocess.\n A well-defined repeatable process is one that does not \ndepend entirely on individual skills; rather can be \nenacted by different people.\n Regulators use information about the process to check if \ngood software engineering practice has been used.\n For fault detection, it is clear that the process activities \nshould include significant effort devoted to verification \nand validation.\n32Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · Dependable process characteristics</summary><div class=\"lp-source-text\">Dependable process characteristics\n Explicitly defined \n▪ A process that has a defined process model that is used to drive \nthe software production process. Data must be collected during \nthe process that proves that the development team has followed \nthe process as defined in the process model.\n Repeatable\n▪ A process that does not rely on individual interpretation and \njudgment. The process can be repeated across projects and with \ndifferent team members, irrespective of who is involved in the \ndevelopment. \n30/10/2014 Chapter 10 Dependable Systems 33</div></details><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · Attributes of dependable processes </summary><div class=\"lp-source-text\">Attributes of dependable processes \nProcess characteristic Description\nAuditable The process should be understandable by people apart \nfrom process participants, who can check that process \nstandards are being followed and make suggestions for \nprocess improvement.\nDiverse The process should include redundant and diverse \nverification and validation activities.\nDocumentable The process should have a defined process model that \nsets out the activities in the process and the \ndocumentation that is to be produced during these \nactivities.\nRobust The process should be able to recover from failures of \nindividual process activities.\nStandardized A comprehensive set of software development \nstandards covering software production and \ndocumentation should be available.\n34Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · Dependable process activities</summary><div class=\"lp-source-text\">Dependable process activities\n Requirements reviews to check that the requirements \nare, as far as possible, complete and consistent.\n Requirements management to ensure that changes to \nthe requirements are controlled and that the impact of \nproposed requirements changes is understood.\n Formal specification, where a mathematical model of the \nsoftware is created and analyzed. \n System modeling, where the software design is explicitly \ndocumented as a set of graphical models, and the links \nbetween the requirements and these models are \ndocumented. \n30/10/2014 Chapter 10 Dependable Systems 35</div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · Dependable process activities</summary><div class=\"lp-source-text\">Dependable process activities\n Design and program inspections, where the different \ndescriptions of the system are inspected and checked by \ndifferent people. \n Static analysis, where automated checks are carried out \non the source code of the program. \n Test planning and management, where a comprehensive \nset of system tests is designed. \n▪ The testing process has to be carefully managed to demonstrate \nthat these tests provide coverage of the system requirements \nand have been correctly applied in the testing process.\n30/10/2014 Chapter 10 Dependable Systems 36</div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · Dependable processes and agility</summary><div class=\"lp-source-text\">Dependable processes and agility\n Dependable software often requires certification so both \nprocess and product documentation has to be produced.\n Up-front requirements analysis is also essential to \ndiscover requirements and requirements conflicts that \nmay compromise the safety and security of the system. \n These conflict with the general approach in agile \ndevelopment of co-development of the requirements and \nthe system and minimizing documentation. \n30/10/2014 Chapter 10 Dependable Systems 37</div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Dependable processes and agility</summary><div class=\"lp-source-text\">Dependable processes and agility\n An agile process may be defined that incorporates \ntechniques such as iterative development, test-first \ndevelopment and user involvement in the development \nteam.  \n So long as the team follows that process and documents \ntheir actions, agile methods can be used. \n However, additional documentation and planning is \nessential so ‘pure agile’ is impractical for dependable \nsystems engineering.\n30/10/2014 Chapter 10 Dependable Systems 38</div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · Formal methods and dependability</summary><div class=\"lp-source-text\">Formal methods and dependability\n30/10/2014 Chapter 10 Dependable Systems 39</div></details>"}], "noAnswer": true, "sourceRange": "32–39", "appendix": true}, {"k": "SRC07", "title": "Formal methods", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 40–47. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch10-Original.pdf\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · Formal specification</summary><div class=\"lp-source-text\">Formal specification\n Formal methods are approaches to software \ndevelopment that are based on mathematical \nrepresentation and analysis of software.\n Formal methods include\n▪ Formal specification;\n▪ Specification analysis and proof;\n▪ Transformational development;\n▪ Program verification.\n Formal methods significantly reduce some types of \nprogramming errors and can be cost-effective for \ndependable systems engineering.\n40Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · Formal approaches</summary><div class=\"lp-source-text\">Formal approaches\n Verification-based approaches\n▪ Different representations of a software system such as a \nspecification and a program implementing that specification are \nproved to be equivalent. \n▪ This demonstrates the absence of implementation errors.\n Refinement-based approaches\n▪ A representation of a system is systematically transformed into \nanother, lower-level represention e.g. a specification is \ntransformed automatically into an implementation.\n▪ This means that, if the transformation is correct, the \nrepresentations are equivalent.\n30/10/2014 Chapter 10 Dependable Systems 41</div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Use of formal methods</summary><div class=\"lp-source-text\">Use of formal methods\n The principal benefits of formal methods are in reducing \nthe number of faults in systems.\n Consequently, their main area of applicability is in \ndependable systems engineering. There have been \nseveral successful projects where formal methods have \nbeen used in this area.\n In this area, the use of formal methods is most likely to \nbe cost-effective because high system failure costs must \nbe avoided. \n42Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · Classes of error</summary><div class=\"lp-source-text\">Classes of error\n Specification and design errors and omissions. \n▪ Developing and analysing a formal model of the software may \nreveal errors and omissions in the software requirements. If the \nmodel is generated automatically or systematically from source \ncode, analysis using model checking can find undesirable states \nthat may occur such as deadlock in a concurrent system.\n Inconsistences between a specification and a program. \n▪ If a refinement method is used, mistakes made by developers \nthat make the software inconsistent with the specification are \navoided. Program proving discovers inconsistencies between a \nprogram and its specification.\n30/10/2014 Chapter 10 Dependable Systems 43</div></details><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · Benefits of formal specification</summary><div class=\"lp-source-text\">Benefits of formal specification\n Developing a formal specification requires the system \nrequirements to be analyzed in detail. This helps to detect \nproblems, inconsistencies and incompleteness in the \nrequirements.\n As the specification is expressed in a formal language, it can \nbe automatically analyzed to discover inconsistencies and \nincompleteness.\n If you use a formal method such as the B method, you can \ntransform the formal specification into a ‘correct’ program.\n Program testing costs may be reduced if the program is \nformally verified against its specification.\n44Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · Acceptance of formal methods</summary><div class=\"lp-source-text\">Acceptance of formal methods\n Formal methods have had limited impact on practical \nsoftware development:\n▪ Problem owners cannot understand a formal specification and so \ncannot assess if it is an accurate representation of their \nrequirements.\n▪ It is easy to assess the costs of developing a formal specification \nbut harder to assess the benefits. Managers may therefore be \nunwilling to invest in formal methods.\n▪ Software engineers are  unfamiliar with this approach and are \ntherefore reluctant to propose the use of FM.\n▪ Formal methods are still hard to scale up to large systems.\n▪ Formal specification is not really compatible with agile \ndevelopment methods.\n45Chapter 10 Dependable Systems30/10/2014</div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · Key points</summary><div class=\"lp-source-text\">Key points\n System dependability is important because failure of \ncritical systems can lead to economic losses, information \nloss, physical damage or threats to human life.  \n The dependability of a computer system is a system \nproperty that reflects the user’s degree of trust in the \nsystem. The most important dimensions of dependability \nare availability, reliability, safety, security and resilience.\n Sociotechnical systems include computer hardware, \nsoftware and people, and are situated within an \norganization. They are designed to support \norganizational or business goals and objectives.\n30/10/2014 Chapter 10 Dependable Systems 46</div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · Key points</summary><div class=\"lp-source-text\">Key points\n The use of a dependable, repeatable process is \nessential if faults in a system are to be minimized. The \nprocess should include verification and validation \nactivities at all stages, from requirements definition \nthrough to system implementation.\n The use of redundancy and diversity in hardware, \nsoftware processes and software systems is essential to \nthe development of dependable systems.\n Formal methods, where a formal model of a system is \nused as a basis for development help reduce the number \nof specification and implementation errors in a system. \n30/10/2014 Chapter 10 Dependable Systems 47</div></details>"}], "noAnswer": true, "sourceRange": "40–47", "appendix": true}, {"k": "R01", "answer": "One defensible request is an independently verified pressure reading matched to the alarm and switch-over log. It helps distinguish a real pressure excursion from a sensor fault. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming operation.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence a decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "A coastal desalination control upgrade went live at 22:14, during peak demand.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Continue, revert, or hold the plant and ask for evidence?", "txt": "Pump P-204 is throwing intermittent high-pressure alarms. The backup train switches over automatically. Do you continue, revert, or hold the plant and ask for evidence?"}, {"c": "mag", "lab": "UNKNOWN", "lead": "The file says safe <i>under normal operation</i>. Tonight is not normal operation.", "txt": "At shift handover the operator silenced a repeating alarm to read the log. The regulator&rsquo;s file was written for a normal shift &mdash; and this is not one."}]}, {"t": "principle", "txt": "Dependability matters because failures can cause economic loss, information loss, physical damage and loss of user trust. The goal tonight is not certainty — it is a defensible boundary.", "src": "P1 · p.4"}], "timebox": "90 sec", "task": "Name the one piece of evidence you would demand before letting the plant run another hour.", "say": "You are the responsible engineer on shift. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching and is not a report of a real incident. Every rule tonight returns to this room. The classic mistake in a case lecture is explaining the theory before the students feel the pressure.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers — and what you must prove", "sub": "Six sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "DEPENDABILITY", "txt": "Can it be trusted?", "src": "P1 · p.3"}, {"c": "sand", "lab": "FAILURE CAUSES", "txt": "Where does failure start?", "src": "P1 · p.5"}, {"c": "teal", "lab": "SOCIOTECHNICAL", "txt": "How far does it reach?", "src": "P1 · p.19"}, {"c": "sand", "lab": "REDUNDANCY/DIVERSITY", "txt": "What do we add, and at what cost?", "src": "P1 · p.27"}, {"c": "teal", "lab": "DEPENDABLE PROCESS", "txt": "What proves it was built well?", "src": "P1 · p.32"}, {"c": "sand", "lab": "FORMAL METHODS", "txt": "What can actually be proved?", "src": "P1 · p.40"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Explain dependability as trust across availability, reliability, safety, security and resilience."}, {"c": "teal", "lab": "2", "txt": "Trace a failure across technical and sociotechnical layers."}, {"c": "teal", "lab": "3", "txt": "Compare redundancy, diversity, process and formal-method options, and name the trade-off."}, {"c": "mag", "lab": "4", "txt": "Build a bounded verdict with inspectable evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when a constraint changes."}]}], "timebox": "90 sec", "task": "Note which of the six sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total, no more. This slide exists so nobody leaves tonight unsure what was in the chapter and what was not &mdash; it stands in for the separate map and outcomes slides on the classroom path. Both remain in full, unabridged form in ISCARB Depth (R02, R03) for anyone who wants the two-slide version back.", "appendix": true, "route": "toolkit"}, {"k": "R09", "answer": "A candidate artifact is a dated, independently reviewed failover-test record covering the relevant fault and peak-load conditions. Approval also needs evidence that the pressure excursion is understood and the sensing paths are independent. A simulation that excludes a shared-sensor fault would weaken the argument and could reverse the decision.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State the observation that would force them to withdraw their own claim.", "title": "Evidence must be able to prove you wrong", "sub": "An answer is stronger when you state what would make you abandon it.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE", "txt": "What observation supports the claim?", "field": {"id": "f_evidence", "core": false, "rows": 3, "ph": "e.g. switch-over test record dated 14/09, signed by the commissioning engineer"}}, {"c": "mag", "lab": "COUNTER-EVIDENCE", "txt": "What observation would reverse the verdict?", "field": {"id": "f_counter", "core": false, "rows": 3, "ph": "e.g. the test used a simulated sensor, so a shared-sensor common mode was never exercised"}}]}, {"t": "pair", "id": "r09", "t1": "45 sec", "t2": "60 sec", "t3": "30 sec", "think": "Write your counter-evidence line alone first. No talking.", "pair": "Read your partner&rsquo;s counter-evidence. Could you actually go and look for it tomorrow, or is it a wish?", "share": "One pair reads out a counter-evidence line that turned out to be unobtainable."}, {"t": "principle", "txt": "Inspectability + falsifiability = a decision worth defending."}], "timebox": "90 sec", "task": "For tonight&rsquo;s plant, name one piece of evidence that would allow you to approve.", "notes": "If a pair cannot state counter-evidence, their claim is not yet an engineering claim — say that plainly rather than softening it. Rule 19 will test exactly this.", "appendix": true, "_iscarbRule": "RULE 09 - Falsification first", "route": "toolkit"}, {"k": "R10", "loadOk": "The 3×3 matrix and two fields describe one risk-triage record. Students classify three risks and specify one monitor and one vulnerability tool. Shorten the activity at this cut point; never squeeze the content into a fixed height.", "answer": "Place, for example, a shared-transmitter failure, an unverified switch-over time and a silenced alarm in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity, observation window, approved trigger, named owner and fallback action. A controlled fault-injection test can identify the shared-sensor vulnerability; retain its results as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it in a risk-framework step.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact you can hand to a reviewer."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Not everything unknown matters — only what could change the verdict."}, {"c": "teal", "lab": "MONITOR", "txt": "A signal that the uncertainty changed, with a value that triggers action and a person who acts.", "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}]}]}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "Identify &rarr; analyse &rarr; evaluate &rarr; <b>treat</b> &rarr; monitor. A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a vulnerability with a scan, a threat model or a common-mode walk-through, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; Jahiziah GKU 3, outcome 2", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "One tool or method you would use to identify a vulnerability in this plant &mdash; and which framework step it belongs to"}}, {"t": "principle", "txt": "Approval = evidence state + uncertainty statement + monitoring plan."}], "timebox": "3 min", "task": "Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "This unit now carries the one Jahiziah outcome the department mapped to this course and found uncovered: applying a risk management framework and naming a tool that identifies a vulnerability. Make every student write something in that field &mdash; an empty box here is the gap staying open. Do not accept a monitored risk without a trigger value and a named owner — a monitor with no trigger is a decision to look away slowly. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the engineer who claims, the engineer who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "No owner means the assurance claim cannot be audited.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "principle", "txt": "Three names, three roles, and none of them the same person."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "", "field": {"id": "a_owner", "core": false, "rows": 2, "ph": "Who decides?", "ex": "<i>Hospital case, for shape:</i> Decides &mdash; the ward clinical lead. Verifies &mdash; the biomedical engineer who ran the bench test. Signs &mdash; the head of medical devices. <b>Three names, three roles, and none of them the same person.</b> If your three collapse into one, that is your finding, not your mistake."}}, {"c": "sand", "lab": "", "field": {"id": "a_evidence", "core": false, "rows": 2, "ph": "Who verifies?"}}, {"c": "mag", "lab": "", "field": {"id": "a_signoff", "core": false, "rows": 2, "ph": "Who signs?"}}]}, {"t": "cards", "cols": 3, "items": [{"c": "sand", "lab": "WHY REGULATE AT ALL", "lead": "Companies profit; regulators limit that freedom for public safety.", "txt": "The near-universal model is privately owned companies offering goods and services for profit. To protect citizens, most governments regulate — limit the freedom of — those companies so their products must meet safety and security standards.", "src": "P1 · p.23"}, {"c": "teal", "lab": "REGULATED SYSTEMS", "lead": "Someone outside your organisation has to be convinced before it runs.", "txt": "Many critical systems must be approved by an external regulator before going into service — nuclear systems, air traffic control, medical devices. Development has to create the evidence that convinces the regulator the system is dependable, safe and secure.", "src": "P1 · p.24"}, {"c": "teal", "lab": "THE COST OF PROOF", "lead": "The paperwork can cost as much as the system.", "txt": "Regulation applies to the sociotechnical system as a whole, not simply the software. It can be as expensive to develop the documentation for certification as it is to develop the system itself.", "src": "P1 · p.25"}]}, {"t": "principle", "txt": "Human sign-off is an engineering control, not administrative decoration &mdash; and a name is for finding the decision, never for finding someone to blame."}], "timebox": "2 min", "task": "Name the decision owner, evidence owner and sign-off point for tonight — three different people.", "notes": "Students routinely name three roles that are the same person. That is the finding &mdash; say it out loud. Separation between the engineer who claims, the engineer who verifies and the authority who signs is the cheapest dependability control in the chapter. <b>Then spend thirty seconds on the second half of the princi
