 {k:'QA2',noAnswer:true,
  rule:'RETRIEVAL LOOP - Source',phase:'SOURCE EXPANSION / RETRIEVAL',accent:'sand',
  learn:'Recall the probability/judgment split, the largest single failure cause, the fault-error-failure chain and the dependency between the properties.',
  title:'Sixty seconds on the source',
  sub:'The expansion phase closes here. Four questions from the pages you just read &mdash; memory first, reveal second.',
  badge:{c:'',t:'RETRIEVAL',s:'60 seconds &middot; recall, then reveal'},
  blocks:[{t:'qa',tag:'X01 &middot; X02 &middot; X07',items:[
   {q:'Two dependability properties are probabilities; three are judgments. Which are which?',
    a:'Availability and reliability are probabilities &mdash; measure them. Safety, security and resilience are judgments &mdash; argue them to a threshold someone else accepts.'},
   {q:'Which failure class is now perhaps the largest single cause in sociotechnical systems &mdash; and what is the design answer?',
    a:'Operational failure: human operators make mistakes (p.5). The design answer is error tolerance (p.10) &mdash; the operator who silenced the alarm is a finding, not a discipline problem.'},
   {q:'One transmitter feeds both trains. Say tonight&rsquo;s incident as the three-part sentence: fault, error, failure.',
    a:'The shared transmitter is the <b>fault</b> &mdash; a defect doing nothing yet. The controller believing the pressure is high on both trains is the <b>error</b>. The unnecessary switch-over that interrupts the promised supply is the <b>failure</b>.'},
   {q:'Why can you never certify one property on its own?',
    a:'The properties depend on each other (p.11): safe operation needs availability and reliability; an attack that corrupts data makes the system unreliable; denial of service makes it unavailable.'}]}],
  timebox:'60 sec',
  task:'Answer from memory, reveal, then write the one you missed at the top of your notes.',
  notes:'Same discipline as the Understand loop, now over the source pages. Question 3 is the one that pays all semester &mdash; the three-part sentence is the shape of a defensible incident report, and the notes on X07 carry the correction script if a student orders it wrong. If the room misses question 1, do not reteach it here: name it, and let the principle line on X01 do the work on the next pass. Sixty seconds, then move.'},

/* ---------------- PRACTISE ---------------- */
 {k:'R06',answer:'Example: a release causes repeated service outages. CRISIS: users lose access. MAP: trace the release, database, operations team and users. TRADE-OFF: rollback restores the old version but delays the fix. EVIDENCE: compare error logs, deployment records and recovery tests. VERDICT: roll back under a named owner, monitor recovery and define the evidence needed before redeployment.',rule:'RULE 06 - ISCARB engineering flow',phase:'PRACTISE / FLOW',accent:'teal',
  learn:'Turn a set of source mechanisms into a five-step engineering decision.',
  title:'The five-step engineering flow',
  sub:'The source supplies mechanisms; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.',
  blocks:[
   {t:'cards',cols:5,items:[
    {c:'mag',lab:'1 CRISIS',txt:'Alarms during a live upgrade on a public water supply.'},
    {c:'teal',lab:'2 MAP',txt:'Equipment, software, operators, organisation, regulator.'},
    {c:'sand',lab:'3 TRADE-OFF',txt:'Redundancy and diversity against complexity and cost.'},
    {c:'violet',lab:'4 EVIDENCE',txt:'Test records, operator logs, a named sign-off.'},
    {c:'green',lab:'5 VERDICT',txt:'Continue, hold, revert — bounded, with a monitor.'}]},
   {t:'principle',txt:'Predict -&gt; Constraint -&gt; Derive -&gt; Name'}],
  timebox:'2 min',
  hueOk:'CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide and in every later reference. This is the one place the palette is a vocabulary.',
  task:'Use the flow to explain a failure you already know from software engineering.',
  notes:'Two minutes in pairs. Their examples will be outages they have lived through. Insist that step 4 names an artifact — this is the rehearsal for Rule 07.'},

 {k:'R07',
  answer:"Example claim: automatic operation is acceptable only after the backup path has been verified under the stated load and failure conditions. Counter-evidence: both trains use the same transmitter, or the recorded failover test excludes peak demand. Either observation would prevent the current evidence from supporting that claim.",
  rule:'RULE 07 - Decision card',phase:'PRACTISE / ARTIFACT',accent:'teal',golden:true,
  learn:'Build a decision card a stranger could audit without hearing them explain it.',
  title:'Your minimum inspectable artifact',
  sub:'A good classroom answer can be audited without your oral explanation.',
  /* Every example below is written about the WEEK 01 HOSPITAL case, never about
     tonight's plant. That is deliberate: a worked example has to show the shape
     of a good answer without handing over the answer being asked for. A student
     who copies these sentences has copied nothing usable, and a student who
     copies their structure has learned exactly what the slide is for. */
  blocks:[{t:'cards',cols:3,items:[
   {c:'teal',lab:'CLAIM',field:{id:'dc_claim',core:true,rows:3,ph:'What are you saying? e.g. loss of train A creates no safety event inside the operating envelope',
    ex:'<i>Hospital case:</i> The infusion pump firmware may ship to the two pilot wards, but not hospital-wide.'}},
   {c:'sand',lab:'EVIDENCE',field:{id:'dc_evidence',core:true,rows:3,ph:'What supports it? Name an artifact with a date and an owner',
    ex:'<i>Hospital case:</i> The 14 March bench-test report, signed by the biomedical lead, covering the two pump models the pilot wards actually hold.'}},
   {c:'violet',lab:'WARRANT',field:{id:'dc_warrant',core:true,rows:3,ph:'Why does that evidence support that claim?',
    ex:'<i>Hospital case:</i> Because the report tested the exact models in those wards &mdash; so it supports a claim about those wards, and nothing wider.'}},
   {c:'mag',lab:'COUNTER-EVIDENCE',field:{id:'dc_counter',core:true,rows:3,ph:'What would defeat it?',
    ex:'<i>Hospital case:</i> A single unlogged incident on either pilot ward would defeat it &mdash; and nobody has checked whether ward incident logs were kept during the test window.'}},
   {c:'green',lab:'UNCERTAINTY',field:{id:'dc_uncert',core:true,rows:3,ph:'What remains unknown?',
    ex:'<i>Hospital case:</i> Whether night-shift staffing changes how the alarm is answered. Not tested, and it could change the verdict.'}},
   {c:'teal',lab:'VERDICT',field:{id:'dc_verdict',core:true,rows:3,ph:'Approve / revise / reject — and on what condition?',
    ex:'<i>Hospital case:</i> Approve for the two pilot wards only, on condition that ward incident logs are reviewed weekly and the wider rollout returns for a second decision.'}}]}],
  loadOk:'Six fields, one artifact. The card is a single object and its shape is the lesson &mdash; a student who meets CLAIM and EVIDENCE on one slide and COUNTER-EVIDENCE on the next learns that counter-evidence is optional. It is filled across the whole hour, not in this timebox.',
  timebox:'2 min',
  hueOk:'The six colours are the six sections of one artifact, and the student learns to find COUNTER-EVIDENCE by its colour for the rest of the hour. Flattening them makes the card read as a wall of six identical boxes.',
  task:'Write one claim and one piece of counter-evidence for the same decision. Press C at any time to see your card.',
  notes:'The commonest failure is an EVIDENCE box that names an intention — &ldquo;we will test thoroughly&rdquo; — instead of an artifact. When you see it, ask only: what is its filename? This card is the spine of the session; every later rule adds a section to it.'},

 {k:'X03',
  loadOk:"The source stack and clickable layers form one trace-building activity. Students make one path across at least three layers; the text below explains its boundary. The mobile layout stacks the figure above the controls.",
  
  answer:"One plausible trace to investigate is Equipment (a pressure transmitter reading) → Application system (the controller interprets that reading and raises an alarm) → Business processes (the handover procedure allows the alarm to be silenced) → Organization (operations must own escalation and release approval) → Society (continuity of the public water supply). This is a causal hypothesis; use pressure, alarm and handover records to test each link.",
  rule:'X03 - The sociotechnical systems stack',phase:'SOURCE EXPANSION',accent:'sand',
  learn:'Trace a failure upward through the sociotechnical layers, past the application system.',
  title:'How far the failure reaches',
  sub:'The source figure becomes a failure-trace map: changes at one level ripple through the others.',
  blocks:[
   {t:'figure',native:'layers',mk:'p19',cap:'p.19',right:[{t:'stack'}]},
   {t:'principle',txt:'Systems engineering spans the whole stack. Software engineering spans only Operating system to Application system. Dependability is claimed over the whole stack and defended from the middle of it.'}],
  timebox:'3 min',
  task:'Trace tonight&rsquo;s failure through at least three layers, ending above Application system.'+' <b style="color:var(--mag)">You are the responsible engineer.</b>',
  notes:'Watch for traces that stop at Application system — exactly the mistake this chapter exists to correct. Push upward: does it reach Business processes, meaning the shift handover, and Society, meaning the regulator&rsquo;s open file? Two traces aloud, no more.'},

 {k:'R08',
  answer:"The position to defend is: keep the control architecture simple and invest in independent verification and validation unless evidence shows that diversity reduces common-mode risk more than the additional complexity increases it. Two plant trains alone do not establish independence, and the aircraft comparison does not certify this plant.",
  rule:'RULE 08 - 60-second source case',phase:'PRACTISE / CASE',accent:'mag',
  learn:'Argue the case against adding redundancy, using two certified aircraft as the evidence.',
  title:'Two certified aircraft, two opposite answers',
  sub:'Your plant already has two RO trains. Before you spend the budget on making them differ, look at what two certified aircraft decided.',
  blocks:[
   {t:'figure',native:'rd',mk:'rd',cap:'redundancy &amp; diversity strategies',srcName:'Course deck &middot; CPIT-455 Class 2',right:[
    {t:'cards',cols:2,items:[
     {c:'violet',ic:'plane',lab:'AIRBUS',lead:'Redundant <b>and</b> diverse.',txt:'Flight control is redundant and diverse — the copies also fail differently. Certified, and flying.',src:'P1 · p.30'},
     {c:'violet',ic:'plane',lab:'BOEING 777',lead:'Redundant, <b>not</b> diverse.',txt:'No software diversity. Some engineers advocate simplicity plus extensive V&amp;V instead.',src:'P1 · p.30'}]},
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'MAP',lead:'A spare copy, versus a <i>different</i> copy. Independence is the whole trick.',txt:'Redundancy keeps a second version available; diversity makes it fail differently. Both must be independent, or a common-mode failure defeats them.',src:'P1 · p.27'},
     {c:'sand',lab:'TRADE-OFF',lead:'Every copy you add is complexity you also have to defend.',txt:'Adding diversity and redundancy increases system complexity, which can increase the chance of error through unanticipated interactions between the redundant components.',src:'P1 · p.30'}]},
    {t:'wide',c:'green',lab:'VERDICT',txt:'The architecture does not settle the argument. The evidence regime around it does.'}]}],
  timebox:'90 sec',
  hueOk:'The two violet aircraft cards ARE the EVIDENCE step of the Rule 06 flow — violet is kept so the student recognises the same four steps applied to a real case, then teal MAP, sand TRADE-OFF and the green VERDICT follow the same mapping.',
  task:'Argue the Boeing position for tonight&rsquo;s plant in one sentence.',
  notes:'Make a student argue the no-diversity position out loud. Most cannot, and that tells them their grasp of outcome 3 is a slogan rather than a capability. This is the antidote to the reflex that redundancy is always an improvement.'},

 {k:'X04',answer:'The curve gives no numerical target. For availability, measure uptime as a proportion of a defined observation period and specify what counts as downtime. For failover, measure interruption duration under peak demand and defined faults. A break-even estimate also needs incremental engineering costs and credible failure-cost estimates. State assumptions before choosing a level.',rule:'X04 - Cost / dependability curve',phase:'SOURCE EXPANSION',accent:'sand',
  learn:'Identify the band where the next increment of dependability changes the decision, and name the measurement needed to prove it.',
  title:'What the next increment costs',
  sub:'Dependability costs tend to increase exponentially as increasing levels of dependability are required.',
  blocks:[
   {t:'figure',img:'p15',cap:'p.15',right:[
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'WHY IT RISES',lead:'Higher dependability needs costlier methods and hardware.',txt:'More expensive development techniques and hardware are required to achieve the higher levels.',src:'P1 · p.14'},
     {c:'teal',lab:'AND RISES AGAIN',lead:'And costlier proof that you reached it.',txt:'Increased testing and system validation is required to convince the client and the regulators that the required levels have been achieved.',src:'P1 · p.14'}]},
    {t:'wide',c:'sand',lab:'BREAK-EVEN GUARD',
     txt:'This curve is qualitative. It carries no 99%, no 99.9% and no currency values. Do not invent them — name the measurement you would need instead.',
     picker:{g:'curve',options:['Low','Medium','High','Very high','Ultra-high']},
     field:{id:'curve_metric',core:false,rows:2,ph:'The metric I would need before computing break-even, e.g. measured switch-over time of train B'}}]},
   {t:'wide',c:'mag',lab:'QUESTION FOR REFLECTION',lead:'If you cannot name the metric, you cannot defend the target.',
    txt:'A team asks for 99.99% dependability. Which property, observation period, operating conditions and measurement would make that claim testable?'},
   {t:'principle',c:'mag',src:'P1 &middot; p.16',
    txt:'The source also says it may be more cost effective to accept untrustworthy systems and pay the failure costs — but that depends on social and political factors, and on system type. <span style="color:#DDB27E">A regulated public water supply removes that option from the menu.</span>'}],
  timebox:'3 min',
  task:'Mark the band where the next increment changes your decision, then name the metric you would need to prove it.'+' <b style="color:var(--mag)">You are the responsible engineer.</b>',
  notes:'If a student states a percentage, ask which page it is on. It is on none of them. This is where the class learns the difference between evidence and confidence, and it is the same discipline you apply to AI at Rule 15. The closing line is from p.16 and bridges to Rule 12.'},

 /* Placed after the trade-off is priced and before falsification: you decided,
    you costed it, here is how it is actually built — and the next rule asks what
    would prove the whole thing wrong. Course addition, like Rules 14 and 15:
    it cites no page because it is not in this chapter, and that is the point. */
 {k:'B01',
  answer:"Illustrative project row: Requirement — the standby train must take over within an approved limit. Implementation — use independent sensing and a tested failover path. Tool — a controlled fault-injection test with timestamped measurements. Evidence — a dated failover-test-results.csv, linked to the requirement and reviewed by a named engineer. The last item names the file that must be produced; it does not claim the test has already passed.",
  rule:'B01 - From requirement to something you can build',phase:'PRACTISE / IMPLEMENTATION',accent:'violet',
  learn:'Turn a dependability requirement into a named mechanism, a concrete build, a tool that does it, and the artifact that proves it.',
  title:'You decided. Now what do you actually build?',
  sub:'The chapter names the property and the mechanism, then stops. This is the rest of the sentence.',
  badge:{c:'violet',t:'COURSE ADDITION',s:'not in the chapter — that is the gap'},
  blocks:[
   {t:'bridge'},
   {t:'wide',c:'mag',lab:'YOUR TURN — ONE ROW FOR YOUR OWN PROJECT',
    field:{id:'bridge_own',core:true,rows:1,ph:'Requirement &rarr; mechanism &rarr; what you build &rarr; the tool &rarr; the artifact a reviewer could open'}}],
  loadOk:'One field, but the table above it is five parallel readings the student scans rather than answers; splitting it would break the comparison that makes the pattern visible.',
  hueOk:'Each row is colour-matched to its property on X01 and X07 so the student recognises the same five things a third time — the colour is the index, not decoration.',
  timebox:'3 min',
  task:'Write one complete row for your own project. If the last cell is a promise rather than a file, the row is not finished.',
  say:'Everything so far taught you to decide. This slide is the one that tells you what to type on Monday.',
  notes:'Three minutes, and it is the slide students will thank you for. Two things to say and one trap to avoid. First: the tools are examples of <i>categories</i> &mdash; say that out loud, because a student who writes down &ldquo;SonarQube&rdquo; and not &ldquo;static analysis in the pipeline&rdquo; has learned a brand instead of a move, and brands change. Second: the last column is the whole reason this slide is allowed to exist in this course. A tool list is a magazine article; a tool list that ends in an artifact a reviewer could open is engineering, and it is the same discipline as Rule 09 two slides later. The trap: someone will ask which tool is best. Refuse the question and hand it back &mdash; best for what requirement, at what cost, with what evidence? That is Rule 08 and X04 again, and the fact that they can now ask it about a real tool rather than an aircraft is the measure of whether the hour worked. Walk the room during the field: the giveaway is a last cell that says &ldquo;we will test it&rdquo;, which is exactly the empty EVIDENCE box from Rule 07 wearing different clothes.'},

 {k:'R09',
  answer:"A candidate artifact is a dated, independently reviewed failover-test record covering the relevant fault and peak-load conditions. Approval also needs evidence that the pressure excursion is understood and the sensing paths are independent. A simulation that excludes a shared-sensor fault would weaken the argument and could reverse the decision.",
  rule:'RULE 09 - Falsification first',phase:'PRACTISE / EVIDENCE',accent:'teal',
  learn:'State the observation that would force them to withdraw their own claim.',
  title:'Evidence must be able to prove you wrong',
  sub:'An answer is stronger when you state what would make you abandon it.',
  blocks:[
   {t:'cards',cols:2,items:[
    {c:'teal',lab:'EVIDENCE',txt:'What observation supports the claim?',field:{id:'f_evidence',core:false,rows:3,ph:'e.g. switch-over test record dated 14/09, signed by the commissioning engineer'}},
    {c:'mag',lab:'COUNTER-EVIDENCE',txt:'What observation would reverse the verdict?',field:{id:'f_counter',core:false,rows:3,ph:'e.g. the test used a simulated sensor, so a shared-sensor common mode was never exercised'}}]},
   {t:'pair',id:'r09',t1:'45 sec',t2:'60 sec',t3:'30 sec',
    think:'Write your counter-evidence line alone first. No talking.',
    pair:'Read your partner&rsquo;s counter-evidence. Could you actually go and look for it tomorrow, or is it a wish?',
    share:'One pair reads out a counter-evidence line that turned out to be unobtainable.'},
   {t:'principle',txt:'Inspectability + falsifiability = a decision worth defending.'}],
  timebox:'90 sec',
  task:'For tonight&rsquo;s plant, name one piece of evidence that would allow you to approve.',
  notes:'If a pair cannot state counter-evidence, their claim is not yet an engineering claim — say that plainly rather than softening it. Rule 19 will test exactly this.'},

 {k:'X05',
  loadOk:"The source process table and four interpretation cards are one comparison. Students choose one row and identify one artifact, rather than completing four tasks. The column flows vertically and can scroll when expanded.",
  
  answer:"Choose the auditable-process row: request a dated change record linking the upgrade to its reviewed requirements, test results, independent reviewer and release decision. The filename, version and owner must let another engineer reconstruct how this specific release was approved.",
  rule:'X05 - Attributes of dependable processes',phase:'SOURCE EXPANSION',accent:'sand',
  learn:'Choose the process attribute that most changes a regulated decision, and name the artifact that verifies it.',
  title:'What proves it was built well',
  sub:'A dependable process is one that a different engineer could repeat from the record alone.',
  blocks:[
   {t:'figure',native:'table',mk:'p34',cap:'p.34',right:[{t:'cards',cols:2,items:[
    {c:'teal',lab:'EVIDENCE-PRODUCING ACTIVITIES',lead:'Activities that leave a record behind them.',txt:'Requirements reviews for completeness and consistency; requirements management to control change; formal specification; system modeling with documented links to requirements.',src:'P1 · p.35'},
    {c:'teal',lab:'AND THE REST OF THE LADDER',lead:'Checked by <i>different people</i>, not only by tests.',txt:'Design and program inspections checked by different people; static analysis of source code; test planning managed to demonstrate coverage of requirements and correct application.',src:'P1 · p.36'},
    {c:'sand',lab:'PROCESS DIVERSITY',lead:'Diversity in the <i>process</i>, not only the architecture — and far cheaper.',txt:'Validation should not depend on a single approach such as testing. Multiple different activities complement each other and allow cross-checking, which avoids process errors that lead to software errors.',src:'P1 · p.29'},
    {c:'green',lab:'WHY IT IS AUDITABLE',lead:'A stranger could repeat it from the record. That is what a regulator reads.',txt:'A process that does not rely on individual interpretation can be repeated across projects and team members. Regulators use process information to check that good practice was used.',src:'P1 · p.32-33'}]}]},
   {t:'principle',txt:'Diversity is not only an architecture move. It is a process move — and it is far cheaper.'}],
  timebox:'3 min',
  task:'Choose the table row that most changes tonight&rsquo;s decision, and name the artifact that would verify it.',
  notes:'Auditable is almost always the right answer for a regulated system and almost never the one students pick first — they pick Diverse because the trade-off phase made diversity salient. Name that contrast; it is a clean demonstration of recency bias in engineering judgment.'},

 {k:'X06',
  loadOk:"The source diagram, two proof approaches, benefits and limits must remain together to avoid presenting proof without its assumptions. Students pin one step only; the model answer expands into normal flow.",
  
  answer:"Model-check the switch-over logic against a precise safety condition, such as excluding a state in which both trains are unavailable while supply is required. Inspect any counterexample trace. A proof about the model still depends on its assumptions; it does not establish that a physical sensor is accurate or that operators follow the modeled procedure.",
  rule:'X06 - Formal specification',phase:'SOURCE EXPANSION',accent:'sand',
  learn:'Say what a formal method can prove, and why that is not the reason adoption stayed limited.',
  title:'What can actually be proved',
  /* the subtitle is gone: the ledger's dl-d below carries the same definition
     verbatim, with the page citation — one voice, not two. */
  blocks:[
   {t:'deflist',cap:'p.40',title:'Formal methods',
    def:'approaches to software development that are based on mathematical representation and analysis of software.',
    items:[['Formal specification','the system&rsquo;s obligations written as mathematics, not prose.'],
           ['Specification analysis and proof','properties of the specification itself checked before any code exists.'],
           ['Transformational development','the specification transformed, correctly, step by step toward implementation.'],
           ['Program verification','the program proved equivalent to its specification.']],
    foot:'Formal methods significantly reduce some types of programming errors and can be cost-effective for dependable systems engineering.',
    right:[{t:'cards',cols:2,items:[
    {c:'teal',lab:'VERIFICATION-BASED',lead:'Prove the program matches the specification.',txt:'Different representations — a specification and a program implementing it — are proved equivalent. Demonstrates the absence of implementation errors.',src:'P1 · p.41'},
    {c:'teal',lab:'REFINEMENT-BASED',lead:'Transform the specification down, correctly, step by step.',txt:'A representation is systematically transformed into a lower-level one. If the transformation is correct, the representations are equivalent.',src:'P1 · p.41'},
    {c:'green',lab:'WHAT IT CATCHES',lead:'Catches what testing cannot: states nobody thought to try.',txt:'Specification and design errors and omissions — model checking can find undesirable states such as deadlock in a concurrent system — and inconsistencies between a specification and a program.',src:'P1 · p.43'},
    {c:'mag',lab:'WHY ADOPTION STAYED LIMITED',lead:'The blocker is not rigour. <b>The problem owner cannot read the proof.</b>',txt:'Problem owners cannot understand a formal specification, so cannot assess whether it represents their requirements. Costs are easy to assess and benefits are hard. Engineers are unfamiliar. It is still hard to scale, and not compatible with agile.',src:'P1 · p.45'}]}]},
   {t:'principle',c:'mag',txt:'The reason we do not simply prove the plant correct is not that proof is weak. It is that the problem owner cannot read the proof — a sociotechnical limitation, which is this chapter&rsquo;s whole thesis.'}],
  timebox:'3 min',
  task:'Pin the formal-method step that would expose the most dangerous error in tonight&rsquo;s crisis.',
  notes:'Three minutes; the limitation card is the part that gets examined and the part most lectures skip. Say the closing line aloud — it connects formal methods back to Rule 12 and to the sociotechnical stack.'},

 {k:'R10',
  loadOk:"The 3×3 matrix and two fields describe one risk-triage record. Students classify three risks and specify one monitor and one vulnerability tool. Shorten the activity at this cut point; never squeeze the content into a fixed height.",
  
  answer:"Place, for example, a shared-transmitter failure, an unverified switch-over time and a silenced alarm in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity, observation window, approved trigger, named owner and fallback action. A controlled fault-injection test can identify the shared-sensor vulnerability; retain its results as evidence.",
  rule:'RULE 10 - Known, unknown, monitor',phase:'PRACTISE / UNCERTAINTY',accent:'teal',
  learn:'Convert an unknown into a monitored risk with a trigger value and a named owner, and place it in a risk-framework step.',
  title:'Make uncertainty operational',
  sub:'Do not write &ldquo;we are not sure&rdquo; and stop.',
  cut:true,
  blocks:[
   {t:'figure',matrixLeft:true,right:[
    {t:'cards',cols:1,items:[
     {c:'green',lab:'KNOWN',txt:'Facts already supported by an artifact you can hand to a reviewer.'},
     {c:'mag',lab:'UNKNOWN',txt:'A decision-sensitive gap. Not everything unknown matters — only what could change the verdict.'},
     {c:'teal',lab:'MONITOR',txt:'A signal that the uncertainty changed, with a value that triggers action and a person who acts.',
      field:{id:'monitor',core:false,rows:2,ph:'The risk I will watch rather than fix, its trigger value, and who acts'}}]}]},
   {t:'wide',c:'mag',lab:'THE FRAMEWORK STEP YOU ARE STANDING IN',
    lead:'Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.',txt:'Identify &rarr; analyse &rarr; evaluate &rarr; <b>treat</b> &rarr; monitor. A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a vulnerability with a scan, a threat model or a common-mode walk-through, and you evaluate it with a matrix like this one.',
    src:'Course addition &middot; Jahiziah GKU 3, outcome 2',
    field:{id:'vuln_tool',core:false,rows:2,ph:'One tool or method you would use to identify a vulnerability in this plant &mdash; and which framework step it belongs to'}},
   {t:'principle',txt:'Approval = evidence state + uncertainty statement + monitoring plan.'}],
  timebox:'3 min',
  task:'Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger.'+' <b style="color:var(--mag)">You are the responsible engineer.</b>',
  notes:'This unit now carries the one Jahiziah outcome the department mapped to this course and found uncovered: applying a risk management framework and naming a tool that identifies a vulnerability. Make every student write something in that field &mdash; an empty box here is the gap staying open. Do not accept a monitored risk without a trigger value and a named owner — a monitor with no trigger is a decision to look away slowly. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.'},

 {k:'QA3',noAnswer:true,
  rule:'RETRIEVAL LOOP - Practise',phase:'PRACTISE / RETRIEVAL',accent:'teal',
  learn:'Reproduce the six card slots, the sociotechnical reach, the falsification standard and the anatomy of a monitor.',
  title:'Sixty seconds on the flow',
  sub:'The practise phase built your artifact. Close it from memory before the mastery phase assumes it.',
  badge:{c:'',t:'RETRIEVAL',s:'60 seconds &middot; recall, then reveal'},
  blocks:[{t:'qa',tag:'RULES 07 &middot; 09 &middot; 10 &middot; X03',items:[
   {q:'The decision card has six slots. Name them in order.',
    a:'CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &middot; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it.'},
   {q:'A failure trace that stops at Application system has made which mistake?',
    a:'It never reached the layers where tonight&rsquo;s failure actually lives: Business processes &mdash; the handover that allowed the alarm to be silenced &mdash; and Society &mdash; the regulator&rsquo;s open file.'},
   {q:'What must a claim state so the evidence can prove it wrong?',
    a:'The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending.'},
   {q:'Turn &ldquo;we are not sure about the switch-over time&rdquo; into a monitor.',
    a:'A measured quantity, an observation window, a trigger value, a named owner and a fallback action &mdash; the unknown becomes a monitored risk, and the 3&times;3 grid was only its evaluate step.'}]}],
  timebox:'60 sec',
  task:'Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.',
  notes:'The practise loop points at the artifact, not at trivia: every question here is a slot or a standard the decision card must carry. Question 4 is the quiet one to watch &mdash; a monitor without a trigger value and an owner is a decision to look away slowly, and that was Rule 10&rsquo;s whole point. If a student cannot name all six slots, the card they will defend at Rule 17 is missing walls; send them to C for ninety seconds, not to the slides.'},

/* Course addition. The chapter's vocabulary is safety-critical engineering and
    it is correct; it is also not the vocabulary the same ideas are argued in at
    a company running services. A graduate who says "availability" and is asked
    "what is your SLO and your error-budget policy" understands the question and
    cannot answer it — which is a translation failure, not a knowledge gap, and a
    translation failure is closed in ninety seconds.

    Placed immediately after Rule 10 on purpose: that unit just made the student
    write a monitor with a trigger value and a named owner, which IS an
    actionable alert. The row is a naming of what they already built. */
 {k:'X08',
  answer:"Illustrative target, not a measured result or a value from the chapter: Monitor switch-over time on train B. Target: under 8 seconds, checked for each switch-over during a 7-day observation window. If the target is missed, alert the on-call engineer, invoke the agreed fallback procedure and re-test before returning to automatic operation. The target and fallback require approval for the actual system.",
  rule:'X08 - The same ideas, the other vocabulary',phase:'MASTER / VOCABULARY',accent:'violet',
  learn:'Say the dependability idea they have just used in the vocabulary a services team would use for it.',
  title:'You already know these. You may not know their other names.',
  sub:'Left column: what this chapter calls it. Right column: what the same argument is called where most of you will work. Same idea, different room.',
  badge:{c:'violet',t:'COURSE ADDITION',s:'not in the chapter &mdash; the chapter predates the vocabulary'},
  cornerLogos:[{k:'hrsd',alt:'Ministry of Human Resources and Social Development'}],
  blocks:[
   {t:'compare',head:['In this chapter','Where most of you will work','What the second one adds'],rows:[
    {c:'teal',cells:['Availability, as a property',
      'A service level objective &mdash; a stated target over a stated window',
      'A number and a period, so the argument stops being about whether it is available and starts being about whether the target was met']},
    {c:'teal',cells:['The cost curve rising steeply (X04)',
      'An error budget &mdash; the failure the target permits, spent deliberately',
      'It makes the trade-off a resource you allocate rather than a virtue you claim']},
    {c:'sand',cells:['A monitor with a trigger value and an owner (Rule 10)',
      'An actionable alert',
      'The rule that an alert nobody acts on is deleted, not tuned']},
    {c:'sand',cells:['Fault, error, failure (X07)',
      'The incident, and the post-incident review that follows it',
      'A written review with an owner and follow-up actions &mdash; the artifact this course keeps asking for']},
    {c:'mag',cells:['Blaming the operator ends the investigation (Rule 14)',
      'A blameless review',
      'It is a rule with a procedure, not a value with a poster']},
    {c:'violet',cells:['Redundancy and diversity (Rule 06, B01)',
      'Staged release, and limiting how much one change can touch',
      'It moves the defence from the failure to the change that causes most of them']}]},
   {t:'wide',c:'violet',lab:'ONE LINE, IN THE OTHER VOCABULARY',
    field:{id:'vocab_own',core:false,rows:1,
      ph:'Take the monitor you wrote in Rule 10 and state it as a target, a window, and what happens when it is missed'}}],
  hueOk:'Colours carry over from X07 and B01 so the student recognises which family each row belongs to; the row is a translation, and the colour is what says of what.',
  timebox:'90 sec',
  cut:true,
  task:'Read the middle column. Then restate your own Rule 10 monitor in it.',
  say:'Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.',
  notes:'Ninety seconds, and resist expanding it &mdash; the point is recognition, not instruction. Two things worth saying. First, the honest history: this chapter was written before the vocabulary in the middle column existed as a discipline, so the gap is chronological rather than a disagreement, and the concepts map almost one to one. Second, the direction of the translation matters: a student who learns only the middle column can run a dashboard and cannot argue a certification, while a student who has both can do both, which is the actual advantage this degree gives them. If someone asks which vocabulary is right, the answer is the room you are in &mdash; a regulator will not accept an error budget and a service team will not accept a hazard log, and knowing which is which is the skill. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.'},

 /* ---------------- MASTER ---------------- */
 {k:'R11',rule:'RULE 11 - Micro-case -> local case',phase:'MASTER / TRANSFER',accent:'sand',
  learn:'Reuse one mechanism-evidence-boundary chain in a different domain, and say what transfers and what breaks.',
  title:'Scaffold first, then transfer',
  sub:'Use the same mechanism-evidence-boundary chain twice — and the second time in a different domain.',
  blocks:[
   {t:'cards',cols:2,items:[
    {c:'teal',lab:'MICRO-CASE — ISCARB SCAFFOLD',txt:'Two redundant pumps are fed by one pressure transmitter on one loop. The backup switches automatically when the transmitter reports overpressure. What assumption fails, and what makes the two paths genuinely independent?',
     field:{id:'micro',core:false,rows:3,ph:'The failed assumption, and the independence you would need'}},
    {c:'mag',lab:'TRANSFER — THE WEEK 01 HOSPITAL CASE',txt:'Medical-device software passes all its tests, but organisational sign-off is weak. Run the same chain: which sociotechnical layer blocks approval, and does your desalination reasoning survive the change of domain?',
     field:{id:'transfer',core:false,rows:3,ph:'The blocking layer, and what transfers or breaks between the two domains'}}]},
   {t:'wide',c:'violet',ic:'pin',tag:'{{flag}} &nbsp;{{localTag}}',lab:'WHY BOTH CASES ARE LOCAL',
    lead:'The evidence has a named destination — and that is what takes &ldquo;accept the failure cost&rdquo; off the menu.',
    txt:'Desalination and hospital software are both regulated public services in {{country}}. {{accreditor}} links the field to {{bodies}}. That makes dependability a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording.'},
   {t:'principle',txt:'Mechanism -&gt; Evidence -&gt; Decision boundary'}],
  timebox:'1 min + 3 min',
  task:'Solve the micro-case, then reuse the same reasoning chain on the Week 01 hospital case, and name which of {{bodiesShort}} receives your evidence.'+' <b style="color:var(--mag)">You are the responsible engineer.</b>',
  notes:'Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about pumps has learned a case, not a capability. The hospital case is the one they met in the kickoff, so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.'},

 {k:'R12',rule:'RULE 12 - Owner, evidence, sign-off',phase:'MASTER / ACCOUNTABILITY',accent:'sand',golden:true,
  learn:'Separate the engineer who claims, the engineer who verifies and the authority who signs.',
  title:'A dependable answer names who owns what',
  sub:'No owner means the assurance claim cannot be audited.',
  blocks:[
   {t:'svg',kind:'accountability'},
   {t:'principle',txt:'Three names, three roles, and none of them the same person.'},
   {t:'cards',cols:3,items:[
    {c:'teal',lab:'',field:{id:'a_owner',core:false,rows:2,ph:'Who decides?',
     ex:'<i>Hospital case, for shape:</i> Decides &mdash; the ward clinical lead. Verifies &mdash; the biomedical engineer who ran the bench test. Signs &mdash; the head of medical devices. <b>Three names, three roles, and none of them the same person.</b> If your three collapse into one, that is your finding, not your mistake.'}},
    {c:'sand',lab:'',field:{id:'a_evidence',core:false,rows:2,ph:'Who verifies?'}},
    {c:'mag',lab:'',field:{id:'a_signoff',core:false,rows:2,ph:'Who signs?'}}]},
   {t:'cards',cols:2,items:[
    {c:'teal',lab:'REGULATED SYSTEMS',lead:'Someone outside your organisation has to be convinced before it runs.',txt:'Many critical systems must be approved by an external regulator before going into service — nuclear systems, air traffic control, medical devices. Development has to create the evidence that convinces the regulator the system is dependable, safe and secure.',src:'P1 · p.24'},
    {c:'teal',lab:'THE COST OF PROOF',lead:'The paperwork can cost as much as the system.',txt:'Regulation applies to the sociotechnical system as a whole, not simply the software. It can be as expensive to develop the documentation for certification as it is to develop the system itself.',src:'P1 · p.25'}]},
   /* Naming an owner without protecting them is how incidents stop being
      reported: if being named is how the organisation decides who is at fault,
      the rational response is to avoid being named, and within a year the
      near-misses stop reaching you. Rule 14 says blaming the operator ends the
      investigation — the rule that DEMANDS a name is where that sentence has to
      be said again, or the two units quietly contradict each other. It is one
      line rather than a card because the slide is already full, and the
      instructor notes carry the argument. */
   {t:'principle',txt:'Human sign-off is an engineering control, not administrative decoration &mdash; and a name is for finding the decision, never for finding someone to blame.'}],
  timebox:'2 min',
  task:'Name the decision owner, evidence owner and sign-off point for tonight — three different people.',
  notes:'Students routinely name three roles that are the same person. That is the finding &mdash; say it out loud. Separation between the engineer who claims, the engineer who verifies and the authority who signs is the cheapest dependability control in the chapter. <b>Then spend thirty seconds on the second half of the principle line, because a rule that demands a name is dangerous without it.</b> Ownership and blame are opposites and teams confuse them constantly. If being named is how the organisation decides who is at fault, then the rational move is to avoid being named &mdash; and within a year nobody reports the near-misses that would have shown you the failure while it was still cheap. The name answers <i>whose decision was this, and where is the reasoning recorded</i>; when it goes wrong the question is what let a reasonable person decide that, not who to replace. This is exactly the Rule 14 sentence about the operator, turned on the engineer, and if you skip it you have taught the room to hide.'},

 {k:'R13',rule:'RULE 13 - Breaking variable',phase:'MASTER / STRESS TEST',accent:'sand',
  learn:'Name the variable whose change would reverse their own verdict.',
  title:'What change would break your solution?',
  sub:'A robust answer exposes the variable that can reverse it.',
  blocks:[
   {t:'cards',cols:4,items:[
    {c:'sand',lab:'STAFFING',txt:'One qualified reviewer instead of three; the night shift runs with a trainee.'},
    {c:'sand',lab:'DEADLINE',txt:'The production window closes tonight; reverting costs a full day of supply.'},
    {c:'sand',lab:'DATA',txt:'The commissioning test data turns out to be from a different firmware baseline.'},
    {c:'sand',lab:'REGULATION',txt:'The regulator requires new evidence before the plant can run unattended.'}]},
   {t:'raw',html:'<div class="picker" data-pick="breaker"><button class="pick" data-v="Staffing" aria-pressed="false">Staffing</button><button class="pick" data-v="Deadline" aria-pressed="false">Deadline</button><button class="pick" data-v="Data" aria-pressed="false">Data</button><button class="pick" data-v="Regulation" aria-pressed="false">Regulation</button></div>'},
   {t:'pair',id:'r13',t1:'30 sec',t2:'60 sec',t3:'30 sec',
    think:'Pick your variable and decide, silently, whether your verdict survives it.',
    pair:'Swap variables with your neighbour and argue <i>their</i> variable against <i>your</i> verdict.',
    share:'Hands up: whose verdict survived all four? That room is the one to question.'},
   {t:'principle',c:'mag',txt:'If the verdict never changes, you probably have not named the real variable.'},
   /* Distributed retrieval. This item comes from the same five-item pool the
      readiness check uses at the end — asked here instead of there, roughly
      fifteen minutes after the shared-transmitter case was taught, which is the
      gap that makes retrieval work at all. Answering it here IS answering it

   {t:'recall',i:0}],
  timebox:'2 min',
  task:'Pick one variable and state exactly how it would reverse your current verdict — then answer the question underneath from memory.',
  notes:'Any student whose verdict survives all four has either designed something remarkable or has not committed to a verdict — almost always the second. This is the rehearsal for the live defense at Rule 17.'},

 {k:'R14',rule:'RULE 14 - Practitioner workload',phase:'MASTER / PRACTICE',accent:'sand',
  learn:'Name a workload cost their design creates for a practitioner, and the design change that reduces it.',
  title:'Engineering changes human work',
  sub:'A safe design can still fail operationally if it creates unsustainable workload.',
  blocks:[
   {t:'cards',cols:4,items:[
    {c:'teal',lab:'DOCUMENTATION BURDEN',lead:'Who writes and maintains all of it?',txt:'What must be produced, reviewed and maintained? &ldquo;It can be as expensive to develop the documentation for certification as it is to develop the system itself.&rdquo;',src:'P1 · p.25'},
    {c:'sand',lab:'REVIEW WORKLOAD',txt:'Who validates evidence, exceptions and changes — and do they have the hours the process assumes?'},
    {c:'mag',lab:'DELIVERY SPEED',txt:'What schedule pressure is the team absorbing, and what does it push them to skip?'},
    /* This unit already asks the three questions AI changed most, and until now
       it asked them as if nothing had changed. The card does not celebrate the
       tool or condemn it — it applies the unit's own rule to it: a change in how
       work is produced is a change in workload, and workload is a design input. */
    {c:'violet',ic:'spark',lab:'WHO WRITES IT NOW',lead:'Generated work moves the load; it does not remove it.',txt:'Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing more that they did not write. Volume against attention: the silenced alarm again.'}]},
   {t:'wide',c:'mag',lab:'TONIGHT, THIS IS THE MECHANISM — NOT A FOOTNOTE',
    lead:'Blaming the operator ends the investigation. Workload as a design input continues it.',txt:'The operator silenced a repeating alarm at shift handover in order to read the log. That is alarm load, shift timing and cognitive load acting as a system variable. The source calls operational error perhaps the largest single cause of failure in socio-technical systems (p.5), and offers error tolerance as the design response (p.10). Blaming the operator ends the investigation; treating workload as a design input continues it.',
    field:{id:'workload',core:false,rows:2,ph:'One workload cost your design creates, and the concrete design change that reduces it',
     ex:'<i>Shape only:</i> &ldquo;My design adds a signed exception form per deviation. With generated drafts the team now files four times as many, so the reviewer becomes the bottleneck. Design change: exceptions below a stated risk band get a standing pre-approval, and the reviewer sees a weekly batch instead of a queue.&rdquo;'}},
   {t:'principle',txt:'Trade-offs include people, process, evidence and time — not only code.'}],
  timebox:'90 sec',
  task:'Name one workload cost your preferred design creates for a real practitioner, and the design change that reduces it.',
  notes:'The rule with no equivalent in the textbook, and where ISCARB differs from a standard software-engineering lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change &mdash; alarm rationalisation, a handover protocol, a second pair of eyes on the night shift. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b> Every student in the room is already using generated code, and almost none of them has been asked what it did to the review load rather than to the writing load. Two things to say. First, the honest framing: the tool did not remove the work, it moved it &mdash; from writing, which is visible and estimated, to reviewing, which is neither. Second, connect it to the crisis: the operator silenced the alarm because there were too many alarms for the attention available, and a reviewer who approves without reading is the same failure with a keyboard. If a student answers &ldquo;it just makes us faster&rdquo;, ask who reviews the faster output and how many hours they have.'},

 {k:'R15',
  answer:"<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>",
  rule:'RULE 15 - AI assist + human sign-off',phase:'MASTER / AI',accent:'sand',
  learn:'Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.',
  title:'AI prepares evidence; humans own assurance',
  sub:'AI is permitted for preparation, never for unowned approval.',
  cornerImg:{k:'genai',alt:'Generative AI — assist, not assurance',cap:'AI MOMENT &middot; assist, not assurance'},
  blocks:[
   {t:'aiflow'},
   {t:'aigate'}],
  timebox:'90 sec',
  task:'Run the gate on the way you actually used AI this week — on a real output, not a hypothetical.'+' <b style="color:var(--mag)">You are the responsible engineer.</b>',
  notes:'The gate is the rule, not the three stations above it — make every student run it on something they really did this week, not on a hypothetical. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second &mdash; which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. It means the artifact you file is the test you ran and what it showed, never the prompt or the answer. A student who cannot say which of the two middle questions their own use passed has not yet understood what they filed. The remaining trap is yes / no / no: an output that becomes evidence and is neither re-derivable nor testable is exactly the unverifiable claim this course exists to refuse. Note what is deliberately absent: vendor benchmark numbers. If a student cites an accuracy figure or a mean-time-to-repair, ask which study. That is the break-even discipline from X04 applied to AI, and if you let it slide the session&rsquo;s whole argument about evidence collapses in its final ten minutes.'},

/* The mastery retrieval close: the last retrieval before the defense grades
   the room, so it rehearses exactly the four moves the defense will press. */
 {k:'QA4',noAnswer:true,
  rule:'RETRIEVAL LOOP - Master',phase:'MASTER / RETRIEVAL',accent:'sand',
  learn:'Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.',
  title:'Sixty seconds on mastery',
  sub:'Before the defense phase grades you: the four moves mastery is made of. Memory first.',
  badge:{c:'',t:'RETRIEVAL',s:'60 seconds &middot; recall, then reveal'},
  blocks:[{t:'qa',tag:'RULES 12 &middot; 13 &middot; 14 &middot; 15',items:[
   {q:'Three names, three roles, none of them the same person. Which roles?',
    a:'The <b>owner</b> decides, the <b>evidence owner</b> verifies, the <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited.'},
   {q:'What is a breaking variable?',
    a:'The variable whose change would reverse your verdict &mdash; staffing, deadline, data baseline, regulation. If your verdict survives all four, you have not named the real one.'},
   {q:'Your design adds four signed exception forms per shift. Which question does Rule 14 ask &mdash; and what shape of answer does it want?',
    a:'What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. standing pre-approval below a stated risk band, a weekly batch instead of a queue.'},
   {q:'Where may AI sit in the assurance flow, and where may it never sit?',
    a:'AI prepares &mdash; drafts, searches, checks. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer.'}]}],
  timebox:'60 sec',
  task:'Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.',
  notes:'The mastery loop is the last retrieval before the room is graded on defense, so it rehearses the four moves the defense will press: ownership, the breaking variable, workload and the AI gate. Question 3 wants a design change, not sympathy &mdash; the same test Rule 14 itself applies. Question 4 is deliberately the exact sentence from the flow: AI prepares, never owns, a human signs &mdash; if the room can say that sentence cold, Rule 15 landed.'},

 {k:'R16',rule:'RULE 16 - Grade the decision',phase:'DISTINGUISH / ASSESSMENT',accent:'teal',
  learn:'Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.',
  title:'What a strong answer looks like here',
  sub:'Four capability levels for tonight&rsquo;s verdict. These are levels, not marks — the mark follows the level.',

    {c:'teal',lab:'L2 &nbsp; REASONING',lead:'The mechanism, cited — but nothing to inspect.',

    {c:'sand',lab:'L3 &nbsp; JUSTIFYING',lead:'A dated, owned artifact, and a stated way to be wrong.',

   {t:'wide',c:'mag',lab:'READINESS IS A GATE, NOT A LEVEL',
    lead:'A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.',
    txt:'Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight — CLO1, 5 marks, {{assignmentDue}} — and its evidence policy is the same one: cite the source page, or mark the claim <i>unmeasured</i> with the measurement you would need.'}],
  hueOk:'Four levels on one rail, each with its own colour, is the scale itself — a two-colour version stops reading as an ordered ladder.',
  timebox:'90 sec', cut:true,
  task:'Pick the level you think you are at, then read the line under it: it says what your card actually carries.',
  notes:'The picker is self-assessment; the line under it is read from the boxes the student actually filled and cannot be talked up. Point at the gap between the two — it is always a specific empty box, which is why this is a teaching instrument rather than a mark. The semester grade weights belong to the Week 01 kickoff and repeating them here wastes ninety seconds — this slide answers the only question that matters tonight: what separates a weak answer from a defensible one in THIS chapter. Make each student name their own level out loud; most say L2 and are right, and the honesty is the point. Keep formal scoring off the live slide, as the peer-review rule requires. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.'},

 {k:'R17',rule:'RULE 17 - Constraint mutation',phase:'DISTINGUISH / DEFENSE',accent:'teal',
  learn:'Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.',
  title:'The live engineering defense',
  sub:'You will not only present a verdict; the constraint will change live.',

    {c:'mag',lab:'2 MUTATE',txt:'Constraint changes live'},
    {c:'sand',lab:'3 REASON',txt:'Re-run the mechanism'},
    {c:'violet',lab:'4 DEFEND',txt:'Show the changed evidence'},
    {c:'green',lab:'5 VERDICT',txt:'Revise only if needed'}]},
   {t:'wide',c:'sand',lab:'MUTATE TONIGHT&rsquo;S CASE — PICK ONE',
    picker:{g:'mutation',options:['It is a hospital oxygen plant','The regulator withdraws approval mid-shift','Budget halves: one lever only','Train B is three years older']},
    field:{id:'mutation_defend',core:true,rows:2,ph:'Which part of your verdict survives, and which part collapses — and why'}},

  timebox:'4 min',
  hueOk:'PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.',
  task:'Pick one mutation and state which part of your verdict survives and which collapses.'+' <b style="color:var(--mag)">You are the responsible engineer.</b>',
  notes:'Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses — stronger than a verdict that magically survives everything. Refusing to revise under a changed constraint is not robustness; it is not having reasoned in the first place.'},

 {k:'R18',rule:'RULE 18 - Make the system operable',phase:'DISTINGUISH / PROCESS',accent:'teal',
  learn:'Name the agile practice that survives certification, and the evidence discipline it must add.',
  title:'What survives of agile here',
  sub:'A strong process removes operational ambiguity before the day it is needed.',
  blocks:[
   /* Two voices share this slide and used to share the same boxes: the two
      claims the chapter makes, and the course's own 22:14 turn.
      A zones block draws the seam so nobody has to guess which voice speaks —
      teal header = cited from the source, magenta header = course context.
      Session logistics (next-session reading, timetable, contact) used to sit
      here too; they were removed — mid-lecture is where content lives, not
      admin. That information belongs before the hour opens, not inside it. */
   {t:'zones',
    book:{ic:'book',tag:'FROM THE BOOK',sub:'Sommerville Ch.10 — the two claims',items:[
     {c:'teal',lab:'THE CONFLICT',lead:'Certification wants documents up front. Agile minimises both.',txt:'Dependable software often requires certification, so both process and product documentation must be produced. Up-front requirements analysis is essential to discover conflicts that compromise safety and security. These conflict with agile&rsquo;s co-development of requirements and system, and with minimizing documentation.',src:'P1 · p.37'},
     {c:'green',lab:'WHAT SURVIVES',lead:'Iteration and test-first survive. Pure agile does not.',txt:'An agile process may be defined that includes iterative development, test-first development and user involvement. So long as the team follows that process and documents its actions, agile methods can be used. But additional documentation and planning is essential, so pure agile is impractical for dependable systems engineering.',src:'P1 · p.38'}]},
    course:{ic:'pin',tag:'FROM YOUR COURSE',sub:'not in the chapter — your context',items:[
     /* The hour opens on a change that went live at 22:14 during peak demand, and
        until now it never came back to that fact. Deployment is the most common
        real cause of the failure the whole session is about, and the crisis had
        already set it up — the tether was there and nothing pulled on it. */
     {t:'wide',c:'mag',lab:'BACK TO 22:14 — THE PART NOBODY CALLED A DESIGN DECISION',
      lead:'The upgrade went live at peak demand with no revert window. That was a process choice, and it is the one you can actually change.',
      txt:'The thing that put you in the room was a <i>change</i>: a control upgrade released at 22:14, at peak demand, with no way back. Three questions the process owes an answer to, none about the software. <b>When</b> may a change go live, and who may waive the window? <b>How</b> does it go back &mdash; a revert that was exercised and dated, not written down? <b>How much</b> does one change touch &mdash; could it have gone to one train before both? A defined process answers these in advance; an improvised one discovers them at 22:14.'}]}},
   {t:'principle',txt:'The line is not agile against not-agile. It is defined-and-recorded against improvised.'}],
  timebox:'2 min',
  task:'Name the agile practice you keep and the evidence discipline it must add &mdash; then say what the change window and the revert path should have been at 22:14.',
  notes:'Test-first is the practice that survives certification best, because it produces the artifact as a by-product rather than as extra work. Say that &mdash; it is the one thing on this slide students can use in their project next week. <b>Then spend a full minute on the magenta card.</b> The crisis that opened the hour was a deployment, and the room has spent seventy minutes arguing about the plant without once asking about the release that put them there. That is the most common mistake in industry as well as in the classroom: the failure gets attributed to the component that broke rather than to the change that exposed it. Three answers to look for &mdash; a change window with a named waiver authority, a revert that has been <i>exercised</i> and dated rather than documented, and a staged release that would have touched one train before both. A student who says &ldquo;we would have tested more&rdquo; has not answered; push for which of the three.'},

 {k:'R19',rule:'RULE 19 - Quick card',phase:'DISTINGUISH / PEER REVIEW',accent:'teal',
  learn:'Test a peer\'s claim for inspectability and falsifiability in two questions.',
  title:'Peer-review quick card',
  sub:'Use two questions in class; keep formal scoring outside the live slide.',
  blocks:[

    {c:'teal',lab:'1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?',txt:'Could another team verify the claim without trusting your explanation, or the AI or tool that prepared it?',
     field:{id:'peer1',core:false,rows:2,ph:'Your partner&rsquo;s card — your answer'}},
    {c:'mag',lab:'2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?',txt:'Name the variable, counter-example, missing evidence or failure condition that would reverse the verdict.',
     field:{id:'peer2',core:false,rows:2,ph:'Your partner&rsquo;s card — your answer'}}]},

 {k:'J02',rule:'JAHIZIAH - Knowledge unit check',phase:'DISTINGUISH / READINESS',accent:'teal',
  learn:'Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.',
  title:'Five items in the national format',
  sub:'Retrieval, not revision. Answer before you look at anything &mdash; a wrong answer here names the unit you should reread.',
  badge:{c:'',t:'PRACTICE ONLY',s:'course-written · not real test items'},
  blocks:[{t:'jahtest'}],
  timebox:'4 min',
  task:'Answer all five, then read the explanation on the ones you missed.',
  notes:'Four minutes, individually and in silence &mdash; this is retrieval practice and it only works unaided. Two disciplines to hold: say once, clearly, that these are course-written practice items and not real test questions, and do not let students treat the score as a prediction. The teaching value is in the misses: each item names its knowledge-unit outcome, so a wrong answer points at a specific unit to reread rather than at a vague weakness. Items 3 and 4 are the ones the department mapped to this course as uncovered, so watch those two in particular &mdash; if the room fails them, Rule 10 did not land and the gap is still open.'},

 /* The unit that makes "we lost nothing" checkable rather than remembered. It
    renders no authored list: the ledger is computed from the page cited on every
    card in this file, and the uncited-page line needs no metadata at all. */
 {k:'C01',rule:'SOURCE LEDGER - what this hour reached',phase:'DISTINGUISH / SCOPE',accent:'sand',
  learn:'Say which parts of the source this hour reached and which it did not, from the citations rather than from memory.',
  title:'What we covered, and what we did not',
  sub:'Counted from the page you saw cited on every card tonight &mdash; not from a list somebody maintained by hand.',
  badge:{c:'',t:'SCOPE',s:'read from citations'},
  cut:true,
  blocks:[
   {t:'coverage'},
   {t:'principle',txt:'A chapter you did not finish is a fact. A chapter you did not finish and nobody noticed is a defect.'}],
  timebox:'90 sec',
  task:'Read the magenta page ranges in the assigned Chapter 10 source-slide pack before Assignment 1 ({{assignmentDue}}). C01 lists the exact ranges; the preparation section of your exported decision card repeats them.',
  say:'Here is every page of the chapter, and here is exactly which ones this hour actually touched.',
  notes:'Ninety seconds, and it is the most honest slide in the deck &mdash; put it up deliberately rather than skipping past it. Two things to say. First, the ledger is <i>computed</i>: it reads the page citation off every card in the file, so it cannot flatter the lecture and it changes the moment the lecture changes. Second, the magenta line is pages, not topics: the engine can tell you a page was never reached, and it deliberately does not guess what is on it &mdash; naming a concept nobody cited would be exactly the unsupported claim this course refuses. Section 3 shows as <i>touched</i> rather than <i>taught</i> because only X04 reaches it; say that out loud, because a student who wants the cost argument in depth now knows where to go. This is a designated cut point: if behind, say the closing sentence once and ask students to review C01 before submitting Assignment 1. The ledger remains available in All units and the exported decision card.'},

 {k:'R20',
  loadOk:"The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line. Keep the instruments visible in sequence; use vertical scrolling for expansion.",
  
  answer:"Example: In this chapter, engineering means making a bounded decision that another person can inspect, test and challenge, with a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.",
  rule:'RULE 20 - Take-home decision',phase:'DISTINGUISH / READINESS',accent:'teal',golden:true,
  learn:'Read their own readiness off the artifact they produced, and name the next piece of work.',
  title:'Are you ready to engineer?',
  sub:'The four gates are your judgment. The five rows are not — they read the evidence you produced, and they sort it the way {{accreditor}} sorts learning outcomes: knowledge, skill, value.',
  badge:{c:'',t:'READINESS CHECK',s:'click each gate you can honestly pass'},
  blocks:[
   {t:'gates'},
   {t:'clomap'},
   {t:'principle',txt:'A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible.'},
   {t:'wide',c:'sand',lab:'TAKE-HOME DECISION',
    field:{id:'takehome',core:false,rows:1,ph:'In this chapter, engineering means ... (use evidence and ownership)'}}],
  timebox:'3 min',
  task:'Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo;'+' <b style="color:var(--mag)">You are the responsible engineer.</b>',
  notes:'The domain tags are deliberate. {{accreditorLong}} runs the national standardized exams — <b>{{testName}}</b> — which assess graduates of computer science, software engineering, information systems and information technology on exactly three categories of learning outcome: {{domainWords}}. Say clearly that this slide is <i>aligned</i> to those three domains and is not the exam itself; the exam is national, sat near graduation, and does not decide pass or fail. What it does mean is that the values column — the one most courses cannot evidence at all — is the one your decision card fills tonight. Two different instruments, and students confuse them: the four gates are self-assessed judgment, the five outcome rows are read from the artifact and cannot be talked up. Point at a red row and ask what is missing — the answer is always a specific empty box, which is why this is a teaching instrument rather than a score. A gate, not a summary. A student who cannot pass all four gates has not failed the session — they have an accurate reading of their own evidence, which is the entire point. Say that explicitly, otherwise the honest students feel punished and start guessing.'},

/* v24 ISCARB FOCUS PASS — content-data only; engine untouched. */
(function(){
  var U=LECTURE.units;
  function get(k){ for(var i=0;i<U.length;i++) if(U[i].k===k) return U[i]; return null; }
  function cp(base,over){ return Object.assign({},base,over); }
  var repl={};

  var r05=get('R05');
  repl.R05=[cp(r05,{
    title:'Predict before the reveal',
    sub:'Commit to a bounded prediction before the terminology makes it feel obvious.',
    blocks:[
      {t:'chain',cols:4,items:[
        {c:'teal',lab:'PREDICT',txt:'Which promise fails first tonight?',picker:{g:'predict',options:['Avail.','Rel.','Safety','Sec.','Resil.']}},
        {c:'mag',lab:'CONSTRAINT',field:{id:'p_constraint',core:false,rows:2,ph:'What could change your answer?'}},
        {c:'sand',lab:'DERIVE',field:{id:'p_derive',core:true,rows:2,ph:'This holds only if ...; what is still unmeasured?',ex:r05.blocks[0].items[2].field.ex}},
        {c:'violet',lab:'NAME',field:{id:'p_name',core:false,rows:2,ph:'Name the principle you used.'}}
      ]},
      {t:'coach',watch:['p:predict','f:p_constraint','f:p_derive','f:p_name'],deep:['f:p_constraint','f:p_derive'],minKey:'coachDeep',
       empty:'Start with the promise to the city, not the property name. Which promise breaks first tonight?',
       thin:'Finish: “This holds only if …” Then name the missing measurement.',
       ok:'Committed. Sign it; the reveal comes next.'},
      {t:'sign',id:'r05_predict',fields:['p:predict','f:p_constraint','f:p_derive','f:p_name'],label:'Sign this prediction',
       before:'Complete all four boxes first.',ready:'Ready to sign.',warn:'Signing freezes these four answers.',done:'Signed. Any change after the reveal belongs in a later box.'}
    ],
    task:'Predict &rarr; constrain &rarr; derive &rarr; name &rarr; sign. <b style="color:var(--mag)">You are the responsible engineer.</b>'
  })];

  var h01=get('H01');
  repl.H01=[cp(h01,{
    title:'Three prompts when DERIVE is stuck',
    sub:'Use one prompt only, then go back and finish the derivation.',
    blocks:[
      {t:'cards',cols:3,items:[
        {c:'teal',lab:'1 &nbsp; PROMISE',lead:'Which promise to the city breaks first?',txt:'Start from the service promise, not the textbook label.'},
        {c:'sand',lab:'2 &nbsp; NOTICE',lead:'At 22:14, who notices the problem — and how?',txt:'Night operation changes how a failure becomes visible.'},
        {c:'mag',lab:'3 &nbsp; FALSIFY',lead:'Finish: “I would drop this prediction if I saw …”',txt:'What follows “if” is the constraint your derivation must explain.'}
      ]},
      {t:'principle',c:'mag',txt:'A blank DERIVE box usually means the question is being asked at the wrong altitude.'}
    ],
    task:'Use one prompt, then press &larr; and finish DERIVE.'
  })];

  var x02=get('X02');
  repl.X02=[
    cp(x02,{
      title:'Where failures begin',
      sub:'Start with the origin before you argue about the property.',
      blocks:[
        {t:'cards',cols:3,items:[
          {c:'teal',lab:'HARDWARE',lead:'Design, manufacturing, or wear-out.',txt:'Physical components can be wrong from birth or fail with age.',src:'P1 · p.5'},
          {c:'teal',lab:'SOFTWARE',lead:'Specification, design, or implementation error.',txt:'The defect may exist before the code ever runs.',src:'P1 · p.5'},
          {c:'mag',lab:'OPERATION',lead:'Human error — perhaps the largest single cause.',txt:'In sociotechnical systems, operation is part of the system.',src:'P1 · p.5'}
        ]},
        {t:'wide',c:'sand',lab:'CLASSIFY TONIGHT',picker:{g:'cause',options:['Hardware','Software','Operational','Mixed']},
         field:{id:'cause_defeat',core:false,rows:2,ph:'What log or observation would defeat your classification?'}}
      ],
      timebox:'60 sec',
      task:'Classify the origin, then name the evidence that could prove you wrong.'
    }),
    cp(x02,{
      k:'X02B',rule:'X02B - Dependencies and error tolerance',title:'Why one failure becomes another',
      sub:'Dependability properties interact; a design decision in one layer can move the failure elsewhere.',
      blocks:[
        {t:'cards',cols:3,items:[
          {c:'teal',lab:'REPAIRABILITY',lead:'Can it be restored after failure?',src:'P1 · p.10'},
          {c:'teal',lab:'MAINTAINABILITY',lead:'Can it be changed for new requirements?',src:'P1 · p.10'},
          {c:'mag',lab:'ERROR TOLERANCE',lead:'Can user mistakes be prevented or tolerated?',src:'P1 · p.10'}
        ]},
        {t:'wide',c:'sand',lab:'DEPENDENCIES',lead:'None of the five properties stands alone.',
         txt:'Safety needs reliable, available operation. An attack can destroy reliability or availability.',src:'P1 · p.11'},
        {t:'principle',c:'mag',txt:'The silenced alarm is not only a people problem; under error tolerance it is a design finding.'}
      ],
      answer:'A shared transmitter can couple both trains, so a single fault may threaten reliability and resilience even if the backup keeps service available. The alarm-handling workload is also a design condition because error tolerance includes avoiding or tolerating user mistakes.',
      timebox:'60 sec',task:'Name one dependency that matters tonight — and what evidence would expose it.',notes:x02.notes
    })
  ];

  var x07=get('X07');
  repl.X07=[
    cp(x07,{
      title:'Fault → error → failure',
      sub:'Three different things. Keep them in causal order.',
      blocks:[
        {t:'compare',head:['Term','Meaning','Tonight'],rows:[
          {c:'teal',cells:['Fault','A defect exists.','One transmitter feeds both trains.']},
          {c:'sand',cells:['Error','The system enters a wrong internal state.','The controller believes the wrong pressure.']},
          {c:'mag',cells:['Failure','The promised service is visibly broken.','A switch-over interrupts service.']}
        ]},
        {t:'conceptflow',items:[['FAULT','Defect exists'],['ERROR','Wrong internal state'],['FAILURE','Service breaks']]},
        {t:'principle',c:'mag',txt:'A fault may stay dormant. A failure is what the user or mission finally sees.'}
      ],
      cut:false,timebox:'60 sec',task:'Say tonight&rsquo;s incident as one sentence: fault &rarr; error &rarr; failure.'
    }),
    cp(x07,{
      k:'X07B',rule:'X07B - Which property is actually open?',title:'Which dependability property did it threaten?',
      sub:'The service can stay up and still be unreliable, unsafe, insecure, or fragile.',
