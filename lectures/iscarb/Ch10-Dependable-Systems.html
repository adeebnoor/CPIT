<title>ISCARB Lecture Engine</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<style>
/* ================= ISCARB BRAND TOKENS ================= */
:root{
  --ground:#08070C; --panel:#15121C; --panel2:#100E16; --bar:#0C0A11;
  --line:#2C2534; --line2:#221C29;
  --ink:#F5F0EA; --dim:#A99E95; --dim2:#6F665F;
  --sand:#DDB27E; --sand-lt:#F0D6AE;
  --mag:#F0189A; --teal:#4FC6CB; --violet:#8E7DEA; --green:#4FBF8B;
  --disp:"Poppins","Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Inter","Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);margin:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ground)}
#stage{width:1333px;height:750px;position:relative;transform-origin:center center;overflow:hidden;
  background:
    radial-gradient(900px 460px at 84% -8%, rgba(240,24,154,.10), transparent 62%),
    radial-gradient(760px 420px at 6% 108%, rgba(221,178,126,.07), transparent 60%),
    var(--ground);}
/* star field — brand night sky, static and faint */
#stars{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.1px 1.1px at 12% 18%, #fff, transparent),
    radial-gradient(1px 1px at 27% 8%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 41% 24%, #fff, transparent),
    radial-gradient(1px 1px at 58% 11%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 73% 21%, #fff, transparent),
    radial-gradient(1px 1px at 88% 7%, #fff, transparent),
    radial-gradient(1px 1px at 6% 42%, #fff, transparent),
    radial-gradient(1.1px 1.1px at 95% 38%, #fff, transparent),
    radial-gradient(1px 1px at 34% 3%, #fff, transparent),
    radial-gradient(1px 1px at 66% 32%, #fff, transparent);}

/* phase rail */
#rail{position:absolute;top:0;left:0;right:0;height:3px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;z-index:5}
#rail i{display:block;background:var(--line2);position:relative;overflow:hidden}
#rail i b{position:absolute;inset:0;width:0;background:var(--sand);transition:width .35s ease;display:block}
#rail i.done b{width:100%;background:var(--dim2)} #rail i.now b{background:var(--mag)}

/* ================= SLIDE FRAME ================= */
.slide{position:absolute;inset:0 0 78px;padding:22px 36px 8px;display:none;flex-direction:column}
.slide.on{display:flex}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.count{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.pill{display:inline-block;border:1.5px solid;border-radius:9px;padding:7px 19px;margin-top:13px;
  font-size:12.5px;font-weight:700;letter-spacing:.03em;width:fit-content}
h1{font-family:var(--disp);font-weight:700;font-size:35px;line-height:1.1;margin:12px 0 0;
  letter-spacing:-.015em;text-wrap:balance;max-width:26ch}
.sub{font-size:15.5px;color:var(--dim);margin:8px 0 0;max-width:88ch;line-height:1.38}
.area{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;
  gap:9px;padding:6px 0 4px;overflow:hidden}

/* ================= CARDS ================= */
.grid{display:grid;gap:13px}
.g1{grid-template-columns:1fr} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g6{grid-template-columns:repeat(3,1fr)}
.card{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:15px 17px;
  display:flex;flex-direction:column;gap:8px;min-width:0}
.card .lab{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase}
.card .txt{font-size:15px;line-height:1.4}
.card .txt.sm{font-size:13.4px;line-height:1.4;color:#E4DCD4}
/* ---- scan line + folded source text -------------------------------------
   `lead` is the sentence a student reads from the back row in one second.
   `txt` under it stays the source's own words, clamped to two lines and
   opened by a click; the notes overlay always carries it in full. */
.card:has(.lead){gap:5px}
.card .lead{font-size:14.8px;line-height:1.32;font-weight:600;letter-spacing:-.005em}
.card .txt.src2{font-size:12.1px;line-height:1.36;color:var(--dim);margin-top:0}
.card .txt.fold{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;cursor:zoom-in;position:relative}
.card .txt.fold::after{content:"";position:absolute;inset:auto 0 0 0;height:1.36em;
  background:linear-gradient(to right,transparent 55%,var(--panel) 92%)}
.card .txt.open{cursor:zoom-out}
.foldbar{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim2);cursor:pointer;margin-top:-3px}
.foldbar:hover{color:var(--sand)}
/* ---- glossary ---- */
.gl{border-bottom:1px dotted var(--teal);color:inherit;cursor:help;position:relative}
.gl::after{content:attr(data-def);position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%);width:max-content;max-width:300px;white-space:normal;
  background:var(--panel2);border:1.5px solid var(--teal);border-radius:9px;padding:8px 12px;
  font-size:12.2px;line-height:1.45;font-weight:400;color:var(--ink);text-align:left;
  letter-spacing:0;text-transform:none;box-shadow:0 8px 26px -12px #000;
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:20;pointer-events:none}
.gl:hover::after,.gl[data-on="1"]::after{opacity:1;visibility:visible}
/* ---- coverage ledger: what the source has, what the hour reached ---- */
.cov{display:flex;flex-direction:column;gap:5px}
.cvr{display:grid;grid-template-columns:52px 1fr 128px 104px;gap:11px;align-items:center;
  border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 14px}
.cvr .k{font-family:var(--disp);font-size:11.5px;font-weight:700;color:var(--dim2);letter-spacing:.04em}
.cvr .t{font-size:13.2px;line-height:1.3;min-width:0}
.cvr .t i{font-style:normal;color:var(--dim2);font-size:11.5px}
.cvr .w{font-size:10.5px;color:var(--dim2);text-align:right;line-height:1.3}
.cvr .s{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-align:center;
  border:1px solid var(--line);border-radius:6px;padding:3px 0;color:var(--dim2)}
.cvr[data-s="taught"]{border-color:rgba(79,191,139,.5)}
.cvr[data-s="taught"] .k,.cvr[data-s="taught"] .s{color:var(--green);border-color:rgba(79,191,139,.5)}
.cvr[data-s="touched"]{border-color:rgba(221,178,126,.55)}
.cvr[data-s="touched"] .k,.cvr[data-s="touched"] .s{color:var(--sand);border-color:rgba(221,178,126,.5)}
.cvr[data-s="open"]{border-color:var(--mag);box-shadow:0 0 18px -9px var(--mag)}
.cvr[data-s="open"] .k,.cvr[data-s="open"] .s{color:var(--mag);border-color:rgba(240,24,154,.5)}
.covfoot{font-size:10.5px;color:var(--dim);line-height:1.4;text-align:center}
.covfoot b{color:var(--sand)}
/* ---- path map: the route this student actually took ---- */
.pm{display:flex;flex-direction:column;gap:8px}
.fork{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 15px;
  display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center}
.fork .at{font-family:var(--disp);font-size:12.5px;font-weight:700;color:var(--sand);letter-spacing:.04em}
.fork .at span{display:block;font-family:var(--body);font-size:10px;font-weight:600;
  letter-spacing:.06em;color:var(--dim2);text-transform:uppercase;margin-top:2px}
.arms{display:flex;flex-direction:column;gap:5px;min-width:0}
.arm{display:grid;grid-template-columns:15px 1fr auto;gap:10px;align-items:center;
  font-size:12.6px;line-height:1.34;color:var(--dim);min-width:0}
.arm .b{font-family:var(--mono,monospace);color:var(--dim2);font-size:13px}
.arm .to{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.05em;
  border:1px solid var(--line);border-radius:6px;padding:2px 9px;color:var(--dim2);white-space:nowrap}
.arm[data-took="1"]{color:var(--ink)}
.arm[data-took="1"] .b{color:var(--mag)}
.arm[data-took="1"] .to{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.10)}
.arm[data-took="1"] em{font-style:normal;color:var(--mag);font-weight:600}
.pmfoot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pmf{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 6px;text-align:center}
.pmf .n{font-family:var(--disp);font-size:17px;font-weight:700;color:var(--ink);line-height:1.1;
  font-variant-numeric:tabular-nums}
.pmf .l{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim2);margin-top:3px;line-height:1.25}
.pmnote{font-size:10.5px;color:var(--dim);line-height:1.4;text-align:center}
/* ---- confusable terms, side by side ---- */
.cmp{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12.7px}
.cmp th{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);text-align:start;padding:0 13px 2px}
.cmp td{background:var(--panel);border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  padding:6px 13px;line-height:1.32;vertical-align:top}
.cmp td:first-child{border-inline-start:1.5px solid var(--line);border-start-start-radius:10px;border-end-start-radius:10px;
  font-weight:600;white-space:nowrap}
.cmp td:last-child{border-inline-end:1.5px solid var(--line);border-start-end-radius:10px;border-end-end-radius:10px}
.cmp tr[data-c="teal"] td{border-color:rgba(79,198,203,.5)} .cmp tr[data-c="teal"] td:first-child{color:var(--teal)}
.cmp tr[data-c="mag"] td{border-color:rgba(240,24,154,.5)} .cmp tr[data-c="mag"] td:first-child{color:var(--mag)}
.cmp tr[data-c="sand"] td{border-color:rgba(221,178,126,.55)} .cmp tr[data-c="sand"] td:first-child{color:var(--sand)}
.cmp tr[data-c="violet"] td{border-color:rgba(142,125,234,.5)} .cmp tr[data-c="violet"] td:first-child{color:var(--violet)}
.cmp tr[data-c="green"] td{border-color:rgba(79,191,139,.5)} .cmp tr[data-c="green"] td:first-child{color:var(--green)}
.cmp .mut{color:var(--dim);font-size:12.2px}
/* ---- progress, in the bar ---- */
#prog{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  color:var(--dim2);white-space:nowrap}
#prog .bar{width:64px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
#prog .bar i{display:block;height:100%;background:var(--sand);width:0;transition:width .3s}
/* ---- shortcut help ---- */
#help .kg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 26px}
#help .kr{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:baseline;font-size:14px}
#help .kr b{font-family:var(--mono,monospace);font-size:12px;color:var(--sand);font-weight:600}
#help .kr span{color:var(--dim);line-height:1.45}
#help h3{font-family:var(--disp);font-size:13px;color:var(--sand);margin:18px 0 8px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
/* ---- timer, out of time ---- */
@keyframes flashover{0%,100%{background:var(--bar)}50%{background:rgba(240,24,154,.22)}}
#bar.over{animation:flashover .7s ease-in-out 3}
/* ---- right-to-left lectures ---- */
[dir="rtl"] .chain>.card:not(:last-child)::after{right:auto;left:-19px}
[dir="rtl"] .chain>.card:not(:last-child)::before{right:auto;left:-20px;
  border-left-color:transparent;border-right-color:var(--sand);border-left:0;border-right-width:4px}
[dir="rtl"] .rowcard .lab{text-align:left}
[dir="rtl"] .ov .close{right:auto;left:38px}
[dir="rtl"] .qz-why,[dir="rtl"] .qz-hint{border-left:0;border-right:3px solid var(--sand);
  border-radius:10px 0 0 10px}
[dir="rtl"] .qz-hint{border-right-color:var(--violet)}
[dir="rtl"] #notes .nb{border-left:0;border-right:2px solid var(--sand);padding-left:0;padding-right:16px}
[dir="rtl"] .qz-o,[dir="rtl"] .layer{text-align:right}
/* ---- print: a handout, and the route to a PDF ---- */
@media print{
  body{background:#fff;color:#111;overflow:visible}
  #shell{position:static;display:block}
  #stage{width:auto;height:auto;transform:none!important;background:#fff;overflow:visible}
  #stars,#rail,#bar,.ov,.figbar button,#prog{display:none!important}
  .slide{position:static;display:block!important;page-break-after:always;border-bottom:1px solid #ccc;
    padding:0 0 18px;margin-bottom:18px;inset:auto}
  .slide h1{font-size:20px;color:#111;-webkit-text-fill-color:#111}
  .card,.cvr,.jah-row,.cl{background:#fff;border-color:#999!important;box-shadow:none!important}
  .card .lab,.principle{color:#111!important}
  .card .txt.fold{-webkit-line-clamp:unset;display:block;overflow:visible}
  .card .txt.fold::after{display:none}
  .foldbar,.coach,.tps .done{display:none}
  textarea.inp{border:1px solid #999;min-height:52px;color:#111;background:#fff}
  .gl::after{display:none}
}
/* ---- requirement -> implementation -> tool -> evidence -------------------
   The chain the student cannot cross on their own. Five columns, one row per
   requirement, and the row ends in an artifact rather than an intention. */
.br{display:flex;flex-direction:column;gap:2px}
.brh{display:grid;grid-template-columns:84px .85fr 1.45fr 1.55fr 1.4fr;gap:9px;padding:0 12px}
.brh span{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.brr{display:grid;grid-template-columns:84px .85fr 1.45fr 1.55fr 1.4fr;gap:9px;align-items:stretch;
  border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:3px 12px}
.brr>div{min-width:0;font-size:10.2px;line-height:1.19;color:var(--dim)}
.brr .rq{font-family:var(--disp);font-size:10.9px;font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center}
.brr .mc{color:var(--ink);font-weight:600}
.brr .ev{color:var(--green)}
.brr .ev b{color:var(--green);font-weight:700;display:block;font-size:8.5px;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:2px}
.tls{display:flex;flex-wrap:wrap;gap:4px}
.tls i{font-style:normal;font-family:var(--mono,monospace);font-size:9.3px;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;color:var(--teal);white-space:nowrap;background:var(--panel2)}
.brr[data-c="teal"]{border-color:rgba(79,198,203,.5)} .brr[data-c="teal"] .rq{color:var(--teal)}
.brr[data-c="mag"]{border-color:rgba(240,24,154,.5)} .brr[data-c="mag"] .rq{color:var(--mag)}
.brr[data-c="sand"]{border-color:rgba(221,178,126,.55)} .brr[data-c="sand"] .rq{color:var(--sand)}
.brr[data-c="violet"]{border-color:rgba(142,125,234,.5)} .brr[data-c="violet"] .rq{color:var(--violet)}
.brr[data-c="green"]{border-color:rgba(79,191,139,.5)} .brr[data-c="green"] .rq{color:var(--green)}
.brnote{font-size:9.8px;color:var(--dim2);line-height:1.35;text-align:center}
/* ---- local-frame tag ---- */
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  border:1.5px solid var(--violet);color:var(--violet);background:rgba(142,125,234,.10);
  border-radius:7px;padding:3px 10px;width:fit-content;margin-bottom:2px}
.card .src{margin-top:auto;font-size:10.5px;color:var(--dim2);letter-spacing:.04em;font-weight:500}
.c-teal{border-color:var(--teal)} .c-teal .lab{color:var(--teal)}
.c-mag{border-color:var(--mag);box-shadow:0 0 18px -8px var(--mag)} .c-mag .lab{color:var(--mag)}
.c-sand{border-color:var(--sand)} .c-sand .lab{color:var(--sand)}
.c-violet{border-color:var(--violet)} .c-violet .lab{color:var(--violet)}
.c-green{border-color:var(--green)} .c-green .lab{color:var(--green)}
.rowcard{display:grid;grid-template-columns:136px 1fr;gap:16px;align-items:center;padding:11px 16px}
.rowcard .lab{text-align:right}
.chain{gap:30px}
.chain>.card{position:relative}
.chain>.card:not(:last-child)::after{content:"";position:absolute;right:-19px;top:50%;width:14px;height:1.5px;background:var(--sand)}
.chain>.card:not(:last-child)::before{content:"";position:absolute;right:-20px;top:50%;margin-top:-4px;
  border:4px solid transparent;border-left-color:var(--sand);border-right:0}
/* ---- golden rule: the one unit per phase the room must not walk past ---- */
.pill.gold{border-color:var(--sand);color:var(--sand);background:rgba(221,178,126,.10);
  box-shadow:0 0 22px -10px var(--sand)}
.pill.gold::before{content:"\2605";margin-right:8px;font-size:12px}
.slide.golden h1{background:linear-gradient(90deg,var(--ink) 72%,var(--sand-lt));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* ---- sign & lock ---- */
.signbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
  border:1.5px solid var(--sand);background:rgba(221,178,126,.06);border-radius:12px;padding:11px 17px}
.signbar .st{font-size:13.4px;line-height:1.45;color:var(--dim)}
.signbar .st b{color:var(--sand)}
.signbar button{border:1.5px solid var(--sand);color:var(--sand);border-radius:9px;padding:8px 20px;
  font-size:12.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.signbar button:hover{background:rgba(221,178,126,.14)}
.signbar[data-on="1"]{border-color:var(--green);background:rgba(79,191,139,.08)}
.signbar[data-on="1"] .st{color:var(--ink)} .signbar[data-on="1"] .st b{color:var(--green)}
.signbar[data-on="1"] button{border-color:var(--line);color:var(--dim2);cursor:default}
textarea.inp[readonly]{color:var(--dim);border-style:dashed;cursor:not-allowed;background:var(--bar)}
.pick[data-locked="1"]{opacity:.6;cursor:not-allowed}
.lockmsg{font-size:12px;color:var(--mag);margin-top:6px;min-height:1.2em}
/* ---- self-assessed level against the level the evidence supports ---- */
.lvl{display:flex;flex-direction:column;gap:9px}
.lvlread{border:1.5px solid var(--line);border-radius:11px;padding:11px 17px;font-size:13.8px;
  line-height:1.5;background:var(--panel);color:var(--dim)}
.lvlread b{color:var(--sand)} .lvlread .miss{color:var(--mag);font-weight:600}
.lvlread[data-m="ok"]{border-color:var(--green);background:rgba(79,191,139,.08)}
.lvlread[data-m="ok"] b{color:var(--green)}
.lvlread[data-m="over"]{border-color:var(--mag);background:rgba(240,24,154,.07)}

.principle{text-align:center;font-family:var(--disp);font-weight:600;font-size:17px;color:var(--sand);
  line-height:1.35;max-width:98ch;margin:0 auto;text-wrap:balance}
.principle.mag{color:var(--mag)}

.badge{border:1.5px solid var(--green);border-radius:12px;padding:10px 17px;text-align:center;flex-shrink:0}
.badge .b1{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--green);text-transform:uppercase}
.badge .b2{font-size:12px;color:var(--dim);margin-top:3px}
.badge.mag{border-color:var(--mag)} .badge.mag .b1{color:var(--mag)}

/* ================= SOURCE FIGURE ================= */
.figwrap{background:#fff;border:1.5px solid var(--sand);border-radius:12px;padding:8px;
  display:flex;align-items:center;justify-content:center;position:relative;cursor:crosshair}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--mag);border-radius:50%;
  background:rgba(240,24,154,.20);box-shadow:0 0 14px -2px var(--mag);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.figbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}
.figbar button{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);
  border:1px solid var(--line);border-radius:7px;padding:4px 10px}
.figbar button:hover{border-color:var(--mag);color:var(--mag)}
.svgwrap{width:100%}
.svgwrap svg{display:block;width:100%;height:auto;max-height:124px;margin:0 auto}
.aigate{display:flex;flex-direction:column;gap:6px}
.aq{display:grid;grid-template-columns:1fr 62px 62px;gap:8px;align-items:center;border:1.5px solid var(--line);
  background:var(--panel);border-radius:10px;padding:5px 14px}
.aq .qt{font-size:12.6px;line-height:1.3}
.aq button{border:1.5px solid var(--line);border-radius:8px;padding:6px 0;font-size:12px;font-weight:600;color:var(--dim2)}
.aq button[aria-pressed="true"]{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.10)}
.averdict{text-align:center;font-family:var(--disp);font-weight:600;font-size:14.4px;line-height:1.35;color:var(--dim2);padding:1px 0}
.averdict.ok{color:var(--green)} .averdict.no{color:var(--mag)}
.jah{display:flex;flex-direction:column;gap:9px}
.jah-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  border:1.5px solid var(--teal);background:rgba(79,198,203,.07);border-radius:12px;padding:10px 16px}
.jah-head .gk{font-size:13.5px;font-weight:600;color:var(--ink)}
.jah-head .gk b{color:var(--teal)}
.jah-head .wt{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--dim2);text-align:right}
.jah-top{display:flex;flex-wrap:wrap;gap:7px}
.jah-top span{border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12px;color:var(--dim)}
.jah-top span b{color:var(--sand);font-weight:600}
.jah-row{display:grid;grid-template-columns:34px 1fr 150px 118px;gap:12px;align-items:center;
  border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px}
.jah-row .n{font-size:11.5px;font-weight:700;color:var(--dim2)}
.jah-row .t{font-size:13.2px;line-height:1.32}
.jah-row .w{font-size:10.5px;color:var(--dim2);text-align:right}
.jah-row .s{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-align:center;
  border:1px solid var(--line);border-radius:6px;padding:3px 0}
.jah-row[data-s="covered"]{border-color:rgba(79,191,139,.5)}
.jah-row[data-s="covered"] .n,.jah-row[data-s="covered"] .s{color:var(--green);border-color:rgba(79,191,139,.5)}
.jah-row[data-s="closed"]{border-color:var(--mag);box-shadow:0 0 18px -9px var(--mag)}
.jah-row[data-s="closed"] .n,.jah-row[data-s="closed"] .s{color:var(--mag);border-color:rgba(240,24,154,.5)}
.jah-row[data-s="partial"]{border-color:rgba(221,178,126,.55)}
.jah-row[data-s="partial"] .n,.jah-row[data-s="partial"] .s{color:var(--sand);border-color:rgba(221,178,126,.5)}
.jah-note{font-size:11.5px;color:var(--dim);line-height:1.45;text-align:center}
.qz{display:flex;flex-direction:column;gap:10px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.qz-n{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.qz-lo{font-size:9.5px;font-weight:700;letter-spacing:.07em;border:1px solid rgba(79,198,203,.45);
  color:var(--teal);border-radius:6px;padding:3px 9px}
.qz-q{font-size:16.5px;line-height:1.4;color:var(--ink);max-width:96ch}
.qz-opts{display:flex;flex-direction:column;gap:7px}
.qz-o{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:baseline;text-align:left;
  border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;transition:.15s}
.qz-o:hover{border-color:var(--sand)}
.qz-o .l{font-family:var(--disp);font-size:12.5px;font-weight:700;color:var(--dim2)}
.qz-o .x{font-size:14px;line-height:1.35}
.qz-o[data-st="right"]{border-color:var(--green);background:rgba(79,191,139,.10)}
.qz-o[data-st="right"] .l{color:var(--green)}
.qz-o[data-st="wrong"]{border-color:var(--mag);background:rgba(240,24,154,.10)}
.qz-o[data-st="wrong"] .l{color:var(--mag)}
.qz-o[data-st="dim"]{opacity:.55}
.qz-why{border-left:3px solid var(--sand);background:rgba(221,178,126,.07);border-radius:0 10px 10px 0;
  padding:10px 15px;font-size:13.5px;line-height:1.45;color:#E4DCD4}
.qz-why b{color:var(--sand)}
.qz-foot{display:flex;justify-content:space-between;align-items:center;gap:14px}
/* numbered, obviously clickable: the bars worked as jump targets but nothing
   about a 26x5 slab said so, so nobody clicked them */
.qz-dots{display:flex;gap:7px}
.qz-dots .qzd{width:28px;height:26px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--dim2);font-family:var(--disp);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.qz-dots .qzd:hover{border-color:var(--sand);color:var(--sand)}
.qz-dots .qzd[data-d="right"]{border-color:var(--green);color:var(--green);background:rgba(79,191,139,.12)}
.qz-dots .qzd[data-d="wrong"]{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.12)}
.qz-dots .qzd[data-d="now"]{border-color:var(--sand);color:var(--ground);background:var(--sand)}
.qz-score{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--dim2)}
.qz-nav{display:flex;gap:7px}
.qz-nav button{border:1px solid var(--line);border-radius:8px;padding:5px 13px;font-size:11px;
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2)}
.qz-nav button:hover{border-color:var(--sand);color:var(--sand)}
.qz-note{font-size:11px;color:var(--dim2);line-height:1.4;text-align:center}
.clomap{display:flex;flex-direction:column;gap:6px}
.cl{display:grid;grid-template-columns:52px 78px 1fr 108px 100px;gap:11px;align-items:center;
  border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:3px 14px}
.cl .k{font-size:11.5px;font-weight:700;color:var(--dim2);letter-spacing:.05em}
.cl .d{font-size:9px;font-weight:700;letter-spacing:.08em;text-align:center;border:1px solid var(--line);
  border-radius:6px;padding:3px 0;color:var(--dim2)}
.cl .d-knowledge{color:var(--teal);border-color:rgba(79,198,203,.45)}
.cl .d-skill{color:var(--violet);border-color:rgba(142,125,234,.45)}
.cl .d-value{color:var(--sand);border-color:rgba(221,178,126,.5)}
.cl .t{font-size:13.4px;line-height:1.3}
.cl .w{font-size:10.5px;color:var(--dim2);text-align:right}
.cl .s{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2);text-align:right}
.cl[data-ok="1"]{border-color:var(--green);background:rgba(79,191,139,.08)}
.cl[data-ok="1"] .k,.cl[data-ok="1"] .s{color:var(--green)}
.clofoot{font-size:10.5px;color:var(--dim);line-height:1.35;text-align:center;margin-top:0}
.cardcheck{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cc{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 6px;text-align:center}
.cc .n{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--dim2);text-transform:uppercase}
.cc .m{font-size:15px;font-weight:700;margin-top:4px;color:var(--dim2)}
.cc[data-ok="1"]{border-color:var(--green);background:rgba(79,191,139,.09)}
.cc[data-ok="1"] .n,.cc[data-ok="1"] .m{color:var(--green)}
/* ---- coach: scaffolding shown instead of the answer ---- */
.coach{display:grid;grid-template-columns:74px 1fr;gap:13px;align-items:center;border:1.5px dashed var(--violet);
  background:rgba(142,125,234,.06);border-radius:11px;padding:9px 15px}
.coach .cl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);text-align:center}
.coach .ct{font-size:13.2px;line-height:1.4;color:#E4DCD4}
.coach[data-st="ok"]{border-style:solid;border-color:var(--green);background:rgba(79,191,139,.07)}
.coach[data-st="ok"] .cl{color:var(--green)}
.coach[data-st="thin"]{border-color:var(--sand);background:rgba(221,178,126,.07)}
.coach[data-st="thin"] .cl{color:var(--sand)}
/* ---- think · pair · share ---- */
.tps{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;align-items:stretch}
.tps .st{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 13px;min-width:0}
.tps .st .n{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.tps .st .p{font-size:12.6px;line-height:1.34;margin-top:3px}
.tps .st.a{border-color:var(--teal)} .tps .st.a .n{color:var(--teal)}
.tps .st.b{border-color:var(--mag)} .tps .st.b .n{color:var(--mag)}
.tps .st.c{border-color:var(--sand)} .tps .st.c .n{color:var(--sand)}
.tps .done{border:1.5px solid var(--line);border-radius:11px;padding:0 15px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);white-space:nowrap}
.tps .done:hover{border-color:var(--sand);color:var(--sand)}
.tps .done[data-on="1"]{border-color:var(--green);color:var(--green);background:rgba(79,191,139,.09)}
.qz-hint{border-left:3px solid var(--violet);background:rgba(142,125,234,.07);border-radius:0 10px 10px 0;
  padding:10px 15px;font-size:13.5px;line-height:1.45;color:#E4DCD4}
.qz-hint b{color:var(--violet)}
.figwrap img{display:block;max-height:318px;width:auto;max-width:100%;height:auto;border-radius:5px}
.figcap{font-size:10.5px;color:var(--sand);letter-spacing:.07em;font-weight:600;margin-top:7px;text-transform:uppercase}
.splitfig{display:grid;grid-template-columns:1.02fr .98fr;gap:24px;align-items:center;min-height:0}
.splitfig>*{min-height:0}
.splitfig .card{padding:9px 13px;gap:5px}
.splitfig .card:has(.lead){gap:3px}
.splitfig .card .txt{font-size:13.4px;line-height:1.38}
.splitfig .card .txt.sm{font-size:12.7px;line-height:1.36}
.splitfig .card .lab{font-size:11.5px} .splitfig .card .src{font-size:9.5px}
.splitfig .card .lead{font-size:13.1px;line-height:1.3}
.splitfig .card .txt.src2{font-size:11.4px;line-height:1.34}
.splitfig .card .txt.fold::after{height:1.34em}

/* ================= INPUTS / PICKERS ================= */
textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  font-family:var(--body);font-size:13.4px;padding:9px 11px;line-height:1.45;resize:none}
textarea.inp:focus{border-color:var(--mag);outline:none}
textarea.inp::placeholder{color:var(--dim2)}
/* ---- core vs optional: where the student spends the minutes they have -----
   Twenty-six boxes in seventy-five minutes is a promise nobody keeps, and a
   student who feels behind stops writing. So the author marks the boxes that
   carry the artifact, and the rest are visibly optional. Nothing is removed —
   the ranking is what is added. */
.fw{display:flex;flex-direction:column;gap:2px}
.fw>.fl{display:flex;align-items:baseline;gap:8px;font-size:8.6px;font-weight:700;line-height:1.15;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.fw>.fl .core{color:var(--mag)}
.fw>.fl .opt{color:var(--dim2)}
.fw>.fl .exb{margin-inline-start:auto;color:var(--violet);border:1px solid var(--line);
  border-radius:6px;padding:2px 8px;font-size:8.5px;letter-spacing:.07em;cursor:pointer}
.fw>.fl .exb:hover{border-color:var(--violet)}
textarea.inp[data-core="1"]{border-color:rgba(240,24,154,.42)}
textarea.inp[data-core="0"]{background:transparent;border-style:dashed}
/* ---- a worked example, revealed on demand and never typed into the box ---- */
.exbox{border:1.5px dashed var(--violet);background:rgba(142,125,234,.07);border-radius:9px;
  padding:8px 12px;font-size:12.4px;line-height:1.45;color:#E4DCD4}
.exbox b{display:block;font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--violet);margin-bottom:3px}
/* ---- distributed retrieval: one question, pulled back mid-hour ------------
   The same pool as the end-of-session check, asked earlier. Spacing beats
   massing, and the state is shared, so answering here IS answering there. */
.rc{border:1.5px solid var(--teal);background:rgba(79,198,203,.06);border-radius:11px;padding:8px 15px;
  display:flex;flex-direction:column;gap:6px}
.rc .rh{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.rc .rh .n{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.rc .rh .p{font-size:11px;color:var(--dim2)}
.rc .rh .lo{margin-inline-start:auto;font-size:9px;font-weight:700;letter-spacing:.07em;
  border:1px solid rgba(79,198,203,.4);color:var(--teal);border-radius:6px;padding:2px 8px}
.rc .rq{font-size:14px;line-height:1.4}
.rc .qz-opts{gap:5px}
.rc .qz-o{padding:5px 12px} .rc .qz-o .x{font-size:12.4px}
.rc .qz-why,.rc .qz-hint{font-size:12.6px;padding:8px 13px}
.picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 17px;
  font-size:13.5px;font-weight:500;color:var(--dim);transition:.15s}
.pick:hover{border-color:var(--sand);color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.10);font-weight:600}

.stack{display:flex;flex-direction:column;gap:5px}
.layer{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);
  background:var(--panel);border-radius:9px;padding:6px 12px;text-align:left;transition:.15s;width:100%}
.layer:hover{border-color:var(--teal)}
.layer .n{font-size:11px;color:var(--dim2);font-weight:600}
.layer .nm{font-size:13.5px;font-weight:500}
.layer[data-in="1"]{border-color:var(--mag);background:rgba(240,24,154,.09)}
.layer[data-in="1"] .n{color:var(--mag)}
.tracebox{border:1.5px dashed var(--sand);border-radius:10px;padding:9px 13px;font-size:12.5px;color:var(--sand);
  line-height:1.55;min-height:40px;background:rgba(221,178,126,.05)}
.tracebox .e{color:var(--dim2)}

.matrix{display:grid;grid-template-columns:44px repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:7px}
.mh{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--dim2);text-transform:uppercase;
  display:flex;align-items:center;justify-content:center}
.mh.s{writing-mode:vertical-rl;transform:rotate(180deg)}
.cell{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:8px;min-height:54px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:center;transition:.15s}
.cell .co{font-size:10px;color:var(--dim2);font-weight:600}
.cell .st{font-size:11px;font-weight:600;color:var(--dim2)}
.cell[data-s="1"]{border-color:var(--green);background:rgba(79,191,139,.1)} .cell[data-s="1"] .st{color:var(--green)}
.cell[data-s="2"]{border-color:var(--sand);background:rgba(221,178,126,.1)} .cell[data-s="2"] .st{color:var(--sand)}
.cell[data-s="3"]{border-color:var(--mag);background:rgba(240,24,154,.1)} .cell[data-s="3"] .st{color:var(--mag)}

.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.gate{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 15px;
  display:flex;flex-direction:column;gap:7px;text-align:center;transition:.15s}
.gate .lab{font-size:12.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;color:var(--dim2)}
.gate .txt{font-size:14px;line-height:1.4;color:var(--dim)}
.gate .mark{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--dim2)}
.gate[data-ok="1"]{border-color:var(--green);background:rgba(79,191,139,.09)}
.gate[data-ok="1"] .lab,.gate[data-ok="1"] .mark{color:var(--green)}
.gate[data-ok="1"] .txt{color:var(--ink)}
.readyline{text-align:center;font-family:var(--disp);font-weight:600;font-size:15px;color:var(--dim2)}
.readyline.ok{color:var(--green)}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--bar);border-top:1px solid var(--line);
  padding:12px 36px;display:grid;grid-template-columns:150px 1fr auto auto;gap:20px;align-items:center;z-index:6}
#bar .tb{font-size:11.5px;font-weight:700;color:var(--sand);letter-spacing:.05em}
#bar .yt{font-size:11.5px;font-weight:700;color:var(--mag);letter-spacing:.05em;margin-top:6px}
#bar .task{font-size:14.5px;line-height:1.35}
#timer{display:flex;align-items:center;gap:9px}
#timer .clock{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim2);font-family:var(--disp)}
#timer.run .clock{color:var(--sand)} #timer.over .clock{color:var(--mag)}
#timer button{border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:10.5px;font-weight:600;
  letter-spacing:.06em;color:var(--dim2);text-transform:uppercase}
#timer button:hover{border-color:var(--sand);color:var(--sand)}

/* ================= TITLE / CLOSING ================= */
.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:40px;align-items:center;flex:1;min-height:0}
.hero h2{font-family:var(--disp);font-weight:700;font-size:54px;line-height:1.02;margin:0;letter-spacing:-.022em}
.hero h2 em{font-style:normal;color:var(--sand);display:block}
.hero .st{font-size:18px;color:var(--dim);margin:14px 0 0;line-height:1.4;max-width:44ch}
.brandimg{border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;
  box-shadow:0 0 50px -18px var(--mag)}
.brandimg img{display:block;width:100%;height:auto}
.srcbox{border:1.5px solid var(--teal);border-radius:13px;padding:14px 19px;margin-top:22px;width:fit-content}
.srcbox .l{font-size:11.5px;font-weight:700;color:var(--teal);letter-spacing:.06em;text-align:center}
.srcbox .v{font-size:15px;margin-top:5px}
.flowline{font-size:12.5px;font-weight:700;color:var(--sand);letter-spacing:.06em;margin-top:20px}
.keys{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
kbd{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--dim2);background:var(--panel)}
kbd b{color:var(--sand);font-weight:600}

/* ================= OVERLAYS ================= */
.ov{position:absolute;inset:0;background:#06050A;z-index:30;display:none;flex-direction:column;padding:26px 40px}
.ov.on{display:flex}
.ov h2{font-family:var(--disp);font-size:25px;margin:0 0 4px;font-weight:700}
.ov .osub{font-size:11.5px;font-weight:600;letter-spacing:.09em;color:var(--dim2);text-transform:uppercase;margin-bottom:17px}
.ov .close{position:absolute;top:23px;right:38px;font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--dim2);border:1px solid var(--line);padding:6px 13px;border-radius:8px}
.oscroll{flex:1;overflow-y:auto;padding-right:10px}
.oscroll::-webkit-scrollbar{width:6px}
.oscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#notes .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#notes .meta span{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);padding:5px 11px;border-radius:8px;color:var(--dim)}
#notes .nb{border-left:2px solid var(--sand);padding-left:16px;margin-bottom:17px}
#notes .nb h3{margin:0 0 6px;font-size:14.5px;color:var(--sand);font-weight:700;font-family:var(--disp)}
#notes .nb p{margin:0;font-size:15px;line-height:1.6;color:#E7DFD8}
#notes .say{border:1.5px solid var(--mag);border-radius:12px;padding:13px 17px;margin-bottom:17px}
#notes .say .l{font-size:10.5px;font-weight:700;color:var(--mag);letter-spacing:.08em;margin-bottom:6px}
#notes .say p{margin:0;font-size:15px;line-height:1.5;font-style:italic}
#case .sec{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:9px;background:var(--panel)}
#case .sec .l{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--teal);text-transform:uppercase;margin-bottom:6px}
#case .sec .v{font-size:13.4px;line-height:1.55;white-space:pre-wrap}
#case .sec .v.blank{color:var(--dim2);font-style:italic}
#case .tools{display:flex;gap:9px;margin-top:13px}
#case .tools button{border:1px solid var(--line);border-radius:8px;padding:9px 17px;font-size:10.5px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#case .tools button:hover{border-color:var(--sand);color:var(--sand)}
#over .og{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
#over .oc{border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;text-align:left;background:var(--panel);min-height:68px}
#over .oc:hover{border-color:var(--sand)} #over .oc.cur{border-color:var(--mag);background:rgba(240,24,154,.1)}
#over .oc .u{font-size:10px;font-weight:700;color:var(--sand);letter-spacing:.05em}
#over .oc .t{font-size:11.5px;line-height:1.25;margin-top:5px;color:var(--dim)}
</style>

<div id="shell"><div id="stage">
  <div id="stars"></div><div id="rail"></div>

  </div>

  note:'Practice items written for this course in the style of the knowledge unit. They are not exam questions, they do not come from {{testBody}}, and the score predicts nothing about the {{testEn}}.',
  items:[
   {lo:'LO1 · vulnerability / threat / risk',
    q:'Both RO trains at the plant read pressure from one transmitter on one loop. In the vocabulary of the knowledge unit, that shared transmitter is:',
    opts:['A threat, because it can bring down the backup train',
          'A vulnerability, because it is a weakness an event could exploit',
          'A risk, because it makes a failure likely',
          'A countermeasure, because it standardises the reading'],
    a:1,
    hint:'Two of the three terms name something that <i>is</i>; one names something that <i>happens</i>. One transmitter on one loop is a standing condition of the plant, not an event. Read the four options again and keep only the ones describing a standing condition.',
    why:'A <b>vulnerability</b> is the weakness in the system. A <b>threat</b> is the event that exploits it &mdash; here, a transmitter fault or a forged reading. <b>Risk</b> is the likelihood that the threat exploits the weakness. Rule 11 calls this shared element a common mode.'},

   {lo:'LO1 · vulnerability / threat / risk',
    q:'Which statement orders the three terms correctly?',
    opts:['A risk exploits a vulnerability and so creates a threat',
          'A threat exploits a vulnerability; risk is the likelihood that it does',
          'A vulnerability exploits a threat; risk is the resulting impact',
          'Threat and risk are the same thing; the vulnerability is their cause'],
    a:1,
    hint:'Read each option as a sentence and ask what is acting on what. Only one of them has the <i>event</i> acting on the <i>weakness</i> rather than the reverse.',
    why:'Straight from the knowledge unit description. Students who invert this write risk registers that list weaknesses where threats belong, and the register stops being usable.'},

   {lo:'LO2 · risk framework and tools',
    q:'Before sign-off you must find weaknesses in the upgraded control system. Which activity belongs to the <i>identify</i> step of a risk management framework rather than the <i>evaluate</i> step?',
    opts:['Placing each risk on the 3&times;3 probability&ndash;impact grid',
          'Deciding which risk to monitor rather than fix',
          'Walking both trains for shared components and shared assumptions',
          'Agreeing the trigger value that forces a revert'],
    a:2,
    hint:'One step <i>adds</i> items to the risk list; the other <i>orders</i> items already on it. Which of the four activities could put a weakness on the list that nobody had written down yet?',
    why:'<b>Identify</b> finds weaknesses &mdash; a scan, a threat model, or the common-mode walk-through of Rule 11. <b>Evaluate</b> ranks what identify already found; that is what the matrix in Rule 10 does. Naming the step matters because the tools differ.'},

   {lo:'LO2 · risk framework and tools',
    q:'The team places every identified risk on the probability&ndash;impact grid. Which framework step is that?',
    opts:['Identify','Evaluate','Treat','Monitor'],
    a:1,
    hint:'The grid cannot be drawn until something else has produced the list of risks. So this step is not the one that produced the list &mdash; it is the one doing something <i>to</i> it.',
    why:'The grid ranks what has already been identified, so it is <b>evaluate</b>. Choosing to watch a risk rather than fix it is a <b>treat</b> decision, and the trigger value you attach to it is what makes <b>monitor</b> real.'},

   {lo:'LO3 · platform-specific risk',
    q:'Which of these is a vulnerability of the <i>communications and data management</i> layer rather than the equipment layer?',
    opts:['A pressure transmitter drifting out of calibration',
          'A pump bearing reaching the end of its service life',
          'An unauthenticated fieldbus link that accepts a forged setpoint',
          'An operator silencing a repeating alarm at handover'],
    a:2,
    hint:'Put each option on the layer whose components it names &mdash; a transmitter, a bearing, a link, a person at handover. Then keep the one whose component exists only to carry data between machines. X03 is the slide with that stack on it.',
    why:'A and B sit at <b>equipment</b>; D sits at <b>business processes</b>, which is why Rule 14 treats it as workload rather than carelessness. Only C lives in the communications layer &mdash; and X03 is where you traced the failure through those layers.'}
  ]

 /* ------------------------------------------------------------------
    GLOSSARY. A term a first-year student has not met yet costs the room its
    attention: they stop following the argument and start guessing the word.
    Each term is defined once here and marked at its FIRST appearance on any
    slide, with the definition on hover or tap. Define the words the chapter
    uses as tools, not every noun — GLOSS-01 fails a term that never appears.
    ------------------------------------------------------------------ */
 glossary:{
  'sociotechnical':'A system counted as including its people, procedures and organisation, not only its hardware and software. Sommerville&rsquo;s stack has seven layers, from Equipment up to Society.',
  'redundancy':'A second copy of a component, kept available so the service survives losing the first.',
  'diversity':'Making the second copy differ from the first &mdash; different design or team &mdash; so the two fail on different inputs rather than together.',
  'certification':'Formal approval by an external regulator before a system may enter service. The evidence it requires can cost as much to produce as the system itself.',
  'formal methods':'Approaches based on a mathematical representation of the software, so a specification and a program can be proved equivalent rather than argued to be.',
  'model checking':'Exhaustively exploring a system&rsquo;s reachable states to show an undesirable one &mdash; deadlock, say &mdash; cannot occur.',
  'static analysis':'Examining source code without running it, to find defects a test would only catch if it happened to hit that path.',
  'error tolerance':'Designing so a user&rsquo;s mistake is avoided or absorbed rather than punished. The alternative treats a predictable human action as a discipline problem.',
  'vulnerability':'A weakness in the system that an event could exploit. A standing condition, not something that happens.',
  'threat':'An event that exploits a vulnerability &mdash; a fault, an attack, a forged reading.',
  'residual risk':'What remains after the treatments you chose. Naming it is what makes a verdict bounded rather than a hope.',
  'common-mode':'One shared element whose failure defeats every redundant copy at once &mdash; here, both pumps reading one transmitter. Redundancy without independence is one system wearing two coats.',
  'availability':'The probability that the system is up and able to deliver useful service when asked.',
  'reliability':'The probability that the system delivers services correctly, as its users expect.',
  'resilience':'A judgment of how well the system keeps its critical services running through disruptive events.'
 },

 /* ------------------------------------------------------------------
    THE BRIDGE FROM A REQUIREMENT TO SOMETHING YOU CAN BUILD.

    The chapter names redundancy, diversity, static analysis and formal methods
    and never says what you install or run. A student leaves able to defend a
    verdict and unable to build what they decided on, and that is the difference
    between a course about engineering judgment and a software engineering
    course.

    One row per dependability property. Each row ends in an ARTIFACT, not an
    intention — that is what keeps this inside the evidence grammar instead of
    becoming a slide of tool logos. BRIDGE-01 blocks a row that ends in a wish.

    Tools are named as examples of a category, and the category is the teaching.
    Substitute your own; the row still works.
    ------------------------------------------------------------------ */
 toolkit:{
  head:['Property','Mechanism','What you actually build','Tools that do it','The artifact it leaves'],
  rows:[
   {c:'teal',req:'Availability',
    mech:'Redundancy, plus diversity wherever a common mode would defeat it',
    impl:'A second controller, health-checked, with an automatic switch and a <i>measured</i> switch-over time &mdash; and where both copies share a sensor, a second sensor of a different make on a separate loop',
    tools:['keepalived / VRRP','k8s liveness + readiness probes','HAProxy health checks'],
    evidence:'A dated failover drill record giving the measured switch-over time, and a diversity review listing every element both paths still share'},
   {c:'teal',req:'Reliability',
    mech:'Fault avoidance, then verification',
    impl:'Static analysis and property-based tests wired into the pipeline so a merge cannot skip them',
    tools:['SonarQube / clang-tidy','Hypothesis / jqwik','GitHub Actions / Jenkins'],
    evidence:'The pipeline run: a coverage report and a defect-density trend, both with a commit hash'},
   {c:'sand',req:'Safety',
    mech:'Hazard analysis, then interlocks',
    impl:'A hazard list with a mitigation against each, and a watchdog that acts when the mitigation does not',
    tools:['FMEA worksheet','Fault-tree / STPA','IEC&nbsp;61508 SIL tables'],
    evidence:'A hazard log where every entry names its mitigation and carries a signature'},
   {c:'sand',req:'Security',
    mech:'Threat modelling, then controls',
    impl:'A threat model of the fieldbus, authentication on it, and a scan that runs on every dependency change',
    tools:['STRIDE / OWASP Threat Dragon','Trivy / Dependency-Check','mutual TLS, signed firmware'],
    evidence:'The threat model plus the scan report, and the change that closed each finding'},
   /* The row the 2011 chapter cannot contain, and the one most graduates will
      need first. Every other row assumes a deterministic system: you can re-run
      it and compare. A model breaks that assumption, so its mechanism is not
      "test harder" — it is a held-out set, a drift threshold, and a human path
      back. Written here rather than in a separate AI unit on purpose: it belongs
      in the same table as the other five, because it is the same discipline. */
   {c:'violet',req:'A system with a model in it',
    mech:'Evaluation on held-out data, drift monitoring, and a human route back &mdash; because you cannot re-run a model and get the same answer',
    impl:'A frozen evaluation set the model never trains on, a drift threshold that triggers review, and a documented path to the pre-model behaviour',
    tools:['a model card','an evaluation-set runner in the pipeline','drift monitoring (Evidently / custom)','a written fallback procedure'],
    evidence:'A dated evaluation report naming the model version and the held-out set, plus the drift threshold that would send it back for review'},
   {c:'sand',req:'Resilience',
    mech:'Degraded modes, monitoring that notices them, then rehearsal',
    impl:'A defined reduced-service mode, a breaker that enters it, an alert with a trigger value and a named owner &mdash; and a rehearsal proving an operator can run the degraded mode',
    tools:['Resilience4j / Polly','Prometheus + Grafana alerts','LitmusChaos / Chaos Monkey','a written runbook'],
    evidence:'A game-day report naming what was broken, what degraded, which alert fired, and what the operator actually did'}
  ],
  note:'Tools are named as examples of a category, not endorsements &mdash; substitute your own and the row still works. What does not substitute is the last column: a mechanism with no artifact behind it is a claim, and this course does not accept claims. Read the violet row twice: it is the only one where <i>re-running it</i> is not available to you, which is why its evidence is a dated report rather than a repeatable test.'
 },

    A section the hour deliberately skips carries `why`. COV-01 blocks a build
