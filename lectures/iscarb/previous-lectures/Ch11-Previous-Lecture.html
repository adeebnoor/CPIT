<!DOCTYPE html>

<html data-iscarb-standalone="1" data-learning-path="20260921-visual-v3" lang="en">
<head><base href="../">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Previous lecture · draft recovery · ISCARB Lecture Engine \u2014 Chapter 11 Reliability Engineering</title>
<style>
/* ================= ISCARB BRAND TOKENS ================= */
:root{
  --ground:#08070C; --panel:#15121C; --panel2:#100E16; --bar:#0C0A11;
  --line:#2C2534; --line2:#221C29;
  --ink:#F5F0EA; --dim:#A99E95; --dim2:#6F665F;
  --sand:#DDB27E; --sand-lt:#F0D6AE;
  --mag:#F0189A; --teal:#4FC6CB; --violet:#8E7DEA; --green:#4FBF8B;
  --disp:"Poppins","Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"SF Mono","Cascadia Code","Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);margin:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ground)}
#stage{width:1333px;height:750px;position:relative;transform-origin:center center;overflow:hidden;
  background:
    radial-gradient(900px 460px at 84% -8%, rgba(240,24,154,.10), transparent 62%),
    radial-gradient(760px 420px at 6% 108%, rgba(221,178,126,.07), transparent 60%),
    var(--ground);}
/* star field — brand night sky, static and faint */
#stars{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.1px 1.1px at 12% 18%, #fff, transparent),
    radial-gradient(1px 1px at 27% 8%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 41% 24%, #fff, transparent),
    radial-gradient(1px 1px at 58% 11%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 73% 21%, #fff, transparent),
    radial-gradient(1px 1px at 88% 7%, #fff, transparent),
    radial-gradient(1px 1px at 6% 42%, #fff, transparent),
    radial-gradient(1.1px 1.1px at 95% 38%, #fff, transparent),
    radial-gradient(1px 1px at 34% 3%, #fff, transparent),
    radial-gradient(1px 1px at 66% 32%, #fff, transparent);}

/* phase rail */
#rail{position:absolute;top:0;left:0;right:0;height:3px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;z-index:5}
#rail i{display:block;background:var(--line2);position:relative;overflow:hidden}
#rail i b{position:absolute;inset:0;width:0;background:var(--sand);transition:width .35s ease;display:block}
#rail i.done b{width:100%;background:var(--dim2)} #rail i.now b{background:var(--mag)}

/* ================= SLIDE FRAME ================= */
.slide{position:absolute;inset:0 0 78px;padding:22px 36px 8px;display:none;flex-direction:column}
.slide.on{display:flex}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.eyebrow{font-size:13.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.count{font-size:13px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.pill{display:inline-block;border:1.5px solid;border-radius:9px;padding:7px 19px;margin-top:13px;
  font-size:14px;font-weight:700;letter-spacing:.03em;width:fit-content}
h1{font-family:var(--disp);font-weight:700;font-size:38px;line-height:1.1;margin:12px 0 0;
  letter-spacing:-.015em;text-wrap:balance;max-width:26ch}
.sub{font-size:16.4px;color:var(--dim);margin:8px 0 0;max-width:88ch;line-height:1.38}
.area{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;
  gap:9px;padding:6px 0 4px;overflow:hidden}

/* ================= CARDS ================= */
.grid{display:grid;gap:13px}
.g1{grid-template-columns:1fr} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
/* six-card layout defaults to 2 rows x 3 for classroom readability; add .wide for a true 1 x 6 strip */
.g6{grid-template-columns:repeat(3,1fr)} .g6.wide{grid-template-columns:repeat(6,1fr)}
.card{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:15px 17px;
  display:flex;flex-direction:column;gap:8px;min-width:0}
.card .lab{text-align:center;font-size:14px;font-weight:700;letter-spacing:.055em;text-transform:uppercase}
.card .txt{font-size:16px;line-height:1.42;overflow-wrap:anywhere}
.card .txt.sm{font-size:15px;line-height:1.42;color:#E4DCD4;overflow-wrap:anywhere}
/* ---- source voice --------------------------------------------------------
   `lead` is the sentence a student reads from the back row in one second.
   `txt` under it is the source's own words, rendered in full — in a live
   lecture nothing waits behind a click; the printout keeps every word too. */
.card:has(.lead){gap:5px}
.card .lead{font-size:16px;line-height:1.34;font-weight:600;letter-spacing:-.005em;overflow-wrap:anywhere}
.card .txt.src2{font-size:13.5px;line-height:1.36;color:var(--dim);margin-top:0}
/* ---- glossary ---- */
.gl{border-bottom:1px dotted var(--teal);color:inherit;cursor:help;position:relative}
.gl::after{content:attr(data-def);position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%);width:max-content;max-width:300px;white-space:normal;
  background:var(--panel2);border:1.5px solid var(--teal);border-radius:9px;padding:8px 12px;
  font-size:13.5px;line-height:1.45;font-weight:400;color:var(--ink);text-align:left;
  letter-spacing:0;text-transform:none;box-shadow:0 8px 26px -12px #000;
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:20;pointer-events:none}
.gl:hover::after,.gl[data-on="1"]::after{opacity:1;visibility:visible}
.gl[data-edge="top"]::after{bottom:auto;top:calc(100% + 8px)}
/* ---- coverage ledger: what the source has, what the hour reached ---- */
.cov{display:flex;flex-direction:column;gap:5px}
.cvr{display:grid;grid-template-columns:52px 1fr 128px 104px;gap:11px;align-items:center;
  border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 14px}
.cvr .k{font-family:var(--disp);font-size:13.5px;font-weight:700;color:var(--dim2);letter-spacing:.04em}
.cvr .t{font-size:14px;line-height:1.3;min-width:0}
.cvr .t i{font-style:normal;color:var(--dim2);font-size:13.5px}
.cvr .w{font-size:13px;color:var(--dim2);text-align:right;line-height:1.3}
.cvr .s{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-align:center;
  border:1px solid var(--line);border-radius:6px;padding:3px 0;color:var(--dim2)}
.cvr[data-s="taught"]{border-color:rgba(79,191,139,.5)}
.cvr[data-s="taught"] .k,.cvr[data-s="taught"] .s{color:var(--green);border-color:rgba(79,191,139,.5)}
.cvr[data-s="touched"]{border-color:rgba(221,178,126,.55)}
.cvr[data-s="touched"] .k,.cvr[data-s="touched"] .s{color:var(--sand);border-color:rgba(221,178,126,.5)}
.cvr[data-s="open"]{border-color:var(--mag);box-shadow:0 0 18px -9px var(--mag)}
.cvr[data-s="open"] .k,.cvr[data-s="open"] .s{color:var(--mag);border-color:rgba(240,24,154,.5)}
.covfoot{font-size:13px;color:var(--dim);line-height:1.4;text-align:center}
.covfoot b{color:var(--sand)}
/* ---- confusable terms, side by side ---- */
.cmp{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:14px}
.cmp th{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim2);text-align:start;padding:0 13px 2px}
.cmp td{background:var(--panel);border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  padding:6px 13px;line-height:1.32;vertical-align:top}
.cmp td:first-child{border-inline-start:1.5px solid var(--line);border-start-start-radius:10px;border-end-start-radius:10px;
  font-weight:600;white-space:nowrap}
.cmp td:last-child{border-inline-end:1.5px solid var(--line);border-start-end-radius:10px;border-end-end-radius:10px}
.cmp tr[data-c="teal"] td{border-color:rgba(79,198,203,.5)} .cmp tr[data-c="teal"] td:first-child{color:var(--teal)}
.cmp tr[data-c="mag"] td{border-color:rgba(240,24,154,.5)} .cmp tr[data-c="mag"] td:first-child{color:var(--mag)}
.cmp tr[data-c="sand"] td{border-color:rgba(221,178,126,.55)} .cmp tr[data-c="sand"] td:first-child{color:var(--sand)}
.cmp tr[data-c="violet"] td{border-color:rgba(142,125,234,.5)} .cmp tr[data-c="violet"] td:first-child{color:var(--violet)}
.cmp tr[data-c="green"] td{border-color:rgba(79,191,139,.5)} .cmp tr[data-c="green"] td:first-child{color:var(--green)}
.cmp .mut{color:var(--dim);font-size:13.5px}
/* ---- progress, in the bar ---- */
#prog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.05em;
  color:var(--dim2);white-space:nowrap}
#prog .bar{width:64px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
#prog .bar i{display:block;height:100%;background:var(--sand);width:0;transition:width .3s}
/* ---- shortcut help ---- */
#help .kg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 26px}
#help .kr{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:baseline;font-size:15px}
#help .kr b{font-family:var(--mono,monospace);font-size:13.5px;color:var(--sand);font-weight:600}
#help .kr span{color:var(--dim);line-height:1.45}
#help h3{font-family:var(--disp);font-size:14px;color:var(--sand);margin:18px 0 8px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
/* ---- timer, out of time ---- */
@keyframes flashover{0%,100%{background:var(--bar)}50%{background:rgba(240,24,154,.22)}}
#bar.over{animation:flashover .7s ease-in-out 3}
/* ---- right-to-left lectures ---- */
[dir="rtl"] .chain>.card:not(:last-child)::after{right:auto;left:-19px}
[dir="rtl"] .chain>.card:not(:last-child)::before{right:auto;left:-20px;
  border-left-color:transparent;border-right-color:var(--sand);border-left:0;border-right-width:4px}
[dir="rtl"] .rowcard .lab{text-align:left}
[dir="rtl"] .ov .close{right:auto;left:38px}
[dir="rtl"] .qz-why,[dir="rtl"] .qz-hint{border-left:0;border-right:3px solid var(--sand);
  border-radius:10px 0 0 10px}
[dir="rtl"] .qz-hint{border-right-color:var(--violet)}
[dir="rtl"] #notes .nb{border-left:0;border-right:2px solid var(--sand);padding-left:0;padding-right:16px}
[dir="rtl"] .qz-o,[dir="rtl"] .layer{text-align:right}
/* ---- print: a handout, and the route to a PDF ---- */
@media print{
  body{background:#fff;color:#111;overflow:visible}
  #shell{position:static;display:block}
  #stage{width:auto;height:auto;transform:none!important;background:#fff;overflow:visible}
  #stars,#rail,#bar,.ov,.figbar button,#prog{display:none!important}
  .slide{position:static;display:block!important;page-break-after:always;border-bottom:1px solid #ccc;
    padding:0 0 18px;margin-bottom:18px;inset:auto}
  .slide h1{font-size:20px;color:#111;-webkit-text-fill-color:#111}
  .card,.cvr,.jah-row,.cl{background:#fff;border-color:#999!important;box-shadow:none!important}
  .card .lab,.principle{color:#111!important}
  .coach,.tps .done{display:none}
  textarea.inp{border:1px solid #999;min-height:52px;color:#111;background:#fff}
  .gl::after{display:none}
}
/* ---- requirement -> implementation -> tool -> evidence -------------------
   The chain the student cannot cross on their own. Five columns, one row per
   requirement, and the row ends in an artifact rather than an intention. */
.br{display:flex;flex-direction:column;gap:2px}
.brh{display:grid;grid-template-columns:84px .85fr 1.45fr 1.55fr 1.4fr;gap:9px;padding:0 12px}
.brh span{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.brr{display:grid;grid-template-columns:84px .85fr 1.45fr 1.55fr 1.4fr;gap:9px;align-items:stretch;
  border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:3px 12px}
.brr>div{min-width:0;font-size:12.5px;line-height:1.19;color:var(--dim)}
.brr .rq{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center}
.brr .mc{color:var(--ink);font-weight:600}
.brr .ev{color:var(--green)}
.brr .ev b{color:var(--green);font-weight:700;display:block;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:2px}
.tls{display:flex;flex-wrap:wrap;gap:4px}
.tls i{font-style:normal;font-family:var(--mono,monospace);font-size:11.5px;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;color:var(--teal);white-space:nowrap;background:var(--panel2)}
.brr[data-c="teal"]{border-color:rgba(79,198,203,.5)} .brr[data-c="teal"] .rq{color:var(--teal)}
.brr[data-c="mag"]{border-color:rgba(240,24,154,.5)} .brr[data-c="mag"] .rq{color:var(--mag)}
.brr[data-c="sand"]{border-color:rgba(221,178,126,.55)} .brr[data-c="sand"] .rq{color:var(--sand)}
.brr[data-c="violet"]{border-color:rgba(142,125,234,.5)} .brr[data-c="violet"] .rq{color:var(--violet)}
.brr[data-c="green"]{border-color:rgba(79,191,139,.5)} .brr[data-c="green"] .rq{color:var(--green)}
.brnote{font-size:12px;color:var(--dim2);line-height:1.35;text-align:center}
/* ---- local-frame tag ---- */
.tag{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  border:1.5px solid var(--violet);color:var(--violet);background:rgba(142,125,234,.10);
  border-radius:7px;padding:3px 10px;width:fit-content;margin-bottom:2px}
.card .src{margin-top:auto;font-size:13px;color:var(--dim2);letter-spacing:.04em;font-weight:500}
.c-teal{border-color:var(--teal)} .c-teal .lab{color:var(--teal)}
.c-mag{border-color:var(--mag);box-shadow:0 0 18px -8px var(--mag)} .c-mag .lab{color:var(--mag)}
.c-sand{border-color:var(--sand)} .c-sand .lab{color:var(--sand)}
.card.k-probability{background:linear-gradient(135deg,rgba(79,198,203,.11),var(--panel) 72%)}
.card.k-judgment{background:linear-gradient(135deg,rgba(221,178,126,.10),var(--panel) 72%)}
.c-violet{border-color:var(--violet)} .c-violet .lab{color:var(--violet)}
.c-green{border-color:var(--green)} .c-green .lab{color:var(--green)}
.rowcard{display:grid;grid-template-columns:136px 1fr;gap:16px;align-items:center;padding:11px 16px}
.rowcard .lab{text-align:right}
.chain{gap:30px}
.chain>.card{position:relative}
.chain>.card:not(:last-child)::after{content:"";position:absolute;right:-19px;top:50%;width:14px;height:1.5px;background:var(--sand)}
.chain>.card:not(:last-child)::before{content:"";position:absolute;right:-20px;top:50%;margin-top:-4px;
  border:4px solid transparent;border-left-color:var(--sand);border-right:0}
/* ---- golden rule: the one unit per phase the room must not walk past ---- */
.pill.gold{border-color:var(--sand);color:var(--sand);background:rgba(221,178,126,.10);
  box-shadow:0 0 22px -10px var(--sand)}
.pill.gold::before{content:"\2605";margin-right:8px;font-size:13.5px}
.slide.golden h1{background:linear-gradient(90deg,var(--ink) 72%,var(--sand-lt));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* ---- sign & lock ---- */
.signbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
  border:1.5px solid var(--sand);background:rgba(221,178,126,.06);border-radius:12px;padding:11px 17px}
.signbar .st{font-size:14px;line-height:1.45;color:var(--dim)}
.signbar .st b{color:var(--sand)}
.signbar button{border:1.5px solid var(--sand);color:var(--sand);border-radius:9px;padding:8px 20px;
  font-size:14px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.signbar button:hover{background:rgba(221,178,126,.14)}
.signbar[data-on="1"]{border-color:var(--green);background:rgba(79,191,139,.08)}
.signbar[data-on="1"] .st{color:var(--ink)} .signbar[data-on="1"] .st b{color:var(--green)}
.signbar[data-on="1"] button{border-color:var(--line);color:var(--dim2);cursor:default}
textarea.inp[readonly]{color:var(--dim);border-style:dashed;cursor:not-allowed;background:var(--bar)}
.pick[data-locked="1"]{opacity:.6;cursor:not-allowed}
.lockmsg{font-size:13.5px;color:var(--mag);margin-top:6px;min-height:1.2em}
/* ---- self-assessed level against the level the evidence supports ---- */
.lvl{display:flex;flex-direction:column;gap:9px}
.lvlread{border:1.5px solid var(--line);border-radius:11px;padding:11px 17px;font-size:14.5px;
  line-height:1.5;background:var(--panel);color:var(--dim)}
.lvlread b{color:var(--sand)} .lvlread .miss{color:var(--mag);font-weight:600}
.lvlread[data-m="ok"]{border-color:var(--green);background:rgba(79,191,139,.08)}
.lvlread[data-m="ok"] b{color:var(--green)}
.lvlread[data-m="over"]{border-color:var(--mag);background:rgba(240,24,154,.07)}
.lvlread[data-m="under"]{border-color:var(--teal);background:rgba(79,198,203,.06)}
.lvlread[data-m="under"] b{color:var(--teal)}

.principle{text-align:center;font-family:var(--disp);font-weight:600;font-size:18.2px;color:var(--sand);
  line-height:1.35;max-width:98ch;margin:0 auto;text-wrap:balance}
.principle.mag{color:var(--mag)}

.badge{border:1.5px solid var(--green);border-radius:12px;padding:10px 17px;text-align:center;flex-shrink:0}
.badge .b1{font-size:13.5px;font-weight:700;letter-spacing:.05em;color:var(--green);text-transform:uppercase}
.badge .b2{font-size:13.5px;color:var(--dim);margin-top:3px}
.badge.mag{border-color:var(--mag)} .badge.mag .b1{color:var(--mag)}
.badge.violet{border-color:var(--violet)} .badge.violet .b1{color:var(--violet)}

/* ================= SOURCE FIGURE ================= */
.figwrap{background:#fff;border:1.5px solid var(--sand);border-radius:12px;padding:8px;
  display:flex;align-items:center;justify-content:center;position:relative;cursor:crosshair}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--mag);border-radius:50%;
  background:rgba(240,24,154,.20);box-shadow:0 0 14px -2px var(--mag);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.figbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}
.figbar button{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);
  border:1px solid var(--line);border-radius:7px;padding:4px 10px}
.figbar button:hover{border-color:var(--mag);color:var(--mag)}
.svgwrap{width:100%}
.svgwrap svg{display:block;width:100%;height:auto;max-height:124px;margin:0 auto}
.aigate{display:flex;flex-direction:column;gap:6px}
.aq{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;min-width:0;width:100%;gap:8px;align-items:center;border:1.5px solid var(--line);
  background:var(--panel);border-radius:10px;padding:5px 14px}
.aq .qt{min-width:0;overflow-wrap:anywhere;font-size:14px;line-height:1.3}
.aq button{min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:6px 0;font-size:13.5px;font-weight:600;color:var(--dim2)}
.aq button[aria-pressed="true"]{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.10)}
.averdict{text-align:center;font-family:var(--disp);font-weight:600;font-size:15px;line-height:1.35;color:var(--dim2);padding:1px 0}
.averdict.ok{color:var(--green)} .averdict.no{color:var(--mag)}
.jah{display:flex;flex-direction:column;gap:9px}
.jah-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  border:1.5px solid var(--teal);background:rgba(79,198,203,.07);border-radius:12px;padding:10px 16px}
.jah-head .gk{font-size:14.5px;font-weight:600;color:var(--ink)}
.jah-head .gk b{color:var(--teal)}
.jah-head .wt{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--dim2);text-align:right}
.jah-top{display:flex;flex-wrap:wrap;gap:7px}
.jah-top span{border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:13.5px;color:var(--dim)}
.jah-top span b{color:var(--sand);font-weight:600}
.jah-row{display:grid;grid-template-columns:34px 1fr 150px 118px;gap:12px;align-items:center;
  border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px}
.jah-row .n{font-size:13.5px;font-weight:700;color:var(--dim2)}
.jah-row .t{font-size:14px;line-height:1.32}
.jah-row .w{font-size:13px;color:var(--dim2);text-align:right}
.jah-row .s{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-align:center;
  border:1px solid var(--line);border-radius:6px;padding:3px 0}
.jah-row[data-s="covered"]{border-color:rgba(79,191,139,.5)}
.jah-row[data-s="covered"] .n,.jah-row[data-s="covered"] .s{color:var(--green);border-color:rgba(79,191,139,.5)}
.jah-row[data-s="closed"]{border-color:var(--mag);box-shadow:0 0 18px -9px var(--mag)}
.jah-row[data-s="closed"] .n,.jah-row[data-s="closed"] .s{color:var(--mag);border-color:rgba(240,24,154,.5)}
.jah-row[data-s="partial"]{border-color:rgba(221,178,126,.55)}
.jah-row[data-s="partial"] .n,.jah-row[data-s="partial"] .s{color:var(--sand);border-color:rgba(221,178,126,.5)}
.jah-note{font-size:13.5px;color:var(--dim);line-height:1.45;text-align:center}
.qz{display:flex;flex-direction:column;gap:10px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.qz-n{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.qz-lo{font-size:12px;font-weight:700;letter-spacing:.07em;border:1px solid rgba(79,198,203,.45);
  color:var(--teal);border-radius:6px;padding:3px 9px}
.qz-q{font-size:18px;line-height:1.4;color:var(--ink);max-width:96ch}
.qz-opts{display:flex;flex-direction:column;gap:7px}
.qz-o{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:baseline;text-align:left;
  border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;transition:.15s}
.qz-o:hover{border-color:var(--sand)}
.qz-o .l{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--dim2)}
.qz-o .x{font-size:15px;line-height:1.35}
.qz-o[data-st="right"]{border-color:var(--green);background:rgba(79,191,139,.10)}
.qz-o[data-st="right"] .l{color:var(--green)}
.qz-o[data-st="wrong"]{border-color:var(--mag);background:rgba(240,24,154,.10)}
.qz-o[data-st="wrong"] .l{color:var(--mag)}
.qz-o[data-st="dim"]{opacity:.55}
.qz-why{border-left:3px solid var(--sand);background:rgba(221,178,126,.07);border-radius:0 10px 10px 0;
  padding:10px 15px;font-size:14.5px;line-height:1.45;color:#E4DCD4}
.qz-why b{color:var(--sand)}
.qz-foot{display:flex;justify-content:space-between;align-items:center;gap:14px}
/* numbered, obviously clickable: the bars worked as jump targets but nothing
   about a 26x5 slab said so, so nobody clicked them */
.qz-dots{display:flex;gap:7px}
.qz-dots .qzd{width:28px;height:26px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--dim2);font-family:var(--disp);font-size:13.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.qz-dots .qzd:hover{border-color:var(--sand);color:var(--sand)}
.qz-dots .qzd[data-d="right"]{border-color:var(--green);color:var(--green);background:rgba(79,191,139,.12)}
.qz-dots .qzd[data-d="wrong"]{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.12)}
.qz-dots .qzd[data-d="now"]{border-color:var(--sand);color:var(--ground);background:var(--sand)}
.qz-score{font-family:var(--disp);font-weight:600;font-size:14.5px;color:var(--dim2)}
.qz-nav{display:flex;gap:7px}
.qz-nav button{border:1px solid var(--line);border-radius:8px;padding:5px 13px;font-size:13px;
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2)}
.qz-nav button:hover{border-color:var(--sand);color:var(--sand)}
.qz-note{font-size:13px;color:var(--dim2);line-height:1.4;text-align:center}
.clomap{display:flex;flex-direction:column;gap:6px}
.cl{display:grid;grid-template-columns:52px 78px 1fr 108px 100px;gap:11px;align-items:center;
  border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:3px 14px}
.cl .k{font-size:13.5px;font-weight:700;color:var(--dim2);letter-spacing:.05em}
.cl .d{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-align:center;border:1px solid var(--line);
  border-radius:6px;padding:3px 0;color:var(--dim2)}
.cl .d-knowledge{color:var(--teal);border-color:rgba(79,198,203,.45)}
.cl .d-skill{color:var(--violet);border-color:rgba(142,125,234,.45)}
.cl .d-value{color:var(--sand);border-color:rgba(221,178,126,.5)}
.cl .t{font-size:14px;line-height:1.3}
.cl .w{font-size:13px;color:var(--dim2);text-align:right}
.cl .s{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2);text-align:right}
.cl[data-ok="1"]{border-color:var(--green);background:rgba(79,191,139,.08)}
.cl[data-ok="1"] .k,.cl[data-ok="1"] .s{color:var(--green)}
.clofoot{font-size:13px;color:var(--dim);line-height:1.35;text-align:center;margin-top:0}
.cardcheck{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cc{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 6px;text-align:center}
.cc .n{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--dim2);text-transform:uppercase}
.cc .m{font-size:15.5px;font-weight:700;margin-top:4px;color:var(--dim2)}
.cc[data-ok="1"]{border-color:var(--green);background:rgba(79,191,139,.09)}
.cc[data-ok="1"] .n,.cc[data-ok="1"] .m{color:var(--green)}
/* ---- coach: scaffolding shown instead of the answer ---- */
.coach{display:grid;grid-template-columns:74px 1fr;gap:13px;align-items:center;border:1.5px dashed var(--violet);
  background:rgba(142,125,234,.06);border-radius:11px;padding:9px 15px}
.coach .coach-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);text-align:center}
.coach .ct{font-size:14px;line-height:1.4;color:#E4DCD4}
.coach[data-st="ok"]{border-style:solid;border-color:var(--green);background:rgba(79,191,139,.07)}
.coach[data-st="ok"] .coach-label{color:var(--green)}
.coach[data-st="thin"]{border-color:var(--sand);background:rgba(221,178,126,.07)}
.coach[data-st="thin"] .coach-label{color:var(--sand)}
/* ---- think · pair · share ---- */
.tps{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;align-items:stretch}
.tps .st{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 13px;min-width:0}
.tps .st .n{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.tps .st .p{font-size:14px;line-height:1.34;margin-top:3px}
.tps .st.a{border-color:var(--teal)} .tps .st.a .n{color:var(--teal)}
.tps .st.b{border-color:var(--mag)} .tps .st.b .n{color:var(--mag)}
.tps .st.c{border-color:var(--sand)} .tps .st.c .n{color:var(--sand)}
.tps .done{border:1.5px solid var(--line);border-radius:11px;padding:0 15px;font-size:13px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);white-space:nowrap}
.tps .done:hover{border-color:var(--sand);color:var(--sand)}
.tps .done[data-on="1"]{border-color:var(--green);color:var(--green);background:rgba(79,191,139,.09)}
.qz-hint{border-left:3px solid var(--violet);background:rgba(142,125,234,.07);border-radius:0 10px 10px 0;
  padding:10px 15px;font-size:14.5px;line-height:1.45;color:#E4DCD4}
.qz-hint b{color:var(--violet)}
.figwrap img{display:block;max-height:318px;width:auto;max-width:100%;height:auto;border-radius:5px}
.figcap{font-size:13px;color:var(--sand);letter-spacing:.07em;font-weight:600;margin-top:7px;text-transform:uppercase}
.splitfig{display:grid;grid-template-columns:1.02fr .98fr;gap:24px;align-items:center;min-height:0}
.splitfig>*{min-height:0}
.splitfig .card{padding:9px 13px;gap:5px}
.splitfig .card:has(.lead){gap:3px}
.splitfig .card .txt{font-size:14px;line-height:1.38}
.splitfig .card .txt.sm{font-size:14px;line-height:1.36}
.splitfig .card .lab{font-size:13.5px} .splitfig .card .src{font-size:12px}
.splitfig .card .lead{font-size:14px;line-height:1.3}
.splitfig .card .txt.src2{font-size:13px;line-height:1.34}

/* ================= INPUTS / PICKERS ================= */
textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  font-family:var(--body);font-size:14px;padding:9px 11px;line-height:1.45;resize:none}
textarea.inp:focus{border-color:var(--mag);outline:none}
textarea.inp::placeholder{color:var(--dim2)}
/* ---- core vs optional: where the student spends the minutes they have -----
   Twenty-six boxes in seventy-five minutes is a promise nobody keeps, and a
   student who feels behind stops writing. So the author marks the boxes that
   carry the artifact, and the rest are visibly optional. Nothing is removed —
   the ranking is what is added. */
.fw{display:flex;flex-direction:column;gap:2px}
.fw>.fl{display:flex;align-items:baseline;gap:8px;font-size:11px;font-weight:700;line-height:1.15;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.fw>.fl .core{color:var(--mag)}
.fw>.fl .opt{color:var(--dim2)}
.fw>.fl .exb{margin-inline-start:auto;color:var(--violet);border:1px solid var(--line);
  border-radius:6px;padding:2px 8px;font-size:11px;letter-spacing:.07em;cursor:pointer}
.fw>.fl .exb:hover{border-color:var(--violet)}
textarea.inp[data-core="1"]{border-color:rgba(240,24,154,.42)}
textarea.inp[data-core="0"]{background:transparent;border-style:dashed}
/* ---- a worked example, revealed on demand and never typed into the box ---- */
.exbox{border:1.5px dashed var(--violet);background:rgba(142,125,234,.07);border-radius:9px;
  padding:8px 12px;font-size:13.5px;line-height:1.45;color:#E4DCD4}
.exbox b{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--violet);margin-bottom:3px}
/* ---- distributed retrieval: one question, pulled back mid-hour ------------
   The same pool as the end-of-session check, asked earlier. Spacing beats
   massing, and the state is shared, so answering here IS answering there. */
.rc{border:1.5px solid var(--teal);background:rgba(79,198,203,.06);border-radius:11px;padding:8px 15px;
  display:flex;flex-direction:column;gap:6px}
.rc .rh{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.rc .rh .n{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.rc .rh .p{font-size:13px;color:var(--dim2)}
.rc .rh .lo{margin-inline-start:auto;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  border:1px solid rgba(79,198,203,.4);color:var(--teal);border-radius:6px;padding:2px 8px}
.rc .rq{font-size:15px;line-height:1.4}
.rc .qz-opts{gap:5px}
.rc .qz-o{padding:5px 12px} .rc .qz-o .x{font-size:13.5px}
.rc .qz-why,.rc .qz-hint{font-size:14px;padding:8px 13px}
.picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 17px;
  font-size:14.5px;font-weight:500;color:var(--dim);transition:.15s}
.pick:hover{border-color:var(--sand);color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.10);font-weight:600}

.stack{display:flex;flex-direction:column;gap:5px}
.layer{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);
  background:var(--panel);border-radius:9px;padding:6px 12px;text-align:left;transition:.15s;width:100%}
.layer:hover{border-color:var(--teal)}
.layer .n{font-size:13px;color:var(--dim2);font-weight:600}
.layer .nm{font-size:14.5px;font-weight:500}
.layer[data-in="1"]{border-color:var(--mag);background:rgba(240,24,154,.09)}
.layer[data-in="1"] .n{color:var(--mag)}
.tracebox{border:1.5px dashed var(--sand);border-radius:10px;padding:9px 13px;font-size:14px;color:var(--sand);
  line-height:1.55;min-height:40px;background:rgba(221,178,126,.05)}
.tracebox .e{color:var(--dim2)}

.matrix{display:grid;grid-template-columns:44px repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:7px}
.mh{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--dim2);text-transform:uppercase;
  display:flex;align-items:center;justify-content:center}
.mh.s{writing-mode:vertical-rl;transform:rotate(180deg)}
.cell{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:8px;min-height:54px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:center;transition:.15s}
.cell .co{font-size:12.5px;color:var(--dim2);font-weight:600}
.cell .st{font-size:13px;font-weight:600;color:var(--dim2)}
.cell[data-s="1"]{border-color:var(--green);background:rgba(79,191,139,.1)} .cell[data-s="1"] .st{color:var(--green)}
.cell[data-s="2"]{border-color:var(--sand);background:rgba(221,178,126,.1)} .cell[data-s="2"] .st{color:var(--sand)}
.cell[data-s="3"]{border-color:var(--mag);background:rgba(240,24,154,.1)} .cell[data-s="3"] .st{color:var(--mag)}

.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.gate{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 15px;
  display:flex;flex-direction:column;gap:7px;text-align:center;transition:.15s}
.gate .lab{font-size:14px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;color:var(--dim2)}
.gate .txt{font-size:15px;line-height:1.4;color:var(--dim)}
.gate .mark{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--dim2)}
.gate[data-ok="1"]{border-color:var(--green);background:rgba(79,191,139,.09)}
.gate[data-ok="1"] .lab,.gate[data-ok="1"] .mark{color:var(--green)}
.gate[data-ok="1"] .txt{color:var(--ink)}
.readyline{text-align:center;font-family:var(--disp);font-weight:600;font-size:15.5px;color:var(--dim2)}
.readyline.ok{color:var(--green)}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--bar);border-top:1px solid var(--line);
  padding:12px 24px 12px 36px;display:grid;grid-template-columns:150px minmax(240px,1fr) auto auto auto;gap:14px;align-items:center;z-index:6}
#bar .tb{font-size:13.5px;font-weight:700;color:var(--sand);letter-spacing:.05em}
#bar .yt{font-size:13.5px;font-weight:700;color:var(--mag);letter-spacing:.05em;margin-top:6px}
#bar .task{font-size:15.5px;line-height:1.35}
#timer{display:flex;align-items:center;gap:9px}
#timer .clock{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim2);font-family:var(--disp)}
#timer.run .clock{color:var(--sand)} #timer.over .clock{color:var(--mag)}
#timer button{border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:600;
  letter-spacing:.06em;color:var(--dim2);text-transform:uppercase}
#timer button:hover{border-color:var(--sand);color:var(--sand)}

/* ================= TITLE / CLOSING ================= */
.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:40px;align-items:center;flex:1;min-height:0}
.hero h2{font-family:var(--disp);font-weight:700;font-size:54px;line-height:1.02;margin:0;letter-spacing:-.022em}
.hero h2 em{font-style:normal;color:var(--sand);display:block}
.hero .st{font-size:18px;color:var(--dim);margin:14px 0 0;line-height:1.4;max-width:44ch}
.brandimg{border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;
  box-shadow:0 0 50px -18px var(--mag)}
.brandimg img{display:block;width:100%;height:auto}
.srcbox{border:1.5px solid var(--teal);border-radius:13px;padding:14px 19px;margin-top:22px;width:fit-content}
.srcbox .l{font-size:13.5px;font-weight:700;color:var(--teal);letter-spacing:.06em;text-align:center}
.srcbox .v{font-size:15.5px;margin-top:5px}
.flowline{font-size:14px;font-weight:700;color:var(--sand);letter-spacing:.06em;margin-top:20px}
.keys{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
kbd{font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--dim2);background:var(--panel)}
kbd b{color:var(--sand);font-weight:600}

/* ================= OVERLAYS ================= */
.ov{position:absolute;inset:0;background:#06050A;z-index:30;display:none;flex-direction:column;padding:26px 40px}
.ov.on{display:flex}
.ov h2{font-family:var(--disp);font-size:25px;margin:0 0 4px;font-weight:700}
.ov .osub{font-size:13.5px;font-weight:600;letter-spacing:.09em;color:var(--dim2);text-transform:uppercase;margin-bottom:17px}
.ov .close{position:absolute;top:23px;right:38px;font-size:13px;font-weight:600;letter-spacing:.06em;
  color:var(--dim2);border:1px solid var(--line);padding:6px 13px;border-radius:8px}
.oscroll{flex:1;overflow-y:auto;padding-right:10px}
.oscroll::-webkit-scrollbar{width:6px}
.oscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#notes .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#notes .meta span{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);padding:5px 11px;border-radius:8px;color:var(--dim)}
#notes .nb{border-left:2px solid var(--sand);padding-left:16px;margin-bottom:17px}
#notes .nb h3{margin:0 0 6px;font-size:15px;color:var(--sand);font-weight:700;font-family:var(--disp)}
#notes .nb p{margin:0;font-size:15.5px;line-height:1.6;color:#E7DFD8}
#notes .say{border:1.5px solid var(--mag);border-radius:12px;padding:13px 17px;margin-bottom:17px}
#notes .say .l{font-size:13px;font-weight:700;color:var(--mag);letter-spacing:.08em;margin-bottom:6px}
#notes .say p{margin:0;font-size:15.5px;line-height:1.5;font-style:italic}
#case .sec{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:9px;background:var(--panel)}
#case .sec .l{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--teal);text-transform:uppercase;margin-bottom:6px}
#case .sec .v{font-size:14px;line-height:1.55;white-space:pre-wrap}
#case .sec .v.blank{color:var(--dim2);font-style:italic}
#case .tools{display:flex;gap:9px;margin-top:13px}
#case .tools button{border:1px solid var(--line);border-radius:8px;padding:9px 17px;font-size:13px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#case .tools button:hover{border-color:var(--sand);color:var(--sand)}
#over .og{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
#over .oc{border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;text-align:left;background:var(--panel);min-height:68px}
#over .oc:hover{border-color:var(--sand)} #over .oc.cur{border-color:var(--mag);background:rgba(240,24,154,.1)}
#over .oc .u{font-size:12.5px;font-weight:700;color:var(--sand);letter-spacing:.05em}
#over .oc .t{font-size:13.5px;line-height:1.25;margin-top:5px;color:var(--dim)}

/* ================= WORLD-CLASS READABILITY / ANSWER REVEAL =================
   Global rules inherited by every lecture cloned from this file. */
.top>div:first-child{min-width:0;flex:1}
.top .badge,.top>.count{flex:0 0 auto}
h1,.sub,.principle,.qz-q,.rq,.card,.cmp td,.brr>div{overflow-wrap:anywhere;word-break:normal}
.slide.readable-lg h1{font-size:41px}
.slide.readable-lg .sub{font-size:17.2px}
.slide.readable-lg .card .txt{font-size:17px}
.slide.readable-lg .card .lead{font-size:16.5px}
.slide.readable-lg .principle{font-size:19.2px}
.slide.readable-lg .qz-q{font-size:19px}
.slide.dense h1{font-size:35px}
.slide.dense .sub{font-size:16px}
.slide.dense .card .txt{font-size:15px}
.slide.dense .card .txt.sm{font-size:14px}
.slide.dense .card .lead{font-size:15px}
.slide.dense .principle{font-size:16.7px}
.slide.dense .qz-q{font-size:16.5px}
.answer-wrap{margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}

/* ========================================================================
   v7 CLASSROOM PASS — three fixes from student feedback:
     1. Bigger type everywhere: projector-legible from the back row.
     2. Tasks are unmistakable: a magenta "YOUR TASK" strip closes every
        unit, visually separate from the neutral information cards.
     3. No slide scrolling: each slide auto-fits its content to the stage.
   ======================================================================== */

/* ---- 1. the task strip: the last thing on every unit is what to DO ------ */
.taskstrip{flex-shrink:0;display:flex;align-items:center;gap:13px;margin-top:11px;
  border:1.5px solid var(--mag);border-inline-start:6px solid var(--mag);
  background:rgba(240,24,154,.10);border-radius:11px;padding:9px 14px;
  box-shadow:0 0 22px -12px var(--mag)}
.taskstrip .tsk-badge{flex-shrink:0;font-family:var(--disp);font-size:14px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:#fff;
  background:var(--mag);border-radius:7px;padding:5px 11px;white-space:nowrap}
.taskstrip .tsk-txt{font-size:16.5px;line-height:1.42;font-weight:600;color:var(--ink);min-width:0}
.taskstrip .tsk-txt b{color:var(--mag)}
body[data-theme="day"] .taskstrip{background:rgba(179,12,112,.07)}

/* ---- 2. no scroll: the slide clips; the fit wrapper scales to fill ------ */
.slide{overflow:hidden;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide>.fit{display:flex;flex-direction:column;flex:1 0 auto;min-height:0;width:100%}
.fit>.top{flex:0 0 auto;margin-bottom:12px}
.slide .area{flex:1 0 auto;justify-content:center;justify-content:safe center;padding:2px 0 0}
#saveStatus{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---- 3. bigger type: bases raised, dense/readable floors raised with them */
h1{font-size:calc(40px * var(--reader-zoom))}
.slide.readable-lg h1{font-size:calc(43px * var(--reader-zoom))}
.slide.dense h1{font-size:calc(36px * var(--reader-zoom))}
.slide .sub{font-size:calc(17.5px * var(--reader-zoom))}
.slide.readable-lg .sub{font-size:calc(18.5px * var(--reader-zoom))}
.slide.dense .sub{font-size:calc(16.5px * var(--reader-zoom))}
.slide .card .txt,.slide .card .lead{font-size:calc(18px * var(--reader-zoom))}
.slide.readable-lg .card .txt{font-size:calc(19.5px * var(--reader-zoom))}
.slide.readable-lg .card .lead{font-size:calc(19px * var(--reader-zoom))}
.slide.dense .card .txt{font-size:calc(16.2px * var(--reader-zoom))}
.slide.dense .card .lead{font-size:calc(16px * var(--reader-zoom))}
.slide .card .txt.sm,.slide .card .txt.src2{font-size:calc(16px * var(--reader-zoom))}
.slide.dense .card .txt.sm{font-size:calc(15px * var(--reader-zoom))}
.slide .principle{font-size:calc(20px * var(--reader-zoom))}
.slide.readable-lg .principle{font-size:calc(21.5px * var(--reader-zoom))}
.slide.dense .principle{font-size:calc(18.5px * var(--reader-zoom))}
.slide .qz-q{font-size:calc(20px * var(--reader-zoom))}
.slide.dense .qz-q{font-size:calc(18.5px * var(--reader-zoom))}
textarea.inp{font-size:calc(16.5px * var(--reader-zoom));min-height:64px}
.answer-box{font-size:calc(16px * var(--reader-zoom))}
.qz-why,.qz-hint{font-size:calc(15.5px * var(--reader-zoom))}
/* splitfig keeps its own, slightly smaller scale — re-anchored above */
.splitfig .card .txt{font-size:15px}
.splitfig .card .lead{font-size:15px}
.splitfig .card .txt.sm{font-size:14.5px}
.splitfig .card .txt.src2{font-size:14px}
.splitfig .card .lab{font-size:14px}
.splitfig .card .src{font-size:13px}
/* labels, meta and small caps — the 9-11px tier is what read as "small font" */
.eyebrow{font-size:14px}
.count{font-size:13.5px}
.pill{font-size:15px}
.card .lab{font-size:14.5px}
.card .src{font-size:13.5px}
.tag{font-size:13.5px}
.badge .b1{font-size:14px}.badge .b2{font-size:14px}
.cvr .k{font-size:14px}.cvr .t{font-size:15px}.cvr .w{font-size:13.5px}.cvr .s{font-size:13px}
.covfoot{font-size:13.5px}
.cmp{font-size:15px}.cmp th{font-size:13px}.cmp .mut{font-size:14px}
.brr>div{font-size:13.5px;line-height:1.3}.brr .rq{font-size:13.5px}.brh span{font-size:12.5px}

/* ========================================================================
   v8 STORY THREADS + SLIDE REDESIGN — second pass from class feedback:
     1. Icons that carry meaning, not decoration: a spark marks every AI
        moment, a map pin marks every local-content / course-addition moment,
        a book marks a cited source page, a pencil marks the task strip.
        A student can follow either thread across the hour by its glyph.
     2. B01 rebuilt: the bridge table compresses to fit at scale 1.0, so the
        slide stops shrinking and its fonts match the rest of the deck.
     3. R15 rebuilt: the imported white PNG is replaced by an in-theme
        flow — AI prepares -> humans verify -> humans sign — drawn in
        CSS/SVG so it sits in the dark palette instead of fighting it.
   ======================================================================== */
.ic{display:inline-block;vertical-align:-2.5px;flex:none}
.b1 .ic{vertical-align:-3px;margin-inline-end:5px;opacity:.95}
.lab .ic{margin-inline-end:5px;opacity:.9;vertical-align:-2px}
.qt .ic{margin-inline-end:6px;opacity:.85;vertical-align:-3px}
.src .ic{margin-inline-end:4px;opacity:.7}
.tsk-badge .ic{margin-inline-end:6px;vertical-align:-2.5px}
.brh span .ic{margin-inline-end:4px;opacity:.9}
/* the corner badge now says what it is at a glance */
.badge{padding:11px 18px}
.badge .b1{font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.badge .b2{font-size:14px}
/* the AI row of the bridge is a thread marker, not just another property */
.brr.brr-ai{background:rgba(142,125,234,.09);border-color:rgba(142,125,234,.75);
  box-shadow:inset 3px 0 0 var(--violet)}
.brr .ai-chip{display:block;width:max-content;flex:none;margin-top:3px;margin-inline-start:0;font-family:var(--disp);font-size:12px;
  font-weight:700;letter-spacing:.08em;color:var(--violet);border:1px solid rgba(142,125,234,.6);
  border-radius:5px;padding:1px 5px}
/* B01: the five header cells read as one chain, not five column names */
.brh span{display:inline-flex;align-items:center;gap:5px}
/* R15: the assurance flow replaces the imported figure */
.aiflow{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;gap:9px;align-items:stretch}
.aiflow .st{border:1.5px solid var(--line);border-radius:12px;background:var(--panel);
  padding:13px 15px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.aiflow .sic{width:38px;height:38px;border-radius:10px;border:1.5px solid;display:flex;
  align-items:center;justify-content:center;flex:none}
.aiflow .slab{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.07em;margin-top:2px}
.aiflow .stx{font-size:16px;line-height:1.42;color:var(--dim)}
.aiflow .ar{display:flex;align-items:center;justify-content:center;color:var(--dim2)}
.aiflow .st.s-teal{border-color:rgba(79,198,203,.55)}
.aiflow .st.s-teal .sic{color:var(--teal);border-color:var(--teal);background:rgba(79,198,203,.10)}
.aiflow .st.s-teal .slab{color:var(--teal)}
.aiflow .st.s-sand{border-color:rgba(221,178,126,.55)}
.aiflow .st.s-sand .sic{color:var(--sand);border-color:var(--sand);background:rgba(221,178,126,.10)}
.aiflow .st.s-sand .slab{color:var(--sand)}
.aiflow .st.s-mag{border-color:rgba(240,24,154,.55)}

.aiflow .st.s-mag .slab{color:var(--mag)}

.slide .aigate{gap:5px;margin-top:11px}
.slide .aq{padding:3px 14px}
.aiflow .st{padding:10px 14px 9px}

   rule is unconditional so it no longer depends on a density class */
.slide .brh,.slide .brr{grid-template-columns:100px .78fr 1.55fr 1.36fr 1.36fr}
.slide .brr>div{font-size:15px;line-height:1.34}

   The three redrawn source figures live on the always-white figure panel,

/* ======================================================================
   v11 — TWO BRANDS THE HOUR RUNS ON: AI and READINESS
   1. aiLogo(): one monogram plate on every AI touchpoint — the corner
      badge, the flow station, the workload card, the bridge row, the
      gate header and the title legend all carry the same mark.
   2. The readiness gauge: a live ring in the bottom bar fed by cloOk(),
      the same evidence check Rule 20 reads. Evidence in, ring fills;
      clicking the ring opens the readiness check.
   ====================================================================== */
.ai-logo{vertical-align:-4px}
.aigate .agh{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;
  font-size:14px;letter-spacing:.08em;color:var(--mag);margin-bottom:2px}
.lic.ai{border-color:rgba(240,24,154,.55);color:var(--mag);background:rgba(240,24,154,.10)}

#readyChip{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
  border:1px solid var(--line);border-radius:9px;padding:3px 8px 3px 6px;transition:border-color .2s}
#readyChip:hover,#readyChip:focus-visible{border-color:var(--sand)}
#readyChip b{font-size:13px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
#readyChip .rl{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--dim2)}
#readyRing{flex:none}
#readyRing .rbg{fill:none;stroke:var(--line);stroke-width:3.2}
#readyRing .rfg{fill:none;stroke:var(--sand);stroke-width:3.2;stroke-linecap:round;
  stroke-dasharray:46.5;stroke-dashoffset:46.5;transform:rotate(-90deg);transform-origin:center;
  transition:stroke-dashoffset .45s ease,stroke .3s}
#readyChip[data-lv="0"] .rfg{stroke:var(--dim2);opacity:.6}
#readyChip[data-lv="full"] .rfg{stroke:var(--green)}
#readyChip[data-lv="full"]{border-color:rgba(79,191,139,.55)}
#readyChip[data-lv="full"] b{color:var(--green)}
@media screen and (max-width:900px){ #readyChip .rl,#prog .rsep{display:none} }
/* v11 mobile: the two slides that sat exactly on the fit floor at 820px get
   their padding trimmed, not their content — the fitter stops clamping and
   the task strip returns fully into view. */
@media screen and (max-width:900px){

  .gate{padding:9px 10px}

/* ======================================================================
   v12 — RETRIEVAL LOOPS + QUICK VIEW
   1. The 60-second retrieval close, one at the end of every phase. Until
      now the hour retrieved exactly once (J02), massed at the very end;
      repeated retrieval is the strongest documented effect in learning
      research. A ring timer, four questions, memory first, reveal per
      row, an honest self-score. No state is saved: the drill is the
      moment, not an artifact.
   2. Quick view: the deck turns itself. One button (or Q) auto-advances
      at a readable pace with a visible progress line — for self-review,
      screen recording and sharing. Any manual navigation cancels it.
   ====================================================================== */
.qa{display:grid;grid-template-columns:218px minmax(0,1fr);gap:26px;align-items:stretch;margin-top:2px;
  /* the retrieval close owns the phase's last word: it stretches into the
     space the area offers and the four rows distribute across it, so the
     slide reads as composed rather than top-heavy */
  flex:1;min-height:0}
.qa-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px}
.qa-ring{position:relative;width:140px;height:140px;border-radius:50%;background:transparent;border:0;cursor:pointer;padding:0}
.qa-ring:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.qa-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.qa-ring circle{fill:none;stroke-width:7}
.qa-rbg{stroke:var(--line)}
.qa-rfg{stroke:var(--teal);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:0}
.qa-secs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:38px;color:var(--ink);font-variant-numeric:tabular-nums}
.qa-meta{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.qa-tag{font-size:13px;font-weight:700;letter-spacing:.09em;color:var(--teal)}
.qa-hint{font-size:13.5px;color:var(--dim);max-width:200px;line-height:1.45}
.qa-h2{display:none;color:var(--mag);font-weight:600}
.qa.over .qa-h1{display:none}
.qa.over .qa-h2{display:block}
.qa.over .qa-rfg{stroke:var(--mag)}
.qa.over .qa-secs{color:var(--mag)}
.qa-score{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:5px 12px}
.qa-score .qa-slab{font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--dim2)}
.qa-score b{font-size:14px;font-variant-numeric:tabular-nums;color:var(--dim)}
.qa-score[data-hit="all"]{border-color:rgba(79,191,139,.55)}
.qa-score[data-hit="all"] b{color:var(--green)}
.qa-list{display:flex;flex-direction:column;justify-content:space-evenly;min-width:0}
.qa-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:13px;padding:14px 2px;border-top:1px dotted var(--line);align-items:start}
.qa-row:first-child{border-top:0;padding-top:4px}
.qa-n{font-family:var(--disp);font-weight:700;font-size:20px;color:var(--teal);line-height:1.25}
.qa-q{font-size:16.5px;font-weight:600;line-height:1.45}
.qa-tog{font-size:13px;font-weight:700;letter-spacing:.05em;border:1.5px solid var(--teal);background:transparent;
  color:var(--teal);border-radius:8px;padding:6px 13px;cursor:pointer;white-space:nowrap;margin-top:1px}
.qa-tog:hover{background:rgba(79,198,203,.12)}
.qa-a{display:none;margin-top:10px;padding:10px 15px;border-left:3px solid var(--teal);background:rgba(79,198,203,.08);
  font-size:15.5px;line-height:1.5;color:var(--ink);border-radius:0 8px 8px 0}
.qa-row.open .qa-a{display:block;animation:qaIn .18s ease}
@keyframes qaIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.qa-judge{display:none;gap:8px;margin-top:10px}
.qa-row.open .qa-judge{display:flex}
.qa-judge button{font-size:13px;font-weight:700;letter-spacing:.04em;border:1.5px solid var(--line);background:transparent;
  color:var(--dim);border-radius:8px;padding:5px 12px;cursor:pointer}
.qa-judge button:hover{border-color:var(--dim)}
.qa-row.picked-hit .qa-judge .qa-hit{border-color:var(--green);color:var(--green);background:rgba(79,191,139,.10)}
.qa-row.picked-miss .qa-judge .qa-miss{border-color:var(--mag);color:var(--mag);background:rgba(240,24,154,.10)}
/* quick view chrome */
#qvBtn[data-on="1"]{border-color:var(--mag);color:var(--mag)}
#qvFill{position:absolute;top:-2px;left:0;height:2px;width:0;background:var(--mag);z-index:9;opacity:0;transition:opacity .25s}
body.qv-on #qvFill{opacity:1}
body.qv-on #lectureControls button:not(#qvBtn){opacity:.45}
body.qv-on #lectureControls button:not(#qvBtn):hover,body.qv-on #lectureControls button:not(#qvBtn):focus-visible{opacity:1}
@media (prefers-reduced-motion:reduce){ .qa-row.open .qa-a{animation:none} #qvFill{transition:none} }
/* the quick-view button goes icon-only on the compact bar, exactly like the
   readiness chip: eight captioned controls wrap the bar one row taller and
   steal 42px from every mobile slide */
@media screen and (max-width:900px){
  #qvBtn .ct{display:none}
  #qvBtn{padding-left:10px;padding-right:10px}
}
@media screen and (max-width:900px){

/* ========================================================================
   v13 BACK ROW — fourth pass from class feedback:
     1. The "source text" fold is gone: every card renders its source line
        in full. In a live lecture nothing waits behind a click.
     2. The type floor rose deck-wide (the tapered map above): the 9-12px
        tier the hall could not read gained +1.5..+2.5px, body copy keeps
        the size v7 already fixed. The pins below hold the second voice
        (source lines) just under body, and the furniture trims give back
        part of the height cost so the fit engine does not eat the gain.
   ======================================================================== */
.fit>.top{margin-bottom:9px}
.card{padding:13px 15px}
.badge{padding:9px 15px}

   renders in FULL but is set compactly (tight leading, just under sm) —
   the lead above it stays the sentence the back row reads */
.slide .card .txt.sm{font-size:calc(15.5px * var(--reader-zoom))}
.slide .card .txt.src2{font-size:calc(14.5px * var(--reader-zoom));line-height:1.36;margin-top:1px}
.slide.dense .card .txt.sm{font-size:calc(14.5px * var(--reader-zoom))}

/* ========================================================================

     1. Slides that mix the book's voice with the course's own now draw the
        seam: a zones block gives each voice a labelled, colour-coded column
        (teal = cited from the source, magenta = course context). No text is
        reworded — the separation itself is the honesty.
     2. X01's properties tree is redrawn natively (the screenshot's tiny type
        was unreadable from the hall) and its five cramped cards collapse
        into two, one per kind — the slide's own point becomes the layout.
     3. The route-map slide is gone at the instructor's call. The adaptive
        forks stay in the engine (the helper slide still appears when the

var LECTURE={"id": "cpit455-ch11", "thresholds": {"thinDefault": 40, "coachDeep": 55, "coachMinFilled": 1}, "thresholdNotes": "Character counts guide scaffolding, not grading or semantic correctness. R05 and H01 share coachDeep; thinDefault applies to other thin conditions.", "preparation": {"source": "Supplied Chapter 11 source pack; every slide is indexed under Source review.", "due": "before the assignment deadline in the LMS", "ledger": "C01"}, "course": "CPIT-455 / CHAPTER 11", "title": "Reliability Engineering", "titleAccent": "", "titleLead": "Reliability Engineering", "tagline": "Make the denominator and operating profile explicit. Learn the source concepts, try three short interactions, then apply them in a separate assignment.", "source": "Sommerville, <i>Software Engineering</i>, Chapter 11 &nbsp;|&nbsp; Prof. Adeeb Noor", "sourceShort": "Sommerville Ch.11", "flow": "LEARN → PRACTISE → REVIEW → TRANSFER", "cardTitle": "Decision Card & Reliability Case", "cardSub": "Reusable practice artifact · six fields · save or export before leaving", "cardHeader": "DECISION CARD & RELIABILITY CASE\nCPIT-455 · Chapter 11 Reliability Engineering\nCrisis: hospital insulin pump software update at 03:00 (teaching scenario)", "sourceMap": "Supplied original Chapter 11 · 81 source slides · complete source ledger in Source review", "closingLine": "Measure the failure. Name the metric. Show the evidence. Own the consequence.", "phases": ["LEARN", "APPLY", "CHECK"], "crisisTerms": ["pump", "infusion", "dose", "ICU", "patient", "nurse", "update", "regulator"], "context": {"country": "Saudi Arabia", "institution": "King Abdulaziz University", "bodies": "Identify the relevant authority for the actual deployment context.", "bodiesShort": "Applicable sector and institutional authorities", "accreditor": "ETEC", "accreditorLong": "the Education and Training Evaluation Commission (ETEC)", "testName": "&#1580;&#1575;&#1607;&#1586;&#1610;&#1577;", "testEn": "Graduate Readiness Test", "testBody": "the National Center for Assessment (QIYAS)", "domainWords": "&#1575;&#1604;&#1605;&#1593;&#1575;&#1585;&#1601;, &#1575;&#1604;&#1605;&#1607;&#1575;&#1585;&#1575;&#1578; and &#1575;&#1604;&#1602;&#1610;&#1605;", "flag": "&#127462;&#127480;", "localTag": "LOCAL FRAME", "schedule": "See the current LMS timetable.", "assignmentDue": "the deadline announced in the LMS", "readingSource": "Supplied Chapter 11 source pack; every slide is indexed under Source review.", "contact": "arnoor@kau.edu.sa"}, "jahiziah": {"source": "ETEC Academic Standards for Information Technology Programs (2025, v2.0) &middot; GKU 3 &middot; SKU 3.1 &middot; Topic 4 (Risk management and prevention approaches)", "gku": "GKU 3 &middot; Cybersecurity Principles (10% of test)", "sku": "SKU 3.1 &mdash; Risk management and prevention approaches for safety-critical systems <span style=\"color:#6F665F\">(dept. matrix: 3.3)</span>", "weight": "2 QUESTIONS ON THE DEPT. MATRIX", "topics": ["Reliability", "Availability", "Fault tolerance", "Risk management"], "outcomes": [{"n": 1, "s": "covered", "txt": "<b>SLO 2 (Compare vulnerabilities, threats, and risk):</b> Distinguish availability, reliability, POFOD, ROCOF and MTTF as quantitative reliability metrics, and relate each to a hazard class.", "where": "X01 &middot; X03 &middot; X04 &middot; X06 &middot; Rule 10"}, {"n": 2, "s": "closed", "txt": "<b>SLO 3 (Apply risk management frameworks and use appropriate tools):</b> Specify non-functional reliability requirements using the appropriate metric (POFOD, ROCOF, AVAIL) for a critical system, and justify the choice by demand pattern.", "where": "Rule 07 &middot; X05 &middot; X06 &middot; Rule 10"}, {"n": 3, "s": "partial", "txt": "<b>SLO 5 (Recognise platform-specific risks):</b> Recognise fault-tolerant architectures including protection systems, self-monitoring, TMR and N-version programming, and identify platform-specific reliability risks.", "where": "B01 &middot; R09 &middot; X09 &middot; Rule 11"}], "note": "Outcome 2 was recorded as <span style=\"color:#F0189A\">not covered</span> in the department mapping and is closed by Rule 07 of this chapter. Outcome 3 is only partly served here &mdash; the architectures reach protection systems, self-monitoring, TMR and N-version programming, but platform-specific fault tolerance for distributed systems belongs to the Resilience sessions. <b>Alignment source:</b> ETEC Academic Standards for Information Technology Programs (2025, v2.0), GKU 3 (Cybersecurity Principles, 10%) and SKU 3.1 Topic 4 (Risk management and prevention approaches across systems, networks, and devices). This slide states <i>coverage</i>; it is not the exam and predicts nothing about it."}, "jahtest": {"note": "Practice items written for this course in the style of the knowledge unit. They are not exam questions, they do not come from {{testBody}}, and the score here predicts nothing about your result on the {{testEn}}.", "items": [{"lo": "LO1 · reliability metrics", "q": "The ICU insulin pump must deliver the correct dose on every demand. Which reliability metric best captures this requirement?", "opts": ["Availability, because the pump must be running when needed", "POFOD, because each dose request is an independent demand with serious consequences", "ROCOF, because failures occur at a measurable rate over time", "MTTF, because the pump runs continuously"], "a": 1, "hint": "Two of the four metrics assume continuous operation; two assume intermittent service demands. A dose is demanded at discrete moments, and a wrong dose has serious consequences. Which metric counts failures per demand rather than per unit time?", "why": "<b>POFOD</b> (Probability Of Failure On Demand) is the right metric when services are demanded intermittently and the consequences of a single failed demand are serious &mdash; exactly the insulin pump case (Ch.11 p.20). Availability measures uptime, ROCOF measures failure rate per unit time, MTTF is the reciprocal of ROCOF."}, {"lo": "LO1 · reliability metrics", "q": "A railway signalling system must remain operational 24/7 with rare, brief outages. Which metric is most appropriate?", "opts": ["POFOD, because each signal change is a demand", "Availability, because continuous service is what matters and repair time counts", "MTTF, because the system runs continuously", "ROCOF, because failures are counted per hour"], "a": 1, "hint": "The system runs continuously rather than on demand, AND the duration of any outage matters as much as its frequency. Which metric takes repair and restart time into account?", "why": "<b>Availability</b> is the right metric for non-stop, continuously running systems (Ch.11 p.22): it measures the fraction of time the system is up and explicitly accounts for repair and restart time. Telephone switching systems and railway signalling systems are the textbook examples."}, {"lo": "LO2 · specifying reliability", "q": "An ATM network requires the customer database to be available 99.99% of the time between 7am and 11pm. What kind of requirement is this?", "opts": ["A functional reliability requirement, because it specifies a system function", "A non-functional reliability requirement, because it specifies a quantitative reliability target", "A process requirement, because it specifies how the system is built", "A redundancy requirement, because the database must be replicated"], "a": 1, "hint": "Functional requirements define what the system does (checking, recovery, redundancy functions). Non-functional requirements specify measurable properties. The 0.9999 figure is a measurable target.", "why": "<b>Non-functional reliability requirements</b> specify the required reliability and availability using one of the metrics (POFOD, ROCOF, AVAIL). The ATM availability specification of 0.9999 is quantitative, so it is non-functional (Ch.11 p.24). Functional reliability requirements specify system functions like input checking, redundancy and recovery."}, {"lo": "LO2 · specifying reliability", "q": "RR3 says \"N-version programming shall be used to implement the braking control system.\" Which category of functional reliability requirement is this?", "opts": ["Checking", "Recovery", "Redundancy", "Process"], "a": 2, "hint": "N-version programming means multiple independently-developed versions run in parallel and a voting system picks the majority result. The braking system therefore has multiple parallel implementations of the same function &mdash; what is the word for that?", "why": "N-version programming is the canonical example of a <b>redundancy</b> requirement (Ch.11 p.32). Redundancy requirements specify redundant features to be included in the system. RR1 (range check) is Checking; RR2 (database copies) is Recovery + Redundancy; RR4 (safe subset of Ada + static analysis) is Process."}, {"lo": "LO3 · fault-tolerant architecture", "q": "Why does the Airbus flight control system use different processors, different chipsets and different programming languages across its primary and secondary channels?", "opts": ["To reduce cost by mixing commercial and specialised hardware", "To ensure that a common-mode fault does not defeat all redundant channels at once", "Because no single supplier can produce enough processors for the Airbus fleet", "To make certification easier by demonstrating technological variety"], "a": 1, "hint": "If all channels used the same processor and the same language, a single design fault in that processor or compiler would produce the same wrong result in every channel at the same time. What is that called, and what defeats it?", "why": "<b>Diversity</b> defeats common-mode failure (Ch.11 p.43). If all channels use the same processor, chipset and language, a single design fault in any of them produces the same wrong result everywhere &mdash; redundancy without independence is one system wearing two coats. The Airbus FCS deliberately uses different hardware and software in primary and secondary channels precisely so that a common-mode fault cannot defeat all five computers at once."}]}, "glossary": {"reliability": "The probability of failure-free system operation over a specified time in a given environment for a given purpose. A probability &mdash; so it must be measured.", "availability": "The probability that a system, at a point in time, will be operational and able to deliver the requested services. Takes repair and restart time into account.", "POFOD": "Probability Of Failure On Demand. The probability that the system will fail when a service request is made. Used for protection systems and safety-critical systems with intermittent demands.", "ROCOF": "Rate Of Occurrence Of Failures. Reflects the rate of failure in the system, e.g. 0.002 means 2 failures per 1000 operational time units. Used for systems processing many similar requests.", "MTTF": "Mean Time To Failure. The reciprocal of ROCOF. Used for systems with long transactions where the system must operate correctly for an extended period.", "fault": "A characteristic of a software system that can lead to a system error. A defect sitting in the system, doing nothing yet.", "error": "An erroneous system state that can lead to system behavior unexpected by users. The system in a wrong internal state, because a fault was reached.", "failure": "An event that occurs when the system does not deliver a service as expected by its users. The service visibly not doing what was promised.", "fault tolerance": "The ability of a system to continue in operation in spite of software failure. Achieved through redundancy, diversity and run-time error detection and recovery.", "redundancy": "A second copy of a component, kept available so the service survives losing the first. The basis of all fault-tolerant architectures.", "diversity": "Making the second copy differ from the first &mdash; different design, team or technology &mdash; so the two fail on different inputs rather than together.", "N-version programming": "Multiple independently-designed versions of a software system carry out computations at the same time; a voting system takes the majority result as correct.", "triple-modular redundancy": "Three replicated identical components receive the same input and their outputs are compared. If one output differs, it is ignored and component failure is assumed.", "operational profile": "A set of test data whose frequency matches the actual frequency of inputs from normal usage of the system. Required for statistical testing of reliability.", "statistical testing": "Testing software for reliability rather than fault detection, by running it with data that matches the operational profile and measuring the number of failures.", "common-mode": "One shared element whose failure defeats every redundant copy at once. Redundancy without independence is one system wearing two coats.", "perceived reliability": "What users actually feel about the system&rsquo;s reliability, which may differ from the formal specification because users adapt their behaviour to avoid failing features.", "functional reliability requirement": "A requirement for system functionality &mdash; checking, recovery, redundancy, process &mdash; that helps the system meet its non-functional reliability targets."}, "levels": {"g": "level", "tiers": [{"k": "L1", "needs": []}, {"k": "L2", "needs": ["f:dc_claim"]}, {"k": "L3", "needs": ["f:dc_claim", "f:dc_evidence", "f:dc_counter", "f:dc_uncert"]}, {"k": "L4", "needs": ["f:dc_claim", "f:dc_evidence", "f:dc_counter", "f:dc_uncert", "f:dc_verdict", "p:mutation", "f:mutation_defend"]}]}, "fieldNames": {"f:p_derive": "the DERIVE box", "f:p_constraint": "CONSTRAINT", "p:predict": "the prediction", "f:dc_claim": "CLAIM", "f:dc_evidence": "EVIDENCE", "f:dc_warrant": "WARRANT", "f:dc_counter": "COUNTER-EVIDENCE", "f:dc_uncert": "UNCERTAINTY", "f:dc_verdict": "VERDICT", "p:mutation": "the Rule 17 mutation", "f:mutation_defend": "the Rule 17 defence", "f:vocab_own": "the vocabulary box", t evaluation set, drift monitoring, human path back", "impl": "Frozen reliability eval set, drift threshold, written fallback when reliability drops below target", "tools": ["a model card", "eval-set runner", "drift monitoring"], "evidence": "Dated reliability report: model version, held-out set, measured POFOD/ROCOF, send-back threshold"}, {"c": "sand", "req": "Reliability measurement", "mech": "Statistical testing using an operational profile", "impl": "A test data set whose frequency matches real usage, run for long enough to produce statistically significant failures", "tools": ["operational profile generator", "reliability growth model"], "evidence": "A dated measurement report: profile used, observation period, number of failures, computed metric value"}], "note": "Tools are categories, not brands &mdash; substitute your own. The last column is the one that cannot substitute: no artifact, no claim."}, "coverage": {"source": "Supplied Sommerville Chapter 11 slides", "span": [1, 81], "sections": [{"k": "1", "t": "Faults, failures and management", "pp": [3, 8], "concept": "Faults, failures and management"}, {"k": "2", "t": "Reliability, availability and perception", "pp": [9, 16], "concept": "Reliability, availability and perception"}, {"k": "3", "t": "Metrics and quantitative requirements", "pp": [17, 30], "concept": "Metrics and quantitative requirements"}, {"k": "4", "t": "Functional reliability requirements", "pp": [31, 32], "concept": "Functional reliability requirements"}, {"k": "5", "t": "Fault-tolerant architectures and diversity", "pp": [33, 52], "concept": "Fault-tolerant architectures and diversity"}, {"k": "6", "t": "Dependable programming", "pp": [53, 69], "concept": "Dependable programming"}, {"k": "7", "t": "Measurement and operational profiles", "pp": [70, 81], "concept": "Measurement and operational profiles"}]}, "domains": ["KNOWLEDGE", "SKILL", "VALUE"], "readiness": [{"clo": "LO1", "plo": "Practice", "d": "KNOWLEDGE", "txt": "Distinguish avail "core"}, {"k": "START", "title": "Your route through this chapter", "phase": "LEARN", "route": "core", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Today’s artifact:</b> A measurable reliability requirement.</p><p><b>Fictional teaching case:</b> A hospital insulin pump software update went live at 03:00, on a holiday weekend.</p><p>The updated pump delivered intermittent incorrect doses to two ICU patients between 03:00 and 03:47. The charge nurse reverted to manual monitoring at 03:52. Do you continue, revert, or hold the deployment and ask for measured reliability evidence?</p></div><h2 style=\"font:700 25px/1.4 system-ui\">Five chapter learning objectives</h2><ol class=\"lp-outcomes\"><li>Select POFOD, ROCOF/MTTF or availability and name the unit.</li><li>Distinguish functional and non-functional requirements.</li><li>Compare protection, self-monitoring and voting architectures.</li><li>Apply dependable programming to a concrete fault.</li><li>Explain operational profiles and statistical uncertainty.</li></ol><p style=\"font:17px/1.6 system-ui\"><b>Pacing suggestion:</b> two teaching blocks of about 60–75 minutes, plus the named required reading and a five-question preparation check (initial planning estimate: 15–25 minutes total; report your actual time). These are planning estimates, not an official timetable. Pause after Check 2 if teaching in two blocks. If time runs out, finish the remaining source topics in the next block; they stay required.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"C01\">See the source-to-lesson map</button></div><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"READING\">Required self-study: exact pages and task</button><button class=\"lp-btn\" data-jump=\"PREP\">Five-objective preparation check</button></div><p class=\"lp-study-note\">Complete this preparation before starting the chapter assignment and before the next chapter discussion. Blackboard supplies the calendar date. The five objectives, classroom concepts and named self-study are in chapter assessment scope; the optional toolkit is enrichment unless explicitly assigned. Do not repeat a completed submission under this new edition unless instructed.</p>"}], "noAnswer": true, "appendix": false}, {"k": "X01", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish fault, error and failure with the chapter&rsquo;s own definitions, and apply each one to tonight&rsquo;s pump.", "title": "Reliability and fault management", "sub": "Now compare your prediction with what the source actually says.", "blocks": [{"t": "figure", "native": "props", "mk": "p4", "cap": "Five dependability properties; not a figure from this chapter", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "kind": "probability", "lab": "THE FOUR METRICS", "lead": "Numbers from operation. <b>Probabilities</b> &mdash; so each must be <b>measured</b>.", "txt": "<b>Reliability</b> &mdash; probability of failure-free operation over a specified time in a given environment.<br><b>Availability</b> &mdash; probability the system is up and able to deliver useful services at a point in time.<br><b>POFOD</b> &mdash; probability the system will fail when a service is demanded.<br><b>ROCOF</b> &mdash; rate of occurrence of failure per unit time; its reciprocal is MTTF.", "src": "P1 · p.10 &middot; p.20-22 · all four metrics"}, {"c": "sand", "kind": "judgment", "lab": "THE THREE LESSONS", "lead": "Claims that anchor the metrics. A <b>judgment</b> &mdash; so it must be <b>argued</b>.", "txt": "<b>Reliability needs a specification</b> &mdash; but the spec is often incomplete, so <i>perceived</i> reliability outranks formal reliability. <b>Removing X% of faults does not improve reliability by X%</b> &mdash; defects in rarely executed code may never be encountered. <b>Availability is not just a percentage</b> &mdash; number of users affected and outage length both shape perception.", "src": "P1 · p.11-16 · all three judgments"}]}], "srcName": "Chapter 10 recap · course redraw"}, {"t": "conceptflow", "items": [["PROBABILITY", "Reliability + availability + POFOD + ROCOF → measure"], ["JUDGMENT", "Perception + specification + usage pattern → argue"]]}, {"t": "principle", "txt": "Four metrics are probabilities and demand measurement. Three judgments about perception demand an argument against an agreed threshold."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Reliability and fault management. The highest-value thirty seconds of the Understand phase. Probability language obliges you to measure; judgment language obliges you to argue to a threshold someone else accepts. Students who miss it write assignments full of unmeasured percentages.", "appendix": false, "_iscarbRule": "X01 - Faults, errors and failures", "route": "core", "showIf": null, "sourceRange": "3–8", "answer": "Reliability — probability of failure-free operation over a specified time in a given environment. Availability — probability the system is up and able to deliver useful services at a point in time. POFOD — probability the system will fail when a service is demanded. ROCOF — rate of occurrence of failure per unit time; its reciprocal is MTTF. Reliability needs a specification — but the spec is often incomplete, so perceived reliability outranks formal reliability. Removing X% of faults does not improve reliability by X% — defects in rarely executed code may never be encountered. Availability is not just a percentage — number of users affected and outage length both shape perception. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Classify a fault-management move as avoidance, detecti
