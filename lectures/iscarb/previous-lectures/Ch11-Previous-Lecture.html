iability is really required. Other mechanisms can be used to provide reliable system service.</div></details><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · ATM reliability specification</summary><div class=\"lp-source-text\">ATM reliability specification\nKey concerns\nTo ensure that their ATMs carry out customer services as requested and that they properly record customer transactions in the account database.\nTo ensure that these ATM systems are available for use when required.\nDatabase transaction mechanisms may be used to correct transaction problems so a low-level of ATM reliability is all that is required\nAvailability, in this case, is more important than reliability\n</div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · ATM availability specification</summary><div class=\"lp-source-text\">ATM availability specification\nSystem services\nThe customer account database service;\nThe individual services provided by an ATM such as ‘withdraw cash’, ‘provide account information’, etc. \nThe database service is critical as failure of this service means that all of the ATMs in the network are out of action. \nYou should specify this to have a high level of availability.\nDatabase availability should be around 0.9999, between 7 am and 11pm. \nThis corresponds to a downtime of less than 1 minute per week.</div></details><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · ATM availability specification</summary><div class=\"lp-source-text\">ATM availability specification\nFor an individual ATM, the key reliability issues depends on mechanical reliability and the fact that it can run out of cash. \nA lower level of software availability for the ATM software is acceptable. \nThe overall availability of the ATM software might therefore be specified as 0.999, which means that a machine might be unavailable for between 1 and 2 minutes each day. </div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · Insulin pump reliability specification</summary><div class=\"lp-source-text\">Insulin pump reliability specification\nProbability of failure (POFOD) is the most appropriate metric.\nTransient failures that can be repaired by user actions such as recalibration of the machine. A relatively low value of POFOD is acceptable (say 0.002) – one failure may occur in every 500 demands.\nPermanent failures require the software to be re-installed by the manufacturer. This should occur no more than once per year. POFOD for this situation should be less than 0.00002.</div></details>"}], "noAnswer": true, "sourceRange": "17–30", "appendix": true}, {"k": "SRC04", "title": "Functional reliability requirements", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 31–32. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · Functional reliability requirements</summary><div class=\"lp-source-text\">Functional reliability requirements\nChecking requirements that identify checks to ensure that incorrect data is detected before it leads to a failure.\nRecovery requirements that are geared to help the system recover after a failure has occurred.\nRedundancy requirements that specify redundant features of the system to be included.\nProcess requirements for reliability which specify the development process to be used may also be included.</div></details><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · Examples of functional reliability requirements</summary><div class=\"lp-source-text\">Examples of functional reliability requirements\n RR1:\tA pre-defined range for all operator inputs shall be defined and the system shall check that all operator inputs fall within this pre-defined range. (Checking)\nRR2:\tCopies of the patient database shall be maintained on two separate servers that are not housed in the same building. (Recovery, redundancy)\nRR3:\tN-version programming shall be used to implement the braking control system. (Redundancy)\nRR4:\tThe system must be implemented in a safe subset of Ada and checked using static analysis. (Process)\n</div></details>"}], "noAnswer": true, "sourceRange": "31–32", "appendix": true}, {"k": "SRC05", "title": "Fault-tolerant architectures and diversity", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 33–52. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · Fault-tolerant architectures</summary><div class=\"lp-source-text\">Fault-tolerant architectures\n</div></details><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · Fault tolerance</summary><div class=\"lp-source-text\">Fault tolerance\nIn critical situations, software systems must be \nfault tolerant. \nFault tolerance is required where there are high availability requirements or where system failure costs are very high.\nFault tolerance means that the system can continue in operation in spite of software failure.\nEven if the system has been proved to conform to its specification, it must also be fault tolerant as  there may be specification errors or the validation may be incorrect.</div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · Fault-tolerant system architectures</summary><div class=\"lp-source-text\">Fault-tolerant system architectures\nFault-tolerant systems architectures are used in situations where fault tolerance is essential. These architectures are generally all based on redundancy and diversity.\nExamples of situations where dependable architectures are used:\nFlight control systems, where system failure could threaten the safety of passengers\nReactor systems where failure of a control system could lead to a chemical or nuclear emergency\nTelecommunication systems, where there is a need for 24/7 availability.</div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · Protection systems</summary><div class=\"lp-source-text\">Protection systems\nA specialized system that is associated with some other control system, which can take emergency action if a failure occurs.\nSystem to stop a train if it passes a red light\nSystem to shut down a reactor if temperature/pressure are too high\nProtection systems independently monitor the controlled system and the environment.\nIf a problem is detected, it issues commands to take emergency action to shut down the system and avoid a catastrophe.</div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · Protection system architecture\u000b</summary><div class=\"lp-source-text\">Protection system architecture\n</div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Protection system functionality</summary><div class=\"lp-source-text\">Protection system functionality\nProtection systems are redundant because they include monitoring and control capabilities that replicate those in the control software.\nProtection systems should be diverse and use different technology from the control software.\nThey are simpler than the control system so more effort can be expended in validation and dependability assurance.\nAim is to ensure that there is a low probability of failure on demand for the protection system.</div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · Self-monitoring architectures</summary><div class=\"lp-source-text\">Self-monitoring architectures\nMulti-channel architectures where the system monitors its own operations and takes action if inconsistencies are detected.\nThe same computation is carried out on each channel and the results are compared. If the results are identical and are produced at the same time, then it is assumed that the system is operating correctly.\nIf the results are different, then a failure is assumed and a failure exception is raised.</div></details><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · Self-monitoring architecture </summary><div class=\"lp-source-text\">Self-monitoring architecture </div></details><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · Self-monitoring systems</summary><div class=\"lp-source-text\">Self-monitoring systems\nHardware in each channel has to be diverse so that common mode hardware failure will not lead to each channel producing the same results.\nSoftware in each channel must also be diverse, otherwise the same software error would affect each channel.\nIf high-availability is required, you may use several self-checking systems in parallel.\nThis is the approach used in the Airbus family of aircraft for their flight control systems.</div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Airbus flight control system architecture </summary><div class=\"lp-source-text\">Airbus flight control system architecture </div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · Airbus architecture discussion</summary><div class=\"lp-source-text\">Airbus architecture discussion\nThe Airbus FCS has 5 separate computers, any one of which can run the control software.\nExtensive use has been made of diversity\nPrimary systems use a different processor from the secondary systems.\nPrimary and secondary systems use chipsets from different manufacturers.\nSoftware in secondary systems is less complex than in primary system – provides only critical functionality.\nSoftware in each channel is developed in different programming languages by different teams.\nDifferent programming languages used in primary and secondary systems.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · N-version programming</summary><div class=\"lp-source-text\">N-version programming\nMultiple versions of a software system carry out computations at the same time. There should be an odd number of computers involved, typically 3.\nThe results are compared using a voting system and the majority result is taken to be the correct result.\nApproach derived from the notion of triple-modular redundancy, as used in hardware systems.</div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · Hardware fault tolerance</summary><div class=\"lp-source-text\">Hardware fault tolerance\nDepends on triple-modular redundancy (TMR).\nThere are three replicated identical components that receive the same input and whose outputs are compared.\nIf one output is different, it is ignored and component failure is assumed.\nBased on most faults resulting from  component failures rather than design faults and a low probability of simultaneous component failure.</div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · Triple modular redundancy </summary><div class=\"lp-source-text\">Triple modular redundancy </div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · N-version programming </summary><div class=\"lp-source-text\">N-version programming </div></details><details class=\"lp-source-section\" id=\"source-slide-48\"><summary>Slide 48 · N-version programming</summary><div class=\"lp-source-text\">N-version programming\nThe different system versions are designed and implemented by different teams. It is assumed that there is a low probability that they will make the same mistakes. The algorithms used should but may not be different.\nThere is some empirical evidence that teams commonly misinterpret specifications in the same way and chose the same algorithms in their systems.</div></details><details class=\"lp-source-section\" id=\"source-slide-49\"><summary>Slide 49 · Software diversity</summary><div class=\"lp-source-text\">Software diversity\nApproaches to software fault tolerance depend on software diversity where it is assumed that different implementations of the same software specification will fail in different ways.\nIt is assumed that implementations are (a) independent and (b) do not include common errors.\nStrategies to achieve diversity\nDifferent programming languages\nDifferent design methods and tools\nExplicit specification of different algorithms\n</div></details><details class=\"lp-source-section\" id=\"source-slide-50\"><summary>Slide 50 · Problems with design diversity</summary><div class=\"lp-source-text\">Problems with design diversity\nTeams are not culturally diverse so they tend to tackle problems in the same way.\nCharacteristic errors\nDifferent teams make the same mistakes.  Some parts of an implementation are more difficult than others so all teams tend to make mistakes in the same place;\nSpecification errors;\nIf there is an error in the specification then this is reflected in all implementations;\nThis can be addressed to some extent by using multiple specification representations.</div></details><details class=\"lp-source-section\" id=\"source-slide-51\"><summary>Slide 51 · Specification dependency</summary><div class=\"lp-source-text\">Specification dependency\nBoth approaches to software redundancy are susceptible to specification errors. If the specification is incorrect, the system could fail\nThis is also a problem with hardware but software specifications are usually more complex than hardware specifications and harder to validate.\nThis has been addressed in some cases by developing separate software specifications from the same user specification.</div></details><details class=\"lp-source-section\" id=\"source-slide-52\"><summary>Slide 52 · Improvements in practice</summary><div class=\"lp-source-text\">Improvements in practice\nIn principle, if diversity and independence can be achieved, multi-version programming leads to very significant improvements in reliability and availability.\nIn practice, observed improvements are much less significant but the approach seems leads to reliability improvements of between 5 and 9 times.\nThe key question is whether or not such improvements are worth the considerable extra development costs for multi-version programming.</div></details>"}], "noAnswer": true, "sourceRange": "33–52", "appendix": true}, {"k": "SRC06", "title": "Dependable programming", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 53–69. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-53\"><summary>Slide 53 · Programming for reliability</summary><div class=\"lp-source-text\">Programming for reliability</div></details><details class=\"lp-source-section\" id=\"source-slide-54\"><summary>Slide 54 · Dependable programming</summary><div class=\"lp-source-text\">Dependable programming\nGood programming practices can be adopted that help reduce the incidence of program faults.\nThese programming practices support\nFault avoidance\nFault detection\nFault tolerance</div></details><details class=\"lp-source-section\" id=\"source-slide-55\"><summary>Slide 55 · Good practice guidelines for dependable programming </summary><div class=\"lp-source-text\">Good practice guidelines for dependable programming </div><div class=\"lp-tablewrap\"><table><tr><td>Dependable programming guidelines<br><br>1.\tLimit the visibility of information in a program<br>2.\tCheck all inputs for validity<br>3.\tProvide a handler for all exceptions<br>4.\tMinimize the use of error-prone constructs<br>5.\tProvide restart capabilities<br>6.\tCheck array bounds<br>7.\tInclude timeouts when calling external components<br>8.\tName all constants that represent real-world values<br></td><td></td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-56\"><summary>Slide 56 · (1) Limit the visibility of information in a program</summary><div class=\"lp-source-text\">(1) Limit the visibility of information in a program\nProgram components should only be allowed access to data that they need for their implementation.\nThis means that accidental corruption of parts of the program state by these components is impossible.\nYou can control visibility by using abstract data types where the data representation is private and you only allow access to the data through predefined operations such as get () and put ().</div></details><details class=\"lp-source-section\" id=\"source-slide-57\"><summary>Slide 57 · (2) Check all inputs for validity</summary><div class=\"lp-source-text\">(2) Check all inputs for validity\nAll program take inputs from their environment and make assumptions about these inputs.\nHowever, program specifications rarely define what to do if an input is not consistent with these assumptions.\nConsequently, many programs behave unpredictably when presented with unusual inputs and, sometimes, these are threats to the security of the system.\nConsequently, you should always check inputs before processing against the assumptions made about these inputs.</div></details><details class=\"lp-source-section\" id=\"source-slide-58\"><summary>Slide 58 · Validity checks</summary><div class=\"lp-source-text\">Validity checks\nRange checks\nCheck that the input falls within a known range.\nSize checks\nCheck that the input does not exceed some maximum size e.g. 40 characters for a name.\nRepresentation checks\nCheck that the input does not include characters that should not be part of its representation e.g. names do not include numerals.\nReasonableness checks\nUse information about the input to check if it is reasonable rather than an extreme value.</div></details><details class=\"lp-source-section\" id=\"source-slide-59\"><summary>Slide 59 · (3) Provide a handler for all exceptions</summary><div class=\"lp-source-text\">(3) Provide a handler for all exceptions\nA program exception is an error or some \nunexpected event such as a power failure.\nException handling constructs allow for such \nevents to be handled without the need for \ncontinual status checking to detect exceptions.\nUsing normal control constructs to detect \nexceptions needs many additional statements to be \nadded to the program. This adds a significant \noverhead and is potentially error-prone.</div></details><details class=\"lp-source-section\" id=\"source-slide-60\"><summary>Slide 60 · Exception handling </summary><div class=\"lp-source-text\">Exception handling </div></details><details class=\"lp-source-section\" id=\"source-slide-61\"><summary>Slide 61 · Exception handling</summary><div class=\"lp-source-text\">Exception handling\nThree possible exception handling strategies\nSignal to a calling component that an exception has occurred and provide information about the type of exception.\nCarry out some alternative processing to the processing where the exception occurred. This is only possible where the exception handler has enough information to recover from the problem that has arisen.\nPass control to a run-time support system to handle the exception.\nException handling is a mechanism to provide some fault tolerance</div></details><details class=\"lp-source-section\" id=\"source-slide-62\"><summary>Slide 62 · (4) Minimize the use of error-prone constructs</summary><div class=\"lp-source-text\">(4) Minimize the use of error-prone constructs\nProgram faults are usually a consequence of human error because programmers lose track of the relationships between the different parts of the system\nThis is exacerbated by error-prone constructs in programming languages that are inherently complex or that don’t check for mistakes when they could do so.\nTherefore, when programming, you should try to avoid or at least minimize the use of these error-prone constructs.</div></details><details class=\"lp-source-section\" id=\"source-slide-63\"><summary>Slide 63 · Error-prone constructs</summary><div class=\"lp-source-text\">Error-prone constructs\nUnconditional branch (goto) statements\nFloating-point numbers\nInherently imprecise. The imprecision may lead to invalid \ncomparisons.\nPointers\nPointers referring to the wrong memory areas can corrupt \ndata. Aliasing can make programs difficult to understand \nand change.\nDynamic memory allocation\nRun-time allocation can cause memory overflow.</div></details><details class=\"lp-source-section\" id=\"source-slide-64\"><summary>Slide 64 · Error-prone constructs</summary><div class=\"lp-source-text\">Error-prone constructs\nParallelism\nCan result in subtle timing errors because of unforeseen \ninteraction between parallel processes.\nRecursion\nErrors in recursion can cause memory overflow as the program stack fills up.\nInterrupts\nInterrupts can cause a critical operation to be terminated \nand make a program difficult to understand.  \nInheritance\nCode is not localised. This can result in unexpected behaviour when changes are made and problems of understanding the code.</div></details><details class=\"lp-source-section\" id=\"source-slide-65\"><summary>Slide 65 · Error-prone constructs</summary><div class=\"lp-source-text\">Error-prone constructs\nAliasing\nUsing more than 1 name to refer to the same state variable.\nUnbounded arrays\nBuffer overflow failures can occur if no bound checking on arrays.\nDefault input processing\nAn input action that occurs irrespective of the input.\nThis can cause problems if the default action is to transfer control elsewhere in the program. In incorrect or deliberately malicious input can then trigger a program failure.</div></details><details class=\"lp-source-section\" id=\"source-slide-66\"><summary>Slide 66 · (5) Provide restart capabilities</summary><div class=\"lp-source-text\">(5) Provide restart capabilities\nFor systems that involve long transactions or user interactions, you should always provide a restart capability that allows the system to restart after failure without users having to redo everything that they have done.\nRestart depends on the type of system\nKeep copies of forms so that users don’t have to fill them in again if there is a problem\nSave state periodically and restart from the saved state</div></details><details class=\"lp-source-section\" id=\"source-slide-67\"><summary>Slide 67 · (6) Check array bounds</summary><div class=\"lp-source-text\">(6) Check array bounds\nIn some programming languages, such as C, it is possible to address a memory location outside of the range allowed for in an array declaration.\nThis leads to the well-known ‘bounded buffer’ vulnerability where attackers write executable code into memory by deliberately writing beyond the top element in an array.\nIf your language does not include bound checking, you should therefore always check that an array access is within the bounds of the array.</div></details><details class=\"lp-source-section\" id=\"source-slide-68\"><summary>Slide 68 · (7) Include timeouts when calling external components</summary><div class=\"lp-source-text\">(7) Include timeouts when calling external components\nIn a distributed system, failure of a remote computer can be ‘silent’ so that programs expecting a service from that computer may never receive that service or any indication that there has been a failure.\nTo avoid this, you should always include timeouts on all calls to external components. \nAfter a defined time period has elapsed without a response, your system should then assume failure and take whatever actions are required to recover from this.</div></details><details class=\"lp-source-section\" id=\"source-slide-69\"><summary>Slide 69 · (8) Name all constants that represent real-world values</summary><div class=\"lp-source-text\">(8) Name all constants that represent real-world values\nAlways give constants that reflect real-world values (such as tax rates) names rather than using their numeric values and always refer to them by name\nYou are less likely to make mistakes and type the wrong value when you are using a name rather than a value.\nThis means that when these ‘constants’ change (for sure, they are not really constant), then you only have to make the change in one place in your program.</div></details>"}], "noAnswer": true, "sourceRange": "53–69", "appendix": true}, {"k": "SRC07", "title": "Measurement and operational profiles", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 70–81. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-70\"><summary>Slide 70 · Reliability measurement</summary><div class=\"lp-source-text\">Reliability measurement</div></details><details class=\"lp-source-section\" id=\"source-slide-71\"><summary>Slide 71 · Reliability measurement</summary><div class=\"lp-source-text\">Reliability measurement\nTo assess the reliability of a system, you have to collect data about its operation. The data required may include:\nThe number of system failures given a number of requests for system services. This is used to measure the POFOD. This applies irrespective of the time over which the demands are made.\nThe time or the number of transactions between system failures plus the total elapsed time or total number of transactions. This is used to measure ROCOF and MTTF.\nThe repair or restart time after a system failure that leads to loss of service. This is used in the measurement of availability. Availability does not just depend on the time between failures but also on the time required to get the system back into operation.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-72\"><summary>Slide 72 · Reliability testing</summary><div class=\"lp-source-text\">Reliability testing\nReliability testing (Statistical testing) involves running the program to assess whether or not it has reached the required level of reliability.\nThis cannot normally be included as part of a normal defect testing process because data for defect testing is (usually) atypical of actual usage data.\nReliability measurement therefore requires a specially designed data set that replicates the pattern of inputs to be processed by the system.</div></details><details class=\"lp-source-section\" id=\"source-slide-73\"><summary>Slide 73 · Statistical testing</summary><div class=\"lp-source-text\">Statistical testing\nTesting software for reliability rather than fault detection.\nMeasuring the number of errors allows the reliability of the software to be predicted. Note that, for statistical reasons, more errors than are allowed for in the reliability specification must be induced.\nAn acceptable level of reliability should be \nspecified and the software tested and amended until that level of reliability is reached.</div></details><details class=\"lp-source-section\" id=\"source-slide-74\"><summary>Slide 74 · Reliability measurement </summary><div class=\"lp-source-text\">Reliability measurement </div></details><details class=\"lp-source-section\" id=\"source-slide-75\"><summary>Slide 75 · Reliability measurement problems</summary><div class=\"lp-source-text\">Reliability measurement problems\nOperational profile uncertainty\nThe operational profile may not be an accurate reflection of the real use of the system.\nHigh costs of test data generation\nCosts can be very high if the test data for the system cannot be generated automatically.\nStatistical uncertainty\nYou need a statistically significant number of failures to compute the reliability but highly reliable systems will rarely fail.\nRecognizing failure\nIt is not always obvious when a failure has occurred as there may be conflicting interpretations of a specification.</div></details><details class=\"lp-source-section\" id=\"source-slide-76\"><summary>Slide 76 · Operational profiles</summary><div class=\"lp-source-text\">Operational profiles\nAn operational profile is a set of test data whose frequency matches the actual frequency of these inputs from ‘normal’ usage of the system. A close match with actual usage is necessary otherwise the measured reliability will not be reflected in the actual usage of the system.\nIt can be generated from real data collected from an existing system or (more often) depends on assumptions made about the pattern of usage of a system.</div></details><details class=\"lp-source-section\" id=\"source-slide-77\"><summary>Slide 77 · An operational profile </summary><div class=\"lp-source-text\">An operational profile </div></details><details class=\"lp-source-section\" id=\"source-slide-78\"><summary>Slide 78 · Operational profile generation</summary><div class=\"lp-source-text\">Operational profile generation\nShould be generated automatically whenever possible.\nAutomatic profile generation is difficult for interactive systems.\nMay be straightforward for ‘normal’ inputs but it is difficult to predict ‘unlikely’ inputs and to create test data for them.\nPattern of usage of new systems is unknown.\nOperational profiles are not static but change as users learn about a new system and change the way that they use it.</div></details><details class=\"lp-source-section\" id=\"source-slide-79\"><summary>Slide 79 · Key points</summary><div class=\"lp-source-text\">Key points\n Software reliability can be achieved by avoiding the introduction of faults, by detecting and removing faults before system deployment and by including fault tolerance facilities that allow the system to remain operational after a fault has caused a system failure.\nReliability requirements can be defined quantitatively in the system requirements specification. \nReliability metrics include probability of failure on demand (POFOD), rate of occurrence of failure (ROCOF) and availability (AVAIL). \n</div></details><details class=\"lp-source-section\" id=\"source-slide-80\"><summary>Slide 80 · Key points</summary><div class=\"lp-source-text\">Key points\nFunctional reliability requirements are requirements for system functionality, such as checking and redundancy requirements, which help the system meet its non-functional reliability requirements.\nDependable system architectures are system architectures that are designed for fault tolerance. \nThere are a number of architectural styles that support fault tolerance including protection systems, self-monitoring architectures and N-version programming.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-81\"><summary>Slide 81 · Key points</summary><div class=\"lp-source-text\">Key points\nSoftware diversity is difficult to achieve because it is practically impossible to ensure that each version of the software is truly independent.\nDependable programming relies on including redundancy in a program as checks on the validity of inputs and the values of program variables.\nStatistical testing is used to estimate software reliability. It relies on testing the system with test data that matches an operational profile, which reflects the distribution of inputs to the software when it is in use.\n</div></details>"}], "noAnswer": true, "sourceRange": "70–81", "appendix": true}, {"k": "R01", "answer": "One defensible request is a measured POFOD for the dose-calculation module under peak ICU demand, computed from a fault-injection test on the previous version. It distinguishes a real reliability regression from a single operator-reported incident. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming automatic operation.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence a reliability decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "A hospital insulin pump software update went live at 03:00, on a holiday weekend.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Continue, revert, or hold the pump and ask for reliability evidence?", "txt": "The updated pump delivered intermittent incorrect doses to two ICU patients between 03:00 and 03:47. The charge nurse reverted to manual monitoring at 03:52. Do you continue, revert, or hold the deployment and ask for measured reliability evidence?"}, {"c": "mag", "lab": "UNKNOWN", "lead": "The release file says reliable <i>under normal operation</i>. Tonight is not normal operation.", "txt": "The release was signed off on a 24-hour soak test in a lab. ICU demand at 03:00 on a holiday weekend is not lab demand &mdash; and two incorrect doses in 47 minutes is the data the lab never produced."}]}, {"t": "principle", "txt": "Reliability matters because failures can cause economic loss, information loss, physical harm and loss of user trust. The goal tonight is not certainty &mdash; it is a defensible boundary with a named metric behind it.", "src": "P1 · p.4"}], "timebox": "90 sec", "task": "Name the one piece of reliability evidence you would demand before letting the pump run another hour on automatic.", "say": "You are the responsible engineer on call. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching and is not a report of a real incident. Every rule tonight returns to this pump. The classic mistake in a case lecture is explaining the metrics before the students feel the pressure of the decision.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers &mdash; and what you must prove", "sub": "Seven sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "FAULT TERMINOLOGY", "txt": "Where does failure start?", "src": "P1 · p.3"}, {"c": "sand", "lab": "AVAILABILITY / RELIABILITY", "txt": "What do users actually feel?", "src": "P1 · p.7"}, {"c": "teal", "lab": "RELIABILITY REQUIREMENTS", "txt": "Which metric, for which service?", "src": "P1 · p.17"}, {"c": "sand", "lab": "FUNCTIONAL REQUIREMENTS", "txt": "What do we build to enforce it?", "src": "P1 · p.27"}, {"c": "teal", "lab": "FAULT-TOLERANT ARCHITECTURES", "txt": "How do we survive faults?", "src": "P1 · p.33"}, {"c": "sand", "lab": "PROGRAMMING FOR RELIABILITY", "txt": "What code reduces faults?", "src": "P1 · p.46"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish availability, reliability, POFOD, ROCOF and MTTF as quantitative metrics."}, {"c": "teal", "lab": "2", "txt": "Trace a fault through the fault-error-failure chain to the user-visible failure."}, {"c": "teal", "lab": "3", "txt": "Specify and justify non-functional reliability requirements using the appropriate metric."}, {"c": "mag", "lab": "4", "txt": "Build a bounded verdict with inspectable, owned reliability evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the metric, environment or demand pattern changes."}]}], "timebox": "90 sec", "task": "Note which of the six sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total, no more. This slide exists so nobody leaves tonight unsure what was in the chapter and what was not. Both the condensed and the full versions (R02, R03) remain in ISCARB Depth for anyone who wants the two-slide version back.", "appendix": true, "route": "toolkit"}, {"k": "R10", "loadOk": "The 3x3 matrix and two fields describe one reliability-risk triage record. Students classify three risks and specify one monitor and one identification tool. Shorten the activity at this cut point; never squeeze the content into a fixed height.", "answer": "Place, for example, an unmeasured POFOD under peak ICU demand, a single dose-calculation channel with no diversity, and a holiday-weekend staffing gap in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity (POFOD under peak demand), observation window (next 30 days of ICU operation), trigger value (POFOD above 0.001), named owner (on-call bioengineer) and fallback action (revert to manual monitoring). A fault-injection test against the operational profile can identify the dose-module vulnerability; retain its results as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it on a reliability matrix.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure about the pump&rsquo;s POFOD&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact you can hand to a reviewer &mdash; e.g. the previous version&rsquo;s measured POFOD over 12 months."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Not everything unknown matters &mdash; only what could change the verdict. Tonight&rsquo;s gap: POFOD of the new version under peak ICU demand."}, {"c": "violet", "lab": "MONITORED", "txt": "An unknown with a measured quantity, observation window, trigger value, named owner and fallback action. The unknown becomes a risk on a schedule."}]}]}, {"t": "wide", "c": "sand", "lab": "PLACE TONIGHT&rsquo;S RISKS ON THE MATRIX", "picker": {"g": "risk3", "options": ["POFOD unmeasured", "No diversity in dose module", "Holiday staffing gap", "Lab soak test only"]}, "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a reliability risk with a fault-injection test or an operational profile, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; Jahiziah GKU 3, outcome 2", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "One tool or method you would use to identify a reliability risk in this pump &mdash; and which framework step it belongs to"}}, {"t": "principle", "txt": "Approval = evidence state + uncertainty statement + monitoring plan."}], "timebox": "3 min", "task": "Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "This unit now carries the one Jahiziah outcome the department mapped to this course and found uncovered: applying a risk management framework and naming a tool that identifies a reliability risk. Make every student write something in that field &mdash; an empty box here is the gap staying open. Do not accept a monitored risk without a trigger value and a named owner &mdash; a monitor with no trigger is a decision to look away slowly. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the engineer who claims, the engineer who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "Reliability claims fail not because nobody measured &mdash; but because the measurement has no owner able to defend it.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · OWNER", "lead": "The engineer who decides.", "txt": "Names the verdict and the metric. Owns the consequence. The on-call bioengineer tonight &mdash; not the developer, not the regulator, not the AI."}, {"c": "sand", "lab": "2 · EVIDENCE OWNER", "lead": "The engineer who verifies.", "txt": "Maintains the inspectable artifact: the test logs, the measured POFOD, the operational profile, the dated failover drills. Cannot be the same person as the owner."}, {"c": "mag", "lab": "3 · SIGN-OFF", "lead": "The authority who accepts the residual risk.", "txt": "The hospital&rsquo;s medical device committee or the regulator&rsquo;s reviewer. Accepts the bounded residual risk on the evidence the owner and evidence owner produced."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S GAP", "lead": "Two wrong doses in 47 minutes, no measured POFOD, no diversity, one developer signing off their own release.", "txt": "The pump update went live at 03:00 on a holiday weekend with one developer&rsquo;s signature on a 24-hour lab soak test. That is owner, evidence owner and sign-off collapsed into a single person &mdash; which is why the claim could not be audited when the failure arrived. The fix is not more testing; it is the separation above.", "field": {"id": "accountability", "core": false, "rows": 2, "ph": "For your verdict: who is the owner, who is the evidence owner, and who signs off?"}}, {"t": "principle", "txt": "Owner &ne; evidence owner &ne; sign-off. Three roles, three people."}], "timebox": "2 min", "task": "For the verdict you signed at Rule 07: name the owner, the evidence owner, and the sign-off authority.", "notes": "Two minutes. The accountability trio is the rule most assignments miss &mdash; not because students cannot name the roles, but because the same person fills all three on their project. Make every student name three different people tonight; if they cannot, the verdict is not yet dependable.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about a system in the section of the source that answers it.", "title": "What Chapter 11 trains you to do", "sub": "Six questions the pump cannot answer tonight. Each one is a section of the chapter &mdash; and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "FAULT TERMINOLOGY", "txt": "Where does failure start?", "src": "P1 · p.3"}, {"c": "sand", "lab": "AVAILABILITY / RELIABILITY", "txt": "What do users actually feel?", "src": "P1 · p.7"}, {"c": "teal", "lab": "RELIABILITY REQUIREMENTS", "txt": "Which metric, for which service?", "src": "P1 · p.17"}, {"c": "sand", "lab": "FUNCTIONAL REQUIREMENTS", "txt": "What do we build to enforce it?", "src": "P1 · p.27"}, {"c": "teal", "lab": "FAULT-TOLERANT ARCHITECTURES", "txt": "How do we survive faults?", "src": "P1 · p.33"}, {"c": "sand", "lab": "PROGRAMMING FOR RELIABILITY", "txt": "What code reduces faults?", "src": "P1 · p.46"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Ninety seconds, two answers, no more. Most students pick fault-tolerant architectures because it sounds hardest; the chapter&rsquo;s own answer is reliability requirements. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition &mdash; and every one of these is something you will do to the pump in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish availability, reliability, POFOD, ROCOF and MTTF as quantitative metrics."}, {"c": "teal", "lab": "2", "txt": "Trace a fault through the fault-error-failure chain to the user-visible failure."}, {"c": "teal", "lab": "3", "txt": "Specify and justify non-functional reliability requirements using the appropriate metric."}, {"c": "mag", "lab": "4", "txt": "Build a bounded verdict with inspectable, owned reliability evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the metric, environment or demand pattern changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone &mdash; the artifact every other outcome feeds. Colouring all five differently made them read as five unrelated topics.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: an attractive answer is accepted without a measured reliability metric. JUDGMENT then fails because the team cannot show what supports the decision or what would reverse it.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing a failure from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Separate fault, error and failure.", "src": "Rule 05 · X01"}, {"c": "mag", "lab": "", "txt": "Accept, revise or reject the update.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Name a metric, not an intention.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the failure up the sociotechnical stack.", "src": "X02"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A patient bears what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them, so the eye pairs each card with its capability. Recolouring them breaks the pairing, which is the only reason the diagram is there.", "task": "Which capability fails first when a team trusts an attractive answer without a measured metric?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE &mdash; an attractive answer fails not because nobody analysed it but because nobody made it inspectable with a number attached. Do not give the answer; let two students argue it for thirty seconds.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: POFOD is the promise to the patient. It holds only if the dose-calculation module has been tested under peak ICU demand, AND nobody has measured POFOD under that demand pattern. The prediction is bounded by the missing measurement, not by the design.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which metric fails first tonight?", "picker": {"g": "predict", "options": ["POFOD", "ROCOF", "MTTF", "AVAIL"]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. peak ICU demand, no revert window, lab soak test only"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment gateway, not from tonight:</i> &ldquo;This holds only if the retry queue drains faster than new requests arrive. If it does not, the queue is the thing that fails, not the payment service &mdash; and nobody has measured the drain rate under holiday load.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unmeasured</b>."}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the four metric names &mdash; you have not met them yet. Start from the room. It is 03:00 on a holiday weekend and the pump has delivered two wrong doses in 47 minutes. Ask what the pump promises the patient on each demand, and which promise breaks first tonight. Then say which metric that promise belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;. If you cannot finish it, the box that is actually empty is CONSTRAINT: name what stops you choosing differently tonight.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move; splitting them across two slides would let a student predict without deriving, which is the failure this rule exists to prevent.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes; one colour makes it read as four parallel boxes rather than four steps.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Three minutes. The DERIVE box is the one students skip &mdash; walk the room and refuse an empty one. This whole rule collapses if you reveal the source figure first; the reveal is the next slide and not a second earlier.", "appendix": true, "route": "toolkit"}, {"k": "H01", "noAnswer": true, "rule": "HELPER - while DERIVE needs development", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a blank derivation into a question they can answer, by starting from the situation rather than the vocabulary.", "showIf": {"thin": ["f:p_derive"], "minKey": "coachDeep"}, "title": "Three questions instead of the answer", "sub": "This slide is here because your derivation box is still blank, or holds a single clause. It does not contain the answer &mdash; the reveal is the next slide and it is worth more to you if you commit first.", "badge": {"c": "", "t": "SCAFFOLD", "s": "appears only if you need it"}, "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 &nbsp; WHAT IS PROMISED", "lead": "Which promise to the patient breaks first tonight?", "txt": "A pump promises a patient the correct dose, on every demand, without harm. Say which of those three promises tonight&rsquo;s two wrong doses threaten first &mdash; and you have named the metric without needing its textbook name."}, {"c": "sand", "lab": "2 &nbsp; WHO IS AWAKE", "lead": "A metric that depends on someone noticing behaves differently at 03:00.", "txt": "It is 03:00 on a holiday weekend. One nurse is covering six ICU beds. Ask what that tells you about how the failure will be <i>noticed</i>, not about how it starts. A metric that depends on someone noticing behaves differently at night."}, {"c": "mag", "lab": "3 &nbsp; WHAT WOULD CHANGE YOUR MIND", "lead": "Finish the sentence &ldquo;I would drop this if I saw &hellip;&rdquo;.", "txt": "Finish this sentence: &ldquo;I would drop this prediction if I saw &hellip;&rdquo;. Whatever you put after &ldquo;if I saw&rdquo; is your constraint, and the reason it holds is your derivation. Write that sentence in the boxes on the previous slide."}]}, {"t": "principle", "c": "mag", "txt": "A blank box is not a gap in knowledge. It is usually a question asked at the wrong altitude."}], "timebox": "90 sec", "task": "Answer any one of the three out loud, then press &larr; and finish DERIVE properly. This slide stops appearing once DERIVE meets the shared scaffolding threshold; the instructor still checks the reasoning.", "notes": "You will usually not see this slide at all &mdash; it renders while DERIVE falls below the same scaffolding threshold used by the R05 coach, so it is the engine noticing that the room is stuck rather than you deciding in advance that it will be. Do not read all three questions aloud. Pick the one that matches what you saw while walking the room: question 1 for students who cannot start, question 2 for students who have written a metric name with no reasoning under it, question 3 for students who wrote a confident sentence with nothing that could falsify it. Ninety seconds, then send them back. If you are behind, skip it and walk the room instead &mdash; the questions work spoken.", "appendix": true, "route": "toolkit"}, {"k": "QA1", "noAnswer": true, "rule": "RETRIEVAL LOOP - Understand", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the phase&rsquo;s load-bearing moves from memory: the evidence request, the chapter&rsquo;s six questions, the outcome currency and the four parts of the prediction gate.", "title": "Sixty seconds on Understand", "sub": "Before the source expansion opens: four questions, memory first. Reveal only to check, then score yourself honestly.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 01 &middot; 02 &middot; 03 &middot; 05", "items": [{"q": "It is 03:00 and the pump has delivered two wrong doses. Name the one evidence request that separates a real reliability regression from a single operator-reported incident.", "a": "A measured POFOD for the dose-calculation module under peak ICU demand &mdash; computed from a fault-injection test on the previous version. Until it exists the decision stays bounded: hold or revert, with a named owner and a condition for resuming automatic operation."}, {"q": "Chapter 11 trains you to answer six questions about any reliable system. Say any four.", "a": "Where does failure start (fault terminology)? What do users actually feel (availability / reliability)? Which metric, for which service (reliability requirements)? What do we build to enforce it (functional requirements)? How do we survive faults (fault-tolerant architectures)? What code reduces faults (programming for reliability)?"}, {"q": "All five outcomes of this hour end in the same currency. What is it?", "a": "Evidence, not recognition &mdash; and outcome 4 is the one the others feed: a bounded verdict with inspectable reliability evidence."}, {"q": "The prediction gate makes you commit to four things before the reveal. Name all four.", "a": "PREDICT the metric &middot; state the CONSTRAINT &middot; DERIVE it from first principles &middot; NAME the principle used &mdash; then sign, so the reveal costs something."}]}], "timebox": "60 sec", "task": "Cover the answers. Say all four out loud from memory before you reveal anything &mdash; then score yourself honestly.", "notes": "Sixty seconds on the ring, and hold the discipline that makes retrieval work: the answer must come from memory, spoken or written, before any reveal. The four questions are the phase&rsquo;s load-bearing moves, not a quiz &mdash; a miss on question 1 means Rule 01 needs one more pass before the source expansion assumes it. The self-score is private and deliberately blunt: two honest misses beat four nodding yeses, and saying that once out loud is what makes the scoring honest.", "appendix": true, "route": "toolkit"}, {"k": "QA2", "noAnswer": true, "rule": "RETRIEVAL LOOP - Source", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the four metrics, the fault-management lifecycle, the fault-error-failure chain and the cost-curve trade-off.", "title": "Sixty seconds on the source foundations", "sub": "Checkpoint before the rest of Chapter 11: four questions from the first source cluster &mdash; memory first, reveal second.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "X01 &middot; X02 &middot; X07", "items": [{"q": "Four reliability metrics are probabilities. Which is which &mdash; and which demand pattern fits each one?", "a": "<b>Reliability</b> &mdash; failure-free operation over a stated time. <b>Availability</b> &mdash; up and able to deliver service at a point in time, with repair counted. <b>POFOD</b> &mdash; fail on demand, for intermittent services with serious consequences (insulin pump, emergency shutdown). <b>ROCOF / MTTF</b> &mdash; failure rate per unit time, for systems processing many similar requests (credit card, airline booking)."}, {"q": "What are the three fault-management moves, and where does each one sit in the lifecycle?", "a": "<b>Fault avoidance</b> &mdash; development techniques that prevent faults being introduced. <b>Fault detection</b> &mdash; V&amp;V that finds and removes residual faults before deployment. <b>Fault tolerance</b> &mdash; run-time techniques that keep the system operating when faults occur."}, {"q": "Code adds 1 to the previous dose without bounding the input. Say tonight&rsquo;s incident as the three-part sentence: fault, error, failure.", "a": "The unbounded dose increment is the <b>fault</b> &mdash; a defect doing nothing yet. The dose variable holding an out-of-range value is the <b>error</b>. The incorrect dose delivered to the patient at 03:47 is the <b>failure</b>."}, {"q": "Why does removing X% of faults not improve reliability by X%?", "a": "Defects may sit in rarely executed code that users never reach (p.16). Users adapt behaviour to avoid features that fail. A program with known faults can still be perceived as reliable &mdash; which is also why measured POFOD under real demand beats any fault count."}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop, now over the first source cluster. Question 3 is the one that pays all semester &mdash; the three-part sentence is the shape of a defensible incident report, and the notes on X07 carry the correction script if a student orders it wrong. If the room misses question 1, do not reteach it here: name it, and let the principle line on X01 do the work on the next pass. Sixty seconds, then move.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: a release causes two incorrect doses in 47 minutes. CRISIS: patients receive wrong doses. MAP: dose-calculation module, infusion hardware, ICU nurses, hospital procedure, regulator. TRADE-OFF: revert removes the new feature but delays the fix; continue risks another wrong dose. EVIDENCE: compare dose logs, fault-injection tests, and the previous version&rsquo;s POFOD. VERDICT: revert under a named owner, monitor recovery, and define the evidence needed before redeployment.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source metrics into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies metrics; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "Wrong doses during a pump update at 03:00 on a holiday weekend."}, {"c": "teal", "lab": "2 MAP", "txt": "Dose module, infusion hardware, ICU nurses, hospital procedure, regulator."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Revert loses the new feature; continue risks another wrong dose."}, {"c": "violet", "lab": "4 EVIDENCE", "txt": "Dose logs, fault-injection tests, measured POFOD on the previous version."}, {"c": "green", "lab": "5 VERDICT", "txt": "Continue, hold, revert &mdash; bounded, with a monitor."}]}, {"t": "principle", "txt": "Predict -&gt; Constraint -&gt; Derive -&gt; Name"}], "timebox": "2 min", "hueOk": "CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide and in every later reference. This is the one place the palette is a vocabulary.", "task": "Run tonight&rsquo;s case through the five steps in one sentence each.", "notes": "Two minutes. The slide exists so the room can hear the flow once before they have to live in it. The most common mistake is to stop at EVIDENCE without a VERDICT &mdash; an evidence list with no decision attached is exactly the unbounded claim Rule 04 refuses.", "appendix": true, "route": "toolkit"}, {"k": "R07", "loadOk": "The decision card has six named slots plus an evidence policy line and an inspectable artifact preview. Students fill all six from tonight's pump and cite a source page on each. Use vertical scrolling for the artifact preview; do not split slots across slides.", "answer": "Example verdict: REVERT the pump update tonight under the on-call bioengineer. EVIDENCE: previous version has a measured POFOD of 0.0005 over a 12-month ICU observation; the new version has no measured POFOD under peak demand. COUNTER-EVIDENCE: two wrong doses in 47 minutes is two orders of magnitude above the previous version's rate. UNCERTAINTY: the lab soak test did not replicate ICU demand pattern, so silent failures under unmeasured demand cannot be ruled out. VERDICT: revert, with redeployment conditional on a fault-injection test against the ICU operational profile producing a measured POFOD below 0.001.", "rule": "RULE 07 - Decision card", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Build the artifact a stranger could audit: claim, evidence, warrant, counter-evidence, uncertainty, verdict.", "title": "Your minimum inspectable artifact", "sub": "The decision card is what Assignment 1 asks for. Six slots, one signature, one evidence policy. Everything else tonight feeds this.", "blocks": [{"t": "wide", "c": "mag", "lab": "CLAIM", "lead": "State the verdict in one sentence.", "field": {"id": "dc_claim", "core": true, "rows": 2, "ph": "Continue, hold, or revert the pump update tonight"}}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE", "field": {"id": "dc_evidence", "core": true, "rows": 3, "ph": "What supports the claim? Cite a source page (Ch.11 p.X) or a measurement"}}, {"c": "teal", "lab": "WARRANT", "field": {"id": "dc_warrant", "core": true, "rows": 3, "ph": "Why does the evidence support the claim? Name the principle or metric"}}, {"c": "sand", "lab": "COUNTER-EVIDENCE", "field": {"id": "dc_counter", "core": true, "rows": 3, "ph": "What would the other side cite against this verdict?"}}, {"c": "mag", "lab": "UNCERTAINTY", "field": {"id": "dc_uncert", "core": true, "rows": 3, "ph": "What is unmeasured, assumed, or could change overnight?"}}, {"c": "green", "lab": "VERDICT", "field": {"id": "dc_verdict", "core": true, "rows": 2, "ph": "The bounded decision, the owner, the monitor, the condition to revisit"}}]}, {"t": "sign", "id": "r07_card", "fields": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_uncert", "f:dc_verdict"], "label": "I sign this verdict", "before": "Sign once all six slots carry something inspectable.", "ready": "Ready to sign.", "warn": "Signing freezes the six slots for the rest of the hour. The defense at Rule 17 changes them in a <i>later</i> box.", "done": "Read-only from here. The card you defend at Rule 17 is the one you signed here."}, {"t": "principle", "txt": "A defensible verdict names what supports it, what would reverse it, what is uncertain, and who owns it."}], "timebox": "4 min", "hueOk": "CLAIM, EVIDENCE, WARRANT, COUNTER-EVIDENCE, UNCERTAINTY, VERDICT each carry their own colour so a student can locate the same slot on the card, the rubric and the defense slide. The card is the only artifact graded tonight.", "task": "Fill all six slots from tonight&rsquo;s pump, then sign. The card is what Assignment 1 asks for. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes. Walk the room. The slot students skip is COUNTER-EVIDENCE: they cannot name what would reverse their own verdict, which means the verdict is not yet defensible. The signature freezes the six boxes; that is what makes Rule 17 a real defense rather than a second draft.", "appendix": true, "route": "toolkit"}, {"k": "QA3", "noAnswer": true, "rule": "RETRIEVAL LOOP - Practise", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the six card slots, the diversity requirement, the falsification standard and the anatomy of a monitor.", "title": "Sixty seconds on the decision flow", "sub": "Application checkpoint: recall the artifact you have built so far before transfer and defense continue.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 07 &middot; 09 &middot; 10 &middot; X04", "items": [{"q": "The decision card has six slots. Name them in order.", "a": "CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &middot; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it."}, {"q": "A two-channel pump with the same dose module on both channels has made which mistake?", "a": "It has no diversity &mdash; a single design fault in the dose module will fail both channels identically and the comparison will agree on the wrong answer. Redundancy without diversity is one system wearing two coats."}, {"q": "What must a claim state so the evidence can prove it wrong?", "a": "The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending."}, {"q": "Turn &ldquo;we are not sure about the pump&rsquo;s POFOD&rdquo; into a monitor.", "a": "A measured quantity (POFOD under peak ICU demand), an observation window (next 30 days), a trigger value (above 0.001), a named owner (on-call bioengineer) and a fallback action (revert to manual) &mdash; the unknown becomes a monitored risk, and the 3&times;3 grid was only its evaluate step."}]}], "timebox": "60 sec", "task": "Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.", "notes": "The practise loop points at the artifact, not at trivia: every question here is a slot or a standard the decision card must carry. Question 2 is the one to watch &mdash; a redundant architecture with no diversity is the false security that Rule 09 exists to refuse. If a student cannot name all six slots, the card they will defend at Rule 17 is missing walls; send them to C for ninety seconds, not to the slides.", "appendix": true, "route": "toolkit"}, {"k": "R11", "rule": "RULE 11 - Micro-case -> local case", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Reuse one metric-evidence-boundary chain in a different domain, and say what transfers and what breaks.", "title": "Scaffold first, then transfer", "sub": "Use the same metric-evidence-boundary chain twice &mdash; and the second time in a different domain.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MICRO-CASE &mdash; ISCARB SCAFFOLD", "txt": "The pump has a single dose-calculation module with no diversity. Two wrong doses were delivered in 47 minutes under peak ICU demand. Which metric should you have measured before deployment, and what would have blocked it?", "field": {"id": "micro", "core": false, "rows": 3, "ph": "The metric, and the diversity you would need"}}, {"c": "mag", "lab": "TRANSFER &mdash; THE WEEK 02 ATM CASE", "txt": "A bank ATM network requires 99.99% database availability between 7am and 11pm. Run the same chain: which metric fits which service, and does your pump reasoning survive the change of domain?", "field": {"id": "transfer", "core": false, "rows": 3, "ph": "The metric for each service, and what transfers or breaks between the two domains"}}]}, {"t": "wide", "c": "violet", "ic": "pin", "tag": "{{flag}} &nbsp;{{localTag}}", "lab": "WHY BOTH CASES ARE LOCAL", "lead": "The evidence has a named destination &mdash; and that is what takes &ldquo;accept the failure cost&rdquo; off the menu.", "txt": "Hospital medical devices and banking services are both regulated public services in {{country}}. {{accreditor}} links the field to {{bodies}}. That makes reliability engineering a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording."}, {"t": "principle", "txt": "Mechanism -&gt; Evidence -&gt; Decision boundary"}], "timebox": "1 min + 3 min", "task": "Solve the micro-case, then reuse the same reasoning chain on the Week 02 ATM case, and name which of {{bodiesShort}} receives your evidence. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about pumps has learned a case, not a capability. The ATM case is the one they met in kickoff, so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.", "appendix": true, "route": "toolkit"}, {"k": "R13", "rule": "RULE 13 - Stress test your verdict", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Stress a verdict against four reliability-engineering stress tests, and say which one it fails.", "title": "What change would break your solution?", "sub": "A strong verdict is one that survives the four questions below. Most do not survive the second.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 &nbsp; METRIC FIT", "lead": "Is the metric you chose actually the right shape for the demand?", "txt": "POFOD for intermittent demands; ROCOF/MTTF for continuous streams; Availability for 24/7 uptime. If you used Availability for a dose-calculation module, the stress test fails."}, {"c": "mag", "lab": "2 &nbsp; DIVERSITY", "lead": "Is there a common-mode fault that defeats every channel at once?", "txt": "Two channels running the same dose module is one channel twice. A specification error reaches every version. The stress test asks: what is the one fault that takes everything down?"}, {"c": "sand", "lab": "3 &nbsp; OPERATIONAL PROFILE", "lead": "Was the test data shaped like real ICU demand?", "txt": "A 24-hour lab soak test is not a holiday weekend at 03:00. The stress test asks: what would the operational profile need to look like for your measured metric to be honest?"}, {"c": "violet", "lab": "4 &nbsp; DEPENDABLE PROGRAMMING", "lead": "Which of the eight guidelines does the code violate?", "txt": "Visibility, input checks, exception handlers, error-prone constructs, restart, array bounds, timeouts, named constants. The stress test asks: which one is the bug class behind tonight&rsquo;s failure?"}]}, {"t": "wide", "c": "mag", "lab": "PICK THE ONE YOUR VERDICT FAILS", "field": {"id": "stress", "core": true, "rows": 2, "ph": "Which stress test does your verdict fail, and what would you change to survive it?"}}, {"t": "principle", "txt": "A verdict that survives all four stress tests is either remarkable or uncommitted &mdash; usually the second."}], "timebox": "3 min", "task": "Pick the stress test your verdict fails and write what you would change to survive it.", "notes": "Three minutes. The point is to fail one of the four on purpose &mdash; almost every verdict fails diversity or operational profile, and the honest student names which. A verdict that survives all four has usually not committed to a metric at all.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> decides the verdict and metric. The <b>evidence owner</b> maintains the inspectable reliability artifact. The <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What are the four stress tests a reliability verdict must survive?", "a": "<b>Metric fit</b> &mdash; is the metric the right shape for the demand? <b>Diversity</b> &mdash; is there a common-mode fault that defeats every channel? <b>Operational profile</b> &mdash; was the test data shaped like real usage? <b>Dependable programming</b> &mdash; which of the eight guidelines does the code violate?"}, {"q": "Your design adds a per-dose confirmation alert on the pump. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. standing pre-approval below a stated risk band, a weekly batch instead of a queue, alarm rationalisation. Sympathy is not an answer."}, {"q": "Where may AI sit in the reliability assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts test cases, generates operational profiles, suggests metrics. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense, so it rehearses the four moves the defense will press: ownership, the stress tests, workload and the AI gate. Question 3 wants a design change, not sympathy &mdash; the same test Rule 14 itself applies. Question 4 is deliberately the exact sentence from the flow: AI prepares, never owns, a human signs &mdash; if the room can say that sentence cold, Rule 15 landed.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks &mdash; the mark follows the level.", "badge": {"c": "", "t": "READINESS", "s": "the gate is at Rule 20"}, "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "violet", "lab": "L1 &nbsp; ASSERTING", "lead": "A verdict with nothing behind it.", "txt": "States a verdict. Names no metric, no artifact, no owner. Right or wrong, it cannot be audited."}, {"c": "teal", "lab": "L2 &nbsp; REASONING", "lead": "The metric, cited &mdash; but nothing to inspect.", "txt": "Names POFOD or Availability and cites the page. Still no artifact a stranger could inspect."}, {"c": "sand", "lab": "L3 &nbsp; JUSTIFYING", "lead": "A dated, owned artifact, and a stated way to be wrong.", "txt": "Names a dated, owned reliability artifact, states what would falsify the claim, and bounds the residual risk."}, {"c": "green", "lab": "L4 &nbsp; ACCOUNTABLE", "lead": "L3, and it survives the constraint changing.", "txt": "All of L3, and the verdict survives a changed constraint &mdash; or the student explains exactly why it changes, and who re-signs."}]}, {"t": "levels"}, {"t": "wide", "c": "mag", "lab": "READINESS IS A GATE, NOT A LEVEL", "lead": "A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.", "txt": "Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight &mdash; LO1, 5 marks, {{assignmentDue}} &mdash; and its evidence policy is the same one: cite the source page, or mark the claim <i>unmeasured</i> with the measurement you would need."}], "hueOk": "Four levels on one rail, each with its own colour, is the scale itself &mdash; a two-colour version stops reading as an ordered ladder.", "timebox": "90 sec", "cut": true, "task": "Pick the level you think you are at, then read the line under it: it says what your card actually carries.", "notes": "The picker is self-assessment; the line under it is read from the boxes the student actually filled and cannot be talked up. Point at the gap between the two &mdash; it is always a specific empty box, which is why this is a teaching instrument rather than a mark. The semester grade weights belong to the Week 01 kickoff and repeating them here wastes ninety seconds &mdash;
