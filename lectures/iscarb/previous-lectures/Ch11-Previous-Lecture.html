this slide answers the only question that matters tonight: what separates a weak answer from a defensible one in THIS chapter. Make each student name their own level out loud; most say L2 and are right, and the honesty is the point. Keep formal scoring off the live slide, as the peer-review rule requires. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constraint will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State metric + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constraint changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the metric"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed evidence"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE &mdash; PICK ONE", "picker": {"g": "mutation", "options": ["The pump moves to a paediatric ICU", "The regulator halves the POFOD target", "Budget halves: one channel only", "The dose module is now AI-generated"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses &mdash; and why"}}, {"t": "principle", "txt": "A strong design either survives mutation &mdash; or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses &mdash; stronger than a verdict that magically survives everything. Refusing to revise under a changed constraint is not robustness; it is not having reasoned in the first place.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the reliability claim without trusting your explanation, or the AI or tool that prepared it? Is the metric, the measurement, the operational profile all on file?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the metric threshold, missing measurement, common-mode fault or unmet operational profile that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session &mdash; two questions only, which is precisely why the formal rubric stays off the live slide. Students who cannot answer Q1 about someone else&rsquo;s card usually discover the same gap in their own. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 1, 2, 3. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line. Keep the instruments visible in sequence; use vertical scrolling for expansion.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, measure and challenge, with a named metric behind it and a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use a metric and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "X07", "answer": "Illustrative causal hypothesis for tonight: a programmer decided to compute the next dose by adding 1 to the previous dose without bounding the input range is the FAULT; the dose-calculation module accepting an out-of-range input is the ERROR; the pump delivering an incorrect dose to the patient is the FAILURE. The alarm alone does not prove this chain. Verify the test records and dose logs before presenting it as the actual incident.", "rule": "X07 - The words you will swap by mistake", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Distinguish fault, error and failure, and say which metric an incident actually threatens.", "title": "Fault, error, failure &mdash; and which metric broke", "sub": "Three words for three different things, and four metrics students report interchangeably. Get these wrong and every later sentence is wrong with them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "vocabulary, not a source page"}, "blocks": [{"t": "compare", "head": ["Term", "What it is", "Where you would look for it", "Tonight&rsquo;s pump"], "rows": [{"c": "teal", "cells": ["Fault", "A characteristic of the system that can lead to an error. The defect is sitting there, doing nothing yet.", "Code review, static analysis, a design walk-through.", "Code that adds 1 to the previous dose without bounding the input."]}, {"c": "sand", "cells": ["Error", "An erroneous system state that can lead to failure. The fault has been reached.", "Logs, assertions, a value that should not be possible.", "The dose variable holding a value beyond the safe range."]}, {"c": "mag", "cells": ["Failure", "An event &mdash; the system does not deliver the service expected.", "The patient, the nurse, the incident report.", "An incorrect dose delivered to the patient at 03:47."]}]}, {"t": "compare", "head": ["Metric", "The question it answers", "Demand pattern", "Broken tonight?"], "rows": [{"c": "teal", "cells": ["POFOD", "Will it fail when a service is demanded?", "Intermittent, infrequent, serious consequence", "The metric for tonight: each dose is a demand."]}, {"c": "teal", "cells": ["ROCOF / MTTF", "How often does it fail per unit time?", "Many similar requests in a short time", "Wrong shape: doses are not a continuous stream."]}, {"c": "sand", "cells": ["Availability", "Is it up when asked?", "Non-stop, continuously running", "No: the pump was up; the dose was wrong."]}, {"c": "sand", "cells": ["Reliability", "Does it deliver correctly, over a stated time, in a stated environment?", "Failure-free operation over a period", "Yes, but only meaningful against an environment spec."]}]}, {"t": "conceptflow", "items": [["FAULT", "Defect exists"], ["ERROR", "Wrong internal state"], ["FAILURE", "Service breaks"]]}, {"t": "principle", "c": "mag", "txt": "A fault nobody reaches causes nothing. A failure with no fault behind it does not exist."}], "hueOk": "Three terms and four metrics each carry their own colour so the student can find the same row again on the comparison; one colour would make both tables read as undifferentiated lists.", "timebox": "2 min", "cut": true, "task": "Write tonight&rsquo;s incident as one sentence naming the fault, the error and the failure in that order.", "say": "You will lose marks all semester for swapping these three words. Two minutes now saves that.", "notes": "<b>The sentence to make them write:</b> most students write &ldquo;the pump failed because of a software error&rdquo; and stop &mdash; that names two of the three terms and explains neither. The useful sentence names all three in order &mdash; <i>this fault</i>, reached under <i>these conditions</i>, put the system in <i>this wrong state</i>, which the user saw as <i>this failure</i> &mdash; and that is also the shape of a defensible incident report. Two minutes, and it is worth the two even though nothing here is new to a strong student &mdash; the weak half of the room has been using these three words as synonyms since first year, and the cost only shows up in the assignment. Do not read the tables aloud; that is what they are for. Instead ask one student to say tonight&rsquo;s incident as the three-part sentence, and correct only the ordering. The second table is the one to point at when a student later writes &ldquo;the pump was unreliable&rdquo; about an incident where the pump stayed up: reliability and availability are different promises, and the right-hand column already says which one tonight actually threatens. This is a designated cut point: if behind, say the three-part sentence once and move on. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R14", "rule": "RULE 14 - Practitioner workload", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name a workload cost their reliability design creates for a practitioner, and the design change that reduces it.", "title": "Engineering changes human work", "sub": "A reliable design can still fail operationally if it creates unsustainable workload.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "ALARM BURDEN", "lead": "How many alarms per shift, and what gets silenced?", "txt": "A pump that alarms on every marginal reading trains nurses to silence the alarm rather than read it. The 03:52 manual revert is the alarm system working as designed &mdash; by being ignored."}, {"c": "sand", "lab": "REVIEW WORKLOAD", "txt": "Who validates the reliability evidence, the exception log, the failover drills &mdash; and do they have the hours the process assumes?"}, {"c": "mag", "lab": "DELIVERY SPEED", "txt": "What schedule pressure is the team absorbing, and what does it push them to skip? A 24-hour soak test instead of a 7-day ICU trial is a schedule choice, not a technical one."}, {"c": "violet", "ic": "spark", "lab": "WHO WRITES IT NOW", "lead": "Generated code moves the load; it does not remove it.", "txt": "Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing more that they did not write. The dose-calculation module is exactly the kind of code a model writes plausibly and a reviewer under-scrutinises."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT, THIS IS THE MECHANISM &mdash; NOT A FOOTNOTE", "lead": "Blaming the nurse ends the investigation. Workload as a design input continues it.", "txt": "The nurse reverted to manual monitoring at 03:52 because she was covering six ICU beds at 03:00 on a holiday weekend and the alarm had been sounding for 47 minutes. That is alarm load, shift timing and cognitive load acting as a system variable. The source says operational error is perhaps the largest single cause of failure in sociotechnical systems (Ch.10 p.5), and Ch.11 says users adapt behaviour to avoid failing features (p.16). Blaming the nurse ends the investigation; treating workload as a design input continues it.", "field": {"id": "workload", "core": false, "rows": 2, "ph": "One workload cost your reliability design creates for a real practitioner, and the concrete design change that reduces it", "ex": "<i>Shape only:</i> &ldquo;My design adds a per-dose confirmation alert. With generated drafts the team now files four times as many, so the nurse silences them. Design change: alerts below a stated risk band get standing pre-approval, and the nurse sees a weekly batch instead of a queue.&rdquo;"}}, {"t": "principle", "txt": "Trade-offs include people, process, evidence and time &mdash; not only code."}], "timebox": "90 sec", "task": "Name one workload cost your preferred reliability design creates for a real practitioner, and the design change that reduces it.", "notes": "The rule with no equivalent in the textbook, and where ISCARB differs from a standard reliability lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change &mdash; alarm rationalisation, a handover protocol, a second pair of eyes on the night shift. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b> Every student in the room is already using generated code, and almost none of them has been asked what it did to the review load rather than to the writing load. Two things to say. First, the honest framing: the tool did not remove the work, it moved it &mdash; from writing, which is visible and estimated, to reviewing, which is neither. Second, connect it to the crisis: the nurse silenced the alarm because there were too many alarms for the attention available, and a reviewer who approves without reading is the same failure with a keyboard. If a student answers &ldquo;it just makes us faster&rdquo;, ask who reviews the faster output and how many hours they have.", "appendix": true, "route": "toolkit"}, {"k": "X08", "answer": "Illustrative target, not a measured result or a value from the chapter: Monitor POFOD for the dose-calculation module. Target: below 0.001 per demand, checked for each ICU bed over a 30-day observation window. If the target is missed, alert the on-call bioengineer, revert to manual monitoring on the affected bed and re-test before returning to automatic operation. The target and fallback require approval for the actual system.", "rule": "X08 - The same ideas, the other vocabulary", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Say the reliability idea they have just used in the vocabulary a services team would use for it.", "title": "You already know these. You may not know their other names.", "sub": "Left column: what this chapter calls it. Right column: what the same argument is called where most of you will work. Same idea, different room.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "not in the chapter &mdash; the chapter predates the vocabulary"}, "blocks": [{"t": "compare", "head": ["In this chapter", "Where most of you will work", "What the second one adds"], "rows": [{"c": "teal", "cells": ["Availability, as a probability", "A service level objective &mdash; a stated target over a stated window", "A number and a period, so the argument stops being about whether it is available and starts being about whether the target was met"]}, {"c": "teal", "cells": ["POFOD and ROCOF as reliability metrics", "An error rate &mdash; failures per N requests, with a budget for them", "It makes the metric a resource you allocate rather than a virtue you claim"]}, {"c": "sand", "cells": ["A monitor with a trigger value and an owner (Rule 10)", "An actionable alert, with a runbook", "The rule that an alert nobody acts on is deleted, not tuned"]}, {"c": "sand", "cells": ["Fault, error, failure (X07)", "The incident, and the post-incident review that follows it", "A written review with an owner and follow-up actions &mdash; the artifact this course keeps asking for"]}, {"c": "mag", "cells": ["Fault tolerance and N-version programming", "Canary release, staged rollout, and limiting how much one change touches", "It moves the defence from the failure to the change that causes most of them"]}, {"c": "violet", "cells": ["Statistical testing against an operational profile (Rule 15)", "Chaos engineering and game days", "A rehearsal of the failure on a real system, with the operator actually in the room"]}]}, {"t": "wide", "c": "violet", "lab": "ONE LINE, IN THE OTHER VOCABULARY", "field": {"id": "vocab_own", "core": false, "rows": 1, "ph": "Take the monitor you wrote in Rule 10 and state it as a target, a window, and what happens when it is missed"}}], "hueOk": "Colours carry over from X07 and B01 so the student recognises which family each row belongs to; the row is a translation, and the colour is what says of what.", "timebox": "90 sec", "cut": true, "task": "Read the middle column. Then restate your own Rule 10 monitor in it.", "say": "Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.", "notes": "Ninety seconds, and resist expanding it &mdash; the point is recognition, not instruction. Two things worth saying. First, the honest history: this chapter was written before the vocabulary in the middle column existed as a discipline, so the gap is chronological rather than a disagreement, and the concepts map almost one to one. Second, the direction of the translation matters: a student who learns only the middle column can run a dashboard and cannot argue a certification, while a student who has both can do both, which is the actual advantage this degree gives them. If someone asks which vocabulary is right, the answer is the room you are in &mdash; a regulator will not accept an error budget and a service team will not accept a hazard log, and knowing which is which is the skill. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R15", "answer": "<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>", "rule": "RULE 15 - AI assist + human sign-off", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.", "title": "AI prepares evidence; humans own assurance", "sub": "AI is permitted for preparation, never for unowned approval.", "badge": {"c": "mag", "t": "AI MOMENT", "s": "assist, not assurance"}, "blocks": [{"t": "aiflow"}, {"t": "aigate"}], "timebox": "90 sec", "task": "Run the gate on the way you actually used AI this week &mdash; on a real output, not a hypothetical. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "The gate is the rule, not the three stations above it &mdash; make every student run it on something they really did this week, not on a hypothetical. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second &mdash; which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. It means the artifact you file is the test you ran and what it showed, never the prompt or the answer. A student who cannot say which of the two middle questions their own use passed has not yet understood what they filed. The remaining trap is yes / no / no: an output that becomes evidence and is neither re-derivable nor testable is exactly the unverifiable claim this course exists to refuse. Note what is deliberately absent: vendor benchmark numbers. If a student cites an accuracy figure or a mean-time-to-failure, ask which study. That is the break-even discipline from X04 applied to AI, and if you let it slide the session&rsquo;s whole argument about evidence collapses in its final ten minutes.", "appendix": true, "route": "toolkit"}], "appendixUnits": ["READING", "PREP", "C01", "SRC00", "SRC01", "SRC02", "SRC03", "SRC04", "SRC05", "SRC06", "SRC07", "R01", "R02R03", "R10", "R12", "J02", "R02", "R03", "R04", "R05", "H01", "QA1", "QA2", "R06", "R07", "QA3", "R11", "R13", "QA4", "R16", "R17", "R19", "J01", "R20", "X07", "R14", "X08", "R15"], "mainUnits": ["TITLE", "START", "X01", "X02", "X03", "X04", "CHECK1", "X05", "X06", "X02A", "R09", "CHECK2", "B01", "R08", "R18", "X09", "X10", "APPLY", "END"], "path": {"chapter": 11, "assignment": 2, "exit": ["Select POFOD, ROCOF/MTTF or availability and name the unit.", "Distinguish functional and non-functional requirements.", "Compare protection, self-monitoring and voting architectures.", "Apply dependable programming to a concrete fault.", "Explain operational profiles and statistical uncertainty."], "sourceFile": "sources/Ch11-Original.pptx", "build": "20260921-visual-v3"}, "study": {"readings": [["Reliability metrics and requirements", 19, 24], ["Measurement and operational profiles", 70, 75]], "technical": "A primary and backup service share one specification and one power supply. Compare this arrangement with diverse implementations: name a shared cause that remains and one cost of diversity.", "oral": "The measured exposure doubles while failures remain the same. What changes numerically, and what still cannot be concluded about production?", "quiz": [["Which expression has units of failures per operating hour?", ["Downtime / total time", "Failed requests / total requests", "Failures / operating hours"], 2, "ROCOF must state its exposure unit. A request ratio is not an hourly rate."], ["Which is a functional reliability requirement?", ["The system shall detect a failed sensor and switch to the backup", "Availability shall be 99.9%", "The observed failure rate is 0.001"], 0, "Detection and switching specify required behavior; a numeric service level is non-functional."], ["What can undermine majority voting?", ["An odd number of versions", "A common specification error across versions", "Recording disagreements"], 1, "Agreement among versions does not eliminate common-mode faults."], ["A routine can receive an out-of-range index. Which action is dependable programming?", ["Assume callers are correct", "Suppress every exception without a record", "Validate the range and handle a documented error"], 2, "Check inputs and define observable error behavior."], ["A test has few retries but production has many. What is required?", ["Justify or retest the operational profile before generalizing", "Use uptime as a replacement for correctness", "Ignore the request mix"], 0, "A sample estimate is conditional on failure definition, exposure and tested profile."]]}, "caseMap": [{"title": "Classroom application", "parts": [["Claim and evidence", "f:path_claim"], ["Limit and challenge", "f:path_limit"], ["Owner and next step", "f:path_owner"]]}], "visualStory": {"units": {"X01": {"takeaway": "Manage faults before they become service failures.", "nodes": [["Avoid", "Prevent introduction"], ["Detect", "Find and remove"], ["Tolerate", "Limit the effect"]], "visual": "flow"}, "X02": {"takeaway": "A defect may stay dormant until a particular input activates it.", "nodes": [["Fault", "Present in the system"], ["Activation", "Operating condition"], ["Failure", "Observed deviation"]], "visual": "flow"}, "X03": {"takeaway": "Reliability is a claim about specified use, not every possible use.", "nodes": [["Input mix", "What users do"], ["System", "Processes requests"], ["Output", "Correct or failed"]], "visual": "ch11_iomap"}, "X04": {"takeaway": "Choose the metric, then state its denominator.", "nodes": [["POFOD", "Failures per demand"], ["ROCOF", "Failures per exposure"], ["MTTF", "Mean time to failure"], ["Availability", "Uptime / total time"]], "visual": "metrics"}, "X05": {"takeaway": "Availability becomes meaningful when you state the service and time window.", "nodes": [["Window", "30 days"], ["Availability", "99.9%"], ["Downtime", "43.2 minutes"]], "visual": "flow"}, "X06": {"takeaway": "Define the failure type before selecting a POFOD target and its evidence.", "nodes": [["Transient failure", "User can restore operation"], ["Permanent failure", "Manufacturer intervention"], ["Evidence", "Demands, failures and uncertainty"]], "visual": "compare"}, "X02A": {"takeaway": "Functional reliability requirements specify checks, recovery, redundancy and process obligations.", "nodes": [["Checking", "Find invalid states"], ["Recovery", "Restore operation"], ["Redundancy", "Tolerate faults"], ["Process", "Required development practices"]], "visual": "compare"}, "R09": {"takeaway": "Protection intervenes; self-monitoring detects disagreement.", "nodes": [["Normal channel", "Performs the work"], ["Monitor", "Checks the behavior"], ["Protection", "Acts on danger"]], "visual": "ch11_selfmon"}, "B01": {"takeaway": "Voting can mask an independent fault; common faults can defeat the vote.", "nodes": [["Replicas", "Produce results"], ["Voter", "Chooses an output"], ["Shared error", "May fool every version"]], "visual": "ch11_tmr"}, "R08": {"takeaway": "Trace both diversity and shared dependencies in the architecture.", "nodes": [["Separate channels", "Limit some failures"], ["Diverse designs", "Reduce shared faults"], ["Common assumptions", "Still need review"]], "visual": "ch11_airbus"}, "R18": {"takeaway": "Make invalid states and error paths explicit in the code.", "nodes": [["Validate inputs", "Check boundaries"], ["Handle errors", "Define recovery"], ["Manage resources", "Protect shared state"]], "visual": "flow"}, "X09": {"takeaway": "A reliability estimate needs failures, exposure and a representative test.", "nodes": [["Operational profile", "Select the mix"], ["Execute tests", "Observe failures"], ["Estimate", "Report scope and uncertainty"]], "visual": "ch11_relmeasure"}, "X10": {"takeaway": "A changed workload can invalidate an earlier reliability estimate.", "nodes": [["Test mix", "Ordinary requests"], ["Production mix", "Many retries"], ["Action", "Justify or retest"]], "visual": "ch11_opprofile"}}, "opening": {"headline": "The pump works in the test. What about tonight?", "case": "An insulin-pump update is operating in a different usage context. The release needs a measurable reliability claim.", "question": "Which measurement would support that claim?", "nodes": ["Failures", "Exposure", "Usage profile", "Requirement"]}, "version": "20260921-visual-v3"}};

   A term a first-year student has not met yet costs the room its attention:
   they stop following the argument and start guessing the word. LECTURE.glossary

   definition on hover or tap. Applied to assembled HTML, so it steps over tags
   and never rewrites an attribute or a term already inside a definition. */
var GL=(function(){
  var g=LECTURE.glossary||{}, out=[];

  function collect(el){
    if(el.nodeType===3){nodes.push(el);return;}
    if(el.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA|BUTTON|A)$/.test(el.tagName)||el.classList.contains('gl'))return;
    if(el.namespaceURI&&el.namespaceURI!=='http://www.w3.org/1999/xhtml')return;   /* v10: svg figure labels are not prose */

var QA_C=326.7;                                  /* ring circumference, r=52  */

function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
      var live=document.getElementById('tLive');
      if(live) live.textContent='The retrieval minute is over — reveal and compare.';

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(typeof ref!=='string') return '';
  if(ref==='@marks') return Object.keys(S.marks||{}).filter(function(k){return Array.isArray(S.marks[k])&&S.marks[k].length;}).join(' ');
  if(ref==='@gates'){var passed=GATE_DEFS.filter(function(g){return S.gates&&S.gates[g[0]];}).length;return passed?String(passed):'';}
  if(ref==='@signed'){var signed=Object.keys(S.sign||{}).filter(function(k){return S.sign[k];}).length;return signed?String(signed):'';}
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function policyThreshold(config,key){
  var policy=LECTURE.thresholds||{},name=(config&&config.minKey)||key;
  var value=config&&Number.isFinite(config.min)?config.min:policy[name];
  if(!Number.isFinite(value)||value<0)throw new Error('Invalid LECTURE.thresholds entry: '+name);
  return value;
}
function coachState(b){
  var w=b.watch||[], filled=0, thin=false, min=policyThreshold(b,'coachDeep'), deep=b.deep;
  for(var i=0;i<w.length;i++){
    var v=String(probe(w[i])||'').trim();
    /* only the boxes named in `deep` are held to a length — a NAME box is
       legitimately three words and must not be nagged for it */
    if(v){ filled++; if(w[i].indexOf('f:')===0 && (!deep||deep.indexOf(w[i])>=0) && v.length<min) thin=true; }
  }
  if(filled<policyThreshold(null,'coachMinFilled')) return 'empty';
  if(filled<w.length||thin) return 'thin';
  return 'ok';
}

var SIGN=[];

/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    var m=s.match(/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */
function uncitedPages(){
  var C=LECTURE.coverage; if(!C||!C.span) return [];
  var hits=srcPages(), out=[], run=null;
  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }
  }
  if(run) out.push(run);
  return out;
}
function fmtRanges(rs){
  var o=[];
  for(var i=0;i<rs.length;i++) o.push(rs[i][0]===rs[i][1]?rs[i][0]:rs[i][0]+'&ndash;'+rs[i][1]);
  return o.join(', ');
}

function renderCoverage(){

function rBlocks(list){
  var h='';
  for(var i=0;i<list.length;i++){
    var b=list[i];
    if(b.t==='cards'){h+='<div class="grid g'+(b.cols||3)+'">';for(var j=0;j<b.items.length;j++)h+=rCard(b.items[j]);h+='</div>';}
    else if(b.t==='chain'){h+='<div class="grid g'+(b.items.length)+' chain">';for(var j2=0;j2<b.items.length;j2++)h+=rCard(b.items[j2]);h+='</div>';}
    else if(b.t==='rows'){h+='<div class="grid g1" style="gap:10px">';for(var j3=0;j3<b.items.length;j3++)h+=rCard(b.items[j3],true);h+='</div>';}
    else if(b.t==='wide'){h+=rCard(b);}
    else if(b.t==='zones'){h+=rZones(b);}
    else if(b.t==='principle'){h+='<div class="principle'+(b.c==='mag'?' mag':'')+'">'+b.txt+'</div>'+
      /* a principle that quotes the source cites it like any other claim */
      (b.src?'<div class="src" style="text-align:center;margin-top:-4px">'+b.src+'</div>':'');}
    else if(b.t==='deflist'){
      var dl='<div><div class="deflist"><div class="dl-t">'+ic('file','19')+' '+b.title+'</div>'+
        '<div class="dl-d">'+b.def+'</div>';
      for(var di=0;di<b.items.length;di++)
        dl+='<div class="dl-i"><span class="n">'+(di+1)+'</span><div><b>'+b.items[di][0]+'</b> <span>'+b.items[di][1]+'</span></div></div>';
      dl+='<div class="dl-f">'+b.foot+'</div></div>'+
        '<div class="src" style="margin-top:9px">'+ic('book','12.5')+' Primary source &middot; '+LECTURE.sourceShort+' &middot; '+b.cap+'</div></div>';
      /* v13: stacked, not side-by-side — the definitions span the top as a
         two-column ledger and the four aspect cards take the full width
         below, so the deck's longest source lines stop fighting the clock. */
      var ritems=[];
      for(var rj=0;rj<b.right.length;rj++) if(b.right[rj].items) ritems=ritems.concat(b.right[rj].items);
      h+='<div class="defstack">'+dl+'<div class="grid g4" style="margin-top:11px;min-height:0">';
      for(var rk=0;rk<ritems.length;rk++) h+=rCard(ritems[rk]);
      h+='</div></div>';
    }
    else if(b.t==='figure'){
      var left = b.matrixLeft ? '<div><div class="matrix" data-matrix="1"></div>'+
        '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">'+
        '<span class="pick" style="border-color:var(--green);color:var(--green);cursor:default">Known / managed</span>'+
        '<span class="pick" style="border-color:var(--sand);color:var(--sand);cursor:default">Known / unmanaged</span>'+
        '<span class="pick" style="border-color:var(--mag);color:var(--mag);cursor:default">Unknown / monitor</span></div></div>'
        : '<div><div class="figwrap" data-fig="'+(b.mk||b.img)+'">'+(b.native&&NATIVE_FIG[b.native]?NATIVE_FIG[b.native]():'<img src="'+FIG[b.img]+'"'+(b.h?' style="max-height:'+b.h+'px"':'')+' alt="Source figure, '+b.cap+'">')+'</div>'+
          '<div class="figbar"><span class="figcap" style="margin:0">'+(b.srcName||('Primary source &middot; '+LECTURE.sourceShort))+' &middot; '+b.cap+'</span>'+
          '<button data-act="clearMarks" data-fig="'+(b.mk||b.img)+'">Clear marks</button></div>'+
          '<div style="font-size:13px;color:var(--dim2);margin-top:5px">Click the figure to mark the region that changes your engineering decision.</div></div>';
      h+='<div class="splitfig"'+(b.matrixLeft?' style="grid-template-columns:.92fr 1.08fr"':'')+'>'+left+
         '<div style="display:flex;flex-direction:column;gap:11px;min-height:0">'+rBlocks(b.right)+'</div></div>';
    }
    else if(b.t==='stack'){h+=rStack();}
    else if(b.t==='matrix'){h+='<div class="matrix" data-matrix="1"></div>';}
    else if(b.t==='gates'){h+=rGates();}
    else if(b.t==='svg'){h+='<div class="svgwrap">'+SVG[b.kind]+'</div>';}
    else if(b.t==='aigate'){h+=rAiGate();}
    else if(b.t==='aiflow'){h+=rAiFlow();}
    else if(b.t==='cardcheck'){h+='<div class="cardcheck" data-cardcheck="1"></div>';}
    else if(b.t==='clomap'){h+='<div class="clomap" data-clomap="1"></div>';}
    else if(b.t==='jahiziah'){h+=rJah();}
    else if(b.t==='jahtest'){h+='<div class="qz" data-qz="1"></div>';}
    else if(b.t==='coach'){h+=rCoach(b);}
    else if(b.t==='pair'){h+=rPair(b);}
    else if(b.t==='sign'){h+=rSign(b);}
    else if(b.t==='levels'){h+=rLevels();}
    else if(b.t==='coverage'){h+=rCoverage();}
    else if(b.t==='compare'){h+=rCompare(b);}
    else if(b.t==='bridge'){h+=rBridge();}
    else if(b.t==='conceptflow'){
      h+='<div class="concept-flow" style="--n:'+(b.items.length||3)+'">';
      for(var cf=0;cf<b.items.length;cf++) h+='<div class="concept-node"><div class="cn">'+T(b.items[cf][0])+'</div><div class="cv">'+T(b.items[cf][1])+'</div></div>';
      h+='</div>';
    }
    else if(b.t==='qa'){h+=rQa(b);}
    else if(b.t==='recall'){h+=rRecall(b);}
    else if(b.t==='raw'){h+=b.html;}
  }
  return h;
}


/* ---------- hidden model answer / instructor key ---------------------------
   Every question-bearing unit gets the same open/close affordance. The author
   defines u.answer for a model response. Learning objectives and spoken teaching
   cues are never relabelled as answers. noAnswer suppresses a pre-reveal key. */
function hasQuestion(u){
  if(!u||u.k==='TITLE'||u.k==='END'||u.noAnswer===true) return false;
  if(typeof u.answer==='string'&&u.answer.trim())return true;
  if(u.question===true)return true;
  var probe=' '+(u.task||'')+' '+JSON.stringify(u.blocks||[])+' ';
  return /\?|\bchoose\b|\bclassify\b|\bdecide\b|\bname\b|\bwhich\b|\bwhat\b|\bwhy\b|\bhow\b/i.test(strip(probe));
}
function answerKey(u){
  return T(u.answer||'State a bounded claim, identify supporting evidence and name an observation that would reverse the claim. Compare your response with the source and discuss the reasoning with the instructor.');
}
function rAnswer(u){
  if(!hasQuestion(u)) return '';
  var id='ans-'+u.k, hasFields=/"field"\s*:|"picker"\s*:/.test(JSON.stringify(u.blocks||[]));
  return '<div class="answer-wrap">'+(hasFields?'<span class="attempt-hint">Try your own answer, then compare.</span>':'')+
    '<button class="answer-toggle" data-answer-toggle="'+id+'" aria-controls="'+id+'" aria-expanded="false"'+(hasFields?' data-soft="1"':'')+'>Answer</button>'+
    '<div class="answer-box" id="'+id+'" data-answer-box="'+id+'" hidden><b>EXAMPLE EXPLANATION</b><br>'+answerKey(u)+'</div></div>';
}

/* Readability pass: enlarge light slides, compact dense ones. This is structural
   rather than manual per-slide font tweaking, so every cloned lecture behaves
   consistently and titles never compete with dense content. */
function applyReadableDensity(){
  var slides=deck.querySelectorAll('.slide');

/* ---------- v7 auto-fit: a slide fills the stage exactly, never scrolls -----
   Content that would overflow is measured, then the .fit wrapper is scaled
   down just enough to fit. Re-run whenever content can change size: reader
   zoom (+/-), navigation to a conditional slide, or a late-loading figure. */
function fitSlide(sl){
  sl=sl||deck.querySelector('.slide.on'); if(!sl) return;
  var fit=sl.querySelector('.fit'); if(!fit) return;
  fit.style.transform='none';
  var cs=getComputedStyle(sl);
  var avail=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!(avail>0)) return;
  var h=fit.scrollHeight;
  if(h>avail+1){
    var f=avail/h;
    if(f<.55) f=.55;                     /* legibility floor — nothing unreadable */
    fit.style.transform='scale('+f+')';
    fit.style.transformOrigin='top center';
  }
}

  }
},true);


/* ---------- author sanity check ---------------------------------------------
   Runtime guardrails for cloned/adapted lectures. Warnings never block class.
   Run ISCARB_SANITY() from DevTools at any time to re-check the current deck. */
function sanity(){
  var issues=[], declaredF={}, declaredP={}, usedImg={}, names=LECTURE.fieldNames||{};
  function walk(x){
    if(!x) return;
    if(Array.isArray(x)){ for(var i=0;i<x.length;i++) walk(x[i]); return; }
    if(typeof x!=='object') return;
    if(x.field&&x.field.id) declaredF[x.field.id]=1;
    if(x.picker&&x.picker.g) declaredP[x.picker.g]=1;
    if(x.t==='levels')declaredP.level=1;
    if(x.img&&typeof x.img==='string') usedImg[x.img]=1;
    if(x.t==='raw'&&typeof x.html==='string'){
      var re=/data-pick=["']([^"']+)["']/g,m;
      while((m=re.exec(x.html))) declaredP[m[1]]=1;
    }
    for(var k in x) if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]);
  }
  walk(LECTURE.units||[]);

  var fs=document.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var id=fs[i].getAttribute('data-f');
    if(!declaredF[id]&&!names['f:'+id]) issues.push('data-f "'+id+'" has no field declaration or fieldNames alias');
  }

  var cm=LECTURE.caseMap||[];
  for(var c=0;c<cm.length;c++){
    var parts=cm[c].parts||[];
    for(var p=0;p<parts.length;p++){
      var ref=parts[p][1]||'';
      if(ref.indexOf('p:')===0&&!declaredP[ref.slice(2)])
        issues.push('caseMap picker "'+ref+'" is not present in lecture blocks');
      if(ref.indexOf('f:')===0&&!declaredF[ref.slice(2)]&&!names[ref])
        issues.push('caseMap field "'+ref+'" is not present in lecture blocks');
    }
  }

  var exported={};
  cm.forEach(function(section){section.parts.forEach(function(part){exported[part[1]]=true;});});
  document.querySelectorAll('[data-f]').forEach(function(el){var ref='f:'+el.getAttribute('data-f');if(!exported[ref])issues.push('Unexported answer field: '+ref);});
  document.querySelectorAll('[data-pick]').forEach(function(el){var ref='p:'+el.getAttribute('data-pick');if(!exported[ref])issues.push('Unexported choice: '+ref);});
  LECTURE.units.forEach(function(u){if(u.showIf&&u.showIf.thin&&u.showIf.minKey&&!Object.prototype.hasOwnProperty.call(LECTURE.thresholds,u.showIf.minKey))issues.push('Unknown threshold key in '+u.k);});
  for(var img in usedImg)
    if(!Object.prototype.hasOwnProperty.call(FIG,img)) issues.push('figure key "'+img+'" is used but missing from FIG');

  var keys={};
  for(var u=0;u<(LECTURE.units||[]).length;u++){
    var uk=LECTURE.units[u].k;
    if(keys[uk]) issues.push('duplicate unit key "'+uk+'"');
    keys[uk]=1;
  }

  var unresolved=(document.getElementById('deck').innerHTML.match(/\{\{\s*[^}]+\s*\}\}/g)||[]);
  if(unresolved.length) issues.push('unresolved context token(s): '+unresolved.join(', '));

  var report={ok:issues.length===0,issues:issues,fields:Object.keys(declaredF).length,
    pickers:Object.keys(declaredP).length,figures:Object.keys(usedImg).length,units:(LECTURE.units||[]).length};
  try{
    if(window.console){
      if(report.ok){ if(typeof console.info==='function') console.info('[ISCARB sanity] OK',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] OK',report); }
      else { if(typeof console.warn==='function') console.warn('[ISCARB sanity] '+issues.length+' issue(s)',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] '+issues.length+' issue(s)',report); }
    }
  }catch(e){}
  window.ISCARB_SANITY_REPORT=report;
  return report;
}

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;
}
/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=policyThreshold(c,'thinDefault');
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}
  return true;
}

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){
  var L=LECTURE, o=[];
  var line=function(x){o.push(x===undefined?'':x);};
  line('# '+strip(T(L.title))+' — course file extract');
  line('');
  line('Course: '+strip(T(L.course))+'  |  Source: '+strip(T(L.source)));
  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');
  line('lecture and rendered by the same engine that teaches it.');
  line('');
  line('Cut points ('+L.units.filter(function(u){return u.cut;}).length+'): '+L.units.filter(function(u){return u.cut;}).map(function(u){return u.k;}).join(', '));
  line('Scaffolding thresholds: '+JSON.stringify(L.thresholds));
  line('');
  line('## 1. Session outcomes, by unit');
  line('');
  line('| Unit | Rule | The student will be able to | Activity | Timebox |');
  line('|---|---|---|---|---|');
  for(var i=0;i<L.units.length;i++){
    var u=L.units[i]; if(!u.rule||!u.learn) continue;
    line('| '+u.k+' | '+strip(T(u.rule))+' | '+strip(T(u.learn))+' | '+strip(T(u.task||'—'))+' | '+(u.timebox||'—')+' |');
  }
  line('');
  line('## 2. Course and programme outcome map');
  line('');
  line('| CLO | PLO | Domain | Outcome | Evidence the student produces | Where |');
  line('|---|---|---|---|---|---|');
  for(var r=0;r<(L.readiness||[]).length;r++){
    var R=L.readiness[r], NAMES=L.fieldNames||{}, ev=[];
    for(var n=0;n<(R.needs||[]).length;n++) ev.push(NAMES[R.needs[n]]||R.needs[n]);
    line('| '+R.clo+' | '+(R.plo||'—')+' | '+(R.d||'')+' | '+strip(T(R.txt))+' | '+ev.join(', ')+' | '+strip(R.where||'')+' |');
  }
  line('');
  line('Assessment evidence is the artifact itself: the decision card the student');
  line('exports, whose sections are listed in §5. The closing unit reads the map');
  line('above off that artifact rather than off self-report.');
  line('');
  line('## 3. Source coverage');
  line('');
  var rows=coverageRows();
  if(rows.length){
    line('| Section | Pages | Status | Reached by |');
    line('|---|---|---|---|');
    for(var c=0;c<rows.length;c++){
      var R2=rows[c];
      line('| '+R2.s.k+' '+strip(R2.s.t)+' | '+R2.s.pp[0]+'–'+R2.s.pp[1]+' | '+R2.st+' | '+(R2.units.join(', ')||'—')+' |');
      if(R2.st==='open'&&R2.s.why) line('| | | out of scope | '+strip(R2.s.why)+' |');
    }
    var g=uncitedPages();
    if(g.length){ line(''); line('Pages within the source span that this session never cites: '+
      strip(fmtRanges(g))+'. Counted from the page citation on every card.'); }
  } else line('No coverage ledger declared.');
  line('');
  if(L.jahiziah){
    line('## 4. National alignment');
    line('');
    line(strip(T(L.jahiziah.gku))+' → '+strip(T(L.jahiziah.sku)));
    line('');
    line('| # | Outcome | Status | Where |');
    line('|---|---|---|---|');
    for(var j=0;j<(L.jahiziah.outcomes||[]).length;j++){
      var O=L.jahiziah.outcomes[j];
      line('| '+O.n+' | '+strip(T(O.txt))+' | '+O.s+' | '+strip(T(O.where||''))+' |');
    }
    line('');
    line('This states coverage only. It is not the national examination and');
    line('predicts nothing about any student\'s result on it.');
    line('');
  }
  line('## 5. The artifact each student leaves holding');
  line('');
  for(var m=0;m<(L.caseMap||[]).length;m++) line('- '+strip(T(L.caseMap[m].t)));
  line('');
  line('## 6. Accessibility and data');
  line('');
  line('- Runs as one HTML file with no install, no account and no network.');
  line('- Nothing a student types leaves their browser; there is no server to hold it.');
  line('- Full keyboard navigation; ? lists the keys. Text size adjustable 80–140%.');
  line('- Every status is carried by a word as well as a colour.');
  line('');
  line('Generated '+new Date().toISOString().slice(0,10)+' by the ISCARB lecture engine.');
  return o.join('\n');
}
function strip(x){
  if(x==null||x==='') return '';
  var s=String(x);
  var d=document.createElement('div'); d.innerHTML=s;
  s=(d.textContent||d.innerText||s).replace(/\s+/g,' ').trim();
  return s.replace(/\|/g,'\\|').trim();
}

function fmt(s){var m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?'+':'')+m+':'+(x<10?'0':'')+x;}

/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}

/* ---------- v12 quick view: the deck turns itself ---------------------------
   One button (or Q) auto-advances at a readable pace with a visible progress
   line on the bar — built for self-review, screen recording and sharing.
   Any manual navigation cancels it (the guard sits inside go()); it holds
   still while the tab is hidden or the student is typing, and it follows

var QV={on:false,driving:false,total:0,left:0,last:0,raf:0};
function qvDwell(i){
  var u=U[i]; if(!u) return 7000;
  if(u.k==='TITLE') return 5000;
  if(u.k==='END') return 6500;

function qvStep(ts){
  if(!QV.on) return;
  if(document.hidden){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  var ae=document.activeElement;
  if(ae&&/^(textarea|input)$/i.test(ae.tagName)){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  QV.left-=(ts-QV.last); QV.last=ts; qvPaint();
  if(QV.left<=0){
    if(cur>=U.length-1||!visibleInDirection(1)){ qvStop(); note('Quick view finished.'); return; }
    QV.driving=true; go(cur+1); QV.driving=false;
    QV.total=QV.left=qvDwell(cur); qvPaint();
  }
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStart(){
  QV.on=true; QV.total=QV.left=qvDwell(cur); QV.last=performance.now();
  qvLabel(); qvPaint();
  note('Quick view on — the deck turns itself. Q or Esc stops it.');
