on or tolerance, and name where each one sits in the lifecycle.", "title": "Faults, errors and failures", "sub": "Failures originate in human error, sit in the system as faults, and are managed by avoidance, detection and tolerance.", "blocks": [{"t": "figure", "img": "ch11_costcurve", "cap": "p.8 · cost of residual fault removal", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "THE COST CURVE", "lead": "The cost of removing the last faults rises exponentially.", "txt": "The cost of finding and removing residual faults grows steeply as the system matures. At some point the marginal cost of removing another fault exceeds the cost of the failures that fault would cause — the engineering decision is to stop there, deliberately."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "FAULT AVOIDANCE", "lead": "Don&rsquo;t introduce the fault in the first place.", "txt": "Development techniques that minimise the possibility of mistakes, or trap mistakes before they result in system faults. The development process is organised so that faults are detected and repaired before delivery.", "src": "P1 · p.6 · p.7"}, {"c": "sand", "lab": "FAULT DETECTION", "lead": "Find and remove residual faults.", "txt": "Verification and validation techniques used to discover and remove faults in a system before it is deployed. Increases the probability of detecting and correcting errors before the system goes into service.", "src": "P1 · p.6 · p.7"}, {"c": "violet", "lab": "FAULT TOLERANCE", "lead": "Keep operating when faults occur.", "txt": "Run-time techniques that ensure system faults do not result in system errors and/or that system errors do not lead to system failures. The system can continue in operation in spite of software failure.", "src": "P1 · p.6 · p.7"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE COST CURVE", "lead": "Residual fault removal grows steeply with time.", "txt": "The cost of finding and removing the last faults rises exponentially as the system matures. At some point the marginal cost of removing another fault exceeds the cost of the failures that fault would cause &mdash; the engineering decision is to stop there, deliberately.", "src": "P1 · p.8"}, {"c": "teal", "lab": "RELIABILITY IN USE", "lead": "Removing X% of faults does not improve reliability by X%.", "txt": "Program defects may be in rarely executed sections of code so may never be encountered by users. Users adapt their behaviour to avoid features that may fail. A program with known faults may still be perceived as reliable by its users.", "src": "P1 · p.16"}]}, {"t": "wide", "c": "sand", "lab": "CLASSIFY TONIGHT&rsquo;S FAILURE", "picker": {"g": "cause", "options": ["Avoidance failure", "Detection failure", "Tolerance failure", "Mixed"]}, "field": {"id": "cause_defeat", "core": false, "rows": 2, "ph": "The test or observation that would defeat this classification &mdash; and whether it exists"}}, {"t": "principle", "c": "mag", "txt": "The nurse who reverted to manual monitoring at 03:52 is not a discipline problem. She is a fault-tolerance feature the design did not provide."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Faults, errors and failures. Most of the room will say Detection because tests missed the bug. The source says faults can sit in rarely executed code (p.16) &mdash; so the failure may be Avoidance: a feature shipped that should not have. Do not correct anyone &mdash; ask which test separates the two, and whether it exists. Usually it does not, and that absence is the real finding.", "appendix": false, "_iscarbRule": "X02 - Fault management and achievement", "route": "core", "showIf": null, "sourceRange": "3–8", "answer": "The cost of finding and removing residual faults grows steeply as the system matures. At some point the marginal cost of removing another fault exceeds the cost of the failures that fault would cause — the engineering decision is to stop there, deliberately. Development techniques that minimise the possibility of mistakes, or trap mistakes before they result in system faults. The development process is organised so that faults are detected and repaired before delivery. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X03", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish the formal definition of reliability from perceived reliability, and name the three things that make them diverge.", "title": "Reliability in use and user perception", "sub": "Reliability can only be defined formally against a specification &mdash; but users do not read specifications, and their perception is what the engineer must answer to.", "blocks": [{"t": "figure", "img": "ch11_iomap", "cap": "p.13 · system as input/output mapping", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "INPUT / OUTPUT", "lead": "A system maps inputs to outputs — and failures live in the mapping.", "txt": "A system is a mapping from inputs to outputs. Failures occur when the actual output differs from the expected output for a given input. The mapping is shaped by the operational environment: same input, different environment, different output."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "RELIABILITY NEEDS A SPEC", "lead": "A failure is a deviation from a specification.", "txt": "Reliability can only be defined formally with respect to a system specification. Many specifications are incomplete or incorrect, so a system that conforms to its spec may still &lsquo;fail&rsquo; from the user&rsquo;s perspective.", "src": "P1 · p.11"}, {"c": "sand", "lab": "USERS DO NOT READ SPECS", "lead": "Perceived reliability is what they actually feel.", "txt": "Users don&rsquo;t read specifications so don&rsquo;t know how the system is supposed to behave. Perceived reliability is more important in practice than the formal definition.", "src": "P1 · p.11"}, {"c": "violet", "lab": "USAGE SHAPES PERCEPTION", "lead": "Same system, different environment, different reliability.", "txt": "Usage of a system in an office is likely to be quite different from usage of the same system in a university environment. Unreliable windscreen wipers in a car may be irrelevant in a dry climate. Failures with serious consequences are given greater weight than failures that are inconvenient.", "src": "P1 · p.12"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "AVAILABILITY PERCEPTION", "lead": "99.95% is not just a percentage.", "txt": "Availability is usually expressed as a percentage of the time the system is available. But it does not take into account the number of users affected by the outage, or the length of the outage. Several short outages are less disruptive than one long one. Long repair times are a particular problem.", "src": "P1 · p.14"}, {"c": "mag", "lab": "RELIABILITY IN USE", "lead": "Removing X% of faults does not improve reliability by X%.", "txt": "Program defects may be in rarely executed sections of code so may never be encountered by users. Users adapt their behaviour to avoid system features that may fail. A program with known faults may still be perceived as reliable by its users.", "src": "P1 · p.16"}]}, {"t": "principle", "c": "mag", "txt": "A specification-correct system can still fail in the user&rsquo;s eyes &mdash; and the user&rsquo;s eyes are the ones the verdict answers to."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Reliability in use and user perception. Two minutes. The pump runs to spec at 03:00 &mdash; the dose-calculation module does what the spec says. What the nurse perceives is a pump that alarms and delivers wrong doses during a holiday weekend shift. The two are different because the spec was not written for tonight&rsquo;s environment. That gap is the slide.", "appendix": false, "_iscarbRule": "X03 - Availability, reliability and perception", "route": "core", "showIf": null, "sourceRange": "9–16", "answer": "A system is a mapping from inputs to outputs. Failures occur when the actual output differs from the expected output for a given input. The mapping is shaped by the operational environment: same input, different environment, different output. Reliability can only be defined formally with respect to a system specification. Many specifications are incomplete or incorrect, so a system that conforms to its spec may still ‘fail’ from the user’s perspective. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X04", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Match each metric to its demand pattern, and say which service in your case it best fits.", "title": "POFOD, ROCOF, MTTF and availability", "sub": "POFOD, ROCOF/MTTF and Availability each fit a different demand pattern. The metric you choose shapes the evidence you owe.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "POFOD", "lead": "Probability of failure on demand.", "txt": "The probability that the system will fail when a service request is made. Useful when demands for service are intermittent and relatively infrequent. Appropriate for protection systems where services are demanded occasionally and where there are serious consequences if the service is not delivered.", "src": "P1 · p.20"}, {"c": "sand", "lab": "ROCOF / MTTF", "lead": "Rate of occurrence of failure / Mean time to failure.", "txt": "ROCOF reflects the rate of occurrence of failure in the system. ROCOF of 0.002 means 2 failures in each 1000 operational time units. Relevant for systems processing a large number of similar requests in a short time (credit card, airline booking). Reciprocal is MTTF, used for systems with long transactions (CAD systems).", "src": "P1 · p.21"}, {"c": "violet", "lab": "AVAILABILITY", "lead": "Fraction of time the system is up, repair included.", "txt": "Takes repair and restart time into account. Availability of 0.998 means software is available for 998 out of 1000 time units. Relevant for non-stop, continuously running systems &mdash; telephone switching, railway signalling.", "src": "P1 · p.22"}]}, {"t": "wide", "c": "sand", "lab": "CHOOSE THE METRIC FOR TONIGHT&rsquo;S PUMP", "picker": {"g": "metric", "options": ["POFOD", "ROCOF", "MTTF", "Availability"]}, "field": {"id": "pump_metric", "core": false, "rows": 2, "ph": "Why this metric fits the pump&rsquo;s demand pattern &mdash; and what evidence it obliges you to produce"}}, {"t": "principle", "txt": "The metric is not a label. It is the shape of the evidence you owe."}, {"t": "wide", "c": "sand", "lab": "UNITS MATTER", "txt": "ROCOF may use time or transaction exposure in the supplied source (slide 71). State the denominator: failures per transaction are not failures per hour. The reciprocal is in the same exposure unit, under a compatible stable-rate interpretation. A sample ratio is a point estimate, not proof of the required population reliability.", "src": "P1 · pp.19–22, 71"}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: POFOD, ROCOF, MTTF and availability. Two minutes. The room usually picks Availability because the pump &lsquo;is up&rsquo;. The pump being up does not mean the dose is correct &mdash; and a wrong dose is a failure on demand. POFOD is the right metric. Do not correct anyone; ask which demand pattern each metric fits, and let the room reach it.", "appendix": false, "_iscarbRule": "X04 - Reliability metrics in depth", "route": "core", "showIf": null, "sourceRange": "17–30", "answer": "The probability that the system will fail when a service request is made. Useful when demands for service are intermittent and relatively infrequent. Appropriate for protection systems where services are demanded occasionally and where there are serious consequences if the service is not delivered. ROCOF reflects the rate of occurrence of failure in the system. ROCOF of 0.002 means 2 failures in each 1000 operational time units. Relevant for systems processing a large number of similar requests in a short time (credit card, airline booking). Reciprocal is MTTF, used for systems with long transactions (CAD systems). Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "There are 6 failures in 20,000 transactions. What can you calculate, and what can you not calculate?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "The observed transaction-normalized rate is 6 / 20,000 = 0.0003 failures per transaction. Failures per hour require elapsed operating time. This is a point estimate under the tested profile, not proof of the population rate.", "timebox": "60 sec", "appendix": false}, {"k": "X05", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Read the four nines of availability as concrete downtime minutes, and name which service needs which level.", "title": "Specifying availability for an ATM", "sub": "The same percentage means very different things in practice &mdash; one minute per week is not the same as 144 minutes per day, and the cost rises steeply with each nine.", "blocks": [{"t": "compare", "head": ["Availability", "What it means", "Unavailability per 24h", "Use case"], "rows": [{"c": "teal", "cells": ["0.9", "90% uptime", "144 minutes/day", "A toy, or a service where downtime is an inconvenience"]}, {"c": "teal", "cells": ["0.99", "99% uptime", "14.4 minutes/day", "Internal tools, batch systems, services with manual workarounds"]}, {"c": "sand", "cells": ["0.999", "99.9% uptime", "84 seconds/day", "Most business systems, ATMs (per the chapter&rsquo;s own spec)"]}, {"c": "mag", "cells": ["0.9999", "99.99% uptime", "8.4 seconds/day", "Critical databases, hospital patient records, financial ledgers"]}]}, {"t": "wide", "c": "mag", "lab": "THE CHAPTER&rsquo;S OWN NUMBERS", "lead": "The ATM database is specified at 0.9999 between 7am and 11pm &mdash; less than 1 minute of downtime per week.", "txt": "The chapter&rsquo;s worked case (Ch.11 p.28) specifies the ATM customer database at 0.9999 between 7am and 11pm, corresponding to downtime of less than 1 minute per week. The individual ATM software is specified at only 0.999 &mdash; between 1 and 2 minutes unavailable per day &mdash; because the database service is critical (failure stops the whole network) while a single ATM failing is local and recoverable.", "field": {"id": "avail_target", "core": false, "rows": 2, "ph": "What availability level does tonight&rsquo;s pump need, and what does that translate to in downtime per shift?"}}, {"t": "principle", "c": "mag", "txt": "Each nine costs an order of magnitude more than the last. The decision is which service earns it."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Specifying availability for an ATM. Two minutes. The trap is the student who picks 0.9999 for everything &ldquo;because it is the best&rdquo;. The chapter&rsquo;s own case (p.28-29) splits the ATM network: 0.9999 for the shared database, 0.999 for the individual machine. The pump is closer to the database &mdash; a single failure affects a patient, not a machine &mdash; but the cost of each nine is real. Make the room name the cost, not just the number.", "appendix": false, "_iscarbRule": "X05 - Availability specification table", "route": "core", "showIf": null, "sourceRange": "17–30", "answer": "The chapter’s worked case (Ch.11 p.28) specifies the ATM customer database at 0.9999 between 7am and 11pm, corresponding to downtime of less than 1 minute per week. The individual ATM software is specified at only 0.999 — between 1 and 2 minutes unavailable per day — because the database service is critical (failure stops the whole network) while a single ATM failing is local and recoverable. Each nine costs an order of magnitude more than the last. The decision is which service earns it. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X06", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Read a published reliability specification, and translate it into the metric, the threshold and the evidence it implies.", "title": "Reliability requirements for an insulin pump", "sub": "The source pp.30 gives a worked reliability specification for an insulin pump. It is also tonight&rsquo;s case &mdash; which makes it the bridge from metric to verdict.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE METRIC", "lead": "POFOD is the right metric for the pump.", "txt": "Probability of failure on demand (POFOD) is the most appropriate metric for an insulin pump, because dose delivery is an intermittent demand with serious consequences. Availability would measure whether the pump is up, not whether the dose is correct.", "src": "P1 · p.30"}, {"c": "mag", "lab": "THE TWO THRESHOLDS", "lead": "Two failure types, two POFOD targets.", "txt": "The source example distinguishes <b>transient failures</b>, recoverable by user action, with an illustrative POFOD target of 0.002, from <b>permanent failures</b>, requiring manufacturer intervention, with a target below 0.00002. These are probabilities per demand, not sample-size prescriptions. Any conversion to failures per year also needs a stated demand frequency.", "src": "P1 · p.30"}]}, {"t": "wide", "c": "sand", "lab": "WHAT THE SPEC OBLIGES YOU TO MEASURE", "lead": "Count the relevant failures and demands under a representative operational profile.", "txt": "Report the failure definition, observed failures, number of demands and uncertainty. An estimate such as 1 failure in 500 demands is not proof that the underlying POFOD meets 0.002. Choose the test size using the target, confidence requirement and statistical assumptions. Test duration alone, or fault injection alone, does not establish operational POFOD. See <a href=\"https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm\">NIST: confidence intervals for proportions</a>.", "field": {"id": "pump_spec", "core": false, "rows": 2, "ph": "For your verdict: which POFOD threshold applies to tonight&rsquo;s two wrong doses, and what test would have caught it?"}}, {"t": "principle", "c": "mag", "txt": "A specification without a measurement is a wish. The chapter gives you the threshold; the evidence is your job."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Reliability requirements for an insulin pump. Distinguish a target probability, its observed estimate and confidence in that estimate. A probability per demand cannot be converted to an annual frequency without demand exposure. Ask what the supplied test record can and cannot support.", "appendix": false, "_iscarbRule": "X06 - Insulin pump reliability specification", "route": "core", "showIf": null, "sourceRange": "17–30", "answer": "Probability of failure on demand (POFOD) is the most appropriate metric for an insulin pump, because dose delivery is an intermittent demand with serious consequences. Availability would measure whether the pump is up, not whether the dose is correct. The source example distinguishes transient failures , recoverable by user action, with an illustrative POFOD target of 0.002, from permanent failures , requiring manufacturer intervention, with a target below 0.00002. These are probabilities per demand, not sample-size prescriptions. Any conversion to failures per year also needs a stated demand frequency. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02A", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain the four families of functional reliability requirements, and identify each one in a worked example.", "title": "Functional reliability requirements", "sub": "Non-functional requirements give you a number. Functional requirements give you the code that earns the number.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · CHECKING", "lead": "Catch incorrect data before it causes a failure.", "txt": "Pre-defined range checks on all operator inputs; the system checks that inputs fall within the pre-defined range.", "src": "P1 · p.31 · RR1"}, {"c": "sand", "lab": "2 · RECOVERY", "lead": "Help the system recover after a failure has occurred.", "txt": "Maintain copies of critical databases on separate servers in separate buildings; transaction mechanisms roll back partial state.", "src": "P1 · p.31 · RR2"}, {"c": "violet", "lab": "3 · REDUNDANCY", "lead": "Specify redundant features the system must include.", "txt": "N-version programming for braking control; multiple independent versions run in parallel with a voter.", "src": "P1 · p.32 · RR3"}, {"c": "mag", "lab": "4 · PROCESS", "lead": "Specify the development process to be used.", "txt": "Implement in a safe subset of Ada and check using static analysis; the process itself is the reliability control.", "src": "P1 · p.32 · RR4"}]}, {"t": "principle", "txt": "A non-functional reliability target is a promise. The functional requirements are the work that keeps it."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Functional reliability requirements. This slide is a visual compression of source pp.31-32. Keep the source labels visible: checking, recovery, redundancy, process. The four RR examples are the bridge from a metric to actual code.", "appendix": false, "_iscarbRule": "X02A - Functional reliability requirements", "route": "core", "showIf": null, "sourceRange": "31–32", "answer": "Pre-defined range checks on all operator inputs; the system checks that inputs fall within the pre-defined range. Maintain copies of critical databases on separate servers in separate buildings; transaction mechanisms roll back partial state. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R09", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain how a multi-channel architecture detects its own failure, and what diversity it needs to do so credibly.", "title": "Protection and self-monitoring", "sub": "When the same computation runs on multiple channels and the results are compared, a mismatch is a failure exception &mdash; before the user sees anything wrong.", "blocks": [{"t": "figure", "img": "ch11_selfmon", "cap": "p.40 · self-monitoring architecture", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "THE PATTERN", "lead": "Multi-channel: same computation, compared at run time.", "txt": "The same computation is carried out on each channel and the results are compared. If identical and on time, the system is correct. If different, a failure exception is raised."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE PATTERN", "lead": "Multi-channel: same computation, compared at run time.", "txt": "The same computation is carried out on each channel and the results are compared. If the results are identical and produced at the same time, the system is assumed correct. If the results differ, a failure is assumed and a failure exception is raised.", "src": "P1 · p.39"}, {"c": "sand", "lab": "WHAT IT REQUIRES", "lead": "Diversity in hardware and software, or it is one channel three times.", "txt": "Hardware in each channel has to be diverse so common-mode hardware failure does not produce the same wrong result on every channel. Software must also be diverse &mdash; otherwise the same software error affects each channel identically. For high availability, several self-checking systems run in parallel.", "src": "P1 · p.41"}]}, {"t": "wide", "c": "mag", "lab": "THE AIRBUS INSTANCE", "lead": "Five computers, any one of which can run the control software &mdash; that is self-monitoring made physical.", "txt": "The Airbus FCS uses 5 separate computers, any one of which can run the control software. Extensive diversity: different processors, different chipsets, different languages, different teams. Software in secondary systems is less complex than in primary, providing only critical functionality.", "src": "P1 · p.42-43"}, {"t": "principle", "txt": "Self-monitoring only works if the channels can fail differently. Same hardware, same software, same fault &mdash; no alarm."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Protection and self-monitoring. Two minutes. The trap is the slide that looks like a single channel twice. A two-channel pump with the same dose module on both channels will fail identically on a design fault &mdash; the comparison will agree on the wrong answer. The diversity is the design decision, not the channel count.", "appendix": false, "_iscarbRule": "RULE 09 - Self-monitoring architectures", "route": "core", "showIf": null, "sourceRange": "33–52", "answer": "The same computation is carried out on each channel and the results are compared. If identical and on time, the system is correct. If different, a failure exception is raised. The same computation is carried out on each channel and the results are compared. If the results are identical and produced at the same time, the system is assumed correct. If the results differ, a failure is assumed and a failure exception is raised. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "The test uses mostly ordinary requests, but production has many retries. Can the measured rate be transferred unchanged?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "No. The operational profile is different. Measure or justify the relevant request mix, test retry behavior and report the scope and statistical uncertainty.", "timebox": "60 sec", "appendix": false}, {"k": "B01", "rule": "", "phase": "LEARN", "accent": "violet", "learn": "Distinguish triple-modular redundancy from N-version programming, and say which assumption each one depends on.", "title": "TMR and N-version programming", "sub": "Hardware fault tolerance uses TMR &mdash; identical components, majority vote. Software fault tolerance uses N-version programming &mdash; independently-developed versions, majority vote.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "two patterns compared, not a single source page"}, "blocks": [{"t": "figure", "img": "ch11_nversion", "cap": "p.47 · N-version programming", "right": [{"t": "cards", "cols": 1, "items": [{"c": "violet", "lab": "N-VERSION", "lead": "Multiple independently-developed versions, majority vote.", "txt": "Multiple versions designed and implemented by different teams. An odd number of computers (typically 3) carry out computations at the same time. Results compared via voting; majority result is correct. Assumes different teams will not make the same mistakes."}]}]}, {"t": "figure", "img": "ch11_tmr", "cap": "p.46 · triple-modular redundancy", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "TMR", "lead": "Three identical components, majority vote.", "txt": "Three replicated identical components receive the same input and their outputs are compared. If one output differs, it is ignored and component failure is assumed. Based on the assumption that most faults are component failures rather than design faults."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "TRIPLE-MODULAR REDUNDANCY (TMR)", "lead": "Three identical components receive the same input.", "txt": "Outputs are compared. If one output differs, it is ignored and component failure is assumed. Based on the assumption that most faults result from component failures rather than design faults, and a low probability of simultaneous component failure.", "src": "P1 · p.45"}, {"c": "violet", "lab": "N-VERSION PROGRAMMING", "lead": "Multiple versions designed and implemented by different teams.", "txt": "An odd number of computers (typically 3) carry out computations at the same time. Results are compared using a voting system; the majority result is taken as correct. Assumes that different teams will not make the same mistakes.", "src": "P1 · p.44 · p.47"}]}, {"t": "cards", "cols": 3, "items": [{"c": "sand", "lab": "WHAT TMR CATCHES", "txt": "A single component failing &mdash; hardware wear-out, transient faults, manufacturing defects."}, {"c": "sand", "lab": "WHAT N-VERSION CATCHES", "txt": "A single team&rsquo;s design fault &mdash; algorithm mistake, spec misinterpretation, language-level bug."}, {"c": "mag", "lab": "WHAT NEITHER CATCHES", "txt": "A specification error propagated to every version, or common cultural mistakes teams make in the same place."}]}, {"t": "principle", "c": "mag", "txt": "TMR assumes hardware faults are independent. N-version assumes software faults are independent. Both assumptions can be wrong."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: TMR and N-version programming. Ninety seconds, and the slide exists because the two patterns are usually taught as if interchangeable. They are not: TMR is the answer to a hardware question, N-version to a software question, and neither is the answer to a specification question. The third card is the one to spend time on &mdash; it is where most real fault-tolerant systems actually fail.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "33–52", "answer": "Multiple versions designed and implemented by different teams. An odd number of computers (typically 3) carry out computations at the same time. Results compared via voting; majority result is correct. Assumes different teams will not make the same mistakes. Three replicated identical components receive the same input and their outputs are compared. If one output differs, it is ignored and component failure is assumed. Based on the assumption that most faults are component failures rather than design faults. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R08", "answer": "Airbus uses 5 computers across primary and secondary channels with different processors, different chipsets and different programming languages. POFOD for the loss of flight control is bounded by the diversity: a single design fault cannot defeat all 5 computers at once. The lesson for tonight's pump: a single-channel pump has no defense against a single design fault in the dose-calculation module. Either accept the residual risk explicitly, or build a diverse redundant channel. There is no third option.", "rule": "", "phase": "LEARN", "accent": "mag", "learn": "Read a published fault-tolerant architecture and extract the design decision that bounds its POFOD.", "title": "Diversity in the Airbus architecture", "sub": "The Airbus flight control system is the chapter&rsquo;s worked example of fault tolerance under serious consequences &mdash; and it bounds POFOD by diversity rather than by perfect code.", "blocks": [{"t": "figure", "img": "ch11_airbus", "cap": "p.42 · Airbus FCS architecture", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "THE ARCHITECTURE", "lead": "Five computers, any one of which can run the control software.", "txt": "The Airbus FCS uses 5 separate computers, any one of which can run the control software. Extensive diversity: different processors, different chipsets, different languages, different teams. Software in secondary systems is less complex than in primary, providing only critical functionality."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE ARCHITECTURE", "lead": "Five computers, any one of which can run the control software.", "txt": "Primary systems use a different processor from the secondary systems. Primary and secondary use chipsets from different manufacturers. Software in each channel is developed in different programming languages by different teams. Software in secondary systems is less complex &mdash; provides only critical functionality.", "src": "P1 · p.43"}, {"c": "sand", "lab": "THE DIVERSITY DECISION", "lead": "Redundancy without diversity is one system wearing two coats.", "txt": "A common-mode fault &mdash; one processor erratum, one compiler bug, one shared specification error &mdash; would defeat every identical channel at once. Diversity is the only defense against common-mode faults. The Airbus FCS uses it on every layer: hardware, software, even team.", "src": "P1 · p.43 · p.49"}]}, {"t": "wide", "c": "violet", "lab": "THE QUESTION FOR TONIGHT", "lead": "The pump has one dose-calculation module. What does the Airbus case say about that?", "field": {"id": "airbus_lesson", "core": false, "rows": 3, "ph": "What diversity would you need to add to the pump, and at what cost?"}}, {"t": "principle", "txt": "Fault tolerance without diversity is not fault tolerance."}], "timebox": "", "task": "Name one layer of the pump that would need diversity to match the Airbus standard, and what it would cost.", "notes": "Teaching focus: Diversity in the Airbus architecture. Three minutes. The point is not that the pump should be an aircraft &mdash; it is that the chapter&rsquo;s worked case makes diversity concrete, and the pump is the case where diversity was not added. A student who says &ldquo;we cannot afford Airbus-level diversity&rdquo; has answered the right question. A student who says &ldquo;our pump is fine as it is&rdquo; has not.", "appendix": false, "_iscarbRule": "RULE 08 - 60-second source case", "route": "core", "showIf": null, "sourceRange": "33–52"}, {"k": "R18", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Name the eight dependable programming guidelines and identify which one tonight&rsquo;s failure violated.", "title": "Eight dependable programming practices", "sub": "Reliability is not only architecture. The chapter names eight programming practices that reduce the incidence of faults.", "blocks": [{"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.11 &mdash; the eight guidelines", "items": [{"c": "teal", "lab": "1 · VISIBILITY", "lead": "Limit what each component can see.", "txt": "Program components should only be allowed access to data that they need. Accidental corruption of unrelated state becomes impossible.", "src": "P1 · p.56"}, {"c": "teal", "lab": "2 · INPUT VALIDITY", "lead": "Check all inputs against assumptions.", "txt": "Specifications rarely define what to do if an input is not consistent with assumptions. Always check inputs before processing &mdash; range, size, representation, reasonableness.", "src": "P1 · p.57-58"}, {"c": "teal", "lab": "3 · EXCEPTION HANDLERS", "lead": "Provide a handler for all exceptions.", "txt": "Exception handling constructs let unexpected events be handled without continual status checking. Three strategies: signal the caller, alternative processing, or pass to runtime support.", "src": "P1 · p.59-61"}, {"c": "teal", "lab": "4 · ERROR-PRONE CONSTRUCTS", "lead": "Minimise goto, pointers, dynamic memory, parallelism, recursion, interrupts, inheritance, aliasing, unbounded arrays, default input.", "txt": "These constructs are where programmers lose track of relationships. Each one has a documented failure mode; minimise each one.", "src": "P1 · p.62-65"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "not in the chapter &mdash; your context", "items": [{"c": "sand", "lab": "5 · RESTART", "lead": "Provide restart capabilities for long transactions.", "txt": "For systems with long transactions or user interactions, provide a restart that lets the system recover without users redoing everything. Save state periodically.", "src": "P1 · p.66"}, {"c": "sand", "lab": "6 · ARRAY BOUNDS", "lead": "Check array bounds &mdash; always.", "txt": "In C, you can address memory outside an array declaration. This is the bounded-buffer vulnerability. If your language does not bound-check, do it yourself.", "src": "P1 · p.67"}, {"c": "sand", "lab": "7 · TIMEOUTS", "lead": "Include timeouts on all external calls.", "txt": "In a distributed system, failure of a remote computer can be silent. Always include timeouts on calls to external components; assume failure and recover after the timeout.", "src": "P1 · p.68"}, {"c": "sand", "lab": "8 · NAMED CONSTANTS", "lead": "Name all constants that represent real-world values.", "txt": "Always give constants names rather than using their numeric values. Less likely to type the wrong value, and the change lives in one place when the &lsquo;constant&rsquo; changes.", "src": "P1 · p.69"}]}}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S FAILURE &mdash; WHICH GUIDELINE DID IT VIOLATE?", "lead": "The pump added 1 to the previous dose without bounding the input. That is two guidelines broken in one line.", "txt": "The dose-calculation module accepted an input without checking it against a pre-defined range (guideline 2 &mdash; input validity) and stored the result in a variable visible to a component that should not have seen it (guideline 1 &mdash; visibility). Two guidelines, one bug, one wrong dose. Pick any one of the eight and ask which line of tonight&rsquo;s code violates it &mdash; the answer is the design change.", "field": {"id": "guideline", "core": false, "rows": 2, "ph": "Which guideline did tonight&rsquo;s failure violate, and what design change enforces it?"}}, {"t": "principle", "txt": "Dependable programming is not about being clever. It is about making the wrong thing hard to write."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Eight dependable programming practices. Two minutes. The eight guidelines are not equal: input validity (2) and exception handlers (3) are the two that would have caught tonight&rsquo;s failure. Spend the time on those two, not on a tour of all eight. The magenta card is the bridge from guideline to code &mdash; make every student name a specific line of code that violates a specific guideline. A student who says &ldquo;we should test more&rdquo; has not answered; push for which of the eight.", "appendix": false, "_iscarbRule": "RULE 18 - Dependable programming guidelines", "route": "core", "showIf": null, "sourceRange": "53–69", "answer": "Program components should only be allowed access to data that they need. Accidental corruption of unrelated state becomes impossible. Specifications rarely define what to do if an input is not consistent with assumptions. Always check inputs before processing — range, size, representation, reasonableness. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X09", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain statistical testing for reliability, and say why an operational profile is required and how it is built.", "title": "Statistical reliability testing", "sub": "To assess the reliability of a system, you have to collect data about its operation. Statistical testing runs the program with data that matches an operational profile and measures the failure rate.", "blocks": [{"t": "figure", "img": "ch11_relmeasure", "cap": "p.74 · reliability measurement", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "RELIABILITY MEASUREMENT", "lead": "Three measurements, three metrics.", "txt": "For POFOD: count failures per demand. For ROCOF/MTTF: time or transactions between failures. For Availability: repair and restart time after failure. The choice of measurement follows from the choice of metric."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "WHAT STATISTICAL TESTING IS", "lead": "Test for reliability, not for fault detection.", "txt": "Reliability testing (statistical testing) involves running the program to assess whether or not it has reached the required level of reliability. This cannot normally be included as part of a normal defect testing process because data for defect testing is (usually) atypical of actual usage data. Reliability measurement therefore requires a specially designed data set that replicates the pattern of inputs to be processed by the system.", "src": "P1 · p.72-73"}, {"c": "sand", "lab": "THE OPERATIONAL PROFILE", "lead": "A test data set whose frequency matches actual usage.", "txt": "An operational profile is a set of test data whose frequency matches the actual frequency of these inputs from &lsquo;normal&rsquo; usage of the system. A close match with actual usage is necessary otherwise the measured reliability will not be reflected in the actual usage of the system. It can be generated from real data collected from an existing system or (more often) depends on assumptions made about the pattern of usage of a system.", "src": "P1 · p.76"}]}, {"t": "cards", "cols": 2, "items": [{"c": "violet", "lab": "THE DATA YOU COLLECT", "lead": "Three measurements, three metrics.", "txt": "<b>For POFOD:</b> the number of system failures given a number of requests for system services &mdash; irrespective of the time over which demands are made. <b>For ROCOF / MTTF:</b> the time or number of transactions between system failures, plus the total elapsed time or total number of transactions. <b>For Availability:</b> the repair or restart time after a system failure that leads to loss of service. Availability depends on the time between failures AND the time to get the system back into operation.", "src": "P1 · p.71"}, {"c": "mag", "lab": "WHY A LAB SOAK IS NOT A PROFILE", "lead": "Tonight&rsquo;s gap, made concrete.", "txt": "A 24-hour lab soak test is atypical data: it runs the same inputs in the same order, with no demand-pattern variation. The operational profile of an ICU pump at 03:00 on a holiday weekend is nothing like a lab soak. That is why the release&rsquo;s 24-hour test could not have produced a measured POFOD under real demand &mdash; and the safety case signed off on a target it never measured.", "src": "P1 · p.72 · p.77"}]}, {"t": "principle", "c": "mag", "txt": "A reliability measurement without an operational profile is a number with no domain. It tells you nothing about the system in use."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Statistical reliability testing. Two minutes. This is the unit that closes the loop between the metrics (X04, X06) and the verdict. The room has been told POFOD is the right metric for the pump; this slide tells them how POFOD is actually measured &mdash; and why a 24-hour lab soak cannot produce it. The magenta card is the bridge to tonight: the release was tested against atypical data, so its measured reliability has no domain. A student who says &ldquo;we need more tests&rdquo; has not answered; push for which operational profile.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "70–81", "answer": "For POFOD: count failures per demand. For ROCOF/MTTF: time or transactions between failures. For Availability: repair and restart time after failure. The choice of measurement follows from the choice of metric. Reliability testing (statistical testing) involves running the program to assess whether or not it has reached the required level of reliability. This cannot normally be included as part of a normal defect testing process because data for defect testing is (usually) atypical of actual usage data. Reliability measurement therefore requires a specially designed data set that replicates the pattern of inputs to be processed by the system. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X10", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the four practical problems with reliability measurement, and say which one tonight&rsquo;s release suffered from.", "title": "Operational profiles and measurement uncertainty", "sub": "Statistical testing is the right approach, but four practical problems make it difficult to apply. Tonight&rsquo;s release suffered from at least three of them.", "blocks": [{"t": "figure", "img": "ch11_opprofile", "cap": "p.77 · operational profile", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "OPERATIONAL PROFILE", "lead": "Test data whose frequency matches actual usage.", "txt": "An operational profile is a set of test data whose frequency matches the actual frequency of inputs from normal usage. Without it, the measured reliability is a number with no domain — it tells you nothing about the system in use."}]}]}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · OPERATIONAL PROFILE UNCERTAINTY", "lead": "The profile may not match real use.", "txt": "The operational profile may not be an accurate reflection of the real use of the system. For a new system, the pattern of usage is unknown. For an existing system, usage changes as users learn the system and adapt behaviour. The profile is a model, and the model can be wrong.", "src": "P1 · p.75"}, {"c": "sand", "lab": "2 · HIGH COSTS OF TEST DATA", "lead": "Generating the profile is expensive.", "txt": "Costs can be very high if the test data for the system cannot be generated automatically. Building an operational profile for an ICU insulin pump requires real dose logs from real patients &mdash; which is exactly the data the team did not have.", "src": "P1 · p.75"}, {"c": "violet", "lab": "3 · STATISTICAL UNCERTAINTY", "lead": "Highly reliable systems rarely fail.", "txt": "You need a statistically significant number of failures to compute the reliability but highly reliable systems will rarely fail. A pump with a target POFOD of 0.00002 would need 50,000 demands to observe a single failure on average &mdash; a test campaign no team can afford.", "src": "P1 · p.75"}, {"c": "mag", "lab": "4 · RECOGNISING FAILURE", "lead": "It is not always obvious when a failure occurred.", "txt": "It is not always obvious when a failure has occurred as there may be conflicting interpretations of a specification. A dose that is technically within range but clinically inappropriate for this patient &mdash; is that a failure? The spec says no; the patient says yes.", "src": "P1 · p.75"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "OPERATIONAL PROFILE GENERATION", "lead": "Should be automatic, but rarely is.", "txt": "Operational profiles should be generated automatically whenever possible. Automatic profile generation is difficult for interactive systems. May be straightforward for &lsquo;normal&rsquo; inputs but it is difficult to predict &lsquo;unlikely&rsquo; inputs and to create test data for them. Pattern of usage of new systems is unknown. Operational profiles are not static but change as users learn about a new system and change the way that they use it.", "src": "P1 · p.78"}, {"c": "sand", "lab": "TONIGHT&rsquo;S RELEASE SUFFERED FROM", "lead": "Three of the four, at least.", "txt": "<b>Profile uncertainty:</b> the release was tested against a lab soak, not an ICU profile. <b>High test data costs:</b> the team had no real ICU dose logs to build a profile from. <b>Statistical uncertainty:</b> 400 tests on CurrentDose cannot produce a POFOD of 0.00002. <b>Recognising failure:</b> until the child was found unresponsive, the cumulative overdose was not recognised as a failure &mdash; the alarm did not sound.", "src": "P1 · p.75 · p.78"}]}, {"t": "principle", "c": "mag", "txt": "Reliability measurement is not impossible. It is hard &mdash; and the hardness is the engineering decision, not a reason to skip the measurement."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Operational profiles and measurement uncertainty. Two minutes. This is the slide that turns &ldquo;we cannot measure reliability perfectly&rdquo; from an excuse into a design input. Each of the four problems has a partial answer: profile uncertainty is reduced by collecting real usage data; test data costs are reduced by automatic profile generation; statistical uncertainty is addressed by longer test campaigns or stress testing; failure recognition is addressed by clearer specifications and runtime anomaly detection. A student who says &ldquo;reliability is hard to measure&rdquo; has not answered; push for which of the four, and what partial answer exists.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "70–81", "answer": "An operational profile is a set of test data whose frequency matches the actual frequency of inputs from normal usage. Without it, the measured reliability is a number with no domain — it tells you nothing about the system in use. The operational profile may not be an accurate reflection of the real use of the system. For a new system, the pattern of usage is unknown. For an existing system, usage changes as users learn the system and adapt behaviour. The profile is a model, and the model can be wrong. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "A hospital insulin pump software update went live at 03:00, on a holiday weekend."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is a measured POFOD for the dose-calculation module under peak ICU demand, computed from a fault-injection test on the previous version. It distinguishes a real reliability regression from a single operator-reported incident. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming automatic operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "READING", "title": "Required self-study · pages, purpose and deadline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Required self-study · before the assignment and next chapter discussion.</b> Read the two selections below, attempt the five-question check, and use one assigned source slide to support the assignment artifact. Blackboard provides the calendar deadline.</p><p><b>Time budget:</b> initially 15–25 minutes including the check; record actual time. These replace unfocused source browsing. The original source ledger remains available for clarification and unfinished classroom topics.</p></div><div class=\"lp-reading-row\"><h3>Reliability metrics and requirements</h3><p>Original source slides 19–24</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"19\">Slide 19</button><button class=\"lp-btn\" data-source-slide=\"20\">Slide 20</button><button class=\"lp-btn\" data-source-slide=\"21\">Slide 21</button><button class=\"lp-btn\" data-source-slide=\"22\">Slide 22</button><button class=\"lp-btn\" data-source-slide=\"23\">Slide 23</button><button class=\"lp-btn\" data-source-slide=\"24\">Slide 24</button></div></div><div class=\"lp-reading-row\"><h3>Measurement and operational profiles</h3><p>Original source slides 70–75</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"70\">Slide 70</button><button class=\"lp-btn\" data-source-slide=\"71\">Slide 71</button><button class=\"lp-btn\" data-source-slide=\"72\">Slide 72</button><button class=\"lp-btn\" data-source-slide=\"73\">Slide 73</button><button class=\"lp-btn\" data-source-slide=\"74\">Slide 74</button><button class=\"lp-btn\" data-source-slide=\"75\">Slide 75</button></div></div><p class=\"lp-study-note\"><b>Observable work:</b> identify the source slide and explain how its concept changes or supports your artifact. A citation or a checked box alone is insufficient. In the next class, be ready to explain a related example in your own words.</p><p class=\"lp-study-note\"><b>Assessment scope:</b> all five chapter objectives, the classroom route and these named selections. Full source examples support this scope; archived administrative/title slides and optional toolkit activities are not extra assessed requirements. The instructor must announce any further assigned source topic in Blackboard before assessing it.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"PREP\">Attempt the five-objective check</button><button class=\"lp-btn\" data-jump=\"C01\">Full source map</button></div>"}], "noAnswer": true, "appendix": true}, {"k": "PREP", "title": "Check all five objectives", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<p class=\"lp-study-note\">One question per chapter objective, in the same order as the five objectives. Attempt all five before opening feedback. Retry after reviewing an error. This public practice is not a secure test; the instructor uses a changed example during class.</p><form id=\"prepQuiz\" class=\"lp-prep\"><fieldset><legend>LO 1 · Which expression has units of failures per operating hour?</legend><label><input type=\"radio\" name=\"prep-0\" value=\"0\">Downtime / total time</label><label><input type=\"radio\" name=\"prep-0\" value=\"1\">Failed requests / total requests</label><label><input type=\"radio\" name=\"prep-0\" value=\"2\">Failures / operating hours</label><p hidden data-prep-feedback id=\"prep-feedback-0\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 2 · Which is a functional reliability requirement?</legend><label><input type=\"radio\" name=\"prep-1\" value=\"0\">The system shall detect a failed sensor and switch to the backup</label><label><input type=\"radio\" name=\"prep-1\" value=\"1\">Availability shall be 99.9%</label><label><input type=\"radio\" name=\"prep-1\" value=\"2\">The observed failure rate is 0.001</label><p hidden data-prep-feedback id=\"prep-feedback-1\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 3 · What can undermine majority voting?</legend><label><input type=\"radio\" name=\"prep-2\" value=\"0\">An odd number of versions</label><label><input type=\"radio\" name=\"prep-2\" value=\"1\">A common specification error across versions</label><label><input type=\"radio\" name=\"prep-2\" value=\"2\">Recording disagreements</label><p hidden data-prep-feedback id=\"prep-feedback-2\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 4 · A routine can receive an out-of-range index. Which action is dependable programming?</legend><label><input type=\"radio\" name=\"prep-3\" value=\"0\">Assume callers are correct</label><label><input type=\"radio\" name=\"prep-3\" value=\"1\">Suppress every exception without a record</label><label><input type=\"radio\" name=\"prep-3\" value=\"2\">Validate the range and handle a documented error</label><p hidden data-prep-feedback id=\"prep-feedback-3\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 5 · A test has few retries but production has many. What is required?</legend><label><input type=\"radio\" name=\"prep-4\" value=\"0\">Justify or retest the operational profile before generalizing</label><label><input type=\"radio\" name=\"prep-4\" value=\"1\">Use uptime as a replacement for correctness</label><label><input type=\"radio\" name=\"prep-4\" value=\"2\">Ignore the request mix</label><p hidden data-prep-feedback id=\"prep-feedback-4\" class=\"prep-feedback\"></p></fieldset><button type=\"button\" class=\"lp-btn\" id=\"checkPrep\">Check my five answers</button><div id=\"prepStatus\" role=\"status\" aria-live=\"polite\">Attempt first. Feedback is initially hidden.</div></form>"}], "noAnswer": true, "appendix": true}, {"k": "C01", "title": "Source coverage and study checklist", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>81 supplied slides indexed.</b> Every original topic has a classroom location and a source review location. This map records material availability, not time actually taught or student mastery.</p><p>Five chapter objectives connect to supplied syllabus CLO 1, 2, 3. Original concepts remain required even when detailed examples are completed after class.</p></div><div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Original topic</th><th>Source slides</th><th>Classroom location</th><th>Full source</th></tr></thead><tbody><tr><td>Opening and source outline</td><td>1–2</td><td><button class=\"lp-btn\" data-jump=\"START\">Your route through this chapter</button></td><td><button class=\"lp-btn\" data-jump=\"SRC00\">Read source</button></td></tr><tr><td>Faults, failures and management</td><td>3–8</td><td><button class=\"lp-btn\" data-jump=\"X01\">Reliability and fault management</button> · <button class=\"lp-btn\" data-jump=\"X02\">Faults, errors and failures</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Reliability, availability and perception</td><td>9–16</td><td><button class=\"lp-btn\" data-jump=\"X03\">Reliability in use and user perception</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Metrics and quantitative requirements</td><td>17–30</td><td><button class=\"lp-btn\" data-jump=\"X04\">POFOD, ROCOF, MTTF and availability</button> · <button class=\"lp-btn\" data-jump=\"X05\">Specifying availability for an ATM</button> · <button class=\"lp-btn\" data-jump=\"X06\">Reliability requirements for an insulin pump</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Functional reliability requirements</td><td>31–32</td><td><button class=\"lp-btn\" data-jump=\"X02A\">Functional reliability requirements</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr><tr><td>Fault-tolerant architectures and diversity</td><td>33–52</td><td><button class=\"lp-btn\" data-jump=\"R09\">Protection and self-monitoring</button> · <button class=\"lp-btn\" data-jump=\"B01\">TMR and N-version programming</button> · <button class=\"lp-btn\" data-jump=\"R08\">Diversity in the Airbus architecture</button></td><td><button class=\"lp-btn\" data-jump=\"SRC05\">Read source</button></td></tr><tr><td>Dependable programming</td><td>53–69</td><td><button class=\"lp-btn\" data-jump=\"R18\">Eight dependable programming practices</button></td><td><button class=\"lp-btn\" data-jump=\"SRC06\">Read source</button></td></tr><tr><td>Measurement and operational profiles</td><td>70–81</td><td><button class=\"lp-btn\" data-jump=\"X09\">Statistical reliability testing</button> · <button class=\"lp-btn\" data-jump=\"X10\">Operational profiles and measurement uncertainty</button></td><td><button class=\"lp-btn\" data-jump=\"SRC07\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 11 – Reliability Engineering</summary><div class=\"lp-source-text\"></div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\nAvailability and reliability\nReliability requirements\nFault-tolerant architectures\nProgramming for reliability\nReliability measurement</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "Faults, failures and management", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–8. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · Software reliability</summary><div class=\"lp-source-text\">Software reliability\nIn general, software customers expect all software to be dependable. However, for non-critical applications, they may be willing to accept some system failures.\nSome applications (critical systems) have very high reliability requirements and special software engineering techniques may be used to achieve this.\nMedical systems\nTelecommunications and power systems\nAerospace systems\n</div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · Faults, errors and failures</summary><div class=\"lp-source-text\">Faults, errors and failures</div><div class=\"lp-tablewrap\"><table><tr><td>Term</td><td>Description</td></tr><tr><td>Human error or<br>mistake</td><td>Human behavior that results in the introduction of faults into a system. For example, in the wilderness weather system, a programmer might decide that the way to compute the time for the next transmission is to add 1 hour to the current time. This works except when the transmission time is between 23.00 and midnight (midnight is 00.00 in the 24-hour clock).</td></tr><tr><td>System fault</td><td>A characteristic of a software system that can lead to a system error. The fault is the inclusion of the code to add 1 hour to the time of the last transmission, without a check if the time is greater than or equal to 23.00.</td></tr><tr><td>System error</td><td>An erroneous system state that can lead to system behavior that is unexpected by system users. The value of transmission time is set incorrectly (to 24.XX rather than 00.XX) when the faulty code is executed.</td></tr><tr><td>System failure</td><td>An event that occurs at some point in time when the system does not deliver a service as expected by its users. No weather data is transmitted because the time is invalid.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · Faults and failures</summary><div class=\"lp-source-text\">Faults and failures\nFailures are a usually a result of system errors that are derived from faults in the system\nHowever, faults do not necessarily result in system errors\nThe erroneous system state resulting from the fault may be transient and ‘corrected’ before an error arises.\nThe faulty code may never be executed.\nErrors do not necessarily lead to system failures\nThe error can be corrected by built-in error detection and recovery \nThe failure can be protected against by built-in protection facilities. These may, for example, protect system resources from system errors</div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · Fault management</summary><div class=\"lp-source-text\">Fault management\nFault avoidance\nThe system is developed in such a way that human error is avoided and thus system faults are minimised.\nThe development process is organised so that faults in the system are detected and repaired before delivery to the customer.\nFault detection\nVerification and validation techniques are used to discover and remove faults in a system before it is deployed.\nFault tolerance\nThe system is designed so that faults in the delivered software do not result in system failure.</div></details><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · Reliability achievement</summary><div class=\"lp-source-text\">Reliability achievement\nFault avoidance\nDevelopment technique are used that either minimise the possibility of mistakes or trap mistakes before they result in the introduction of system faults.\nFault detection and removal\nVerification and validation techniques are used that increase the probability of detecting and correcting errors before the system goes into service are used.\nFault tolerance\nRun-time techniques are used to ensure that system faults do not result in system errors and/or that system errors do not lead to system failures.</div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · The increasing costs of residual fault removal </summary><div class=\"lp-source-text\">The increasing costs of residual fault removal </div></details>"}], "noAnswer": true, "sourceRange": "3–8", "appendix": true}, {"k": "SRC02", "title": "Reliability, availability and perception", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 9–16. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · Availability and reliability</summary><div class=\"lp-source-text\">Availability and reliability</div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · Availability and reliability</summary><div class=\"lp-source-text\">Availability and reliability\n\nReliability\nThe probability of failure-free system operation over a specified time in a given environment for a given purpose\nAvailability\nThe probability that a system, at a point in time, will be operational and able to deliver the requested services\nBoth of these attributes can be expressed quantitatively e.g. availability of 0.999 means that the system is up and running for 99.9% of the time. </div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · Reliability and specifications</summary><div class=\"lp-source-text\">Reliability and specifications\nReliability can only be defined formally with respect to a system specification i.e. a failure is a deviation from a specification.\nHowever, many specifications are incomplete or incorrect – hence, a system that conforms to its specification may ‘fail’ from the perspective of system users.\nFurthermore, users don’t read specifications so don’t know how the system is supposed to behave.\nTherefore perceived reliability is more important in practice.</div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Perceptions of reliability</summary><div class=\"lp-source-text\">Perceptions of reliability\nThe formal definition of reliability does not always reflect the user’s perception of a system’s reliability\nThe assumptions that are made about the environment where a system will be used may be incorrect\nUsage of a system in an office environment is likely to be quite different from usage of the same system in a university environment\nThe consequences of system failures affects the perception of reliability\nUnreliable windscreen wipers in a car may be irrelevant in a dry climate\nFailures that have serious consequences (such as an engine breakdown in a car) are given greater weight by users than failures that are inconvenient</div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · A system as an input/output mapping </summary><div class=\"lp-source-text\">A system as an input/output mapping </div></details><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Availability perception</summary><div class=\"lp-source-text\">Availability perception\nAvailability is usually expressed as a percentage of the time that the system is available to deliver services e.g. 99.95%.\nHowever, this does not take into account two factors:\nThe number of users affected by the service outage. Loss of service in the middle of the night is less important for many systems than loss of service during peak usage periods.\nThe length of the outage. The longer the outage, the more the disruption. Several short outages are less likely to be disruptive than 1 long outage. Long repair times are a particular problem.</div></details><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Software usage patterns </summary><div class=\"lp-source-text\">Software usage patterns </div></details><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · Reliability in use</summary><div class=\"lp-source-text\">Reliability in use\nRemoving X% of the faults in a system will not necessarily improve the reliability by X%. \nProgram defects may be in rarely executed sections of the code so may never be encountered by users. Removing these does not affect the perceived reliability.\nUsers adapt their behaviour to avoid system features that may fail for them.\nA program with known faults may therefore still be perceived as reliable by its users.</div></details>"}], "noAnswer": true, "sourceRange": "9–16", "appendix": true}, {"k": "SRC03", "title": "Metrics and quantitative requirements", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 17–30. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch11-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · Reliability requirements</summary><div class=\"lp-source-text\">Reliability requirements\n</div></details><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · System reliability requirements</summary><div class=\"lp-source-text\">System reliability requirements\nFunctional reliability requirements define system and software functions that avoid, detect or tolerate faults in the software and so ensure that these faults do not lead to system failure.\nSoftware reliability requirements may also be included to cope with hardware failure or operator error.\nReliability is a measurable system attribute so non-functional reliability requirements may be specified quantitatively. These define the number of failures that are acceptable during normal use of the system or the time in which the system must be available. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · Reliability metrics</summary><div class=\"lp-source-text\">Reliability metrics\nReliability metrics are units of measurement of system reliability.\nSystem reliability is measured by counting the number of operational failures and, where appropriate, relating these to the demands made on the system and the time that the system has been operational.\nA long-term measurement programme is required to assess the reliability of critical systems.\nMetrics\nProbability of failure on demand\nRate of occurrence of failures/Mean time to failure\nAvailability</div></details><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Probability of failure on demand (POFOD)</summary><div class=\"lp-source-text\">Probability of failure on demand (POFOD)\nThis is the probability that the system will fail when a service request is made. Useful when demands for service are intermittent and relatively infrequent.\nAppropriate for protection systems where services are demanded occasionally and where there are serious consequence if the service is not delivered.\nRelevant for many safety-critical systems with exception management components\nEmergency shutdown system in a chemical plant.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · Rate of fault occurrence (ROCOF)</summary><div class=\"lp-source-text\">Rate of fault occurrence (ROCOF)\nReflects the rate of occurrence of failure in the system.\nROCOF of 0.002 means 2 failures are likely in each 1000 operational time units e.g. 2 failures per 1000 hours of operation.\nRelevant for systems where the system has to process a large number of similar requests in a short time\nCredit card processing system, airline booking system.\nReciprocal of ROCOF is Mean time to Failure (MTTF)\nRelevant for systems with long transactions i.e. where system processing takes a long time (e.g. CAD systems). MTTF should be longer than expected transaction length.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · Availability</summary><div class=\"lp-source-text\">Availability\nMeasure of the fraction of the time that the system is available for use.\nTakes repair and restart time into account\nAvailability of 0.998 means software is available for 998 out of 1000 time units.\nRelevant for non-stop, continuously running systems \ntelephone switching systems, railway signalling systems.</div></details><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · Availability specification </summary><div class=\"lp-source-text\">Availability specification </div><div class=\"lp-tablewrap\"><table><tr><td>Availability</td><td>Explanation</td></tr><tr><td>0.9</td><td>The system is available for 90% of the time. This means that, in a 24-hour period (1,440 minutes), the system will be unavailable for 144 minutes.</td></tr><tr><td>0.99</td><td>In a 24-hour period, the system is unavailable for 14.4 minutes. </td></tr><tr><td>0.999</td><td>The system is unavailable for 84 seconds in a 24-hour period.</td></tr><tr><td>0.9999</td><td>The system is unavailable for 8.4 seconds in a 24-hour period. Roughly, one minute per week.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · Non-functional reliability requirements</summary><div class=\"lp-source-text\">Non-functional reliability requirements\nNon-functional reliability requirements are specifications of the required reliability and availability of a system using one of the reliability metrics (POFOD, ROCOF or AVAIL).\nQuantitative reliability and availability specification has been used for many years in safety-critical systems but is uncommon for business critical systems. \nHowever, as more and more companies demand 24/7 service from their systems, it makes sense for them to be precise about their reliability and availability expectations. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · Benefits of reliability specification</summary><div class=\"lp-source-text\">Benefits of reliability specification\nThe process of deciding the required level of the reliability helps to clarify what stakeholders really need.\nIt provides a basis for assessing when to stop testing a system. You stop when the system has reached its required reliability level.\nIt is a means of assessing different design strategies intended to improve the reliability of a system.  \nIf a regulator has to approve a system (e.g. all systems that are critical to flight safety on an aircraft are regulated), then evidence that a required reliability target has been met is important for system certification. </div></details><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Specifying reliability requirements</summary><div class=\"lp-source-text\">Specifying reliability requirements\nSpecify the availability and reliability requirements for different types of failure. There should be a lower probability of high-cost failures than failures that don’t have serious consequences.\nSpecify the availability and reliability requirements for different types of system service. Critical system services should have the highest reliability but you may be willing to tolerate more failures in less critical services. \nThink about whether a high level of rel
