function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- locale tokens ----------------------------------------------------
   Every institution-specific name — country, regulator, accreditation body,
   national test, contact — is written ONCE in LECTURE.context and referenced as
   {{token}} anywhere in the lecture. An adopter in another country edits that one
   block and the whole hour follows. CTX-01 in tools/audit.mjs blocks a build that
   still contains an unresolved token, and warns when a known body name is typed
   into a slide instead of being declared here. */
/* An Arabic or Hebrew lecture sets dir:'rtl' and the whole hour flips: the
   engine holds no left/right assumptions the data cannot override. lang feeds
   the html attribute so a screen reader picks the right voice. */
(function(){
  var st=document.getElementById('stage');
  st.setAttribute('dir', LECTURE.dir||'ltr');
  st.setAttribute('lang', LECTURE.lang||'en');
  if(LECTURE.font) st.style.setProperty('--body', LECTURE.font);
  if(LECTURE.fontDisplay) st.style.setProperty('--disp', LECTURE.fontDisplay);
})();

/* Chrome the engine writes on its own behalf still has to be translatable, so
   it goes through the same {{token}} path as everything else — but with a
   default underneath, because an adopter should never have to declare a word
   the engine invented. A lecture that wants different wording (or Arabic)
   overrides the same key in its own `context` and wins. */
var UI_TOKENS={
  coreLabel:'Must not be blank', optionalLabel:'Optional — if you have time',
  exampleLabel:'See a worked example', exampleTitle:'Worked example — not your answer',
  recallLabel:'One question back', recallPrompt:'From earlier tonight. Answer before you look.'
};
var CTX=(function(){var o={},k; for(k in UI_TOKENS) o[k]=UI_TOKENS[k];
  var C=LECTURE.context||{}; for(k in C) o[k]=C[k]; return o;})();
function T(s){
  if(s==null) return '';
  return String(s).replace(/\{\{\s*([a-zA-Z0-9_.]+)\s*\}\}/g,function(m,k){
    return (CTX[k]!==undefined&&CTX[k]!==null)?CTX[k]:m;
  });
}

/* ---------- glossary -------------------------------------------------------
   A term a first-year student has not met yet costs the room its attention:
   they stop following the argument and start guessing the word. LECTURE.glossary
   defines each one once, and every occurrence in rendered card text carries its
   definition on hover or tap. Applied to assembled HTML, so it steps over tags
   and never rewrites an attribute or a term already inside a definition. */
var GL=(function(){
  var g=LECTURE.glossary||{}, out=[];
  for(var k in g) out.push([k,g[k]]);
  out.sort(function(a,b){return b[0].length-a[0].length;});   /* longest first */
  return out;
})();
function glossify(html){
  if(!GL.length) return html;
  /* MASK WHAT WE INSERT. The obvious implementation splits the html on tags
     once, then marks each term in the text parts — and it is wrong the moment a
     glossary defines two terms whose definitions mention each other. The second
     term matches inside the FIRST term's data-def attribute, which now sits in
     a text part, and the markup is destroyed: an attribute is closed early and
     the definition spills onto the slide as body text.

     That is not hypothetical. The reliability glossary defines "fault" with a
     definition containing the word "error", and both are terms — it rendered a
     broken span in front of a room until this was fixed. So each inserted span
     is parked behind a sentinel that no later term can match, and restored at
     the end. */
  var parts=String(html).split(/(<[^>]*>)/), used={}, held=[];
  for(var i=0;i<parts.length;i++){
    if(parts[i].charAt(0)==='<') continue;                    /* a tag, not text */
    for(var g=0;g<GL.length;g++){
      var term=GL[g][0];
      if(used[term]) continue;                                /* once per slide is enough */
      var re=new RegExp('(^|[^\\w-])('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\w-])','i');
      if(re.test(parts[i])){
        used[term]=1;
        var def=String(GL[g][1]).replace(/"/g,'&quot;');
        parts[i]=parts[i].replace(re,function(m,pre,hit){
          held.push('<span class="gl" data-def="'+def+'">'+hit+'</span>');
          return pre+'\u0000'+(held.length-1)+'\u0000';
        });
      }
    }
  }
  return parts.join('').replace(/\u0000(\d+)\u0000/g,function(m,n){ return held[+n]; });
}

/* ---------- block renderer ---------- */
/* A box is not just a box. Two things the author can say about it, and both
   are things a student in a hurry needs to know: is this one of the boxes the
   artifact is made of, and is there a worked example if I am stuck.
   `core` ranks; `ex` scaffolds. Neither invents content — a field with neither
   renders exactly as it always did. */
function rField(f){
  /* Only the core boxes get a caption. Printing "optional" over nineteen of
     twenty-eight boxes is noise that costs a line of height on every slide and
     tells the student nothing they could act on — the dashed border already
     reads as lighter, and the ? panel explains the convention once. The signal
     is which boxes the artifact is made of, so only those are captioned. */
  var lab='', core=(f.core===true?'1':(f.core===false?'0':''));
  if(f.core===true) lab+='<span class="core">'+T('{{coreLabel}}')+'</span>';
  if(f.ex) lab+='<button class="exb" data-ex="'+f.id+'" aria-expanded="false">'+T('{{exampleLabel}}')+'</button>';
  var ta='<textarea class="inp" data-f="'+f.id+'"'+(core?' data-core="'+core+'"':'')+
         ' rows="'+(f.rows||2)+'" placeholder="'+f.ph+'"></textarea>';
  if(!lab && !f.ex) return ta;
  return '<div class="fw">'+(lab?'<div class="fl">'+lab+'</div>':'')+ta+
         (f.ex?'<div class="exbox" data-exbox="'+f.id+'" hidden><b>'+T('{{exampleTitle}}')+'</b>'+f.ex+'</div>':'')+
         '</div>';
}
/* The example opens and closes; it is never written into the student's box.
   An example that fills the field is an answer key, and this course does not
   hand out answer keys — it hands out a shape to copy the reasoning of. */
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-ex]'); if(!b) return;
  var box=document.querySelector('[data-exbox="'+b.getAttribute('data-ex')+'"]'); if(!box) return;
  var open=box.hidden; box.hidden=!open; b.setAttribute('aria-expanded',open?'true':'false');

function rPicker(p){

function rCard(it,row){
  var h='<div class="card c-'+it.c+(row?' rowcard':'')+'">';
  if(row){
    h+='<div class="lab">'+it.lab+'</div><div><div class="txt">'+it.txt+'</div>'+
       (it.src?'<div class="src" style="margin-top:5px">'+it.src+'</div>':'')+'</div>';
  }else{
    if(it.tag) h+='<div class="tag">'+it.tag+'</div>';
    if(it.lab) h+='<div class="lab">'+it.lab+'</div>';
    /* A card may carry a scan line and the source's own words underneath. The
       lead is what the back row reads in one second; the source text is clamped
       to two lines and opens on click. Nothing is hidden — the notes overlay
       always carries the full text — and the source is never paraphrased away,
       because on a source-expansion unit the exact wording IS the lesson. */
    if(it.lead){
      h+='<div class="lead">'+it.lead+'</div>';
      if(it.txt){

function renderAi(){
  var bs=document.querySelectorAll('[data-ai]');

    bs[i].setAttribute('aria-pressed', S.ai[bs[i].getAttribute('data-ai')]===bs[i].getAttribute('data-v')?'true':'false');
  var v=document.querySelectorAll('[data-averdict]'), a=S.ai, txt, cls='';
  var ASK='Answer the questions to run the gate.';
  if(!a.q1) txt=ASK;
  else if(a.q1==='n'){txt='PERMITTED — preparation only. It never becomes evidence, so no signature is owed.';cls=' ok';}
  else if(!a.q2||(a.q2==='n'&&!a.q2b)||!a.q3) txt=ASK;
  /* Re-derivable AND signed: the strong case, and the one classical evidence
     already met. */
  else if(a.q2==='y'&&a.q3==='y'){txt='PERMITTED as prepared evidence — a human can re-derive it, and a named person signs.';cls=' ok';}
  /* Not re-derivable but testable: this is where nearly every generative output
     actually lands, and the honest verdict is conditional, not a refusal. The
     tested claim is the evidence; the output is only how it was drafted. */
  else if(a.q2==='n'&&a.q2b==='y'&&a.q3==='y'){
    txt='PERMITTED, CONDITIONALLY — it cannot be re-derived, so the TEST is the evidence, not the output. Record the test, not the prompt.';cls=' ok';}

  for(var j=0;j<v.length;j++){v[j].textContent=txt;v[j].className='averdict'+cls;}

/* Practice items in the style of the national knowledge unit. Course-written, never
   real exam questions — the note under the block says so and CLAIM-01 guards it. */
function renderQuiz(){

  var at=Math.min(S.quizAt||0, QT.items.length-1), it=QT.items[at], pick=S.quiz?S.quiz[at]:undefined;
  var answered=(pick!==undefined&&pick!==null), tried=(S.tries&&S.tries[at])||[];

  if(answered) h+='<div class="qz-why"><b>'+(pick===it.a?(tried.length?'Correct on the second attempt.':'Correct.'):'Not this one.')+'</b> '+T(it.why)+'</div>';
  var right=0,done=0,aided=0;
  for(var k=0;k<QT.items.length;k++){var c=S.quiz?S.quiz[k]:undefined;

  h+='<div class="qz-foot"><div class="qz-dots">';

  if(QT.note) h+='<div class="qz-note">'+T(QT.note)+'</div>';

/* ---------- distributed retrieval ------------------------------------------
   The end-of-session check is a block of five items in the last ten minutes.
   That is massed practice, and massed practice is the weakest way to use the
   same five questions. A `recall` block pulls ONE of them back into the middle
   of the hour, and shares S.quiz with the final block — so the item is not
   asked twice, it is asked EARLIER. The author moves a question in time
   without writing a new one, and any subject with a jahtest gets this free. */
function rRecall(b){
  if(!LECTURE.jahtest) return '';
  return '<div class="rc" data-rc="'+(b.i||0)+'"></div>';
}
function renderRecall(){
  var ws=document.querySelectorAll('[data-rc]'); if(!ws.length) return;
  var QT=LECTURE.jahtest; if(!QT||!QT.items) return;
  for(var w=0;w<ws.length;w++){
    var at=Math.max(0,Math.min(+ws[w].getAttribute('data-rc')||0, QT.items.length-1));
    var it=QT.items[at], pick=S.quiz?S.quiz[at]:undefined;
    var answered=(pick!==undefined&&pick!==null), tried=(S.tries&&S.tries[at])||[];
    var h='<div class="rh"><span class="n">'+T('{{recallLabel}}')+'</span>'+
          '<span class="p">'+T('{{recallPrompt}}')+'</span><span class="lo">'+it.lo+'</span></div>'+
          '<div class="rq">'+T(it.q)+'</div><div class="qz-opts">';
    for(var i=0;i<it.opts.length;i++){
      var st='';
      if(answered) st=(i===it.a)?'right':(i===pick?'wrong':'dim');
      else if(tried.indexOf(i)>=0) st='wrong';
      h+='<button class="qz-o" data-qi="'+at+'" data-oi="'+i+'"'+(st?' data-st="'+st+'"':'')+'>'+
         '<span class="l">'+String.fromCharCode(65+i)+'</span><span class="x">'+T(it.opts[i])+'</span></button>';
    }
    h+='</div>';
    if(!answered&&tried.length) h+='<div class="qz-hint"><b>Not that one &mdash; try again.</b> '+T(it.hint||'')+'</div>';
    if(answered) h+='<div class="qz-why"><b>'+(pick===it.a?'Correct.':'Not this one.')+'</b> '+T(it.why)+'</div>';
    ws[w].innerHTML=h;
  }
}

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function coachState(b){
  var w=b.watch||[], filled=0, thin=false, min=b.min||55, deep=b.deep;
  for(var i=0;i<w.length;i++){
    var v=String(probe(w[i])||'').trim();
    /* only the boxes named in `deep` are held to a length — a NAME box is
       legitimately three words and must not be nagged for it */
    if(v){ filled++; if(w[i].indexOf('f:')===0 && (!deep||deep.indexOf(w[i])>=0) && v.length<min) thin=true; }
  }
  if(!filled) return 'empty';
  if(filled<w.length||thin) return 'thin';
  return 'ok';
}
function renderCoach(){
  var ws=document.querySelectorAll('[data-coach]');
  for(var i=0;i<ws.length;i++){
    var b=COACH[ws[i].getAttribute('data-coach')]; if(!b) continue;
    var st=coachState(b), lab=st==='ok'?'Committed':(st==='empty'?'Stuck?':'Nearly');
    ws[i].setAttribute('data-st',st);
    ws[i].innerHTML='<div class="cl">'+lab+'</div><div class="ct">'+T(b[st]||'')+'</div>';
  }
}
var COACH=[];
function rCoach(b){ COACH.push(b); return '<div class="coach" data-coach="'+(COACH.length-1)+'"></div>'; }

/* ---------- think · pair · share ----------
   Two minutes of peer talk before a pivotal decision. The toggle is not a score;
   it is the student telling the room they actually compared, which is what makes
   the instructor's "hands up if your partner disagreed" question answerable. */
function rPair(b){
  var id=b.id||('tps'+Math.random().toString(36).slice(2,7));
  return '<div class="tps" data-tps="'+id+'">'+
    '<div class="st a"><div class="n">1 &middot; Think'+(b.t1?' &middot; '+b.t1:'')+'</div><div class="p">'+T(b.think)+'</div></div>'+
    '<div class="st b"><div class="n">2 &middot; Pair'+(b.t2?' &middot; '+b.t2:'')+'</div><div class="p">'+T(b.pair)+'</div></div>'+
    '<div class="st c"><div class="n">3 &middot; Share'+(b.t3?' &middot; '+b.t3:'')+'</div><div class="p">'+T(b.share)+'</div></div>'+
    '<button class="done" data-pair="'+id+'" data-on="0">Compared<br>with a peer</button></div>';
}
function renderPair(){
  var bs=document.querySelectorAll('[data-pair]');
  for(var i=0;i<bs.length;i++){
    var on=!!(S.pair&&S.pair[bs[i].getAttribute('data-pair')]);
    bs[i].setAttribute('data-on',on?'1':'0');
    bs[i].innerHTML=on?'Compared &#10003;':'Compared<br>with a peer';
  }
}
/* ---------- sign and lock ---------------------------------------------------
   "Do not edit these boxes after the reveal" was an instruction with nothing
   behind it. A signature is the mechanism: the student commits, the values are
   snapshotted with a time, the inputs go read-only, and a later edit is refused
   in words rather than silently allowed. This is the chapter's own thesis
   applied to the chapter — an unsigned claim and a claim you can quietly revise
   after seeing the answer are the same thing. */
var SIGN=[];
function rSign(b){
  SIGN.push(b);
  return '<div class="signbar" data-sign="'+b.id+'" data-on="0">'+
    '<div class="st"></div><button data-signbtn="'+b.id+'">'+T(b.label||'Sign this')+'</button></div>'+
    '<div class="lockmsg" data-lockmsg="'+b.id+'"></div>';
}
function signedFields(){                      /* every ref frozen by any signature */
  var s={};
  for(var i=0;i<SIGN.length;i++){
    if(!(S.sign&&S.sign[SIGN[i].id])) continue;
    for(var j=0;j<(SIGN[i].fields||[]).length;j++) s[SIGN[i].fields[j]]=SIGN[i].id;
  }
  return s;
}
function renderSign(){
  var bs=document.querySelectorAll('[data-sign]');
  for(var i=0;i<bs.length;i++){
    var id=bs[i].getAttribute('data-sign'), b=null;
    for(var k=0;k<SIGN.length;k++) if(SIGN[k].id===id) b=SIGN[k];
    if(!b) continue;
    var rec=S.sign&&S.sign[id], on=!!rec, n=0, tot=(b.fields||[]).length;
    for(var f=0;f<tot;f++) if(String(probe(b.fields[f])||'').trim()) n++;
    bs[i].setAttribute('data-on',on?'1':'0');
    bs[i].querySelector('.st').innerHTML = on
      ? '<b>Signed at '+rec.at+'.</b> '+T(b.done||'These boxes are now read-only. Anything you learn from the reveal goes in a new box, not over this one.')
      : (n<tot ? T(b.before||'Fill every box, then sign.')+' <b>'+n+' of '+tot+'</b>'
               : '<b>'+T(b.ready||'Ready to sign.')+'</b> '+T(b.warn||'Signing freezes these boxes for the rest of the hour.'));
    var btn=bs[i].querySelector('button');
    btn.textContent = on ? 'Signed ✓' : T(b.label||'Sign this');
    btn.disabled = on || n<tot;
    btn.style.opacity = (!on&&n<tot) ? '.45' : '1';
  }
  /* lock the inputs themselves */
  var locked=signedFields();
  var ts=document.querySelectorAll('[data-f]');
  for(var t=0;t<ts.length;t++) ts[t].readOnly = !!locked['f:'+ts[t].getAttribute('data-f')];
  var ps=document.querySelectorAll('[data-pick]');
  for(var p=0;p<ps.length;p++){
    var lk=!!locked['p:'+ps[p].getAttribute('data-pick')], pk=ps[p].querySelectorAll('.pick');
    for(var q=0;q<pk.length;q++) pk[q].setAttribute('data-locked',lk?'1':'0');
  }
}
function refuse(id){
  var ms=document.querySelectorAll('[data-lockmsg="'+id+'"]');
  for(var i=0;i<ms.length;i++){
    ms[i].textContent='Signed answers cannot be edited. Put the revision in a later box, where it is visible as a revision.';
    (function(e){setTimeout(function(){e.textContent='';},4200);})(ms[i]);
  }
}

/* ---------- self-assessed level vs. the level the artifact supports ----------
   Same split as the gates and the outcome map: what the student claims, beside
   what their evidence carries. The second one cannot be talked up, and it names
   the empty box rather than awarding a mark — Rule 19 keeps scoring off the
   live slide, and this stays descriptive. */
function levelEarned(){
  var L=LECTURE.levels; if(!L) return null;
  var best=L.tiers[0], miss=null;
  for(var i=0;i<L.tiers.length;i++){
    var t=L.tiers[i], gap=[];
    for(var n=0;n<(t.needs||[]).length;n++)
      if(!String(probe(t.needs[n])||'').trim()) gap.push(t.needs[n]);
    if(gap.length){ miss=miss||{tier:t,gap:gap}; break; }
    best=t;
  }
  return {best:best, next:miss};
}
function rLevels(){
  var L=LECTURE.levels; if(!L) return '';
  var opts=[]; for(var i=0;i<L.tiers.length;i++) opts.push(L.tiers[i].k);
  return '<div class="lvl">'+rPicker({g:L.g||'level',options:opts})+
    '<div class="lvlread" data-lvlread="1"></div></div>';
}
function renderLevels(){
  var ws=document.querySelectorAll('[data-lvlread]'); if(!ws.length) return;
  var L=LECTURE.levels, e=levelEarned(); if(!L||!e) return;
  var said=S.pick[L.g||'level'], NAMES=LECTURE.fieldNames||{};
  var h, mode='';
  if(!said) h='Pick the level you think you are at. The line will then compare it with what your card actually carries.';
  else{
    var order=L.tiers.map(function(t){return t.k;});
    var di=order.indexOf(said)-order.indexOf(e.best.k);
    mode = di>0?'over':(di===0?'ok':'');
    h='You said <b>'+said+'</b>. What you have produced supports <b>'+e.best.k+'</b>';
    if(e.next&&e.next.gap.length){
      var names=e.next.gap.map(function(r){return NAMES[r]||r;});
      h+=' &mdash; '+e.next.tier.k+' needs <span class="miss">'+names.join(', ')+'</span>, still empty.';
    } else h+=', the highest this chapter defines.';
    if(di>0) h+=' The gap between the two is the useful part: it is a specific empty box, not a verdict on you.';
    else if(di<0) h+=' You have under-read your own card &mdash; open it with C and look again.';
  }
  for(var w=0;w<ws.length;w++){ ws[w].innerHTML=T(h); ws[w].setAttribute('data-m',mode); }
}
/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    /* `p.12` for a book, `s.12` for a deck. A lecture whose source is a slide
       deck should not be made to call its slides pages — the ledger stays
       honest by naming the unit the source actually has. */
    var m=s.match(/[ps]\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/[ps]\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */
function uncitedPages(){
  var C=LECTURE.coverage; if(!C||!C.span) return [];
  var hits=srcPages(), out=[], run=null;
  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }
  }
  if(run) out.push(run);
  return out;
}
function fmtRanges(rs){
  var o=[];
  for(var i=0;i<rs.length;i++) o.push(rs[i][0]===rs[i][1]?rs[i][0]:rs[i][0]+'&ndash;'+rs[i][1]);
  return o.join(', ');
}
function rCoverage(){ return '<div class="cov" data-cov="1"></div>'; }
function renderCoverage(){
  var ws=document.querySelectorAll('[data-cov]'); if(!ws.length) return;
  var C=LECTURE.coverage, rows=coverageRows(); if(!C) return;
  var LB={taught:'taught',touched:'touched once',open:'not reached'};
  /* `unit`/`unitShort` let a deck-sourced lecture say "slides" and "ss." where a
     book-sourced one says "pages" and "pp.". Default is the book. */
  var UN=C.unit||'page', UP=C.unitShort||'pp.';
  var h='', nT=0, nO=0;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.st==='taught') nT++; if(r.st==='open') nO++;
    h+='<div class="cvr" data-s="'+r.st+'"><span class="k">'+r.s.k+'</span>'+
       '<span class="t">'+r.s.t+(r.s.concept?' <i>&mdash; '+r.s.concept+'</i>':'')+
       (r.st==='open'&&r.s.why?'<i style="display:block;color:var(--mag)">'+r.s.why+'</i>':'')+'</span>'+
       '<span class="w">'+(r.units.length?r.units.join(' &middot; '):UP+' '+r.s.pp[0]+'&ndash;'+r.s.pp[1])+'</span>'+
       '<span class="s">'+LB[r.st]+'</span></div>';
  }
  var gaps=uncitedPages(), np=0;
  for(var g=0;g<gaps.length;g++) np+=gaps[g][1]-gaps[g][0]+1;
  h+='<div class="covfoot"><b>'+nT+' of '+rows.length+'</b> sections of '+(C.source||'the source')+
     ' are taught here'+(nO?', and <b style="color:var(--mag)">'+nO+'</b> '+(nO===1?'is':'are')+
     ' named above as out of scope with the reason':'')+'.'+
     (gaps.length?'<br><b style="color:var(--mag)">'+np+' '+UN+'s this hour never cites:</b> '+fmtRanges(gaps)+
       '. Read them before the next session &mdash; the engine can say they were not reached, not what is on them.':'')+
     '<br>All of this is counted from the '+UN+' you cited on each card. It is not a claim about coverage; it is a count.</div>';
  for(var w=0;w<ws.length;w++) ws[w].innerHTML=T(h);
}

/* ---------- path map --------------------------------------------------------
   Every unit carrying showIf is a fork in the hour. This draws them, marks the
   arm this student is on, and says which slides they actually reached. Three
   readers: the student sees that their own answers changed the session, the
   instructor gets a post-class diagnostic, and a reviewer gets evidence that
   "adaptive" is a mechanism in the file rather than a word in a document. */
function forks(){
  var out=[];
  for(var i=0;i<LECTURE.units.length;i++){
    var u=LECTURE.units[i], c=u.showIf; if(!c) continue;
    var mode = c.thin?'thin':(c.empty?'empty':'filled'), refs=c[mode]||[];
    var NAMES=LECTURE.fieldNames||{};
    var names=[]; for(var r=0;r<refs.length;r++) names.push(NAMES[refs[r]]||refs[r].replace(/^[fp]:/,''));
    /* the unit this fork rejoins: the next unit with no condition */
    var join=null;
    for(var j=i+1;j<LECTURE.units.length;j++) if(!LECTURE.units[j].showIf){ join=LECTURE.units[j]; break; }
    var from=null;
    for(var b=i-1;b>=0;b--) if(!LECTURE.units[b].showIf){ from=LECTURE.units[b]; break; }
    out.push({unit:u, from:from, join:join, mode:mode, min:c.min||0, names:names, shown:vis(u)});
  }
  return out;
}
function rPath(){ return '<div class="pm" data-pm="1"></div>'; }
function renderProgress(){
  var t=0,n=0;
  for(var i=0;i<LECTURE.units.length;i++){
    var k=LECTURE.units[i].k;
    if(k==='TITLE'||k==='END') continue;
    if(!vis(LECTURE.units[i])) continue;          /* a slide nobody will see is not owed */
    t++; if(S.seen&&S.seen[k]) n++;
  }
  var pc=t?Math.round(n/t*100):0;
  var e=document.getElementById('progT'); if(!e) return;
  e.textContent=n+'/'+t;
  document.getElementById('progB').style.width=pc+'%';
  document.getElementById('prog').setAttribute('aria-label','Progress: '+n+' of '+t+' units reached');
}
function renderPath(){
  var ws=document.querySelectorAll('[data-pm]'); if(!ws.length) return;
  var F=forks(), h='';
  if(!F.length) h='<div class="pmnote">This lecture has no conditional units: every student takes the same route.</div>';
  for(var i=0;i<F.length;i++){
    var f=F[i], cond=f.names.join(', ');
    var need = f.mode==='thin' ? cond+' under '+f.min+' characters'
             : f.mode==='empty' ? cond+' still empty' : cond+' answered';
    var met = f.mode==='filled' ? !f.shown : f.shown;   /* is the student on the helper arm? */
    h+='<div class="fork"><div class="at">'+(f.from?f.from.k:'start')+'<span>fork</span></div><div class="arms">'+
       '<div class="arm" data-took="'+(met?1:0)+'"><span class="b">&#9500;</span>'+
       '<span>'+need+' &rarr; the '+(f.unit.rule&&/HELPER|SCAFFOLD/i.test(f.unit.rule)?'scaffold':'extra')+' slide'+
       (met?' <em>&mdash; you are on this arm</em>':'')+'</span>'+
       '<span class="to">'+f.unit.k+(f.join?' &rarr; '+f.join.k:'')+'</span></div>'+
       '<div class="arm" data-took="'+(met?0:1)+'"><span class="b">&#9492;</span>'+
       '<span>otherwise, straight on'+(met?'':' <em>&mdash; you are on this arm</em>')+'</span>'+
       '<span class="to">'+(f.join?f.join.k:'&mdash;')+'</span></div>'+
       '</div></div>';
  }
  /* what actually happened, counted from state */
  var seen=0, tot=0;
  for(var u=0;u<LECTURE.units.length;u++){
    if(LECTURE.units[u].k==='TITLE'||LECTURE.units[u].k==='END') continue;
    tot++; if(S.seen&&S.seen[LECTURE.units[u].k]) seen++;
  }
  var help=0; for(var g=0;g<F.length;g++) if(S.seen&&S.seen[F[g].unit.k]) help++;
  var sig=0; for(var s2 in (S.sign||{})) if(S.sign[s2]) sig++;
  var aided=0, QT=LECTURE.jahtest;
  if(QT) for(var q=0;q<QT.items.length;q++){
    var c2=S.quiz?S.quiz[q]:undefined;
    if(c2!==undefined&&c2!==null&&(S.tries&&S.tries[q]||[]).length) aided++;
  }
  h+='<div class="pmfoot">'+
     '<div class="pmf"><div class="n">'+seen+'/'+tot+'</div><div class="l">units reached</div></div>'+
     '<div class="pmf"><div class="n">'+help+'</div><div class="l">scaffolds you needed</div></div>'+
     '<div class="pmf"><div class="n">'+sig+'</div><div class="l">commitments signed</div></div>'+
     '<div class="pmf"><div class="n">'+aided+'</div><div class="l">answers after a hint</div></div>'+
     '</div><div class="pmnote">None of this is a mark. It is the route your own answers opened, and a scaffold you needed is a unit worth rereading &mdash; not a deduction.</div>';
  for(var w=0;w<ws.length;w++) ws[w].innerHTML=T(h);
}
/* ---------- confusable terms, side by side ------------------------------
   Every subject has a set of words students swap for one another, and the swap
   is invisible until it produces a wrong answer. A comparison table is the
   cheapest fix known, and it is declared entirely in data:
     {t:'compare', head:['Term','What it is','How you know'], rows:[
        {c:'teal', cells:['Fault','a defect in the system','code review, static analysis']}]} */
function rCompare(b){
  var h='<table class="cmp"><thead><tr>';
  for(var i=0;i<(b.head||[]).length;i++) h+='<th scope="col">'+b.head[i]+'</th>';
  h+='</tr></thead><tbody>';
  for(var r=0;r<(b.rows||[]).length;r++){
    var row=b.rows[r];
    h+='<tr'+(row.c?' data-c="'+row.c+'"':'')+'>';
    for(var c=0;c<row.cells.length;c++)
      h+='<td'+(c===0?' scope="row"':'')+(c>1?' class="mut"':'')+'>'+row.cells[c]+'</td>';
    h+='</tr>';
  }
  h+='</tbody></table>';
  /* A comparison drawn out of the source is a source claim like any other, so
     it may carry the citation the cards beside it carry. SRC-01 reads it. */
  if(b.src) h+='<div class="cmpsrc">'+b.src+'</div>';
  return h;
}
/* ---------- the bridge from a requirement to something you can build --------
   THE GAP THIS CLOSES. A course built on decision and evidence produces a
   student who can defend a verdict and cannot build the thing they decided on.
   The chapter names redundancy, diversity, static analysis, formal methods —
   and never once says what you type, install or run.

   So the lecture declares one row per requirement, and the row is a chain:
   the requirement, the mechanism that serves it, what you actually build, the
   named tools that do it, and — the part that keeps this inside the ISCARB
   grammar rather than turning it into a tool advert — the artifact that proves
   you did. BRIDGE-01 blocks a row whose evidence is an intention.

   Tools are named as examples of a category. The category is the teaching; the
   brand is replaceable and the lecture says so. */
function rBridge(){
  var K=LECTURE.toolkit; if(!K||!K.rows) return '';
  var H=K.head||['Requirement','Mechanism','What you build','Tools that do it','The artifact it leaves'];
  var h='<div class="br"><div class="brh">';
  for(var i=0;i<H.length;i++) h+='<span>'+H[i]+'</span>';
  h+='</div>';
  for(var r=0;r<K.rows.length;r++){
    var w=K.rows[r], tl='';
    for(var t=0;t<(w.tools||[]).length;t++) tl+='<i>'+w.tools[t]+'</i>';
    h+='<div class="brr"'+(w.c?' data-c="'+w.c+'"':'')+'>'+
       '<div class="rq">'+w.req+'</div>'+
       '<div class="mc">'+w.mech+'</div>'+
       '<div>'+w.impl+'</div>'+
       '<div class="tls">'+tl+'</div>'+
       '<div class="ev"><b>proves it</b>'+w.evidence+'</div></div>';
  }
  if(K.note) h+='<div class="brnote">'+K.note+'</div>';
  return h+'</div>';
}
function rGates(){

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;
}
/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=c.min||40;
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}
  return true;
}
function go(i,force){
  if(i<0||i>=U.length) return;
  if(!force&&!vis(U[i])){                           /* skip in the direction of travel */
    var d=(i>=cur)?1:-1, j=i+d;
    while(j>=0&&j<U.length&&!vis(U[j])) j+=d;
    if(j<0||j>=U.length) return;
    i=j;
  }
  var p=deck.querySelector('.slide.on'); if(p) p.classList.remove('on');
  cur=i; deck.querySelector('[data-i="'+i+'"]').classList.add('on');
  var u=U[i];
  if(!S.seen)S.seen={};
  if(!S.seen[u.k]){S.seen[u.k]=1; save();}     /* the route, for the path map */
  var live=document.getElementById('tLive');
  if(live) live.textContent=(u.rule?strip(T(u.rule))+'. ':'')+strip(T(u.title||LECTURE.title))+
    (u.timebox?'. Timebox '+u.timebox:'');
  document.getElementById('taskText').innerHTML=T(u.task||'');
  document.getElementById('tbLabel').textContent='TIMEBOX'+(u.timebox?': '+u.timebox.toUpperCase():'');
  resetTimer(parseTb(u.timebox));
  /* rail */
  var pi=phaseIdx(i), segs=document.querySelectorAll('#rail i');

  for(var j=0;j<U.length;j++){ if(PIDX[j]===pi){ if(first<0)first=j; last=j; } }

  }

  if(document.getElementById('notes').classList.contains('on')) fillNotes();

}

function resolve(ref){
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' -> '):'';
  if(ref==='@matrix'){var n=['','Known / managed','Known / unmanaged','Unknown / monitor'],o=[];
    for(var k in S.mx){if(S.mx[k])o.push(k.replace('x',' x ')+' = '+n[S.mx[k]]);} return o.join('; ');}
  if(ref==='@gates'){var c=0,p=[];for(var i=0;i<GATE_DEFS.length;i++){if(S.gates[GATE_DEFS[i][0]]){c++;p.push(GATE_DEFS[i][1]);}}
    return c+' of '+GATE_DEFS.length+' gates passed'+(p.length?' ('+p.join(', ')+')':'');}
  if(ref==='@jahtest'){var QT=LECTURE.jahtest; if(!QT) return '';
    var r=0,d=0,miss=[];
    for(var i=0;i<QT.items.length;i++){var c=S.quiz?S.quiz[i]:undefined;
      if(c!==undefined&&c!==null){d++; if(c===QT.items[i].a) r++; else miss.push('item '+(i+1)+' ('+QT.items[i].lo+')');}}
    if(!d) return '';
    return r+' correct of '+d+' answered'+(miss.length?'\nMissed: '+miss.join('; '):'');}
  if(ref==='@signed'){var o=[];
    for(var i=0;i<SIGN.length;i++){var r=S.sign&&S.sign[SIGN[i].id];
      if(r) o.push((SIGN[i].label||SIGN[i].id)+' — signed '+r.at);}
    return o.join('\n');}
  if(ref==='@coverage'){var rr=coverageRows(); if(!rr.length) return '';
    var o=[],op=[];
    for(var i=0;i<rr.length;i++){
      o.push(rr[i].s.k+' '+rr[i].s.t+': '+rr[i].st+(rr[i].units.length?' ('+rr[i].units.join(', ')+')':''));
      if(rr[i].st==='open') op.push(rr[i].s.k+(rr[i].s.why?' — '+rr[i].s.why:''));
    }
    return o.join('\n')+(op.length?'\nOut of scope for this hour: '+op.join('; '):'');}
  if(ref==='@path'){var F=forks(), o=[];
    for(var i=0;i<F.length;i++){
      var f=F[i], on=(f.mode==='filled')?!vis(f.unit):vis(f.unit);
      o.push((f.from?f.from.k:'start')+' -> '+(on?f.unit.k+' (scaffold taken)':'straight on'));
    }
    var n=0,t=0;
    for(var u=0;u<LECTURE.units.length;u++){
      if(LECTURE.units[u].k==='TITLE'||LECTURE.units[u].k==='END') continue;
      t++; if(S.seen&&S.seen[LECTURE.units[u].k]) n++;}
    o.push(n+' of '+t+' units reached');
    return o.join('\n');}
  if(ref==='@clo'){var R=LECTURE.readiness||[],o=[];
    for(var i=0;i<R.length;i++) o.push(R[i].clo+': '+(cloOk(R[i])?'supported':'not supported'));
    return o.join('; ');}
  if(ref==='@marks'){var o=[];for(var k in (S.marks||{})){if(S.marks[k]&&S.marks[k].length)o.push(k+': '+S.marks[k].length+' region(s) marked');}return o.join('; ');}
  if(ref==='@aigate'){var a=S.ai||{};if(!a.q1)return '';
    var v=(a.q1==='n')?'PERMITTED — preparation only':((a.q2==='y'&&a.q3==='y')?'PERMITTED as prepared evidence':(a.q2&&a.q3?'NOT PERMITTED — rework required':''));
    return v?('Evidence chain: '+(a.q1==='y'?'yes':'no')+' · Human can recompute: '+(a.q2||'-')+' · Named signer: '+(a.q3||'-')+'\nGate: '+v):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function secValue(sec){
  var o=[];
  for(var i=0;i<sec.parts.length;i++){
    var lab=sec.parts[i][0], v=resolve(sec.parts[i][1]);
    if(v&&String(v).trim()) o.push((lab?lab+': ':'')+String(v).trim());
  }
  return o.join('\n');
}
function caseText(){
  var o=T(LECTURE.cardHeader)+'\n\n';
  for(var i=0;i<LECTURE.caseMap.length;i++){var v=secValue(LECTURE.caseMap[i]);
    o+=T(LECTURE.caseMap[i].t)+'\n'+(v?v:'(not completed)')+'\n\n';}
  return o;
}
function fillCase(){
  var h='';
  for(var i=0;i<LECTURE.caseMap.length;i++){var v=secValue(LECTURE.caseMap[i]);
    h+='<div class="sec"><div class="l">'+T(LECTURE.caseMap[i].t)+'</div><div class="v'+(v?'':' blank')+'">'+
       (v?esc(v):'not completed')+'</div></div>';}
  document.getElementById('cB').innerHTML=h;
}

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){
  var L=LECTURE, o=[];
  var line=function(x){o.push(x===undefined?'':x);};
  line('# '+strip(T(L.title))+' — course file extract');
  line('');
  line('Course: '+strip(T(L.course))+'  |  Source: '+strip(T(L.source)));
  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');
  line('lecture and rendered by the same engine that teaches it.');
  line('');
  line('## 1. Session outcomes, by unit');
  line('');
  line('| Unit | Rule | The student will be able to | Activity | Timebox |');
  line('|---|---|---|---|---|');
  for(var i=0;i<L.units.length;i++){
    var u=L.units[i]; if(!u.rule||!u.learn) continue;
    line('| '+u.k+' | '+strip(T(u.rule))+' | '+strip(T(u.learn))+' | '+strip(T(u.task||'—'))+' | '+(u.timebox||'—')+' |');
  }
  line('');
  line('## 2. Course and programme outcome map');
  line('');
  line('| CLO | PLO | Domain | Outcome | Evidence the student produces | Where |');
  line('|---|---|---|---|---|---|');
  for(var r=0;r<(L.readiness||[]).length;r++){
    var R=L.readiness[r], NAMES=L.fieldNames||{}, ev=[];
    for(var n=0;n<(R.needs||[]).length;n++) ev.push(NAMES[R.needs[n]]||R.needs[n]);
    line('| '+R.clo+' | '+(R.plo||'—')+' | '+(R.d||'')+' | '+strip(T(R.txt))+' | '+ev.join(', ')+' | '+strip(R.where||'')+' |');
  }
  line('');
  line('Assessment evidence is the artifact itself: the decision card the student');
  line('exports, whose sections are listed in §5. The closing unit reads the map');
  line('above off that artifact rather than off self-report.');
  line('');
  line('## 3. Source coverage');
  line('');
  var rows=coverageRows();
  if(rows.length){
    line('| Section | Pages | Status | Reached by |');
    line('|---|---|---|---|');
    for(var c=0;c<rows.length;c++){
      var R2=rows[c];
      line('| '+R2.s.k+' '+strip(R2.s.t)+' | '+R2.s.pp[0]+'–'+R2.s.pp[1]+' | '+R2.st+' | '+(R2.units.join(', ')||'—')+' |');
      if(R2.st==='open'&&R2.s.why) line('| | | out of scope | '+strip(R2.s.why)+' |');
    }
    var g=uncitedPages();
    if(g.length){ line(''); line('Pages within the source span that this session never cites: '+
      strip(fmtRanges(g))+'. Counted from the page citation on every card.'); }
  } else line('No coverage ledger declared.');
  line('');
  if(L.jahiziah){
    line('## 4. National alignment');
    line('');
    line(strip(T(L.jahiziah.gku))+' → '+strip(T(L.jahiziah.sku)));
    line('');
    line('| # | Outcome | Status | Where |');
    line('|---|---|---|---|');
    for(var j=0;j<(L.jahiziah.outcomes||[]).length;j++){
      var O=L.jahiziah.outcomes[j];
      line('| '+O.n+' | '+strip(T(O.txt))+' | '+O.s+' | '+strip(T(O.where||''))+' |');
    }
    line('');
    line('This states coverage only. It is not the national examination and');
    line('predicts nothing about any student\'s result on it.');
    line('');
  }
  line('## 5. The artifact each student leaves holding');
  line('');
  for(var m=0;m<(L.caseMap||[]).length;m++) line('- '+strip(T(L.caseMap[m].t)));
  line('');
  line('## 6. Accessibility and data');
  line('');
  line('- Runs as one HTML file with no install, no account and no network.');
  line('- Nothing a student types leaves their browser; there is no server to hold it.');
  line('- Full keyboard navigation; ? lists the keys. Text size adjustable 80–140%.');
  line('- Every status is carried by a word as well as a colour.');
  line('');
  line('Generated '+new Date().toISOString().slice(0,10)+' by the ISCARB lecture engine.');
  return o.join('\n');
}
function strip(x){return String(x==null?'':x).replace(/<[^>]*>/g,'').replace(/&mdash;/g,'—')
  .replace(/&middot;/g,'·').replace(/&rsquo;/g,"'").replace(/&ldquo;|&rdquo;/g,'"')
  .replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').replace(/&[a-z]+;/g,'').replace(/\|/g,'\\|').trim();}

/* ---------- overlays ---------- */

function fillHelp(){

  var K=[['&rarr; / Space','next unit'],['&larr;','previous unit'],['N','instructor notes for this unit'],
         ['C','your decision card'],['O','every unit, jump to any'],['T','start or pause the timebox'],

     '<div class="kr"><b>Tab</b><span>moves through every control on the slide; the focused one is outlined.</span></div>'+

     '<div class="kr"><b>Print</b><span>Ctrl/Cmd&nbsp;P gives a handout, and a PDF, with every box expanded.</span></div>'+
     /* The design refuses to score, and refusing without saying why reads as a
        missing feature rather than a decision. Students report the same worry in
        every run — "I don't know if I was right" — so the answer is written down
        where they can find it, in their own words, not the department's. */
     '</div><h3>Why there is no score</h3><div class="kg">'+
     '<div class="kr"><b>No mark</b><span>nothing here is graded, and nothing you type is seen by anyone but you.</span></div>'+
     '<div class="kr"><b>Instead</b><span>the boxes marked <i>must not be blank</i> are what the artifact is made of. Fill those first; the rest are spare capacity, not a backlog.</span></div>'+
     '<div class="kr"><b>"Am I right?"</b><span>often there is no single right answer &mdash; there is a claim, its evidence, and what would prove it wrong. If those three are on your card, the answer is defensible, which is the thing being taught.</span></div>'+
     '<div class="kr"><b>Stuck</b><span>a box with <i>see a worked example</i> shows one. It is an example of the <i>shape</i>, never your answer.</span></div>'+
     '</div><h3>Your data</h3><div class="kg">'+
     '<div class="kr"><b>Stored</b><span>in this browser only, saved as you type.</span></div>'+

     '<div class="kr"><b>Yours</b><span>press C then Copy to take your work with you.</span></div></div>';
  document.getElementById('hB').innerHTML=T(h);

function fillOver(){
  var h='';
  for(var i=0;i<U.length;i++) h+='<button class="oc'+(i===cur?' cur':'')+'" data-go="'+i+'"'+

/* The report leaves as a file when the host allows a download, and otherwise as
   a copy on the clipboard — the deck must still work opened from a USB stick. */
function downloadReport(){
  var txt=reportText(), name=LECTURE.id+'-course-file.md';
  if(window.claude&&claude.use){
    claude.use('downloads').then(function(d){
      if(d) d.save({filename:name,data:txt}).catch(function(){copyReport(txt);});
      else copyReport(txt);
    }).catch(function(){copyReport(txt);});
    return;
  }
  try{
    var b=new Blob([txt],{type:'text/markdown'}), u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    note('Course-file report downloaded.');
  }catch(e){ copyReport(txt); }
}
function copyReport(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){note('Course-file report copied to the clipboard.');},
                                            function(){note('Press R again, or open the console.');});
}
function note(msg){
  var e=document.getElementById('tLive'); if(e){e.textContent=msg; setTimeout(function(){e.textContent='';},4000);}
}

(function(){
  if(!(window.claude&&claude.use)) return;
  claude.use('downloads').then(function(d){
    if(!d) return;
    var b=document.getElementById('cDown'); b.hidden=false;
    b.onclick=function(){d.save({filename:LECTURE.id+'-decision-card.md',data:caseText()}).catch(function(){});};
  }).catch(function(){});
})();

/* ---------- timer ---------- */
var tS=0,tT=0,tOn=false,tI=null;
function fmt(s){var m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?'+':'')+m+':'+(x<10?'0':'')+x;}
function resetTimer(sec){
  tT=sec; tS=sec; tOn=false; clearInterval(tI);
  document.getElementById('timer').className='';
  document.getElementById('tBtn').textContent='Start';
  document.getElementById('clock').textContent=tT?fmt(tS):'--:--';
}
function toggleTimer(){
  if(!tT) return; tOn=!tOn;
  var w=document.getElementById('timer');
  document.getElementById('tBtn').textContent=tOn?'Pause':'Start';
  clearInterval(tI);
  if(tOn){w.className='run'; tI=setInterval(function(){
    tS--; document.getElementById('clock').textContent=fmt(tS);
    if(tS===0) timeUp();
    if(tS<=0) w.className='over';
  },1000);}
  else w.className=tS<=0?'over':'';
}
/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}
document.getElementById('tBtn').onclick=toggleTimer;
document.getElementById('tRst').onclick=function(){resetTimer(parseTb(U[cur].timebox));};

/* ---------- keys + fit ---------- */
document.addEventListener('keydown',function(e){
  var tg=(e.target.tagName||'').toLowerCase();
  if(tg==='textarea'||tg==='input'){if(e.key==='Escape')e.target.blur();return;}
  var k=e.key;
  if(k==='Escape'){var o=document.querySelector('.ov.on'); if(o)o.classList.remove('on'); return;}
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(cur+1);return;}
  if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1);return;}
  if(k==='n'||k==='N'){tog('notes');return;}
  if(k==='c'||k==='C'){tog('case');return;}
  if(k==='o'||k==='O'){tog('over');return;}
  if(k==='t'||k==='T'){toggleTimer();return;}
  if(k==='?'||(k==='/'&&e.shiftKey)){e.preventDefault();tog('help');return;}
  if(k==='r'||k==='R'){downloadReport();return;}
  if(k==='+'||k==='='){e.preventDefault();setZoom(ZOOM+.05);return;}
  if(k==='-'||k==='_'){e.preventDefault();setZoom(ZOOM-.05);return;}
  if(k==='0'){e.preventDefault();setZoom(1);return;}
});
function fit(){document.getElementById('stage').style.transform='scale('+Math.min(window.innerWidth/1353,window.innerHeight/770)+')';}
window.addEventListener('resize',fit);

fit(); renderMatrix(); renderTrace(); renderGates(); renderAi(); renderCardCheck(); renderClo(); renderQuiz();
renderMarks(); renderCoach(); renderPair(); renderSign(); renderLevels();
renderCoverage(); renderPath(); renderProgress(); syncAll(); go(0);
setZoom(ZOOM);
</script>
