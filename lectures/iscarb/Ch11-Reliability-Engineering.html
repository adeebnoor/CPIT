<!doctype html><html lang="en" data-iscarb-standalone="1" data-course-release="20260921-classroom-v3" data-navigation="20260921-navigation-v1" data-mindmap="20260922-story-v2" data-story="20260922-story-v2" data-ailens="20260926-genai-v12"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chapter 11: Reliability Engineering. Twenty source-grounded classroom slides, required source review, and one iSCARB decision artifact."><title>iSCARB · Ch11 Reliability Engineering</title><link rel="stylesheet" href="runtime/classroom-v3.css?v=20260926-genai-v12"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 11</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch11-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":11,"title":"Reliability Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260926-genai-v12","filename":"Ch11-Reliability-Engineering.html","assignment":2,"points":5,"objectives":["Distinguish reliability from availability and explain how use and recovery affect them.","Select and calculate POFOD, ROCOF, MTTF and AVAIL; write a measurable requirement.","Compare fault-tolerant architectures and justify a choice with its independence assumptions.","Apply the eight dependable programming guidelines to a failure scenario.","Design a statistical reliability test using an operational profile and explain its limits."],"sections":["11.1 Availability and reliability","11.2 Reliability requirements","11.3 Fault-tolerant architectures","11.4 Programming for reliability","11.5 Reliability measurement"],"case":{"headline":"The gateway is available. Is the release dependable?","text":"A fictional university communications gateway records 20 failed demands out of 10,000, and two service outages in a 1,000-hour window with one total unavailable hour. The proposed availability target is 99.99%. The test assumes 10% external traffic; no new profile test is supplied.","question":"Hold, restrict or release—and which metric supports that scope?","mutation":"External traffic changes from the assumed 10% to 60%; no representative result under that mix is supplied. The classifier was trained mostly on internal messages.","lens":"The gateway’s upgrade also added a vendor’s learned message classifier that flags phishing and routes messages. The vendor reports 98% accuracy on its own benchmark. In the pilot’s 1,000 external messages, 50 were phishing: the classifier missed 10 and wrongly flagged 19 legitimate messages. Hold that question: after the measurement slides, one slide shows how this chapter’s metrics and tests apply to the classifier."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Reliability Engineering","phase":"SEE","takeaway":"You own the release decision—not just the uptime number.","bullets":[["Explain","Name the mechanism and operating assumptions."],["Evidence","Use the given observations, not invented results."],["Revise","Keep the original decision and its changed justification."]],"question":"Would you release, restrict, or hold? State the first missing piece of evidence.","answer":"A defensible initial choice is to hold full release or restrict a monitored pilot. Observed availability is 99.9%, below the proposed 99.99% requirement. Identical servers do not remove shared software faults. Ask for a representative operational profile, outage/recovery records, and a tested fallback. Other choices require equally explicit boundaries and evidence.","full":"<p>This course-created case adapts the chapter’s non-safety-critical, continuously available communications-switch exercise (11.6). It is not a report about a real university network. Every pilot number is fictional teaching data.<\/p><p>A campus communications gateway is due for a wider release. Two identical servers run the same software. The team calls this “reliable” and proposes a 99.99% availability requirement. The pilot shows 20 failed call attempts out of 10,000 demands and two service outages over 1,000 calendar hours, totaling one hour of unavailable service. These count different failure events; do not mix them.<\/p><p>The release owner must decide: hold, restrict, or release—and state what evidence could change that choice. Use the chapter’s five sections to develop the answer. This is an engineering exercise, not approval for an operational network.<\/p>","notes":"Open with the decision, not a definition. Ask for a provisional answer without correcting it. Explicitly say: the pilot data are fictional; a requirement is not an achieved result. Keep this case through the five sections.","sourceRange":"1, 3","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"Five source sections. Five measurable outcomes. One bounded decision.","bullets":[["Explain","Name the mechanism and operating assumptions."],["Evidence","Use the given observations, not invented results."],["Revise","Keep the original decision and its changed justification."]],"question":"Which outcome needs a calculation, and which needs evidence about how users actually work?","answer":"Outcome 2 requires quantitative metrics and a testable requirement. Outcome 5 requires an operational profile, a matching test dataset, failure records and an account of uncertainty.","full":"<p>The five chapter outcomes operationalize the five objectives in the supplied textbook. They are chapter learning objectives, not a replacement for the approved course CLO numbering.<\/p><p>The classroom route contains 20 slides, including practice and application. Full explanations, original figures and named required reading retain the source detail. The iSCARB toolkit is separate; only activities explicitly named in the classroom or assignment are required.<\/p><p>Suggested teaching plan: two blocks of 60–75 minutes, pausing after Software diversity. Complete the named source review and five-objective practice before the portfolio task. These are planning estimates; Blackboard supplies the actual timetable, marks and deadline.<\/p>","notes":"Read the five verbs, then point to where each will be practised. Do not introduce additional graded outcomes or deadlines. Explain that required source reading is not the same as optional toolkit enrichment.","sourceRange":"2, 2","sourceStart":2},{"id":"START","title":"The story we will solve","phase":"SEE","takeaway":"The gateway is available. Is the release dependable?","question":"Hold, restrict or release—and which metric supports that scope?","bullets":[]},{"id":"FAULT","title":"Human error → fault → error → failure","phase":"LEARN","takeaway":"A defect is not the same event as a failed service.","bullets":[["Fault","A system characteristic that can cause an erroneous state."],["Error","An incorrect state during execution; failure is the user-visible event."],["Not inevitable","Faulty code may not run; state may reset; detection or protection may intervene."]],"question":"In the midnight example, identify the state error and the service failure. Where could recovery interrupt the chain?","answer":"The state error is a transmission time of 24:xx instead of 00:xx. The failure is the missing weather transmission. A validity check and a correct rollover/recovery action can stop the erroneous state from causing the missed service.","full":"<p>The chapter distinguishes a human mistake, the resulting system fault, an erroneous executing state, and a service failure. Its weather-station example makes the distinction concrete: adding one hour without a midnight check introduces a fault; executing that code can create 24:xx; failing to transmit is the failure.<\/p><p>The chain is conditional. Some faulty code is never executed. Another input can restore a transient incorrect value before it affects a service. Detection and protection can prevent the erroneous state from reaching users. Users may also avoid inputs known to trigger defects. Therefore, fault counts and experienced failure counts are not interchangeable.<\/p>","notes":"Have one student name the cause, another the state, and a third the lost service. Resist treating “bug” as a sufficient answer. This vocabulary will govern all metric numerators.","sourceRange":"4, 5","nodes":[["Human error","Choose “add one hour” without checking midnight."],["System fault","Code has no rollover check at 23:00."],["System error","The executing state contains 24:xx."],["System failure","Expected weather data is not transmitted."]],"sourceStart":4},{"id":"MANAGE","title":"Avoid, detect, tolerate","phase":"LEARN","takeaway":"Reduce faults before release; manage the ones that remain at runtime.","bullets":[["Avoidance","Use development practices that reduce the introduction of faults."],["Detection + correction","Use verification, validation, testing and static analysis before deployment."],["Tolerance","Detect and manage runtime errors so service need not fail."],["Cost boundary","The source curve is qualitative: finding the remaining faults becomes increasingly expensive."]],"question":"A static analyzer finds a defect; a standby server takes over during an outage. Which approach does each support?","answer":"The analyzer supports fault detection and correction. The standby transition supports fault tolerance, provided it actually preserves or restores the required service. A design intention alone is not evidence that failover worked.","full":"<p>These are complementary approaches, not competing labels for one activity. Fault avoidance tries to prevent mistakes from becoming system faults. Fault detection and correction removes faults through verification and validation before operational use. Fault tolerance manages residual faults or erroneous behavior during execution.<\/p><p>Figure 11.1 shows the rising cost per error detected as residual errors become fewer. It contains no currency values or numerical break-even point. The chapter argues that residual faults remain even after substantial engineering, and that release decisions depend on system type, failure consequences and wider acceptability—not cost alone.<\/p><p>Course application: a static-analysis report supports a detection claim; a failover drill supports a runtime tolerance claim. Neither establishes a measured availability target by itself.<\/p>","notes":"Use the actual source curve. Do not invent a dollar threshold or promise zero faults. Ask students to distinguish a mechanism from evidence that it achieved its target.","sourceRange":"6, 8","figure":"assets/v3/ch11-fig-1.png","caption":"Figure 11.1 · The increasing costs of residual fault removal","sourceStart":6},{"id":"RELAV","title":"Availability is not reliability","phase":"LEARN","takeaway":"“Ready to serve” and “correct service over time” answer different questions.","bullets":[["Reliability","Probability of failure-free operation over a stated time, in a given environment, for a specific purpose."],["Availability","Probability that the system is operational and can deliver requested service at a point in time."],["Use matters","Different inputs and expectations produce different experienced reliability."],["Recovery matters","More frequent failures can still yield less total downtime when restoration is fast."]],"question":"Which has better annual availability: A with one six-hour outage, or B with twelve five-minute outages? Explain.","answer":"B: 12 × 5 = 60 minutes of annual downtime, versus A’s 360 minutes. The calculation does not erase differences in outage consequences, timing or affected users.","full":"<p>The definitions require boundaries: a service, purpose, operating environment and relevant time. Conformance to a specification does not settle all user expectations if that specification is incomplete or incorrect.<\/p><p>Figures 11.2 and 11.3 explain why the same program may appear reliable to one user and unreliable to another: their input sets intersect the faulty behavior differently. Removing a fixed percentage of faults therefore need not improve experienced reliability by the same percentage.<\/p><p>Source comparison: system A fails once per year and takes six hours to restart—360 minutes unavailable. System B fails every month and takes five minutes to restart—60 minutes unavailable over the year. B has better availability in this example, despite more frequent failures. Outage timing, duration and the number of affected users still matter beyond a single percentage.<\/p>","notes":"Ask the class before revealing the calculation. Explicitly keep the exact source definitions. The original input/output figure is also available under required foundations reading.","sourceRange":"10, 16","figure":"assets/v3/ch11-fig-3.png","caption":"Figure 11.3 · Software usage patterns","sourceStart":10},{"id":"METRICS","title":"Choose the metric—and its denominator","phase":"LEARN","takeaway":"A number without a failure definition and exposure unit is not a specification.","bullets":[["POFOD","Use for failure of a demanded service; particularly important for protection demands."],["ROCOF","Use for regular activity; say “per hour”, “per day” or “per N transactions”."],["MTTF","Useful for long transactions; compare it with the time users work between saves."],["Probability ≠ schedule","POFOD = 0.001 does not mean exactly every thousandth demand fails."]],"question":"For two failures in 1,000 hours, compute ROCOF and its reciprocal. State the units.","answer":"ROCOF = 2 / 1,000 = 0.002 failures/hour. Reciprocal = 500 hours (MTTF in the chapter’s rate treatment). The event definition and measurement window must accompany the result.","full":"<p>POFOD expresses the probability that a demand will fail. The textbook explicitly says it applies to serious failure-on-demand situations irrespective of demand frequency; protection demands are commonly rare, but rarity is not the definition.<\/p><p>ROCOF expresses failures relative to an exposure unit. In a continuously operating system, use calendar time; for variable-load transaction processing, the chapter also permits a transaction-count unit. MTTF is the reciprocal of a time-based ROCOF in the chapter’s treatment. For example, two failures per hour gives 0.5 hour, or 30 minutes.<\/p><p>The case has two different numerators: 20 failed call attempts out of 10,000 demands, and two service outages in 1,000 calendar hours. They describe different events. The first estimate is 0.002 per demand; the second is 0.002 service outages per hour. Equal numerical values do not make the metrics interchangeable.<\/p><p>These observed ratios are estimates for their stated dataset, not proof of a future reliability guarantee.<\/p>","notes":"Write the units beside each calculation. Differentiate outage events from failed requests. Explain the reciprocal within the chapter’s metric model; do not present it as a universal distributional identity.","sourceRange":"19, 22, 71","rows":[["POFOD","Probability of failure on demand. Estimate: failed demands ÷ total demands."],["ROCOF","Rate of occurrence of failures. Estimate: failures ÷ stated time or execution count."],["MTTF","Mean time to failure. In the chapter’s rate model: 1 ÷ ROCOF, with consistent units."]],"heads":["METRIC","MEANING / OBSERVED ESTIMATE"],"sourceStart":19},{"id":"AVAIL","title":"Turn availability into a time budget","phase":"LEARN","takeaway":"Unavailable time = (1 − AVAIL) × the stated service window.","bullets":[["Window","Use the service’s agreed operating period; do not silently switch between 16 and 24 hours."],["Recovery","Availability includes time lost while service is repaired or restarted."],["Source note","The final two rows differ arithmetically. Original figures are retained beside the explicit calculation."]],"question":"The pilot loses one hour in a 1,000-hour service window. Is the observed availability 99.9% or 99.99%?","answer":"99.9%: (1,000 − 1) / 1,000 = 0.999. For 99.99% over the same window, unavailable time would be 0.1 hour (six minutes). This comparison is arithmetic, not a statistical certification.","full":"<p>The displayed formula is a course derivation of the source’s fraction-of-time definition. In a 24-hour window, there are 86,400 seconds. Thus (1 − 0.999) × 86,400 = 86.4 seconds and (1 − 0.9999) × 86,400 = 8.64 seconds.<\/p><p>Figure 11.4 in the supplied textbook (p.313), and slide 23 in the supplied deck, print 84 and 8.4 seconds. Their wording is not silently replaced: both original source values remain visible, and the original page is embedded.<\/p><p>The source’s ATM database illustration uses 0.9999 between 7 am and 11 pm, not necessarily all 24 hours. Its individual-ATM example uses 0.999 and also discusses mechanical faults and lack of cash. These are textbook examples, not required service levels for a real deployment.<\/p><p>Case calculation: one unavailable hour in a 1,000-hour service window gives AVAIL = 999/1,000 = 0.999, or 99.9%. A proposed 99.99% target is not met by that observed ratio.<\/p>","notes":"Explicitly distinguish source transcription from arithmetic. Ask students to calculate rather than memorize the table. Never hide the discrepancy or cite calculated numbers as the source’s wording.","sourceRange":"22, 23, 28, 29","rows":[["0.9","144 minutes","144 minutes"],["0.99","14.4 minutes","14.4 minutes"],["0.999","84 seconds","86.4 seconds"],["0.9999","8.4 seconds","8.64 seconds"]],"heads":["AVAIL","SOURCE TABLE / 24 h","CALCULATED / 24 h"],"sourceStart":22},{"id":"REQ","title":"Specify the target and the mechanism","phase":"LEARN","takeaway":"Non-functional requirements set the level; functional requirements say what the system must do.","bullets":[["Measurable target","Name the service, failure class, environment, metric and observation window."],["Different consequences","Require fewer high-cost failures; distinguish critical and less-critical services."],["Useful evidence","Quantification supports testing decisions and comparing design strategies."],["Avoid overspecification","Do not demand the same extreme target everywhere without a need."]],"question":"“Store recoverable copies on separate servers” is which kind of requirement? What quantitative target is still missing?","answer":"It is a functional recovery/redundancy requirement. It still needs the relevant service-level target and verification conditions—for example an explicit availability requirement, service window and recovery test. Copies alone do not establish the achieved target.","full":"<p>A target such as an availability value is non-functional. A requirement to maintain a recoverable database copy is functional. The chapter’s four functional categories are checking, recovery, redundancy and process; requirements may span more than one category.<\/p><p>Figure 11.5 gives four examples: defined input ranges; patient database copies on servers in different buildings; N-version braking-control software; and a safe Ada subset checked by static analysis. The copy requirement combines recovery and redundancy.<\/p><p>The Warsaw landing example illustrates a specification that omitted a rare situation: software conformed to its specification while the wider system failed. Do not infer that specification conformance alone establishes dependable service.<\/p><p>The chapter differentiates ATM database and individual ATM availability, and transient versus permanent failures in its insulin-pump example. Those example targets are preserved in required reading as source illustrations—not as current banking standards, clinical advice or accepted targets for this teaching case.<\/p>","notes":"Ask for a target and a mechanism as two separate sentences. Use the database-copy example to show that functional categories can overlap.","sourceRange":"18, 18, 24, 32","rows":[["Checking","Detect invalid or out-of-range inputs before processing."],["Recovery","Maintain copies and define how to restore service after failure."],["Redundancy","Prevent one component failure from removing the entire service."],["Process","Require development practices that help avoid introducing faults."]],"heads":["FUNCTIONAL TYPE","WHAT TO SPECIFY"],"sourceStart":18},{"id":"PROTECT","title":"Replication and protection solve different problems","phase":"LEARN","takeaway":"Replicate a service to continue it; protect a process by moving it to a safe state.","bullets":[["Replicated servers","A manager detects a missing response and resubmits unfinished work to another server."],["Shared design limit","Identical software copies cannot remove a fault that makes every copy fail."],["Protection system","An independent, simpler monitor triggers an emergency action or safe shutdown."],["Separate sensing","The source architecture gives the protection system its own sensor set."]],"question":"Why is adding an identical second server insufficient evidence that a shared software bug is tolerated?","answer":"The same input and design fault can affect both identical versions. Redundancy covers some single-machine failures, but diversity and common-cause analysis are needed before claiming protection from software design failures.","full":"<p>The chapter first describes replicated servers: a management component distributes requests, tracks responses and switches out a failed server. Unfinished requests can be reassigned. Transaction processing is suitable because updates are committed after successful completion. A backup may normally handle low-priority work.<\/p><p>This adds redundancy, but not normally software diversity. It handles hardware or localized single-machine failures, not a common software design fault.<\/p><p>A protection system has a different purpose. It monitors equipment and environment independently and takes the critical action needed for a safe state. The source train example applies brakes after passing a red signal; another example releases pressure or shuts down a process. Its smaller scope can make more intensive verification practical.<\/p><p>Course application: a campus switch needing continuous communication cannot be justified merely by borrowing a shutdown-based protection design. Define whether stopping the service is an acceptable state before choosing the architecture.<\/p>","notes":"Trace the protection sensors and the control sensors separately on the original figure. Ask which service continues and which is deliberately stopped.","sourceRange":"34, 38","figure":"assets/v3/ch11-fig-6.png","caption":"Figure 11.6 · Protection system architecture","sourceStart":34},{"id":"SELFCHECK","title":"Self-monitoring architectures","phase":"LEARN","takeaway":"Agreement is a condition to check—not a proof that every shared assumption is correct.","bullets":[["Two channels","Compute separately; compare results and their timing."],["Mismatch","Raise a failure status so control can transfer or the system can stop."],["Diversity","Different hardware and software reduce the chance of matching common-mode errors."],["High availability","The source Airbus case uses several self-checking computers in parallel."]],"question":"Two channels disagree. What does the comparator establish, and what must the surrounding architecture decide?","answer":"It establishes an inconsistency or timing failure under its comparison rule; it does not establish which result is correct. The wider architecture must define safe shutdown, transfer or selection of another consistent system.","full":"<p>In Figure 11.7 a splitter feeds two computational channels and a comparator checks their outputs. Identical outputs available at the same time are taken as an indication of correct operation. A disagreement raises a status signal so another system can take control.<\/p><p>A single self-monitoring pair can detect disagreement but does not, by disagreement alone, identify which answer is correct. Where correctness takes priority and stopping is acceptable, it may shut down. Where continued service is required, the chapter uses several self-checking systems plus switching/filtering.<\/p><p>The supplied historical Airbus 340 example (Figure 11.8) has five computers, three primary and two secondary. The design uses different processors and chipsets, simpler critical-only secondary software, different languages and separate teams. The source explicitly cautions that these choices reduce common failures without guaranteeing independence. Its historical operational claims are not updated performance claims in this lecture.<\/p>","notes":"Point to the status line as distinct from the result line. Open the source Airbus figure for the mandatory case review; describe it as the textbook’s example, not every contemporary Airbus system.","sourceRange":"39, 43","figure":"assets/v3/ch11-fig-7.png","caption":"Figure 11.7 · Self-monitoring architecture","sourceStart":39},{"id":"VOTE","title":"From TMR to N-version programming","phase":"LEARN","takeaway":"A majority vote masks some disagreements; it does not validate the specification.","bullets":[["TMR","Three replicated hardware units; ignore one differing output when the other two agree."],["N-version software","Separate teams implement a common specification and execute versions in parallel."],["Voting","Compare outputs; reject inconsistent or late results. At least three versions support a one-version failure case."],["Trade-off","Multiple implementations cost more; common specification faults remain possible."]],"question":"Outputs are 18, 18 and 24. What does majority voting select? What fact would defeat the claim that 18 is correct?","answer":"The voter selects 18. A common specification or algorithm fault could make both agreeing versions wrong; agreement alone does not establish correctness. Late outputs must also be handled by the specified timing rule.","full":"<p>Triple modular redundancy (Figure 11.9) replicates hardware and chooses the majority output. It relies on component failures being sufficiently independent, rather than the units all sharing a design error. A faulty unit can be repaired or removed, leaving two working units.<\/p><p>N-version programming (Figure 11.10) brings the multiversion idea into software. Several teams implement a common specification; the versions run on separate computers. A voter rejects inconsistent or untimely outputs. At least three versions allow two to agree when one differs.<\/p><p>The chapter says N-version development can be expensive because multiple teams develop the implementations. It is especially relevant when failure consequences are very high and a simple protection system cannot provide a suitable safeguard. Voting selects an agreed result; it does not determine whether the common requirements describe the right behavior.<\/p>","notes":"Let students vote first, then ask whether two copies of the same misconception can agree. Do not introduce an unsupported system-level probability formula.","sourceRange":"44, 48","figure":"assets/v3/ch11-fig-10.png","caption":"Figure 11.10 · N-version programming","sourceStart":44},{"id":"DIVERSITY","title":"Diversity reduces shared failure—not uncertainty","phase":"LEARN","takeaway":"Different teams can still make the same mistake.","bullets":[["Common origins","Teams may share education, assumptions and difficult design problems."],["Common requirements","A requirements error can survive every implementation or specification translation."],["Independence","A diversity policy is not evidence of complete channel independence."],["Cost / benefit","The chapter reports historical gains of 5–9× in one analysis—not a universal guarantee."]],"question":"Name one shared failure that different languages do not remove. What evidence would you request?","answer":"A wrong requirement, common specification misunderstanding, or shared environmental assumption can affect different languages. Request a requirements review and scenario/counterexample evidence targeting that shared assumption—not just a list of language names.","full":"<p>The chapter proposes diversity policies covering design methods, languages, tools and selected algorithms. Separate teams may still misunderstand the same ambiguous specification, share similar training, or select the same algorithm. Independently expressed formal, state-based and natural-language specifications may reduce interpretation errors but can also introduce translation inconsistencies; none removes a wrong underlying requirement.<\/p><p>The idealized numerical passage on p.324 is retained in the original source. This lecture does not turn the product of three per-channel probabilities into a majority-voting system failure rate. The failure event, architecture and independence assumptions must be defined before a system probability can be derived. See Source notes for this interpretation boundary.<\/p><p>The 5–9× figure is the chapter’s report of a historical analysis. It does not predict the performance of a new system. The source’s practical question is whether the benefit justifies multiple development teams, or whether one well-engineered version plus a limited backup is sufficient.<\/p>","notes":"This is a useful pause between teaching blocks. Ensure the source’s historical numerical claim is bounded. Ask for a common-cause counterexample before allowing an independence claim.","sourceRange":"49, 52","nodes":[["Design","Different methods or representations."],["Language","Different implementation languages."],["Tools","Different development environments."],["Algorithm","Different ways to solve selected problems."]],"sourceStart":49},{"id":"CODE1","title":"Dependable programming guidelines","phase":"LEARN","takeaway":"Eight guidelines: stop invalid states spreading, then recover within bounds.","bullets":[["Checks","Validate against stated domain assumptions—not a universal rule for every name or sensor."],["Timeout","Take a defined recovery or reporting action; do not wait indefinitely."],["Recovery","Backward error recovery restores a checkpoint instead of repeating all previous work."]],"question":"(1) A sensor value passes a numeric type check but is implausible compared with its earlier readings. Which check is missing? (2) A remote service never replies during a long task. Name two mechanisms that limit the resulting loss.","answer":"(1) A reasonableness check using the expected relationship across the series. A range check may also be relevant, but a valid range and representation alone do not establish that the sequence is plausible. (2) An external-call timeout returns control so a defined failure action can run. A valid saved checkpoint allows work to restart without losing the whole long transaction. State what is saved and what action follows timeout.","full":"<p>Information hiding applies a “need to know” principle to program state. An abstract data type exposes operations while hiding representation; the chapter’s queue may change from an array to a linked list without changing callers.<\/p><p>Input checks cover range, size, representation and reasonableness. The source examples illustrate assumptions; they should not become universal validation policies. The response to invalid data depends on the system: ask for re-entry, use a valid earlier reading, or apply a justified recovery strategy.<\/p><p>Exception handlers may notify a calling component, perform alternative processing, or pass control to runtime support. The last choice must be compatible with a safe state. The source diagram separates normal and exceptional control flow.<\/p><p>The source cautions about goto, floating-point precision, pointers, dynamic allocation, parallelism, recursion, interrupts, aliasing, unbounded arrays and default input processing. The supplied slide deck additionally discusses inheritance. These are not all universally banned; the chapter says to minimize their risky use and contain effects when they are needed.<\/p><p>Short transaction systems commit changes after successful processing. Long transactions and expensive calculations need saved state so that a failure does not discard all progress. Backward error recovery resets the program to a saved checkpoint.<\/p><p>Bounds checking prevents an index from reaching data outside the allocated array. The required check depends on the language/runtime and the actual array limits. It is a deliberate program check when not provided automatically.<\/p><p>A remote component can fail silently. A timeout defines how long to wait before taking back control and executing a specified recovery or user-reporting action. A timeout is therefore part of a behavior specification, not just a convenient constant.<\/p><p>Name real-world constants to make incorrect identifiers detectable and changes localized. The source’s tax-rate illustration is an example of a slowly changing parameter, not a tax rule. All eight source guidelines remain together in Figure 11.11 in the gallery.<\/p>","notes":"Require all four guideline names and mechanisms. Use the required Programming A reading for exception strategies and the complete error-prone list. Do not turn historical validation examples into universal domain rules. Ask “what happens after the timeout?” and “which state can be safely restored?” Simply inserting try/catch or retry is not a complete explanation.","sourceRange":"54, 65–66, 69","rows":[["1 · Limit information visibility","Hide representation; expose only required operations through an abstract data type."],["2 · Validate all inputs","Check range, size, representation and reasonableness before processing."],["3 · Handle all exceptions","Signal the caller, recover with alternative processing, or transfer to runtime support."],["4 · Minimize error-prone constructs","Limit hazardous effects; encapsulate unavoidable complexity."],["5 · Provide restart capabilities","Save checkpoints; restart long work from a valid saved state."],["6 · Check array bounds","Reject an index outside the actual allocated range."],["7 · Include external-call timeouts","Regain control when the expected response does not arrive in time."],["8 · Name real-world constants","Use one meaningful declaration rather than repeated numeric literals."]],"heads":["SOURCE GUIDELINE","HOW IT HELPS"],"sourceStart":54,"fullTable":true},{"id":"MEASURE","title":"Statistical testing measures reliability","phase":"LEARN","takeaway":"Use representative operation—not a defect-hunting dataset—to estimate experienced reliability.","bullets":[["Profile","Identify input classes and the probability of each in normal use."],["Dataset","Generate tests that match this distribution."],["Observation","Record failure counts, types, times and restoration duration."],["Estimate","Compute the metric with suitable evidence and exposure units; a test run is not a guarantee."]],"question":"Why can a suite designed to expose rare defects be unsuitable for estimating reliability experienced in normal use?","answer":"It changes the input distribution: rare fault-triggering cases may be overrepresented. It is valuable for fault detection, but a reliability estimate needs a dataset matched to the intended operational profile.","full":"<p>Statistical testing is explicitly aimed at reliability measurement rather than finding faults. A defect-hunting dataset intentionally concentrates on unusual or difficult cases and will not normally represent the frequency of actual use.<\/p><p>The source process has four stages: identify operational profiles, prepare a matching test dataset, apply tests and record failures, and compute observed reliability after sufficient failure observations. Record failed demands and total demands for POFOD, intervals/exposure for ROCOF and MTTF, and recovery time for availability.<\/p><p>The unit must match the service: time for continuous operation or a transaction count where load varies. Retain the failure classification and the criterion used to decide that an output constitutes failure. Otherwise two observers may count different events.<\/p><p>Course evidence artifact: a versioned profile, test-generator configuration, dated run log, metric worksheet and unresolved limitations. The chapter does not supply a universal sample size or confidence procedure for every target.<\/p>","notes":"Contrast two purposes: “Can I break it?” and “How often does service fail under this use?” Both are important; one dataset cannot be assumed to answer both.","sourceRange":"71, 75","figure":"assets/v3/ch11-fig-13.png","caption":"Figure 11.13 · Statistical testing for reliability measurement","sourceStart":71},{"id":"PROFILE","title":"The operational profile is part of the claim","phase":"LEARN","takeaway":"Change the way people use the system, and the old estimate may no longer apply.","bullets":[["Classes + probabilities","A few frequent input classes can dominate while many uncommon classes remain possible."],["Evidence source","Use existing usage data when appropriate; label assumptions for a new system."],["Generation","Automation helps, but interactive inputs may depend on earlier outputs."],["Drift in use","Users learn and change behavior; one static profile may not represent every user or period."]],"question":"An assumed 70/20/10 profile generates 1,000 tests. How many belong to each class, and what changes if use shifts?","answer":"700, 200 and 100. If actual use shifts, update the class probabilities and representative test dataset; the previous estimate remains bounded to its previous profile.","full":"<p>An operational profile describes input classes and their probabilities in actual use. The source histogram is qualitative: it does not supply a numerical distribution. Historical patterns can help when a new system replaces a comparable existing one.<\/p><p>Innovative systems are harder: different users have different expectations and may use functions in unforeseen ways. Generating interactive input sequences is also difficult because an input may be a response to the previous output.<\/p><p>Course-created planning example: 70% internal calls, 20% conferences and 10% external calls would allocate 700, 200 and 100 of 1,000 generated demands. This is an assumed teaching profile, not observed campus data and not the numerical values of Figure 11.14.<\/p><p>If external calls become 60% of use, the original dataset is no longer representative without a revised argument. Update the profile, generation plan and reliability claim rather than just quoting the old aggregate result.<\/p>","notes":"Point out that the source graph has no percentages. The 70/20/10 example is a labelled course calculation. Ask students where they would obtain real use data without collecting unnecessary personal information.","sourceRange":"76, 78","figure":"assets/v3/ch11-fig-14.png","caption":"Figure 11.14 · Distribution of inputs in an operational profile","sourceStart":76},{"id":"LIMITS","title":"What the measurement cannot settle","phase":"LEARN","takeaway":"A precise-looking result can still have an uncertain basis.","bullets":[["Four limits","Profile mismatch, costly data, few failures and ambiguous specifications constrain the estimate."],["Fault injection","Injected faults must resemble actual faults; programming defects do not stand in for every design error."],["Growth models","The source introduces improving reliability as faults are repaired; it supplies no fitted model here."]],"question":"A run has no observed failures. What must you still report before calling the system “reliable”?","answer":"The profile, exposure/sample size, service and failure definition, operating conditions and statistical uncertainty. No observed failure in one bounded test is not proof of zero future failure probability.","full":"<p>The source identifies four difficulties. First, a profile borrowed from another system may not reflect actual use. Second, generating a large representative dataset is expensive, especially with interactive behavior. Third, highly reliable systems produce few failures, making precise measurement difficult. Fourth, the specification or service expectation may be ambiguous, so failure recognition may be contested.<\/p><p>Fault injection can probe how faults become failures, but inference to naturally occurring defects assumes the injected types and distribution are representative. The chapter says that this is more plausible for programming faults than for requirements or design errors. Do not turn the fraction of detected injected defects into an unqualified estimate of all real defects.<\/p><p>The reliability-growth sidebar explains the idea of repairing underlying faults as tests reveal failures. Translating that concept into a mathematical model requires additional work. No model parameters, universal test size or certainty threshold are provided by the supplied pages.<\/p>","notes":"Do not invent a confidence interval or certification rule from a zero-failure run. Keep the limitation visible rather than adding it only after an impressive number.","sourceRange":"75, 78","nodes":[["Profile uncertainty","Does the test represent actual use?"],["Data cost","Can enough suitable inputs be generated?"],["Statistical uncertainty","Are rare failures sufficiently observed?"],["Failure recognition","Do observers agree on what failed?"]],"sourceStart":75},{"id":"AISYS","title":"Compute it: is the classifier reliable?","phase":"LEARN","banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · COMPUTE BEFORE YOU TRUST","caption":"The vendor says 98% accurate. Two minutes with the pilot data tell a different story."},"skin":"genai","takeaway":"Ninety-seven per cent correct—and still missing phishing. Find the denominator that matters.","fullTable":false,"bullets":[["Compute accuracy","All correct labels ÷ all messages."],["Compute phishing POFOD","Missed phishing ÷ phishing demands."],["Check the exposure","How many demands support that estimate?"]],"question":"Compute both numbers. Which one can support a protection claim, and what caveat do 50 demands require?","answer":"Accuracy = (40 + 931) / 1,000 = 97.1%. Phishing POFOD = 10 / 50 = 0.2 per phishing demand. False-alarm rate = 19 / 950 = 2.0%. Only the POFOD for the protection demand can support a protection claim, stated with its exposure (50 demands) and its profile (10% external traffic). Accuracy averages over messages that are not protection demands and hides the misses. With 50 demands the estimate is uncertain: a standard 95% interval for 10/50 runs from roughly 11% to 33%.","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source metrics to an AI component","notes":"Allow about 6 minutes. Format: calculation. Give pairs 2 minutes to compute before revealing anything. New terms, at most two: confusion matrix and distribution shift. The pilot figures are fictional. Everything else in Full explanation is optional depth and is not assessed.","full":"<p>This slide is course-added. The table is a <b>confusion matrix<\/b>: rows are what each message really was, columns are what the classifier did. Each reliability claim should name which cells count as failures and which row counts as demands.<\/p><h3>How the slide uses the five objectives<\/h3><p>Availability versus reliability: the classifier is always up, which says nothing about its labels. Metrics: POFOD needs the protection demand as denominator. Fault tolerance: a second model trained on similar data may share blind spots; a rule-based check or human review is more likely to fail differently, but that too needs a warrant. Programming: validate inputs and outputs, and time out with a defined action if the model service does not reply. Statistical testing: evaluate on this gateway’s operational profile, not the vendor’s benchmark.<\/p><p><b>Distribution shift.<\/b> The inputs in operation differ from those the model learned from or was evaluated on. It is an operational-profile change: the old estimate stays bounded to the old profile.<\/p><p><b>Calibration.<\/b> A confidence score is calibrated when, among cases scored at about 0.9, about 90% are correct. Do not read scores as probabilities until this is checked on data from this gateway.<\/p><p><b>Uncertainty with few failures.<\/b> Ten failures in fifty demands gives 0.2, but a standard 95% (Wilson) interval runs from about 0.11 to 0.33. Report exposure and uncertainty, as the chapter’s limits slide requires.<\/p><p class=\"small\">The case and figures are course-created. Optional further reading: Sculley et al. (2015), <i>Hidden Technical Debt in Machine Learning Systems<\/i>.<\/p>","sourceStart":1,"heads":["PILOT · 1,000 EXTERNAL MESSAGES","FLAGGED AS PHISHING","DELIVERED"],"rows":[["Actually phishing (50)","40","10 missed"],["Actually legitimate (950)","19 false alarms","931"]]},{"id":"REVISE","title":"Revise, verify, own","phase":"CHECK","takeaway":"An estimate does not travel to a new profile.","bullets":[["New information","External traffic rises from 10% to 60%; the classifier learned mostly internal mail."],["Reassess","The POFOD estimates belong to the old profile."],["Revise","Restrict the release claim; re-measure on a representative mix."],["Own","Name who accepts the restricted scope and who must be told."]],"question":"What changes now? Record the revised decision, the next evidence, and how any AI contribution was checked.","answer":"Revise the profile and representative test dataset before transferring the old measured ratio to the new traffic mix. Keep the claim limited while testing. Name the decision owner and reviewer. Disclose AI use and verify any calculation or generated tests independently; do not mark a proposed test as completed evidence. For the classifier, the profile change is also a distribution shift: re-measure its phishing POFOD on a representative external mix before claiming protection, and tell the users whose mail it screens if protection is reduced meanwhile.","full":"<p>Course-created constraint mutation: external calls rise from the assumed 10% to 60% of demand, while the same two-server design remains. The earlier profile no longer supports the same reliability claim without fresh evidence. Keep the earlier decision, record the revision and identify the reviewer who must approve the new boundary.<\/p><p>Disclose AI assistance, or state “No AI used.” An AI-produced test plan or calculation is a proposal until independently checked. Record the calculation or executed test, result, version and human review—not merely the generated answer. Use the full permissibility gate in the toolkit for evidence-chain use.<\/p><p>Finish the named source review and five-objective check before the portfolio task. The toolkit includes the exact twenty iSCARB rules, the six H-Stack capabilities, four-level rubric and evidence policy. The readiness page records proposed knowledge/skill/value links; official NCAAA/Jaheziah item-code alignment is not claimed because the governing matrix is not among these Chapter 11 sources.<\/p>","notes":"Close with an observable revision, not a slogan. A student may keep the same verdict only with a new explanation of its scope. Remind them where required reading ends and optional tool practice begins.","sourceRange":"78, 81","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"sourceStart":78,"aiTag":true},{"id":"END","title":"Chapter complete","phase":"END","takeaway":"","question":"","bullets":[]}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. Hold, restrict or release—and which metric supports that scope? Which metric fits the classifier’s phishing demand?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. The example gives POFOD 0.002 per demand, ROCOF 0.002 outages/hour and availability 99.9%; these describe different events and exposures. For the classifier, overall accuracy of 97.1% hides the protection demand: it missed 10 of 50 phishing messages, a POFOD of 0.2 per phishing demand, measured on only 50 demands.","no":1,"at":"METRICS","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, an identical second server, or a second AI classifier as a “diverse” version.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. A second classifier trained on similar data may share the same blind spots, as N-version teams can share a specification error; a rule-based check or human review is more likely to fail for different reasons, but that too needs a warrant.","no":2,"at":"DIVERSITY","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"External traffic changes from the assumed 10% to 60%; no representative result under that mix is supplied. The classifier was trained mostly on internal messages.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The classifier’s miss rate was measured on a mostly internal mix; under 60% external traffic it faces inputs unlike its training data, so its phishing POFOD must be re-measured before any protection claim.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"REVISE","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","METRICS"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["DIVERSITY"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["DIVERSITY","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["DIVERSITY","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["METRICS","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["REVISE"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Reliability metrics and requirements","range":"19–24"},{"title":"Measurement and operational profiles","range":"70–75"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Faults, failures and management","start":3,"end":8,"units":["TITLE","FAULT","MANAGE"]},{"title":"Reliability, availability and perception","start":9,"end":16,"units":["RELAV"]},{"title":"Metrics and quantitative requirements","start":17,"end":30,"units":["METRICS","AVAIL","REQ"]},{"title":"Functional reliability requirements","start":31,"end":32,"units":["REQ"]},{"title":"Fault-tolerant architectures and diversity","start":33,"end":52,"units":["PROTECT","SELFCHECK","VOTE","DIVERSITY"]},{"title":"Dependable programming","start":53,"end":69,"units":["CODE1"]},{"title":"Measurement and operational profiles","start":70,"end":81,"units":["METRICS","MEASURE","PROFILE","LIMITS","REVISE"]}],"sourceCount":81,"original":"sources/Ch11-Original.pptx","textbook":"sources/Ch11-Textbook.pdf","bookPages":33,"quiz":[{"q":"A fails once per year with six hours of downtime. B fails monthly with five minutes each time. Which statement is supported?","options":["A must have higher availability because it fails less often.","B has less annual downtime; consequences and timing still need context.","A and B have equal availability because both recover.","Their reliability and availability are identical metrics."],"answer":1,"why":"B loses 60 minutes per year versus A’s 360. Availability accounts for restoration time; event frequency alone is insufficient."},{"q":"Eight defined service failures are observed in 4,000 hours. Which pair has the correct time-based units?","options":["ROCOF 0.002 failures/hour; reciprocal MTTF 500 hours.","POFOD 0.002/hour; AVAIL 500 hours.","ROCOF 500 failures/hour; MTTF 0.002 hours.","AVAIL 0.002; reliability is therefore 99.8%."],"answer":0,"why":"8/4,000 = 0.002 failures/hour; the chapter’s reciprocal-rate metric is 500 hours. Availability cannot be computed without downtime/service-window information."},{"q":"Three independently staffed teams build versions from the same erroneous requirement. They all return the same wrong output. What failed in the assurance argument?","options":["The odd number of versions made voting impossible.","Programming language diversity always prevents this, so the observation cannot occur.","Independent teams were treated as proof of independent failures.","Majority voting should use the slowest output instead."],"answer":2,"why":"Shared requirements can produce common errors in different implementations. Team separation and agreement do not guarantee independence or correct requirements."},{"q":"A caller blocks forever when an external component silently fails. Which change directly addresses the chapter’s guideline?","options":["Rename local variables without changing control flow.","Keep retrying indefinitely because a second attempt is always safe.","Hide all error messages but leave the waiting condition unchanged.","Set an external-call timeout and a specified recovery or reporting action."],"answer":3,"why":"A timeout bounds the wait and returns control. The program must then execute a defined failure response, rather than merely hiding the symptom."},{"q":"Tests use last year’s input mix, but users now rely mainly on a formerly rare feature. What is the sound conclusion?","options":["The old measured ratio remains a guarantee for any input mix.","The operational profile and representative tests need review before transferring the claim.","Run only the former rare cases and call the result normal-use reliability.","Count repaired source-code faults instead of failures."],"answer":1,"why":"Reliability in use depends on the operational profile. Defect-targeting tests and representative reliability measurement have different purposes."}],"alignment":[{"objective":"Distinguish reliability from availability and explain how use and recovery affect them.","evidence":"Explain and demonstrate: Distinguish reliability from availability and explain how use and recovery affect them.","field":"FIT + technical · practice/reviewer opportunity, not automatic attainment"},{"objective":"Select and calculate POFOD, ROCOF, MTTF and AVAIL; write a measurable requirement.","evidence":"Explain and demonstrate: Select and calculate POFOD, ROCOF, MTTF and AVAIL; write a measurable requirement.","field":"MEASURE · practice/reviewer opportunity, not automatic attainment"},{"objective":"Compare fault-tolerant architectures and justify a choice with its independence assumptions.","evidence":"Explain and demonstrate: Compare fault-tolerant architectures and justify a choice with its independence assumptions.","field":"ACT + EVIDENCE + sourceUse · practice/reviewer opportunity, not automatic attainment"},{"objective":"Apply the eight dependable programming guidelines to a failure scenario.","evidence":"Explain and demonstrate: Apply the eight dependable programming guidelines to a failure scenario.","field":"ACT + EVIDENCE (source application) · practice/reviewer opportunity, not automatic attainment"},{"objective":"Design a statistical reliability test using an operational profile and explain its limits.","evidence":"Explain and demonstrate: Design a statistical reliability test using an operational profile and explain its limits.","field":"BOUND + REFIT · practice/reviewer opportunity, not automatic attainment"}],"artifact":"Build a metric worksheet, fault-tolerant architecture comparison, programming response and operational-profile test plan.","bridge":"Build a metric worksheet, fault-tolerant architecture comparison, programming response and operational-profile test plan. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"DIVERSITY","workload":"Consider who notices failures, how many manual restarts are required and what information survives a handover.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","X01":"FAULT","X02":"MANAGE","X03":"RELAV","X04":"METRICS","X05":"REQ","X06":"AVAIL","X09":"MEASURE","X10":"LIMITS","R08":"VOTE","R09":"PROTECT","R18":"CODE1","APPLY":"REVISE","CODE2":"CODE1"},"roadmap":{"question":"How can reliability be specified, built and measured?","connection":"Define the service → specify a measurable target → design and program for it → test under a representative usage profile.","inClass":"Choose a metric; compare designs; interpret evidence.","deliverable":"A reliability measure, calculation and interpretation.","success":"Explain the denominator, units and operating-profile limits.","branches":[{"verb":"Define the service","label":"Availability and reliability","detail":"Correct results · service uptime · failure mechanisms","target":"RELAV","units":["FAULT","MANAGE","RELAV"],"caseLens":"Is the gateway ready to serve, correct over time, or both?"},{"verb":"Specify the target","label":"Reliability requirements","detail":"POFOD / ROCOF / MTTF / AVAIL · functional controls","target":"METRICS","units":["METRICS","AVAIL","REQ"],"caseLens":"Which metric and exposure unit can support the proposed release claim?"},{"verb":"Design for faults","label":"Fault-tolerant architectures","detail":"Protection · self-monitoring · N-version","target":"PROTECT","units":["PROTECT","SELFCHECK","VOTE","DIVERSITY"],"caseLens":"Do two identical servers protect against the failure mechanism that matters?"},{"verb":"Implement the safeguards","label":"Programming for reliability","detail":"Eight guidelines · prevent, contain and recover","target":"CODE1","units":["CODE1"],"caseLens":"Which programming safeguards prevent, contain, or recover from faults?"},{"verb":"Test the claim","label":"Reliability measurement","detail":"Statistical testing · operational profiles · limits","target":"MEASURE","units":["MEASURE","PROFILE","LIMITS","AISYS","REVISE"],"caseLens":"Does the 10% external-traffic test profile represent the wider release?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"The vendor says 98% accurate. It still misses one phishing email in five.","aiAssignment":{"title":"The admissions chatbot’s reliability number","scenario":"A university deploys an AI chatbot to answer applicants’ questions. The vendor reports 94% correct answers. You must decide whether the chatbot may answer deadline questions without staff review during the final admission week.","facts":["Pilot log: 5,000 questions; 4,700 answered correctly.","200 questions were deadline-critical; 30 of those were answered wrongly.","Pilot traffic was 90% English; the final week is expected to be mostly Arabic."],"question":"Which reliability metric supports the decision, what is its value, and what does it not cover?","stress":"In the final week, 70% of questions are deadline-critical and written in Gulf Arabic dialect. No evaluation on that mix exists, and the chatbot’s answers are already cited in two appeal letters.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023":[["SE-Reliability","Software Reliability","Reliability as probability of failure; reliability requirements; measurement-based analysis and monitoring."],["SE-Validation","Software Verification and Validation","Statistical practice: estimation of uncertainty and confidence intervals."],["SE-Construction","Software Construction","Defensive coding, exception handling and logging (the eight programming guidelines)."],["AI","Artificial Intelligence","Evaluating a learned classifier on the operational profile rather than a vendor benchmark."]]}</script><script src="runtime/classroom-v3.js?v=20260926-genai-v12" defer></script></body></html>
