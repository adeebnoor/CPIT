 units:[
  /* ---------------- TITLE ---------------- */
  {k:'TITLE'},

  /* ---------------- UNDERSTAND ---------------- */
  /* Rule 01. The crisis is the direct consequence of the Chapter 10 verdict, so
     a student who brings their card starts with evidence and a student who does
     not starts with the same case and nothing to stand on. Say that out loud:
     it is the first honest demonstration of why an artifact beats a memory. */
  {k:'R01',rule:'RULE 01 - Decide under uncertainty',phase:'UNDERSTAND / CRISIS',accent:'mag',golden:true,
   learn:'State why an unquantified reliability requirement cannot be accepted, and name what would have to be true to quantify it.',
   title:'You already decided. Now write the number.',
   sub:'The plant is re-tendering the control system. Your Chapter 10 verdict went into the specification. The regulator has just sent it back.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'mag',lab:'WHAT CAME BACK',lead:'One sentence in the tender is rejected, and it is yours.',
      txt:'&ldquo;The control system shall be highly reliable and shall be available at all times.&rdquo; {{regulator}} has returned the specification with one comment: <i>not assessable</i>. The tender closes in nine days and three vendors are waiting on the corrected clause.'},
     {c:'teal',lab:'WHAT YOU HAVE',lead:'A verdict from last week, and no number anywhere behind it.',
      txt:'Your Chapter 10 decision card says the plant may run on the upgraded controller under a stated condition. Nothing in it is a number, because nothing in Chapter 10 asked for one. That was correct then. It is not sufficient now.'}]},
    {t:'wide',c:'sand',lab:'THE TRAP THAT IS ALREADY SET',
     lead:'The easy fix is to write 99.9%. The easy fix is what the regulator rejected in the first place.',
     txt:'Somebody in the room will propose a number in the next ninety seconds, and it will be a number they have seen on a slide rather than one they have derived. A figure with no metric behind it, no measurement behind the metric and no repair time behind the measurement is the same unassessable sentence with a decimal point added. By the end of this hour you will have written a number, and more importantly you will have written what stands under it.'},
    {t:'principle',c:'mag',txt:'A requirement nobody can measure has not been written. It has been wished.'}],
   timebox:'2 min',
   task:'Open your Chapter 10 decision card. Find the sentence in it that a vendor could not test. If you did not bring a card, write down what that costs you tonight.',
   say:'Last week you were allowed to say &ldquo;defensible&rdquo;. Tonight somebody has to buy it, build it, and be measured against it.',
   notes:'Two minutes and do not rush the second half. First, this is the payoff of the promise Chapter 10 made on its last slide, so name it: the hour starts from their verdict, not from a blank page. Second, and this is the part worth the time &mdash; ask who brought the card. The students who did are now working from evidence and the students who did not are working from memory, and within ten minutes the difference will be visible to them without you saying anything further. Do not shame anyone; just let the room notice. Third, watch for the student who writes 99.9% immediately. That is not a mistake to correct, it is the crisis working: ask them where the second nine came from and let the silence do the teaching. The whole hour is the answer to that question.'},

  {k:'R02',rule:'RULE 02 - Domain spine',phase:'UNDERSTAND / MAP',accent:'teal',
   learn:'Locate the part of the chapter that answers a specific question the tender raises.',
   title:'What Chapter 11 trains you to do',
   sub:'Five sections, and each one answers a question the returned specification cannot.',
   blocks:[
    {t:'rows',items:[
     {c:'teal',lab:'1 &middot; FAULT CHAIN',txt:'Where does a failure begin, and where can the chain be broken before a user sees it?',src:'P1 &middot; s.4'},
     {c:'teal',lab:'2 &middot; TWO PROBABILITIES',txt:'Reliability and availability are different numbers. Which one does the tender actually need?',src:'P1 &middot; s.10'},
     {c:'sand',lab:'3 &middot; THE METRICS',txt:'POFOD, ROCOF, availability &mdash; and how the failure mode decides which one is meaningful.',src:'P1 &middot; s.19'},
     {c:'sand',lab:'4 &middot; ARCHITECTURES',txt:'Protection systems, self-monitoring channels, N-version programming &mdash; and where diversity stops working.',src:'P1 &middot; s.35'},
     {c:'violet',lab:'5 &middot; MEASUREMENT',txt:'How the number is obtained after the system exists, and why that is harder than specifying it.',src:'P1 &middot; s.71'}]},
    {t:'principle',txt:'The chapter is not five topics. It is one sentence: choose a metric the failure mode fits, then earn the number.'}],
   timebox:'90 sec',
   task:'Name the section that answers the regulator&rsquo;s objection most directly. It is not the one most people pick.',
   notes:'Most of the room picks section 3, the metrics. The better answer is section 2: until you know whether the tender is about reliability or availability, no metric is the right metric. Say that only after two or three students have committed to an answer.'},

  {k:'R03',rule:'RULE 03 - Five measurable outcomes',phase:'UNDERSTAND / OUTCOMES',accent:'teal',
   learn:'Say which outcome a piece of their own work is evidence for.',
   title:'Five outcomes you must prove',
   sub:'Each one ends in something inspectable. By the end of the hour the returned specification is a clause with a number in it, and these five are what that clause has to demonstrate.',
   blocks:[{t:'clomap'}],
   timebox:'60-90 sec',
   task:'Read the five. By the end of the hour your card will either support them or it will not, and you will be able to see which.',
   notes:'Do not read all five aloud. Point at CLO2 &mdash; choosing a metric and justifying the choice &mdash; and say that this is the one the whole hour turns on and the one most graduates cannot do.'},

  {k:'J01',rule:'JAHIZIAH - National knowledge unit',phase:'UNDERSTAND / OUTCOMES',accent:'teal',
   learn:'Name the national knowledge unit this chapter serves, and which of its outcomes this hour reaches.',
   title:'The national outcome this chapter also serves',
   sub:'Choosing a reliability metric is a national knowledge-unit outcome as well as tonight&rsquo;s tender problem. Coverage, stated &mdash; this slide is not the {{testEn}} and predicts nothing about it.',
   blocks:[{t:'jahiziah'}],
   timebox:'60 sec',
   cut:true,
   task:'Note which of the three outcomes this hour only partly reaches.',
   notes:'Sixty seconds. The only sentence that matters is the last one on the slide: this states coverage, it is not the test, and it predicts nothing. Say it rather than letting them infer it.'},

  {k:'R04',rule:'RULE 04 - Six engineering capabilities',phase:'UNDERSTAND / CAPABILITIES',accent:'violet',
   learn:'Name the unit in this hour where each capability is exercised.',
   title:'Six engineering capabilities',
   sub:'Not adjectives. Each one is exercised in a named unit tonight, and leaves something behind.',
   blocks:[{t:'svg',kind:'capabilities'}],
   timebox:'60-90 sec',
   task:'Pick the one you are weakest at. It has a unit number beside it.',
   notes:'Ninety seconds at most. The list is a map for later, not content now &mdash; students will come back to it at Rule 20 when the outcome map reads their evidence.'},

  /* Rule 05. The prediction gate. The picker is deliberately the four metrics
     plus one distractor, so a student who has not yet met them commits from the
     situation rather than the vocabulary — which is the entire point of a
     prediction gate and the reason the reveal has to cost something. */
  {k:'R05',rule:'RULE 05 - Prediction gate',phase:'UNDERSTAND / PREDICT',accent:'teal',
   learn:'Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.',
   title:'Do the reasoning before the reveal',
   sub:'Commit to a metric now, from the situation. In two slides the chapter will hand you the vocabulary, and by then it is too late to find out what you actually thought.',
   blocks:[
    {t:'chain',cols:4,items:[
     {c:'teal',lab:'PREDICT',txt:'Which number does this tender actually need?',
      picker:{g:'predict',options:['POFOD','ROCOF','Availability','MTTF','Two of these']}},
     {c:'mag',lab:'CONSTRAINT',field:{id:'p_constraint',core:false,rows:3,ph:'What limits the answer? e.g. nine days, three vendors, a regulator who returned it once'}},
     {c:'sand',lab:'DERIVE',field:{id:'p_derive',core:true,rows:3,
      ph:'Why, from first principles? What must be true about the plant for your metric to be the meaningful one?',
      ex:'<i>Shape only, from a payment gateway rather than tonight:</i> &ldquo;This holds only if the settlement job is called on a schedule rather than continuously &mdash; if it is continuous, a per-demand figure describes nothing, and nobody has looked at the call pattern.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unchecked</b>.'}},
     {c:'violet',lab:'NAME',field:{id:'p_name',core:false,rows:3,ph:'What principle did you use? Name it.'}}]},
    {t:'coach',watch:['p:predict','f:p_constraint','f:p_derive','f:p_name'],deep:['f:p_constraint','f:p_derive'],min:55,
     empty:'Do not start from the metric names &mdash; you have not met them yet, and guessing between four words you cannot define is not a prediction. Start from the plant. Which part of the control system is asked for something occasionally and must not fail when it is, and which part runs all day and must simply be up? If those are two different parts, that is your answer and you have not needed a single definition to get there.',
     thin:'Nearly. DERIVE is the box the rest of the hour rests on, and one clause is not a derivation &mdash; finish the sentence &ldquo;this is the right measure only if &hellip;&rdquo;. If you cannot finish it, the box that is really empty is CONSTRAINT: name what stops you writing whatever number you like tonight.',
     ok:'Committed. Sign it below, and then the reveal cannot quietly rewrite what you thought.'},
    {t:'sign',id:'r05_predict',fields:['p:predict','f:p_constraint','f:p_derive','f:p_name'],
     label:'I sign this prediction',
     before:'Answer all four boxes, then you may sign.',
     ready:'Four answers recorded. Signing freezes them with a time, and the reveal is next.',
     warn:'Signed answers cannot be edited. Put any revision in a later box where it is visible as a revision.',
     done:'Signed at <b>{{at}}</b>. Whatever the next slide says, this is what you thought first.'}],
   loadOk:'Four boxes, but they are one instrument: predict, bound, derive, name is a single act of committing, and splitting it across two slides lets a student predict without deriving &mdash; which is the exact failure the gate exists to prevent.',
   hueOk:'One colour per step of the chain, so the student can see at a glance that four different kinds of thinking are being asked for rather than four blanks.',
   timebox:'3 min',
   task:'Commit to an answer and sign it before the next slide. <b style="color:var(--mag)">You are the responsible engineer.</b>',
   say:'In three minutes you will know the right answer. The only version of you that is worth anything is the one who wrote something down before that.',
   notes:'Three minutes, and walk the room refusing empty DERIVE boxes. The commonest wrong prediction is Availability for everything, because it is the word students have heard outside class &mdash; that is a good wrong answer and worth surfacing at the reveal rather than correcting now. The commonest right-for-the-wrong-reason answer is &ldquo;two of these&rdquo;: press that student on <i>which</i> two and <i>for which part of the system</i>, because the tender has both a shutdown routine and a historian and they need different numbers. The signature matters more here than it did in Chapter 10, because the reveal in X01 is unusually satisfying and students will otherwise remember having known it all along.'},
  /* H01. Conditional. Renders only while the DERIVE box is still thin, so the
     engine notices the room is stuck rather than the instructor deciding in
     advance that it will be. Three questions, no answer. */
  {k:'H01',rule:'H01 - HELPER: three questions instead of the answer',phase:'UNDERSTAND / PREDICT',accent:'violet',
   learn:'Turn a blank derivation into a question they can answer, by starting from the plant rather than the vocabulary.',
   title:'Three questions instead of the answer',
   sub:'You are not stuck on the chapter. You are stuck because you started from four words instead of from the plant.',
   showIf:{thin:['f:p_derive'],min:40},
   blocks:[
    {t:'rows',items:[
     {c:'violet',lab:'QUESTION 1',lead:'How often is it asked to do something?',txt:'How often is the thing you are specifying <i>asked</i> to do something? Twice a year, or two thousand times an hour? The answer changes the denominator of every metric on the next slide.'},
     {c:'violet',lab:'QUESTION 2',lead:'Does anyone notice, or does it fail silently?',txt:'If it fails once, does anyone notice immediately &mdash; or does it fail silently until the next demand? Silent failure is what makes a per-demand measure necessary.'},
     {c:'violet',lab:'QUESTION 3',lead:'How long until service is back?',txt:'When it does fail, how long until service is back? If that number is large, the measure you need is the one that charges you for repair time, and only one of them does.'}]},
    {t:'principle',c:'mag',txt:'You are not choosing a formula. You are describing how the thing is used, and the formula follows.'}],
   timebox:'90 sec',
   task:'Answer question 1 for one named part of the control system, then go back and finish DERIVE.',
   notes:'You will usually not see this slide &mdash; it renders only while a derivation box is still thin, so it is the engine noticing that the room is stuck. Do not read all three aloud. Pick the one matching what you saw while walking the room, and send them back. If you are behind, skip it entirely; the questions work spoken.'},

  /* ---------------- X01 · THE REVEAL ---------------- */
  {k:'X01',rule:'X01 - SOURCE EXPANSION: the fault chain',phase:'SOURCE EXPANSION',accent:'sand',
   learn:'Distinguish fault, error and failure, and name where the chain can be broken.',
   title:'The reveal: three words, and only one of them is visible',
   sub:'Before any metric means anything, the chapter separates three things students use interchangeably &mdash; and the separation is where every mitigation lives.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'FAULT',lead:'It is in the code, doing nothing.',
      txt:'A characteristic of a software system that can lead to a system error. The fault is the inclusion of the code to add 1 hour to the time of the last transmission, without a check if the time is greater than or equal to 23.00.',src:'P1 &middot; s.4'},
     {c:'sand',lab:'ERROR',lead:'The fault has run. The system is now in a wrong state, and nobody outside can tell.',
      txt:'An erroneous system state that can lead to system behavior that is unexpected by system users. The value of transmission time is set incorrectly (to 24.XX rather than 00.XX) when the faulty code is executed.',src:'P1 &middot; s.4'}]},
    {t:'cards',cols:2,items:[
     {c:'mag',lab:'FAILURE',lead:'The only one a user can see.',
      txt:'An event that occurs at some point in time when the system does not deliver a service as expected by its users. No weather data is transmitted because the time is invalid.',src:'P1 &middot; s.4'},
     {c:'green',lab:'THE CHAIN IS BREAKABLE',lead:'Two arrows, and neither of them is automatic.',
      txt:'However, faults do not necessarily result in system errors &mdash; the faulty code may never be executed. Errors do not necessarily lead to system failures &mdash; the error can be corrected by built-in error detection and recovery.',src:'P1 &middot; s.5'}]},
    {t:'principle',txt:'Fault avoidance stops the first arrow. Fault detection stops the second. Fault tolerance stops the third.'}],
   hueOk:'Three colours for fault, error and failure plus green for the escape route &mdash; the colour is what keeps the three apart, and flattening them is exactly the confusion the slide exists to remove.',
   timebox:'2 min',
   task:'Look at your prediction. Which of the three did you have in mind when you chose a metric?',
   say:'Removing faults and improving reliability are not the same activity, and the gap between them is the most expensive misunderstanding in this chapter.',
   notes:'Two minutes. The payoff sentence is the principle line: the three fault-management strategies on s.6 map exactly onto the three arrows, which is why the chapter puts them together. Then the sting &mdash; s.16 says removing X per cent of the faults does not improve reliability by X per cent, because the faults you removed may sit in code nobody executes. Say it slowly; it reframes every testing conversation the students have had.'},

  {k:'X02',rule:'X02 - SOURCE EXPANSION: three metrics, one choice',phase:'SOURCE EXPANSION',accent:'sand',
   learn:'Choose the reliability metric that fits a failure mode, and state the usage fact that makes it fit.',
   title:'Three metrics. The failure mode picks, not you.',
   sub:'This is the slide your prediction was about. Each metric has a denominator, and the denominator is the whole argument.',
   blocks:[
    {t:'compare',src:'P1 &middot; ss.20&ndash;22',head:['Metric','What it measures','Use it when','From the deck'],rows:[
     {c:'teal',cells:['POFOD','The probability the system fails <i>when a service is requested</i>',
       'Demands are intermittent and infrequent, and each one has serious consequences &mdash; a protection system, an emergency shutdown','s.20']},
     {c:'sand',cells:['ROCOF','Failures per unit of <i>operating time</i>',
       'The system processes a large number of similar requests in a short time &mdash; a booking system, a card processor','s.21']},
     {c:'sand',cells:['MTTF','The reciprocal of ROCOF: mean time <i>between</i> failures',
       'One transaction takes a long time and must survive to the end &mdash; a CAD session, a long batch','s.21']},
     {c:'violet',cells:['Availability','The fraction of time the system is <i>up and usable</i>',
       'The system runs continuously and the cost of being down is the cost that matters. This is the only one that counts repair time','s.22']}]},
    {t:'wide',c:'mag',lab:'YOUR TURN &mdash; NAME IT AND JUSTIFY IT',
     lead:'The tender covers two things: an emergency shutdown routine and a continuously running historian.',
     field:{id:'metric_pick',core:true,rows:2,
      ph:'The metric for each of the two, and the property of its usage that makes it the right one',
      ex:'<i>Shape only, from a different system:</i> &ldquo;Card authorisation &rarr; ROCOF, because it serves thousands of similar requests an hour and the meaningful question is failures per hour of operation. Nightly settlement &rarr; POFOD, because it is called once and a single silent failure costs a day.&rdquo;'}}],
   hueOk:'Four colours because the four rows are four metrics the student must keep apart for the rest of the hour, and the colour is the index they use again on the decision card.',
   timebox:'3 min',
   task:'Write both metrics and, for each, the fact about how it is used that makes it the right one. <b style="color:var(--mag)">You are the responsible engineer.</b>',
   say:'Nobody has ever been fired for choosing the wrong formula. People are fired for measuring the wrong thing confidently.',
   notes:'Three minutes and the pivotal unit of the first half. Two things to draw out. First, availability is the only metric on the table that includes repair time (s.22), which means it is the only one that punishes a slow fix &mdash; this becomes Rule 10, so plant it here. Second, watch for a student who picks one metric for both halves of the tender: ask them what the shutdown routine does for the six months between demands, and let them answer. A wrong answer here is recoverable; a confident single metric across a whole system is the defect that reaches the contract.'},

  {k:'X03',rule:'X03 - SOURCE EXPANSION: what the number costs',phase:'SOURCE EXPANSION',accent:'sand',
   learn:'Identify the band where the next increment of reliability changes the decision, and name the measurement needed to prove it.',
   title:'Each extra nine costs more than the last',
   sub:'The curve is the reason the tender has a number in it at all: without one, there is no defensible place to stop.',
   blocks:[
    {t:'figure',img:'c11s08',h:250,cap:'s.8',srcName:'Ch.11 deck &middot; the increasing cost of residual fault removal',
     right:[
      {t:'cards',cols:1,items:[
       {c:'sand',lab:'WHY IT RISES',lead:'The cheap faults go first.',
        txt:'Early defect removal is cheap because the defects are in code that runs often and fails visibly. What remains sits in rarely executed paths, and finding it costs progressively more validation for progressively less observable gain.',src:'P1 &middot; s.8'},
       {c:'mag',lab:'BREAK-EVEN GUARD',
        txt:'The curve above is qualitative. It carries no percentage and no currency figure, and neither will you. Name the measurement you would need instead.',src:'P1 &middot; s.8'}]},
      {t:'raw',html:'<div class="picker" data-pick="curve"><button class="pick" data-v="Low" aria-pressed="false">Low</button><button class="pick" data-v="Medium" aria-pressed="false">Medium</button><button class="pick" data-v="High" aria-pressed="false">High</button><button class="pick" data-v="Ultra-high" aria-pressed="false">Ultra-high</button></div>'},
      {t:'wide',c:'mag',lab:'',field:{id:'curve_metric',core:false,rows:2,
       ph:'The measurement I would need before arguing break-even, e.g. measured repair time for the historian'}}]},
    {t:'principle',txt:'You are not buying reliability. You are buying the last increment of it, and only that increment has to be justified.'}],
   timebox:'3 min',
   cut:true,
   task:'Mark the band where the next increment would change your recommendation, then name the measurement you would need to defend it.',
   notes:'Three minutes, and the first designated cut point. The trap is a student who marks Ultra-high because it sounds rigorous &mdash; ask what the plant loses per hour of downtime, and when they cannot say, that is the missing measurement and the box beneath is where it goes. Refuse invented percentages here absolutely; the whole hour&rsquo;s credibility rests on it and the deck itself gives you the line on s.8.'},
  /* ---------------- PRACTISE ---------------- */
  {k:'R06',rule:'RULE 06 - The five-step engineering flow',phase:'PRACTISE / FLOW',accent:'teal',
   learn:'Turn a set of source mechanisms into a five-step engineering decision.',
   title:'The five-step engineering flow',
   sub:'The same five steps as last week. Only the object has changed: last week a verdict, tonight a number.',
   blocks:[
    {t:'chain',cols:5,items:[
     {c:'mag',lab:'CRISIS',txt:'A clause the regulator will not accept'},
     {c:'teal',lab:'MAP',txt:'Which failure mode, and therefore which metric'},
     {c:'sand',lab:'TRADE-OFF',txt:'What the next nine costs against what it buys'},
     {c:'violet',lab:'EVIDENCE',txt:'The measurement that would show the number was met'},
     {c:'green',lab:'VERDICT',txt:'The clause, written so a vendor can be held to it'}]},
    {t:'principle',txt:'The number is the last step, not the first. Everyone in the room wanted to start at the end.'}],
   hueOk:'The five colours are the five steps of the flow and they are the same five colours every week; the student learns the sequence by its colour and reads it again on every later slide.',
   timebox:'90 sec',
   task:'Say which of the five steps your Chapter 10 card already completed, and which three it never reached.',
   notes:'Ninety seconds. The point is continuity: Chapter 10 got them to VERDICT on a qualitative decision, and Chapter 11 makes them redo TRADE-OFF and EVIDENCE quantitatively. Students who see that see why the two hours are one argument.'},

  /* Rule 07. The artifact. Six fields, filled across the whole hour rather than
     inside this timebox — and every example is written about a DIFFERENT case
     (a hospital records system) so it shows the shape and gives away nothing. */
  {k:'R07',rule:'RULE 07 - Decision card',phase:'PRACTISE / ARTIFACT',accent:'teal',golden:true,
   learn:'Build a decision card a stranger could audit without hearing them explain it.',
   title:'Your minimum inspectable artifact',
   sub:'Same six fields as last week. This week at least two of them contain a number, and every number has to survive the WARRANT box.',
   blocks:[{t:'cards',cols:3,items:[
    {c:'teal',lab:'CLAIM',field:{id:'dc_claim',core:true,rows:3,
     ph:'What are you saying? e.g. the historian shall meet an availability of X between 07:00 and 23:00',
     ex:'<i>Hospital records system, for shape:</i> The appointment service shall meet an availability of three nines between 07:00 and 19:00, and is unspecified outside those hours.'}},
    {c:'sand',lab:'EVIDENCE',field:{id:'dc_evidence',core:true,rows:3,
     ph:'What supports it? Name an artifact with a date and an owner',
     ex:'<i>Hospital case:</i> Twelve months of gateway logs to 31 March, held by the integration team, giving observed downtime and measured restore times per incident.'}},
    {c:'violet',lab:'WARRANT',field:{id:'dc_warrant',core:true,rows:3,
     ph:'Why does that evidence support that claim? Name the metric and why it fits the failure mode',
     ex:'<i>Hospital case:</i> Because the service runs continuously and the cost is per hour of outage, availability is the metric that fits &mdash; and it is the only one that charges us for slow restore, which is where our incidents actually go wrong.'}},
    {c:'mag',lab:'COUNTER-EVIDENCE',field:{id:'dc_counter',core:true,rows:3,
     ph:'What would defeat it?',
     ex:'<i>Hospital case:</i> A single unlogged outage would defeat it &mdash; and the logs only capture failures the gateway itself noticed, not ones where it returned a wrong record successfully.'}},
    {c:'green',lab:'UNCERTAINTY',field:{id:'dc_uncert',core:true,rows:3,
     ph:'What remains unknown?',
     ex:'<i>Hospital case:</i> Whether next year&rsquo;s usage pattern resembles this year&rsquo;s. The number is measured against a profile that could stop being true.'}},
    {c:'teal',lab:'VERDICT',field:{id:'dc_verdict',core:true,rows:3,
     ph:'The clause as you would write it into the tender &mdash; and on what condition',
     ex:'<i>Hospital case:</i> Accept for the stated hours only, on condition that restore time is recorded per incident from the next release and reviewed after one quarter.'}}]}],
   loadOk:'Six fields, one artifact. The card is a single object and its shape is the lesson &mdash; a student who meets CLAIM and EVIDENCE on one slide and COUNTER-EVIDENCE on the next learns that counter-evidence is optional. It is filled across the whole hour, not in this timebox.',
   hueOk:'The six colours are the six sections of one artifact, and the student finds COUNTER-EVIDENCE by its colour for the rest of the hour, exactly as in Chapter 10. Flattening them makes the card read as six identical boxes.',
   timebox:'2 min',
   task:'Start the card. Write CLAIM and WARRANT now; the rest fills as the hour goes. Press C at any time to see it.',
   notes:'This is the slide that must not be asked cold, so open the worked example on CLAIM and read it aloud &mdash; it is written about a hospital records system on purpose, so it shows the shape and gives away nothing about the plant. Then say which boxes are marked must-not-be-blank and that the others are spare capacity rather than a backlog. The Chapter 11 difference worth naming: WARRANT is where the metric justification goes, and a card whose WARRANT says &ldquo;because it is the industry standard&rdquo; has failed even if the number is right.'},

  {k:'R08',rule:'RULE 08 - Sixty-second source case',phase:'PRACTISE / CASE',accent:'sand',
   learn:'Argue both sides of a real disagreement in the source about whether diversity is worth its cost.',
   title:'Five computers, and the argument against them',
   sub:'The Airbus flight control system is the chapter&rsquo;s strongest example of diversity &mdash; and the chapter also tells you the improvement is far below what the theory promises.',
   blocks:[
    {t:'figure',img:'c11s42',h:270,cap:'s.42',srcName:'Ch.11 deck &middot; Airbus flight control system architecture',
     right:[
      {t:'cards',cols:1,items:[
       {c:'teal',lab:'THE CASE FOR',lead:'Diversity applied at every level anyone could think of.',
        txt:'Primary systems use a different processor from the secondary systems. Primary and secondary systems use chipsets from different manufacturers. Software in each channel is developed in different programming languages by different teams.',src:'P1 &middot; s.43'},
       {c:'mag',lab:'THE CASE AGAINST',lead:'The measured gain is a fraction of the promised one.',
        txt:'In practice, observed improvements are much less significant but the approach seems leads to reliability improvements of between 5 and 9 times. The key question is whether or not such improvements are worth the considerable extra development costs for multi-version programming.',src:'P1 &middot; s.52'}]},
      {t:'wide',c:'sand',lab:'WHY THE GAP EXISTS',lead:'Independent teams are not independent people.',
       txt:'Teams are not culturally diverse so they tend to tackle problems in the same way. Some parts of an implementation are more difficult than others so all teams tend to make mistakes in the same place.',src:'P1 &middot; s.50'}]},
    {t:'pair',id:'r08',t1:'20 sec',t2:'30 sec',t3:'10 sec',
     think:'Decide silently whether the plant&rsquo;s shutdown routine should be N-version.',
     pair:'Argue the <i>opposite</i> side to the one you chose, to your neighbour, for thirty seconds.',
     share:'Hands up: who changed their mind? That is the only honest measure of whether the argument was real.'}],
   timebox:'2 min',
   task:'Take a side and be ready to defend the cost, not only the principle.',
   say:'An aircraft with five flight-control computers is not proof that redundancy works. It is proof that somebody could afford to find out.',
   notes:'Two minutes. The disagreement is genuinely in the source, which is what makes it usable: s.43 is the strongest possible case for diversity and s.50 to s.52 is the chapter dismantling its own assumption. Do not resolve it. The students who argue for N-version on a desalination shutdown routine should be asked what the plant&rsquo;s budget is and who else stops being funded; the students who argue against should be asked what they would do instead, and &ldquo;test more&rdquo; is not an answer after X01.'},
  {k:'X04',rule:'X04 - SOURCE EXPANSION: architectures that survive a fault',phase:'SOURCE EXPANSION',accent:'sand',
   learn:'Distinguish a protection system from a self-monitoring architecture by what each one is allowed to decide.',
   title:'Two ways to keep running, and they are not the same idea',
   sub:'One watches from outside and can only stop you. The other checks itself and can only tell you it disagreed.',
   blocks:[
    {t:'figure',img:'c11s37',h:240,cap:'s.37',srcName:'Ch.11 deck &middot; protection system architecture',
     right:[
      {t:'cards',cols:1,items:[
       {c:'teal',lab:'PROTECTION SYSTEM',lead:'A simpler, separate system whose only power is to force a safe state.',
        txt:'Protection systems independently monitor the controlled system and the environment. If a problem is detected, it issues commands to take emergency action to shut down the system and avoid a catastrophe.',src:'P1 &middot; s.36'},
       {c:'sand',lab:'WHY SIMPLER IS THE POINT',lead:'Less code means the validation budget goes further.',
        txt:'They are simpler than the control system so more effort can be expended in validation and dependability assurance. Aim is to ensure that there is a low probability of failure on demand for the protection system.',src:'P1 &middot; s.38'}]},
      {t:'wide',c:'violet',lab:'AND THE METRIC FOLLOWS THE ARCHITECTURE',lead:'The chapter specifies this one in POFOD, and it says why.',
       txt:'Read the last clause again. The chapter specifies a protection system in POFOD, not availability, and it does so because the thing is asked for something rarely. This is X02 arriving from the other direction.',src:'P1 &middot; s.38'}]},
    {t:'principle',txt:'A protection system is redundant on purpose and diverse on purpose. Remove either and it is just more of the thing that already failed.'}],
   timebox:'2 min',
   task:'Say which part of the plant would get a protection system, and what it would be allowed to do.',
   notes:'Two minutes. The sentence to land is that a protection system is deliberately allowed to do only one thing &mdash; stop the plant &mdash; because a component that can only fail in one direction is a component you can afford to trust. Students often propose a protection system that also corrects the setpoint; ask what validates the correction, and the answer is that now you have built a second control system with none of the assurance of the first.'},

  {k:'X05',rule:'X05 - SOURCE EXPANSION: the comparator, and what it cannot see',phase:'SOURCE EXPANSION',accent:'sand',
   learn:'Name the shared element that would defeat a two-channel architecture, and say what it costs to remove it.',
   title:'Two channels, one comparator, and a shared cause you have to go looking for',
   sub:'Self-monitoring is the architecture that catches a channel failing. It is also the architecture that quietly assumes the two channels cannot fail together.',
   blocks:[
    {t:'figure',img:'c11s40',h:150,cap:'s.40',srcName:'Ch.11 deck &middot; self-monitoring architecture',
     right:[
      {t:'cards',cols:1,items:[
       {c:'teal',lab:'HOW IT DECIDES',lead:'Same computation, both channels, compared.',
        txt:'The same computation is carried out on each channel and the results are compared. If the results are identical and are produced at the same time, then it is assumed that the system is operating correctly. If the results are different, then a failure is assumed and a failure exception is raised.',src:'P1 &middot; s.39'},
       {c:'mag',lab:'THE ASSUMPTION UNDERNEATH',lead:'Both halves have to be diverse, or the architecture is decoration.',
        txt:'Hardware in each channel has to be diverse so that common-mode hardware failure will not lead to each channel producing the same results. Software in each channel must also be diverse, otherwise the same software error would affect each channel.',src:'P1 &middot; s.41'}]},
      {t:'wide',c:'mag',lab:'YOUR TURN &mdash; FIND THE SHARED CAUSE',
       lead:'Last week the two RO trains shared one pressure transmitter. That was a common mode and it nearly took the plant.',
       field:{id:'common',core:false,rows:2,ph:'If the plant ran two control channels, name one thing they would still share &mdash; and what removing it would cost'}}]}],
   timebox:'2 min',
   task:'Name the shared element, and its removal cost. A channel pair with a shared clock, a shared power supply or a shared sensor is one channel wearing two coats.',
   say:'You already found a common mode last week. The architecture does not remove them &mdash; it only makes them worth looking for.',
   notes:'Two minutes and this is the strongest tether back to Chapter 10 in the whole hour: the shared transmitter they analysed last week is exactly the failure mode this slide is defending against. Expect answers like &ldquo;the power supply&rdquo; and &ldquo;the specification&rdquo; &mdash; the second is the better answer and comes straight from s.51, which says software specifications are more complex than hardware ones and harder to validate, so a specification error reaches every channel no matter how diverse the implementations.'},

  {k:'X06',rule:'X06 - SOURCE EXPANSION: voting, and its price',phase:'SOURCE EXPANSION',accent:'sand',
   learn:'Explain what a voter buys over a comparator, and why the empirical gain is below the theoretical one.',
   title:'Three versions and a vote',
   sub:'A comparator can tell you the channels disagreed. A voter can tell you which one to believe &mdash; and that is the whole extra cost.',
   blocks:[
    {t:'figure',img:'c11s47',h:170,cap:'s.47',srcName:'Ch.11 deck &middot; N-version programming',
     right:[
      {t:'cards',cols:1,items:[
       {c:'teal',lab:'HOW IT WORKS',lead:'An odd number of versions, and the majority wins.',
        txt:'Multiple versions of a software system carry out computations at the same time. There should be an odd number of computers involved, typically 3. The results are compared using a voting system and the majority result is taken to be the correct result.',src:'P1 &middot; s.44'},
       {c:'sand',lab:'WHERE THE IDEA CAME FROM',lead:'Hardware solved this first, for a different reason.',
        txt:'Depends on triple-modular redundancy. Based on most faults resulting from component failures rather than design faults and a low probability of simultaneous component failure.',src:'P1 &middot; s.45'},
       {c:'mag',lab:'WHY IT TRANSFERS BADLY',lead:'Hardware copies fail independently. Software copies were written by people.',
        txt:'There is some empirical evidence that teams commonly misinterpret specifications in the same way and chose the same algorithms in their systems.',src:'P1 &middot; s.48'}]}]},
    {t:'principle',c:'mag',txt:'Triple-modular redundancy assumes independent failure. Three teams reading one specification is not independent failure.'}],
   timebox:'2 min',
   cut:true,
   task:'In one sentence: what would have to be true about your three teams for the voting to mean what it claims?',
   notes:'Two minutes and a designated cut point. The transfer failure is the teachable moment: TMR works in hardware because a capacitor failing has nothing to do with another capacitor failing, and the whole argument collapses when the &ldquo;components&rdquo; are three teams who went to the same university and read the same specification. This is also the honest answer to any student who thinks more copies is always safer.'},

  /* B01 — the bridge. Placed after the trade-off is priced and before
     falsification, exactly as in Chapter 10, so the sequence reads: you chose,
     you costed it, here is how it is built, and now what would prove it wrong. */
  {k:'B01',rule:'B01 - From requirement to something you can build',phase:'PRACTISE / IMPLEMENTATION',accent:'violet',
   learn:'Turn a reliability requirement into a named mechanism, a concrete build, a tool that does it, and the artifact that proves it.',
   title:'You chose the metric. Now what do you actually build?',
   sub:'The chapter names the metric and stops. This is the rest of the sentence.',
   badge:{c:'mag',t:'COURSE ADDITION',s:'not in the chapter &mdash; that is the gap'},
   blocks:[
    {t:'bridge'},
    {t:'wide',c:'mag',lab:'YOUR TURN &mdash; ONE ROW FOR YOUR OWN PROJECT',
     field:{id:'bridge_own',core:true,rows:1,
      ph:'Requirement &rarr; mechanism &rarr; what you build &rarr; the tool &rarr; the artifact a reviewer could open'}}],
   loadOk:'One field, but the table above it is six parallel readings the student scans rather than answers; splitting it would break the comparison that makes the pattern visible.',
   hueOk:'Rows are colour-matched to the fault-management strategy each one serves, so the student recognises avoidance, detection and tolerance a second time.',
   timebox:'3 min',
   task:'Write one complete row for your own project. If the last cell is a promise rather than a file, the row is not finished.',
   say:'Everything so far taught you to specify. This slide is the one that tells you what to type on Monday.',
   notes:'Three minutes and the slide students thank you for. Two things to say. First: the tools are examples of <i>categories</i> &mdash; a student who writes down a product name and not &ldquo;statistical testing against an operational profile&rdquo; has learned a brand instead of a move, and brands change. Second: the violet row is the one to dwell on, because it is the only row where running it again is not available to you, and every other row in the table quietly assumed you could. The trap: someone will ask which tool is best. Refuse it and hand it back &mdash; best for which requirement, at what cost, with what evidence? That is Rule 08 again, and the fact that they can now ask it about a real tool rather than an aircraft is the measure of whether the hour worked.'},
  {k:'R09',rule:'RULE 09 - Falsification first',phase:'PRACTISE / EVIDENCE',accent:'teal',
   learn:'State the observation that would force them to withdraw their own reliability number.',
   title:'Evidence must be able to prove you wrong',
   sub:'A number nothing could contradict is not a measurement. It is a decoration on a contract.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'EVIDENCE',txt:'What observation would support your number?',
      field:{id:'f_evidence',core:false,rows:3,ph:'e.g. six months of historian uptime logs with restore times recorded per incident, held by operations'}},
     {c:'mag',lab:'COUNTER-EVIDENCE',txt:'What observation would reverse it?',
      field:{id:'f_counter',core:false,rows:3,ph:'e.g. one outage where the historian returned stale values without reporting itself down &mdash; the log would show it up'}}]},
    {t:'wide',c:'sand',lab:'THE FAILURE MODE THAT DEFEATS MOST UPTIME NUMBERS',
     lead:'A system that is up and wrong counts as available in almost every log you will inherit.',
     txt:'Reliability can only be defined formally with respect to a system specification &mdash; a failure is a deviation from a specification. However, many specifications are incomplete or incorrect, so a system that conforms to its specification may fail from the perspective of system users.',src:'P1 &middot; s.11'},
    {t:'principle',c:'mag',txt:'If nothing could show the number was wrong, nobody measured it.'}],
   timebox:'2 min',
   task:'Write both boxes. The second one is the one that makes the first one worth reading.',
   notes:'Two minutes. The strongest counter-evidence in this chapter is the silent wrong answer: a historian that serves stale values is up by every availability log ever written, and s.11 is the chapter saying so in its own words. If a student writes &ldquo;the system goes down&rdquo; as their counter-evidence, push &mdash; that is the failure their metric already counts, and the interesting ones are the failures it does not.'},

  {k:'X07',rule:'X07 - SOURCE EXPANSION: where the number comes from',phase:'SOURCE EXPANSION',accent:'sand',
   learn:'Explain how a reliability measurement differs from a defect test, and name what it requires.',
   title:'You cannot get this number from your test suite',
   sub:'This is the slide most students leave the chapter without, and the one the tender depends on.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'mag',lab:'WHY DEFECT TESTS WILL NOT DO',lead:'Your test data is deliberately unlike real use.',
      txt:'This cannot normally be included as part of a normal defect testing process because data for defect testing is (usually) atypical of actual usage data. Reliability measurement therefore requires a specially designed data set that replicates the pattern of inputs to be processed by the system.',src:'P1 &middot; s.72'},
     {c:'teal',lab:'WHAT YOU NEED INSTEAD',lead:'A data set whose frequencies match reality.',
      txt:'An operational profile is a set of test data whose frequency matches the actual frequency of these inputs from normal usage of the system. A close match with actual usage is necessary otherwise the measured reliability will not be reflected in the actual usage of the system.',src:'P1 &middot; s.76'}]},
    {t:'wide',c:'sand',lab:'AND FOUR REASONS IT STAYS HARD',
     lead:'The chapter is unusually honest about this: the measurement is the weak point, not the theory.',
     txt:'Operational profile uncertainty &mdash; the profile may not reflect real use. High costs of test data generation. Statistical uncertainty &mdash; you need a statistically significant number of failures to compute reliability, but highly reliable systems rarely fail. Recognizing failure &mdash; it is not always obvious when a failure has occurred as there may be conflicting interpretations of a specification.',src:'P1 &middot; s.75'},
    {t:'wide',c:'mag',lab:'YOUR TURN &mdash; NAME THE PROFILE YOUR NUMBER RESTS ON',
     field:{id:'profile',core:false,rows:1,
      ph:'Where the usage frequencies for your number would come from &mdash; and whether that source exists today'}}],
   timebox:'3 min',
   task:'Name where your usage frequencies would come from. &ldquo;We would estimate them&rdquo; is an answer, and it has a consequence you must also write.',
   say:'A reliability figure with no operational profile behind it is a measurement of your test suite, and your test suite is not your users.',
   notes:'Three minutes, and this closes the national knowledge-unit outcome about testing strategy. The paradox on s.75 is worth reading aloud: you need a statistically significant number of failures, and a highly reliable system will not give you any &mdash; which is why ultra-high reliability claims are so hard to substantiate and why the chapter is careful never to promise you can. Students who wrote a very high number in X03 should be sent back here.'},

  {k:'R10',rule:'RULE 10 - Known, unknown, monitor',phase:'PRACTISE / UNCERTAINTY',accent:'teal',
   learn:'Convert repair time from an assumption into a measured input, and turn one unknown into a monitor with a trigger and an owner.',
   title:'Availability is half repair time, and nobody measured it',
   sub:'Of the four metrics, only availability charges you for how long you take to fix it &mdash; which makes repair time an input to your number, not an afterthought.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'THE PART EVERYONE SPECIFIES',lead:'Time between failures.',
      txt:'Measure of the fraction of the time that the system is available for use. Availability of 0.998 means software is available for 998 out of 1000 time units.',src:'P1 &middot; s.22'},
     {c:'mag',lab:'THE PART ALMOST NOBODY MEASURES',lead:'Time to get it back.',
      txt:'The repair or restart time after a system failure that leads to loss of service. This is used in the measurement of availability. Availability does not just depend on the time between failures but also on the time required to get the system back into operation.',src:'P1 &middot; s.71'}]},
    {t:'cards',cols:2,items:[
     {c:'sand',lab:'MEASURED REPAIR TIME',txt:'The number your availability figure silently assumes.',
      field:{id:'repair',core:false,rows:2,ph:'How long a restore actually takes, how you know, and when it was last rehearsed rather than estimated'}},
     {c:'violet',lab:'MONITOR',txt:'One unknown, converted.',
      field:{id:'monitor',core:false,rows:2,ph:'The risk you will watch rather than fix, its trigger value, and who acts on it'}}]},
    {t:'principle',txt:'Two systems with identical failure rates have different availability. The difference is entirely in how fast somebody fixes them.'}],
   hueOk:'Two colours split the metric into the half everyone specifies and the half nobody measures, and two more separate the measured input from the monitor &mdash; the colour is what stops the four boxes reading as one undifferentiated task.',
   timebox:'3 min',
   task:'Write a repair time you could defend, and turn one remaining unknown into a monitor with a trigger value and a named person. <b style="color:var(--mag)">You are the responsible engineer.</b>',
   notes:'Three minutes and the second half of the metric argument. Most students specify availability without ever noticing that they have implicitly promised a repair time, and s.71 is the chapter saying it outright. Do not accept a monitor without a trigger value and a named owner &mdash; a monitor with no trigger is a decision to look away slowly. If a student says the restore takes ten minutes, ask when it was last actually done; the honest answer is almost always &ldquo;never on this system&rdquo;, and that is the finding.'},
  /* ---------------- MASTER ---------------- */
  {k:'R11',rule:'RULE 11 - Micro-case -> local case',phase:'MASTER / TRANSFER',accent:'sand',
   learn:'Reuse one metric-evidence-boundary chain in a different domain, and say what transfers and what breaks.',
   title:'Scaffold first, then transfer',
   sub:'Run the same chain twice &mdash; and the second time on a system with no plant, no regulator and no shutdown routine.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'MICRO-CASE &mdash; ISCARB SCAFFOLD',
      txt:'The plant&rsquo;s historian is specified at an availability the vendor accepts. Six months later the plant is unhappy, and the vendor produces a log showing the number was met every month. Both are telling the truth. What did the number fail to capture?',
      field:{id:'micro',core:false,rows:3,ph:'What the metric did not count, and which metric would have counted it'}},
     {c:'violet',tag:'{{localTag}}',lab:'TRANSFER &mdash; A NATIONAL SERVICE',
      txt:'A public service in {{country}} publishes an availability figure and is regulated on it. Users report it as unreliable anyway. Run the same chain: which metric is being reported, which failure mode is invisible to it, and which of {{bodiesShort}} would receive the evidence?',
      field:{id:'transfer',core:false,rows:3,ph:'The invisible failure mode, and what transfers or breaks between the two domains'}}]},
    {t:'wide',c:'sand',lab:'WHY BOTH CASES ARE LOCAL',lead:'In both, somebody named is waiting to read the number.',
     txt:'The evidence has a named destination in both. A reliability figure that no regulator, department or customer ever reads is not a requirement &mdash; it is telemetry.'},
    {t:'principle',txt:'Metric &mdash; evidence &mdash; decision boundary. The chain is the same; only the denominator changes.'}],
   timebox:'3 min',
   task:'Solve the micro-case, then reuse the same chain on the national service, and name which of {{bodiesShort}} receives your evidence. <b style="color:var(--mag)">You are the responsible engineer.</b>',
   notes:'Four minutes total, and the micro-case has a specific answer worth waiting for: an availability figure counts downtime, and the plant is unhappy about <i>slow</i> recoveries and <i>wrong</i> values, neither of which the monthly percentage distinguishes. Several short outages are less disruptive than one long one (s.14), and the chapter says so. The transfer is where the room usually discovers that they have all seen this happen to a service they personally use.'},

  {k:'R12',rule:'RULE 12 - Owner, evidence, sign-off',phase:'MASTER / ACCOUNTABILITY',accent:'sand',golden:true,
   learn:'Separate the engineer who claims the number, the engineer who verifies it and the authority who signs for it.',
   title:'A number in a contract has three names behind it',
   sub:'The clause is going into a tender. Somebody claims it, somebody checks it, and somebody is answerable when a vendor is held to it.',
   blocks:[
    {t:'svg',kind:'accountability'},
    {t:'cards',cols:3,items:[
     {c:'teal',lab:'',field:{id:'a_owner',core:false,rows:2,ph:'Who claims the number?',
      ex:'<i>Another case, for shape:</i> Claims &mdash; the integration lead. Verifies &mdash; the engineer who ran the log query, who did not write the clause. Signs &mdash; the head of the service. <b>Three names, three roles, none of them the same person.</b> If your three collapse into one, that is your finding rather than your mistake.'}},
     {c:'sand',lab:'',field:{id:'a_evidence',core:false,rows:2,ph:'Who verifies it, independently?'}},
     {c:'mag',lab:'',field:{id:'a_signoff',core:false,rows:2,ph:'Who signs, answerable to {{regulator}}?'}}]},
    {t:'wide',c:'teal',lab:'WHY THE NUMBER IS WORTH SPECIFYING AT ALL',
     lead:'Four reasons in the chapter. The fourth is the one that reaches a regulator.',
     txt:'It provides a basis for assessing when to stop testing a system. It is a means of assessing different design strategies. If a regulator has to approve a system, then evidence that a required reliability target has been met is important for system certification.',src:'P1 &middot; s.25'},
    {t:'principle',txt:'Sign-off is an engineering control, not decoration &mdash; and a name is for finding the decision, never for finding someone to blame.'}],
   timebox:'2 min',
   task:'Name the three roles for tonight&rsquo;s clause. They must be three different people.',
   notes:'Students routinely name three roles that are the same person, and that is the finding &mdash; say it out loud. Then spend thirty seconds on the second half of the principle line, because a rule demanding a name is dangerous without it: if being named is how the organisation decides who is at fault, the rational move is to avoid being named, and within a year nobody reports the near-misses that would have shown you the failure cheaply. The name answers <i>whose decision was this and where is the reasoning recorded</i>; when it goes wrong the question is what let a reasonable person decide that, not who to replace.'},

  /* Course addition. The chapter's vocabulary is 2011 safety engineering; the
     same six arguments are made under different names where most of these
     students will work.

     PLACED HERE ON PURPOSE, AND THE POSITION IS THE POINT. Rule 10 has just made
     them write a repair time and a monitor and Rule 12 has just made them name
     an owner, so the middle column is a naming of what they already built rather
     than new material. It is also the only unit between B01 and Rule 15 that
     asks the room for nothing — ten consecutive units of writing is where a
     class stops writing, and PACE-01 caught exactly that. This slide is the
     breath, which is why it lost its input box. */
{k:'X08',rule:'X08 - The same ideas, the other vocabulary',phase:'MASTER / VOCABULARY',accent:'violet',
   learn:'Say the reliability idea they have just used in the vocabulary a services team would use for it.',
   title:'You already know these. You may not know their other names.',
   sub:'Left: what this chapter calls it. Right: what the same argument is called where most of you will work. Same idea, different room.',
   badge:{c:'mag',t:'COURSE ADDITION',s:'the chapter predates the vocabulary'},
   blocks:[
    {t:'compare',head:['In this chapter','Where most of you will work','What the second one adds'],rows:[
     {c:'teal',cells:['Availability, specified as a probability',
       'A service level objective &mdash; a target over a stated window',
       'The window. Three nines &ldquo;always&rdquo; and three nines &ldquo;during business hours&rdquo; are different contracts and different rotas']},
     {c:'teal',cells:['The rising cost of the next increment (X03)',
       'An error budget &mdash; the failure the target permits, spent deliberately',
       'It turns the trade-off into a resource you allocate rather than a virtue you claim']},
     {c:'sand',cells:['Repair time as an input to availability (Rule 10)',
       'Mean time to restore, tracked per incident',
       'It makes the restore the thing you optimise, which is where most real availability is won']},
     {c:'sand',cells:['A monitor with a trigger value and an owner (Rule 10)',
       'An actionable alert',
       'The rule that an alert nobody acts on is deleted, not tuned']},
     {c:'mag',cells:['Operational profile (X07)',
       'Production traffic replay, or shadow traffic',
       'The profile stops being a guess, because it is a recording']},
     {c:'violet',cells:['Redundancy and diversity (X05, X06)',
       'Staged release, and limiting how much one change can touch',
       'It moves the defence from the failure to the change that causes most of them']}]},
    {t:'principle',txt:'Same six arguments. The room you are standing in decides which column you say them in.'}],
   hueOk:'Colours carry over from X02 and B01 so the student recognises which family each row belongs to; the row is a translation, and the colour says of what.',
   timebox:'90 sec',
   cut:true,
   task:'Read the middle column. Say your own number out loud in it &mdash; a target, a window, and what happens when it is missed.',
   say:'Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.',
   notes:'Ninety seconds and resist expanding it &mdash; the point is recognition, not instruction. The honest history is worth one sentence: this chapter was written before the middle column existed as a discipline, so the gap is chronological rather than a disagreement, and the concepts map almost one to one. The direction matters: a student who learns only the middle column can run a dashboard and cannot argue a certification, and a student with both can do both. If asked which vocabulary is right, the answer is the room you are in &mdash; a regulator will not accept an error budget and a service team will not accept a hazard log.'},

  {k:'R13',rule:'RULE 13 - Breaking variable',phase:'MASTER / STRESS TEST',accent:'sand',
   learn:'Name the variable whose change would reverse their own number.',
   title:'What change would break your number?',
   sub:'A robust specification exposes the assumption that would make it wrong, rather than waiting for a vendor to find it.',
   blocks:[
    {t:'cards',cols:4,items:[
     {c:'sand',lab:'USAGE',txt:'The plant doubles its throughput next summer. Your operational profile is now describing a system that no longer exists.'},
     {c:'sand',lab:'REPAIR',txt:'The one engineer who can restore the historian leaves. Measured repair time triples and availability falls without a single extra failure.'},
     {c:'sand',lab:'DEFINITION',txt:'The vendor counts a degraded read as available. You did not. Nobody wrote down which.'},
     {c:'sand',lab:'REGULATION',txt:'{{regulator}} requires the figure to be reported per service rather than for the system as a whole.'}]},
    {t:'raw',html:'<div class="picker" data-pick="breaker"><button class="pick" data-v="Usage" aria-pressed="false">Usage</button><button class="pick" data-v="Repair" aria-pressed="false">Repair</button><button class="pick" data-v="Definition" aria-pressed="false">Definition</button><button class="pick" data-v="Regulation" aria-pressed="false">Regulation</button></div>'},
    {t:'principle',c:'mag',txt:'If no change would move your number, you have not written a measurement.'},
    /* Distributed retrieval. Item 2 was taught around X02, roughly fifteen units
       back, which is the gap that makes the attempt worth something. The state is
       shared with the end-of-session block, so this is the same question moved
       earlier rather than an extra one. */
    {t:'recall',i:2}],
   timebox:'2 min',
   task:'Pick the variable that would move your number furthest, then answer the question underneath from memory.',
   notes:'Two minutes. The best answer is usually Definition, and it is the one students pick last: almost every availability dispute in industry is an argument about what counted as an outage, decided after the fact by whoever kept the better log. Say that. The retrieval question underneath is the availability table &mdash; do not teach into it, the value is the attempt including the failed ones.'},

  {k:'R14',rule:'RULE 14 - Practitioner workload',phase:'MASTER / PRACTICE',accent:'sand',
   learn:'Name a workload cost their number creates for a real practitioner, and the design change that reduces it.',
   title:'Engineering changes human work',
   sub:'Every nine you add to a specification lands on somebody&rsquo;s week. Usually somebody who was not in the meeting.',
   blocks:[
    {t:'cards',cols:4,items:[
     {c:'teal',lab:'MEASUREMENT BURDEN',lead:'Who collects the data your number needs?',
      txt:'A long-term measurement programme is required to assess the reliability of critical systems.',src:'P1 &middot; s.19'},
     {c:'sand',lab:'ON-CALL LOAD',txt:'Availability is a repair-time promise. Who is awake to keep it, and how many nights a month?'},
     {c:'mag',lab:'TEST DATA COST',lead:'The profile is not free.',
      txt:'High costs of test data generation. Costs can be very high if the test data for the system cannot be generated automatically.',src:'P1 &middot; s.75'},
     {c:'violet',lab:'WHO WRITES IT NOW',lead:'Generated work moves the load; it does not remove it.',
      txt:'Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing more that they did not write. Volume against attention: last week&rsquo;s silenced alarm again.'}]},
    {t:'wide',c:'mag',lab:'TONIGHT, THIS IS THE MECHANISM &mdash; NOT A FOOTNOTE',
     lead:'A repair-time promise with nobody rostered to keep it is a number that fails on a Friday.',
     txt:'The availability figure you wrote implies a restore within a stated time, at any hour it applies to. That is a rota, a runbook and a person, and none of the three appear in the clause. A specification that creates unsustainable workload does not fail in review; it fails in month four, quietly, when somebody stops answering.',
     field:{id:'workload',core:false,rows:2,ph:'One workload cost your number creates, and the concrete design change that reduces it',
      ex:'<i>Shape only:</i> &ldquo;Three nines between 07:00 and 23:00 implies a sixteen-hour rota for one engineer who also has a day job. Design change: narrow the specified window to the hours the plant actually runs at load, and accept a slower restore outside it.&rdquo;'}},
    {t:'principle',txt:'Trade-offs include people, process, evidence and time &mdash; not only code.'}],
   hueOk:'Four costs, four colours, because the student has to hold them apart long enough to pick one &mdash; and the violet card is deliberately the odd one out, since it is the only cost that is not in the chapter.',
   timebox:'2 min',
   task:'Name one workload cost your number creates for a real person, and the design change that reduces it.',
   notes:'The rule with no equivalent in the textbook and where ISCARB differs from a standard reliability lecture. Do not let it become a wellbeing aside: the test is a concrete design change &mdash; a narrower specified window, an automated restore, a second trained person. If they only express sympathy, push again. Spend time on the violet card: every student in the room is using generated code and almost none has been asked what it did to the review load rather than the writing load. The honest framing is that the tool did not remove the work, it moved it &mdash; from writing, which is estimated, to reviewing, which is not.'},

  {k:'R15',rule:'RULE 15 - AI assist + human sign-off',phase:'MASTER / AI',accent:'sand',
   learn:'Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.',
   title:'AI prepares evidence; humans own assurance',
   sub:'AI is permitted for preparation, never for unowned approval. Tonight the evidence in question is a number going into a contract.',
   badge:{c:'mag',t:'AI MOMENT',s:'assist, not assurance'},
   blocks:[
    {t:'cards',cols:3,items:[
     {c:'teal',lab:'AI MAY PREPARE',txt:'Draft an operational profile, triage failure logs, summarise incident timings, propose test data &mdash; all for human review.'},
     {c:'sand',lab:'AI MUST NOT OWN',txt:'The number in the contract, its verification, or the sign-off. Nor may it be the only witness to its own output.'},
     {c:'mag',lab:'HUMAN SIGN-OFF',txt:'A named person reviews and decides accept, revise or reject &mdash; and is accountable for it.'}]},
    {t:'aigate'}],
   timebox:'2 min',
   task:'Run the gate on the way you actually used AI this week &mdash; on a real output, not a hypothetical. <b style="color:var(--mag)">You are the responsible engineer.</b>',
   notes:'The gate is the rule, not the three cards above it &mdash; make every student run it on something they really did this week. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second, which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. Tonight it has a sharp application: if a model drafted your operational profile, the profile is not evidence &mdash; the comparison of that profile against real traffic is. Note what is deliberately absent from this whole hour: vendor reliability figures. If a student cites one, ask which study, and that is the break-even discipline from X03 applied to AI.'},
  /* ---------------- DISTINGUISH ---------------- */
  {k:'R16',rule:'RULE 16 - What a strong answer looks like',phase:'DISTINGUISH / ASSESSMENT',accent:'violet',
   learn:'Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.',
   title:'What a strong answer looks like here',
   sub:'Claim a level. The line beneath reads your card and tells you what it actually carries.',
   blocks:[{t:'levels'}],
   timebox:'90 sec',
   cut:true,
   task:'Claim a level, then read what your artifact supports. The gap is the assignment.',
   notes:'Ninety seconds. Nothing here is a mark and nothing is recorded &mdash; say so. The teaching moment is a student who claims L4 and is told their COUNTER-EVIDENCE box is empty: the ladder is not judging them, it is reading their file, and that distinction is the whole of Rule 19 arriving early.'},

  {k:'R17',rule:'RULE 17 - Constraint mutation',phase:'DISTINGUISH / DEFENSE',accent:'mag',golden:true,
   learn:'Defend a number under a changed constraint, or explain precisely why it changes and who re-signs.',
   title:'The live engineering defense',
   sub:'You will not only present a number. The constraint will change while you are holding it.',
   blocks:[
    {t:'cards',cols:1,items:[
     {c:'mag',lab:'THE MUTATION',txt:'Pick one. It is applied to the clause you just wrote, live.',
      picker:{g:'mutation',options:['Budget halved','Window doubled to 24/7','Vendor redefines &ldquo;available&rdquo;','Repair time triples','No historical logs exist']}}]},
    {t:'wide',c:'sand',lab:'DEFEND IT',
     lead:'Which part of your clause survives the mutation, and which part collapses?',
     txt:'A number that survives every mutation was not doing any work. A number that collapses under all of them was never derived. The answer worth writing names the part that holds, the part that does not, and who has to sign the revision.',
     field:{id:'mutation_defend',core:true,rows:2,ph:'Which part of your number survives, which part collapses, and who re-signs'}},
    {t:'principle',c:'mag',txt:'Present, mutate, reason, defend, verdict. The defence is the assessment.'}],
   timebox:'3 min',
   task:'Pick a mutation and defend the clause aloud. Name what survives, what collapses, and who signs the revision.',
   say:'Every specification in your career will be changed by someone who was not in the room when you wrote it.',
   notes:'Four minutes and the longest task in the hour, deliberately. The strongest mutation is &ldquo;vendor redefines available&rdquo;, because it does not touch the number at all and destroys it completely &mdash; and it is the one that actually happens. If the room is quiet, take a card and defend it yourself badly, then let them correct you.'},

  {k:'R18',rule:'RULE 18 - Make the system operable',phase:'DISTINGUISH / LOGISTICS',accent:'teal',
   learn:'Name the process requirement that must accompany a reliability number, and what happens before the next session.',
   title:'The requirement that is about your process, not the system',
   sub:'The chapter has a category of reliability requirement that constrains how you build rather than what you build &mdash; and it is the one that reaches a tender.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'FOUR KINDS OF FUNCTIONAL REQUIREMENT',lead:'Checking, recovery, redundancy &mdash; and process.',
      txt:'Checking requirements that identify checks to ensure that incorrect data is detected before it leads to a failure. Recovery requirements that are geared to help the system recover after a failure has occurred. Redundancy requirements that specify redundant features. Process requirements for reliability which specify the development process to be used may also be included.',src:'P1 &middot; s.31'},
     {c:'sand',lab:'WHAT ONE LOOKS LIKE',lead:'Four real clauses, and only one of them is about the process.',
      txt:'RR1: A pre-defined range for all operator inputs shall be defined and the system shall check that all operator inputs fall within this pre-defined range. RR2: Copies of the patient database shall be maintained on two separate servers not housed in the same building. RR3: N-version programming shall be used to implement the braking control system. RR4: The system must be implemented in a safe subset of Ada and checked using static analysis.',src:'P1 &middot; s.32'}]},
    {t:'wide',c:'mag',lab:'BACK TO THE CLAUSE THAT WAS REJECTED',
     lead:'RR4 is the shape your rejected sentence should have taken: it constrains the build, and a vendor can be held to it on day one.',
     txt:'Notice what RR4 does that &ldquo;highly reliable&rdquo; does not. It is assessable before the system exists, it names the mechanism rather than the aspiration, and it leaves an artifact &mdash; the analysis report &mdash; that somebody can ask for. That is the whole difference between a requirement and a wish, and it is why the process requirement is the one to write when your measurement will not exist for another year.'},
    {t:'cards',cols:2,items:[
     {c:'sand',lab:'NEXT SESSION &middot; {{nextDate}}',lead:'Safety engineering &mdash; it starts from tonight&rsquo;s number.',
      txt:'Safety Engineering. Bring this decision card: next week asks what happens when the thing you specified fails anyway, and the number you wrote tonight is the input.'},
     {c:'sand',lab:'THEORY &amp; LAB &middot; CONTACT',lead:'Where to find the class, and where to find me.',
      txt:'Sun, Tue, Thu 09:00&ndash;09:50 &middot; Bldg A80, H1-10. Lab Thu 15:00&ndash;16:40 &middot; Bldg B80, L0-14. {{contact}} &mdash; bring the card, not the question.'}]},
    {t:'principle',txt:'When you cannot measure it yet, constrain the process that will produce it. That is still a requirement.'}],
   timebox:'2 min',
   task:'Rewrite the rejected sentence as a process requirement, in the shape of RR4.',
   notes:'Two minutes, and this is where the crisis is finally paid off &mdash; give it the time. The insight students leave with is that the rejected clause did not need a number at all: it needed to be <i>assessable</i>, and a process requirement is assessable on day one whereas a reliability figure is not assessable until a year of operation has passed. Both are legitimate; the mistake was writing neither. Ask for the rewritten sentence out loud from two students before moving on.'},

  {k:'R19',rule:'RULE 19 - Peer-review quick card',phase:'DISTINGUISH / PEER REVIEW',accent:'violet',
   learn:'Answer two review questions about another student&rsquo;s number without scoring it.',
   title:'Peer-review quick card',
   sub:'Two questions, exchanged. No marks, no scores, and nothing recorded anywhere.',
   blocks:[
    {t:'cards',cols:2,items:[
     {c:'teal',lab:'QUESTION 1',txt:'Could another team verify this number without trusting your explanation, or the tool that produced it?',
      field:{id:'peer1',core:false,rows:2,ph:'Your partner&rsquo;s card &mdash; your answer'}},
     {c:'mag',lab:'QUESTION 2',txt:'What single observation would make this number wrong?',
      field:{id:'peer2',core:false,rows:2,ph:'Your partner&rsquo;s card &mdash; your answer'}}]},
    {t:'principle',txt:'Two questions. If a card cannot answer them, no score would have told you anything a colleague could not.'}],
   timebox:'2 min',
   cut:true,
   task:'Swap cards. Answer both questions about your partner&rsquo;s, and hand it back with nothing scored on it.',
   notes:'Three minutes and a designated cut point. Formal scoring stays off this slide on purpose; if you are asked why, the answer is that a number on a peer review turns a conversation into a negotiation. Question 2 is the useful one &mdash; most students find their partner cannot answer it, which is exactly the Rule 09 lesson landing from the other direction.'},
  {k:'J02',rule:'JAHIZIAH - Knowledge unit check',phase:'DISTINGUISH / READINESS',accent:'teal',
   learn:'Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.',
   title:'Five items in the national format',
   sub:'One at a time. A wrong first answer buys a hint and a second attempt, then the explanation.',
   blocks:[{t:'jahtest'}],
   timebox:'3 min',
   task:'Answer without notes. A miss points at a unit to reread, which is the only thing the result is for.',
   notes:'Four minutes. One of the five will already be answered if the room met it at Rule 13 &mdash; that is the retrieval working, not a bug, and the block is four items tonight rather than five. State plainly that this is practice in the style of the knowledge unit, that it is not the test, and that nothing here predicts anything.'},

  {k:'C01',rule:'C01 - SOURCE LEDGER: what this hour reached',phase:'DISTINGUISH / SCOPE',accent:'sand',
   learn:'Say which parts of the source this hour reached and which it did not, from the citations rather than from memory.',
   title:'What we covered, and what we did not',
   sub:'Counted from the slide cited on every card tonight, not from a list kept by hand.',
   blocks:[{t:'coverage'}],
   timebox:'90 sec',
   cut:true,
   task:'Note the magenta slides. Nobody taught them to you tonight.',
   notes:'The most honest slide in the deck. Two things to say: the ledger is computed from the citations so it cannot flatter the lecture, and the magenta line is slide numbers rather than topics because the engine will not guess what is on a slide nobody cited. Section 5 &mdash; the eight programming practices &mdash; is deliberately out of scope with the reason written on the row; it is the lab.'},

  {k:'R20',rule:'RULE 20 - Bounded assurance case',phase:'DISTINGUISH / READINESS',accent:'green',
   learn:'Read their own readiness off the artifact they produced, and name the next piece of work.',
   title:'Are you ready to specify a number?',
   sub:'Four gates you judge for yourself, and an outcome map read from what you actually wrote.',
   blocks:[
    {t:'gates'},
    {t:'cardcheck'},
    {t:'wide',c:'green',lab:'TAKE-HOME',
     field:{id:'takehome',core:false,rows:1,ph:'In this chapter, a reliability requirement means ... (use metric, measurement and ownership)'}}],
   loadOk:'Three instruments, but they are one reading: the gates are the student&rsquo;s own judgment, the card check is what their artifact carries, and the field is the sentence they leave with. Separating them would let a student claim readiness on a slide where the evidence is not visible beside the claim.',
   timebox:'3 min',
   task:'Judge the four gates, read what your card carries, and write the sentence you are leaving with.',

  {k:'P01',rule:'P01 - YOUR ROUTE: how your answers shaped the hour',phase:'DISTINGUISH / REFLECTION',accent:'violet',
   learn:'Explain how their own answers changed which slides they saw.',

    {t:'principle',txt:'A number is not ready until the metric, the measurement, the repair time and the owner are all visible.'}],
   timebox:'60 sec',
   task:'Look at the arm you are on. One of the four counts names your next piece of reading.',

 ]

/* ==========================================================================
   PART 2 — ENGINE.  Subject-independent.  Do not edit per lecture.
   ========================================================================== */
/* Composite-widget vocabularies. Defaults below; ANY lecture may override them in
   data (LECTURE.vocab) without touching this file — a different subject has a
   different stack, different gates and a different AI gate. */
var V=LECTURE.vocab||{};
var GATE_DEFS=V.gates||[['decide','DECIDE','State a bounded answer'],['evidence','EVIDENCE','Show what supports it'],
  ['break','BREAK','Name what would reverse it'],['own','OWN','Name who signs off']];
var STACK_LAYERS=V.stack||['Society','Organization','Business processes','Application system',
  'Communications and data management','Operating system','Equipment'];
/* Four questions, not three. The old q2 asked "recompute OR test", and those
   are not the same act: a generative model's output can essentially never be
   recomputed and can very often be tested. One question could not carry both
   answers, so a student running the gate on a real model got whichever verdict
   they happened to read into it — in the last ten minutes of the session, which
   is the worst possible place for an ambiguity. Split, the pair also teaches
   the distinction the AI era actually turns on. */
var AIQ=V.aiGate||[['q1','Does the AI output become part of the evidence chain — something a reviewer or regulator would read?'],
  ['q2','Could a human RE-DERIVE the same output independently — run it again, by another route, and get something they can compare?'],
  ['q2b','Failing that, could a human TEST the output against reality — check each claim it makes without trusting how it was produced?'],
  ['q3','Is there a named person who reviews it and signs for it?']];
var CARD6=V.card||[['dc_claim','CLAIM'],['dc_evidence','EVIDENCE'],['dc_warrant','WARRANT'],
  ['dc_counter','COUNTER-EV.'],['dc_uncert','UNCERTAINTY'],['dc_verdict','VERDICT']];

var KEY='iscarb-'+LECTURE.id;
var ZKEY=KEY+'-zoom';
/* Reader control, not a preference panel: one number, persisted, and it scales
   the whole stage rather than individual rules, so nothing can overflow that
   FIT-01 did not already measure at 100%. */
var ZOOM=1;
try{var z=parseFloat(localStorage.getItem(ZKEY)); if(z>=.8&&z<=1.4) ZOOM=z;}catch(e){}
function setZoom(z){
  ZOOM=Math.max(.8,Math.min(1.4,Math.round(z*20)/20));
  try{localStorage.setItem(ZKEY,String(ZOOM));}catch(e){}
  document.getElementById('stage').style.fontSize=(ZOOM*100)+'%';
  fit();
}
var S={f:{},pick:{},trace:[],mx:{},gates:{},marks:{},ai:{},quiz:{},quizAt:0,tries:{},pair:{},sign:{},seen:{}};
