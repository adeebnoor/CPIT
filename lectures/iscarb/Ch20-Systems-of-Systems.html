</style></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 20</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch20-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":20,"title":"Systems of Systems","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch20-Systems-of-Systems.html","assignment":9,"points":5,"objectives":["Recognize operational and managerial independence.","Classify SoS and explain three kinds of complexity.","Explain why reductionist assumptions can fail.","Plan interfaces, staged deployment and cross-system tests.","Compare data-feed, container and trading architectures."],"sections":["20.1 System complexity","20.2 SoS classification","20.3 Reductionism and complex systems","20.4 SoS engineering","20.5 SoS architecture"],"case":{"headline":"Several owners connect. Who controls the shared promise?","text":"A fictional multi-agency dashboard combines independently managed data feeds. The principal system can validate and display received data but cannot dictate every provider’s update schedule.","question":"What useful service can be promised without pretending to control every owner?","mutation":"One participating feed changes to a slower update schedule while keeping the same interface shape. The same agency also changed its AI model version: the feed’s shape is unchanged, but incidents are now classified differently.","lens":"One agency now produces its feed with an AI model that summarises and classifies field reports. The dashboard owner cannot inspect or version that model. Hold that question: after the architecture patterns, one slide asks three owners to negotiate it."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Systems of Systems","phase":"START","takeaway":"Systems of Systems","full":"<p>Systems of Systems<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"A system of systems contains independent participants","fig":null,"sourceRange":"3–8","bullets":[["Operational independence","Constituents remain useful as systems in their own right."],["Managerial independence","Constituent owners retain decision authority."],["Evolution / emergence","Independent changes and interactions affect shared behavior."],["Other characteristics","Geographic distribution, heterogeneity and large data volumes."]],"question":"Why can a small integration still be a system of systems?","answer":"The distinguishing feature is independent management, not code size alone. Even a few externally managed services may create SoS constraints.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Geographic distribution, heterogeneity and large data volumes.","full":"<p><b>Operational independence.<\/b> Constituents remain useful as systems in their own right.<\/p><p><b>Managerial independence.<\/b> Constituent owners retain decision authority.<\/p><p><b>Evolution / emergence.<\/b> Independent changes and interactions affect shared behavior.<\/p><p><b>Other characteristics.<\/b> Geographic distribution, heterogeneity and large data volumes.<\/p>","sourceStart":3},{"id":"X02","title":"Three different kinds of complexity","fig":"ch20_complexity","sourceRange":"9–14","bullets":[["Technical","Relationships among system elements and their runtime behavior."],["Managerial","Who can operate, change and coordinate the constituent systems."],["Governance","Policies and decision-making structures constraining those managers."],["Interaction","A policy change can also alter operational and technical dependencies."]],"question":"Is inability to force another owner’s deployment merely a software defect?","answer":"No. It is a management/governance constraint that technical design must accommodate.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/09d19e989499209f.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"A policy change can also alter operational and technical dependencies.","full":"<p><b>Technical.<\/b> Relationships among system elements and their runtime behavior.<\/p><p><b>Managerial.<\/b> Who can operate, change and coordinate the constituent systems.<\/p><p><b>Governance.<\/b> Policies and decision-making structures constraining those managers.<\/p><p><b>Interaction.<\/b> A policy change can also alter operational and technical dependencies.<\/p>","sourceStart":9},{"id":"X02A","title":"Keep the two classification vocabularies aligned","fig":"ch20_classification","sourceRange":"15–20","bullets":[["Organizational","One organization provides an ultimate governance structure."],["Federated","Owners agree to a voluntary joint governance body."],["Coalition","Participants collaborate without formal shared governance."],["Criterion","Classify authority and coordination, not only network connections."]],"question":"Which classification fits an agreed joint governing body whose decisions participants implement?","answer":"The author’s federated SoS, corresponding to Maier’s collaborative category. A coalition without that formal body is different.","rows":null,"heads":null,"extra":"Vocabulary mapping in the supplied chapter: Maier directed ↔ organizational; collaborative ↔ federated; virtual ↔ coalition. The source discusses why the alternative names better emphasize governance.","phase":"LEARN","figure":"assets/v3/cc11430e2482e8ab.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Classify authority and coordination, not only network connections.","full":"<p><b>Organizational.<\/b> One organization provides an ultimate governance structure.<\/p><p><b>Federated.<\/b> Owners agree to a voluntary joint governance body.<\/p><p><b>Coalition.<\/b> Participants collaborate without formal shared governance.<\/p><p><b>Criterion.<\/b> Classify authority and coordination, not only network connections.<\/p>","sourceStart":15},{"id":"X03","title":"Reductionist assumptions can break at system boundaries","fig":"ch20_reality","sourceRange":"21–26","bullets":[["Control","There may be no single authority able to change every constituent."],["Decisions","Organizational interests can compete with purely technical criteria."],["Boundaries","The problem and participating systems may be renegotiated."],["Implication","Local correctness alone does not establish the whole-system outcome."]],"question":"Why is a correct interface specification not a guarantee of a stable SoS?","answer":"Owners can evolve systems independently, and participation or meaning may change. Cross-system behavior and governance assumptions need ongoing review.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/a19c188bb406ead3.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Local correctness alone does not establish the whole-system outcome.","full":"<p><b>Control.<\/b> There may be no single authority able to change every constituent.<\/p><p><b>Decisions.<\/b> Organizational interests can compete with purely technical criteria.<\/p><p><b>Boundaries.<\/b> The problem and participating systems may be renegotiated.<\/p><p><b>Implication.<\/b> Local correctness alone does not establish the whole-system outcome.<\/p>","sourceStart":21},{"id":"CHECK1","title":"Checkpoint · bound the shared promise","fig":null,"sourceRange":"3–26","bullets":[["Think","Three owners publish data to one incident dashboard."],["Pair","Separate what the dashboard controls from what it merely receives."],["Record","State a useful claim with participation and freshness assumptions."]],"question":"Can the dashboard owner promise that every provider will always update on time?","answer":"Not without the corresponding authority/agreement and evidence. It can promise its own bounded display, validation and fallback behavior.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"State a useful claim with participation and freshness assumptions.","full":"<p><b>Think.<\/b> Three owners publish data to one incident dashboard.<\/p><p><b>Pair.<\/b> Separate what the dashboard controls from what it merely receives.<\/p><p><b>Record.<\/b> State a useful claim with participation and freshness assumptions.<\/p>","sourceStart":3},{"id":"X04","title":"Five engineering activities; governance alongside","fig":"ch20_soseng","sourceRange":"27–32","bullets":[["Conceptual design","Identify useful capabilities, existing systems and constraints."],["Selection / architecture","Choose participants and organize their interaction together."],["Interfaces","Reconcile the different services and representations."],["Integration / deployment","Introduce useful capabilities while coordinating management policies."]],"question":"Why should governance discussions start before the final integration test?","answer":"Authority, participation, change handling and acceptance affect which integrations are feasible and can take longer to agree than an interface takes to implement.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/9dd47ad69147bc4e.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Introduce useful capabilities while coordinating management policies.","full":"<p><b>Conceptual design.<\/b> Identify useful capabilities, existing systems and constraints.<\/p><p><b>Selection / architecture.<\/b> Choose participants and organize their interaction together.<\/p><p><b>Interfaces.<\/b> Reconcile the different services and representations.<\/p><p><b>Integration / deployment.<\/b> Introduce useful capabilities while coordinating management policies.<\/p>","sourceStart":27},{"id":"X05","title":"An interface must reconcile more than syntax","fig":"ch20_serviceiface","sourceRange":"33–36","bullets":[["Service boundary","Expose the needed capability of an existing system."],["Adaptation","Translate specialized APIs or interactions without assuming internal control."],["User interface","Unification may help, but workflow and usage differences can make it costly."],["Contract","State data meaning, timing, failures and change responsibility."]],"question":"Why might a single unified user interface be the wrong choice?","answer":"Different interaction models, dominant local workflows or open-ended participant additions may make unification impractical or slow the main task.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6f43909f3370e740.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"State data meaning, timing, failures and change responsibility.","full":"<p><b>Service boundary.<\/b> Expose the needed capability of an existing system.<\/p><p><b>Adaptation.<\/b> Translate specialized APIs or interactions without assuming internal control.<\/p><p><b>User interface.<\/b> Unification may help, but workflow and usage differences can make it costly.<\/p><p><b>Contract.<\/b> State data meaning, timing, failures and change responsibility.<\/p>","sourceStart":33},{"id":"DEPLOY","title":"Deliver useful intermediate forms","fig":"ch20_ilearn","sourceRange":"37–39","bullets":[["Staged value","An incomplete SoS should still perform useful bounded work."],["Existing operation","Constituents may already be deployed and cannot all be frozen."],["Increment","Add a coherent capability with explicit acceptance conditions."],["People","Plan training, equipment and operational transition as well as code."]],"question":"What makes a staged release more than an unfinished system?","answer":"A defined useful capability, explicit missing participation, acceptance evidence and a safe path to later stages.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e6e451bd15d86744.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Plan training, equipment and operational transition as well as code.","full":"<p><b>Staged value.<\/b> An incomplete SoS should still perform useful bounded work.<\/p><p><b>Existing operation.<\/b> Constituents may already be deployed and cannot all be frozen.<\/p><p><b>Increment.<\/b> Add a coherent capability with explicit acceptance conditions.<\/p><p><b>People.<\/b> Plan training, equipment and operational transition as well as code.<\/p>","sourceStart":37},{"id":"X06","title":"Test the interactions that owners do not control alone","fig":null,"sourceRange":"40–43","bullets":[["No complete specification","Acceptance may require close stakeholder participation."],["Independent change","A constituent update can invalidate a previous result."],["Constraints","Fixes may need mediation rather than a constituent-code change."],["Regression","Automate repeatable cross-system checks where feasible."]],"question":"Which record makes a cross-system result repeatable?","answer":"Participant and interface versions, inputs, relevant data/time assumptions, expected result and observed behavior. Record changes that cannot be controlled.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Automate repeatable cross-system checks where feasible.","full":"<p><b>No complete specification.<\/b> Acceptance may require close stakeholder participation.<\/p><p><b>Independent change.<\/b> A constituent update can invalidate a previous result.<\/p><p><b>Constraints.<\/b> Fixes may need mediation rather than a constituent-code change.<\/p><p><b>Regression.<\/b> Automate repeatable cross-system checks where feasible.<\/p>","sourceStart":40},{"id":"CHECK2","title":"Checkpoint · useful value with one participant missing","fig":null,"sourceRange":"27–43","bullets":[["Think","One data provider becomes slow or unavailable."],["Pair","Define what remains useful and what the user must see as unknown."],["Record","Add the chosen interface/fallback mechanism and its trade-off."]],"question":"Why is displaying old data as current a different problem from showing “unavailable”?","answer":"It presents unsupported certainty. A bounded service must preserve freshness/uncertainty information so users can interpret the result.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the chosen interface/fallback mechanism and its trade-off.","full":"<p><b>Think.<\/b> One data provider becomes slow or unavailable.<\/p><p><b>Pair.<\/b> Define what remains useful and what the user must see as unknown.<\/p><p><b>Record.<\/b> Add the chosen interface/fallback mechanism and its trade-off.<\/p>","sourceStart":27},{"id":"X09","title":"Architecture principles and frameworks","fig":null,"sourceRange":"44–47","bullets":[["Value and control","Deliver useful incomplete forms; be realistic about authority."],["Interfaces and incentives","Support evolution and give owners reasons to participate."],["Multiple views","Business, data/application and technology views describe different concerns."],["Management effort","Creating and maintaining consistent models takes time."]],"question":"(1) Why is an incentive to maintain a data feed an architectural concern? (2) When can a framework remain useful despite its limitations?","answer":"(1) The capability depends on continued participation. An elegant interface cannot sustain the service when an independent owner has no reason to maintain it. (2) As a checklist and shared vocabulary for architectural concerns, provided the team does not assume it solves independent ownership or uncertain boundaries.","rows":null,"heads":null,"extra":"All seven source principles are retained: incomplete value; realistic control; interfaces; collaboration incentives; node-and-web structure; service exchanges; vulnerability management.","phase":"LEARN","takeaway":"Principles include people and incentives; frameworks offer views, not authority.","full":"<p><b>Value and control.<\/b> Deliver useful incomplete forms; be realistic about authority.<\/p><p><b>Interfaces and incentives.<\/b> Support evolution and give owners reasons to participate.<\/p><p><b>Node and web.<\/b> Model sociotechnical nodes and both technical/social connections.<\/p><p><b>Services and vulnerabilities.<\/b> Define exchanges and design for unexpected failures.<\/p><p><b>Multiple views.<\/b> Business, data/application and technology views describe different concerns.<\/p><p><b>Management effort.<\/b> Creating and maintaining consistent models takes time.<\/p><p><b>Limitation.<\/b> A framework cannot create authority over independent participants.<\/p><p><b>Source scope.<\/b> The shown TOGAF diagram is the textbook’s historical version, not a current compliance claim.<\/p>","sourceStart":44,"notes":"","figure":"assets/v3/b83804ee6ccbfdb0.jpg","caption":"Sommerville Ch.20 · preserved source illustration"},{"id":"X08","title":"Pattern 1 · systems as data feeds","fig":"ch20_datafeeds","sourceRange":"48–53","bullets":[["Principal system","Queries information held by other systems."],["Unifying interface","Can translate a common query to provider-specific formats."],["Failure behavior","Bound waiting and show missing or stale inputs."],["Governance","Agree how interface and data-format changes are communicated."]],"question":"What should a slow provider not be allowed to do to the whole dashboard?","answer":"Cause an unbounded wait or silently replace unknown data with a misleading value. Define timeout and explicit partial-result behavior.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1c08c1faae4be113.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Agree how interface and data-format changes are communicated.","full":"<p><b>Principal system.<\/b> Queries information held by other systems.<\/p><p><b>Unifying interface.<\/b> Can translate a common query to provider-specific formats.<\/p><p><b>Failure behavior.<\/b> Bound waiting and show missing or stale inputs.<\/p><p><b>Governance.<\/b> Agree how interface and data-format changes are communicated.<\/p>","sourceStart":48},{"id":"CONTAINER","title":"Pattern 2 · systems in a virtual container","fig":"ch20_container","sourceRange":"54–59","bullets":[["Common services","A principal system offers facilities such as sign-in, storage or configuration."],["Adapters","Approved systems integrate through interfaces to those common services."],["Unapproved systems","May remain reachable without shared-service integration."],["Not an OS container","This is a SoS integration pattern, not necessarily process isolation."]],"question":"Does adding a link to a tool mean it participates in common sign-in and storage?","answer":"No. Those integrations need compatible interfaces and configuration. Mere inclusion in the user interface does not establish them.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3ee6a1792825a363.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"This is a SoS integration pattern, not necessarily process isolation.","full":"<p><b>Common services.<\/b> A principal system offers facilities such as sign-in, storage or configuration.<\/p><p><b>Adapters.<\/b> Approved systems integrate through interfaces to those common services.<\/p><p><b>Unapproved systems.<\/b> May remain reachable without shared-service integration.<\/p><p><b>Not an OS container.<\/b> This is a SoS integration pattern, not necessarily process isolation.<\/p>","sourceStart":54},{"id":"TRADING","title":"Pattern 3 · trading between participants","fig":"ch20_trading","sourceRange":"60–63","bullets":[["Exchange","Participants offer and request services or items rather than only publish data."],["Coordination","Agreed interaction rules organize the exchange."],["Independence","Participants retain local interests, policies and evolution."],["Choice","Real SoS may combine trading, containers and data feeds."]],"question":"Why is trading not just a faster one-way data feed?","answer":"The pattern involves exchanges between participants with roles and agreements; a one-way feed primarily supplies observations to a consumer.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/aafbde3e7bf09b87.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Real SoS may combine trading, containers and data feeds.","full":"<p><b>Exchange.<\/b> Participants offer and request services or items rather than only publish data.<\/p><p><b>Coordination.<\/b> Agreed interaction rules organize the exchange.<\/p><p><b>Independence.<\/b> Participants retain local interests, policies and evolution.<\/p><p><b>Choice.<\/b> Real SoS may combine trading, containers and data feeds.<\/p>","sourceStart":60},{"id":"AISYS","phase":"LEARN","skin":"genai","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source concepts to an AI component","sourceStart":1,"banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · ROLE-PLAY","caption":"Every owner can change their own model. Nobody owns the meaning of the whole."},"title":"Role-play: three owners, one AI-produced feed","takeaway":"When a participant’s AI changes, the interface can stay the same while the promise does not.","nodes":[["Agency A · feed owner","“Our new model is better; the format is unchanged.”"],["Dashboard owner","“What did ‘high severity’ mean last week?”"],["Public user","“Can I trust today’s map?”"]],"bullets":[["Round 1","Each role states what it needs from the others."],["Round 2","Agree one thing each owner will record or announce."],["Verdict","What can the dashboard still promise—and label?"]],"question":"What can the dashboard owner promise about Agency A’s AI-produced feed without controlling Agency A?","answer":"Not that the classifications are correct—it cannot inspect or version the model. It can promise to show each item with its source, timestamp and the producer’s declared model version; to flag detected shifts, such as a sudden change in the share of ‘high severity’ incidents; and to label affected data as unverified. It can seek an agreement that participants announce model changes as interface changes, with a trial period. The promise is bounded by what the dashboard observes; governance covers the rest.","full":"<p>This slide is course-added. It asks three owners in the opening case to negotiate what an AI-produced feed can promise.<\/p><h3>How the slide uses the five objectives<\/h3><p>Independence: each owner can change its own model without asking anyone. Complexity: model policy is managerial and governance complexity, not only technical. Reductionism: each model being locally better does not make the whole dashboard more trustworthy. Interfaces and testing: declared model versions and cross-system checks on content, not only shape. Architectures: an AI summary is still a data feed; AI agents negotiating on behalf of owners would resemble the trading pattern.<\/p><p><b>Semantic drift.<\/b> The meaning of data changes while its format stays the same—for example, a new model classifying the same report differently. Schema validation cannot detect it.<\/p><p><b>Model version as interface.<\/b> Treating a participant’s model version as part of the interface agreement, so a change is announced, versioned and tested like any other interface change.<\/p><p><b>Bounded promise.<\/b> In a system of systems, the principal system can promise only what it can observe and control; it labels the rest.<\/p><p class=\"small\">The case is course-created.<\/p>","notes":"Allow about 6 minutes. Format: role-play. Assign three students or groups to the roles; one minute per round, then take the verdict from the rest of the class. New terms, at most two: semantic drift and model version as interface. Everything else in Full explanation is optional depth and is not assessed."},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Same interface, different promise.","bullets":[["New information","A slower schedule and a new AI model version—same interface shape."],["Reassess","Freshness and meaning both changed without a schema change."],["Revise","Label freshness and model version; mark changed data as unverified."],["Own","Name who negotiates with the agency and informs the public."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. For the AI-produced feed, show its declared model version and flag data produced since the change as unverified until the agency confirms how its classifications changed.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>One participating feed changes to a slower update schedule while keeping the same interface shape.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What useful service can be promised without pretending to control every owner? What can be promised about a feed produced by another owner’s AI model?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. The dashboard can promise what it observes—source, timestamp, declared model version—not the correctness of classifications made by a model it cannot inspect.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, validating feed shape only, or also monitoring each feed’s content for sudden shifts and labelling it.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. Shape validation cannot see a change in meaning; monitoring distributions (for example, the share of ‘high severity’) can flag a shift but not prove which classification is right.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"One participating feed changes to a slower update schedule while keeping the same interface shape. The same agency also changed its AI model version: the feed’s shape is unchanged, but incidents are now classified differently.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. Freshness and meaning both changed with no schema change; the dashboard must label what it cannot vouch for and agree with the agency how model changes are announced.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["DEPLOY"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["DEPLOY","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"SoS classification and independence","range":"15–20"},{"title":"Data feeds and architecture patterns","range":"48–53"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"SoS characteristics and complexity","start":3,"end":14,"units":["X01","X02","CHECK1"]},{"title":"Classification and reductionism","start":15,"end":26,"units":["X02A","X03","CHECK1"]},{"title":"Engineering, interfaces and deployment","start":27,"end":39,"units":["X04","X05","DEPLOY","CHECK2"]},{"title":"Testing and architecture principles","start":40,"end":47,"units":["X06","CHECK2","X09"]},{"title":"Data feeds, containers and trading","start":48,"end":63,"units":["X08","CONTAINER","TRADING"]}],"sourceCount":63,"original":"sources/Ch20-Original.pptx","textbook":"sources/Ch20-Textbook.pdf","bookPages":30,"quiz":[{"q":"A constituent remains useful on its own and has its own owner. This indicates:","options":["Only technical replication","Operational and managerial independence","One centrally controlled application"],"answer":1,"why":"These independent purposes and owners constrain SoS coordination."},{"q":"Independent owners agree to a formal joint governance body whose decisions they implement. Which source mapping is correct?","options":["Organizational / directed","Federated / collaborative","Coalition / virtual"],"answer":1,"why":"The supplied chapter maps Maier’s collaborative category to federated SoS. A coalition lacks this formal joint governance body."},{"q":"Why can reductionist reasoning fail in a SoS?","options":["Constituents never have specifications","Interfaces are irrelevant","Interactions and independent evolution produce emergent behavior"],"answer":2,"why":"Local correctness alone does not establish a shared system-level outcome."},{"q":"A staged release should:","options":["Provide bounded value with explicit interfaces and incomplete participation","Wait for total control of all owners in every case","Ignore version differences"],"answer":0,"why":"Incremental acceptance must state participation and interface assumptions."},{"q":"Which statement best distinguishes trading from a one-way feed?","options":["Trading is only a faster feed","Trading supports exchanges between participants rather than only publishing observations","Data feeds cannot have timestamps"],"answer":1,"why":"Select the interaction pattern according to the service and ownership needs."}],"alignment":[{"objective":"Recognize operational and managerial independence.","evidence":"Explain and demonstrate: Recognize operational and managerial independence.","field":"FIT · practice/reviewer opportunity, not automatic attainment"},{"objective":"Classify SoS and explain three kinds of complexity.","evidence":"Explain and demonstrate: Classify SoS and explain three kinds of complexity.","field":"technical + BOUND · practice/reviewer opportunity, not automatic attainment"},{"objective":"Explain why reductionist assumptions can fail.","evidence":"Explain and demonstrate: Explain why reductionist assumptions can fail.","field":"sourceUse + FIT · practice/reviewer opportunity, not automatic attainment"},{"objective":"Plan interfaces, staged deployment and cross-system tests.","evidence":"Explain and demonstrate: Plan interfaces, staged deployment and cross-system tests.","field":"INTEGRATE / measure + EVIDENCE · practice/reviewer opportunity, not automatic attainment"},{"objective":"Compare data-feed, container and trading architectures.","evidence":"Explain and demonstrate: Compare data-feed, container and trading architectures.","field":"ACT + REFIT · practice/reviewer opportunity, not automatic attainment"}],"artifact":"Build an authority/participation map, interface/freshness contract and staged acceptance plan.","bridge":"Build an authority/participation map, interface/freshness contract and staged acceptance plan. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"DEPLOY","workload":"Consider cross-owner coordination and escalation when no person has complete system authority.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","X10":"X09"},"roadmap":{"question":"What can independent system owners promise together?","connection":"Independence creates complexity; classification exposes authority; engineering and architecture coordinate useful, bounded cooperation.","inClass":"Map owners, interactions and staged service commitments.","deliverable":"An authority map and staged acceptance plan.","success":"Explain what remains outside the shared decision-maker’s control.","branches":[{"verb":"Understand the relationships","label":"System complexity","detail":"Technical · managerial · governance","target":"X02","units":["X01","X02"],"caseLens":"Which participants remain independently useful and independently managed?"},{"verb":"Locate authority","label":"SoS classification","detail":"Organizational · federated · coalition","target":"X02A","units":["X02A","CHECK1"],"caseLens":"What authority does the dashboard owner actually have over each feed?"},{"verb":"Question the assumptions","label":"Reductionism and complex systems","detail":"Independence · emergence · limits of decomposition","target":"X03","units":["X03"],"caseLens":"Why can local correctness fail to guarantee the shared dashboard promise?"},{"verb":"Coordinate change","label":"Systems of systems engineering","detail":"Interfaces · staged deployment · cross-system tests","target":"X04","units":["X04","X05","DEPLOY","X06","CHECK2"],"caseLens":"How do owners coordinate interfaces, staged changes, and cross-system tests?"},{"verb":"Structure cooperation","label":"Systems of systems architecture","detail":"Data feeds · virtual container · trading","target":"X09","units":["X09","X08","CONTAINER","TRADING","AISYS","APPLY"],"caseLens":"Which architecture pattern can keep service useful when a feed slows or changes?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"Same data format. New AI model. Different meaning. Who noticed?","aiAssignment":{"title":"City dispatch with three owners’ AI","scenario":"A city dashboard coordinates ambulances from three independent owners: two public hospitals and a private ambulance company. Each owner runs its own AI system to rank incoming calls by urgency and publishes its ranked queue to the dashboard.","facts":["The dashboard can read each queue but cannot change any owner’s model.","All three owners use the same interface format.","There is no agreement on how model changes are announced."],"question":"What can the city dashboard promise about urgency across owners, and what must be agreed between them?","stress":"The private company updates its AI to weight calls from contract customers more heavily. The interface is unchanged, so the dashboard shows those calls as more urgent than equivalent calls from others.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023":[["SE-Teamwork","Teamwork","Interfacing with stakeholders outside the team."],["SE-Refactoring","Refactoring and Code Evolution","Compatibility with consumers you cannot see or control."],["SE-Design","Software Design","Identifying component boundaries and dependencies."],["SEP","Society, Ethics, and the Profession","Public impact and accountability across independent owners."]]}</script><script src="runtime/classroom-v3.js?v=20260927-singlecanvas-v3" defer></script></body></html>
