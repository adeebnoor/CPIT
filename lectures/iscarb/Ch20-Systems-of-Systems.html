</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261015-req-v7c"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 20</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch20-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":20,"title":"Systems of Systems","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch20-Systems-of-Systems.html","assignment":9,"points":5,"objectives":["Recognize operational and managerial independence.","Classify SoS and explain three kinds of complexity.","Explain why reductionist assumptions can fail.","Plan interfaces, staged deployment and cross-system tests.","Compare data-feed, container and trading architectures."],"sections":["20.1 System complexity","20.2 SoS classification","20.3 Reductionism and complex systems","20.4 SoS engineering","20.5 SoS architecture"],"case":{"headline":"Several owners connect. Who controls the shared promise?","text":"A fictional multi-agency dashboard combines independently managed data feeds. The principal system can validate and display received data but cannot dictate every provider’s update schedule.","question":"What useful service can be promised without pretending to control every owner?","mutation":"One participating feed changes to a slower update schedule while keeping the same interface shape. The same agency also changed its AI model version: the feed’s shape is unchanged, but incidents are now classified differently.","lens":"One agency now produces its feed with an AI model that summarises and classifies field reports. The dashboard owner cannot inspect or version that model. Hold that question: after the architecture patterns, one slide asks three owners to negotiate it.","fictional":true,"answerKey":"promise only what the dashboard controls and label the rest"},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Systems of Systems","phase":"START","takeaway":"Systems of Systems","full":"<p>Systems of Systems<\/p>","sourceStart":1,"minutes":2,"tier":"core"},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1,"minutes":1,"tier":"core"},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1,"minutes":1.5,"tier":"core"},{"id":"X01","title":"A system of systems contains independent participants","fig":null,"sourceRange":"3–8","bullets":[["Operational independence","Operational independence: constituents remain useful as systems in their own right."],["Managerial independence","Managerial independence: constituent owners retain decision authority."],["Evolution / emergence","Independent changes and interactions affect shared behavior."],["Other characteristics","Geographic distribution, heterogeneity and large data volumes."]],"question":"Why can a small integration still be a system of systems?","answer":"The distinguishing feature is independent management, not code size alone. Even a few externally managed services may create SoS constraints.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A system of systems has two or more independently managed parts; size is not the test.","full":"<p>Sommerville’s distinction is sociotechnical rather than technical: “A system of systems is a system that contains two or more independently managed elements.” There is no single manager for all the parts, and different parts follow different management and control policies. The definition says nothing about size: a relatively small system that uses services from different providers is a system of systems. The chapter’s examples include a cloud management system spanning private and public clouds, an online banking system that checks applicants with credit reference agencies, an emergency information system integrating police, ambulance, fire and coast guard data, and the iLearn digital learning environment.<\/p><p>Maier identified five essential characteristics: <b>operational independence<\/b> (parts are useful systems in their own right and evolve independently); <b>managerial independence<\/b> (parts are owned and managed by different organizations, or different parts of one—the key distinguishing factor); <b>evolutionary development<\/b> (the SoS evolves over time rather than in one project); <b>emergence<\/b> (characteristics that appear only after the SoS is created); and <b>geographical distribution<\/b>, which makes an externally managed network part of the SoS. Sommerville adds two: software SoS are <b>data-intensive<\/b>, often holding far more data than code, and <b>heterogeneous<\/b>, built with different languages and methods.<\/p>","sourceStart":3,"notes":"Ask whether a dashboard that pulls three agency feeds is a system of systems. It is—because three owners manage the feeds, not because of its size. Keep the list of owners on the board for the rest of the lecture.","minutes":1.5,"tier":"core","concept":"independent management as the test","answerKey":"independent management, not size","commonError":"Students judge a system of systems by code size. Ask who can change each part without asking anyone else."},{"id":"X02","title":"Three different kinds of complexity","fig":"ch20_complexity","sourceRange":"9–14","bullets":[["Technical","Relationships among system elements and their runtime behavior."],["Managerial","Who can operate, change and coordinate the constituent systems."],["Governance","Policies and decision-making structures constraining those managers."],["Interaction","A policy change can also alter operational and technical dependencies."]],"question":"Is inability to force another owner’s deployment merely a software defect?","answer":"No. It is a management/governance constraint that technical design must accommodate.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/09d19e989499209f.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"SoS complexity is technical, managerial and governance; a change in one spreads to the others.","full":"<p>A system’s complexity depends on the number and types of relationships between its elements. Static relationships, such as “uses,” can be analyzed from the code or a model; dynamic relationships, such as “calls,” depend on runtime inputs and are harder to analyze. Large systems also need complex production and management processes, which are complex systems in their own right and a main reason why projects run late and over budget.<\/p><p>Three types of complexity matter for sociotechnical systems. <b>Technical complexity<\/b> comes from the relationships between the system’s components. <b>Managerial complexity<\/b> comes from the relationships between the system and its managers—what they can change—and between the managers of different parts; it is an operational matter. <b>Governance complexity<\/b> comes from the laws, regulations and policies that affect the system and from the decision-making processes of the organizations responsible for it. The chapter’s example: allowing staff to use their own mobile devices is a governance decision. It makes management harder, because the devices must be configured securely, and raises technical complexity, because there is no longer one platform. Each SoS characteristic adds to one or more types; geographical distribution adds to all three.<\/p>","sourceStart":9,"notes":"Ask which type of complexity stops the dashboard owner forcing an agency to update faster: managerial or governance, not technical. Then ask what technical design can do about a constraint it cannot remove.","minutes":1.5,"tier":"optional","concept":"three kinds of complexity","answerKey":"a governance constraint, not a defect","commonError":"Students file every obstacle under technical complexity. Ask whether a better design could remove it; if not, it is managerial or governance."},{"id":"X02A","title":"Keep the two classification vocabularies aligned","fig":"ch20_classification","sourceRange":"15–20","bullets":[["Organizational","One organization provides an ultimate governance structure."],["Federated","Owners agree to a voluntary joint governance body."],["Coalition","Participants collaborate without formal shared governance."],["Criterion","Classify authority and coordination, not only network connections."]],"question":"Which class of system of systems is iLearn, and why?","answer":"A coalition, Maier's virtual class. No formal governance body spans the authorities. Each manages its own systems and collaborates informally. Its technical complexity is modest, but its governance complexity is high.","rows":null,"heads":null,"extra":"Sommerville’s names map to Maier’s: organizational ↔ directed; federated ↔ collaborative; coalition ↔ virtual. The chapter explains why its names describe governance more clearly.","phase":"LEARN","figure":"assets/v3/cc11430e2482e8ab.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Classify a system of systems by its governance: organizational, federated or coalition.","full":"<p>Maier classified systems of systems by their governance and management complexity. <b>Directed<\/b> SoS are owned by one organization, whose ultimate governing body can set priorities and resolve disputes: some managerial complexity but no governance complexity—for example, a military command-and-control system. <b>Collaborative<\/b> SoS have no central authority, but the owners recognize the benefits of joint governance and set up a voluntary governance body—for example, bus, rail and air providers linking their systems to give passengers up-to-date information. <b>Virtual<\/b> SoS have no central governance; participants may not agree on the overall purpose and may join or leave, and interoperability depends on published interfaces that may change—for example, algorithmic stock trading.<\/p><p>Sommerville prefers more descriptive names: <b>organizational<\/b> (Maier’s directed), <b>federated<\/b> (collaborative) and <b>coalition<\/b> (virtual). In a federated SoS, owners treat the governance body’s decisions as binding and implement them in their own policies. In a coalition there is no formal governance, but owners collaborate informally—for example, by not changing a data format without notice. Classifying a SoS shows whether the governance it needs exists. Setting up governance across organizations is political and slow, so it should start early; moving towards organizational governance usually reduces complexity. The chapter’s iLearn system is a coalition, and its designers recommended making it federated.<\/p>","sourceStart":15,"notes":"Ask pairs to classify our dashboard. With no joint body, it is a coalition—so nothing obliges an agency to announce a model change. Ask what it would take to make it federated.","minutes":2,"tier":"core","commonError":"Students classify by network links. Classify by authority: who can set priorities and resolve disputes.","concept2":"federated versus coalition","answerKey2":"federated: a joint body whose decisions owners implement","question2":"Which classification fits an agreed joint governing body whose decisions participants implement?","answer2":"The author's federated system of systems, Maier's collaborative category. A coalition without that formal body is different.","sourceFigs":[18],"lists":[{"source":16,"title":"Maier's classification","items":["Directed: owned by a single organisation and built from systems that organisation also owns; parts may be independently managed","Collaborative: no central authority sets priorities or resolves disputes; elements are owned by different organisations","Virtual: no central governance; participants may not agree on the purpose and may enter or leave"]},{"source":17,"title":"More intuitive terms","items":["Organizational: governance and management lie within one organisation","Federated: governance depends on a voluntary body in which all owners are represented","Coalition: no formal governance; organisations collaborate informally and manage their own systems"]}],"transfer":true,"concept":"classifying a system of systems by governance","answerKey":"a coalition, because no shared governance exists"},{"id":"X03","title":"Reductionist assumptions can break at system boundaries","fig":"ch20_reality","sourceRange":"21–26","bullets":[["Control","There may be no single authority able to change every constituent."],["Decisions","Organizational interests can compete with purely technical criteria."],["Boundaries","The problem and participating systems may be renegotiated."],["Implication","Local correctness alone does not establish the whole-system outcome."]],"question":"Why is a correct interface specification not a guarantee of a stable SoS?","answer":"Owners can evolve systems independently, and participation or meaning may change. Cross-system behavior and governance assumptions need ongoing review.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/a19c188bb406ead3.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Reductionism assumes one owner, rational decisions and clear boundaries; a SoS has none.","full":"<p>Reductionism assumes that a system is made of parts and that the behavior of the whole can be understood and predicted from the parts and their relationships. It underlies all engineering, including top-down design, object-oriented design and agile methods, which simply decompose a system incrementally. It works best when there are relatively few relationships between parts and they can be modeled scientifically—true of mechanical systems, less true of software, with its many static and dynamic relationships.<\/p><p>Its assumptions fail for systems of systems in three areas. <b>Ownership and control<\/b>: reductionism assumes a controlling authority that can resolve disputes; a SoS has several governing bodies. <b>Decision making<\/b>: reductionism assumes decisions are made rationally on technical criteria; in a SoS they are often driven by political motives. <b>Problem definition<\/b>: reductionism assumes a definable problem with clear boundaries; a SoS often addresses a wicked problem whose boundaries are constantly renegotiated. Software makes this worse: its relationships follow no physical laws, nothing physical limits where boundaries are drawn, and linking systems from different owners is easy. Reductionist methods remain useful for the constituent systems, but they cannot by themselves engineer the whole SoS.<\/p>","sourceStart":21,"notes":"Ask for one example of each failed assumption in our dashboard: no single owner, agency priorities that are political, and a boundary that moves when a new agency joins.","minutes":1.5,"tier":"core","concept":"reductionist assumptions","answerKey":"owners evolve systems independently","commonError":"Students trust a correct interface specification as a guarantee. Ask who can change the meaning behind it without telling anyone."},{"id":"CHECK1","title":"Checkpoint · bound the shared promise","fig":null,"sourceRange":"3–26","bullets":[["Think","Three owners publish data to one incident dashboard."],["Pair","Separate what the dashboard controls from what it merely receives."],["Record","State a useful claim with participation and freshness assumptions."]],"question":"Can the dashboard owner promise that every provider will always update on time?","answer":"Not without the corresponding authority, agreement and evidence. It can promise its own display, validation and fallback behaviour, with limits.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Promise what the dashboard controls; label what it only receives.","full":"<p>The dashboard owner controls its own validation, display, timeouts and labels. It does not control when each agency updates its feed or how the agency produces the data. A useful, honest claim is therefore bounded—for example, “the dashboard shows each item with its source and timestamp, and marks feeds older than a stated limit as stale.” Anything beyond that, such as every provider updating on time, needs an agreement between owners and evidence that it is being kept.<\/p>","sourceStart":3,"notes":"Ask each pair to underline the words in their claim that depend on another owner. Every underlined word needs an agreement or a label.","minutes":1,"tier":"core","concept":"what the dashboard can promise","answerKey":"its own display, validation and fallback","commonError":"Students promise on behalf of the providers. Separate what the dashboard controls from what it only receives."},{"id":"X04","title":"Five engineering activities; governance alongside","fig":"ch20_soseng","sourceRange":"27–32","bullets":[["Conceptual design","Identify useful capabilities, existing systems and constraints."],["Selection / architecture","Choose participants and organize their interaction together."],["Interfaces","Reconcile the different services and representations."],["Integration / deployment","Introduce useful capabilities while coordinating management policies."]],"question":"Why should governance discussions start before the final integration test?","answer":"Authority, participation, change handling and acceptance decide which integrations are feasible. They can take longer to agree than an interface takes to implement.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/9dd47ad69147bc4e.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"SoS engineering integrates existing systems in five activities, with governance set in parallel.","full":"<p>SoS engineering integrates existing systems to create new capabilities. It is not top-down design: a SoS appears when an organization sees that it can add value by linking existing systems—for example, a city integrating its traffic management system with a national pollution-monitoring system so that it can change traffic light sequences at pollution hot spots. Its problems resemble those of integrating application systems (Chapter 15): no control over functionality and performance, incompatible assumptions, different evolution timetables and lack of support from owners.<\/p><p>Five general activities are involved. <b>Conceptual design<\/b> creates a high-level vision, essential requirements and constraints, informed by knowledge of existing systems. <b>System selection<\/b> chooses the participating systems; politics and governance often matter more than commercial criteria—an organization may refuse to work with a competitor, or insist that its own system is used. <b>Architectural design<\/b> proceeds in parallel with selection. <b>Interface development<\/b> lets incompatible systems interoperate, sometimes with a unified user interface. <b>Integration and deployment<\/b> make the systems work together and put them into operation. Alongside these, <b>governance and management policies<\/b> must be set. Across organizations this can be slow and may require them to change their own policies, so it should start early.<\/p>","sourceStart":27,"notes":"Ask which activity the dashboard team would be tempted to skip. Usually governance, because it looks like meetings rather than engineering. Point out that it takes longer than any interface.","minutes":1.5,"tier":"optional","concept":"governance alongside engineering","answerKey":"authority and acceptance decide what is feasible","commonError":"Students leave governance to the end. Agreements on authority and change can take longer than the interface itself."},{"id":"X05","title":"An interface must reconcile more than syntax","fig":"ch20_serviceiface","sourceRange":"33–36","bullets":[["Service boundary","Expose the needed capability of an existing system."],["Adaptation","Translate specialized APIs or interactions without assuming internal control."],["User interface","Unification may help, but workflow and usage differences can make it costly."],["Contract","State data meaning, timing, failures and change responsibility."]],"question":"Why might a single unified user interface be the wrong choice?","answer":"Different interaction models, dominant local workflows or open-ended participant additions may make unification impractical or slow the main task.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6f43909f3370e740.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Wrap each system as services behind a principal system; unify the UI only when it pays.","full":"<p>Constituent systems were built for their own purposes. Some offer service interfaces; more commonly they have a specialized API or can be used only through their user interface. The recommended approach is to implement <b>service-based interfaces<\/b>: examine each system’s functionality, define services that reflect it, and implement them by calling the system’s API or by mimicking user interaction. A <b>principal<\/b> or coordinating system then acts as a service broker, directing service calls between systems so that each need not know which system provides a service. Coalitions, whose members are peers, tend to interact directly instead.<\/p><p>A <b>unified user interface<\/b> makes the SoS easier to learn and reduces user error, but whether it is cost-effective depends on three factors. The <b>interaction assumptions<\/b> of the systems: process-driven and user-driven interaction models are practically impossible to unify. The <b>mode of use<\/b>: if users work mostly in one system—as air traffic controllers do with radar—a unified interface would slow down the main task. The <b>openness<\/b> of the SoS: if new systems or organizations can join, their interfaces cannot be anticipated. In practice, budget and time are the limiting factor, because UI development is one of the most expensive engineering activities.<\/p>","sourceStart":33,"notes":"Ask what a service interface to an agency feed must state beyond its fields: what the values mean, how fresh they are, and who announces changes. That list is the contract our case is missing.","minutes":1.5,"tier":"core","concept":"service interfaces versus unified UI","answerKey":"different workflows can make unification costly","commonError":"Students assume one unified interface is always better. Ask whose daily workflow it slows down."},{"id":"DEPLOY","title":"Deliver useful intermediate forms","fig":"ch20_ilearn","sourceRange":"37–39","bullets":[["Staged value","An incomplete SoS should still perform useful, limited work."],["Existing operation","Constituents may already be deployed and cannot all be frozen."],["Increment","Add a coherent capability with explicit acceptance conditions."],["People","Plan training, equipment and operational transition as well as code."]],"question":"What makes a staged release more than an unfinished system?","answer":"A defined useful capability, explicit missing participation, acceptance evidence and a safe path to later stages.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e6e451bd15d86744.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"In a SoS, integration and deployment merge into stages that each deliver something useful.","full":"<p>Normally a system is integrated from controlled components, validated and then released for deployment. In a SoS this may not be possible: some constituents are already deployed and in use, and the integration team cannot control changes to them. Integration and deployment therefore become one process. Following the principle that an incomplete SoS should still be useful, integration starts with systems that are already deployed and adds new systems as coherent additions to the overall capability.<\/p><p>The chapter’s iLearn plan has three stages. The first provides authentication, basic learning functionality and integration with school administration systems. The second adds an integrated storage system and specialized subject tools, such as history archives, science simulations and programming environments. The third adds user configuration and lets users add new systems, so that versions can be created for different age groups. Deployment may also require equipment installation and user training; when an existing system is being replaced, there may be no space, power or user time to install new equipment alongside it, and these nontechnical issues can delay adoption.<\/p>","sourceStart":37,"notes":"Ask what the dashboard’s first useful stage could be with only one agency feed. Push for a stage with its own acceptance condition, not a partial copy of the final system.","minutes":1.5,"tier":"optional","concept":"useful intermediate forms","answerKey":"a defined capability with acceptance evidence","commonError":"Students describe a stage as “the parts done so far”. Ask what useful work it does and how acceptance is shown."},{"id":"X06","title":"Test the interactions that owners do not control alone","fig":null,"sourceRange":"40–43","bullets":[["No complete specification","Acceptance may require close stakeholder participation."],["Independent change","A constituent update can invalidate a previous result."],["Constraints","Fixes may need mediation rather than a constituent-code change."],["Regression","Automate repeatable cross-system checks where feasible."]],"question":"Which record makes a cross-system result repeatable?","answer":"Participant and interface versions, inputs, relevant data/time assumptions, expected result and observed behavior. Record changes that cannot be controlled.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"SoS testing lacks a full specification and stable constituents, so borrow agile practices.","full":"<p>System testing is the most time-consuming and expensive part of integration, and a SoS makes it harder for three reasons. There may be no detailed requirements specification to test against, because the SoS’s functionality is defined by the systems it includes. The constituent systems may change during testing, so tests may not be repeatable. And if problems are found, it may not be possible to require a constituent system to change; intermediate software may have to be introduced instead.<\/p><p>Sommerville suggests borrowing two techniques from agile methods. First, agile acceptance does not rely on a complete specification: stakeholders are closely engaged and have the authority to decide when the system is acceptable, so a range of SoS stakeholders should take part in testing. Second, agile methods use automated testing extensively, which makes it much easier to rerun tests and discover whether an unexpected change in a constituent system has caused problems for the SoS as a whole.<\/p>","sourceStart":40,"notes":"Ask what a regression test for the dashboard should record so that it can be repeated after an agency changes its feed: the feed version, the input, the expected display and the time assumptions.","minutes":1.5,"tier":"core","concept":"repeatable cross-system results","answerKey":"record participant versions, inputs and assumptions","commonError":"Students record only the result. Ask which participant versions and data assumptions the result depended on."},{"id":"CHECK2","title":"Checkpoint · useful value with one participant missing","fig":null,"sourceRange":"27–43","bullets":[["Think","One data provider becomes slow or unavailable."],["Pair","Define what remains useful and what the user must see as unknown."],["Record","Add the chosen interface/fallback mechanism and its trade-off."]],"question":"Why is displaying old data as current a different problem from showing “unavailable”?","answer":"It presents unsupported certainty. A service with limits must preserve freshness and uncertainty information so users can interpret the result.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"When a feed fails, stay useful: show what is missing or stale rather than hide it.","full":"<p>If one provider becomes slow or unavailable, the dashboard can still show the other feeds. A timeout stops the slow feed from delaying the whole display, as the chapter recommends for the data-feed pattern. The harder decision is what to show for the missing feed. Showing its last values as if they were current presents unsupported certainty; showing “unavailable,” or the last values with their age clearly marked, keeps the result interpretable. A good card names the mechanism—a timeout and a freshness label—and its trade-off: users see a less complete picture, but not a misleading one.<\/p>","sourceStart":27,"notes":"Ask pairs to sketch the screen for a stale feed. Accept any design that makes the age of the data visible without a click.","minutes":1,"tier":"core","concept":"stale versus unavailable","answerKey":"old data shown as current hides uncertainty","commonError":"Students show the last values to keep the screen full. Ask what a user would do differently if they saw “unavailable”."},{"id":"X09","title":"Architecture principles and frameworks","fig":null,"sourceRange":"44–47","bullets":[["Value and control","Deliver useful incomplete forms; be realistic about authority."],["Interfaces and incentives","Support evolution and give owners reasons to participate."],["Multiple views","Business, data/application and technology views describe different concerns."],["Management effort","Creating and maintaining consistent models takes time."]],"question":"Why is an incentive to maintain a data feed an architectural concern?","answer":"The capability depends on continued participation. An elegant interface cannot sustain the service when an independent owner has no reason to maintain it.","rows":null,"heads":null,"extra":"The chapter's seven principles are Maier's four and Sillitto's three. Deliver value when incomplete. Be realistic about control. Focus on interfaces. Provide collaboration incentives. Design as nodes and a web. Specify behaviour as services exchanged between nodes. Understand and manage vulnerabilities.","phase":"LEARN","takeaway":"Principles include people and incentives; frameworks offer views, not authority.","full":"<p>Architectural design selects the systems to include, assesses how they will interoperate and designs mechanisms to support interaction, including data management, redundancy and communications. Maier gives four principles: design systems so that they <b>deliver value when incomplete<\/b>, with stable intermediate forms; <b>be realistic about what can be controlled<\/b>, since overcontrol provokes resistance from owners; <b>focus on the interfaces<\/b>, keeping them loose enough for systems to evolve; and <b>provide collaboration incentives<\/b>—financial, access (“you share your data and I’ll share mine”) or community. Sillitto adds three: design the SoS as <b>nodes and a web<\/b>, where nodes are sociotechnical systems and the web includes social communication between the people who run them; <b>specify behavior as services exchanged<\/b> between nodes; and <b>understand and manage vulnerabilities<\/b>. Sometimes the best solution is not more software but a change to the rules and policies that govern the system.<\/p><p>Architecture frameworks such as MODAF and TOGAF—whose Architecture Development Method covers business, data, application and technology architectures—describe an architecture through several views. They were designed for organizational SoS with a single governance authority. Their models take a long time to develop and are expensive to keep consistent, and they are fundamentally reductionist. Sommerville treats them as a useful checklist rather than a complete method for SoS architecture.<\/p>","sourceStart":44,"notes":"Ask which of the seven principles would have helped with the AI model change. Collaboration incentives and interfaces: an agency that gains something from announcing changes is more likely to announce them.","figure":"assets/v3/b83804ee6ccbfdb0.jpg","caption":"Sommerville Ch.20 · preserved source illustration","minutes":1.5,"tier":"core","concept":"incentives as architecture","answerKey":"the capability depends on continued participation","commonError":"Students treat an architecture framework as a solution. It offers views and a checklist; it cannot create authority.","concept2":"what a framework offers","answerKey2":"a checklist and vocabulary, not authority","question2":"When can a framework remain useful despite its limitations?","answer2":"As a checklist and shared vocabulary for architectural concerns. The team must not assume it solves independent ownership or uncertain boundaries.","lists":[{"source":43,"title":"General principles for architecting a system of systems","items":["Design systems so that they can deliver value if they are incomplete","Be realistic about what can be controlled","Focus on the system interfaces","Provide collaboration incentives","Design a system of systems as a node and web architecture","Specify behaviour as services exchanged between nodes","Understand and manage system vulnerabilities"]}]},{"id":"X08","title":"Pattern 1 · systems as data feeds","fig":"ch20_datafeeds","sourceRange":"48–53","bullets":[["Principal system","Queries information held by other systems."],["Unifying interface","Can translate a common query to provider-specific formats."],["Failure behavior","Bound waiting and show missing or stale inputs."],["Governance","Agree how interface and data-format changes are communicated."]],"question":"What should a slow provider not be allowed to do to the whole dashboard?","answer":"Cause an unbounded wait or silently replace unknown data with a misleading value. Define timeout and explicit partial-result behavior.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1c08c1faae4be113.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"A principal system queries data feeds; bound waits with timeouts and govern format changes.","full":"<p>In the <b>systems as data feeds<\/b> pattern, a principal system needs data of different types and queries other systems to get it. The data providers generally do not interact with each other. The pattern is often seen in organizational or federated systems where some governance exists. The chapter’s example is UK vehicle licensing: the licensing system checks an “insured vehicles” system, run as a federation by insurance companies, and a system of MOT roadworthiness certificates. The pattern suits situations where entities can be identified uniquely—by registration number or GPS coordinates, for example—and queries are relatively simple.<\/p><p>A variant adds a <b>unifying interface<\/b> when several systems provide similar but not identical data: an intermediate layer translates the principal system’s general query into each provider’s specific query. iLearn uses one to query three different school administration systems. The main problems are interface problems when feeds are unavailable or slow, so timeouts should ensure that one failed feed does not compromise the response time of the whole system. Governance should ensure that the format of provided data is not changed without the agreement of all system owners.<\/p>","sourceStart":48,"notes":"Ask what our case adds to the textbook’s governance rule: the meaning of the data can change even when its format does not. That is the gap the AI slide explores.","minutes":2,"tier":"core","concept":"timeouts and partial results","answerKey":"no unbounded wait and no misleading substitute value","commonError":"Students let one slow feed delay the whole display. Define the timeout and what the missing cell shows.","sourceFigs":[50,52],"lists":[{"source":49,"title":"Systems as data feeds","items":["A principal system requires data of different types","The data is available from other systems, which the principal system queries","The systems that provide data generally do not interact with each other","Often seen in organizational or federated systems where some governance exists"]}]},{"id":"CONTAINER","title":"Pattern 2 · systems in a virtual container","fig":"ch20_container","sourceRange":"54–59","bullets":[["Common services","A principal system offers facilities such as sign-in, storage or configuration."],["Adapters","Approved systems integrate through interfaces to those common services."],["Unapproved systems","May remain reachable without shared-service integration."],["Not an OS container","This is a SoS integration pattern, not necessarily process isolation."]],"question":"Does adding a link to a tool mean it participates in common sign-in and storage?","answer":"No. Those integrations need compatible interfaces and configuration. Mere inclusion in the user interface does not establish them.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3ee6a1792825a363.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"A container system shares common services with approved systems through separate interfaces.","full":"<p>In the <b>systems in a container<\/b> pattern, one system acts as a virtual container providing common services, such as authentication and storage; other systems are conceptually placed inside it so that users can reach their functionality. Included systems may be chosen from an approved list and need not know they are in a container. The pattern is most often seen in federated systems or coalitions. Nothing is placed in a real container: each approved system has its own interface that translates between the container’s common services and the system’s requirements. Unapproved systems can also be included, but they cannot use the common services.<\/p><p>iLearn is the chapter’s example, with three common services: single sign-in to all approved systems, storage of user data that moves seamlessly to and from approved systems, and configuration to include or remove systems. A physics version includes Office 365, Moodle, a simulator and a lab data analyzer as approved systems; YouTube and a science encyclopedia are unapproved, so users log in separately and move their own data. The pattern has two problems: a separate interface is needed for each approved system, which limits their number, and the container’s owners have no influence on the included systems, which may change or be withdrawn at any time. Its main benefit is incremental development: early versions can use unapproved systems, with interfaces added later.<\/p>","sourceStart":54,"notes":"Ask what happens to single sign-in when an unapproved tool is added as a link: nothing, because it is not integrated. Then ask what the container owner can do if an approved system is withdrawn.","minutes":1.5,"tier":"core","concept":"integration versus inclusion","answerKey":"a link does not give common sign-in or storage","commonError":"Students think adding a tool to the menu integrates it. Each approved system needs its own interface to the common services."},{"id":"TRADING","title":"Pattern 3 · trading between participants","fig":"ch20_trading","sourceRange":"60–63","bullets":[["Exchange","Participants offer and request services or items rather than only publish data."],["No principal system","Each system publishes its own interface; shared standards may not exist."],["Independence","Participants retain local interests, policies and evolution."],["Choice","Real SoS may combine trading, containers and data feeds."]],"question":"Why is trading not just a faster one-way data feed?","answer":"In a trading system of systems there is no principal system. Participants exchange information with one another, one-to-one or one-to-many. Each publishes its own interface. In the data-feed pattern, a principal system queries providers that do not interact with each other.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/aafbde3e7bf09b87.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Trading systems exchange information with no principal system and often no governance.","full":"<p>In a <b>trading<\/b> SoS there is no single principal system: processing may take place in any constituent system, and the systems trade information among themselves in one-to-one or one-to-many interactions. Each system publishes its own interface, but there may be no interface standards that all systems follow. Trading systems may be federated systems or coalitions. Examples are algorithmic stock trading, where brokers’ systems buy and sell automatically, set prices and negotiate with each other, and travel aggregators that compare prices and let users book directly.<\/p><p>The major problem is the lack of a governance mechanism: any system may change at any time, and a change that contradicts other systems’ assumptions can stop trading. Owners who want to keep trading may make informal arrangements to avoid this; in other cases the change is deliberate—an airline may make its system unavailable to an aggregator to force customers to book directly. As with all architectural patterns, real systems of systems usually combine several patterns.<\/p>","sourceStart":60,"notes":"Ask whether our dashboard is a trading system. It is not—it has a principal system—but ask what would change if the agencies started exchanging data with each other directly.","minutes":1.5,"tier":"core","concept":"trading versus data feeds","answerKey":"no principal system; participants exchange directly","commonError":"Students describe trading as a two-way data feed. The difference is the missing principal system and the missing governance."},{"id":"AISYS","phase":"LEARN","skin":"genai","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source concepts to an AI component","sourceStart":1,"banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · ROLE-PLAY","caption":"Every owner can change their own model. Nobody owns the meaning of the whole."},"title":"Role-play: three owners, one AI-produced feed","takeaway":"When a participant’s AI changes, the interface can stay the same while the promise does not.","nodes":[["Agency A · feed owner","“Our new model is better; the format is unchanged.”"],["Dashboard owner","“What did ‘high severity’ mean last week?”"],["Public user","“Can I trust today’s map?”"]],"bullets":[["Round 1","Each role states what it needs from the others."],["Round 2","Agree one thing each owner will record or announce."],["Verdict","What can the dashboard still promise—and label?"]],"question":"What can the dashboard owner promise about Agency A’s AI-produced feed without controlling Agency A?","answer":"Not that the classifications are correct. The dashboard cannot inspect or version the model. It can promise to show each item with its source, timestamp and the producer's declared model version. It can flag detected shifts, such as a sudden change in the share of high-severity incidents. It can label affected data as unverified. It can seek an agreement that participants announce model changes as interface changes, with a trial period. The promise is limited to what the dashboard observes. Governance covers the rest.","full":"<p>This slide is course-added. It asks three owners in the opening case to negotiate what an AI-produced feed can promise.<\/p><h3>How the slide uses the five objectives<\/h3><p>Independence: each owner can change its own model without asking anyone. Complexity: model policy is managerial and governance complexity, not only technical. Reductionism: each model being locally better does not make the whole dashboard more trustworthy. Interfaces and testing: declared model versions and cross-system checks on content, not only shape. Architectures: an AI summary is still a data feed; AI agents negotiating on behalf of owners would resemble the trading pattern.<\/p><p><b>Semantic drift.<\/b> The meaning of data changes while its format stays the same—for example, a new model classifying the same report differently. Schema validation cannot detect it.<\/p><p><b>Model version as interface.<\/b> Treating a participant’s model version as part of the interface agreement, so a change is announced, versioned and tested like any other interface change.<\/p><p><b>Bounded promise.<\/b> In a system of systems, the principal system can promise only what it can observe and control; it labels the rest.<\/p><p class=\"small\">The case is course-created.<\/p>","notes":"Allow about 6 minutes. Format: role-play. Assign three students or groups to the roles; one minute per round, then take the verdict from the rest of the class. New terms, at most two: semantic drift and model version as interface. Everything else in Full explanation is optional depth and is not assessed.","minutes":3,"tier":"core","concept":"promising about another owner's AI feed","answerKey":"show source, timestamp and model version; label the rest unverified","commonError":"Students promise that the classifications are correct. The dashboard cannot inspect or version the agency's model.","added":true},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Same interface, different promise.","bullets":[["New information","A slower schedule and a new AI model version—same interface shape."],["Reassess","Freshness and meaning both changed without a schema change."],["Revise","Label freshness and model version; mark changed data as unverified."],["Own","Name who negotiates with the agency and informs the public."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. For the AI-produced feed, show its declared model version. Flag data produced since the change as unverified until the agency confirms how its classifications changed.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>One participating feed changes to a slower update schedule while keeping the same interface shape.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Accept revisions that label freshness and model version and mark data produced since the change as unverified. Ask who negotiates an announcement agreement with the agency and who tells the public what changed.","minutes":1,"tier":"core","concept":"revising under new evidence","answerKey":"label freshness and model version; mark changed data unverified","commonError":"Students fix the schedule and miss the model change. Same interface shape does not mean the same meaning.","twist":true,"added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1,"minutes":2,"tier":"core"}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What useful service can be promised without pretending to control every owner?","pair":"Name one assumption and one given fact you need to support your answer.","write":"Write your claim and its evidence. Mark any test you only propose as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given facts. Ask which missing fact would change your claim. Decide what can be promised about a feed produced by another owner's AI model.","answer":"An answer with limits separates the given facts from the needed evidence. A source explanation supports a mechanism. It does not prove the fictional deployment passed a test. The dashboard can promise what it observes: source, timestamp and declared model version. It cannot promise the correctness of classifications made by a model it cannot inspect.","no":1,"at":"CHECK1","seconds":210,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same card; nobody is marked on field length or a timer.","ai":["think"],"minutes":3.5,"tier":"core","concept":"promise what you observe","answerKey":"source, timestamp and declared model version, not correctness","rubric":{"criteria":[{"name":"Names the mechanism","levels":[[2,"Strong","Names the chapter mechanism that decides the case and says how it applies."],[1,"Partial","Names a mechanism but does not connect it to the case facts."],[0,"Missing","No chapter mechanism, or the wrong one."]]},{"name":"Uses only the given facts","levels":[[2,"Strong","Every statement rests on a given fact or is marked as an assumption."],[1,"Partial","Mostly given facts, but one invented or unmarked assumption."],[0,"Missing","Relies on facts the case does not give."]]},{"name":"Evidence another person can check","levels":[[2,"Strong","Names evidence a second engineer could inspect, and marks proposed tests as proposed."],[1,"Partial","Names evidence, but it is vague or its status is unclear."],[0,"Missing","Opinion or confidence instead of evidence."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"Claim: the dashboard shows each item with its source and timestamp and marks any feed older than its agreed interval. Given: it validates and displays; it cannot set update schedules. Proposed: a staleness check per feed. Nothing is promised about the agency's model.","why":"Names the mechanism (managerial independence), keeps to the given facts and proposes a checkable test."},"weak":{"text":"The dashboard guarantees all incidents are current and correctly classified.","why":"Promises what other owners control; no evidence."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":true},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms: validating feed shape only, or also monitoring each feed's content for sudden shifts and labelling it. Which one would you choose?","pair":"Ask your partner to argue for the mechanism you rejected. Name one trade-off and one thing both mechanisms share.","write":"Write why your mechanism supports your claim, and what you are still unsure of.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism affects your claim. Then name a shared cause, a mismatch or a limit outside its evidence.","answer":"Tie the chosen mechanism to the required property. Say what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. Shape validation cannot see a change in meaning. Monitoring distributions, for example the share of high-severity incidents, can flag a shift. It cannot prove which classification is right.","no":2,"at":"CHECK2","seconds":180,"ai":["think"],"minutes":3,"tier":"core","concept":"shape validation versus content monitoring","answerKey":"monitoring can flag a shift but not prove which classification is right","rubric":{"criteria":[{"name":"Links the mechanism to the property","levels":[[2,"Strong","Explains how the chosen mechanism affects the property at stake."],[1,"Partial","Names the mechanism without the link to the property."],[0,"Missing","No mechanism, or no property."]]},{"name":"Names a shared cause or limit","levels":[[2,"Strong","Names a specific shared cause, mismatch or limit that could defeat the mechanism."],[1,"Partial","Mentions a limit in general terms only."],[0,"Missing","Treats the mechanism as always enough."]]},{"name":"States the trade-off","levels":[[2,"Strong","Says what the alternative improves and what it costs."],[1,"Partial","Gives one side of the trade-off only."],[0,"Missing","No comparison with the alternative."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"Shape validation plus content monitoring, because the property is honest display and a model change alters meaning without altering shape. Its limit: a flagged shift shows that something changed, not which classification is right. It costs a baseline per feed.","why":"Links the mechanism to the property, names the limit and states the cost."},"weak":{"text":"Shape validation is enough; if the schema passes, the data is fine.","why":"Equates schema with meaning; no limit, no trade-off."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false},{"title":"Change the constraint; revise and own","think":"One feed moves to a slower update schedule while keeping the same interface shape. The same agency also changed its AI model version. The shape is unchanged, but incidents are now classified differently. Does your first decision still hold?","pair":"Explain what changes in your claim, your evidence or its scope.","write":"Record the new evidence and your revised decision with its limits. Say plainly what your first card got wrong. Name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your first answer. Name the changed assumption, the next evidence and the condition that would change your decision.","answer":"The new fact changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. Freshness and meaning both changed with no schema change. The dashboard must label what it cannot vouch for. It must agree with the agency how model changes are announced.","note":"Classroom version only. The assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"APPLY","seconds":180,"ai":["think"],"minutes":3,"tier":"core","concept":"revising after the twist","answerKey":"label what the dashboard cannot vouch for and agree how model changes are announced","rubric":{"criteria":[{"name":"Says what the new fact changes","levels":[[2,"Strong","Names the assumption the new fact breaks and what it leaves intact."],[1,"Partial","Notes the new fact without saying which assumption it breaks."],[0,"Missing","Ignores or restates the new fact."]]},{"name":"Revises with a reason","levels":[[2,"Strong","Keeps, changes or replaces the decision for a reason from the new fact. Says what the first answer got wrong."],[1,"Partial","Changes the decision without a clear reason, or hides the first answer."],[0,"Missing","Repeats the first answer unchanged."]]},{"name":"Names the owner and who is told","levels":[[2,"Strong","Names the role that decides and the people who must be informed."],[1,"Partial","Names one of the two."],[0,"Missing","Names neither the owner nor who is told."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"My first card assumed an unchanged shape meant unchanged meaning; it did not. Revise: show model version and freshness per feed, mark data since the change as unverified, and seek an announcement agreement. The dashboard owner decides; the agencies and the public are told.","why":"Names the broken assumption, revises with a reason, admits the first error, names owner and audience."},"weak":{"text":"Keep my promise as it is; the schema still validates.","why":"Ignores the meaning change; names nobody."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["DEPLOY"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["DEPLOY","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"SoS classification and independence","range":"15–20"},{"title":"Data feeds and architecture patterns","range":"48–53"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"SoS characteristics and complexity","start":3,"end":14,"units":["X01","X02","CHECK1"]},{"title":"Classification and reductionism","start":15,"end":26,"units":["X02A","X03","CHECK1"]},{"title":"Engineering, interfaces and deployment","start":27,"end":39,"units":["X04","X05","DEPLOY","CHECK2"]},{"title":"Testing and architecture principles","start":40,"end":47,"units":["X06","CHECK2","X09"]},{"title":"Data feeds, containers and trading","start":48,"end":63,"units":["X08","CONTAINER","TRADING"]}],"sourceCount":63,"original":"sources/Ch20-Original.pptx","textbook":"sources/Ch20-Textbook.pdf","bookPages":30,"quiz":[{"q":"In Sommerville’s definition, what makes a system a system of systems?","options":["It contains two or more independently managed elements","It has more than a set number of components","It is spread across several data centres"],"answer":0,"why":"A system of systems contains two or more independently managed elements; size or distribution alone does not make one.","concept":"definition of a system of systems","answerKey":"two or more independently managed elements"},{"q":"Owners join a voluntary governance body and implement its decisions in their own policies. Which class of SoS is this?","options":["Organizational (Maier: directed)","Federated (Maier: collaborative)","Coalition (Maier: virtual)"],"answer":1,"why":"Federated systems depend on a voluntary governance body of all owners. Coalitions have no formal governance. Organizational systems of systems are governed within one organisation.","concept":"federated classification","answerKey":"federated, Maier's collaborative","beyondCase":true},{"q":"Which reductionist assumption fails in a system of systems?","options":["That a system is made of parts with relationships","That interfaces between parts can be described","That one owner controls the system and resolves disputes"],"answer":2,"why":"Reductionism assumes a single controlling authority, rational technical decisions and clear boundaries. A system of systems has several owners, and decisions are often political.","concept":"failed reductionist assumption","answerKey":"one owner controls the system","beyondCase":true},{"q":"Why is testing a system of systems difficult?","options":["Constituent systems may change during testing, so tests may not be repeatable","Automated tests cannot be used when systems are distributed","Every constituent system must be frozen until testing ends"],"answer":0,"why":"There may be no detailed specification. Constituents may change during testing. Problems may need intermediate software rather than changes to a constituent.","concept":"difficulty of testing","answerKey":"constituents change during testing","beyondCase":true},{"q":"In which SoS pattern is there no principal system, with each participant publishing its own interface?","options":["Systems as data feeds","Trading systems","Systems in a container"],"answer":1,"why":"In a trading system of systems, processing can happen in any system and participants exchange information directly. Data feeds and containers both have a principal system.","concept":"trading pattern","answerKey":"trading systems have no principal system"}],"alignment":[{"objective":"Recognize operational and managerial independence.","evidence":"Explain and demonstrate: Recognize operational and managerial independence.","field":"FIT"},{"objective":"Classify SoS and explain three kinds of complexity.","evidence":"Explain and demonstrate: Classify SoS and explain three kinds of complexity.","field":"transfer question + BOUND"},{"objective":"Explain why reductionist assumptions can fail.","evidence":"Explain and demonstrate: Explain why reductionist assumptions can fail.","field":"source application + FIT"},{"objective":"Plan interfaces, staged deployment and cross-system tests.","evidence":"Explain and demonstrate: Plan interfaces, staged deployment and cross-system tests.","field":"INTEGRATE + EVIDENCE"},{"objective":"Compare data-feed, container and trading architectures.","evidence":"Explain and demonstrate: Compare data-feed, container and trading architectures.","field":"ACT + REFIT"}],"artifact":"Build an authority/participation map, interface/freshness contract and staged acceptance plan.","bridge":"Build an authority/participation map, interface/freshness contract and staged acceptance plan. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"DEPLOY","workload":"Consider cross-owner coordination and escalation when no person has complete system authority.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","X10":"X09"},"roadmap":{"question":"What can independent system owners promise together?","connection":"Independence creates complexity; classification exposes authority; engineering and architecture coordinate useful cooperation with limits.","inClass":"Map owners, interactions and staged service commitments.","deliverable":"An authority map and staged acceptance plan.","success":"Explain what remains outside the shared decision-maker’s control.","branches":[{"verb":"Understand the relationships","label":"System complexity","detail":"Technical · managerial · governance","target":"X02","units":["X01","X02"],"caseLens":"Which participants remain independently useful and independently managed?"},{"verb":"Locate authority","label":"SoS classification","detail":"Organizational · federated · coalition","target":"X02A","units":["X02A","CHECK1"],"caseLens":"What authority does the dashboard owner actually have over each feed?"},{"verb":"Question the assumptions","label":"Reductionism and complex systems","detail":"Independence · emergence · limits of decomposition","target":"X03","units":["X03"],"caseLens":"Why can local correctness fail to guarantee the shared dashboard promise?"},{"verb":"Coordinate change","label":"Systems of systems engineering","detail":"Interfaces · staged deployment · cross-system tests","target":"X04","units":["X04","X05","DEPLOY","X06","CHECK2"],"caseLens":"How do owners coordinate interfaces, staged changes, and cross-system tests?"},{"verb":"Structure cooperation","label":"Systems of systems architecture","detail":"Data feeds · virtual container · trading","target":"X09","units":["X09","X08","CONTAINER","TRADING","AISYS","APPLY"],"caseLens":"Which architecture pattern can keep service useful when a feed slows or changes?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"Same data format. New AI model. Different meaning. Who noticed?","aiAssignment":{"title":"City dispatch with three owners’ AI","scenario":"A city dashboard coordinates ambulances from three independent owners: two public hospitals and a private ambulance company. Each owner runs its own AI system to rank incoming calls by urgency. Each publishes its ranked queue to the dashboard.","facts":["The dashboard can read each queue but cannot change any owner’s model.","All three owners use the same interface format.","There is no agreement on how model changes are announced."],"question":"What can the city dashboard promise about urgency across owners, and what must be agreed between them?","stress":"The private company updates its AI to weight calls from contract customers more heavily. The interface is unchanged, so the dashboard shows those calls as more urgent than equivalent calls from others.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition, something you would see, that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage).","rubric":{"criteria":[{"name":"FIT","levels":[[1,"Strong","Names the chapter concept that decides the case and shows why it fits these facts."],[0.75,"Adequate","Names the right concept, with only a partial link to the facts."],[0.5,"Developing","Names a concept but does not connect it to the case."],[0,"Missing","No chapter concept, or the wrong one."]]},{"name":"BOUND","levels":[[1,"Strong","States an observable condition that would end the claim."],[0.75,"Adequate","Names a condition, but nobody could easily observe it."],[0.5,"Developing","Gives a vague limit, such as “if it fails”."],[0,"Missing","Gives no limit."]]},{"name":"ACT + EVIDENCE","levels":[[1,"Strong","One concrete action with an owner, and evidence another engineer could inspect even if the AI is wrong."],[0.75,"Adequate","A concrete action, but the evidence is weak or its status is unclear."],[0.5,"Developing","General advice, or evidence that relies on the AI's own output."],[0,"Missing","No action and no evidence."]]},{"name":"REFIT","levels":[[1,"Strong","Uses the new information, names the assumption it broke and justifies retain, revise or replace."],[0.75,"Adequate","Uses the new information but does not name the broken assumption."],[0.5,"Developing","Keeps or changes the answer without a reason."],[0,"Missing","Ignores the new information."]]},{"name":"OWNER + AI USE","levels":[[1,"Strong","Names the role that accepts the risk and who must be told. Declares any AI help and how it was checked."],[0.75,"Adequate","Names a role, but not who must be told, or the AI declaration is incomplete."],[0.5,"Developing","Names “the team” or “the system” as owner."],[0,"Missing","No owner and no AI declaration."]]}],"marks":"Practice only · not graded · score yourself 1, 0.75, 0.5 or 0 per criterion","strong":{"text":"The dashboard can promise only what it observes: each owner's queue, its time and its declared model version. It must not merge the rankings. The promise ends if one owner's share of urgent calls shifts without notice. Action: the city lead seeks an agreement to announce model changes. Evidence: a per-owner baseline with a drift alert, proposed. After the weighting change I replace the merged list with per-owner queues.","why":"Separates what the dashboard controls from what it receives, names an observable limit, an owner and evidence, and revises."},"weak":{"text":"The dashboard is in charge, so it sorts all calls by urgency score.","why":"Assumes scores mean the same across owners and that display gives authority."},"other":"they use a chapter concept, rest on the given facts and name evidence someone else can check. A different verdict that meets these conditions is as strong as the strong example."}},"cs2023":[["SE-Teamwork","Teamwork","Interfacing with stakeholders outside the team."],["SE-Refactoring","Refactoring and Code Evolution","Compatibility with consumers you cannot see or control."],["SE-Design","Software Design","Identifying component boundaries and dependencies."],["SEP","Society, Ethics, and the Profession","Public impact and accountability across independent owners."]],"lectureMinutes":50,"budgetShare":0.85,"timeRule":"If the lecture runs over time, drop optional slides first, in reverse order, then the optional extras. Never drop a think point (checkpoint, station or Your call) and never drop the assumption-change slide. Station and vote minutes are separate from slide minutes: a checkpoint slide keeps 1 minute to show its question, and its station adds 3 minutes. Say which optional slide was dropped and point students to its full explanation.","glossary":[{"term":"claim","short":"a statement you say is true and can defend with evidence","ar":"ادعاء"},{"term":"system of systems","short":"a system that contains two or more independently managed elements","ar":"نظام الأنظمة"},{"term":"constituent","short":"one of the independently managed systems inside a system of systems","ar":"نظام مكوِّن"},{"term":"operational independence","short":"each constituent stays useful as a system on its own","ar":"الاستقلال التشغيلي"},{"term":"managerial independence","short":"each constituent's owner keeps the authority to decide about it","ar":"الاستقلال الإداري"},{"term":"governance","short":"the policies and decision structures that constrain the managers of the constituents","ar":"الحوكمة"},{"term":"federated","short":"a system of systems governed by a voluntary body in which every owner is represented","ar":"اتحادي"},{"term":"coalition","short":"a system of systems with no formal governance, where owners collaborate informally","ar":"ائتلاف"},{"term":"reductionism","short":"the assumption that the whole can be understood from its parts, one owner and clear boundaries","ar":"الاختزالية"},{"term":"principal system","short":"the system that queries or hosts the others in a data-feed or container pattern","ar":"النظام الرئيس"},{"term":"data feed","short":"a system that supplies data to a principal system on request","ar":"تغذية بيانات"},{"term":"container","short":"a pattern in which one system offers common services such as sign-in and storage to approved systems","ar":"حاوية"},{"term":"trading","short":"a pattern with no principal system, in which participants exchange information directly","ar":"تبادل تجاري"},{"term":"model version","short":"the identifier of the AI model a producer used; a change can alter meaning without changing the data shape","ar":"إصدار النموذج","added":true}],"transfer":{"title":"Transfer case · the textbook's iLearn digital learning environment","text":"The textbook's iLearn system is a national initiative for schools. To create a digital learning environment, it must integrate with each local authority's network management and school administration systems. There is no common governance process across the authorities. This is a different system from the incident dashboard.","source":"Source slide 19 (iLearn as a system of systems)","fictional":false,"question":"Which class of system of systems is iLearn, and why?","answer":"A coalition, Maier's virtual class. No formal governance body spans the authorities. Each manages its own systems and collaborates informally. Its technical complexity is modest, but its governance complexity is high.","concept":"classifying a system of systems by governance","answerKey":"a coalition, because no shared governance exists","at":"X02A"},"studyList":[{"topic":"Systems of systems: definition, examples and essential characteristics","sources":[3,4,5,13],"book":{"page":5,"label":"20.1"},"note":"The five characteristics and why independent management is the test."},{"topic":"Technical, managerial and governance complexity","sources":[7,9,11,12,14],"book":{"page":5,"label":"20.1"},"note":"Static versus dynamic relationships; why complexity drives project failure."},{"topic":"Classification of systems of systems and the iLearn example","sources":[16,17,18,19],"book":{"page":8,"label":"20.2"},"note":"Required reading for 15–20. Map Maier's names to the chapter's names."},{"topic":"Reductionism, its assumptions and software systems of systems","sources":[21,22,23,24,25,26],"book":{"page":11,"label":"20.3"},"note":"The three reductionist assumptions and why each fails."},{"topic":"Systems of systems engineering: problems, processes and interfaces","sources":[28,30,31,32,33,34,35,36],"book":{"page":14,"label":"20.4"},"note":"The five activities; service interfaces versus a unified user interface."},{"topic":"Integration, deployment and testing","sources":[37,38,39,40,41],"book":{"page":18,"label":"20.4.2"},"note":"Staged deployment of iLearn; why testing borrows agile practices."},{"topic":"Architecture principles, frameworks and TOGAF","sources":[43,44,45,46,47],"book":{"page":20,"label":"20.5"},"note":"The seven principles; what a framework can and cannot provide."},{"topic":"Architectural patterns: data feeds, containers and trading","sources":[48,49,51,53,55,57,58,60],"book":{"page":23,"label":"20.5.1"},"note":"Required reading for 48–53. Know which pattern has a principal system and which has governance."}],"activities":[{"id":"VOTE2","label":"Class vote · Act 2","at":"CHECK1","minutes":3,"tier":"core"},{"id":"VOTE4","label":"Class vote · Act 4","at":"CHECK2","minutes":3,"tier":"core"},{"id":"EXTRAS","label":"Optional extras · real case, live lab and explain-it","at":"APPLY","minutes":7,"tier":"optional"}],"coverage":[{"cls":"no","reason":"Title slide of the source pack","n":1,"title":"Chapter 20 – Systems of Systems"},{"cls":"no","reason":"Agenda slide; its topics are the chapter map","n":2,"title":"Topics covered"},{"cls":"slide","unit":"X01","n":3,"title":"Systems of systems"},{"cls":"full","unit":"X01","n":4,"title":"Examples of systems of systems"},{"cls":"slide","unit":"X01","n":5,"title":"Essential characteristics of SoS"},{"cls":"slide","unit":"X02","n":6,"title":"System complexity"},{"cls":"full","unit":"X02","n":7,"title":"Complexity"},{"cls":"slide","unit":"X02","n":8,"title":"Simple and complex systems"},{"cls":"full","unit":"X02","n":9,"title":"Process complexity"},{"cls":"slide","unit":"X02","n":10,"title":"System production and management processes"},{"cls":"full","unit":"X02","n":11,"title":"Complexity and software engineering"},{"cls":"slide","unit":"X02","n":12,"title":"Types of complexity"},{"cls":"slide","unit":"X01","n":13,"title":"System characteristics and complexity"},{"cls":"full","unit":"X02","n":14,"title":"Complexity and project failure"},{"cls":"slide","unit":"X02A","kind":"title","n":15,"title":"Systems of systems classification"},{"cls":"slide","unit":"X02A","kind":"list","items":["Directed SoS","Collaborative SoS","Virtual systems"],"n":16,"title":"Maier’s classification of systems of systems"},{"cls":"slide","unit":"X02A","kind":"list","items":["Organizational systems of systems","Federated systems","System of system coalitions"],"n":17,"title":"More intuitive classification terms"},{"cls":"slide","unit":"X02A","kind":"figure","n":18,"title":"System of systems classification"},{"cls":"slide","unit":"X02A","kind":"prose","items":["iLearn is a relatively simple technical system but it has a high level of governance complexity.","The development of a digital learning system is a national initiative but to create a digital learning environment, it has to be integrated with network management and school administration systems.","There is no common governance process across authorities so, according to the classifica
