ls, owner and evolution.", "txt": "The example is in the chapter precisely because the constituents are independent. Police, ambulance, fire and coastguard each have their own command, their own systems and their own policies. The SoS does not remove that independence &mdash; it integrates around it.", "src": "P1 · p.4 · p.5"}]}, {"t": "wide", "c": "violet", "lab": "THE QUESTION FOR TONIGHT", "lead": "Tonight&rsquo;s SoS is the source example plus a hospital. What does the source lesson say about the hospital?", "field": {"id": "source_lesson", "core": false, "rows": 3, "ph": "What does the source example imply about how the hospital should have been integrated?"}}, {"t": "principle", "txt": "The source example is not a generic SoS. It is tonight&rsquo;s SoS minus the hospital."}], "timebox": "3 min", "task": "Name one element of the source example that tonight&rsquo;s architects should have copied, and what it would have prevented.", "notes": "Three minutes. The point is not that the source example is identical &mdash; it is that the chapter already names the independence lesson in the same domain. The architects who skipped governance discovery skipped a lesson the chapter states in its first worked example. Make the room say which element of the source example they should have copied.", "appendix": true, "_iscarbRule": "RULE 08 - 60-second source case", "route": "toolkit"}, {"k": "R18", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Name the seven SoS architecture principles and identify which one tonight&rsquo;s failure violated.", "title": "Seven principles the architecture should keep", "sub": "SoS architecture is not only patterns. The chapter names seven principles that guide the design of an SoS architecture.", "blocks": [{"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.20 &mdash; the seven principles", "items": [{"c": "teal", "lab": "1 · DELIVER VALUE IF INCOMPLETE", "lead": "The SoS must be useful even when incomplete.", "txt": "An SoS is never finished. Deliver value at each stage, even when some constituents are missing or some interfaces are stubs.", "src": "P1 · p.42"}, {"c": "teal", "lab": "2 · BE REALISTIC ABOUT CONTROL", "lead": "You do not control the constituents.", "txt": "Design for the control you actually have. Do not assume you can command a constituent to change. Plan for negotiation.", "src": "P1 · p.43"}, {"c": "teal", "lab": "3 · FOCUS ON INTERFACES", "lead": "The interface is the architecture.", "txt": "Spend design effort on the interfaces between constituents, not on the internals you do not own.", "src": "P1 · p.44"}, {"c": "teal", "lab": "4 · COLLABORATION INCENTIVES", "lead": "Each constituent needs a reason to participate.", "txt": "Design the SoS so each constituent gains from participating, or they will quietly withdraw.", "src": "P1 · p.45"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "applied to tonight&rsquo;s case", "items": [{"c": "sand", "lab": "5 · NODE-AND-WEB", "lead": "Nodes connected by a web of services.", "txt": "Model the SoS as nodes connected by services. The web, not the nodes, is where the SoS behaviour lives.", "src": "P1 · p.46"}, {"c": "sand", "lab": "6 · SERVICES BETWEEN NODES", "lead": "Services, not data, provide integration.", "txt": "Integrate through services, not shared databases. A service hides the constituent&rsquo;s internals.", "src": "P1 · p.47"}, {"c": "sand", "lab": "7 · MANAGE VULNERABILITIES", "lead": "Identify and manage the points of failure.", "txt": "Identify the points at which a constituent can disrupt the SoS, and manage them actively.", "src": "P1 · p.47"}]}}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S FAILURE &mdash; WHICH PRINCIPLE DID IT VIOLATE?", "lead": "The architects assumed they could command the hospital, and never identified the consent policy. That is two principles broken.", "txt": "The SoS architects treated Mentcare as a subcomponent they could command (principle 2 &mdash; be realistic about control) and never identified the consent policy as a vulnerability (principle 7 &mdash; manage vulnerabilities). Two principles, one silent refusal, one ambulance dispatched blind. Pick any one of the seven and ask which design decision tonight violates it &mdash; the answer is the design change.", "field": {"id": "guideline", "core": false, "rows": 2, "ph": "Which principle did tonight&rsquo;s failure violate, and what design change enforces it?"}}, {"t": "principle", "txt": "The seven principles are not aspirational. They are the lessons of SoS failures."}], "timebox": "2 min", "task": "Name the principle tonight&rsquo;s SoS violated, and the design change that would have enforced it.", "notes": "Two minutes. The seven principles are not equal: be realistic about control (2) and manage vulnerabilities (7) are the two that tonight&rsquo;s failure violated. Spend the time on those two, not on a tour of all seven. The magenta card is the bridge from principle to design &mdash; make every student name a specific design decision that violates a specific principle. A student who says &ldquo;we should test more&rdquo; has not answered; push for which of the seven.", "appendix": true, "_iscarbRule": "RULE 18 - SoS architecture principles", "route": "toolkit"}, {"k": "R09", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Explain how a service broker enforces governance, and what it must do when enforcement fails.", "title": "A broker that enforces governance &mdash; visibly", "sub": "A service broker is where the SoS enforces each constituent&rsquo;s governance policy. The enforcement is only useful if the operator can see it.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE PATTERN", "lead": "Broker routes, transforms and policy-checks every cross-SoS call.", "txt": "Every cross-SoS call goes through the broker. The broker enforces each constituent&rsquo;s governance policy at the interface: consent checks, data-redaction rules, audit logs. The constituent&rsquo;s internals stay hidden.", "src": "P1 · p.36"}, {"c": "sand", "lab": "WHAT IT REQUIRES", "lead": "Structured refusals with reasons the operator can act on.", "txt": "When the broker refuses a call &mdash; consent denied, policy conflict &mdash; it must return a structured refusal with a reason. Tonight the broker returned no data, which the UI displayed as a blank. The operator could not tell a refusal from a missing record.", "src": "P1 · p.37"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S BROKER", "lead": "A broker that refuses silently is enforcement without visibility.", "txt": "Tonight&rsquo;s broker enforced the hospital&rsquo;s consent policy correctly &mdash; by returning no data. The failure was not in the enforcement; it was in the visibility. The dispatcher saw a blank and assumed no record existed, when in fact a record existed and was being withheld. A structured refusal would have let the dispatcher call the hospital directly.", "field": {"id": "broker_visibility", "core": false, "rows": 3, "ph": "For your verdict: what should the broker return when it refuses, and what should the UI show?"}}, {"t": "principle", "txt": "Governance enforcement without visibility is just a silent failure with a policy excuse."}], "timebox": "2 min", "task": "Sketch the refusal-with-reason interface tonight&rsquo;s broker should have returned. Name what the UI should have shown.", "notes": "Two minutes. The trap is the broker that enforces governance silently. Enforcement is necessary but not sufficient: the operator has to see the refusal and why, or the enforcement reads as a failure. The design change is an interface contract that returns a structured refusal with a reason code and a fallback action.", "appendix": true, "_iscarbRule": "RULE 09 - Service broker architecture", "route": "toolkit"}, {"k": "R10", "loadOk": "The 3x3 matrix and two fields describe one SoS-governance-risk triage record. Students classify three risks and specify one monitor and one identification tool. Shorten the activity at this cut point; never squeeze the content into a fixed height.", "answer": "Place, for example, an undiscovered hospital governance policy, a constituent system evolving on its own schedule, and a silent refusal path in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity (refusal rate per thousand cross-SoS calls), observation window (next 30 days of broker logs), trigger value (refusal rate above 1%), named owner (on-call SoS architect) and fallback action (alert the constituent owner and pause the integration). A governance discovery template can identify the policy vulnerability; retain its results as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it on a governance matrix.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure about the hospital&rsquo;s policy&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact you can hand to a reviewer &mdash; e.g. the broker log showing a silent refusal at 23:18."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Not everything unknown matters &mdash; only what could change the verdict. Tonight&rsquo;s gap: every constituent&rsquo;s governance policy on sharing data externally."}, {"c": "violet", "lab": "MONITORED", "txt": "An unknown with a measured quantity, observation window, trigger value, named owner and fallback action. The unknown becomes a risk on a schedule."}]}]}, {"t": "wide", "c": "sand", "lab": "PLACE TONIGHT&rsquo;S RISKS ON THE MATRIX", "picker": {"g": "risk3", "options": ["Hospital governance policy", "Constituent evolving silently", "Silent refusal path", "Consent state mismatch"]}, "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a governance risk with a discovery template, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; Jahiziah GKU 2, Topic 4", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "Name a tool that identifies a governance vulnerability, and the artifact it leaves"}}, {"t": "principle", "txt": "An unknown becomes a risk only when it has a trigger, an owner and a fallback. Until then it is a guess."}], "timebox": "3 min", "task": "Place three of tonight&rsquo;s risks on the matrix, then write one monitor and one identification tool.", "notes": "Three minutes. The matrix is the same one as Rule 10 in earlier chapters &mdash; the engine renders it. What changes tonight is the kind of risk: governance risks are harder to identify than technical risks, because they live in documents the SoS engineer does not own. Push the room toward a discovery template as the identification tool. This is a designated cut point: if behind, place one risk and write one monitor; the matrix is the artifact, not the slide.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the SoS architect who claims, the evidence owner who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "SoS governance claims fail not because nobody integrated &mdash; but because the governance discovery has no owner able to defend it.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · OWNER", "lead": "The SoS architect who decides.", "txt": "Names the verdict and the pattern. Owns the consequence. The on-call SoS architect tonight &mdash; not the integration developer, not the hospital administrator, not the AI."}, {"c": "sand", "lab": "2 · EVIDENCE OWNER", "lead": "The engineer who maintains the discovery record.", "txt": "Maintains the inspectable artifact: the governance discovery record, the broker logs, the refusal-path tests, the dated discovery drills. Cannot be the same person as the owner."}, {"c": "mag", "lab": "3 · SIGN-OFF", "lead": "The authority who accepts the residual integration risk.", "txt": "The hospital&rsquo;s data governance committee and the ambulance service&rsquo;s operations authority, jointly. Accept the bounded residual risk on the evidence the owner and evidence owner produced."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S GAP", "lead": "A silent refusal at 23:18, no governance discovery, one integration developer signing off their own broker.", "txt": "The SoS integration went live with one developer&rsquo;s signature on a broker test that did not exercise the consent-refusal path. That is owner, evidence owner and sign-off collapsed into a single person &mdash; which is why the claim could not be audited when the failure arrived. The fix is not more testing; it is the separation above.", "field": {"id": "accountability", "core": false, "rows": 2, "ph": "For your verdict: who is the owner, who is the evidence owner, and who signs off?"}}, {"t": "principle", "txt": "Owner &ne; evidence owner &ne; sign-off. Three roles, three people."}], "timebox": "2 min", "task": "For the verdict you signed at Rule 07: name the owner, the evidence owner, and the sign-off authority.", "notes": "Two minutes. The accountability trio is the rule most assignments miss &mdash; not because students cannot name the roles, but because the same person fills all three on their project. Make every student name three different people tonight; if they cannot, the verdict is not yet dependable.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about an SoS in the section of the source that answers it.", "title": "What Chapter 20 trains you to do", "sub": "Five questions the SoS cannot answer tonight. Each one is a section of the chapter &mdash; and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "SOS AND COMPLEXITY", "txt": "What is an SoS, and why is it hard?", "src": "P1 · p.3"}, {"c": "sand", "lab": "SOS CLASSIFICATION", "txt": "Directed, collaborative, virtual &mdash; and the intuitive scheme.", "src": "P1 · p.15"}, {"c": "teal", "lab": "REDUCTIONISM", "txt": "Why does classical engineering break?", "src": "P1 · p.20"}, {"c": "sand", "lab": "SOS ENGINEERING", "txt": "Problems, process, interfaces, testing.", "src": "P1 · p.27"}, {"c": "teal", "lab": "SOS ARCHITECTURE", "txt": "Principles, TOGAF, and the patterns.", "src": "P1 · p.42"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Ninety seconds, two answers, no more. Most students pick architecture because it sounds hardest; the chapter&rsquo;s own answer is reductionism. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition &mdash; and every one of these is something you will do to the SoS in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Identify the seven SoS essential characteristics and classify an SoS by Maier&rsquo;s and intuitive schemes."}, {"c": "teal", "lab": "2", "txt": "Explain why reductionism fails for SoS and name the engineering problems that result."}, {"c": "teal", "lab": "3", "txt": "Design an SoS architecture using the development process, interface development and architectural patterns."}, {"c": "mag", "lab": "4", "txt": "Build a bounded verdict with inspectable SoS governance evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when a constituent system&rsquo;s governance policy changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone &mdash; the artifact every other outcome feeds. Colouring all five differently made them read as five unrelated topics.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: the SoS architects accepted an attractive integration without a governance discovery record. JUDGMENT then fails because the team cannot show what supports the integration or what would reverse it.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing an SoS failure from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Classify the SoS.", "src": "Rule 05 · X02A"}, {"c": "mag", "lab": "", "txt": "Accept, hold, or revert the integration.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Discover governance, not assume it.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the failure up the constituent stack.", "src": "X02"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A patient bears what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them, so the eye pairs each card with its capability. Recolouring them breaks the pairing, which is the only reason the diagram is there.", "task": "Which capability fails first when a team trusts an attractive integration without a governance discovery record?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE &mdash; an attractive integration fails not because nobody analysed it but because nobody made it inspectable with a policy record attached. Do not give the answer; let two students argue it for thirty seconds.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: managerial independence is the promise to the architect. It holds only if every constituent system has a discoverable owner with a discoverable policy, AND nobody discovered the hospital's governance policy. The prediction is bounded by the missing discovery, not by the integration design.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which SoS characteristic fails first tonight?", "picker": {"g": "predict", "options": ["Operational independence", "Managerial independence", "Evolutionary development", "Emergence"]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. hospital governance policy, independent ownership, evolving interfaces"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment SoS, not from tonight:</i> &ldquo;This holds only if every constituent bank&rsquo;s fraud policy has been discovered and respected. If it has not, the broker is the thing that fails, not the integration &mdash; and nobody mapped the policies.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unmeasured</b>."}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the seven characteristic names &mdash; you have not met them yet. Start from the room. The ambulance was dispatched blind at 23:18 because the broker returned no data. Ask what the SoS assumes about each constituent, and which assumption broke first tonight. Then say which characteristic that assumption belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;. If you cannot finish it, the box that is actually empty is CONSTRAINT: name what stops you choosing differently tonight.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move; splitting them across two slides would let a student predict without deriving, which is the failure this rule exists to prevent.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes; one colour makes it read as four parallel boxes rather than four steps.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Three minutes. The DERIVE box is the one students skip &mdash; walk the room and refuse an empty one. This whole rule collapses if you reveal the source figure first; the reveal is the next slide and not a second earlier.", "appendix": true, "route": "toolkit"}, {"k": "H01", "noAnswer": true, "rule": "HELPER - while DERIVE needs development", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a blank derivation into a question they can answer, by starting from the situation rather than the vocabulary.", "showIf": {"thin": ["f:p_derive"], "minKey": "coachDeep"}, "title": "Three questions instead of the answer", "sub": "This slide is here because your derivation box is still blank, or holds a single clause. It does not contain the answer &mdash; the reveal is the next slide and it is worth more to you if you commit first.", "badge": {"c": "", "t": "SCAFFOLD", "s": "appears only if you need it"}, "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 &nbsp; WHAT IS PROMISED", "lead": "Which promise to the architect breaks first tonight?", "txt": "An SoS promises the architect that every constituent will behave as expected under the agreed interface. Say which of those promises tonight&rsquo;s silent broker threatens first &mdash; and you have named the characteristic without needing its textbook name."}, {"c": "sand", "lab": "2 &nbsp; WHO IS AWAKE", "lead": "A constituent that depends on someone discovering behaves differently under pressure.", "txt": "It is 23:18 and an ambulance is being dispatched. The broker returned no data. Ask what that tells you about how the integration&rsquo;s assumptions were <i>discovered</i>, not about how the broker is built."}, {"c": "mag", "lab": "3 &nbsp; WHAT WOULD CHANGE YOUR MIND", "lead": "Finish the sentence &ldquo;I would drop this if I saw &hellip;&rdquo;.", "txt": "Finish this sentence: &ldquo;I would drop this prediction if I saw &hellip;&rdquo;. Whatever you put after &ldquo;if I saw&rdquo; is your constraint, and the reason it holds is your derivation. Write that sentence in the boxes on the previous slide."}]}, {"t": "principle", "c": "mag", "txt": "A blank box is not a gap in knowledge. It is usually a question asked at the wrong altitude."}], "timebox": "90 sec", "task": "Answer any one of the three out loud, then press &larr; and finish DERIVE properly. This slide stops appearing once DERIVE meets the shared scaffolding threshold; the instructor still checks the reasoning.", "notes": "You will usually not see this slide at all &mdash; it renders while DERIVE falls below the same scaffolding threshold used by the R05 coach, so it is the engine noticing that the room is stuck rather than you deciding in advance that it will be. Do not read all three questions aloud. Pick the one that matches what you saw while walking the room: question 1 for students who cannot start, question 2 for students who have written a characteristic name with no reasoning under it, question 3 for students who wrote a confident sentence with nothing that could falsify it. Ninety seconds, then send them back. If you are behind, skip it and walk the room instead &mdash; the questions work spoken.", "appendix": true, "route": "toolkit"}, {"k": "QA1", "noAnswer": true, "rule": "RETRIEVAL LOOP - Understand", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the phase&rsquo;s load-bearing moves from memory: the evidence request, the chapter&rsquo;s five questions, the outcome currency and the four parts of the prediction gate.", "title": "Sixty seconds on Understand", "sub": "Before the source expansion opens: four questions, memory first. Reveal only to check, then score yourself honestly.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 01 &middot; 02 &middot; 03 &middot; 05", "items": [{"q": "It is 23:18 and the ambulance was dispatched with no Mentcare data. Name the one evidence request that separates a real integration failure from a single transient outage.", "a": "A governance discovery record for every constituent system &mdash; naming each system&rsquo;s owner, its data-sharing policies and the conditions under which they apply. Until it exists the decision stays bounded: hold or revert, with a named owner and a condition for resuming automatic data flow."}, {"q": "Chapter 20 trains you to answer five questions about any SoS. Say any four.", "a": "What is an SoS, and why is it hard (SoS and complexity)? Directed, collaborative, virtual &mdash; and the intuitive scheme (SoS classification)? Why does classical engineering break (reductionism)? Problems, process, interfaces, testing (SoS engineering)? Principles, TOGAF, and the patterns (SoS architecture)?"}, {"q": "All five outcomes of this hour end in the same currency. What is it?", "a": "Evidence, not recognition &mdash; and outcome 4 is the one the others feed: a bounded verdict with inspectable SoS governance evidence."}, {"q": "The prediction gate makes you commit to four things before the reveal. Name all four.", "a": "PREDICT the characteristic &middot; state the CONSTRAINT &middot; DERIVE it from first principles &middot; NAME the principle used &mdash; then sign, so the reveal costs something."}]}], "timebox": "60 sec", "task": "Cover the answers. Say all four out loud from memory before you reveal anything &mdash; then score yourself honestly.", "notes": "Sixty seconds on the ring, and hold the discipline that makes retrieval work: the answer must come from memory, spoken or written, before any reveal. The four questions are the phase&rsquo;s load-bearing moves, not a quiz &mdash; a miss on question 1 means Rule 01 needs one more pass before the source expansion assumes it. The self-score is private and deliberately blunt: two honest misses beat four nodding yeses, and saying that once out loud is what makes the scoring honest.", "appendix": true, "route": "toolkit"}, {"k": "QA2", "noAnswer": true, "rule": "RETRIEVAL LOOP - Source", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the SoS definition, the seven characteristics, the three complexity types and the two classification schemes.", "title": "Sixty seconds on the source foundations", "sub": "Checkpoint before the rest of Chapter 20: four questions from the first source cluster &mdash; memory first, reveal second.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "X01 &middot; X02 &middot; X02A &middot; X07", "items": [{"q": "Define a system of systems, and name the property that distinguishes it from a distributed system.", "a": "A system containing two or more <b>independently managed</b> elements, with no single overall manager. Managerial independence &mdash; not the count of systems &mdash; is what makes an SoS. A system with one owner and a shared database is a distributed system, not an SoS."}, {"q": "Name the seven essential characteristics of an SoS.", "a": "Operational independence, managerial independence, evolutionary development, emergence, geographic distribution, data-intensive, and heterogeneity (p.5-7)."}, {"q": "What are the three complexity types of an SoS, and where do most project failures live?", "a": "<b>Technical</b> complexity (number and variety of constituents), <b>managerial</b> complexity (number of independent managers), and <b>governance</b> complexity (overlapping and conflicting policies). Most project failures live in governance complexity."}, {"q": "Give Maier&rsquo;s classification and the intuitive classification of SoS. Which two labels fit tonight?", "a": "Maier: <b>directed</b> (central authority), <b>collaborative</b> (voluntary partnership toward central goals), <b>virtual</b> (no central authority). Intuitive: <b>organizational</b> (one organization), <b>federated</b> (stable cross-org governance), <b>coalition</b> (ad-hoc mission partnership). Tonight is collaborative / coalition."}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop, now over the first source cluster. Question 4 is the one that pays all semester &mdash; the classification shapes what governance discovery means. If the room misses question 1, do not reteach it here: name it, and let the principle line on X01 do the work on the next pass. Sixty seconds, then move.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: the regional emergency SoS goes live with no governance discovery. CRISIS: ambulance dispatched with no patient information. MAP: Mentcare, broker, dispatch, hospital governance, ambulance crew, regulator. TRADE-OFF: revert removes the integration but leaves dispatch blind in the old way; continue risks another silent refusal under a different consent state. EVIDENCE: governance discovery record, broker logs, the consent-refusal path test. VERDICT: hold the integration, with redeployment conditional on a discovery record and a refusal-with-reason interface.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source concepts into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies concepts; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "Ambulance dispatched blind at 23:18 during a mental-health crisis."}, {"c": "teal", "lab": "2 MAP", "txt": "Mentcare, broker, dispatch, hospital governance, ambulance crew, regulator."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Revert leaves dispatch blind the old way; continue risks another silent refusal."}, {"c": "violet", "lab": "4 EVIDENCE", "txt": "Governance discovery record, broker logs, refusal-with-reason test."}, {"c": "green", "lab": "5 VERDICT", "txt": "Continue, hold, or revert &mdash; bounded, with a monitor."}]}, {"t": "principle", "txt": "Predict -&gt; Constraint -&gt; Derive -&gt; Name"}], "timebox": "2 min", "hueOk": "CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide and in every later reference. This is the one place the palette is a vocabulary.", "task": "Run tonight&rsquo;s case through the five steps in one sentence each.", "notes": "Two minutes. The slide exists so the room can hear the flow once before they have to live in it. The most common mistake is to stop at EVIDENCE without a VERDICT &mdash; an evidence list with no decision attached is exactly the unbounded claim Rule 04 refuses.", "appendix": true, "route": "toolkit"}, {"k": "R07", "loadOk": "The decision card has six named slots plus an evidence policy line and an inspectable artifact preview. Students fill all six from tonight's SoS and cite a source page on each. Use vertical scrolling for the artifact preview; do not split slots across slides.", "answer": "Example verdict: HOLD the regional emergency SoS integration tonight under the on-call SoS architect. EVIDENCE: the broker log shows a silent refusal on the Mentcare call at 23:18; no governance discovery record exists. COUNTER-EVIDENCE: the integration has routed 1,247 non-mental-health calls successfully in the prior 30 days, so the failure is policy-specific not systemic. UNCERTAINTY: the consent-refusal path was never tested, so silent refusals under other consent states cannot be ruled out. VERDICT: hold, with redeployment conditional on a governance discovery record, a refusal-with-reason interface, and a refusal-path test signed by the hospital and the ambulance service.", "rule": "RULE 07 - Decision card", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Build the artifact a stranger could audit: claim, evidence, warrant, counter-evidence, uncertainty, verdict.", "title": "Your minimum inspectable artifact", "sub": "The decision card is what Assignment 1 asks for. Six slots, one signature, one evidence policy. Everything else tonight feeds this.", "blocks": [{"t": "wide", "c": "mag", "lab": "CLAIM", "lead": "State the verdict in one sentence.", "field": {"id": "dc_claim", "core": true, "rows": 2, "ph": "Continue, hold, or revert the SoS integration tonight"}}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE", "field": {"id": "dc_evidence", "core": true, "rows": 3, "ph": "What supports the claim? Cite a source page (Ch.20 p.X) or a measurement"}}, {"c": "teal", "lab": "WARRANT", "field": {"id": "dc_warrant", "core": true, "rows": 3, "ph": "Why does the evidence support the claim? Name the principle or pattern"}}, {"c": "sand", "lab": "COUNTER-EVIDENCE", "field": {"id": "dc_counter", "core": true, "rows": 3, "ph": "What would the other side cite against this verdict?"}}, {"c": "mag", "lab": "UNCERTAINTY", "field": {"id": "dc_uncert", "core": true, "rows": 3, "ph": "What is unmeasured, assumed, or could change overnight?"}}, {"c": "green", "lab": "VERDICT", "field": {"id": "dc_verdict", "core": true, "rows": 2, "ph": "The bounded decision, the owner, the monitor, the condition to revisit"}}]}, {"t": "sign", "id": "r07_card", "fields": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_uncert", "f:dc_verdict"], "label": "I sign this verdict", "before": "Sign once all six slots carry something inspectable.", "ready": "Ready to sign.", "warn": "Signing freezes the six slots for the rest of the hour. The defense at Rule 17 changes them in a <i>later</i> box.", "done": "Read-only from here. The card you defend at Rule 17 is the one you signed here."}, {"t": "principle", "txt": "A defensible verdict names what supports it, what would reverse it, what is uncertain, and who owns it."}], "timebox": "4 min", "hueOk": "CLAIM, EVIDENCE, WARRANT, COUNTER-EVIDENCE, UNCERTAINTY, VERDICT each carry their own colour so a student can locate the same slot on the card, the rubric and the defense slide. The card is the only artifact graded tonight.", "task": "Fill all six slots from tonight&rsquo;s SoS, then sign. The card is what Assignment 1 asks for. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes. Walk the room. The slot students skip is COUNTER-EVIDENCE: they cannot name what would reverse their own verdict, which means the verdict is not yet defensible. The signature freezes the six boxes; that is what makes Rule 17 a real defense rather than a second draft.", "appendix": true, "route": "toolkit"}, {"k": "QA3", "noAnswer": true, "rule": "RETRIEVAL LOOP - Application", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Recall the decision card slots, the broker pattern, the falsifiability question and the monitor shape.", "title": "Sixty seconds on the decision flow", "sub": "Application checkpoint: recall the artifact you have built so far before transfer and defense continue.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 07 &middot; 09 &middot; 10 &middot; X05", "items": [{"q": "The decision card has six slots. Name them in order.", "a": "CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &mdash; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it."}, {"q": "A broker that enforces the hospital&rsquo;s governance policy by silently returning no data has made which mistake?", "a": "It has enforcement without visibility &mdash; the operator cannot tell a refusal from a missing record. Enforcement at the interface is necessary but not sufficient; the broker must return a structured refusal with a reason."}, {"q": "What must a claim state so the evidence can prove it wrong?", "a": "The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending."}, {"q": "Turn &ldquo;we are not sure about the hospital&rsquo;s policy&rdquo; into a monitor.", "a": "A measured quantity (refusal rate per thousand cross-SoS calls), an observation window (next 30 days of broker logs), a trigger value (above 1%), a named owner (on-call SoS architect) and a fallback action (pause the integration) &mdash; the unknown becomes a monitored risk, and the 3&times;3 grid was only its evaluate step."}]}], "timebox": "60 sec", "task": "Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.", "notes": "The practise loop points at the artifact, not at trivia: every question here is a slot or a standard the decision card must carry. Question 2 is the one to watch &mdash; a broker with enforcement without visibility is the false security that Rule 09 exists to refuse. If a student cannot name all six slots, the card they will defend at Rule 17 is missing walls; send them to C for ninety seconds, not to the slides.", "appendix": true, "route": "toolkit"}, {"k": "R11", "rule": "RULE 11 - Micro-case -> local case", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Reuse one governance-discovery-boundary chain in a different SoS, and say what transfers and what breaks.", "title": "Scaffold first, then transfer", "sub": "Use the same governance-discovery-boundary chain twice &mdash; and the second time in a different SoS.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MICRO-CASE &mdash; ISCARB SCAFFOLD", "txt": "Tonight&rsquo;s SoS integrated Mentcare without discovering the hospital&rsquo;s consent policy. Which governance discovery deliverable should have existed, and what would have blocked the integration from going live?", "field": {"id": "micro", "core": false, "rows": 3, "ph": "The deliverable, and the governance boundary you would need"}}, {"c": "mag", "lab": "TRANSFER &mdash; THE ILEARN CASE", "txt": "The chapter&rsquo;s iLearn case (p.19) is an SoS of school, library, university and cloud services for education. Run the same chain: which constituent&rsquo;s governance policy would you discover first, and does your Mentcare reasoning survive the change of domain?", "field": {"id": "transfer", "core": false, "rows": 3, "ph": "The constituent whose policy matters most, and what transfers or breaks between the two domains"}}]}, {"t": "wide", "c": "violet", "ic": "pin", "tag": "{{flag}} &nbsp;{{localTag}}", "lab": "WHY BOTH CASES ARE LOCAL", "lead": "The evidence has a named destination &mdash; and that is what takes &ldquo;accept the integration risk&rdquo; off the menu.", "txt": "Healthcare and education are both regulated sectors in {{country}}. {{accreditor}} links the field to {{bodies}}. The national health information exchange (NHIC) governs external data sharing from hospital systems; SDAIA governs data and AI across sectors. That makes SoS governance a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording."}, {"t": "principle", "txt": "Mechanism -&gt; Evidence -&gt; Decision boundary"}], "timebox": "1 min + 3 min", "task": "Solve the micro-case, then reuse the same reasoning chain on the iLearn case, and name which of {{bodiesShort}} receives your evidence. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about emergency SoS has learned a case, not a capability. The iLearn case is in the source (p.19), so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.", "appendix": true, "route": "toolkit"}, {"k": "R13", "rule": "RULE 13 - Stress test your verdict", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Stress a verdict against four SoS stress tests, and say which one it fails.", "title": "What change would break your solution?", "sub": "A strong verdict is one that survives the four questions below. Most do not survive the second.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 &nbsp; PATTERN FIT", "lead": "Is the architectural pattern you chose the right shape for the SoS?", "txt": "Data feeds for one-way supply; container for shared infrastructure; trading for bilateral exchange. If you used a data feed for a request/response SoS, the stress test fails."}, {"c": "mag", "lab": "2 &nbsp; GOVERNANCE DISCOVERY", "lead": "Has every constituent&rsquo;s policy been discovered and documented?", "txt": "A broker that enforces an undiscovered policy is one silent refusal away from failure. The stress test asks: which constituent&rsquo;s policy is still a guess?"}, {"c": "sand", "lab": "3 &nbsp; INTERFACE VISIBILITY", "lead": "Does the operator see what the broker refused and why?", "txt": "A broker that refuses silently is enforcement without feedback. The stress test asks: what does the UI show when the broker says no?"}, {"c": "violet", "lab": "4 &nbsp; CONSTITUENT EVOLUTION", "lead": "What happens when a constituent changes without warning?", "txt": "An interface that works today may break tomorrow because a constituent evolved. The stress test asks: which constituent&rsquo;s next release breaks your integration?"}]}, {"t": "wide", "c": "mag", "lab": "PICK THE ONE YOUR VERDICT FAILS", "field": {"id": "stress", "core": true, "rows": 2, "ph": "Which stress test does your verdict fail, and what would you change to survive it?"}}, {"t": "principle", "txt": "A verdict that survives all four stress tests is either remarkable or uncommitted &mdash; usually the second."}], "timebox": "3 min", "task": "Pick the stress test your verdict fails and write what you would change to survive it.", "notes": "Three minutes. The point is to fail one of the four on purpose &mdash; almost every verdict fails governance discovery or interface visibility, and the honest student names which. A verdict that survives all four has usually not committed to a pattern at all.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> decides the verdict and pattern. The <b>evidence owner</b> maintains the inspectable governance discovery artifact. The <b>sign-off</b> accepts the residual integration risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What are the four stress tests an SoS verdict must survive?", "a": "<b>Pattern fit</b> &mdash; is the pattern the right shape for the SoS? <b>Governance discovery</b> &mdash; has every constituent&rsquo;s policy been discovered? <b>Interface visibility</b> &mdash; does the operator see what the broker refused and why? <b>Constituent evolution</b> &mdash; what happens when a constituent changes without warning?"}, {"q": "Your design adds a structured refusal reason to every broker response. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. standing pre-approval below a stated risk band, a weekly batch instead of a queue, refusal-reason rationalisation. Sympathy is not an answer."}, {"q": "Where may AI sit in the SoS assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts discovery templates, suggests patterns, generates interface contracts. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense, so it rehearses the four moves the defense will press: ownership, the stress tests, workload and the AI gate. Question 3 wants a design change, not sympathy &mdash; the same test Rule 14 itself applies. Question 4 is deliberately the exact sentence from the flow: AI prepares, never owns, a human signs &mdash; if the room can say that sentence cold, Rule 15 landed.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks &mdash; the mark follows the level.", "badge": {"c": "", "t": "READINESS", "s": "the gate is at Rule 20"}, "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "violet", "lab": "L1 &nbsp; ASSERTING", "lead": "A verdict with nothing behind it.", "txt": "States a verdict. Names no pattern, no artifact, no owner. Right or wrong, it cannot be audited."}, {"c": "teal", "lab": "L2 &nbsp; REASONING", "lead": "The pattern, cited &mdash; but nothing to inspect.", "txt": "Names data feeds, container or trading and cites the page. Still no artifact a stranger could inspect."}, {"c": "sand", "lab": "L3 &nbsp; JUSTIFYING", "lead": "A dated, owned artifact, and a stated way to be wrong.", "txt": "Names a dated, owned governance discovery artifact, states what would falsify the claim, and bounds the residual integration risk."}, {"c": "green", "lab": "L4 &nbsp; ACCOUNTABLE", "lead": "L3, and it survives the constraint changing.", "txt": "All of L3, and the verdict survives a changed constituent policy &mdash; or the student explains exactly why it changes, and who re-signs."}]}, {"t": "levels"}, {"t": "wide", "c": "mag", "lab": "READINESS IS A GATE, NOT A LEVEL", "lead": "A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.", "txt": "Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight &mdash; LO1, 5 marks, {{assignmentDue}} &mdash; and its evidence policy is the same one: cite the source page, or mark the claim <i>undiscovered</i> with the discovery you would need."}], "hueOk": "Four levels on one rail, each with its own colour, is the scale itself &mdash; a two-colour version stops reading as an ordered ladder.", "timebox": "90 sec", "cut": true, "task": "Pick the level you think you are at, then read the line under it: it says what your card actually carries.", "notes": "The picker is self-assessment; the line under it is read from the boxes the student actually filled and cannot be talked up. Point at the gap between the two &mdash; it is always a specific empty box, which is why this is a teaching instrument rather than a mark. The semester grade weights belong to the Week 01 kickoff and repeating them here wastes ninety seconds &mdash; this slide answers the only question that matters tonight: what separates a weak answer from a defensible one in THIS chapter. Make each student name their own level out loud; most say L2 and are right, and the honesty is the point. Keep formal scoring off the live slide, as the peer-review rule requires. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constituent policy, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constituent policy will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State pattern + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constituent policy changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the discovery"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed evidence"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE &mdash; PICK ONE", "picker": {"g": "mutation", "options": ["The hospital tightens its consent policy", "A new agency joins the SoS", "The unified UI is decommissioned", "Mentcare updates its API without notice"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses &mdash; and why"}}, {"t": "principle", "txt": "A strong design either survives mutation &mdash; or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses &mdash; stronger than a verdict that magically survives everything. Refusing to revise under a changed constituent policy is not robustness; it is not having reasoned in the first place.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the SoS governance claim without trusting your explanation, or the AI or tool that prepared it? Is the discovery record, the broker log, the refusal-path test all on file?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the constituent policy, the silent refusal path or the missing discovery that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session &mdash; two questions only, which is precisely why the formal rubric stays off the live slide. Students who cannot answer Q1 about someone else&rsquo;s card usually discover the same gap in their own. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 10. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line. Keep the instruments visible in sequence; use vertical scrolling for expansion.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, defend and challenge, with a named governance discovery behind it and a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use a pattern and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "X07", "answer": "Illustrative causal hypothesis for tonight: an architect treating Mentcare as a subcomponent of the SoS is the REDUCTIONIST ASSUMPTION (single ownership); the broker silently returning no data because of the hospital's policy is the EMERGENT FAILURE; the ambulance dispatched blind is the CONSEQUENCE. The discovery record alone does not prove this chain. Verify the integration documents before presenting it as the actual incident.", "rule": "X07 - The vocabulary you will swap by mistake", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Distinguish reductionism, complexity and emergence, and say which assumption each one breaks.", "title": "Reductionism, complexity, emergence &mdash; and which one broke", "sub": "Three words for three different things. Get these wrong and every later sentence is wrong with them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "vocabulary, not a source page"}, "blocks": [{"t": "figure", "img": "ch20_trading", "cap": "p.59 · trading systems", "right": [{"t": "cards", "cols": 1, "items": [{"c": "violet", "lab": "TRADING", "lead": "No principal system, systems trade information.", "txt": "No single principal system. Processing in any constituent system. No governance mechanism — any system may change at any time."}]}]}, {"t": "figure", "img": "ch20_container", "cap": "p.54 · container systems", "right": [{"t": "cards", "cols": 1, "items": [{"c": "sand", "lab": "CONTAINER", "lead": "One system provides common services.", "txt": "A container system provides authentication, storage, configuration. Other systems are placed in the container via separate interfaces. Limited number of approved systems."}]}]}, {"t": "figure", "img": "ch20_datafeeds", "cap": "p.50 · systems as data feeds", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "DATA FEEDS", "lead": "Principal system queries other systems for data.", "txt": "A principal system queries constituent systems for data. Providers do not interact with each other. Used in organizational or federated SoS."}]}]}, {"t": "compare", "head": ["Term", "What it is", "Where you would look for it", "Tonight&rsquo;s SoS"], "rows": [{"c": "teal", "cells": ["Reductionism", "The classical engineering approach: decompose, solve each part, reassemble the whole.", "Any design document that treats the SoS as the sum of its parts.", "Treating Mentcare as a subcomponent to be plugged in, not as an independently managed system."]}, {"c": "sand", "cells": ["Complexity", "Behaviour that cannot be predicted from the parts in isolation.", "The interaction map, the data flow, the policy overlap.", "Three complexity types (technical, managerial, governance) &mdash; tonight lives in the third."]}, {"c": "mag", "cells": ["Emergence", "Properties of the SoS that are not present in any part but arise from interaction.", "The incident report, the system behaviour under stress.", "The ambulance dispatched blind: no constituent failed, but the interaction produced a failure none of them can produce alone."]}]}, {"t": "conceptflow", "items": [["REDUCTIONISM", "Decompose and reassemble"], ["COMPLEXITY", "Parts interact unpredictably"], ["EMERGENCE", "Whole has new behaviours"]]}, {"t": "principle", "c": "mag", "txt": "Reductionism assumes the whole is the sum of its parts. For an SoS, it is not."}], "hueOk": "Three terms each carry their own colour so the student can find the same row again on the comparison; one colour would make the table read as an undifferentiated list.", "timebox": "2 min", "cut": true, "task": "Write tonight&rsquo;s incident as one sentence naming the reductionist assumption, the complexity that hid it, and the emergent failure that revealed it.", "say": "You will lose marks all semester for swapping these three words. Two minutes now saves that.", "notes": "<b>The sentence to make them write:</b> most students write &ldquo;the SoS failed because of a software error&rdquo; and stop &mdash; that names two of the three terms and explains neither. The useful sentence names all three in order &mdash; <i>this reductionist assumption</i>, hidden by <i>this complexity</i>, revealed by <i>this emergent failure</i> &mdash; and that is also the shape of a defensible SoS incident report. Two minutes, and it is worth the two even though nothing here is new to a strong student &mdash; the weak half of the room has been using these three words as synonyms since first year. Do not read the table aloud; that is what it is for. Instead ask one student to say tonight&rsquo;s incident as the three-part sentence, and correct only the ordering. This is a designated cut point: if behind, say the three-part sentence once and move on. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "B01", "rule": "B01 - Service broker vs unified UI", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Distinguish the service broker from the unified UI, and say which assumption each one depends on.", "title": "Two integration patterns, two different assumptions", "sub": "The service broker mediates between constituent systems. The unified UI integrates operator access. Both are needed, and they fail differently.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "two patterns compared, not a single source page"}, "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "SERVICE BROKER", "lead": "Mediates between constituent systems.", "txt": "A broker routes, transforms and policy-checks every cross-SoS call. It enforces the governance rules of each constituent at the interface. Tonight&rsquo;s broker enforced Mentcare&rsquo;s consent policy &mdash; by silently returning no data.", "src": "P1 · p.36-37"}, {"c": "violet", "lab": "UNIFIED UI", "lead": "Integrates operator access across constituents.", "txt": "A unified UI pulls from multiple back-ends into one view. The dispatcher should see the Mentcare data, the location feed and the police log in one window. Tonight&rsquo;s UI showed a blank where the data should have been.", "src": "P1 · p.37"}]}, {"t": "cards", "cols": 3, "items": [{"c": "sand", "lab": "WHAT THE BROKER CATCHES", "txt": "A constituent refusing a call &mdash; consent denied, policy conflict, service unavailable."}, {"c": "sand", "lab": "WHAT THE UI CATCHES", "txt": "A constituent returning no data &mdash; the operator sees a gap and can ask why."}, {"c": "mag", "lab": "WHAT NEITHER CATCHES", "txt": "A refusal that returns no reason, in a UI that shows no gap. That is tonight: the broker refused silently and the UI displayed a blank as if no record existed."}]}, {"t": "principle", "c": "mag", "txt": "A broker that refuses silently is governance enforcement without governance visibility. A UI that shows no gap is integration without feedback."}], "timebox": "90 sec", "task": "Pick one threat that tonight&rsquo;s SoS faces and say which pattern would catch it &mdash; or neither.", "notes": "Ninety seconds, and the slide exists because the two patterns are usually taught as if interchangeable. They are not: the broker is the answer to a governance question, the UI is the answer to an operator question, and neither is the answer to a silent refusal. The third card is the one to spend time on &mdash; it is where tonight&rsquo;s failure actually lives.", "appendix": true, "route": "toolkit"}, {"k": "R14", "rule": "RULE 14 - Practitioner workload", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name a workload cost their SoS design creates for a practitioner, and the design change that reduces it.", "title": "Engineering changes human work", "sub": "A well-architected SoS can still fail operationally if it creates unsustainable workload.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "ALERT BURDEN", "lead": "How many silent refusals per shift, and what gets ignored?", "txt": "A broker that silently refuses trains dispatchers to ignore blanks rather than investigate. The 23:18 dispatch is the broker working as designed &mdash; by being ignored."}, {"c": "sand", "lab": "DISCOVERY WORKLOAD", "txt": "Who validates the governance discovery for every constituent, and do they have the hours the process assumes? Discovery is a step 1 deliverable that often becomes a step 4 afterthought."}, {"c": "mag", "lab": "COORDINATION SPEED", "txt": "What negotiation load is the SoS architect absorbing, and what does it push them to skip? A broker contract negotiated in a day instead of a month is a coordination choice, not a technical one."}, {"c": "violet", "ic": "spark", "lab": "WHO WRITES IT NOW", "lead": "Generated code moves the load; it does not remove it.", "txt": "Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing interface contracts they did not write. The broker is exactly the kind of contract a model writes plausibly and a reviewer under-scrutinises."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT, THIS IS THE MECHANISM &mdash; NOT A FOOTNOTE", "lead": "Blaming the dispatcher ends the investigation. Workload as a design input continues it.", "txt": "The dispatcher sent the ambulance blind because the broker had been silently refusing for weeks and the UI had been showing blanks the dispatcher learned to ignore. That is alert load, shift timing and cognitive load acting as a system variable. The source says operational error is perhaps the largest single cause of failure in sociotechnical systems (Ch.10 p.5), and Ch.20 says SoS constituents evolve independently of any single manager (p.6). Blaming the dispatcher ends the investigation; treating workload as a design input continues it.", "field": {"id": "workload", "core": false, "rows": 2, "ph": "One workload cost your SoS design creates for a real practitioner, and the concrete design change that reduces it", "ex": "<i>Shape only:</i> &ldquo;My design adds a structured refusal reason to every broker response. With generated drafts the team now files four times as many, so the dispatcher silences them. Design change: refusal reasons below a stated risk band get standing pre-approval, and the dispatcher sees a weekly batch instead of a queue.&rdquo;"}}, {"t": "principle", "txt": "Trade-offs include people, process, evidence and time &mdash; not only code."}], "timebox": "90 sec", "task": "Name one workload cost your preferred SoS design creates for a real practitioner, and the design change that reduces it.", "notes": "The rule with no equivalent in the textbook, and where ISCARB differs from a standard SoS lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change &mdash; refusal-reason rationalisation, a discovery protocol, a second pair of eyes on the broker contract. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b> Every student in the room is already using generated code, and almost none of them has been asked what it did to the review load rather than to the writing load. Two things to say. First, the honest framing: the tool did not remove the work, it moved it &mdash; from writing, which is visible and estimated, to reviewing, which is neither. Second, connect it to the crisis: the dispatcher ignored the blank because there had been too many silent refusals for the attention available, and a reviewer who approves without reading is the same failure with a keyboard. If a student answers &ldquo;it just makes us faster&rdquo;, ask who reviews the faster output and how many hours they have.", "appendix": true, "route": "toolkit"}, {"k": "R15", "answer": "<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>", "rule": "RULE 15 - AI assist + human sign-off", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.", "title": "AI prepares evidence; humans own assurance", "sub": "AI is permitted for preparation, never for unowned approval.", "badge": {"c": "mag", "t": "AI MOMENT", "s": "assist, not assurance"}, "blocks": [{"t": "aiflow"}, {"t": "aigate"}], "timebox": "90 sec", "task": "Run the gate on the way you actually used AI this week &mdash; on a real output, not a hypothetical. <b style=\"color:var(--mag)\">You are the responsible engineer.</b>", "notes": "The gate is the rule, not the three stations above it &mdash; make every student run it on something they really did this week, not on a hypothetical. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second &mdash; which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. It means the artifact you file is the test you ran and what it showed, never the prompt or the answer. A student who cannot say which of the two middle questions their own use passed has not yet understood what they filed. The remaining trap is yes / no / no: an output that becomes evidence and is neither re-derivable nor testable is exactly the unverifiable claim this course exists to refuse. Note what is deliberately absent: vendor benchmark numbers. If a student cites an accuracy figure or an integration rate, ask which study. That is the break-even discipline from X05 applied to AI, and if you let it slide the session&rsquo;s whole argument about evidence collapses in its final ten minutes.", "appendix": true, "route": "toolkit"}], "appendixUnits": ["READING", "PREP", "C01", "SRC00", "SRC01", "SRC02", "SRC03", "SRC04", "SRC05", "R01", "R02R03", "R08", "R18", "R09", "R10", "R12", "J02", "R02", "R03", "R04", "R05", "H01", "QA1", "QA2", "R06", "R07", "QA3", "R11", "R13", "QA4", "R16", "R17", "R19", "J01", "R20", "X07", "B01", "R14", "R15"], "mainUnits": ["TITLE", "START", "X01", "X02", "X02A", "X03", "CHECK1", "X04", "X05", "X06", "X09", "CHECK2", "X10", "X08", "APPLY", "END"], "path": {"chapter": 20, "assignment": 9, "exit": ["Recognize operational and managerial independence.", "Classify SoS and explain three kinds of complexity.", "Explain why reductionist assumptions can fail.", "Plan interfaces, staged deployment and cross-system tests.", "Compare data-feed, container and trading architectures."], "sourceFile": "sources/Ch20-Original.pptx", "build": "20260921-visual-v3"}, "study": {"readings": [["SoS classification and independence", 15, 20], ["Data feeds and architecture patterns", 48, 53]], "technical": "Compare a data-feed architecture with a trading architecture. State which fits the incident dashboard and what additional interaction would justify the other.", "oral": "A constituent keeps working after leaving the shared dashboard. What does that tell you about operational independence and central authority?", "quiz": [["A constituent remains useful on its own and has its own owner. This indicates:", ["Only technical replication", "Operational and managerial independence", "One centrally controlled application"], 1, "These independent purposes and owners constrain SoS coordination."], ["A coalition coordinates voluntarily without one owner controlling every system. Which classification is plausible?", ["Collaborative", "Automatically directed", "Necessarily virtual with no agreed purpose"], 0, "Classification depends on authority and shared coordination, not only network connections."], ["Why can reductionist reasoning fail in a SoS?", ["Constituents never have specifications", "Interfaces are irrelevant", "Interactions and independent evolution produce emergent behavior"], 2, "Local correctness alone does not establish a shared system-level outcome."], ["A staged release should:", ["Provide bounded value with explicit interfaces and incomplete participation", "Wait for total control of all owners in every case", "Ignore version differences"], 0, "Incremental acceptance must state participation and interface assumptions."], ["Which statement best distinguishes trading from a one-way feed?", ["Trading is only a faster feed", "Trading supports exchanges between participants rather than only publishing observations", "Data feeds cannot have timestamps"], 1, "Select the interaction pattern according to the service and ownership needs."]]}, "caseMap": [{"title": "Classroom application", "parts": [["Claim and evidence", "f:path_claim"], ["Limit and challenge", "f:path_limit"], ["Owner and next step", "f:path_owner"]]}], "visualStory": {"units": {"X01": {"takeaway": "Constituent systems retain useful purposes and owners of their own.", "nodes": [["System A", "Independent owner"], ["Shared capability", "Depends on cooperation"], ["System B", "Independent purpose"]], "visual": "compare"}, "X02": {"takeaway": "Complexity comes from parts, relationships and independent change.", "nodes": [["Technical", "Components and interactions"], ["Managerial", "Different owners"], ["Governance", "Different rules and priorities"]], "visual": "compare"}, "X02A": {"takeaway": "Classify an SoS by its coordination and authority, not only its connections.", "nodes": [["Directed", "Central purpose and control"], ["Collaborative", "Voluntary coordination"], ["Virtual", "No central management"]], "visual": "compare"}, "X03": {"takeaway": "Correct parts do not guarantee a correct shared service.", "nodes": [["Constituents", "Pass local tests"], ["Interactions", "Introduce dependencies"], ["Emergence", "Creates system-level behavior"]], "visual": "ch20_reality"}, "X04": {"takeaway": "Engineering an SoS includes finding systems and negotiating cooperation.", "nodes": [["Shared goal", "What creates value?"], ["Constituents", "Who can contribute?"], ["Agreement", "Interfaces and authority"], ["Evolution", "Staged change"]], "visual": "ch20_soseng"}, "X05": {"takeaway": "Interfaces must carry shared meaning while owners retain control.", "nodes": [["Provider", "Publishes a contract"], ["Interface", "Data, version and access"], ["Consumer", "Interprets the same meaning"]], "visual": "ch20_serviceiface"}, "X06": {"takeaway": "Test the shared journey across owners, versions and operating conditions.", "nodes": [["Local test", "One constituent"], ["Integration test", "Cross-system behavior"], ["Change test", "Independent evolution"]], "visual": "flow"}, "X09": {"takeaway": "Design for useful operation despite incomplete participation and independent change.", "nodes": [["Loose coupling", "Limit dependencies"], ["Bounded value", "Work with partial participation"], ["Evolution", "Expect change"]], "visual": "compare"}, "X10": {"takeaway": "An architecture framework structures questions; it does not supply missing authority.", "nodes": [["Architecture vision", "Shared purpose"], ["Design and migration", "Planned relationships"], ["Governance", "Agreements and review"]], "visual": "ch20_togaf"}, "X08": {"takeaway": "Choose the interaction that the shared service actually requires.", "nodes": [["Data feed", "Publish observations"], ["Container", "Integrate services"], ["Trading", "Exchange between participants"]], "visual": "compare"}}, "opening": {"headline": "Several agencies connect. Who controls the outcome?", "case": "A fictional emergency-response service connects independently managed systems.", "question": "What can the shared service promise?", "nodes": ["Independent owners", "Shared interfaces", "Joint evidence", "Bounded decision"]}, "version": "20260921-visual-v3"}};

/* ---------- v12 retrieval loop: 60 seconds at the close of every phase ------

var QA_C=326.7;                                  /* ring circumference, r=52  */

  }

}
function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
