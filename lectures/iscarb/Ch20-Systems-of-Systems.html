classification shapes what governance discovery means: a coalition has no permanent policy layer, so every integration is ad-hoc.", "appendix": false, "_iscarbRule": "X02A - SoS classification (Maier and intuitive)", "route": "core", "showIf": null, "sourceRange": "15–26", "answer": "The classification is not a label. It is the shape of the governance problem. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X03", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the four engineering problems of SoS, and say which one tonight&rsquo;s architects hit.", "title": "Reductionism and independent evolution", "sub": "The chapter names four engineering problems that make SoS different from ordinary systems engineering. Tonight&rsquo;s architects hit at least three.", "blocks": [{"t": "figure", "img": "ch20_reality", "cap": "slide 25 · system-of-systems reality", "right": []}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · LACK OF CONTROL", "lead": "You cannot command a constituent to change.", "txt": "The SoS engineer has no authority over the constituent systems. Each is owned and managed independently, and any change is a negotiation, not a directive.", "src": "P1 · p.27"}, {"c": "sand", "lab": "2 · INCOMPATIBLE ASSUMPTIONS", "lead": "Each constituent was built on its own.", "txt": "Constituent systems were designed and built independently, with assumptions that may not be visible &mdash; and may not be compatible. The broker assumed Mentcare would return data; Mentcare assumed no external callers without consent.", "src": "P1 · p.28"}, {"c": "violet", "lab": "3 · DIFFERENT EVOLUTION", "lead": "Each constituent changes on its own schedule.", "txt": "Constituent systems evolve at different rates, under different owners. An interface that works today may break tomorrow because a constituent changed without warning the SoS.", "src": "P1 · p.29"}, {"c": "mag", "lab": "4 · LACK OF SUPPORT", "lead": "Tools and methods are immature.", "txt": "SoS engineering lacks the tools, methods and standards that support ordinary systems engineering. Each integration is partly bespoke, with little reusable practice.", "src": "P1 · p.30"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S ARCHITECTS HIT", "lead": "Three of the four, at least.", "txt": "<b>Lack of control:</b> the architects could not command the hospital to share data. <b>Incompatible assumptions:</b> the broker assumed Mentcare would return data; the hospital assumed no external callers without consent. <b>Lack of support:</b> no governance discovery template existed for the integration. The fourth &mdash; different evolution &mdash; is the one that will break the integration next, when the hospital updates Mentcare.", "field": {"id": "eng_problems", "core": false, "rows": 2, "ph": "Which of the four problems is the one your verdict must address first?"}}, {"t": "principle", "c": "mag", "txt": "SoS engineering is ordinary systems engineering with four problems ordinary systems engineering does not have."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Reductionism and independent evolution. Two minutes. The trap is the student who picks Lack of Control because it sounds fundamental. The root cause tonight is Incompatible Assumptions: the architects assumed the hospital would share data, the hospital assumed no external callers without consent. Lack of control is the reason they could not enforce the assumption; lack of support is the reason they did not discover it.", "appendix": false, "_iscarbRule": "X03 - SoS engineering problems", "route": "core", "showIf": null, "sourceRange": "15–26", "answer": "The SoS engineer has no authority over the constituent systems. Each is owned and managed independently, and any change is a negotiation, not a directive. Constituent systems were designed and built independently, with assumptions that may not be visible — and may not be compatible. The broker assumed Mentcare would return data; Mentcare assumed no external callers without consent. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "Each constituent passes its tests. Does the SoS therefore satisfy the shared goal?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "No. Interactions, independent evolution and emergent behavior need system-of-systems evidence. Test the shared service across interfaces and operating conditions.", "timebox": "60 sec", "appendix": false}, {"k": "X04", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the five steps of the SoS development process, and say which one tonight&rsquo;s architects skipped.", "title": "The SoS development process", "sub": "Conceptual design, system selection, architectural design, interface development, and integration/deployment. Tonight&rsquo;s architects skipped the discovery that belongs in conceptual design.", "blocks": [{"t": "figure", "img": "ch20_soseng", "cap": "slide 29 · SoS engineering", "right": []}, {"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 · CONCEPTUAL DESIGN", "lead": "High-level SoS architecture and behaviour.", "txt": "Define the SoS at a high level: what it will do, what kind of architecture is needed, and what kind of behaviour is expected. Includes discovering the constituent systems and their governance constraints.", "src": "P1 · p.31"}, {"c": "sand", "lab": "2 · SYSTEM SELECTION", "lead": "Choose which constituents will participate.", "txt": "Choose which existing systems will be part of the SoS, and which new systems (if any) must be built. Decide what each constituent will contribute.", "src": "P1 · p.31"}, {"c": "violet", "lab": "3 · ARCHITECTURAL DESIGN", "lead": "Detailed structure including interfaces.", "txt": "The detailed structure of the SoS, including how the selected constituent systems will be connected, what services they will provide, and what the overall behaviour will be.", "src": "P1 · p.32"}, {"c": "mag", "lab": "4 · INTERFACE DEVELOPMENT", "lead": "Service interfaces + unified UI.", "txt": "Develop the service interfaces that let constituent systems interoperate, and the unified UI that lets operators work across them.", "src": "P1 · p.33"}, {"c": "green", "lab": "5 · INTEGRATION & DEPLOYMENT", "lead": "Assemble, test, roll out.", "txt": "Assemble the constituent systems through their interfaces, test the integrated SoS, and deploy it into operation. Includes the integration testing that is so difficult for SoS.", "src": "P1 · p.34"}]}, {"t": "wide", "c": "sand", "lab": "WHICH STEP DID TONIGHT&rsquo;S ARCHITECTS SKIP?", "lead": "The governance discovery record belongs in step 1, conceptual design.", "txt": "The governance discovery record &mdash; naming each constituent&rsquo;s owner, its data-sharing policies and the conditions under which they apply &mdash; is a step 1 (conceptual design) deliverable. Tonight&rsquo;s architects jumped to step 4 (interface development) without it, and the broker was built against an assumption nobody had validated.", "field": {"id": "dev_step", "core": false, "rows": 2, "ph": "Which step did tonight&rsquo;s architects skip, and what would the deliverable from that step have prevented?"}}, {"t": "principle", "txt": "Skipping a step in the SoS development process does not save time. It moves the failure to a more expensive phase."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: The SoS development process. Two minutes. The room usually picks interface development as the failure point because that is where the broker sits. The actual skip is conceptual design: the governance discovery belongs there. Push for the step, not the symptom.", "appendix": false, "_iscarbRule": "X04 - SoS development process", "route": "core", "showIf": null, "sourceRange": "27–39", "answer": "Define the SoS at a high level: what it will do, what kind of architecture is needed, and what kind of behaviour is expected. Includes discovering the constituent systems and their governance constraints. Choose which existing systems will be part of the SoS, and which new systems (if any) must be built. Decide what each constituent will contribute. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X05", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish service interfaces from a unified UI, and say what each one must enforce.", "title": "Interfaces and staged deployment", "sub": "An SoS integration lives at its interfaces. The chapter names two: the service interfaces between constituent systems, and the unified UI that integrates operator access.", "blocks": [{"t": "figure", "img": "ch20_serviceiface", "cap": "slide 34 · service interfaces", "right": []}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "SERVICE INTERFACES", "lead": "Contracts between constituent systems.", "txt": "Each constituent exposes its services through a defined interface &mdash; a contract that hides the internal implementation. The interface is the only place where the SoS can enforce governance rules: the broker checks the policy before forwarding the call.", "src": "P1 · p.36"}, {"c": "sand", "lab": "UNIFIED UI", "lead": "A single access point across constituents.", "txt": "A unified user interface integrates access to multiple constituent systems, so an operator can work across the SoS without switching tools. The dispatcher should see the Mentcare data, the location feed and the police log in one view.", "src": "P1 · p.37"}]}, {"t": "cards", "cols": 2, "items": [{"c": "violet", "lab": "WHAT THE INTERFACE HIDES", "lead": "The constituent&rsquo;s internal implementation.", "txt": "A service interface hides the internal implementation of a constituent system. The SoS does not need to know how Mentcare stores records &mdash; only what the interface promises to return, and under what conditions.", "src": "P1 · p.36"}, {"c": "mag", "lab": "WHAT THE INTERFACE MUST ENFORCE", "lead": "The governance policy of the constituent.", "txt": "A service interface is also the only place the SoS can enforce the constituent&rsquo;s governance policy. The broker must check consent before returning mental-health data &mdash; not after, not silently. Tonight the broker returned no data without telling the dispatcher why.", "src": "P1 · p.37"}]}, {"t": "principle", "c": "mag", "txt": "The interface is not just the contract. It is the only place the SoS can enforce a constituent&rsquo;s governance policy."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Interfaces and staged deployment. Two minutes. The trap is treating the interface as a technical contract only. The chapter is explicit: the interface is where governance is enforced. The broker returning no data without explanation is a governance failure, not a technical one. The fix is an interface that returns a structured refusal with a reason the dispatcher can act on.", "appendix": false, "_iscarbRule": "X05 - Interface development", "route": "core", "showIf": null, "sourceRange": "27–39", "answer": "Each constituent exposes its services through a defined interface — a contract that hides the internal implementation. The interface is the only place where the SoS can enforce governance rules: the broker checks the policy before forwarding the call. A unified user interface integrates access to multiple constituent systems, so an operator can work across the SoS without switching tools. The dispatcher should see the Mentcare data, the location feed and the police log in one view. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X06", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain why SoS testing is fundamentally harder than ordinary testing, and name the three reasons.", "title": "Testing a system of systems", "sub": "SoS testing is hard because the SoS has no detailed specification, the tests are not repeatable, and the constituent systems cannot be fixed. Tonight&rsquo;s integration was tested as if it were a system.", "blocks": [{"t": "figure", "img": "ch20_ilearn", "cap": "slide 38 · staged iLearn deployment", "right": []}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · NO DETAILED SPEC", "lead": "The SoS has no single specification.", "txt": "There is no detailed specification of the SoS as a whole &mdash; the constituents have their own specs, but the integrated behaviour emerges from their interaction. There is nothing complete to test against.", "src": "P1 · p.39"}, {"c": "sand", "lab": "2 · TESTS NOT REPEATABLE", "lead": "You cannot reproduce a failure on demand.", "txt": "The constituent systems evolve independently and their state changes. A test that fails tonight may not reproduce tomorrow, because a constituent has changed. The broker failure tonight may not recur &mdash; or may recur only under specific consent states.", "src": "P1 · p.40"}, {"c": "violet", "lab": "3 · CANNOT FIX CONSTITUENTS", "lead": "The SoS engineer cannot patch a constituent.", "txt": "When a test reveals a fault, the SoS engineer cannot fix the constituent system &mdash; they do not own it. They can only work around the fault at the interface, or negotiate a change with the constituent&rsquo;s owner.", "src": "P1 · p.41"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S INTEGRATION TESTED", "lead": "As if it were a system &mdash; not an SoS.", "txt": "The integration was signed off on a broker test that assumed Mentcare would return data. No test exercised the consent-refusal path, because no test knew the consent path existed. The first time the SoS hit a refusal, it was live, at 23:18, with an ambulance on the way.", "field": {"id": "test_gap", "core": false, "rows": 2, "ph": "For your verdict: what test would have caught tonight&rsquo;s failure, and why was it not run?"}}, {"t": "principle", "c": "mag", "txt": "SoS testing is not harder testing. It is a different kind of testing &mdash; against a partial spec, of unrepeatable behaviour, on systems you cannot fix."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Testing a system of systems. Two minutes. The three reasons are not symmetric. The one that explains tonight is the first: no detailed spec. Without a governance discovery record there is no spec for the consent-refusal path, and without a spec there is no test. The other two reasons (not repeatable, cannot fix) explain why the failure will be hard to reproduce and hard to fix &mdash; but the absence of the test is the first reason.", "appendix": false, "_iscarbRule": "X06 - Integration and SoS testing", "route": "core", "showIf": null, "sourceRange": "40–47", "answer": "There is no detailed specification of the SoS as a whole — the constituents have their own specs, but the integrated behaviour emerges from their interaction. There is nothing complete to test against. The constituent systems evolve independently and their state changes. A test that fails tonight may not reproduce tomorrow, because a constituent has changed. The broker failure tonight may not recur — or may recur only under specific consent states. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X09", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the seven SoS architecture principles, and say which one tonight&rsquo;s architects violated.", "title": "Seven principles for SoS architecture", "sub": "The chapter names seven architecture principles for an SoS. Tonight&rsquo;s architects violated at least two.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · DELIVER VALUE IF INCOMPLETE", "lead": "The SoS must be useful even when incomplete.", "txt": "An SoS is never finished. Deliver value at each stage, even when some constituents are missing or some interfaces are stubs. A partial SoS that ships value earns the trust to grow.", "src": "P1 · p.42"}, {"c": "teal", "lab": "2 · BE REALISTIC ABOUT CONTROL", "lead": "You do not control the constituents.", "txt": "Design for the control you actually have, not the control you wish you had. Do not assume you can command a constituent to change. Plan for negotiation, not for direction.", "src": "P1 · p.43"}, {"c": "sand", "lab": "3 · FOCUS ON INTERFACES", "lead": "The interface is the architecture.", "txt": "The interfaces between constituent systems are where the SoS lives. Spend your design effort on the interfaces, not on the internals of the constituents you do not own.", "src": "P1 · p.44"}, {"c": "sand", "lab": "4 · COLLABORATION INCENTIVES", "lead": "Each constituent needs a reason to participate.", "txt": "Constituents are independent; they participate because it serves their goals. Design the SoS so each constituent gains from participating, or they will quietly withdraw.", "src": "P1 · p.45"}]}, {"t": "cards", "cols": 3, "items": [{"c": "violet", "lab": "5 · NODE-AND-WEB", "lead": "Nodes connected by a web of services.", "txt": "Model the SoS as a set of nodes (constituent systems) connected by a web of services. The web, not the nodes, is where the SoS behaviour lives.", "src": "P1 · p.46"}, {"c": "violet", "lab": "6 · SERVICES BETWEEN NODES", "lead": "Services, not data, provide the integration.", "txt": "Integrate through services between nodes, not through shared databases. A service hides the constituent&rsquo;s internals; a shared database exposes them.", "src": "P1 · p.47"}, {"c": "mag", "lab": "7 · MANAGE VULNERABILITIES", "lead": "Identify and manage the points of failure.", "txt": "Identify the points at which a constituent&rsquo;s failure or change can disrupt the SoS, and manage them actively. Tonight&rsquo;s vulnerability &mdash; the hospital&rsquo;s consent policy &mdash; was never identified.", "src": "P1 · p.47"}]}, {"t": "principle", "c": "mag", "txt": "The seven principles are not aspirational. They are the lessons of SoS failures."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Seven principles for SoS architecture. Two minutes. The two principles tonight violated are #2 (be realistic about control &mdash; the architects assumed they could command the hospital) and #7 (manage vulnerabilities &mdash; the consent policy was never identified). The room will reach #7 first because it is the visible failure; #2 is the cause. Push for both.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "40–47", "answer": "An SoS is never finished. Deliver value at each stage, even when some constituents are missing or some interfaces are stubs. A partial SoS that ships value earns the trust to grow. Design for the control you actually have, not the control you wish you had. Do not assume you can command a constituent to change. Plan for negotiation, not for direction. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A partner refuses your release schedule. Which assumption must change?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "Assumed central control is invalid. Negotiate interfaces, versions and a staged deployment that still provides value when participation is incomplete.", "timebox": "60 sec", "appendix": false}, {"k": "X10", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain what TOGAF is, what the ADM is, and how the ADM applies to an SoS.", "title": "Architecture frameworks and TOGAF", "sub": "TOGAF is the Open Group&rsquo;s enterprise architecture framework. Its core is the ADM &mdash; a phased, iterative cycle for developing and governing an architecture.", "blocks": [{"t": "figure", "img": "ch20_togaf", "cap": "slide 46 · TOGAF Architecture Development Method", "right": []}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "WHAT TOGAF IS", "lead": "A structured method and toolset for enterprise architecture.", "txt": "TOGAF &mdash; The Open Group Architecture Framework &mdash; provides a structured method and supporting toolset for enterprise architecture. It is widely used to organise architecture work in large organisations, including those running SoS.", "src": "P1 · p.48-49"}, {"c": "sand", "lab": "WHAT THE ADM IS", "lead": "The core of TOGAF &mdash; a phased, iterative cycle.", "txt": "The Architecture Development Method (ADM) is the core of TOGAF. It is a phased, iterative cycle: preliminary, architecture vision, business/data/application/technology architecture, opportunities and solutions, migration planning, implementation governance, change management. The cycle repeats.", "src": "P1 · p.50-52"}]}, {"t": "cards", "cols": 2, "items": [{"c": "violet", "lab": "WHY IT FITS SOS", "lead": "An SoS architecture is never finished.", "txt": "An SoS develops over time, with constituents added, changed and retired. The ADM&rsquo;s iterative cycle matches that reality: each iteration revisits the architecture in light of what has changed. The SoS never sits still, and neither does the ADM.", "src": "P1 · p.53"}, {"c": "mag", "lab": "WHY IT DOES NOT SOLVE TONIGHT", "lead": "A framework is not a discovery record.", "txt": "TOGAF organises architecture work; it does not perform it. The governance discovery that tonight&rsquo;s architects skipped is a deliverable in the business architecture phase of the ADM. The framework would have named the gap &mdash; if anyone had run it.", "src": "P1 · p.53"}]}, {"t": "principle", "c": "mag", "txt": "A framework is a discipline, not a substitute for one. The ADM names the phase; the work is still yours."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Architecture frameworks and TOGAF. Two minutes. The honest answer is that the ADM&rsquo;s business architecture phase is where governance discovery belongs. Tonight&rsquo;s architects did not skip the ADM; they ran a partial version of it. The framework would have surfaced the gap if it had been run with discipline. Make the room say which phase, not which framework.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "40–47", "answer": "TOGAF — The Open Group Architecture Framework — provides a structured method and supporting toolset for enterprise architecture. It is widely used to organise architecture work in large organisations, including those running SoS. The Architecture Development Method (ADM) is the core of TOGAF. It is a phased, iterative cycle: preliminary, architecture vision, business/data/application/technology architecture, opportunities and solutions, migration planning, implementation governance, change management. The cycle repeats. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X08", "answer": "Illustrative pattern choice, not a measured result or a value from the chapter: The regional emergency response SoS is a coalition of independent agencies convened for a shared mission. The right architectural pattern is systems in a container: each constituent retains its independence, but a shared container provides the common services (broker, unified UI, identity) that the coalition needs. A data-feed pattern would hide the consent-refusal path; a trading pattern would require bilateral agreements the coalition does not have. The choice requires approval for the actual SoS.", "rule": "", "phase": "LEARN", "accent": "violet", "learn": "Match the three architectural patterns to the SoS problems they solve, and justify a choice for tonight.", "title": "Data feeds, containers and trading systems", "sub": "The chapter names three architectural patterns for an SoS: systems as data feeds, systems in a container, and trading systems. Each fits a different problem.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "patterns compared, not a single source page"}, "blocks": [{"t": "compare", "head": ["Pattern", "What it is", "Best for", "Tonight?"], "rows": [{"c": "teal", "cells": ["Systems as data feeds", "A constituent provides data to other systems via a one-way feed, with no shared UI.", "One-way data supply, no bilateral exchange, no shared UI", "No: the SoS needs request/response with consent checks, not a one-way feed."]}, {"c": "teal", "cells": ["Systems in a container", "A set of constituents share a common container that provides shared services (broker, UI, identity).", "A coalition that needs shared infrastructure but keeps constituent independence", "Yes: each agency keeps its own systems; the container provides the broker and unified UI."]}, {"c": "sand", "cells": ["Trading systems", "Constituents exchange goods or services bilaterally, with no central authority.", "Peer-to-peer exchange among willing partners", "No: the agencies are not trading services; they are responding to a shared mission."]}, {"c": "mag", "cells": ["Tonight&rsquo;s choice", "Systems in a container &mdash; the broker and unified UI are the shared services the coalition needs.", "Coalition response SoS with shared dispatch and consent enforcement", "The container is the place where governance is enforced and the unified UI lives."]}]}, {"t": "wide", "c": "violet", "lab": "ONE LINE, IN THE OTHER VOCABULARY", "field": {"id": "vocab_own", "core": false, "rows": 1, "ph": "State the pattern you would choose for tonight&rsquo;s SoS, and the one service the container must provide"}}], "hueOk": "Colours carry over from X09 so the student recognises which family each row belongs to; the row is a translation, and the colour is what says of what.", "timebox": "", "cut": true, "task": "Pick the pattern for tonight&rsquo;s SoS, and name the one service the container must provide that the current broker does not.", "say": "Nothing here is new. It is the same architecture principles with the names given to the patterns they produce.", "notes": "Teaching focus: Data feeds, containers and trading systems. Ninety seconds, and resist expanding it &mdash; the point is recognition, not instruction. Two things worth saying. First, the patterns are not interchangeable: data feeds hide consent refusals, container exposes them as a shared service, trading requires bilateral agreements the coalition does not have. Second, the choice is not academic &mdash; tonight&rsquo;s failure is partly a pattern failure: a one-way data feed cannot enforce governance. If someone asks which pattern is right, the answer is the SoS you have &mdash; a coalition needs a container. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "48–63"}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "A regional emergency response SoS went live across police, ambulance, fire and coastguard, with the hospital&rsquo;s Mentcare system feeding patient information to ambulance dispatch."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is a governance discovery record for every constituent system in the SoS &mdash; naming each system&rsquo;s owner, its data-sharing policies and the conditions under which they apply. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming automatic data flow. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "READING", "title": "Required self-study · pages, purpose and deadline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Required self-study · before the assignment and next chapter discussion.</b> Read the two selections below, attempt the five-question check, and use one assigned source slide to support the assignment artifact. Blackboard provides the calendar deadline.</p><p><b>Time budget:</b> initially 15–25 minutes including the check; record actual time. These replace unfocused source browsing. The original source ledger remains available for clarification and unfinished classroom topics.</p></div><div class=\"lp-reading-row\"><h3>SoS classification and independence</h3><p>Original source slides 15–20</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"15\">Slide 15</button><button class=\"lp-btn\" data-source-slide=\"16\">Slide 16</button><button class=\"lp-btn\" data-source-slide=\"17\">Slide 17</button><button class=\"lp-btn\" data-source-slide=\"18\">Slide 18</button><button class=\"lp-btn\" data-source-slide=\"19\">Slide 19</button><button class=\"lp-btn\" data-source-slide=\"20\">Slide 20</button></div></div><div class=\"lp-reading-row\"><h3>Data feeds and architecture patterns</h3><p>Original source slides 48–53</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"48\">Slide 48</button><button class=\"lp-btn\" data-source-slide=\"49\">Slide 49</button><button class=\"lp-btn\" data-source-slide=\"50\">Slide 50</button><button class=\"lp-btn\" data-source-slide=\"51\">Slide 51</button><button class=\"lp-btn\" data-source-slide=\"52\">Slide 52</button><button class=\"lp-btn\" data-source-slide=\"53\">Slide 53</button></div></div><p class=\"lp-study-note\"><b>Observable work:</b> identify the source slide and explain how its concept changes or supports your artifact. A citation or a checked box alone is insufficient. In the next class, be ready to explain a related example in your own words.</p><p class=\"lp-study-note\"><b>Assessment scope:</b> all five chapter objectives, the classroom route and these named selections. Full source examples support this scope; archived administrative/title slides and optional toolkit activities are not extra assessed requirements. The instructor must announce any further assigned source topic in Blackboard before assessing it.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"PREP\">Attempt the five-objective check</button><button class=\"lp-btn\" data-jump=\"C01\">Full source map</button></div>"}], "noAnswer": true, "appendix": true}, {"k": "PREP", "title": "Check all five objectives", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<p class=\"lp-study-note\">One question per chapter objective, in the same order as the five objectives. Attempt all five before opening feedback. Retry after reviewing an error. This public practice is not a secure test; the instructor uses a changed example during class.</p><form id=\"prepQuiz\" class=\"lp-prep\"><fieldset><legend>LO 1 · A constituent remains useful on its own and has its own owner. This indicates:</legend><label><input type=\"radio\" name=\"prep-0\" value=\"0\">Only technical replication</label><label><input type=\"radio\" name=\"prep-0\" value=\"1\">Operational and managerial independence</label><label><input type=\"radio\" name=\"prep-0\" value=\"2\">One centrally controlled application</label><p hidden data-prep-feedback id=\"prep-feedback-0\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 2 · A coalition coordinates voluntarily without one owner controlling every system. Which classification is plausible?</legend><label><input type=\"radio\" name=\"prep-1\" value=\"0\">Collaborative</label><label><input type=\"radio\" name=\"prep-1\" value=\"1\">Automatically directed</label><label><input type=\"radio\" name=\"prep-1\" value=\"2\">Necessarily virtual with no agreed purpose</label><p hidden data-prep-feedback id=\"prep-feedback-1\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 3 · Why can reductionist reasoning fail in a SoS?</legend><label><input type=\"radio\" name=\"prep-2\" value=\"0\">Constituents never have specifications</label><label><input type=\"radio\" name=\"prep-2\" value=\"1\">Interfaces are irrelevant</label><label><input type=\"radio\" name=\"prep-2\" value=\"2\">Interactions and independent evolution produce emergent behavior</label><p hidden data-prep-feedback id=\"prep-feedback-2\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 4 · A staged release should:</legend><label><input type=\"radio\" name=\"prep-3\" value=\"0\">Provide bounded value with explicit interfaces and incomplete participation</label><label><input type=\"radio\" name=\"prep-3\" value=\"1\">Wait for total control of all owners in every case</label><label><input type=\"radio\" name=\"prep-3\" value=\"2\">Ignore version differences</label><p hidden data-prep-feedback id=\"prep-feedback-3\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 5 · Which statement best distinguishes trading from a one-way feed?</legend><label><input type=\"radio\" name=\"prep-4\" value=\"0\">Trading is only a faster feed</label><label><input type=\"radio\" name=\"prep-4\" value=\"1\">Trading supports exchanges between participants rather than only publishing observations</label><label><input type=\"radio\" name=\"prep-4\" value=\"2\">Data feeds cannot have timestamps</label><p hidden data-prep-feedback id=\"prep-feedback-4\" class=\"prep-feedback\"></p></fieldset><button type=\"button\" class=\"lp-btn\" id=\"checkPrep\">Check my five answers</button><div id=\"prepStatus\" role=\"status\" aria-live=\"polite\">Attempt first. Feedback is initially hidden.</div></form>"}], "noAnswer": true, "appendix": true}, {"k": "C01", "title": "Source coverage and study checklist", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>63 supplied slides indexed.</b> Every original topic has a classroom location and a source review location. This map records material availability, not time actually taught or student mastery.</p><p>Five chapter objectives connect to supplied syllabus CLO 10. Original concepts remain required even when detailed examples are completed after class.</p></div><div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Original topic</th><th>Source slides</th><th>Classroom location</th><th>Full source</th></tr></thead><tbody><tr><td>Opening and source outline</td><td>1–2</td><td><button class=\"lp-btn\" data-jump=\"START\">Your route through this chapter</button></td><td><button class=\"lp-btn\" data-jump=\"SRC00\">Read source</button></td></tr><tr><td>SoS characteristics and complexity</td><td>3–14</td><td><button class=\"lp-btn\" data-jump=\"X01\">Systems of systems and independence</button> · <button class=\"lp-btn\" data-jump=\"X02\">Three forms of complexity</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Classification and reductionism</td><td>15–26</td><td><button class=\"lp-btn\" data-jump=\"X02A\">Classifying systems of systems</button> · <button class=\"lp-btn\" data-jump=\"X03\">Reductionism and independent evolution</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Engineering, interfaces and deployment</td><td>27–39</td><td><button class=\"lp-btn\" data-jump=\"X04\">The SoS development process</button> · <button class=\"lp-btn\" data-jump=\"X05\">Interfaces and staged deployment</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Testing and architecture principles</td><td>40–47</td><td><button class=\"lp-btn\" data-jump=\"X06\">Testing a system of systems</button> · <button class=\"lp-btn\" data-jump=\"X09\">Seven principles for SoS architecture</button> · <button class=\"lp-btn\" data-jump=\"X10\">Architecture frameworks and TOGAF</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr><tr><td>Data feeds, containers and trading</td><td>48–63</td><td><button class=\"lp-btn\" data-jump=\"X08\">Data feeds, containers and trading systems</button></td><td><button class=\"lp-btn\" data-jump=\"SRC05\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch20-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 20 – Systems of Systems</summary><div class=\"lp-source-text\"></div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\nSystem complexity\nSystem of systems classification\nReductionism and complex systems\nSystems of systems engineering\nSystems of systems architecture</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "SoS characteristics and complexity", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–14. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch20-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · Systems of systems</summary><div class=\"lp-source-text\">Systems of systems\nMore and more systems are being constructed by integrated existing, independent systems\nA system of systems is a system that contains two or more independently managed elements. \nThere is no single manager for all of the parts of the system of systems and that different parts of a system are subject to different management and control policies and rules. </div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · Examples of systems of systems</summary><div class=\"lp-source-text\">Examples of systems of systems\nA cloud management system that handles local private cloud management and management of servers on public clouds such as Amazon and Microsoft.\nAn online banking system that handles loan requests and which connects to a credit reference system provided by credit reference agency to check the credit of applicants.\nAn emergency information system that integrates information from police, ambulance, fire and coastguard services about the assets available to deal with civil emergencies such as flooding and large-scale accidents. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · Essential characteristics of SoS</summary><div class=\"lp-source-text\">Essential characteristics of SoS\nOperational independence of system elements\nManagerial independence of system elements\nEvolutionary development\nEmergence of system characteristics\nGeographic distribution of system elements\nData intensive (data &gt;&gt; code)\nHeterogeneity\n</div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · System complexity</summary><div class=\"lp-source-text\">System complexity</div></details><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · Complexity</summary><div class=\"lp-source-text\">Complexity\nAll systems are composed of parts (elements) with relationships between these elements of the system. \nFor example, the parts of a program may be objects and the parts of each object may be constants, variables and methods. \nExamples of relationships include ‘calls’ (method A calls method B), ‘inherits-from’ (object X inherits the methods and attributes of object Y) and ‘part of’ (method A is part of object X).\nThe complexity of any system depends on the number and the types of relationships between system elements. \nThe type of relationship (static or dynamic) also influences the overall complexity of a system. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · Simple and complex systems</summary><div class=\"lp-source-text\">Simple and complex systems</div></details><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · Process complexity</summary><div class=\"lp-source-text\">Process complexity\nAs systems grow in size, they need more complex production and management processes.  \nComplex processes are themselves complex systems. \nThey are difficult to understand and may have undesirable emergent properties. They are more time consuming than simpler processes and they require more documentation and coordination between the people and the organizations involved in the system development. \nThe complexity of the production process is one of the main reasons why projects go wrong, with software delivered late and over-budget. </div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · System production and management processes</summary><div class=\"lp-source-text\">System production and management processes</div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · Complexity and software engineering</summary><div class=\"lp-source-text\">Complexity and software engineering\nComplexity is important for software engineering because it is the main influence on the understandability and the changeability of a system. \nThe more complex a system, the more difficult it is to understand and analyze. \nAs complexity increases, there are more and more relationships between elements of the system and an increased likelihood that changing one part of a system will have undesirable effects elsewhere.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Types of complexity</summary><div class=\"lp-source-text\">Types of complexity\nTechnical complexity is derived from the relationships between the different components of the system itself.\nManagerial complexity is derived from the complexity of the relationships between the system and its managers and the relationships between the managers of different parts of the system.\nGovernance complexity of a system depends on the relationships between the laws, regulations and policies that affect the system and the relationships between the decision-making processes in the organizations responsible for the system. </div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · System characteristics and complexity</summary><div class=\"lp-source-text\">System characteristics and complexity</div><div class=\"lp-tablewrap\"><table><tr><td>SoS characteristic</td><td>Technical\u000bcomplexity</td><td>Managerial\u000bcomplexity</td><td>Governance\u000bcomplexity</td></tr><tr><td>Operational independence</td><td> </td><td>X</td><td>X</td></tr><tr><td>Managerial independence</td><td>X</td><td>X</td><td> </td></tr><tr><td>Evolutionary development</td><td>X</td><td> </td><td> </td></tr><tr><td>Emergence</td><td>X</td><td> </td><td> </td></tr><tr><td>Geographical distribution</td><td>X</td><td>X</td><td>X</td></tr><tr><td>Data-intensive</td><td>X</td><td> </td><td>X</td></tr><tr><td>Heterogeneity</td><td>X</td><td> </td><td> </td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Complexity and project failure</summary><div class=\"lp-source-text\">Complexity and project failure\nLarge-scale systems of systems are now unimaginably complex entities that cannot be understood or analyzed as a whole. \nThe large number of interactions between the parts and the dynamic nature of these interactions means that conventional engineering approaches do not work well for complex systems.  \nIt is complexity that is the root cause of problems in projects to develop large software-intensive systems, not poor management or technical failings. </div></details>"}], "noAnswer": true, "sourceRange": "3–14", "appendix": true}, {"k": "SRC02", "title": "Classification and reductionism", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 15–26. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch20-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Systems of systems classification</summary><div class=\"lp-source-text\">Systems of systems classification</div></details><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · Maier’s classification of systems of systems</summary><div class=\"lp-source-text\">Maier’s classification of systems of systems\nDirected SoS are owned by a single organization and are developed by integrating systems that are also owned by that organization. The system elements may be independently managed by parts of the organization.\nCollaborative SoS are systems where there is no central authority to set management priorities and resolve disputes. Typically, elements of the system are owned and governed by different organizations. \nVirtual systems have no central governance and the participants may not agree on the overall purpose of the system. Participant systems may enter or leave the SoS. </div></details><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · More intuitive classification terms</summary><div class=\"lp-source-text\">More intuitive classification terms\nOrganizational systems of systems are SoS where the governance and management of the system lies within the same organization or company.  \nFederated systems are SoS where the governance of the SoS depends on a voluntary participative body in which all of the system owners are represented. \nSystem of system coalitions are SoS where there are no formal governance mechanisms but where the organizations involved informally collaborate and manage their own systems to maintain the system as a whole. </div></details><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · System of systems classification</summary><div class=\"lp-source-text\">System of systems classification</div></details><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · iLearn as a SoS</summary><div class=\"lp-source-text\">iLearn as a SoS\niLearn is a relatively simple technical system but it has a high level of governance complexity. \nThe development of a digital learning system is a national initiative but to create a digital learning environment, it has to be integrated with network management and school administration systems. \nThere is no common governance process across authorities so, according to the classification scheme, this is a coalition of systems. </div></details><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Reductionism and complex systems</summary><div class=\"lp-source-text\">Reductionism and complex systems</div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · Complexity management in engineering</summary><div class=\"lp-source-text\">Complexity management in engineering\nThe approach that has been the basis of complexity management in software engineering is called reductionism. \nReductionism is based on the assumption that any system is made up of parts or subsystems. \nIt assumes that the behaviour and properties of the system as a whole can be understood and predicted by understanding the individual parts and the relationships between these parts.\nTo design a system, the parts making up that system are identified, constructed separately and then assembled into the complete system. </div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · Software engineering methods</summary><div class=\"lp-source-text\">Software engineering methods\nA reductionist approach has been the basis of software engineering for almost 50 years. \nTop-down design, where you start with a very high-level model of a system and break this down to its components is a reductionist approach. \nThis is the basis of all software design methods, such as object-oriented design. Programming languages include abstractions, such as procedures and objects that directly reflect reductionist system decomposition.\nAgile methods are also reductionist. The difference between agile methods and top-down design is that system decomposition is incremental when an agile approach is used.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · Reductionist methods</summary><div class=\"lp-source-text\">Reductionist methods\nReductionist methods are successful when there are relatively few relationships between the parts of a system and it is possible to model these relationships. \nSoftware engineering methods attempt to limit complexity by controlling the relationships between parts of the system.\nReductionism does not work well when there are many relationships in a system and when these relationships are difficult to understand and analyze. \nThe fundamental assumptions that are inherent to reductionism are inapplicable for large and complex systems </div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · Reductionist assumptions</summary><div class=\"lp-source-text\">Reductionist assumptions\nSystem ownership and control \nReductionism assumes that there is a controlling authority for a system that can resolve disputes and make high-level technical decisions that will apply across the system. \nRational decision making  \nReductionism assumes that interactions between components can be objectively assessed by, for example, mathematical modelling. \nDefined system boundaries  \nReductionism assumes that the boundaries of a system can be agreed and defined. </div></details><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · System of systems reality</summary><div class=\"lp-source-text\">System of systems reality</div></details><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Reductionism and software SoS</summary><div class=\"lp-source-text\">Reductionism and software SoS\nRelationships in software systems are not governed by physical laws. \nPolitical factors are usually the driver of decision making for large and complex software systems. \nSoftware has no physical limitations hence there are no limits on where the boundaries of a system are drawn. \nThe boundaries and the scope of a system are likely to change during its development. \nLinking software systems from different owners is relatively easy hence we are more likely to try and create a SoS where there is no single governing body. </div></details>"}], "noAnswer": true, "sourceRange": "15–26", "appendix": true}, {"k": "SRC03", "title": "Engineering, interfaces and deployment", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 27–39. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch20-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · Systems of systems engineering</summary><div class=\"lp-source-text\">Systems of systems engineering</div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · SoS engineering problems</summary><div class=\"lp-source-text\">SoS engineering problems\nLack of control over system functionality and performance.\nDiffering and incompatible assumptions made by the developers of the different systems.\nDifferent evolution strategies and timetables for the different systems.\nLack of support from system owners when problems arise.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · Systems of systems engineering</summary><div class=\"lp-source-text\">Systems of systems engineering</div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · SoS development processes</summary><div class=\"lp-source-text\">SoS development processes\nConceptual design is the activity of creating a high-level vision for a system, defining essential requirements and identifying constraints on the overall system. \nSystem selection, where a set of systems for inclusion in the SoS is chosen. \nPolitical imperatives and issues of system governance and management are often the key factors that influence what systems are included in a SoS.\nArchitectural design where an overall architecture for the SoS is developed. </div></details><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · SoS development processes</summary><div class=\"lp-source-text\">SoS development processes\nInterface development – the development of system interfaces so that the constituent systems can interoperate.\nIntegration and deployment – making the different systems involved in the SoS work together and interoperate through the developed interfaces. \nSystem deployment means putting the system into place in the organizations concerned and making it operational. </div></details><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · Interface development</summary><div class=\"lp-source-text\">Interface development\nIn general, the aim in SoS development is for systems to be able to communicate directly with each other without user intervention. \nService interfaces\nIf systems in a SoS have service interfaces, they can communicate directly via these interfaces\nThe constituent systems in a SoS often have their own specialized API or only allow their functionality to be accessed through their user interfaces. \nYou therefore have to develop software that reconciles the differences between these interfaces. </div></details><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · Service interface development</summary><div class=\"lp-source-text\">Service interface development\nTo develop service-based interfaces, you have to examine the functionality of existing systems and define a set of services to reflect that functionality. \nThe services are implemented either by calls to the underlying system API or by mimicking user interaction with the system. \nA principal system acts as a service broker, directing service calls between the different systems in the SoS.\nEach system therefore does not need to know which other system is providing a called service.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · Service interfaces</summary><div class=\"lp-source-text\">Service interfaces</div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · Unified user interfaces</summary><div class=\"lp-source-text\">Unified user interfaces\nUser interfaces for each system in a SoS are likely to be different. \nA principal system must have some overall user interfaces that handles user authentication and provides access to the features of the underlying system.\nIt is usually expensive and time-consuming to implement a unified user interface to replace the individual interfaces of the underlying systems. </div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · Cost-effectiveness of UI development</summary><div class=\"lp-source-text\">Cost-effectiveness of UI development\nThe interaction assumptions of the systems in the SoS\n If systems have different interaction models, unifying these in a single UI is very difficult\nThe mode of use of the SoS \nA unified UI slows down interaction if most of the interaction is with a principal system in the SoS\nThe ‘openness’ of the SoS \nIf the SoS is open, so that new systems may be added to it when it is in use, then unified UI development is impractical. </div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · Integration and deployment</summary><div class=\"lp-source-text\">Integration and deployment\nFor SoS, it makes sense to consider integration and deployment to be part of the same process. \nSeparate integration may be difficult as some of the systems in the SoS may already be in use\nThe integration process should begin with systems that are already deployed, with new systems added to the SoS to provide coherent additions to the functionality of the overall system. </div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Staged deployment of the iLearn system</summary><div class=\"lp-source-text\">Staged deployment of the iLearn system\nThe initial deployment provides authentication, basic learning functionality and integration with school administration systems.\nStage 2 adds an integrated storage system and a set of more specialized tools to support subject-specific learning. \nStage 3 adds features for user configuration and the ability for users to add new systems to the iLearn environment.  \n</div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · iLearn releases</summary><div class=\"lp-source-text\">iLearn releases</div></details>"}], "noAnswer": true, "sourceRange": "27–39", "appendix": true}, {"k": "SRC04", "title": "Testing and architecture principles", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 40–47. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch20-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · SoS testing</summary><div class=\"lp-source-text\">SoS testing\nThere are three reasons why testing systems of systems is difficult and expensive:\nThere may not be a detailed requirements specification that can be used as a basis for system testing.  It may not be cost effective to develop a SoS requirements document – the details of the system functionality are defined by the systems included.\nThe constituent systems may change in the course of the testing process so tests may not be repeatable. \nIf problems are discovered, it may not be possible to fix the problems by requiring one of more of the constituent systems to be changed. Intermediate software may have to be introduced to solve the problem. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · SoS testing and agile testing</summary><div class=\"lp-source-text\">SoS testing and agile testing\nAgile methods do not rely on having a complete system specification for system acceptance testing. \nStakeholders are engaged with the testing process and to decide when the overall system is acceptable. \nFor SoS, a range of stakeholders should be involved in the testing process if possible and they can comment on whether or not the system is ready for deployment.\nAgile methods make extensive use of automated testing. This makes it much easier to rerun tests to discover if unexpected system changes have caused problems for the SoS as a whole. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Systems of systems architecture</summary><div class=\"lp-source-text\">Systems of systems architecture</div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · General principles for architecting SoS</summary><div class=\"lp-source-text\">General principles for architecting SoS\nDesign systems so that they can deliver value if they are incomplete. \nBe realistic about what can be controlled. \nFocus on the system interfaces. \nProvide collaboration incentives.\nDesign a SoS as node and web architecture. \nSpecify behaviour as services exchanged between nodes.  \nUnderstand and manage system vulnerabilities. </div></details><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · Architectural frameworks</summary><div class=\"lp-source-text\">Architectural frameworks\nArchitectural frameworks such as MODAFand TOGAF have been suggested as a means to support the architectural design of systems of systems. \nAn architecture framework recognises that a single model of an architecture does not present all of the information needed for architectural and business analysis. \nFrameworks propose a number of architectural views that should be created and maintained to describe and document enterprise systems. </div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · TOGAF</summary><div class=\"lp-source-text\">TOGAF\nThe TOGAF framework has been developed by the Open Group as an open standard and is intended to support the design of a business architecture, a data architecture, an application architecture and a technology architecture for an enterprise. \nAt its heart is the Architecture Development Method (ADM), which consists of a number of discrete phases. </div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · TOGAF – Architecture Development Method</summary><div class=\"lp-source-text\">TOGAF – Architecture Development Method</div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · Architectural model management</summary><div class=\"lp-source-text\">Architectural model management\nInitial model development takes a long time and involves extensive negotiations between system stakeholders. This slows the development of the overall system.\nIt is time-consuming and expensive to maintain model consistency as changes are made to the organization and the constituent systems in a SoS.\n</div></details>"}], "noAnswer": true, "sourceRange": "40–47", "appendix": true}, {"k": "SRC05", "title": "Data feeds, containers and trading", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 48–63. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch20-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-48\"><summary>Slide 48 · Architectural patterns for SoS</summary><div class=\"lp-source-text\">Architectural patterns for SoS\nAn architectural pattern is a stylized architecture that can be recognized across a range of different systems.\n Architectural patterns are a useful way of stimulating discussions about the most appropriate architecture for a system and for documenting and explaining the architectures used. </div></details><details class=\"lp-source-section\" id=\"source-slide-49\"><summary>Slide 49 · Systems as data feeds</summary><div class=\"lp-source-text\">Systems as data feeds\nThere is a principal system that requires data of different types. \nThis data is available from other systems and the principal system queries these systems to get the data required. \nGenerally, the systems that provide data do not interact with each other. \nThis pattern is often observed in organizational or federated systems where some governance mechanisms are in place.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-50\"><summary>Slide 50 · Systems as data feeds</summary><div class=\"lp-source-text\">Systems as data feeds</div></details><details class=\"lp-source-section\" id=\"source-slide-51\"><summary>Slide 51 · Systems as data feeds</summary><div class=\"lp-source-text\">Systems as data feeds\nThe ‘systems as data feeds’ architecture is an appropriate architecture to use when it is possible to identify entities in a unique way and create relatively simple queries about these entities. \nA variant of the ‘systems as data feeds’ architecture arises when there are a number of systems involved which provide similar data but which are not identical. \nThe architecture has to include an intermediate layer to translate the general query from the principal system into the specific query required by the individual information system. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-52\"><summary>Slide 52 · Systems as data feeds with unifying interface</summary><div class=\"lp-source-text\">Systems as data feeds with unifying interface</div></details><details class=\"lp-source-section\" id=\"source-slide-53\"><summary>Slide 53 · Systems in a container</summary><div class=\"lp-source-text\">Systems in a container\nSystems in a container are systems of systems where one of the systems acts as a virtual container and provides a set of common services such as an authentication and a storage service. \nConceptually, other systems are then placed into this container to make their functionality accessible to system users.\nYou don’t place systems into a real container to implement these systems of systems. Rather, for each approved system, there is a separate interface that allows it to be integrated with the common services.  </div></details><details class=\"lp-source-section\" id=\"source-slide-54\"><summary>Slide 54 · Container systems</summary><div class=\"lp-source-text\">Container systems</div></details><details class=\"lp-source-section\" id=\"source-slide-55\"><summary>Slide 55 · ILearn container: common services</summary><div class=\"lp-source-text\">ILearn container: common services\nAn authentication service that provides a single sign-in to all approved systems. Users do not have to maintain separate credentials for these.\nA storage service for user data. This can be seamlessly transferred to and from approved systems.\nA configuration service that is used to include or remove systems from the container.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-56\"><summary>Slide 56 · iLearn as a container</summary><div class=\"lp-source-text\">iLearn as a container</div></details><details class=\"lp-source-section\" id=\"source-slide-57\"><summary>Slide 57 · Container architecture problems</summary><div class=\"lp-source-text\">Container architecture problems\nA separate interface must be developed for each approved system so that common services can be used with these systems. \nThis means that only a relatively small number of approved systems can be supported.\nThe owners of the container system have no influence on the functionality and behaviour of the included systems. Systems may stop working or may be withdrawn at any time.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-58\"><summary>Slide 58 · Trading systems</summary><div class=\"lp-source-text\">Trading systems\nTrading systems are systems of systems where there is no single principal system but processing may take place in any of the constituent systems. \nThe systems involved trade information amongst themselves. There may be one-to-one or one-to-many interactions between these systems. \nEach system publishes its own interface but there may not be any interface standards that are followed by all systems. </div></details><details class=\"lp-source-section\" id=\"source-slide-59\"><summary>Slide 59 · Trading systems</summary><div class=\"lp-source-text\">Trading systems</div></details><details class=\"lp-source-section\" id=\"source-slide-60\"><summary>Slide 60 · Trading SoS</summary><div class=\"lp-source-text\">Trading SoS\nTrading systems may be developed for any type of marketplace with the information exchanged being information about the goods being traded and their prices. \nWhile trading systems are systems in their own right and could conceivably be used for individual trading, they are most useful in an automated trading context where the systems negotiate directly with each other. \nThe major problem with this type of system is that there is no governance mechanism so any of the systems involved may change at any time. </div></details><details class=\"lp-source-section\" id=\"source-slide-61\"><summary>Slide 61 · Key points</summary><div class=\"lp-source-text\">Key points\nSystems of systems are systems where two or more of the constituent systems are independently managed and governed.\nThere are three types of complexity that are important for systems of systems – technical complexity, managerial complexity and governance complexity.\nSystem governance can be used as the basis for a classification scheme for SoS. This leads to three classes of SoS namely organizational systems, federated systems and system coalitions.</div></details><details class=\"lp-source-section\" id=\"source-slide-62\"><summary>Slide 62 · Key points</summary><div class=\"lp-source-text\">Key points\nReductionism as an engineering method breaks down because of the inherent complexity of systems of systems. \nReductionism assumes clear system boundaries, rational decision making and well-defined problems. None of these are true for systems of systems.\nThe key stages of the SoS development process are conceptual design, system selection, architectural design, interface development and integration and deployment. Governance and management policies must be designed in parallel with these activities.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-63\"><summary>Slide 63 · Key points</summary><div class=\"lp-source-text\">Key points\nArchitectural patterns for systems of systems are a means of describing and discussing typical architectures for SoS.  \nImportant patterns are systems as data feeds, systems in a container and trading systems.\n</div></details>"}], "noAnswer": true, "sourceRange": "48–63", "appendix": true}, {"k": "R01", "answer": "One defensible request is a governance discovery record for every constituent system in the SoS &mdash; naming each system&rsquo;s owner, its data-sharing policies and the conditions under which they apply. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming automatic data flow.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence an SoS decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "A regional emergency response SoS went live across police, ambulance, fire and coastguard, with the hospital&rsquo;s Mentcare system feeding patient information to ambulance dispatch.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Continue, hold, or revert the SoS integration and ask for governance evidence?", "txt": "During a mental-health crisis at 23:18 the SoS delivered no Mentcare patient information to ambulance dispatch. The paramedic arrived with no mental-health history. Do you continue, hold, or revert the integration and ask for the governance discovery record?"}, {"c": "mag", "lab": "UNKNOWN", "lead": "The SoS architects integrated Mentcare assuming its records would flow. They did not discover the hospital&rsquo;s governance policy.", "txt": "The hospital&rsquo;s governance policy prohibits sharing mental-health records externally without patient consent. The SoS architects never discovered that policy. Tonight the broker silently returned no data, and the ambulance was dispatched blind."}]}, {"t": "principle", "txt": "An SoS is a system of independently managed elements. Failure starts when an architect assumes the elements will behave like one system.", "src": "P1 · p.4"}], "timebox": "90 sec", "task": "Name the one piece of governance evidence you would demand before letting the SoS route another mental-health call.", "say": "You are the SoS architect on call. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching and is not a report of a real incident. Every rule tonight returns to this SoS. The classic mistake in a case lecture is explaining the architecture before the students feel the pressure of the decision.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers &mdash; and what you must prove", "sub": "Five sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "SOS AND COMPLEXITY", "txt": "What is an SoS, and why is it hard?", "src": "P1 · p.3"}, {"c": "sand", "lab": "SOS CLASSIFICATION", "txt": "Directed, collaborative, virtual &mdash; and the intuitive scheme.", "src": "P1 · p.15"}, {"c": "teal", "lab": "REDUCTIONISM", "txt": "Why does classical engineering break?", "src": "P1 · p.20"}, {"c": "sand", "lab": "SOS ENGINEERING", "txt": "Problems, process, interfaces, testing.", "src": "P1 · p.27"}, {"c": "teal", "lab": "SOS ARCHITECTURE", "txt": "Principles, TOGAF, and the patterns.", "src": "P1 · p.42"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Identify the seven SoS essential characteristics and classify an SoS by Maier&rsquo;s and intuitive schemes."}, {"c": "teal", "lab": "2", "txt": "Explain why reductionism fails for SoS and name the engineering problems that result."}, {"c": "teal", "lab": "3", "txt": "Design an SoS architecture using the development process, interface development and architectural patterns."}, {"c": "mag", "lab": "4", "txt": "Build a bounded verdict with inspectable SoS governance evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when a constituent system&rsquo;s governance policy changes."}]}], "timebox": "90 sec", "task": "Note which of the five sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total, no more. This slide exists so nobody leaves tonight unsure what was in the chapter and what was not. Both the condensed and the full versions (R02, R03) remain in ISCARB Depth for anyone who wants the two-slide version back.", "appendix": true, "route": "toolkit"}, {"k": "R08", "answer": "The chapter's own example (Ch.20 p.4) is an emergency information system integrating police, ambulance, fire and coastguard — the same shape as tonight's SoS. The lesson the chapter draws: each constituent is independently managed, with its own goals and its own evolution; no single authority controls the whole. Tonight's Mentcare integration is the same lesson in a different domain: the hospital's governance policy is the independent management the architects assumed away. There is no third option but to discover it.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "Read the chapter&rsquo;s own SoS example and extract the design decision it implies.", "title": "The chapter&rsquo;s own emergency information system", "sub": "The source uses a regional emergency response SoS as its worked example (Ch.20 p.4) &mdash; the same shape as tonight&rsquo;s case. The lesson is in the independence of the constituents.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE SOURCE EXAMPLE", "lead": "Police, ambulance, fire and coastguard, integrated for emergency response.", "txt": "The chapter&rsquo;s worked example (p.4) is an emergency information system integrating police, ambulance, fire and coastguard systems. Each constituent is independently managed. The SoS exists to deliver coordinated response across them.", "src": "P1 · p.4"}, {"c": "sand", "lab": "THE INDEPENDENCE LESSON", "lead": "Each constituent keeps its own goa
