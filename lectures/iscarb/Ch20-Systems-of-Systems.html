ive" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch20-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":20,"title":"Systems of Systems","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260921-classroom-v3","filename":"Ch20-Systems-of-Systems.html","assignment":9,"points":5,"objectives":["Recognize operational and managerial independence.","Classify SoS and explain three kinds of complexity.","Explain why reductionist assumptions can fail.","Plan interfaces, staged deployment and cross-system tests.","Compare data-feed, container and trading architectures."],"sections":["20.1 System complexity","20.2 SoS classification","20.3 Reductionism and complex systems","20.4 SoS engineering","20.5 SoS architecture"],"case":{"headline":"Several owners connect. Who controls the shared promise?","text":"A fictional multi-agency dashboard combines independently managed data feeds. The principal system can validate and display received data but cannot dictate every provider’s update schedule.","question":"What useful service can be promised without pretending to control every owner?","mutation":"One participating feed changes to a slower update schedule while keeping the same interface shape."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Systems of Systems","phase":"START","takeaway":"Systems of Systems","full":"<p>Systems of Systems<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"X01","title":"A system of systems contains independent participants","fig":null,"sourceRange":"3–8","bullets":[["Operational independence","Constituents remain useful as systems in their own right."],["Managerial independence","Constituent owners retain decision authority."],["Evolution / emergence","Independent changes and interactions affect shared behavior."],["Other characteristics","Geographic distribution, heterogeneity and large data volumes."]],"question":"Why can a small integration still be a system of systems?","answer":"The distinguishing feature is independent management, not code size alone. Even a few externally managed services may create SoS constraints.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Geographic distribution, heterogeneity and large data volumes.","full":"<p><b>Operational independence.<\/b> Constituents remain useful as systems in their own right.<\/p><p><b>Managerial independence.<\/b> Constituent owners retain decision authority.<\/p><p><b>Evolution / emergence.<\/b> Independent changes and interactions affect shared behavior.<\/p><p><b>Other characteristics.<\/b> Geographic distribution, heterogeneity and large data volumes.<\/p>","sourceStart":3},{"id":"X02","title":"Three different kinds of complexity","fig":"ch20_complexity","sourceRange":"9–14","bullets":[["Technical","Relationships among system elements and their runtime behavior."],["Managerial","Who can operate, change and coordinate the constituent systems."],["Governance","Policies and decision-making structures constraining those managers."],["Interaction","A policy change can also alter operational and technical dependencies."]],"question":"Is inability to force another owner’s deployment merely a software defect?","answer":"No. It is a management/governance constraint that technical design must accommodate.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/09d19e989499209f.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"A policy change can also alter operational and technical dependencies.","full":"<p><b>Technical.<\/b> Relationships among system elements and their runtime behavior.<\/p><p><b>Managerial.<\/b> Who can operate, change and coordinate the constituent systems.<\/p><p><b>Governance.<\/b> Policies and decision-making structures constraining those managers.<\/p><p><b>Interaction.<\/b> A policy change can also alter operational and technical dependencies.<\/p>","sourceStart":9},{"id":"X02A","title":"Keep the two classification vocabularies aligned","fig":"ch20_classification","sourceRange":"15–20","bullets":[["Organizational","One organization provides an ultimate governance structure."],["Federated","Owners agree to a voluntary joint governance body."],["Coalition","Participants collaborate without formal shared governance."],["Criterion","Classify authority and coordination, not only network connections."]],"question":"Which classification fits an agreed joint governing body whose decisions participants implement?","answer":"The author’s federated SoS, corresponding to Maier’s collaborative category. A coalition without that formal body is different.","rows":null,"heads":null,"extra":"Vocabulary mapping in the supplied chapter: Maier directed ↔ organizational; collaborative ↔ federated; virtual ↔ coalition. The source discusses why the alternative names better emphasize governance.","phase":"LEARN","figure":"assets/v3/cc11430e2482e8ab.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Classify authority and coordination, not only network connections.","full":"<p><b>Organizational.<\/b> One organization provides an ultimate governance structure.<\/p><p><b>Federated.<\/b> Owners agree to a voluntary joint governance body.<\/p><p><b>Coalition.<\/b> Participants collaborate without formal shared governance.<\/p><p><b>Criterion.<\/b> Classify authority and coordination, not only network connections.<\/p>","sourceStart":15},{"id":"X03","title":"Reductionist assumptions can break at system boundaries","fig":"ch20_reality","sourceRange":"21–26","bullets":[["Control","There may be no single authority able to change every constituent."],["Decisions","Organizational interests can compete with purely technical criteria."],["Boundaries","The problem and participating systems may be renegotiated."],["Implication","Local correctness alone does not establish the whole-system outcome."]],"question":"Why is a correct interface specification not a guarantee of a stable SoS?","answer":"Owners can evolve systems independently, and participation or meaning may change. Cross-system behavior and governance assumptions need ongoing review.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/a19c188bb406ead3.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Local correctness alone does not establish the whole-system outcome.","full":"<p><b>Control.<\/b> There may be no single authority able to change every constituent.<\/p><p><b>Decisions.<\/b> Organizational interests can compete with purely technical criteria.<\/p><p><b>Boundaries.<\/b> The problem and participating systems may be renegotiated.<\/p><p><b>Implication.<\/b> Local correctness alone does not establish the whole-system outcome.<\/p>","sourceStart":21},{"id":"CHECK1","title":"Checkpoint · bound the shared promise","fig":null,"sourceRange":"3–26","bullets":[["Think","Three owners publish data to one incident dashboard."],["Pair","Separate what the dashboard controls from what it merely receives."],["Record","State a useful claim with participation and freshness assumptions."]],"question":"Can the dashboard owner promise that every provider will always update on time?","answer":"Not without the corresponding authority/agreement and evidence. It can promise its own bounded display, validation and fallback behavior.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"State a useful claim with participation and freshness assumptions.","full":"<p><b>Think.<\/b> Three owners publish data to one incident dashboard.<\/p><p><b>Pair.<\/b> Separate what the dashboard controls from what it merely receives.<\/p><p><b>Record.<\/b> State a useful claim with participation and freshness assumptions.<\/p>","sourceStart":3},{"id":"X04","title":"Five engineering activities; governance alongside","fig":"ch20_soseng","sourceRange":"27–32","bullets":[["Conceptual design","Identify useful capabilities, existing systems and constraints."],["Selection / architecture","Choose participants and organize their interaction together."],["Interfaces","Reconcile the different services and representations."],["Integration / deployment","Introduce useful capabilities while coordinating management policies."]],"question":"Why should governance discussions start before the final integration test?","answer":"Authority, participation, change handling and acceptance affect which integrations are feasible and can take longer to agree than an interface takes to implement.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/9dd47ad69147bc4e.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Introduce useful capabilities while coordinating management policies.","full":"<p><b>Conceptual design.<\/b> Identify useful capabilities, existing systems and constraints.<\/p><p><b>Selection / architecture.<\/b> Choose participants and organize their interaction together.<\/p><p><b>Interfaces.<\/b> Reconcile the different services and representations.<\/p><p><b>Integration / deployment.<\/b> Introduce useful capabilities while coordinating management policies.<\/p>","sourceStart":27},{"id":"X05","title":"An interface must reconcile more than syntax","fig":"ch20_serviceiface","sourceRange":"33–36","bullets":[["Service boundary","Expose the needed capability of an existing system."],["Adaptation","Translate specialized APIs or interactions without assuming internal control."],["User interface","Unification may help, but workflow and usage differences can make it costly."],["Contract","State data meaning, timing, failures and change responsibility."]],"question":"Why might a single unified user interface be the wrong choice?","answer":"Different interaction models, dominant local workflows or open-ended participant additions may make unification impractical or slow the main task.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6f43909f3370e740.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"State data meaning, timing, failures and change responsibility.","full":"<p><b>Service boundary.<\/b> Expose the needed capability of an existing system.<\/p><p><b>Adaptation.<\/b> Translate specialized APIs or interactions without assuming internal control.<\/p><p><b>User interface.<\/b> Unification may help, but workflow and usage differences can make it costly.<\/p><p><b>Contract.<\/b> State data meaning, timing, failures and change responsibility.<\/p>","sourceStart":33},{"id":"DEPLOY","title":"Deliver useful intermediate forms","fig":"ch20_ilearn","sourceRange":"37–39","bullets":[["Staged value","An incomplete SoS should still perform useful bounded work."],["Existing operation","Constituents may already be deployed and cannot all be frozen."],["Increment","Add a coherent capability with explicit acceptance conditions."],["People","Plan training, equipment and operational transition as well as code."]],"question":"What makes a staged release more than an unfinished system?","answer":"A defined useful capability, explicit missing participation, acceptance evidence and a safe path to later stages.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e6e451bd15d86744.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Plan training, equipment and operational transition as well as code.","full":"<p><b>Staged value.<\/b> An incomplete SoS should still perform useful bounded work.<\/p><p><b>Existing operation.<\/b> Constituents may already be deployed and cannot all be frozen.<\/p><p><b>Increment.<\/b> Add a coherent capability with explicit acceptance conditions.<\/p><p><b>People.<\/b> Plan training, equipment and operational transition as well as code.<\/p>","sourceStart":37},{"id":"X06","title":"Test the interactions that owners do not control alone","fig":null,"sourceRange":"40–43","bullets":[["No complete specification","Acceptance may require close stakeholder participation."],["Independent change","A constituent update can invalidate a previous result."],["Constraints","Fixes may need mediation rather than a constituent-code change."],["Regression","Automate repeatable cross-system checks where feasible."]],"question":"Which record makes a cross-system result repeatable?","answer":"Participant and interface versions, inputs, relevant data/time assumptions, expected result and observed behavior. Record changes that cannot be controlled.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Automate repeatable cross-system checks where feasible.","full":"<p><b>No complete specification.<\/b> Acceptance may require close stakeholder participation.<\/p><p><b>Independent change.<\/b> A constituent update can invalidate a previous result.<\/p><p><b>Constraints.<\/b> Fixes may need mediation rather than a constituent-code change.<\/p><p><b>Regression.<\/b> Automate repeatable cross-system checks where feasible.<\/p>","sourceStart":40},{"id":"CHECK2","title":"Checkpoint · useful value with one participant missing","fig":null,"sourceRange":"27–43","bullets":[["Think","One data provider becomes slow or unavailable."],["Pair","Define what remains useful and what the user must see as unknown."],["Record","Add the chosen interface/fallback mechanism and its trade-off."]],"question":"Why is displaying old data as current a different problem from showing “unavailable”?","answer":"It presents unsupported certainty. A bounded service must preserve freshness/uncertainty information so users can interpret the result.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the chosen interface/fallback mechanism and its trade-off.","full":"<p><b>Think.<\/b> One data provider becomes slow or unavailable.<\/p><p><b>Pair.<\/b> Define what remains useful and what the user must see as unknown.<\/p><p><b>Record.<\/b> Add the chosen interface/fallback mechanism and its trade-off.<\/p>","sourceStart":27},{"id":"X09","title":"Architecture principles include people and incentives","fig":null,"sourceRange":"44–47","bullets":[["Value and control","Deliver useful incomplete forms; be realistic about authority."],["Interfaces and incentives","Support evolution and give owners reasons to participate."],["Node and web","Model sociotechnical nodes and both technical/social connections."],["Services and vulnerabilities","Define exchanges and design for unexpected failures."]],"question":"Why is an incentive to maintain a data feed an architectural concern?","answer":"The capability depends on continued participation. An elegant interface cannot sustain the service when an independent owner has no reason to maintain it.","rows":null,"heads":null,"extra":"All seven source principles are retained: incomplete value; realistic control; interfaces; collaboration incentives; node-and-web structure; service exchanges; vulnerability management.","phase":"LEARN","takeaway":"Define exchanges and design for unexpected failures.","full":"<p><b>Value and control.<\/b> Deliver useful incomplete forms; be realistic about authority.<\/p><p><b>Interfaces and incentives.<\/b> Support evolution and give owners reasons to participate.<\/p><p><b>Node and web.<\/b> Model sociotechnical nodes and both technical/social connections.<\/p><p><b>Services and vulnerabilities.<\/b> Define exchanges and design for unexpected failures.<\/p>","sourceStart":44},{"id":"X10","title":"Architecture frameworks provide views—not total control","fig":"ch20_togaf","sourceRange":"44–47","bullets":[["Multiple views","Business, data/application and technology views describe different concerns."],["Management effort","Creating and maintaining consistent models takes time."],["Limitation","A framework cannot create authority over independent participants."],["Source scope","The shown TOGAF diagram is the textbook’s historical version, not a current compliance claim."]],"question":"When can a framework remain useful despite its limitations?","answer":"As a checklist and shared vocabulary for architectural concerns, provided the team does not assume it solves independent ownership or uncertain boundaries.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/b83804ee6ccbfdb0.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"The shown TOGAF diagram is the textbook’s historical version, not a current compliance claim.","full":"<p><b>Multiple views.<\/b> Business, data/application and technology views describe different concerns.<\/p><p><b>Management effort.<\/b> Creating and maintaining consistent models takes time.<\/p><p><b>Limitation.<\/b> A framework cannot create authority over independent participants.<\/p><p><b>Source scope.<\/b> The shown TOGAF diagram is the textbook’s historical version, not a current compliance claim.<\/p>","sourceStart":44},{"id":"X08","title":"Pattern 1 · systems as data feeds","fig":"ch20_datafeeds","sourceRange":"48–53","bullets":[["Principal system","Queries information held by other systems."],["Unifying interface","Can translate a common query to provider-specific formats."],["Failure behavior","Bound waiting and show missing or stale inputs."],["Governance","Agree how interface and data-format changes are communicated."]],"question":"What should a slow provider not be allowed to do to the whole dashboard?","answer":"Cause an unbounded wait or silently replace unknown data with a misleading value. Define timeout and explicit partial-result behavior.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1c08c1faae4be113.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Agree how interface and data-format changes are communicated.","full":"<p><b>Principal system.<\/b> Queries information held by other systems.<\/p><p><b>Unifying interface.<\/b> Can translate a common query to provider-specific formats.<\/p><p><b>Failure behavior.<\/b> Bound waiting and show missing or stale inputs.<\/p><p><b>Governance.<\/b> Agree how interface and data-format changes are communicated.<\/p>","sourceStart":48},{"id":"CONTAINER","title":"Pattern 2 · systems in a virtual container","fig":"ch20_container","sourceRange":"54–59","bullets":[["Common services","A principal system offers facilities such as sign-in, storage or configuration."],["Adapters","Approved systems integrate through interfaces to those common services."],["Unapproved systems","May remain reachable without shared-service integration."],["Not an OS container","This is a SoS integration pattern, not necessarily process isolation."]],"question":"Does adding a link to a tool mean it participates in common sign-in and storage?","answer":"No. Those integrations need compatible interfaces and configuration. Mere inclusion in the user interface does not establish them.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3ee6a1792825a363.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"This is a SoS integration pattern, not necessarily process isolation.","full":"<p><b>Common services.<\/b> A principal system offers facilities such as sign-in, storage or configuration.<\/p><p><b>Adapters.<\/b> Approved systems integrate through interfaces to those common services.<\/p><p><b>Unapproved systems.<\/b> May remain reachable without shared-service integration.<\/p><p><b>Not an OS container.<\/b> This is a SoS integration pattern, not necessarily process isolation.<\/p>","sourceStart":54},{"id":"TRADING","title":"Pattern 3 · trading between participants","fig":"ch20_trading","sourceRange":"60–63","bullets":[["Exchange","Participants offer and request services or items rather than only publish data."],["Coordination","Agreed interaction rules organize the exchange."],["Independence","Participants retain local interests, policies and evolution."],["Choice","Real SoS may combine trading, containers and data feeds."]],"question":"Why is trading not just a faster one-way data feed?","answer":"The pattern involves exchanges between participants with roles and agreements; a one-way feed primarily supplies observations to a consumer.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/aafbde3e7bf09b87.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Real SoS may combine trading, containers and data feeds.","full":"<p><b>Exchange.<\/b> Participants offer and request services or items rather than only publish data.<\/p><p><b>Coordination.<\/b> Agreed interaction rules organize the exchange.<\/p><p><b>Independence.<\/b> Participants retain local interests, policies and evolution.<\/p><p><b>Choice.<\/b> Real SoS may combine trading, containers and data feeds.<\/p>","sourceStart":60},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"One participating feed changes to a slower update schedule while keeping the same interface shape.","bullets":[["Reassess","Explain the effect of the changed constraint."],["Evidence","Name the observation that would defeat the revised claim."],["Ownership","State who reviews and accepts the bounded scope."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role.","nodes":[["Initial claim","Bounded by assumptions"],["New
