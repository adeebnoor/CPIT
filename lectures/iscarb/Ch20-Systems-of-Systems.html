tion scheme, this is a coalition of systems."],"n":19,"title":"iLearn as a SoS"},{"cls":"slide","unit":"X03","kind":"title","n":20,"title":"Reductionism and complex systems"},{"cls":"full","unit":"X03","n":21,"title":"Complexity management in engineering"},{"cls":"full","reason":"TODO","unit":"X03","n":22,"title":"Software engineering methods"},{"cls":"full","unit":"X03","n":23,"title":"Reductionist methods"},{"cls":"slide","unit":"X03","n":24,"title":"Reductionist assumptions"},{"cls":"slide","unit":"X02A","n":25,"title":"System of systems reality"},{"cls":"full","unit":"X03","n":26,"title":"Reductionism and software SoS"},{"cls":"slide","unit":"X04","n":27,"title":"Systems of systems engineering"},{"cls":"full","unit":"X04","n":28,"title":"SoS engineering problems"},{"cls":"slide","unit":"X04","n":29,"title":"Systems of systems engineering"},{"cls":"full","unit":"X04","n":30,"title":"SoS development processes"},{"cls":"slide","unit":"X04","n":31,"title":"SoS development processes"},{"cls":"full","unit":"X05","n":32,"title":"Interface development"},{"cls":"full","unit":"X05","n":33,"title":"Service interface development"},{"cls":"slide","unit":"X05","n":34,"title":"Service interfaces"},{"cls":"full","unit":"X05","n":35,"title":"Unified user interfaces"},{"cls":"slide","unit":"X05","n":36,"title":"Cost-effectiveness of UI development"},{"cls":"slide","unit":"DEPLOY","n":37,"title":"Integration and deployment"},{"cls":"full","unit":"DEPLOY","n":38,"title":"Staged deployment of the iLearn system"},{"cls":"full","unit":"DEPLOY","n":39,"title":"iLearn releases"},{"cls":"full","unit":"X06","n":40,"title":"SoS testing"},{"cls":"full","unit":"X06","n":41,"title":"SoS testing and agile testing"},{"cls":"slide","unit":"X09","n":42,"title":"Systems of systems architecture"},{"cls":"full","unit":"X09","n":43,"title":"General principles for architecting SoS"},{"cls":"full","unit":"X09","n":44,"title":"Architectural frameworks"},{"cls":"full","unit":"X09","n":45,"title":"TOGAF"},{"cls":"full","unit":"X09","n":46,"title":"TOGAF – Architecture Development Method"},{"cls":"full","unit":"X09","n":47,"title":"Architectural model management"},{"cls":"no","reason":"Definition of an architectural pattern; in the study list","kind":"prose","n":48,"title":"Architectural patterns for SoS"},{"cls":"slide","unit":"X08","kind":"list","items":["A principal system requires data of different types","The principal system queries other systems to get the data","The providing systems generally do not interact with each other","Often observed in organizational or federated systems with some governance"],"n":49,"title":"Systems as data feeds"},{"cls":"slide","unit":"X08","kind":"figure","n":50,"title":"Systems as data feeds"},{"cls":"full","unit":"X08","kind":"prose","items":["The ‘systems as data feeds’ architecture is an appropriate architecture to use when it is possible to identify entities in a unique way and create relatively simple queries about these entities.","A variant of the ‘systems as data feeds’ architecture arises when there are a number of systems involved which provide similar data but which are not identical.","The architecture has to include an intermediate layer to translate the general query from the principal system into the specific query required by the individual information system."],"n":51,"title":"Systems as data feeds"},{"cls":"slide","unit":"X08","kind":"figure","n":52,"title":"Systems as data feeds with unifying interface"},{"cls":"slide","unit":"CONTAINER","kind":"prose","items":["Systems in a container are systems of systems where one of the systems acts as a virtual container and provides a set of common services such as an authentication and a storage service.","Conceptually, other systems are then placed into this container to make their functionality accessible to system users.","You don’t place systems into a real container to implement these systems of systems. Rather, for each approved system, there is a separate interface that allows it to be integrated with the common services."],"n":53,"title":"Systems in a container"},{"cls":"slide","unit":"CONTAINER","n":54,"title":"Container systems"},{"cls":"slide","unit":"CONTAINER","n":55,"title":"ILearn container: common services"},{"cls":"slide","unit":"CONTAINER","n":56,"title":"iLearn as a container"},{"cls":"slide","unit":"CONTAINER","n":57,"title":"Container architecture problems"},{"cls":"slide","unit":"TRADING","n":58,"title":"Trading systems"},{"cls":"slide","unit":"TRADING","n":59,"title":"Trading systems"},{"cls":"full","unit":"TRADING","n":60,"title":"Trading SoS"},{"cls":"no","reason":"Summary slide; its points are taught on the slides above","n":61,"title":"Key points"},{"cls":"no","reason":"Summary slide; its points are taught on the slides above","n":62,"title":"Key points"},{"cls":"no","reason":"Summary slide; its points are taught on the slides above","n":63,"title":"Key points"}]}</script><script src="runtime/source-figures.js?v=20261004-andor"></script><script src="runtime/national-content.js?v=20260928-campus-v3"></script><script src="runtime/labs.js?v=20261003-extra-v1"></script><script src="runtime/story-v3.js?v=20261015-req-v7c"></script><script src="runtime/classroom-v3.js?v=20261015-req-v7c" defer></script></body></html>
