et new requirements.</div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · Base systems for a software product line</summary><div class=\"lp-source-text\">Base systems for a software product line</div></details><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · Base applications</summary><div class=\"lp-source-text\">Base applications\nCore components that provide infrastructure support. These are not usually modified when developing a new instance of the product line. \nConfigurable components that may be modified and configured to specialize them to a new application. Sometimes, it is possible to reconfigure these components without changing their code by using a built-in component configuration language. \nSpecialized, domain-specific components some or all of which may be replaced when a new instance of a product line is created.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · Application frameworks and product lines</summary><div class=\"lp-source-text\">Application frameworks and product lines\nApplication frameworks rely on object-oriented features such as polymorphism to implement extensions. Product lines need not be object-oriented (e.g. embedded software for a mobile phone)\nApplication frameworks focus on providing technical rather than domain-specific support. Product lines embed domain and platform information.\nProduct lines often control applications for equipment.\nSoftware product lines are made up of a family of applications, usually owned by the same organization. </div></details><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · Product line architectures</summary><div class=\"lp-source-text\">Product line architectures\nArchitectures must be structured in such a way to separate different sub-systems and to allow them to be modified.\nThe architecture should also separate entities and their descriptions and the higher levels in the system access entities through descriptions rather than directly.</div></details><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · The architecture of a resource allocation system </summary><div class=\"lp-source-text\">The architecture of a resource allocation system </div></details><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · The product line architecture of a vehicle dIspatcher</summary><div class=\"lp-source-text\">The product line architecture of a vehicle dIspatcher</div></details><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · Vehicle dispatching</summary><div class=\"lp-source-text\">Vehicle dispatching\nA specialised resource management system where the aim is to allocate resources (vehicles) to handle incidents.\nAdaptations include:\nAt the UI level, there are components for operator display and communications;\nAt the I/O management level, there are components that handle authentication, reporting and route planning;\nAt the resource management level, there are components for vehicle location and despatch, managing vehicle status and incident logging;\nThe database includes equipment, vehicle and map databases.</div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · Product line specialisation</summary><div class=\"lp-source-text\">Product line specialisation\nPlatform specialization\nDifferent versions of the application are developed for different platforms.\nEnvironment specialization\nDifferent versions of the application are created to handle different operating environments e.g. different types of communication equipment.\nFunctional specialization\nDifferent versions of the application are created for customers with different requirements.\nProcess specialization\nDifferent versions of the application are created to support different business processes.</div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · Product instance development </summary><div class=\"lp-source-text\">Product instance development </div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · Product instance development</summary><div class=\"lp-source-text\">Product instance development\nElicit stakeholder requirements\nUse existing family member as a prototype\nChoose closest-fit family member\nFind the family member that best meets the requirements\nRe-negotiate requirements\nAdapt requirements as necessary to capabilities of the software\nAdapt existing system\nDevelop new modules and make changes for family member\nDeliver new family member\nDocument key features for further member development</div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Product line configuration</summary><div class=\"lp-source-text\">Product line configuration\nDesign time configuration\nThe organization that is developing the software modifies a common product line core by developing, selecting or adapting components to create a new system for a customer. \nDeployment time configuration\nA generic system is designed for configuration by a customer or consultants working with the customer. Knowledge of the customer’s specific requirements and the system’s operating environment is embedded in configuration data that are used by the generic system. </div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · Deployment-time configuration </summary><div class=\"lp-source-text\">Deployment-time configuration </div></details><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · Levels of deployment time configuration</summary><div class=\"lp-source-text\">Levels of deployment time configuration\nComponent selection, where you select the modules in a system that provide the required functionality. \nWorkflow and rule definition, where you define workflows (how information is processed, stage-by-stage) and validation rules that should apply to information entered by users or generated by the system. \n Parameter definition, where you specify the values of specific system parameters that reflect the instance of the application that you are creating\n</div></details>"}], "noAnswer": true, "sourceRange": "26–40", "appendix": true}, {"k": "SRC04", "title": "Application reuse, ERP and integration", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 41–58. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch15-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · Application system reuse</summary><div class=\"lp-source-text\">Application system reuse</div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Application system reuse</summary><div class=\"lp-source-text\">Application system reuse\nAn application system product is a software system that can be adapted for different customers without changing the source code of the system.\nApplication systems have generic features and so can be used/reused in different environments.\nApplication system products are adapted by using built-in configuration mechanisms that allow the functionality of the system to be tailored to specific customer needs.\n For example, in a hospital patient record system, separate input forms and output reports might be defined for different types of patient.  </div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · Benefits of application system reuse</summary><div class=\"lp-source-text\">Benefits of application system reuse\nAs with other types of reuse, more rapid deployment of a reliable system may be possible.\nIt is possible to see what functionality is provided by the applications and so it is easier to judge whether or not they are likely to be suitable. \nSome development risks are avoided by using existing software. However, this approach has its own risks, as I discuss below.\nBusinesses can focus on their core activity without having to devote a lot of resources to IT systems development.\nAs operating platforms evolve, technology updates may be simplified as these are the responsibility of the COTS product vendor rather than the customer.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · Problems of application system reuse</summary><div class=\"lp-source-text\">Problems of application system reuse\nRequirements usually have to be adapted to reflect the functionality and mode of operation of the COTS product. \nThe COTS product may be based on assumptions that are practically impossible to change. \nChoosing the right COTS system for an enterprise can be a difficult process, especially as many COTS products are not well documented. \nThere may be a lack of local expertise to support systems development. \nThe COTS product vendor controls system support and evolution. </div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · Configurable application systems</summary><div class=\"lp-source-text\">Configurable application systems\nConfigurable application systems are generic application systems that may be designed to support a particular business type, business activity or, sometimes, a complete business enterprise. \nFor example, an application system may be produced for dentists that handles appointments, dental records, patient recall, etc. \nDomain-specific systems, such as systems to support a business function (e.g. document management) provide functionality that is likely to be required by a range of potential users. \t</div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · COTS-solution and COTS-integrated systems </summary><div class=\"lp-source-text\">COTS-solution and COTS-integrated systems </div><div class=\"lp-tablewrap\"><table><tr><td>Configurable application systems</td><td>Application system integration</td></tr><tr><td>Single product that provides the functionality required by a customer</td><td>Several heterogeneous system products are integrated to provide  customized functionality</td></tr><tr><td>Based around a generic solution and standardized processes</td><td>Flexible solutions may be developed for customer processes</td></tr><tr><td>Development focus is on system configuration</td><td>Development focus is on system integration</td></tr><tr><td>System vendor is responsible for maintenance</td><td>System owner is responsible for maintenance</td></tr><tr><td>System vendor provides the platform for the system</td><td>System owner provides the platform for the system</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · ERP systems</summary><div class=\"lp-source-text\">ERP systems\nAn Enterprise Resource Planning (ERP) system is a generic system that supports common business processes such as ordering and invoicing, manufacturing, etc.\nThese are very widely used in large companies - they represent probably the most common form of software reuse.\nThe generic core is adapted by including modules and by incorporating knowledge of business processes and rules.</div></details><details class=\"lp-source-section\" id=\"source-slide-48\"><summary>Slide 48 · The architecture of an ERP system </summary><div class=\"lp-source-text\">The architecture of an ERP system </div></details><details class=\"lp-source-section\" id=\"source-slide-49\"><summary>Slide 49 · ERP architecture</summary><div class=\"lp-source-text\">ERP architecture\nA number of modules to support different business functions. \nA defined set of business processes, associated with each module, which relate to activities in that module. \nA common database that maintains information about all related business functions. \nA set of business rules that apply to all data in the database. </div></details><details class=\"lp-source-section\" id=\"source-slide-50\"><summary>Slide 50 · ERP configuration</summary><div class=\"lp-source-text\">ERP configuration\nSelecting the required functionality from the system.\nEstablishing a data model that defines how the organization’s data will be structured in the system database.\nDefining business rules that apply to that data.\nDefining the expected interactions with external systems.\nDesigning the input forms and the output reports generated by the system.\nDesigning new business processes that conform to the underlying process model supported by the system.\nSetting parameters that define how the system is deployed on its underlying platform.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-51\"><summary>Slide 51 · Integrated application systems</summary><div class=\"lp-source-text\">Integrated application systems\nIntegrated application systems are applications that include two or more application system products and/or legacy application systems. \nYou may use this approach when there is no single application system that meets all of your needs or when you wish to integrate a new application system with systems that you already use. </div></details><details class=\"lp-source-section\" id=\"source-slide-52\"><summary>Slide 52 · Design choices</summary><div class=\"lp-source-text\">Design choices\nWhich individual application systems offer the most appropriate functionality? \nTypically, there will be several application system products available, which can be combined in different ways. \nHow will data be exchanged? \nDifferent products normally use unique data structures and formats. You have to write adaptors that convert from one representation to another. \nWhat features of a product will actually be used? \nIndividual application systems may include more functionality than you need and functionality may be duplicated across different products. </div></details><details class=\"lp-source-section\" id=\"source-slide-53\"><summary>Slide 53 · An integrated procurement system </summary><div class=\"lp-source-text\">An integrated procurement system </div></details><details class=\"lp-source-section\" id=\"source-slide-54\"><summary>Slide 54 · Service-oriented interfaces</summary><div class=\"lp-source-text\">Service-oriented interfaces\nApplication system integration can be simplified if a service-oriented approach is used. \nA service-oriented approach means allowing access to the application system’s functionality through a standard service interface, with a service for each discrete unit of functionality. \nSome applications may offer a service interface but, sometimes, this service interface has to be implemented by the system integrator. You have to program a wrapper that hides the application and provides externally visible services. </div></details><details class=\"lp-source-section\" id=\"source-slide-55\"><summary>Slide 55 · Application wrapping </summary><div class=\"lp-source-text\">Application wrapping </div></details><details class=\"lp-source-section\" id=\"source-slide-56\"><summary>Slide 56 · Application system integration problems</summary><div class=\"lp-source-text\">Application system integration problems\nLack of control over functionality and performance\nApplication systems may be less effective than they appear\nProblems with application system inter-operability\nDifferent application systems may make different assumptions that means integration is difficult\nNo control over system evolution\nApplication system vendors not system users control evolution\nSupport from system vendors\nApplication system vendors may not offer support  over the lifetime of the product</div></details><details class=\"lp-source-section\" id=\"source-slide-57\"><summary>Slide 57 · Key points</summary><div class=\"lp-source-text\">Key points\nThere are many different ways to reuse software. These range from the reuse of classes and methods in libraries to the reuse of complete application systems.\nThe advantages of software reuse are lower costs, faster software development and lower risks. System dependability is increased. Specialists can be used more effectively by concentrating their expertise on the design of reusable components.\nApplication frameworks are collections of concrete and abstract objects that are designed for reuse through specialization and the addition of new objects. They usually incorporate good design practice through design patterns.</div></details><details class=\"lp-source-section\" id=\"source-slide-58\"><summary>Slide 58 · Key points</summary><div class=\"lp-source-text\">Key points\nSoftware product lines are related applications that are developed from one or more base applications. A generic system is adapted and specialized to meet specific requirements for functionality, target platform or operational configuration.\nApplication system reuse is concerned with the reuse of large-scale, off-the-shelf systems. These provide a lot of functionality and their reuse can radically reduce costs and development time.  Systems may be developed by configuring a single, generic application system or by integrating two or more application systems.\nPotential problems with application system reuse include lack of control over functionality and performance, lack of control over system evolution, the need for support from external vendors and difficulties in ensuring that systems can inter-operate.</div></details>"}], "noAnswer": true, "sourceRange": "41–58", "appendix": true}, {"k": "R01", "answer": "One defensible request is the reuse planning factors analysis for the Mentcare appointment system, signed by the project reuse engineer, with the six factors (schedule, lifetime, team skills, criticality, domain, platform) marked for the SchedulPro decision. It distinguishes a real gap in the reuse decision from a single feature gap. Pending that evidence, state a bounded hold, adapt, or switch decision, its owner and the condition for resuming operation.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence a reuse decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "The hospital chose SchedulPro, a COTS appointment system, for the Mentcare system. Six months in, the team discovered it cannot handle the mental health workflow &mdash; mandatory waiting periods and dual-appointment booking.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Adapt the workflow, build an integration layer, or switch to a different reuse strategy?", "txt": "The SchedulPro vendor says the mental health features are &ldquo;not on the product roadmap.&rdquo; The hospital must now decide: adapt their workflow to SchedulPro&rsquo;s capabilities, build a custom integration layer that wraps SchedulPro and adds the missing features, or switch to a different approach (framework, product line, or a different COTS product). Do you adapt, integrate, or switch?"}, {"c": "mag", "lab": "UNKNOWN", "lead": "The COTS product promised rapid deployment and lower cost. The promise held for general appointments &mdash; and broke for mental health.", "txt": "The reuse decision was made on the assumption that SchedulPro could handle all appointment types. That assumption held for routine appointments and broke for mental health appointments. The team did not check the mental health workflow against the COTS product&rsquo;s capabilities before the decision. That is the gap."}]}, {"t": "principle", "txt": "Software reuse matters because it can radically reduce costs and development time. But the trade-off is always the same: you trade control over functionality and evolution for speed and cost. The goal tonight is not to avoid reuse &mdash; it is to make the trade-off visible.", "src": "P1 · p.3 · p.6"}], "timebox": "90 sec", "task": "Name the one piece of reuse evidence you would demand before letting SchedulPro run another month.", "say": "You are the project reuse engineer on call. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching and is not a report of a real incident. Every rule tonight returns to this system. The classic mistake in a case lecture is explaining the terminology before the students feel the pressure of the decision.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers &mdash; and what you must prove", "sub": "Four sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "REUSE LANDSCAPE", "txt": "What can we reuse?", "src": "P1 · p.3"}, {"c": "sand", "lab": "FRAMEWORKS", "txt": "How do frameworks work?", "src": "P1 · p.16"}, {"c": "teal", "lab": "PRODUCT LINES", "txt": "How do we adapt a family?", "src": "P1 · p.26"}, {"c": "sand", "lab": "COTS PRODUCTS", "txt": "How do we configure a COTS?", "src": "P1 · p.41"}, {"c": "teal", "lab": "ERP SYSTEMS", "txt": "What is the most common reuse?", "src": "P1 · p.47"}, {"c": "sand", "lab": "INTEGRATION", "txt": "How do we combine systems?", "src": "P1 · p.51"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish the four levels of reuse (system, application, component, object/function) and the reuse landscape approaches."}, {"c": "teal", "lab": "2", "txt": "Trace a reuse decision through the product instance development process to the trade-off."}, {"c": "teal", "lab": "3", "txt": "Specify a reuse strategy using the planning factors and the COTS-solution vs COTS-integrated distinction."}, {"c": "mag", "lab": "4", "txt": "Build a bounded reuse verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the requirements, vendor support, or integration complexity changes."}]}], "timebox": "90 sec", "task": "Note which of the six sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total, no more. This slide exists so nobody leaves tonight unsure what was in the chapter and what was not. Both the condensed and the full versions (R02, R03) remain in ISCARB Depth for anyone who wants the two-slide version back.", "appendix": true, "route": "toolkit"}, {"k": "R08", "answer": "The chapter's product instance development process (p.37) is: 1. Elicit stakeholder requirements, 2. Use existing family member as a prototype, 3. Choose closest-fit family member, 4. Re-negotiate requirements, 5. Adapt existing system, 6. Deliver new family member. The lesson for tonight: the hospital followed steps 1-3 but skipped step 4. They did not re-negotiate the mental health workflow requirements against SchedulPro's capabilities. That is the gap. The process was adequate for the steps it followed; it was incomplete for the step it skipped.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "Read the chapter&rsquo;s own product instance development process and identify the step that was skipped.", "title": "The chapter&rsquo;s own process &mdash; and what was skipped", "sub": "The source p.37 gives a six-step product instance development process. Tonight&rsquo;s crisis is a failure at step 4 &mdash; the step that catches requirements the product cannot meet.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE PROCESS (p.37)", "lead": "Six steps from elicitation to delivery.", "txt": "<b>1.</b> Elicit stakeholder requirements. <b>2.</b> Use existing family member as a prototype. <b>3.</b> Choose closest-fit family member. <b>4.</b> Re-negotiate requirements (adapt requirements to capabilities of the software). <b>5.</b> Adapt existing system (develop new modules and make changes). <b>6.</b> Deliver new family member (document key features).", "src": "P1 · p.37"}, {"c": "mag", "lab": "WHAT WAS SKIPPED", "lead": "Step 4 &mdash; re-negotiate requirements.", "txt": "The hospital followed steps 1-3: they elicited requirements, used SchedulPro as a prototype, and chose it as the closest fit. But they skipped step 4: they did not re-negotiate the mental health workflow requirements against SchedulPro&rsquo;s capabilities. They assumed SchedulPro could handle all appointment types. That assumption is the gap. The process was designed to catch exactly this &mdash; and step 4 was not done.", "src": "P1 · p.37"}]}, {"t": "wide", "c": "violet", "lab": "THE QUESTION FOR TONIGHT", "lead": "The process is correct. Step 4 was skipped. Both can be true.", "field": {"id": "airbus_lesson", "core": false, "rows": 3, "ph": "What artifact should step 4 have produced, and what would it have shown?"}}, {"t": "principle", "txt": "A six-step process that skips step 4 is a five-step process with a hole. The hole is where the requirements that cannot be met fall through."}], "timebox": "3 min", "task": "Name what artifact step 4 should have produced, and what it would have shown.", "notes": "Three minutes. The point is not that the process is wrong &mdash; it is adequate for the steps it followed. The point is that step 4 was skipped. Step 4 produces a specific artifact: a requirements-to-capabilities traceability matrix that maps each requirement to the product&rsquo;s capability to meet it. That artifact is what the team did not produce. A student who says &ldquo;the process is wrong&rdquo; has not read it; a student who says &ldquo;the process is right but step 4 was skipped&rdquo; has answered the right question. The lesson generalises: a process is only as good as the steps that are actually executed.", "appendix": true, "_iscarbRule": "RULE 08 - 60-second source case", "route": "toolkit"}, {"k": "R10", "loadOk": "The 3x3 matrix and two fields describe one reuse-risk triage record. Students classify three risks and specify one monitor and one identification tool. Shorten the activity at this cut point; never squeeze the content into a fixed height.", "answer": "Place, for example, the vendor roadmap risk (probability High, exposure High, Intolerable), the integration layer maintenance risk (probability Medium, exposure Medium, ALARP), and the wrapper divergence risk (probability Medium, exposure High, ALARP) in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity (SchedulPro version vs integration layer version compatibility), observation window (at every SchedulPro upgrade), trigger value (any breaking API change), named owner (integration layer maintainer) and fallback action (regression test the integration layer before approving the upgrade). A COTS evaluation framework or a requirements-to-capabilities traceability matrix can identify the vendor roadmap risk; retain the matrix as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it on a reuse matrix.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure if SchedulPro will ever support mental health workflow&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact you can hand to a reviewer &mdash; e.g. SchedulPro was deployed 6 months ago; the vendor says mental health features are not on the roadmap."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Not everything unknown matters &mdash; only what could change the verdict. Tonight&rsquo;s gap: will SchedulPro ever support mental health workflow, or must the hospital integrate?"}, {"c": "violet", "lab": "MONITORED", "txt": "An unknown with a measured quantity, observation window, trigger value, named owner and fallback action. The unknown becomes a risk on a schedule."}]}]}, {"t": "wide", "c": "sand", "lab": "PLACE TONIGHT&rsquo;S RISKS ON THE MATRIX", "picker": {"g": "risk3", "options": ["Vendor roadmap risk", "Integration layer maintenance", "Wrapper divergence risk", "COTS evaluation incomplete"]}, "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a reuse risk with a COTS evaluation framework or a requirements-to-capabilities traceability matrix, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; KLO 3 / GKU 8", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "One tool or method you would use to identify a reuse risk in this system &mdash; and which framework step it belongs to"}}, {"t": "principle", "txt": "Approval = evidence state + uncertainty statement + monitoring plan."}], "timebox": "3 min", "task": "Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger. <b style=\"color:var(--mag)\">You are the project reuse engineer.</b>", "notes": "This unit now carries the one Jahiziah outcome the department mapped to this course and found uncovered: applying a risk management framework and naming a tool that identifies a reuse risk. Make every student write something in that field &mdash; an empty box here is the gap staying open. Do not accept a monitored risk without a trigger value and a named owner &mdash; a monitor with no trigger is a decision to look away slowly. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the engineer who claims, the engineer who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "Reuse claims fail not because nobody chose a COTS &mdash; but because the reuse decision has no owner able to defend it.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · OWNER", "lead": "The project reuse engineer who decides.", "txt": "Names the verdict and the reuse approach. Owns the consequence. The on-call reuse engineer tonight &mdash; not the developer, not the vendor, not the AI."}, {"c": "sand", "lab": "2 · EVIDENCE OWNER", "lead": "The engineer who maintains the reuse planning factors and the COTS evaluation.", "txt": "Maintains the inspectable artifact: the reuse planning factors analysis, the COTS evaluation report, the requirements-to-capabilities matrix, the integration architecture. Cannot be the same person as the owner."}, {"c": "mag", "lab": "3 · SIGN-OFF", "lead": "The authority who accepts the residual risk.", "txt": "The hospital&rsquo;s IT steering committee or the regulator&rsquo;s reviewer. Accepts the bounded residual risk on the evidence the owner and evidence owner produced."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S GAP", "lead": "A COTS product deployed without a planning factors analysis, a vendor controlling the roadmap, no requirements-to-capabilities matrix &mdash; one project manager signing off their own COTS decision.", "txt": "The system went live with one project manager&rsquo;s signature on a COTS product that was assumed to handle all appointment types. That is owner, evidence owner and sign-off collapsed into a single person &mdash; which is why the assumption could not be audited when the gap arrived. The fix is not more testing; it is the separation above.", "field": {"id": "accountability", "core": false, "rows": 2, "ph": "For your verdict: who is the owner, who is the evidence owner, and who signs off?"}}, {"t": "principle", "txt": "Owner &ne; evidence owner &ne; sign-off. Three roles, three people."}], "timebox": "2 min", "task": "For the verdict you signed at Rule 07: name the owner, the evidence owner, and the sign-off authority.", "notes": "Two minutes. The accountability trio is the rule most assignments miss &mdash; not because students cannot name the roles, but because the same person fills all three on their project. Make every student name three different people tonight; if they cannot, the verdict is not yet dependable.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about a system in the section of the source that answers it.", "title": "What Chapter 15 trains you to do", "sub": "Six questions the system cannot answer tonight. Each one is a section of the chapter &mdash; and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "REUSE LANDSCAPE", "txt": "What can we reuse?", "src": "P1 · p.3"}, {"c": "sand", "lab": "FRAMEWORKS", "txt": "How do frameworks work?", "src": "P1 · p.16"}, {"c": "teal", "lab": "PRODUCT LINES", "txt": "How do we adapt a family?", "src": "P1 · p.26"}, {"c": "sand", "lab": "COTS PRODUCTS", "txt": "How do we configure a COTS?", "src": "P1 · p.41"}, {"c": "teal", "lab": "ERP SYSTEMS", "txt": "What is the most common reuse?", "src": "P1 · p.47"}, {"c": "sand", "lab": "INTEGRATION", "txt": "How do we combine systems?", "src": "P1 · p.51"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Ninety seconds, two answers, no more. Most students pick COTS products because that is tonight&rsquo;s crisis; the chapter&rsquo;s own answer is the reuse landscape. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition &mdash; and every one of these is something you will do to the system in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish the four levels of reuse (system, application, component, object/function) and the reuse landscape approaches."}, {"c": "teal", "lab": "2", "txt": "Trace a reuse decision through the product instance development process to the trade-off."}, {"c": "teal", "lab": "3", "txt": "Specify a reuse strategy using the planning factors and the COTS-solution vs COTS-integrated distinction."}, {"c": "mag", "lab": "4", "txt": "Build a bounded reuse verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the requirements, vendor support, or integration complexity changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone &mdash; the artifact every other outcome feeds. Colouring all five differently made them read as five unrelated topics.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: the COTS decision is accepted without a reuse planning factors analysis. JUDGMENT then fails because the team cannot show which planning factors were considered or what trade-off was made.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing a COTS failure from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Separate reuse levels.", "src": "Rule 05 · X01"}, {"c": "mag", "lab": "", "txt": "Accept, revise or reject the COTS decision.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Name a reuse level, not an intention.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the gap through the planning factors.", "src": "X02"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A patient bears what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them, so the eye pairs each card with its capability. Recolouring them breaks the pairing, which is the only reason the diagram is there.", "task": "Which capability fails first when a team trusts a COTS product without a planning factors analysis?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE &mdash; an attractive COTS promise fails not because nobody analysed it but because nobody made the planning factors analysis inspectable. Do not give the answer; let two students argue it for thirty seconds.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: Application reuse is the promise to the hospital. It holds only if the COTS product can handle all appointment types AND the mental health workflow was checked against the product's capabilities before the decision. The prediction is bounded by the missing workflow check, not by the COTS product.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which reuse level failed tonight?", "picker": {"g": "predict", "options": ["System", "Application", "Component", "Object/function"]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. COTS cannot handle mental health workflow, vendor controls roadmap, no integration layer"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment gateway, not from tonight:</i> &ldquo;This holds only if the retry queue drains faster than new requests arrive. If it does not, the queue is the thing that fails, not the payment service &mdash; and nobody has measured the drain rate under holiday load.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unmeasured</b>."}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the four reuse level names &mdash; you have not met them yet. Start from the room. A COTS appointment system was chosen for the Mentcare system. Six months in, it cannot handle mental health workflow. Ask what the COTS product promised, and which promise broke first tonight. Then say which reuse level that promise belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;. If you cannot finish it, the box that is actually empty is CONSTRAINT: name what stops you choosing differently tonight.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move; splitting them across two slides would let a student predict without deriving, which is the failure this rule exists to prevent.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes; one colour makes it read as four parallel boxes rather than four steps.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color:var(--mag)\">You are the project reuse engineer.</b>", "notes": "Three minutes. The DERIVE box is the one students skip &mdash; walk the room and refuse an empty one. This whole rule collapses if you reveal the source figure first; the reveal is the next slide and not a second earlier.", "appendix": true, "route": "toolkit"}, {"k": "H01", "noAnswer": true, "rule": "HELPER - while DERIVE needs development", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a blank derivation into a question they can answer, by starting from the situation rather than the vocabulary.", "showIf": {"thin": ["f:p_derive"], "minKey": "coachDeep"}, "title": "Three questions instead of the answer", "sub": "This slide is here because your derivation box is still blank, or holds a single clause. It does not contain the answer &mdash; the reveal is the next slide and it is worth more to you if you commit first.", "badge": {"c": "", "t": "SCAFFOLD", "s": "appears only if you need it"}, "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 &nbsp; WHAT WAS PROMISED", "lead": "Which promise to the hospital broke first tonight?", "txt": "A COTS product promises rapid deployment, lower cost, and standards compliance. Say which of those promises tonight&rsquo;s mental health workflow gap threatens first &mdash; and you have named the reuse failure without needing its textbook name."}, {"c": "sand", "lab": "2 &nbsp; WHO IS AWAKE", "lead": "A COTS decision that depends on the vendor&rsquo;s roadmap behaves differently when the vendor says no.", "txt": "It is month six. The vendor says the mental health features are &ldquo;not on the product roadmap.&rdquo; Ask what that tells you about how the gap will be <i>fixed</i>, not about how it was <i;made</i>. A reuse decision that depends on the vendor&rsquo;s roadmap behaves differently when the vendor controls the roadmap."}, {"c": "mag", "lab": "3 &nbsp; WHAT WOULD CHANGE YOUR MIND", "lead": "Finish the sentence &ldquo;I would drop this if I saw &hellip;&rdquo;.", "txt": "Finish this sentence: &ldquo;I would drop this prediction if I saw &hellip;&rdquo;. Whatever you put after &ldquo;if I saw&rdquo; is your constraint, and the reason it holds is your derivation. Write that sentence in the boxes on the previous slide."}]}, {"t": "principle", "c": "mag", "txt": "A blank box is not a gap in knowledge. It is usually a question asked at the wrong altitude."}], "timebox": "90 sec", "task": "Answer any one of the three out loud, then press &larr; and finish DERIVE properly. This slide stops appearing once DERIVE meets the shared scaffolding threshold; the instructor still checks the reasoning.", "notes": "You will usually not see this slide at all &mdash; it renders while DERIVE falls below the same scaffolding threshold used by the R05 coach, so it is the engine noticing that the room is stuck rather than you deciding in advance that it will be. Do not read all three questions aloud. Pick the one that matches what you saw while walking the room: question 1 for students who cannot start, question 2 for students who have written a reuse level name with no reasoning under it, question 3 for students who wrote a confident sentence with nothing that could falsify it. Ninety seconds, then send them back. If you are behind, skip it and walk the room instead &mdash; the questions work spoken.", "appendix": true, "route": "toolkit"}, {"k": "QA1", "noAnswer": true, "rule": "RETRIEVAL LOOP - Understand", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the phase&rsquo;s load-bearing moves from memory: the evidence request, the chapter&rsquo;s six questions, the outcome currency and the four parts of the prediction gate.", "title": "Sixty seconds on Understand", "sub": "Before the source expansion opens: four questions, memory first. Reveal only to check, then score yourself honestly.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 01 &middot; 02 &middot; 03 &middot; 05", "items": [{"q": "A COTS appointment system was chosen for the Mentcare system. Six months in, it cannot handle mental health workflow. Name the one evidence request that separates a real gap in the reuse decision from a single feature gap.", "a": "A signed reuse planning factors analysis for the Mentcare appointment system, with the six factors (schedule, lifetime, team skills, criticality, domain, platform) marked for the SchedulPro decision. Until it exists the decision stays bounded: hold, adapt, or switch, with a named owner and a condition for resuming operation."}, {"q": "Chapter 15 trains you to answer six questions about any reuse decision. Say any four.", "a": "What can we reuse (reuse landscape)? How do frameworks work (application frameworks)? How do we adapt a family (software product lines)? How do we configure a COTS (COTS products)? What is the most common reuse (ERP systems)? How do we combine systems (application system integration)?"}, {"q": "All five outcomes of this hour end in the same currency. What is it?", "a": "Evidence, not recognition &mdash; and outcome 4 is the one the others feed: a bounded reuse verdict with inspectable evidence and a structured argument."}, {"q": "The prediction gate makes you commit to four things before the reveal. Name all four.", "a": "PREDICT the reuse level &middot; state the CONSTRAINT &middot; DERIVE it from first principles &middot; NAME the principle used &mdash; then sign, so the reveal costs something."}]}], "timebox": "60 sec", "task": "Cover the answers. Say all four out loud from memory before you reveal anything &mdash; then score yourself honestly.", "notes": "Sixty seconds on the ring, and hold the discipline that makes retrieval work: the answer must come from memory, spoken or written, before any reveal. The four questions are the phase&rsquo;s load-bearing moves, not a quiz &mdash; a miss on question 1 means Rule 01 needs one more pass before the source expansion assumes it. The self-score is private and deliberately blunt: two honest misses beat four nodding yeses, and saying that once out loud is what makes the scoring honest.", "appendix": true, "route": "toolkit"}, {"k": "QA2", "noAnswer": true, "rule": "RETRIEVAL LOOP - Source", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the four reuse levels, the six benefits, the five problems, and the ten reuse landscape approaches.", "title": "Sixty seconds on the source foundations", "sub": "Checkpoint before the rest of Chapter 15: four questions from the first source cluster &mdash; memory first, reveal second.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "X01 &middot; X02 &middot; X02A &middot; X07", "items": [{"q": "Name the four levels of software reuse and say which one SchedulPro is.", "a": "<b>System reuse</b> (complete systems with multiple application programs), <b>application reuse</b> (a single application adopted without change), <b>component reuse</b> (sub-systems to single objects), <b>object and function reuse</b> (small-scale single-purpose components). SchedulPro is application reuse &mdash; a single application system adopted and configured by the hospital."}, {"q": "Name three benefits and three problems of software reuse. Which problem hit tonight?", "a": "<b>Benefits:</b> accelerated development, effective use of specialists, increased dependability, lower costs, reduced process risk, standards compliance. <b>Problems:</b> creating/maintaining/using a component library, finding/understanding/adapting components, increased maintenance costs, lack of tool support, not-invented-here syndrome. Tonight: <b>requirements adapted to COTS</b> and <b>COTS based on impossible assumptions</b> &mdash; the mental health workflow cannot be met and the assumption of independent appointments is baked in."}, {"q": "Say tonight&rsquo;s decision as the three-part sentence: approach chosen, trade-off made, approach to switch to.", "a": "The hospital chose a COTS-solution (SchedulPro) with the trade-off of low control over evolution (the vendor controls the roadmap), which failed because the mental health workflow cannot be configured into the product; switch to COTS-integrated (wrap SchedulPro and add a custom mental health module) or to an application framework (build a custom system with full control)."}, {"q": "What are the ten reuse landscape approaches? Name at least six.", "a": "<b>1.</b> Application frameworks, <b>2.</b> Application system integration, <b>3.</b> Architectural patterns, <b>4.</b> Aspect-oriented development, <b>5.</b> Component-based SE, <b>6.</b> Configurable application systems, <b>7.</b> Design patterns, <b>8.</b> ERP systems, <b>9.</b> Legacy system wrapping, <b>10.</b> Program generators. (Also: model-driven engineering, program libraries, service-oriented systems, software product lines, systems of systems.)"}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop, now over the first source cluster. Question 1 is the one that pays all semester &mdash; the four reuse levels are the vocabulary for every later discussion. If the room misses question 1, do not reteach it here: name it, and let the principle line on X01 do the work on the next pass. Sixty seconds, then move.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: a COTS-solution fails because the vendor will not add mental health features. CRISIS: the morning clinic cannot schedule mental health appointments. MAP: SchedulPro, Mentcare, vendor roadmap, hospital workflow, integration layer. TRADE-OFF: adapt workflow to COTS (loses mental health capability) vs build integration layer (gains capability but owns maintenance). EVIDENCE: reuse planning factors, COTS evaluation report, requirements-to-capabilities matrix. VERDICT: switch to COTS-integrated, with a named owner for the integration layer.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source reuse approaches into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies reuse approaches; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "A COTS appointment system cannot handle mental health workflow."}, {"c": "teal", "lab": "2 MAP", "txt": "SchedulPro, Mentcare, vendor roadmap, hospital workflow, integration layer."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Adapt workflow (loses capability) vs build integration (gains capability, owns maintenance)."}, {"c": "violet", "lab": "4 EVIDENCE", "txt": "Reuse planning factors, COTS evaluation report, requirements-to-capabilities matrix."}, {"c": "green", "lab": "5 VERDICT", "txt": "Adapt, integrate, or switch &mdash; bounded, with a monitor."}]}, {"t": "principle", "txt": "Predict -&gt; Constraint -&gt; Derive -&gt; Name"}], "timebox": "2 min", "hueOk": "CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide and in every later reference. This is the one place the palette is a vocabulary.", "task": "Run tonight&rsquo;s case through the five steps in one sentence each.", "notes": "Two minutes. The slide exists so the room can hear the flow once before they have to live in it. The most common mistake is to stop at EVIDENCE without a VERDICT &mdash; an evidence list with no decision attached is exactly the unbounded claim Rule 04 refuses.", "appendix": true, "route": "toolkit"}, {"k": "R07", "loadOk": "The decision card has six named slots plus an evidence policy line and an inspectable artifact preview. Students fill all six from tonight's system and cite a source page on each. Use vertical scrolling for the artifact preview; do not split slots across slides.", "answer": "Example verdict: SWITCH from COTS-solution to COTS-integrated tonight under the project reuse engineer. EVIDENCE: SchedulPro (COTS-solution) cannot handle mental health workflow (Ch.15 p.44); the vendor controls the roadmap and will not add the features; the product is based on the assumption of independent appointments, which is impossible to change. COUNTER-EVIDENCE: SchedulPro has been deployed successfully for 6 months for general appointments; switching to COTS-integrated means the hospital owns maintenance and the platform. UNCERTAINTY: we do not know if SchedulPro&rsquo;s architecture supports a service-oriented interface; we do not know the cost of the integration layer. VERDICT: switch to COTS-integrated, with redeployment conditional on (a) a service-oriented interface to SchedulPro, (b) a custom mental health module, (c) a maintenance plan for the integration layer.", "rule": "RULE 07 - Decision card", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Build the artifact a stranger could audit: claim, evidence, warrant, counter-evidence, uncertainty, verdict.", "title": "Your minimum inspectable artifact", "sub": "The decision card is what Assignment 1 asks for. Six slots, one signature, one evidence policy. Everything else tonight feeds this.", "blocks": [{"t": "wide", "c": "mag", "lab": "CLAIM", "lead": "State the verdict in one sentence.", "field": {"id": "dc_claim", "core": true, "rows": 2, "ph": "Adapt, integrate, or switch tonight"}}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE", "field": {"id": "dc_evidence", "core": true, "rows": 3, "ph": "What supports the claim? Cite a source page (Ch.15 p.X) or a reuse planning factor"}}, {"c": "teal", "lab": "WARRANT", "field": {"id": "dc_warrant", "core": true, "rows": 3, "ph": "Why does the evidence support the claim? Name the reuse approach or the trade-off"}}, {"c": "sand", "lab": "COUNTER-EVIDENCE", "field": {"id": "dc_counter", "core": true, "rows": 3, "ph": "What would the other side cite against this verdict?"}}, {"c": "mag", "lab": "UNCERTAINTY", "field": {"id": "dc_uncert", "core": true, "rows": 3, "ph": "What is unmeasured, assumed, or could change overnight?"}}, {"c": "green", "lab": "VERDICT", "field": {"id": "dc_verdict", "core": true, "rows": 2, "ph": "The bounded decision, the owner, the monitor, the condition to revisit"}}]}, {"t": "sign", "id": "r07_card", "fields": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_uncert", "f:dc_verdict"], "label": "I sign this verdict", "before": "Sign once all six slots carry something inspectable.", "ready": "Ready to sign.", "warn": "Signing freezes the six slots for the rest of the hour. The defense at Rule 17 changes them in a <i>later</i> box.", "done": "Read-only from here. The card you defend at Rule 17 is the one you signed here."}, {"t": "principle", "txt": "A defensible verdict names what supports it, what would reverse it, what is uncertain, and who owns it."}], "timebox": "4 min", "hueOk": "CLAIM, EVIDENCE, WARRANT, COUNTER-EVIDENCE, UNCERTAINTY, VERDICT each carry their own colour so a student can locate the same slot on the card, the rubric and the defense slide. The card is the only artifact graded tonight.", "task": "Fill all six slots from tonight&rsquo;s system, then sign. The card is what Assignment 1 asks for. <b style=\"color:var(--mag)\">You are the project reuse engineer.</b>", "notes": "Four minutes. Walk the room. The slot students skip is COUNTER-EVIDENCE: they cannot name what would reverse their own verdict, which means the verdict is not yet defensible. The signature freezes the six boxes; that is what makes Rule 17 a real defense rather than a second draft.", "appendix": true, "route": "toolkit"}, {"k": "QA3", "noAnswer": true, "rule": "RETRIEVAL LOOP - Practise", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the six card slots, the COTS-solution vs COTS-integrated distinction, the falsification standard and the anatomy of a monitor.", "title": "Sixty seconds on the decision flow", "sub": "Application checkpoint: recall the artifact you have built so far before transfer and defense continue.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 07 &middot; 09 &middot; 10 &middot; B01", "items": [{"q": "The decision card has six slots. Name them in order.", "a": "CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &middot; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it."}, {"q": "COTS-solution and COTS-integrated differ in five aspects. Name them and say which one tonight&rsquo;s decision turns on.", "a": "<b>Functionality</b> (single product vs several integrated), <b>solution basis</b> (generic vs flexible), <b>development focus</b> (configuration vs integration), <b>maintenance</b> (vendor vs owner), <b>platform</b> (vendor vs owner). Tonight&rsquo;s decision turns on <b>maintenance</b> and <b>platform</b>: switching to COTS-integrated means the hospital owns maintenance and the platform."}, {"q": "What must a claim state so the evidence can prove it wrong?", "a": "The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending."}, {"q": "Turn &ldquo;we are not sure if SchedulPro will ever support mental health workflow&rdquo; into a monitor.", "a": "A measured quantity (SchedulPro version vs integration layer version compatibility), an observation window (at every SchedulPro upgrade), a trigger value (any breaking API change), a named owner (integration layer maintainer) and a fallback action (regression test the integration layer before approving the upgrade) &mdash; the unknown becomes a monitored risk, and the 3&times;3 grid was only its evaluate step."}]}], "timebox": "60 sec", "task": "Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.", "notes": "The practise loop points at the artifact, not at trivia: every question here is a slot or a standard the decision card must carry. Question 2 is the one to watch &mdash; a COTS-integrated system that does not actually own maintenance is the false security that B01 exists to refuse. If a student cannot name all six slots, the card they will defend at Rule 17 is missing walls; send them to C for ninety seconds, not to the slides.", "appendix": true, "route": "toolkit"}, {"k": "R11", "rule": "RULE 11 - Micro-case -> local case", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Reuse one reuse-level chain in a different domain, and say what transfers and what breaks.", "title": "Scaffold first, then transfer", "sub": "Use the same reuse-level chain twice &mdash; and the second time in a different domain.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MICRO-CASE &mdash; ISCARB SCAFFOLD", "txt": "The hospital chose a COTS-solution (SchedulPro) without checking the mental health workflow. Which reuse level was chosen, what trade-off was made, and what approach should they switch to?", "field": {"id": "micro", "core": false, "rows": 3, "ph": "The reuse level, the trade-off, and the approach to switch to"}}, {"c": "mag", "lab": "TRANSFER &mdash; THE VEHICLE DISPATCH CASE", "txt": "The chapter&rsquo;s own vehicle dispatching product line (p.33-34) is a resource allocation system adapted for different customers. A new customer needs ambulance dispatch with dual-dispatch (send two vehicles to a mental health crisis). Run the same chain: which approach, what trade-off, and does your SchedulPro reasoning survive the change of domain?", "field": {"id": "transfer", "core": false, "rows": 3, "ph": "The approach, the trade-off, and what transfers or breaks between the two domains"}}]}, {"t": "wide", "c": "violet", "ic": "pin", "tag": "{{flag}} &nbsp;{{localTag}}", "lab": "WHY BOTH CASES ARE LOCAL", "lead": "The evidence has a named destination &mdash; and that is what takes &ldquo;build from scratch&rdquo; off the menu.", "txt": "Hospital systems and emergency dispatch systems are both regulated public services in {{country}}. {{accreditor}} links the field to {{bodies}}. That makes software reuse a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording."}, {"t": "principle", "txt": "Mechanism -&gt; Evidence -&gt; Decision boundary"}], "timebox": "1 min + 3 min", "task": "Solve the micro-case, then reuse the same reasoning chain on the vehicle dispatch case, and name which of {{bodiesShort}} receives your evidence. <b style=\"color:var(--mag)\">You are the project reuse engineer.</b>", "notes": "Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about hospital appointment systems has learned a case, not a capability. The vehicle dispatch case is the chapter&rsquo;s own example of a product line (p.33-34), so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.", "appendix": true, "route": "toolkit"}, {"k": "R13", "rule": "RULE 13 - Stress test your verdict", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Stress a verdict against four reuse-engineering stress tests, and say which one it fails.", "title": "What change would break your solution?", "sub": "A strong verdict is one that survives the four questions below. Most do not survive the second.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 &nbsp; REQUIREMENTS COVERAGE", "lead": "Does the approach cover all the requirements?", "txt": "A COTS-solution that covers general appointments but not mental health workflow has a coverage gap. The stress test asks: walk the requirements, and for each ask which approach addresses it."}, {"c": "mag", "lab": "2 &nbsp; VENDOR CONTROL", "lead": "Does the vendor control a feature you need?", "txt": "A COTS-solution where the vendor controls the roadmap has a vendor-control gap. The stress test asks: name every feature you need that the vendor controls, and for each ask whether it is on the roadmap."}, {"c": "sand", "lab": "3 &nbsp; INTEGRATION FEASIBILITY", "lead": "Can the systems actually be integrated?", "txt": "A COTS-integrated approach that requires a service interface the COTS product does not offer has an integration gap. The stress test asks: does the COTS product expose an API? If not, what does the wrapper look like?"}, {"c": "violet", "lab": "4 &nbsp; MAINTENANCE OWNERSHIP", "lead": "Who owns maintenance after the switch?", "txt": "A COTS-integrated approach where the hospital owns maintenance has a maintenance gap. The stress test asks: who maintains the integration layer? Who patches it when the COTS product upgrades?"}]}, {"t": "wide", "c": "mag", "lab": "PICK THE ONE YOUR VERDICT FAILS", "field": {"id": "stress", "core": true, "rows": 2, "ph": "Which stress test does your verdict fail, and what would you change to survive it?"}}, {"t": "principle", "txt": "A verdict that survives all four stress tests is either remarkable or uncommitted &mdash; usually the second."}], "timebox": "3 min", "task": "Pick the stress test your verdict fails and write what you would change to survive it.", "notes": "Three minutes. The point is to fail one of the four on purpose &mdash; almost every verdict fails vendor control or integration feasibility, and the honest student names which. A verdict that survives all four has usually not committed to an approach at all.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> (project reuse engineer) decides the verdict and names the reuse approach. The <b>evidence owner</b> maintains the planning factors and the COTS evaluation. The <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What are the four stress tests a reuse verdict must survive?", "a": "<b>Requirements coverage</b> &mdash; does the approach cover all the requirements? <b>Vendor control</b> &mdash; does the vendor control a feature you need? <b>Integration feasibility</b> &mdash; can the systems actually be integrated? <b>Maintenance ownership</b> &mdash; who owns maintenance after the switch?"}, {"q": "Your design adds a 200-parameter configuration form. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. standing defaults for low-risk parameters, a weekly batch instead of a queue, configuration simplification. Sympathy is not an answer."}, {"q": "Where may AI sit in the reuse assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts wrappers, suggests configurations, searches for components. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense, so it rehearses the four moves the defense will press: ownership, the stress tests, workload and the AI gate. Question 3 wants a design change, not sympathy &mdash; the same test Rule 14 itself applies. Question 4 is deliberately the exact sentence from the flow: AI prepares, never owns, a human signs &mdash; if the room can say that sentence cold, Rule 15 landed.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks &mdash; the mark follows the level.", "badge": {"c": "", "t": "READINESS", "s": "the gate is at Rule 20"}, "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "violet", "lab": "L1 &nbsp; ASSERTING", "lead": "A verdict with nothing behind it.", "txt": "States a verdict. Names no reuse level, no artifact, no owner. Right or wrong, it cannot be audited."}, {"c": "teal", "lab": "L2 &nbsp; REASONING", "lead": "The approach, cited &mdash; but nothing to inspect.", "txt": "Names COTS-integrated as the approach to switch to and cites the page. Still no artifact a stranger could inspect."}, {"c": "sand", "lab": "L3 &nbsp; JUSTIFYING", "lead": "A dated, owned planning factors analysis, and a stated way to be wrong.", "txt": "Names a dated, owned reuse planning factors analysis, states what would falsify the claim, and bounds the residual risk."}, {"c": "green", "lab": "L4 &nbsp; ACCOUNTABLE", "lead": "L3, and it survives the constraint changing.", "txt": "All of L3, and the verdict survives a changed constraint &mdash; or the student explains exactly why it changes, and who re-signs."}]}, {"t": "levels"}, {"t": "wide", "c": "mag", "lab": "READINESS IS A GATE, NOT A LEVEL", "lead": "A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.", "txt": "Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight &mdash; LO1, 5 marks, {{assignmentDue}} &mdash; and its evidence policy is the same one: cite the source page, or mark the claim <i>unmeasured</i> with the measurement you would need."}], "hueOk": "Four levels on one rail, each with its own colour, is the scale itself &mdash; a two-colour version stops reading as an ordered ladder.", "timebox": "90 sec", "cut": true, "task": "Pick the level you think you are at, then read the line under it: it says what your card actually carries.", "notes": "The picker is self-assessment; the line under it is read from the boxes the student actually filled and cannot be talked up. Point at the gap between the two &mdash; it is always a specific empty box, which is why this is a teaching instrument rather than a mark. The semester grade weights belong to the Week 01 kickoff and repeating them here wastes ninety seconds &mdash; this slide answers the only question that matters tonight: what separates a weak answer from a defensible one in THIS chapter. Make each student name their own level out loud; most say L2 and are right, and the honesty is the point. Keep formal scoring off the live slide, as the peer-review rule requires. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constraint will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State approach + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constraint changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the planning factors"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed approach"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE &mdash; PICK ONE", "picker": {"g": "mutation", "options": ["The vendor offers an API next quarter", "The hospital budget halves", "SchedulPro is acquired and discontinued", "The mental health module is now AI-generated"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses &mdash; and why"}}, {"t": "principle", "txt": "A strong design either survives mutation &mdash; or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the project reuse engineer.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses &mdash; stronger than a verdict that magically survives everything. Refusing to revise under a changed constraint is not robustness; it is not having reasoned in the first place.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the reuse claim without trusting your explanation, or the AI or tool that prepared it? Is the reuse planning factors analysis, the COTS evaluation report, the requirements-to-capabilities matrix, and the integration architecture all on file?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the missing feature, vendor control problem, integration risk, or maintenance gap that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session &mdash; two questions only, which is precisely why the formal rubric stays off the live slide. Students who cannot answer Q1 about someone else&rsquo;s card usually discover the same gap in their own. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 7. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line. Keep the instruments visible in sequence; use vertical scrolling for expansion.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, challenge and sign, with a named reuse approach behind it and a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use a reuse approach and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the project reuse engineer.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "X07", "answer": "Illustrative causal chain for tonight: the hospital's decision to adopt SchedulPro without checking the mental health workflow is the REUSE DECISION; SchedulPro's assumption that all appointments are independent is the IMPOSSIBLE ASSUMPTION; the vendor's refusal to add mental health features is the VENDOR CONTROL problem; the morning clinic with no mental health scheduling capability is the consequence. The reuse landscape alone does not prove this chain. Verify the planning factors analysis and the COTS evaluation report before presenting it as the actual decision.", "rule": "X07 - The words you will swap by mistake", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Distinguish COTS-solution, COTS-integrated, configurable application system, and application framework, and say which trade-off each one makes.", "title": "COTS-solution, COTS-integrated, configurable app, framework &mdash; and which one broke", "sub": "Four approaches students report interchangeably. Get these wrong and every later sentence is wrong with them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "vocabulary, not a single source page"}, "blocks": [{"t": "compare", "head": ["Approach", "What it is", "Who controls evo
