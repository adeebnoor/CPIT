<!doctype html><html lang="en" data-iscarb-standalone="1" data-course-release="20260921-classroom-v3" data-navigation="20260921-navigation-v1" data-mindmap="20260921-mindmap-v1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chapter 15: Software Reuse. Twenty source-grounded classroom slides, required source review, and one iSCARB decision artifact."><title>iSCARB · Ch15 Software Reuse</title><link rel="stylesheet" href="runtime/classroom-v3.css?v=20260921-mindmap-v1"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="../../iscarb.html">iSCARB<small>CPIT-455 · CH 15</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch15-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":15,"title":"Software Reuse","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260921-classroom-v3","filename":"Ch15-Software-Reuse.html","assignment":6,"points":5,"objectives":["Compare benefits and costs of reuse.","Select an approach using planning factors.","Explain MVC and inversion of control.","Distinguish product-line specialization and configuration.","Compare COTS solution, COTS integration and ERP."],"sections":["15.1 The reuse landscape","15.2 Application frameworks","15.3 Software product lines","15.4 Application system reuse"],"case":{"headline":"The purchased system does not fit the actual workflow.","text":"A fictional appointment product supports ordinary bookings but not required waiting periods and linked appointments. Configuration and integration are proposed; neither has been demonstrated against the full workflow.","question":"Configure, integrate or replace—and what evidence decides?","mutation":"The supplier changes a required interface and will not support the earlier version throughout the planned lifetime."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Software Reuse","phase":"START","takeaway":"Software Reuse","full":"<p>Software Reuse<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Reuse spans functions to whole systems","fig":null,"sourceRange":"3–7","bullets":[["Granularity","Reuse a function/object, component, application or complete system."],["Concept reuse","Reuse a pattern, algorithm or design idea rather than its implementation."],["Process","Refine requirements around available assets where appropriate."],["Boundary","An existing component is not automatically suitable in a new context."]],"question":"Why can reusing a design concept be preferable to copying specialized code?","answer":"The concept may be adaptable while the implementation embeds costly domain assumptions. Concept reuse still requires an implementation and verification.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"An existing component is not automatically suitable in a new context.","full":"<p><b>Granularity.<\/b> Reuse a function/object, component, application or complete system.<\/p><p><b>Concept reuse.<\/b> Reuse a pattern, algorithm or design idea rather than its implementation.<\/p><p><b>Process.<\/b> Refine requirements around available assets where appropriate.<\/p><p><b>Boundary.<\/b> An existing component is not automatically suitable in a new context.<\/p>","sourceStart":3},{"id":"X02","title":"Benefits do not remove integration costs","fig":null,"sourceRange":"8–11","bullets":[["Benefits","Faster delivery, lower development effort, specialist reuse and reduced process risk."],["Potential quality","Prior use can expose faults and encourage consistent standards."],["Costs","Finding, understanding, adapting and maintaining reused software takes effort."],["Organization","Libraries, tools and not-invented-here attitudes affect actual reuse."]],"question":"Why is a purchase price not the total cost of a reuse decision?","answer":"Integration, configuration, validation, training, maintenance and future changes may dominate the lifecycle cost.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Libraries, tools and not-invented-here attitudes affect actual reuse.","full":"<p><b>Benefits.<\/b> Faster delivery, lower development effort, specialist reuse and reduced process risk.<\/p><p><b>Potential quality.<\/b> Prior use can expose faults and encourage consistent standards.<\/p><p><b>Costs.<\/b> Finding, understanding, adapting and maintaining reused software takes effort.<\/p><p><b>Organization.<\/b> Libraries, tools and not-invented-here attitudes affect actual reuse.<\/p>","sourceStart":8},{"id":"X02A","title":"Choose deliberately from the reuse landscape","fig":"ch15_landscape","sourceRange":"12–14","bullets":[["Design reuse","Patterns, architectures, frameworks and generators."],["Implementation reuse","Libraries, components, services and wrapped legacy systems."],["Application reuse","Configurable products, ERP and application integration."],["Families","Product lines organize common features and controlled variation."]],"question":"Which reuse levels could address one authentication need and an entire appointment workflow?","answer":"A library/component/service may supply authentication; a configurable application or product-line instance may supply the workflow. The fit and constraints determine the choice.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c0bb96c1572c4e7b.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Product lines organize common features and controlled variation.","full":"<p><b>Design reuse.<\/b> Patterns, architectures, frameworks and generators.<\/p><p><b>Implementation reuse.<\/b> Libraries, components, services and wrapped legacy systems.<\/p><p><b>Application reuse.<\/b> Configurable products, ERP and application integration.<\/p><p><b>Families.<\/b> Product lines organize common features and controlled variation.<\/p>","sourceStart":12},{"id":"D15","title":"Six factors shape a reuse choice","fig":null,"sourceRange":"15","bullets":[["Project","Schedule and expected lifetime change acceptable compromises."],["Capability","Match the team’s experience to the reuse approach."],["Context","Criticality, domain and platform constrain the options."]],"question":"How does a long expected lifetime change a decision based on rapid delivery?","answer":"It increases the importance of maintainability, source access, evolution and continued support. The fastest initial option may be expensive to sustain.","rows":[["Schedule / lifetime","Delivery pressure versus long-term maintenance and evolution."],["Team expertise","Time to understand the technology and validate integration."],["Criticality / domain","Assurance needs and availability of suitable domain products."],["Platform","Compatibility with the intended execution environment."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"Criticality, domain and platform constrain the options.","full":"<p><b>Project.<\/b> Schedule and expected lifetime change acceptable compromises.<\/p><p><b>Capability.<\/b> Match the team’s experience to the reuse approach.<\/p><p><b>Context.<\/b> Criticality, domain and platform constrain the options.<\/p>","sourceStart":15},{"id":"CHECK1","title":"Checkpoint · specify the fit claim","fig":null,"sourceRange":"3–15","bullets":[["Think","A product supports normal bookings but not linked appointments."],["Pair","Identify an essential requirement and an acceptable compromise."],["Record","State what evidence would establish the proposed reuse fit."]],"question":"Why must the team distinguish “configurable” from “demonstrated to meet this workflow”?","answer":"Configuration is a capability claim. A demonstrated configured instance and relevant tests are evidence of the specific workflow.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"State what evidence would establish the proposed reuse fit.","full":"<p><b>Think.<\/b> A product supports normal bookings but not linked appointments.<\/p><p><b>Pair.<\/b> Identify an essential requirement and an acceptable compromise.<\/p><p><b>Record.<\/b> State what evidence would establish the proposed reuse fit.<\/p>","sourceStart":3},{"id":"X03","title":"Frameworks reuse architecture as well as classes","fig":"ch15_mvc","sourceRange":"16–22","bullets":[["Structure","Concrete and abstract classes provide a reusable application skeleton."],["Model","Holds application state and behavior."],["View / controller","Present state / handle interaction and coordinate updates."],["Extension","Specialize the framework without confusing its responsibilities."]],"question":"Why is an application framework more than a bag of utility functions?","answer":"It supplies an architecture and collaboration/control structure, which the application extends. A utility library usually leaves that structure to the application.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/a9758d42b58b61ab.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Specialize the framework without confusing its responsibilities.","full":"<p><b>Structure.<\/b> Concrete and abstract classes provide a reusable application skeleton.<\/p><p><b>Model.<\/b> Holds application state and behavior.<\/p><p><b>View / controller.<\/b> Present state / handle interaction and coordinate updates.<\/p><p><b>Extension.<\/b> Specialize the framework without confusing its responsibilities.<\/p>","sourceStart":16},{"id":"IOC","title":"Inversion of control: the framework calls you","fig":"ch15_inversion","sourceRange":"16–25","bullets":[["Control","The framework owns the event loop or overall control structure."],["Hook","An event invokes an extension point."],["Callback","Application-specific code supplies the selected response."],["Cost","Learning and debugging framework interactions can be difficult."]],"question":"Who calls the application’s event handler in inversion of control?","answer":"The framework invokes the registered hook/callback in response to an event; application code does not own every step of the main control flow.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/f57538bc503351a9.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Learning and debugging framework interactions can be difficult.","full":"<p><b>Control.<\/b> The framework owns the event loop or overall control structure.<\/p><p><b>Hook.<\/b> An event invokes an extension point.<\/p><p><b>Callback.<\/b> Application-specific code supplies the selected response.<\/p><p><b>Cost.<\/b> Learning and debugging framework interactions can be difficult.<\/p>","sourceStart":16},{"id":"X04","title":"A product line manages commonality and variation","fig":"ch15_basesystem","sourceRange":"26–33","bullets":[["Common architecture","Share a base rather than copy unrelated applications."],["Core","Infrastructure components normally remain common."],["Configurable / specialized","Adapt selected behavior to customers, platforms or environments."],["Control","Keep variation points intentional and test the resulting instance."]],"question":"Why does uncontrolled copying eventually make a product family harder to maintain?","answer":"Instances diverge and their common structure becomes obscure. A product line makes shared components and supported variation explicit.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/fea0ad89b97a3492.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Keep variation points intentional and test the resulting instance.","full":"<p><b>Common architecture.<\/b> Share a base rather than copy unrelated applications.<\/p><p><b>Core.<\/b> Infrastructure components normally remain common.<\/p><p><b>Configurable / specialized.<\/b> Adapt selected behavior to customers, platforms or environments.<\/p><p><b>Control.<\/b> Keep variation points intentional and test the resulting instance.<\/p>","sourceStart":26},{"id":"X05","title":"Develop a specific product instance","fig":"ch15_instance","sourceRange":"34–40","bullets":[["Requirements","Understand the customer’s particular needs."],["Select","Choose the closest existing member or base."],["Adapt","Configure or develop required components."],["Validate","Test the new instance, including interactions affected by variation."]],"question":"Which test cannot simply be inherited from the base application?","answer":"A test whose assumptions, configuration, integration or expected behavior changed in the new instance. Reuse the relevant tests, but validate the new variation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/d54935b32d14f918.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Test the new instance, including interactions affected by variation.","full":"<p><b>Requirements.<\/b> Understand the customer’s particular needs.<\/p><p><b>Select.<\/b> Choose the closest existing member or base.<\/p><p><b>Adapt.<\/b> Configure or develop required components.<\/p><p><b>Validate.<\/b> Test the new instance, including interactions affected by variation.<\/p>","sourceStart":34},{"id":"CONFIG","title":"Configuration choices bind at different times","fig":"ch15_deployconfig","sourceRange":"34–40","bullets":[["Design-time","Change the structure or supported variants during development."],["Deployment-time","Set parameters, component choices and environment-specific settings."],["Runtime","Select permitted behavior while the system is executing."],["Assurance","A configuration change can alter behavior without new source code."]],"question":"Why must a deployment parameter be versioned with the software?","answer":"The behavior under test depends on both code and configuration. A changed setting can invalidate the earlier evidence even when the binary is unchanged.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c4cb0e4e2c3e960d.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"A configuration change can alter behavior without new source code.","full":"<p><b>Design-time.<\/b> Change the structure or supported variants during development.<\/p><p><b>Deployment-time.<\/b> Set parameters, component choices and environment-specific settings.<\/p><p><b>Runtime.<\/b> Select permitted behavior while the system is executing.<\/p><p><b>Assurance.<\/b> A configuration change can alter behavior without new source code.<\/p>","sourceStart":34},{"id":"X06","title":"Configure one application—or integrate several?","fig":null,"sourceRange":"41–48","bullets":[["Configurable solution","Adapt a generic product to one organization."],["Integrated applications","Combine several products to provide the required capabilities."],["Fit","Compare requirements with what the products actually provide."],["Compromise","Unmodifiable functions and assumptions can constrain the solution."]],"question":"What extra evidence is required for an integrated application solution?","answer":"Interface, data and workflow compatibility across the products, including error handling and relevant non-functional behavior—not only isolated demonstrations.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Unmodifiable functions and assumptions can constrain the solution.","full":"<p><b>Configurable solution.<\/b> Adapt a generic product to one organization.<\/p><p><b>Integrated applications.<\/b> Combine several products to provide the required capabilities.<\/p><p><b>Fit.<\/b> Compare requirements with what the products actually provide.<\/p><p><b>Compromise.<\/b> Unmodifiable functions and assumptions can constrain the solution.<\/p>","sourceStart":41},{"id":"CHECK2","title":"Checkpoint · compare two reuse routes","fig":null,"sourceRange":"16–48","bullets":[["Think","Compare configuration with integration for the missing workflow."],["Pair","Name one benefit, one lifecycle dependency and a compatibility test."],["Record","Add the chosen mechanism and trade-off to the same card."]],"question":"What would reverse a decision to integrate the two products?","answer":"Failure of an essential data/workflow contract, unacceptable assurance cost or unsupported evolution could defeat the choice; state the specific evidence.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the chosen mechanism and trade-off to the same card.","full":"<p><b>Think.<\/b> Compare configuration with integration for the missing workflow.<\/p><p><b>Pair.<\/b> Name one benefit, one lifecycle dependency and a compatibility test.<\/p><p><b>Record.<\/b> Add the chosen mechanism and trade-off to the same card.<\/p>","sourceStart":16},{"id":"R18","title":"ERP joins organizational processes through shared data","fig":"ch15_erparch","sourceRange":"49–53","bullets":[["Architecture","Modules implement organizational functions around shared information."],["Configuration","Select modules and adapt rules, workflows and reports."],["Process fit","The organization may need to change how it works."],["Validation","Check cross-module consequences, permissions and data consistency."]],"question":"Why can configuring an ERP module affect another department?","answer":"Modules may share data and business rules. A locally useful change can alter a dependent workflow or the meaning of information elsewhere.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/7e06c30e25ad961a.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Check cross-module consequences, permissions and data consistency.","full":"<p><b>Architecture.<\/b> Modules implement organizational functions around shared information.<\/p><p><b>Configuration.<\/b> Select modules and adapt rules, workflows and reports.<\/p><p><b>Process fit.<\/b> The organization may need to change how it works.<\/p><p><b>Validation.<\/b> Check cross-module consequences, permissions and data consistency.<\/p>","sourceStart":49},{"id":"R09","title":"Wrapping hides an interface—not every assumption","fig":"ch15_wrapping","sourceRange":"54–58","bullets":[["Wrapper","Expose a usable interface around an existing system."],["Integration","Reconcile data, control and error-handling differences."],["Limits","A wrapper does not give control over internal behavior or vendor evolution."],["Evidence","Check the intended workflow through the real wrapped boundary."]],"question":"Why does a successful API call not prove a successful integrated business transaction?","answer":"The call may have different state, ordering, failure or data semantics from the whole workflow. Verify the complete required outcome.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/87683e7a3fcd3641.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Check the intended workflow through the real wrapped boundary.","full":"<p><b>Wrapper.<\/b> Expose a usable interface around an existing system.<\/p><p><b>Integration.<\/b> Reconcile data, control and error-handling differences.<\/p><p><b>Limits.<\/b> A wrapper does not give control over internal behavior or vendor evolution.<\/p><p><b>Evidence.<\/b> Check the intended workflow through the real wrapped boundary.<\/p>","sourceStart":54},{"id":"LIFECYCLE","title":"Reuse transfers some risks to external dependencies","fig":null,"sourceRange":"54–58","bullets":[["Functionality","Needed behavior may be outside your control."],["Interoperation","Products can embed incompatible assumptions."],["Evolution","Suppliers can change interfaces and release schedules independently."],["Support","Plan how problems are diagnosed when ownership is split."]],"question":"What belongs in the decision before the supplier changes its interface?","answer":"A documented interface/version assumption, compatibility check, support/ownership path and a feasible response such as migration, adaptation or a bounded fallback.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Plan how problems are diagnosed when ownership is split.","full":"<p><b>Functionality.<\/b> Needed behavior may be outside your control.<\/p><p><b>Interoperation.<\/b> Products can embed incompatible assumptions.<\/p><p><b>Evolution.<\/b> Suppliers can change interfaces and release schedules independently.<\/p><p><b>Support.<\/b> Plan how problems are diagnosed when ownership is split.<\/p>","sourceStart":54},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"The supplier changes a required interface and will not support the earlier version throughout the planned lifetime.","bullets":[["Reassess","Explain the effect of the changed constraint."],["Evidence","Name the observation that would defeat the revised claim."],["Ownership","State who reviews and accepts the bounded scope."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role.","nodes":[["Initial claim","Bounded by assumptions"],["New condition","An assumption changes"],["Revised verdict","A reason and next evidence"]],"full":"<p>The supplier changes a required interface and will not support the earlier version throughout the planned lifetime.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Configure, integrate or replace—and what evidence decides?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test.","no":1,"at":"CHECK1","seconds":180},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case.","pair":"Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design.","no":2,"at":"CHECK2","seconds":180},{"title":"Change the constraint; revise and own","think":"The supplier changes a required interface and will not support the earlier version throughout the planned lifetime.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; name the responsible role.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X05"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X05","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Reuse approaches and planning","range":"12–15"},{"title":"Frameworks and inversion of control","range":"16–21"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Reuse benefits, problems and planning","start":3,"end":15,"units":["X01","X02","X02A","D15","CHECK1"]},{"title":"Frameworks, MVC and inversion of control","start":16,"end":25,"units":["X03","IOC","CHECK2"]},{"title":"Product lines and configuration","start":26,"end":40,"units":["X04","X05","CONFIG","CHECK2"]},{"title":"Application reuse, ERP and integration","start":41,"end":58,"units":["X06","CHECK2","R18","R09","LIFECYCLE"]}],"sourceCount":58,"original":"sources/Ch15-Original.pptx","textbook":"sources/Ch15-Textbook.pdf","bookPages":27,"quiz":[{"q":"Which can be a cost of reuse?","options":["Adaptation and integration effort","No need to inspect assumptions","Guaranteed lower total cost"],"answer":0,"why":"Reuse can reduce development effort but introduce adaptation, integration and lifecycle costs."},{"q":"Which is a relevant planning factor?","options":["Logo color","Expected lifetime and platform constraints","Number of marketing pages"],"answer":1,"why":"Planning considers schedule, lifetime, team, criticality, domain and platform."},{"q":"A framework calling user extensions illustrates:","options":["No dependency","Database replication","Inversion of control"],"answer":2,"why":"The framework owns the control structure and calls extension points."},{"q":"Product-line specialization manages:","options":["Common features and controlled variation across a family","Only a single unchangeable binary","Only database backups"],"answer":0,"why":"A product line separates shared structure from deliberate variation."},{"q":"An ERP application primarily supports:","options":["Only one reusable function","Integrated organizational processes through a configurable application","Proof of every business rule"],"answer":1,"why":"Large application reuse still requires process fit, configuration and validation."}],"alignment":[{"objective":"Compare benefits and costs of reuse.","evidence":"Explain and demonstrate: Compare benefits and costs of reuse.","field":"COMPARE / measure · practice/reviewer opportunity, not automatic attainment"},{"objective":"Select an approach using planning factors.","evidence":"Explain and demonstrate: Select an approach using planning factors.","field":"FIT + BOUND · practice/reviewer opportunity, not automatic attainment"},{"objective":"Explain MVC and inversion of control.","evidence":"Explain and demonstrate: Explain MVC and inversion of control.","field":"technical + sourceUse · practice/reviewer opportunity, not automatic attainment"},{"objective":"Distinguish product-line specialization and configuration.","evidence":"Explain and demonstrate: Distinguish product-line specialization and configuration.","field":"COMPARE + ACT · practice/reviewer opportunity, not automatic attainment"},{"objective":"Compare COTS solution, COTS integration and ERP.","evidence":"Explain and demonstrate: Compare COTS solution, COTS integration and ERP.","field":"REFIT + EVIDENCE · practice/reviewer opportunity, not automatic attainment"}],"artifact":"Build an options/constraints comparison, workflow-fit test and justified lifecycle choice.","bridge":"Build an options/constraints comparison, workflow-fit test and justified lifecycle choice. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"X05","workload":"Consider retraining, configuration work and support burden when an organization changes to a reused application.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ"},"roadmap":{"question":"Which reuse approach fits the requirements and lifetime?","connection":"Planning constraints guide the choice of reusable structure, product family or complete application; integration must still be checked.","inClass":"Compare reuse routes against workflow and lifecycle constraints.","deliverable":"An options comparison and justified reuse choice.","success":"Explain both the fit and the cost of adapting what you inherit.","branches":[{"verb":"Survey what can be reused","label":"The reuse landscape","detail":"Functions → components → applications → systems","target":"X01","units":["X01","X02A"]},{"verb":"Choose under constraints","label":"Benefits, costs and planning","detail":"Six planning factors · support and lifetime","target":"D15","units":["X02","D15","CHECK1","LIFECYCLE"]},{"verb":"Extend reusable architecture","label":"Application frameworks","detail":"MVC · inheritance · inversion of control","target":"X03","units":["X03","IOC"]},{"verb":"Manage commonality and variation","label":"Software product lines","detail":"Shared core · specialization · configuration","target":"X04","units":["X04","X05","CONFIG"]},{"verb":"Configure or integrate","label":"Application system reuse","detail":"COTS solutions / integration · ERP · wrapping","target":"X06","units":["X06","CHECK2","R18","R09","APPLY"]}]}}</script><script src="runtime/classroom-v3.js?v=20260921-mindmap-v1" defer></script></body></html>
