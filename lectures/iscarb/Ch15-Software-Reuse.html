benefits and costs of reuse.","Select an approach using planning factors.","Explain MVC and inversion of control.","Distinguish product-line specialization and configuration.","Compare COTS solution, COTS integration and ERP."],"sections":["15.1 The reuse landscape","15.2 Application frameworks","15.3 Software product lines","15.4 Application system reuse"],"case":{"headline":"The purchased system does not fit the actual workflow.","text":"A fictional appointment product supports ordinary bookings but not required waiting periods and linked appointments. Configuration and integration are proposed; neither has been demonstrated against the full workflow.","question":"Configure, integrate or replace—and what evidence decides?","mutation":"The supplier changes a required interface and will not support the earlier version throughout the planned lifetime. The supplier also announces that the language-model version the team tested will be retired. Its replacement answers the same prompts differently.","lens":"The team also proposes reusing a vendor-hosted language model to draft booking replies and suggest linked appointments. It performed well in a demo on ten sample requests. Hold that question: after the reuse routes, one slide weighs how to reuse a model.","fictional":true,"answerKey":"a configured instance demonstrated on the full workflow"},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Software Reuse","phase":"START","takeaway":"Software Reuse","full":"<p>Software Reuse<\/p>","sourceStart":1,"minutes":2,"tier":"core"},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1,"minutes":1,"tier":"core"},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1,"minutes":1.5,"tier":"core"},{"id":"X01","title":"Reuse spans functions to whole systems","fig":null,"sourceRange":"3–7","bullets":[["Granularity","Reuse a function/object, component, application or complete system."],["Concept reuse","Reuse a pattern, algorithm or design idea rather than its implementation."],["Process","Refine requirements around available assets where appropriate."],["Boundary","An existing component is not automatically suitable in a new context."]],"question":"Why can reusing a design concept be preferable to copying specialized code?","answer":"The concept may be adaptable while the implementation embeds costly domain assumptions. Concept reuse still requires an implementation and verification.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Reuse ranges from single functions to whole systems, and each level carries different assumptions.","full":"<p>Most engineering disciplines build systems from existing components, and software engineering has moved the same way: reuse-based development is now the norm for business systems. Reuse happens at several scales. You can reuse a <b>complete system<\/b>, possibly made of several applications; an <b>application<\/b>, either unchanged or as part of an application family; a <b>component<\/b>, from a subsystem to a single object; or small <b>objects and functions<\/b> from a library.<\/p><p>You can also reuse <b>concepts<\/b> rather than code: a design pattern, an algorithm or an architectural idea, which you then implement for your own context. Reuse changes the development process too: requirements may be adjusted to fit what existing software offers. An existing component is not automatically suitable in a new setting, because it carries the assumptions of the context it was built for.<\/p>","sourceStart":3,"notes":"Ask which reuse level the appointment product represents: application reuse. Then ask what assumptions a booking product might carry—single appointments, no waiting periods—that clash with the required workflow.","minutes":1.5,"tier":"core","concept":"levels of reuse","answerKey":"a concept adapts; copied code carries its assumptions","commonError":"Students treat an existing component as suitable by default. Ask which assumption of the old context the new one breaks."},{"id":"X02","title":"Benefits do not remove integration costs","fig":null,"sourceRange":"8–11","bullets":[["Benefits","Faster delivery, lower development effort, specialist reuse and reduced process risk."],["Potential quality","Prior use can expose faults and encourage consistent standards."],["Costs","Finding, understanding, adapting and maintaining reused software takes effort."],["Organization","Libraries, tools and not-invented-here attitudes affect actual reuse."]],"question":"Why is a purchase price not the total cost of a reuse decision?","answer":"Integration, configuration, validation, training, maintenance and future changes may dominate the lifecycle cost.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Reuse saves development effort, but finding, adapting and maintaining reused software has its own costs.","full":"<p>The chapter lists the benefits of reuse: accelerated development, effective use of specialists who package their knowledge in reusable software, increased dependability because the software has been tried and tested, lower development costs, reduced process risk because the cost of existing software is known, and easier compliance with standards such as user-interface conventions.<\/p><p>It also lists the problems: the cost of creating and maintaining a component library and of finding, understanding and adapting reusable components; increased maintenance costs when source code is unavailable and the software evolves separately; lack of tool support for development with reuse; and the “not-invented-here” syndrome, where engineers prefer to rewrite components they do not trust. The purchase price of a product is therefore only one part of the lifecycle cost; integration, configuration, validation, training and future changes may be larger.<\/p>","sourceStart":8,"notes":"Ask the class to estimate which costs of the appointment product are hidden in its price. Integration and validation of the waiting-period workflow are the answers to push for.","minutes":1.5,"tier":"optional","concept":"lifecycle cost of reuse","answerKey":"integration, validation and maintenance dominate","commonError":"Students compare purchase prices only. List the costs after purchase: finding, understanding, adapting, validating and maintaining."},{"id":"X02A","title":"Choose deliberately from the reuse landscape","fig":"ch15_landscape","sourceRange":"12–14","bullets":[["Design reuse","Patterns, architectures, frameworks and generators."],["Implementation reuse","Libraries, components, services and wrapped legacy systems."],["Application reuse","Configurable products, ERP and application integration."],["Families","Product lines organize common features and controlled variation."]],"question":"Which reuse levels could address one authentication need and an entire appointment workflow?","answer":"A library/component/service may supply authentication; a configurable application or product-line instance may supply the workflow. The fit and constraints determine the choice.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c0bb96c1572c4e7b.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"The reuse landscape runs from design ideas to complete applications; choose the level that fits the need.","full":"<p>The reuse landscape covers many approaches. At the design level: architectural and design patterns, application frameworks and program generators. At the implementation level: program libraries, component-based development, services and legacy systems wrapped behind new interfaces. At the application level: configurable application systems, ERP systems and integrated application systems. Software product lines sit across these, organizing a family of related applications around a common architecture and controlled variation.<\/p><p>Different needs in one project can call for different levels. Authentication might come from a library, component or service, while the whole appointment workflow might come from a configurable application or a product-line instance. The choice depends on how well each option fits and on the constraints discussed on the next slide.<\/p>","sourceStart":12,"notes":"Show the landscape figure and ask pairs to place two needs from our case on it: authentication and the full booking workflow. The point is that one project mixes reuse levels.","minutes":1.5,"tier":"core","concept":"matching reuse level to need","answerKey":"a component for authentication; a configurable product for the workflow","commonError":"Students pick one reuse level for every need. One system can combine a library, a framework and a configured product.","sourceFigs":[12,13,14]},{"id":"D15","title":"Six factors shape a reuse choice","fig":null,"sourceRange":"15","bullets":[["Project","Schedule and expected lifetime change acceptable compromises."],["Capability","Match the team’s experience to the reuse approach."],["Context","Criticality, domain and platform constrain the options."]],"question":"How does a long expected lifetime change a decision based on rapid delivery?","answer":"It increases the importance of maintainability, source access, evolution and continued support. The fastest initial option may be expensive to sustain.","rows":[["Schedule / lifetime","Delivery pressure versus long-term maintenance and evolution."],["Team expertise","Time to understand the technology and validate integration."],["Criticality / domain","Assurance needs and availability of suitable domain products."],["Platform","Compatibility with the intended execution environment."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"Schedule, lifetime, team, criticality, domain and platform decide which reuse approach fits.","full":"<p>The chapter lists six factors to consider when planning reuse:<\/p><ul><li>the <b>development schedule<\/b>—tight deadlines favor reusing complete systems;<\/li><li>the <b>expected software lifetime<\/b>—long-lived systems need maintainability and continued support, which may rule out components without source code;<\/li><li>the <b>background, skills and experience of the team<\/b>—every reuse technology takes time to understand;<\/li><li>the <b>criticality of the software and its non-functional requirements<\/b>—critical systems may need source code and evidence that reused parts are dependable;<\/li><li>the <b>application domain<\/b>—some domains have many suitable products, others few;<\/li><li>the <b>execution platform<\/b>—some components run only on particular platforms.<\/li><\/ul><p>A long expected lifetime changes a decision made for fast delivery: the quickest option may be the most expensive to sustain.<\/p>","sourceStart":15,"notes":"Give each pair two of the six factors and ask how each affects the appointment decision. Lifetime and domain usually decide it.","minutes":1.5,"tier":"core","concept":"planning factors","answerKey":"lifetime raises the weight of maintainability and support","commonError":"Students choose the fastest route and ignore lifetime. Ask who maintains the reused software in year five.","lists":[{"source":15,"title":"Reuse planning factors","items":["The development schedule for the software","The expected software lifetime","The background, skills and experience of the development team","The criticality of the software and its non-functional requirements","The application domain","The execution platform for the software"]}]},{"id":"CHECK1","title":"Checkpoint · specify the fit claim","fig":null,"sourceRange":"3–15","bullets":[["Think","A product supports normal bookings but not linked appointments."],["Pair","Identify an essential requirement and an acceptable compromise."],["Record","State what evidence would establish the proposed reuse fit."]],"question":"Why must the team distinguish “configurable” from “demonstrated to meet this workflow”?","answer":"Configuration is a capability claim. A demonstrated configured instance and relevant tests are evidence of the specific workflow.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"“Configurable” is a capability claim; only a demonstrated instance shows the workflow fits.","full":"<p>A product that supports normal bookings but not linked appointments may still be configurable enough—or it may not. A vendor’s statement that the product is configurable describes what the product could do. Evidence of fit comes from a configured instance that runs the real workflow, including waiting periods and linked appointments, with tests that show the required outcomes. A good answer names the essential requirement, the compromise the organization could accept, and the evidence that would establish the fit.<\/p>","sourceStart":3,"notes":"Ask pairs to separate one essential requirement from one acceptable compromise. Push anyone who accepts the vendor’s word to name the test that would demonstrate it.","minutes":1,"tier":"core","concept":"capability versus demonstrated fit","answerKey":"a demonstrated configured instance with tests","commonError":"Students accept “configurable” from the brochure as evidence. Ask for the configured instance that ran the waiting-period workflow."},{"id":"X03","title":"Frameworks reuse architecture as well as classes","fig":"ch15_mvc","sourceRange":"16–22","bullets":[["Structure","Concrete and abstract classes provide a reusable application skeleton."],["Model","Holds application state and behavior."],["View / controller","Present state / handle interaction and coordinate updates."],["Extension","Specialize the framework without confusing its responsibilities."]],"question":"Why is an application framework more than a bag of utility functions?","answer":"It supplies an architecture and collaboration/control structure, which the application extends. A utility library usually leaves that structure to the application.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/a9758d42b58b61ab.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"A framework reuses an architecture: you extend its classes, and it provides the structure.","full":"<p>A framework is an integrated set of software artifacts—classes, objects and components—that collaborate to provide a reusable architecture for a family of related applications. Frameworks sit between system reuse and component reuse: they are a subsystem design made of abstract and concrete classes and their interfaces, and you build an application by adding components and instantiating the abstract classes.<\/p><p>Web application frameworks are a common example. They are built around the <b>Model–View–Controller<\/b> pattern: the model holds the application state and behavior, views present it, and controllers handle user interaction and coordinate updates. They also supply classes for security (login and access), dynamic web pages, database integration, session management and user interaction. A framework is more than a library of utilities because it defines how the parts of the application collaborate.<\/p>","sourceStart":16,"notes":"Draw MVC for the booking page: booking data in the model, the calendar as a view, the request handler as the controller. Ask where a waiting-period rule belongs; students often put it in the view.","minutes":1.5,"tier":"optional","concept":"framework as architecture","answerKey":"it supplies the structure the application extends","commonError":"Students describe a framework as a big library. A library leaves the control structure to you; a framework supplies it.","sourceFigs":[21]},{"id":"IOC","title":"Inversion of control: the framework calls you","fig":"ch15_inversion","sourceRange":"16–25","bullets":[["Control","The framework owns the event loop or overall control structure."],["Hook","An event invokes an extension point."],["Callback","Application-specific code supplies the selected response."],["Cost","Learning and debugging framework interactions can be difficult."]],"question":"Who calls the application’s event handler in inversion of control?","answer":"The framework invokes the registered hook or callback in response to an event. Application code does not own every step of the main control flow.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/f57538bc503351a9.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"In a framework, the framework owns the flow of control and calls your code when events happen.","full":"<p>To implement a system with a framework, you add concrete classes that inherit from the framework’s abstract classes and you define <b>callbacks<\/b>—methods called in response to events the framework recognizes. The framework objects, not the application objects, are responsible for control. Schmidt and colleagues call this <b>inversion of control<\/b>.<\/p><p>When an event arrives from the user interface or the database, a framework object calls a <b>hook method<\/b>, which you configure to call your application code. For example, the framework handles a mouse click and calls the hook you linked to your response. The benefit is a ready-made architecture; the cost is that frameworks are complex and take time to learn, and debugging is harder because much of the control flow is hidden inside the framework.<\/p>","sourceStart":16,"notes":"Ask who calls the booking handler when a user submits a form. The answer—the framework—surprises students used to writing their own main loop. Mention debugging cost before they start their first framework project.","minutes":1.5,"tier":"core","concept":"inversion of control","answerKey":"the framework calls the registered callback","commonError":"Students say the application calls the framework. In a framework the direction is reversed: the framework calls your code."},{"id":"X04","title":"A product line manages commonality and variation","fig":"ch15_basesystem","sourceRange":"26–33","bullets":[["Common architecture","Share a base rather than copy unrelated applications."],["Core","Infrastructure components normally remain common."],["Configurable / specialized","Adapt selected behavior to customers, platforms or environments."],["Control","Keep variation points intentional and test the resulting instance."]],"question":"Why does uncontrolled copying eventually make a product family harder to maintain?","answer":"Instances diverge and their common structure becomes obscure. A product line makes shared components and supported variation explicit.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/fea0ad89b97a3492.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"A product line shares a core architecture and controls how each instance varies.","full":"<p>A software product line, or application family, is a set of applications with a common architecture and shared components, each specialized for different requirements. Adapting an instance may involve configuring components, adding new ones, selecting from a component library or modifying components.<\/p><p>The base application has three kinds of component: <b>core<\/b> components that provide infrastructure and are not usually modified; <b>configurable<\/b> components that can be specialized, sometimes through a built-in configuration language; and <b>specialized, domain-specific<\/b> components that may be replaced in a new instance. Product lines differ from frameworks: they need not be object-oriented, and they embed domain and platform knowledge rather than only technical support. Without this structure, teams copy and modify whole applications, the copies diverge, and the common structure becomes impossible to maintain.<\/p>","sourceStart":26,"notes":"Ask which parts of an appointment system would be core and which would vary between a clinic and a university. Waiting-period rules are a good candidate for a configurable component.","minutes":1.5,"tier":"core","concept":"commonality and variation","answerKey":"copies diverge; a product line keeps variation explicit","commonError":"Students equate a product line with copy-and-edit. Ask where the shared core lives and who controls the variation points."},{"id":"X05","title":"Develop a specific product instance","fig":"ch15_instance","sourceRange":"34–40","bullets":[["Requirements","Understand the customer’s particular needs."],["Select","Choose the closest existing member or base."],["Adapt","Configure or develop required components."],["Validate","Test the new instance, including interactions affected by variation."]],"question":"Which product-line component must be adapted, and what must be validated afterwards?","answer":"The vehicle-location component at the resource-management level, because the radio system changes how location data arrives. Validate the dispatch workflow end to end on the new instance, not only the adapted component.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/d54935b32d14f918.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Build a new instance from the closest family member, then validate what the variation changed.","full":"<p>Product lines can be specialized in four ways: for different <b>platforms<\/b>, different <b>operating environments<\/b>, different customers’ <b>functional<\/b> requirements, and different business <b>processes<\/b>. The chapter’s vehicle-dispatching family shows how an instance combines components for operator displays, authentication and reporting, vehicle location and dispatch, and incident logging.<\/p><p>Developing a new instance follows five steps: elicit the stakeholders’ requirements, using an existing family member as a prototype; choose the closest-fit family member; renegotiate requirements where the software cannot reasonably meet them; adapt the existing system by developing new modules and changing others; and deliver the new member, documenting its key features for future instances. Tests can be reused, but any test whose configuration, integration or expected behavior changed must be validated again for the new instance.<\/p>","sourceStart":34,"notes":"Walk the five steps with a clinic that needs linked appointments. Ask which requirement might be renegotiated and which test cannot simply be inherited from the base system.","minutes":2,"tier":"core","commonError":"Students inherit the base tests unchanged. A test whose assumptions changed with the variation must be rewritten.","concept2":"validating the new instance","answerKey2":"tests whose assumptions changed with the variation","question2":"Which test cannot simply be inherited from the base application?","answer2":"A test whose assumptions, configuration, integration or expected behaviour changed in the new instance. Reuse the relevant tests, but validate the new variation.","transfer":true,"concept":"adapting and validating a product instance","answerKey":"adapt vehicle location, then validate the whole dispatch instance"},{"id":"CONFIG","title":"Configuration choices bind at different times","fig":"ch15_deployconfig","sourceRange":"34–40","bullets":[["Design-time","Change the structure or supported variants during development."],["Deployment-time","A configuration tool records settings that the running system reads."],["Deployment levels","Select components, define workflows and rules, then set parameters."],["Assurance","A configuration change can alter behavior without new source code."]],"question":"Why must a deployment parameter be versioned with the software?","answer":"The behavior under test depends on both code and configuration. A changed setting can invalidate the earlier evidence even when the binary is unchanged.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c4cb0e4e2c3e960d.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"Configuration changes behavior without changing code, so it must be versioned and tested like code.","full":"<p>The chapter distinguishes two kinds of configuration. In <b>design-time configuration<\/b>, the organization developing the product line modifies the common core—developing, selecting or adapting components—to create a new system for a customer. In <b>deployment-time configuration<\/b>, a generic system is designed to be configured by a customer or consultant, using a configuration tool that records the settings in a configuration database or files; the running system reads them to specialize its behavior.<\/p><p>Deployment-time configuration has three levels: selecting components, defining workflows and validation rules, and setting parameters such as field lengths or hardware characteristics. For large systems it can take months to configure and test. Because behavior depends on code and configuration together, a changed setting can invalidate earlier test evidence even when the program is unchanged, so configuration must be versioned with the software.<\/p>","sourceStart":34,"notes":"Ask what would happen to last month’s test results if someone changed the maximum waiting period in the configuration file. The answer justifies versioning configuration alongside code.","minutes":1.5,"tier":"core","concept":"configuration as versioned behaviour","answerKey":"behaviour depends on code and settings together","commonError":"Students treat a settings change as risk-free because the binary is unchanged. The earlier test evidence may no longer apply."},{"id":"X06","title":"Configure one application—or integrate several?","fig":null,"sourceRange":"41–48","bullets":[["Configurable solution","Adapt a generic product to one organization."],["Integrated applications","Combine several products to provide the required capabilities."],["Fit","Compare requirements with what the products actually provide."],["Compromise","Unmodifiable functions and assumptions can constrain the solution."]],"question":"What extra evidence is required for an integrated application solution?","answer":"Interface, data and workflow compatibility across the products, including error handling and relevant non-functional behavior—not only isolated demonstrations.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Configure one application or integrate several: either way, the products’ assumptions limit the fit.","full":"<p>An application system product can be adapted for different customers without changing its source code, using built-in configuration mechanisms. Reusing one brings benefits—faster deployment of a reliable system, visible functionality that is easier to judge, fewer development risks and a business that can focus on its core activity—but also problems. Requirements usually have to adapt to the product; the product may rest on assumptions that are practically impossible to change; choosing the right product is hard when documentation is poor; local expertise may be lacking; and the vendor controls support and evolution.<\/p><p>A <b>configurable application system<\/b> adapts one generic product to an organization. An <b>integrated application system<\/b> combines two or more products, or products and legacy systems, when no single product meets all needs. Integration adds a further question of evidence: the products must be shown to work together on data, workflow, error handling and non-functional behavior, not only in isolated demonstrations.<\/p>","sourceStart":41,"notes":"Ask whether our case is a configuration or an integration decision. Both are on the table; make pairs list the extra evidence integration would need.","minutes":1.5,"tier":"core","concept":"evidence for an integrated solution","answerKey":"interface, data and workflow compatibility across products","commonError":"Students accept two separate demonstrations as proof of integration. Ask for the test that crosses the product boundary."},{"id":"CHECK2","title":"Checkpoint · compare two reuse routes","fig":null,"sourceRange":"16–48","bullets":[["Think","Compare configuration with integration for the missing workflow."],["Pair","Name one benefit, one lifecycle dependency and a compatibility test."],["Record","Add the chosen mechanism and trade-off to the same card."]],"question":"What would reverse a decision to integrate the two products?","answer":"Failure of an essential data/workflow contract, unacceptable assurance cost or unsupported evolution could defeat the choice; state the specific evidence.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Compare reuse routes by fit, lifecycle dependency and the test that would prove compatibility.","full":"<p>Configuring the purchased product keeps one vendor and one data model but may not support linked appointments. Integrating a second product may add the missing workflow but introduces a data and workflow contract between two systems that evolve independently. A good comparison names one benefit, one lifecycle dependency (such as vendor interface changes) and the compatibility test that would decide. It also states what would reverse the decision—for example, an essential workflow contract that the integration cannot meet.<\/p>","sourceStart":16,"notes":"Ask each pair what evidence would make them abandon their chosen route. That reversal condition is what the assignment calls the boundary.","minutes":1,"tier":"core","concept":"what reverses an integration decision","answerKey":"a failed data or workflow contract","commonError":"Students cannot name what would reverse their choice. Ask for one specific contract failure or support gap."},{"id":"R18","title":"ERP joins organizational processes through shared data","fig":"ch15_erparch","sourceRange":"49–53","bullets":[["Architecture","Modules implement organizational functions around shared information."],["Configuration","Select modules and adapt rules, workflows and reports."],["Process fit","The organization may need to change how it works."],["Validation","Check cross-module consequences, permissions and data consistency."]],"question":"Why can configuring an ERP module affect another department?","answer":"Modules may share data and business rules. A locally useful change can alter a dependent workflow or the meaning of information elsewhere.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/7e06c30e25ad961a.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"An ERP system shares one database and rule set across departments, so a local change can spread.","full":"<p>An ERP system is a large configurable application that supports common business processes across an organization. Its architecture has a number of modules supporting different business functions, a defined set of business processes for each module, a common database for all related functions, and business rules that apply to all the data.<\/p><p>Configuring an ERP system involves selecting the required functionality, establishing the data model, defining business rules, defining interactions with external systems, designing input forms and output reports, designing new business processes that conform to the system’s underlying process model, and setting parameters. The organization often has to change how it works to fit the product. Because modules share data and rules, a change that helps one department can alter a workflow or the meaning of data in another, so validation must cover cross-module effects and permissions.<\/p>","sourceStart":49,"notes":"Ask how changing the booking rules in an ERP module could affect finance or reporting. Students tend to test only the module they changed.","minutes":1.5,"tier":"optional","concept":"shared data and rules in ERP","answerKey":"a local change alters a dependent workflow","commonError":"Students configure one module as if it were isolated. Ask which other department reads the same record or rule."},{"id":"R09","title":"Wrapping and lifecycle risk","fig":"ch15_wrapping","sourceRange":"54–58","bullets":[["Wrapper","Expose a usable interface around an existing system."],["Integration","Reconcile data, control and error-handling differences."],["Functionality","Needed behavior may be outside your control."],["Interoperation","Products can embed incompatible assumptions."]],"question":"Why does a successful API call not prove a successful integrated business transaction?","answer":"The call may have different state, ordering, failure or data semantics from the whole workflow. Verify the complete required outcome.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/87683e7a3fcd3641.jpg","caption":"Sommerville Ch.15 · preserved source illustration","takeaway":"A wrapper hides a product’s interface, but not its assumptions, its evolution or its support risks.","full":"<p>Integration is simpler when each product offers a standard service interface, with one service for each unit of functionality. When it does not, the integrator writes a <b>wrapper<\/b> that hides the application and exposes the required services. Integration also involves design choices: which products offer the most suitable functionality, how data will be exchanged (usually through adaptors that convert between formats), and which features will actually be used.<\/p><p>The chapter lists four integration problems. You lack <b>control over functionality and performance<\/b>, so products may be less effective than they appear. Products may be <b>incompatible<\/b> because they make different assumptions. You have <b>no control over evolution<\/b>, because vendors, not users, decide what changes. And vendor <b>support<\/b> may not last the lifetime of your system. A successful API call through a wrapper does not prove that the whole business transaction completes correctly.<\/p>","sourceStart":54,"notes":"Ask what belongs in the decision record before the supplier changes its interface: the version assumption, a compatibility check, a support contact and a fallback. This links directly to the AI slide on model retirement.","minutes":2,"tier":"core","concept":"API call versus business transaction","answerKey":"verify the complete workflow outcome","commonError":"Students take a successful API call as integration proof. Ask what the whole transaction needs: state, ordering, failure and data semantics.","concept2":"planning for supplier change","answerKey2":"documented interface assumption, compatibility check and fallback","question2":"What belongs in the decision before the supplier changes its interface?","answer2":"A documented interface and version assumption. A compatibility check. A support and ownership path. A feasible response such as migration, adaptation or a limited fallback."},{"id":"AISYS","phase":"LEARN","skin":"genai","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source concepts to an AI component","sourceStart":1,"banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · WEIGH THE OPTIONS","caption":"A model may be the most reusable component you ever buy—and the one most likely to change under you."},"title":"Weigh it: reuse a hosted model or host your own?","takeaway":"Reusing a model reuses its supplier’s data terms, versions and roadmap.","heads":["FACTOR","HOSTED API","LOCAL OPEN MODEL"],"rows":[["Schedule","Days to integrate","Weeks to deploy"],["Lifetime","Supplier retires versions","You decide versions"],["Expertise","Little model operation","Needs model operations"],["Data","Leaves your boundary","Stays with you"],["Evidence","Ten-request demo","Same demo"]],"bullets":[["Weigh each row","Which factor matters most for this workflow?"],["Name the lock-in","What happens when the tested version is retired?"],["Demand evidence","Which workflow test would decide?"]],"question":"Pick one option for the booking assistant. Name the factor that decided it and the evidence you still need.","answer":"Either option can be defensible. A hosted API wins on schedule and expertise. It binds the product to the supplier's version timetable and data terms. A locally hosted model gives control of versions and data location. It needs operational skill and its own evaluation. For a long-lived product handling personal booking data, lifetime and data location often dominate. In every case a ten-request demo is not evidence of fit. Require an evaluation set drawn from the real workflow: waiting periods and linked appointments. Re-run it on every model version. Keep a documented plan for version retirement.","full":"<p>This slide is course-added. It applies the chapter’s planning factors to a decision the case now faces: how to reuse a language model.<\/p><h3>How the slide uses the five objectives<\/h3><p>Benefits and costs: the purchase or API price excludes evaluation, monitoring and migration. Planning factors: schedule, lifetime, expertise, criticality and platform decide between the options, as on the six-factor slide. Frameworks and inversion of control: agent frameworks call your code and tools, so the chapter’s ‘the framework calls you’ applies. Configuration: prompts and model settings are configuration and must be versioned with the software. COTS: a hosted model is a COTS component whose internal behaviour you cannot inspect or fix.<\/p><p><b>Model deprecation.<\/b> Suppliers retire model versions on their own schedule. A replacement can accept the same requests and still behave differently, so a version change is a supplier interface change in the chapter’s sense.<\/p><p><b>Evaluation set.<\/b> A fixed collection of realistic cases with expected outcomes, drawn from the intended workflow. Re-running it on each version is the model equivalent of testing the product instance.<\/p><p><b>Data terms.<\/b> Whether requests are stored, for how long and where, is set by the supplier’s terms. For personal data this is a requirement to check before reuse, not after.<\/p><p class=\"small\">The case is course-created. Optional further reading: Sculley et al. (2015), <i>Hidden Technical Debt in Machine Learning Systems<\/i>.<\/p>","notes":"Allow about 6 minutes. Format: decision matrix. Pairs mark which option wins each row for this workflow, then choose and name the deciding factor. New terms, at most two: model deprecation and evaluation set. Everything else in Full explanation is optional depth and is not assessed.","minutes":3,"tier":"core","concept":"reusing a model brings its supplier","answerKey":"lifetime and data location decide; the demo is not fit evidence","commonError":"Students count the ten-request demo as fit evidence. Ask for an evaluation set drawn from the real workflow and re-run per version.","added":true},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"A reused model brings its supplier’s roadmap.","bullets":[["New information","The interface changes and the tested model version will be retired."],["Reassess","The fit evidence belongs to versions that will not exist."],["Revise","Restrict the plan; re-run the workflow evaluation on each version."],["Own","Name who owns supplier changes and who informs users."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. For the language model, treat version retirement as the same kind of supplier change. Pin the tested version. Re-run the workflow evaluation on its replacement. Name who decides whether the replacement is accepted.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The supplier changes a required interface and will not support the earlier version throughout the planned lifetime.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Accept revisions that pin the tested versions, re-run the workflow evaluation on replacements and name an owner for supplier changes. Ask who tells users if a replacement version is not yet accepted.","minutes":1,"tier":"core","concept":"revising under new evidence","answerKey":"pin the version and re-run the workflow evaluation","commonError":"Students keep the plan and hope the replacement model behaves the same. Treat version retirement as a supplier change with an owner.","twist":true,"added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1,"minutes":2,"tier":"core"}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. Configure, integrate or replace, and what evidence decides?","pair":"Name one assumption and one given fact you need to support your answer.","write":"Write your claim and its evidence. Mark any test you only propose as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given facts. Ask which missing fact would change your claim. Decide whether the ten-request demo counts as evidence of fit.","answer":"An answer with limits separates the given facts from the needed evidence. A source explanation supports a mechanism. It does not prove the fictional deployment passed a test. A ten-request demo shows the model can produce plausible replies. It does not show it handles waiting periods and linked appointments across the full workflow.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same card; nobody is marked on field length or a timer.","ai":["think"],"minutes":3,"tier":"core","concept":"evidence of fit","answerKey":"the demo is not evidence for the full workflow","rubric":{"criteria":[{"name":"Names the mechanism","levels":[[2,"Strong","Names the chapter mechanism that decides the case and says how it applies."],[1,"Partial","Names a mechanism but does not connect it to the case facts."],[0,"Missing","No chapter mechanism, or the wrong one."]]},{"name":"Uses only the given facts","levels":[[2,"Strong","Every statement rests on a given fact or is marked as an assumption."],[1,"Partial","Mostly given facts, but one invented or unmarked assumption."],[0,"Missing","Relies on facts the case does not give."]]},{"name":"Evidence another person can check","levels":[[2,"Strong","Names evidence a second engineer could inspect, and marks proposed tests as proposed."],[1,"Partial","Names evidence, but it is vague or its status is unclear."],[0,"Missing","Opinion or confidence instead of evidence."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"Claim: neither route is supported yet. Given: the product handles ordinary bookings; waiting periods and linked appointments are not demonstrated. Proposed: a configured instance run on the real workflow, with tests. The demo is not fit evidence.","why":"Names the mechanism (fit evidence), keeps to the given facts and proposes a checkable test."},"weak":{"text":"Configure it: the vendor says it is configurable and the model demo was perfect.","why":"Takes a capability claim and a ten-request demo as evidence; no test proposed."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms: configuring the purchased product, or integrating a hosted language model through a wrapper. Which one would you choose?","pair":"Ask your partner to argue for the mechanism you rejected. Name one trade-off and one thing both mechanisms share.","write":"Write why your mechanism supports your claim, and what you are still unsure of.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism affects your claim. Then name a shared cause, a mismatch or a limit outside its evidence.","answer":"Tie the chosen mechanism to the required property. Say what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. A wrapped model API hides the interface, not the supplier's version timetable or data terms. That is the same limit the chapter gives for any wrapped system.","no":2,"at":"CHECK2","seconds":180,"ai":["think"],"minutes":3.5,"tier":"core","concept":"what a wrapper hides","answerKey":"a wrapper hides the interface, not the supplier's roadmap","rubric":{"criteria":[{"name":"Links the mechanism to the property","levels":[[2,"Strong","Explains how the chosen mechanism affects the property at stake."],[1,"Partial","Names the mechanism without the link to the property."],[0,"Missing","No mechanism, or no property."]]},{"name":"Names a shared cause or limit","levels":[[2,"Strong","Names a specific shared cause, mismatch or limit that could defeat the mechanism."],[1,"Partial","Mentions a limit in general terms only."],[0,"Missing","Treats the mechanism as always enough."]]},{"name":"States the trade-off","levels":[[2,"Strong","Says what the alternative improves and what it costs."],[1,"Partial","Gives one side of the trade-off only."],[0,"Missing","No comparison with the alternative."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"Configure the purchased product, because workflow fit is the property at stake and one vendor keeps one data model. Its limit: configuration may not reach linked appointments. The wrapped model is faster but adds a second supplier's roadmap.","why":"Links the mechanism to fit, names the limit and states the trade-off."},"weak":{"text":"Wrap the model: a wrapper means we can swap it any time.","why":"Treats the wrapper as removing lock-in; no property, no limit, no cost."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":true},{"title":"Change the constraint; revise and own","think":"The supplier changes a required interface and will not support the earlier version for the planned lifetime. It also retires the model version the team tested. Does your first decision still hold?","pair":"Explain what changes in your claim, your evidence or its scope.","write":"Record the new evidence and your revised decision with its limits. Say plainly what your first card got wrong. Name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your first answer. Name the changed assumption, the next evidence and the condition that would change your decision.","answer":"The new fact changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The fit evidence belonged to a model version that will not exist. Every version change needs the same workflow evaluation re-run.","note":"Classroom version only. The assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"APPLY","seconds":180,"ai":["think"],"minutes":3,"tier":"core","concept":"revising after the twist","answerKey":"fit evidence belongs to a version that will not exist","rubric":{"criteria":[{"name":"Says what the new fact changes","levels":[[2,"Strong","Names the assumption the new fact breaks and what it leaves intact."],[1,"Partial","Notes the new fact without saying which assumption it breaks."],[0,"Missing","Ignores or restates the new fact."]]},{"name":"Revises with a reason","levels":[[2,"Strong","Keeps, changes or replaces the decision for a reason from the new fact. Says what the first answer got wrong."],[1,"Partial","Changes the decision without a clear reason, or hides the first answer."],[0,"Missing","Repeats the first answer unchanged."]]},{"name":"Names the owner and who is told","levels":[[2,"Strong","Names the role that decides and the people who must be informed."],[1,"Partial","Names one of the two."],[0,"Missing","Names neither the owner nor who is told."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"My first card assumed the tested versions would last the planned lifetime; they will not. Revise: pin versions, re-run the workflow evaluation on each replacement, and plan migration. The product owner decides; clinic staff are told what changes.","why":"Names the broken assumption, revises with a reason, admits the first error, names owner and audience."},"weak":{"text":"Keep the plan; the replacement model will probably answer the same.","why":"Ignores the retired version; names nobody."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X05"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X05","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Reuse approaches and planning","range":"12–15"},{"title":"Frameworks and inversion of control","range":"16–21"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Reuse benefits, problems and planning","start":3,"end":15,"units":["X01","X02","X02A","D15","CHECK1"]},{"title":"Frameworks, MVC and inversion of control","start":16,"end":25,"units":["X03","IOC","CHECK2"]},{"title":"Product lines and configuration","start":26,"end":40,"units":["X04","X05","CONFIG","CHECK2"]},{"title":"Application reuse, ERP and integration","start":41,"end":58,"units":["X06","CHECK2","R18","R09"]}],"sourceCount":58,"original":"sources/Ch15-Original.pptx","textbook":"sources/Ch15-Textbook.pdf","bookPages":27,"quiz":[{"q":"Which is a typical cost of software reuse?","options":["Adapting and integrating the reused software","Writing every component from scratch","Losing the ability to use design patterns"],"answer":0,"why":"Reuse can lower development effort, but finding, adapting, integrating and maintaining reused software has costs.","concept":"costs of reuse","answerKey":"adapting and integrating reused software"},{"q":"Which is one of the chapter’s reuse planning factors?","options":["The popularity of the product on social media","The expected software lifetime","The number of screens in the user interface"],"answer":1,"why":"The six factors are schedule, lifetime, team background, criticality, application domain and platform.","concept":"planning factors","answerKey":"expected software lifetime"},{"q":"A framework calls your event handler when a user clicks. This is:","options":["Program generation","Component composition","Inversion of control"],"answer":2,"why":"In a framework, framework objects own the control flow and call application code through hook methods.","concept":"inversion of control","answerKey":"the framework calls the handler","beyondCase":true},{"q":"What does a software product line manage?","options":["Common features and controlled variation across related applications","A single application that customers cannot change","Copies of an application that each customer maintains"],"answer":0,"why":"A product line shares a core architecture and components, and controls how each instance varies.","concept":"product line","answerKey":"common features with controlled variation","beyondCase":true},{"q":"What does an ERP system mainly provide?","options":["One reusable function for a single department","Integrated business processes over a shared database","A guarantee that every business rule is correct"],"answer":1,"why":"ERP systems support common business processes through modules, a common database and shared business rules.","concept":"ERP","answerKey":"integrated processes over a shared database","beyondCase":true}],"alignment":[{"objective":"Compare benefits and costs of reuse.","evidence":"Explain and demonstrate: Compare benefits and costs of reuse.","field":"COMPARE"},{"objective":"Select an approach using planning factors.","evidence":"Explain and demonstrate: Select an approach using planning factors.","field":"FIT + BOUND"},{"objective":"Explain MVC and inversion of control.","evidence":"Explain and demonstrate: Explain MVC and inversion of control.","field":"transfer question + source application"},{"objective":"Distinguish product-line specialization and configuration.","evidence":"Explain and demonstrate: Distinguish product-line specialization and configuration.","field":"COMPARE + ACT"},{"objective":"Compare COTS solution, COTS integration and ERP.","evidence":"Explain and demonstrate: Compare COTS solution, COTS integration and ERP.","field":"REFIT + EVIDENCE"}],"artifact":"Build an options/constraints comparison, workflow-fit test and justified lifecycle choice.","bridge":"Build an options/constraints comparison, workflow-fit test and justified lifecycle choice. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"X05","workload":"Consider retraining, configuration work and support burden when an organization changes to a reused application.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","LIFECYCLE":"R09"},"roadmap":{"question":"Which reuse approach fits the requirements and lifetime?","connection":"Planning constraints guide the choice of reusable structure, product family or complete application; integration must still be checked.","inClass":"Compare reuse routes against workflow and lifecycle constraints.","deliverable":"An options comparison and justified reuse choice.","success":"Explain both the fit and the cost of adapting what you inherit.","branches":[{"verb":"Survey what can be reused","label":"The reuse landscape","detail":"Functions → components → applications → systems","target":"X01","units":["X01","X02A"],"caseLens":"What should be reused: a complete product, application, component, or concept?"},{"verb":"Choose under constraints","label":"Benefits, costs and planning","detail":"Six planning factors · support and lifetime","target":"D15","units":["X02","D15","CHECK1"],"caseLens":"Does the appointment product still fit schedule, lifetime, team, criticality, domain, and platform?"},{"verb":"Extend reusable architecture","label":"Application frameworks","detail":"MVC · inheritance · inversion of control","target":"X03","units":["X03","IOC"],"caseLens":"Could a framework provide reusable structure without forcing the wrong workflow?"},{"verb":"Manage commonality and variation","label":"Software product lines","detail":"Shared core · specialization · configuration","target":"X04","units":["X04","X05","CONFIG"],"caseLens":"Would a product line or configuration handle waiting periods and linked appointments?"},{"verb":"Configure or integrate","label":"Application system reuse","detail":"COTS solutions / integration · ERP · wrapping","target":"X06","units":["X06","CHECK2","R18","R09","AISYS","APPLY"],"caseLens":"Configure, integrate, wrap, or replace—and how does supplier interface evolution change the choice?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"You tested the model on Monday. The vendor retires it on Friday.","aiAssignment":{"title":"Reusing an open speech-to-text model for captions","scenario":"The university wants automatic Arabic and English captions for recorded lectures. The team proposes reusing an open-source speech-to-text model rather than buying a captioning service or building one.","facts":["A demo on five English lectures looked accurate.","No evaluation on Arabic lectures or regional accents exists.","A small volunteer group maintains the model; its licence permits the intended use."],"question":"Reuse the open model, buy a service, or build—and what evidence decides?","stress":"The volunteer maintainers archive the project. A security advisory is published for one of its dependencies. A deaf student reports that Arabic captions in a recorded exam review were wrong.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition, something you would see, that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage).","rubric":{"criteria":[{"name":"FIT","levels":[[1,"Strong","Names the chapter concept that decides the case and shows why it fits these facts."],[0.75,"Adequate","Names the right concept, with only a partial link to the facts."],[0.5,"Developing","Names a concept but does not connect it to the case."],[0,"Missing","No chapter concept, or the wrong one."]]},{"name":"BOUND","levels":[[1,"Strong","States an observable condition that would end the claim."],[0.75,"Adequate","Names a condition, but nobody could easily observe it."],[0.5,"Developing","Gives a vague limit, such as “if it fails”."],[0,"Missing","Gives no limit."]]},{"name":"ACT + EVIDENCE","levels":[[1,"Strong","One concrete action with an owner, and evidence another engineer could inspect even if the AI is wrong."],[0.75,"Adequate","A concrete action, but the evidence is weak or its status is unclear."],[0.5,"Developing","General advice, or evidence that relies on the AI's own output."],[0,"Missing","No action and no evidence."]]},{"name":"REFIT","levels":[[1,"Strong","Uses the new information, names the assumption it broke and justifies retain, revise or replace."],[0.75,"Adequate","Uses the new information but does not name the broken assumption."],[0.5,"Developing","Keeps or changes the answer without a reason."],[0,"Missing","Ignores the new information."]]},{"name":"OWNER + AI USE","levels":[[1,"Strong","Names the role that accepts the risk and who must be told. Declares any AI help and how it was checked."],[0.75,"Adequate","Names a role, but not who must be told, or the AI declaration is incomplete."],[0.5,"Developing","Names “the team” or “the system” as owner."],[0,"Missing","No owner and no AI declaration."]]}],"marks":"Practice only · not graded · score yourself 1, 0.75, 0.5 or 0 per criterion","strong":{"text":"Reuse the open model only for English now; buy a supported service for Arabic. The deciding factor is lifetime with a small volunteer team. The decision ends if an Arabic evaluation fails or the project stops updates. Action: the accessibility lead runs a ten-lecture Arabic test. Evidence: scored transcripts, proposed. After the archive and the wrong captions I replace the open model for Arabic.","why":"Applies a named planning factor, compares routes, limits the decision and replaces it for a stated reason."},"weak":{"text":"Open source is free and the demo looked accurate, so reuse it.","why":"Price and a five-lecture English demo are not fit evidence; no limit or owner."},"other":"they use a chapter concept, rest on the given facts and name evidence someone else can check. A different verdict that meets these conditions is as strong as the strong example."}},"cs2023":[["SE-Tools","Tools and Environments","Dependency management: updating external dependencies and versioning."],["SE-Refactoring","Refactoring and Code Evolution","Backward compatibility as a property of a relationship; versioning."],["SE-Construction","Software Construction","Use of libraries and frameworks developed by others."],["SE-Design","Software Design","Evaluating design trade-offs between reuse options."]],"lectureMinutes":50,"budgetShare":0.85,"timeRule":"If the lecture runs over time, drop optional slides first, in reverse order, then the optional extras. Never drop a think point (checkpoint, station or Your call) and never drop the assumption-change slide. Station and vote minutes are separate from slide minutes: a checkpoint slide keeps 1 minute to show its question, and its station adds 3 minutes. Say which optional slide was dropped and point students to its full explanation.","glossary":[{"term":"claim","short":"a statement you say is true and can defend with evidence","ar":"ادعاء"},{"term":"reuse","short":"building a system from existing software instead of writing everything new","ar":"إعادة الاستخدام"},{"term":"framework","short":"a reusable architecture of classes that you extend to build an application","ar":"إطار عمل"},{"term":"inversion of control","short":"the framework owns the flow of control and calls your code when events happen","ar":"عكس التحكم"},{"term":"callback","short":"application code the framework calls in response to an event","ar":"دالة رد النداء"},{"term":"product line","short":"a family of applications sharing one architecture with controlled variation","ar":"خط إنتاج برمجي"},{"term":"configuration","short":"settings that change what the system does without changing its code","ar":"التهيئة"},{"term":"ERP","short":"a large configurable application whose modules share one database and rule set","ar":"نظام تخطيط موارد المؤسسة"},{"term":"wrapper","short":"code that hides an existing system behind the interface you need","ar":"غلاف برمجي"},{"term":"planning factor","short":"one of the six conditions that decide which reuse approach fits","ar":"عامل تخطيط"},{"term":"lock-in","short":"depending on a supplier's versions, data terms and roadmap that you do not control","ar":"الارتهان للمورّد","added":true}],"transfer":{"title":"Transfer case · the textbook's vehicle dispatcher","text":"A police force wants an instance of the textbook's vehicle-dispatching product line. It needs route planning and incident logging. Its vehicles report their location over a different
