"Classroom practice and source review"}, {"clo": "LO4", "plo": "Practice", "d": "VALUE", "txt": "Build a bounded reuse verdict with inspectable, owned evidence", "needs": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_verdict"], "where": "Classroom practice and source review"}, {"clo": "LO5", "plo": "Practice", "d": "SKILL", "txt": "Defend the verdict when the requirements, vendor support, or integration complexity changes", "needs": ["p:mutation", "f:mutation_defend"], "where": "Classroom practice and source review"}], "gates": [{"id": "decide", "label": "DECIDE", "q": "I have stated a bounded verdict &mdash; adapt, integrate, or switch &mdash; not \"more analysis needed\"."}, {"id": "evidence", "label": "EVIDENCE", "q": "I can show the reuse level I chose, the trade-off I weighed, the planning factors I considered, and the artifact that proves the decision holds."}, {"id": "break", "label": "BREAK", "q": "I can name the COTS problem, missing feature, or integration risk that would reverse my verdict."}, {"id": "own", "label": "OWN", "q": "I have named the reuse engineer, the evidence owner, and the authority who signs off."}], "clo": [{"tag": "KNOWLEDGE", "txt": "Distinguish the four levels of reuse (system, application, component, object/function) and the reuse landscape approaches."}, {"tag": "SKILL", "txt": "Trace a reuse decision through the product instance development process to the trade-off."}, {"tag": "SKILL", "txt": "Specify a reuse strategy using the planning factors and the COTS-solution vs COTS-integrated distinction."}, {"tag": "VALUE", "txt": "Build a bounded reuse verdict with inspectable, owned evidence and a structured argument."}, {"tag": "SKILL", "txt": "Defend the verdict when the requirements, vendor support, or integration complexity changes."}], "pairs": [["decide", "DECIDE", "State a bounded answer"], ["evidence", "EVIDENCE", "Show what supports it"], ["break", "BREAK", "Name what would reverse it"], ["own", "OWN", "Name who signs off"]], "stack": ["Society", "Organization", "Business processes", "Application system", "Communications and data management", "Operating system", "Equipment"], "aiGate": [["q1", "Does the AI output become part of the evidence chain &mdash; something a reviewer or regulator would read?"], ["q2", "Could a human RE-DERIVE the same output independently &mdash; run it again, by another route, and get something they can compare?"], ["q2b", "Failing that, could a human TEST the output against reality &mdash; check each claim it makes without trusting how it was produced?"], ["q3", "Is there a named person who reviews it and signs for it?"]], "vocab": {"stack": ["Society (NCA regulator, patient rights)", "Organization (hospital)", "Business processes (clinic workflow)", "Application system (Mentcare + SchedulPro)", "Communications and data management (HL7/FHIR API)", "Operating system (server OS)", "Equipment (servers, client PCs)"], "gates": [["decide", "DECIDE", "State a bounded answer"], ["evidence", "EVIDENCE", "Show what supports it"], ["break", "BREAK", "Name what would reverse it"], ["own", "OWN", "Name who signs off"]], "aiGate": [["q1", "Does the AI output become part of the evidence chain &mdash; something a reviewer or regulator would read?"], ["q2", "Could a human RE-DERIVE the same output independently &mdash; run it again, by another route, and get something they can compare?"], ["q2b", "Failing that, could a human TEST the output against reality &mdash; check each claim it makes without trusting how it was produced?"], ["q3", "Is there a named person who reviews it and signs for it?"]], "card": [["dc_claim", "CLAIM"], ["dc_evidence", "EVIDENCE"], ["dc_warrant", "WARRANT"], ["dc_counter", "COUNTER-EV."], ["dc_uncert", "UNCERTAINTY"], ["dc_verdict", "VERDICT"]]}, "quiz": [{"t": "Rule 05 · Prediction gate", "parts": [["Prediction", "p:predict"], ["Constraint", "f:p_constraint"], ["Derive", "f:p_derive"], ["Name", "f:p_name"]]}, {"t": "Rule 07 · Decision card", "parts": [["Claim", "f:dc_claim"], ["Evidence", "f:dc_evidence"], ["Warrant", "f:dc_warrant"], ["Counter-evidence", "f:dc_counter"], ["Uncertainty", "f:dc_uncert"], ["Verdict", "f:dc_verdict"]]}, {"t": "Rule 10 · Risk and monitor", "parts": [["Known / unknown / monitored", "@r10grid"], ["A monitor I will keep", "f:monitor"], ["Vulnerability tool", "f:vuln_tool"]]}, {"t": "Rule 11 · Transfer", "parts": [["Micro-case", "f:micro"], ["Transfer to vehicle dispatch case", "f:transfer"]]}, {"t": "Rule 13 · Stress test", "parts": [["Stress test", "f:stress"]]}, {"t": "Rule 14 · Practitioner workload", "parts": [["Workload cost and design change", "f:workload"]]}, {"t": "Rule 15 · AI assist", "parts": [["AI gate", "@aigate"]]}, {"t": "Rule 17 · Constraint mutation", "parts": [["Mutation", "p:mutation"], ["Survives / collapses", "f:mutation_defend"]]}, {"t": "Rule 19 · Peer review received", "parts": [["Inspectable?", "f:peer1"], ["What would make it fail?", "f:peer2"]]}, {"t": "Jahiziah knowledge-unit check", "parts": [["", "@jahtest"]]}, {"t": "Rule 20 · Readiness", "parts": [["", "@gates"], ["Outcomes your evidence supports", "@clo"], ["Engineering means", "f:takehome"]]}], "units": [{"k": "TITLE", "phase": "ISCARB TOOLKIT", "task": "Sit down. The decision starts in ninety seconds.", "notes": "Leave this up while the room settles. One sentence only: tonight you do not learn four reuse levels, you issue one engineering decision about a COTS appointment system that cannot handle mental health workflow and defend it.", "appendix": false, "route": "core"}, {"k": "START", "title": "Your route through this chapter", "phase": "LEARN", "route": "core", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Today’s artifact:</b> A justified reuse choice.</p><p><b>Fictional teaching case:</b> The hospital chose SchedulPro, a COTS appointment system, for the Mentcare system. Six months in, the team discovered it cannot handle the mental health workflow &mdash; mandatory waiting periods and dual-appointment booking.</p><p>The SchedulPro vendor says the mental health features are &ldquo;not on the product roadmap.&rdquo; The hospital must now decide: adapt their workflow to SchedulPro&rsquo;s capabilities, build a custom integration layer that wraps SchedulPro and adds the missing features, or switch to a different approach (framework, product line, or a different COTS product). Do you adapt, integrate, or switch?</p></div><h2 style=\"font:700 25px/1.4 system-ui\">Five chapter learning objectives</h2><ol class=\"lp-outcomes\"><li>Distinguish the four levels of reuse (system, application, component, object/function) and the reuse landscape approaches.</li><li>Trace a reuse decision through the product instance development process to the trade-off.</li><li>Specify a reuse strategy using the planning factors and the COTS-solution vs COTS-integrated distinction.</li><li>Build a bounded reuse verdict with inspectable, owned evidence and a structured argument.</li><li>Defend the verdict when the requirements, vendor support, or integration complexity changes.</li></ol><p style=\"font:17px/1.6 system-ui\"><b>Pacing suggestion:</b> one teaching block of about 75–90 minutes, plus 20–30 minutes of targeted source review. These are planning estimates, not an official timetable. Pause after Check 2 if teaching in two blocks. If time runs out, finish the remaining source topics in the next block; they stay required.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"C01\">See the source-to-lesson map</button></div>"}], "noAnswer": true, "appendix": false}, {"k": "X01", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish the four levels of reuse and the reuse landscape approaches, and explain why reuse is now the dominant software engineering paradigm.", "title": "Reuse-based software engineering", "sub": "Now compare your prediction with what the source actually says.", "blocks": [{"t": "figure", "img": "ch15_landscape", "cap": "p.11 · the reuse landscape", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "REUSE LANDSCAPE", "lead": "Ten approaches from frameworks to program generators.", "txt": "The reuse landscape covers the range of possible reuse techniques: application frameworks, application system integration, architectural patterns, aspect-oriented development, component-based SE, configurable application systems, design patterns, ERP systems, legacy wrapping, program generators, and more."}]}]}, {"t": "figure", "native": "props", "mk": "p3", "cap": "Five dependability properties; not a figure from this chapter", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "kind": "probability", "lab": "THE FOUR LEVELS", "lead": "From complete systems to single functions.", "txt": "<b>System reuse</b> &mdash; complete systems, which may include several application programs. <b>Application reuse</b> &mdash; an application reused by incorporating it without change or by developing application families. <b>Component reuse</b> &mdash; components of an application from sub-systems to single objects. <b>Object and function reuse</b> &mdash; small-scale software components that implement a single well-defined object or function.", "src": "P1 · p.4"}, {"c": "sand", "kind": "judgment", "lab": "THE BENEFITS AND PROBLEMS", "lead": "Six benefits, five problems &mdash; the trade-off is always control vs speed.", "txt": "<b>Benefits:</b> accelerated development, effective use of specialists, increased dependability, lower costs, reduced process risk, standards compliance. <b>Problems:</b> creating/maintaining/using a component library, finding/understanding/adapting components, increased maintenance costs, lack of tool support, not-invented-here syndrome.", "src": "P1 · p.5-8"}]}], "srcName": "Chapter 10 recap · course redraw"}, {"t": "conceptflow", "items": [["LEVELS", "System → Application → Component → Object/function"], ["TRADE-OFF", "Speed and cost vs control and evolution"]]}, {"t": "principle", "txt": "Reuse is not a free lunch. Every level trades control over functionality and evolution for speed, cost, and dependability. The engineering decision is which trade-off to make."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Reuse-based software engineering. The highest-value thirty seconds of the Understand phase. SchedulPro is application reuse &mdash; the hospital adopted a complete application without writing code. The trade-off: the hospital traded control over functionality and evolution (the vendor controls the roadmap) for speed and cost (rapid deployment, no development). Students who miss this write assignments full of feature requests to the vendor, missing the point that the vendor controls the roadmap.", "appendix": false, "_iscarbRule": "X01 - Software reuse and the reuse landscape", "route": "core", "showIf": null, "sourceRange": "3–15", "answer": "The reuse landscape covers the range of possible reuse techniques: application frameworks, application system integration, architectural patterns, aspect-oriented development, component-based SE, configurable application systems, design patterns, ERP systems, legacy wrapping, program generators, and more. System reuse — complete systems, which may include several application programs. Application reuse — an application reused by incorporating it without change or by developing application families. Component reuse — components of an application from sub-systems to single objects. Object and function reuse — small-scale software components that implement a single well-defined object or function. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the six benefits and five problems of software reuse, and apply them to tonight&rsquo;s COTS decision.", "title": "Benefits and problems of reuse", "sub": "Every reuse decision is a trade-off between the benefits (speed, cost, dependability) and the problems (control, maintenance, tool support). Tonight&rsquo;s crisis is a problem that was not weighed against the benefits.", "blocks": [{"t": "compare", "head": ["Benefit", "What it means", "Tonight&rsquo;s Mentcare"], "rows": [{"c": "teal", "cells": ["Accelerated development", "Bringing a system to market earlier is often more important than overall cost.", "SchedulPro deployed in 3 months vs 12+ months for custom development. <b>Benefit held.</b>"]}, {"c": "teal", "cells": ["Lower development costs", "Development costs are proportional to the size of the software being developed.", "No development team needed for the appointment system. <b>Benefit held.</b>"]}, {"c": "teal", "cells": ["Reduced process risk", "The cost of existing software is already known, unlike development costs.", "The COTS price was fixed; the development cost would have been a judgment. <b>Benefit held.</b>"]}, {"c": "teal", "cells": ["Standards compliance", "Standards can be implemented as a set of reusable components.", "SchedulPro follows the standard appointment UI; users see a familiar interface. <b>Benefit held.</b>"]}, {"c": "sand", "cells": ["Increased dependability", "Reused software, tried and tested, should be more dependable than new software.", "SchedulPro has been deployed in 50+ hospitals. <b>Benefit held &mdash; for the features it has.</b>"]}, {"c": "sand", "cells": ["Effective use of specialists", "Application specialists can develop reusable software that encapsulates their knowledge.", "The SchedulPro team includes scheduling specialists. <b>Benefit held &mdash; but not mental health specialists.</b>"]}]}, {"t": "compare", "head": ["Problem", "What it means", "Tonight&rsquo;s Mentcare"], "rows": [{"c": "mag", "cells": ["Requirements adapted to COTS", "Requirements usually have to be adapted to reflect the COTS product&rsquo;s functionality.", "The hospital&rsquo;s mental health workflow requirements cannot be met by SchedulPro. <b>Problem hit.</b>"]}, {"c": "mag", "cells": ["COTS based on impossible assumptions", "The COTS product may be based on assumptions that are practically impossible to change.", "SchedulPro assumes all appointments are independent. Mental health appointments have mandatory waiting periods. <b>Problem hit.</b>"]}, {"c": "teal", "cells": ["Increased maintenance costs", "If the source code is not available, maintenance costs may be higher.", "The hospital cannot maintain SchedulPro; they depend on the vendor. <b>Problem latent.</b>"]}, {"c": "teal", "cells": ["Lack of tool support", "Some software tools do not support development with reuse.", "SchedulPro does not integrate with Mentcare&rsquo;s existing tools. <b>Problem latent.</b>"]}, {"c": "teal", "cells": ["Not-invented-here syndrome", "Some software engineers prefer to rewrite components.", "The team initially resisted SchedulPro but management overrode them. <b>Problem avoided.</b>"]}]}, {"t": "wide", "c": "sand", "lab": "CLASSIFY TONIGHT&rsquo;S FAILURE", "picker": {"g": "cause", "options": ["Requirements not adapted", "Impossible assumptions", "Maintenance costs", "Lack of tool support", "Not-invented-here"]}, "field": {"id": "cause_defeat", "core": false, "rows": 2, "ph": "Which problem did the team not weigh against the benefits, and what artifact would have caught it?"}}, {"t": "principle", "c": "mag", "txt": "The benefits held for the features SchedulPro has. The problems hit for the features it does not have. The team did not weigh the problems against the benefits for the mental health workflow &mdash; that is the gap."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Benefits and problems of reuse. Two minutes. The room usually picks \"requirements not adapted\" because the mental health workflow requirements cannot be met. The deeper answer is \"COTS based on impossible assumptions\": SchedulPro assumes all appointments are independent, and mental health appointments have mandatory waiting periods. That assumption is practically impossible to change because it is baked into the product&rsquo;s architecture. Do not correct anyone; ask which problem is about the product&rsquo;s assumptions, not the hospital&rsquo;s requirements.", "appendix": false, "_iscarbRule": "X02 - Benefits and problems of software reuse", "route": "core", "showIf": null, "sourceRange": "3–15", "answer": "The benefits held for the features SchedulPro has. The problems hit for the features it does not have. The team did not weigh the problems against the benefits for the mental health workflow — that is the gap. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02A", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Name the ten reuse landscape approaches and identify which one SchedulPro represents.", "title": "The reuse landscape", "sub": "The supplied source lists fifteen approaches. Use the planning factors to select a suitable approach.", "blocks": [{"t": "raw", "html": "<div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Reuse approach</th><th>Purpose in the source</th></tr></thead><tbody><tr><td>Application frameworks</td><td>Collections of abstract and concrete classes are adapted and extended to create application systems.</td></tr><tr><td>Application system integration</td><td>Two or more application systems are integrated to provide extended functionality</td></tr><tr><td>Architectural patterns</td><td>Standard software architectures that support common types of application system are used as the basis of applications. Described in Chapters 6, 11 and 17.</td></tr><tr><td>Aspect-oriented software development</td><td>Shared components are woven into an application at different places when the program is compiled. Described in web chapter 31.</td></tr><tr><td>Component-based software engineering</td><td>Systems are developed by integrating components (collections of objects) that conform to component-model standards. Described in Chapter 16.</td></tr><tr><td>Configurable application systems</td><td>Domain-specific systems are designed so that they can be configured to the needs of specific system customers.</td></tr><tr><td>Design patterns</td><td>Generic abstractions that occur across applications are represented as design patterns showing abstract and concrete objects and interactions. Described in Chapter 7.</td></tr><tr><td>ERP systems</td><td>Large-scale systems that encapsulate generic business functionality and rules are configured for an organization.</td></tr><tr><td>Legacy system wrapping</td><td>Legacy systems (Chapter 9) are ‘wrapped’ by defining a set of interfaces and providing access to these legacy systems through these interfaces.</td></tr><tr><td>Model-driven engineering</td><td>Software is represented as domain models and implementation independent models and code is generated from these models. Described in Chapter 5.</td></tr><tr><td>Program generators</td><td>A generator system embeds knowledge of a type of application and is used to generate systems in that domain from a user-supplied system model.</td></tr><tr><td>Program libraries</td><td>Class and function libraries that implement commonly used abstractions are available for reuse.</td></tr><tr><td>Service-oriented systems</td><td>Systems are developed by linking shared services, which may be externally provided. Described in Chapter 18.</td></tr><tr><td>Software product lines</td><td>An application type is generalized around a common architecture so that it can be adapted for different customers.</td></tr><tr><td>Systems of systems</td><td>Two or more distributed systems are integrated to create a new system. Described in Chapter 20.\n </td></tr></tbody></table></div>"}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: The reuse landscape. Two minutes. The reuse landscape is the chapter&rsquo;s map of all reuse options. The room usually picks approach #6 (configurable application system) for what the hospital chose &mdash; correct. The deeper question is what they should switch to. Approach #2 (application system integration) is the natural answer: wrap SchedulPro with a service interface and add a custom mental health module. But approach #1 (application framework) is also viable: build a custom appointment system on Django/Rails that includes the mental health workflow from the start. The trade-off: integration is faster but gives less control; framework is slower but gives full control. A student who says &ldquo;switch to a different COTS&rdquo; has not answered; push for which approach, not which product.", "appendix": false, "_iscarbRule": "X02A - The reuse landscape approaches", "route": "core", "showIf": null, "sourceRange": "3–15", "answer": "Frameworks provide a reusable application structure; libraries provide callable abstractions; product lines generalize an application family; configurable and integrated systems reuse larger applications. Select by fit, lifetime, team capability, criticality and platform, rather than by reuse alone.", "noAnswer": false}, {"k": "D15", "title": "Reuse planning and configuration", "sub": "Required source concepts with a short worked explanation.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "Six planning factors", "txt": "Consider schedule, expected lifetime, team experience, criticality and non-functional requirements, application domain and execution platform.", "src": "P1 · pp.15–40"}, {"c": "teal", "lab": "Product-line specialization", "txt": "Variation can target platform, environment, functionality or business process. Define what is shared and what varies.", "src": "P1 · pp.15–40"}, {"c": "teal", "lab": "Deployment configuration", "txt": "Select components, define workflows and validation rules, and set parameters. Configuration still needs validation against the organization’s requirements.", "src": "P1 · pp.15–40"}]}], "task": "A configurable product fits the workflow but cannot meet the required response time. Is configuration enough?", "answer": "No. A functional fit does not establish non-functional suitability. Obtain workload-specific evidence, negotiate a bounded requirement or choose a different approach.", "sourceRange": "15–40", "noAnswer": false, "route": "core", "appendix": false, "phase": "LEARN", "rule": "", "showIf": null, "timebox": "", "notes": "Teaching focus: Reuse planning and configuration. "}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A framework calls your code, while your program calls a library. What distinction does this illustrate?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "Inversion of control. A framework provides an application structure and invokes extension points; a library supplies functionality invoked by the application.", "timebox": "60 sec", "appendix": false}, {"k": "X03", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain what an application framework is, how it uses inversion of control, and how the MVC pattern works.", "title": "Frameworks, MVC and inversion of control", "sub": "A framework is an integrated set of software artefacts that collaborate to provide a reusable architecture for a family of related applications. It is extended by adding concrete classes and methods.", "blocks": [{"t": "figure", "img": "ch15_inversion", "cap": "p.24 · inversion of control in frameworks", "right": [{"t": "cards", "cols": 1, "items": [{"c": "sand", "lab": "INVERSION OF CONTROL", "lead": "The framework controls the flow; you add the code.", "txt": "In a framework, the framework controls the flow of execution and calls the developer&rsquo;s code, rather than the developer&rsquo;s code calling the framework. This is inversion of control &mdash; the framework is in charge, you fill in the blanks."}]}]}, {"t": "figure", "img": "ch15_mvc", "cap": "p.21 · the Model-View-Controller pattern", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "MVC PATTERN", "lead": "Model, View, Controller &mdash; the system infrastructure framework for GUI design.", "txt": "The Model-View-Controller pattern allows multiple presentations of an object and separate interactions with these presentations. The model manages data, the view displays data, the controller handles input. WAFs are based on MVC."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · SYSTEM INFRASTRUCTURE", "lead": "Support development of system infrastructures.", "txt": "Support the development of system infrastructures such as communications, user interfaces, and compilers. Example: MVC for GUI design, networking frameworks, compiler frameworks.", "src": "P1 · p.25"}, {"c": "sand", "lab": "2 · MIDDLEWARE INTEGRATION", "lead": "Standards and classes for component communication.", "txt": "Standards and classes that support component communication and information exchange. Example: CORBA, EJB, .NET remoting.", "src": "P1 · p.25"}, {"c": "violet", "lab": "3 · ENTERPRISE APPLICATION", "lead": "Support development of specific types of application.", "txt": "Support the development of specific types of application such as telecommunications or financial systems. Example: telecom billing frameworks, financial trading frameworks.", "src": "P1 · p.25"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MODEL-VIEW-CONTROLLER", "lead": "System infrastructure framework for GUI design.", "txt": "Allows for multiple presentations of an object and separate interactions with these presentations. The model manages the data; the view displays the data; the controller handles user input. WAFs are based on MVC.", "src": "P1 · p.20-21"}, {"c": "mag", "lab": "INVERSION OF CONTROL", "lead": "The framework controls the flow; you add the code.", "txt": "In a framework, the framework controls the flow of execution and calls the developer&rsquo;s code, rather than the developer&rsquo;s code calling the framework. This is called inversion of control &mdash; the framework is in charge, you fill in the blanks.", "src": "P1 · p.24"}]}, {"t": "wide", "c": "sand", "lab": "TONIGHT&rsquo;S FRAMEWORK QUESTION", "lead": "If the hospital had chosen a framework instead of a COTS, they would have full control &mdash; but they would also have full responsibility.", "txt": "A framework (like Django or Rails) gives the hospital full control over the appointment system&rsquo;s functionality and evolution. They can implement the mental health workflow exactly as they need it. But they also own the development, the maintenance, the security, the database, the session management &mdash; everything the framework provides as infrastructure. The trade-off: full control vs full responsibility. The COTS-solution trade-off was the opposite: low control vs low responsibility. Tonight&rsquo;s question is which trade-off the hospital should make now.", "field": {"id": "framework_question", "core": false, "rows": 2, "ph": "For your verdict: would a framework have avoided tonight&rsquo;s gap? What new gaps would it create?"}}, {"t": "principle", "txt": "A framework is not a COTS product with more control. It is a COTS product with more responsibility. The trade-off is control vs responsibility, not control vs speed."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Frameworks, MVC and inversion of control. Two minutes. The room usually says a framework would have avoided the gap &mdash; correct, because the hospital could implement the mental health workflow. The deeper question is what new gaps it creates: the hospital now owns development, maintenance, security, database, session management. That is a different set of risks. A student who says &ldquo;we should have used a framework&rdquo; has not answered; push for what new risks that creates.", "appendix": false, "_iscarbRule": "X03 - Application frameworks and MVC", "route": "core", "showIf": null, "sourceRange": "16–25", "answer": "In a framework, the framework controls the flow of execution and calls the developer’s code, rather than the developer’s code calling the framework. This is inversion of control — the framework is in charge, you fill in the blanks. The Model-View-Controller pattern allows multiple presentations of an object and separate interactions with these presentations. The model manages data, the view displays data, the controller handles input. WAFs are based on MVC. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X04", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain what a software product line is, how base applications work, and how product instance development proceeds.", "title": "Software product lines", "sub": "A software product line is a set of applications with a common architecture and shared components, with each application specialized to reflect different requirements.", "blocks": [{"t": "figure", "img": "ch15_vehicledispatch", "cap": "p.33 · product line architecture of a vehicle dispatcher", "right": [{"t": "cards", "cols": 1, "items": [{"c": "sand", "lab": "VEHICLE DISPATCH", "lead": "A specialised resource management system.", "txt": "Vehicle dispatching is a specialised resource management system where the aim is to allocate resources (vehicles) to handle incidents. Adaptations include UI components, I/O management, resource management, and database components."}]}]}, {"t": "figure", "img": "ch15_basesystem", "cap": "p.28 · base systems for a software product line", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "BASE APPLICATION", "lead": "Core, configurable, and specialized components.", "txt": "A base application for a software product line has three types of components: core components (not modified), configurable components (may be modified and configured), and specialized domain-specific components (may be replaced)."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · CORE COMPONENTS", "lead": "Infrastructure support, not usually modified.", "txt": "Core components that provide infrastructure support. These are not usually modified when developing a new instance of the product line. Example: the database layer, the communication layer.", "src": "P1 · p.29"}, {"c": "sand", "lab": "2 · CONFIGURABLE COMPONENTS", "lead": "May be modified and configured to specialize.", "txt": "Configurable components that may be modified and configured to specialize them to a new application. Sometimes reconfigured without changing code by using a built-in configuration language.", "src": "P1 · p.29"}, {"c": "violet", "lab": "3 · SPECIALIZED COMPONENTS", "lead": "Domain-specific, may be replaced.", "txt": "Specialized, domain-specific components some or all of which may be replaced when a new instance of a product line is created. Example: the mental health workflow module.", "src": "P1 · p.29"}]}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · PLATFORM SPECIALIZATION", "lead": "Different versions for different platforms.", "txt": "Different versions of the application are developed for different platforms. Example: Windows, Linux, mobile."}, {"c": "teal", "lab": "2 · ENVIRONMENT SPECIALIZATION", "lead": "Different versions for different environments.", "txt": "Different versions are created to handle different operating environments. Example: different communication equipment."}, {"c": "sand", "lab": "3 · FUNCTIONAL SPECIALIZATION", "lead": "Different versions for different requirements.", "txt": "Different versions are created for customers with different requirements. Example: mental health vs general scheduling."}, {"c": "sand", "lab": "4 · PROCESS SPECIALIZATION", "lead": "Different versions for different business processes.", "txt": "Different versions are created to support different business processes. Example: mandatory waiting periods vs immediate booking."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S PRODUCT LINE QUESTION", "lead": "SchedulPro is NOT a product line &mdash; it is a COTS product. But the hospital could treat it as the base for a product line.", "txt": "A product line is a set of related applications with a common architecture. SchedulPro is a single COTS product, not a product line. But the hospital could create a product line by treating SchedulPro as the base application and adding a specialized mental health component. This is close to COTS-integrated &mdash; but with a product line architecture that separates core, configurable, and specialized components. The trade-off: more control than COTS-solution, less development than a framework.", "field": {"id": "product_line_question", "core": false, "rows": 2, "ph": "For your verdict: is treating SchedulPro as a product line base viable? What would the specialized component look like?"}}, {"t": "principle", "txt": "A product line is not a COTS product with more components. It is a COTS product with a separation of concerns: core (vendor), configurable (customer), specialized (customer). That separation is what gives the customer control without full development."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Software product lines. Two minutes. The product line concept is the bridge between COTS-solution and framework. The room usually focuses on the specialized component (the mental health module). The deeper question is whether SchedulPro&rsquo;s architecture supports the separation of core/configurable/specialized. If SchedulPro is a monolithic COTS with no configuration API, it cannot be treated as a product line base. A student who says &ldquo;add a mental health module&rdquo; has not answered; push for whether SchedulPro&rsquo;s architecture allows that.", "appendix": false, "_iscarbRule": "X04 - Software product lines", "route": "core", "showIf": null, "sourceRange": "26–40", "answer": "Vehicle dispatching is a specialised resource management system where the aim is to allocate resources (vehicles) to handle incidents. Adaptations include UI components, I/O management, resource management, and database components. A base application for a software product line has three types of components: core components (not modified), configurable components (may be modified and configured), and specialized domain-specific components (may be replaced). Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X05", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Apply the six-step product instance development process to tonight&rsquo;s case.", "title": "Developing and configuring a product instance", "sub": "The chapter (p.37) gives a six-step process for developing a new instance of a product line. Tonight&rsquo;s crisis is a failure at step 4 (re-negotiate requirements).", "blocks": [{"t": "figure", "img": "ch15_instance", "cap": "p.36 · product instance development", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "PRODUCT INSTANCE", "lead": "Six steps from elicitation to delivery.", "txt": "Product instance development: 1. Elicit stakeholder requirements, 2. Use existing family member as prototype, 3. Choose closest-fit, 4. Re-negotiate requirements, 5. Adapt existing system, 6. Deliver new family member."}]}]}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "1 · ELICIT REQUIREMENTS", "lead": "Elicit stakeholder requirements.", "txt": "Elicit stakeholder requirements for the new product instance. For the hospital: appointment scheduling with mental health workflow support.", "src": "P1 · p.37"}, {"c": "teal", "lab": "2 · USE AS PROTOTYPE", "lead": "Use existing family member as a prototype.", "txt": "Use an existing family member as a prototype to help stakeholders understand what is possible. For the hospital: demo SchedulPro for general appointments.", "src": "P1 · p.37"}, {"c": "teal", "lab": "3 · CHOOSE CLOSEST-FIT", "lead": "Find the family member that best meets requirements.", "txt": "Find the family member that best meets the requirements. For the hospital: SchedulPro was the closest fit for general appointments.", "src": "P1 · p.37"}, {"c": "mag", "lab": "4 · RE-NEGOTIATE REQUIREMENTS", "lead": "Adapt requirements to capabilities of the software.", "txt": "Adapt requirements as necessary to capabilities of the software. <b>Tonight&rsquo;s failure is here</b> &mdash; the hospital did not re-negotiate the mental health workflow requirements against SchedulPro&rsquo;s capabilities.", "src": "P1 · p.37"}, {"c": "sand", "lab": "5 · ADAPT EXISTING SYSTEM", "lead": "Develop new modules and make changes.", "txt": "Develop new modules and make changes for the family member. For the hospital: this would mean building the mental health module.", "src": "P1 · p.37"}, {"c": "violet", "lab": "6 · DELIVER NEW MEMBER", "lead": "Document key features for further development.", "txt": "Deliver the new family member. Document key features for further member development.", "src": "P1 · p.37"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S PROCESS GAP", "lead": "The six-step process was followed &mdash; but step 4 was skipped for the mental health workflow.", "txt": "The hospital followed steps 1-3: they elicited requirements, used SchedulPro as a prototype, and chose it as the closest fit. But they skipped step 4: they did not re-negotiate the mental health workflow requirements against SchedulPro&rsquo;s capabilities. They assumed SchedulPro could handle all appointment types. That assumption is the gap. The six-step process was designed to catch exactly this &mdash; and step 4 was not done.", "field": {"id": "process_gap", "core": false, "rows": 2, "ph": "For your verdict: which step was skipped, and what artifact would it have produced?"}}, {"t": "principle", "txt": "A six-step process that skips step 4 is a five-step process with a hole. The hole is where the requirements that cannot be met fall through."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Developing and configuring a product instance. Two minutes. The six-step process is the chapter&rsquo;s method for product instance development. The room usually focuses on step 4 (re-negotiate requirements) because that is where the mental health workflow was not checked. The deeper answer is that step 4 produces a specific artifact: a requirements-to-capabilities traceability matrix that maps each requirement to the product&rsquo;s capability to meet it. That artifact is what the team did not produce. A student who says &ldquo;we should follow the process&rdquo; has not answered; push for which step, and what artifact it produces.", "appendix": false, "_iscarbRule": "X05 - Product instance development", "route": "core", "showIf": null, "sourceRange": "26–40", "answer": "Product instance development: 1. Elicit stakeholder requirements, 2. Use existing family member as prototype, 3. Choose closest-fit, 4. Re-negotiate requirements, 5. Adapt existing system, 6. Deliver new family member. Elicit stakeholder requirements for the new product instance. For the hospital: appointment scheduling with mental health workflow support. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X06", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain COTS-solution vs COTS-integrated, ERP systems, and the problems of application system reuse.", "title": "COTS solutions and integrated applications", "sub": "The chapter (p.46) distinguishes two approaches: COTS-solution (a single product configured for the customer) and COTS-integrated (several products integrated). Tonight&rsquo;s crisis is a COTS-solution that should become a COTS-integrated.", "blocks": [{"t": "compare", "head": ["Aspect", "COTS-solution", "COTS-integrated"], "rows": [{"c": "teal", "cells": ["Functionality", "Single product provides the functionality", "Several heterogeneous products integrated"]}, {"c": "teal", "cells": ["Solution basis", "Generic solution and standardized processes", "Flexible solutions for customer processes"]}, {"c": "sand", "cells": ["Development focus", "System configuration", "System integration"]}, {"c": "sand", "cells": ["Maintenance", "System vendor is responsible", "System owner is responsible"]}, {"c": "mag", "cells": ["Platform", "System vendor provides the platform", "System owner provides the platform"]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "ERP SYSTEMS", "lead": "The most common form of software reuse.", "txt": "An ERP system is a generic system that supports common business processes such as ordering, invoicing, and manufacturing. The generic core is adapted by including modules and by incorporating knowledge of business processes and rules. Examples: SAP, Oracle ERP, Microsoft Dynamics.", "src": "P1 · p.47-50"}, {"c": "mag", "lab": "COTS INTEGRATION PROBLEMS", "lead": "Five problems with integrating application systems.", "txt": "<b>1.</b> Lack of control over functionality and performance. <b>2.</b> Applications may be less effective than they appear. <b>3.</b> Problems with inter-operability (different assumptions). <b>4.</b> No control over system evolution (vendor controls). <b>5.</b> Support from system vendors may not be available over the lifetime of the product.", "src": "P1 · p.56"}]}, {"t": "wide", "c": "sand", "lab": "TONIGHT&rsquo;S COTS DECISION", "lead": "The hospital chose COTS-solution. Tonight&rsquo;s question is whether to switch to COTS-integrated.", "txt": "The hospital chose SchedulPro as a COTS-solution: a single product configured for their environment. The trade-off: the vendor controls maintenance and the platform. Tonight&rsquo;s gap (mental health workflow) cannot be fixed by configuration &mdash; the vendor controls the core. The alternative is COTS-integrated: wrap SchedulPro with a service interface and integrate a custom mental health module. The trade-off: the hospital now owns maintenance and the platform, but they also own the mental health workflow.", "field": {"id": "cots_decision", "core": false, "rows": 2, "ph": "For your verdict: should the hospital switch from COTS-solution to COTS-integrated? What do they gain and what do they lose?"}}, {"t": "principle", "txt": "COTS-solution is not a less-customizable COTS-integrated. It is a fundamentally different ownership model &mdash; the vendor owns the system, or the hospital owns the system. The trade-off is ownership, not customization."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: COTS solutions and integrated applications. Two minutes. The COTS-solution vs COTS-integrated distinction is the chapter&rsquo;s key design choice for application system reuse. The room usually says &ldquo;switch to COTS-integrated&rdquo; because the hospital needs the mental health workflow. The deeper question is what they lose: maintenance responsibility, platform responsibility, and the risk that SchedulPro&rsquo;s evolution diverges from the integration layer. A student who says &ldquo;integrate&rdquo; has not answered; push for what they lose.", "appendix": false, "_iscarbRule": "X06 - Application system reuse: COTS and ERP", "route": "core", "showIf": null, "sourceRange": "41–58", "answer": "An ERP system is a generic system that supports common business processes such as ordering, invoicing, and manufacturing. The generic core is adapted by including modules and by incorporating knowledge of business processes and rules. Examples: SAP, Oracle ERP, Microsoft Dynamics. 1. Lack of control over functionality and performance. 2. Applications may be less effective than they appear. 3. Problems with inter-operability (different assumptions). 4. No control over system evolution (vendor controls). 5. Support from system vendors may not be available over the lifetime of the product. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A COTS product meets today’s functions. What additional evidence is needed before adoption?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "Check non-functional needs, integration assumptions, configuration, support lifetime, vendor-controlled evolution and exit constraints. A feature list alone is insufficient.", "timebox": "60 sec", "appendix": false}, {"k": "R18", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain ERP systems as the most common form of software reuse, and the ERP configuration process.", "title": "ERP architecture and configuration", "sub": "A strong process removes operational ambiguity before the day it is needed &mdash; and knows where its assumptions stop.", "blocks": [{"t": "figure", "img": "ch15_erparch", "cap": "p.48 · architecture of an ERP system", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "ERP ARCHITECTURE", "lead": "Modules, processes, database, rules.", "txt": "An ERP system has modules to support different business functions, business processes associated with each module, a common database, and business rules that apply to all data."}]}]}, {"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.15 &mdash; ERP systems", "items": [{"c": "teal", "lab": "1 · ERP ARCHITECTURE", "lead": "Modules, processes, database, rules.", "txt": "An ERP system has: <b>modules</b> to support different business functions; <b>business processes</b> associated with each module; a <b>common database</b> that maintains information about all related business functions; <b>business rules</b> that apply to all data in the database.", "src": "P1 · p.49"}, {"c": "teal", "lab": "2 · ERP CONFIGURATION", "lead": "Seven steps to configure an ERP.", "txt": "<b>1.</b> Select required functionality. <b>2.</b> Establish a data model. <b>3.</b> Define business rules. <b>4.</b> Define external interactions. <b>5.</b> Design input forms and output reports. <b>6.</b> Design new business processes. <b>7.</b> Set deployment parameters.", "src": "P1 · p.50"}, {"c": "teal", "lab": "3 · ERP AS REUSE", "lead": "The most common form of software reuse.", "txt": "ERP systems represent probably the most common form of software reuse. The generic core is adapted by including modules and by incorporating knowledge of business processes and rules. Examples: SAP, Oracle ERP, Microsoft Dynamics.", "src": "P1 · p.47"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "not in the chapter &mdash; your context", "items": [{"t": "wide", "c": "mag", "lab": "BACK TO THE COTS DECISION &mdash; THE PART NOBODY CALLED A DESIGN DECISION", "lead": "The hospital chose a COTS-solution, not an ERP. But the ERP configuration process is the model for what they should have done.", "txt": "The thing that put you in the room was a <i>COTS decision without a configuration process</i>: the hospital chose SchedulPro without following the seven-step ERP configuration process. Three questions the process owes an answer to, none about the COTS product itself. <b>Which functionality</b> did they select &mdash; and did they check the mental health workflow? <b>Which business rules</b> did they define &mdash; and did they include the mandatory waiting periods? <b>Which business processes</b> did they design &mdash; and did they include dual-appointment booking? A defined process answers these in advance; an improvised one discovers them at month six."}]}}, {"t": "principle", "txt": "The line is not COTS vs ERP. It is &ldquo;followed the configuration process&rdquo; against &ldquo;did not follow the configuration process.&rdquo;"}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: ERP architecture and configuration. The ERP configuration process is the technique that survives COTS certification best, because it forces the team to name the functionality, the business rules, and the business processes explicitly. Say that &mdash; it is the one thing on this slide students can use in their project next week. <b>Then spend a full minute on the magenta card.</b> The crisis that opened the hour was a COTS decision without a configuration process, and the room has spent seventy minutes arguing about the system without once asking about the configuration steps. That is the most common mistake in industry as well as in the classroom: the failure gets attributed to the COTS product rather than to the configuration process that was not followed. Three answers to look for &mdash; a functionality selection that includes mental health, business rules that include waiting periods, and business processes that include dual-appointment booking. A student who says &ldquo;we should have configured it better&rdquo; has not answered; push for which of the seven steps was skipped.", "appendix": false, "_iscarbRule": "RULE 18 - ERP systems and the most common form of reuse", "route": "core", "showIf": null, "sourceRange": "41–58", "answer": "An ERP system has modules to support different business functions, business processes associated with each module, a common database, and business rules that apply to all data. An ERP system has: modules to support different business functions; business processes associated with each module; a common database that maintains information about all related business functions; business rules that apply to all data in the database. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R09", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain how service-oriented interfaces and application wrapping enable COTS-integrated systems.", "title": "Wrapping and application integration", "sub": "Application system integration can be simplified if a service-oriented approach is used. A service-oriented approach means allowing access to the application system&rsquo;s functionality through a standard service interface.", "blocks": [{"t": "figure", "img": "ch15_wrapping", "cap": "p.55 · application wrapping", "right": [{"t": "cards", "cols": 1, "items": [{"c": "violet", "lab": "APPLICATION WRAPPING", "lead": "A wrapper that hides the application and provides services.", "txt": "Application wrapping means defining a set of interfaces around an existing application system to provide access to its functionality through a standard service interface. The wrapper translates between the application&rsquo;s internal interface and the standard service interface."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "SERVICE-ORIENTED INTERFACE", "lead": "A standard service interface for each unit of functionality.", "txt": "A service-oriented approach means allowing access to the application system&rsquo;s functionality through a standard service interface, with a service for each discrete unit of functionality. Some applications offer a service interface; sometimes the integrator must implement it.", "src": "P1 · p.54"}, {"c": "sand", "lab": "APPLICATION WRAPPING", "lead": "A wrapper that hides the application and provides services.", "txt": "Sometimes the service interface has to be implemented by the system integrator. You have to program a wrapper that hides the application and provides externally visible services. The wrapper translates between the application&rsquo;s internal interface and the standard service interface.", "src": "P1 · p.54-55"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "WHAT SCHEDULPRO NEEDS", "txt": "A service interface that exposes appointment scheduling, patient lookup, and availability checking."}, {"c": "mag", "lab": "WHAT MENTCARE NEEDS", "txt": "A service interface that exposes patient records, treatment plans, and medication data."}, {"c": "violet", "lab": "WHAT THE INTEGRATION LAYER NEEDS", "txt": "A custom mental health module that implements the mandatory waiting periods and dual-appointment booking."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S INTEGRATION QUESTION", "lead": "Does SchedulPro offer a service interface? If not, the hospital must write a wrapper.", "txt": "The key technical question is whether SchedulPro exposes a service interface (API) that the integration layer can call. If it does, the integration is straightforward: the hospital writes a mental health module that calls SchedulPro&rsquo;s services. If it does not, the hospital must write a wrapper that wraps SchedulPro and provides a service interface &mdash; which is more work and more risk. The answer determines the cost and timeline of the COTS-integrated approach.", "field": {"id": "integration_question", "core": false, "rows": 2, "ph": "For your verdict: does SchedulPro offer a service interface? If not, what does the wrapper look like?"}}, {"t": "principle", "txt": "A service-oriented interface is not a nice-to-have for COTS-integrated systems. It is the prerequisite. Without it, the integration is a wrapper &mdash; and the wrapper is the hospital&rsquo;s responsibility forever."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Wrapping and application integration. Two minutes. The service-oriented interface is the technical prerequisite for COTS-integrated systems. The room usually assumes SchedulPro has an API. The deeper question is: what if it does not? Then the hospital must write a wrapper &mdash; a piece of code that translates between SchedulPro&rsquo;s internal interface and a standard service interface. That wrapper is the hospital&rsquo;s responsibility forever, including when SchedulPro upgrades. A student who says &ldquo;integrate using services&rdquo; has not answered; push for whether SchedulPro offers services, and what happens if it does not.", "appendix": false, "_iscarbRule": "RULE 09 - Service-oriented interfaces and application wrapping", "route": "core", "showIf": null, "sourceRange": "41–58", "answer": "Application wrapping means defining a set of interfaces around an existing application system to provide access to its functionality through a standard service interface. The wrapper translates between the application’s internal interface and the standard service interface. A service-oriented approach means allowing access to the application system’s functionality through a standard service interface, with a service for each discrete unit of functionality. Some applications offer a service interface; sometimes the integrator must implement it. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "The hospital chose SchedulPro, a COTS appointment system, for the Mentcare system. Six months in, the team discovered it cannot handle the mental health workflow &mdash; mandatory waiting periods and dual-appointment booking."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is the reuse planning factors analysis for the Mentcare appointment system, signed by the project reuse engineer, with the six factors (schedule, lifetime, team skills, criticality, domain, platform) marked for the SchedulPro decision. It distinguishes a real gap in the reuse decision from a single feature gap. Pending that evidence, state a bounded hold, adapt, or switch decision, its owner and the condition for resuming operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "C01", "title": "Source coverage and study checklist", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>58 supplied slides indexed.</b> Every original topic has a classroom location and a source review location. This map records material availability, not time actually taught or student mastery.</p><p>Five chapter objectives connect to supplied syllabus CLO 7. Original concepts remain required even when detailed examples are completed after class.</p></div><div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Original topic</th><th>Source slides</th><th>Classroom location</th><th>Full source</th></tr></thead><tbody><tr><td>Opening and source outline</td><td>1–2</td><td><button class=\"lp-btn\" data-jump=\"START\">Your route through this chapter</button></td><td><button class=\"lp-btn\" data-jump=\"SRC00\">Read source</button></td></tr><tr><td>Reuse benefits, problems and planning</td><td>3–15</td><td><button class=\"lp-btn\" data-jump=\"X01\">Reuse-based software engineering</button> · <button class=\"lp-btn\" data-jump=\"X02\">Benefits and problems of reuse</button> · <button class=\"lp-btn\" data-jump=\"X02A\">The reuse landscape</button> · <button class=\"lp-btn\" data-jump=\"D15\">Reuse planning and configuration</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Frameworks, MVC and inversion of control</td><td>16–25</td><td><button class=\"lp-btn\" data-jump=\"X03\">Frameworks, MVC and inversion of control</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Product lines and configuration</td><td>26–40</td><td><button class=\"lp-btn\" data-jump=\"X04\">Software product lines</button> · <button class=\"lp-btn\" data-jump=\"X05\">Developing and configuring a product instance</button> · <button class=\"lp-btn\" data-jump=\"D15\">Reuse planning and configuration</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Application reuse, ERP and integration</td><td>41–58</td><td><button class=\"lp-btn\" data-jump=\"X06\">COTS solutions and integrated applications</button> · <button class=\"lp-btn\" data-jump=\"R18\">ERP architecture and configuration</button> · <button class=\"lp-btn\" data-jump=\"R09\">Wrapping and application integration</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch15-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 15 – Software Reuse</summary><div class=\"lp-source-text\"></div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\nThe reuse landscape \nApplication frameworks\nSoftware product lines \nApplication system reuse\n</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "Reuse benefits, problems and planning", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–15. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch15-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · Software reuse</summary><div class=\"lp-source-text\">Software reuse\nIn most engineering disciplines, systems are designed by composing existing components that have been used in other systems.\nSoftware engineering has been more focused on original development but it is now recognised that to achieve better software, more quickly and at lower cost, we need a design process that is based on systematic software reuse.\nThere has been a  major switch to reuse-based development over the past 10 years.</div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · Reuse-based software engineering</summary><div class=\"lp-source-text\">Reuse-based software engineering\nSystem reuse\nComplete systems, which may include several application programs may be reused.\nApplication reuse\nAn application may be reused either by incorporating it without change into other or by developing application families.\nComponent reuse\nComponents of an application from sub-systems to single objects may be reused.  \nObject and function reuse\nSmall-scale software components that implement a single well-defined object or function may be reused.</div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · Benefits of software reuse </summary><div class=\"lp-source-text\">Benefits of software reuse </div><div class=\"lp-tablewrap\"><table><tr><td>Benefit</td><td>Explanation</td></tr><tr><td>Accelerated development</td><td>Bringing a system to market as early as possible is often more important than overall development costs. Reusing software can speed up system production because both development and validation time may be reduced.</td></tr><tr><td>Effective use of specialists</td><td>Instead of doing the same work over and over again, application specialists can develop reusable software that encapsulates their knowledge.</td></tr><tr><td>Increased dependability</td><td>Reused software, which has been tried and tested in working systems, should be more dependable than new software. Its design and implementation faults should have been found and fixed. </td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · Benefits of software reuse </summary><div class=\"lp-source-text\">Benefits of software reuse </div><div class=\"lp-tablewrap\"><table><tr><td>Benefit</td><td>Explanation</td></tr><tr><td>Lower development costs</td><td>Development costs are proportional to the size of the software being developed. Reusing software means that fewer lines of code have to be written.</td></tr><tr><td>Reduced process risk</td><td>The cost of existing software is already known, whereas the costs of development are always a matter of judgment. This is an important factor for project management because it reduces the margin of error in project cost estimation. This is particularly true when relatively large software components such as subsystems are reused.</td></tr><tr><td>Standards compliance</td><td>Some standards, such as user interface standards, can be implemented as a set of reusable components. For example, if menus in a user interface are implemented using reusable components, all applications present the same menu formats to users. The use of standard user interfaces improves dependability because users make fewer mistakes when presented with a familiar interface.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · Problems with reuse </summary><div class=\"lp-source-text\">Problems with reuse </div><div class=\"lp-tablewrap\"><table><tr><td>Problem</td><td>Explanation</td></tr><tr><td>Creating, maintaining, and using a component library</td><td>Populating a reusable component library and ensuring the software developers can use this library can be expensive. Development processes have to be adapted to ensure that the library is used. </td></tr><tr><td>Finding, understanding, and adapting reusable components</td><td>Software components have to be discovered in a library, understood and, sometimes, adapted to work in a new environment. Engineers must be reasonably confident of finding a component in the library before they include a component search as part of their normal development process. </td></tr><tr><td>Increased maintenance costs</td><td>If the source code of a reused software system or component is not available then maintenance costs may be higher because the reused elements of the system may become increasingly incompatible with system changes.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · Problems with reuse </summary><div class=\"lp-source-text\">Problems with reuse </div><div class=\"lp-tablewrap\"><table><tr><td>Problem</td><td>Explanation</td></tr><tr><td>Lack of tool support</td><td>Some software tools do not support development with reuse. It may be difficult or impossible to integrate these tools with a component library system. The software process assumed by these tools may not take reuse into account. This is particularly true for tools that support embedded systems engineering, less so for object-oriented development tools.</td></tr><tr><td>Not-invented-here syndrome</td><td>Some software engineers prefer to rewrite components because they believe they can improve on them. This is partly to do with trust and partly to do with the fact that writing original software is seen as more challenging than reusing other people’s software.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · The reuse landscape</summary><div class=\"lp-source-text\">The reuse landscape\n</div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · The reuse landscape</summary><div class=\"lp-source-text\">The reuse landscape\nAlthough reuse is often simply thought of as the reuse of system components, there are many different approaches to reuse that may be used.\nReuse is possible at a range of levels from simple functions to complete application systems.\nThe reuse landscape covers the range of possible reuse techniques.</div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · The reuse landscape </summary><div class=\"lp-source-text\">The reuse landscape \n\n</div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Approaches that support software reuse </summary><div class=\"lp-source-text\">Approaches that support software reuse </div><div class=\"lp-tablewrap\"><table><tr><td>Approach</td><td>Description</td></tr><tr><td>Application frameworks</td><td>Collections of abstract and concrete classes are adapted and extended to create application systems.</td></tr><tr><td>Application system integration</td><td>Two or more application systems are integrated to provide extended functionality</td></tr><tr><td>Architectural patterns</td><td>Standard software architectures that support common types of application system are used as the basis of applications. Described in Chapters 6, 11 and 17.</td></tr><tr><td>Aspect-oriented software development</td><td>Shared components are woven into an application at different places when the program is compiled. Described in web chapter 31.</td></tr><tr><td>Component-based software engineering</td><td>Systems are developed by integrating components (collections of objects) that conform to component-model standards. Described in Chapter 16.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · Approaches that support software reuse </summary><div class=\"lp-source-text\">Approaches that support software reuse </div><div class=\"lp-tablewrap\"><table><tr><td>Approach</td><td>Description</td></tr><tr><td>Configurable application systems</td><td>Domain-specific systems are designed so that they can be configured to the needs of specific system customers.</td></tr><tr><td>Design patterns</td><td>Generic abstractions that occur across applications are represented as design patterns showing abstract and concrete objects and interactions. Described in Chapter 7.</td></tr><tr><td>ERP systems</td><td>Large-scale systems that encapsulate generic business functionality and rules are configured for an organization.</td></tr><tr><td>Legacy system wrapping</td><td>Legacy systems (Chapter 9) are ‘wrapped’ by defining a set of interfaces and providing access to these legacy systems through these interfaces.</td></tr><tr><td>Model-driven engineering</td><td>Software is represented as domain models and implementation independent models and code is generated from these models. Described in Chapter 5.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Approaches that support software reuse </summary><div class=\"lp-source-text\">Approaches that support software reuse </div><div class=\"lp-tablewrap\"><table><tr><td>Approach</td><td>Description</td></tr><tr><td>Program generators</td><td>A generator system embeds knowledge of a type of application and is used to generate systems in that domain from a user-supplied system model.</td></tr><tr><td>Program libraries</td><td>Class and function libraries that implement commonly used abstractions are available for reuse.</td></tr><tr><td>Service-oriented systems</td><td>Systems are developed by linking shared services, which may be externally provided. Described in Chapter 18.</td></tr><tr><td>Software product lines</td><td>An application type is generalized around a common architecture so that it can be adapted for different customers.</td></tr><tr><td>Systems of systems</td><td>Two or more distributed systems are integrated to create a new system. Described in Chapter 20.<br> </td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Reuse planning factors</summary><div class=\"lp-source-text\">Reuse planning factors\nThe development schedule for the software.\nThe expected software lifetime.\nThe background, skills and experience of the development team.\nThe criticality of the software and its non-functional requirements.\nThe application domain.\nThe execution platform for the software.</div></details>"}], "noAnswer": true, "sourceRange": "3–15", "appendix": true}, {"k": "SRC02", "title": "Frameworks, MVC and inversion of control", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 16–25. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch15-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · Application frameworks</summary><div class=\"lp-source-text\">Application frameworks\n</div></details><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · Framework definition</summary><div class=\"lp-source-text\">Framework definition\n\n\n“..an integrated set of software artefacts (such as classes, objects and components) that collaborate to provide a reusable architecture for a family of related applications.”\n</div></details><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · Application frameworks</summary><div class=\"lp-source-text\">Application frameworks\nFrameworks are moderately large entities that can be reused. They are somewhere between system and component reuse.\nFrameworks are a sub-system design made up of a collection of abstract and concrete classes and the interfaces between them.\nThe sub-system is implemented by adding components to fill in parts of the design and by instantiating the abstract classes in the framework.</div></details><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · Web application frameworks</summary><div class=\"lp-source-text\">Web application frameworks\nSupport the construction of dynamic websites as a front-end for web applications.\nWAFs are now available for all of the commonly used web programming languages e.g. Java, Python, Ruby, etc.\nInteraction model is based on the Model-View-Controller composite pattern.</div></details><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Model-view controller</summary><div class=\"lp-source-text\">Model-view controller\nSystem infrastructure framework for GUI design.\nAllows for multiple presentations of an object and separate interactions with these presentations.\nMVC framework involves the instantiation of a number of patterns (as discussed in Chapter 7).</div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · The Model-View-Controller pattern </summary><div class=\"lp-source-text\">The Model-View-Controller pattern </div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · WAF features</summary><div class=\"lp-source-text\">WAF features\nSecurity \nWAFs may include classes to help implement user authentication (login) and access.\nDynamic web pages \nClasses are provided to help you define web page templates and to populate these dynamically from the system database.\nDatabase support \nThe framework may provide classes that provide an abstract interface to different databases.\nSession management \nClasses to create and manage sessions (a number of interactions with the system by a user) are usually part of a WAF.\nUser interaction \nMost web frameworks now provide AJAX support (Holdener, 2008), which allows more interactive web pages to be created.</div></details><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · Extending frameworks</summary><div class=\"lp-source-text\">Extending frameworks\nFrameworks are generic and are extended to create a more specific application or sub-system. They provide a skeleton architecture for the system.\nExtending the framework involves\nAdding concrete classes that inherit operations from abstract classes in the framework;\nAdding methods that are called in response to events that are recognised by the framework.\nProblem with frameworks is their complexity which means that it takes a long time to use them effectively.</div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · Inversion of control in frameworks </summary><div class=\"lp-source-text\">Inversion of control in frameworks </div></details><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · Framework classes</summary><div class=\"lp-source-text\">Framework classes\nSystem infrastructure frameworks\nSupport the development of system infrastructures such as communications, user interfaces and compilers.\nMiddleware integration frameworks\nStandards and classes that support component communication and information exchange.\nEnterprise application frameworks\nSupport the development of specific types of application such as telecommunications or financial systems.</div></details>"}], "noAnswer": true, "sourceRange": "16–25", "appendix": true}, {"k": "SRC03", "title": "Product lines and configuration", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 26–40. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch15-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Software product lines</summary><div class=\"lp-source-text\">Software product lines\n</div></details><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · Software product lines</summary><div class=\"lp-source-text\">Software product lines\nSoftware product lines or application families are applications with generic functionality that can be adapted and configured for use in a specific context.\nA software product line is a set of applications with a common architecture and shared components, with each application specialized to reflect different requirements. \nAdaptation may involve:\nComponent and system configuration;\nAdding new components to the system;\nSelecting from a library of existing components;\nModifying components to me
