lution", "Tonight"], "rows": [{"c": "teal", "cells": ["COTS-solution", "A single COTS product provides the functionality.", "System vendor.", "<b>What the hospital chose.</b> The vendor controls the roadmap; mental health features are not on it."]}, {"c": "sand", "cells": ["COTS-integrated", "Several heterogeneous COTS products are integrated.", "System owner (the hospital).", "<b>The potential solution.</b> The hospital integrates SchedulPro with a custom mental health module."]}, {"c": "violet", "cells": ["Configurable application system", "A generic application system configured for a specific customer.", "System vendor (for the core) + customer (for configuration).", "<b>What SchedulPro is.</b> The hospital configures it, but the vendor controls the core."]}, {"c": "mag", "cells": ["Application framework", "A collection of abstract and concrete classes adapted and extended.", "The development team (the hospital).", "<b>The alternative.</b> The hospital builds a custom system on Django/Rails with full control."]}]}, {"t": "compare", "head": ["Trade-off", "Speed", "Cost", "Control", "Tonight&rsquo;s verdict"], "rows": [{"c": "teal", "cells": ["COTS-solution", "Fast (configure, not build)", "Low (no development)", "Low (vendor controls roadmap)", "<b>Failed</b> &mdash; vendor will not add mental health features."]}, {"c": "sand", "cells": ["COTS-integrated", "Medium (write wrappers/adaptors)", "Medium (integration development)", "Medium (hospital owns integration)", "<b>Potential</b> &mdash; hospital adds mental health module."]}, {"c": "violet", "cells": ["Configurable app", "Fast (configure)", "Low (no development)", "Low (vendor controls core)", "<b>Same as COTS-solution</b> &mdash; configuration cannot change the core assumptions."]}, {"c": "mag", "cells": ["Application framework", "Slow (build from scratch)", "High (full development)", "High (hospital owns everything)", "<b>Alternative</b> &mdash; hospital builds exactly what it needs."]}]}, {"t": "conceptflow", "items": [["COTS-SOLUTION", "Vendor controls"], ["COTS-INTEGRATED", "Hospital integrates"], ["FRAMEWORK", "Hospital builds"]]}, {"t": "principle", "c": "mag", "txt": "A COTS-solution is not a configurable application system with more control. It is a configurable application system with the same control &mdash; the vendor owns the core. The only way to get more control is to move to COTS-integrated or framework."}], "hueOk": "Four approaches and four trade-offs each carry their own colour so the student can find the same row again on the comparison; one colour would make both tables read as undifferentiated lists.", "timebox": "2 min", "cut": true, "task": "Write tonight&rsquo;s decision as one sentence naming the approach the hospital chose, the trade-off it made, and the approach it should switch to &mdash; in that order.", "say": "You will lose marks all semester for swapping these four approaches. Two minutes now saves that.", "notes": "<b>The sentence to make them write:</b> most students write &ldquo;the hospital chose a COTS and it failed&rdquo; and stop &mdash; that names none of the approaches correctly. The useful sentence names all three in order &mdash; <i>this approach</i> with <i>this trade-off</i> failed because of <i>this problem</i>, so switch to <i>this approach</i> &mdash; and that is also the shape of a defensible reuse decision. Two minutes, and it is worth the two even though nothing here is new to a strong student. Do not read the tables aloud; that is what they are for. Instead ask one student to say tonight&rsquo;s decision as the three-part sentence, and correct only the ordering. The second table is the one to point at when a student later writes &ldquo;we should configure SchedulPro better&rdquo;: configuration cannot change the core assumptions. This is a designated cut point: if behind, say the three-part sentence once and move on. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "B01", "rule": "B01 - COTS-solution vs COTS-integrated", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Explain the COTS-solution vs COTS-integrated distinction and why it is an ownership model, not a customization level.", "title": "COTS-solution vs COTS-integrated &mdash; the ownership model", "sub": "The chapter (p.46) distinguishes two approaches to application system reuse. The distinction is not about customization &mdash; it is about who owns the system.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "architecture pattern, drawn from source table"}, "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "COTS-SOLUTION", "lead": "A single product provides the functionality.", "txt": "<b>Functionality:</b> single product. <b>Solution basis:</b> generic solution and standardized processes. <b>Development focus:</b> system configuration. <b>Maintenance:</b> system vendor is responsible. <b>Platform:</b> system vendor provides the platform. <b>Tonight&rsquo;s choice &mdash; and tonight&rsquo;s failure.</b>", "src": "P1 · p.46"}, {"c": "mag", "lab": "COTS-INTEGRATED", "lead": "Several heterogeneous products are integrated.", "txt": "<b>Functionality:</b> several products integrated. <b>Solution basis:</b> flexible solutions for customer processes. <b>Development focus:</b> system integration. <b>Maintenance:</b> system owner is responsible. <b>Platform:</b> system owner provides the platform. <b>Tonight&rsquo;s potential solution.</b>", "src": "P1 · p.46"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "WHAT TONIGHT CAUGHT", "txt": "SchedulPro (COTS-solution) was configured successfully for general appointments."}, {"c": "mag", "lab": "WHAT TONIGHT MISSED", "txt": "The mental health workflow cannot be configured &mdash; the vendor controls the core."}, {"c": "violet", "lab": "WHAT WOULD FIX IT", "txt": "COTS-integrated: wrap SchedulPro and add a custom mental health module."}]}, {"t": "principle", "c": "mag", "txt": "COTS-solution and COTS-integrated are not two levels of the same approach. They are two ownership models &mdash; vendor owns the system, or customer owns the system. The trade-off is ownership, not customization."}], "timebox": "90 sec", "task": "For tonight&rsquo;s breach: name which approach was chosen, which should be switched to, and what ownership changes.", "notes": "Ninety seconds. The slide exists because students confuse COTS-solution and COTS-integrated as two customization levels. They are not: they are two ownership models. COTS-solution means the vendor owns maintenance and the platform; COTS-integrated means the hospital owns them. Tonight the hospital chose COTS-solution (vendor owns) and the gap is that the vendor will not add the mental health features. Switching to COTS-integrated means the hospital takes ownership &mdash; and takes responsibility. A student who says &ldquo;integrate for more customization&rdquo; has not understood; push for what ownership changes.", "appendix": true, "route": "toolkit"}, {"k": "R14", "rule": "RULE 14 - Practitioner workload", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name a workload cost their reuse design creates for a practitioner, and the design change that reduces it.", "title": "Engineering changes human work", "sub": "A reuse-based design can still fail operationally if it creates unsustainable workload.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "CONFIGURATION BURDEN", "lead": "How many configuration parameters, and who sets them?", "txt": "A COTS-solution with 200+ configuration parameters trains administrators to use defaults rather than tune them. The mental health workflow was never configured because nobody knew which parameter to set."}, {"c": "sand", "lab": "INTEGRATION WORKLOAD", "txt": "Who maintains the integration layer, who writes the wrappers, who tests the upgrades &mdash; and do they have the hours the process assumes?"}, {"c": "mag", "lab": "VENDOR MANAGEMENT", "txt": "What schedule pressure is the team absorbing with the vendor? A COTS upgrade that breaks the integration layer is a vendor management issue, not a technical one."}, {"c": "violet", "ic": "spark", "lab": "WHO WRITES IT NOW", "lead": "Generated code moves the load; it does not remove it.", "txt": "Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing more that they did not write. The integration wrapper is exactly the kind of code a model writes plausibly and a reviewer under-scrutinises."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT, THIS IS THE MECHANISM &mdash; NOT A FOOTNOTE", "lead": "Blaming the vendor ends the investigation. Workload as a design input continues it.", "txt": "The mental health workflow was never configured because the configuration parameters were too complex for the administrator to find. The integration layer was never built because the team did not have time. The vendor management was never done because the project manager assumed the vendor would add the features. Each of these is a workload variable, not a discipline problem. The source says creating, maintaining, and using a component library can be expensive (p.7) and that engineers must be reasonably confident of finding a component before they include a search (p.7). Blaming the vendor ends the investigation; treating workload as a design input continues it.", "field": {"id": "workload", "core": false, "rows": 2, "ph": "One workload cost your reuse design creates for a real practitioner, and the concrete design change that reduces it", "ex": "<i>Shape only:</i> &ldquo;My design adds a 200-parameter configuration form. With generated documentation the team now files four times as many support tickets, so the help desk becomes the bottleneck. Design change: parameters below a stated risk band get a standing default, and the administrator sees a weekly batch of changes instead of a queue.&rdquo;"}}, {"t": "principle", "txt": "Trade-offs include people, process, evidence and time &mdash; not only code."}], "timebox": "90 sec", "task": "Name one workload cost your preferred reuse design creates for a real practitioner, and the design change that reduces it.", "notes": "The rule with no equivalent in the textbook, and where ISCARB differs from a standard reuse lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change &mdash; configuration simplification, integration layer ownership with named hours, vendor management with a named owner. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b> Every student in the room is already using generated code, and almost none of them has been asked what it did to the review load rather than to the writing load. Two things to say. First, the honest framing: the tool did not remove the work, it moved it &mdash; from writing, which is visible and estimated, to reviewing, which is neither. Second, connect it to the crisis: the integration wrapper was never built because there was no time, and a reviewer who approves generated wrapper code without reading it is the same failure with a keyboard. If a student answers &ldquo;it just makes us faster&rdquo;, ask who reviews the faster output and how many hours they have.", "appendix": true, "route": "toolkit"}, {"k": "X08", "answer": "Illustrative target, not a measured result or a value from the chapter: Monitor the SchedulPro version against the integration layer's compatibility matrix. Target: 100% compatibility at every SchedulPro upgrade, checked at every upgrade with a regression test report to the reuse engineer. If the target is missed (any incompatibility found), alert the integration layer maintainer, freeze the SchedulPro upgrade, and patch the integration layer before approving the upgrade. The target and fallback require approval for the actual system.", "rule": "X08 - The same ideas, the other vocabulary", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Say the reuse idea they have just used in the vocabulary a services team would use for it.", "title": "You already know these. You may not know their other names.", "sub": "Left column: what this chapter calls it. Right column: what the same argument is called where most of you will work. Same idea, different room.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "not in the chapter &mdash; the chapter predates the vocabulary"}, "blocks": [{"t": "compare", "head": ["In this chapter", "Where most of you will work", "What the second one adds"], "rows": [{"c": "teal", "cells": ["Application reuse (COTS)", "A managed service or SaaS product", "A vendor-managed service with an SLA, not a product you configure"]}, {"c": "teal", "cells": ["COTS-integrated (wrapping)", "An API gateway + microservices", "A standard pattern for integrating vendor services with custom code"]}, {"c": "sand", "cells": ["A monitor with a trigger value and an owner (Rule 10)", "A runbook alert with an escalation policy", "The rule that an alert nobody acts on is deleted, not tuned"]}, {"c": "sand", "cells": ["Product instance development (6 steps)", "A CI/CD pipeline with feature flags", "A pipeline that automates the 6 steps and adds rollback"]}, {"c": "mag", "cells": ["Requirements-to-capabilities matrix (step 4)", "A gap analysis or a capability matrix", "A document that maps each requirement to a capability and flags the gaps"]}, {"c": "violet", "cells": ["Application wrapping (p.55)", "An adapter or a facade pattern", "A design pattern that hides a complex system behind a simple interface"]}]}, {"t": "wide", "c": "violet", "lab": "ONE LINE, IN THE OTHER VOCABULARY", "field": {"id": "vocab_own", "core": false, "rows": 1, "ph": "Take the monitor you wrote in Rule 10 and state it as a target, a window, and what happens when it is missed"}}], "hueOk": "Colours carry over from X02 and B01 so the student recognises which family each row belongs to; the row is a translation, and the colour is what says of what.", "timebox": "90 sec", "cut": true, "task": "Read the middle column. Then restate your own Rule 10 monitor in it.", "say": "Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.", "notes": "Ninety seconds, and resist expanding it &mdash; the point is recognition, not instruction. Two things worth saying. First, the honest history: this chapter was written before the vocabulary in the middle column existed as a discipline, so the gap is chronological rather than a disagreement, and the concepts map almost one to one. Second, the direction of the translation matters: a student who learns only the middle column can run a microservice and cannot argue a COTS decision to a regulator, while a student who has both can do both, which is the actual advantage this degree gives them. If someone asks which vocabulary is right, the answer is the room you are in &mdash; a regulator will not accept an API gateway diagram and a service team will not accept a COTS-solution table, and knowing which is which is the skill. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R15", "answer": "<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>", "rule": "RULE 15 - AI assist + human sign-off", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.", "title": "AI prepares evidence; humans own assurance", "sub": "AI is permitted for preparation, never for unowned approval.", "badge": {"c": "mag", "t": "AI MOMENT", "s": "assist, not assurance"}, "blocks": [{"t": "aiflow"}, {"t": "aigate"}], "timebox": "90 sec", "task": "Run the gate on the way you actually used AI this week &mdash; on a real output, not a hypothetical. <b style=\"color:var(--mag)\">You are the project reuse engineer.</b>", "notes": "The gate is the rule, not the three stations above it &mdash; make every student run it on something they really did this week, not on a hypothetical. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second &mdash; which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. It means the artifact you file is the test you ran and what it showed, never the prompt or the answer. A student who cannot say which of the two middle questions their own use passed has not yet understood what they filed. The remaining trap is yes / no / no: an output that becomes evidence and is neither re-derivable nor testable is exactly the unverifiable claim this course exists to refuse. Note what is deliberately absent: vendor benchmark numbers. If a student cites an accuracy figure or a mean-time-to-integrate, ask which study. That is the break-even discipline from X04 applied to AI, and if you let it slide the session&rsquo;s whole argument about evidence collapses in its final ten minutes.", "appendix": true, "route": "toolkit"}], "appendixUnits": ["C01", "SRC00", "SRC01", "SRC02", "SRC03", "SRC04", "R01", "R02R03", "R08", "R10", "R12", "J02", "R02", "R03", "R04", "R05", "H01", "QA1", "QA2", "R06", "R07", "QA3", "R11", "R13", "QA4", "R16", "R17", "R19", "J01", "R20", "X07", "B01", "R14", "X08", "R15"], "mainUnits": ["TITLE", "START", "X01", "X02", "X02A", "D15", "CHECK1", "X03", "X04", "X05", "X06", "CHECK2", "R18", "R09", "APPLY", "END"], "path": {"chapter": 15, "assignment": 6, "exit": ["Compare benefits and costs of reuse.", "Select an approach using planning factors.", "Explain MVC and inversion of control.", "Distinguish product-line specialization and configuration.", "Compare COTS solution, COTS integration and ERP."], "sourceFile": "sources/Ch15-Original.pptx", "build": "20260921-learning-path-v1"}, "caseMap": [{"title": "Classroom application", "parts": [["Claim and evidence", "f:path_claim"], ["Limit and challenge", "f:path_limit"], ["Owner and next step", "f:path_owner"]]}]};

/* ---------- locale tokens ----------------------------------------------------
   Every institution-specific name — country, regulator, accreditation body,
   national test, contact — is written ONCE in LECTURE.context and referenced as
   {{token}} anywhere in the lecture. An adopter in another country edits that one
   block and the whole hour follows. CTX-01 in tools/audit.mjs blocks a build that
   still contains an unresolved token, and warns when a known body name is typed
   into a slide instead of being declared here. */
/* An Arabic or Hebrew lecture sets dir:'rtl' and the whole hour flips: the
   engine holds no left/right assumptions the data cannot override. lang feeds
   the html attribute so a screen reader picks the right voice. */
(function(){
  var st=document.getElementById('stage');
  st.setAttribute('dir', LECTURE.dir||'ltr');
  st.setAttribute('lang', LECTURE.lang||'en');
  if(LECTURE.font) st.style.setProperty('--body', LECTURE.font);
  if(LECTURE.fontDisplay) st.style.setProperty('--disp', LECTURE.fontDisplay);
})();

/* Chrome the engine writes on its own behalf still has to be translatable, so
   it goes through the same {{token}} path as everything else — but with a
   default underneath, because an adopter should never have to declare a word
   the engine invented. A lecture that wants different wording (or Arabic)
   overrides the same key in its own `context` and wins. */
var UI_TOKENS={
  coreLabel:'Must not be blank', optionalLabel:'Optional — if you have time',
  exampleLabel:'See a worked example', exampleTitle:'Worked example — not your answer',
  recallLabel:'One question back', recallPrompt:'From earlier tonight. Answer before you look.'
};
var CTX=(function(){var o={},k; for(k in UI_TOKENS) o[k]=UI_TOKENS[k];
  var C=LECTURE.context||{}; for(k in C) o[k]=C[k]; return o;})();
function T(s){
  if(s==null) return '';
  return String(s).replace(/\{\{\s*([a-zA-Z0-9_.]+)\s*\}\}/g,function(m,k){
    return (CTX[k]!==undefined&&CTX[k]!==null)?CTX[k]:m;
  });
}

/* ---------- glossary -------------------------------------------------------
   A term a first-year student has not met yet costs the room its attention:
   they stop following the argument and start guessing the word. LECTURE.glossary
   defines each one once, and every occurrence in rendered card text carries its
   definition on hover or tap. Applied to assembled HTML, so it steps over tags
   and never rewrites an attribute or a term already inside a definition. */
var GL=(function(){
  var g=LECTURE.glossary||{}, out=[];
  for(var k in g) out.push([k,g[k]]);
  out.sort(function(a,b){return b[0].length-a[0].length;});   /* longest first */
  return out;
})();
function glossify(html){
  if(!GL.length)return html;
  var root=document.createElement('div');root.innerHTML=html;
  var nodes=[],used={},definitions={};
  GL.forEach(function(entry){definitions[entry[0].toLowerCase()]=entry[1];});
  function collect(el){
    if(el.nodeType===3){nodes.push(el);return;}
    if(el.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA|BUTTON|A)$/.test(el.tagName)||el.classList.contains('gl'))return;
    if(el.namespaceURI&&el.namespaceURI!=='http://www.w3.org/1999/xhtml')return;   /* v10: svg figure labels are not prose */
    Array.from(el.childNodes).forEach(collect);
  }
  Array.from(root.childNodes).forEach(collect);
  var terms=GL.map(function(entry){return entry[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
  var expression=new RegExp('(^|[^\\w-])('+terms.join('|')+')(?![\\w-])','gi');
  nodes.forEach(function(node){
    var raw=node.textContent,last=0,changed=false,m,fragment=document.createDocumentFragment();
    expression.lastIndex=0;
    while((m=expression.exec(raw))){
      var key=m[2].toLowerCase();if(used[key])continue;
      var start=m.index+m[1].length;
      fragment.appendChild(document.createTextNode(raw.slice(last,start)));
      var term=document.createElement('span');term.className='gl';term.textContent=m[2];term.setAttribute('data-def',definitions[key]);
      fragment.appendChild(term);last=start+m[2].length;used[key]=true;changed=true;
    }
    if(changed){fragment.appendChild(document.createTextNode(raw.slice(last)));node.parentNode.replaceChild(fragment,node);}
  });
  return root.innerHTML;
}
function positionGlossaries(root){
  (root||document).querySelectorAll('.gl').forEach(function(el){el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Define '+el.textContent);el.setAttribute('aria-expanded','false');});
}
var glossaryTerm=null,glossaryPinned=false;
function hideGlossary(){
  var tip=document.getElementById('glossaryTip');if(tip)tip.hidden=true;
  if(glossaryTerm){glossaryTerm.setAttribute('aria-expanded','false');glossaryTerm.removeAttribute('aria-describedby');}
  glossaryTerm=null;glossaryPinned=false;
}
function showGlossary(el){
  hideGlossary();var tip=document.getElementById('glossaryTip');
  if(!tip){tip=document.createElement('div');tip.id='glossaryTip';tip.setAttribute('role','tooltip');document.body.appendChild(tip);}
  tip.innerHTML=el.getAttribute('data-def');tip.dir=LECTURE.dir||'ltr';tip.hidden=false;
  var r=el.getBoundingClientRect();

  tip.style.top=Math.max(10,Math.min(window.innerHeight-tip.offsetHeight-10,r.top-tip.offsetHeight>12?r.top-tip.offsetHeight-8:r.bottom+8))+'px';
  glossaryTerm=el;el.setAttribute('aria-expanded','true');el.setAttribute('aria-describedby','glossaryTip');
}
document.addEventListener('mouseover',function(e){var el=e.target.closest&&e.target.closest('.gl');if(el&&glossaryTerm!==el)showGlossary(el);});
document.addEventListener('mouseout',function(e){if(!glossaryPinned&&e.target.closest&&e.target.closest('.gl'))hideGlossary();});
document.addEventListener('focusin',function(e){if(e.target.matches&&e.target.matches('.gl'))showGlossary(e.target);});
document.addEventListener('focusout',function(e){if(e.target.matches&&e.target.matches('.gl'))hideGlossary();});

/* ---------- block renderer ---------- */
/* A box is not just a box. Two things the author can say about it, and both
   are things a student in a hurry needs to know: is this one of the boxes the
   artifact is made of, and is there a worked example if I am stuck.
   `core` ranks; `ex` scaffolds. Neither invents content — a field with neither
   renders exactly as it always did. */
function rField(f){
  /* Only the core boxes get a caption. Printing "optional" over nineteen of
     twenty-eight boxes is noise that costs a line of height on every slide and
     tells the student nothing they could act on — the dashed border already
     reads as lighter, and the ? panel explains the convention once. The signal
     is which boxes the artifact is made of, so only those are captioned. */
  var lab='', core=(f.core===true?'1':(f.core===false?'0':''));
  if(f.core===true) lab+='<span class="core">'+T('{{coreLabel}}')+'</span>';
  if(f.ex) lab+='<button class="exb" data-ex="'+f.id+'" aria-expanded="false">'+T('{{exampleLabel}}')+'</button>';
  var ta='<textarea class="inp" data-f="'+f.id+'"'+(core?' data-core="'+core+'"':'')+
         ' aria-label="'+esc(f.ph).replace(/"/g,'&quot;')+'" rows="'+(f.rows||2)+'" placeholder="'+f.ph+'"></textarea>';
  if(!lab && !f.ex) return ta;
  return '<div class="fw">'+(lab?'<div class="fl">'+lab+'</div>':'')+ta+
         (f.ex?'<div class="exbox" data-exbox="'+f.id+'" hidden><b>'+T('{{exampleTitle}}')+'</b>'+f.ex+'</div>':'')+
         '</div>';
}

   An example that fills the field is an answer key, and this course does not

function cloOk(r){

       the failure trace were filled but JAH-2 still read "not supported",
       which made both the Rule 20 map and the bar gauge lie low. */
    else if(n==='@matrix'){v=''; for(var k in S.mx) if(S.mx[k]){v='y'; break;}}

/* ---------- v12 retrieval loop: 60 seconds at the close of every phase ------
   Retrieval practice is the most reliably documented effect in learning
   research, and until now the hour retrieved exactly once, at J02. A `qa`
   block closes each phase: a ring timer the back row can read, four
   questions answered FROM MEMORY first, a reveal per row, and an honest
   self-score. Nothing is saved — the drill is the moment, not an artifact. */
var QA_C=326.7;                                  /* ring circumference, r=52  */
function rQa(b){
  var items=b.items||[];
  var h='<div class="qa">'+
    '<div class="qa-side">'+
     '<button class="qa-ring" data-qa-ring="1" aria-label="Start the sixty-second retrieval timer">'+
      '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><circle class="qa-rbg" cx="60" cy="60" r="52"></circle><circle class="qa-rfg" cx="60" cy="60" r="52"></circle></svg>'+
      '<b class="qa-secs">60</b></button>'+
     '<div class="qa-meta"><span class="qa-tag">'+(b.tag||'')+'</span>'+
      '<span class="qa-hint qa-h1">Press the ring, then answer out loud from memory</span>'+
      '<span class="qa-hint qa-h2">Time &mdash; now reveal and score honestly</span></div>'+
     '<div class="qa-score" role="status"><span class="qa-slab">RECALLED</span><b class="qa-sval">0/'+items.length+'</b></div>'+
    '</div><div class="qa-list">';
  for(var i=0;i<items.length;i++){
    h+='<div class="qa-row"><span class="qa-n">'+(i+1)+'</span><div class="qa-body">'+
       '<div class="qa-q">'+items[i].q+'</div>'+
       '<div class="qa-a">'+items[i].a+'</div>'+
       '<div class="qa-judge"><button class="qa-hit" data-qa-judge="hit">Recalled it</button>'+
       '<button class="qa-miss" data-qa-judge="miss">Missed it</button></div></div>'+
       '<button class="qa-tog" data-qa-tog="1" aria-expanded="false">Reveal</button></div>';
  }
  return h+'</div></div>';
}
function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
      var live=document.getElementById('tLive');
      if(live) live.textContent='The retrieval minute is over — reveal and compare.';
    }
  },1000);
  btn.setAttribute('data-running',String(id));
}
function qaScore(box){
  var rows=box.querySelectorAll('.qa-row'),hit=0,marked=0;
  for(var i=0;i<rows.length;i++){
    if(rows[i].classList.contains('picked-hit')){hit++;marked++;}
    else if(rows[i].classList.contains('picked-miss')) marked++;
  }
  var sc=box.querySelector('.qa-score');
  if(!sc) return;
  sc.setAttribute('data-hit',(rows.length&&hit===rows.length)?'all':'part');
  sc.querySelector('.qa-sval').textContent=hit+'/'+rows.length;
}

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(typeof ref!=='string') return '';
  if(ref==='@marks') return Object.keys(S.marks||{}).filter(function(k){return Array.isArray(S.marks[k])&&S.marks[k].length;}).join(' ');
  if(ref==='@gates'){var passed=GATE_DEFS.filter(function(g){return S.gates&&S.gates[g[0]];}).length;return passed?String(passed):'';}
  if(ref==='@signed'){var signed=Object.keys(S.sign||{}).filter(function(k){return S.sign[k];}).length;return signed?String(signed):'';}
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function policyThreshold(config,key){
  var policy=LECTURE.thresholds||{},name=(config&&config.minKey)||key;
  var value=config&&Number.isFinite(config.min)?config.min:policy[name];
  if(!Number.isFinite(value)||value<0)throw new Error('Invalid LECTURE.thresholds entry: '+name);
  return value;
}
function coachState(b){
  var w=b.watch||[], filled=0, thin=false, min=policyThreshold(b,'coachDeep'), deep=b.deep;
  for(var i=0;i<w.length;i++){
    var v=String(probe(w[i])||'').trim();
    /* only the boxes named in `deep` are held to a length — a NAME box is
       legitimately three words and must not be nagged for it */
    if(v){ filled++; if(w[i].indexOf('f:')===0 && (!deep||deep.indexOf(w[i])>=0) && v.length<min) thin=true; }
  }
  if(filled<policyThreshold(null,'coachMinFilled')) return 'empty';
  if(filled<w.length||thin) return 'thin';
  return 'ok';
}
function renderCoach(){
  var ws=document.querySelectorAll('[data-coach]');
  for(var i=0;i<ws.length;i++){
    var b=COACH[ws[i].getAttribute('data-coach')]; if(!b) continue;
    var st=coachState(b), lab=st==='ok'?'Committed':(st==='empty'?'Stuck?':'Nearly');
    ws[i].setAttribute('data-st',st);
    ws[i].innerHTML='<div class="coach-label">'+lab+'</div><div class="ct">'+T(b[st]||'')+'</div>';
  }
}
var COACH=[];
function rCoach(b){ COACH.push(b); return '<div class="coach" data-coach="'+(COACH.length-1)+'"></div>'; }

/* ---------- think · pair · share ----------

/* ---------- sign and lock ---------------------------------------------------
   "Do not edit these boxes after the reveal" was an instruction with nothing
   behind it. A signature is the mechanism: the student commits, the values are
   snapshotted with a time, the inputs go read-only, and a later edit is refused
   in words rather than silently allowed. This is the chapter's own thesis
   applied to the chapter — an unsigned claim and a claim you can quietly revise
   after seeing the answer are the same thing. */
var SIGN=[];
function rSign(b){
  SIGN.push(b);
  return '<div class="signbar" data-sign="'+b.id+'" data-on="0">'+
    '<div class="st"></div><button data-signbtn="'+b.id+'">'+T(b.label||'Sign this')+'</button></div>'+
    '<div class="lockmsg" data-lockmsg="'+b.id+'"></div>';
}
function signedFields(){                      /* every ref frozen by any signature */
  var s={};
  for(var i=0;i<SIGN.length;i++){
    if(!(S.sign&&S.sign[SIGN[i].id])) continue;
    for(var j=0;j<(SIGN[i].fields||[]).length;j++) s[SIGN[i].fields[j]]=SIGN[i].id;

}
function renderSign(){
  var bs=document.querySelectorAll('[data-sign]');
  for(var i=0;i<bs.length;i++){
    var id=bs[i].getAttribute('data-sign'), b=null;
    for(var k=0;k<SIGN.length;k++) if(SIGN[k].id===id) b=SIGN[k];
    if(!b) continue;
    var rec=S.sign&&S.sign[id], on=!!rec, n=0, tot=(b.fields||[]).length;
    for(var f=0;f<tot;f++) if(String(probe(b.fields[f])||'').trim()) n++;
    bs[i].setAttribute('data-on',on?'1':'0');
    bs[i].querySelector('.st').innerHTML = on
      ? '<b>Signed at '+rec.at+'.</b> '+T(b.done||'These boxes are now read-only. Anything you learn from the reveal goes in a new box, not over this one.')
      : (n<tot ? T(b.before||'Fill every box, then sign.')+' <b>'+n+' of '+tot+'</b>'
               : '<b>'+T(b.ready||'Ready to sign.')+'</b> '+T(b.warn||'Signing freezes these boxes for the rest of the hour.'));
    var btn=bs[i].querySelector('button');

    btn.disabled = on || n<tot;

    (function(e){setTimeout(function(){e.textContent='';},4200);})(ms[i]);

}

/* ---------- self-assessed level vs. the level the artifact supports ----------
   Same split as the gates and the outcome map: what the student claims, beside
   what their evidence carries. The second one cannot be talked up, and it names
   the empty box rather than awarding a mark — Rule 19 keeps scoring off the
   live slide, and this stays descriptive. */
function levelEarned(){
  var L=LECTURE.levels; if(!L) return null;
  var best=L.tiers[0], miss=null;
  for(var i=0;i<L.tiers.length;i++){
    var t=L.tiers[i], gap=[];
    for(var n=0;n<(t.needs||[]).length;n++)
      if(!String(probe(t.needs[n])||'').trim()) gap.push(t.needs[n]);
    if(gap.length){ miss=miss||{tier:t,gap:gap}; break; }
    best=t;
  }
  return {best:best, next:miss};
}
function rLevels(){
  var L=LECTURE.levels; if(!L) return '';
  var opts=[]; for(var i=0;i<L.tiers.length;i++) opts.push(L.tiers[i].k);

    '<div class="lvlread" data-lvlread="1"></div></div>';
}
function renderLevels(){

  var said=S.pick[L.g||'level'], NAMES=LECTURE.fieldNames||{};
  var h, mode='';
  if(!said) h='Pick the level you think you are at. The line will then compare it with what your card actually carries.';
  else{
    var order=L.tiers.map(function(t){return t.k;});
    var di=order.indexOf(said)-order.indexOf(e.best.k);
    mode = di>0?'over':(di===0?'ok':(di<0?'under':''));
    h='You said <b>'+said+'</b>. What you have produced supports <b>'+e.best.k+'</b>';
    if(e.next&&e.next.gap.length){

      h+=' &mdash; '+e.next.tier.k+' needs <span class="miss">'+names.join(', ')+'</span>, still empty.';
    } else h+=', the highest this chapter defines.';
    if(di>0) h+=' The gap between the two is the useful part: it is a specific empty box, not a verdict on you.';
    else if(di<0) h+=' You have under-read your own card &mdash; open it with C and look again.';
  }
  for(var w=0;w<ws.length;w++){ ws[w].innerHTML=T(h); ws[w].setAttribute('data-m',mode); }
}
/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    var m=s.match(/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */
function uncitedPages(){
  var C=LECTURE.coverage; if(!C||!C.span) return [];
  var hits=srcPages(), out=[], run=null;
  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }
  }
  if(run) out.push(run);
  return out;
}
function fmtRanges(rs){
  var o=[];
  for(var i=0;i<rs.length;i++) o.push(rs[i][0]===rs[i][1]?rs[i][0]:rs[i][0]+'&ndash;'+rs[i][1]);
  return o.join(', ');
}
function rCoverage(){ return '<div class="cov" data-cov="1"></div>'; }
function renderCoverage(){
  var ws=document.querySelectorAll('[data-cov]'); if(!ws.length) return;
  var C=LECTURE.coverage, rows=coverageRows(); if(!C) return;
  var LB={taught:'taught',touched:'touched once',open:'not reached'};
  var h='', nT=0, nO=0;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.st==='taught') nT++; if(r.st==='open') nO++;
    h+='<div class="cvr" data-s="'+r.st+'"><span class="k">'+r.s.k+'</span>'+
       '<span class="t">'+r.s.t+(r.s.concept?' <i>&mdash; '+r.s.concept+'</i>':'')+
       (r.st==='open'&&r.s.why?'<i style="display:block;color:var(--mag)">'+r.s.why+'</i>':'')+'</span>'+
       '<span class="w">'+(r.units.length?r.units.join(' &middot; '):'pp. '+r.s.pp[0]+'&ndash;'+r.s.pp[1])+'</span>'+
       '<span class="s">'+LB[r.st]+'</span></div>';
  }
  var gaps=uncitedPages(), np=0;
  for(var g=0;g<gaps.length;g++) np+=gaps[g][1]-gaps[g][0]+1;
  h+='<div class="covfoot"><b>'+nT+' of '+rows.length+'</b> sections of '+(C.source||'the source')+
     ' are taught here'+(nO?', and <b style="color:var(--mag)">'+nO+'</b> '+(nO===1?'is':'are')+
     ' named above as out of scope with the reason':'')+'.'+
     (gaps.length?'<br><b style="color:var(--mag)">'+np+' pages this hour never cites:</b> '+fmtRanges(gaps)+
       '. Read them '+T(LECTURE.preparation.due)+' &mdash; use the assigned Chapter 10 source-slide pack. The engine can say they were not cited, not what is on them.':'')+
     '<br>All of this is counted from the page you cited on each card. It is not a claim about coverage; it is a count.</div>';
  for(var w=0;w<ws.length;w++) ws[w].innerHTML=T(h);
}

/* ---------- two-voice slide: the book's claims vs the course's own ----------

/* ---------- confusable terms, side by side ------------------------------

/* ---------- the bridge from a requirement to something you can build --------
   THE GAP THIS CLOSES. A course built on decision and evidence produces a
   student who can defend a verdict and cannot build the thing they decided on.
   The chapter names redundancy, diversity, static analysis, formal methods —
   and never once says what you type, install or run.

   So the lecture declares one row per requirement, and the row is a chain:
   the requirement, the mechanism that serves it, what you actually build, the
   named tools that do it, and — the part that keeps this inside the ISCARB
   grammar rather than turning it into a tool advert — the artifact that proves

function rBridge(){

/* v10 — NATIVE FIGURES

   simple structure, so the engine now draws them itself — crisp at any zoom,

var NATIVE_FIG={
/* ---- the principal dependability properties (Sommerville p.7, redrawn) ---
   The book's own figure was a screenshot whose labels the hall could not
   read. This redraw keeps the source's exact structure — one root, five
   children — and adds what the lecture teaches over it: the kind tag on
   every child (MEASURE for the two probabilities, ARGUE for the three
   judgments), the page each property is cited from, and a legend. ---------- */
props:function(){
  var K='#8A93A0';
  function seg(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+K+'" stroke-width="1.4"/>';}
  var P=[{n:'Availability',c:'t',q:['Up when asked?'],pg:'p.8'},
         {n:'Reliability',c:'t',q:['Correct when up?'],pg:'p.8'},
         {n:'Safety',c:'j',q:['Will it hurt','anyone?'],pg:'p.8'},
         {n:'Security',c:'j',q:['Can it be','broken into?'],pg:'p.9'},
         {n:'Resilience',c:'j',q:['Does the critical','service survive','the event?'],pg:'p.9'}];
  var s='<svg class="nfig" viewBox="0 0 760 318" role="img" aria-label="The principal dependability properties, redrawn from page 7: Dependability branches into Availability and Reliability, which are probabilities and must be measured, and into Safety, Security and Resilience, which are judgments and must be argued to an agreed threshold. Availability, Reliability and Safety are cited from page 8; Security and Resilience from page 9." font-family="Inter,&#39;Segoe UI&#39;,Helvetica,Arial,sans-serif">';
  s+=seg(380,50,380,72)+seg(80,72,680,72);

/* ---------- hidden model answer / instructor key ---------------------------
   Every question-bearing unit gets the same open/close affordance. The author
   defines u.answer for a model response. Learning objectives and spoken teaching
   cues are never relabelled as answers. noAnswer suppresses a pre-reveal key. */
function hasQuestion(u){
  if(!u||u.k==='TITLE'||u.k==='END'||u.noAnswer===true) return false;
  if(typeof u.answer==='string'&&u.answer.trim())return true;
  if(u.question===true)return true;
  var probe=' '+(u.task||'')+' '+JSON.stringify(u.blocks||[])+' ';
  return /\?|\bchoose\b|\bclassify\b|\bdecide\b|\bname\b|\bwhich\b|\bwhat\b|\bwhy\b|\bhow\b/i.test(strip(probe));
}
function answerKey(u){
  return T(u.answer||'State a bounded claim, identify supporting evidence and name an observation that would reverse the claim. Compare your response with the source and discuss the reasoning with the instructor.');
}
function rAnswer(u){
  if(!hasQuestion(u)) return '';
  var id='ans-'+u.k, hasFields=/"field"\s*:|"picker"\s*:/.test(JSON.stringify(u.blocks||[]));
  return '<div class="answer-wrap">'+(hasFields?'<span class="attempt-hint">Try your own answer, then compare.</span>':'')+
    '<button class="answer-toggle" data-answer-toggle="'+id+'" aria-controls="'+id+'" aria-expanded="false"'+(hasFields?' data-soft="1"':'')+'>Answer</button>'+
    '<div class="answer-box" id="'+id+'" data-answer-box="'+id+'" hidden><b>EXAMPLE EXPLANATION</b><br>'+answerKey(u)+'</div></div>';
}

/* Readability pass: enlarge light slides, compact dense ones. This is structural
   rather than manual per-slide font tweaking, so every cloned lecture behaves
   consistently and titles never compete with dense content. */
function applyReadableDensity(){
  var slides=deck.querySelectorAll('.slide');
  for(var i=0;i<slides.length;i++){
    var u=U[i]||{}, raw=strip(JSON.stringify(u.blocks||[])), cards=slides[i].querySelectorAll('.card,.cvr,.brr,.cl,.jah-row,.qz-o').length;
    slides[i].classList.remove('readable-lg','dense');
    if(raw.length<1450 && cards<=5) slides[i].classList.add('readable-lg');
    if(raw.length>3600 || cards>=9) slides[i].classList.add('dense');
  }
}

/* ---------- v7 auto-fit: a slide fills the stage exactly, never scrolls -----
   Content that would overflow is measured, then the .fit wrapper is scaled
   down just enough to fit. Re-run whenever content can change size: reader
   zoom (+/-), navigation to a conditional slide, or a late-loading figure. */
function fitSlide(sl){
  sl=sl||deck.querySelector('.slide.on'); if(!sl) return;
  var fit=sl.querySelector('.fit'); if(!fit) return;
  fit.style.transform='none';
  var cs=getComputedStyle(sl);
  var avail=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!(avail>0)) return;
  var h=fit.scrollHeight;
  if(h>avail+1){
    var f=avail/h;
    if(f<.55) f=.55;                     /* legibility floor — nothing unreadable */
    fit.style.transform='scale('+f+')';
    fit.style.transformOrigin='top center';
  }
}

/* ---------- author sanity check ---------------------------------------------
   Runtime guardrails for cloned/adapted lectures. Warnings never block class.
   Run ISCARB_SANITY() from DevTools at any time to re-check the current deck. */
function sanity(){
  var issues=[], declaredF={}, declaredP={}, usedImg={}, names=LECTURE.fieldNames||{};
  function walk(x){
    if(!x) return;
    if(Array.isArray(x)){ for(var i=0;i<x.length;i++) walk(x[i]); return; }
    if(typeof x!=='object') return;
    if(x.field&&x.field.id) declaredF[x.field.id]=1;
    if(x.picker&&x.picker.g) declaredP[x.picker.g]=1;
    if(x.t==='levels')declaredP.level=1;
    if(x.img&&typeof x.img==='string') usedImg[x.img]=1;
    if(x.t==='raw'&&typeof x.html==='string'){
      var re=/data-pick=["']([^"']+)["']/g,m;
      while((m=re.exec(x.html))) declaredP[m[1]]=1;
    }
    for(var k in x) if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]);
  }
  walk(LECTURE.units||[]);

  var fs=document.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var id=fs[i].getAttribute('data-f');
    if(!declaredF[id]&&!names['f:'+id]) issues.push('data-f "'+id+'" has no field declaration or fieldNames alias');
  }

  var cm=LECTURE.caseMap||[];
  for(var c=0;c<cm.length;c++){
    var parts=cm[c].parts||[];
    for(var p=0;p<parts.length;p++){
      var ref=parts[p][1]||'';
      if(ref.indexOf('p:')===0&&!declaredP[ref.slice(2)])
        issues.push('caseMap picker "'+ref+'" is not present in lecture blocks');
      if(ref.indexOf('f:')===0&&!declaredF[ref.slice(2)]&&!names[ref])
        issues.push('caseMap field "'+ref+'" is not present in lecture blocks');
    }
  }

  var exported={};
  cm.forEach(function(section){section.parts.forEach(function(part){exported[part[1]]=true;});});
  document.querySelectorAll('[data-f]').forEach(function(el){var ref='f:'+el.getAttribute('data-f');if(!exported[ref])issues.push('Unexported answer field: '+ref);});
  document.querySelectorAll('[data-pick]').forEach(function(el){var ref='p:'+el.getAttribute('data-pick');if(!exported[ref])issues.push('Unexported choice: '+ref);});
  LECTURE.units.forEach(function(u){if(u.showIf&&u.showIf.thin&&u.showIf.minKey&&!Object.prototype.hasOwnProperty.call(LECTURE.thresholds,u.showIf.minKey))issues.push('Unknown threshold key in '+u.k);});
  for(var img in usedImg)
    if(!Object.prototype.hasOwnProperty.call(FIG,img)) issues.push('figure key "'+img+'" is used but missing from FIG');

  var keys={};
  for(var u=0;u<(LECTURE.units||[]).length;u++){
    var uk=LECTURE.units[u].k;
    if(keys[uk]) issues.push('duplicate unit key "'+uk+'"');
    keys[uk]=1;
  }

  var unresolved=(document.getElementById('deck').innerHTML.match(/\{\{\s*[^}]+\s*\}\}/g)||[]);
  if(unresolved.length) issues.push('unresolved context token(s): '+unresolved.join(', '));

  var report={ok:issues.length===0,issues:issues,fields:Object.keys(declaredF).length,
    pickers:Object.keys(declaredP).length,figures:Object.keys(usedImg).length,units:(LECTURE.units||[]).length};
  try{
    if(window.console){
      if(report.ok){ if(typeof console.info==='function') console.info('[ISCARB sanity] OK',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] OK',report); }
      else { if(typeof console.warn==='function') console.warn('[ISCARB sanity] '+issues.length+' issue(s)',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] '+issues.length+' issue(s)',report); }
    }
  }catch(e){}
  window.ISCARB_SANITY_REPORT=report;
  return report;
}
window.ISCARB_SANITY=sanity;
sanity();

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;
}
/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=policyThreshold(c,'thinDefault');
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}
  return true;
}

  var live=document.getElementById('tLive');

    return o.join('\n')+(op.length?'\nOut of scope for this hour: '+op.join('; '):'');}
  if(ref==='@clo'){var R=LECTURE.readiness||[],o=[];
    for(var i=0;i<R.length;i++) o.push(R[i].clo+': '+(cloOk(R[i])?'supported':'not supported'));
    return o.join('; ');}
  if(ref==='@marks'){var o=[];for(var k in (S.marks||{})){if(S.marks[k]&&S.marks[k].length)o.push(k+': '+S.marks[k].length+' region(s) marked');}return o.join('; ');}
  if(ref==='@aigate'){var a=S.ai||{};if(!a.q1)return '';
    var v='';
    if(a.q1==='n') v='PERMITTED — preparation only';
    else if(!a.q2||(a.q2==='n'&&!a.q2b)||!a.q3) return '';
    else if(a.q2==='y'&&a.q3==='y') v='PERMITTED as prepared evidence';
    else if(a.q2==='n'&&a.q2b==='y'&&a.q3==='y') v='PERMITTED, CONDITIONALLY — the TEST is the evidence, not the output';
    else v='NOT PERMITTED — rework before it enters the chain';
    return 'Evidence chain: '+(a.q1==='y'?'yes':'no')+
      ' · Re-derivable: '+(a.q2||'-')+
      ' · Testable: '+(a.q2b||'-')+
      ' · Named signer: '+(a.q3||'-')+
      '\nGate verdict: '+v;}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){
  var L=LECTURE, o=[];
  var line=function(x){o.push(x===undefined?'':x);};
  line('# '+strip(T(L.title))+' — course file extract');
  line('');
  line('Course: '+strip(T(L.course))+'  |  Source: '+strip(T(L.source)));
  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');
  line('lecture and rendered by the same engine that teaches it.');
  line('');
  line('Cut points ('+L.units.filter(function(u){return u.cut;}).length+'): '+L.units.filter(function(u){return u.cut;}).map(function(u){return u.k;}).join(', '));
  line('Scaffolding thresholds: '+JSON.stringify(L.thresholds));
  line('');
  line('## 1. Session outcomes, by unit');
  line('');
  line('| Unit | Rule | The student will be able to | Activity | Timebox |');
  line('|---|---|---|---|---|');
  for(var i=0;i<L.units.length;i++){
    var u=L.units[i]; if(!u.rule||!u.learn) continue;
    line('| '+u.k+' | '+strip(T(u.rule))+' | '+strip(T(u.learn))+' | '+strip(T(u.task||'—'))+' | '+(u.timebox||'—')+' |');
  }
  line('');
  line('## 2. Course and programme outcome map');
  line('');
  line('| CLO | PLO | Domain | Outcome | Evidence the student produces | Where |');
  line('|---|---|---|---|---|---|');
  for(var r=0;r<(L.readiness||[]).length;r++){
    var R=L.readiness[r], NAMES=L.fieldNames||{}, ev=[];
    for(var n=0;n<(R.needs||[]).length;n++) ev.push(NAMES[R.needs[n]]||R.needs[n]);
    line('| '+R.clo+' | '+(R.plo||'—')+' | '+(R.d||'')+' | '+strip(T(R.txt))+' | '+ev.join(', ')+' | '+strip(R.where||'')+' |');
  }
  line('');
  line('Assessment evidence is the artifact itself: the decision card the student');
  line('exports, whose sections are listed in §5. The closing unit reads the map');
  line('above off that artifact rather than off self-report.');
  line('');
  line('## 3. Source coverage');
  line('');
  var rows=coverageRows();
  if(rows.length){
    line('| Section | Pages | Status | Reached by |');
    line('|---|---|---|---|');
    for(var c=0;c<rows.length;c++){
      var R2=rows[c];
      line('| '+R2.s.k+' '+strip(R2.s.t)+' | '+R2.s.pp[0]+'–'+R2.s.pp[1]+' | '+R2.st+' | '+(R2.units.join(', ')||'—')+' |');
      if(R2.st==='open'&&R2.s.why) line('| | | out of scope | '+strip(R2.s.why)+' |');
    }
    var g=uncitedPages();
    if(g.length){ line(''); line('Pages within the source span that this session never cites: '+
      strip(fmtRanges(g))+'. Counted from the page citation on every card.'); }
  } else line('No coverage ledger declared.');
  line('');
  if(L.jahiziah){
    line('## 4. National alignment');
    line('');
    line(strip(T(L.jahiziah.gku))+' → '+strip(T(L.jahiziah.sku)));
    line('');
    line('| # | Outcome | Status | Where |');
    line('|---|---|---|---|');
    for(var j=0;j<(L.jahiziah.outcomes||[]).length;j++){
      var O=L.jahiziah.outcomes[j];
      line('| '+O.n+' | '+strip(T(O.txt))+' | '+O.s+' | '+strip(T(O.where||''))+' |');
    }
    line('');
    line('This states coverage only. It is not the national examination and');
    line('predicts nothing about any student\'s result on it.');
    line('');
  }
  line('## 5. The artifact each student leaves holding');
  line('');
  for(var m=0;m<(L.caseMap||[]).length;m++) line('- '+strip(T(L.caseMap[m].t)));
  line('');
  line('## 6. Accessibility and data');
  line('');
  line('- Runs as one HTML file with no install, no account and no network.');
  line('- Nothing a student types leaves their browser; there is no server to hold it.');
  line('- Full keyboard navigation; ? lists the keys. Text size adjustable 80–140%.');
  line('- Every status is carried by a word as well as a colour.');
  line('');
  line('Generated '+new Date().toISOString().slice(0,10)+' by the ISCARB lecture engine.');
  return o.join('\n');
}
function strip(x){
  if(x==null||x==='') return '';
  var s=String(x);
  var d=document.createElement('div'); d.innerHTML=s;
  s=(d.textContent||d.innerText||s).replace(/\s+/g,' ').trim();
  return s.replace(/\|/g,'\\|').trim();
}

var tS=0,tT=0,tOn=false,tI=null;
function fmt(s){var m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?'+':'')+m+':'+(x<10?'0':'')+x;}
function resetTimer(sec){
  tT=sec; tS=sec; tOn=false; clearInterval(tI);
  document.getElementById('timer').className='';
  document.getElementById('tBtn').textContent='Start';

function toggleTimer(){
  if(!tT) return; tOn=!tOn;
  var w=document.getElementById('timer');

  clearInterval(tI);
  if(tOn){w.className='run'; tI=setInterval(function(){

  },1000);}

/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}

/* ---------- v12 quick view: the deck turns itself ---------------------------
   One button (or Q) auto-advances at a readable pace with a visible progress
   line on the bar — built for self-review, screen recording and sharing.
   Any manual navigation cancels it (the guard sits inside go()); it holds
   still while the tab is hidden or the student is typing, and it follows
   the same visible route the arrows follow — conditional units stay skipped. */
var QV={on:false,driving:false,total:0,left:0,last:0,raf:0};
function qvDwell(i){
  var u=U[i]; if(!u) return 7000;
  if(u.k==='TITLE') return 5000;
  if(u.k==='END') return 6500;
  var b=JSON.stringify(u.blocks||[]);
  if(/"(jahtest|qa|recall|gates|levels|coverage)"/.test(b)) return 12000;
  return 7000;
}
function qvPaint(){
  var f=document.getElementById('qvFill');
  if(f) f.style.width=(QV.total?Math.max(0,Math.min(100,QV.left/QV.total*100)):0)+'%';
}
function qvLabel(){
  var b=document.getElementById('qvBtn'); if(!b) return;
  b.setAttribute('data-on',QV.on?'1':'0');
  var ci=b.querySelector('.ci'),ct=b.querySelector('.ct');
  if(ci) ci.textContent=QV.on?'\u23F8':'\u25B6';
  if(ct) ct.textContent=QV.on?'Pause':'Quick view';
  document.body.classList.toggle('qv-on',QV.on);
}
function qvStep(ts){
  if(!QV.on) return;
  if(document.hidden){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  var ae=document.activeElement;
  if(ae&&/^(textarea|input)$/i.test(ae.tagName)){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  QV.left-=(ts-QV.last); QV.last=ts; qvPaint();
  if(QV.left<=0){
    if(cur>=U.length-1||!visibleInDirection(1)){ qvStop(); note('Quick view finished.'); return; }
    QV.driving=true; go(cur+1); QV.driving=false;
    QV.total=QV.left=qvDwell(cur); qvPaint();
  }
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStart(){
  QV.on=true; QV.total=QV.left=qvDwell(cur); QV.last=performance.now();
  qvLabel(); qvPaint();
  note('Quick view on — the deck turns itself. Q or Esc stops it.');
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStop(){
  if(!QV.on) return;
  QV.on=false; cancelAnimationFrame(QV.raf); qvLabel(); qvPaint();
}
function qvToggle(){ QV.on?qvStop():qvStart(); }

document.addEventListener('keydown',function(e){
  var tg=(e.target.tagName||'').toLowerCase();
  if(tg==='textarea'||tg==='input'){if(e.key==='Escape')e.target.blur();return;}
  var k=e.key;
  if(e.target.matches&&e.target.matches('.gl')&&(k==='Enter'||k===' ')){e.preventDefault();if(glossaryTerm===e.target&&glossaryPinned)hideGlossary();else{showGlossary(e.target);glossaryPinned=true;}return;}
  if(k==='Escape'){qvStop();var o=document.querySelector('.ov.on');if(o)closeOv(o.id);hideGlossary();return;}
  var ov=document.querySelector('.ov.on');
  if(ov){
    if(k==='Tab'){
      var focusable=Array.from(ov.querySelectorAll('button:not(:disabled),a[href],textarea')).filter(function(el){return !el.hidden&&el.getClientRects().length;});
      var first=focusable[0],last=focusable[focusable.length-1];
      if(e.shiftKey&&e.target===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&e.target===last){e.preventDefault();first.focus();}
    }
    return;
  }
  if(k===' '&&(tg==='button'||tg==='a'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(cur+1);return;}
  if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1);return;}
  if(k==='n'||k==='N'){tog('notes');return;}
  if(k==='c'||k==='C'){tog('case');return;}
  if(k==='o'||k==='O'){tog('over');return;}
  if(k==='t'||k==='T'){toggleTimer();return;}
  if(k==='q'||k==='Q'){e.preventDefault();qvToggle();return;}
  if(k==='?'||(k==='/'&&e.shiftKey)){e.preventDefault();tog('help');return;}
  if(k==='r'||k==='R'){downloadReport();return;}
  if(k==='f'||k==='F'){e.preventDefault();toggleFullScreen();return;}
  if(k==='d'||k==='D'){e.preventDefault();downloadLecture();return;}
  if(k==='l'||k==='L'){e.preventDefault();toggleTheme();return;}
  if(k==='+'||k==='='){e.preventDefault();setZoom(ZOOM+.05);return;}
  if(k==='-'||k==='_'){e.preventDefault();setZoom(ZOOM-.05);return;}
  if(k==='0'){e.preventDefault();setZoom(1);return;}
