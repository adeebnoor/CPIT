<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070C">
<title>ISCARB Faculty Presenter</title>
<style>
:root{--bg:#08070C;--panel:#15121C;--line:#2C2534;--ink:#F5F0EA;--dim:#A99E95;--sand:#DDB27E;--mag:#F0189A;--teal:#4FC6CB}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#top{height:44px;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#0c0a11;gap:10px}
#title{font-size:12px;font-weight:800;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:10px;color:var(--dim);white-space:nowrap}
#stageWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#lecture{display:block;border:0;background:var(--bg);width:100%;height:100%}
#portraitHint{display:none;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;background:rgba(12,10,17,.9);border:1px solid rgba(221,178,126,.45);color:#F0D6AE;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:700;pointer-events:none;white-space:nowrap}
#controls{height:68px;min-height:68px;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;background:#0c0a11;border-top:1px solid var(--line);z-index:5}
button,a.ctrl{appearance:none;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);font:inherit;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:0;touch-action:manipulation}
button:active,a.ctrl:active{transform:translateY(1px);border-color:var(--sand)}
#prev,#next{font-size:20px;color:var(--sand)}#notes{color:#fff}#full{color:var(--teal)}
@media (orientation:portrait) and (max-width:900px){
  #top{height:42px;min-height:42px}
  #stageWrap{flex:none;width:100vw;height:56.25vw;min-height:0;align-items:flex-start;margin-top:clamp(8px,8vh,72px)}
  #lecture{width:100vw;height:56.25vw}
  #portraitHint{display:block}
  body:after{content:"";flex:1}
  #controls{height:72px;min-height:72px;grid-template-columns:1fr 1fr 1fr 1fr}
}
@media (orientation:landscape) and (max-height:700px){
  #top{display:none}
  #controls{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);height:52px;min-height:52px;width:min(520px,92vw);padding:5px;border:1px solid rgba(44,37,52,.92);border-radius:14px;background:rgba(12,10,17,.88);backdrop-filter:blur(8px)}
  #stageWrap{height:100dvh}
}
@media (min-width:901px){
  #top{display:none}
  #controls{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:410px;height:50px;min-height:50px;padding:5px;background:rgba(12,10,17,.82);backdrop-filter:blur(8px);border:1px solid rgba(44,37,52,.85);border-radius:14px}
}
</style>
</head>
<body>
<div id="top"><div id="title">ISCARB · Faculty Lane</div><div id="status">Loading…</div></div>
<div id="stageWrap">
  <iframe id="lecture" title="ISCARB faculty lecture" allow="fullscreen"></iframe>
  <div id="portraitHint">Rotate for the best presentation view · لف الجوال أفقيًا</div>
</div>
<div id="controls" aria-label="Presentation controls">
  <button id="prev" aria-label="Previous slide">←</button>
  <button id="notes" aria-label="Instructor notes">Notes</button>
  <button id="next" aria-label="Next slide">→</button>
  <button id="full" aria-label="Full screen">Full</button>
</div>
<script>
const q=new URLSearchParams(location.search), ch=q.get('chapter')==='11'?'11':'10';
const cfg=ch==='11'
 ? {src:'Ch11-Reliability-Engineering-Faculty.html?v=20260911-rich-split-mobile',title:'Reliability Engineering · Faculty Lane'}
 : {src:'Ch10-Dependable-Systems-Faculty.html?v=20260911-rich-split-mobile',title:'Dependable Systems · Faculty Lane'};
const frame=document.getElementById('lecture'), status=document.getElementById('status');
document.getElementById('title').textContent='ISCARB · '+cfg.title;
frame.src=cfg.src;
let wired=false,ready=false;
function cw(){try{return frame.contentWindow}catch(e){return null}}
function move(d){const w=cw();if(!w)return;if(typeof w.go==='function'&&typeof w.cur==='number'){w.go(w.cur+d);sync()}else{w.document?.dispatchEvent(new KeyboardEvent('keydown',{key:d>0?'ArrowRight':'ArrowLeft',bubbles:true}))}}
function notes(){const w=cw();if(!w)return;if(typeof w.tog==='function')w.tog('notes');else w.document?.dispatchEvent(new KeyboardEvent('keydown',{key:'n',bubbles:true}))}
function sync(){const w=cw();try{if(w&&Array.isArray(w.U)&&typeof w.cur==='number'){ready=true;status.textContent=(w.cur+1)+' / '+w.U.length}else if(!ready)status.textContent='Loading…'}catch(e){}}
function wireChild(){const w=cw();if(!w)return false;try{const d=w.document;if(!d||!d.getElementById('stage')||typeof w.go!=='function')return false;if(wired)return true;wired=true;ready=true;let x=0,y=0,t=0;
  d.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const p=e.touches[0];x=p.clientX;y=p.clientY;t=Date.now()},{passive:true});
  d.addEventListener('touchend',e=>{const p=e.changedTouches&&e.changedTouches[0];if(!p)return;const dx=p.clientX-x,dy=p.clientY-y,dt=Date.now()-t;if(dt<700&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)move(dx<0?1:-1)},{passive:true});
  d.addEventListener('keydown',()=>setTimeout(sync,0),true);
  d.addEventListener('click',()=>setTimeout(sync,0),true);
  sync();return true;
}catch(e){return false}}
setInterval(()=>{wireChild();sync();const w=cw();try{const txt=w?.document?.body?.innerText||'';if(!ready&&txt.includes('Could not load faculty lecture'))status.textContent='Load error'}catch(e){}},300);
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.getElementById('notes').onclick=notes;
document.getElementById('full').onclick=async()=>{const el=document.getElementById('stageWrap');try{if(document.fullscreenElement)await document.exitFullscreen();else await el.requestFullscreen()}catch(e){}};
</script>
</body>
</html>
