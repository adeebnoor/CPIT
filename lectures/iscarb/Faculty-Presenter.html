<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070C">
<title>ISCARB In-Class Presenter</title>
<style>
:root{--bg:#08070C;--panel:#15121C;--line:#2C2534;--ink:#F5F0EA;--dim:#A99E95;--sand:#DDB27E;--mag:#F0189A;--teal:#4FC6CB}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}
#top{height:48px;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:#0c0a11;gap:10px;z-index:8}
#title{font-size:12px;font-weight:900;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topRight{display:flex;align-items:center;gap:9px}#status{font-size:10px;color:var(--dim);white-space:nowrap}#studentTask{font-size:10px;font-weight:850;color:#C7F6FF;text-decoration:none;border:1px solid rgba(79,198,203,.5);padding:6px 8px;border-radius:8px;white-space:nowrap}
#stageWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}#lecture{display:block;border:0;background:var(--bg);width:100%;height:100%}
#portraitHint{display:none;position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:4;background:rgba(12,10,17,.94);border:1px solid rgba(221,178,126,.52);color:#F0D6AE;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:800;pointer-events:none;white-space:nowrap}
#controls{height:72px;min-height:72px;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr 1.15fr 1fr 1.2fr;gap:8px;background:#0c0a11;border-top:1px solid var(--line);z-index:9}
button{appearance:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;font-weight:850;font-size:12px;display:flex;align-items:center;justify-content:center;min-width:0;min-height:48px;touch-action:manipulation}button:active{transform:translateY(1px);border-color:var(--sand)}#prev,#next{font-size:22px;color:var(--sand)}#notes{color:#fff}#present{color:var(--teal)}
@media (orientation:portrait) and (max-width:900px){#top{height:48px;min-height:48px}#stageWrap{flex:none;width:100vw;height:56.25vw;min-height:0;align-items:flex-start;margin-top:clamp(10px,7vh,58px)}#lecture{width:100vw;height:56.25vw}#portraitHint{display:block}body:after{content:"";flex:1}#controls{height:78px;min-height:78px}}
@media (orientation:landscape) and (max-height:700px){#top{display:none}#stageWrap{height:100dvh}#controls{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);height:56px;min-height:56px;width:min(580px,94vw);padding:5px;border:1px solid rgba(44,37,52,.92);border-radius:14px;background:rgba(12,10,17,.88);backdrop-filter:blur(8px)}button{min-height:44px}}
@media (min-width:901px){#top{display:none}#controls{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:470px;height:54px;min-height:54px;padding:5px;background:rgba(12,10,17,.82);backdrop-filter:blur(8px);border:1px solid rgba(44,37,52,.85);border-radius:14px}button{min-height:42px}}
</style>
</head>
<body>
<div id="top"><div id="title">ISCARB · In-Class</div><div class="topRight"><span id="status">Loading…</span><a id="studentTask" href="#">After-Class</a></div></div>
<div id="stageWrap"><iframe id="lecture" title="ISCARB In-Class lecture" allow="fullscreen"></iframe><div id="portraitHint">Tap Present for landscape · اضغط Present للعرض الأفقي</div></div>
<div id="controls" aria-label="Presentation controls"><button id="prev" aria-label="Previous in-class slide">←</button><button id="notes" aria-label="Instructor notes">Notes</button><button id="next" aria-label="Next in-class slide">→</button><button id="present" aria-label="Present full screen">Present</button></div>
<script>
const q=new URLSearchParams(location.search),ch=q.get('chapter')==='11'?'11':'10';
const cfg=ch==='11'
 ?{src:'Ch11-Reliability-Engineering.html?v=20260911-focus2',title:'Reliability Engineering · In-Class',assignment:'../../fbr-submission.html?chapter=11'}
 :{src:'Ch10-Dependable-Systems.html?v=20260911-focus2',title:'Dependable Systems · In-Class',assignment:'../../fbr-submission.html?chapter=10'};
const frame=document.getElementById('lecture'),status=document.getElementById('status');
document.getElementById('title').textContent='ISCARB · '+cfg.title;document.getElementById('studentTask').href=cfg.assignment;frame.src=cfg.src;
let wired=false,ready=false,focus=[],specialByIndex={};window.__facultyFocus=null;
function cw(){try{return frame.contentWindow}catch(e){return null}}
function combined(slide,u){return ((slide?.innerText||'')+' '+JSON.stringify(u||{})).toUpperCase()}
function classify(slide,u){const all=combined(slide,u);if(/CRISIS|HOOK/.test(all))return'crisis';if(/FIT TRAP|FIT BEFORE THE REVEAL|PREDICTION GATE/.test(all))return'fit';if(/STRESS.*REFIT|STRESS THE BOUNDARY|CONSTRAINT MUTATION|LIVE DEFENSE|LIVE RELIABILITY DEFENSE/.test(all))return'stress';if(/ASSIGNMENT|TAKE-HOME|TAKE HOME|WEEKLY ENGINEERING DECISION|CARRY THE FIT|LAUNCH/.test(all))return'assignment';return''}
function hasWriting(slide){return !!slide?.querySelector('textarea,[contenteditable="true"],select,input[type="text"],input[type="search"],input[type="email"],input[type="number"],input[type="url"],input[type="tel"],input[type="date"],input[type="time"],input:not([type])')}
function heavy(slide,u){const all=combined(slide,u);return hasWriting(slide)||/WORKSHOP|DECISION CARD|RUBRIC|READINESS|CAPABILITY LADDER|PORTFOLIO EVIDENCE|EVIDENCE CHECKLIST/.test(all)}
function cueFor(t){return t==='crisis'?'VERBAL ONLY · 1–2 MIN':t==='fit'?'VERBAL FIT JUDGMENT · 2–3 MIN':t==='stress'?'SPOKEN REFIT DEMO · NO SUBMISSION':t==='assignment'?'LAUNCH ONLY · WRITTEN WORK AFTER CLASS':''}
function buildFocus(){const w=cw(),d=w?.document;if(!w||!d||!Array.isArray(w.U))return false;const slides=[...d.querySelectorAll('#stage .slide')];if(!slides.length)return false;focus=[];specialByIndex={};slides.forEach((s,i)=>{const type=classify(s,w.U[i]);if(type)specialByIndex[i]=type;const keep=i===0||i===slides.length-1||!!type||!heavy(s,w.U[i]);if(keep)focus.push(i)});if(focus.length<2)focus=slides.map((_,i)=>i);
 let style=d.getElementById('facultyFocusStyle');if(!style){style=d.createElement('style');style.id='facultyFocusStyle';d.head.appendChild(style)}style.textContent='#bar{display:none!important}.slide{inset:0!important;padding-bottom:18px!important}textarea,[contenteditable="true"],select,input[type="text"],input[type="search"],input[type="email"],input[type="number"],input[type="url"],input[type="tel"],input[type="date"],input[type="time"],input:not([type]){display:none!important}.faculty-focus-cue{position:absolute;top:19px;right:36px;z-index:30;padding:7px 10px;border:1px solid rgba(221,178,126,.72);border-radius:999px;background:rgba(8,7,12,.88);color:#F0D6AE;font:800 10px/1.1 Inter,Arial,sans-serif;letter-spacing:.055em;text-transform:uppercase;box-shadow:0 6px 22px rgba(0,0,0,.24)}';
 d.body.dataset.facultyFocus='true';Object.entries(specialByIndex).forEach(([k,t])=>{const s=slides[+k];if(!s||s.querySelector('.faculty-focus-cue'))return;const e=d.createElement('div');e.className='faculty-focus-cue';e.textContent=cueFor(t);s.appendChild(e)});window.__facultyFocus={indexes:[...focus],rawCount:slides.length,special:{...specialByIndex},chapter:ch};return true}
function pos(){const w=cw();if(!w||!focus.length)return 0;const exact=focus.indexOf(w.cur);if(exact>=0)return exact;let nearest=0,best=1e9;focus.forEach((x,i)=>{const z=Math.abs(x-(w.cur||0));if(z<best){best=z;nearest=i}});return nearest}
function move(delta){const w=cw();if(!w||typeof w.go!=='function'||!focus.length)return;const p=Math.max(0,Math.min(focus.length-1,pos()+delta));w.go(focus[p]);sync()}
function notes(){const w=cw();if(!w)return;if(typeof w.tog==='function')w.tog('notes');else w.document?.dispatchEvent(new KeyboardEvent('keydown',{key:'n',bubbles:true}))}
function sync(){const w=cw();try{if(w&&focus.length&&typeof w.cur==='number'){ready=true;status.textContent='F '+(pos()+1)+' / '+focus.length+' · R '+(w.cur+1)+' / '+(window.__facultyFocus?.rawCount||focus.length)}else if(!ready)status.textContent='Loading…'}catch(e){}}
function wire(){const w=cw();if(!w)return false;try{const d=w.document;if(!d||!d.getElementById('stage')||typeof w.go!=='function'||!Array.isArray(w.U))return false;if(!focus.length&&!buildFocus())return false;if(wired)return true;wired=true;ready=true;let x=0,y=0,t=0;
 d.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const p=e.touches[0];x=p.clientX;y=p.clientY;t=Date.now()},{passive:true});
 d.addEventListener('touchend',e=>{const p=e.changedTouches&&e.changedTouches[0];if(!p)return;const dx=p.clientX-x,dy=p.clientY-y,dt=Date.now()-t;if(dt<700&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)move(dx<0?1:-1)},{passive:true});
 d.addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight',' ','PageDown','ArrowLeft','PageUp'].includes(k)){e.preventDefault();e.stopImmediatePropagation();move(k==='ArrowRight'||k===' '||k==='PageDown'?1:-1)}else setTimeout(sync,0)},true);
 d.addEventListener('click',()=>setTimeout(sync,0),true);if(!focus.includes(w.cur))w.go(focus[0]);sync();return true}catch(e){status.textContent='Focus error';return false}}
setInterval(()=>{wire();sync()},250);
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('notes').onclick=notes;
document.addEventListener('keydown',e=>{if(e.target?.matches?.('a,button'))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}else if(e.key.toLowerCase()==='n'){e.preventDefault();notes()}},true);
document.getElementById('present').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();try{await screen.orientation?.lock?.('landscape')}catch(e){}}else{await document.exitFullscreen();try{screen.orientation?.unlock?.()}catch(e){}}}catch(e){status.textContent='Rotate phone manually'}};
document.addEventListener('fullscreenchange',()=>{document.getElementById('present').textContent=document.fullscreenElement?'Exit':'Present'});
</script>
</body></html>
