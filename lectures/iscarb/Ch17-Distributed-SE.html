/response; asynchronous message passing for decoupled components", "impl": "Use RPC when the caller must wait for a result; use messaging when the receiver may be unavailable or slow", "tools": ["gRPC / REST", "message queue (Kafka, RabbitMQ)", "dead-letter queue"], "evidence": "A dated interaction trace showing each call as synchronous or asynchronous, with timeout and retry policy"}, {"c": "violet", "ai": true, "req": "AI-assisted SaaS configuration", "mech": "AI proposes per-tenant branding, business rules, and access-control policies; human signs the configuration", "impl": "AI drafts configuration; held-out eval set for generated rules; drift monitoring; human sign-off before tenant deployment", "tools": ["config linter", "tenant isolation tester", "policy diff tool"], "evidence": "A dated configuration report: AI-proposed config, human review, isolation test result, sign-off"}, {"c": "sand", "req": "Peer-to-peer architecture", "mech": "Decentralized computations on any node; no distinguished clients or servers", "impl": "Design nodes that share resources directly; choose decentralized or semicentralized topology; handle security and trust", "tools": ["distributed hash table", "BitTorrent-style protocol", "reputation system"], "evidence": "A dated node topology diagram with redundancy test and security review"}], "note": "Tools are categories, not brands &mdash; substitute your own. The last column is the one that cannot substitute: no artifact, no claim."}, "coverage": {"source": "Supplied Sommerville Chapter 17 slides", "span": [1, 66], "sections": [{"k": "1", "t": "Characteristics and design issues", "pp": [3, 14], "concept": "Characteristics and design issues"}, {"k": "2", "t": "Interaction models and middleware", "pp": [15, 22], "concept": "Interaction models and middleware"}, {"k": "3", "t": "Client-server and layering", "pp": [23, 28], "concept": "Client-server and layering"}, {"k": "4", "t": "Architectural patterns", "pp": [29, 52], "concept": "Architectural patterns"}, {"k": "5", "t": "SaaS, SOA and multi-tenancy", "pp": [53, 66], "concept": "SaaS, SOA and multi-tenancy"}]}, "domains": ["KNOWLEDGE", "SKILL", "VALUE"], "readiness": [{"clo": "LO1", "plo": "Practice", "d": "KNOWLEDGE", "txt": "Distinguish distributed system characteristics, design issues, and the five architectural patterns", "needs": ["p:predict", "f:p_derive"], "where": "Classroom practice and source review"}, {"clo": "LO2", "plo": "Practice", "d": "SKILL", "txt": "Trace a client-server system through the four layers and map them to physical tiers", "needs": ["@trace3"], "where": "Classroom practice and source review"}, {"clo": "LO3", "plo": "Practice", "d": "SKILL", "txt": "Specify a distributed architecture using the right pattern for the demand and justify the trade-off", "needs": ["p:atm", "f:atm_metric"], "where": "Classroom practice and source review"}, {"clo": "LO4", "plo": "Practice", "d": "VALUE", "txt": "Build a bounded architecture verdict with inspectable, owned evidence", "needs": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_verdict"], "where": "Classroom practice and source review"}, {"clo": "LO5", "plo": "Practice", "d": "SKILL", "txt": "Defend the verdict when the architecture constraint, tier, or load pattern changes", "needs": ["p:mutation", "f:mutation_defend"], "where": "Classroom practice and source review"}], "gates": [{"id": "decide", "label": "DECIDE", "q": "I have stated a bounded verdict &mdash; keep, redesign, or add redundancy to the architecture &mdash; not \"more analysis needed\"."}, {"id": "evidence", "label": "EVIDENCE", "q": "I can show the architectural pattern I chose, the failure mode it addresses, the layer-to-tier mapping, and the artifact that proves the decision holds."}, {"id": "break", "label": "BREAK", "q": "I can name the tier, the pattern assumption, or the missing redundancy that would reverse my verdict."}, {"id": "own", "label": "OWN", "q": "I have named the architect, the evidence owner, and the authority who signs off."}], "clo": [{"tag": "KNOWLEDGE", "txt": "Distinguish distributed system characteristics, design issues, and the five architectural patterns."}, {"tag": "SKILL", "txt": "Trace a client-server system through the four layers and map them to physical tiers."}, {"tag": "SKILL", "txt": "Specify a distributed architecture using the right pattern for the demand and justify the trade-off."}, {"tag": "VALUE", "txt": "Build a bounded architecture verdict with inspectable, owned evidence."}, {"tag": "SKILL", "txt": "Defend the verdict when the architecture constraint, tier, or load pattern changes."}], "pairs": [["decide", "DECIDE", "State a bounded answer"], ["evidence", "EVIDENCE", "Show what supports it"], ["break", "BREAK", "Name what would reverse it"], ["own", "OWN", "Name who signs off"]], "stack": ["Society", "Organization", "Business processes", "Application system", "Communications and data management", "Operating system", "Equipment"], "aiGate": [["q1", "Does the AI output become part of the evidence chain &mdash; something a reviewer or regulator would read?"], ["q2", "Could a human RE-DERIVE the same output independently &mdash; run it again, by another route, and get something they can compare?"], ["q2b", "Failing that, could a human TEST the output against reality &mdash; check each claim it makes without trusting how it was produced?"], ["q3", "Is there a named person who reviews it and signs for it?"]], "vocab": {"stack": ["Society (NCA regulator, patient rights)", "Organization (hospital)", "Business processes (crisis response workflow)", "Application system (Mentcare 3-tier)", "Communications and data management (RPC over LAN)", "Operating system (server OS)", "Equipment (web client, app server, DB server)"], "gates": [["decide", "DECIDE", "State a bounded answer"], ["evidence", "EVIDENCE", "Show what supports it"], ["break", "BREAK", "Name what would reverse it"], ["own", "OWN", "Name who signs off"]], "aiGate": [["q1", "Does the AI output become part of the evidence chain &mdash; something a reviewer or regulator would read?"], ["q2", "Could a human RE-DERIVE the same output independently &mdash; run it again, by another route, and get something they can compare?"], ["q2b", "Failing that, could a human TEST the output against reality &mdash; check each claim it makes without trusting how it was produced?"], ["q3", "Is there a named person who reviews it and signs for it?"]], "card": [["dc_claim", "CLAIM"], ["dc_evidence", "EVIDENCE"], ["dc_warrant", "WARRANT"], ["dc_counter", "COUNTER-EV."], ["dc_uncert", "UNCERTAINTY"], ["dc_verdict", "VERDICT"]]}, "quiz": [{"t": "Rule 05 · Prediction gate", "parts": [["Prediction", "p:predict"], ["Constraint", "f:p_constraint"], ["Derive", "f:p_derive"], ["Name", "f:p_name"]]}, {"t": "Rule 07 · Decision card", "parts": [["Claim", "f:dc_claim"], ["Evidence", "f:dc_evidence"], ["Warrant", "f:dc_warrant"], ["Counter-evidence", "f:dc_counter"], ["Uncertainty", "f:dc_uncert"], ["Verdict", "f:dc_verdict"]]}, {"t": "Rule 10 · Risk and monitor", "parts": [["Known / unknown / monitored", "@r10grid"], ["A monitor I will keep", "f:monitor"], ["Vulnerability tool", "f:vuln_tool"]]}, {"t": "Rule 11 · Transfer", "parts": [["Micro-case", "f:micro"], ["Transfer to Internet banking case", "f:transfer"]]}, {"t": "Rule 13 · Stress test", "parts": [["Stress test", "f:stress"]]}, {"t": "Rule 14 · Practitioner workload", "parts": [["Workload cost and design change", "f:workload"]]}, {"t": "Rule 15 · AI assist", "parts": [["AI gate", "@aigate"]]}, {"t": "Rule 17 · Constraint mutation", "parts": [["Mutation", "p:mutation"], ["Survives / collapses", "f:mutation_defend"]]}, {"t": "Rule 19 · Peer review received", "parts": [["Inspectable?", "f:peer1"], ["What would make it fail?", "f:peer2"]]}, {"t": "Jahiziah knowledge-unit check", "parts": [["", "@jahtest"]]}, {"t": "Rule 20 · Readiness", "parts": [["", "@gates"], ["Outcomes your evidence supports", "@clo"], ["Engineering means", "f:takehome"]]}], "units": [{"k": "TITLE", "phase": "ISCARB TOOLKIT", "task": "Sit down. The decision starts in ninety seconds.", "notes": "Leave this up while the room settles. One sentence: tonight you issue one engineering decision about a distributed architecture that failed during a crisis.", "appendix": false, "route": "core"}, {"k": "START", "title": "Your route through this chapter", "phase": "LEARN", "route": "core", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Today’s artifact:</b> An architecture with a failure-handling argument.</p><p><b>Fictional teaching case:</b> The Mentcare system was migrated to a 3-tier architecture. At 02:30 during a mental health crisis, the app server crashed.</p><p>The 3-tier system put presentation on web clients, application on an app server, database on a DB server. The app server crashed at 02:30. The presentation layer had no local data and could not display patient records. The system was down for 47 minutes.</p></div><h2 style=\"font:700 25px/1.4 system-ui\">Five chapter learning objectives</h2><ol class=\"lp-outcomes\"><li>Explain distributed-system design issues.</li><li>Compare RPC and message-based interaction.</li><li>Distinguish layers and tiers.</li><li>Choose among the five source architectural patterns.</li><li>Explain SaaS configuration, multi-tenancy and scaling.</li></ol><p style=\"font:17px/1.6 system-ui\"><b>Pacing suggestion:</b> one teaching block of about 75–90 minutes, plus the named required reading and a five-question preparation check (initial planning estimate: 15–25 minutes total; report your actual time). These are planning estimates, not an official timetable. Pause after Check 2 if teaching in two blocks. If time runs out, finish the remaining source topics in the next block; they stay required.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"C01\">See the source-to-lesson map</button></div><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"READING\">Required self-study: exact pages and task</button><button class=\"lp-btn\" data-jump=\"PREP\">Five-objective preparation check</button></div><p class=\"lp-study-note\">Complete this preparation before starting the chapter assignment and before the next chapter discussion. Blackboard supplies the calendar date. The five objectives, classroom concepts and named self-study are in chapter assessment scope; the optional toolkit is enrichment unless explicitly assigned. Do not repeat a completed submission under this new edition unless instructed.</p>"}], "noAnswer": true, "appendix": false}, {"k": "X01", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Define a distributed system and name its five characteristics.", "title": "Distributed-system characteristics", "sub": "Now compare your prediction with what the source actually says.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DEFINITION", "lead": "A collection of independent computers appearing as a single coherent system.", "txt": "Virtually all large computer-based systems are now distributed. Information processing is distributed over several computers rather than confined to a single machine.", "src": "P1 · p.3"}, {"c": "sand", "lab": "COMPLEXITY", "lead": "More complex than single-processor systems.", "txt": "Different parts are independently managed, as is the network. There is no single authority in charge &mdash; so top-down control is impossible.", "src": "P1 · p.6"}]}, {"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "RESOURCE SHARING", "lead": "Share hardware and software.", "txt": "Sharing of hardware and software resources across the system.", "src": "P1 · p.4"}, {"c": "teal", "lab": "OPENNESS", "lead": "Different vendors.", "txt": "Use of equipment and software from different vendors.", "src": "P1 · p.4"}, {"c": "teal", "lab": "CONCURRENCY", "lead": "Concurrent processing.", "txt": "Concurrent processing to enhance performance.", "src": "P1 · p.4"}, {"c": "teal", "lab": "SCALABILITY", "lead": "Add resources.", "txt": "Increased throughput by adding new resources.", "src": "P1 · p.4"}, {"c": "teal", "lab": "FAULT TOLERANCE", "lead": "Continue after a fault.", "txt": "The ability to continue in operation after a fault has occurred.", "src": "P1 · p.4"}]}, {"t": "principle", "txt": "A distributed system is defined by independence and appearance: independent computers that appear coherent. Tonight&rsquo;s 3-tier Mentcare system is one."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Distributed-system characteristics. The highest-value thirty seconds of the Understand phase. The 3-tier system delivered scalability but not fault tolerance &mdash; and fault tolerance is the characteristic that broke at 02:30.", "appendix": false, "_iscarbRule": "X01 - Distributed systems", "route": "core", "showIf": null, "sourceRange": "3–14", "answer": "Virtually all large computer-based systems are now distributed. Information processing is distributed over several computers rather than confined to a single machine. Different parts are independently managed, as is the network. There is no single authority in charge — so top-down control is impossible. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the six design issues and say which one tonight&rsquo;s architecture neglected.", "title": "Six distributed design issues", "sub": "Transparency, openness, scalability, security, quality of service, failure management. The chapter (p.7) lists six. Tonight the architecture failed on one.", "blocks": [{"t": "figure", "img": "ch17_middleware", "cap": "p.21 · middleware in a distributed system", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "MIDDLEWARE", "lead": "Manages diverse parts and ensures communication.", "txt": "Middleware provides interaction support (location transparency) and common services (reusable implementations). Components communicate through middleware, not directly."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "TRANSPARENCY", "lead": "Should the system appear as a single system?", "txt": "Ideally users should not be aware that a system is distributed. In practice impossible because of independent management and network delays.", "src": "P1 · p.7-8"}, {"c": "teal", "lab": "OPENNESS", "lead": "Should the system use standard protocols?", "txt": "Open systems are built according to generally accepted standards. Components from any supplier can be integrated.", "src": "P1 · p.7-9"}, {"c": "teal", "lab": "SCALABILITY", "lead": "How can the system be constructed to be scalable?", "txt": "Size, distribution, and manageability. Scaling up is more powerful system; scaling out is more system instances.", "src": "P1 · p.7-10"}]}, {"t": "cards", "cols": 3, "items": [{"c": "sand", "lab": "SECURITY", "lead": "How can usable security policies be defined?", "txt": "A distributed system has more attack surface than a centralized one. Different organizations may own parts with incompatible policies.", "src": "P1 · p.7-11"}, {"c": "sand", "lab": "QUALITY OF SERVICE", "lead": "How should QoS be specified?", "txt": "The system&rsquo;s ability to deliver services dependably with acceptable response time and throughput. Critical for time-critical data.", "src": "P1 · p.7-13"}, {"c": "mag", "lab": "FAILURE MANAGEMENT", "lead": "How can failures be detected, contained, repaired?", "txt": "Failures are inevitable. The system must discover failures, continue delivering services, and automatically recover.", "src": "P1 · p.7-14"}]}, {"t": "principle", "c": "mag", "txt": "Tonight&rsquo;s architecture addressed scalability and ignored failure management. That is the gap."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Six distributed design issues. Two minutes. The room usually picks scalability because it is in the migration file. The deeper answer is failure management: the architecture had no plan for an app-server crash.", "appendix": false, "_iscarbRule": "X02 - Design issues for distributed systems", "route": "core", "showIf": null, "sourceRange": "3–14", "answer": "Middleware provides interaction support (location transparency) and common services (reusable implementations). Components communicate through middleware, not directly. Ideally users should not be aware that a system is distributed. In practice impossible because of independent management and network delays. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02A", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain why failure management is the design issue that distinguishes a working distributed system from a fragile one.", "title": "Failure management", "sub": "&ldquo;You know that you have a distributed system when the crash of a system that you&rsquo;ve never heard of stops you getting any work done.&rdquo;", "blocks": [{"t": "figure", "img": "ch17_layered", "cap": "p.27 · layered client-server model", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "CLIENT-SERVER LAYERS", "lead": "Presentation, data handling, application processing, database.", "txt": "Four layers: presentation (user interaction), data handling (data checks, web pages), application processing (business logic), database (storage, transactions)."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE QUOTE", "lead": "The defining pain of a distributed system.", "txt": "Failures are inevitable. The system must include mechanisms for discovering if a component has failed, continue delivering as many services as possible, and automatically recover.", "src": "P1 · p.14"}, {"c": "mag", "lab": "TONIGHT&rsquo;S FAILURE MODE", "lead": "The app server is a single point of failure for the presentation layer.", "txt": "The presentation layer depends on the app server for every record. When the app server crashed, the presentation layer had nothing to display. That is failure management neglected, not failure management addressed.", "src": "P1 · p.14"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "DISCOVER", "lead": "Detect the failure.", "txt": "Health checks, heartbeat protocols, timeout-based detection. The crash was noticed &mdash; by the user, not the system."}, {"c": "sand", "lab": "CONTAIN", "lead": "Keep delivering other services.", "txt": "A redundant app server, a fallback cache on the presentation layer, or a direct read-only path to the database tier. None of these existed."}, {"c": "violet", "lab": "RECOVER", "lead": "Repair and resume.", "txt": "Automatic restart, failover to a standby, or graceful degradation. Tonight&rsquo;s recovery was a 47-minute manual restart."}]}, {"t": "principle", "txt": "Failure management is the design issue that turns a distributed system from a demo into a service."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Failure management. Two minutes. The room will name the missing redundancy. Push for the discover step too: nobody knew the app server had crashed until the presentation layer failed.", "appendix": false, "_iscarbRule": "X02A - Failure management deep dive", "route": "core", "showIf": null, "sourceRange": "3–14", "answer": "Four layers: presentation (user interaction), data handling (data checks, web pages), application processing (business logic), database (storage, transactions). Failures are inevitable. The system must include mechanisms for discovering if a component has failed, continue delivering as many services as possible, and automatically recover. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X03", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish procedural (RPC) from message-based interaction and say which one fits which problem.", "title": "Procedural and message-based interaction", "sub": "Two types of interaction between components in a distributed system (p.15). Tonight&rsquo;s presentation layer used procedural to call the app server.", "blocks": [{"t": "conceptflow", "items": [["Caller", "Sends an operation request"], ["Remote service", "May execute independently"], ["Response", "Can arrive, fail or time out"]]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "PROCEDURAL INTERACTION", "lead": "One computer calls a known service and waits for a response.", "txt": "Implemented as remote procedure calls (RPC). The caller and callee must be available at the time of communication, and they must know how to refer to each other.", "src": "P1 · p.15-18"}, {"c": "sand", "lab": "MESSAGE-BASED INTERACTION", "lead": "One component sends a message; no need to wait for a response.", "txt": "The sender creates a message detailing the services required; middleware sends it to the receiver. Sender and receiver do not need to be aware of each other.", "src": "P1 · p.15-19"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "RPC PROBLEM", "lead": "Caller and callee must both be available.", "txt": "A problem with RPCs is that the caller and callee need to be available at the time of communication. Tonight&rsquo;s failure: the presentation layer called the app server, which was crashed.", "src": "P1 · p.18"}, {"c": "mag", "lab": "MESSAGE ADVANTAGE", "lead": "Decoupled through middleware.", "txt": "In a message-based approach, sender and receiver communicate with the middleware, not with each other. The receiver can be down without blocking the sender."}]}, {"t": "principle", "txt": "RPC couples caller and callee in time and address. Messaging decouples them through middleware &mdash; and decoupling is what survives a crash."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Procedural and message-based interaction. Two minutes. The room usually focuses on the technical differences. The deeper point is that RPC&rsquo;s availability assumption is exactly what broke at 02:30.", "appendix": false, "_iscarbRule": "X03 - Models of interaction", "route": "core", "showIf": null, "sourceRange": "15–22", "answer": "Implemented as remote procedure calls (RPC). The caller and callee must be available at the time of communication, and they must know how to refer to each other. The sender creates a message detailing the services required; middleware sends it to the receiver. Sender and receiver do not need to be aware of each other. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A remote call times out. Does that prove the server did not execute it?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "No. Execution and response delivery can fail separately. A retry may duplicate the action; inspect request identity, acknowledgment and recovery behavior.", "timebox": "60 sec", "appendix": false}, {"k": "X04", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Define middleware and name its two categories of support.", "title": "Middleware", "sub": "Components may be in different languages, on different processors, with different data models and protocols. Middleware manages the diverse parts.", "blocks": [{"t": "figure", "img": "ch17_middleware", "cap": "slide 21 · middleware", "right": []}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MIDDLEWARE DEFINITION", "lead": "Software that manages diverse parts and ensures communication.", "txt": "The components in a distributed system may be implemented in different languages and may execute on different processors. Middleware manages these diverse parts and ensures they can communicate and exchange data.", "src": "P1 · p.20"}, {"c": "sand", "lab": "INTERACTION SUPPORT", "lead": "Coordinates interactions and provides location transparency.", "txt": "The middleware coordinates interactions between components. It provides location transparency &mdash; components do not need to know the physical locations of other components.", "src": "P1 · p.22"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "COMMON SERVICES", "lead": "Reusable implementations of services several components need.", "txt": "The middleware provides reusable implementations of services (directories, authentication, transactions) so components inter-operate consistently.", "src": "P1 · p.22"}, {"c": "mag", "lab": "TONIGHT&rsquo;S MIDDLEWARE", "lead": "The middleware mapped logical to physical &mdash; until the app server crashed.", "txt": "The middleware hid the app server&rsquo;s physical location from the presentation layer. When the app server crashed, the middleware had no alternative location to map to. Location transparency without redundancy is a single point of failure in disguise."}]}, {"t": "principle", "c": "mag", "txt": "Middleware provides interaction support and common services. Neither helps if there is no alternative to map to."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Middleware. Two minutes. The room usually picks interaction support. The deeper answer is common services: a redundant app server registered with the middleware would have let location transparency route around the crash.", "appendix": false, "_iscarbRule": "X04 - Middleware", "route": "core", "showIf": null, "sourceRange": "15–22", "answer": "The components in a distributed system may be implemented in different languages and may execute on different processors. Middleware manages these diverse parts and ensures they can communicate and exchange data. The middleware coordinates interactions between components. It provides location transparency — components do not need to know the physical locations of other components. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X05", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain the client-server model and name the four layers of a client-server application.", "title": "Client-server computing", "sub": "Distributed systems accessed over the Internet are normally organized as client-server (p.24). The layered model (p.27) splits the work.", "blocks": [{"t": "figure", "img": "ch17_layered", "cap": "slide 27 · client-server layers", "right": []}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "CLIENT-SERVER MODEL", "lead": "User interacts with a client; server provides services.", "txt": "The user interacts with a program on their local computer (e.g., a browser). This interacts with a program on a remote computer (e.g., a web server) that provides services.", "src": "P1 · p.24"}, {"c": "sand", "lab": "THE FOUR LAYERS", "lead": "Presentation, data handling, application processing, database.", "txt": "The layered architectural model splits a client-server application into four layers with distinct responsibilities.", "src": "P1 · p.27-28"}]}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 PRESENTATION", "lead": "Present information, manage user interaction.", "txt": "Concerned with presenting information to the user and managing all user interaction. Implemented on the client.", "src": "P1 · p.28"}, {"c": "sand", "lab": "2 DATA HANDLING", "lead": "Manage data to and from the client.", "txt": "Manages the data passed to and from the client. Implements checks on the data, generates web pages, etc.", "src": "P1 · p.28"}, {"c": "violet", "lab": "3 APPLICATION PROCESSING", "lead": "Implement application logic.", "txt": "Concerned with implementing the logic of the application and so providing the required functionality to end users.", "src": "P1 · p.28"}, {"c": "mag", "lab": "4 DATABASE", "lead": "Store data, transaction management.", "txt": "Stores data and provides transaction management services. The lowest layer.", "src": "P1 · p.28"}]}, {"t": "principle", "txt": "A layer is a responsibility; a tier is a processor. The four layers can map to one, two, three, or four tiers."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Client-server computing. Two minutes. Tonight: presentation on web client (tier 1), data handling + application processing on app server (tier 2), database on DB server (tier 3). The presentation layer has none of the other three &mdash; that is the thin-client decision.", "appendix": false, "_iscarbRule": "X05 - Client-server computing and layers", "route": "core", "showIf": null, "sourceRange": "23–28", "answer": "The user interacts with a program on their local computer (e.g., a browser). This interacts with a program on a remote computer (e.g., a web server) that provides services. The layered architectural model splits a client-server application into four layers with distinct responsibilities. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X06", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the five architectural patterns and say which one fits which demand pattern.", "title": "Five distributed architectural patterns", "sub": "The chapter (p.30) lists five widely used patterns. Tonight&rsquo;s Mentcare system is one of them.", "blocks": [{"t": "figure", "img": "ch17_masterslave", "cap": "slide 32 · traffic management architecture", "right": []}, {"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 MASTER-SLAVE", "lead": "Real-time systems, guaranteed response.", "txt": "Master controls dedicated slaves. Used in real-time systems where separate processors handle acquisition, computation, and actuator management.", "src": "P1 · p.30-31"}, {"c": "sand", "lab": "2 TWO-TIER CLIENT-SERVER", "lead": "Simple, centralized for security.", "txt": "A single logical server plus many clients. Thin-client puts presentation on client; fat-client carries some application processing on client.", "src": "P1 · p.30-33"}, {"c": "violet", "lab": "3 MULTI-TIER CLIENT-SERVER", "lead": "High volume of transactions.", "txt": "Different layers are separate processes that may execute on different processors. Avoids scalability and management issues of two-tier.", "src": "P1 · p.30-39"}, {"c": "mag", "lab": "4 DISTRIBUTED COMPONENT", "lead": "Combine resources from different systems.", "txt": "No distinction between clients and servers. Each component provides and receives services through middleware.", "src": "P1 · p.30-43"}, {"c": "green", "lab": "5 PEER-TO-PEER", "lead": "Decentralized; computations on any node.", "txt": "Decentralized systems where computations may be carried out by any node. Used when clients exchange locally stored information.", "src": "P1 · p.30-48"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "TONIGHT&rsquo;S PATTERN", "lead": "Multi-tier client-server (3-tier).", "txt": "Mentcare is multi-tier: presentation on web client, application processing on app server, database on DB server. The pattern that promised scalability.", "src": "P1 · p.39-40"}, {"c": "mag", "lab": "THE PATTERN ASSUMPTION", "lead": "Each tier is reachable for the next to function.", "txt": "Multi-tier assumes each tier is reachable. When the app server crashed, the presentation tier could not reach the database tier &mdash; the assumption broke.", "src": "P1 · p.39"}]}, {"t": "principle", "c": "mag", "txt": "A pattern is not a guarantee. A required tier can become a single point of failure if it lacks an effective redundant or degraded-service path."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Five distributed architectural patterns. Two minutes. The room usually picks multi-tier correctly. Push for the assumption: each tier must be reachable, and the architecture had no fallback when one was not.", "appendix": false, "_iscarbRule": "X06 - Architectural patterns for distributed systems", "route": "core", "showIf": null, "sourceRange": "29–52", "answer": "Master controls dedicated slaves. Used in real-time systems where separate processors handle acquisition, computation, and actuator management. A single logical server plus many clients. Thin-client puts presentation on client; fat-client carries some application processing on client. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R09", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Map the four client-server layers to physical tiers and say which mapping tonight&rsquo;s architecture used.", "title": "Logical layers and deployment tiers", "sub": "A layer is a responsibility; a tier is a processor. The mapping decision is what makes a distributed architecture work &mdash; or fail.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "TONIGHT&rsquo;S MAPPING", "lead": "Presentation on tier 1, app processing + data handling on tier 2, database on tier 3.", "txt": "The 3-tier mapping put presentation on the web client, application processing and data handling on the app server, and the database on the DB server. The presentation layer has none of the other three.", "src": "P1 · p.27-28"}, {"c": "sand", "lab": "THE BROKEN MAPPING", "lead": "When tier 2 crashed, tier 1 could not reach tier 3.", "txt": "The app server (tier 2) was the only path from presentation (tier 1) to database (tier 3). When tier 2 crashed, there was no alternative path. That is the mapping decision that failed.", "src": "P1 · p.39"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "ALTERNATIVE 1", "lead": "Redundant tier 2.", "txt": "A hot-standby app server registered with the middleware. When tier 2a crashes, the middleware routes to tier 2b."}, {"c": "sand", "lab": "ALTERNATIVE 2", "lead": "Read-only direct path tier 1 to tier 3.", "txt": "A fallback read-only path from the presentation layer to the database tier for emergency record access. Activated when tier 2 is unreachable."}, {"c": "violet", "lab": "ALTERNATIVE 3", "lead": "Distributed component.", "txt": "No tier distinction. Components provide and receive services through middleware. The DB component can serve the presentation component directly."}]}, {"t": "principle", "txt": "Inspect each required tier for redundancy, recovery and shared dependencies; the mapping alone does not establish fault tolerance."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Logical layers and deployment tiers. Two minutes. The room usually picks redundant tier 2. Push for the read-only direct path: even a degraded read-only mode would have let the nurse see the patient record.", "appendix": false, "_iscarbRule": "RULE 09 - Layer-to-tier mapping", "route": "core", "showIf": null, "sourceRange": "23–28", "answer": "The 3-tier mapping put presentation on the web client, application processing and data handling on the app server, and the database on the DB server. The presentation layer has none of the other three. The app server (tier 2) was the only path from presentation (tier 1) to database (tier 3). When tier 2 crashed, there was no alternative path. That is the mapping decision that failed. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "Is a three-layer application necessarily deployed on three machines?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "No. Layers divide responsibilities logically; tiers describe deployment boundaries. Map layers onto tiers and justify the performance, security and failure consequences.", "timebox": "60 sec", "appendix": false}, {"k": "B01", "rule": "", "phase": "LEARN", "accent": "violet", "learn": "Compare the five architectural patterns by demand, trade-off, and failure mode.", "title": "Architecture choices and failure modes", "sub": "Each pattern makes a different assumption. Each assumption can break. Tonight&rsquo;s failure is the multi-tier assumption breaking.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "architecture comparison, drawn from source table"}, "blocks": [{"t": "compare", "head": ["Pattern", "Best for", "Trade-off", "Failure mode"], "rows": [{"c": "teal", "cells": ["Master-slave", "Real-time systems with guaranteed response times.", "Master is a coordinator; slaves are dedicated. Limited scalability.", "Master fails &rarr; whole system stops; slaves are useless without coordination."]}, {"c": "teal", "cells": ["Two-tier thin-client", "Legacy system migration; centralized security.", "Heavy load on server and network.", "Server fails &rarr; all clients stop. No local fallback."]}, {"c": "sand", "cells": ["Two-tier fat-client", "Off-the-shelf client software; mobile apps with cached data.", "More complex management; new versions on every client.", "Server fails &rarr; client may continue with cached data."]}, {"c": "violet", "cells": ["Multi-tier client-server", "High-volume transactions; volatile data and application.", "Each tier is a single point of failure without redundancy.", "<b>Tonight: app server tier failed &rarr; presentation could not reach database.</b>"]}, {"c": "mag", "cells": ["Distributed component", "Combining resources from different systems and databases.", "Complex to design; middleware compatibility and lifecycle support must be checked.", "Middleware fails &rarr; all components lose communication."]}, {"c": "green", "cells": ["Peer-to-peer", "Decentralized computation; exchange of locally stored information.", "Security concerns; malicious nodes can deliver spam and malware.", "No central failure &mdash; but trust is the failure mode."]}]}, {"t": "principle", "c": "mag", "txt": "An architectural pattern organizes responsibilities. Analyze its actual deployment to find bottlenecks, common dependencies and recovery paths."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Architecture choices and failure modes. Ninety seconds. The room usually pick ect", "SaaS", "SOA"], "rows": [{"c": "teal", "cells": ["What it is", "A way of providing functionality on a remote server, accessed via browser.", "An approach to structuring a software system as a set of separate, stateless services."]}, {"c": "teal", "cells": ["State", "Server maintains user state during a session.", "Services are stateless."]}, {"c": "sand", "cells": ["Transaction length", "Long transactions (e.g., editing a document).", "Short transactions (call, do something, return a result)."]}, {"c": "sand", "cells": ["Provider model", "Owned and managed by a software provider.", "Services may be provided by multiple providers and may be distributed."]}, {"c": "mag", "cells": ["Tonight", "If Mentcare is hosted by a vendor, it is SaaS.", "The 3-tier architecture is SOA-shaped internally."]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CONFIGURABILITY", "lead": "Per-organization configuration.", "txt": "Branding, business rules, database extensions, access control. Each organization defines its own rules and access.", "src": "P1 · p.61"}, {"c": "sand", "lab": "MULTI-TENANCY", "lead": "Efficient sharing with apparent sole use.", "txt": "Many users access the same system. The architecture must separate system functionality from system data absolutely.", "src": "P1 · p.62"}, {"c": "violet", "lab": "SCALABILITY", "lead": "Design for unpredictably many users.", "txt": "Stateless services, asynchronous interaction, resource pools, fine-grain database locking. None of these is optional.", "src": "P1 · p.64"}]}, {"t": "principle", "c": "mag", "txt": "SaaS is a deployment model; SOA is an architectural style. Confusing them produces systems that scale in theory and fail in practice."}, {"t": "wide", "c": "sand", "lab": "DISTINCT DESIGN QUESTIONS", "txt": "SaaS describes how software is delivered. SOA describes how a system is structured. A SaaS application can use a service-oriented architecture. The source compares typical interaction patterns; statefulness alone does not define either category."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: SaaS, SOA and implementation factors. Two minutes. The room usually says SaaS because the system is browser-accessed. The deeper point is that SaaS requires all three implementation factors; tonight&rsquo;s system failed multi-tenancy because there was no resource separation.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "53–66", "answer": "Branding, business rules, database extensions, access control. Each organization defines its own rules and access. Many users access the same system. The architecture must separate system functionality from system data absolutely. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "The Mentcare system was migrated to a 3-tier architecture. At 02:30 during a mental health crisis, the app server crashed."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is a layer-to-tier mapping diagram with a documented failure mode per tier and a named fallback for the app-server tier. It distinguishes a real architectural gap from a single outage. Pending that evidence, state a bounded keep, redesign, or add-redundancy decision, its owner and the condition for resuming service. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "READING", "title": "Required self-study · pages, purpose and deadline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Required self-study · before the assignment and next chapter discussion.</b> Read the two selections below, attempt the five-question check, and use one assigned source slide to support the assignment artifact. Blackboard provides the calendar deadline.</p><p><b>Time budget:</b> initially 15–25 minutes including the check; record actual time. These replace unfocused source browsing. The original source ledger remains available for clarification and unfinished classroom topics.</p></div><div class=\"lp-reading-row\"><h oute": "study", "blocks": [{"t": "raw", "html": "<p class=\"lp-study-note\">One question per chapter objective, in the same order as the five objectives. Attempt all five before opening feedback. Retry after reviewing an error. This public practice is not a secure test; the instructor uses a changed example during class.</p><form id=\"prepQuiz\" class=\"lp-prep\"><fieldset><legend>LO 1 · A timeout after a remote request means:</legend><label><input type=\"radio\" name=\"prep-0\" value=\"0\">The server certainly did nothing</label><label><input type=\"radio\" name=\"prep-0\" value=\"1\">The database is necessarily corrupted</label><label><input type=\"radio\" name=\"prep-0\" value=\"2\">The execution outcome may be unknown to the caller</label><p hidden data-prep-feedback id=\"prep-feedback-0\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 2 · Message-based interaction can:</legend><label><input type=\"radio\" name=\"prep-1\" value=\"0\">Decouple participants, while still requiring delivery and failure semantics</label><label><input type=\"radio\" name=\"prep-1\" value=\"1\">Guarantee exactly-once effects automatically</label><label><input type=\"radio\" name=\"prep-1\" value=\"2\">Remove the need for identifiers</label><p hidden data-prep-feedback id=\"prep-feedback-1\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 3 · Layers and tiers are:</legend><label><input type=\"radio\" name=\"prep-2\" value=\"0\">Always the same number</label><label><input type=\"radio\" name=\"prep-2\" value=\"1\">Logical responsibilities and deployment boundaries respectively</label><label><input type=\"radio\" name=\"prep-2\" value=\"2\">Both only user-interface concepts</label><p hidden data-prep-feedback id=\"prep-feedback-2\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 4 · A coordinator assigns work to worker processes. Which source pattern fits?</legend><label><input type=\"radio\" name=\"prep-3\" value=\"0\">Peer-to-peer only</label><label>
