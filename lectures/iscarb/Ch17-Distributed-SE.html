ollow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constraint will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State pattern + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constraint changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the failure-mode analysis"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed architecture"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE &mdash; PICK ONE", "picker": {"g": "mutation", "options": ["The hospital moves to SaaS hosted by a vendor", "The DB server becomes the single point of failure", "Budget halves: no redundancy possible", "The regulator requires multi-tenant isolation"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses &mdash; and why"}}, {"t": "principle", "txt": "A strong design either survives mutation &mdash; or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the architect.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses &mdash; stronger than a verdict that magically survives everything.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the architecture claim without trusting your explanation? Is the layer-to-tier map, the failure-mode analysis, the failover test, and the middleware config all on file?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the missing redundancy, the unverified tier, the untested failover, or the fallback path that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session &mdash; two questions only. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 9. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, challenge and sign, with a named architecture pattern behind it and a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use a pattern and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the architect.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "R14", "rule": "RULE 14 - Practitioner workload", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name a workload cost their architecture design creates for a practitioner, and the design change that reduces it.", "title": "Engineering changes human work", "sub": "A distributed architecture can still fail operationally if it creates unsustainable workload.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "FAILOVER DRILLS", "lead": "Who runs the failover drill, and how often?", "txt": "A redundant app server is worthless if the failover is never tested. The drill is a workload cost the architecture creates."}, {"c": "sand", "lab": "STANDBY MAINTENANCE", "txt": "Who patches the standby, who synchronises its state, who verifies it is registered with the middleware &mdash; and do they have the hours the process assumes?"}, {"c": "mag", "lab": "INCIDENT WORKLOAD", "txt": "What schedule pressure is the team absorbing when the architecture fails? A 47-minute outage at 02:30 is a staffing and cognitive-load issue, not only a technical one."}, {"c": "violet", "ic": "spark", "lab": "WHO WRITES IT NOW", "lead": "Generated code moves the load; it does not remove it.", "txt": "Writing hours fall, reviewing hours rise &mdash; on the same people. The middleware config is exactly the kind of code a model writes plausibly and a reviewer under-scrutinises."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT, THIS IS THE MECHANISM &mdash; NOT A FOOTNOTE", "lead": "Blaming the app server ends the investigation. Workload as a design input continues it.", "txt": "The 47-minute outage was resolved by a manual restart because the team had never run a failover drill. That is workload as a system variable: the architecture assumed a failover capability that nobody had rehearsed. The source says failures are inevitable (p.14). Blaming the app server ends the investigation; treating workload as a design input continues it.", "field": {"id": "workload", "core": false, "rows": 2, "ph": "One workload cost your architecture design creates for a real practitioner, and the concrete design change that reduces it", "ex": "<i>Shape only:</i> &ldquo;My design adds a hot-standby app server. With generated config the team now files four times as many failover-drill tickets, so the drill becomes the bottleneck. Design change: drills below a stated risk band get standing pre-approval, and the team sees a weekly batch instead of a queue.&rdquo;"}}, {"t": "principle", "txt": "Trade-offs include people, process, evidence and time &mdash; not only code."}], "timebox": "90 sec", "task": "Name one workload cost your preferred architecture design creates for a real practitioner, and the design change that reduces it.", "notes": "The rule with no equivalent in the textbook, and where ISCARB differs from a standard distributed-systems lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b>", "appendix": true, "route": "toolkit"}, {"k": "X08", "answer": "Illustrative target, not a measured result or a value from the chapter: Monitor the app-server failover time. Target: below 30 seconds, checked at every shift handover with a report to the on-call architect. If the target is missed (any failover above 30 seconds), alert the architect, switch to the read-only direct path, and investigate whether the standby is registered correctly with the middleware. The target and fallback require approval for the actual system.", "rule": "X08 - The same ideas, the other vocabulary", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Say the distributed-architecture idea they have just used in the vocabulary a services team would use for it.", "title": "You already know these. You may not know their other names.", "sub": "Left column: what this chapter calls it. Right column: what the same argument is called where most of you will work. Same idea, different room.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "not in the chapter &mdash; the chapter predates the vocabulary"}, "blocks": [{"t": "compare", "head": ["In this chapter", "Where most of you will work", "What the second one adds"], "rows": [{"c": "teal", "cells": ["Multi-tier client-server (p.39)", "Microservices with an API gateway", "Each tier becomes an independently deployable service with its own lifecycle"]}, {"c": "teal", "cells": ["Middleware providing location transparency (p.22)", "A service mesh or a service registry", "A standard pattern for service discovery and routing without hard-coded locations"]}, {"c": "sand", "cells": ["RPC vs message-based interaction (p.15-19)", "gRPC vs async messaging (Kafka, RabbitMQ)", "A standard pattern for synchronous request/response vs decoupled producers and consumers"]}, {"c": "sand", "cells": ["Thin-client with no local data (p.33-35)", "A single-page app with no offline mode", "A decision about resilience: nothing works when the server is unreachable"]}, {"c": "mag", "cells": ["Failure management &mdash; discover, contain, recover (p.14)", "Health checks, circuit breakers, graceful degradation", "A vocabulary for the failure-mode triad that this chapter names abstractly"]}, {"c": "violet", "cells": ["SaaS multi-tenancy (p.62)", "Tenant isolation in a multi-tenant SaaS", "A standard pattern for sharing infrastructure while keeping data separate"]}]}, {"t": "wide", "c": "violet", "lab": "ONE LINE, IN THE OTHER VOCABULARY", "field": {"id": "vocab_own", "core": false, "rows": 1, "ph": "Take the monitor you wrote in Rule 10 and state it as a target, a window, and what happens when it is missed"}}], "hueOk": "Colours carry over from X07 and B01 so the student recognises which family each row belongs to.", "timebox": "90 sec", "cut": true, "task": "Read the middle column. Then restate your own Rule 10 monitor in it.", "say": "Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.", "notes": "Ninety seconds. The honest history: this chapter predates the vocabulary in the middle column. The direction of translation matters: a student who learns only the middle column can run a dashboard and cannot argue an architecture; a student who has both can do both. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R15", "answer": "<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>", "rule": "RULE 15 - AI assist + human sign-off", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.", "title": "AI prepares evidence; humans own assurance", "sub": "AI is permitted for preparation, never for unowned approval.", "badge": {"c": "mag", "t": "AI MOMENT", "s": "assist, not assurance"}, "blocks": [{"t": "aiflow"}, {"t": "aigate"}], "timebox": "90 sec", "task": "Run the gate on the way you actually used AI this week &mdash; on a real output, not a hypothetical. <b style=\"color:var(--mag)\">You are the architect.</b>", "notes": "The gate is the rule, not the three stations above it &mdash; make every student run it on something they really did this week. <b>The two middle questions are the whole slide.</b>", "appendix": true, "route": "toolkit"}], "appendixUnits": ["READING", "PREP", "C01", "SRC00", "SRC01", "SRC02", "SRC03", "SRC04", "SRC05", "R01", "R02R03", "R08", "R18", "R10", "R12", "J02", "R02", "R03", "R04", "R05", "H01", "QA1", "QA2", "R06", "R07", "QA3", "R11", "R13", "QA4", "R16", "R17", "R19", "J01", "R20", "R14", "X08", "R15"], "mainUnits": ["TITLE", "START", "X01", "X02", "X02A", "X03", "CHECK1", "X04", "X05", "X06", "R09", "CHECK2", "B01", "X07", "X09", "X10", "APPLY", "END"], "path": {"chapter": 17, "assignment": 8, "exit": ["Explain distributed-system design issues.", "Compare RPC and message-based interaction.", "Distinguish layers and tiers.", "Choose among the five source architectural patterns.", "Explain SaaS configuration, multi-tenancy and scaling."], "sourceFile": "sources/Ch17-Original.pptx", "build": "20260921-visual-v3"}, "study": {"readings": [["Distributed architectural patterns", 29, 34], ["SaaS and service delivery", 53, 58]], "technical": "Distinguish SaaS delivery from service-oriented architecture. Explain why a SaaS system may also use a service-oriented architecture; give one tenant-isolation concern.", "oral": "Change one event in your lost-response sequence so that a duplicate is expected even with persistent request identities. Explain the new assumption.", "quiz": [["A timeout after a remote request means:", ["The server certainly did nothing", "The database is necessarily corrupted", "The execution outcome may be unknown to the caller"], 2, "Execution and response delivery can fail independently."], ["Message-based interaction can:", ["Decouple participants, while still requiring delivery and failure semantics", "Guarantee exactly-once effects automatically", "Remove the need for identifiers"], 0, "Messaging changes interaction but does not remove duplicate or failure handling."], ["Layers and tiers are:", ["Always the same number", "Logical responsibilities and deployment boundaries respectively", "Both only user-interface concepts"], 1, "Several layers can share a deployment tier."], ["A coordinator assigns work to worker processes. Which source pattern fits?", ["Peer-to-peer only", "Thin-client only", "Master–slave / coordinator–worker"], 2, "The pattern organizes coordination and subordinate processing; its bottlenecks still matter."], ["Which statement about SaaS is correct?", ["Delivery as a service can coexist with SOA and needs tenant-isolation design", "Every SaaS system is a single shared tenant", "SaaS guarantees stateless implementation"], 0, "Delivery model, architecture and state management are distinct design choices."]]}, "caseMap": [{"title": "Classroom application", "parts": [["Claim and evidence", "f:path_claim"], ["Limit and challenge", "f:path_limit"], ["Owner and next step", "f:path_owner"]]}], "visualStory": {"units": {"X01": {"takeaway": "Independent computers communicate, so partial failure is a normal design concern.", "nodes": [["Client", "May remain available"], ["Network", "May lose messages"], ["Server", "May execute independently"]], "visual": "flow"}, "X02": {"takeaway": "Review all six distributed-system design issues; improving one can constrain another.", "nodes": [["Transparency + openness", "Hide distribution and support integration"], ["Scalability + security", "Handle growth and protect access"], ["Quality of service + failure management", "Meet targets and handle partial failure"]], "visual": "compare"}, "X02A": {"takeaway": "A missing response leaves the caller uncertain about execution.", "nodes": [["Request", "Sent to server"], ["Execution", "May have completed"], ["Response", "Lost or delayed"], ["Retry", "May duplicate the effect"]], "visual": "flow"}, "X03": {"takeaway": "RPC resembles a call; messaging decouples interaction but still needs failure semantics.", "nodes": [["RPC", "Request and response"], ["Messaging", "Exchange explicit messages"], ["Both", "Handle loss and duplication"]], "visual": "compare"}, "X04": {"takeaway": "Middleware supplies common communication and coordination services.", "nodes": [["Application", "Domain behavior"], ["Middleware", "Communication support"], ["Platform", "Execution environment"]], "visual": "ch17_middleware"}, "X05": {"takeaway": "The four layers separate display, client-data handling, application processing and the database.", "nodes": [["Presentation", "Show information and interactions"], ["Data handling", "Check and manage client data"], ["Application processing", "Perform domain work"], ["Database", "Store and retrieve records"]], "visual": "ch17_layered"}, "X06": {"takeaway": "Compare five patterns against the workload and failure consequences.", "nodes": [["Master–slave", "Coordinate dedicated workers"], ["Two-tier client-server", "Clients and a server"], ["Multi-tier client-server", "Separate service tiers"], ["Distributed component", "Provide and use services"], ["Peer-to-peer", "Share distributed roles"]], "visual": "compare"}, "R09": {"takeaway": "Layers describe responsibilities; tiers describe deployment boundaries.", "nodes": [["Logical layers", "What the parts do"], ["Physical tiers", "Where they execute"]], "visual": "compare"}, "B01": {"takeaway": "The full five-pattern comparison belongs beside the specific workload.", "nodes": [["Demand", "Required interaction"], ["Pattern", "Organization of parts"], ["Trade-off", "Bottleneck and failure modes"]], "visual": "flow"}, "X07": {"takeaway": "A thin client relies more on the server; a fat client performs more local processing.", "nodes": [["Thin client", "More server work"], ["Fat client", "More local work"], ["Choice", "Deployment and failure trade-offs"]], "visual": "compare"}, "X09": {"takeaway": "Shared SaaS infrastructure still needs explicit tenant isolation.", "nodes": [["Tenant A", "Authorized data"], ["Shared service", "Enforced boundaries"], ["Tenant B", "Separate authorization"]], "visual": "ch17_multitenant"}, "X10": {"takeaway": "SaaS /* ---------- glossary -------------------------------------------------------
   A term a first-year student has not met yet costs the room its attention:
   they stop following the argument and start guessing the word. LECTURE.glossary
   defines each one once, and every occurrence in rendered card text carries its
   definition on hover or tap. Applied to assembled HTML, so it steps over tags
   and never rewrites an attribute or a term already inside a definition. */
var GL=(function(){
  var g=LECTURE.glossary||{}, out=[];
  for(var k in g) out.push([k,g[k]]);
  out.sort(function(a,b){return b[0].length-a[0].length;});   /* longest first */
  return out;

  if(!GL.length)return html;
  var root=document.createElement('div');root.innerHTML=html;
  var nodes=[],used={},definitions={};
  GL.forEach(function(entry){definitions[entry[0].toLowerCase()]=entry[1];});
  function collect(el){
    if(el.nodeType===3){nodes.push(el);return;}
    if(el.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA|BUTTON|A)$/.test(el.tagName)||el.classList.contains('gl'))return;
    if(el.namespaceURI&&el.namespaceURI!=='http://www.w3.org/1999/xhtml')return;   /* v10: svg figure labels are not prose */
    Array.from(el.childNodes).forEach(collect);

  var terms=GL.map(function(entry){return entry[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});

    expression.lastIndex=0;

      fragment.appendChild(document.createTextNode(raw.slice(last,start)));
      var term=document.createElement('span');term.className='gl';term.textContent=m[2];term.setAttribute('data-def',definitions[key]);
      fragment.appendChild(term);last=start+m[2].length;used[key]=true;changed=true;

function cloOk(r){
  for(var i=0;i<r.needs.length;i++){

       the failure trace were filled but JAH-2 still read "not supported",

/* ---------- v12 retrieval loop: 60 seconds at the close of every phase ------

   questions answered FROM MEMORY first, a reveal per row, and an honest
   self-score. Nothing is saved — the drill is the moment, not an artifact. */
var QA_C=326.7;                                  /* ring circumference, r=52  */
function rQa(b){
  var items=b.items||[];

    '<div class="qa-side">'+
     '<button class="qa-ring" data-qa-ring="1" aria-label="Start the sixty-second retrieval timer">'+

      '<b class="qa-secs">60</b></button>'+
     '<div class="qa-meta"><span class="qa-tag">'+(b.tag||'')+'</span>'+
      '<span class="qa-hint qa-h1">Press the ring, then answer out loud from memory</span>'+
      '<span class="qa-hint qa-h2">Time &mdash; now reveal and score honestly</span></div>'+

       '<button class="qa-miss" data-qa-judge="miss">Missed it</button></div></div>'+
       '<button class="qa-tog" data-qa-tog="1" aria-expanded="false">Reveal</button></div>';
  }
  return h+'</div></div>';
}
function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
      var live=document.getElementById('tLive');
      if(live) live.textContent='The retrieval minute is over — reveal and compare.';
    }
  },1000);
  btn.setAttribute('data-running',String(id));
}
function qaScore(box){
  var rows=box.querySelectorAll('.qa-row'),hit=0,marked=0;
  for(var i=0;i<rows.length;i++){
    if(rows[i].classList.contains('picked-hit')){hit++;marked++;}
    else if(rows[i].classList.contains('picked-miss')) marked++;
  }
  var sc=box.querySelector('.qa-score');
  if(!sc) return;
  sc.setAttribute('data-hit',(rows.length&&hit===rows.length)?'all':'part');
  sc.querySelector('.qa-sval').textContent=hit+'/'+rows.length;
}

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(typeof ref!=='string') return '';
  if(ref==='@marks') return Object.keys(S.marks||{}).filter(function(k){return Array.isArray(S.marks[k])&&S.marks[k].length;}).join(' ');
  if(ref==='@gates'){var passed=GATE_DEFS.filter(function(g){return S.gates&&S.gates[g[0]];}).length;return passed?String(passed):'';}
  if(ref==='@signed'){var signed=Object.keys(S.sign||{}).filter(function(k){return S.sign[k];}).length;return signed?String(signed):'';}
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function policyThreshold(config,key){
  var policy=LECTURE.thresholds||{},name=(config&&config.minKey)||key;

/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    var m=s.match(/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */
function uncitedPages(){
  var C=LECTURE.coverage; if(!C||!C.span) return [];
  var hits=srcPages(), out=[], run=null;
  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }
  }

  return out;
}

/* ---------- hidden model answer / instructor key ---------------------------
   Every question-bearing unit gets the same open/close affordance. The author
   defines u.answer for a model response. Learning objectives and spoken teaching
   cues are never relabelled as answers. noAnswer suppresses a pre-reveal key. */
function hasQuestion(u){
  if(!u||u.k==='TITLE'||u.k==='END'||u.noAnswer===true) return false;
  if(typeof u.answer==='string'&&u.answer.trim())return true;
  if(u.question===true)return true;
  var probe=' '+(u.task||'')+' '+JSON.stringify(u.blocks||[])+' ';
  return /\?|\bchoose\b|\bclassify\b|\bdecide\b|\bname\b|\bwhich\b|\bwhat\b|\bwhy\b|\bhow\b/i.test(strip(probe));
}
function answerKey(u){
  return T(u.answer||'State a bounded claim, identify supporting evidence and name an observation that would reverse the claim. Compare your response with the source and discuss the reasoning with the instructor.');
}
function rAnswer(u){
  if(!hasQuestion(u)) return '';
  var id='ans-'+u.k, hasFields=/"field"\s*:|"picker"\s*:/.test(JSON.stringify(u.blocks||[]));
  return '<div class="answer-wrap">'+(hasFields?'<span class="attempt-hint">Try your own answer, then compare.</span>':'')+
    '<button class="answer-toggle" data-answer-toggle="'+id+'" aria-controls="'+id+'" aria-expanded="false"'+(hasFields?' data-soft="1"':'')+'>Answer</button>'+
    '<div class="answer-box" id="'+id+'" data-answer-box="'+id+'" hidden><b>EXAMPLE EXPLANATION</b><br>'+answerKey(u)+'</div></div>';
}

/* Readability pass: enlarge light slides, compact dense ones. This is structural
   rather than manual per-slide font tweaking, so every cloned lecture behaves

function applyReadableDensity(){

  for(var i=0;i<slides.length;i++){
    var u=U[i]||{}, raw=strip(JSON.stringify(u.blocks||[])), cards=slides[i].querySelectorAll('.card,.cvr,.brr,.cl,.jah-row,.qz-o').length;

/* ---------- v7 auto-fit: a slide fills the stage exactly, never scrolls -----
   Content that would overflow is measured, then the .fit wrapper is scaled
   down just enough to fit. Re-run whenever content can change size: reader
   zoom (+/-), navigation to a conditional slide, or a late-loading figure. */
function fitSlide(sl){
  sl=sl||deck.querySelector('.slide.on'); if(!sl) return;
  var fit=sl.querySelector('.fit'); if(!fit) return;
  fit.style.transform='none';
  var cs=getComputedStyle(sl);
  var avail=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!(avail>0)) return;
  var h=fit.scrollHeight;
  if(h>avail+1){
    var f=avail/h;
    if(f<.55) f=.55;                     /* legibility floor — nothing unreadable */
    fit.style.transform='scale('+f+')';
    fit.style.transformOrigin='top center';
  }
}

/* ---------- author sanity check ---------------------------------------------
   Runtime guardrails for cloned/adapted lectures. Warnings never block class.
   Run ISCARB_SANITY() from DevTools at any time to re-check the current deck. */
function sanity(){
  var issues=[], declaredF={}, declaredP={}, usedImg={}, names=LECTURE.fieldNames||{};
  function walk(x){
    if(!x) return;
    if(Array.isArray(x)){ for(var i=0;i<x.length;i++) walk(x[i]); return; }
    if(typeof x!=='object') return;
    if(x.field&&x.field.id) declaredF[x.field.id]=1;
    if(x.picker&&x.picker.g) declaredP[x.picker.g]=1;
    if(x.t==='levels')declaredP.level=1;
    if(x.img&&typeof x.img==='string') usedImg[x.img]=1;
    if(x.t==='raw'&&typeof x.html==='string'){
      var re=/data-pick=["']([^"']+)["']/g,m;
      while((m=re.exec(x.html))) declaredP[m[1]]=1;
    }
    for(var k in x) if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]);
  }
  walk(LECTURE.units||[]);

  var fs=document.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var id=fs[i].getAttribute('data-f');
    if(!declaredF[id]&&!names['f:'+id]) issues.push('data-f "'+id+'" has no field declaration or fieldNames alias');
  }

  var cm=LECTURE.caseMap||[];
  for(var c=0;c<cm.length;c++){
    var parts=cm[c].parts||[];
    for(var p=0;p<parts.length;p++){
      var ref=parts[p][1]||'';
      if(ref.indexOf('p:')===0&&!declaredP[ref.slice(2)])
        issues.push('caseMap picker "'+ref+'" is not present in lecture blocks');
      if(ref.indexOf('f:')===0&&!declaredF[ref.slice(2)]&&!names[ref])
        issues.push('caseMap field "'+ref+'" is not present in lecture blocks');
    }
  }

  var exported={};
  cm.forEach(function(section){section.parts.forEach(function(part){exported[part[1]]=true;});});
  document.querySelectorAll('[data-f]').forEach(function(el){var ref='f:'+el.getAttribute('data-f');if(!exported[ref])issues.push('Unexported answer field: '+ref);});
  document.querySelectorAll('[data-pick]').forEach(function(el){var ref='p:'+el.getAttribute('data-pick');if(!exported[ref])issues.push('Unexported choice: '+ref);});
  LECTURE.units.forEach(function(u){if(u.showIf&&u.showIf.thin&&u.showIf.minKey&&!Object.prototype.hasOwnProperty.call(LECTURE.thresholds,u.showIf.minKey))issues.push('Unknown threshold key in '+u.k);});
  for(var img in usedImg)
    if(!Object.prototype.hasOwnProperty.call(FIG,img)) issues.push('figure key "'+img+'" is used but missing from FIG');

  var keys={};
  for(var u=0;u<(LECTURE.units||[]).length;u++){
    var uk=LECTURE.units[u].k;
    if(keys[uk]) issues.push('duplicate unit key "'+uk+'"');
    keys[uk]=1;
  }

  var unresolved=(document.getElementById('deck').innerHTML.match(/\{\{\s*[^}]+\s*\}\}/g)||[]);
  if(unresolved.length) issues.push('unresolved context token(s): '+unresolved.join(', '));

  var report={ok:issues.length===0,issues:issues,fields:Object.keys(declaredF).length,
    pickers:Object.keys(declaredP).length,figures:Object.keys(usedImg).length,units:(LECTURE.units||[]).length};
  try{
    if(window.console){
      if(report.ok){ if(typeof console.info==='function') console.info('[ISCARB sanity] OK',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] OK',report); }
      else { if(typeof console.warn==='function') console.warn('[ISCARB sanity] '+issues.length+' issue(s)',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] '+issues.length+' issue(s)',report); }
    }
  }catch(e){}
  window.ISCARB_SANITY_REPORT=report;
  return report;
}
window.ISCARB_SANITY=sanity;
sanity();

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;
}
/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=policyThreshold(c,'thinDefault');
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}
  return true;
}

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){
  var L=LECTURE, o=[];
  var line=function(x){o.push(x===undefined?'':x);};
  line('# '+strip(T(L.title))+' — course file extract');
  line('');
  line('Course: '+strip(T(L.course))+'  |  Source: '+strip(T(L.source)));
  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');
  line('lecture and rendered by the same engine that teaches it.');
  line('');
  line('Cut points ('+L.units.filter(function(u){return u.cut;}).length+'): '+L.units.filter(function(u){return u.cut;}).map(function(u){return u.k;}).join(', '));
  line('Scaffolding thresholds: '+JSON.stringify(L.thresholds));
  line('');
  line('## 1. Session outcomes, by unit');
  line('');
  line('| Unit | Rule | The student will be able to | Activity | Timebox |');
  line('|---|---|---|---|---|');
  for(var i=0;i<L.units.length;i++){
    var u=L.units[i]; if(!u.rule||!u.learn) continue;
    line('| '+u.k+' | '+strip(T(u.rule))+' | '+strip(T(u.learn))+' | '+strip(T(u.task||'—'))+' | '+(u.timebox||'—')+' |');
  }
  line('');
  line('## 2. Course and programme outcome map');
  line('');
  line('| CLO | PLO | Domain | Outcome | Evidence the student produces | Where |');
  line('|---|---|---|---|---|---|');
  for(var r=0;r<(L.readiness||[]).length;r++){
    var R=L.readiness[r], NAMES=L.fieldNames||{}, ev=[];
    for(var n=0;n<(R.needs||[]).length;n++) ev.push(NAMES[R.needs[n]]||R.needs[n]);
    line('| '+R.clo+' | '+(R.plo||'—')+' | '+(R.d||'')+' | '+strip(T(R.txt))+' | '+ev.join(', ')+' | '+strip(R.where||'')+' |');
  }
  line('');
  line('Assessment evidence is the artifact itself: the decision card the student');
  line('exports, whose sections are listed in §5. The closing unit reads the map');
  line('above off that artifact rather than off self-report.');
  line('');
  line('## 3. Source coverage');
  line('');
  var rows=coverageRows();
  if(rows.length){
    line('| Section | Pages | Status | Reached by |');
    line('|---|---|---|---|');
    for(var c=0;c<rows.length;c++){
      var R2=rows[c];
      line('| '+R2.s.k+' '+strip(R2.s.t)+' | '+R2.s.pp[0]+'–'+R2.s.pp[1]+' | '+R2.st+' | '+(R2.units.join(', ')||'—')+' |');
      if(R2.st==='open'&&R2.s.why) line('| | | out of scope | '+strip(R2.s.why)+' |');
    }
    var g=uncitedPages();
    if(g.length){ line(''); line('Pages within the source span that this session never cites: '+
      strip(fmtRanges(g))+'. Counted from the page citation on every card.'); }
  } else line('No coverage ledger declared.');
  line('');
  if(L.jahiziah){
    line('## 4. National alignment');
    line('');
    line(strip(T(L.jahiziah.gku))+' → '+strip(T(L.jahiziah.sku)));
    line('');
    line('| # | Outcome | Status | Where |');
    line('|---|---|---|---|');
    for(var j=0;j<(L.jahiziah.outcomes||[]).length;j++){
      var O=L.jahiziah.outcomes[j];
      line('| '+O.n+' | '+strip(T(O.txt))+' | '+O.s+' | '+strip(T(O.where||''))+' |');
    }
    line('');
    line('This states coverage only. It is not the national examination and');
    line('predicts nothing about any student\'s result on it.');
    line('');
  }
  line('## 5. The artifact each student leaves holding');
  line('');
  for(var m=0;m<(L.caseMap||[]).length;m++) line('- '+strip(T(L.caseMap[m].t)));
  line('');
  line('## 6. Accessibility and data');
  line('');
  line('- Runs as one HTML file with no install, no account and no network.');
  line('- Nothing a student types leaves their browser; there is no server to hold it.');
  line('- Full keyboard navigation; ? lists the keys. Text size adjustable 80–140%.');
  line('- Every status is carried by a word as well as a colour.');
  line('');
  line('Generated '+new Date().toISOString().slice(0,10)+' by the ISCARB lecture engine.');
  return o.join('\n');
}
function strip(x){
  if(x==null||x==='') return '';
  var s=String(x);
  var d=document.createElement('div'); d.innerHTML=s;
  s=(d.textContent||d.innerText||s).replace(/\s+/g,' ').trim();
  return s.replace(/\|/g,'\\|').trim();
}

var tS=0,tT=0,tOn=false,tI=null;
function fmt(s){var m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?'+':'')+m+':'+(x<10?'0':'')+x;}
function resetTimer(sec){
  tT=sec; tS=sec; tOn=false; clearInterval(tI);
  document.getElementById('timer').className='';

function toggleTimer(){
  if(!tT) return; tOn=!tOn;

  },1000);}

}
/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}

/* ---------- v12 quick view: the deck turns itself ---------------------------
   One button (or Q) auto-advances at a readable pace with a visible progress
   line on the bar — built for self-review, screen recording and sharing.
   Any manual navigation cancels it (the guard sits inside go()); it holds
   still while the tab is hidden or the student is typing, and it follows
   the same visible route the arrows follow — conditional units stay skipped. */
var QV={on:false,driving:false,total:0,left:0,last:0,raf:0};
function qvDwell(i){
  var u=U[i]; if(!u) return 7000;
  if(u.k==='TITLE') return 5000;
  if(u.k==='END') return 6500;
  var b=JSON.stringify(u.blocks||[]);

  return 7000;
}
function qvPaint(){

}
function qvLabel(){
  var b=document.getElementById('qvBtn'); if(!b) return;
  b.setAttribute('data-on',QV.on?'1':'0');
  var ci=b.querySelector('.ci'),ct=b.querySelector('.ct');
  if(ci) ci.textContent=QV.on?'\u23F8':'\u25B6';
  if(ct) ct.textContent=QV.on?'Pause':'Quick view';
  document.body.classList.toggle('qv-on',QV.on);
}
function qvStep(ts){
  if(!QV.on) return;
  if(document.hidden){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  var ae=document.activeElement;
  if(ae&&/^(textarea|input)$/i.test(ae.tagName)){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  QV.left-=(ts-QV.last); QV.last=ts; qvPaint();
  if(QV.left<=0){
    if(cur>=U.length-1||!visibleInDirection(1)){ qvStop(); note('Quick view finished.'); return; }
    QV.driving=true; go(cur+1); QV.driving=false;
    QV.total=QV.left=qvDwell(cur); qvPaint();
  }
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStart(){
  QV.on=true; QV.total=QV.left=qvDwell(cur); QV.last=performance.now();
  qvLabel(); qvPaint();
  note('Quick view on — the deck turns itself. Q or Esc stops it.');
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStop(){
  if(!QV.on) return;
  QV.on=false; cancelAnimationFrame(QV.raf); qvLabel(); qvPaint();
}
