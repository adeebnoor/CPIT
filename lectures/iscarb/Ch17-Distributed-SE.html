tus" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch17-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":17,"title":"Distributed Software Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260921-classroom-v3","filename":"Ch17-Distributed-SE.html","assignment":8,"points":5,"objectives":["Explain distributed-system design issues.","Compare RPC and message-based interaction.","Distinguish layers and tiers.","Choose among the five source architectural patterns.","Explain SaaS configuration, multi-tenancy and scaling."],"sections":["17.1 Distributed systems","17.2 Client–server computing","17.3 Architectural patterns","17.4 Software as a service"],"case":{"headline":"The request executes. Its response disappears.","text":"A fictional distributed service accepts a user operation. The caller times out without a response. The provided trace does not yet show whether execution or its durable effect completed.","question":"What may happen on retry, and what evidence resolves the uncertainty?","mutation":"A later trace shows that the original operation committed before its response was lost."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Distributed Software Engineering","phase":"START","takeaway":"Distributed Software Engineering","full":"<p>Distributed Software Engineering<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"X01","title":"Distribution changes the engineering problem","fig":null,"sourceRange":"3–7","bullets":[["Resource sharing","Several computers contribute services and resources."],["Concurrency","Processes execute independently and communicate."],["Potential benefits","Openness, scaling and tolerance of some failures."],["Cost","Latency, partial failure and separately managed nodes increase complexity."]],"question":"Why can an apparently local app still be a distributed system?","answer":"It can depend on remote storage, updates or services. Its useful operation then depends on network and remote-system behavior.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Latency, partial failure and separately managed nodes increase complexity.","full":"<p><b>Resource sharing.<\/b> Several computers contribute services and resources.<\/p><p><b>Concurrency.<\/b> Processes execute independently and communicate.<\/p><p><b>Potential benefits.<\/b> Openness, scaling and tolerance of some failures.<\/p><p><b>Cost.<\/b> Latency, partial failure and separately managed nodes increase complexity.<\/p>","sourceStart":3},{"id":"X02","title":"Six design issues recur","fig":null,"sourceRange":"8–14","bullets":[["Transparency / openness","Decide what distribution to expose and which interfaces to standardize."],["Scalability / QoS","State capacity, response and throughput needs."],["Security","Reconcile protection across independently managed parts."],["Failure management","Detect, contain and recover from partial failures."]],"question":"When is hiding distribution from users misleading?","answer":"When a remote delay or uncertain outcome affects what they should do next. Exposing pending or unavailable states can be necessary for correct interaction.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Detect, contain and recover from partial failures.","full":"<p><b>Transparency / openness.<\/b> Decide what distribution to expose and which interfaces to standardize.<\/p><p><b>Scalability / QoS.<\/b> State capacity, response and throughput needs.<\/p><p><b>Security.<\/b> Reconcile protection across independently managed parts.<\/p><p><b>Failure management.<\/b> Detect, contain and recover from partial failures.<\/p>","sourceStart":8},{"id":"SCALE","title":"Scaling has three dimensions","fig":null,"sourceRange":"8–14","bullets":[["Size","Add capacity to serve more demand."],["Distribution","Account for geographic distance and network delay."],["Manageability","Keep independently located parts governable and maintainable."],["Up / out","Stronger resources / more resources; scaling out needs useful parallel work."]],"question":"Will adding web servers necessarily fix a serialized database bottleneck?","answer":"No. The constrained resource and available concurrency determine whether extra servers improve the required service.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Stronger resources / more resources; scaling out needs useful parallel work.","full":"<p><b>Size.<\/b> Add capacity to serve more demand.<\/p><p><b>Distribution.<\/b> Account for geographic distance and network delay.<\/p><p><b>Manageability.<\/b> Keep independently located parts governable and maintainable.<\/p><p><b>Up / out.<\/b> Stronger resources / more resources; scaling out needs useful parallel work.<\/p>","sourceStart":8},{"id":"X02A","title":"A timeout does not describe the remote outcome","fig":null,"sourceRange":"8–14","bullets":[["Partial failure","One part can fail while other parts continue."],["Detect","Use observed symptoms and specified failure criteria."],["Contain / recover","Bound the effect and maintain useful service where possible."],["Uncertainty","A lost response may follow successful execution."]],"question":"What remains unknown after a response is lost?","answer":"The caller may not know whether the operation executed or committed. This course example applies the source’s failure-management principle.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A lost response may follow successful execution.","full":"<p><b>Partial failure.<\/b> One part can fail while other parts continue.<\/p><p><b>Detect.<\/b> Use observed symptoms and specified failure criteria.<\/p><p><b>Contain / recover.<\/b> Bound the effect and maintain useful service where possible.<\/p><p><b>Uncertainty.<\/b> A lost response may follow successful execution.<\/p>","sourceStart":8},{"id":"X03","title":"RPC and messages make different interaction assumptions","fig":null,"sourceRange":"15–18","bullets":[["RPC","A caller requests a known remote operation and awaits a result."],["Stub / middleware","Translate and carry parameters and results."],["Messages","A sender describes work for delivery through middleware."],["Queueing","Can tolerate temporary receiver unavailability; delivery semantics still matter."]],"question":"Does queueing automatically prevent duplicate effects?","answer":"No. A queue changes interaction and availability assumptions; duplicate handling and operation semantics must still be specified.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Can tolerate temporary receiver unavailability; delivery semantics still matter.","full":"<p><b>RPC.<\/b> A caller requests a known remote operation and awaits a result.<\/p><p><b>Stub / middleware.<\/b> Translate and carry parameters and results.<\/p><p><b>Messages.<\/b> A sender describes work for delivery through middleware.<\/p><p><b>Queueing.<\/b> Can tolerate temporary receiver unavailability; delivery semantics still matter.<\/p>","sourceStart":15},{"id":"CHECK1","title":"Checkpoint · keep uncertainty visible","fig":null,"sourceRange":"3–18","bullets":[["Think","A request is accepted, but its response is lost."],["Pair","Distinguish a failed request from an unknown outcome."],["Record","Write the claim and the evidence needed before retrying."]],"question":"Why is “the server did nothing” not justified by a client timeout?","answer":"The execution may have completed before the response was lost. The caller needs an appropriate status or operation-identity mechanism.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Write the claim and the evidence needed before retrying.","full":"<p><b>Think.<\/b> A request is accepted, but its response is lost.<\/p><p><b>Pair.<\/b> Distinguish a failed request from an unknown outcome.<\/p><p><b>Record.<\/b> Write the claim and the evidence needed before retrying.<\/p>","sourceStart":3},{"id":"X04","title":"Middleware mediates heterogeneity","fig":"ch17_middleware","sourceRange":"19–22","bullets":[["Interaction support","Coordinate calls/messages and representation conversion."],["Common services","Examples include naming, security and transactions."],["Transparency","Map logical requests to physical resources."],["Boundary","Shared middleware is itself a dependency, not magic fault removal."]],"question":"What must two components agree on even when middleware converts data types?","answer":"The meaning of values, operations, errors and state changes. Representation conversion does not establish semantic compatibility.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/317be56625de18e7.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Shared middleware is itself a dependency, not magic fault removal.","full":"<p><b>Interaction support.<\/b> Coordinate calls/messages and representation conversion.<\/p><p><b>Common services.<\/b> Examples include naming, security and transactions.<\/p><p><b>Transparency.<\/b> Map logical requests to physical resources.<\/p><p><b>Boundary.<\/b> Shared middleware is itself a dependency, not magic fault removal.<\/p>","sourceStart":19},{"id":"X05","title":"Clients and servers are roles, not necessarily machines","fig":null,"sourceRange":"23–28","bullets":[["Client","Requests services and presents results."],["Server","Provides services to clients."],["Processes","Several logical clients or servers may share a processor."],["Deployment","Load balancing and replication change physical allocation."]],"question":"Can client and server processes run on the same computer?","answer":"Yes. The logical interaction model is distinct from deployment across machines.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Load balancing and replication change physical allocation.","full":"<p><b>Client.<\/b> Requests services and presents results.<\/p><p><b>Server.<\/b> Provides services to clients.<\/p><p><b>Processes.<\/b> Several logical clients or servers may share a processor.<\/p><p><b>Deployment.<\/b> Load balancing and replication change physical allocation.<\/p>","sourceStart":23},{"id":"R09","title":"Four logical layers can map to different tiers","fig":"ch17_layered","sourceRange":"23–28","bullets":[["Presentation","User interaction and display."],["Data handling","Manage client data, validation and generated presentation."],["Application processing","Implement application logic."],["Database","Persist data and support query/transaction services."]],"question":"Why is a four-layer design not automatically a four-tier deployment?","answer":"Layers are logical responsibilities. Several layers may share one process or computer; tiers describe deployment boundaries.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/94ee2b0be0e93e22.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Persist data and support query/transaction services.","full":"<p><b>Presentation.<\/b> User interaction and display.<\/p><p><b>Data handling.<\/b> Manage client data, validation and generated presentation.<\/p><p><b>Application processing.<\/b> Implement application logic.<\/p><p><b>Database.<\/b> Persist data and support query/transaction services.<\/p>","sourceStart":23},{"id":"X06","title":"Five architectural patterns—not one universal answer","fig":"ch17_masterslave","sourceRange":"29–52","bullets":[["Coordination","Master–slave assigns specialized work under a coordinating process."],["Client–server","Two-tier or multi-tier distributes presentation, logic and data."],["Distributed components","Interacting service-providing components use middleware."],["Peer-to-peer","Nodes can provide and consume resources; discovery may use superpeers."]],"question":"Which pattern suits independent processing jobs coordinated by one scheduler?","answer":"The source’s master–slave pattern is a candidate. Its coordination, deadline and failure assumptions still need assessment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1c615d574ed7c84a.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Nodes can provide and consume resources; discovery may use superpeers.","full":"<p><b>Coordination.<\/b> Master–slave assigns specialized work under a coordinating process.<\/p><p><b>Client–server.<\/b> Two-tier or multi-tier distributes presentation, logic and data.<\/p><p><b>Distributed components.<\/b> Interacting service-providing components use middleware.<\/p><p><b>Peer-to-peer.<\/b> Nodes can provide and consume resources; discovery may use superpeers.<\/p>","sourceStart":29},{"id":"CHECK2","title":"Checkpoint · place the failure responsibility","fig":null,"sourceRange":"19–52","bullets":[["Think","Compare a central service with distributed participating components."],["Pair","Name a bottleneck, a failure boundary and an observable recovery check."],["Record","Add the architecture and its limits to the same card."]],"question":"Which diagram annotation matters more than adding another box?","answer":"The request/effect boundary, who detects failure, what is retried and how uncertain or duplicate outcomes are reconciled.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the architecture and its limits to the same card.","full":"<p><b>Think.<\/b> Compare a central service with distributed participating components.<\/p><p><b>Pair.<\/b> Name a bottleneck, a failure boundary and an observable recovery check.<\/p><p><b>Record.<\/b> Add the architecture and its limits to the same card.<\/p>","sourceStart":19},{"id":"B01","title":"Architecture selection follows the required qualities","fig":"ch17_distcomp","sourceRange":"29–52","bullets":[["Multi-tier","Separates responsibilities so capacity can be managed by tier."],["Distributed components","Flexible placement and integration, with greater coordination complexity."],["Peer-to-peer","Uses distributed resources but complicates control and trust."],["Choice","Match throughput, latency, manageability and failure behavior to the application."]],"question":"Why can a more distributed architecture be less suitable for a simple application?","answer":"The coordination, operations and failure-handling costs may exceed the flexibility or scaling benefit required.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/2a4ca8c9aed47835.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Match throughput, latency, manageability and failure behavior to the application.","full":"<p><b>Multi-tier.<\/b> Separates responsibilities so capacity can be managed by tier.<\/p><p><b>Distributed components.<\/b> Flexible placement and integration, with greater coordination complexity.<\/p><p><b>Peer-to-peer.<\/b> Uses distributed resources but complicates control and trust.<\/p><p><b>Choice.<\/b> Match throughput, latency, manageability and failure behavior to the application.<\/p>","sourceStart":29},{"id":"X07","title":"Thin and fat clients allocate work differently","fig":"ch17_thinfat","sourceRange":"29–52","bullets":[["Thin client","Mostly presents information; server performs the remaining work."],["Fat client","Performs some application processing locally."],["Trade-off","Server/network load versus client deployment and maintenance."],["In practice","The source notes hybrid browser/app behavior; the boundary is not absolute."]],"question":"Which constraint favors local processing with cached data?","answer":"Unreliable connectivity can favor it, but synchronization, data freshness and conflict behavior must be designed.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/9298699049050726.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"The source notes hybrid browser/app behavior; the boundary is not absolute.","full":"<p><b>Thin client.<\/b> Mostly presents information; server performs the remaining work.<\/p><p><b>Fat client.<\/b> Performs some application processing locally.<\/p><p><b>Trade-off.<\/b> Server/network load versus client deployment and maintenance.<\/p><p><b>In practice.<\/b> The source notes hybrid browser/app behavior; the boundary is not absolute.<\/p>","sourceStart":29},{"id":"X09","title":"SaaS changes ownership and delivery","fig":"ch17_saas","sourceRange":"53–60","bullets":[["Delivery","Provider-hosted application accessed over a network."],["Management","The provider owns deployment, operation and evolution."],["Configuration","Customers adapt permitted features rather than own every implementation choice."],["Dependency","Service level, integration, data access and provider changes affect users."]],"question":"Why does subscribing to SaaS not remove engineering work?","answer":"Configuration, integration, access control, service assumptions, data handling and change impacts still require design and verification.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/25511b06c754d815.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Service level, integration, data access and provider changes affect users.","full":"<p><b>Delivery.<\/b> Provider-hosted application accessed over a network.<\/p><p><b>Management.<\/b> The provider owns deployment, operation and evolution.<\/p><p><b>Configuration.<\/b> Customers adapt permitted features rather than own every implementation choice.<\/p><p><b>Dependency.<\/b> Service level, integration, data access and provider changes affect users.<\/p>","sourceStart":53},{"id":"X10","title":"Multi-tenancy, scaling and service architecture","fig":"ch17_multitenant","sourceRange":"61–66","bullets":[["Multi-tenancy","Share an application while keeping customer configurations and data appropriately separated."],["Scaling","Plan load distribution, replication and shared-state constraints."],["SaaS / SOA","A delivery model and an architectural approach are not synonyms."],["Assurance","Test tenant separation and changed service conditions."]],"question":"Can a SaaS product be built with a service-oriented architecture?","answer":"Yes. SaaS describes how the application is supplied; SOA describes one possible internal organization. Neither label proves tenant isolation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/31c786b1d6045a6f.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Test tenant separation and changed service conditions.","full":"<p><b>Multi-tenancy.<\/b> Share an application while keeping customer configurations and data appropriately separated.<\/p><p><b>Scaling.<\/b> Plan load distribution, replication and shared-state constraints.<\/p><p><b>SaaS / SOA.<\/b> A delivery model and an architectural approach are not synonyms.<\/p><p><b>Assurance.<\/b> Test tenant separation and changed service conditions.<\/p>","sourceStart":61},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"A later trace shows that the original operation committed before its response was lost.","bullets":[["Reassess","Explain the effect of the changed constraint."],["Evidence","Name the observation that would defeat the revised claim."],["Ownership","State who reviews and accepts the bounded scope."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed as
