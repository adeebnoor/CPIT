</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261003-assess-v1"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 17</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch17-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":17,"title":"Distributed Software Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch17-Distributed-SE.html","assignment":8,"points":5,"objectives":["Explain distributed-system design issues.","Compare RPC and message-based interaction.","Distinguish layers and tiers.","Choose among the five source architectural patterns.","Explain SaaS configuration, multi-tenancy and scaling."],"sections":["17.1 Distributed systems","17.2 Client–server computing","17.3 Architectural patterns","17.4 Software as a service"],"case":{"headline":"The request executes. Its response disappears.","text":"A fictional distributed service accepts a user operation. The caller times out without a response. The provided trace does not yet show whether execution or its durable effect completed.","question":"What may happen on retry, and what evidence resolves the uncertainty?","mutation":"A later trace shows that the original operation committed before its response was lost. The client’s retry also called the AI service again: it drafted a different message, and both were sent.","lens":"The operation also calls a hosted AI service that drafts and sends a confirmation message to the user. Hold that question: after the SaaS slides, one slide compares retrying that call with and without protection."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Distributed Software Engineering","phase":"START","takeaway":"Distributed Software Engineering","full":"<p>Distributed Software Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Distribution changes the engineering problem","fig":null,"sourceRange":"3–7","bullets":[["Resource sharing","Several computers contribute services and resources."],["Concurrency","Processes execute independently and communicate."],["Potential benefits","Openness, scaling and tolerance of some failures."],["Cost","Latency, partial failure and separately managed nodes increase complexity."]],"question":"Why can an apparently local app still be a distributed system?","answer":"It can depend on remote storage, updates or services. Its useful operation then depends on network and remote-system behavior.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Distributed systems gain sharing, scale and fault tolerance, but lose central control.","full":"<p>Most computer-based systems are now distributed. Even an apparently self-contained application often relies on remote cloud systems for updates, storage and other services. Tanenbaum and Van Steen define a distributed system as “a collection of independent computers that appears to the user as a single coherent system.” Coulouris and colleagues list five benefits: <b>resource sharing<\/b> of hardware and software; <b>openness<\/b>, through standard protocols that let equipment and software from different vendors work together; <b>concurrency<\/b>, with processes running at the same time on separate computers; <b>scalability<\/b>, by adding resources to meet demand—although the network may limit it; and <b>fault tolerance<\/b>, because replication lets the system survive some failures and offer a degraded service.<\/p><p>The price is complexity. There is no single authority in charge of the whole system: nodes are often independent systems managed by their owners, and the network is a separately managed system too. Performance depends on network bandwidth and load and on the speed of other computers, so response times can vary widely from one request to the next. Distributed systems are therefore harder to design, implement and test, and their emergent properties are harder to predict.<\/p>","sourceStart":3,"notes":"Ask for a phone app that seems local but is distributed. Then ask what the user sees when a remote part is slow or down—this sets up the timeout in our case."},{"id":"X02","title":"Six design issues recur","fig":null,"sourceRange":"8–14","bullets":[["Transparency / openness","Decide what distribution to expose and which interfaces to standardize."],["Scalability / QoS","State capacity, response and throughput needs."],["Security","Reconcile protection across independently managed parts."],["Failure management","Detect, contain and recover from partial failures."]],"question":"When is hiding distribution from users misleading?","answer":"When a remote delay or uncertain outcome affects what they should do next. Exposing pending or unavailable states can be necessary for correct interaction.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Transparency, openness, scalability, security, QoS and failure management shape every design.","full":"<p>The chapter names six design issues. <b>Transparency<\/b>: how far should the system appear to be one system? Complete transparency is impossible, because nodes are independently managed and network delays are unavoidable, so it may be better to expose distribution and let users prepare for delays and failures. <b>Openness<\/b>: should the design use standard protocols? Openness is taken for granted at the network level but not at the component level; CORBA never achieved wide adoption, and many service developers chose RESTful protocols over heavier web-service standards. <b>Scalability<\/b>: can capacity grow with demand? <b>Security<\/b>: can usable security policies be applied across systems owned by different organizations? A distributed system must defend against interception, interruption (including denial of service), modification and fabrication.<\/p><p><b>Quality of service<\/b>: can the system respond dependably, with acceptable response time and throughput? Designing for peak load may not be cost-effective—although cloud servers can now be added on demand—and QoS parameters can conflict, since more input checking can mean less throughput. <b>Failure management<\/b>: how are failures detected, contained so they affect other components as little as possible, and repaired? Leslie Lamport’s flippant definition makes the point: “You know that you have a distributed system when the crash of a system that you’ve never heard of stops you getting any work done.”<\/p>","sourceStart":8,"notes":"Ask which issue the lost response belongs to. Failure management is the obvious answer; transparency is the better follow-up—should the user see that the outcome is uncertain?"},{"id":"SCALE","title":"Scaling has three dimensions","fig":null,"sourceRange":"8–14","bullets":[["Size","Add capacity to serve more demand."],["Distribution","Account for geographic distance and network delay."],["Manageability","Keep independently located parts governable and maintainable."],["Up / out","Stronger resources / more resources; scaling out needs useful parallel work."]],"question":"Will adding web servers necessarily fix a serialized database bottleneck?","answer":"No. The constrained resource and available concurrency determine whether extra servers improve the required service.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Scale in size, distribution and manageability; scaling out helps only if work runs in parallel.","full":"<p>Scalability is a system’s ability to deliver a high-quality service as demands on it increase. It has three dimensions. <b>Size<\/b>: it should be possible to add resources to cope with more users, ideally automatically. <b>Distribution<\/b>: it should be possible to disperse components geographically without degrading performance. <b>Manageability<\/b>: it should be possible to manage the system as it grows, even when parts are located in independent organizations. Manageability is one of the hardest challenges, because managers must agree on management policies, and in practice it often limits how far a system can scale.<\/p><p>Changing size means <b>scaling up<\/b>—replacing resources with more powerful ones, such as increasing a server’s memory from 16 GB to 64 GB—or <b>scaling out<\/b>—adding more resources, such as an extra web server alongside an existing one. Scaling out is often more cost-effective, especially now that cloud computing makes adding and removing servers easy. But it improves performance only when concurrent processing is possible: if every request waits for one serialized resource, extra servers add little.<\/p>","sourceStart":8,"notes":"Ask the slide’s question before revealing the answer: will more web servers fix a serialized database? Students who say yes have skipped the concurrency condition."},{"id":"X02A","title":"A timeout does not describe the remote outcome","fig":null,"sourceRange":"8–14","bullets":[["Partial failure","One part can fail while other parts continue."],["Detect","Use observed symptoms and specified failure criteria."],["Contain / recover","Bound the effect and maintain useful service where possible."],["Uncertainty","A lost response may follow successful execution."]],"question":"What remains unknown after a response is lost?","answer":"The caller may not know whether the operation executed or committed. This course example applies the source’s failure-management principle.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A timeout means no reply arrived in time; the operation may still have completed.","full":"<p>This slide applies the chapter’s failure-management issue to a single remote request. In a distributed system, one part can fail while others continue: a partial failure. When a caller sends a request and no response arrives in time, several different histories fit the same observation. The request may have been lost before it reached the server; the server may have failed during execution; or the operation may have completed—and even committed its effect—before the response was lost on the way back.<\/p><p>The caller therefore cannot conclude that nothing happened. Failure management calls for mechanisms that <b>detect<\/b> failure from observed symptoms, <b>contain<\/b> it so other components are affected as little as possible, and <b>recover<\/b>, continuing to deliver as many services as possible. For an uncertain outcome, recovery needs evidence about the remote state—an operation identifier, a status query or a durable record—before any retry. The case is fictional; the reasoning is the chapter’s failure-management principle applied to it.<\/p>","sourceStart":8,"notes":"Draw the three histories on the board: lost request, crash during execution, lost response. Ask which evidence distinguishes them. Only the server’s record can."},{"id":"X03","title":"RPC and messages make different interaction assumptions","fig":null,"sourceRange":"15–18","bullets":[["RPC","A caller requests a known remote operation and awaits a result."],["Stub / middleware","Translate and carry parameters and results."],["Messages","A sender describes work for delivery through middleware."],["Queueing","Can tolerate temporary receiver unavailability; delivery semantics still matter."]],"question":"Does queueing automatically prevent duplicate effects?","answer":"No. A queue changes interaction and availability assumptions; duplicate handling and operation semantics must still be specified.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"RPC needs both sides available at once; a message can wait in a queue for its receiver.","full":"<p>Two fundamental kinds of interaction take place between computers in a distributed system. In <b>procedural interaction<\/b>, one computer calls a known service offered by another and waits for it to be delivered. In <b>message-based interaction<\/b>, the sender defines what is required in a message and sends it to another computer; a message usually carries more information than one procedure call. The chapter’s restaurant analogy: ordering from a waiter is a series of synchronous, procedural exchanges, while the waiter’s complete order to the kitchen is one message.<\/p><p>Procedural interaction is usually implemented with <b>remote procedure calls<\/b> (RPCs): a component with a globally unique name is called as if it were local. A <b>stub<\/b> on the caller’s computer defines the remote interface and translates the parameters into a standard representation; middleware carries the request and returns the result. With RPC, the caller and callee must both be available and must know how to refer to each other. With messages, unavailability can be tolerated: a message waits in a queue until the receiver is back online, and sender and receiver need not know each other’s names. Neither model, by itself, decides what happens when the same request arrives twice.<\/p>","sourceStart":15,"notes":"Ask whether a queue would have saved our case. It changes availability, not duplicates: a redelivered message can still take effect twice unless the receiver recognizes it."},{"id":"CHECK1","title":"Checkpoint · keep uncertainty visible","fig":null,"sourceRange":"3–18","bullets":[["Think","A request is accepted, but its response is lost."],["Pair","Distinguish a failed request from an unknown outcome."],["Record","Write the claim and the evidence needed before retrying."]],"question":"Why is “the server did nothing” not justified by a client timeout?","answer":"The execution may have completed before the response was lost. The caller needs an appropriate status or operation-identity mechanism.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"A timeout is not evidence of failure: record what is unknown before you retry.","full":"<p>After a lost response, the defensible claim is narrow: “the client did not receive a response in time.” It is not “the server did nothing.” Before retrying, the caller needs evidence about the remote outcome—for example, a status query using an operation identifier, or a durable server record showing whether the operation committed. A good card separates the observation (no reply), the unknown (whether the effect happened) and the evidence that would settle it.<\/p>","sourceStart":3,"notes":"Collect two or three cards and read the claims aloud. Challenge any claim that goes beyond the observation, and ask what evidence would settle the unknown."},{"id":"X04","title":"Middleware mediates heterogeneity","fig":"ch17_middleware","sourceRange":"19–22","bullets":[["Interaction support","Coordinate calls/messages and representation conversion."],["Common services","Examples include naming, security and transactions."],["Transparency","Map logical requests to physical resources."],["Boundary","Shared middleware is itself a dependency, not magic fault removal."]],"question":"What must two components agree on even when middleware converts data types?","answer":"The meaning of values, operations, errors and state changes. Representation conversion does not establish semantic compatibility.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/317be56625de18e7.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Middleware handles interaction and common services; it cannot agree what the data means.","full":"<p>Components in a distributed system may be written in different programming languages and run on different types of processor, with different data models, information representations and communication protocols. <b>Middleware<\/b> is the software that sits between them and lets them communicate and exchange data. It is a layer between the operating system and application programs, usually implemented as libraries installed on each computer plus a runtime system that manages communications. It is general-purpose software, normally bought off the shelf: examples include database communication managers, transaction managers, data converters and communication controllers.<\/p><p>Middleware provides two kinds of support. <b>Interaction support<\/b> coordinates interactions between components: it provides location transparency, so components need not know each other’s physical locations, and it may convert parameters between languages, detect events and manage communication. <b>Common services<\/b> are reusable implementations of services that many components need, such as authentication and authorization, notification and naming, and transaction management. Middleware converts representations; the components must still agree on what values, operations and errors mean.<\/p>","sourceStart":19,"notes":"Ask what middleware could and could not do about our lost response. It can retry delivery and report failure; it cannot know whether the application’s effect already happened."},{"id":"X05","title":"Client–server roles, layers and tiers","fig":null,"sourceRange":"23–28","bullets":[["Client","Requests services and presents results."],["Server","Provides services to clients."],["Presentation","User interaction and display."],["Data handling","Manage client data, validation and generated presentation."]],"question":"(1) Can client and server processes run on the same computer? (2) Why is a four-layer design not automatically a four-tier deployment?","answer":"(1) Yes. The logical interaction model is distinct from deployment across machines. (2) Layers are logical responsibilities. Several layers may share one process or computer; tiers describe deployment boundaries.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Layers are logical responsibilities; tiers are deployment boundaries.","full":"<p>Distributed systems accessed over the Internet are organized as client–server systems. The user interacts with a program on their local computer, such as a web browser or mobile app, which interacts with a program on a remote computer, such as a web server. The client–server model is also a logical interaction model: client and server can run on the same computer. Clients must know which servers are available but need know nothing about other clients. Several client processes normally run on one processor, and one server may run as several instances on different machines, with load-balancing software sharing the requests between them.<\/p><p>Client–server systems depend on separating the presentation of information from the computations that create and process it, so their architecture is structured into four logical layers with clear interfaces: a <b>presentation<\/b> layer that displays information and manages user interaction; a <b>data-handling<\/b> layer that manages the data passed to and from the client, checks it and generates web pages; an <b>application processing<\/b> layer that implements the application logic; and a <b>database<\/b> layer that stores data and provides transaction management and query services. Each layer can be placed on a different computer, and the architectural patterns that follow differ in how they map these layers onto tiers.<\/p>","sourceStart":23,"notes":"Ask which layer should own the retry decision in our case and which should show the user that the outcome is pending. Students usually put everything in the presentation layer.","figure":"assets/v3/94ee2b0be0e93e22.jpg","caption":"Sommerville Ch.17 · preserved source illustration"},{"id":"X06","title":"Five architectural patterns—not one universal answer","fig":"ch17_masterslave","sourceRange":"29–52","bullets":[["Coordination","Master–slave assigns specialized work under a coordinating process."],["Client–server","Two-tier or multi-tier distributes presentation, logic and data."],["Distributed components","Interacting service-providing components use middleware."],["Peer-to-peer","Nodes can provide and consume resources; discovery may use superpeers."]],"question":"Which pattern suits independent processing jobs coordinated by one scheduler?","answer":"The source’s master–slave pattern is a candidate. Its coordination, deadline and failure assumptions still need assessment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1c615d574ed7c84a.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Choose a distributed architecture by the non-functional requirements that matter most.","full":"<p>Designers of distributed systems must balance performance, dependability, security and manageability, and no universal model of system organization suits every circumstance. The chapter describes five architectural styles and the situations each suits:<\/p><ul><li><b>Master–slave<\/b>—real-time systems that need guaranteed response times. The master handles computation, coordination and communications and controls slave processes dedicated to specific actions, such as acquiring data from sensors. In the traffic management example, a control room process polls a sensor process and sends commands to a traffic light control process.<\/li><li><b>Two-tier client–server<\/b>—simple client–server systems, or systems that must be centralized for security reasons.<\/li><li><b>Multi-tier client–server<\/b>—a high volume of transactions to process.<\/li><li><b>Distributed component<\/b>—combining resources from different systems and databases, or implementing a multi-tier system.<\/li><li><b>Peer-to-peer<\/b>—clients exchange locally stored information and a server only introduces them to each other, or many independent computations must be made. In a semicentralized form, a superpeer helps peers find each other or coordinates results.<\/li><\/ul>","sourceStart":29,"notes":"Give each pair one pattern and ask where a lost response would hurt most. The master–slave traffic example is a useful contrast: the master can simply poll again, because reading sensor data twice does no harm."},{"id":"CHECK2","title":"Checkpoint · place the failure responsibility","fig":null,"sourceRange":"19–52","bullets":[["Think","Compare a central service with distributed participating components."],["Pair","Name a bottleneck, a failure boundary and an observable recovery check."],["Record","Add the architecture and its limits to the same card."]],"question":"Which diagram annotation matters more than adding another box?","answer":"The request/effect boundary, who detects failure, what is retried and how uncertain or duplicate outcomes are reconciled.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"An architecture diagram should show who detects failure and who decides what is retried.","full":"<p>A central service makes it easy to keep one authoritative record of each operation, but it can become a bottleneck and a single point of failure. Distributed components spread the load, and they spread the responsibility too: a failure can be detected by one component and repaired by another. A good card names one bottleneck, one failure boundary—where a request passes from one owner to another—and an observable recovery check, such as a status query that shows whether an operation committed. It also states the architecture’s limit: what it cannot tell the caller after a timeout.<\/p>","sourceStart":19,"notes":"Ask each pair to mark on their diagram where the effect is committed and where the response can be lost. The gap between those two points is where the design needs evidence."},{"id":"B01","title":"Architecture selection follows the required qualities","fig":"ch17_distcomp","sourceRange":"29–52","bullets":[["Multi-tier","Separates responsibilities so capacity can be managed by tier."],["Distributed components","Flexible placement and integration, with greater coordination complexity."],["Peer-to-peer","Uses distributed resources but complicates control and trust."],["Choice","Match throughput, latency, manageability and failure behavior to the application."]],"question":"Why can a more distributed architecture be less suitable for a simple application?","answer":"The coordination, operations and failure-handling costs may exceed the flexibility or scaling benefit required.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/2a4ca8c9aed47835.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Each pattern trades a quality—scalability, flexibility, capacity—against complexity and control.","full":"<p>The chapter’s trade-offs make the choice concrete. <b>Multi-tier client–server<\/b> architectures run presentation, data handling, application processing and the database as separate processes that may run on different processors. Tiers can be managed independently, and servers can be added as the load increases, as in the three-tier Internet banking example. <b>Distributed component<\/b> architectures organize the system as interacting components that call each other through middleware. They let designers delay decisions about where services run, are open to new resources, are flexible and scalable, and can be reconfigured dynamically; in the data-mining example, a new database is added by adding a component. But they are more complex to design than client–server systems, and there are no universal standards for their middleware.<\/p><p><b>Peer-to-peer<\/b> architectures use capacity across a network and avoid a central processing bottleneck. A fully decentralized network is redundant and fault-tolerant, at the cost of repeated searches and communication overhead. Security concerns are the main reason they are rarely used in business: without central management, malicious nodes can deliver spam and malware. A more distributed architecture is justified only when the application needs what it buys.<\/p>","sourceStart":29,"notes":"Ask when a simple two-tier design is the better choice. Push for a requirement-based answer: modest load, one owner, and a need to centralize for security."},{"id":"X07","title":"Thin and fat clients allocate work differently","fig":"ch17_thinfat","sourceRange":"29–52","bullets":[["Thin client","Mostly presents information; server performs the remaining work."],["Fat client","Performs some application processing locally."],["Trade-off","Server/network load versus client deployment and maintenance."],["In practice","The source notes hybrid browser/app behavior; the boundary is not absolute."]],"question":"Which constraint favors local processing with cached data?","answer":"Unreliable connectivity can favor it, but synchronization, data freshness and conflict behavior must be designed.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/9298699049050726.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Thin clients load the server and network; fat clients make client management harder.","full":"<p>A two-tier client–server architecture has one logical server and any number of clients, in two forms. In the <b>thin-client<\/b> model, only the presentation layer runs on the client—usually a web browser—and data handling, application processing and the database run on the server. Clients are simple to manage, because there may be no software to install, but the server and network carry a heavy processing load. In the <b>fat-client<\/b> model, some or all application processing runs on the client, and the server manages data and the database. This uses the client’s processing power, but management is harder: new versions must be installed on every client.<\/p><p>The chapter’s ATM network is a fat-client example: the ATMs do much of the customer processing, and a teleprocessing monitor serializes transactions for the account database, so transactions do not interfere and the system can recover without corrupting data. The distinction has become blurred. JavaScript runs local processing in browsers, mobile apps process locally to reduce network traffic, and automatic updates ease the management problem; few web applications now do all their processing on the server. Fat clients also suit mobile applications where connectivity cannot be guaranteed, because they can work with cached data.<\/p>","sourceStart":29,"notes":"Ask which model our client resembles and where it should record that an operation is pending. A fat client can keep a local record of pending operations; a thin client depends on the server for it."},{"id":"X09","title":"SaaS changes ownership and delivery","fig":"ch17_saas","sourceRange":"53–60","bullets":[["Delivery","Provider-hosted application accessed over a network."],["Management","The provider owns deployment, operation and evolution."],["Configuration","Customers adapt permitted features rather than own every implementation choice."],["Dependency","Service level, integration, data access and provider changes affect users."]],"question":"Why does subscribing to SaaS not remove engineering work?","answer":"Configuration, integration, access control, service assumptions, data handling and change impacts still require design and verification.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/25511b06c754d815.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"With SaaS, the provider runs and changes the software; customers depend on its decisions.","full":"<p>Software as a service (SaaS) hosts software remotely and provides access to it over the Internet. Its key elements: the software is deployed on a server, or more commonly in the cloud, and accessed through a web browser rather than installed on a local PC; it is owned and managed by a provider rather than by the organizations that use it; and users pay by use or by subscription—or, for free services, accept advertisements. Cloud computing has accelerated SaaS because the number of servers can change quickly to match demand.<\/p><p>For purchasers, the costs of managing software move to the provider, which fixes bugs, installs upgrades, handles platform changes and ensures capacity; there are no licences to manage, and the software can be reached from anywhere. The main problems are data transfer at network speed (and possibly its cost), lack of control over software evolution—the provider may change the software when it wishes—and laws in many countries on how data is stored, managed and accessed. Service construction is usually driven by the provider’s assumptions about what users need, so agile, incremental development suits it well.<\/p>","sourceStart":53,"notes":"Ask what the organization still owns when it subscribes: its configuration, its data, its access control, and the check that a provider change has not broken its workflow."},{"id":"X10","title":"Multi-tenancy, scaling and service architecture","fig":"ch17_multitenant","sourceRange":"61–66","bullets":[["Multi-tenancy","Share an application while keeping customer configurations and data appropriately separated."],["Scaling","Plan load distribution, replication and shared-state constraints."],["SaaS / SOA","A delivery model and an architectural approach are not synonyms."],["Assurance","Test tenant separation and changed service conditions."]],"question":"Can a SaaS product be built with a service-oriented architecture?","answer":"Yes. SaaS describes how the application is supplied; SOA describes one possible internal organization. Neither label proves tenant isolation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/31c786b1d6045a6f.jpg","caption":"Sommerville Ch.17 · preserved source illustration","takeaway":"Multi-tenancy shares one system, but each customer must see only its own data and settings.","full":"<p>A business SaaS product usually starts from a generic service tailored to each customer, which raises three questions: configurability, multi-tenancy and scalability. Product-line configuration would mean deploying a separate copy for each organization, so SaaS builds configurability into the system instead. Customer profiles can set <b>branding<\/b>, <b>business rules and workflows<\/b>, <b>database extensions<\/b> to the generic data model, and <b>access control<\/b> for each customer’s staff.<\/p><p><b>Multi-tenancy<\/b> lets many users share the same system efficiently while each appears to have sole use of it. It requires an absolute separation between system functionality and system data: operations are stateless so they can be shared, and data comes from the client or from storage that any instance can reach. A provider may give each customer its own database, or use one database in which each entry carries a <b>tenant identifier<\/b>, with database views presenting each customer’s entries as a virtual personal database. For <b>scalability<\/b>, SaaS scales out. The chapter’s guidelines: implement components as simple stateless services that can run on any server; use asynchronous interaction; manage resources such as connections as pools; design the database for fine-grain locking; and consider a cloud platform that scales out automatically. SaaS is a delivery model and SOA an implementation approach: SaaS keeps session state and long transactions, while SOA uses separate, stateless services with short transactions.<\/p>","sourceStart":61,"notes":"Ask how a test would show that one tenant cannot see another’s data. The tenant identifier is the mechanism; a test with two tenants and their views is the evidence."},{"id":"AISYS","phase":"LEARN","skin":"genai","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source concepts to an AI component","sourceStart":1,"banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · BEFORE AND AFTER","caption":"Ask a model the same question twice and you may get two answers. Send both, and you have a distributed-systems bug."},"title":"Before and after: retrying a call to an AI service","takeaway":"A retry is a new request—and an AI service may answer it differently.","approaches":[{"label":"BEFORE","title":"Retry without a key","nodes":["Timeout","Retry","AI drafts message B","A and B both sent"],"text":"Duplicate, inconsistent effects."},{"label":"AFTER","title":"Retry with an idempotency key","nodes":["Timeout","Retry with same key","Stored result A returned","One message sent"],"text":"One effect, even with a non-deterministic model."}],"bullets":[["Name the effect","Which step acts outside the service?"],["Store the result","Who remembers the first answer for this key?"],["Bound the wait","What if the AI service never replies?"]],"question":"Where must the idempotency key be checked, and why does calling the AI service again not help?","answer":"Before any external effect: the service records the key with the committed operation and its outcome, and a retry with the same key returns that stored outcome instead of executing again. Calling the AI service again cannot confirm what happened the first time—it is a new request, and a non-deterministic model may produce a different draft, so repeating it creates a second, different effect. Time out the AI call with a defined action, and never let model output trigger an effect that has not been recorded against the key.","full":"<p>This slide is course-added. It compares two ways of retrying an operation whose effects include a call to a hosted AI service.<\/p><h3>How the slide uses the five objectives<\/h3><p>Design issues: partial failure and latency now include a slow, costly external model call. RPC versus messages: long AI calls often suit asynchronous messaging, but delivery semantics still decide duplicates. Layers and tiers: the AI service is an external tier with its own availability. Patterns: a pool of workers calling a model is a master–slave style arrangement with the same failure questions. SaaS: a hosted AI service is SaaS—its provider can change behaviour, pricing and data retention.<\/p><p><b>Idempotency key.<\/b> A unique identifier sent with a request so that the server can recognise a repeat and return the recorded result instead of executing again. It turns ‘at least once’ delivery into one effect.<\/p><p><b>Non-determinism.<\/b> A model may return different outputs for the same input, depending on sampling settings and on the provider’s infrastructure and versions. A repeated call is therefore not a replay.<\/p><p><b>Record before you act.<\/b> Store the model’s output with the operation before any message is sent, so that recovery and retries reuse the stored output.<\/p><p class=\"small\">The case is course-created.<\/p>","notes":"Allow about 6 minutes. Format: before and after. Ask the class to predict what the user receives in each column before revealing the last step. New terms, at most two: idempotency key and non-determinism. Everything else in Full explanation is optional depth and is not assessed."},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"A retry is a new request.","bullets":[["New information","The operation committed; the retry ran again and the AI sent a second, different message."],["Reassess","The timeout hid a completed effect."],["Revise","Require idempotency keys; check them before any external effect."],["Own","Name who fixes it and who tells affected users."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. For the AI step, record the drafted message against the operation’s key and send only that recorded message; a retry must never ask the model again for an effect that already happened.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>A later trace shows that the original operation committed before its response was lost.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Accept revisions that record each operation against an idempotency key before any external effect and send only the recorded AI message. Ask who contacts the users who received two different messages."},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What may happen on retry, and what evidence resolves the uncertainty? If the retry calls the AI service again, what could the user receive?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the given facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. Calling the AI service again is a new request, not a check on the first one; a non-deterministic model may draft a different message, producing a second, different effect.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, a blind retry after timeout, or a retry carrying an idempotency key checked before any external effect.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. An idempotency key lets the service return the recorded outcome instead of executing again, which also stops a second, different AI-drafted message.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"A later trace shows that the original operation committed before its response was lost. The client’s retry also called the AI service again: it drafted a different message, and both were sent.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The timeout hid a committed operation, and the retry turned one effect into two different ones; the key must be checked before the AI call and before sending.","note":"Classroom version only: the assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["B01"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["B01","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Distributed architectural patterns","range":"29–34"},{"title":"SaaS and service delivery","range":"53–58"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Characteristics and design issues","start":3,"end":14,"units":["X01","X02","SCALE","X02A","CHECK1"]},{"title":"Interaction models and middleware","start":15,"end":22,"units":["X03","CHECK1","X04","CHECK2"]},{"title":"Client-server and layering","start":23,"end":28,"units":["X05","CHECK2"]},{"title":"Architectural patterns","start":29,"end":52,"units":["X06","CHECK2","B01","X07"]},{"title":"SaaS, SOA and multi-tenancy","start":53,"end":66,"units":["X09","X10"]}],"sourceCount":66,"original":"sources/Ch17-Original.pptx","textbook":"sources/Ch17-Textbook.pdf","bookPages":30,"quiz":[{"q":"A client times out waiting for a remote operation. What does the client know?","options":["The operation did not execute on the server","The operation executed, but its response was lost","Only that no response arrived in time; the outcome is unknown"],"answer":2,"why":"Execution and response delivery can fail independently, so a timeout alone does not show whether the operation took effect."},{"q":"What is an advantage of message-based interaction over remote procedure calls?","options":["If the receiver is unavailable, the message waits in a queue","Each message is guaranteed to take effect exactly once","Sender and receiver must know each other’s names"],"answer":0,"why":"With RPC, both parties must be available; with messages, middleware queues the message until the receiver returns. Duplicates still have to be handled."},{"q":"How do layers differ from tiers in a client–server system?","options":["Layers are physical computers; tiers are logical responsibilities","Layers are logical responsibilities; tiers are where they are deployed","Layers and tiers are two names for the same thing"],"answer":1,"why":"Several layers can run in one process or on one computer; a multi-tier architecture runs layers as separate processes that may be on different processors."},{"q":"A real-time traffic system has a control process that polls separate sensor and light-control processes. Which pattern is this?","options":["Peer-to-peer architecture","Two-tier client–server architecture","Master–slave architecture"],"answer":2,"why":"In the chapter’s traffic management example, the master coordinates and communicates, while slave processes acquire data or control equipment."},{"q":"How is SaaS related to service-oriented architecture (SOA)?","options":["SaaS is a delivery model; SOA is one way to build the software","SaaS and SOA are two names for the same architecture","A SaaS product must be built from stateless SOA services"],"answer":0,"why":"SaaS describes how functionality reaches users; SOA structures a system as stateless services. A SaaS product may be built from components instead."}],"alignment":[{"objective":"Explain distributed-system design issues.","evidence":"Explain and demonstrate: Explain distributed-system design issues.","field":"FIT"},{"objective":"Compare RPC and message-based interaction.","evidence":"Explain and demonstrate: Compare RPC and message-based interaction.","field":"transfer question + interaction trace"},{"objective":"Distinguish layers and tiers.","evidence":"Explain and demonstrate: Distinguish layers and tiers.","field":"source application + architecture"},{"objective":"Choose among the five source architectural patterns.","evidence":"Explain and demonstrate: Choose among the five source architectural patterns.","field":"FAILURE + lab record"},{"objective":"Explain SaaS configuration, multi-tenancy and scaling.","evidence":"Explain and demonstrate: Explain SaaS configuration, multi-tenancy and scaling.","field":"transfer question + BOUND + REFIT"}],"artifact":"Build a distributed interaction trace, architecture choice and failure/recovery test.","bridge":"Build a distributed interaction trace, architecture choice and failure/recovery test. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"B01","workload":"Consider on-call investigation when a timeout leaves an uncertain effect and retries multiply work.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","R09":"X05"},"roadmap":{"question":"How should a distributed system behave when a reply is lost?","connection":"Network constraints shape communication; layers allocate work; architecture patterns organize it; SaaS changes delivery and responsibility.","inClass":"Trace a remote interaction and compare architectural choices.","deliverable":"A lost-response trace and deduplication test log.","success":"Distinguish no reply from no execution; explain retry assumptions.","branches":[{"verb":"Identify distributed constraints","label":"Distributed systems","detail":"Six design issues · scaling · failure management","target":"X01","units":["X01","X02","SCALE","X02A"],"caseLens":"What does a timeout tell us—and what does it not tell us—about remote execution?"},{"verb":"Connect independent participants","label":"Interaction and middleware","detail":"RPC / messages · heterogeneous systems","target":"X03","units":["X03","CHECK1","X04"],"caseLens":"How should procedural or message interaction handle a lost response?"},{"verb":"Allocate the work","label":"Client–server computing","detail":"Client/server roles · layers vs tiers","target":"X05","units":["X05","X07"],"caseLens":"Which client/server layer owns retry, state, and user feedback?"},{"verb":"Choose a structure","label":"Architectural patterns","detail":"Five source patterns · quality trade-offs","target":"X06","units":["X06","CHECK2","B01"],"caseLens":"Which distributed architecture best contains duplicate or uncertain operations?"},{"verb":"Deliver remotely","label":"Software as a service","detail":"Configuration · multi-tenancy · scaling","target":"X09","units":["X09","X10","AISYS","APPLY"],"caseLens":"How do remote ownership and service delivery affect evidence for retries and commits?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"One timeout. One retry. Two different AI messages to the same customer.","aiAssignment":{"title":"Offline farms and an AI plant-disease service","scenario":"Farmers photograph diseased leaves in a mobile app. The app queues each photo while offline and sends it to a cloud AI service when connectivity returns; the service replies with a diagnosis and a recommended treatment.","facts":["Connectivity in the fields is intermittent.","The queue guarantees at-least-once delivery.","The third-party AI service can take up to 20 seconds to reply."],"question":"What delivery and interaction design makes a diagnosis trustworthy despite lost responses and duplicates?","stress":"After an outage, 1,300 queued photos are delivered twice. For 9% of them the AI service returns two different diagnoses, and the app shows both treatments to the farmer.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023":[["PDC","Parallel and Distributed Computing","Partial failure, delivery semantics and duplicate effects."],["SE-Design","Software Design","Standard architectures, including client–server and service architectures."],["SE-FormalMethods","Formal Methods","Problem areas served by formal methods: asynchronous and distributed systems."],["SE-Validation","Software Verification and Validation","Testing asynchronous and concurrent systems."]]}</script><script src="runtime/source-figures.js?v=20260928-campus-v3"></script><script src="runtime/national-content.js?v=20260928-campus-v3"></script><script src="runtime/story-v3.js?v=20261003-assess-v1"></script><script src="runtime/classroom-v3.js?v=20261003-assess-v1" defer></script></body></html>
