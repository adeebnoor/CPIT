4</td><td><button class=\"lp-btn\" data-jump=\"X01\">Distributed-system characteristics</button> · <button class=\"lp-btn\" data-jump=\"X02\">Six distributed design issues</button> · <button class=\"lp-btn\" data-jump=\"X02A\">Failure management</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Interaction models and middleware</td><td>15–22</td><td><button class=\"lp-btn\" data-jump=\"X03\">Procedural and message-based interaction</button> · <button class=\"lp-btn\" data-jump=\"X04\">Middleware</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Client-server and layering</td><td>23–28</td><td><button class=\"lp-btn\" data-jump=\"X05\">Client-server computing</button> · <button class=\"lp-btn\" data-jump=\"R09\">Logical layers and deployment tiers</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Architectural patterns</td><td>29–52</td><td><button class=\"lp-btn\" data-jump=\"X06\">Five distributed architectural patterns</button> · <button class=\"lp-btn\" data-jump=\"B01\">Architecture choices and failure modes</button> · <button class=\"lp-btn\" data-jump=\"X07\">Thin clients, fat clients and remote interaction</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr><tr><td>SaaS, SOA and multi-tenancy</td><td>53–66</td><td><button class=\"lp-btn\" data-jump=\"X09\">Software as a Service and multi-tenancy</button> · <button class=\"lp-btn\" data-jump=\"X10\">SaaS, SOA and implementation factors</button></td><td><button class=\"lp-btn\" data-jump=\"SRC05\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch17-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 17 – Distributed software engineering</summary><div class=\"lp-source-text\"></div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\nDistributed systems\nClient–server computing\nArchitectural patterns for distributed systems\nSoftware as a service\n</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "Characteristics and design issues", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–14. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch17-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · Distributed systems</summary><div class=\"lp-source-text\">Distributed systems\nVirtually all large computer-based systems are now distributed systems.\n“… a collection of independent computers that appears to the user as a single coherent system.”\nInformation processing is distributed over several computers rather than confined to a single machine.\nDistributed software engineering is therefore very important for enterprise computing systems.</div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · Distributed system characteristics</summary><div class=\"lp-source-text\">Distributed system characteristics\nResource sharing\nSharing of hardware and software resources.\nOpenness\nUse of equipment and software from different vendors.\nConcurrency\nConcurrent processing to enhance performance.\nScalability\nIncreased throughput by adding new resources.\nFault tolerance\nThe ability to continue in operation after a fault has occurred.</div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · Distributed systems</summary><div class=\"lp-source-text\">Distributed systems\n</div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · Distributed systems issues</summary><div class=\"lp-source-text\">Distributed systems issues\nDistributed systems are more complex than systems that run on a single processor.\nComplexity arises because different parts of the system are independently managed as is the network.\nThere is no single authority in charge of the system so top-down control is impossible.</div></details><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · Design issues</summary><div class=\"lp-source-text\">Design issues\nTransparency To what extent should the distributed system appear to the user as a single system? \nOpenness Should a system be designed using standard protocols that support interoperability?\nScalability How can the system be constructed so that it is scaleable? \nSecurity How can usable security policies be defined and implemented?\nQuality of service How should the quality of service  be specified.\nFailure management How can system failures be detected, contained and repaired? </div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · Transparency</summary><div class=\"lp-source-text\">Transparency\nIdeally, users should not be aware that a system is distributed and services should be independent of distribution characteristics.\nIn practice, this is impossible because parts of the system are independently managed and because of network delays.\nOften better to make users aware of distribution so that they can cope with problems\nTo achieve transparency, resources should be abstracted and addressed logically rather than physically. Middleware maps logical to physical resources.</div></details><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · Openness</summary><div class=\"lp-source-text\">Openness\nOpen distributed systems are systems that are built according to generally accepted standards. \nComponents from any supplier can be integrated into the system and can inter-operate with the other system components.\nOpenness implies that system components can be independently developed in any programming language and, if these conform to standards, they will work with other components. \nWeb service standards for service-oriented architectures were developed to be open standards.  \n</div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · Scalability</summary><div class=\"lp-source-text\">Scalability\nThe scalability of a system reflects its ability to deliver a high quality service as demands on the system increase\nSize It should be possible to add more resources to a system to cope with increasing numbers of users.\nDistribution It should be possible to geographically disperse the components of a system without degrading its performance.\nManageability It should be possible to manage a system as it increases in size, even if parts of the system are located in independent organizations.\nThere is a distinction between scaling-up and scaling-out. Scaling up is more powerful system; scaling out is more system instances. </div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · Security</summary><div class=\"lp-source-text\">Security\nWhen a system is distributed, the number of ways that the system may be attacked is significantly increased, compared to centralized systems. \nIf a part of the system is successfully attacked then the attacker may be able to use this as a ‘back door’ into other parts of the system. \nDifficulties in a distributed system arise because different organizations may own parts of the system. These organizations may have mutually incompatible security policies and security mechanisms. </div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Types of attack</summary><div class=\"lp-source-text\">Types of attack\nThe types of attack that a distributed system must defend itself against are:\nInterception, where communications between parts of the system are intercepted by an attacker so that there is a loss of confidentiality.\nInterruption, where system services are attacked and cannot be delivered as expected.\nDenial of service attacks involve bombarding a node with illegitimate service requests so that it cannot deal with valid requests.\nModification, where data or services in the system are changed by an attacker.\nFabrication, where an attacker generates information that should not exist and then uses this to gain some privileges.  \n</div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · Quality of service</summary><div class=\"lp-source-text\">Quality of service\nThe quality of service (QoS) offered by a distributed system reflects the system’s ability to deliver its services dependably and with a response time and throughput that is acceptable to its users. \nQuality of service is particularly critical when the system is dealing with time-critical data such as sound or video streams. \nIn these circumstances, if the quality of service falls below a threshold value then the sound or video may become so degraded that it is impossible to understand. </div></details><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Failure management</summary><div class=\"lp-source-text\">Failure management\nIn a distributed system, it is inevitable that failures will occur, so the system has to be designed to be resilient to these failures. \n\t“You know that you have a distributed system when the crash of a system that you’ve never heard of stops you getting any work done.” \nDistributed systems should include mechanisms for discovering if a component of the system has failed, should continue to deliver as many services as possible in spite of that failure and, as far as possible, automatically recover from the failure. </div></details>"}], "noAnswer": true, "sourceRange": "3–14", "appendix": true}, {"k": "SRC02", "title": "Interaction models and middleware", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 15–22. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch17-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Models of interaction</summary><div class=\"lp-source-text\">Models of interaction\nTwo types of interaction between components in a distributed system\nProcedural interaction, where one computer calls on a known service offered by another computer and waits for a response.\nMessage-based interaction, involves the sending computer sending information about what is required to another computer. There is no necessity to wait for a response.</div></details><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · Procedural interaction between a diner and a waiter </summary><div class=\"lp-source-text\">Procedural interaction between a diner and a waiter </div></details><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · Message-based interaction between a waiter and the kitchen </summary><div class=\"lp-source-text\">Message-based interaction between a waiter and the kitchen \n\n&lt;starter&gt;\n\t&lt;dish name = “soup” type = “tomato” /&gt; \n\t&lt;dish name = “soup” type = “fish” /&gt;\n\t&lt;dish name = “pigeon salad” /&gt;\n&lt;/starter&gt;\n&lt;main course&gt;\n\t&lt;dish name = “steak” type = “sirloin” cooking = “medium” /&gt;\n\t&lt;dish name = “steak” type = “fillet” cooking = “rare” /&gt;\n\t&lt;dish name = “sea bass”&gt;\n&lt;/main&gt;\n&lt;accompaniment&gt;\n\t&lt;dish name = “french fries” portions = “2” /&gt;\n\t&lt;dish name = “salad” portions = “1” /&gt;\n&lt;/accompaniment&gt;\n\n</div></details><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · Remote procedure calls</summary><div class=\"lp-source-text\">Remote procedure calls\nProcedural communication in a distributed system is implemented using remote procedure calls (RPC).\n In a remote procedure call, one component calls another component as if it was a local procedure or method. The middleware in the system intercepts this call and passes it to a remote component. \nThis carries out the required computation and, via the middleware, returns the result to the calling component. \nA problem with RPCs is that the caller and the callee need to be available at the time of the communication, and they must know how to refer to each other. </div></details><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · Message passing</summary><div class=\"lp-source-text\">Message passing\nMessage-based interaction normally involves one component creating a message that details the services required from another component. \nThrough the system middleware, this is sent to the receiving component. \nThe receiver parses the message, carries out the computations and creates a message for the sending component with the required results.  \nIn a message-based approach, it is not necessary for the sender and receiver of the message to be aware of each other. They simple communicate with the middleware.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Middleware</summary><div class=\"lp-source-text\">Middleware\nThe components in a distributed system may be implemented in different programming languages and may execute on completely different types of processor. Models of data, information representation and protocols for communication may all be different. \nMiddleware is software that can manage these diverse parts, and ensure that they can communicate and exchange data. </div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · Middleware in a distributed system </summary><div class=\"lp-source-text\">Middleware in a distributed system </div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · Middleware support</summary><div class=\"lp-source-text\">Middleware support\nInteraction support, where the middleware coordinates interactions between different components in the system\nThe middleware provides location transparency in that it isn’t necessary for components to know the physical locations of other components. \nThe provision of common services, where the middleware provides reusable implementations of services that may be required by several components in the distributed system. \nBy using these common services, components can easily inter-operate and provide user services in a consistent way.\n</div></details>"}], "noAnswer": true, "sourceRange": "15–22", "appendix": true}, {"k": "SRC03", "title": "Client-server and layering", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 23–28. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch17-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · Client-server computing</summary><div class=\"lp-source-text\">Client-server computing\n</div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · Client-server computing</summary><div class=\"lp-source-text\">Client-server computing\nDistributed systems that are accessed over the Internet are normally organized as client-server systems. \nIn a client-server system, the user interacts with a program running on their local computer (e.g. a web browser or mobile application). This interacts with another program running on a remote computer (e.g. a web server). \nThe remote computer provides services, such as access to web pages, which are available to external clients. </div></details><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · Client–server interaction </summary><div class=\"lp-source-text\">Client–server interaction </div></details><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Mapping of clients and servers to networked computers </summary><div class=\"lp-source-text\">Mapping of clients and servers to networked computers </div></details><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · Layered architectural model for client–server applications </summary><div class=\"lp-source-text\">Layered architectural model for client–server applications </div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · Layers in a client/server system</summary><div class=\"lp-source-text\">Layers in a client/server system\nPresentation \nconcerned with presenting information to the user and managing all user interaction.\nData handling \nmanages the data that is passed to and from the client. Implement checks on the data, generate web pages, etc.\nApplication processing layer \nconcerned with implementing the logic of the application and so providing the required functionality to end users.\nDatabase\nStores data and provides transaction management services, etc.  \n</div></details>"}], "noAnswer": true, "sourceRange": "23–28", "appendix": true}, {"k": "SRC04", "title": "Architectural patterns", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 29–52. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch17-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · Architectural patterns for distributed systems</summary><div class=\"lp-source-text\">Architectural patterns for distributed systems</div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · Architectural patterns</summary><div class=\"lp-source-text\">Architectural patterns\nWidely used ways of organizing the architecture of a distributed system:\nMaster-slave architecture, which is used in real-time systems in which guaranteed interaction response times are required.\nTwo-tier client-server architecture, which is used for simple client-server systems, and where the system is centralized for security reasons. \nMulti-tier client-server architecture, which is used when there is a high volume of transactions to be processed by the server.\nDistributed component architecture, which is used when resources from different systems and databases need to be combined, or as an implementation model for multi-tier client-server systems.\nPeer-to-peer architecture, which is used when clients exchange locally stored information and the role of the server is to introduce clients to each other\n</div></details><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · Master-slave architectures</summary><div class=\"lp-source-text\">Master-slave architectures\nMaster-slave architectures are commonly used in real-time systems where there may be separate processors associated with data acquisition from the system’s environment, data processing and computation and actuator management. \nThe ‘master’ process is usually responsible for computation, coordination and communications and it controls the ‘slave’ processes. \n‘Slave’ processes are dedicated to specific actions, such as the acquisition of data from an array of sensors. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · A traffic management system with a master-slave architecture </summary><div class=\"lp-source-text\">A traffic management system with a master-slave architecture </div></details><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · Two-tier client server architectures</summary><div class=\"lp-source-text\">Two-tier client server architectures\nIn a two-tier client-server architecture, the system is implemented as a single logical server plus an indefinite number of clients that use that server. \nThin-client model, where the presentation layer is implemented on the client and all other layers (data management, application processing and database) are implemented on a server. \nFat-client model, where some or all of the application processing is carried out on the client. Data management and database functions are implemented on the server. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · Thin- and fat-client architectural models </summary><div class=\"lp-source-text\">Thin- and fat-client architectural models </div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · Thin client model</summary><div class=\"lp-source-text\">Thin client model\nUsed when legacy systems are migrated to client server architectures. \nThe legacy system acts as a server in its own right with a graphical interface implemented on a client.\nA major disadvantage is that it places a heavy processing load on both the server and the network.</div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · Fat client model</summary><div class=\"lp-source-text\">Fat client model\nMore processing is delegated to the client as the application processing is locally executed.\nMost suitable for new C/S systems where the capabilities of the client system are known in advance.\nMore complex than a thin client model especially for management. New versions of the application have to be installed on all clients.</div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · A fat-client architecture for an ATM system </summary><div class=\"lp-source-text\">A fat-client architecture for an ATM system </div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Thin and fat clients</summary><div class=\"lp-source-text\">Thin and fat clients\nDistinction between thin and fat client architectures has become blurred\nJavascript allows local processing in a browser so ‘fat-client’ functionality available without software installation\nMobile apps carry out some local processing to minimize demands on network\nAuto-update of apps reduces management problems\nThere are now very few thin-client applications with all processing carried out on remote server.</div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · Multi-tier client-server architectures</summary><div class=\"lp-source-text\">Multi-tier client-server architectures\nIn a ‘multi-tier client–server’ architecture, the different layers of the system, namely presentation, data management, application processing, and database, are separate processes that may execute on different processors.\nThis avoids problems with scalability and performance if a thin-client two-tier model is chosen, or problems of system management if a fat-client model is used.  </div></details><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · Three-tier architecture for an Internet banking system </summary><div class=\"lp-source-text\">Three-tier architecture for an Internet banking system </div></details><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · Use of client–server architectural patterns </summary><div class=\"lp-source-text\">Use of client–server architectural patterns </div><div class=\"lp-tablewrap\"><table><tr><td>Architecture</td><td>Applications</td></tr><tr><td>Two-tier client–server architecture with thin clients</td><td>Legacy system applications that are used when separating application processing and data management is impractical. Clients may access these as services, as discussed in Section 18.4.<br>Computationally intensive applications such as compilers with little or no data management.<br>Data-intensive applications (browsing and querying) with nonintensive application processing. Browsing the Web is the most common example of a situation where this architecture is used.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Use of client–server architectural patterns </summary><div class=\"lp-source-text\">Use of client–server architectural patterns </div><div class=\"lp-tablewrap\"><table><tr><td>Architecture</td><td>Applications</td></tr><tr><td>Two-tier client-server architecture with fat clients</td><td>Applications where application processing is provided by off-the-shelf software (e.g., Microsoft Excel) on the client.<br>Applications where computationally intensive processing of data (e.g., data visualization) is required.<br>Mobile applications where internet connectivity cannot be guaranteed. Some local processing using cached information from the database is therefore possible.</td></tr><tr><td>Multi-tier client–server architecture</td><td>Large-scale applications with hundreds or thousands of clients.<br>Applications where both the data and the application are volatile. <br>Applications where data from multiple sources are integrated.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · Distributed component architectures</summary><div class=\"lp-source-text\">Distributed component architectures\nThere is no distinction in a distributed component architecture between clients and servers.\nEach distributable entity is a component that provides services to other components and receives services from other components.\nComponent communication is through a middleware system. </div></details><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · A distributed component architecture </summary><div class=\"lp-source-text\">A distributed component architecture </div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · Benefits of distributed component architecture</summary><div class=\"lp-source-text\">Benefits of distributed component architecture\nIt allows the system designer to delay decisions on where and how services should be provided. \nIt is a very open system architecture that allows new resources to be added as required. \nThe system is flexible and scalable. \nIt is possible to reconfigure the system dynamically with objects migrating across the network as required. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · A distributed component architecture for a data mining system </summary><div class=\"lp-source-text\">A distributed component architecture for a data mining system </div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · Disadvantages of distributed component architecture</summary><div class=\"lp-source-text\">Disadvantages of distributed component architecture\nDistributed component architectures suffer from two major disadvantages:\nThey are more complex to design than client–server systems. Distributed component architectures are difficult for people to visualize and understand. \nStandardized middleware for distributed component systems has never been accepted by the community. Different vendors, such as Microsoft and Sun, have developed different, incompatible middleware. \nAs a result of these problems, service-oriented architectures are replacing distributed component architectures in many situations. </div></details><details class=\"lp-source-section\" id=\"source-slide-48\"><summary>Slide 48 · Peer-to-peer architectures</summary><div class=\"lp-source-text\">Peer-to-peer architectures\nPeer to peer (p2p) systems are decentralised systems where computations may be carried out by any node in the network.\nThe overall system is designed to take advantage of the computational power and storage of a large number of networked computers.\nMost p2p systems have been personal systems but there is increasing business use of this technology.</div></details><details class=\"lp-source-section\" id=\"source-slide-49\"><summary>Slide 49 · Peer-to-peer systems</summary><div class=\"lp-source-text\">Peer-to-peer systems\nFile sharing systems based on the BitTorrent protocol\nMessaging systems such as Jabber\nPayments systems – Bitcoin\nDatabases – Freenet is a decentralized database\nPhone systems – Viber\nComputation systems - SETI@home</div></details><details class=\"lp-source-section\" id=\"source-slide-50\"><summary>Slide 50 · P2p architectural models</summary><div class=\"lp-source-text\">P2p architectural models\nThe logical network architecture\nDecentralised architectures;\nSemi-centralised architectures.\nApplication architecture\nThe generic organisation of components making up a p2p application.\nFocus here on network architectures.</div></details><details class=\"lp-source-section\" id=\"source-slide-51\"><summary>Slide 51 · A decentralized p2p architecture </summary><div class=\"lp-source-text\">A decentralized p2p architecture </div></details><details class=\"lp-source-section\" id=\"source-slide-52\"><summary>Slide 52 · A semicentralized p2p architecture </summary><div class=\"lp-source-text\">A semicentralized p2p architecture </div></details>"}], "noAnswer": true, "sourceRange": "29–52", "appendix": true}, {"k": "SRC05", "title": "SaaS, SOA and multi-tenancy", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 53–66. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch17-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-53\"><summary>Slide 53 · Software as a service</summary><div class=\"lp-source-text\">Software as a service</div></details><details class=\"lp-source-section\" id=\"source-slide-54\"><summary>Slide 54 · Use of p2p architecture</summary><div class=\"lp-source-text\">Use of p2p architecture\nWhen a system is computationally-intensive and it is possible to separate the processing required into a large number of independent computations.\nWhen a system primarily involves the exchange of information between individual computers on a network and there is no need for this information to be centrally-stored or managed. </div></details><details class=\"lp-source-section\" id=\"source-slide-55\"><summary>Slide 55 · Security issues in p2p system</summary><div class=\"lp-source-text\">Security issues in p2p system\nSecurity concerns are the principal reason why p2p architectures are not widely used.\nThe lack of central management means that malicious nodes can be set up to deliver spam and malware to other nodes in the network.\nP2P communications require careful setup to protect local information and if not done correctly, then this is exposed to othe peers.</div></details><details class=\"lp-source-section\" id=\"source-slide-56\"><summary>Slide 56 · Software as a service</summary><div class=\"lp-source-text\">Software as a service\nSoftware as a service (SaaS) involves hosting the software remotely and providing access to it over the Internet. \nSoftware is deployed on a server (or more commonly a number of servers) and is accessed through a web browser. It is not deployed on a local PC.\nThe software is owned and managed by a software provider, rather than the organizations using the software.\nUsers may pay for the software according to the amount of use they make of it or through an annual or monthly subscription. </div></details><details class=\"lp-source-section\" id=\"source-slide-57\"><summary>Slide 57 · Key elements of SaaS</summary><div class=\"lp-source-text\">Key elements of SaaS\nSoftware is deployed on a server (or more commonly a number of servers) and is accessed through a web browser. It is not deployed on a local PC.\nThe software is owned and managed by a software provider, rather than the organizations using the software.\nUsers may pay for the software according to the amount of use they make of it or through an annual or monthly subscription. Sometimes, the software is free for anyone to use but users must then agree to accept advertisements, which fund the software service.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-58\"><summary>Slide 58 · SaaS and SOA</summary><div class=\"lp-source-text\">SaaS and SOA\nSoftware as a service is a way of providing functionality on a remote server with client access through a web browser. The server maintains the user’s data and state during an interaction session. Transactions are usually long transactions e.g. editing a document. \nService-oriented architecture is an approach to structuring a software system as a set of separate, stateless services. These may be provided by multiple providers and may be distributed. Typically, transactions are short transactions where a service is called, does something then returns a result.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-59\"><summary>Slide 59 · Implementation factors for SaaS</summary><div class=\"lp-source-text\">Implementation factors for SaaS\nConfigurability How do you configure the software for the specific requirements of each organization?\nMulti-tenancy How do you present each user of the software with the impression that they are working with their own copy of the system while, at the same time, making efficient use of system resources? \nScalability How do you design the system so that it can be scaled to accommodate an unpredictably large number of users?\n</div></details><details class=\"lp-source-section\" id=\"source-slide-60\"><summary>Slide 60 · Configuration of a software system offered as a service </summary><div class=\"lp-source-text\">Configuration of a software system offered as a service </div></details><details class=\"lp-source-section\" id=\"source-slide-61\"><summary>Slide 61 · Service configuration</summary><div class=\"lp-source-text\">Service configuration\nBranding, where users from each organization, are presented with an interface that reflects their own organization.\nBusiness rules and workflows, where each organization defines its own rules that govern the use of the service and its data.\nDatabase extensions, where each organization defines how the generic service data model is extended to meet its specific needs.\nAccess control, where service customers create individual accounts for their staff and define the resources and functions that are accessible to each of their users.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-62\"><summary>Slide 62 · Multi-tenancy</summary><div class=\"lp-source-text\">Multi-tenancy\nMulti-tenancy is a situation in which many different users access the same system and the system architecture is defined to allow the efficient sharing of system resources. \nIt must appear to each user that they have the sole use of the system. \nMulti-tenancy involves designing the system so that there is an absolute separation between the system functionality and the system data. </div></details><details class=\"lp-source-section\" id=\"source-slide-63\"><summary>Slide 63 · A multitenant database </summary><div class=\"lp-source-text\">A multitenant database </div></details><details class=\"lp-source-section\" id=\"source-slide-64\"><summary>Slide 64 · Scalability</summary><div class=\"lp-source-text\">Scalability\nDevelop applications where each component is implemented as a simple stateless service that may be run on any server.\nDesign the system using asynchronous interaction so that the application does not have to wait for the result of an interaction (such as a read request). \nManage resources, such as network and database connections, as a pool so that no single server is likely to run out of resources.\nDesign your database to allow fine-grain locking. That is, do not lock out whole records in the database when only part of a record is in use.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-65\"><summary>Slide 65 · Key points</summary><div class=\"lp-source-text\">Key points\nThe benefits of distributed systems are that they can be scaled to cope with increasing demand, can continue to provide user services if parts of the system fail, and they enable resources to be shared.\nIssues to be considered in the design of distributed systems include transparency, openness, scalability, security, quality of service and failure management.\nClient–server systems are structured into layers, with the presentation layer implemented on a client computer. Servers provide data management, application and database services.\nClient-server systems may have several tiers, with different layers of the system distributed to different computers. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-66\"><summary>Slide 66 · Key points</summary><div class=\"lp-source-text\">Key points\nArchitectural patterns for distributed systems include master-slave architectures, two-tier and multi-tier client-server architectures, distributed component architectures and peer-to-peer architectures.\nDistributed component systems require middleware to handle component communications and to allow components to be added to and removed from the system. \nPeer-to-peer architectures are decentralized with no distinguished clients and servers. Computations can be distributed over many systems in different organizations.\nSoftware as a service is a way of deploying applications as thin client- server systems, where the client is a web browser. </div></details>"}], "noAnswer": true, "sourceRange": "53–66", "appendix": true}, {"k": "R01", "answer": "One defensible request is a layer-to-tier mapping diagram with a documented failure mode per tier and a named fallback for the app-server tier. It distinguishes a real architectural gap from a single outage. Pending that evidence, state a bounded keep, redesign, or add-redundancy decision, its owner and the condition for resuming service.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence a distributed architecture decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "The Mentcare system was migrated to a 3-tier architecture. At 02:30 during a mental health crisis, the app server crashed.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Keep, redesign, or add redundancy to the architecture tonight?", "txt": "The 3-tier system put presentation on web clients, application on an app server, database on a DB server. The app server crashed at 02:30. The presentation layer had no local data and could not display patient records. The system was down for 47 minutes."}, {"c": "mag", "lab": "UNKNOWN", "lead": "The migration file says the architecture is &ldquo;scalable and modern.&rdquo; Tonight is what scalability costs.", "txt": "The architecture was signed off on throughput grounds. The 02:30 crash tested failure management, not throughput &mdash; and the thin-client presentation layer had no fallback. That is the gap."}]}, {"t": "principle", "txt": "Virtually all large computer-based systems are now distributed systems. The goal tonight is not certainty &mdash; it is a defensible architecture boundary with a named failure mode behind it.", "src": "P1 · p.3"}], "timebox": "90 sec", "task": "Name the one piece of architecture evidence you would demand before letting the system run another night.", "say": "You are the architect on call. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching. Every rule tonight returns to this 3-tier system.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers &mdash; and what you must prove", "sub": "Five sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "DISTRIBUTED SYSTEMS", "txt": "What is a distributed system?", "src": "P1 · p.3"}, {"c": "sand", "lab": "INTERACTION & MIDDLEWARE", "txt": "RPC vs messaging?", "src": "P1 · p.15"}, {"c": "teal", "lab": "CLIENT-SERVER", "txt": "Layers and tiers?", "src": "P1 · p.23"}, {"c": "sand", "lab": "ARCHITECTURAL PATTERNS", "txt": "Master-slave to p2p?", "src": "P1 · p.29"}, {"c": "teal", "lab": "SOFTWARE AS A SERVICE", "txt": "SaaS vs SOA?", "src": "P1 · p.53"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish distributed system characteristics, design issues, and the five architectural patterns."}, {"c": "teal", "lab": "2", "txt": "Trace a client-server system through the four layers and map them to physical tiers."}, {"c": "teal", "lab": "3", "txt": "Specify a distributed architecture using the right pattern for the demand and justify the trade-off."}, {"c": "mag", "lab": "4", "txt": "Build a bounded architecture verdict with inspectable, owned evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the architecture constraint, tier, or load pattern changes."}]}], "timebox": "90 sec", "task": "Note which of the five sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total. This slide exists so nobody leaves tonight unsure what was in the chapter.", "appendix": true, "route": "toolkit"}, {"k": "R08", "answer": "The chapter's traffic management case (p.32) is a master-slave architecture: a master process controls dedicated slave processes for data acquisition, computation, and actuator management, with guaranteed response times. The lesson for tonight: master-slave is for real-time systems with hard response-time guarantees. The 3-tier Mentcare system is NOT master-slave &mdash; it is multi-tier client-server. The reason the 3-tier architecture failed is not that it was the wrong pattern; it is that the pattern was chosen for scalability without adding failure management. The traffic management case shows what failure management looks like in a different pattern: dedicated processors per function, with the master coordinating recovery.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "Read the chapter&rsquo;s own traffic management case and identify what it teaches about failure management.", "title": "The chapter&rsquo;s own case &mdash; traffic management", "sub": "The source p.32 gives a master-slave traffic management system. Tonight&rsquo;s crisis is a multi-tier failure &mdash; the comparison is what teaches.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "TRAFFIC MANAGEMENT (p.32)", "lead": "Master-slave with dedicated processors per function.", "txt": "A master process coordinates data acquisition (slaves), computation (master), and actuator management (slaves). Each slave is dedicated to one function. The master controls communication and recovery.", "src": "P1 · p.32"}, {"c": "mag", "lab": "TONIGHT&rsquo;S PARALLEL", "lead": "Mentcare is multi-tier, not master-slave.", "txt": "The 3-tier Mentcare system is multi-tier client-server. The traffic management case shows what failure management looks like in a different pattern &mdash; dedicated processors per function with the master coordinating recovery. Tonight&rsquo;s system had no equivalent."}]}, {"t": "wide", "c": "violet", "lab": "THE QUESTION FOR TONIGHT", "lead": "Both systems are distributed. Only one has a built-in recovery path.", "field": {"id": "traffic_lesson", "core": false, "rows": 3, "ph": "What design element from the traffic management case would have helped Mentcare tonight?"}}, {"t": "principle", "txt": "A pattern is not just a topology. It is a set of assumptions about failure &mdash; and master-slave assumes the master coordinates recovery."}], "timebox": "3 min", "task": "Name one design element from the traffic management case that would have helped Mentcare tonight.", "notes": "Three minutes. The point is not that Mentcare should be master-slave &mdash; it is that the traffic management case shows what dedicated recovery looks like, and Mentcare had none.", "appendix": true, "_iscarbRule": "RULE 08 - 60-second source case", "route": "toolkit"}, {"k": "R18", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Connect the chapter&rsquo;s key points (p.65-66) to tonight&rsquo;s crisis.", "title": "What survives of the chapter&rsquo;s key points here", "sub": "A strong distributed architecture removes single points of failure before the day it is needed &mdash; and knows where its redundancy stops.", "blocks": [{"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.17 — the key points", "items": [{"c": "teal", "lab": "1 · BENEFITS", "lead": "Scalability, fault tolerance, resource sharing.", "txt": "Distributed systems can be scaled to cope with increasing demand, can continue to provide user services if parts fail, and enable resources to be shared.", "src": "P1 · p.65"}, {"c": "teal", "lab": "2 · DESIGN ISSUES", "lead": "Transparency, openness, scalability, security, QoS, failure management.", "txt": "Issues to consider in design include transparency, openness, scalability, security, quality of service, and failure management.", "src": "P1 · p.65"}, {"c": "teal", "lab": "3 · PATTERNS", "lead": "Master-slave, two-tier, multi-tier, distributed component, peer-to-peer.", "txt": "Architectural patterns include master-slave, two-tier and multi-tier client-server, distributed component, and peer-to-peer. Distributed component systems require middleware.", "src": "P1 · p.66"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "not in the chapter — your context", "items": [{"t": "wide", "c": "mag", "lab": "BACK TO TONIGHT&rsquo;S CRISIS &mdash; THE PARALLEL NOBODY CALLED A DESIGN DECISION", "lead": "The hospital migrated Mentcare to a 3-tier architecture for scalability. The 02:30 crash tested fault tolerance and failure management &mdash; and the architecture had neither.", "txt": "The thing that put you in the room was a <i>distributed architecture chosen for one characteristic and deployed without another</i>: the team chose multi-tier for scalability (p.65, benefit 1) and never addressed failure management (p.65, issue 6). Three questions the key points owe an answer to. <b>Which benefit</b> did the architecture deliver? <b>Which design issue</b> did it neglect? <b>Which pattern assumption</b> broke at 02:30? A defined failure-mode analysis answers these in advance; an improvised one discovers them at the first crisis."}]}}, {"t": "principle", "txt": "The line is not &ldquo;centralized vs distributed&rdquo;. It is &ldquo;addressed failure management&rdquo; against &ldquo;did not address failure management.&rdquo;"}], "timebox": "2 min", "task": "Name the benefit the architecture delivered, the design issue it neglected, and the pattern assumption that broke.", "notes": "The key points are the chapter&rsquo;s own summary. Say that &mdash; it is the one thing on this slide students can use in their project next week. <b>Then spend a full minute on the magenta card.</b> The crisis that opened the hour was a distributed architecture chosen for scalability and deployed without failure management. Three answers to look for &mdash; the benefit (scalability), the neglected issue (failure management), the broken pattern assumption (each tier must be reachable). A student who says &ldquo;they should have tested more&rdquo; has not read the case; push for which design issue and which pattern assumption.", "appendix": true, "_iscarbRule": "RULE 18 - Distributed systems key points", "route": "toolkit"}, {"k": "R10", "loadOk": "The 3x3 matrix and two fields describe one architecture-risk triage record. Students classify three risks and specify one monitor and one identification tool.", "answer": "Place, for example, the app-server single-point-of-failure risk (probability High, exposure High, Intolerable), the middleware recovery gap (probability Medium, exposure High, ALARP), and the failover time uncertainty (probability Medium, exposure Medium, ALARP) in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity (app-server response time and failover switch-over time), observation window (every shift handover), trigger value (failover above 30 seconds), named owner (on-call architect) and fallback action (switch to read-only direct path). A failure-mode analysis can identify the single-point-of-failure risk; retain the analysis as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it on an architecture matrix.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure if the app server will fail again&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact &mdash; e.g. the app server crashed at 02:30; the presentation layer had no local data."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Tonight&rsquo;s gap: how long would a redundant app server take to switch over, and is that fast enough for clinical use?"}, {"c": "violet", "lab": "MONITORED", "txt": "An unknown with a measured quantity, observation window, trigger value, named owner and fallback action. The unknown becomes a risk on a schedule."}]}]}, {"t": "wide", "c": "sand", "lab": "PLACE TONIGHT&rsquo;S RISKS ON THE MATRIX", "picker": {"g": "risk3", "options": ["App-server single point of failure", "Middleware recovery gap", "Failover time uncertainty", "No fallback read path"]}, "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify an architecture risk with a failure-mode analysis, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; GKU 4 / KLO 3", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "One tool or method you would use to identify an architecture risk in this system"}}, {"t": "principle", "txt": "Approval = evidence state + uncertainty statement + monitoring plan."}], "timebox": "3 min", "task": "Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger. <b style=\"color:var(--mag)\">You are the architect.</b>", "notes": "This unit carries the one Jahiziah outcome the department mapped to this course. Make every student write something in that field. Do not accept a monitored risk without a trigger value and a named owner. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the engineer who claims, the engineer who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "Architecture claims fail not because nobody chose a pattern &mdash; but because the architecture decision has no owner able to defend it.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · OWNER", "lead": "The architect who decides.", "txt": "Names the verdict and the pattern. Owns the consequence. The on-call architect tonight &mdash; not the developer, not the vendor, not the AI."}, {"c": "sand", "lab": "2 · EVIDENCE OWNER", "lead": "The engineer who maintains the architecture diagram and failure-mode analysis.", "txt": "Maintains the inspectable artifact: the layer-to-tier map, the failure-mode analysis, the failover test results. Cannot be the same person as the owner."}, {"c": "mag", "lab": "3 · SIGN-OFF", "lead": "The authority who accepts the residual risk.", "txt": "The hospital&rsquo;s IT steering committee or the regulator&rsquo;s reviewer. Accepts the bounded residual risk on the evidence the owner and evidence owner produced."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S GAP", "lead": "A 3-tier architecture deployed without a failure-mode analysis &mdash; one project manager signing off their own migration.", "txt": "The system went live with one project manager&rsquo;s signature on a 3-tier architecture that promised scalability. That is owner, evidence owner and sign-off collapsed into a single person &mdash; which is why the failure mode could not be audited when the crash arrived.", "field": {"id": "accountability", "core": false, "rows": 2, "ph": "For your verdict: who is the owner, who is the evidence owner, and who signs off?"}}, {"t": "principle", "txt": "Owner &ne; evidence owner &ne; sign-off. Three roles, three people."}], "timebox": "2 min", "task": "For the verdict you signed at Rule 07: name the owner, the evidence owner, and the sign-off authority.", "notes": "Two minutes. The accountability trio is the rule most assignments miss. Make every student name three different people tonight; if they cannot, the verdict is not yet dependable.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about a distributed system in the section of the source that answers it.", "title": "What Chapter 17 trains you to do", "sub": "Five questions the Mentcare migration cannot answer tonight. Each one is a section of the chapter &mdash; and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "DISTRIBUTED SYSTEMS", "txt": "What is a distributed system?", "src": "P1 · p.3"}, {"c": "sand", "lab": "INTERACTION & MIDDLEWARE", "txt": "RPC vs messaging?", "src": "P1 · p.15"}, {"c": "teal", "lab": "CLIENT-SERVER", "txt": "Layers and tiers?", "src": "P1 · p.23"}, {"c": "sand", "lab": "ARCHITECTURAL PATTERNS", "txt": "Master-slave to p2p?", "src": "P1 · p.29"}, {"c": "teal", "lab": "SOFTWARE AS A SERVICE", "txt": "SaaS vs SOA?", "src": "P1 · p.53"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Most students pick architectural patterns because it sounds hardest. The chapter&rsquo;s own answer is interaction and middleware. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition &mdash; and every one of these is something you will do to the Mentcare architecture in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish distributed system characteristics, design issues, and the five architectural patterns."}, {"c": "teal", "lab": "2", "txt": "Trace a client-server system through the four layers and map them to physical tiers."}, {"c": "teal", "lab": "3", "txt": "Specify a distributed architecture using the right pattern for the demand and justify the trade-off."}, {"c": "mag", "lab": "4", "txt": "Build a bounded architecture verdict with inspectable, owned evidence."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the architecture constraint, tier, or load pattern changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone &mdash; the artifact every other outcome feeds.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: the 3-tier architecture is accepted without a per-tier failure-mode analysis. JUDGMENT then fails because the team cannot show which tier takes over when another fails.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing an architecture failure from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Separate the four client-server layers.", "src": "Rule 05 · X05"}, {"c": "mag", "lab": "", "txt": "Accept, revise or reject the architecture.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Name a failure mode, not an intention.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the failure up the sociotechnical stack.", "src": "X02"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A patient bears what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them.", "task": "Which capability fails first when a team trusts a scalable architecture without a failure-mode analysis?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE &mdash; a scalable architecture fails not because nobody analysed it but because nobody made the failure modes inspectable.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: Multi-tier is the promise to the hospital. It holds only if a single tier can fail without losing the service AND nobody mapped the failure mode of the app-server tier. The prediction is bounded by the missing failure-mode analysis, not by the architecture choice.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which pattern failed tonight?", "picker": {"g": "predict", "options": ["Master-slave", "Two-tier thin-client", "Multi-tier client-server", "Distributed component", "Peer-to-peer"]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. presentation layer has no local data, app server is a single point of failure, no redundancy"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment gateway, not from tonight:</i> &ldquo;This holds only if the retry queue drains faster than new requests arrive. If it does not, the queue is the thing that fails, not the payment service &mdash; and nobody has measured the drain rate under holiday load.&rdquo;"}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the five pattern names &mdash; you have not met them yet. Start from the room. A 3-tier system crashed at 02:30 because the presentation layer had no local data. Ask which tier failed first, and which pattern that architecture belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color ible). <b>Recover</b> (automatically repair or resume). Tonight&rsquo;s architecture had none of the three for the app-server tier."}, {"q": "Say tonight&rsquo;s decision as the three-part sentence: client model, interaction style, missing design issue.", "a": "Mentcare is a thin-client 3-tier architecture using RPC from presentation to app server, which failed because failure management was not addressed for the app-server tier."}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop. Question 4 is the one that pays all semester &mdash; the three-part sentence is the shape of a defensible architecture report.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: a 3-tier architecture crashes when the app server fails. CRISIS: 47-minute outage during a mental health crisis. MAP: presentation (web client), application processing (app server), database (DB server), middleware, hospital procedure. TRADE-OFF: keep the architecture and add redundancy (cheap, partial) vs redesign as distributed component (expensive, robust). EVIDENCE: layer-to-tier mapping, failure-mode analysis, failover test. VERDICT: add redundancy with a named owner and a fallback path.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source patterns into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies patterns; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "App server crash at 02:30 during a mental health crisis."}, {"c": "teal", "lab": "2 MAP", "txt": "Presentation (web), application (app server), database (DB server), middleware."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Add redundancy (cheap, partial) if the nurse needs the record in 3 seconds. The stress test asks: what is the actual clinical deadline?"}, {"c": "sand", "lab": "3 &nbsp; MIDDLEWARE COVERAGE", "lead": "Does the middleware know about the standby?", "txt": "A standby that is not registered with the middleware cannot be routed to. The stress test asks: is the standby in the middleware&rsquo;s service registry?"}, {"c": "violet", "lab": "4 &nbsp; FALLBACK PATH", "lead": "What happens when both app servers fail?", "txt": "A redundant tier is not a fallback path. The stress test asks: what is the read-only direct path from presentation to database?"}]}, {"t": "wide", "c": "mag", "lab": "PICK THE ONE YOUR VERDICT FAILS", "field": {"id": "stress", "core": true, "rows": 2, "ph": "Which stress test does your verdict fail, and what would you change to survive it?"}}, {"t": "principle", "txt": "A verdict that survives all four stress tests is either remarkable or uncommitted &mdash; usually the second."}], "timebox": "3 min", "task": "Pick the stress test your verdict fails and write what you would change to survive it.", "notes": "Three minutes. The point is to fail one of the four on purpose &mdash; almost every verdict fails failover time or fallback path, and the honest student names which.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> (architect) decides the verdict and names the pattern. The <b>evidence owner</b> maintains the architecture diagram and the failure-mode analysis. The <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What are the four stress tests an architecture verdict must survive?", "a": "<b>Tier redundancy</b> &mdash; does the fix cover the failed tier? <b>Failover time</b> &mdash; is it fast enough for clinical use? <b>Middleware coverage</b> &mdash; does the middleware know about the standby? <b>Fallback path</b> &mdash; what happens when both app servers fail?"}, {"q": "Your design adds a hot-standby app server. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. standing pre-approval for low-risk failover drills, a weekly batch instead of a queue. Sympathy is not an answer."}, {"q": "Where may AI sit in the architecture assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts config, suggests patterns, generates middleware mappings. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense. Question 3 wants a design change, not sympathy. Question 4 is deliberately the exact sentence from the flow.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks &mdash;
