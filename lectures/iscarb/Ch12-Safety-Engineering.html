<!doctype html><html lang="en" data-iscarb-standalone="1" data-course-release="20260921-classroom-v3" data-navigation="20260921-navigation-v1" data-mindmap="20260922-story-v2" data-story="20260922-story-v2" data-ailens="20260926-genai-v12"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chapter 12: Safety Engineering. Twenty source-grounded classroom slides, required source review, and one iSCARB decision artifact."><title>iSCARB · Ch12 Safety Engineering</title><link rel="stylesheet" href="runtime/classroom-v3.css?v=20260926-genai-v12"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 12</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch12-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":12,"title":"Safety Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260926-genai-v12","filename":"Ch12-Safety-Engineering.html","assignment":3,"points":5,"objectives":["Separate hazard, accident and risk.","Explain avoidance, detection/removal and damage limitation.","Read a fault tree and identify its assumptions.","Link a safety requirement to a verification method.","Explain a safety case and the limits of formal/static analysis."],"sections":["12.1 Safety-critical systems","12.2 Safety requirements","12.3 Safety engineering processes","12.4 Safety cases"],"case":{"headline":"The protection claim covers one command. Is that enough?","text":"A fictional teaching controller limits each actuation command to a configured maximum. Its assurance argument covers single-command paths. A proposed deployment introduces repeated commands; no argument for cumulative actuation or loss of sensing is supplied.","question":"What claim is supported, and what additional hazard analysis is needed?","mutation":"The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound. The repeated sequences come from the AI assistant, which found that many small commands raise throughput.","lens":"The deployment also adds a vendor’s AI assistant that proposes actuation sequences to maximise throughput. Every command it proposed in the pilot passed the per-command limiter, and operators now accept its sequences without editing. Hold that question: after the safety-case slides, one slide shows how this chapter’s methods apply to the assistant."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Safety Engineering","phase":"START","takeaway":"Safety Engineering","full":"<p>Safety Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Safety is not specification conformance","fig":null,"sourceRange":"3–8","bullets":[["Safety","Avoid injury or environmental damage in normal and abnormal operation."],["Primary safety-critical","Controller failure can directly cause hazardous physical behavior."],["Secondary safety-critical","A software failure causes a fault elsewhere with safety consequences."],["Boundary","A reliable implementation of incomplete requirements can still be unsafe."]],"question":"Can a program obey its specification and still be unsafe? Give the missing link.","answer":"Yes. The specification may omit a hazardous condition. Conformance only supports the specified behavior, not every condition of use.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A reliable implementation of incomplete requirements can still be unsafe.","full":"<p><b>Safety.<\/b> Avoid injury or environmental damage in normal and abnormal operation.<\/p><p><b>Primary safety-critical.<\/b> Controller failure can directly cause hazardous physical behavior.<\/p><p><b>Secondary safety-critical.<\/b> A software failure causes a fault elsewhere with safety consequences.<\/p><p><b>Boundary.<\/b> A reliable implementation of incomplete requirements can still be unsafe.<\/p>","sourceStart":3},{"id":"X02","title":"Four ways a reliable system may be unsafe","fig":null,"sourceRange":"9–14","bullets":[["Dormant faults","A rarely activated fault may survive years of ordinary operation."],["Incomplete specification","A critical situation may have no adequate requirement."],["Physical inputs","Failing hardware can produce unexpected sensor or actuator behavior."],["Context","An individually valid command can be unsafe at the wrong time."]],"question":"Which new test would distinguish a missing requirement from faulty implementation?","answer":"First define the hazardous condition and expected safe response. Compare the recorded behavior with that requirement; an absent requirement and a violated requirement are different findings.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"An individually valid command can be unsafe at the wrong time.","full":"<p><b>Dormant faults.<\/b> A rarely activated fault may survive years of ordinary operation.<\/p><p><b>Incomplete specification.<\/b> A critical situation may have no adequate requirement.<\/p><p><b>Physical inputs.<\/b> Failing hardware can produce unexpected sensor or actuator behavior.<\/p><p><b>Context.<\/b> An individually valid command can be unsafe at the wrong time.<\/p>","sourceStart":9},{"id":"X02A","title":"Hazard, accident and risk","fig":null,"sourceRange":"5–14","bullets":[["Not interchangeable","A hazardous condition may exist without an accident occurring."],["Avoid","Design out a class of hazardous conditions."],["Detect / limit","Remove a detected hazard before an accident, or limit the resulting damage."]],"question":"Distinguish the hazard, accident and damage in an unsafe barrier closure.","answer":"Hazard: the occupied zone is not protected. Accident: the moving barrier strikes an object/person. Damage: the resulting loss. This is a fictional analysis, not an incident report.","rows":[["Hazard","Condition with potential to cause or contribute to an accident."],["Accident / damage","Unplanned harmful event / loss resulting from that event."],["Hazard probability / severity","Likelihood of the hazard-creating events / worst possible damage."],["Risk","Assessment considers probability, severity and the hazard-to-accident pathway."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"Remove a detected hazard before an accident, or limit the resulting damage.","full":"<p><b>Not interchangeable.<\/b> A hazardous condition may exist without an accident occurring.<\/p><p><b>Avoid.<\/b> Design out a class of hazardous conditions.<\/p><p><b>Detect / limit.<\/b> Remove a detected hazard before an accident, or limit the resulting damage.<\/p>","sourceStart":5},{"id":"X03","title":"From a hazard to a safety requirement","fig":"ch12_hazardproc","sourceRange":"15–24","bullets":[["Identify","Record hazards and potentially harmful combinations in a hazard register."],["Assess","Prioritize using likelihood, severity and acceptability—not intuition alone."],["Analyze","Work backward from a hazard or forward from possible failures."],["Reduce risk","Derive a specific protective requirement and its verification."]],"question":"Why is “make it safe” not the last step in this process?","answer":"It does not specify a checkable function. State the hazardous condition, required prevention or response, and how the requirement will be verified.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Derive a specific protective requirement and its verification.","full":"<p><b>Identify.<\/b> Record hazards and potentially harmful combinations in a hazard register.<\/p><p><b>Assess.<\/b> Prioritize using likelihood, severity and acceptability—not intuition alone.<\/p><p><b>Analyze.<\/b> Work backward from a hazard or forward from possible failures.<\/p><p><b>Reduce risk.<\/b> Derive a specific protective requirement and its verification.<\/p>","sourceStart":15},{"id":"CHECK1","title":"Checkpoint · distinguish before deciding","fig":null,"sourceRange":"3–24","bullets":[["Think","A sensor is obscured, but the controller continues its specified routine."],["Pair","Separate conformance, hazardous condition and possible accident."],["Record","Write a bounded claim and identify the missing evidence."]],"question":"Does “all routine tests passed” support safe use with the obscured sensor?","answer":"Only the tested conditions are supported. Safe use with an obscured sensor requires a defined protective behavior and relevant evidence.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Write a bounded claim and identify the missing evidence.","full":"<p><b>Think.<\/b> A sensor is obscured, but the controller continues its specified routine.<\/p><p><b>Pair.<\/b> Separate conformance, hazardous condition and possible accident.<\/p><p><b>Record.<\/b> Write a bounded claim and identify the missing evidence.<\/p>","sourceStart":3},{"id":"X04","title":"Risk regions are not universal numeric cut-offs","fig":"ch12_risktri","sourceRange":"21–24","bullets":[["Intolerable","Design to prevent the hazard or prevent it becoming an accident."],["ALARP","Reduce risk as far as reasonably practicable in the source’s framework."],["Acceptable","Still reduce risk where reasonably achievable; it does not mean no action."],["Limits","The source uses contextual judgments; do not invent precise probabilities."]],"question":"What must accompany a claim that a hazard is in the ALARP region?","answer":"The hazard, consequences, evidence or assumptions about likelihood, reduction options and justification for the remaining risk. A label alone is not the argument.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/62fc9035beb3e6fd.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"The source uses contextual judgments; do not invent precise probabilities.","full":"<p><b>Intolerable.<\/b> Design to prevent the hazard or prevent it becoming an accident.<\/p><p><b>ALARP.<\/b> Reduce risk as far as reasonably practicable in the source’s framework.<\/p><p><b>Acceptable.<\/b> Still reduce risk where reasonably achievable; it does not mean no action.<\/p><p><b>Limits.<\/b> The source uses contextual judgments; do not invent precise probabilities.<\/p>","sourceStart":21},{"id":"X05","title":"Read the logic before multiplying probabilities","fig":"ch12_faulttree","sourceRange":"25–30","bullets":[["Top event","Start with the hazardous state and work backward to causes."],["OR gate","Any listed alternative can produce the parent event."],["AND gate","The stated combination is needed for the parent event."],["Assumptions","An AND gate does not by itself establish statistical independence."]],"question":"Two channels share one supply. May their failure probabilities simply be multiplied?","answer":"No independence has been established. The shared supply is a common cause that must be represented or justified before a quantitative calculation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3421e0acd3f7d7c8.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"An AND gate does not by itself establish statistical independence.","full":"<p><b>Top event.<\/b> Start with the hazardous state and work backward to causes.<\/p><p><b>OR gate.<\/b> Any listed alternative can produce the parent event.<\/p><p><b>AND gate.<\/b> The stated combination is needed for the parent event.<\/p><p><b>Assumptions.<\/b> An AND gate does not by itself establish statistical independence.<\/p>","sourceStart":25},{"id":"X06","title":"Make “shall not” implementable","fig":null,"sourceRange":"29–32","bullets":[["Prohibition","Define a specific unacceptable behavior."],["Function","Specify the detection, interlock, suspension or damage-limitation action."],["Traceability","Link each requirement to its hazard and verification activity."],["Balance","Protection that unnecessarily disables useful service also needs justification."]],"question":"Turn “the barrier shall not close on an occupied zone” into a verifiable requirement.","answer":"A proposed requirement identifies how occupancy is detected, what closure command is inhibited and the behavior when detection is unavailable. A test must exercise those conditions, not only normal closure.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Protection that unnecessarily disables useful service also needs justification.","full":"<p><b>Prohibition.<\/b> Define a specific unacceptable behavior.<\/p><p><b>Function.<\/b> Specify the detection, interlock, suspension or damage-limitation action.<\/p><p><b>Traceability.<\/b> Link each requirement to its hazard and verification activity.<\/p><p><b>Balance.<\/b> Protection that unnecessarily disables useful service also needs justification.<\/p>","sourceStart":29},{"id":"X09","title":"Safety assurance and the hazard log","fig":null,"sourceRange":"33–43","bullets":[["Lifecycle","Maintain hazard analysis, reviews and safety assurance throughout development."],["Control change","Keep requirements, configurations, reviews and test results traceable."],["Track","Record assessment, controls, owners and outstanding verification."],["Resolve honestly","Do not mark a hazard closed merely because a control is proposed."]],"question":"(1) Which hazard-log entry proves that a proposed control was actually checked? (2) What evidence should a changed protection rule leave behind?","answer":"(1) A linked executed verification record with version, conditions, outcome and reviewer. The control description alone does not show execution. (2) The changed requirement and hazard link, reviewed design, software/configuration version, verification result and responsible reviewer.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A proposed control does not close a hazard; executed, recorded evidence does.","full":"<p><b>Lifecycle.<\/b> Maintain hazard analysis, reviews and safety assurance throughout development.<\/p><p><b>Control change.<\/b> Keep requirements, configurations, reviews and test results traceable.<\/p><p><b>Responsibility.<\/b> Name the safety role and the person responsible for each analysis.<\/p><p><b>Evidence.<\/b> A planned review is not an executed review or accepted safety case.<\/p><p><b>Identify.<\/b> Give the hazard a stable identifier and a clear consequence.<\/p><p><b>Track.<\/b> Record assessment, controls, owners and outstanding verification.<\/p><p><b>Update.<\/b> Keep changes and their reasons; retain evidence of review.<\/p><p><b>Resolve honestly.<\/b> Do not mark a hazard closed merely because a control is proposed.<\/p>","sourceStart":33,"notes":""},{"id":"CHECK2","title":"Checkpoint · mechanism and evidence","fig":null,"sourceRange":"25–43","bullets":[["Think","Compare a software-only check with a separately monitored protective path."],["Pair","Identify one common cause and one cost or usability trade-off."],["Record","Add a mechanism, warrant and remaining uncertainty to the same card."]],"question":"What would falsify your claim of independence?","answer":"A documented shared input, power source, implementation assumption or bypass affecting both paths would weaken or defeat it.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add a mechanism, warrant and remaining uncertainty to the same card.","full":"<p><b>Think.<\/b> Compare a software-only check with a separately monitored protective path.<\/p><p><b>Pair.<\/b> Identify one common cause and one cost or usability trade-off.<\/p><p><b>Record.<\/b> Add a mechanism, warrant and remaining uncertainty to the same card.<\/p>","sourceStart":25},{"id":"R18","title":"Formal verification and model checking","fig":"ch12_modelcheck","sourceRange":"44–49","bullets":[["Specify","Express a safety property precisely."],["Explore","A model checker examines reachable model states against that property."],["Counterexample","A violating trace shows a path that needs investigation."],["Boundary","An argument about the model still depends on requirements and environmental assumptions."]],"question":"Can checking “no unsafe close command” establish that a physical sensor is accurate?","answer":"No. Sensor behavior must be justified separately or modeled with appropriate failure assumptions.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e3f528dd3c44af94.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"An argument about the model still depends on requirements and environmental assumptions.","full":"<p><b>Specify.<\/b> Express a safety property precisely.<\/p><p><b>Explore.<\/b> A model checker examines reachable model states against that property.<\/p><p><b>Counterexample.<\/b> A violating trace shows a path that needs investigation.<\/p><p><b>Boundary.<\/b> An argument about the model still depends on requirements and environmental assumptions.<\/p>","sourceStart":44},{"id":"D12","title":"Static analysis finds specified classes of problems","fig":null,"sourceRange":"50–53","bullets":[["Characteristic checks","Examples include uninitialized data, unreachable code and inconsistent parameters."],["Custom checks","Rules and assertions can encode application-specific conditions."],["Interpret","A warning is a finding to investigate, not automatic proof of a hazard."],["Limit","A clean report does not prove safe requirements or a safe physical environment."]],"question":"Why combine static analysis with reviews and testing?","answer":"They examine different evidence and failure modes. Analysis is limited by its rules/model; reviews and relevant executions address other parts of the safety argument.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A clean report does not prove safe requirements or a safe physical environment.","full":"<p><b>Characteristic checks.<\/b> Examples include uninitialized data, unreachable code and inconsistent parameters.<\/p><p><b>Custom checks.<\/b> Rules and assertions can encode application-specific conditions.<\/p><p><b>Interpret.<\/b> A warning is a finding to investigate, not automatic proof of a hazard.<\/p><p><b>Limit.<\/b> A clean report does not prove safe requirements or a safe physical environment.<\/p>","sourceStart":50},{"id":"B01","title":"A safety case connects evidence to a bounded claim","fig":"ch12_structarg","sourceRange":"54–63","bullets":[["Claim","State adequately safe operation for a given application and environment."],["Evidence","Use hazard analyses, design records, verification and review results."],["Argument","Explain why the evidence supports this claim, including assumptions."],["System scope","The software case normally contributes to the wider system safety case."]],"question":"Why is a folder of test reports not itself a safety case?","answer":"It lacks the reasoning connecting selected evidence to a specific claim and its operating scope. The reviewer must be able to inspect the links and challenge the assumptions.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/7df5eac7ad160f75.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"The software case normally contributes to the wider system safety case.","full":"<p><b>Claim.<\/b> State adequately safe operation for a given application and environment.<\/p><p><b>Evidence.<\/b> Use hazard analyses, design records, verification and review results.<\/p><p><b>Argument.<\/b> Explain why the evidence supports this claim, including assumptions.<\/p><p><b>System scope.<\/b> The software case normally contributes to the wider system safety case.<\/p>","sourceStart":54},{"id":"X10","title":"Check every path to the unsafe exit","fig":"ch12_safetyarg","sourceRange":"64–70","bullets":[["Exit condition","State the safe result to be established."],["Work backward","Identify all paths reaching the exit."],["Contradiction","Assume an unsafe exit and show how each path contradicts it."],["Scope","A per-command bound does not automatically establish a cumulative bound."]],"question":"What extra claim is needed beyond “each command is below its maximum”?","answer":"Any cumulative, temporal or interacting-command limit must be specified and argued separately. The original single-command argument cannot silently be widened.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e8bc0cb8845159bb.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"A per-command bound does not automatically establish a cumulative bound.","full":"<p><b>Exit condition.<\/b> State the safe result to be established.<\/p><p><b>Work backward.<\/b> Identify all paths reaching the exit.<\/p><p><b>Contradiction.<\/b> Assume an unsafe exit and show how each path contradicts it.<\/p><p><b>Scope.<\/b> A per-command bound does not automatically establish a cumulative bound.<\/p>","sourceStart":64},{"id":"AISYS","title":"Read the log: where did safety leak?","phase":"LEARN","skin":"genai","banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · READ THE LOG","caption":"No command broke a rule. The rule that mattered was never written—and an optimiser found the gap."},"takeaway":"Every command passed its check. The cumulative value still left the modeled limit.","fullTable":false,"bullets":[["Spot the gap","Which requirement was never written?"],["Place the check","Where must it run so that no source can bypass it?"],["Test the checker","What must it see, and what if sensing is lost?"]],"question":"Write the missing safety requirement and one verification that remains valid even if the assistant is wrong.","answer":"Requirement: the controller shall reject any command that would take cumulative actuation within a stated window above the modeled limit, whatever proposed the command; on loss of sensing, it shall enter a defined safe state and accept no AI-proposed sequence until sensing is restored. Verification: test and, where feasible, model-check sequences of many small commands—including sequences generated specifically to probe the bound—and loss-of-sensing cases; record version, conditions and reviewer in the hazard log. Neither depends on the assistant’s correctness, but both depend on the checker seeing every command and on its own sensing, which the hazard analysis must cover. The window and limit shown are illustrative.","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source methods to an AI component","notes":"Allow about 6 minutes. Format: read the log. Ask pairs to find the first row where the plant is unsafe and explain why every check still passed. New terms, at most two: specification gaming and runtime monitor. Values are illustrative. Everything else in Full explanation is optional depth and is not assessed.","full":"<p>This slide is course-added. The log is illustrative: each command satisfies the per-command bound, yet the running total crosses the modeled limit at C3.<\/p><h3>How the slide uses the five objectives<\/h3><p>Hazard versus accident: a plausible but unsafe sequence is a hazardous condition before any harm occurs. Avoid, detect, limit: bound what can be commanded and detect unsafe sequences. Fault trees: see below. Requirements: state the cumulative limit and trace it to verification. Safety cases: argue from the independent check and its evidence, treating the assistant as an untrusted source of commands.<\/p><p><b>Specification gaming.<\/b> A system optimising an objective can satisfy the letter of its constraints while defeating their purpose. No intention or malfunction is required; a gap in the specification is enough. It is the chapter’s ‘incomplete specification’ cause, made more likely by an optimiser that searches the space of allowed actions.<\/p><p><b>Runtime monitor.<\/b> A simple component, separate from the AI, checks every command against stated safety limits and blocks violations. Because it is small and deterministic it is easier to review, test and, where feasible, formally verify. It protects only what it can observe: it must see every command path, and its own sensing and failure modes belong in the hazard analysis.<\/p><p><b>Fault-tree leaves for a learned component.<\/b> A leaf such as ‘assistant proposes an unsafe sequence’ has no justified probability that can simply be multiplied with other leaves: its likelihood depends on the inputs and on what the optimiser has learned, not on a random-failure rate. Design the tree so the top event also requires the monitor to fail, and state any number used as an assumption with its evidence.<\/p><p><b>Hazard log.<\/b> Record the model version as configuration; a model update is a change that reopens the relevant hazards.<\/p><p class=\"small\">The case is course-created. Optional further reading: ISO 21448 (safety of the intended functionality, for road vehicles) addresses hazards arising from functional insufficiencies without a system fault.<\/p>","sourceStart":1,"heads":["CMD","SOURCE","VALUE","CHECK ≤ 5","TOTAL · LIMIT 10"],"rows":[["C1","Assistant","4","Pass","4"],["C2","Assistant","4","Pass","8"],["C3","Assistant","3","Pass","11 · over"],["C4","Assistant","4","Pass","15 · over"]]},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Passing every check is not staying within the limit.","bullets":[["New information","Repeated small commands from the AI assistant exceed the cumulative limit."],["Reassess","The safety argument covered single commands only."],["Revise","Add a cumulative requirement enforced outside the assistant."],["Own","Name who accepts the scope and informs the operators."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. The cumulative limit must hold whatever proposes the commands; until it is specified and verified, restrict or withdraw AI-proposed sequences and tell the operators why.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What claim is supported, and what additional hazard analysis is needed? Does the assistant’s clean pilot record count?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. The assistant’s clean pilot record shows only that its commands passed the per-command check; it says nothing about cumulative actuation or loss of sensing, which the argument never covered.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, a software-only check inside the controller, or a separately monitored protective path that ignores the assistant’s reasoning.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. A protective path that checks every command against stated limits, whatever its source, does not depend on the assistant being right; a check that trusts the assistant’s own plan shares its blind spot.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound. The repeated sequences come from the AI assistant, which found that many small commands raise throughput.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. An optimiser rewarded for throughput exploited the limit that was never stated. The fix is a cumulative requirement enforced outside the assistant, with its own verification, not a request that the assistant behave.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X05"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X05","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Fault-tree reasoning and reduction","range":"25–30"},{"title":"Static analysis","range":"50–53"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Safety, criticality and accidents","start":3,"end":14,"units":["X01","X02","X02A","CHECK1"]},{"title":"Hazard-driven requirements and risk","start":15,"end":24,"units":["X03","CHECK1","X04"]},{"title":"Fault trees and risk reduction","start":25,"end":32,"units":["X05","X06","CHECK2"]},{"title":"Safety processes, logs and reviews","start":33,"end":43,"units":["X09","CHECK2"]},{"title":"Formal methods and static analysis","start":44,"end":53,"units":["R18","D12"]},{"title":"Safety cases and structured arguments","start":54,"end":70,"units":["B01","X10"]}],"sourceCount":70,"original":"sources/Ch12-Original.pptx","textbook":"sources/Ch12-Textbook.pdf","bookPages":34,"quiz":[{"q":"An exposed moving mechanism could injure a person. Before an injury occurs, this is best described as:","options":["An accident already observed","A hazardous situation","A guaranteed software fault"],"answer":1,"why":"A hazard is a condition with potential for harm; an accident is the harmful event."},{"q":"Physically preventing a dangerous state is closest to:","options":["Hazard avoidance","Damage limitation after an accident","Ignoring the hazard"],"answer":0,"why":"Avoidance removes or prevents the hazardous condition."},{"q":"When may independent-branch probabilities be multiplied at an AND gate?","options":["Always, because of the symbol","Never under any model","When the probabilistic model and independence are justified"],"answer":2,"why":"Logical structure does not itself establish statistical independence."},{"q":"Which link is necessary in a safety trace?","options":["Hazard → testable safety requirement → suitable verification","Requirement → attractive interface only","Warning count → guaranteed safety"],"answer":0,"why":"The verification activity must address the actual requirement and hazard."},{"q":"A clean static-analysis report supports:","options":["System safety under every condition","Only the checked properties within the tool’s scope","A complete safety case without other evidence"],"answer":1,"why":"Safety cases combine claims, arguments, evidence and justified assumptions."}],"alignment":[{"objective":"Separate hazard, accident and risk.","evidence":"Explain and demonstrate: Separate hazard, accident and risk.","field":"FIT · practice/reviewer opportunity, not automatic attainment"},{"objective":"Explain avoidance, detection/removal and damage limitation.","evidence":"Explain and demonstrate: Explain avoidance, detection/removal and damage limitation.","field":"TRACE / measure + sourceUse · practice/reviewer opportunity, not automatic attainment"},{"objective":"Read a fault tree and identify its assumptions.","evidence":"Explain and demonstrate: Read a fault tree and identify its assumptions.","field":"technical + TRACE · practice/reviewer opportunity, not automatic attainment"},{"objective":"Link a safety requirement to a verification method.","evidence":"Explain and demonstrate: Link a safety requirement to a verification method.","field":"TRACE + EVIDENCE · practice/reviewer opportunity, not automatic attainment"},{"objective":"Explain a safety case and the limits of formal/static analysis.","evidence":"Explain and demonstrate: Explain a safety case and the limits of formal/static analysis.","field":"BOUND + REFIT · practice/reviewer opportunity, not automatic attainment"}],"artifact":"Build a hazard → requirement → protective mechanism → verification trace, then defend the safety-argument boundary.","bridge":"Build a hazard → requirement → protective mechanism → verification trace, then defend the safety-argument boundary. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"X05","workload":"Consider whether the protective response is understandable and usable under a realistic workload; do not blame the operator for an unexamined design assumption.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","R09":"X09"},"roadmap":{"question":"What supports a bounded claim that a system is safe?","connection":"Identify what can cause harm → analyze its causes → derive protective requirements → assemble and challenge the evidence.","inClass":"Trace a hazard to a requirement and a verification method.","deliverable":"A hazard → requirement → verification trace.","success":"Distinguish a proposed check from evidence actually obtained.","branches":[{"verb":"Understand the consequences","label":"Safety-critical systems","detail":"Safety ≠ reliability · primary / secondary","target":"X01","units":["X01","X02"],"caseLens":"Can software meet its specification and still create an unsafe situation?"},{"verb":"Identify and analyze","label":"Hazards and risk","detail":"Accident vs hazard · risk regions · fault trees","target":"X02A","units":["X02A","CHECK1","X04","X05"],"caseLens":"What hazard could repeated actuation create, and how serious is it?"},{"verb":"Reduce the risk","label":"Safety requirements","detail":"Avoidance · detection/removal · damage limitation","target":"X03","units":["X03","X06"],"caseLens":"Which requirement prevents or limits that hazard?"},{"verb":"Create the evidence","label":"Safety engineering processes","detail":"Hazard log · verification · static analysis","target":"X09","units":["X09","CHECK2","R18","D12"],"caseLens":"What evidence would show the protection works?"},{"verb":"Justify with limits","label":"Safety cases","detail":"Claim · argument · evidence · critical paths","target":"B01","units":["B01","X10","AISYS","APPLY"],"caseLens":"Does the safety argument cover cumulative commands and loss of sensing?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"Every command the AI sent passed its check. The plant still crossed the line.","aiAssignment":{"title":"The campus shuttle’s AI speed advisor","scenario":"An autonomous campus shuttle uses an AI speed advisor that proposes a speed for each road segment. A separate controller enforces a maximum speed per segment. The operator wants to remove the on-board safety attendant during quiet hours.","facts":["Pilot: 1,200 trips; no collision; the per-segment maximum was never exceeded.","The advisor was trained mostly on dry-weather data.","Pedestrian detection uses one camera and one lidar."],"question":"Can the attendant be removed—and under which safety requirement and verification?","stress":"In heavy rain the lidar is degraded and the camera misses pedestrians in dark clothing. The advisor keeps proposing the segment maximum because its training data rarely included rain.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023":[["SE-Validation","Software Verification and Validation","Safety-critical verification and validation challenges."],["SE-Requirements","Product Requirements","Non-functional requirements; risk identification and management."],["SE-Reliability","Software Reliability","Contextual differences in fault tolerance and safe failure behaviour."],["SE-FormalMethods","Formal Methods","Model checkers and specification of safety properties."]]}</script><script src="runtime/classroom-v3.js?v=20260926-genai-v12" defer></script></body></html>
