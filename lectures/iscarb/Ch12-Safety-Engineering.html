dy.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":12,"title":"Safety Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260921-classroom-v3","filename":"Ch12-Safety-Engineering.html","assignment":3,"points":5,"objectives":["Separate hazard, accident and risk.","Explain avoidance, detection/removal and damage limitation.","Read a fault tree and identify its assumptions.","Link a safety requirement to a verification method.","Explain a safety case and the limits of formal/static analysis."],"sections":["12.1 Safety-critical systems","12.2 Safety requirements","12.3 Safety engineering processes","12.4 Safety cases"],"case":{"headline":"The protection claim covers one command. Is that enough?","text":"A fictional teaching controller limits each actuation command to a configured maximum. Its assurance argument covers single-command paths. A proposed deployment introduces repeated commands; no argument for cumulative actuation or loss of sensing is supplied.","question":"What claim is supported, and what additional hazard analysis is needed?","mutation":"The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Safety Engineering","phase":"START","takeaway":"Safety Engineering","full":"<p>Safety Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Safety is not specification conformance","fig":null,"sourceRange":"3–8","bullets":[["Safety","Avoid injury or environmental damage in normal and abnormal operation."],["Primary safety-critical","Controller failure can directly cause hazardous physical behavior."],["Secondary safety-critical","A software failure causes a fault elsewhere with safety consequences."],["Boundary","A reliable implementation of incomplete requirements can still be unsafe."]],"question":"Can a program obey its specification and still be unsafe? Give the missing link.","answer":"Yes. The specification may omit a hazardous condition. Conformance only supports the specified behavior, not every condition of use.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A reliable implementation of incomplete requirements can still be unsafe.","full":"<p><b>Safety.<\/b> Avoid injury or environmental damage in normal and abnormal operation.<\/p><p><b>Primary safety-critical.<\/b> Controller failure can directly cause hazardous physical behavior.<\/p><p><b>Secondary safety-critical.<\/b> A software failure causes a fault elsewhere with safety consequences.<\/p><p><b>Boundary.<\/b> A reliable implementation of incomplete requirements can still be unsafe.<\/p>","sourceStart":3},{"id":"X02","title":"Four ways a reliable system may be unsafe","fig":null,"sourceRange":"9–14","bullets":[["Dormant faults","A rarely activated fault may survive years of ordinary operation."],["Incomplete specification","A critical situation may have no adequate requirement."],["Physical inputs","Failing hardware can produce unexpected sensor or actuator behavior."],["Context","An individually valid command can be unsafe at the wrong time."]],"question":"Which new test would distinguish a missing requirement from faulty implementation?","answer":"First define the hazardous condition and expected safe response. Compare the recorded behavior with that requirement; an absent requirement and a violated requirement are different findings.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"An individually valid command can be unsafe at the wrong time.","full":"<p><b>Dormant faults.<\/b> A rarely activated fault may survive years of ordinary operation.<\/p><p><b>Incomplete specification.<\/b> A critical situation may have no adequate requirement.<\/p><p><b>Physical inputs.<\/b> Failing hardware can produce unexpected sensor or actuator behavior.<\/p><p><b>Context.<\/b> An individually valid command can be unsafe at the wrong time.<\/p>","sourceStart":9},{"id":"X02A","title":"Hazard, accident and risk","fig":null,"sourceRange":"5–14","bullets":[["Not interchangeable","A hazardous condition may exist without an accident occurring."],["Avoid","Design out a class of hazardous conditions."],["Detect / limit","Remove a detected hazard before an accident, or limit the resulting damage."]],"question":"Distinguish the hazard, accident and damage in an unsafe barrier closure.","answer":"Hazard: the occupied zone is not protected. Accident: the moving barrier strikes an object/person. Damage: the resulting loss. This is a fictional analysis, not an incident report.","rows":[["Hazard","Condition with potential to cause or contribute to an accident."],["Accident / damage","Unplanned harmful event / loss resulting from that event."],["Hazard probability / severity","Likelihood of the hazard-creating events / worst possible damage."],["Risk","Assessment considers probability, severity and the hazard-to-accident pathway."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"Remove a detected hazard before an accident, or limit the resulting damage.","full":"<p><b>Not interchangeable.<\/b> A hazardous condition may exist without an accident occurring.<\/p><p><b>Avoid.<\/b> Design out a class of hazardous conditions.<\/p><p><b>Detect / limit.<\/b> Remove a detected hazard before an accident, or limit the resulting damage.<\/p>","sourceStart":5},{"id":"X03","title":"From a hazard to a safety requirement","fig":"ch12_hazardproc","sourceRange":"15–24","bullets":[["Identify","Record hazards and potentially harmful combinations in a hazard register."],["Assess","Prioritize using likelihood, severity and acceptability—not intuition alone."],["Analyze","Work backward from a hazard or forward from possible failures."],["Reduce risk","Derive a specific protective requirement and its verification."]],"question":"Why is “make it safe” not the last step in this process?","answer":"It does not specify a checkable function. State the hazardous condition, required prevention or response, and how the requirement will be verified.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Derive a specific protective requirement and its verification.","full":"<p><b>Identify.<\/b> Record hazards and potentially harmful combinations in a hazard register.<\/p><p><b>Assess.<\/b> Prioritize using likelihood, severity and acceptability—not intuition alone.<\/p><p><b>Analyze.<\/b> Work backward from a hazard or forward from possible failures.<\/p><p><b>Reduce risk.<\/b> Derive a specific protective requirement and its verification.<\/p>","sourceStart":15},{"id":"CHECK1","title":"Checkpoint · distinguish before deciding","fig":null,"sourceRange":"3–24","bullets":[["Think","A sensor is obscured, but the controller continues its specified routine."],["Pair","Separate conformance, hazardous condition and possible accident."],["Record","Write a bounded claim and identify the missing evidence."]],"question":"Does “all routine tests passed” support safe use with the obscured sensor?","answer":"Only the tested conditions are supported. Safe use with an obscured sensor requires a defined protective behavior and relevant evidence.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Write a bounded claim and identify the missing evidence.","full":"<p><b>Think.<\/b> A sensor is obscured, but the controller continues its specified routine.<\/p><p><b>Pair.<\/b> Separate conformance, hazardous condition and possible accident.<\/p><p><b>Record.<\/b> Write a bounded claim and identify the missing evidence.<\/p>","sourceStart":3},{"id":"X04","title":"Risk regions are not universal numeric cut-offs","fig":"ch12_risktri","sourceRange":"21–24","bullets":[["Intolerable","Design to prevent the hazard or prevent it becoming an accident."],["ALARP","Reduce risk as far as reasonably practicable in the source’s framework."],["Acceptable","Still reduce risk where reasonably achievable; it does not mean no action."],["Limits","The source uses contextual judgments; do not invent precise probabilities."]],"question":"What must accompany a claim that a hazard is in the ALARP region?","answer":"The hazard, consequences, evidence or assumptions about likelihood, reduction options and justification for the remaining risk. A label alone is not the argument.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/62fc9035beb3e6fd.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"The source uses contextual judgments; do not invent precise probabilities.","full":"<p><b>Intolerable.<\/b> Design to prevent the hazard or prevent it becoming an accident.<\/p><p><b>ALARP.<\/b> Reduce risk as far as reasonably practicable in the source’s framework.<\/p><p><b>Acceptable.<\/b> Still reduce risk where reasonably achievable; it does not mean no action.<\/p><p><b>Limits.<\/b> The source uses contextual judgments; do not invent precise probabilities.<\/p>","sourceStart":21},{"id":"X05","title":"Read the logic before multiplying probabilities","fig":"ch12_faulttree","sourceRange":"25–30","bullets":[["Top event","Start with the hazardous state and work backward to causes."],["OR gate","Any listed alternative can produce the parent event."],["AND gate","The stated combination is needed for the parent event."],["Assumptions","An AND gate does not by itself establish statistical independence."]],"question":"Two channels share one supply. May their failure probabilities simply be multiplied?","answer":"No independence has been established. The shared supply is a common cause that must be represented or justified before a quantitative calculation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3421e0acd3f7d7c8.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"An AND gate does not by itself establish statistical independence.","full":"<p><b>Top event.<\/b> Start with the hazardous state and work backward to causes.<\/p><p><b>OR gate.<\/b> Any listed alternative can produce the parent event.<\/p><p><b>AND gate.<\/b> The stated combination is needed for the parent event.<\/p><p><b>Assumptions.<\/b> An AND gate does not by itself establish statistical independence.<\/p>","sourceStart":25},{"id":"X06","title":"Make “shall not” implementable","fig":null,"sourceRange":"29–32","bullets":[["Prohibition","Define a specific unacceptable behavior."],["Function","Specify the detection, interlock, suspension or damage-limitation action."],["Traceability","Link each requirement to its hazard and verification activity."],["Balance","Protection that unnecessarily disables useful service also needs justification."]],"question":"Turn “the barrier shall not close on an occupied zone” into a verifiable requirement.","answer":"A proposed requirement identifies how occupancy is detected, what closure command is inhibited and the behavior when detection is unavailable. A test must exercise those conditions, not only normal closure.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Protection that unnecessarily disables useful service also needs justification.","full":"<p><b>Prohibition.<\/b> Define a specific unacceptable behavior.<\/p><p><b>Function.<\/b> Specify the detection, interlock, suspension or damage-limitation action.<\/p><p><b>Traceability.<\/b> Link each requirement to its hazard and verification activity.<\/p><p><b>Balance.<\/b> Protection that unnecessarily disables useful service also needs justification.<\/p>","sourceStart":29},{"id":"X09","title":"Safety assurance is part of development","fig":null,"sourceRange":"33–43","bullets":[["Lifecycle","Maintain hazard analysis, reviews and safety assurance throughout development."],["Control change","Keep requirements, configurations, reviews and test results traceable."],["Responsibility","Name the safety role and the person responsible for each analysis."],["Evidence","A planned review is not an executed review or accepted safety case."]],"question":"What evidence should a changed protection rule leave behind?","answer":"The changed requirement and hazard link, reviewed design, software/configuration version, verification result and responsible reviewer.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A planned review is not an executed review or accepted safety case.","full":"<p><b>Lifecycle.<\/b> Maintain hazard analysis, reviews and safety assurance throughout development.<\/p><p><b>Control change.<\/b> Keep requirements, configurations, reviews and test results traceable.<\/p><p><b>Responsibility.<\/b> Name the safety role and the person responsible for each analysis.<\/p><p><b>Evidence.<\/b> A planned review is not an executed review or accepted safety case.<\/p>","sourceStart":33},{"id":"CHECK2","title":"Checkpoint · mechanism and evidence","fig":null,"sourceRange":"25–43","bullets":[["Think","Compare a software-only check with a separately monitored protective path."],["Pair","Identify one common cause and one cost or usability trade-off."],["Record","Add a mechanism, warrant and remaining uncertainty to the same card."]],"question":"What would falsify your claim of independence?","answer":"A documented shared input, power source, implementation assumption or bypass affecting both paths would weaken or defeat it.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add a mechanism, warrant and remaining uncertainty to the same card.","full":"<p><b>Think.<\/b> Compare a software-only check with a separately monitored protective path.<\/p><p><b>Pair.<\/b> Identify one common cause and one cost or usability trade-off.<\/p><p><b>Record.<\/b> Add a mechanism, warrant and remaining uncertainty to the same card.<\/p>","sourceStart":25},{"id":"R09","title":"A hazard log records a lifecycle, not a list","fig":null,"sourceRange":"33–43","bullets":[["Identify","Give the hazard a stable identifier and a clear consequence."],["Track","Record assessment, controls, owners and outstanding verification."],["Update","Keep changes and their reasons; retain evidence of review."],["Resolve honestly","Do not mark a hazard closed merely because a control is proposed."]],"question":"Which hazard-log entry proves that a proposed control was actually checked?","answer":"A linked executed verification record with version, conditions, outcome and reviewer. The control description alone does not show execution.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Do not mark a hazard closed merely because a control is proposed.","full":"<p><b>Identify.<\/b> Give the hazard a stable identifier and a clear consequence.<\/p><p><b>Track.<\/b> Record assessment, controls, owners and outstanding verification.<\/p><p><b>Update.<\/b> Keep changes and their reasons; retain evidence of review.<\/p><p><b>Resolve honestly.<\/b> Do not mark a hazard closed merely because a control is proposed.<\/p>","sourceStart":33},{"id":"R18","title":"Formal verification and model checking","fig":"ch12_modelcheck","sourceRange":"44–49","bullets":[["Specify","Express a safety property precisely."],["Explore","A model checker examines reachable model states against that property."],["Counterexample","A violating trace shows a path that needs investigation."],["Boundary","An argument about the model still depends on requirements and environmental assumptions."]],"question":"Can checking “no unsafe close command” establish that a physical sensor is accurate?","answer":"No. Sensor behavior must be justified separately or modeled with appropriate failure assumptions.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e3f528dd3c44af94.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"An argument about the model still depends on requirements and environmental assumptions.","full":"<p><b>Specify.<\/b> Express a safety property precisely.<\/p><p><b>Explore.<\/b> A model checker examines reachable model states against that property.<\/p><p><b>Counterexample.<\/b> A violating trace shows a path that needs investigation.<\/p><p><b>Boundary.<\/b> An argument about the model still depends on requirements and environmental assumptions.<\/p>","sourceStart":44},{"id":"D12","title":"Static analysis finds specified classes of problems","fig":null,"sourceRange":"50–53","bullets":[["Characteristic checks","Examples include uninitialized data, unreachable code and inconsistent parameters."],["Custom checks","Rules and assertions can encode application-specific conditions."],["Interpret","A warning is a finding to investigate, not automatic proof of a hazard."],["Limit","A clean report does not prove safe requirements or a safe physical environment."]],"question":"Why combine static analysis with reviews and testing?","answer":"They examine different evidence and failure modes. Analysis is limited by its rules/model; reviews and relevant executions address other parts of the safety argument.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A clean report does not prove safe requirements or a safe physical environment.","full":"<p><b>Characteristic checks.<\/b> Examples include uninitialized data, unreachable code and inconsistent parameters.<\/p><p><b>Custom checks.<\/b> Rules and assertions can encode application-specific conditions.<\/p><p><b>Interpret.<\/b> A warning is a finding to investigate, not automatic proof of a hazard.<\/p><p><b>Limit.<\/b> A clean report does not prove safe requirements or a safe physical environment.<\/p>","sourceStart":50},{"id":"B01","title":"A safety case connects evidence to a bounded claim","fig":"ch12_structarg","sourceRange":"54–63","bullets":[["Claim","State adequately safe operation for a given application and environment."],["Evidence","Use hazard analyses, design records, verification and review results."],["Argument","Explain why the evidence supports this claim, including assumptions."],["System scope","The software case normally contributes to the wider system safety case."]],"question":"Why is a folder of test reports not itself a safety case?","answer":"It lacks the reasoning connecting selected evidence to a specific claim and its operating scope. The reviewer must be able to inspect the links and challenge the assumptions.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/7df5eac7ad160f75.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"The software case normally contributes to the wider system safety case.","full":"<p><b>Claim.<\/b> State adequately safe operation for a given application and environment.<\/p><p><b>Evidence.<\/b> Use hazard analyses, design records, verification and review results.<\/p><p><b>Argument.<\/b> Explain why the evidence supports this claim, including assumptions.<\/p><p><b>System scope.<\/b> The software case normally contributes to the wider system safety case.<\/p>","sourceStart":54},{"id":"X10","title":"Check every path to the unsafe exit","fig":"ch12_safetyarg","sourceRange":"64–70","bullets":[["Exit condition","State the safe result to be established."],["Work backward","Identify all paths reaching the exit."],["Contradiction","Assume an unsafe exit and show how each path contradicts it."],["Scope","A per-command bound does not automatically establish a cumulative bound."]],"question":"What extra claim is needed beyond “each command is below its maximum”?","answer":"Any cumulative, temporal or interacting-command limit must be specified and argued separately. The original single-command argument cannot silently be widened.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e8bc0cb8845159bb.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"A per-command bound does not automatically establish a cumulative bound.","full":"<p><b>Exit condition.<\/b> State the safe result to be established.<\/p><p><b>Work backward.<\/b> Identify all paths reaching the exit.<\/p><p><b>Contradiction.<\/b> Assume an unsafe exit and show how each path contradicts it.<\/p><p><b>Scope.<\/b> A per-command bound does not automatically establish a cumulative bound.<\/p>","sourceStart":64},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound.","bullets":[["Reassess","Explain the effect of the changed constraint."],["Evidence","Name the observation that would defeat the revised claim."],["Ownership","State who reviews and accepts the bounded scope."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role.","nodes":[["Initial claim","Bounded by assumptions"],["New condition","An assumption changes"],["Revised verdict","A reason and next evidence"]],"full":"<p>The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"What claim is supported, and what additional hazard analysis is needed?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test.","no":1,"at":"CHECK1","seconds":180},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case.","pair":"Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design.","no":2,"at":"CHECK2","seconds":180},{"title":"Change the constraint; revise and own","think":"The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; name the responsible role.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X05"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X05","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Fault-tree reasoning and reduction","range":"25–30"},{"title":"Static analysis","range":"50–53"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Safety, criticality and accidents","start":3,"end":14,"units":["X01","X02","X02A","CHECK1"]},{"title":"Hazard-driven requirements and risk","start":15,"end":24,"units":["X03","CHECK1","X04"]},{"title":"Fault trees and risk reduction","start":25,"end":32,"units":["X05","X06","CHECK2"]},{"title":"Safety
