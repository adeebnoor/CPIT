{k:'M00',hero:true,week:'WEEK 04',title:'Safety Engineering',heroA:'Safety',heroB:'Engineering',heroText:'A system can satisfy its functions and still create unacceptable harm. Safety engineering makes hazards, risk, protection and assurance inspectable before human sign-off.',source:'Sommerville, Software Engineering, Chapter 12',task:'Sit down. The safety decision starts in ninety seconds.',timebox:'90 sec',notes:'Use the Chapter 10 rhythm: crisis first, source next, bounded verdict last.'},
{k:'M01',phase:'CRISIS / DECIDE',rule:'RULE 01 · Harm changes the standard',title:'The dose is correct. The context is not.',sub:'A hospital infusion pump calculates the prescribed dose correctly, but a sensor fault can make delivery unsafe. Is the system safe enough to release?',accent:'mag',blocks:[{t:'cards',cols:3,items:[{c:'mag',lab:'FUNCTION',txt:'Dose calculation passes functional tests.'},{c:'sand',lab:'HAZARD',txt:'A sensor or actuator failure can create a dangerous physical state.'},{c:'green',lab:'DECISION',txt:'Release, constrain, hold or demand more evidence?'}]}],task:'Give a provisional verdict before seeing the chapter mechanisms.',timebox:'2 min',learn:'Separate functional correctness from safety.',notes:'Do not define safety yet. Force the room to expose its assumptions.'},
{k:'M02',phase:'MAP / SOURCE SPINE',rule:'RULE 02 · Know the chapter map',title:'What Chapter 12 actually asks you to engineer',sub:'The source moves from safety concepts to hazard-driven requirements, then to safety engineering and assurance.',accent:'teal',blocks:[{t:'viz',kind:'flow',label:'Chapter 12 source spine',source:'Sommerville Ch.12',nodes:[{label:'Safety concepts',sub:'harm · accident · hazard',c:'mag'},{label:'Hazard analysis',sub:'identify · assess · analyse',c:'teal'},{label:'Safety requirements',sub:'protection + shall-not',c:'sand'},{label:'Safety engineering',sub:'fault avoidance + control',c:'violet'},{label:'Safety assurance',sub:'evidence + safety case',c:'green'}]}],task:'Point to the step your first verdict skipped.',timebox:'2 min',learn:'See the whole chapter before details.',notes:'This is the coverage spine. Return to it whenever students lose the story.'},
{k:'M03',phase:'MAP / DISTINGUISH',rule:'RULE 03 · Reliability is not safety',title:'Reliable ≠ safe',sub:'Reliability is about correct service over time. Safety is about avoiding states that cause injury, death or environmental damage.',accent:'sand',blocks:[{t:'compare',left:'Property',right:'Engineering question',rows:[['Reliability','Does the system deliver the specified service correctly over the required period?'],['Safety','Can the system enter or contribute to a hazardous state, even if most functions are reliable?'],['Key relation','A reliable system may still be unsafe; a safe system may tolerate some non-dangerous failures.']]}],task:'Give one failure that hurts reliability but not safety, then one that threatens both.',timebox:'3 min',learn:'Distinguish safety from reliability.',notes:'Use the source distinction explicitly; avoid treating safety as simply “very high reliability”.'},
{k:'M04',phase:'MAP / SOURCE FIGURE',rule:'SOURCE 01 · Safety-critical roles',title:'Primary and secondary safety-critical software',sub:'The source distinguishes software that directly controls hazards from software whose failure indirectly allows unsafe operation.',accent:'teal',blocks:[{t:'viz',kind:'tree',label:'Safety-critical classification',source:'Sommerville Ch.12 · safety-critical systems',root:'SAFETY-CRITICAL SOFTWARE',nodes:[{label:'Primary',sub:'Embedded control whose failure can directly cause a hazard'},{label:'Secondary',sub:'Software that supports or monitors a safety-critical process'}]}],task:'Classify the infusion-pump controller and its maintenance tool.',timebox:'2 min',learn:'Identify primary vs secondary safety criticality.',notes:'Keep the classification concrete: what path connects software failure to harm?'},
{k:'M05',phase:'MAP / BENEFITS',rule:'RULE 04 · Software can increase safety',title:'Why software control can make systems safer',sub:'The source does not frame software only as a hazard; monitoring, protection and error detection can reduce exposure to harm.',accent:'green',blocks:[{t:'cards',cols:4,items:[{c:'teal',lab:'MONITOR',txt:'Observe a wider range of conditions than simple electro-mechanical protection.'},{c:'green',lab:'CONTROL',txt:'Apply protective strategies quickly and consistently.'},{c:'sand',lab:'REDUCE EXPOSURE',txt:'Keep people away from hazardous environments.'},{c:'violet',lab:'CATCH ERROR',txt:'Detect and correct some safety-critical operator errors.'}]}],task:'Which benefit is strongest in the infusion-pump case?',timebox:'2 min',learn:'Explain safety benefits of software control.',notes:'This prevents the simplistic “software causes risk” interpretation.'},
{k:'M06',phase:'MAP / HAZARD PROCESS',rule:'SOURCE 02 · Hazard-driven analysis',title:'Hazard analysis drives the requirements',sub:'Safety requirements are not invented first; they are derived from a disciplined hazard process.',accent:'teal',blocks:[{t:'viz',kind:'flow',label:'Hazard-driven analysis',source:'Sommerville Ch.12 · hazard-driven analysis',nodes:[{label:'Hazard identification',sub:'What can cause harm?',c:'mag'},{label:'Hazard assessment',sub:'How likely / severe?',c:'sand'},{label:'Hazard analysis',sub:'How could it happen?',c:'violet'},{label:'Safety requirements',sub:'What must prevent or control it?',c:'green'}]}],task:'Explain why jumping directly to requirements is risky.',timebox:'3 min',learn:'Use the hazard-driven analysis sequence.',notes:'Treat this as the chapter’s core engineering pipeline.'},
{k:'M07',phase:'MAP / IDENTIFY',rule:'RULE 05 · Hazards are broader than software faults',title:'Name the hazard family before the mitigation',sub:'The source lists multiple hazard types; a complete analysis looks beyond one code defect.',accent:'mag',blocks:[{t:'cards',cols:5,items:[{c:'mag',lab:'PHYSICAL',txt:'Contact, breakage, movement or physical interaction.'},{c:'teal',lab:'ELECTRICAL',txt:'Power loss, interference or electrical failure.'},{c:'violet',lab:'BIOLOGICAL',txt:'Infection, contamination or biological reaction.'},{c:'sand',lab:'SERVICE FAILURE',txt:'Too much, too little, too late or unavailable service.'},{c:'green',lab:'CONTEXT',txt:'Human, environmental and operational conditions.'}]}],task:'Find two different hazard families in the pump scenario.',timebox:'3 min',learn:'Identify diverse hazard types.',notes:'Use the insulin-pump examples from the source to expand student thinking.'},
{k:'M08',phase:'MAP / SOURCE FIGURE',rule:'SOURCE 03 · Risk is two-dimensional',title:'The risk triangle: probability × severity',sub:'Safety assessment combines how likely an event is with how serious its consequences are.',accent:'sand',blocks:[{t:'viz',kind:'matrix',label:'Risk triangle · redrawn for projection',source:'Sommerville Ch.12 · source risk triangle',nodes:[{label:'HIGH SEVERITY + HIGHER PROBABILITY',sub:'Intolerable — must be eliminated or reduced.'},{label:'HIGH SEVERITY + LOW PROBABILITY',sub:'Requires strong control and evidence; “rare” is not automatically acceptable.'},{label:'LOWER SEVERITY + HIGHER PROBABILITY',sub:'May still require mitigation because exposure accumulates.'},{label:'LOWER SEVERITY + LOW PROBABILITY',sub:'May be acceptable if justified and monitored.'}]}],task:'Place one pump hazard in the matrix and defend its position.',timebox:'3 min',learn:'Relate risk probability and severity.',notes:'Stress that exact numbers are often unavailable; relative judgments still need evidence.'},
{k:'M09',phase:'TRADE-OFF / RISK ACCEPTANCE',rule:'SOURCE 04 · ALARP is not “cheap enough”',title:'Three risk regions',sub:'The source distinguishes intolerable risk, ALARP risk and acceptable risk.',accent:'sand',blocks:[{t:'cards',cols:3,items:[{c:'mag',lab:'INTOLERABLE',txt:'The risk must not be allowed to arise or lead to an accident.'},{c:'sand',lab:'ALARP',txt:'Reduce risk as low as reasonably practicable, balancing further reduction against disproportionate cost or difficulty.'},{c:'green',lab:'ACCEPTABLE',txt:'Residual consequences and probability are acceptable; no extra reduction is required.'}]}],task:'Which region needs the most explicit justification—and why?',timebox:'3 min',learn:'Use intolerable, ALARP and acceptable risk categories.',notes:'Do not let ALARP collapse into a casual cost-benefit slogan.'},
{k:'M10',phase:'MAP / CAUSAL ANALYSIS',rule:'SOURCE 05 · Work backward from the accident',title:'Fault trees expose combinations, not just single faults',sub:'A top-level hazard can arise through alternative paths and combinations of lower-level events.',accent:'violet',blocks:[{t:'viz',kind:'tree',label:'Fault-tree logic · redrawn from source',source:'Sommerville Ch.12 · fault-tree analysis',root:'UNSAFE DOSE DELIVERED',nodes:[{label:'Sensor path',sub:'incorrect reading + unchecked input'},{label:'Software path',sub:'control fault or invalid state transition'},{label:'Actuator path',sub:'delivery mismatch not detected'},{label:'Human / process path',sub:'incorrect setup + missing independent check'}]}],task:'Which branch would your original test plan miss?',timebox:'3 min',learn:'Explain fault-tree analysis as causal decomposition.',notes:'The exact source tree is a model of reasoning: top event → contributing causes → control points.'},
{k:'M11',phase:'EVIDENCE / REQUIREMENTS',rule:'RULE 06 · Hazard becomes a requirement',title:'Safety requirements are protection requirements',sub:'The goal is to ensure failures do not cause injury, death or environmental damage; many are explicit “shall not” constraints.',accent:'green',blocks:[{t:'cards',cols:4,items:[{c:'mag',lab:'SHALL NOT',txt:'Define unsafe states or events that must never occur.'},{c:'teal',lab:'CHECK',txt:'Detect conditions before unsafe action proceeds.'},{c:'sand',lab:'RECOVER',txt:'Move to a safe state after detection.'},{c:'green',lab:'PROTECT',txt:'Limit damage when prevention is incomplete.'}]}],task:'Rewrite one vague “be safe” statement as an observable requirement.',timebox:'3 min',learn:'Derive functional safety requirements.',notes:'Require observable, testable language tied to an identified hazard.'},
{k:'M12',phase:'EVIDENCE / PROCESS',rule:'SOURCE 06 · Safety engineering is a process',title:'Design safety into the lifecycle',sub:'The source connects requirements, design, implementation and validation rather than treating safety as a final test.',accent:'teal',blocks:[{t:'viz',kind:'flow',label:'Safety engineering process · redrawn for projection',source:'Sommerville Ch.12 · safety engineering process',nodes:[{label:'Hazard analysis',sub:'identify safety constraints',c:'mag'},{label:'Safety requirements',sub:'define protections',c:'teal'},{label:'System design',sub:'avoid / control faults',c:'sand'},{label:'Implementation',sub:'defensive techniques',c:'violet'},{label:'Validation',sub:'show requirements hold',c:'green'}]}],task:'At which stage is it cheapest to remove a safety problem?',timebox:'3 min',learn:'Describe the safety engineering lifecycle.',notes:'The teaching point is lifecycle integration, not “test safety at the end”.'},
{k:'M13',phase:'EVIDENCE / ASSURANCE',rule:'SOURCE 07 · Assurance is independent evidence',title:'Safety assurance asks: why should anyone believe you?',sub:'Engineering creates protections; assurance assembles evidence that those protections are adequate.',accent:'green',blocks:[{t:'viz',kind:'flow',label:'Safety assurance process · redrawn from source',source:'Sommerville Ch.12 · safety assurance process',nodes:[{label:'Safety requirements',sub:'what must hold',c:'teal'},{label:'Verification',sub:'analysis + test evidence',c:'violet'},{label:'Hazard log',sub:'trace hazards and controls',c:'sand'},{label:'Safety case',sub:'structured claim + evidence',c:'green'}]}],task:'Name one artifact that engineering produces and one that assurance needs.',timebox:'3 min',learn:'Separate safety engineering from safety assurance.',notes:'This is a major chapter distinction and a useful professional-role distinction.'},
{k:'M14',phase:'EVIDENCE / TRACEABILITY',rule:'RULE 07 · Hazards need memory',title:'The hazard log keeps the argument auditable',sub:'A hazard log records identified hazards, status, controls, evidence and outstanding actions across the lifecycle.',accent:'sand',blocks:[{t:'viz',kind:'matrix',label:'Hazard log · projection redraw',source:'Sommerville Ch.12 · hazard log',nodes:[{label:'HAZARD',sub:'What unsafe condition are we tracking?'},{label:'CONTROL',sub:'What prevents, detects or limits it?'},{label:'EVIDENCE',sub:'What shows the control is effective?'},{label:'STATUS / OWNER',sub:'Who closes the gap and what remains open?'}]}],task:'What field would make a hazard log useless if it were missing?',timebox:'2 min',learn:'Explain hazard-log traceability.',notes:'Connect the log to accountability and review, not paperwork.'},
{k:'M15',phase:'EVIDENCE / ANALYSIS',rule:'RULE 08 · Testing alone is not enough',title:'Assurance uses multiple evidence methods',sub:'Safety-critical claims may need static analysis, formal methods, reviews and testing because no single technique sees every failure mode.',accent:'violet',blocks:[{t:'cards',cols:4,items:[{c:'teal',lab:'STATIC ANALYSIS',txt:'Inspect code and structures without executing the system.'},{c:'violet',lab:'FORMAL / MODEL ANALYSIS',txt:'Reason about properties and states mathematically or with models.'},{c:'sand',lab:'REVIEW',txt:'Inspect assumptions, hazards, design and process evidence.'},{c:'green',lab:'TEST',txt:'Exercise behavior and fault handling under realistic conditions.'}]}],task:'Which method finds something a normal functional test may never reveal?',timebox:'3 min',learn:'Recognize complementary safety assurance techniques.',notes:'Keep the answer grounded in method strengths and limits.'},
{k:'M16',phase:'EVIDENCE / SAFETY CASE',rule:'SOURCE 08 · Claim → argument → evidence',title:'A safety case makes the reasoning inspectable',sub:'The source uses a structured argument to connect a safety claim to supporting evidence.',accent:'green',blocks:[{t:'viz',kind:'tree',label:'Safety-case hierarchy · redrawn from source',source:'Sommerville Ch.12 · software safety case / claim hierarchy',root:'TOP SAFETY CLAIM',nodes:[{label:'Subclaim 1',sub:'hazards identified and controlled'},{label:'Subclaim 2',sub:'requirements correctly implemented'},{label:'Subclaim 3',sub:'verification evidence is adequate'},{label:'Subclaim 4',sub:'residual risk is justified'}]}],task:'Which subclaim is weakest in the pump scenario right now?',timebox:'3 min',learn:'Explain structured safety-case argumentation.',notes:'A safety case is not a document dump; it is an explicit argument supported by evidence.'},
{k:'M17',phase:'PRACTISE / FLOW',rule:'RULE 09 · Turn source into judgment',title:'The ISCARB safety flow',sub:'Use the chapter mechanisms in a repeatable professional sequence.',accent:'sand',blocks:[{t:'viz',kind:'flow',label:'Safety decision flow',nodes:[{label:'CRISIS',sub:'What harm is possible?',c:'mag'},{label:'MAP',sub:'hazards + causal paths',c:'teal'},{label:'TRADE-OFF',sub:'risk reduction vs constraints',c:'sand'},{label:'EVIDENCE',sub:'requirements + assurance',c:'violet'},{label:'VERDICT',sub:'bounded human sign-off',c:'green'}]}],task:'Retell the pump case using all five verbs.',timebox:'3 min',learn:'Apply the common ISCARB flow to safety.',notes:'This is the bridge back to the Chapter 10 master pattern.'},
{k:'M18',phase:'PRACTISE / FIT',rule:'RULE 10 · Name what fits',title:'FIT: choose the safety mechanism',sub:'Your mechanism must fit the hazard, not merely sound sophisticated.',accent:'teal',blocks:[{t:'cards',cols:2,items:[{c:'teal',lab:'FIT',txt:'Which safety mechanism best addresses the dominant hazard?',field:{id:'dc_fit',rows:3,ph:'The best-fitting mechanism is…'}},{c:'sand',lab:'WHY',txt:'What source concept makes that choice defensible?'}]}],task:'Write one mechanism and one source-grounded reason.',timebox:'3 min',learn:'Select a fitting safety mechanism.',notes:'Push students beyond “more testing”.'},
{k:'M19',phase:'TRADE-OFF / BOUND',rule:'RULE 11 · Every safety decision has a boundary',title:'BOUND: state when your assurance stops being enough',sub:'A safety claim must be reopened when assumptions, environment, interfaces or evidence change.',accent:'mag',blocks:[{t:'cards',cols:2,items:[{c:'mag',lab:'BOUNDARY',txt:'This decision remains valid only while…',field:{id:'dc_bound',rows:3,ph:'This decision remains valid only while…'}},{c:'violet',lab:'REOPEN TRIGGER',txt:'Name one observable change that forces re-analysis.'}]}],task:'State a boundary that another engineer can actually observe.',timebox:'3 min',learn:'Bound safety assurance claims.',notes:'Vague boundaries are not boundaries.'},

{k:'M22',phase:'VERDICT / COUNTER-EVIDENCE',rule:'RULE 14 · State what could prove you wrong',title:'Counter-evidence before confidence',sub:'A defensible verdict names the observation that would force reversal.',accent:'violet',blocks:[{t:'cards',cols:2,items:[{c:'mag',lab:'COUNTER-EVIDENCE',txt:'I would reverse this decision if…',field:{id:'dc_counter',rows:3,ph:'I would reverse this decision if…'}},{c:'violet',lab:'UNCERTAINTY',txt:'The strongest unresolved uncertainty is…',field:{id:'dc_uncert',rows:3,ph:'The strongest uncertainty is…'}}]}],task:'Write one reversal trigger and one uncertainty.',timebox:'3 min',learn:'Expose counter-evidence and uncertainty.',notes:'This is what prevents false certainty in safety engineering.'},
{k:'M23',phase:'VERDICT / HUMAN SIGN-OFF',rule:'RULE 15 · Human sign-off is bounded',title:'Final safety verdict',sub:'The verdict must state action, evidence, residual risk and boundary.',accent:'green',blocks:[{t:'cards',cols:2,items:[{c:'green',lab:'VERDICT',txt:'Proceed, constrain, hold or investigate?',field:{id:'dc_verdict',rows:3,ph:'My bounded verdict is…'}},{c:'sand',lab:'JUSTIFICATION',txt:'What chapter evidence most changed or confirmed your first view?'}]}],task:'Prepare to defend the verdict in sixty seconds.',timebox:'4 min',learn:'Make a bounded safety sign-off.',notes:'Close the loop to the opening crisis.'},
{k:'M24',phase:'VERDICT / RETRIEVAL',rule:'RULE 16 · Retrieve, do not reread',title:'One-minute retrieval',sub:'If the source is now usable knowledge, you can reconstruct it without the slide.',accent:'green',blocks:[{t:'cards',cols:4,items:[{c:'mag',lab:'HAZARD',txt:'Name the four-step hazard-driven analysis.'},{c:'sand',lab:'RISK',txt:'Distinguish intolerable, ALARP and acceptable.'},{c:'violet',lab:'ASSURANCE',txt:'Name two evidence techniques.'},{c:'green',lab:'CASE',txt:'Explain claim → argument → evidence.'}]}],task:'Answer all four aloud with notes closed.',timebox:'60 sec',learn:'Retrieve the chapter’s core mechanisms.',notes:'Use misses as feed-forward, not as another mini-lecture.'},
