</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261003-fit-v1"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 12</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch12-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":12,"title":"Safety Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch12-Safety-Engineering.html","assignment":3,"points":5,"objectives":["Separate hazard, accident and risk.","Explain avoidance, detection/removal and damage limitation.","Read a fault tree and identify its assumptions.","Link a safety requirement to a verification method.","Explain a safety case and the limits of formal/static analysis."],"sections":["12.1 Safety-critical systems","12.2 Safety requirements","12.3 Safety engineering processes","12.4 Safety cases"],"case":{"headline":"The protection claim covers one command. Is that enough?","text":"A fictional teaching controller limits each actuation command to a configured maximum. Its assurance argument covers single-command paths. A proposed deployment introduces repeated commands; no argument for cumulative actuation or loss of sensing is supplied.","question":"What claim is supported, and what additional hazard analysis is needed?","mutation":"The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound. The repeated sequences come from the AI assistant, which found that many small commands raise throughput.","lens":"The deployment also adds a vendor’s AI assistant that proposes actuation sequences to maximise throughput. Every command it proposed in the pilot passed the per-command limiter, and operators now accept its sequences without editing. Hold that question: after the safety-case slides, one slide shows how this chapter’s methods apply to the assistant."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Safety Engineering","phase":"START","takeaway":"Safety Engineering","full":"<p>Safety Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Safety is not specification conformance","fig":null,"sourceRange":"3–8","bullets":[["Safety","Avoid injury or environmental damage in normal and abnormal operation."],["Primary safety-critical","Controller failure can directly cause hazardous physical behavior."],["Secondary safety-critical","A software failure causes a fault elsewhere with safety consequences."],["Boundary","A reliable implementation of incomplete requirements can still be unsafe."]],"question":"Can a program obey its specification and still be unsafe? Give the missing link.","answer":"Yes. The specification may omit a hazardous condition. Conformance only supports the specified behavior, not every condition of use.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Safety asks whether the system can cause harm, not whether it meets its specification.","full":"<p>Sommerville defines safety as a system’s ability to operate, normally or abnormally, without danger of causing injury or death and without damaging its environment. Reliability asks a different question: does the system deliver its specified service? Reliability and availability are therefore necessary for safety but not sufficient—a program can conform perfectly to a specification that forgot a hazardous situation.<\/p><p>Safety-critical software comes in two kinds. In a <b>primary<\/b> safety-critical system, such as the insulin pump controller, a software failure can make the hardware threaten people directly. In a <b>secondary<\/b> one, such as the Mentcare patient-record system, a failure misleads people or other systems—for example, by supporting an inappropriate treatment decision.<\/p><p>In our case the controller does exactly what its single-command limit says. Whether that is safe depends on hazards the specification may not mention, such as a long run of repeated commands.<\/p>","sourceStart":3,"notes":"Ask the room whether a system that passes every test can still hurt someone, and wait for the missing link—an incomplete specification—before revealing it. Keep primary and secondary safety-critical systems distinct: students often label every medical system “primary”. Use the controller case: it meets its per-command specification, and the question is what that specification left out."},{"id":"X02","title":"Four ways a reliable system may be unsafe","fig":null,"sourceRange":"9–14","bullets":[["Dormant faults","A rarely activated fault may survive years of ordinary operation."],["Incomplete specification","A critical situation may have no adequate requirement."],["Physical inputs","Failing hardware can produce unexpected sensor or actuator behavior."],["Context","An individually valid command can be unsafe at the wrong time."]],"question":"Which new test would distinguish a missing requirement from faulty implementation?","answer":"First define the hazardous condition and expected safe response. Compare the recorded behavior with that requirement; an absent requirement and a violated requirement are different findings.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A reliable system can still be unsafe in four different ways, and each needs a different check.","full":"<p>The chapter lists four reasons why a system that works as specified can still cause an accident:<\/p><ul><li><b>Dormant faults<\/b> can remain unexercised for years and appear only under rare conditions, so a long clean record is not proof of safety.<\/li><li><b>Specification errors<\/b>: if a requirement is wrong or missing, the system behaves as specified and still causes harm.<\/li><li><b>Hardware failures<\/b> can feed spurious inputs to the software; these are hard to anticipate when the specification is written.<\/li><li><b>Context-sensitive commands<\/b>: the right command issued at the wrong time—often an operator slip—can be dangerous.<\/li><\/ul><p>Each cause needs its own check: fault-revealing tests for dormant faults, a hazard review of the requirements, plausibility checks on inputs, and interlocks that consider timing and state. In our case, a stream of individually valid commands is a context problem that no single-command test can reveal.<\/p>","sourceStart":9,"notes":"Give each pair one of the four causes and ask for an example from the controller case. Listen for “test more” as the answer to all four; only dormant faults are mainly a testing problem. The context-sensitive case is the one the story will return to."},{"id":"X02A","title":"Hazard, accident and risk","fig":null,"sourceRange":"5–14","bullets":[["Not interchangeable","A hazardous condition may exist without an accident occurring."],["Avoid","Design out a class of hazardous conditions."],["Detect / limit","Remove a detected hazard before an accident, or limit the resulting damage."]],"question":"Distinguish the hazard, accident and damage in an unsafe barrier closure.","answer":"Hazard: the occupied zone is not protected. Accident: the moving barrier strikes an object/person. Damage: the resulting loss. This is a fictional analysis, not an incident report.","rows":[["Hazard","Condition with potential to cause or contribute to an accident."],["Accident / damage","Unplanned harmful event / loss resulting from that event."],["Hazard probability / severity","Likelihood of the hazard-creating events / worst possible damage."],["Risk","Assessment considers probability, severity and the hazard-to-accident pathway."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"A hazard is a condition; an accident is the harm. Safety engineering breaks the path between them.","full":"<p>The chapter’s safety terminology separates ideas that are easy to blur. A <b>hazard<\/b> is a condition with the potential to cause or contribute to an accident—a stuck valve, an incorrect navigation computation, a missed allergy warning. An <b>accident<\/b> (or mishap) is the unplanned event that actually causes death, injury or damage, and <b>damage<\/b> measures that loss. <b>Hazard severity<\/b> is the worst damage a hazard could cause; <b>hazard probability<\/b> is the chance that the events creating it occur. <b>Risk<\/b> combines both with the chance that the hazard leads to an accident.<\/p><p>Hazards do not inevitably become accidents. The chapter names three ways to intervene: <b>avoid<\/b> the hazard by design, <b>detect and remove<\/b> it before harm occurs, or <b>limit the damage<\/b> if an accident happens. Because accidents in complex systems usually come from combinations of failures, designs normally use more than one of these strategies.<\/p>","sourceStart":5,"notes":"Draw the chain hazard → accident → damage on the board and place the three strategies at the arrows. Ask where our controller’s repeated commands sit: they are a hazardous condition before any harm occurs. The barrier example in the prompt is also the assignment warm-up, so keep the vocabulary identical."},{"id":"X03","title":"From a hazard to a safety requirement","fig":"ch12_hazardproc","sourceRange":"15–24","bullets":[["Identify","Record hazards and potentially harmful combinations in a hazard register."],["Assess","Prioritize using likelihood, severity and acceptability—not intuition alone."],["Analyze","Work backward from a hazard or forward from possible failures."],["Reduce risk","Derive a specific protective requirement and its verification."]],"question":"Why is “make it safe” not the last step in this process?","answer":"It does not specify a checkable function. State the hazardous condition, required prevention or response, and how the requirement will be verified.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Safety requirements come from a hazard-driven process: identify, assess, analyse, then specify.","full":"<p>Safety requirements are derived from hazards rather than from features. The chapter’s process has four stages:<\/p><ol><li><b>Hazard identification<\/b>—list physical, electrical, biological and service-failure hazards. For the insulin pump these include overdose, underdose, battery failure and electrical interference.<\/li><li><b>Hazard assessment<\/b>—judge how likely and how severe each hazard is, and classify it as intolerable, ALARP or acceptable.<\/li><li><b>Hazard analysis<\/b>—find root causes, working backward from the hazard (for example with a fault tree) or forward from possible failures.<\/li><li><b>Risk reduction<\/b>—specify requirements that avoid the hazard, detect and remove it, or limit the damage.<\/li><\/ol><p>Many of the resulting requirements are “shall not” statements that define events that must never occur. Each requirement should keep a link to the hazard that produced it, so that a reviewer can check the hazard is covered.<\/p>","sourceStart":15,"notes":"Walk the four stages once with the insulin pump, then once with our controller. “Make it safe” fails as a requirement because nobody can verify it; insist on a checkable function and a named verification. This is also the moment to introduce the hazard log that later slides rely on."},{"id":"CHECK1","title":"Checkpoint · distinguish before deciding","fig":null,"sourceRange":"3–24","bullets":[["Think","A sensor is obscured, but the controller continues its specified routine."],["Pair","Separate conformance, hazardous condition and possible accident."],["Record","Write a bounded claim and identify the missing evidence."]],"question":"Does “all routine tests passed” support safe use with the obscured sensor?","answer":"Only the tested conditions are supported. Safe use with an obscured sensor requires a defined protective behavior and relevant evidence.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Passing the routine tests supports only the conditions those tests covered.","full":"<p>Use this check to separate three things students often merge: <b>conformance<\/b> (the controller follows its specification), the <b>hazardous condition<\/b> (the sensor is obscured, so the zone may be occupied without being seen) and the possible <b>accident<\/b> (an actuator moves into a person or object). “All routine tests passed” is evidence about conformance under tested conditions. It says nothing about behaviour when a sensor is obscured, unless a test exercised exactly that condition.<\/p><p>A bounded claim names what the evidence covers, the condition that is still untested, and the protective behaviour that would be required—for example, entering a safe state when sensing is lost.<\/p>","sourceStart":3,"notes":"Think for 30 seconds, then pair. Collect two claims and ask the class which one another engineer could check. Reward claims that name the untested condition explicitly."},{"id":"X04","title":"Risk regions are not universal numeric cut-offs","fig":"ch12_risktri","sourceRange":"21–24","bullets":[["Intolerable","Design to prevent the hazard or prevent it becoming an accident."],["ALARP","Reduce risk as far as reasonably practicable in the source’s framework."],["Acceptable","Still reduce risk where reasonably achievable; it does not mean no action."],["Limits","The source uses contextual judgments; do not invent precise probabilities."]],"question":"What must accompany a claim that a hazard is in the ALARP region?","answer":"The hazard, consequences, evidence or assumptions about likelihood, reduction options and justification for the remaining risk. A label alone is not the argument.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/62fc9035beb3e6fd.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"Classify each risk as intolerable, ALARP or acceptable, and justify the class with evidence.","full":"<p>The risk triangle divides risks into three regions. <b>Intolerable<\/b> risks, typically those that threaten life, must be designed out or detected before they cause an accident. <b>ALARP<\/b> (as low as reasonably practical) risks are reduced as far as cost and schedule reasonably allow. <b>Acceptable<\/b> risks usually lead to minor damage; the textbook still asks designers to reduce them when doing so does not significantly increase cost, delivery time or other qualities.<\/p><p>Where the boundaries lie is a social and political judgment, and societies have become less willing to accept risk over time. Because accidents are rare, engineers usually estimate probability and severity with relative terms such as “unlikely” or “very high” rather than precise numbers. A claim that a hazard is in the ALARP region must therefore state the consequences, the assumptions about likelihood, the reduction options that were considered and why the remaining risk is justified.<\/p>","sourceStart":21,"notes":"Ask one group to argue that repeated actuation is ALARP and another that it is intolerable. The useful outcome is the list of evidence each side needs, not a winner. Stop anyone who invents a probability; the chapter itself warns that estimates are relative."},{"id":"X05","title":"Read the logic before multiplying probabilities","fig":"ch12_faulttree","sourceRange":"25–30","bullets":[["Top event","Start with the hazardous state and work backward to causes."],["OR gate","Any listed alternative can produce the parent event."],["AND gate","The stated combination is needed for the parent event."],["Assumptions","An AND gate does not by itself establish statistical independence."]],"question":"Two channels share one supply. May their failure probabilities simply be multiplied?","answer":"No independence has been established. The shared supply is a common cause that must be represented or justified before a quantitative calculation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3421e0acd3f7d7c8.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"A fault tree works backward from a hazard; its gates show logic, not statistical independence.","full":"<p>Fault-tree analysis is a deductive, top-down technique. You place the hazard at the root and ask which conditions could cause it, linking causes with <b>OR<\/b> gates (any one is enough) or <b>AND<\/b> gates (all are needed). For the insulin pump, an incorrect dose can come from an incorrect sugar measurement, a delivery failure or a dose at the wrong time; the software root causes are algorithm errors and arithmetic errors.<\/p><p>A key goal is to minimise single causes of failure: a hazard reachable through OR gates alone has no redundancy. Be careful with numbers. Multiplying branch probabilities at an AND gate assumes the branches are independent, and a shared power supply, shared input or shared design assumption breaks that assumption. The tree shows the logic; independence has to be argued separately.<\/p>","sourceStart":25,"notes":"Build a three-level tree for our controller on the board: exceeding the cumulative limit ← repeated commands AND no cumulative check. Then ask what happens to the AND gate if both checks read the same sensor. The misconception to catch is that an AND gate proves independence."},{"id":"X06","title":"Make “shall not” implementable","fig":null,"sourceRange":"29–32","bullets":[["Prohibition","Define a specific unacceptable behavior."],["Function","Specify the detection, interlock, suspension or damage-limitation action."],["Traceability","Link each requirement to its hazard and verification activity."],["Balance","Protection that unnecessarily disables useful service also needs justification."]],"question":"Turn “the barrier shall not close on an occupied zone” into a verifiable requirement.","answer":"A proposed requirement identifies how occupancy is detected, what closure command is inhibited and the behavior when detection is unavailable. A test must exercise those conditions, not only normal closure.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Turn each “shall not” into a checkable function, linked to its hazard and its verification.","full":"<p>The chapter’s insulin pump requirements show how hazards become requirements. SR1 limits a single dose to a specified maximum; SR2 limits the daily cumulative dose. SR3 requires a hardware diagnostic at least four times per hour, and SR4 requires an exception handler for every identified exception. Note that SR2 exists because SR1 alone cannot prevent many acceptable single doses from adding up to an overdose—the same gap as in our case.<\/p><p>A “shall not” requirement becomes implementable when it names the unacceptable event, the detection or interlock mechanism, and the behaviour when detection is unavailable. It also needs a verification activity and a link back to its hazard. Protection has a cost: a check that disables useful service too often needs its own justification, because operators may learn to bypass it.<\/p>","sourceStart":29,"notes":"Point out SR1 and SR2 side by side before the class writes its own requirement: the textbook already contains the cumulative lesson of our story. Ask for the behaviour when the sensor is unavailable; most first drafts forget it."},{"id":"X09","title":"Safety assurance and the hazard log","fig":null,"sourceRange":"33–43","bullets":[["Lifecycle","Maintain hazard analysis, reviews and safety assurance throughout development."],["Control change","Keep requirements, configurations, reviews and test results traceable."],["Track","Record assessment, controls, owners and outstanding verification."],["Resolve honestly","Do not mark a hazard closed merely because a control is proposed."]],"question":"(1) Which hazard-log entry proves that a proposed control was actually checked? (2) What evidence should a changed protection rule leave behind?","answer":"(1) A linked executed verification record with version, conditions, outcome and reviewer. The control description alone does not show execution. (2) The changed requirement and hazard link, reviewed design, software/configuration version, verification result and responsible reviewer.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A hazard stays open until executed, recorded evidence shows its control works.","full":"<p>Safety engineering processes build on reliability processes: a plan-based approach with reviews at each stage, plus explicit identification and tracking of hazards. Regulators may ask for evidence that such a process was followed, including the specification, records of checks on it, and the results of verification and validation.<\/p><p>The chapter lists typical safety activities: a hazard logging and monitoring system, project safety engineers with explicit responsibility, extensive safety reviews, certification of critical components and detailed configuration management. The <b>hazard log<\/b> records each hazard, its analysis, the controls chosen and who is responsible. A hazard is not closed because a control has been proposed; it is closed when a linked, executed verification record—with version, conditions, result and reviewer—shows that the control works. Personal responsibility matters because accidents can lead to legal inquiries.<\/p><p>Agile methods are rarely used for safety-critical systems because regulation needs extensive documentation and a complete safety analysis, although practices such as test-driven development can still be used.<\/p>","sourceStart":33,"notes":"Show a filled hazard-log entry and ask which field proves the control was checked. Many students will point to the control description. Link this to the assignment: evidence must be marked as executed or proposed."},{"id":"CHECK2","title":"Checkpoint · mechanism and evidence","fig":null,"sourceRange":"25–43","bullets":[["Think","Compare a software-only check with a separately monitored protective path."],["Pair","Identify one common cause and one cost or usability trade-off."],["Record","Add a mechanism, warrant and remaining uncertainty to the same card."]],"question":"What would falsify your claim of independence?","answer":"A documented shared input, power source, implementation assumption or bypass affecting both paths would weaken or defeat it.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Independence is a claim: name what could make both protection paths fail together.","full":"<p>Compare a software-only check inside the controller with a separately monitored protective path. The separate path is stronger only if it does not share the controller’s weaknesses. A shared sensor, shared power supply, shared configuration file or a common bypass would let one fault defeat both paths. A good answer names the mechanism, explains why it addresses the hazard (the warrant), and records the uncertainty—what has not yet been shown about independence.<\/p>","sourceStart":25,"notes":"Ask each pair for one shared cause and one cost or usability trade-off. If a pair claims full independence, ask what evidence would falsify it."},{"id":"R18","title":"Formal verification and model checking","fig":"ch12_modelcheck","sourceRange":"44–49","bullets":[["Specify","Express a safety property precisely."],["Explore","A model checker examines reachable model states against that property."],["Counterexample","A violating trace shows a path that needs investigation."],["Boundary","An argument about the model still depends on requirements and environmental assumptions."]],"question":"Can checking “no unsafe close command” establish that a physical sensor is accurate?","answer":"No. Sensor behavior must be justified separately or modeled with appropriate failure assumptions.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e3f528dd3c44af94.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"A proof or model check covers the model; the specification and the environment still need evidence.","full":"<p>Formal methods use a mathematical specification. Writing one forces a detailed analysis of the requirements, which uncovers errors and omissions; a proof can then show that a program conforms to its specification. <b>Model checking<\/b> builds a finite-state model and explores every reachable path, checking that a stated property holds on each. It is especially valuable for concurrent systems, where race conditions and deadlocks are hard to find by testing, and a violating path is returned as a counterexample.<\/p><p>The chapter is clear that formal methods cannot guarantee safety. The specification may not reflect what users need; users rarely understand the notation well enough to spot omissions; proofs can contain errors; and the proof may assume the system is used in a way it is not. A model check of “no unsafe command” therefore says nothing about whether a physical sensor is accurate unless the model includes its failure modes.<\/p>","sourceStart":44,"notes":"Ask what a counterexample would look like for our cumulative limit: a sequence of small commands whose total crosses the bound. Then ask which real-world assumption the model cannot establish. Expect “the sensor works” and “commands only come from the controller”."},{"id":"D12","title":"Static analysis finds specified classes of problems","fig":null,"sourceRange":"50–53","bullets":[["Characteristic checks","Examples include uninitialized data, unreachable code and inconsistent parameters."],["Custom checks","Rules and assertions can encode application-specific conditions."],["Interpret","A warning is a finding to investigate, not automatic proof of a hazard."],["Limit","A clean report does not prove safe requirements or a safe physical environment."]],"question":"Why combine static analysis with reviews and testing?","answer":"They examine different evidence and failure modes. Analysis is limited by its rules/model; reviews and relevant executions address other parts of the safety argument.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Static analysis finds defined classes of code problems; it cannot confirm the requirements are right.","full":"<p>Static analysers parse program text without running it and flag potentially erroneous conditions for the verification team. The chapter describes three levels: <b>characteristic error checking<\/b> finds patterns typical of mistakes in a language (uninitialised variables, unreachable code, inconsistent parameters); <b>user-defined error checking<\/b> adds project-specific rules; and <b>assertion checking<\/b> tests formal assertions written into the program.<\/p><p>Static analysis is particularly valuable for weakly typed languages such as C and for security problems like buffer overflows and unchecked inputs, and it checks all of the code, not only the parts a test happened to run. It supplements inspections rather than replacing them. A clean report shows the absence of the checked fault classes in the analysed code; it does not show that the safety requirements are complete or that the physical environment behaves as assumed.<\/p>","sourceStart":50,"notes":"Ask which of our hazards a static analyser could find. It can catch an unchecked input or an overflow in the running total, but not a missing cumulative requirement. That contrast prepares the safety-case slide."},{"id":"B01","title":"A safety case connects evidence to a bounded claim","fig":"ch12_structarg","sourceRange":"54–63","bullets":[["Claim","State adequately safe operation for a given application and environment."],["Evidence","Use hazard analyses, design records, verification and review results."],["Argument","Explain why the evidence supports this claim, including assumptions."],["System scope","The software case normally contributes to the wider system safety case."]],"question":"Why is a folder of test reports not itself a safety case?","answer":"It lacks the reasoning connecting selected evidence to a specific claim and its operating scope. The reviewer must be able to inspect the links and challenge the assumptions.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/7df5eac7ad160f75.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"A safety case is an argument: claims, evidence and the reasoning that connects them.","full":"<p>A safety case is a documented body of evidence that provides a convincing and valid argument that a system is adequately safe for a given application in a given environment. Regulators normally require one before a system can be certified, and they negotiate its content with the developers. A software safety case is usually one part of a wider system safety case that also covers hardware and operational issues.<\/p><p>Safety cases are built from structured arguments: a claim, the evidence for it, and the argument explaining why the evidence justifies the claim. In the insulin pump example, the claim that a single dose never exceeds MaxDose rests on a safety argument, 400 test runs in which the dose was computed correctly, and a static-analysis report with no relevant anomalies. Claims form a hierarchy, and lower-level claims support higher ones. A folder of test reports is not a safety case because it lacks the reasoning and the scope.<\/p>","sourceStart":54,"notes":"Write the insulin pump claim on the board and ask which evidence would still hold if the single-dose argument were extended to repeated doses. None of it does automatically—that is the bridge to the next slide."},{"id":"X10","title":"Check every path to the unsafe exit","fig":"ch12_safetyarg","sourceRange":"64–70","bullets":[["Exit condition","State the safe result to be established."],["Work backward","Identify all paths reaching the exit."],["Contradiction","Assume an unsafe exit and show how each path contradicts it."],["Scope","A per-command bound does not automatically establish a cumulative bound."]],"question":"What extra claim is needed beyond “each command is below its maximum”?","answer":"Any cumulative, temporal or interacting-command limit must be specified and argued separately. The original single-command argument cannot silently be widened.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e8bc0cb8845159bb.jpg","caption":"Sommerville Ch.12 · preserved source illustration","takeaway":"A safety argument checks every path to the exit; a per-command bound says nothing about the total.","full":"<p>Safety arguments are weaker than correctness proofs: they aim to show only that the program cannot reach an unsafe state. The method in the chapter is proof by contradiction. Establish the safe exit condition, work backward from the end of the code to find every path that leads to the exit, assume the exit condition is false, and show that the assignments on each path contradict that assumption.<\/p><p>In the insulin dose computation, every path through the final checks either sets the dose to zero, sets it to maxDose or leaves a value already between the minimum and the maximum, so no path can deliver more than maxDose. The argument covers exactly the property it states. Showing that each single dose is bounded does not show that a series of doses stays within a cumulative limit; that needs its own requirement and its own argument.<\/p>","sourceStart":64,"notes":"Trace one path of the dose code with the class, then ask what a cumulative argument would need to track across calls. This is the textbook’s version of our story, so let students discover the gap before the AI slide."},{"id":"AISYS","title":"Read the log: where did safety leak?","phase":"LEARN","skin":"genai","banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · READ THE LOG","caption":"No command broke a rule. The rule that mattered was never written—and an optimiser found the gap."},"takeaway":"Every command passed its check. The cumulative value still left the modeled limit.","fullTable":false,"bullets":[["Spot the gap","Which requirement was never written?"],["Place the check","Where must it run so that no source can bypass it?"],["Test the checker","What must it see, and what if sensing is lost?"]],"question":"Write the missing safety requirement and one verification that remains valid even if the assistant is wrong.","answer":"Requirement: the controller shall reject any command that would take cumulative actuation within a stated window above the modeled limit, whatever proposed the command; on loss of sensing, it shall enter a defined safe state and accept no AI-proposed sequence until sensing is restored. Verification: test and, where feasible, model-check sequences of many small commands—including sequences generated specifically to probe the bound—and loss-of-sensing cases; record version, conditions and reviewer in the hazard log. Neither depends on the assistant’s correctness, but both depend on the checker seeing every command and on its own sensing, which the hazard analysis must cover. The window and limit shown are illustrative.","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source methods to an AI component","notes":"Allow about 6 minutes. Format: read the log. Ask pairs to find the first row where the plant is unsafe and explain why every check still passed. New terms, at most two: specification gaming and runtime monitor. Values are illustrative. Everything else in Full explanation is optional depth and is not assessed.","full":"<p>This slide is course-added. The log is illustrative: each command satisfies the per-command bound, yet the running total crosses the modeled limit at C3.<\/p><h3>How the slide uses the five objectives<\/h3><p>Hazard versus accident: a plausible but unsafe sequence is a hazardous condition before any harm occurs. Avoid, detect, limit: bound what can be commanded and detect unsafe sequences. Fault trees: see below. Requirements: state the cumulative limit and trace it to verification. Safety cases: argue from the independent check and its evidence, treating the assistant as an untrusted source of commands.<\/p><p><b>Specification gaming.<\/b> A system optimising an objective can satisfy the letter of its constraints while defeating their purpose. No intention or malfunction is required; a gap in the specification is enough. It is the chapter’s ‘incomplete specification’ cause, made more likely by an optimiser that searches the space of allowed actions.<\/p><p><b>Runtime monitor.<\/b> A simple component, separate from the AI, checks every command against stated safety limits and blocks violations. Because it is small and deterministic it is easier to review, test and, where feasible, formally verify. It protects only what it can observe: it must see every command path, and its own sensing and failure modes belong in the hazard analysis.<\/p><p><b>Fault-tree leaves for a learned component.<\/b> A leaf such as ‘assistant proposes an unsafe sequence’ has no justified probability that can simply be multiplied with other leaves: its likelihood depends on the inputs and on what the optimiser has learned, not on a random-failure rate. Design the tree so the top event also requires the monitor to fail, and state any number used as an assumption with its evidence.<\/p><p><b>Hazard log.<\/b> Record the model version as configuration; a model update is a change that reopens the relevant hazards.<\/p><p class=\"small\">The case is course-created. Optional further reading: ISO 21448 (safety of the intended functionality, for road vehicles) addresses hazards arising from functional insufficiencies without a system fault.<\/p>","sourceStart":1,"heads":["CMD","SOURCE","VALUE","CHECK ≤ 5","TOTAL · LIMIT 10"],"rows":[["C1","Assistant","4","Pass","4"],["C2","Assistant","4","Pass","8"],["C3","Assistant","3","Pass","11 · over"],["C4","Assistant","4","Pass","15 · over"]]},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Passing every check is not staying within the limit.","bullets":[["New information","Repeated small commands from the AI assistant exceed the cumulative limit."],["Reassess","The safety argument covered single commands only."],["Revise","Add a cumulative requirement enforced outside the assistant."],["Own","Name who accepts the scope and informs the operators."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. The cumulative limit must hold whatever proposes the commands; until it is specified and verified, restrict or withdraw AI-proposed sequences and tell the operators why.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Keep the three revision steps visible: new information, reassessment and revised decision with an owner. Accept any bounded decision that is enforced outside the assistant; reject answers that ask the assistant to “be more careful”."},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What claim is supported, and what additional hazard analysis is needed? Does the assistant’s clean pilot record count?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the given facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. The assistant’s clean pilot record shows only that its commands passed the per-command check; it says nothing about cumulative actuation or loss of sensing, which the argument never covered.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, a software-only check inside the controller, or a separately monitored protective path that ignores the assistant’s reasoning.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. A protective path that checks every command against stated limits, whatever its source, does not depend on the assistant being right; a check that trusts the assistant’s own plan shares its blind spot.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"The repeated-command mode permits a cumulative value beyond the modeled limit while each individual command remains within its bound. The repeated sequences come from the AI assistant, which found that many small commands raise throughput.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. An optimiser rewarded for throughput exploited the limit that was never stated. The fix is a cumulative requirement enforced outside the assistant, with its own verification, not a request that the assistant behave.","note":"Classroom version only: the assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["X05"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["X05","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Fault-tree reasoning and reduction","range":"25–30"},{"title":"Static analysis","range":"50–53"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Safety, criticality and accidents","start":3,"end":14,"units":["X01","X02","X02A","CHECK1"]},{"title":"Hazard-driven requirements and risk","start":15,"end":24,"units":["X03","CHECK1","X04"]},{"title":"Fault trees and risk reduction","start":25,"end":32,"units":["X05","X06","CHECK2"]},{"title":"Safety processes, logs and reviews","start":33,"end":43,"units":["X09","CHECK2"]},{"title":"Formal methods and static analysis","start":44,"end":53,"units":["R18","D12"]},{"title":"Safety cases and structured arguments","start":54,"end":70,"units":["B01","X10"]}],"sourceCount":70,"original":"sources/Ch12-Original.pptx","textbook":"sources/Ch12-Textbook.pdf","bookPages":34,"quiz":[{"q":"An exposed moving mechanism could injure a person. Before any injury occurs, this is best described as:","options":["An accident, because harm is now possible","A hazard: a condition that could lead to an accident","A system failure, because the design is defective"],"answer":1,"why":"A hazard is a condition with the potential to cause an accident; the accident is the harmful event itself."},{"q":"Physically preventing a dangerous state from arising is an example of:","options":["Hazard avoidance","Hazard detection and removal","Damage limitation"],"answer":0,"why":"Avoidance designs the system so that the hazard cannot arise; detection removes it before an accident; damage limitation reduces harm afterwards."},{"q":"When may the probabilities of two branches under an AND gate be multiplied?","options":["Whenever the branches meet at an AND gate","When each branch has been tested separately","When the branch events are shown to be independent"],"answer":2,"why":"The gate shows logic only. Multiplying assumes independence, which a shared cause such as a common power supply would break."},{"q":"Which chain is needed in a safety trace?","options":["Hazard → safety requirement → verification of that requirement","Hazard → risk class → closure once a control is proposed","Requirement → test pass rate → overall safety claim"],"answer":0,"why":"Each hazard should trace to the requirement that controls it and to executed verification of that requirement."},{"q":"A static-analysis report with no warnings supports which claim?","options":["The system is safe in its operating environment","The checked fault classes are absent from the analysed code","The safety requirements themselves are correct"],"answer":1,"why":"Static analysis checks code against defined rules. It does not validate requirements or the environment."}],"alignment":[{"objective":"Separate hazard, accident and risk.","evidence":"Explain and demonstrate: Separate hazard, accident and risk.","field":"FIT"},{"objective":"Explain avoidance, detection/removal and damage limitation.","evidence":"Explain and demonstrate: Explain avoidance, detection/removal and damage limitation.","field":"TRACE + source application"},{"objective":"Read a fault tree and identify its assumptions.","evidence":"Explain and demonstrate: Read a fault tree and identify its assumptions.","field":"transfer question + TRACE"},{"objective":"Link a safety requirement to a verification method.","evidence":"Explain and demonstrate: Link a safety requirement to a verification method.","field":"TRACE + EVIDENCE"},{"objective":"Explain a safety case and the limits of formal/static analysis.","evidence":"Explain and demonstrate: Explain a safety case and the limits of formal/static analysis.","field":"BOUND + REFIT"}],"artifact":"Build a hazard → requirement → protective mechanism → verification trace, then defend the safety-argument boundary.","bridge":"Build a hazard → requirement → protective mechanism → verification trace, then defend the safety-argument boundary. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"X05","workload":"Consider whether the protective response is understandable and usable under a realistic workload; do not blame the operator for an unexamined design assumption.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","R09":"X09"},"roadmap":{"question":"What supports a bounded claim that a system is safe?","connection":"Identify what can cause harm → analyze its causes → derive protective requirements → assemble and challenge the evidence.","inClass":"Trace a hazard to a requirement and a verification method.","deliverable":"A hazard → requirement → verification trace.","success":"Distinguish a proposed check from evidence actually obtained.","branches":[{"verb":"Understand the consequences","label":"Safety-critical systems","detail":"Safety ≠ reliability · primary / secondary","target":"X01","units":["X01","X02"],"caseLens":"Can software meet its specification and still create an unsafe situation?"},{"verb":"Identify and analyze","label":"Hazards and risk","detail":"Accident vs hazard · risk regions · fault trees","target":"X02A","units":["X02A","CHECK1","X04","X05"],"caseLens":"What hazard could repeated actuation create, and how serious is it?"},{"verb":"Reduce the risk","label":"Safety requirements","detail":"Avoidance · detection/removal · damage limitation","target":"X03","units":["X03","X06"],"caseLens":"Which requirement prevents or limits that hazard?"},{"verb":"Create the evidence","label":"Safety engineering processes","detail":"Hazard log · verification · static analysis","target":"X09","units":["X09","CHECK2","R18","D12"],"caseLens":"What evidence would show the protection works?"},{"verb":"Justify with limits","label":"Safety cases","detail":"Claim · argument · evidence · critical paths","target":"B01","units":["B01","X10","AISYS","APPLY"],"caseLens":"Does the safety argument cover cumulative commands and loss of sensing?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"Every command the AI sent passed its check. The plant still crossed the line.","aiAssignment":{"title":"The campus shuttle’s AI speed advisor","scenario":"An autonomous campus shuttle uses an AI speed advisor that proposes a speed for each road segment. A separate controller enforces a maximum speed per segment. The operator wants to remove the on-board safety attendant during quiet hours.","facts":["Pilot: 1,200 trips; no collision; the per-segment maximum was never exceeded.","The advisor was trained mostly on dry-weather data.","Pedestrian detection uses one camera and one lidar."],"question":"Can the attendant be removed—and under which safety requirement and verification?","stress":"In heavy rain the lidar is degraded and the camera misses pedestrians in dark clothing. The advisor keeps proposing the segment maximum because its training data rarely included rain.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023":[["SE-Validation","Software Verification and Validation","Safety-critical verification and validation challenges."],["SE-Requirements","Product Requirements","Non-functional requirements; risk identification and management."],["SE-Reliability","Software Reliability","Contextual differences in fault tolerance and safe failure behaviour."],["SE-FormalMethods","Formal Methods","Model checkers and specification of safety properties."]]}</script><script src="runtime/source-figures.js?v=20260928-campus-v3"></script><script src="runtime/national-content.js?v=20260928-campus-v3"></script><script src="runtime/story-v3.js?v=20261003-fit-v1"></script><script src="runtime/classroom-v3.js?v=20261003-fit-v1" defer></script></body></html>
