{k:'M00',hero:true,week:'WEEK 05',title:'Security Engineering',heroA:'Security',heroB:'Engineering',heroText:'Security is not a product feature added at the end. It is a lifecycle discipline that maps assets, threats, vulnerabilities and controls into a bounded, reviewable decision.',source:'Sommerville, Software Engineering, Chapter 13',task:'Sit down. Your threat model starts before the first definition.',timebox:'90 sec',notes:'Keep the Chapter 10 rhythm: crisis → source → trade-off → evidence → verdict.'},
{k:'M01',phase:'CRISIS / DECIDE',rule:'RULE 01 · A working system can still be compromised',title:'The service is online. Should you call it secure?',sub:'A healthcare portal meets availability targets, but an attacker may read, alter or block sensitive records.',accent:'mag',blocks:[{t:'cards',cols:3,items:[{c:'teal',lab:'ASSET',txt:'Patient records, identities and clinical workflows.'},{c:'mag',lab:'ATTACK',txt:'Interception, modification or denial of service.'},{c:'green',lab:'VERDICT',txt:'Release, constrain, hold or demand more evidence?'}]}],task:'Give a provisional security verdict before the chapter map.',timebox:'2 min',learn:'Expose the difference between availability and security.',notes:'Do not solve it yet. Make students name what they are implicitly protecting.'},
{k:'M02',phase:'MAP / SOURCE SPINE',rule:'RULE 02 · Security is a lifecycle',title:'Chapter 13 source spine',sub:'The source moves from security concepts and organizational policy to risk assessment, secure design, implementation and testing.',accent:'teal',blocks:[{t:'viz',kind:'flow',label:'Security engineering lifecycle',source:'Sommerville Ch.13',nodes:[{label:'Policy + assets',sub:'what matters?',c:'teal'},{label:'Risk assessment',sub:'threats + vulnerabilities',c:'mag'},{label:'Requirements',sub:'what protection is required?',c:'sand'},{label:'Design + programming',sub:'how is protection built?',c:'violet'},{label:'Testing + operation',sub:'does it survive attack?',c:'green'}]}],task:'Which lifecycle step is missing from your first verdict?',timebox:'2 min',learn:'See security as lifecycle engineering.',notes:'Return to this spine after each source figure.'},
{k:'M03',phase:'MAP / SECURITY GOALS',rule:'SOURCE 01 · Protect more than secrecy',title:'Confidentiality, integrity and availability',sub:'Security failures include unauthorized disclosure, unauthorized modification and loss of legitimate service.',accent:'sand',blocks:[{t:'cards',cols:3,items:[{c:'teal',lab:'CONFIDENTIALITY',txt:'Information is disclosed only to authorized people or systems.'},{c:'sand',lab:'INTEGRITY',txt:'Information and services are not improperly altered.'},{c:'green',lab:'AVAILABILITY',txt:'Authorized users can obtain service when required.'}]}],task:'Which property is dominant in the portal crisis—and which cannot be ignored?',timebox:'3 min',learn:'Distinguish core security properties.',notes:'Use the source terminology; avoid reducing security to confidentiality.'},
{k:'M04',phase:'MAP / SOURCE FIGURE',rule:'SOURCE 02 · Security has levels',title:'Application, infrastructure and operational security',sub:'The source separates protection at different levels because a strong application can still fail on weak infrastructure or operations.',accent:'teal',blocks:[{t:'viz',kind:'layers',label:'Security levels · redrawn from source',source:'Sommerville Ch.13 · security layers',nodes:[{label:'APPLICATION',sub:'authentication, authorization, input handling, application controls'},{label:'INFRASTRUCTURE',sub:'platform, network, database and host protection'},{label:'OPERATIONAL',sub:'people, processes, deployment, monitoring and administration'}]}],task:'Which layer would an application-only penetration test miss?',timebox:'3 min',learn:'Reason across application, infrastructure and operations.',notes:'Security is only as strong as interacting layers and their assumptions.'},
{k:'M05',phase:'MAP / TERMINOLOGY',rule:'RULE 03 · Do not confuse the nouns',title:'Asset, threat, vulnerability, attack and control',sub:'A security argument collapses if these terms are used interchangeably.',accent:'violet',blocks:[{t:'viz',kind:'flow',label:'Security terminology · redrawn from source',source:'Sommerville Ch.13 · terminology figure',nodes:[{label:'ASSET',sub:'something valuable',c:'teal'},{label:'THREAT',sub:'potential cause of harm',c:'mag'},{label:'VULNERABILITY',sub:'weakness that can be exploited',c:'sand'},{label:'ATTACK',sub:'attempt to exploit weakness',c:'violet'},{label:'CONTROL',sub:'reduces likelihood or impact',c:'green'}]}],task:'Map the healthcare portal crisis onto all five nouns.',timebox:'3 min',learn:'Use security terminology precisely.',notes:'This terminology becomes the grammar for the rest of the chapter.'},
{k:'M06',phase:'MAP / POLICY',rule:'SOURCE 03 · Policy comes before controls',title:'Organizational security policy sets the boundary',sub:'Engineering requirements must reflect organizational rules about assets, access, responsibilities and acceptable risk.',accent:'sand',blocks:[{t:'cards',cols:4,items:[{c:'teal',lab:'ASSETS',txt:'What information and services require protection?'},{c:'violet',lab:'ACCESS',txt:'Who may do what under which conditions?'},{c:'sand',lab:'RESPONSIBILITY',txt:'Who owns decisions, monitoring and response?'},{c:'green',lab:'RISK',txt:'What residual exposure can the organization accept?'}]}],task:'Name one security control that makes no sense without a policy decision.',timebox:'2 min',learn:'Connect organizational policy to system requirements.',notes:'Controls are implementations of policy, not substitutes for policy.'},
{k:'M07',phase:'MAP / THREATS',rule:'SOURCE 04 · Four threat families',title:'Interception, interruption, modification, fabrication',sub:'The source uses four headings to structure misuse cases and preliminary risk assessment.',accent:'mag',blocks:[{t:'cards',cols:4,items:[{c:'teal',lab:'INTERCEPTION',txt:'Unauthorized access to an asset.'},{c:'mag',lab:'INTERRUPTION',txt:'Making a system or asset unavailable.'},{c:'sand',lab:'MODIFICATION',txt:'Unauthorized change to an asset.'},{c:'violet',lab:'FABRICATION',txt:'Insertion of false information or activity.'}]}],task:'Give one portal misuse case for each threat family.',timebox:'4 min',learn:'Use threat families to generate misuse cases.',notes:'Source examples include patient records, denial of service, tampering and false transactions.'},
{k:'M08',phase:'MAP / SOURCE FIGURE',rule:'SOURCE 05 · Risk assessment is staged',title:'Preliminary risk assessment',sub:'Start by identifying assets, threats and required protection before detailed design choices exist.',accent:'teal',blocks:[{t:'viz',kind:'flow',label:'Preliminary risk assessment · redrawn from source',source:'Sommerville Ch.13 · preliminary risk assessment',nodes:[{label:'Identify assets',sub:'what needs protection?',c:'teal'},{label:'Identify threats',sub:'what could happen?',c:'mag'},{label:'Assess risk',sub:'likelihood + consequence',c:'sand'},{label:'Define controls',sub:'requirements + strategy',c:'green'}]}],task:'What output from this stage should constrain later design?',timebox:'3 min',learn:'Explain preliminary risk assessment.',notes:'The output is not a finished architecture; it is a risk-informed protection direction.'},
{k:'M09',phase:'MAP / LIFECYCLE RISK',rule:'RULE 04 · New design details create new risk',title:'Risk assessment continues through the lifecycle',sub:'As implementation and deployment choices become concrete, new vulnerabilities and interpretations of requirements emerge.',accent:'sand',blocks:[{t:'compare',left:'Stage',right:'Risk question',rows:[['Preliminary','What assets and major threats define protection requirements?'],['Lifecycle / design','Which design and implementation details introduce or change vulnerabilities?'],['Operational','What real deployment, users, attacks and changes alter the risk after release?']]}],task:'Why can a one-time threat model become unsafe?',timebox:'3 min',learn:'Distinguish preliminary, lifecycle and operational risk assessment.',notes:'Use the source distinction: security attention to detail continues from requirements through deployment.'},
{k:'M10',phase:'MAP / MISUSE CASE',rule:'SOURCE 06 · Model the attacker path',title:'Misuse cases make threats concrete',sub:'A misuse case represents a malicious interaction and helps derive security requirements and test design decisions.',accent:'violet',blocks:[{t:'viz',kind:'network',label:'Misuse-case view · redrawn from source',source:'Sommerville Ch.13 · misuse case',center:'PROTECTED SYSTEM',nodes:[{label:'Attacker',sub:'attempts unauthorized action'},{label:'Asset',sub:'target of the misuse'},{label:'Control',sub:'must interrupt the path'},{label:'Evidence',sub:'shows the misuse is resisted'}]}],task:'Write one misuse case that your normal use cases would never reveal.',timebox:'3 min',learn:'Use misuse cases for security analysis.',notes:'Misuse cases complement use cases; they are not just “negative requirements”.'},
{k:'M11',phase:'EVIDENCE / REQUIREMENTS',rule:'RULE 05 · Security requirements must name protection',title:'Turn risk into requirements',sub:'A requirement should identify the protected asset, permitted behavior and protection or response expected.',accent:'green',blocks:[{t:'cards',cols:4,items:[{c:'teal',lab:'IDENTIFY',txt:'Authenticate the actor or system.'},{c:'violet',lab:'AUTHORIZE',txt:'Limit operations by role, context or policy.'},{c:'sand',lab:'PROTECT',txt:'Preserve confidentiality and integrity of data.'},{c:'green',lab:'DETECT / RESPOND',txt:'Record, detect and respond to suspicious behavior.'}]}],task:'Rewrite “the portal shall be secure” as one testable protection requirement.',timebox:'3 min',learn:'Derive concrete security requirements.',notes:'Tie every requirement back to an asset and threat.'},
{k:'M12',phase:'EVIDENCE / DESIGN',rule:'SOURCE 07 · Defense in depth',title:'Layered protection limits single-point compromise',sub:'The source uses multiple protection layers so one failed control does not immediately expose the protected asset.',accent:'teal',blocks:[{t:'viz',kind:'layers',label:'Layered protection architecture · redrawn from source',source:'Sommerville Ch.13 · layered protection',nodes:[{label:'PERIMETER / NETWORK',sub:'reduce unauthorized reachability'},{label:'PLATFORM',sub:'harden hosts, services and runtime'},{label:'APPLICATION',sub:'validate, authenticate and authorize'},{label:'DATA / ASSET',sub:'protect sensitive information and operations'}]}],task:'Which layer should still protect the asset if the application control fails?',timebox:'3 min',learn:'Explain layered protection / defense in depth.',notes:'Layering is not duplication for its own sake; layers should fail differently and limit propagation.'},
{k:'M13',phase:'EVIDENCE / DISTRIBUTION',rule:'SOURCE 08 · Distribution changes the attack surface',title:'Distributed assets multiply trust boundaries',sub:'Moving services and data across machines, networks and organizations creates new interfaces, identities and failure points.',accent:'violet',blocks:[{t:'viz',kind:'network',label:'Distributed assets · redrawn from source',source:'Sommerville Ch.13 · distributed-assets figure',center:'SENSITIVE ASSET',nodes:[{label:'Client',sub:'identity + endpoint risk'},{label:'Network',sub:'interception + disruption'},{label:'Service',sub:'API + authorization risk'},{label:'Database',sub:'data + privilege risk'}]}],task:'Name the trust boundary most likely to be forgotten in a diagram.',timebox:'3 min',learn:'Reason about security in distributed systems.',notes:'Use this source figure to make attack surface visible, not as decoration.'},
{k:'M14',phase:'EVIDENCE / SECURE PROGRAMMING',rule:'RULE 06 · Design cannot rescue unsafe implementation',title:'Secure programming removes avoidable vulnerabilities',sub:'Language, input handling, memory safety, error handling and dependency choices can create vulnerabilities even when requirements are sound.',accent:'sand',blocks:[{t:'cards',cols:4,items:[{c:'teal',lab:'INPUT',txt:'Treat external input as untrusted and validate it.'},{c:'mag',lab:'MEMORY / BOUNDS',txt:'Prevent unsafe access and corruption where the language permits it.'},{c:'violet',lab:'ERRORS',txt:'Fail without exposing secrets or bypassing controls.'},{c:'green',lab:'DEPENDENCIES',txt:'Track vulnerable libraries, versions and configuration.'}]}],task:'Which coding weakness can bypass a perfectly written policy?',timebox:'3 min',learn:'Connect implementation choices to vulnerability.',notes:'Source discussion emphasizes detailed vulnerabilities through the lifecycle.'},
{k:'M15',phase:'EVIDENCE / TESTING',rule:'SOURCE 09 · Test the controls, not only functions',title:'Security testing asks adversarial questions',sub:'The source closes with checks that look for common vulnerabilities, weak configurations and ineffective controls.',accent:'green',blocks:[{t:'viz',kind:'matrix',label:'Security checklist · redrawn from source',source:'Sommerville Ch.13 · security checklist',nodes:[{label:'IDENTITY / ACCESS',sub:'Are authentication and authorization controls enforced?'},{label:'INPUT / INTERFACE',sub:'Can malformed or malicious input cross a boundary?'},{label:'DATA / SECRETS',sub:'Are sensitive values protected in storage and transit?'},{label:'LOG / RESPONSE',sub:'Can attacks be detected, investigated and contained?'}]}],task:'Choose one checklist item and name the evidence you would demand.',timebox:'3 min',learn:'Use security testing and checklist evidence.',notes:'Testing is evidence about controls, not evidence that “no attacker can ever succeed”.'},
{k:'M16',phase:'PRACTISE / FLOW',rule:'RULE 07 · Turn threat into decision',title:'The ISCARB security flow',sub:'The common five-step grammar now carries security-specific evidence.',accent:'sand',blocks:[{t:'viz',kind:'flow',label:'Security decision flow',nodes:[{label:'CRISIS',sub:'what asset can be harmed?',c:'mag'},{label:'MAP',sub:'threat + vulnerability + boundary',c:'teal'},{label:'TRADE-OFF',sub:'protection vs usability / cost',c:'sand'},{label:'EVIDENCE',sub:'controls + tests + logs',c:'violet'},{label:'VERDICT',sub:'bounded human sign-off',c:'green'}]}],task:'Retell the portal case using all five verbs.',timebox:'3 min',learn:'Apply ISCARB to security engineering.',notes:'Keep the flow identical to Chapter 10 while changing the evidence domain.'},
{k:'M17',phase:'PRACTISE / FIT',rule:'RULE 08 · Choose controls that fit the threat',title:'FIT: protect the asset against the actual path',sub:'A fashionable control is irrelevant if it does not interrupt the dominant misuse path.',accent:'teal',blocks:[{t:'cards',cols:2,items:[{c:'teal',lab:'FIT',txt:'Which control or design mechanism best interrupts the attack path?',field:{id:'dc_fit',rows:3,ph:'The best-fitting control is…'}},{c:'sand',lab:'SOURCE REASON',txt:'Which chapter mechanism makes that fit defensible?'}]}],task:'Write one control and one source-grounded reason.',timebox:'3 min',learn:'Select a fitting security control.',notes:'Ask students to point to the threat or vulnerability it actually addresses.'},
{k:'M18',phase:'TRADE-OFF / BOUND',rule:'RULE 09 · Security always has a boundary',title:'BOUND: when does your control stop being enough?',sub:'Controls depend on assumptions about identities, platforms, network paths, configuration and operations.',accent:'mag',blocks:[{t:'cards',cols:2,items:[{c:'mag',lab:'BOUNDARY',txt:'This security decision remains valid only while…',field:{id:'dc_bound',rows:3,ph:'This decision remains valid only while…'}},{c:'violet',lab:'REOPEN TRIGGER',txt:'Name one observable change that forces re-assessment.'}]}],task:'State a boundary an auditor could verify.',timebox:'3 min',learn:'Bound security claims.',notes:'A boundary can be a platform version, trust relationship, identity model, deployment context or policy assumption.'},
{k:'M19',phase:'EVIDENCE / ACT',rule:'RULE 10 · Produce inspectable controls',title:'ACT + EVIDENCE',sub:'Security action must leave artifacts another engineer can inspect and challenge.',accent:'green',blocks:[{t:'cards',cols:2,items:[{c:'green',lab:'ACT',txt:'What control, redesign or operational constraint will you implement?',field:{id:'dc_act',rows:3,ph:'I will…'}},{c:'sand',lab:'EVIDENCE',txt:'What demonstrates that it resists the intended misuse?',field:{id:'dc_evidence',rows:3,ph:'Evidence will include…'}}]}],task:'Name one action and one adversarial test or artifact.',timebox:'4 min',learn:'Translate security analysis into action and evidence.',notes:'Examples: threat model, misuse case, access-control test, penetration evidence, configuration review, logs.'},
{k:'M20',phase:'TRADE-OFF / STRESS',rule:'RULE 11 · Threat surfaces move',title:'STRESS: one trust assumption changes',sub:'The portal adds a third-party analytics service and a new mobile client under a different release cycle.',accent:'mag',blocks:[{t:'cards',cols:4,items:[{c:'mag',lab:'NEW PARTY',txt:'Another organization now processes data.'},{c:'teal',lab:'NEW API',txt:'A new interface crosses the trust boundary.'},{c:'sand',lab:'NEW CLIENT',txt:'Endpoint security assumptions change.'},{c:'violet',lab:'NEW RELEASE CYCLE',txt:'Patch timing and configuration drift change.'}]}],task:'Which change invalidates your control first?',timebox:'3 min',learn:'Stress-test a security design.',notes:'Re-run the threat model rather than simply adding another control.'},
{k:'M21',phase:'VERDICT / COUNTER-EVIDENCE',rule:'RULE 12 · Try to prove yourself wrong',title:'Counter-evidence before assurance',sub:'Security confidence without a reversal condition is not a defensible claim.',accent:'violet',blocks:[{t:'cards',cols:2,items:[{c:'mag',lab:'COUNTER-EVIDENCE',txt:'I would reverse this decision if…',field:{id:'dc_counter',rows:3,ph:'I would reverse this decision if…'}},{c:'violet',lab:'UNCERTAINTY',txt:'The strongest unresolved security uncertainty is…',field:{id:'dc_uncert',rows:3,ph:'The strongest uncertainty is…'}}]}],task:'Write one reversal trigger and one unresolved uncertainty.',timebox:'3 min',learn:'Expose counter-evidence.',notes:'The best answers are observable: a failed test, changed threat, unsupported platform or violated assumption.'},
{k:'M22',phase:'VERDICT / HUMAN SIGN-OFF',rule:'RULE 13 · Human sign-off owns residual risk',title:'Final security verdict',sub:'State what is justified now, what evidence supports it, and what will reopen the decision.',accent:'green',blocks:[{t:'cards',cols:2,items:[{c:'green',lab:'VERDICT',txt:'Proceed, constrain, hold or investigate?',field:{id:'dc_verdict',rows:3,ph:'My bounded security verdict is…'}},{c:'sand',lab:'RESIDUAL RISK',txt:'What threat remains after the controls?'}]}],task:'Prepare to defend the residual risk in sixty seconds.',timebox:'4 min',learn:'Make a bounded security sign-off.',notes:'No “secure/unsecure” binary claim without context.'},
{k:'M23',phase:'VERDICT / RETRIEVAL',rule:'RULE 14 · Retrieve, do not reread',title:'One-minute retrieval',sub:'Reconstruct the chapter without the slide.',accent:'green',blocks:[{t:'cards',cols:4,items:[{c:'teal',lab:'TERMS',txt:'Asset → threat → vulnerability → attack → control.'},{c:'mag',lab:'THREATS',txt:'Name the four threat families.'},{c:'sand',lab:'LIFECYCLE',txt:'Why is one risk assessment not enough?'},{c:'green',lab:'DEFENSE',txt:'Explain defense in depth in one sentence.'}]}],task:'Answer all four aloud with notes closed.',timebox:'60 sec',learn:'Retrieve core security mechanisms.',notes:'Use misses to target the next review.'},
{k:'END',phase:'VERDICT / CLOSE',title:'Security is a maintained argument, not a badge.',sub:'Assets, threats and vulnerabilities change. A defensible system keeps controls, evidence and residual risk under review.',accent:'green',blocks:[{t:'viz',kind:'flow',label:'Leave with the decision grammar',nodes:[{label:'CRISIS',c:'mag'},{label:'MAP',c:'teal'},{label:'TRADE-OFF',c:'sand'},{label:'EVIDENCE',c:'violet'},{label:'VERDICT',c:'green'}]}],task:'Carry the bounded verdict into the After-Class FBR assignment.',timebox:'',learn:'Close security engineering.',notes:'End on lifecycle accountability.'}
];</script><script src="lecture-master-v1.js?v=20260913-master3"></script></body></html>
