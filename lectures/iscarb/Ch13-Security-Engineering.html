<!doctype html><html lang="en" data-iscarb-standalone="1" data-course-release="20260921-classroom-v3" data-navigation="20260921-navigation-v1" data-mindmap="20260922-story-v2" data-story="20260922-story-v2" data-ailens="20260926-genai-v12"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chapter 13: Security Engineering. Twenty source-grounded classroom slides, required source review, and one iSCARB decision artifact."><title>iSCARB · Ch13 Security Engineering</title><link rel="stylesheet" href="runtime/classroom-v3.css?v=20260926-genai-v12"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 13</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch13-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":13,"title":"Security Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260926-genai-v12","filename":"Ch13-Security-Engineering.html","assignment":4,"points":5,"objectives":["Distinguish assets, threats, attacks and vulnerabilities.","Translate a policy into testable requirements.","Build a misuse case and a control.","Explain layered protection and secure defaults.","Design a negative test and state its coverage limit."],"sections":["13.1 Security and dependability","13.2 Security and organizations","13.3 Security requirements","13.4 Secure systems design","13.5 Security testing and assurance"],"case":{"headline":"A record crosses the boundary it should not cross.","text":"A fictional application stores team documents. Routine tests exercise the authorized owner. The UI hides other teams’ links, but the server-side actor/object authorization tests have not been supplied. This is a classroom model, not a real breach.","question":"Which boundary should enforce access, and how would you check it?","mutation":"A second access endpoint uses a different authorization path; the first endpoint’s passed test does not cover it. That second path is the AI assistant: it reads documents with its own service account, not the asking user’s permissions.","lens":"The application also adds an AI assistant that answers questions about team documents. It retrieves documents through a service account that can read every team’s files, and relies on its instructions to answer only from the asker’s team. Pilot users rated its answers highly. Hold that question: after the testing slides, one slide shows how this chapter’s methods apply to the assistant."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Security Engineering","phase":"START","takeaway":"Security Engineering","full":"<p>Security Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Security and dependability","fig":null,"sourceRange":"3–19","bullets":[["Confidentiality","Protect information from unauthorized disclosure."],["Integrity","Protect systems and data from unauthorized alteration or damage."],["Availability","Keep authorized service accessible."],["Interaction","A security failure can undermine reliability, availability and safety."]],"question":"Why can restoring availability be insufficient after a security incident?","answer":"The restored system or data may still be compromised. The relevant integrity and confidentiality conditions must also be checked.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A security failure can undermine reliability, availability and safety.","full":"<p><b>Confidentiality.<\/b> Protect information from unauthorized disclosure.<\/p><p><b>Integrity.<\/b> Protect systems and data from unauthorized alteration or damage.<\/p><p><b>Availability.<\/b> Keep authorized service accessible.<\/p><p><b>Interaction.<\/b> A security failure can undermine reliability, availability and safety.<\/p>","sourceStart":3},{"id":"X02","title":"Name the asset, weakness and attack separately","fig":null,"sourceRange":"3–19","bullets":[["Asset","Something of value that needs protection."],["Vulnerability","A weakness that could be exploited."],["Threat / attack","Potential harmful circumstances / an attempt exploiting a weakness."],["Control / exposure","A protective measure / the possible loss or harm."]],"question":"Classify a confidential record, a missing ownership check and a cross-user request.","answer":"The record is the asset; the missing check is a vulnerability; the unauthorized cross-user request is an attack attempt in this teaching example.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A protective measure / the possible loss or harm.","full":"<p><b>Asset.<\/b> Something of value that needs protection.<\/p><p><b>Vulnerability.<\/b> A weakness that could be exploited.<\/p><p><b>Threat / attack.<\/b> Potential harmful circumstances / an attempt exploiting a weakness.<\/p><p><b>Control / exposure.<\/b> A protective measure / the possible loss or harm.<\/p>","sourceStart":3},{"id":"X02A","title":"Three security levels; four threat types","fig":"ch13_layers","sourceRange":"3–19","bullets":[["Infrastructure","Shared platforms, networks and middleware."],["Application","Controls inside the particular system."],["Operational","How people use, manage and recover the system."],["Threat types","Interception, interruption, modification and fabrication."]],"question":"Why does a secure server platform not settle application authorization?","answer":"The application still has to enforce which actor may perform which action on which object. A platform control may not express that rule.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c281fd6044088c5f.jpg","caption":"Sommerville Ch.13 · preserved source illustration","takeaway":"Interception, interruption, modification and fabrication.","full":"<p><b>Infrastructure.<\/b> Shared platforms, networks and middleware.<\/p><p><b>Application.<\/b> Controls inside the particular system.<\/p><p><b>Operational.<\/b> How people use, manage and recover the system.<\/p><p><b>Threat types.<\/b> Interception, interruption, modification and fabrication.<\/p>","sourceStart":3},{"id":"X03","title":"Policy defines goals and responsibilities","fig":null,"sourceRange":"20–28","bullets":[["Assets and protection","Identify what needs protection and the required level."],["Responsibility","State expectations for users, managers and the organization."],["Existing constraints","Account for technologies and procedures that must remain."],["Engineering link","Turn broad policy goals into testable requirements and controls."]],"question":"Why should policy not simply list product settings?","answer":"Policy communicates protection goals and responsibilities. Settings implement those goals and may change when the system evolves.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Turn broad policy goals into testable requirements and controls.","full":"<p><b>Assets and protection.<\/b> Identify what needs protection and the required level.<\/p><p><b>Responsibility.<\/b> State expectations for users, managers and the organization.<\/p><p><b>Existing constraints.<\/b> Account for technologies and procedures that must remain.<\/p><p><b>Engineering link.<\/b> Turn broad policy goals into testable requirements and controls.<\/p>","sourceStart":20},{"id":"CHECK1","title":"Checkpoint · define a testable claim","fig":null,"sourceRange":"3–28","bullets":[["Think","A project document is visible only to its own team."],["Pair","Distinguish hiding a link from enforcing server authorization."],["Record","Name the protected action, actor, object and required evidence."]],"question":"What is the useful first negative test?","answer":"In an authorized teaching environment, request the same protected object as a different permitted test user and inspect the server response and audit record.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Name the protected action, actor, object and required evidence.","full":"<p><b>Think.<\/b> A project document is visible only to its own team.<\/p><p><b>Pair.<\/b> Distinguish hiding a link from enforcing server authorization.<\/p><p><b>Record.<\/b> Name the protected action, actor, object and required evidence.<\/p>","sourceStart":3},{"id":"X04","title":"Risk assessment changes with the lifecycle","fig":"ch13_riskproc","sourceRange":"20–28","bullets":[["Preliminary","Identify high-level assets and risks before design details are fixed."],["Design","Use architecture and implementation choices to find new vulnerabilities."],["Operational","Review actual use, changed workflows and configuration."],["Trace","Link risk treatment to a requirement, control and evidence."]],"question":"When a shared terminal replaces personal laptops, which assumptions need review?","answer":"Operational assumptions about unattended sessions, user switching and access boundaries; these may create new requirements even when the code is unchanged.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/42471cd2f387b9b6.jpg","caption":"Sommerville Ch.13 · preserved source illustration","takeaway":"Link risk treatment to a requirement, control and evidence.","full":"<p><b>Preliminary.<\/b> Identify high-level assets and risks before design details are fixed.<\/p><p><b>Design.<\/b> Use architecture and implementation choices to find new vulnerabilities.<\/p><p><b>Operational.<\/b> Review actual use, changed workflows and configuration.<\/p><p><b>Trace.<\/b> Link risk treatment to a requirement, control and evidence.<\/p>","sourceStart":20},{"id":"X05","title":"Security requirements must identify observable behavior","fig":null,"sourceRange":"29–43","bullets":[["Identity and access","Identification, authentication and authorization are distinct."],["Protection","Immunity, integrity, privacy and intrusion detection address different needs."],["Accountability","Nonrepudiation, auditing and maintenance-security requirements preserve assurance."],["Scope","Select relevant requirements; do not assume every type is needed everywhere."]],"question":"What distinguishes authentication from authorization?","answer":"Authentication establishes who is interacting; authorization determines what that identified actor may do. Passing one does not establish the other.","rows":null,"heads":null,"extra":"The source lists ten requirement types: identification; authentication; authorization; immunity; integrity; intrusion detection; nonrepudiation; privacy; security auditing; system maintenance security. The required source review retains their descriptions.","phase":"LEARN","takeaway":"Select relevant requirements; do not assume every type is needed everywhere.","full":"<p><b>Identity and access.<\/b> Identification, authentication and authorization are distinct.<\/p><p><b>Protection.<\/b> Immunity, integrity, privacy and intrusion detection address different needs.<\/p><p><b>Accountability.<\/b> Nonrepudiation, auditing and maintenance-security requirements preserve assurance.<\/p><p><b>Scope.<\/b> Select relevant requirements; do not assume every type is needed everywhere.<\/p>","sourceStart":29},{"id":"X06","title":"Misuse cases make unwanted interactions explicit","fig":"ch13_misuse","sourceRange":"29–43","bullets":[["Actor and asset","Identify who could cause harm and what is exposed."],["Unwanted interaction","Describe a concrete abuse, not only normal successful use."],["Requirement","State how the system should prevent, detect or mitigate it."],["Test","Record an observable pass/fail condition in an authorized environment."]],"question":"How does a misuse case improve an ordinary successful-login test?","answer":"It exposes an unwanted interaction such as an authenticated actor requesting another user’s protected object. A successful login alone never checks that boundary.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3004a5b08b27401f.jpg","caption":"Sommerville Ch.13 · preserved source illustration","takeaway":"Record an observable pass/fail condition in an authorized environment.","full":"<p><b>Actor and asset.<\/b> Identify who could cause harm and what is exposed.<\/p><p><b>Unwanted interaction.<\/b> Describe a concrete abuse, not only normal successful use.<\/p><p><b>Requirement.<\/b> State how the system should prevent, detect or mitigate it.<\/p><p><b>Test.<\/b> Record an observable pass/fail condition in an authorized environment.<\/p>","sourceStart":29},{"id":"R11","title":"Reassess the design, including reused components","fig":"ch13_designrisk","sourceRange":"44–48","bullets":[["Architecture","Identify new trust boundaries and dependencies."],["Reuse","A component can add vulnerabilities or weaken assumptions."],["Refine","Revise requirements or design when new risks appear."],["Record","Keep the evidence basis and residual risk of each treatment."]],"question":"What should a component update trigger beyond a normal functional test?","answer":"A review of changed privileges, interfaces, dependencies and relevant negative tests, with versioned results.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6d94c747a6361012.jpg","caption":"Sommerville Ch.13 · preserved source illustration","takeaway":"Keep the evidence basis and residual risk of each treatment.","full":"<p><b>Architecture.<\/b> Identify new trust boundaries and dependencies.<\/p><p><b>Reuse.<\/b> A component can add vulnerabilities or weaken assumptions.<\/p><p><b>Refine.<\/b> Revise requirements or design when new risks appear.<\/p><p><b>Record.<\/b> Keep the evidence basis and residual risk of each treatment.<\/p>","sourceStart":44},{"id":"CHECK2","title":"Checkpoint · control and counterexample","fig":null,"sourceRange":"29–48","bullets":[["Think","Compare UI hiding with a server-side ownership rule."],["Pair","Explain the enforcement boundary and a bypass to test."],["Record","Add the chosen control, warrant and remaining uncertainty."]],"question":"Why must the test change the actor or object rather than only the URL spelling?","answer":"Authorization is about actor/action/object relationships. The test must cross the actual forbidden relationship to support that claim.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the chosen control, warrant and remaining uncertainty.","full":"<p><b>Think.<\/b> Compare UI hiding with a server-side ownership rule.<\/p><p><b>Pair.<\/b> Explain the enforcement boundary and a bypass to test.<\/p><p><b>Record.<\/b> Add the chosen control, warrant and remaining uncertainty.<\/p>","sourceStart":29},{"id":"R09","title":"Secure design guidelines","fig":null,"sourceRange":"49–63","bullets":[["Policy first","Base decisions on explicit protection goals."],["Fail safely","Denied or unavailable checks must not silently grant access."],["Least privilege","Give only the rights needed for the task."]],"question":"(1) Which design choice prevents an authorization timeout from becoming access? (2) What must be checked when a recovery procedure runs under an elevated account?","answer":"(1) A defined failure response that does not grant the protected action when authorization cannot be established. (2) Its authorized scope, input validity, auditability and the integrity of the restored state. Recovery itself must not become an unexamined privileged bypass.","rows":[["1–2 · Explicit policy · No single point of failure","Design around stated goals; never rely on one defense for every threat."],["3–4 · Fail securely · Balance security and usability","A failure must not create an unprotected state; check how people actually work."],["5–6 · Log user actions · Redundancy and diversity","Keep records for investigation; avoid one weakness defeating every defense."],["7–8 · Validate all inputs · Compartmentalize assets","Treat external data as untrusted; limit the reach of a compromise."],["9–10 · Design for deployment · Design for recoverability","Support secure configuration; restore service and protection after damage."]],"heads":["SOURCE GUIDELINES","WHAT THEY REQUIRE"],"extra":"","phase":"LEARN","takeaway":"Ten guidelines: start from policy, fail securely, and never assume a clean recovery.","full":"<p><b>Policy first.<\/b> Base decisions on explicit protection goals.<\/p><p><b>Fail safely.<\/b> Denied or unavailable checks must not silently grant access.<\/p><p><b>Defense.<\/b> Use layers, defaults and privilege limits deliberately.<\/p><p><b>Least privilege.<\/b> Give only the rights needed for the task.<\/p><p><b>Validate.<\/b> Check inputs at the enforcement boundary.<\/p><p><b>Recover.<\/b> Prepare restoration without assuming that a backup is uncompromised.<\/p>","sourceStart":49,"fullTable":true,"notes":""},{"id":"B01","title":"Layered protection needs distinct boundaries","fig":"ch13_layered","sourceRange":"44–63","bullets":[["Layering","Place protections around different assets and interfaces."],["Compartmentalization","Limit damage after one boundary fails."],["Dependencies","Multiple layers may share credentials, configuration or a vulnerable component."],["Cost","Check overhead and usable operation, not only number of layers."]],"question":"Do three identical checks establish three independent defenses?","answer":"No. They may share the same weakness. Identify what each boundary protects and which shared failures can defeat the layers.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/c469e1289c907afc.jpg","caption":"Sommerville Ch.13 · preserved source illustration","takeaway":"Check overhead and usable operation, not only number of layers.","full":"<p><b>Layering.<\/b> Place protections around different assets and interfaces.<\/p><p><b>Compartmentalization.<\/b> Limit damage after one boundary fails.<\/p><p><b>Dependencies.<\/b> Multiple layers may share credentials, configuration or a vulnerable component.<\/p><p><b>Cost.<\/b> Check overhead and usable operation, not only number of layers.<\/p>","sourceStart":44},{"id":"X09","title":"Secure programming supports—not replaces—design","fig":null,"sourceRange":"64–68","bullets":[["Input checks","Check range, size, representation and reasonableness as appropriate."],["Failure handling","Handle exceptions, array bounds and external-call timeouts."],["Clarity","Limit visible state and error-prone constructs; name real-world constants."],["Boundary","Language safeguards and tests do not establish every application-level policy."]],"question":"Why does memory safety not prove correct project-level authorization?","answer":"It addresses a class of implementation errors, not whether the current actor is permitted to access a particular project object.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Language safeguards and tests do not establish every application-level policy.","full":"<p><b>Input checks.<\/b> Check range, size, representation and reasonableness as appropriate.<\/p><p><b>Failure handling.<\/b> Handle exceptions, array bounds and external-call timeouts.<\/p><p><b>Clarity.<\/b> Limit visible state and error-prone constructs; name real-world constants.<\/p><p><b>Boundary.<\/b> Language safeguards and tests do not establish every application-level policy.<\/p>","sourceStart":64},{"id":"R18","title":"Security testing supports bounded claims","fig":null,"sourceRange":"69–72","bullets":[["Unwanted behavior","Test what an unauthorized actor must not be able to do."],["Approaches","Use experience-based tests, analysis, tool-assisted checks and authorized penetration tests."],["Changing adversary","Attackers adapt; a past test does not cover every future attack."],["Assurance","State the tested version, actors, paths and limits—not “100% secure”."]],"question":"One endpoint rejects a cross-user request. What can you conclude?","answer":"The tested boundary is supported for that version and scenario. Other endpoints, roles, configurations and attack paths remain to be checked.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"State the tested version, actors, paths and limits—not “100% secure”.","full":"<p><b>Unwanted behavior.<\/b> Test what an unauthorized actor must not be able to do.<\/p><p><b>Approaches.<\/b> Use experience-based tests, analysis, tool-assisted checks and authorized penetration tests.<\/p><p><b>Changing adversary.<\/b> Attackers adapt; a past test does not cover every future attack.<\/p><p><b>Assurance.<\/b> State the tested version, actors, paths and limits—not “100% secure”.<\/p>","sourceStart":69},{"id":"AISYS","title":"Debate: can an instruction be an access control?","phase":"LEARN","skin":"genai","banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · DEBATE","caption":"Hiding a link was not authorization. Is telling a model to behave any different?"},"takeaway":"Two teams, one minute per round. The judge rewards what can be tested.","fullTable":false,"bullets":[["Round 1","Each team states its control and its best evidence."],["Round 2","Each team attacks the other: a planted instruction, a broad service account."],["Verdict","Which side can show a passing negative test for every document?"]],"question":"After the debate: which control can support the access claim, and what does the other still add?","answer":"Server-side, permission-aware retrieval supports the claim: it is deterministic, can be tested per actor and object, and the model cannot obtain through retrieval what it never receives. The instruction can remain as a secondary layer that discourages inappropriate answers, but it is a request, not an enforcement boundary: text an attacker plants in a document can override it (prompt injection), and a broad service account makes the assistant a confused deputy. State the tested version, actors and prompts; tests of model refusals only sample an unbounded space of phrasings.","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source methods to an AI component","notes":"Allow about 6 minutes. Format: debate. Split the room: left side Team A, right side Team B; one minute per round, then take the verdict from a third student. New terms, at most two: prompt injection and confused deputy. All testing described is for authorised teaching environments only. Everything else in Full explanation is optional depth and is not assessed.","full":"<p>This slide is course-added. It turns the chapter’s central distinction—hiding versus enforcing—into a structured debate about an AI assistant with access to stored documents.<\/p><h3>How the slide uses the five objectives<\/h3><p>Assets and threats: prompts and retrieved documents are attacker-influenced input. Policy to requirement: the assistant may disclose only what the asker is authorised to read. Misuse case: a planted document tries to make it leak data. Layers and least privilege: retrieval runs with the asker’s rights, not a broad service account. Negative testing: request another team’s record and expect the server to refuse, with the coverage limit stated.<\/p><p><b>Prompt injection.<\/b> A language model has no reliable built-in separation between instructions and data; both arrive as text. Text an attacker controls—typed directly, or hidden in a document, email or web page the assistant later reads—can therefore act as instructions.<\/p><p><b>Confused deputy.<\/b> A component with broad privileges acts for a user with narrower ones. If retrieval uses an account that can read every team’s files, a user may obtain through the assistant what they could never open directly.<\/p><p><b>Permission-aware retrieval.<\/b> The server applies the asker’s actor/action/object rights before any document reaches the model—including search indexes, embeddings and caches built from the documents, which otherwise become a side path.<\/p><p><b>Treat output as untrusted.<\/b> Generated text must not be executed, used to build queries or accepted as an authorization decision without validation.<\/p><p class=\"small\">The case is course-created. All tests described are for authorised teaching environments. Optional further reading: the OWASP Top 10 for Large Language Model Applications, which lists prompt injection first.<\/p>","sourceStart":1,"approaches":[{"label":"TEAM A","title":"Instruct the assistant","nodes":["System instruction","“Answer only from the asker’s team”","Model complies"],"text":"Fast to deploy; worked in the pilot."},{"label":"TEAM B","title":"Filter on the server","nodes":["Asker’s rights","Filter documents","Model sees only permitted text"],"text":"Testable object by object."}]},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"One passed test is not every path.","bullets":[["New information","A second path—the AI assistant—reads with its own service account."],["Reassess","The passed test covered one endpoint, not this path."],["Revise","Restrict the assistant until retrieval uses the asker’s rights."],["Own","Name who owns the fix and informs affected data owners."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. Restrict or disable the assistant until retrieval enforces the asker’s permissions and cross-team negative tests pass for it; if records may already have crossed a boundary, the data owner must be told.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>A second access endpoint uses a different authorization path; the first endpoint’s passed test does not cover it.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. Which boundary should enforce access, and how would you check it? Does the assistant’s instruction to answer only from your team count?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. An instruction to the assistant is like hiding a link in the interface: it asks for good behaviour but enforces nothing. The boundary must be enforced by the server before data reaches the model.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, a system instruction telling the assistant to answer only from the asker’s team, or server-side filtering by the asker’s permissions before retrieval.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. Server-side filtering can be tested object by object; an instruction can be overridden by text the attacker controls, so testing it only samples an unbounded space of phrasings.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"A second access endpoint uses a different authorization path; the first endpoint’s passed test does not cover it. That second path is the AI assistant: it reads documents with its own service account, not the asking user’s permissions.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The assistant is a privileged deputy acting for a less-privileged user. Until retrieval runs with the asker’s rights and has its own negative tests, the access claim cannot extend to it.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["B01"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["B01","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Misuse cases and requirements","range":"40–43"},{"title":"Secure design principles","range":"44–47"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Security concepts, levels and threats","start":3,"end":19,"units":["X01","X02","X02A","CHECK1"]},{"title":"Policies and risk assessment","start":20,"end":28,"units":["X03","CHECK1","X04"]},{"title":"Requirements and misuse cases","start":29,"end":43,"units":["X05","X06","CHECK2"]},{"title":"Secure design and architecture","start":44,"end":63,"units":["R11","CHECK2","R09","B01"]},{"title":"Programming, testing and assurance","start":64,"end":72,"units":["X09","R18"]}],"sourceCount":72,"original":"sources/Ch13-Original.pptx","textbook":"sources/Ch13-Textbook.pdf","bookPages":35,"quiz":[{"q":"Which is a vulnerability?","options":["A valuable student record","A possible unauthorized disclosure","A missing server-side ownership check"],"answer":2,"why":"An asset has value, a threat is potential harm, and a vulnerability is an exploitable weakness."},{"q":"A useful security requirement should identify:","options":["Protected action, authorized actor and observable enforcement","Only the product brand","Only an aspiration to be secure"],"answer":0,"why":"The requirement must be specific enough to verify."},{"q":"What does a misuse case describe?","options":["Only expected successful
