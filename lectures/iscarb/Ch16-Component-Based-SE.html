<!doctype html><html lang="en" data-iscarb-standalone="1" data-course-release="20260921-classroom-v3" data-navigation="20260921-navigation-v1" data-mindmap="20260922-story-v2" data-story="20260922-story-v2" data-ailens="20260926-genai-v12"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chapter 16: Component-Based Software Engineering. Twenty source-grounded classroom slides, required source review, and one iSCARB decision artifact."><title>iSCARB · Ch16 Component-Based Software Engineering</title><link rel="stylesheet" href="runtime/classroom-v3.css?v=20260926-genai-v12"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 16</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch16-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":16,"title":"Component-Based Software Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260926-genai-v12","filename":"Ch16-Component-Based-SE.html","assignment":7,"points":5,"objectives":["Describe component characteristics and interfaces.","Compare development for and with reuse.","Choose sequential, hierarchical or additive composition.","Diagnose interface incompatibility and specify an adapter.","Read an OCL precondition/postcondition and design a test."],"sections":["16.1 Components and component models","16.2 CBSE processes","16.3 Component composition"],"case":{"headline":"The interfaces match. Their meanings may not.","text":"A fictional data component returns a numeric temperature but its unit is undocumented. A consumer interprets it as Celsius. Normal values appear plausible, but no contract or boundary test establishes the conversion.","question":"Which assumption must be explicit before composition?","mutation":"The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning. The AI forecasting component, trained on Celsius readings, accepts the Fahrenheit values without error and returns confident but wrong forecasts.","lens":"Downstream, the consumer feeds the readings into a vendor’s AI forecasting component. Its documentation says “temperature” without a unit; it was trained on Celsius data. Hold that question: after the contract slides, one slide asks you to write the contract for it."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Component-Based Software Engineering","phase":"START","takeaway":"Component-Based Software Engineering","full":"<p>Component-Based Software Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Components are units of composition","fig":null,"sourceRange":"3–10","bullets":[["Independent unit","A component can be deployed and composed through its interfaces."],["Hidden implementation","Clients need its contract, not its internal code."],["Standards and support","Component models and middleware enable integration."],["Process","Requirements may evolve around available reusable components."]],"question":"Why is every object class not automatically a reusable component?","answer":"A class may depend on compile-time context and hidden implementation knowledge. A reusable component needs an independently usable contract, deployment and explicit dependencies.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Requirements may evolve around available reusable components.","full":"<p><b>Independent unit.<\/b> A component can be deployed and composed through its interfaces.<\/p><p><b>Hidden implementation.<\/b> Clients need its contract, not its internal code.<\/p><p><b>Standards and support.<\/b> Component models and middleware enable integration.<\/p><p><b>Process.<\/b> Requirements may evolve around available reusable components.<\/p>","sourceStart":3},{"id":"X02A","title":"Five characteristics of reusable components","fig":null,"sourceRange":"11–17","bullets":[["Public boundary","All external interactions use defined interfaces."],["Explicit context","State required services instead of depending on hidden neighbors."],["Reuse evidence","Documentation and standards help another team assess the component."]],"question":"Can “independent” mean that a component needs no external service?","answer":"No. Dependencies may exist, but they must be explicitly specified so another implementation can provide the required service.","rows":[["Composable","Interactions use public interfaces and available metadata."],["Deployable","A self-contained executable unit for its component platform."],["Documented","Specify interface syntax and, ideally, semantics."],["Independent","External requirements are explicit, not hidden dependencies."],["Standardized","Conforms to the chosen component model."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"Documentation and standards help another team assess the component.","full":"<p><b>Public boundary.<\/b> All external interactions use defined interfaces.<\/p><p><b>Explicit context.<\/b> State required services instead of depending on hidden neighbors.<\/p><p><b>Reuse evidence.<\/b> Documentation and standards help another team assess the component.<\/p>","sourceStart":11},{"id":"X03","title":"Provides and requires are two sides of a contract","fig":"ch16_interfaces","sourceRange":"11–17","bullets":[["Provides","Services the component offers to others."],["Requires","Services it needs from its environment."],["Compatibility","A provider must meet the consumer’s required contract."],["Encapsulation","Internal state and implementation remain hidden."]],"question":"Why is matching an operation name insufficient for composition?","answer":"Parameter types, units, preconditions, postconditions, error behavior and timing assumptions may still differ.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6a4a7ae477bad9fa.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Internal state and implementation remain hidden.","full":"<p><b>Provides.<\/b> Services the component offers to others.<\/p><p><b>Requires.<\/b> Services it needs from its environment.<\/p><p><b>Compatibility.<\/b> A provider must meet the consumer’s required contract.<\/p><p><b>Encapsulation.<\/b> Internal state and implementation remain hidden.<\/p>","sourceStart":11},{"id":"X04","title":"A component model defines integration standards","fig":"ch16_modelelements","sourceRange":"18–22","bullets":[["Interfaces","Specify operations, parameters, exceptions and definition language."],["Usage","Define naming, metadata access and configuration."],["Deployment","Define packaging, documentation and evolution rules."],["Historical examples","EJB, .NET and web-service models are the source’s examples."]],"question":"What must be known before deploying a binary component?","answer":"The supported model/platform, provided and required interfaces, configuration, packaged dependencies and relevant version/evolution rules.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/acd2fa717aea514a.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"EJB, .NET and web-service models are the source’s examples.","full":"<p><b>Interfaces.<\/b> Specify operations, parameters, exceptions and definition language.<\/p><p><b>Usage.<\/b> Define naming, metadata access and configuration.<\/p><p><b>Deployment.<\/b> Define packaging, documentation and evolution rules.<\/p><p><b>Historical examples.<\/b> EJB, .NET and web-service models are the source’s examples.<\/p>","sourceStart":18},{"id":"MIDDLEWARE","title":"Middleware supplies shared component services","fig":"ch16_middleware","sourceRange":"18–22","bullets":[["Platform services","Addressing, communication, interface and exception support."],["Support services","Examples include security, transactions, concurrency and persistence."],["Container","Mediates access and exposes the model’s services."],["Trade-off","A simple component may not need every service in a large container."]],"question":"Why should transaction handling not be reimplemented independently in every component?","answer":"A consistent shared implementation can reduce duplicated effort and incompatibilities. Its behavior and integration constraints still need verification.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/655ca33c2c431092.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"A simple component may not need every service in a large container.","full":"<p><b>Platform services.<\/b> Addressing, communication, interface and exception support.<\/p><p><b>Support services.<\/b> Examples include security, transactions, concurrency and persistence.<\/p><p><b>Container.<\/b> Mediates access and exposes the model’s services.<\/p><p><b>Trade-off.<\/b> A simple component may not need every service in a large container.<\/p>","sourceStart":18},{"id":"CHECK1","title":"Checkpoint · state the component obligation","fig":null,"sourceRange":"3–22","bullets":[["Think","A component offers a numeric duration parameter."],["Pair","Identify which facts a client must know beyond its type."],["Record","Write the contract claim and its evidence requirement."]],"question":"Which missing detail can make two integer parameters incompatible?","answer":"Their units, allowed range or meaning. Matching a numeric type does not establish semantic compatibility.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Write the contract claim and its evidence requirement.","full":"<p><b>Think.<\/b> A component offers a numeric duration parameter.<\/p><p><b>Pair.<\/b> Identify which facts a client must know beyond its type.<\/p><p><b>Record.<\/b> Write the contract claim and its evidence requirement.<\/p>","sourceStart":3},{"id":"X05","title":"Development for reuse is not development with reuse","fig":"ch16_cbseprocess","sourceRange":"23–39","bullets":[["For reuse","Generalize, document and validate components for future applications."],["With reuse","Discover, evaluate, adapt and integrate available components."],["Interleave","Available components can change requirements and architecture."],["Support","Acquisition, management and certification serve both processes."]],"question":"Who has to discover candidate components before detailed design is settled?","answer":"The team developing with reuse. The team developing for reuse already knows the component it is generalizing, though it still assesses demand and cost.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/267c35ba26f02115.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Acquisition, management and certification serve both processes.","full":"<p><b>For reuse.<\/b> Generalize, document and validate components for future applications.<\/p><p><b>With reuse.<\/b> Discover, evaluate, adapt and integrate available components.<\/p><p><b>Interleave.<\/b> Available components can change requirements and architecture.<\/p><p><b>Support.<\/b> Acquisition, management and certification serve both processes.<\/p>","sourceStart":23},{"id":"X06","title":"Generalize around stable domain abstractions","fig":null,"sourceRange":"23–33","bullets":[["Stable abstraction","Prefer domain concepts that change slowly and recur."],["Generalization","Remove specific methods; make names, dependencies and errors reusable."],["Documentation","Expose assumptions and supported configurations."],["Cost","Future reuse must justify generalization, validation and maintenance."]],"question":"Why should every application-specific module not be generalized immediately?","answer":"Some have little realistic reuse potential. Generalization and documentation cost time, and overly broad interfaces can increase complexity.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Future reuse must justify generalization, validation and maintenance.","full":"<p><b>Stable abstraction.<\/b> Prefer domain concepts that change slowly and recur.<\/p><p><b>Generalization.<\/b> Remove specific methods; make names, dependencies and errors reusable.<\/p><p><b>Documentation.<\/b> Expose assumptions and supported configurations.<\/p><p><b>Cost.<\/b> Future reuse must justify generalization, validation and maintenance.<\/p>","sourceStart":23},{"id":"VALIDATE","title":"Validate in the new context: the Ariane lesson","fig":"ch16_withreuse","sourceRange":"34–39","bullets":[["Discover and evaluate","Assess functions, interfaces and non-functional needs."],["Test harness","Use relevant cases and expected results, not only supplier claims."],["Source case","Software from Ariane 4 was reused for Ariane 5."],["Changed context","A value range that was safe before was no longer safe."]],"question":"(1) What does a supplier’s passed test not necessarily establish? (2) What question should precede “it worked reliably in the previous system”?","answer":"(1) That the component meets this application’s contract, workload and environment. The tested conditions may differ. (2) Which assumptions about inputs, ranges, activated functionality and failure handling remain valid in the new system? The source case is historical, not a new experiment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/336b7a7881505be5.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Prior success is evidence for its earlier context—not every new one.","full":"<p><b>Discover and evaluate.<\/b> Assess functions, interfaces and non-functional needs.<\/p><p><b>Test harness.<\/b> Use relevant cases and expected results, not only supplier claims.<\/p><p><b>Unused behavior.<\/b> Extra functionality can still activate or affect the application.<\/p><p><b>Assumptions.<\/b> Document the new operating context and what remains unknown.<\/p><p><b>Source case.<\/b> Software from Ariane 4 was reused for Ariane 5.<\/p><p><b>Changed context.<\/b> A value range that was safe before was no longer safe.<\/p><p><b>Failure pathway.<\/b> An unhandled conversion exception affected the reference system.<\/p><p><b>Lesson.<\/b> Prior success is evidence for its earlier context—not every new one.<\/p>","sourceStart":34,"notes":""},{"id":"B01","title":"Three composition forms; three call relationships","fig":"ch16_composition","sourceRange":"40–43","bullets":[["Sequential","An external caller invokes A, then uses its result to call B."],["Hierarchical","A directly calls B to obtain a required service."],["Additive","One composed interface exposes independent services from A and B."],["Glue code","Reconcile invocation order, data and interface differences when necessary."]],"question":"If A and B never call one another but an application calls them in order, which form is this?","answer":"Sequential composition. The external application coordinates the calls and may transform A’s output for B.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/2039319212ce1e2a.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Reconcile invocation order, data and interface differences when necessary.","full":"<p><b>Sequential.<\/b> An external caller invokes A, then uses its result to call B.<\/p><p><b>Hierarchical.<\/b> A directly calls B to obtain a required service.<\/p><p><b>Additive.<\/b> One composed interface exposes independent services from A and B.<\/p><p><b>Glue code.<\/b> Reconcile invocation order, data and interface differences when necessary.<\/p>","sourceStart":40},{"id":"CHECK2","title":"Checkpoint · explain the adapter","fig":null,"sourceRange":"40–50","bullets":[["Think","The consumer expects one unit and the provider expects another."],["Pair","Define conversion, invalid inputs and the postcondition."],["Record","Add the adapter mechanism and a counterexample test."]],"question":"Why is multiplying by a conversion constant not a complete adapter contract?","answer":"Range, rounding, invalid inputs, provider failures and the returned state must also satisfy the consumer’s contract.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the adapter mechanism and a counterexample test.","full":"<p><b>Think.<\/b> The consumer expects one unit and the provider expects another.<\/p><p><b>Pair.<\/b> Define conversion, invalid inputs and the postcondition.<\/p><p><b>Record.<\/b> Add the adapter mechanism and a counterexample test.<\/p>","sourceStart":40},{"id":"R09","title":"Adapters reconcile explicit incompatibilities","fig":"ch16_adaptor","sourceRange":"44–50","bullets":[["Parameters","Types, number, representation or units differ."],["Operations","Names differ or a required operation is missing."],["Adaptation","Translate calls/results or provide a justified missing service."],["Limit","An adapter cannot silently invent unspecified semantics."]],"question":"How can the data collector use several sensor interfaces?","answer":"An adapter interprets the collector’s generic command and invokes the particular sensor operation, then returns the expected representation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/b8feb8a84c04a27e.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"An adapter cannot silently invent unspecified semantics.","full":"<p><b>Parameters.<\/b> Types, number, representation or units differ.<\/p><p><b>Operations.<\/b> Names differ or a required operation is missing.<\/p><p><b>Adaptation.<\/b> Translate calls/results or provide a justified missing service.<\/p><p><b>Limit.<\/b> An adapter cannot silently invent unspecified semantics.<\/p>","sourceStart":44},{"id":"D16","title":"OCL states obligations before and after an operation","fig":null,"sourceRange":"51–55","bullets":[["Precondition","What must hold before the operation."],["Postcondition","What must hold after it."],["Invariant","A condition that must remain true for the modeled object."],["@pre","Refers to the value before the operation."]],"question":"What does size = size@pre + 1 require after addItem?","answer":"The resulting size is one greater than the pre-operation size. Other postconditions are still needed to say which item and metadata were stored.","rows":[["addItem pre","No existing photograph with the same identifier."],["addItem post","Size increases by one; retrieve(pid) returns the added photo."],["delete pre","The photograph exists."],["delete post","Photo disappears; size decreases; the source retains its catalog entry."]],"heads":null,"extra":"The source’s Photo Library additionally assumes libSize() > 0 because creation adds an initial item. Preserve that explicit modeling assumption; it is not a universal library requirement.","phase":"LEARN","takeaway":"Refers to the value before the operation.","full":"<p><b>Precondition.<\/b> What must hold before the operation.<\/p><p><b>Postcondition.<\/b> What must hold after it.<\/p><p><b>Invariant.<\/b> A condition that must remain true for the modeled object.<\/p><p><b>@pre.<\/b> Refers to the value before the operation.<\/p>","sourceStart":51},{"id":"D16B","title":"Composition changes emergent qualities","fig":"ch16_datacollect","sourceRange":"56–59","bullets":[["Separation","Separate reporting and data management can improve adaptability."],["Integration","A combined product can reduce communication overhead in the source example."],["Trade-off","Functionality, performance, dependability and evolution can conflict."],["Evidence","Assess the implemented composition, not only isolated components."]],"question":"Why can two individually acceptable components form an unacceptable system?","answer":"Their interaction can introduce latency, incompatible state assumptions or incorrect data interpretation. Those are properties of the composition.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1ee3d9d0236ec757.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Assess the implemented composition, not only isolated components.","full":"<p><b>Separation.<\/b> Separate reporting and data management can improve adaptability.<\/p><p><b>Integration.<\/b> A combined product can reduce communication overhead in the source example.<\/p><p><b>Trade-off.<\/b> Functionality, performance, dependability and evolution can conflict.<\/p><p><b>Evidence.<\/b> Assess the implemented composition, not only isolated components.<\/p>","sourceStart":56},{"id":"AISYS","phase":"LEARN","skin":"genai","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source concepts to an AI component","sourceStart":1,"banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · WRITE THE CONTRACT","caption":"A model will accept almost any number you give it. The contract has to say which numbers mean what."},"title":"Write the contract for an AI component","takeaway":"An AI component still needs a contract—and a quality requirement no single call can check.","nodes":[["pre:","unit = 'Celsius' and -40 <= t and t <= 60"],["post:","result.unit = 'Celsius' and result.modelVersion = approvedVersion"],["quality (not OCL):","mean forecast error ≤ stated bound on held-out data"]],"bullets":[["Precondition","Which input would the model accept silently but wrongly?"],["Postcondition","What can each single call guarantee?"],["Quality requirement","What can only be shown over many calls?"]],"question":"Which clause would have caught the Fahrenheit problem, and which requirement cannot be written as an OCL postcondition?","answer":"The precondition: stating unit = 'Celsius' with a plausible range, checked at the adapter, rejects Fahrenheit values that a model trained on Celsius would otherwise accept and turn into confident but wrong forecasts—though a value plausible in both units still needs the unit declared, not inferred. OCL pre- and postconditions constrain each individual call, so the forecast-error bound cannot be one: no single call satisfies or violates it. It belongs in a separate quality requirement verified on a held-out evaluation set and re-checked when the input distribution or model version changes. Recording the approved model version in the postcondition, or as an invariant on the component, makes a version change a contract change that needs re-validation.","full":"<p>This slide is course-added. It applies the chapter’s contract and composition ideas to an AI component, using OCL-style clauses.<\/p><h3>How the slide uses the five objectives<\/h3><p>Component characteristics: an AI component must be documented, including its expected inputs and training assumptions, before another team can assess it. Development with reuse: requirements may need to adapt to what the model supports. Composition: the forecaster is composed sequentially after the data component, so its assumptions meet the provider’s outputs. Adapters: unit conversion must be explicit and specified, never inferred by the model. OCL: preconditions, postconditions and invariants express per-call obligations; aggregate accuracy needs a separate quality requirement.<\/p><p><b>Training distribution.<\/b> The range and kind of inputs a model learned from. Outside it, a model usually still produces an answer, often with high confidence, which is why the precondition must be enforced outside the model.<\/p><p><b>Aggregate quality requirement.<\/b> In OCL, pre- and postconditions constrain each individual operation call. A promise about behaviour over many calls—such as a mean error bound on held-out data—cannot be expressed that way. State it as a separate quality requirement, verified by evaluation rather than by a runtime assertion on one result.<\/p><p><b>Version as part of the contract.<\/b> A new model version can keep the same signature and change behaviour, so the approved version belongs in the contract, like any other semantic assumption.<\/p><p class=\"small\">The case is course-created. Optional further reading: Amershi et al. (2019), <i>Software Engineering for Machine Learning: A Case Study<\/i>.<\/p>","notes":"Allow about 6 minutes. Format: write the contract. Pairs write one precondition and one postcondition for the forecaster before revealing the clauses on the slide. New terms, at most two: training distribution and aggregate quality requirement. Everything else in Full explanation is optional depth and is not assessed."},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Matching types is not matching meaning.","bullets":[["New information","The provider uses Fahrenheit; the AI forecaster silently accepts it."],["Reassess","No contract stated the unit, so nothing rejected it."],["Revise","Add a unit precondition and an explicit adapter; re-validate forecasts."],["Own","Name who owns the contract and who informs forecast users."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. For the forecaster, state the unit and range as a precondition at the adapter, and re-validate forecasts produced since the mismatch began before anyone relies on them.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. Which assumption must be explicit before composition? What would the AI forecasting component need stated to reject a wrong unit?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the supplied facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. A model accepts almost any number; unless a precondition states the unit and a plausible range, nothing rejects a value in the wrong unit.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, an adapter that converts units explicitly, or relying on the AI component to cope with whatever it receives.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. An explicit adapter with a stated unit contract can be tested at its boundary; a model ‘coping’ is untestable behaviour that may simply produce confident wrong output.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning. The AI forecasting component, trained on Celsius readings, accepts the Fahrenheit values without error and returns confident but wrong forecasts.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The forecasts inherited the unit error silently; the model’s confidence is not evidence that its input meant what it assumed.","note":"This is the public classroom mutation. The assessed assignment retains a different STRESS item hidden until confirmed commitment.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["B01"],"evidence":"The named mechanism explains how behavior changes.
