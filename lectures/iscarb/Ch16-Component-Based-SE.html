interface for a PhotoLibrary component:\n</div></details><details class=\"lp-source-section\" id=\"source-slide-52\"><summary>Slide 52 · Photo Library documentation</summary><div class=\"lp-source-text\">Photo Library documentation\n\n“This method adds a photograph to the library and associates the photograph identifier and catalogue descriptor with the photograph.”\n\n “what happens if the photograph identifier is already associated with a photograph in the library?”\n\n“is the photograph descriptor associated with the catalogue entry as well as the photograph i.e. if I delete the photograph, do I also delete the catalogue information?”\n</div></details><details class=\"lp-source-section\" id=\"source-slide-53\"><summary>Slide 53 · The Object Constraint Language</summary><div class=\"lp-source-text\">The Object Constraint Language\nThe Object Constraint Language (OCL) has been designed to define constraints that are associated with UML models.\nIt is based around the notion of pre and post condition specification – common to many formal methods.</div></details><details class=\"lp-source-section\" id=\"source-slide-54\"><summary>Slide 54 · The OCL description of the Photo Library interface </summary><div class=\"lp-source-text\">The OCL description of the Photo Library interface \n-- The context keyword names the component to which the conditions apply\n\ncontext addItem \n\n-- The preconditions specify what must be true before execution of addItem\npre: PhotoLibrary.libSize() &gt; 0\nPhotoLibrary.retrieve(pid) = null\n\n-- The postconditions specify what is true after execution\npost:libSize () = libSize()@pre + 1\nPhotoLibrary.retrieve(pid) = p \nPhotoLibrary.catEntry(pid) = photodesc\n\ncontext delete\n\npre: PhotoLibrary.retrieve(pid) &lt;&gt; null ;\n\npost: PhotoLibrary.retrieve(pid) = null\nPhotoLibrary.catEntry(pid) = PhotoLibrary.catEntry(pid)@pre\nPhotoLibrary.libSize() = libSize()@pre—1\n</div></details><details class=\"lp-source-section\" id=\"source-slide-55\"><summary>Slide 55 · Photo library conditions</summary><div class=\"lp-source-text\">Photo library conditions\nAs specified, the OCL associated with the Photo Library component states that:\nThere must not be a photograph in the library with the same identifier as the photograph to be entered;\nThe library must exist - assume that creating a library adds a single item to it;\nEach new entry increases the size of the library by 1;\nIf you retrieve using the same identifier then you get back the photo that you added;\nIf you look up the catalogue using that identifier, then you get back the catalogue entry that you made.</div></details><details class=\"lp-source-section\" id=\"source-slide-56\"><summary>Slide 56 · Composition trade-offs</summary><div class=\"lp-source-text\">Composition trade-offs\nWhen composing components, you may find conflicts between functional and non-functional requirements, and conflicts between the need for rapid delivery and system evolution.\nYou need to make decisions such as:\nWhat composition of components is effective for delivering the functional requirements?\nWhat composition of components allows for future change?\nWhat will be the emergent properties of the composed system?</div></details><details class=\"lp-source-section\" id=\"source-slide-57\"><summary>Slide 57 · Data collection and report generation components </summary><div class=\"lp-source-text\">Data collection and report generation components </div></details><details class=\"lp-source-section\" id=\"source-slide-58\"><summary>Slide 58 · Key points</summary><div class=\"lp-source-text\">Key points\nCBSE is a reuse-based approach to defining and implementing loosely coupled components into systems.\nA component is a software unit whose functionality and dependencies are completely defined by its interfaces.\nComponents may be implemented as executable elements included in a system or as external services.\nA component model defines a set of standards that component providers and composers should follow.\nThe key CBSE processes are CBSE for reuse and CBSE with reuse.</div></details><details class=\"lp-source-section\" id=\"source-slide-59\"><summary>Slide 59 · Key points</summary><div class=\"lp-source-text\">Key points\nDuring the CBSE process, the processes of requirements engineering and system design are interleaved.\nComponent composition is the process of ‘wiring’ components together to create a system.\nWhen composing reusable components, you normally have to write adaptors to reconcile different component interfaces.\nWhen choosing compositions, you have to consider required functionality, non-functional requirements and system evolution.</div></details>"}], "noAnswer": true, "sourceRange": "51–59", "appendix": true}, {"k": "R01", "answer": "One defensible request is an assumption register for the AlertManager component, signed by the integration engineer, listing every assumption carried over from the financial trading source system. It distinguishes a real assumption failure from a single missed alert. Pending that evidence, state a bounded keep, replace, or wrap decision, its owner and the condition for resuming operation.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence a component integration decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "The Mentcare system integrated AlertManager, an EJB component reused from a financial trading system. During a mental health crisis, the alert failed to fire.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Keep, replace, or wrap the AlertManager tonight?", "txt": "AlertManager assumed all alerts are financial transactions with transaction IDs. Patient alerts have no transaction IDs, so the assumption broke and the alert failed to fire during a mental health crisis. Do you keep, replace, or wrap the component?"}, {"c": "mag", "lab": "UNKNOWN", "lead": "The component was certified &ldquo;reliable&rdquo; in financial trading. Tonight is not financial trading.", "txt": "The component was tested in a financial trading context where every alert has a transaction ID. Patient alerts do not. The certification held for the source domain and broke for the target domain. That is the gap."}]}, {"t": "principle", "txt": "CBSE emerged from the failure of object-oriented development to support effective reuse. Single object classes are too detailed and specific. The goal tonight is not certainty &mdash; it is a defensible boundary with a named assumption behind it.", "src": "P1 · p.3"}], "timebox": "90 sec", "task": "Name the one piece of evidence you would demand before letting AlertManager run another hour.", "say": "You are the integration engineer on call. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching and is not a report of a real incident. Every rule tonight returns to this component. The classic mistake is explaining the characteristics before the students feel the pressure of the decision.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers &mdash; and what you must prove", "sub": "Five sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "CBSE FUNDAMENTALS", "txt": "What is a component?", "src": "P1 · p.3"}, {"c": "sand", "lab": "COMPONENT MODELS", "txt": "EJB, COM+, CORBA CCM?", "src": "P1 · p.8"}, {"c": "teal", "lab": "CBSE PROCESSES", "txt": "For reuse vs with reuse?", "src": "P1 · p.23"}, {"c": "sand", "lab": "IDENTIFICATION", "txt": "Trust, validation, Ariane 5?", "src": "P1 · p.34"}, {"c": "teal", "lab": "COMPOSITION", "txt": "Sequential, hierarchical, additive?", "src": "P1 · p.40"}, {"c": "sand", "lab": "ADAPTORS & OCL", "txt": "How do we reconcile interfaces?", "src": "P1 · p.44"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish the five component characteristics and the provides/requires interface distinction."}, {"c": "teal", "lab": "2", "txt": "Trace a component integration through CBSE for reuse and CBSE with reuse to the trade-off."}, {"c": "teal", "lab": "3", "txt": "Specify a composition strategy using sequential, hierarchical, or additive composition with adaptors."}, {"c": "mag", "lab": "4", "txt": "Build a bounded component verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the component assumption, source, or composition type changes."}]}], "timebox": "90 sec", "task": "Note which of the six sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total, no more. This slide exists so nobody leaves tonight unsure what was in the chapter and what was not.", "appendix": true, "route": "toolkit"}, {"k": "X02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Explain why competing component standards hindered CBSE uptake, and how service-oriented SE differs.", "title": "Component standards &mdash; and why they hindered CBSE", "sub": "Several competing standards were established. Multiple standards hindered the uptake of CBSE.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "EJB", "lead": "Sun Microsystems standard.", "txt": "Enterprise Java Beans. The standard used by tonight&rsquo;s AlertManager.", "src": "P1 · p.6"}, {"c": "sand", "lab": "COM+ / .NET", "lead": "Microsoft standard.", "txt": "The COM+ and .NET component model. Components cannot interoperate with EJB.", "src": "P1 · p.6"}, {"c": "violet", "lab": "CORBA CCM", "lead": "CORBA Component Model.", "txt": "A third standard, incompatible with both EJB and COM+.", "src": "P1 · p.6"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE PROBLEM", "lead": "Components developed using different approaches cannot work together.", "txt": "In practice, these multiple standards have hindered the uptake of CBSE. Components from different models may require bridging, wrappers or adapters rather than direct composition.", "src": "P1 · p.6"}, {"c": "mag", "lab": "SERVICE-ORIENTED SE", "lead": "Services are replacing CBSE in many systems.", "txt": "A service is a type of independent component with a provides interface but not a requires interface. Services use shared communication standards, but interoperability, semantics and failures still require validation. Covered in Chapter 18.", "src": "P1 · p.7"}]}, {"t": "principle", "c": "mag", "txt": "Multiple competing standards killed CBSE&rsquo;s promise of universal reuse. Service-oriented SE is replacing it."}], "timebox": "2 min", "task": "Name which standard the AlertManager uses, and which standards it cannot interoperate with.", "notes": "Two minutes. The room usually focuses on the technical differences between EJB, COM+, and CORBA CCM. The deeper point is that competing standards hindered CBSE uptake. A student who says &ldquo;just pick one standard&rdquo; has not understood; the chapter&rsquo;s point is that the existence of competing standards is itself the problem.", "appendix": true, "_iscarbRule": "X02 - Component standards and service-oriented SE", "route": "toolkit"}, {"k": "R18", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Explain the Ariane 5 failure in depth and connect it to tonight&rsquo;s AlertManager crisis.", "title": "What survives of Ariane 5 here", "sub": "A strong process removes assumption ambiguity before the day it is needed &mdash; and knows where its assumptions stop.", "blocks": [{"t": "figure", "img": "ch16_identification", "cap": "supplied source diagram", "right": []}, {"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.16 &mdash; Ariane 5 failure", "items": [{"c": "teal", "lab": "1 · THE FAILURE", "lead": "37 seconds after take-off, 1996.", "txt": "The first test flight of the Ariane 5 rocket ended in disaster when the launcher went out of control 37 seconds after take-off. The problem was a reused component from a previous version of the launcher (the Inertial Navigation System) that failed because assumptions made when that component was developed did not hold for Ariane 5.", "src": "P1 · p.39"}, {"c": "teal", "lab": "2 · THE REUSED COMPONENT", "lead": "Inertial Navigation System from Ariane 4.", "txt": "The Inertial Navigation System was reused from Ariane 4. The component assumed the rocket&rsquo;s trajectory would follow Ariane 4&rsquo;s flight path. Ariane 5 had a different trajectory, and the assumption broke.", "src": "P1 · p.39"}, {"c": "teal", "lab": "3 · THE FUNCTIONALITY WAS NOT REQUIRED", "lead": "The failed functionality was not even needed in Ariane 5.", "txt": "The functionality that failed in this component was not required in Ariane 5. The component was reused for convenience, not for the failing functionality &mdash; and the failing functionality brought the launcher down.", "src": "P1 · p.39"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "not in the chapter &mdash; your context", "items": [{"t": "wide", "c": "mag", "lab": "BACK TO TONIGHT&rsquo;S CRISIS &mdash; THE PARALLEL NOBODY CALLED A DESIGN DECISION", "lead": "The hospital reused AlertManager from financial trading. The transaction-ID assumption held in financial trading. The functionality that failed (transaction logging) is not even required for patient alerts.", "txt": "The thing that put you in the room was a <i>component reused without checking its assumptions</i>: the Mentcare team reused AlertManager without checking the transaction-ID assumption. Three questions the Ariane 5 case owes an answer to. <b>Which assumption</b> did the source domain make? <b>Which assumption</b> did the target domain violate? <b>Which functionality</b> was reused for convenience but caused the failure? A defined certification process answers these in advance; an improvised one discovers them at the first crisis."}]}}, {"t": "principle", "txt": "The line is not &ldquo;reuse vs build&rdquo;. It is &ldquo;certified the assumptions&rdquo; against &ldquo;did not certify the assumptions.&rdquo;"}], "timebox": "2 min", "task": "Name the assumption that broke in Ariane 5, and the parallel assumption in tonight&rsquo;s AlertManager.", "notes": "The Ariane 5 case is the chapter&rsquo;s own version of tonight&rsquo;s crisis. Say that &mdash; it is the one thing on this slide students can use in their project next week. <b>Then spend a full minute on the magenta card.</b> The crisis that opened the hour was a component reused without checking its assumptions, and the room has spent seventy minutes arguing about the system without once asking about the certification process. Three answers to look for &mdash; the source-domain assumption (transaction IDs), the target-domain violation (patient alerts have no IDs), and the reused-but-not-required functionality (transaction logging). A student who says &ldquo;they should have tested more&rdquo; has not read the case; push for which assumption and which functionality.", "appendix": true, "_iscarbRule": "RULE 18 - Ariane 5 deep dive", "route": "toolkit"}, {"k": "R10", "loadOk": "The 3x3 matrix and two fields describe one component-risk triage record. Students classify three risks and specify one monitor and one identification tool.", "answer": "Place, for example, the transaction-ID assumption risk (probability High, exposure High, Intolerable), the adaptor divergence risk (probability Medium, exposure Medium, ALARP), and the certification gap risk (probability Medium, exposure High, ALARP) in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity (patient alerts with no transaction ID vs alerts successfully fired by AlertManager), observation window (every shift handover), trigger value (any patient alert that fails to fire), named owner (integration engineer) and fallback action (switch to the fallback alerting path). A component validation framework or an assumption register can identify the transaction-ID risk; retain the register as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it on a component matrix.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure if AlertManager will ever fire correctly on patient alerts&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact you can hand to a reviewer &mdash; e.g. AlertManager was reused from financial trading; the transaction-ID assumption held in the source domain."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Tonight&rsquo;s gap: are there other assumptions in AlertManager that do not hold for patient alerts?"}, {"c": "violet", "lab": "MONITORED", "txt": "An unknown with a measured quantity, observation window, trigger value, named owner and fallback action. The unknown becomes a risk on a schedule."}]}]}, {"t": "wide", "c": "sand", "lab": "PLACE TONIGHT&rsquo;S RISKS ON THE MATRIX", "picker": {"g": "risk3", "options": ["Transaction-ID assumption", "Adaptor divergence risk", "Certification gap", "Other assumption failures"]}, "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a component risk with a component validation framework or an assumption register, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; KLO 3 / GKU 8", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "One tool or method you would use to identify a component risk in this system"}}, {"t": "principle", "txt": "Approval = evidence state + uncertainty statement + monitoring plan."}], "timebox": "3 min", "task": "Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger. <b style=\"color:var(--mag)\">You are the integration engineer.</b>", "notes": "This unit carries the one Jahiziah outcome the department mapped to this course and found uncovered. Make every student write something in that field. Do not accept a monitored risk without a trigger value and a named owner. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the engineer who claims, the engineer who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "Component claims fail not because nobody chose a component &mdash; but because the integration decision has no owner able to defend it.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · OWNER", "lead": "The integration engineer who decides.", "txt": "Names the verdict and the composition strategy. Owns the consequence. The on-call integration engineer tonight &mdash; not the developer, not the vendor, not the AI."}, {"c": "sand", "lab": "2 · EVIDENCE OWNER", "lead": "The engineer who maintains the assumption register and the certification report.", "txt": "Maintains the inspectable artifact: the assumption register, the requires interface analysis, the certification report, the integration architecture. Cannot be the same person as the owner."}, {"c": "mag", "lab": "3 · SIGN-OFF", "lead": "The authority who accepts the residual risk.", "txt": "The hospital&rsquo;s IT steering committee or the regulator&rsquo;s reviewer. Accepts the bounded residual risk on the evidence the owner and evidence owner produced."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S GAP", "lead": "A component deployed without an assumption register, no certification report, no requires interface analysis &mdash; one project manager signing off their own integration.", "txt": "The system went live with one project manager&rsquo;s signature on a component that was assumed to work in the patient domain. That is owner, evidence owner and sign-off collapsed into a single person &mdash; which is why the assumption could not be audited when the gap arrived.", "field": {"id": "accountability", "core": false, "rows": 2, "ph": "For your verdict: who is the owner, who is the evidence owner, and who signs off?"}}, {"t": "principle", "txt": "Owner &ne; evidence owner &ne; sign-off. Three roles, three people."}], "timebox": "2 min", "task": "For the verdict you signed at Rule 07: name the owner, the evidence owner, and the sign-off authority.", "notes": "Two minutes. The accountability trio is the rule most assignments miss. Make every student name three different people tonight; if they cannot, the verdict is not yet dependable.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about a component in the section of the source that answers it.", "title": "What Chapter 16 trains you to do", "sub": "Six questions the AlertManager cannot answer tonight. Each one is a section of the chapter &mdash; and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "CBSE FUNDAMENTALS", "txt": "What is a component?", "src": "P1 · p.3"}, {"c": "sand", "lab": "COMPONENT MODELS", "txt": "EJB, COM+, CORBA CCM?", "src": "P1 · p.8"}, {"c": "teal", "lab": "CBSE PROCESSES", "txt": "For reuse vs with reuse?", "src": "P1 · p.23"}, {"c": "sand", "lab": "IDENTIFICATION", "txt": "Trust, validation, Ariane 5?", "src": "P1 · p.34"}, {"c": "teal", "lab": "COMPOSITION", "txt": "Sequential, hierarchical, additive?", "src": "P1 · p.40"}, {"c": "sand", "lab": "ADAPTORS & OCL", "txt": "How do we reconcile interfaces?", "src": "P1 · p.44"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Ninety seconds, two answers, no more. Most students pick component identification because of Ariane 5; the chapter&rsquo;s own answer is CBSE processes. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition &mdash; and every one of these is something you will do to the AlertManager in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish the five component characteristics and the provides/requires interface distinction."}, {"c": "teal", "lab": "2", "txt": "Trace a component integration through CBSE for reuse and CBSE with reuse to the trade-off."}, {"c": "teal", "lab": "3", "txt": "Specify a composition strategy using sequential, hierarchical, or additive composition with adaptors."}, {"c": "mag", "lab": "4", "txt": "Build a bounded component verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the component assumption, source, or composition type changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone &mdash; the artifact every other outcome feeds.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: the AlertManager is accepted without an assumption register. JUDGMENT then fails because the team cannot show which assumptions were carried over from financial trading.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing a component failure from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Separate provides from requires.", "src": "Rule 05 · X01"}, {"c": "mag", "lab": "", "txt": "Accept, revise or reject the component.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Name an assumption, not an intention.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the failure up the sociotechnical stack.", "src": "X02"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A patient bears what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them.", "task": "Which capability fails first when a team trusts a certified component without an assumption register?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE &mdash; a certified component fails not because nobody analysed it but because nobody made the assumption register inspectable. Do not give the answer; let two students argue it for thirty seconds.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: Deployability is the promise to the hospital. It holds only if the component is self-contained AND nobody checked whether its internal assumptions hold in the new domain. The prediction is bounded by the missing assumption check, not by the certification.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which characteristic failed tonight?", "picker": {"g": "predict", "options": ["Composable", "Deployable", "Documented", "Independent", "Standardized"]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. AlertManager assumes transaction IDs, reused from financial trading, no assumption check"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment gateway, not from tonight:</i> &ldquo;This holds only if the retry queue drains faster than new requests arrive. If it does not, the queue is the thing that fails, not the payment service &mdash; and nobody has measured the drain rate under holiday load.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unmeasured</b>."}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the five characteristic names &mdash; you have not met them yet. Start from the room. An alert component reused from financial trading failed to fire on a patient alert during a mental health crisis. Ask what the component assumed about its alerts, and which assumption broke first tonight. Then say which characteristic that assumption belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;. If you cannot finish it, the box that is actually empty is CONSTRAINT: name what stops you choosing differently tonight.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move; splitting them across two slides would let a student predict without deriving, which is the failure this rule exists to prevent.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color:var(--mag)\">You are the integration engineer.</b>", "notes": "Three minutes. The DERIVE box is the one students skip &mdash; walk the room and refuse an empty one. This whole rule collapses if you reveal the source figure first.", "appendix": true, "route": "toolkit"}, {"k": "H01", "noAnswer": true, "rule": "HELPER - while DERIVE needs development", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a blank derivation into a question they can answer, by starting from the situation rather than the vocabulary.", "showIf": {"thin": ["f:p_derive"], "minKey": "coachDeep"}, "title": "Three questions instead of the answer", "sub": "This slide is here because your derivation box is still blank, or holds a single clause. It does not contain the answer &mdash; the reveal is the next slide and it is worth more to you if you commit first.", "badge": {"c": "", "t": "SCAFFOLD", "s": "appears only if you need it"}, "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 &nbsp; WHAT WAS PROMISED", "lead": "Which promise to the hospital broke first tonight?", "txt": "A component promises independent deployment, well-defined interfaces, and reuse without modification. Say which of those promises tonight&rsquo;s assumption failure threatens first &mdash; and you have named the component failure without needing its textbook name."}, {"c": "sand", "lab": "2 &nbsp; WHO IS AWAKE", "lead": "A reused component behaves differently when its source domain differs from its target.", "txt": "It is a mental health crisis. The AlertManager was reused from financial trading. Ask what that tells you about how the assumption was <i>made</i>, not about how it was <i>fixed</i>. A reused component behaves differently when its assumptions do not transfer."}, {"c": "mag", "lab": "3 &nbsp; WHAT WOULD CHANGE YOUR MIND", "lead": "Finish the sentence &ldquo;I would drop this if I saw &hellip;&rdquo;.", "txt": "Finish this sentence: &ldquo;I would drop this prediction if I saw &hellip;&rdquo;. Whatever you put after &ldquo;if I saw&rdquo; is your constraint, and the reason it holds is your derivation. Write that sentence in the boxes on the previous slide."}]}, {"t": "principle", "c": "mag", "txt": "A blank box is not a gap in knowledge. It is usually a question asked at the wrong altitude."}], "timebox": "90 sec", "task": "Answer any one of the three out loud, then press &larr; and finish DERIVE properly.", "notes": "You will usually not see this slide at all &mdash; it renders while DERIVE falls below the same scaffolding threshold used by the R05 coach. Pick the one question that matches what you saw while walking the room. Ninety seconds, then send them back.", "appendix": true, "route": "toolkit"}, {"k": "QA1", "noAnswer": true, "rule": "RETRIEVAL LOOP - Understand", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the phase&rsquo;s load-bearing moves from memory: the evidence request, the chapter&rsquo;s six questions, the outcome currency and the four parts of the prediction gate.", "title": "Sixty seconds on Understand", "sub": "Before the source expansion opens: four questions, memory first. Reveal only to check, then score yourself honestly.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 01 &middot; 02 &middot; 03 &middot; 05", "items": [{"q": "A reused AlertManager failed to fire on a patient alert. Name the one evidence request that separates a real assumption failure from a single missed alert.", "a": "A signed assumption register for the AlertManager, listing every assumption carried over from the financial trading source system. Until it exists the decision stays bounded: keep, replace, or wrap, with a named owner and a condition for resuming operation."}, {"q": "Chapter 16 trains you to answer six questions about any component decision. Say any four.", "a": "What is a component (CBSE fundamentals)? What are EJB, COM+, CORBA CCM (component models)? For reuse vs with reuse (CBSE processes)? Trust, validation, Ariane 5 (identification)? Sequential, hierarchical, additive (composition)? How do we reconcile interfaces (adaptors and OCL)?"}, {"q": "All five outcomes of this hour end in the same currency. What is it?", "a": "Evidence, not recognition &mdash; and outcome 4 is the one the others feed: a bounded component verdict with inspectable evidence and a structured argument."}, {"q": "The prediction gate makes you commit to four things before the reveal. Name all four.", "a": "PREDICT the characteristic &middot; state the CONSTRAINT &middot; DERIVE it from first principles &middot; NAME the principle used &mdash; then sign, so the reveal costs something."}]}], "timebox": "60 sec", "task": "Cover the answers. Say all four out loud from memory before you reveal anything &mdash; then score yourself honestly.", "notes": "Sixty seconds on the ring. The four questions are the phase&rsquo;s load-bearing moves, not a quiz &mdash; a miss on question 1 means Rule 01 needs one more pass before the source expansion assumes it.", "appendix": true, "route": "toolkit"}, {"k": "QA2", "noAnswer": true, "rule": "RETRIEVAL LOOP - Source", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the four CBSE essentials, the five characteristics, the two definitions, and the four CBSE processes.", "title": "Sixty seconds on the source foundations", "sub": "Checkpoint before the rest of Chapter 16: four questions from the first source cluster &mdash; memory first, reveal second.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "X01 &middot; X02 &middot; X02A &middot; X07", "items": [{"q": "Name the four CBSE essentials.", "a": "<b>1.</b> Independent components specified by their interfaces. <b>2.</b> Component standards to facilitate integration. <b>3.</b> Middleware that provides support for inter-operability. <b>4.</b> A development process that is geared to reuse."}, {"q": "Name the five component characteristics.", "a": "<b>1. Composable</b> (all external interactions through public interfaces). <b>2. Deployable</b> (self-contained, runs on a platform). <b>3. Documented</b> (interface syntax and semantics specified). <b>4. Independent</b> (no required specific other components). <b>5. Standardized</b> (conforms to a standard component model)."}, {"q": "Say tonight&rsquo;s decision as the three-part sentence: process chosen, trade-off made, process that should have been used.", "a": "The Mentcare team chose CBSE with reuse (integrate AlertManager) with the trade-off of inheriting source-domain assumptions, which failed because the transaction-ID assumption did not hold in the patient-alert domain; they should have used component certification to catch the assumption before integration."}, {"q": "What are the four CBSE processes? Name at least three.", "a": "<b>1.</b> CBSE for reuse (develop reusable components). <b>2.</b> CBSE with reuse (develop new applications using existing components). <b>3.</b> Component acquisition (acquire components for reuse). <b>4.</b> Component certification (independent check that the component meets its specification). Component management and legacy wrapping are supporting processes."}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop, now over the first source cluster. Question 2 is the one that pays all semester &mdash; the five characteristics are the vocabulary for every later discussion. Sixty seconds, then move.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: a reused AlertManager fails because its transaction-ID assumption does not hold. CRISIS: the alert did not fire during a mental health crisis. MAP: AlertManager (EJB), TransactionLog requires interface, financial trading source, Mentcare target. TRADE-OFF: keep the component and patch the assumption (quick but risky) vs replace with a patient-domain component (slow but correct). EVIDENCE: assumption register, requires interface analysis, certification report. VERDICT: replace or wrap, with a named owner for the integration.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source CBSE processes into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies CBSE processes; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "A reused alert component failed to fire on a patient alert."}, {"c": "teal", "lab": "2 MAP", "txt": "AlertManager, TransactionLog, financial trading source, Mentcare target, EJB container."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Keep and patch (quick, risky) vs replace with patient-domain component (slow, correct)."}, {"c": "violet", "lab": "4 EVIDENCE", "txt": "Assumption register, requires interface analysis, certification report."}, {"c": "green", "lab": "5 VERDICT", "txt": "Keep, replace, or wrap &mdash; bounded, with a monitor."}]}, {"t": "principle", "txt": "Predict -&gt; Constraint -&gt; Derive -&gt; Name"}], "timebox": "2 min", "hueOk": "CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide.", "task": "Run tonight&rsquo;s case through the five steps in one sentence each.", "notes": "Two minutes. The slide exists so the room can hear the flow once before they have to live in it. The most common mistake is to stop at EVIDENCE without a VERDICT &mdash; an evidence list with no decision attached is exactly the unbounded claim Rule 04 refuses.", "appendix": true, "route": "toolkit"}, {"k": "R07", "loadOk": "The decision card has six named slots plus an evidence policy line and an inspectable artifact preview. Students fill all six from tonight's system and cite a source page on each.", "answer": "Example verdict: WRAP the AlertManager tonight under the integration engineer. EVIDENCE: AlertManager assumes all alerts have transaction IDs (Ch.16 p.14, requires interface); the assumption holds in financial trading but not in patient alerts; the team did not certify the component for the patient domain (Ch.16 p.26, certification). COUNTER-EVIDENCE: the component has been deployed successfully for general patient alerts with transaction IDs; replacing it means a long procurement and integration cycle. UNCERTAINTY: we do not know if a patient-domain alternative exists; we do not know the cost of the wrapper. VERDICT: wrap AlertManager with an adaptor that synthesises a transaction ID for patient alerts, with redeployment conditional on (a) a published assumption register, (b) a certification report for the patient domain, (c) a fallback alerting path that does not depend on AlertManager.", "rule": "RULE 07 - Decision card", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Build the artifact a stranger could audit: claim, evidence, warrant, counter-evidence, uncertainty, verdict.", "title": "Your minimum inspectable artifact", "sub": "The decision card is what Assignment 1 asks for. Six slots, one signature, one evidence policy. Everything else tonight feeds this.", "blocks": [{"t": "wide", "c": "mag", "lab": "CLAIM", "lead": "State the verdict in one sentence.", "field": {"id": "dc_claim", "core": true, "rows": 2, "ph": "Keep, replace, or wrap the AlertManager tonight"}}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE", "field": {"id": "dc_evidence", "core": true, "rows": 3, "ph": "What supports the claim? Cite a source page (Ch.16 p.X) or a CBSE process"}}, {"c": "teal", "lab": "WARRANT", "field": {"id": "dc_warrant", "core": true, "rows": 3, "ph": "Why does the evidence support the claim? Name the CBSE process or the trade-off"}}, {"c": "sand", "lab": "COUNTER-EVIDENCE", "field": {"id": "dc_counter", "core": true, "rows": 3, "ph": "What would the other side cite against this verdict?"}}, {"c": "mag", "lab": "UNCERTAINTY", "field": {"id": "dc_uncert", "core": true, "rows": 3, "ph": "What is unmeasured, assumed, or could change overnight?"}}, {"c": "green", "lab": "VERDICT", "field": {"id": "dc_verdict", "core": true, "rows": 2, "ph": "The bounded decision, the owner, the monitor, the condition to revisit"}}]}, {"t": "sign", "id": "r07_card", "fields": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_uncert", "f:dc_verdict"], "label": "I sign this verdict", "before": "Sign once all six slots carry something inspectable.", "ready": "Ready to sign.", "warn": "Signing freezes the six slots for the rest of the hour. The defense at Rule 17 changes them in a <i>later</i> box.", "done": "Read-only from here. The card you defend at Rule 17 is the one you signed here."}, {"t": "principle", "txt": "A defensible verdict names what supports it, what would reverse it, what is uncertain, and who owns it."}], "timebox": "4 min", "hueOk": "CLAIM, EVIDENCE, WARRANT, COUNTER-EVIDENCE, UNCERTAINTY, VERDICT each carry their own colour.", "task": "Fill all six slots from tonight&rsquo;s system, then sign. The card is what Assignment 1 asks for. <b style=\"color:var(--mag)\">You are the integration engineer.</b>", "notes": "Four minutes. Walk the room. The slot students skip is COUNTER-EVIDENCE: they cannot name what would reverse their own verdict, which means the verdict is not yet defensible. The signature freezes the six boxes; that is what makes Rule 17 a real defense rather than a second draft.", "appendix": true, "route": "toolkit"}, {"k": "QA3", "noAnswer": true, "rule": "RETRIEVAL LOOP - Practise", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the six card slots, the three composition types, the falsification standard and the anatomy of a monitor.", "title": "Sixty seconds on the decision flow", "sub": "Application checkpoint: recall the artifact you have built so far before transfer and defense continue.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 07 &middot; 09 &middot; 10 &middot; B01", "items": [{"q": "The decision card has six slots. Name them in order.", "a": "CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &middot; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it."}, {"q": "Name the three composition types and say which one tonight&rsquo;s AlertManager integration is.", "a": "<b>Sequential</b> (components executed in sequence, provides interfaces composed), <b>hierarchical</b> (one component calls on another, provides+requires composed), <b>additive</b> (interfaces put together to create a new component). Tonight is <b>hierarchical</b>: Mentcare (provides) calls AlertManager (requires TransactionLog)."}, {"q": "What must a claim state so the evidence can prove it wrong?", "a": "The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending."}, {"q": "Turn &ldquo;we are not sure if AlertManager will ever fire correctly on patient alerts&rdquo; into a monitor.", "a": "A measured quantity (patient alerts with no transaction ID vs alerts successfully fired), an observation window (every shift handover), a trigger value (any patient alert that fails to fire), a named owner (integration engineer) and a fallback action (switch to the fallback alerting path) &mdash; the unknown becomes a monitored risk."}]}], "timebox": "60 sec", "task": "Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.", "notes": "The practise loop points at the artifact, not at trivia. Question 2 is the one to watch &mdash; a hierarchical composition that does not actually check the requires interface is the false security that B01 exists to refuse.", "appendix": true, "route": "toolkit"}, {"k": "R11", "rule": "RULE 11 - Micro-case -> local case", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Reuse one composition-type chain in a different domain, and say what transfers and what breaks.", "title": "Scaffold first, then transfer", "sub": "Use the same composition-type chain twice &mdash; and the second time in a different domain.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MICRO-CASE &mdash; ISCARB SCAFFOLD", "txt": "The hospital reused AlertManager (hierarchical composition: Mentcare provides, AlertManager requires TransactionLog). Which composition type, what assumption broke, and what adaptor would fix it?", "field": {"id": "micro", "core": false, "rows": 3, "ph": "The composition type, the broken assumption, and the adaptor"}}, {"c": "mag", "lab": "TRANSFER &mdash; THE FINANCIAL TRADING CASE", "txt": "The chapter&rsquo;s own financial trading source is where AlertManager was first developed. A new trading system reuses AlertManager. Run the same chain: which composition type, what assumption, and does your patient-alert reasoning survive the change back to the source domain?", "field": {"id": "transfer", "core": false, "rows": 3, "ph": "The composition type, the assumption that holds here, and what transfers or breaks between the two domains"}}]}, {"t": "wide", "c": "violet", "ic": "pin", "tag": "{{flag}} &nbsp;{{localTag}}", "lab": "WHY BOTH CASES ARE LOCAL", "lead": "The evidence has a named destination &mdash; and that is what takes &ldquo;build from scratch&rdquo; off the menu.", "txt": "Hospital systems and financial trading systems are both regulated services in {{country}}. {{accreditor}} links the field to {{bodies}}. That makes component reuse a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording."}, {"t": "principle", "txt": "Mechanism -&gt; Evidence -&gt; Decision boundary"}], "timebox": "1 min + 3 min", "task": "Solve the micro-case, then reuse the same reasoning chain on the financial trading case, and name which of {{bodiesShort}} receives your evidence. <b style=\"color:var(--mag)\">You are the integration engineer.</b>", "notes": "Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about hospital alerts has learned a case, not a capability. The financial trading case is the source domain of the AlertManager, so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.", "appendix": true, "route": "toolkit"}, {"k": "R13", "rule": "RULE 13 - Stress test your verdict", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Stress a verdict against four component-engineering stress tests, and say which one it fails.", "title": "What change would break your solution?", "sub": "A strong verdict is one that survives the four questions below. Most do not survive the second.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 &nbsp; ASSUMPTION COVERAGE", "lead": "Does the adaptor cover all the assumptions?", "txt": "A wrapper that synthesises transaction IDs covers the known assumption. The stress test asks: walk the assumption register, and for each ask whether the adaptor addresses it."}, {"c": "mag", "lab": "2 &nbsp; OTHER ASSUMPTIONS", "lead": "Are there other assumptions in AlertManager you have not found?", "txt": "A reused component carries every assumption its source domain made. The stress test asks: name every assumption, and for each ask whether it holds in the patient domain."}, {"c": "sand", "lab": "3 &nbsp; ADAPTOR FEASIBILITY", "lead": "Can the adaptor actually be built?", "txt": "A wrapper that synthesises transaction IDs requires a transaction ID generator that does not collide with real IDs. The stress test asks: what does the adaptor actually look like, and does it work?"}, {"c": "violet", "lab": "4 &nbsp; FALLBACK PATH", "lead": "What happens when AlertManager fails again?", "txt": "A wrapped component that fails again has no fallback. The stress test asks: what is the fallback alerting path, and who switches to it?"}]}, {"t": "wide", "c": "mag", "lab": "PICK THE ONE YOUR VERDICT FAILS", "field": {"id": "stress", "core": true, "rows": 2, "ph": "Which stress test does your verdict fail, and what would you change to survive it?"}}, {"t": "principle", "txt": "A verdict that survives all four stress tests is either remarkable or uncommitted &mdash; usually the second."}], "timebox": "3 min", "task": "Pick the stress test your verdict fails and write what you would change to survive it.", "notes": "Three minutes. The point is to fail one of the four on purpose &mdash; almost every verdict fails other assumptions or fallback path, and the honest student names which.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> (integration engineer) decides the verdict and names the composition strategy. The <b>evidence owner</b> maintains the assumption register and the certification report. The <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What are the four stress tests a component verdict must survive?", "a": "<b>Assumption coverage</b> &mdash; does the adaptor cover all the assumptions? <b>Other assumptions</b> &mdash; are there assumptions you have not found? <b>Adaptor feasibility</b> &mdash; can the adaptor actually be built? <b>Fallback path</b> &mdash; what happens when AlertManager fails again?"}, {"q": "Your design adds a 50-line adaptor for every alert. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. auto-tested adaptors, a weekly batch instead of a queue, simplified maintenance. Sympathy is not an answer."}, {"q": "Where may AI sit in the component assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts adaptors, suggests components, generates glue code. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense. Question 3 wants a design change, not sympathy. Question 4 is deliberately the exact sentence from the flow.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks &mdash; the mark follows the level.", "badge": {"c": "", "t": "READINESS", "s": "the gate is at Rule 20"}, "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "violet", "lab": "L1 &nbsp; ASSERTING", "lead": "A verdict with nothing behind it.", "txt": "States a verdict. Names no composition type, no artifact, no owner. Right or wrong, it cannot be audited."}, {"c": "teal", "lab": "L2 &nbsp; REASONING", "lead": "The composition type, cited &mdash; but nothing to inspect.", "txt": "Names hierarchical composition as the type and cites the page. Still no artifact a stranger could inspect."}, {"c": "sand", "lab": "L3 &nbsp; JUSTIFYING", "lead": "A dated, owned assumption register, and a stated way to be wrong.", "txt": "Names a dated, owned assumption register, states what would falsify the claim, and bounds the residual risk."}, {"c": "green", "lab": "L4 &nbsp; ACCOUNTABLE", "lead": "L3, and it survives the constraint changing.", "txt": "All of L3, and the verdict survives a changed constraint &mdash; or the student explains exactly why it changes, and who re-signs."}]}, {"t": "levels"}, {"t": "wide", "c": "mag", "lab": "READINESS IS A GATE, NOT A LEVEL", "lead": "A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.", "txt": "Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight &mdash; LO1, 5 marks, {{assignmentDue}} &mdash; and its evidence policy is the same one: cite the source page, or mark the claim <i>unmeasured</i> with the measurement you would need."}], "hueOk": "Four levels on one rail, each with its own colour, is the scale itself.", "timebox": "90 sec", "cut": true, "task": "Pick the level you think you are at, then read the line under it: it says what your card actually carries.", "notes": "The picker is self-assessment; the line under it is read from the boxes the student actually filled. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constraint will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State composition + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constraint changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the assumption register"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed composition"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE &mdash; PICK ONE", "picker": {"g": "mutation", "options": ["The vendor patches AlertManager to remove the transaction-ID assumption", "The hospital budget halves", "AlertManager is acquired and discontinued", "A new regulation requires patient alerts to be audit-logged differently"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses &mdash; and why"}}, {"t": "principle", "txt": "A strong design either survives mutation &mdash; or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the integration engineer.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses &mdash; stronger than a verdict that magically survives everything.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the component claim without trusting your explanation? Is the assumption register, the requires interface analysis, the certification report, and the integration architecture all on file?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the missing assumption, the unverified requires interface, the unbuilt adaptor, or the fallback path that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session &mdash; two questions only. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 8. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, challenge and sign, with a named composition strategy behind it and a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use a composition strategy and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the integration engineer.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "X07", "answer": "Illustrative causal chain for tonight: the team's decision to reuse AlertManager from financial trading is the REUSE DECISION; AlertManager's assumption that all alerts have transaction IDs is the INVALID ASSUMPTION; the failure to verify the assumption in the patient-alert domain is the VALIDATION GAP; the missed alert during the mental health crisis is the consequence. The component characteristics alone do not prove this chain. Verify the assumption register and the component validation report before presenting it as the actual decision.", "rule": "X07 - The words you will swap by mistake", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Distinguish CBSE for reuse, CBSE with reuse, component acquisition, and component certification, and say which trade-off each one makes.", "title": "For reuse, with reuse, acquisition, certification &mdash; and which one broke", "sub": "Four CBSE processes students report interchangeably. Get these wrong and every later sentence is wrong with them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "vocabulary, not a single source page"}, "blocks": [{"t": "compare", "head": ["Process", "What it is", "Who owns it", "Tonight"], "rows": [{"c": "teal", "cells": ["CBSE for reuse", "Developing components that will be reused in other applications.", "The component developer.", "<b>The AlertManager team</b> &mdash; built it for financial trading, then generalised it for reuse."]}, {"c": "sand", "cells": ["CBSE with reuse", "Developing new applications using existing components.", "The application integrator.", "<b>The Mentcare team</b> &mdash; integrated AlertManager into the patient-alert system."]}, {"c": "violet", "cells": ["Component acquisition", "Acquiring components for reuse, locally or externally.", "The acquiring organization.", "<b>What the Mentcare team did</b> &mdash; acquired AlertManager from a financial trading vendor."]}, {"c": "mag", "cells": ["Component certification", "Checking a component and certifying it meets its specification.", "Someone other than the developer.", "<b>What was missing</b> &mdash; nobody certified AlertManager&rsquo;s assumptions for the patient domain."]}]}, {"t": "compare", "head": ["Trade-off", "Speed", "Cost", "Risk", "Tonight&rsquo;s verdict"], "rows": [{"c": "teal", "cells": ["For reuse", "Slow (generalise existing code)", "High (extra development)", "Low (controlled by developer)", "<b>Done by the AlertManager team</b> &mdash; they generalised it for reuse."]}, {"c": "sand", "cells": ["With reuse", "Fast (find and integrate)", "Low (no development)", "High (assumptions may not hold)", "<b>What the Mentcare team chose</b> &mdash; fast, but assumptions broke."]}, {"c": "violet", "cells": ["Acquisition", "Medium (search and evaluate)", "Medium (licensing)", "Medium (vendor dependency)", "<b>What the Mentcare team did</b> &mdash; acquired from a vendor."]}, {"c": "mag", "cells": ["Certification", "Slow (independent check)", "Medium (test effort)", "Low (catches assumption failures)", "<b>What was missing</b> &mdash; would have caught the transaction-ID assumption. /* Practice items in the style of the national knowledge unit. Course-written, never

/* ---------- distributed retrieval ------------------------------------------

function rRecall(b){

/* ---------- v12 retrieval loop: 60 seconds at the close of every phase ------
   Retrieval practice is the most reliably documented effect in learning
   research, and until now the hour retrieved exactly once, at J02. A `qa`
   block closes each phase: a ring timer the back row can read, four
   questions answered FROM MEMORY first, a reveal per row, and an honest
   self-score. Nothing is saved — the drill is the moment, not an artifact. */
var QA_C=326.7;                                  /* ring circumference, r=52  */
function rQa(b){
  var items=b.items||[];
  var h='<div class="qa">'+
    '<div class="qa-side">'+
     '<button class="qa-ring" data-qa-ring="1" aria-label="Start the sixty-second retrieval timer">'+
      '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><circle class="qa-rbg" cx="60" cy="60" r="52"></circle><circle class="qa-rfg" cx="60" cy="60" r="52"></circle></svg>'+
      '<b class="qa-secs">60</b></button>'+
     '<div class="qa-meta"><span class="qa-tag">'+(b.tag||'')+'</span>'+
      '<span class="qa-hint qa-h1">Press the ring, then answer out loud from memory</span>'+
      '<span class="qa-hint qa-h2">Time &mdash; now reveal and score honestly</span></div>'+
     '<div class="qa-score" role="status"><span class="qa-slab">RECALLED</span><b class="qa-sval">0/'+items.length+'</b></div>'+
    '</div><div class="qa-list">';
  for(var i=0;i<items.length;i++){
    h+='<div class="qa-row"><span class="qa-n">'+(i+1)+'</span><div class="qa-body">'+
       '<div class="qa-q">'+items[i].q+'</div>'+
       '<div class="qa-a">'+items[i].a+'</div>'+
       '<div class="qa-judge"><button class="qa-hit" data-qa-judge="hit">Recalled it</button>'+
       '<button class="qa-miss" data-qa-judge="miss">Missed it</button></div></div>'+
       '<button class="qa-tog" data-qa-tog="1" aria-expanded="false">Reveal</button></div>';
  }
  return h+'</div></div>';
}
function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
      var live=document.getElementById('tLive');
      if(live) live.textContent='The retrieval minute is over — reveal and compare.';
    }
  },1000);
  btn.setAttribute('data-running',String(id));
}
function qaScore(box){
  var rows=box.querySelectorAll('.qa-row'),hit=0,marked=0;
  for(var i=0;i<rows.length;i++){
    if(rows[i].classList.contains('picked-hit')){hit++;marked++;}
    else if(rows[i].classList.contains('picked-miss')) marked++;
  }
  var sc=box.querySelector('.qa-score');
  if(!sc) return;
  sc.setAttribute('data-hit',(rows.length&&hit===rows.length)?'all':'part');
  sc.querySelector('.qa-sval').textContent=hit+'/'+rows.length;
}

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(typeof ref!=='string') return '';
  if(ref==='@marks') return Object.keys(S.marks||{}).filter(function(k){return Array.isArray(S.marks[k])&&S.marks[k].length;}).join(' ');
  if(ref==='@gates'){var passed=GATE_DEFS.filter(function(g){return S.gates&&S.gates[g[0]];}).length;return passed?String(passed):'';}
  if(ref==='@signed'){var signed=Object.keys(S.sign||{}).filter(function(k){return S.sign[k];}).length;return signed?String(signed):'';}
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function policyThreshold(config,key){
  var policy=LECTURE.thresholds||{},name=(config&&config.minKey)||key;
  var value=config&&Number.isFinite(config.min)?config.min:policy[name];
  if(!Number.isFinite(value)||value<0)throw new Error('Invalid LECTURE.thresholds entry: '+name);
  return value;
}
function coachState(b){
  var w=b.watch||[], filled=0, thin=false, min=policyThreshold(b,'coachDeep'), deep=b.deep;
  for(var i=0;i<w.length;i++){
    var v=String(probe(w[i])||'').trim();
    /* only the boxes named in `deep` are held to a length — a NAME box is
       legitimately three words and must not be nagged for it */
    if(v){ filled++; if(w[i].indexOf('f:')===0 && (!deep||deep.indexOf(w[i])>=0) && v.length<min) thin=true; }
  }
  if(filled<policyThreshold(null,'coachMinFilled')) return 'empty';
  if(filled<w.length||thin) return 'thin';
  return 'ok';
}
function renderCoach(){
  var ws=document.querySelectorAll('[data-coach]');
  for(var i=0;i<ws.length;i++){
    var b=COACH[ws[i].getAttribute('data-coach')]; if(!b) continue;
    var st=coachState(b), lab=st==='ok'?'Committed':(st==='empty'?'Stuck?':'Nearly');
    ws[i].setAttribute('data-st',st);
    ws[i].innerHTML='<div class="coach-label">'+lab+'</div><div class="ct">'+T(b[st]||'')+'</div>';
  }
}

function rCoach(b){ COACH.push(b); return '<div class="coach" data-coach="'+(COACH.length-1)+'"></div>'; }

/* ---------- think · pair · share ----------

/* ---------- sign and lock ---------------------------------------------------
   "Do not edit these boxes after the reveal" was an instruction with nothing
   behind it. A signature is the mechanism: the student commits, the values are
   snapshotted with a time, the inputs go read-only, and a later edit is refused
   in words rather than silently allowed. This is the chapter's own thesis
   applied to the chapter — an unsigned claim and a claim you can quietly revise
   after seeing the answer are the same thing. */
var SIGN=[];
function rSign(b){
  SIGN.push(b);
  return '<div class="signbar" data-sign="'+b.id+'" data-on="0">'+
    '<div class="st"></div><button data-signbtn="'+b.id+'">'+T(b.label||'Sign this')+'</button></div>'+
    '<div class="lockmsg" data-lockmsg="'+b.id+'"></div>';
}
function signedFields(){                      /* every ref frozen by any signature */
  var s={};
  for(var i=0;i<SIGN.length;i++){
    if(!(S.sign&&S.sign[SIGN[i].id])) continue;
    for(var j=0;j<(SIGN[i].fields||[]).length;j++) s[SIGN[i].fields[j]]=SIGN[i].id;
  }
  return s;
}
function renderSign(){
  var bs=document.querySelectorAll('[data-sign]');
  for(var i=0;i<bs.length;i++){
    var id=bs[i].getAttribute('data-sign'), b=null;
    for(var k=0;k<SIGN.length;k++) if(SIGN[k].id===id) b=SIGN[k];
    if(!b) continue;
    var rec=S.sign&&S.sign[id], on=!!rec, n=0, tot=(b.fields||[]).length;
    for(var f=0;f<tot;f++) if(String(probe(b.fields[f])||'').trim()) n++;
    bs[i].setAttribute('data-on',on?'1':'0');
    bs[i].querySelector('.st').innerHTML = on
      ? '<b>Signed at '+rec.at+'.</b> '+T(b.done||'These boxes are now read-only. Anything you learn from the reveal goes in a new box, not over this one.')
      : (n<tot ? T(b.before||'Fill every box, then sign.')+' <b>'+n+' of '+tot+'</b>'
               : '<b>'+T(b.ready||'Ready to sign.')+'</b> '+T(b.warn||'Signing freezes these boxes for the rest of the hour.'));
    var btn=bs[i].querySelector('button');
    btn.textContent = on ? 'Signed ✓' : T(b.label||'Sign this');
    btn.disabled = on || n<tot;

  }

    for(var q=0;q<pk.length;q++){pk[q].setAttribute('data-locked',lk?'1':'0');pk[q].setAttribute('aria-disabled',String(lk));}
  }
}
function refuse(id){
  var ms=document.querySelectorAll('[data-lockmsg="'+id+'"]');
  for(var i=0;i<ms.length;i++){
    ms[i].setAttribute('role','status');
    ms[i].textContent='Locked: signed answers cannot be edited. If the reveal changed your thinking, record it in a later box so your revision stays visible.';
    (function(e){setTimeout(function(){e.textContent='';},4200);})(ms[i]);
  }
}

/* ---------- self-assessed level vs. the level the artifact supports ----------
   Same split as the gates and the outcome map: what the student claims, beside
   what their evidence carries. The second one cannot be talked up, and it names
   the empty box rather than awarding a mark — Rule 19 keeps scoring off the
   live slide, and this stays descriptive. */
function levelEarned(){
  var L=LECTURE.levels; if(!L) return null;
  var best=L.tiers[0], miss=null;
  for(var i=0;i<L.tiers.length;i++){
    var t=L.tiers[i], gap=[];
    for(var n=0;n<(t.needs||[]).length;n++)
      if(!String(probe(t.needs[n])||'').trim()) gap.push(t.needs[n]);
    if(gap.length){ miss=miss||{tier:t,gap:gap}; break; }
    best=t;
  }
  return {best:best, next:miss};
}
function rLevels(){
  var L=LECTURE.levels; if(!L) return '';
  var opts=[]; for(var i=0;i<L.tiers.length;i++) opts.push(L.tiers[i].k);
  return '<div class="lvl">'+rPicker({g:L.g||'level',options:opts})+
    '<div class="lvlread" data-lvlread="1"></div></div>';
}

/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    var m=s.match(/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */
function uncitedPages(){
  var C=LECTURE.coverage; if(!C||!C.span) return [];
  var hits=srcPages(), out=[], run=null;
  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }
  }
  if(run) out.push(run);
  return out;
}
function fmtRanges(rs){
  var o=[];
  for(var i=0;i<rs.length;i++) o.push(rs[i][0]===rs[i][1]?rs[i][0]:rs[i][0]+'&ndash;'+rs[i][1]);
  return o.join(', ');
}

   label the seam. A zones block renders two bordered, colour-coded columns,
   each with its own header, so a student can tell a cited claim from course
   context at a glance — no text is reworded, the separation IS the honesty:
     {t:'zones', book:{ic,tag,sub,items:[cards]}, course:{ic,tag,sub,items:[]}} */
function rZones(b){
