uired for the classroom interactions. <a href="sources/Ch16-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":16,"title":"Component-Based Software Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260921-classroom-v3","filename":"Ch16-Component-Based-SE.html","assignment":7,"points":5,"objectives":["Describe component characteristics and interfaces.","Compare development for and with reuse.","Choose sequential, hierarchical or additive composition.","Diagnose interface incompatibility and specify an adapter.","Read an OCL precondition/postcondition and design a test."],"sections":["16.1 Components and component models","16.2 CBSE processes","16.3 Component composition"],"case":{"headline":"The interfaces match. Their meanings may not.","text":"A fictional data component returns a numeric temperature but its unit is undocumented. A consumer interprets it as Celsius. Normal values appear plausible, but no contract or boundary test establishes the conversion.","question":"Which assumption must be explicit before composition?","mutation":"The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Component-Based Software Engineering","phase":"START","takeaway":"Component-Based Software Engineering","full":"<p>Component-Based Software Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Components are units of composition","fig":null,"sourceRange":"3–10","bullets":[["Independent unit","A component can be deployed and composed through its interfaces."],["Hidden implementation","Clients need its contract, not its internal code."],["Standards and support","Component models and middleware enable integration."],["Process","Requirements may evolve around available reusable components."]],"question":"Why is every object class not automatically a reusable component?","answer":"A class may depend on compile-time context and hidden implementation knowledge. A reusable component needs an independently usable contract, deployment and explicit dependencies.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Requirements may evolve around available reusable components.","full":"<p><b>Independent unit.<\/b> A component can be deployed and composed through its interfaces.<\/p><p><b>Hidden implementation.<\/b> Clients need its contract, not its internal code.<\/p><p><b>Standards and support.<\/b> Component models and middleware enable integration.<\/p><p><b>Process.<\/b> Requirements may evolve around available reusable components.<\/p>","sourceStart":3},{"id":"X02A","title":"Five characteristics of reusable components","fig":null,"sourceRange":"11–17","bullets":[["Public boundary","All external interactions use defined interfaces."],["Explicit context","State required services instead of depending on hidden neighbors."],["Reuse evidence","Documentation and standards help another team assess the component."]],"question":"Can “independent” mean that a component needs no external service?","answer":"No. Dependencies may exist, but they must be explicitly specified so another implementation can provide the required service.","rows":[["Composable","Interactions use public interfaces and available metadata."],["Deployable","A self-contained executable unit for its component platform."],["Documented","Specify interface syntax and, ideally, semantics."],["Independent","External requirements are explicit, not hidden dependencies."],["Standardized","Conforms to the chosen component model."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"Documentation and standards help another team assess the component.","full":"<p><b>Public boundary.<\/b> All external interactions use defined interfaces.<\/p><p><b>Explicit context.<\/b> State required services instead of depending on hidden neighbors.<\/p><p><b>Reuse evidence.<\/b> Documentation and standards help another team assess the component.<\/p>","sourceStart":11},{"id":"X03","title":"Provides and requires are two sides of a contract","fig":"ch16_interfaces","sourceRange":"11–17","bullets":[["Provides","Services the component offers to others."],["Requires","Services it needs from its environment."],["Compatibility","A provider must meet the consumer’s required contract."],["Encapsulation","Internal state and implementation remain hidden."]],"question":"Why is matching an operation name insufficient for composition?","answer":"Parameter types, units, preconditions, postconditions, error behavior and timing assumptions may still differ.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6a4a7ae477bad9fa.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Internal state and implementation remain hidden.","full":"<p><b>Provides.<\/b> Services the component offers to others.<\/p><p><b>Requires.<\/b> Services it needs from its environment.<\/p><p><b>Compatibility.<\/b> A provider must meet the consumer’s required contract.<\/p><p><b>Encapsulation.<\/b> Internal state and implementation remain hidden.<\/p>","sourceStart":11},{"id":"X04","title":"A component model defines integration standards","fig":"ch16_modelelements","sourceRange":"18–22","bullets":[["Interfaces","Specify operations, parameters, exceptions and definition language."],["Usage","Define naming, metadata access and configuration."],["Deployment","Define packaging, documentation and evolution rules."],["Historical examples","EJB, .NET and web-service models are the source’s examples."]],"question":"What must be known before deploying a binary component?","answer":"The supported model/platform, provided and required interfaces, configuration, packaged dependencies and relevant version/evolution rules.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/acd2fa717aea514a.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"EJB, .NET and web-service models are the source’s examples.","full":"<p><b>Interfaces.<\/b> Specify operations, parameters, exceptions and definition language.<\/p><p><b>Usage.<\/b> Define naming, metadata access and configuration.<\/p><p><b>Deployment.<\/b> Define packaging, documentation and evolution rules.<\/p><p><b>Historical examples.<\/b> EJB, .NET and web-service models are the source’s examples.<\/p>","sourceStart":18},{"id":"MIDDLEWARE","title":"Middleware supplies shared component services","fig":"ch16_middleware","sourceRange":"18–22","bullets":[["Platform services","Addressing, communication, interface and exception support."],["Support services","Examples include security, transactions, concurrency and persistence."],["Container","Mediates access and exposes the model’s services."],["Trade-off","A simple component may not need every service in a large container."]],"question":"Why should transaction handling not be reimplemented independently in every component?","answer":"A consistent shared implementation can reduce duplicated effort and incompatibilities. Its behavior and integration constraints still need verification.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/655ca33c2c431092.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"A simple component may not need every service in a large container.","full":"<p><b>Platform services.<\/b> Addressing, communication, interface and exception support.<\/p><p><b>Support services.<\/b> Examples include security, transactions, concurrency and persistence.<\/p><p><b>Container.<\/b> Mediates access and exposes the model’s services.<\/p><p><b>Trade-off.<\/b> A simple component may not need every service in a large container.<\/p>","sourceStart":18},{"id":"CHECK1","title":"Checkpoint · state the component obligation","fig":null,"sourceRange":"3–22","bullets":[["Think","A component offers a numeric duration parameter."],["Pair","Identify which facts a client must know beyond its type."],["Record","Write the contract claim and its evidence requirement."]],"question":"Which missing detail can make two integer parameters incompatible?","answer":"Their units, allowed range or meaning. Matching a numeric type does not establish semantic compatibility.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Write the contract claim and its evidence requirement.","full":"<p><b>Think.<\/b> A component offers a numeric duration parameter.<\/p><p><b>Pair.<\/b> Identify which facts a client must know beyond its type.<\/p><p><b>Record.<\/b> Write the contract claim and its evidence requirement.<\/p>","sourceStart":3},{"id":"X05","title":"Development for reuse is not development with reuse","fig":"ch16_cbseprocess","sourceRange":"23–39","bullets":[["For reuse","Generalize, document and validate components for future applications."],["With reuse","Discover, evaluate, adapt and integrate available components."],["Interleave","Available components can change requirements and architecture."],["Support","Acquisition, management and certification serve both processes."]],"question":"Who has to discover candidate components before detailed design is settled?","answer":"The team developing with reuse. The team developing for reuse already knows the component it is generalizing, though it still assesses demand and cost.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/267c35ba26f02115.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Acquisition, management and certification serve both processes.","full":"<p><b>For reuse.<\/b> Generalize, document and validate components for future applications.<\/p><p><b>With reuse.<\/b> Discover, evaluate, adapt and integrate available components.<\/p><p><b>Interleave.<\/b> Available components can change requirements and architecture.<\/p><p><b>Support.<\/b> Acquisition, management and certification serve both processes.<\/p>","sourceStart":23},{"id":"X06","title":"Generalize around stable domain abstractions","fig":null,"sourceRange":"23–33","bullets":[["Stable abstraction","Prefer domain concepts that change slowly and recur."],["Generalization","Remove specific methods; make names, dependencies and errors reusable."],["Documentation","Expose assumptions and supported configurations."],["Cost","Future reuse must justify generalization, validation and maintenance."]],"question":"Why should every application-specific module not be generalized immediately?","answer":"Some have little realistic reuse potential. Generalization and documentation cost time, and overly broad interfaces can increase complexity.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Future reuse must justify generalization, validation and maintenance.","full":"<p><b>Stable abstraction.<\/b> Prefer domain concepts that change slowly and recur.<\/p><p><b>Generalization.<\/b> Remove specific methods; make names, dependencies and errors reusable.<\/p><p><b>Documentation.<\/b> Expose assumptions and supported configurations.<\/p><p><b>Cost.<\/b> Future reuse must justify generalization, validation and maintenance.<\/p>","sourceStart":23},{"id":"VALIDATE","title":"Validate the component in the new context","fig":"ch16_withreuse","sourceRange":"34–39","bullets":[["Discover and evaluate","Assess functions, interfaces and non-functional needs."],["Test harness","Use relevant cases and expected results, not only supplier claims."],["Unused behavior","Extra functionality can still activate or affect the application."],["Assumptions","Document the new operating context and what remains unknown."]],"question":"What does a supplier’s passed test not necessarily establish?","answer":"That the component meets this application’s contract, workload and environment. The tested conditions may differ.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/336b7a7881505be5.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Document the new operating context and what remains unknown.","full":"<p><b>Discover and evaluate.<\/b> Assess functions, interfaces and non-functional needs.<\/p><p><b>Test harness.<\/b> Use relevant cases and expected results, not only supplier claims.<\/p><p><b>Unused behavior.<\/b> Extra functionality can still activate or affect the application.<\/p><p><b>Assumptions.<\/b> Document the new operating context and what remains unknown.<\/p>","sourceStart":34},{"id":"R08","title":"The Ariane example: reuse preserves assumptions","fig":null,"sourceRange":"34–39","bullets":[["Source case","Software from Ariane 4 was reused for Ariane 5."],["Changed context","A value range that was safe before was no longer safe."],["Failure pathway","An unhandled conversion exception affected the reference system."],["Lesson","Prior success is evidence for its earlier context—not every new one."]],"question":"What question should precede “it worked reliably in the previous system”?","answer":"Which assumptions about inputs, ranges, activated functionality and failure handling remain valid in the new system? The source case is historical, not a new experiment.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Prior success is evidence for its earlier context—not every new one.","full":"<p><b>Source case.<\/b> Software from Ariane 4 was reused for Ariane 5.<\/p><p><b>Changed context.<\/b> A value range that was safe before was no longer safe.<\/p><p><b>Failure pathway.<\/b> An unhandled conversion exception affected the reference system.<\/p><p><b>Lesson.<\/b> Prior success is evidence for its earlier context—not every new one.<\/p>","sourceStart":34},{"id":"B01","title":"Three composition forms; three call relationships","fig":"ch16_composition","sourceRange":"40–43","bullets":[["Sequential","An external caller invokes A, then uses its result to call B."],["Hierarchical","A directly calls B to obtain a required service."],["Additive","One composed interface exposes independent services from A and B."],["Glue code","Reconcile invocation order, data and interface differences when necessary."]],"question":"If A and B never call one another but an application calls them in order, which form is this?","answer":"Sequential composition. The external application coordinates the calls and may transform A’s output for B.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/2039319212ce1e2a.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Reconcile invocation order, data and interface differences when necessary.","full":"<p><b>Sequential.<\/b> An external caller invokes A, then uses its result to call B.<\/p><p><b>Hierarchical.<\/b> A directly calls B to obtain a required service.<\/p><p><b>Additive.<\/b> One composed interface exposes independent services from A and B.<\/p><p><b>Glue code.<\/b> Reconcile invocation order, data and interface differences when necessary.<\/p>","sourceStart":40},{"id":"CHECK2","title":"Checkpoint · explain the adapter","fig":null,"sourceRange":"40–50","bullets":[["Think","The consumer expects one unit and the provider expects another."],["Pair","Define conversion, invalid inputs and the postcondition."],["Record","Add the adapter mechanism and a counterexample test."]],"question":"Why is multiplying by a conversion constant not a complete adapter contract?","answer":"Range, rounding, invalid inputs, provider failures and the returned state must also satisfy the consumer’s contract.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Add the adapter mechanism and a counterexample test.","full":"<p><b>Think.<\/b> The consumer expects one unit and the provider expects another.<\/p><p><b>Pair.<\/b> Define conversion, invalid inputs and the postcondition.<\/p><p><b>Record.<\/b> Add the adapter mechanism and a counterexample test.<\/p>","sourceStart":40},{"id":"R09","title":"Adapters reconcile explicit incompatibilities","fig":"ch16_adaptor","sourceRange":"44–50","bullets":[["Parameters","Types, number, representation or units differ."],["Operations","Names differ or a required operation is missing."],["Adaptation","Translate calls/results or provide a justified missing service."],["Limit","An adapter cannot silently invent unspecified semantics."]],"question":"How can the data collector use several sensor interfaces?","answer":"An adapter interprets the collector’s generic command and invokes the particular sensor operation, then returns the expected representation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/b8feb8a84c04a27e.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"An adapter cannot silently invent unspecified semantics.","full":"<p><b>Parameters.<\/b> Types, number, representation or units differ.<\/p><p><b>Operations.<\/b> Names differ or a required operation is missing.<\/p><p><b>Adaptation.<\/b> Translate calls/results or provide a justified missing service.<\/p><p><b>Limit.<\/b> An adapter cannot silently invent unspecified semantics.<\/p>","sourceStart":44},{"id":"D16","title":"OCL states obligations before and after an operation","fig":null,"sourceRange":"51–55","bullets":[["Precondition","What must hold before the operation."],["Postcondition","What must hold after it."],["Invariant","A condition that must remain true for the modeled object."],["@pre","Refers to the value before the operation."]],"question":"What does size = size@pre + 1 require after addItem?","answer":"The resulting size is one greater than the pre-operation size. Other postconditions are still needed to say which item and metadata were stored.","rows":[["addItem pre","No existing photograph with the same identifier."],["addItem post","Size increases by one; retrieve(pid) returns the added photo."],["delete pre","The photograph exists."],["delete post","Photo disappears; size decreases; the source retains its catalog entry."]],"heads":null,"extra":"The source’s Photo Library additionally assumes libSize() > 0 because creation adds an initial item. Preserve that explicit modeling assumption; it is not a universal library requirement.","phase":"LEARN","takeaway":"Refers to the value before the operation.","full":"<p><b>Precondition.<\/b> What must hold before the operation.<\/p><p><b>Postcondition.<\/b> What must hold after it.<\/p><p><b>Invariant.<\/b> A condition that must remain true for the modeled object.<\/p><p><b>@pre.<\/b> Refers to the value before the operation.<\/p>","sourceStart":51},{"id":"D16B","title":"Composition changes emergent qualities","fig":"ch16_datacollect","sourceRange":"56–59","bullets":[["Separation","Separate reporting and data management can improve adaptability."],["Integration","A combined product can reduce communication overhead in the source example."],["Trade-off","Functionality, performance, dependability and evolution can conflict."],["Evidence","Assess the implemented composition, not only isolated components."]],"question":"Why can two individually acceptable components form an unacceptable system?","answer":"Their interaction can introduce latency, incompatible state assumptions or incorrect data interpretation. Those are properties of the composition.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1ee3d9d0236ec757.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Assess the implemented composition, not only isolated components.","full":"<p><b>Separation.<\/b> Separate reporting and data management can improve adaptability.<\/p><p><b>Integration.<\/b> A combined product can reduce communication overhead in the source example.<\/p><p><b>Trade-off.<\/b> Functionality, performance, dependability and evolution can conflict.<\/p><p><b>Evidence.<\/b> Assess the implemented composition, not only isolated components.<\/p>","sourceStart":56},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning.","bullets":[["Reassess","Explain the effect of the changed constraint."],["Evidence","Name the observation that would defeat the revised claim."],["Ownership","State who reviews and accepts the bounded scope."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role.","nodes":[["Initial claim","Bounded by assumptions"],["New condition","An assumption changes"],["Revised verdict","A reason and next evidence"]],"full":"<p>The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Which assumption must be explicit before composition?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, co e","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Composition types","range":"40–43"},{"title":"Interface semantics and OCL","range":"51–55"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Components, standards and interfaces","start":3,"end":17,"units":["X01","X02A","X03","CHECK1"]},{"title":"Component models and middleware","start":18,"end":22,"units":["X04","MIDDLEWARE","CHECK1"]},{"title":"Development for reuse","start":23,"end":33,"units":["X05","X06"]},{"title":"Development with reuse and validation","start":34,"end":39,"units":["X05","VALIDATE","R08"]},{"title":"Composition, glue and adapters","start":40,"end":50,"units":["B01","CHECK2","R09"]},{"title":"Interface semantics, OCL and trade-offs","start":51,"end":59,"units":["D16","D16B"]}],"sourceCount":59,"original":"sources/Ch16-Original.pptx","textbook":"sources/Ch16-Textbook.pdf","bookPages":26,"quiz":[{"q":"A
