are?"], ["q2b", "Failing that, could a human TEST the output against reality &mdash; check each claim it makes without trusting how it was produced?"], ["q3", "Is there a named person who reviews it and signs for it?"]], "card": [["dc_claim", "CLAIM"], ["dc_evidence", "EVIDENCE"], ["dc_warrant", "WARRANT"], ["dc_counter", "COUNTER-EV."], ["dc_uncert", "UNCERTAINTY"], ["dc_verdict", "VERDICT"]]}, "quiz": [{"t": "Rule 05 · Prediction gate", "parts": [["Prediction", "p:predict"], ["Constraint", "f:p_constraint"], ["Derive", "f:p_derive"], ["Name", "f:p_name"]]}, {"t": "Rule 07 · Decision card", "parts": [["Claim", "f:dc_claim"], ["Evidence", "f:dc_evidence"], ["Warrant", "f:dc_warrant"], ["Counter-evidence", "f:dc_counter"], ["Uncertainty", "f:dc_uncert"], ["Verdict", "f:dc_verdict"]]}, {"t": "Rule 10 · Risk and monitor", "parts": [["Known / unknown / monitored", "@r10grid"], ["A monitor I will keep", "f:monitor"], ["Vulnerability tool", "f:vuln_tool"]]}, {"t": "Rule 11 · Transfer", "parts": [["Micro-case", "f:micro"], ["Transfer to financial-trading case", "f:transfer"]]}, {"t": "Rule 13 · Stress test", "parts": [["Stress test", "f:stress"]]}, {"t": "Rule 14 · Practitioner workload", "parts": [["Workload cost and design change", "f:workload"]]}, {"t": "Rule 15 · AI assist", "parts": [["AI gate", "@aigate"]]}, {"t": "Rule 17 · Constraint mutation", "parts": [["Mutation", "p:mutation"], ["Survives / collapses", "f:mutation_defend"]]}, {"t": "Rule 19 · Peer review received", "parts": [["Inspectable?", "f:peer1"], ["What would make it fail?", "f:peer2"]]}, {"t": "Jahiziah knowledge-unit check", "parts": [["", "@jahtest"]]}, {"t": "Rule 20 · Readiness", "parts": [["", "@gates"], ["Outcomes your evidence supports", "@clo"], ["Engineering means", "f:takehome"]]}], "units": [{"k": "TITLE", "phase": "ISCARB TOOLKIT", "task": "Sit down. The decision starts in ninety seconds.", "notes": "Leave this up while the room settles. One sentence only: tonight you do not learn five characteristics, you issue one engineering decision about a reused alert component and defend it.", "appendix": false, "route": "core"}, {"k": "START", "title": "Your route through this chapter", "phase": "LEARN", "route": "core", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Today’s artifact:</b> An interface contract and composition test.</p><p><b>Fictional teaching case:</b> The Mentcare system integrated AlertManager, an EJB component reused from a financial trading system. During a mental health crisis, the alert failed to fire.</p><p>AlertManager assumed all alerts are financial transactions with transaction IDs. Patient alerts have no transaction IDs, so the assumption broke and the alert failed to fire during a mental health crisis. Do you keep, replace, or wrap the component?</p></div><h2 style=\"font:700 25px/1.4 system-ui\">Five chapter learning objectives</h2><ol class=\"lp-outcomes\"><li>Describe component characteristics and interfaces.</li><li>Compare development for and with reuse.</li><li>Choose sequential, hierarchical or additive composition.</li><li>Diagnose interface incompatibility and specify an adapter.</li><li>Read an OCL precondition/postcondition and design a test.</li></ol><p style=\"font:17px/1.6 system-ui\"><b>Pacing suggestion:</b> one teaching block of about 75–90 minutes, plus the named required reading and a five-question preparation check (initial planning estimate: 15–25 minutes total; report your actual time). These are planning estimates, not an official timetable. Pause after Check 2 if teaching in two blocks. If time runs out, finish the remaining source topics in the next block; they stay required.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"C01\">See the source-to-lesson map</button></div><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"READING\">Required self-study: exact pages and task</button><button class=\"lp-btn\" data-jump=\"PREP\">Five-objective preparation check</but A component can be replaced by another if its interface is maintained."}]}, {"t": "principle", "txt": "CBSE is reuse-based: components are more abstract than object classes and can be considered stand-alone service providers."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Component-based development. The highest-value thirty seconds of the Understand phase. The AlertManager met essentials 1 (independent component) and 3 (EJB middleware) but the team did not check essential 4 (a development process geared to reuse). Students who miss this write assignments full of technical fixes, missing the point that the process was the gap.", "appendix": false, "_iscarbRule": "X01 - CBSE fundamentals", "route": "core", "showIf": null, "sourceRange": "3–17", "answer": "CBSE is an approach to software development that relies on the reuse of entities called software components. It emerged from the failure of object-oriented development to support effective reuse — single object classes are too detailed and specific. 1. Independent components specified by their interfaces. 2. Component standards to facilitate integration. 3. Middleware that provides support for inter-operability. 4. A development process that is geared to reuse. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02A", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Distinguish the Councill-Heinmann and Szyperski definitions and name the five component characteristics.", "title": "Five component characteristics", "sub": "Two definitions from the source, and five characteristics a component must have.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "COUNCILL-HEINMANN", "lead": "Conforms to a component model, independently deployed and composed without modification.", "txt": "A software element that conforms to a component model and can be independently deployed and composed without modification according to a composition standard.", "src": "P1 · p.10"}, {"c": "sand", "lab": "SZYPERSKI", "lead": "Unit of composition with contractually specified interfaces and explicit context dependencies.", "txt": "A software component is a unit of composition with contractually specified interfaces and explicit context dependencies only. A software component can be deployed independently and is subject to composition by third parties.", "src": "P1 · p.10"}]}, {"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 COMPOSABLE", "lead": "All external interactions through publicly defined interfaces.", "txt": "All external interactions take place through publicly defined interfaces. The component provides external access to information about itself.", "src": "P1 · p.11-12"}, {"c": "teal", "lab": "2 DEPLOYABLE", "lead": "Self-contained, runs on a component platform without recompilation.", "txt": "The component is self-contained and operates as a stand-alone entity on a component platform. Usually binary, no compilation needed.", "src": "P1 · p.11"}, {"c": "sand", "lab": "3 DOCUMENTED", "lead": "Fully documented so users can decide whether it meets their needs.", "txt": "Components have to be fully documented. The syntax and ideally the semantics of all component interfaces should be specified.", "src": "P1 · p.12"}, {"c": "sand", "lab": "4 INDEPENDENT", "lead": "Can be composed and deployed without using other specific components.", "txt": "The component can be composed and deployed without having to use other specific components. Where it needs external services, these are set out in a requires interface.", "src": "P1 · p.12"}, {"c": "violet", "lab": "5 STANDARDIZED", "lead": "Conforms to a standard component model.", "txt": "The component conforms to a standard component model that defines interfaces, metadata, documentation, composition, and deployment.", "src": "P1 · p.12"}]}, {"t": "principle", "c": "mag", "txt": "A reused component can be composable, deployable, documented, independent, and standardized &mdash; and still fail when its assumptions do not hold in the target domain. Characteristics are not guarantees."}, {"t": "figure", "img": "ch16_datacollector", "cap": "slide 16 · data collector component", "right": []}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Five component characteristics. Two minutes. The room usually picks &ldquo;independent&rdquo; as the failing characteristic. The deeper answer is &ldquo;documented&rdquo;: the team did not document (or read) the assumption that all alerts have transaction IDs. A student who says &ldquo;the component was not independent&rdquo; has not read the source; push for which characteristic the team forgot to verify.", "appendix": false, "_iscarbRule": "X02A - Component definitions and characteristics", "route": "core", "showIf": null, "sourceRange": "3–17", "answer": "A software element that conforms to a component model and can be independently deployed and composed without modification according to a composition standard. A software component is a unit of composition with contractually specified interfaces and explicit context dependencies only. A software component can be deployed independently and is subject to composition by third parties. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X03", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish the provides interface from the requires interface and explain why the requires interface does not compromise independence.", "title": "Provides and requires interfaces", "sub": "A component is defined by two interfaces: what it provides to others, and what it requires from others to execute.", "blocks": [{"t": "figure", "img": "ch16_interfaces", "cap": "slide 15 · provides and requires interfaces", "right": []}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "PROVIDES INTERFACE", "lead": "The services the component provides to other components.", "txt": "Defines the services provided by the component to other components. Essentially the component API. Defines the methods that can be called by a user of the component.", "src": "P1 · p.14"}, {"c": "sand", "lab": "REQUIRES INTERFACE", "lead": "The services that must be available for the component to execute.", "txt": "Specifies what services must be made available for the component to execute as specified. Does not compromise independence or deployability because it does not define how these services should be provided.", "src": "P1 · p.14"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "COMPONENT AS SERVICE PROVIDER", "lead": "Independent, executable entity.", "txt": "The component is an independent, executable entity. It does not have to be compiled before it is used with other components.", "src": "P1 · p.13"}, {"c": "sand", "lab": "INTERFACE EXPRESSION", "lead": "Parameterized operations; internal state never exposed.", "txt": "The services are made available through an interface and all interactions take place through that interface. The interface is expressed in terms of parameterized operations.", "src": "P1 · p.13"}, {"c": "violet", "lab": "COMPONENT ACCESS", "lead": "Accessed via remote procedure calls.", "txt": "Components are accessed using remote procedure calls (RPCs). Each component has a unique identifier (usually a URL) and can be referenced from any networked computer.", "src": "P1 · p.17"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S INTERFACE FAILURE", "lead": "AlertManager&rsquo;s provides interface was checked. Its requires interface was not.", "txt": "The Mentcare team verified AlertManager&rsquo;s provides interface (fireAlert) worked correctly. They did not verify its requires interface: the component requires a TransactionLog component, and it assumes every alert has a transaction ID. The requires interface was the gap. Patient alerts have no transaction IDs, so the assumption broke.", "field": {"id": "interface_failure", "core": false, "rows": 2, "ph": "For your verdict: which interface did the team verify, and which did they miss?"}}, {"t": "principle", "txt": "A provides interface is a promise. A requires interface is an assumption. The Mentcare team checked the promise and forgot the assumption."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Provides and requires interfaces. Two minutes. The room usually focuses on the provides interface (fireAlert). The deeper answer is the requires interface: AlertManager requires a TransactionLog and assumes every alert has a transaction ID. A student who says &ldquo;the interface was wrong&rdquo; has not answered; push for which interface.", "appendix": false, "_iscarbRule": "X03 - Component interfaces: provides and requires", "route": "core", "showIf": null, "sourceRange": "3–17", "answer": "Defines the services provided by the component to other components. Essentially the component API. Defines the methods that can be called by a user of the component. Specifies what services must be made available for the component to execute as specified. Does not compromise independence or deployability because it does not define how these services should be provided. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X04", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain what a component model is, name the three examples (EJB, COM+, CORBA CCM), and explain middleware support.", "title": "Component models and middleware", "sub": "A component model is a definition of standards for component implementation, documentation, and deployment. Three competing models exist.", "blocks": [{"t": "figure", "img": "ch16_modelelements", "cap": "slide 19 · component-model elements", "right": []}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 EJB", "lead": "Enterprise Java Beans (Sun).", "txt": "The component model used by tonight&rsquo;s AlertManager. Defines interfaces, deployment, and container services for Java components.", "src": "P1 · p.18"}, {"c": "sand", "lab": "2 COM+", "lead": "Microsoft .NET model.", "txt": "The COM+ component model for .NET. Cannot interoperate with EJB or CORBA CCM components.", "src": "P1 · p.18"}, {"c": "violet", "lab": "3 CORBA CCM", "lead": "CORBA Component Model.", "txt": "A third model, language-independent but incompatible with EJB and COM+.", "src": "P1 · p.18"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "MODEL ELEMENT: INTERFACES", "lead": "How interfaces should be defined.", "txt": "The model specifies operation names, parameters, and exceptions that should be included in the interface definition.", "src": "P1 · p.20"}, {"c": "sand", "lab": "MODEL ELEMENT: USAGE", "lead": "Globally unique names for distribution.", "txt": "Components need a unique name or handle associated with them so they can be distributed and accessed remotely. This has to be globally unique.", "src": "P1 · p.20"}, {"c": "violet", "lab": "MODEL ELEMENT: DEPLOYMENT", "lead": "Packaging for independent execution.", "txt": "The model includes a specification of how components should be packaged for deployment as independent, executable entities.", "src": "P1 · p.20"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "PLATFORM SERVICES", "lead": "Allow components to communicate.", "txt": "Platform services allow components written according to the model to communicate with each other.", "src": "P1 · p.21"}, {"c": "sand", "lab": "SUPPORT SERVICES", "lead": "Application-independent services.", "txt": "Support services are application-independent services used by different components in the model.", "src": "P1 · p.21"}, {"c": "mag", "lab": "CONTAINER", "lead": "A set of interfaces to access services.", "txt": "To use services provided by a model, components are deployed in a container. This is a set of interfaces used to access the service implementations.", "src": "P1 · p.21"}]}, {"t": "principle", "txt": "A component model is not just a standard for interfaces &mdash; it is the whole infrastructure: interfaces, usage, deployment, and the middleware services that make components actually run."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Component models and middleware. Two minutes. The room usually focuses on the three model names. The deeper point is that a component model has three elements (interfaces, usage, deployment) and is supported by middleware (platform services, support services, container). A student who says &ldquo;AlertManager uses EJB&rdquo; has answered the easy question; push for which middleware service it depends on.", "appendix": false, "_iscarbRule": "X04 - Component models and middleware", "route": "core", "showIf": null, "sourceRange": "18–22", "answer": "The component model used by tonight’s AlertManager. Defines interfaces, deployment, and container services for Java components. The COM+ component model for .NET. Cannot interoperate with EJB or CORBA CCM components. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "Two components have matching method names and parameter types. Are they compatible?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "Only syntactic compatibility is established. Preconditions, postconditions, exceptions, units and contextual assumptions must also agree.", "timebox": "60 sec", "appendix": false}, {"k": "X05", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish CBSE for reuse from CBSE with reuse and explain the trade-off between them.", "title": "Development for reuse and with reuse", "sub": "The chapter (p.24) distinguishes two CBSE processes. Tonight&rsquo;s crisis is a CBSE-with-reuse failure.", "blocks": [{"t": "figure", "img": "ch16_cbseprocess", "cap": "slide 25 · CBSE processes", "right": []}, {"t": "compare", "head": ["Aspect", "CBSE for reuse", "CBSE with reuse"], "rows": [{"c": "teal", "cells": ["Goal", "Develop components or services that will be reused in other applications.", "Develop new applications using existing components and services."]}, {"c": "teal", "cells": ["Activity", "Generalising existing components.", "Finding and integrating reusable components."]}, {"c": "sand", "cells": ["Owner", "The component developer.", "The application integrator."]}, {"c": "sand", "cells": ["Trade-off", "More reusability, less usability (general interfaces are complex).", "Faster delivery, but inherits source-domain assumptions."]}, {"c": "mag", "cells": ["Tonight", "Done by the AlertManager team when they generalised for financial trading.", "Done by the Mentcare team when they integrated AlertManager."]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "CBSE FOR REUSE FOCUSES ON COMPONENT DEVELOPMENT", "lead": "Components developed for a specific application usually have to be generalised.", "txt": "A component is most likely to be reusable if it is associated with a stable domain abstraction (business object). In a hospital, stable domain abstractions are nurses, patients, treatments &mdash; not transaction IDs.", "src": "P1 · p.27"}, {"c": "mag", "lab": "CBSE WITH REUSE FOCUSES ON FIND AND INTEGRATE", "lead": "Trade-offs between ideal requirements and available components.", "txt": "Develop outline requirements; search for components; modify requirements according to available functionality; search again; compose components to create the system.", "src": "P1 · p.34"}]}, {"t": "principle", "c": "mag", "txt": "For reuse generalises; with reuse inherits. The Mentcare team did with-reuse and inherited the transaction-ID assumption from the for-reuse team."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Development for reuse and with reuse. Two minutes. The room usually says &ldquo;with reuse&rdquo; because that is the Mentcare team&rsquo;s choice. The deeper point is the assumption inheritance: a with-reuse team inherits every assumption the for-reuse team made. A student who says &ldquo;they reused a component&rdquo; has not answered; push for which assumption was inherited.", "appendix": false, "_iscarbRule": "X05 - CBSE processes: for reuse and with reuse", "route": "core", "showIf": null, "sourceRange": "23–33; 34–39", "answer": "A component is most likely to be reusable if it is associated with a stable domain abstraction (business object). In a hospital, stable domain abstractions are nurses, patients, treatments — not transaction IDs. Develop outline requirements; search for components; modify requirements according to available functionality; search again; compose components to create the system. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X06", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain the changes for reusability, the supporting processes (acquisition, management, certification), and legacy wrapping.", "title": "Reusable components and supporting processes", "sub": "Six changes make a component reusable. Three supporting processes keep the reuse programme alive.", "blocks": [{"t": "figure", "img": "ch16_withreuse", "cap": "slide 35 · development with reuse", "right": []}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 REMOVE APP-SPECIFIC METHODS", "lead": "Generalise the component.", "txt": "Remove application-specific methods so the component is not tied to a particular application.", "src": "P1 · p.29"}, {"c": "teal", "lab": "2 CHANGE NAMES", "lead": "Make them general.", "txt": "Change names to make them general, not specific to the source application.", "src": "P1 · p.29"}, {"c": "teal", "lab": "3 ADD METHODS", "lead": "Broaden coverage.", "txt": "Add methods to broaden coverage so the component handles more use cases.", "src": "P1 · p.29"}]}, {"t": "cards", "cols": 3, "items": [{"c": "sand", "lab": "4 CONSISTENT EXCEPTIONS", "lead": "Make exception handling consistent.", "txt": "Make exception handling consistent across the component so users can predict behaviour.", "src": "P1 · p.29"}, {"c": "sand", "lab": "5 CONFIGURATION INTERFACE", "lead": "Allow component adaptation.", "txt": "Add a configuration interface for component adaptation without modifying the component itself.", "src": "P1 · p.29"}, {"c": "violet", "lab": "6 INTEGRATE REQUIRED COMPONENTS", "lead": "Reduce dependencies.", "txt": "Integrate required components to reduce dependencies and make the component more independent.", "src": "P1 · p.29"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "ACQUISITION", "lead": "Acquire components for reuse.", "txt": "May involve accessing locally-developed components or services, or finding components from an external source.", "src": "P1 · p.26"}, {"c": "sand", "lab": "MANAGEMENT", "lead": "Catalogue, store, track versions.", "txt": "Managing a company&rsquo;s reusable components: properly catalogued, stored, and made available for reuse, with version tracking.", "src": "P1 · p.26"}, {"c": "mag", "lab": "CERTIFICATION", "lead": "Independent check of the component.", "txt": "The process of checking a component and certifying that it meets its specification. Someone other than the developer checks quality.", "src": "P1 · p.26"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EXCEPTION HANDLING", "lead": "Publish exceptions, do not handle them.", "txt": "Components should not handle exceptions themselves &mdash; each application has its own requirements. The component should publish exceptions as part of the interface.", "src": "P1 · p.30"}, {"c": "violet", "lab": "LEGACY WRAPPING", "lead": "Wrap existing legacy systems as components.", "txt": "Existing legacy systems that fulfil a useful business function can be re-packaged as components for reuse by writing a wrapper that implements provides and requires interfaces.", "src": "P1 · p.31"}]}, {"t": "principle", "txt": "There is a trade-off between reusability and usability: the more general the interface, the greater the reusability, but it is more complex and hence less usable."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Reusable components and supporting processes. Two minutes. The room usually focuses on the six changes. The deeper point is the supporting processes: certification is the process the Mentcare team skipped, and that is what would have caught the assumption. A student who says &ldquo;they should have tested more&rdquo; has not answered; push for which supporting process.", "appendix": false, "_iscarbRule": "X06 - Component development for reuse and supporting processes", "route": "core", "showIf": null, "sourceRange": "23–33", "answer": "Remove application-specific methods so the component is not tied to a particular application. Change names to make them general, not specific to the source application. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R08", "answer": "The chapter's Ariane 5 case (p.39) is: in 1996, the first test flight of Ariane 5 ended in disaster 37 seconds after take-off. The problem was a reused component from Ariane 4 (the Inertial Navigation System) that failed because assumptions made when that component was developed did not hold for Ariane 5. The functionality that failed was not even required in Ariane 5. The lesson for tonight: AlertManager is the same pattern. The component was reused from financial trading, and the transaction-ID assumption did not hold for patient alerts. Worse, the transaction-ID functionality is not even required for patient alerts. The Ariane 5 case is the chapter's own version of tonight's crisis.", "rule": "", "phase": "LEARN", "accent": "mag", "learn": "Read the chapter&rsquo;s own Ariane 5 case and identify the parallel with tonight&rsquo;s AlertManager.", "title": "Validation and the Ariane 5 case", "sub": "The source p.39 gives the Ariane 5 failure. Tonight&rsquo;s crisis is the same pattern with a different component.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "ARIANE 5 (p.39)", "lead": "Reused component, assumptions did not hold.", "txt": "In 1996, the first test flight of Ariane 5 ended in disaster 37 seconds after take-off. The problem was a reused component from Ariane 4 (the Inertial Navigation System) that failed because assumptions made when the component was developed did not hold for Ariane 5. The functionality that failed was not even required in Ariane 5.", "src": "P1 · p.39"}, {"c": "mag", "lab": "TONIGHT&rsquo;S PARALLEL", "lead": "AlertManager is the same pattern.", "txt": "AlertManager was reused from financial trading. The transaction-ID assumption held in financial trading but not in patient alerts. The functionality that failed (transaction logging) is not even required for patient alerts. The two cases are isomorphic: a reused component whose assumptions did not hold in the target domain."}]}, {"t": "wide", "c": "violet", "lab": "THE QUESTION FOR TONIGHT", "lead": "Both cases are validation failures, not coding failures.", "field": {"id": "ariane_lesson", "core": false, "rows": 3, "ph": "What artifact would have caught the assumption failure before integration, in both Ariane 5 and AlertManager?"}}, {"t": "principle", "txt": "A component that meets its specification can still fail when its assumptions are violated in the new context. The Ariane 5 case is the chapter&rsquo;s own version of tonight&rsquo;s crisis."}], "timebox": "", "task": "Name the artifact that would have caught the assumption failure before integration, in both Ariane 5 and AlertManager.", "notes": "Teaching focus: Validation and the Ariane 5 case. Three minutes. The point is not that the component was wrong &mdash; it met its specification. The point is that the assumption did not transfer. The artifact that catches this is a component validation report that includes an assumption register. A student who says &ldquo;they should have tested more&rdquo; has not read the case; push for what the test should have checked.", "appendix": false, "_iscarbRule": "RULE 08 - 60-second source case", "route": "core", "showIf": null, "sourceRange": "34–39"}, {"k": "B01", "rule": "", "phase": "LEARN", "accent": "violet", "learn": "Explain the three composition types (sequential, hierarchical, additive) and why each fits a different integration problem.", "title": "Sequential, hierarchical and additive composition", "sub": "The chapter (p.42) distinguishes three composition types. Tonight&rsquo;s AlertManager integration is one of them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "architecture pattern, drawn from source table"}, "blocks": [{"t": "figure", "img": "ch16_composition", "cap": "slide 43 · composition types", "right": []}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 SEQUENTIAL", "lead": "Components executed in sequence.", "txt": "Composed components are executed in sequence. Involves composing the provides interfaces of each component. Glue code calls A, collects results, then calls B with those results.", "src": "P1 · p.42"}, {"c": "sand", "lab": "2 HIERARCHICAL", "lead": "One component calls on the services of another.", "txt": "One component calls on the services of another. The provides interface of one component is composed with the requires interface of another. <b>Tonight&rsquo;s AlertManager integration.</b>", "src": "P1 · p.42"}, {"c": "violet", "lab": "3 ADDITIVE", "lead": "Interfaces of two components put together.", "txt": "The interfaces of two components are put together to create a new component. Provides and requires interfaces of the integrated component are combinations of constituent interfaces.", "src": "P1 · p.42"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "WHAT TONIGHT CAUGHT", "txt": "Mentcare (provides) calls AlertManager (provides fireAlert)."}, {"c": "mag", "lab": "WHAT TONIGHT MISSED", "txt": "AlertManager (requires TransactionLog) was not composed correctly &mdash; the requires interface assumed transaction IDs."}, {"c": "violet", "lab": "WHAT WOULD FIX IT", "txt": "An adaptor component that synthesises a transaction ID for patient alerts, or a wrapper that hides the transaction-ID assumption."}]}, {"t": "principle", "c": "mag", "txt": "Composition types are not interchangeable. Hierarchical composition exposes the requires interface &mdash; and the requires interface is where assumptions live."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Sequential, hierarchical and additive composition. Ninety seconds. The room usually picks sequential because it sounds simplest. Tonight&rsquo;s integration is hierarchical: Mentcare (provides) calls AlertManager (provides fireAlert), and AlertManager (requires TransactionLog) was not composed correctly. A student who says &ldquo;sequential&rdquo; has not read the source; push for which interface the failure lives on.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "40–50", "answer": "Composed components are executed in sequence. Involves composing the provides interfaces of each component. Glue code calls A, collects results, then calls B with those results. One component calls on the services of another. The provides interface of one component is composed with the requires interface of another. Tonight’s AlertManager integration. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "An adapter converts a string to an integer. Does it repair a mismatch between minutes and seconds?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "Only if it also performs the justified unit conversion and checks the valid range. An adapter cannot safely guess an undocumented semantic contract.", "timebox": "60 sec", "appendix": false}, {"k": "R09", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain glue code, the three interface incompatibility types, and how adaptor components reconcile them.", "title": "Interface incompatibility and adapters", "sub": "Glue code allows components to work together. Interface incompatibility comes in three types: parameter, operation, and incompleteness.", "blocks": [{"t": "figure", "img": "ch16_adaptor", "cap": "slide 49 · adapter connecting collector and sensor", "right": []}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "GLUE CODE", "lead": "Code that allows components to work together.", "txt": "If A and B are composed sequentially, glue code calls A, collects its results, then calls B using these results, transforming them into the format required by B. Glue code may be used to resolve interface incompatibilities.", "src": "P1 · p.44"}, {"c": "sand", "lab": "ADAPTOR COMPONENTS", "lead": "Reconcile the interfaces of composed components.", "txt": "Adaptors address the problem of component incompatibility by reconciling the interfaces of the components that are composed. Different types of adaptor are required depending on the type of composition.", "src": "P1 · p.47"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 PARAMETER INCOMPATIBILITY", "lead": "Same name, different types.", "txt": "Operations have the same name but are of different types. Example: fireAlert(alertID: int) vs fireAlert(alertID: string).", "src": "P1 · p.45"}, {"c": "sand", "lab": "2 OPERATION INCOMPATIBILITY", "lead": "Different operation names.", "txt": "The names of operations in the composed interfaces are different. Example: fireAlert() vs raiseAlarm().", "src": "P1 · p.45"}, {"c": "violet", "lab": "3 OPERATION INCOMPLETENESS", "lead": "Provides is a subset of requires.", "txt": "The provides interface of one component is a subset of the requires interface of another. <b>Tonight&rsquo;s failure.</b> Mentcare provides patient alerts; AlertManager requires transaction IDs.", "src": "P1 · p.45"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S INCOMPATIBILITY", "lead": "Mentcare provides patient alerts with no transaction ID. AlertManager requires a transaction ID for every alert.", "txt": "Tonight&rsquo;s failure is operation incompleteness: the provides interface of Mentcare (patient alerts with no transaction ID) is a subset of the requires interface of AlertManager (every alert must have a transaction ID). The fix is an adaptor that synthesises a transaction ID for patient alerts before passing them to AlertManager &mdash; or a wrapper that hides the transaction-ID assumption entirely.", "field": {"id": "incompatibility", "core": false, "rows": 2, "ph": "For your verdict: which incompatibility type, and what would the adaptor look like?"}}, {"t": "principle", "txt": "A composition that has an interface incompatibility is not a wrong composition. It is an incomplete composition &mdash; and an adaptor is the missing piece."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Interface incompatibility and adapters. Two minutes. The room usually picks parameter incompatibility because it sounds easiest. Tonight&rsquo;s failure is operation incompleteness: the provides interface is a subset of the requires interface. A student who says &ldquo;the types are different&rdquo; has not read the source; push for which of the three types.", "appendix": false, "_iscarbRule": "RULE 09 - Glue code and interface incompatibility", "route": "core", "showIf": null, "sourceRange": "40–50", "answer": "If A and B are composed sequentially, glue code calls A, collects its results, then calls B using these results, transforming them into the format required by B. Glue code may be used to resolve interface incompatibilities. Adaptors address the problem of component incompatibility by reconciling the interfaces of the components that are composed. Different types of adaptor are required depending on the type of composition. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "D16", "title": "Interface contracts and OCL", "sub": "Required source concepts with a short worked explanation.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "Precondition", "txt": "The caller must establish the condition before an operation. For addItem, the supplied example requires an existing library and an unused photo identifier.", "src": "P1 · pp.51–55"}, {"c": "teal", "lab": "Postcondition", "txt": "After addItem, the library size increases by one, the identifier retrieves the added photo and the catalogue entry matches the descriptor.", "src": "P1 · pp.51–55"}, {"c": "teal", "lab": "State before execution", "txt": "OCL @pre refers to the earlier value. The supplied delete contract removes the photo and decreases size, but preserves its catalogue entry. That choice must be understood by both components.", "src": "P1 · pp.51–55"}]}, {"t": "raw", "html": "<div class=\"lp-callout\"><b>Source example: addItem</b><pre style=\"white-space:pre-wrap;font:17px/1.7 monospace\">context addItem\npre: PhotoLibrary.libSize() > 0\n     PhotoLibrary.retrieve(pid) = null\npost: libSize() = libSize()@pre + 1\n      PhotoLibrary.retrieve(pid) = p\n      PhotoLibrary.catEntry(pid) = photodesc</pre><p>The source assumes an existing library. @pre means the value before the call. Source slides 54–55.</p></div>"}], "task": "Why can deleting a photo preserve its catalogue entry without violating the supplied contract?", "answer": "The postcondition explicitly preserves catEntry(pid) at its pre-call value. A caller that expects both records to disappear has a semantic mismatch despite a compatible signature.", "sourceRange": "51–55", "noAnswer": false, "route": "core", "appendix": false, "phase": "LEARN", "rule": "", "showIf": null, "timebox": "", "notes": "Teaching focus: Interface contracts and OCL. "}, {"k": "D16B", "title": "Composition trade-offs and contract tests", "sub": "Required source concepts with a short worked explanation.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "Functional fit", "txt": "Choose a composition that delivers the needed services and respects provides/requires contracts.", "src": "P1 · pp.56–59"}, {"c": "teal", "lab": "Non-functional behavior", "txt": "Latency, reliability and security of the composition depend on interactions. Component-level claims need integration evidence.", "src": "P1 · pp.56–59"}, {"c": "teal", "lab": "Evolution", "txt": "Compare delivery speed with replaceability and future change. Record any requirement modified to fit an available component.", "src": "P1 · pp.56–59"}]}], "task": "Give one positive and one negative test for addItem.", "answer": "Positive: use an unused identifier and verify photo, descriptor and size increment. Negative: attempt a duplicate identifier and check the documented rejection behavior. Do not assume an undocumented exception type.", "sourceRange": "56–59", "noAnswer": false, "route": "core", "appendix": false, "phase": "LEARN", "rule": "", "showIf": null, "timebox": "", "notes": "Teaching focus: Composition trade-offs and contract tests. "}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "The Mentcare system integrated AlertManager, an EJB component reused from a financial trading system. During a mental health crisis, the alert failed to fire."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is an assumption register for the AlertManager component, signed by the integration engineer, listing every assumption carried over from the financial trading source system. It distinguishes a real assumption failure from a single missed alert. Pending that evidence, state a bounded keep, replace, or wrap decision, its owner and the condition for resuming operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "READING", "title": "Required self-study · pages, purpose and deadline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Required self-study · before the assignment and next chapter discussion.</b> Read the two selections below, attempt the five-question check, and use one assigned source slide to support the assignment artifact. Blackboard provides the calendar deadline.</p><p><b>Time budget:</b> initially 15–25 minutes including the check; record actual time. These replace unfocused source browsing. The original source ledger remains available for clarification and unfinished classroom topics.</p></div><div class=\"lp-reading-row\"><h3>Composition types</h3><p>Original source slides 40–43</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"40\">Slide 40</button><button class=\"lp-btn\" data-source-slide=\"41\">Slide 41</button><button class=\"lp-btn\" data-source-slide=\"42\">Slide 42</button><button class=\"lp-btn\" data-source-slide=\"43\">Slide 43</button></div></div><div class=\"lp-reading-row\"><h3>Interface semantics and OCL</h3><p>Original source slides 51–55</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"51\">Slide 51</button><button class=\"lp-btn\" data-source-slide=\"52\">Slide 52</button><button class=\"lp-btn\" data-source-slide=\"53\">Slide 53</button><button class=\"lp-btn\" data-source-slide=\"54\">Slide 54</button><button class=\"lp-btn\" data-source-slide=\"55\">Slide 55</button></div></div><p class=\"lp-study-note\"><b>Observable work:</b> identify the source slide and explain how its concept changes or supports your artifact. A citation or a checked box alone is insufficient. In the next class, be ready to explain a related example in your own words.</p><p class=\"lp-study-note\"><b>Assessment scope:</b> all five chapter objectives, the classroom route and these named selections. Full source examples support this scope; archived administrative/title slides and optional toolkit activities are not extra assessed requirements. The instructor must announce any further assigned source topic in Blackboard before assessing it.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"PREP\">Attempt the five-objective check</button><button class=\"lp-btn\" data-jump=\"C01\">Full source map</button></div>"}], "noAnswer": true, "appendix": true}, {"k": "PREP", "title": "Check all five objectives", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<p class=\"lp-study-note\">One question per chapter objective, in the same order as the five objectives. Attempt all five before opening feedback. Retry after reviewing an error. This public practice is not a secure test; the instructor uses a changed example during class.</p><form id=\"prepQuiz\" class=\"lp-prep\"><fieldset><legend>LO 1 · A requires interface identifies:</legend><label><input type=\"radio\" name=\"prep-0\" value=\"0\">Every hidden implementation detail</label><label><input type=\"radio\" name=\"prep-0\" value=\"1\">Services the component depends on</label><label><input type=\"radio\" name=\"prep-0\" value=\"2\">A user-interface theme</label><p hidden data-prep-feedback id=\"prep-feedback-0\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 2 · Development for reuse emphasizes:</legend><label><input type=\"radio\" name=\"prep-1\" value=\"0\">Generalization and documentation for future clients</label><label><input type=\"radio\" name=\"prep-1\" value=\"1\">Only selecting existing components</label><label><input type=\"radio\" name=\"prep-1\" value=\"2\">Skipping component validation</label><p hidden data-prep-feedback id=\"prep-feedback-1\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 3 · A component invokes another to deliver its own service. This is:</legend><label><input type=\"radio\" name=\"prep-2\" value=\"0\">Additive composition only</label><label><input type=\"radio\" name=\"prep-2\" value=\"1\">No composition</label><label><input type=\"radio\" name=\"prep-2\" value=\"2\">Hierarchical composition</label><p hidden data-prep-feedback id=\"prep-feedback-2\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 4 · Matching parameter types establish:</legend><label><input type=\"radio\" name=\"prep-3\" value=\"0\">Syntactic compatibility; semantics still need checking</label><label><input type=\"radio\" name=\"prep-3\" value=\"1\">Identical units and postconditions</label><label><input type=\"radio\" name=\"prep-3\" value=\"2\">Full operational reliability</label><p hidden data-prep-feedback id=\"prep-feedback-3\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 5 · In a postcondition, size@pre denotes:</legend><label><input type=\"radio\" name=\"prep-4\" value=\"0\">The future value after a retry</label><label><input type=\"radio\" name=\"prep-4\" value=\"1\">The value before the operation</label><label><input type=\"radio\" name=\"prep-4\" value=\"2\">An optional comment</label><p hidden data-prep-feedback id=\"prep-feedback-4\" class=\"prep-feedback\"></p></fieldset><button type=\"button\" class=\"lp-btn\" id=\"checkPrep\">Check my five answers</button><div id=\"prepStatus\" role=\"status\" aria-live=\"polite\">Attempt first. Feedback is initially hidden.</div></form>"}], "noAnswer": true, "appendix": true}, {"k": "C01", "title": "Source coverage and study checklist", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>59 supplied slides indexed.</b> Every original topic has a classroom location and a source review location. This map records material availability, not time actually taught or student mastery.</p><p>Five chapter objectives connect to supplied syllabus CLO 8. Original concepts remain required even when detailed examples are completed after class.</p></div><div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Original topic</th><th>Source slides</th><th>Classroom location</th><th>Full source</th></tr></thead><tbody><tr><td>Opening and source outline</td><td>1–2</td><td><button class=\"lp-btn\" data-jump=\"START\">Your route through this chapter</button></td><td><button class=\"lp-btn\" data-jump=\"SRC00\">Read source</button></td></tr><tr><td>Components, standards and interfaces</td><td>3–17</td><td><button class=\"lp-btn\" data-jump=\"X01\">Component-based development</button> · <button class=\"lp-btn\" data-jump=\"X02A\">Five component characteristics</button> · <button class=\"lp-btn\" data-jump=\"X03\">Provides and requires interfaces</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Component models and middleware</td><td>18–22</td><td><button class=\"lp-btn\" data-jump=\"X04\">Component models and middleware</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Development for reuse</td><td>23–33</td><td><button class=\"lp-btn\" data-jump=\"X05\">Development for reuse and with reuse</button> · <button class=\"lp-btn\" data-jump=\"X06\">Reusable components and supporting processes</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Development with reuse and validation</td><td>34–39</td><td><button class=\"lp-btn\" data-jump=\"X05\">Development for reuse and with reuse</button> · <button class=\"lp-btn\" data-jump=\"R08\">Validation and the Ariane 5 case</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr><tr><td>Composition, glue and adapters</td><td>40–50</td><td><button class=\"lp-btn\" data-jump=\"B01\">Sequential, hierarchical and additive composition</button> · <button class=\"lp-btn\" data-jump=\"R09\">Interface incompatibility and adapters</button></td><td><button class=\"lp-btn\" data-jump=\"SRC05\">Read source</button></td></tr><tr><td>Interface semantics, OCL and trade-offs</td><td>51–59</td><td><button class=\"lp-btn\" data-jump=\"D16\">Interface contracts and OCL</button> · <button class=\"lp-btn\" data-jump=\"D16B\">Composition trade-offs and contract tests</button></td><td><button class=\"lp-btn\" data-jump=\"SRC06\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch16-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 16 -  Component-based software engineering</summary><div class=\"lp-source-text\"></div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\nComponents and component models \nCBSE processes\nComponent composition\n</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "Components, standards and interfaces", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–17. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch16-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · Component-based development</summary><div class=\"lp-source-text\">Component-based development\nComponent-based software engineering (CBSE) is an approach to software development that relies on the reuse of entities called ‘software components’.\nIt emerged from the failure of object-oriented development to support effective reuse. Single object classes are too detailed and specific.\nComponents are more abstract than object classes and can be considered to be stand-alone service providers. They can exist as stand-alone entities.</div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · CBSE essentials</summary><div class=\"lp-source-text\">CBSE essentials\nIndependent components specified by their interfaces.\nComponent standards to facilitate component integration.\nMiddleware that provides support for component inter-operability.\nA development process that is geared to reuse.</div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · CBSE and design principles</summary><div class=\"lp-source-text\">CBSE and design principles\nApart from the benefits of reuse, CBSE is based on sound software engineering design principles:\nComponents are independent so do not interfere with each other;\nComponent implementations are hidden;\nCommunication is through well-defined interfaces;\nOne components can be replaced by another if its interface is maintained;\nComponent infrastructures offer a range of standard services.</div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · Component standards</summary><div class=\"lp-source-text\">Component standards\nStandards need to be established so that components can communicate with each other and inter-operate.\nUnfortunately, several competing component standards were established:\nSun’s Enterprise Java Beans\nMicrosoft’s COM and .NET\nCORBA’s CCM\nIn practice, these multiple standards have hindered the uptake of CBSE. It is impossible for components developed using different approaches to work together. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · Service-oriented software engineering</summary><div class=\"lp-source-text\">Service-oriented software engineering\nAn executable service is a type of independent component. It has a ‘provides’ interface but not a ‘requires’ interface.\nFrom the outset, services have been based around standards so there are no problems in communicating between services offered by different vendors.\nSystem performance may be slower with services but this approach is replacing CBSE in many systems.\nCovered in Chapter 18</div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · Components and component models</summary><div class=\"lp-source-text\">Components and component models\n</div></details><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · Components</summary><div class=\"lp-source-text\">Components\nComponents provide a service without regard to where the component is executing or its programming language\nA component is an independent executable entity that can be made up of one or more executable objects;\nThe component interface is published and all interactions are through the published interface;\n</div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · Component definitions</summary><div class=\"lp-source-text\">Component definitions\nCouncill and Heinmann:\nA software component is a software element that conforms to a component model and can be independently deployed and composed without modification according to a composition standard.\nSzyperski:\nA software component is a unit of composition with contractually specified interfaces and explicit context dependencies only. A software component can be deployed independently and is subject to composition by third-parties.</div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · Component characteristics </summary><div class=\"lp-source-text\">Component characteristics </div><div class=\"lp-tablewrap\"><table><tr><td>Component characteristic</td><td>Description</td></tr><tr><td>Composable</td><td>For a component to be composable, all external interactions must take place through publicly defined interfaces. In addition, it must provide external access to information about itself, such as its methods and attributes.</td></tr><tr><td>Deployable</td><td>To be deployable, a component has to be self-contained. It must be able to operate as a stand-alone entity on a component platform that provides an implementation of the component model. This usually means that the component is binary and does not have to be compiled before it is deployed. If a component is implemented as a service, it does not have to be deployed by a user of a component. Rather, it is deployed by the service provider. </td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Component characteristics </summary><div class=\"lp-source-text\">Component characteristics </div><div class=\"lp-tablewrap\"><table><tr><td>Component characteristic</td><td>Description</td></tr><tr><td>Documented</td><td>Components have to be fully documented so that potential users can decide whether or not the components meet their needs. The syntax and, ideally, the semantics of all component interfaces should be specified.</td></tr><tr><td>Independent</td><td>A component should be independent—it should be possible to compose and deploy it without having to use other specific components. In situations where the component needs externally provided services, these should be explicitly set out in a ‘requires’ interface specification.</td></tr><tr><td>Standardized</td><td>Component standardization means that a component used in a CBSE process has to conform to a standard component model. This model may define component interfaces, component metadata, documentation, composition, and deployment.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · Component as a service provider</summary><div class=\"lp-source-text\">Component as a service provider\nThe component is an independent, executable entity. It does not have to be compiled before it is used with other components.\nThe services offered by a component are made available through an interface and all component interactions take place through that interface.\nThe component interface is expressed in terms of parameterized operations and its internal state is never exposed. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Component interfaces</summary><div class=\"lp-source-text\">Component interfaces\nProvides interface\nDefines the services that are provided by the component to other components.\nThis interface, essentially, is the component API. It defines the methods that can be called by a user of the component. \nRequires interface\nDefines the services that specifies what services must be made available for the component to execute as specified.\nThis does not compromise the independence or deployability of a component because the ‘requires’ interface does not define how these services should be provided. </div></details><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Component interfaces </summary><div class=\"lp-source-text\">Component interfaces \nNote UML notation. Ball and sockets can fit together.</div></details><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · A model of a data collector component </summary><div class=\"lp-source-text\">A model of a data collector component </div></details><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · Component access</summary><div class=\"lp-source-text\">Component access\nComponents are accessed using remote procedure calls (RPCs).\nEach component has a unique identifier (usually a URL) and can be referenced from any networked computer.\nTherefore it can be called in a similar way as a procedure or method running on a local computer.\n</div></details>"}], "noAnswer": true, "sourceRange": "3–17", "appendix": true}, {"k": "SRC02", "title": "Component models and middleware", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 18–22. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch16-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · Component models</summary><div class=\"lp-source-text\">Component models\nA component model is a definition of standards for component implementation, documentation and deployment.\nExamples of component models\nEJB model (Enterprise Java Beans)\nCOM+ model (.NET model)\nCorba Component Model\nThe component model specifies how interfaces should be defined and the elements that should be included in an interface definition.</div></details><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · Basic elements of a component model </summary><div class=\"lp-source-text\">Basic elements of a component model </div></details><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Elements of a component model</summary><div class=\"lp-source-text\">Elements of a component model\nInterfaces \nComponents are defined by specifying their interfaces. The component model specifies how the interfaces should be defined and the elements, such as operation names, parameters and exceptions, which should be included in the interface definition. \nUsage \nIn order for components to be distributed and accessed remotely, they need to have a unique name or handle associated with them. This has to be globally unique.\nDeployment \nThe component model includes a specification of how components should be packaged for deployment as independent, executable entities.  </div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · Middleware support</summary><div class=\"lp-source-text\">Middleware support\nComponent models are the basis for middleware that provides support for executing components.\nComponent model implementations provide:\nPlatform services that allow components written according to the model to communicate;\nSupport services that are application-independent services used by different components.\nTo use services provided by a model, components are deployed in a container. This is a set of interfaces used to access the service implementations.</div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · Middleware services defined in a component model </summary><div class=\"lp-source-text\">Middleware services defined in a component model </div></details>"}], "noAnswer": true, "sourceRange": "18–22", "appendix": true}, {"k": "SRC03", "title": "Development for reuse", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 23–33. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch16-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · CBSE processes</summary><div class=\"lp-source-text\">CBSE processes</div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · CBSE processes</summary><div class=\"lp-source-text\">CBSE processes\nCBSE processes are software processes that support component-based software engineering. \nThey take into account the possibilities of reuse and the different process activities involved in developing and using reusable components. \nDevelopment for reuse \nThis process is concerned with developing components or services that will be reused in other applications. It usually involves generalizing existing components.\nDevelopment with reuse \nThis process is the process of developing new applications using existing components and services.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · CBSE processes </summary><div class=\"lp-source-text\">CBSE processes </div></details><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Supporting processes</summary><div class=\"lp-source-text\">Supporting processes\nComponent acquisition is the process of acquiring components for reuse or development into a reusable component. \nIt may involve accessing locally- developed components or services or finding these components from an external source.\nComponent management is concerned with managing a company’s reusable components, ensuring that they are properly catalogued, stored and made available for reuse.\nComponent certification is the process of checking a component and certifying that it meets its specification.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · CBSE for reuse</summary><div class=\"lp-source-text\">CBSE for reuse\nCBSE for reuse focuses on component development.\nComponents developed for a specific application usually have to be generalised to make them reusable.\nA component is most likely to be reusable if it associated with a stable domain abstraction (business object). \nFor example, in a hospital stable domain abstractions are associated with the fundamental purpose - nurses, patients, treatments, etc.</div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · Component development for reuse</summary><div class=\"lp-source-text\">Component development for reuse\nComponents for reuse may be specially constructed by generalising existing components.\nComponent reusability\nShould reflect stable domain abstractions;\nShould hide state representation;\nShould be as independent as possible;\nShould publish exceptions through the component interface.\nThere is a trade-off between reusability and usability\nThe more general the interface, the greater the reusability but it is then more complex and hence less usable.</div></details><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · Changes for reusability</summary><div class=\"lp-source-text\">Changes for reusability\nRemove application-specific methods.\nChange names to make them general.\nAdd methods to broaden coverage.\nMake exception handling consistent.\nAdd a configuration interface for component adaptation.\nIntegrate required components to reduce dependencies.</div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · Exception handling</summary><div class=\"lp-source-text\">Exception handling\nComponents should not handle exceptions themselves, because each application will have its own requirements for exception handling. \nRather, the component should define what exceptions can arise and should publish these as part of the interface.\nIn practice, however, there are two problems with this:\nPublishing all exceptions leads to bloated interfaces that are harder to understand. This may put off potential users of the component.\nThe operation of the component may depend on local exception handling, and changing this may have serious implications for the functionality of the component.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · Legacy system components</summary><div class=\"lp-source-text\">Legacy system components\nExisting legacy systems that fulfil a useful business function can be re-packaged as components for reuse.\nThis involves writing a wrapper component that implements provides and requires interfaces then accesses the legacy system.\nAlthough costly, this can be much less expensive than rewriting the legacy system.</div></details><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · Reusable components</summary><div class=\"lp-source-text\">Reusable components\nThe development cost of reusable components may be higher than the cost of specific equivalents. This extra reusability enhancement cost should be an organization rather than a project cost.\nGeneric components may be less space-efficient and may have longer execution times than their specific equivalents.</div></details><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · Component management</summary><div class=\"lp-source-text\">Component management\nComponent management involves deciding how to classify the component so that it can be discovered, making the component available either in a repository or as a service, maintaining information about the use of the component and keeping track of different component versions. \nA company with a reuse program may carry out some form of component certification before the component is made available for reuse. \nCertification means that someone apart from the developer checks the quality of the component. \n</div></details>"}], "noAnswer": true, "sourceRange": "23–33", "appendix": true}, {"k": "SRC04", "title": "Development with reuse and validation", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 34–39. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch16-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · CBSE with reuse</summary><div class=\"lp-source-text\">CBSE with reuse\nCBSE with reuse process has to find and integrate reusable components.\nWhen reusing components, it is essential to make trade-offs between ideal requirements and the services actually provided by available components.\nThis involves:\nDeveloping outline requirements;\nSearching for components then modifying requirements according to available functionality.\nSearching again to find if there are better components that meet the revised requirements.\nComposing components to create the system.</div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · CBSE with reuse </summary><div class=\"lp-source-text\">CBSE with reuse </div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · The component identification process </summary><div class=\"lp-source-text\">The component identification process </div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · Component identification issues</summary><div class=\"lp-source-text\">Component identification issues\nTrust. You need to be able to trust the supplier of a component. At best, an untrusted component may not operate as advertised; at worst, it can breach your security.\nRequirements. Different groups of components will satisfy different requirements.\nValidation. \nThe component specification may not be detailed enough to allow comprehensive tests to be developed.\nComponents may have unwanted functionality. How can you test this will not interfere with your application?</div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Component validation </summary><div class=\"lp-source-text\">Component validation \nComponent validation involves developing a set of test cases for a component (or, possibly, extending test cases supplied with that component) and developing a test harness to run component tests. \nThe major problem with component validation is that the component specification may not be sufficiently detailed to allow you to develop a complete set of component tests. \nAs well as testing that a component for reuse does what you require, you may also have to check that the component does not include any malicious code or functionality that you don’t need. </div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · Ariane launcher failure – validation failure?</summary><div class=\"lp-source-text\">Ariane launcher failure – validation failure?\nIn 1996, the 1st test flight of the Ariane 5 rocket ended in disaster when the launcher went out of control 37 seconds after take off.\nThe problem was due to a reused component from a previous version of the launcher (the Inertial Navigation System) that failed because assumptions made when that component was developed did not hold for Ariane 5.\nThe functionality that failed in this component was not required in Ariane 5.</div></details>"}], "noAnswer": true, "sourceRange": "34–39", "appendix": true}, {"k": "SRC05", "title": "Composition, glue and adapters", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 40–50. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch16-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · Component composition</summary><div class=\"lp-source-text\">Component composition\n</div></details><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · Component composition</summary><div class=\"lp-source-text\">Component composition\nThe process of assembling components to create a system.\nComposition involves integrating components with each other and with the component infrastructure.\nNormally you have to write ‘glue code’ to integrate components.</div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Types of composition</summary><div class=\"lp-source-text\">Types of composition\nSequential composition (1) where the composed components are executed in sequence. This involves composing the provides interfaces of each component.\nHierarchical composition (2) where one component calls on the services of another. The provides interface of one component is composed with the requires interface of another.\nAdditive composition (3) where the interfaces of two components are put together to create a new component. Provides and requires interfaces of integrated component is a combination of interfaces of constituent components.</div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · Types of component composition </summary><div class=\"lp-source-text\">Types of component composition </div></details><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · Glue code</summary><div class=\"lp-source-text\">Glue code\nCode that allows components to work together\nIf A and B are composed sequentially, then glue code has to call A, collect its results then call B using these results, transforming them into the format required by B.\nGlue code may be used to resolve interface incompatibilities.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · Interface incompatibility</summary><div class=\"lp-source-text\">Interface incompatibility\nParameter incompatibility where operations have the same name but are of different types.\nOperation incompatibility where the names of operations in the composed interfaces are different.\nOperation incompleteness where the provides interface of one component is a subset of the requires interface of another.</div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · Components with incompatible interfaces </summary><div class=\"lp-source-text\">Components with incompatible interfaces </div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · Adaptor components</summary><div class=\"lp-source-text\">Adaptor components\nAddress the problem of component incompatibility by reconciling the interfaces of the components that are composed.\nDifferent types of adaptor are required depending on the type of composition.\nAn addressFinder and a mapper component may be composed through an adaptor that strips the postal code from an address and passes this to the mapper component.</div></details><details class=\"lp-source-section\" id=\"source-slide-48\"><summary>Slide 48 · Composition through an adaptor</summary><div class=\"lp-source-text\">\nComposition through an adaptor\nThe component postCodeStripper is the adaptor that facilitates the sequential composition of addressFinder and mapper components.</div></details><details class=\"lp-source-section\" id=\"source-slide-49\"><summary>Slide 49 · An adaptor linking a data collector and a sensor </summary><div class=\"lp-source-text\">An adaptor linking a data collector and a sensor </div></details><details class=\"lp-source-section\" id=\"source-slide-50\"><summary>Slide 50 · Photo library composition </summary><div class=\"lp-source-text\">Photo library composition </div></details>"}], "noAnswer": true, "sourceRange": "40–50", "appendix": true}, {"k": "SRC06", "title": "Interface semantics, OCL and trade-offs", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 51–59. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch16-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-51\"><summary>Slide 51 · Interface semantics</summary><div class=\"lp-source-text\">Interface semantics\nYou have to rely on component documentation to decide if interfaces that are syntactically compatible are actually compatible.\nConsider an
