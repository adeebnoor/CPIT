/* ---------- confusable terms, side by side ------------------------------
   Every subject has a set of words students swap for one another, and the swap
   is invisible until it produces a wrong answer. A comparison table is the
   cheapest fix known, and it is declared entirely in data:
     {t:'compare', head:['Term','What it is','How you know'], rows:[
        {c:'teal', cells:['Fault','a defect in the system','code review, static analysis']}]} */
function rCompare(b){
  var h='<table class="cmp"><thead><tr>';
  for(var i=0;i<(b.head||[]).length;i++) h+='<th scope="col">'+b.head[i]+'</th>';
  h+='</tr></thead><tbody>';
  for(var r=0;r<(b.rows||[]).length;r++){
    var row=b.rows[r];
    h+='<tr'+(row.c?' data-c="'+row.c+'"':'')+'>';
    for(var c=0;c<row.cells.length;c++)
      h+='<td'+(c===0?' scope="row"':'')+(c>1?' class="mut"':'')+'>'+row.cells[c]+'</td>';
    h+='</tr>';
  }
  return h+'</tbody></table>';
}
/* ---------- the bridge from a requirement to something you can build --------
   THE GAP THIS CLOSES. A course built on decision and evidence produces a
   student who can defend a verdict and cannot build the thing they decided on.
   The chapter names redundancy, diversity, static analysis, formal methods —
   and never once says what you type, install or run.

   So the lecture declares one row per requirement, and the row is a chain:
   the requirement, the mechanism that serves it, what you actually build, the
   named tools that do it, and — the part that keeps this inside the ISCARB
   grammar rather than turning it into a tool advert — the artifact that proves
   you did. BRIDGE-01 blocks a row whose evidence is an intention.

   Tools are named as examples of a category. The category is the teaching; the
   brand is replaceable and the lecture says so. */
function rBridge(){
  var K=LECTURE.toolkit; if(!K||!K.rows) return '';
  var H=K.head||['Requirement','Mechanism','What you build','Tools that do it','The artifact it leaves'];

  for(var i=0;i<H.length;i++) h+='<span>'+ic(BH_IC[i]||'','16')+H[i]+'</span>';

/* ---------- hidden model answer / instructor key ---------------------------

   defines u.answer for a model response. Learning objectives and spoken teaching
   cues are never relabelled as answers. noAnswer suppresses a pre-reveal key. */

  if(!u||u.k==='TITLE'||u.k==='END'||u.noAnswer===true) return false;
  if(typeof u.answer==='string'&&u.answer.trim())return true;
  if(u.question===true)return true;

  return /\?|\bchoose\b|\bclassify\b|\bdecide\b|\bname\b|\bwhich\b|\bwhat\b|\bwhy\b|\bhow\b/i.test(strip(probe));

/* ---------- v7 auto-fit: a slide fills the stage exactly, never scrolls -----
   Content that would overflow is measured, then the .fit wrapper is scaled
   down just enough to fit. Re-run whenever content can change size: reader
   zoom (+/-), navigation to a conditional slide, or a late-loading figure. */
function fitSlide(sl){
  sl=sl||deck.querySelector('.slide.on'); if(!sl) return;
  var fit=sl.querySelector('.fit'); if(!fit) return;
  fit.style.transform='none';
  var cs=getComputedStyle(sl);
  var avail=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!(avail>0)) return;
  var h=fit.scrollHeight;
  if(h>avail+1){
    var f=avail/h;
    if(f<.55) f=.55;                     /* legibility floor — nothing unreadable */
    fit.style.transform='scale('+f+')';
    fit.style.transformOrigin='top center';
  }
}

/* ---------- author sanity check ---------------------------------------------
   Runtime guardrails for cloned/adapted lectures. Warnings never block class.
   Run ISCARB_SANITY() from DevTools at any time to re-check the current deck. */
function sanity(){
  var issues=[], declaredF={}, declaredP={}, usedImg={}, names=LECTURE.fieldNames||{};
  function walk(x){
    if(!x) return;
    if(Array.isArray(x)){ for(var i=0;i<x.length;i++) walk(x[i]); return; }
    if(typeof x!=='object') return;
    if(x.field&&x.field.id) declaredF[x.field.id]=1;
    if(x.picker&&x.picker.g) declaredP[x.picker.g]=1;
    if(x.t==='levels')declaredP.level=1;
    if(x.img&&typeof x.img==='string') usedImg[x.img]=1;
    if(x.t==='raw'&&typeof x.html==='string'){
      var re=/data-pick=["']([^"']+)["']/g,m;
      while((m=re.exec(x.html))) declaredP[m[1]]=1;
    }
    for(var k in x) if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]);
  }
  walk(LECTURE.units||[]);

  var fs=document.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var id=fs[i].getAttribute('data-f');
    if(!declaredF[id]&&!names['f:'+id]) issues.push('data-f "'+id+'" has no field declaration or fieldNames alias');
  }

  var cm=LECTURE.caseMap||[];
  for(var c=0;c<cm.length;c++){
    var parts=cm[c].parts||[];
    for(var p=0;p<parts.length;p++){
      var ref=parts[p][1]||'';
      if(ref.indexOf('p:')===0&&!declaredP[ref.slice(2)])
        issues.push('caseMap picker "'+ref+'" is not present in lecture blocks');
      if(ref.indexOf('f:')===0&&!declaredF[ref.slice(2)]&&!names[ref])
        issues.push('caseMap field "'+ref+'" is not present in lecture blocks');
    }
  }

  var exported={};
  cm.forEach(function(section){section.parts.forEach(function(part){exported[part[1]]=true;});});
  document.querySelectorAll('[data-f]').forEach(function(el){var ref='f:'+el.getAttribute('data-f');if(!exported[ref])issues.push('Unexported answer field: '+ref);});
  document.querySelectorAll('[data-pick]').forEach(function(el){var ref='p:'+el.getAttribute('data-pick');if(!exported[ref])issues.push('Unexported choice: '+ref);});
  LECTURE.units.forEach(function(u){if(u.showIf&&u.showIf.thin&&u.showIf.minKey&&!Object.prototype.hasOwnProperty.call(LECTURE.thresholds,u.showIf.minKey))issues.push('Unknown threshold key in '+u.k);});
  for(var img in usedImg)
    if(!Object.prototype.hasOwnProperty.call(FIG,img)) issues.push('figure key "'+img+'" is used but missing from FIG');

  var keys={};
  for(var u=0;u<(LECTURE.units||[]).length;u++){
    var uk=LECTURE.units[u].k;
    if(keys[uk]) issues.push('duplicate unit key "'+uk+'"');
    keys[uk]=1;
  }

  var unresolved=(document.getElementById('deck').innerHTML.match(/\{\{\s*[^}]+\s*\}\}/g)||[]);
  if(unresolved.length) issues.push('unresolved context token(s): '+unresolved.join(', '));

  var report={ok:issues.length===0,issues:issues,fields:Object.keys(declaredF).length,
    pickers:Object.keys(declaredP).length,figures:Object.keys(usedImg).length,units:(LECTURE.units||[]).length};
  try{
    if(window.console){
      if(report.ok){ if(typeof console.info==='function') console.info('[ISCARB sanity] OK',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] OK',report); }
      else { if(typeof console.warn==='function') console.warn('[ISCARB sanity] '+issues.length+' issue(s)',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] '+issues.length+' issue(s)',report); }
    }
  }catch(e){}
  window.ISCARB_SANITY_REPORT=report;
  return report;
}

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;

/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=policyThreshold(c,'thinDefault');
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}

}
function go(i,force){

    var d=(i>cur)?1:-1, j=i;

  }

  cur=i; deck.querySelector('[data-i="'+i+'"]').classList.add('on');

  if(!S.seen)S.seen={};

  var live=document.getElementById('tLive');
  if(live) live.textContent=(u.rule?strip(T(u.rule))+'. ':'')+strip(T(u.title||LECTURE.title))+

  for(var j=0;j<U.length;j++){ if(PIDX[j]===pi){ if(first<0)first=j; last=j; } }
  for(var s2=0;s2<segs.length;s2++){

function resolve(ref){
  if(ref==='@preparation'){
    var prep=LECTURE.preparation,gaps=uncitedPages();
    return strip(T(prep.source))+'\nReading: '+(gaps.length?'pages '+fmtRanges(gaps)+' were not cited during this lecture.':'No uncited pages; review sections marked touched.')+
      '\nDue: '+strip(T(prep.due))+'. Review the ledger at '+prep.ledger+' and bring the decision card.';
  }
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' -> '):'';
  if(ref==='@matrix'){var n=['','Known / managed','Known / unmanaged','Unknown / monitor'],o=[];
    for(var k in S.mx){if(S.mx[k])o.push(k.replace('x',' x ')+' = '+n[S.mx[k]]);} return o.join('; ');}
  if(ref==='@gates'){var c=0,p=[];for(var i=0;i<GATE_DEFS.length;i++){if(S.gates[GATE_DEFS[i][0]]){c++;p.push(GATE_DEFS[i][1]);}}
    return c+' of '+GATE_DEFS.length+' gates passed'+(p.length?' ('+p.join(', ')+')':'');}
  if(ref==='@jahtest'){var QT=LECTURE.jahtest; if(!QT) return '';
    var r=0,d=0,miss=[];
    for(var i=0;i<QT.items.length;i++){var c=S.quiz?S.quiz[i]:undefined;
      if(c!==undefined&&c!==null){d++; if(c===QT.items[i].a) r++; else miss.push('item '+(i+1)+' ('+QT.items[i].lo+')');}}
    if(!d) return '';
    return r+' correct of '+d+' answered'+(miss.length?'\nMissed: '+miss.join('; '):'');}
  if(ref==='@signed'){var o=[];
    for(var i=0;i<SIGN.length;i++){var r=S.sign&&S.sign[SIGN[i].id];
      if(r) o.push((SIGN[i].label||SIGN[i].id)+' — signed '+r.at);}
    return o.join('\n');}
  if(ref==='@coverage'){var rr=coverageRows(); if(!rr.length) return '';
    var o=[],op=[];
    for(var i=0;i<rr.length;i++){
      o.push(rr[i].s.k+' '+rr[i].s.t+': '+rr[i].st+(rr[i].units.length?' ('+rr[i].units.join(', ')+')':''));
      if(rr[i].st==='open') op.push(rr[i].s.k+(rr[i].s.why?' — '+rr[i].s.why:''));
    }
    return o.join('\n')+(op.length?'\nOut of scope for this hour: '+op.join('; '):'');}
  if(ref==='@clo'){var R=LECTURE.readiness||[],o=[];
    for(var i=0;i<R.length;i++) o.push(R[i].clo+': '+(cloOk(R[i])?'supported':'not supported'));
    return o.join('; ');}
  if(ref==='@marks'){var o=[];for(var k in (S.marks||{})){if(S.marks[k]&&S.marks[k].length)o.push(k+': '+S.marks[k].length+' region(s) marked');}return o.join('; ');}
  if(ref==='@aigate'){var a=S.ai||{};if(!a.q1)return '';
    var v='';
    if(a.q1==='n') v='PERMITTED — preparation only';
    else if(!a.q2||(a.q2==='n'&&!a.q2b)||!a.q3) return '';
    else if(a.q2==='y'&&a.q3==='y') v='PERMITTED as prepared evidence';
    else if(a.q2==='n'&&a.q2b==='y'&&a.q3==='y') v='PERMITTED, CONDITIONALLY — the TEST is the evidence, not the output';
    else v='NOT PERMITTED — rework before it enters the chain';
    return 'Evidence chain: '+(a.q1==='y'?'yes':'no')+
      ' · Re-derivable: '+(a.q2||'-')+
      ' · Testable: '+(a.q2b||'-')+
      ' · Named signer: '+(a.q3||'-')+
      '\nGate verdict: '+v;}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){
  var L=LECTURE, o=[];
  var line=function(x){o.push(x===undefined?'':x);};
  line('# '+strip(T(L.title))+' — course file extract');
  line('');
  line('Course: '+strip(T(L.course))+'  |  Source: '+strip(T(L.source)));
  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');
  line('lecture and rendered by the same engine that teaches it.');
  line('');
  line('Cut points ('+L.units.filter(function(u){return u.cut;}).length+'): '+L.units.filter(function(u){return u.cut;}).map(function(u){return u.k;}).join(', '));
  line('Scaffolding thresholds: '+JSON.stringify(L.thresholds));
  line('');
  line('## 1. Session outcomes, by unit');
  line('');
  line('| Unit | Rule | The student will be able to | Activity | Timebox |');
  line('|---|---|---|---|---|');
  for(var i=0;i<L.units.length;i++){
    var u=L.units[i]; if(!u.rule||!u.learn) continue;
    line('| '+u.k+' | '+strip(T(u.rule))+' | '+strip(T(u.learn))+' | '+strip(T(u.task||'—'))+' | '+(u.timebox||'—')+' |');
  }
  line('');
  line('## 2. Course and programme outcome map');
  line('');
  line('| CLO | PLO | Domain | Outcome | Evidence the student produces | Where |');
  line('|---|---|---|---|---|---|');
  for(var r=0;r<(L.readiness||[]).length;r++){
    var R=L.readiness[r], NAMES=L.fieldNames||{}, ev=[];
    for(var n=0;n<(R.needs||[]).length;n++) ev.push(NAMES[R.needs[n]]||R.needs[n]);
    line('| '+R.clo+' | '+(R.plo||'—')+' | '+(R.d||'')+' | '+strip(T(R.txt))+' | '+ev.join(', ')+' | '+strip(R.where||'')+' |');
  }
  line('');
  line('Assessment evidence is the artifact itself: the decision card the student');
  line('exports, whose sections are listed in §5. The closing unit reads the map');
  line('above off that artifact rather than off self-report.');
  line('');
  line('## 3. Source coverage');
  line('');
  var rows=coverageRows();
  if(rows.length){
    line('| Section | Pages | Status | Reached by |');
    line('|---|---|---|---|');
    for(var c=0;c<rows.length;c++){
      var R2=rows[c];
      line('| '+R2.s.k+' '+strip(R2.s.t)+' | '+R2.s.pp[0]+'–'+R2.s.pp[1]+' | '+R2.st+' | '+(R2.units.join(', ')||'—')+' |');
      if(R2.st==='open'&&R2.s.why) line('| | | out of scope | '+strip(R2.s.why)+' |');
    }
    var g=uncitedPages();
    if(g.length){ line(''); line('Pages within the source span that this session never cites: '+
      strip(fmtRanges(g))+'. Counted from the page citation on every card.'); }
  } else line('No coverage ledger declared.');
  line('');
  if(L.jahiziah){
    line('## 4. National alignment');
    line('');
    line(strip(T(L.jahiziah.gku))+' → '+strip(T(L.jahiziah.sku)));
    line('');
    line('| # | Outcome | Status | Where |');
    line('|---|---|---|---|');
    for(var j=0;j<(L.jahiziah.outcomes||[]).length;j++){
      var O=L.jahiziah.outcomes[j];
      line('| '+O.n+' | '+strip(T(O.txt))+' | '+O.s+' | '+strip(T(O.where||''))+' |');
    }
    line('');
    line('This states coverage only. It is not the national examination and');
    line('predicts nothing about any student\'s result on it.');
    line('');
  }
  line('## 5. The artifact each student leaves holding');
  line('');
  for(var m=0;m<(L.caseMap||[]).length;m++) line('- '+strip(T(L.caseMap[m].t)));
  line('');
  line('## 6. Accessibility and data');
  line('');
  line('- Runs as one HTML file with no install, no account and no network.');
  line('- Nothing a student types leaves their browser; there is no server to hold it.');
  line('- Full keyboard navigation; ? lists the keys. Text size adjustable 80–140%.');
  line('- Every status is carried by a word as well as a colour.');
  line('');
  line('Generated '+new Date().toISOString().slice(0,10)+' by the ISCARB lecture engine.');
  return o.join('\n');
}
function strip(x){
  if(x==null||x==='') return '';
  var s=String(x);
  var d=document.createElement('div'); d.innerHTML=s;
  s=(d.textContent||d.innerText||s).replace(/\s+/g,' ').trim();
  return s.replace(/\|/g,'\\|').trim();
}

var tS=0,tT=0,tOn=false,tI=null;
function fmt(s){var m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?'+':'')+m+':'+(x<10?'0':'')+x;}
function resetTimer(sec){
  tT=sec; tS=sec; tOn=false; clearInterval(tI);
  document.getElementById('timer').className='';
  document.getElementById('tBtn').textContent='Start';
  document.getElementById('clock').textContent=tT?fmt(tS):'--:--';
}
function toggleTimer(){
  if(!tT) return; tOn=!tOn;
  var w=document.getElementById('timer');
  document.getElementById('tBtn').textContent=tOn?'Pause':'Start';
  clearInterval(tI);
  if(tOn){w.className='run'; tI=setInterval(function(){
    tS--; document.getElementById('clock').textContent=fmt(tS);
    if(tS===0) timeUp();
    if(tS<=0) w.className='over';
  },1000);}
  else w.className=tS<=0?'over':'';
}
/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}

/* ---------- v12 quick view: the deck turns itself ---------------------------
   One button (or Q) auto-advances at a readable pace with a visible progress
   line on the bar — built for self-review, screen recording and sharing.
   Any manual navigation cancels it (the guard sits inside go()); it holds
   still while the tab is hidden or the student is typing, and it follows
   the same visible route the arrows follow — conditional units stay skipped. */
var QV={on:false,driving:false,total:0,left:0,last:0,raf:0};
function qvDwell(i){
  var u=U[i]; if(!u) return 7000;
  if(u.k==='TITLE') return 5000;
  if(u.k==='END') return 6500;
  var b=JSON.stringify(u.blocks||[]);
  if(/"(jahtest|qa|recall|gates|levels|coverage)"/.test(b)) return 12000;
  return 7000;
}
function qvPaint(){
  var f=document.getElementById('qvFill');
  if(f) f.style.width=(QV.total?Math.max(0,Math.min(100,QV.left/QV.total*100)):0)+'%';
}
function qvLabel(){
  var b=document.getElementById('qvBtn'); if(!b) return;
  b.setAttribute('data-on',QV.on?'1':'0');
  var ci=b.querySelector('.ci'),ct=b.querySelector('.ct');
  if(ci) ci.textContent=QV.on?'\u23F8':'\u25B6';
  if(ct) ct.textContent=QV.on?'Pause':'Quick view';
  document.body.classList.toggle('qv-on',QV.on);
}
function qvStep(ts){
  if(!QV.on) return;
  if(document.hidden){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  var ae=document.activeElement;
  if(ae&&/^(textarea|input)$/i.test(ae.tagName)){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  QV.left-=(ts-QV.last); QV.last=ts; qvPaint();
  if(QV.left<=0){
    if(cur>=U.length-1||!visibleInDirection(1)){ qvStop(); note('Quick view finished.'); return; }
    QV.driving=true; go(cur+1); QV.driving=false;
    QV.total=QV.left=qvDwell(cur); qvPaint();
  }
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStart(){
  QV.on=true; QV.total=QV.left=qvDwell(cur); QV.last=performance.now();
  qvLabel(); qvPaint();
  note('Quick view on — the deck turns itself. Q or Esc stops it.');
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStop(){
  if(!QV.on) return;
  QV.on=false; cancelAnimationFrame(QV.raf); qvLabel(); qvPaint();
}
function qvToggle(){ QV.on?qvStop():qvStart(); }

function feedback(){var score=0;config.quiz.forEach(function(q,i){var box=document.getElementById('prep-feedback-'+i),ok=record.answers[i]===q[2];score+=ok?1:0;box.hidden=false;box.textContent=(ok?'Correct. ':'Revisit this objective. ')+q[3];});status.textContent='Practice: '+score+' / 5 on this attempt. '+(score===5?'Now explain your answers without looking.':'Review the explanations and retry before the assignment.')+' This is local formative feedback, not a grade or certified mastery.'+(storage?'':' Saving is unavailable; keep a note or screenshot of your answers.');}
record.answers.forEach(function(v,i){var el=form.querySelector('input[name="prep-'+i+'"][value="'+v+'"]');if(el)el.checked=true;});
if(record.checked&&record.answers.length===5)feedback();
form.addEventListener('change',function(){record.answers=current();record.checked=false;form.querySelectorAll('[data-prep-feedback]').forEach(function(e){e.hidden=true;});persist();status.textContent='Answers changed. Check the complete set for feedback.'+(storage?'':' Local saving is unavailable.');});
document.getElementById('checkPrep').addEventListener('click',function(){var answers=current();if(answers.some(function(a){return a===null;})){status.textContent='Attempt all five questions before opening the explanations.';return;}record.answers=answers;record.attempts=(record.attempts||0)+1;record.checked=true;record.checkedAt=new Date().toISOString();if(!record.firstAttempt)record.firstAttempt=answers.slice();persist();feedback();});
document.addEventListener('click',function(e){var b=e.target.closest('[data-source-slide]');if(!b)return;e.preventDefault();var section=document.getElementById('source-slide-'+b.dataset.sourceSlide);if(!section)return;var slide=section.closest('.slide');if(slide)go(Number(slide.dataset.i),true);section.open=true;if(LECTURE.visualStory)document.dispatchEvent(new CustomEvent('iscarb-source-focus',{detail:b.dataset.sourceSlide}));else section.scrollIntoView?.({block:'start',behavior:'smooth'});});
})();

/* Paginated visual presentation on top of the preserved iSCARB interaction engine.
 * CSS columns reflow complete content into addressable pages. No scale-to-fit,
 * line clamps, scrollbar hiding, wheel hijacking or content truncation is used.
 */
(function(){
'use strict';
var story=LECTURE.visualStory;if(!story)return;
var states=new Map(),overlays=new Map(),oldGo=go,oldOpen=openOv,oldClose=closeOv,oldFit=fit;
var resizePending=false,sourceTarget=null,initializing=true,resume=null;
try{resume=JSON.parse(localStorage.getItem(KEY+'-visual-location-v3')||'null')}catch(e){}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function plain(value){var n=el('div');n.innerHTML=T(value||'');return n.textContent.trim();}
function flowOf(state){return state.mode==='overview'&&state.summary?state.summary:state.details;}
function active(){var ov=document.querySelector('.ov.on');return ov?overlays.get(ov.id):states.get(cur);}
function transformTables(root){
 root.querySelectorAll('table').forEach(function(table){
  var rows=Array.from(table.rows),heads=[];if(rows[0]&&rows[0].querySelector('th'))heads=Array.from(rows.shift().cells).map(function(c){return c.textContent.trim()});
  var replacement=el('div','v3-table');replacement.setAttribute('role','list');
  rows.forEach(function(row){var card=el('section','v3-table-row'),dl=el('dl');card.setAttribute('role','listitem');Array.from(row.cells).forEach(function(cell,i){dl.append(el('dt','',heads[i]||'Column '+(i+1)));var dd=el('dd');while(cell.firstChild)dd.append(cell.firstChild);dl.append(dd)});card.append(dl);replacement.append(card)});
  table.replaceWith(replacement);
 });
 // Comparison grids have visual column headers; retain that mapping in each card.
 root.querySelectorAll('.cmp').forEach(function(cmp){cmp.style.display='block';});
}
function toolbar(state){
 var bar=el('div','v3-toolbar'),mode=el('button','v3-mode','Details'),local=el('div','v3-local');mode.type='button';
 mode.hidden=!state.summary;mode.setAttribute('aria-label','Show full explanation');
 mode.onclick=function(){state.mode=state.mode==='overview'?'details':'overview';state.page=0;show(state);};
 var prev=el('button','','‹'),label=el('span','v3-page-label'),next=el('button','','›');
 prev.type=next.type='button';prev.setAttribute('aria-label','Previous page within this unit');next.setAttribute('aria-label','Next page within this unit');
 prev.onclick=function(){setPage(state,state.page-1)};next.onclick=function(){setPage(state,state.page+1)};
 local.append(prev,label,next);bar.append(mode,local);state.toolbar=bar;state.modeButton=mode;state.pageLabel=label;state.pagePrev=prev;state.pageNext=next;return bar;
}
function countPages(width,contentWidth,gap){return Math.max(1,Math.ceil((contentWidth+gap-1)/(width+gap)));}
function persist(state){if(initializing||state.index===undefined||state.index!==cur)return;try{localStorage.setItem(KEY+'-visual-location-v3',JSON.stringify({key:U[state.index].k,mode:state.mode,page:state.page}));}catch(e){}}
function measure(state){
 var flow=flowOf(state);if(!flow)return;
 var width=state.window.clientWidth||1000,gap=40;flow.style.setProperty('--page-width',width+'px');flow.style.width=width+'px';
 flow.style.setProperty('--page-height',(state.window.clientHeight||480)+'px');
 state.stride=width+gap;state.pages=countPages(width,flow.scrollWidth||width,gap);state.page=Math.min(Math.max(0,state.page),state.pages-1);
 flow.style.transform='translateX('+(-state.page*state.stride)+'px)';
 state.pageLabel.textContent='Page '+(state.page+1)+' / '+state.pages;state.pagePrev.disabled=state.page===0;state.pageNext.disabled=state.page>=state.pages-1;
 state.modeButton.textContent=state.mode==='overview'?'Details':'Visual overview';state.modeButton.setAttribute('aria-label',state.mode==='overview'?'Show full explanation':'Return to visual overview');
 if(state.index!==undefined){var u=U[state.index],total=U.filter(function(x){return x.route===u.route}).length,pos=U.filter(function(x,i){return i<=state.index&&x.route===u.route}).length;
  if(state.index===cur){document.getElementById('progT').textContent=(u.route==='core'?'Concept ':u.route==='study'?'Study ':'Tool ')+pos+' / '+total;updateLectureControls();}}
}
function show(state){
 if(state.summary)state.summary.hidden=state.mode!=='overview';state.details.hidden=state.mode==='overview'&&!!state.summary;
 measure(state);persist(state);
}
function setPage(state,page){if(!state)return;state.page=Math.max(0,Math.min(page,state.pages-1));show(state);var live=document.getElementById('tLive');if(live)live.textContent='Page '+(state.page+1)+' of '+state.pages;}
function focusPage(state,target){
 if(!state||!target||!target.isConnected)return;
 if(state.summary&&!state.summary.contains(target)){state.mode='details';show(state)}
 var f=flowOf(state),r=target.getClientRects()[0],fr=f.getBoundingClientRect();
 if(r&&state.stride)setPage(state,Math.floor((r.left-fr.left+2)/state.stride));
}
function diagram(nodes,kind){
 var d=el('div','v3-diagram '+(kind==='flow'?'flow':'compare'));d.style.setProperty('--node-count',Math.min(nodes.length,5));d.setAttribute('role','group');d.setAttribute('aria-label',kind==='flow'?'Concept sequence':'Concept comparison');
 nodes.forEach(function(n){var box=el('div','v3-node');box.append(el('strong','',n[0]));if(n[1])box.append(el('span','',n[1]));d.append(box)});return d;
}
function copySvg(svg,suffix){
 var copy=svg.cloneNode(true),ids={};copy.querySelectorAll('[id]').forEach(function(n){ids[n.id]=n.id+'-'+suffix;n.id=ids[n.id]});
 copy.querySelectorAll('*').forEach(function(n){Array.from(n.attributes).forEach(function(a){var value=a.value;Object.keys(ids).forEach(function(id){value=value.replaceAll('url(#'+id+')','url(#'+ids[id]+')');if(value==='#'+id)value='#'+ids[id]});if(value!==a.value)n.setAttribute(a.name,value)})});
 copy.setAttribute('role','img');return copy;
}
function buildSummary(state){
 var u=U[state.index],spec=story.units[u.k],out=state.summary;if(!out)return;out.replaceChildren();
 if(u.k==='READING'){
  var intro=el('p','','Before the assignment and next discussion. Calendar dates are in Blackboard.');out.append(intro);
  LECTURE.study.readings.forEach(function(r){var card=el('section','v3-reading'),h=el('h2','',r[0]),p=el('p','','Required source slides '+r[1]+'–'+r[2]),links=el('div','lp-actions');
   for(var number=r[1];number<=r[2];number++){var b=el('button','lp-btn','Slide '+number);b.type='button';b.dataset.sourceSlide=number;links.append(b)}card.append(h,p,links);out.append(card);
  });var actions=el('div','lp-actions'),check=el('button','lp-btn','Check the five objectives');check.dataset.jump='PREP';actions.append(check);out.append(actions);return;
 }
 if(u.k==='TITLE'||u.k==='START'){
  var c=el('section','v3-case'),opening=story.opening;c.append(el('div','v3-case-label',u.k==='TITLE'?'ISCARB · PROFESSOR ADEEB NOOR':'FICTIONAL TEACHING CASE'));
  c.append(el('h2','',u.k==='TITLE'?plain(LECTURE.title):opening.headline));c.append(el('p','',u.k==='TITLE'?opening.headline:opening.case));
  if(u.k==='START')c.append(el('p','v3-decision',opening.question));
  var route=el('div','v3-mini-route');(u.k==='TITLE'?['See the problem','Explain the mechanism','Test your thinking','Defend a decision']:opening.nodes).forEach(function(t){route.append(el('span','',t))});c.append(route);
  if(u.k==='TITLE'){var a=el('div','lp-actions'),start=el('button','lp-btn','Start the case');start.dataset.jump='START';a.append(start);c.append(a)}
  if((state.window.clientWidth&&state.window.clientWidth<560)||(state.window.clientHeight&&state.window.clientHeight<480)){c.classList.add('v3-case-pages')}out.append(c);return;
 }
 if(!spec)return;
 var image=typeof FIG!=='undefined'&&FIG[spec.visual],native=null;
 if(!image&&['props','layers','rd'].includes(spec.visual))native=state.details.querySelector('.figwrap svg');
 var windowHeight=state.window.clientHeight||480,width=state.window.clientWidth||1000;
 // Split the diagram into labelled pages on compact screens instead of shrinking it.
 var maxNodes=width<560?Math.max(1,Math.min(3,Math.floor((windowHeight-110)/78))):5;
 var chunks=[];if(image||native)chunks=[spec.nodes];else for(var i=0;i<spec.nodes.length;i+=maxNodes)chunks.push(spec.nodes.slice(i,i+maxNodes));
 chunks.forEach(function(nodes,part){
  var page=el('section','v3-summary'),picture=el('div','v3-picture');
  if(image){picture.classList.add('has-source');var img=el('img');img.src=image;img.alt=plain(u.title)+'. '+spec.nodes.map(function(n){return n.join(': ')}).join('; ');picture.append(img)}
  else if(native){picture.classList.add('has-source');var svg=copySvg(native,'visual-'+state.index);svg.setAttribute('aria-label',plain(u.title));picture.append(svg)}
  else picture.append(diagram(nodes,spec.visual));
  page.append(picture,el('p','v3-takeaway',spec.takeaway+(chunks.length>1?' ('+(part+1)+'/'+chunks.length+')':'')));out.append(page);
  if(windowHeight<230){page.classList.add('v3-compact-summary');}
 });
}
function prepareSlide(u,i){
 var slide=deck.querySelector('[data-i="'+i+'"]'),fitEl=slide.querySelector('.fit'),area=slide.querySelector('.area'),top=slide.querySelector('.top');
 if(!top){top=el('div','top');fitEl.prepend(top)}
 var title=top.querySelector('h1');if(!title){title=el('h1');top.prepend(title)}
 title.textContent=u.k==='TITLE'?'A decision you can explain':u.k==='START'?'Start with the problem':u.k==='END'?'Before the assignment':plain(u.title||LECTURE.title);
 var sub=top.querySelector('.sub');var windowEl=el('div','v3-window'),details=el('div','v3-flow'),summary=null;
 details.dataset.view='explanation';if(sub){sub.classList.remove('sub');details.append(sub)}
 while(area.firstChild)details.append(area.firstChild);
 var task=fitEl.querySelector(':scope > .taskstrip');if(task){task.classList.remove('taskstrip');task.classList.add('v3-task');details.append(task)}
 transformTables(details);
 details.querySelectorAll('.lp-source-section').forEach(function(section){section.open=true;});
 var state={index:i,window:windowEl,details:details,page:0,pages:1,mode:'details',stride:1040};
 if(u.k==='TITLE'||u.k==='START'||u.k==='READING'||story.units[u.k]){summary=el('div','v3-flow');summary.dataset.view='overview';state.summary=summary;state.mode='overview';windowEl.append(summary)}
 windowEl.append(details);area.replaceWith(windowEl);fitEl.append(toolbar(state));states.set(i,state);
 var ribbon=fitEl.querySelector('.lp-ribbon');if(ribbon){var step=u.k==='TITLE'?'START':u.k==='START'?'SEE':u.k.startsWith('CHECK')?'TEST':u.k==='APPLY'?'DECIDE':u.k==='END'?'TRANSFER':u.route==='core'?'EXPLAIN':u.route==='study'?'PREPARE':'EXPLORE';ribbon.append(el('span','v3-step',step));}
 if(summary)buildSummary(state);show(state);
}
U.forEach(prepareSlide);
[['prevBtn','Previous page or concept'],['nextBtn','Next page or concept']].forEach(function(item){var button=document.getElementById(item[0]);button.setAttribute('aria-label',item[1]);button.title=item[1];});
function directionAvailable(dir){var route=U[cur].route;for(var j=cur+dir;j>=0&&j<U.length;j+=dir)if(U[j].route===route&&!U[j].showIf)return true;return false;}
updateLectureControls=function(){var s=states.get(cur);document.getElementById('prevBtn').disabled=(!s||s.page===0)&&!directionAvailable(-1);document.getElementById('nextBtn').disabled=(!s||s.page>=s.pages-1)&&!directionAvailable(1);};
go=function(i,force){
 var s=states.get(cur),dir=i>cur?1:-1;
 if(!force&&s&&((dir>0&&s.page<s.pages-1)||(dir<0&&s.page>0))){setPage(s,s.page+dir);return;}
 oldGo(i,force);s=states.get(cur);if(s){s.page=0;show(s);if(!force&&dir<0)setPage(s,s.pages-1);}
};
function layout(){var s=states.get(cur);if(s){if(s.summary)buildSummary(s);show(s)}var ov=document.querySelector('.ov.on');if(ov&&overlays.has(ov.id))show(overlays.get(ov.id));}
fit=function(){oldFit();layout()};fitSlide=function(){var s=states.get(cur);if(s)measure(s)};
function schedule(){if(resizePending)return;resizePending=true;requestAnimationFrame(function(){resizePending=false;layout();if(sourceTarget){var target=sourceTarget;sourceTarget=null;focusPage(states.get(cur),target)}});}
window.addEventListener('resize',schedule);document.addEventListener('fullscreenchange',schedule);document.addEventListener('load',function(e){if(e.target.tagName==='IMG')schedule()},true);
if(typeof ResizeObserver!=='undefined'){var observer=new ResizeObserver(schedule);observer.observe(deck);}
// Preserve existing quiz, text-entry and reveal listeners; only reflow their result.
document.addEventListener('click',function(e){
 var answer=e.target.closest('[data-answer-toggle],[data-qanswer]');
 if(answer){var id=answer.dataset.answerToggle||answer.dataset.qanswer,box=document.querySelector('[data-answer-box="'+id+'"],[data-qanswer-box="'+id+'"]');if(box&&!box.hidden)sourceTarget=box;schedule();}
 var b=e.target.closest('[data-source-slide]');if(b){var section=document.getElementById('source-slide-'+b.dataset.sourceSlide);if(section){sourceTarget=section;schedule()}}
 if(e.target.closest('#checkPrep'))schedule();
});
document.addEventListener('toggle',function(e){if(e.target.matches('.lp-source-section')){sourceTarget=e.target;schedule()}},true);
document.addEventListener('focusin',function(e){var s=active();if(s&&flowOf(s).contains(e.target))focusPage(s,e.target)});
document.addEventListener('iscarb-source-focus',function(e){sourceTarget=document.getElementById('source-slide-'+e.detail);schedule()});
function prepareOverlay(id){
 var ov=document.getElementById(id),win=ov.querySelector('.oscroll');if(!win)return;
 var existing=overlays.get(id);if(existing&&existing.details.isConnected){show(existing);return;}
 var tools=ov.querySelector('.tools');if(tools)tools.remove();ov.querySelectorAll('.v3-overlay-footer').forEach(function(n){n.remove()});
 var flow=el('div','v3-flow');while(win.firstChild)flow.append(win.firstChild);win.append(flow);transformTables(flow);
 var state={window:win,details:flow,mode:'details',page:0,pages:1,stride:1040};var footer=el('div','v3-overlay-footer');if(tools)footer.append(tools);footer.append(toolbar(state));ov.append(footer);overlays.set(id,state);show(state);
}
openOv=function(id){oldOpen(id);document.querySelector('.lp-top').inert=true;prepareOverlay(id);};
closeOv=function(id){oldClose(id);document.querySelector('.lp-top').inert=false;};
// A downloaded copy is initialized again when opened. Remove generated chrome
// so it cannot accumulate duplicate navigation or nested pagination containers.
var originalDownloadText=downloadText;
downloadText=function(text,name,type){
 if(type==='text/html'){
  var copy=new DOMParser().parseFromString(text,'text/html');
  copy.querySelectorAll('.lp-top,.lp-zoom').forEach(function(n){n.remove()});
  copy.querySelectorAll('.ov').forEach(function(ov){
   var footer=ov.querySelector('.v3-overlay-footer'),tools=footer&&footer.querySelector('.tools');
   if(tools)ov.append(tools);if(footer)footer.remove();
   ov.querySelectorAll('.v3-flow').forEach(function(flow){flow.replaceWith.apply(flow,Array.from(flow.childNodes))});
  });
  text='<!doctype html>\n'+copy.documentElement.outerHTML;
  name='Ch'+LECTURE.path.chapter+'-iSCARB-with-work.html';
 }
 return originalDownloadText(text,name,type);
};
document.addEventListener('keydown',function(e){var ov=document.querySelector('.ov.on');if(!ov||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;var s=overlays.get(ov.id);if(s&&(e.key==='PageDown'||e.key==='PageUp')){e.preventDefault();setPage(s,s.page+(e.key==='PageDown'?1:-1));}},true);
// Small, testable pagination contract; dimensions come from the browser at runtime.
window.ISCARB_PAGES={count:countPages,current:function(){var s=active();return s?{page:s.page,pages:s.pages,mode:s.mode,key:U[cur].k}:null;},refresh:layout,goPage:function(n){setPage(active(),n)},explain:function(){var s=states.get(cur);if(s&&s.summary){s.mode='details';s.page=0;show(s)}}};
// Hash links take priority. Old per-unit bookmarks continue to work unchanged.
if(resume&&location.hash.slice(1)===resume.key){var s=states.get(cur);if(s){s.mode=resume.mode==='details'?'details':s.summary?'overview':'details';s.page=Math.max(0,Number(resume.page)||0)}}
initializing=false;layout();
})();
