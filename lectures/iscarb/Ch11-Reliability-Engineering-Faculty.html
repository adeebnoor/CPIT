<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="fbr-delivery" content="faculty-lane-static"><title>ISCARB Faculty Lecture · Chapter 11 Reliability Engineering</title>
<style>:root{--bg:#08070c;--panel:#15121c;--line:#2c2534;--ink:#f5f0ea;--dim:#aaa09a;--sand:#ddb27e;--mag:#f0189a;--teal:#4fc6cb;--green:#4fbf8b}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:#0c0a11}.brand{font-size:12px;font-weight:800;letter-spacing:.08em}.brand span{color:var(--sand)}.toplinks{display:flex;gap:8px}.top a{color:var(--dim);text-decoration:none;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:7px 9px}.stage{position:relative;min-height:0}.slide{position:absolute;inset:0;padding:26px 38px 18px;display:none;overflow:auto}.slide.on{display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;gap:16px;color:var(--dim);font-size:11px}.phase{font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}.interaction{color:var(--mag);font-weight:800}h1{font-size:clamp(31px,5.3vw,62px);line-height:1.02;letter-spacing:-.035em;margin:18px 0 10px;max-width:1000px}.sub{font-size:clamp(15px,2vw,21px);line-height:1.5;color:#d8d0ca;max-width:1050px;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-content:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}.card b{display:block;color:var(--sand);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}.card p,.card li{font-size:14px;line-height:1.48;color:#e3ddd8}.card p{margin:0}.card ul{margin:0;padding-left:18px}.principle{margin-top:16px;border-left:3px solid var(--mag);padding:12px 15px;background:rgba(240,24,154,.06);font-size:15px;line-height:1.5}.notes{display:none;margin-top:12px;border:1px dashed rgba(221,178,126,.45);border-radius:10px;padding:11px 13px;color:#d8cdbf;background:rgba(221,178,126,.05);font-size:12px}.notes.show{display:block}.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--line);background:#0c0a11}.nav{display:flex;gap:7px}.nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:800}.progress{height:4px;background:#26202d;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--sand);width:5%;transition:width .2s}.hint{font-size:10px;color:var(--dim)}@media(max-width:700px){.top{padding:9px 11px}.brand{font-size:10px}.top a{font-size:9px;padding:6px}.slide{padding:20px 17px 12px}.grid{grid-template-columns:1fr}.card p,.card li{font-size:13px}.bar{gap:8px;padding:8px}.hint{display:none}.nav button{padding:8px 10px}}</style></head>
<body><div class="app"><header class="top"><div class="brand"><span>ISCARB</span> · CPIT-455 · CH11 Faculty Lane</div><div class="toplinks"><a href="../../iscarb.html">Hub</a><a href="Ch11-FBR-Student-Assignment.html">Student assignment</a></div></header><main class="stage" id="stage"></main><footer class="bar"><div class="nav"><button id="prev">←</button><button id="next">→</button><button id="noteBtn">Notes</button></div><div class="progress"><i id="prog"></i></div><div class="hint">← → navigate · N notes · swipe on mobile</div></footer></div>
<script>
const S=[
{p:'CRISIS',i:'INTERACTION 1 OF 3 · VERBAL POLL',t:'99.9% of what?',s:'A supplier clause reaches contract review with one impressive number and almost no operational meaning.',c:[['Clause','“The service shall be 99.9% reliable.”'],['Missing','Failure event, operational profile, observation window and repair assumption are undefined.'],['Decision','Would you sign it now? What one definition must be fixed first?']],q:'A percentage without a defined event and use context is not yet a requirement.',n:'Poll only. Do not make students fill a form.'},
{p:'MAP',t:'Reliability is a chain of definitions',s:'This chapter moves from failure meaning to measurable requirement and evidence.',c:[['Failure model','What counts as failure?'],['Metric','POFOD, ROCOF, MTTF, availability.'],['Operational profile','Under what pattern of use?'],['Requirement','What threshold, window and condition?'],['Testing','How will it be estimated?'],['Architecture','What fault tolerance supports it?']]},
{p:'THEORY',t:'Reliability is conditional',s:'Reliability means probability of failure-free operation over a stated time or demand under stated conditions.',c:[['Not a label','It is meaningless without the operating condition.'],['Not availability','A repairable system may be highly available but still fail often.'],['Not safety','A failure can be reliable in frequency terms yet unacceptable in consequence.']]},
{p:'METRICS',t:'POFOD · Probability of failure on demand',s:'Use when the service is demanded intermittently and each demand can succeed or fail.',c:[['Question','What fraction of demands fail?'],['Good fit','Protection or emergency functions invoked on demand.'],['Boundary','Demand definition and demand mix must be stable enough to interpret the estimate.']]},
{p:'METRICS',t:'ROCOF · Rate of occurrence of failures',s:'Use when failures occur over continuous operation and frequency matters.',c:[['Question','How many failures per unit time / transaction / operation?'],['Good fit','Continuously operating services.'],['Boundary','The exposure unit and operational workload must be defined.']]},
{p:'METRICS',t:'MTTF · Mean time to failure',s:'A useful average only when the failure process and population make the mean meaningful.',c:[['Question','Expected operating time before failure.'],['Trap','An average can hide a dangerous tail or mixed populations.'],['Boundary','Failure distribution and use regime matter.']]},
{p:'METRICS',t:'Availability includes repair',s:'Availability asks whether service is operational when required; repair time can dominate it.',c:[['Relationship','Availability depends on time operating and time unavailable.'],['Engineering lever','Reduce failure frequency, repair time, or both.'],['Trap','Redefining degraded mode as “available” can improve the number without improving service.']]},
{p:'PROFILE',t:'Operational profile: test the way the system is used',s:'Reliability measured under the wrong workload is evidence for the wrong system.',c:[['Frequency','Which operations dominate actual use?'],['Criticality','Which rare operations carry disproportionate risk?'],['Change','Peak seasons, new users or integration can invalidate yesterday’s profile.']]},
{p:'REQUIREMENT',i:'INTERACTION 2 OF 3 · FIT TRAP',t:'The easy fix: write 99.9%',s:'The number looks precise, but precision is not the same as professional fitness.',c:[['Bad requirement','“The system shall be 99.9% reliable.”'],['Needed','Metric + defined failure + operational profile + observation window + threshold.'],['Fit trap','A mathematically correct percentage can still be unusable.']],q:'Ask: what must be added before another engineer can test this?',n:'Keep this under three minutes.'},
{p:'TESTING',t:'Testing estimates, it does not magically prove',s:'Rare failure targets can require enormous test exposure.',c:[['Evidence volume','Stronger reliability claims demand more representative observations.'],['Independence','Repeated tests of the same narrow path do not broaden evidence.'],['Inference','State uncertainty around the estimate; do not report only a point number.']]},
{p:'FAULT TOLERANCE',t:'Fault tolerance changes the service outcome',s:'Detection, recovery, redundancy and graceful degradation prevent faults from becoming user-visible failures.',c:[['Detection','Know a fault or error occurred.'],['Containment','Stop propagation.'],['Recovery','Restore correct service.'],['Degradation','Continue a reduced but controlled service.']]},
{p:'FBR',t:'Fit–Bound–Refit Framework',s:'The lecture teaches reliability. FBR is the recurring way students practise professional judgment afterward.',c:[['FIT','Which metric or requirement form should govern this use?'],['BOUND','Under what observable condition would it cease to be fit?'],['ACT','What clause, monitor or test artifact follows?'],['STRESS','What changed?'],['REFIT','Retain, revise or replace.']],q:'Fit for use, not fit for you.'},
{p:'FBR · FIT',t:'Choose the metric that fits the decision',s:'The familiar metric is not automatically the professional metric.',c:[['Demand-driven','Consider POFOD.'],['Continuous failure frequency','Consider ROCOF.'],['Lifetime question','Consider MTTF.'],['Service presence','Consider availability.']],q:'Metric choice is part of judgment, not a formatting step.'},
{p:'FBR · BOUND',t:'A reliability number has an applicability boundary',s:'Operational profile, failure definition, repair assumptions and observation window determine what the number means.',c:[['Boundary example','If degraded mode is reclassified as available, reopen the availability decision.'],['Unknown vs boundary','Unknown = not yet known. Boundary = a change that should reopen the action.']]},
{p:'EVIDENCE',t:'A requirement must point to evidence',s:'Another engineer should know exactly how the claim will be checked.',c:[['Measure','Metric and unit.'],['Window','Time, demands or transactions observed.'],['Profile','Representative operating conditions.'],['Owner','Who collects and signs the evidence.']]},
{p:'AI & ACCOUNTABILITY',t:'AI may calculate; humans still own the claim',s:'Tools can draft clauses and analyse logs, but professional authorization needs accountable human judgment.',c:[['AI may assist','Compute metrics, summarize logs, propose tests.'],['Human responsibility','Define intended use, choose metric, set boundary, decide sufficiency of evidence and sign the requirement.']],q:'An unowned reliability number is not assurance.'},
{p:'CAPABILITY',t:'How judgment develops',s:'The rubric rates judgment quality, not field completion.',c:[['L1 · Descriptive','Explains metrics correctly.'],['L2 · Selective (Fit)','Chooses and justifies the metric for the use.'],['L3 · Bounded','States a clear applicability boundary.'],['L4 · Adaptive (Refit)','Retains, revises or replaces after a meaningful change.']]},
{p:'FBR · REFIT',t:'Do not revise just because something changed',s:'Test whether the changed fact crosses the boundary that gave the original requirement meaning.',c:[['Retain','Change is irrelevant to the requirement’s boundary.'],['Revise','Same metric remains useful but wording/threshold/evidence must change.'],['Replace','A different metric or requirement form must govern.']]},
{p:'PRACTICE',t:'From metric to engineering artifact',s:'Reliability work ends in something inspectable, not only a calculation.',c:[['Requirement clause','Defined, measurable and scoped.'],['Monitoring','Metric + trigger + owner.'],['Test plan','Profile + sample/exposure + acceptance rule.'],['Architecture decision','Mechanism + evidence + residual risk.']]},
{p:'ASSIGNMENT',i:'INTERACTION 3 OF 3 · LAUNCH',t:'After class: one reliability decision',s:'The student assignment locks FIT → BOUND → ACT + EVIDENCE before STRESS is revealed.',c:[['Part A','Choose the metric/requirement, state boundary, write the artifact and evidence.'],['Lock','Part A becomes a frozen snapshot.'],['Part B','STRESS is revealed; Retain / Revise / Replace.']],q:'The professor teaches the discipline. The assignment makes the student practise the judgment.',n:'Open the student assignment link and explain submission once. Do not complete it in class.'}
];
let i=0,touchX=0;const stage=document.getElementById('stage'),prog=document.getElementById('prog');function esc(x=''){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){stage.innerHTML='';S.forEach((s,j)=>{const d=document.createElement('section');d.className='slide'+(j===i?' on':'');d.innerHTML=`<div class="meta"><span class="phase">${esc(s.p)}</span><span>${j+1} / ${S.length}${s.i?' · <b class="interaction">'+esc(s.i)+'</b>':''}</span></div><h1>${esc(s.t)}</h1><p class="sub">${esc(s.s)}</p><div class="grid">${(s.c||[]).map(x=>`<div class="card"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div>${s.q?`<div class="principle">${esc(s.q)}</div>`:''}${s.n?`<div class="notes" id="notes">${esc(s.n)}</div>`:''}`;stage.appendChild(d)});prog.style.width=((i+1)/S.length*100)+'%';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===S.length-1}function go(n){i=Math.max(0,Math.min(S.length-1,n));render()}document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);document.getElementById('noteBtn').onclick=()=>{const n=document.querySelector('.slide.on .notes');if(n)n.classList.toggle('show')};addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1);if(e.key.toLowerCase()==='n')document.getElementById('noteBtn').click()});stage.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)go(i+(dx<0?1:-1))},{passive:true});render();
</script></body></html>
