<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>Wealth OS v28</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#1f2937;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.loader{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:28px;text-align:center;box-shadow:0 18px 55px rgba(15,23,42,.08)}.mark{width:54px;height:54px;margin:auto;border-radius:16px;background:#665cff;color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px}.loader h1{font-size:20px;margin:16px 0 6px}.loader p{margin:0;color:#6b7280;line-height:1.8;font-size:14px}.spin{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:#665cff;border-radius:50%;margin:20px auto 0;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{margin-top:18px;color:#b42318;background:#fff1f0;padding:12px;border-radius:12px;display:none;direction:ltr;text-align:left;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="mark">W</div><h1>Wealth OS</h1><p>جارٍ تحميل النسخة v28…</p><div class="spin"></div><div id="err" class="err"></div></div>
<script>
(async()=>{
  const endpoint='https://hwuintdzmozamnmgtfly.supabase.co/functions/v1/wealth-os-v28';
  try{
    const r=await fetch(endpoint,{cache:'no-store'});
    const html=await r.text();
    if(!r.ok) throw new Error('HTTP '+r.status+'\n'+html.slice(0,500));
    if(!/^\s*<!doctype html/i.test(html)) throw new Error('Unexpected response\n'+html.slice(0,500));
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.querySelector('.spin').style.display='none';
    document.querySelector('#loader p').textContent='تعذر تحميل Wealth OS';
    const box=document.getElementById('err');box.style.display='block';box.textContent=String(e&&e.message||e);
  }
})();
</script>
</body>
</html>
