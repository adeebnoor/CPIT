</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261015-req-v6"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 10</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch10-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":10,"title":"Dependable Systems","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch10-Dependable-Systems.html","assignment":1,"points":4,"objectives":["Distinguish the five properties using one example.","Trace one failure through people, process and technology.","Explain redundancy, diversity and common-cause failure.","Identify evidence from a dependable process.","Explain what formal verification assumes and what it cannot establish."],"sections":["Dependability and failure","Dependability properties","Cost and criticality","Sociotechnical systems and regulation","Redundancy and diversity","Dependable processes","Formal methods"],"case":{"headline":"The alarm is sounding. Can the plant continue?","text":"A fictional coastal desalination control upgrade is live. Pressure alarms recur and an automatic failover occurs. The cause and independence of the sensing paths are not yet established.","question":"Which evidence separates a real pressure excursion from a sensing fault?","mutation":"Two nominally separate readings use the same transmitter and power supply. The vendor’s integration notes also show that the AI detector scores the signal from that same transmitter.","lens":"The plant supplies drinking water to a coastal city. The upgrade also installed a vendor's AI alarm assistant. It is a learned anomaly detector. It labels each pressure alarm “likely sensor fault” or “likely real excursion” with a confidence score. Tonight it labels the alarms “likely sensor fault, 0.91”. Two operators have started treating that label as a second opinion. Keep asking: does the label count as evidence?","fictional":true,"answerKey":"an independently verified pressure reading"},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Dependable Systems","phase":"ISCARB TOOLKIT","takeaway":"","bullets":[],"question":"Sit down. The decision starts in ninety seconds.","answer":"","sourceRange":"","notes":"Leave this up while the room settles. One sentence only: tonight you do not learn five definitions, you issue one engineering decision and defend it.","nodes":[],"full":"<p><\/p>","sourceStart":1,"minutes":2,"tier":"core"},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"","bullets":[],"question":"","answer":"","sourceRange":"","notes":"","nodes":[],"full":"<p><\/p>","sourceStart":1,"minutes":1,"tier":"core"},{"id":"START","title":"Your route through this chapter","phase":"LEARN","takeaway":"","bullets":[],"question":"","answer":"","sourceRange":"","notes":"","nodes":[],"full":"<p><\/p>","sourceStart":1,"minutes":1.5,"tier":"core"},{"id":"X01","title":"Five dependability properties","phase":"LEARN","takeaway":"Dependability is the user’s degree of trust—not availability alone.","bullets":[["Availability / reliability","Probabilities: service is ready when needed / behaves correctly."],["Safety / security","Judgments: how likely harm is / how well intrusion is resisted."],["Resilience","A judgment: how well critical services continue during disruption."],["Interaction","An available service can still be unsafe; match evidence to the property."]],"question":"A service is available but returns unsafe results. Which properties must you investigate, and why is availability alone insufficient?","answer":"Investigate reliability (correct service) and safety (harm), while checking the operating context. Availability concerns useful service being ready when required; it does not establish correctness or freedom from harm. Security and resilience may also matter if intrusion or disruption caused the unsafe results.","sourceRange":"3–6; 7–13","notes":"Put the source’s slides 8 and 9 side by side. Availability and reliability are defined as probabilities, so they must be measured; safety, security and resilience are judgments, so they must be argued to a threshold someone else accepts. Students who miss this write assignments full of unmeasured percentages.","nodes":[["Availability","Ready when needed"],["Reliability","Correct service"],["Safety","Avoid harm"],["Security","Resist attack"],["Resilience","Continue critical services"]],"full":"<p>Sommerville treats dependability as the user’s degree of trust in a system and names five principal properties. <b>Availability<\/b> is the probability that the system is up and able to deliver useful services when needed. <b>Reliability<\/b> is the probability that it delivers those services correctly, as users expect. <b>Safety<\/b> is a judgment of how likely the system is to cause damage to people or its environment. <b>Security<\/b> is a judgment of how likely it is to resist accidental or deliberate intrusion. <b>Resilience<\/b> is a judgment of how well it maintains its critical services during disruptive events, such as equipment failure and cyberattacks.<\/p><p>The wording matters. A probability can be measured, so a claim about availability or reliability needs data collected over a stated period and operating conditions. A judgment cannot be measured directly, so a claim about safety, security or resilience must be argued from evidence to a level that someone else—a reviewer or a regulator—accepts. The properties also interact: an available service may still produce an unsafe result, so state which property your evidence actually supports.<\/p>","figure":"assets/v3/ch10-props.svg","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":3,"minutes":1.5,"tier":"core","concept":"dependability properties","answerKey":"reliability and safety, not availability alone","commonError":"Students answer “availability” because the service responds. Ask which property covers a correct result, and which covers harm."},{"id":"X02","title":"Hardware, software and human failure","phase":"LEARN","takeaway":"Find the failure mechanism before choosing the fix.","bullets":[["Failure causes","Hardware: design, manufacture or wear. Software: specification, design or code."],["Operational failures","Investigate people, procedures and work conditions—not only the operator."],["Repairability / maintainability","Restore after failure / adapt to new requirements."],["Error tolerance","Avoid or tolerate user-input errors."]],"question":"Name the hardware, software and operational hypotheses for the alarms, then identify one observation that would distinguish two hypotheses.","answer":"Possible hypotheses include a faulty pressure transmitter, a defect in the upgrade, or a misleading alarm or hand-over procedure. Compare an independently verified pressure reading with the alarm and switch-over log. That could separate a true excursion from a sensor problem. These are hypotheses and requested observations, not completed tests.","sourceRange":"3–6; 10–11","notes":"Teaching focus: Hardware, software and human failure. Most of the room will say Software because a software upgrade happened. The source says operational error is now perhaps the largest single cause. Do not correct anyone — ask which log separates the two, and whether it exists. Usually it does not, and that absence is the real finding.","nodes":[["Hardware","Physical fault"],["Software","Design fault"],["Operation","People and process"]],"full":"<p>Hardware faults arise from design, manufacturing or wear; software faults from specification, design or implementation; operational failures involve people and procedures. Investigate work conditions, not just the operator. Repairability means restoring the system after failure. Maintainability means adapting it to new requirements. Error tolerance means avoiding or tolerating user-input errors.<\/p>","sourceStart":3,"lens":"A learned detector adds a cause that is neither a code defect nor wear: the data it learned from. Add “the label is wrong for tonight’s conditions” to your hypotheses.","minutes":1.5,"tier":"core","concept":"failure mechanism before the fix","answerKey":"an observation that separates two hypotheses","commonError":"Students blame the software because an upgrade happened. Ask which log would separate a sensor fault from a software defect, and whether it exists."},{"id":"X07","title":"Fault, error and failure","phase":"LEARN","takeaway":"A fault can create an error; an error can become a visible failure.","bullets":[["Fault","A defect or cause; it may remain dormant."],["Error","An activated fault can create an incorrect internal state."],["Failure","Delivered service deviates from what is required."],["Interruption","Detection, containment or recovery can stop this progression."]],"question":"Explain the difference between a dormant fault, an incorrect internal state and a visible service failure.","answer":"A fault is a defect or cause that may remain dormant. Activation can create an incorrect internal state—an error. A failure occurs when delivered service deviates from what is required. Detection, containment or recovery can interrupt the progression.","sourceRange":"","notes":"Ask one student to say tonight’s incident as a three-part sentence: this fault, activated under these conditions, created this wrong state, which users saw as this failure. Most students write “the system failed because of a software error,” which names two of the terms and explains neither. Correct only the order. If you are behind, say the sentence once and move on.","nodes":[["Fault","Defect or cause"],["Error","Incorrect state"],["Failure","Service deviates"]],"full":"<p>A fault is a defect or cause that may remain dormant. When activated, it can create an incorrect internal state: an error. A failure occurs when delivered service deviates from what is required. Detection, containment or recovery may interrupt this progression, so every fault need not become a visible failure.<\/p>","sourceStart":1,"minutes":1.5,"tier":"optional","concept":"fault, error and failure chain","answerKey":"fault activated, wrong state, visible deviation","commonError":"Students write “the system failed because of a software error”, which names two terms and explains neither. Correct the order: fault, error, failure.","added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"X02A","title":"Avoid, detect and tolerate faults","phase":"LEARN","takeaway":"Dependability spans the whole lifecycle, including operation and recovery.","bullets":[["Prevent + discover","Avoid introducing faults; use verification and validation to find those remaining."],["Tolerate + protect","Continue despite some faults; resist attacks."],["Configure + recover","Fit the operating environment; restore service after failure."]],"question":"Name the six dependability moves, then choose the one that restores service after a failure.","answer":"Prevent, discover, tolerate, protect, configure and recover. Recovery restores service after a failure; tolerance aims to keep it operating while some faults occur.","sourceRange":"12–13","notes":"Teaching focus: Avoid, detect and tolerate faults. This slide is a visual compression of source pp.12–13, not an added framework. Keep the source verbs visible: avoid, discover, tolerate, guard/recognise, configure, recover. The grouping of the two cyberattack bullets under PROTECT is only for classroom readability; both original ideas remain explicit.","nodes":[["Prevent + discover","Reduce faults"],["Tolerate + protect","Limit disruption and attack"],["Configure + recover","Control change and restore"]],"full":"<p>Prevention reduces the faults introduced during development; verification and validation seek those that remain. Fault tolerance keeps service operating despite some faults, while protection resists attacks. Correct configuration fits the real environment. Recovery restores service after failure. Each technique addresses a different part of the lifecycle.<\/p>","sourceStart":12,"minutes":1.5,"tier":"core","concept":"six dependability moves","answerKey":"recovery restores service after failure","commonError":"Students merge tolerance and recovery. Tolerance keeps service going while faults occur; recovery restores service after a failure."},{"id":"X03","title":"Sociotechnical systems and regulation","phase":"LEARN","takeaway":"The software is only one layer of the system.","bullets":[["Seven layers","Equipment → operating system → communications/data → applications → business processes → organization → society."],["Dependencies","Failures and changes cross layer boundaries."],["Limits","Correct software cannot fix every unsafe hand-over or shared dependency."],["Assurance scope","For regulated critical systems, the case supports approval of the sociotechnical system—not software alone."]],"question":"Trace the alarm from equipment through software to people. Why can a correct controller still be part of an undependable service?","answer":"A transmitter reading passes through communications and application software to an operator acting within procedures and organizational oversight. A controller can behave as specified while the sensor, interface, hand-over or procedure undermines the service. Investigate the interacting layers instead of attributing the failure to software alone.","sourceRange":"18–25","notes":"Teaching focus: Sociotechnical systems and regulation. Watch for traces that stop at Application system — exactly the mistake this chapter exists to correct. Push upward: does it reach Business processes, meaning the shift handover, and Society, meaning the regulator’s open file? Two traces aloud, no more.","nodes":[["Equipment","Physical operation"],["Software","Control decisions"],["People","Interpret and act"],["Organization","Rules and oversight"]],"full":"<p>The source stack runs from equipment through operating systems, communications/data and applications to business processes, organizations and society. Failures and changes cross these boundaries. A correct controller cannot compensate for every misleading interface, unsafe hand-over or shared dependency. Regulated critical systems need external approval supported by a safety/dependability case for the sociotechnical system—not only its software.<\/p>","figure":"assets/v3/ch10-layers.svg","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":18,"lens":"Operators who see “likely sensor fault, 0.91” on every alarm may check less. That tendency is automation bias; the resulting failure sits in the process layer, with no software fault.","minutes":1.5,"tier":"core","concept":"layers of the sociotechnical system","answerKey":"a correct controller inside an undependable service","commonError":"Traces stop at the application layer. Push upward: the shift hand-over is a business process and the regulator's file is society.","sourceFigs":[19]},{"id":"CHECK1","title":"Check 1 · recall before revealing","phase":"CHECK","takeaway":"A reachable service that returns the wrong result has failed in reliability, not availability.","bullets":[["Think","Answer from memory before the explanation."],["Pair","Explain a disagreement using the source."],["Record","Add the relevant reasoning to the same card."]],"question":"A service is reachable but returns the wrong result. Which property failed?","answer":"Reliability failed. Availability alone says the service is accessible, not that the result is correct. Safety depends on whether the wrong result can cause harm.","sourceRange":"","notes":"Give 30 seconds of silent thinking before pairs compare. Students who answer “availability” are describing what the user could reach, not what the user received; ask them which property covers a correct result.","nodes":[],"full":"<p>Reliability failed. Availability says only that the service could be reached; reliability is the probability that it delivers correct service, as users expect. Whether safety failed too depends on whether the wrong result can cause harm in this context—a judgment that needs an argument, not only a measurement.<\/p>","sourceStart":1,"minutes":1,"tier":"core","concept":"property that failed","answerKey":"reliability failed; safety depends on harm","commonError":"Students answer “availability” for a reachable service with wrong results. Ask which property is about a correct result.","added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"R08","title":"Redundancy, diversity and common causes","phase":"LEARN","takeaway":"More copies help only against the failures they do not share.","bullets":[["Redundancy / diversity","Extra copies / different solutions—not guaranteed independence."],["Common cause","Shared power, requirements or assumptions can defeat every copy."],["Source comparison","Airbus uses redundancy and diversity; Boeing 777 has no software diversity."],["Trade-off","Diversity adds complexity; the source also describes simplicity with extensive V&V."]],"question":"Without software diversity, what does the Boeing 777 design rely on for dependability?","answer":"Simplicity and extensive verification and validation. The textbook notes that diversity adds complexity and new interactions. Both routes are accepted by regulators. Each needs its own evidence.","sourceRange":"26–31","notes":"Teaching focus: Redundancy, diversity and common causes. Make a student argue the no-diversity position out loud. Most cannot, and that tells them their grasp of outcome 3 is a slogan rather than a capability. This is the antidote to the reflex that redundancy is always an improvement.","nodes":[["Redundancy","Extra capacity"],["Diversity","Different solutions"],["Shared cause","Can defeat both"]],"full":"<p>Redundancy provides extra copies; diversity makes the copies fail differently. Neither establishes independence by itself: shared power, requirements or assumptions can defeat every copy. The source contrasts two certified aircraft: Airbus flight control is redundant and diverse, while the Boeing 777 has no software diversity, and some engineers prefer simplicity plus extensive V&amp;V because diversity adds complexity.<\/p>","figure":"assets/v3/ch10-rd.svg","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":26,"lens":"The detector uses a different algorithm, so it looks diverse. If it reads the same transmitter, it is a second interpretation of one measurement, not a second sensing path.","minutes":2,"tier":"core","commonError":"Students treat two copies as independent by default. Make one student argue the no-diversity position; ask what the copies share.","lists":[{"source":27,"title":"Redundancy and diversity","items":["Redundancy: keep more than one version of critical components, so a backup is available if one fails","Diversity: provide the same function in different ways, so components do not fail in the same way","Independence: redundant and diverse components must not share common-mode failures, for example by using different programming languages"]},{"source":28,"title":"Examples","items":["Redundancy: where availability is critical, companies keep backup servers and switch to them automatically","Diversity: different servers run different operating systems to resist external attacks"]},{"source":30,"title":"Problems with redundancy and diversity","items":["Diversity and redundancy increase system complexity","Complexity raises the chance of error through unanticipated interactions and dependencies","Some engineers prefer simplicity and extensive verification and validation instead","Airbus flight control is redundant and diverse; the Boeing 777 has no software diversity"]}],"transfer":true,"concept":"simplicity versus diversity as dependability strategies","answerKey":"simplicity with extensive V&V"},{"id":"X04","title":"The cost of dependability","phase":"LEARN","takeaway":"Spend on the failures whose consequences justify the extra assurance.","bullets":[["Cost","Higher dependability usually requires more engineering and assurance effort."],["Trade-off","Compare added cost with the consequences of failure."],["Curve limit","Qualitative—not a numerical target or break-even calculation."],["Decision inputs","Explicit service requirements, credible costs and residual risk."]],"question":"What information is missing before choosing a dependability target from this qualitative cost curve?","answer":"Specify the dependability property, service requirement, observation period and operating conditions, then obtain credible costs and failure consequences. The qualitative curve supplies neither a numerical target nor a break-even value. Do not infer a percentage from it.","sourceRange":"14–18","notes":"If a student states a percentage, ask which page it is on—it is on none of them. This is where the class learns the difference between evidence and confidence, and the same discipline applies to the AI detector later. The curve is qualitative: it shows a trend, not a target.","nodes":[["Higher assurance","More effort"],["Residual risk","Still explicit"]],"full":"<p>Higher dependability usually requires more engineering and assurance effort. Compare that added cost with the consequences of failure in the actual service. This qualitative curve supplies neither a numerical target nor a break-even point. A defensible choice needs explicit service requirements, credible costs and the risk that remains.<\/p>","figure":"assets/v3/7b77c34e6cb8ac78.png","caption":"Sommerville Ch.10 · source concept / illustration","sourceStart":14,"minutes":1.5,"tier":"optional","concept":"cost of dependability","answerKey":"property, service requirement, costs and consequences","commonError":"Students read a percentage off the curve. It is on no page; the curve shows a trend, not a target."},{"id":"X05","title":"Dependable processes and evidence","phase":"LEARN","takeaway":"Five distinct attributes—not five names for documentation.","bullets":[],"question":"Choose one process attribute and name an inspectable artifact that would support it in the plant case.","answer":"Choose the auditable row. Request a dated change record for the upgrade. It should link the reviewed requirements, test results, independent reviewer and release decision. The filename, version and owner must let another engineer reconstruct how this release was approved.","sourceRange":"29; 32–39","notes":"Read each attribute as a different requirement on the process. Auditable concerns independent inspection; documentable concerns a defined process model and its records. Diverse requires different V&V activities. Robust concerns recovery when a process activity fails. Standardized concerns a comprehensive set of development standards. A source definition alone is not proof that a project followed it.","nodes":[["Specify","State obligations"],["Review","Find and resolve issues"],["Verify","Record the result"]],"full":"<p>To keep the number of software faults low, a dependable system needs a well-defined, repeatable process: one that does not depend entirely on individual skills and can be enacted by different people. Such a process is <b>explicitly defined<\/b>—a process model drives production, and data collected during the process shows that the team followed it—and <b>repeatable<\/b> across projects and team members. Regulators use information about the process to check that good software engineering practice was followed.<\/p><p>The table lists five attributes of a dependable process: auditable, diverse, documentable, robust and standardized. Typical activities include requirements reviews and requirements management, formal specification, system modeling linked to the requirements, design and program inspections, static analysis, and test planning and management that shows the tests cover the requirements. Validation should not depend on a single approach such as testing: redundant and diverse activities cross-check each other. A definition in the source is not proof that a project followed it; the evidence is the record the process leaves behind.<\/p>","rows":[["Auditable","People outside the process can understand it, check that standards are followed and suggest improvements."],["Diverse","The process includes redundant and diverse verification and validation activities."],["Documentable","A defined process model sets out the activities and the documents each activity produces."],["Robust","The process can recover from failures of individual process activities."],["Standardized","A comprehensive set of development standards covers software production and documentation."]],"heads":["ATTRIBUTE","MEANING"],"fullTable":true,"sourceStart":29,"minutes":2,"tier":"core","concept":"inspectable process evidence","answerKey":"a dated change record another engineer can reconstruct","commonError":"Students treat the five attributes as five names for documentation. Read each row as a different requirement on the process.","lists":[{"source":29,"title":"Process diversity and redundancy","items":["Validation should not depend on a single approach, such as testing","Redundant and diverse process activities matter most for verification and validation","Different activities that complement each other allow cross-checking and avoid process errors"]}]},{"id":"R18","title":"Agile methods in dependable development","phase":"LEARN","takeaway":"Short iterations still need traceable safety and assurance evidence.","bullets":[["Keep iteration","Small changes, frequent feedback and automated checks."],["Keep assurance","Sufficient requirements, traceable evidence and controlled releases."],["Leave a record","What changed, what was verified and which assumptions remain."],["Boundary","Speed alone is not assurance."]],"question":"Name one agile practice you would keep, and the traceable record needed before releasing the change.","answer":"Test-first development or small reviewed changes can remain. Keep the relevant requirements, test results, change record and release decision linked to the same version. A planned rollback needs evidence that it was exercised, not merely described.","sourceRange":"32–39","notes":"Test-first development is the practice that survives certification best, because it produces the evidence as a by-product rather than as extra work. Then turn to the release itself: the incident began with a deployment, yet discussions usually blame the component that broke rather than the change that exposed it. Look for three answers: a change window with a named approver, a rollback that has been exercised and dated rather than only documented, and a staged release that touches one channel before both. “We would have tested more” is not yet an answer; ask which of the three it means.","nodes":[["Small change","Bound the scope"],["Review and test","Inspect the evidence"],["Controlled release","Keep the record"]],"full":"<p>Agile iteration can support dependable development through small changes, frequent feedback and automated checks. Critical systems still need sufficiently complete requirements, traceable evidence and controlled releases. Documentation has a purpose: another reviewer must understand what changed, what was verified and which assumptions remain. Speed alone is not assurance.<\/p>","sourceStart":32,"minutes":1.5,"tier":"optional","concept":"agile practice with traceable evidence","answerKey":"test-first plus a linked release record","commonError":"Students answer “we would have tested more”. Ask which of three they mean: a named approver, an exercised rollback, or a staged release."},{"id":"CHECK2","title":"Check 2 · recall before revealing","phase":"CHECK","takeaway":"A second identical server protects against independent hardware faults, not against the requirements both share.","bullets":[["Think","Answer from memory before the explanation."],["Pair","Explain a disagreement using the source."],["Record","Add the relevant reasoning to the same card."]],"question":"Two identical servers share the same faulty requirements. What does the second server protect against?","answer":"It can protect against some independent hardware failures. It does not remove a common specification or software fault. Identify the shared cause and justify any claimed independence.","sourceRange":"","notes":"Push past “it doubles reliability.” Ask which failures the second server shares with the first—the faulty requirements—and which it does not—independent hardware faults.","nodes":[],"full":"<p>A second identical server protects against some independent failures, such as a hardware fault in one server. It does not protect against a fault that both share: the same faulty requirements produce the same wrong behavior on both servers, a common-cause failure. Diversity—different designs or implementations—can reduce this risk, but only if the diverse versions do not share the same specification error.<\/p>","sourceStart":1,"minutes":1,"tier":"core","concept":"what a second identical server protects against","answerKey":"independent hardware faults only","commonError":"Students say the second server doubles reliability. Ask which failures it shares with the first: the faulty requirements.","added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"X06","title":"Formal methods: four activities","phase":"LEARN","takeaway":"Make obligations precise before claiming that a program meets them.","bullets":[["Method","Use mathematical representation and analysis."],["Benefit","Expose inconsistencies early; fewer faults may reduce testing costs."],["Boundary","Precision still depends on stating the right requirements."]],"question":"Which activity checks the specification before any code exists?","answer":"Specification analysis and proof. It checks properties of the specification before implementation. It cannot show that the requirements captured every real-world need.","sourceRange":"40–44","notes":"Teach the four activities before comparing the two approaches on the next slide. Formal methods are based on mathematical representation and analysis. Keep the source terms: specification analysis and proof, transformational development, and program verification. Do not ask for model checking yet; it is introduced on X06B.","nodes":[],"full":"<p>Formal methods use mathematical representation and analysis. Writing a formal specification can expose inconsistencies and gaps early; the source describes fewer faults and possible reductions in testing costs. Precision still depends on stating the right requirements.<\/p>","rows":[["Formal specification","Express the system’s obligations mathematically."],["Specification analysis and proof","Check properties of the specification before implementation."],["Transformational development","Transform a specification toward an implementation through correct steps."],["Program verification","Prove that a program conforms to its specification."]],"heads":["ACTIVITY","MEANING"],"fullTable":false,"sourceStart":40,"minutes":2,"tier":"core","concept":"formal method activities","answerKey":"specification analysis and proof","commonError":"Students ask for model checking here. Keep the four source activities; model checking comes two slides later.","concept2":"formal method activities","answerKey2":"program verification","question2":"Which activity checks a program against its specification?","answer2":"Program verification. It proves that the program conforms to its specification. Agreement with the specification does not show that every user need was captured.","lists":[{"source":40,"title":"Formal methods include","items":["Formal specification","Specification analysis and proof","Transformational development","Program verification"]},{"source":42,"title":"Use of formal methods","items":["Their principal benefit is fewer faults in systems","Their main area is dependable systems engineering, with several successful projects","They are most likely to pay off where failure costs are high"]}]},{"id":"X06A","title":"Two routes from specification to program","phase":"LEARN","takeaway":"Verify a relationship—or preserve it through each transformation.","bullets":[["Verification-based","Prove that a specification and a program agree."],["Refinement-based","Transform the specification step by step into an implementation."],["Shared limit","Both depend on the specification and the environment assumptions."]],"question":"A team keeps the specification and program separate and proves that they agree. Which approach is this, and how does refinement differ?","answer":"This is verification-based development. Refinement-based development instead builds a chain of correct transformations toward implementation. Both depend on the specification and assumptions; agreement with a specification does not show that every user need was captured.","sourceRange":"41; 45","notes":"Contrast proving a relationship between two representations with constructing a chain of justified transformations. These are the two source approaches, not alternatives to checking requirements with the problem owner.","nodes":[],"full":"<p>The source describes two formal approaches. In <b>verification-based<\/b> approaches, different representations of the system—such as a specification and a program that implements it—are proved to be equivalent, which demonstrates the absence of implementation errors relative to that specification. In <b>refinement-based<\/b> approaches, one representation is systematically transformed into a lower-level one—for example, a specification transformed automatically into an implementation—so that, if each transformation is correct, the representations are equivalent. With a method such as B, a formal specification can be transformed into a “correct” program.<\/p><p>Both routes remove inconsistencies between a specification and a program. Neither shows that the specification captured what users actually need. That is why one barrier to adopting formal methods is that problem owners cannot read a formal specification and judge whether it describes their requirements.<\/p>","approaches":[{"label":"VERIFICATION-BASED","title":"Prove that the representations agree","nodes":["Specification","Equivalence proof","Program"],"text":"A specification and an implementing program are separate representations. Prove that the program conforms to the specification."},{"label":"REFINEMENT-BASED","title":"Transform through correct steps","nodes":["Specification","Correct transformations","Lower-level program"],"text":"Systematically transform a representation into a lower-level one. Each correct transformation preserves equivalence."}],"fullTable":true,"extra":"In both routes, the specification and environmental assumptions still need justification.","sourceStart":41,"minutes":1.5,"tier":"optional","concept":"verification versus refinement","answerKey":"verification-based; refinement transforms step by step","commonError":"Students think a proof of agreement checks the requirements. Both routes still depend on the specification and its assumptions.","lists":[{"source":41,"title":"Formal approaches","items":["Verification-based: a specification and a program are proved equivalent, which shows the absence of implementation errors","Refinement-based: a representation is transformed step by step into a lower-level one, so a correct transformation keeps them equivalent"]}]},{"id":"X06B","title":"Model checking—and what a proof does not establish","phase":"LEARN","takeaway":"A model can expose a violating trace; the real plant still needs evidence.","bullets":[["Model checking","Explore reachable states against a stated property, such as avoiding deadlock."],["Counterexample","A trace that violates the property."],["Model boundary","Does not establish sensor accuracy, complete requirements or safe operator behavior."],["Adoption limits","Stakeholder understanding, expertise, cost and scaling (source slide 45)."]],"question":"For the switch-over model, what would a counterexample show?","answer":"A reachable sequence that breaks the stated property. For example, both channels unavailable while the model requires supply. That would challenge the modelled switch-over logic. No model-checking run is claimed in this teaching example.","sourceRange":"43; 45","notes":"Define reachable states and counterexample before posing the task. The plant example is a course application, not a reported experiment. Retain the source’s adoption concerns: stakeholders may not be able to judge a mathematical specification, expertise and scaling are difficult, and costs and benefits are hard to balance. Source review contains the detailed historical discussion.","nodes":[["Model + property","State the claim precisely"],["Reachable states","Explore the possible behavior"],["Counterexample","A trace that violates the property"]],"full":"<p>Model checking explores the model’s reachable states for a stated property, such as avoiding deadlock. A violating trace is a counterexample. A result about the model does not establish sensor accuracy, complete requirements or safe operator behavior. The source also highlights limits in stakeholder understanding, expertise, cost and scaling (slide 45).<\/p>","sourceStart":43,"lens":"Model the detector’s label as an input that may take any value, then check that confirmed high pressure always triggers protection. That establishes a property of the logic around the model, not the model’s accuracy.","minutes":2,"tier":"core","concept":"what a model result establishes","answerKey":"a violating trace in the model","commonError":"Students take a clean model-checking run as proof the plant is safe. Ask what the model assumes about the sensor and the operator.","concept2":"limits of a model","answerKey2":"sensor accuracy needs separate evidence","question2":"Name one real-world assumption that the model cannot establish by itself.","answer2":"Sensor accuracy. The model also cannot establish a complete model of the environment or actual operator behaviour. Each needs separate evidence.","lists":[{"source":43,"title":"Classes of error found by formal methods","items":["Specification and design errors: a formal model reveals requirement gaps, and model checking finds bad states such as deadlock","Inconsistencies between a specification and a program: refinement avoids them and program proving discovers them"]},{"source":45,"title":"Acceptance of formal methods","items":["Problem owners cannot read a formal specification, so they cannot judge whether it is accurate","The costs are easy to assess but the benefits are hard to assess, so managers hesitate","Engineers are unfamiliar with the approach and reluctant to propose it","Formal methods are still hard to scale up to large systems","Formal specification does not fit well with agile methods"]}]},{"id":"APPLY","title":"Apply it · defend one decision with limits","phase":"APPLY","takeaway":"A decision with limits needs evidence, a stated limit and an owner, not another opinion.","bullets":[["Claim","State what can be justified now."],["Evidence","Name a real source or an observation from the case."],["Limit","Identify what is unknown and what would change the decision."]],"question":"Four minutes: state the claim → strongest evidence → missing observation → explain to a partner → revise one sentence. The instructor samples reasoning, not the number of filled boxes.","answer":"One defensible request is an independently verified pressure reading matched to the alarm and switch-over log. It helps separate a real pressure excursion from a sensor fault. Pending that evidence, state a hold or revert decision with its owner and the condition for resuming operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the limit of the claim. Name who must be told: the next shift, the utility and, if drinking water could be affected, the public. The detector may help operators rank alarms. It must not by itself suppress protection. Count it as evidence only with an independent input and plant-specific evidence that its scores mean what they claim.","sourceRange":"","notes":"Ask whether the detector’s label may ever cancel protection, then contrast its fluency with its actual inputs. Optional depth for faster groups is in Full explanation; it is not assessed.","nodes":[["Claim","Specific and bounded"],["Evidence","Inspectable"],["Verdict","Owned and conditional"]],"full":"<h3>Optional depth · engineering the detector<\/h3><p><b>Measure before trusting.<\/b> Evidence comes from this plant, including failover conditions—not the vendor’s benchmark.<\/p><p>This slide is course-added. It applies the chapter’s five objectives to an AI component and introduces five terms that the source does not cover.<\/p><p><b>Calibration.<\/b> A model is calibrated when, among the cases it scores at about 0.9, about 90% turn out to be correct. Many models are not calibrated by default, so a high score can overstate how often the model is right. Calibration must be checked on data from the actual operating context.<\/p><p><b>Distribution shift.<\/b> The data the component meets in operation differs from the data it learned from—for example, alarm patterns during a failover that were rare in training. Performance measured before deployment may not hold after the shift, so inputs need monitoring.<\/p><p><b>Automation bias.<\/b> People tend to over-rely on automated advice, checking less when a system is usually right. It is a process-layer failure: the approval step exists on paper but no longer protects.<\/p><p><b>Abstention.<\/b> Designing the component to decline to label—and hand over to a person—when its input is unfamiliar or its confidence is low, rather than always producing an answer.<\/p><p><b>Safety envelope.<\/b> The deterministic protective logic around the model is specified and, where feasible, verified to hold for every possible model output. The model can improve decisions inside the envelope but cannot move the plant outside it—provided the protective logic sees every command and its own inputs are sound. Verification then establishes a property of the surrounding logic, not the model’s accuracy. No verification run is claimed in this teaching example.<\/p><p class=\"small\">Optional further reading: Sculley et al. (2015), <i>Hidden Technical Debt in Machine Learning Systems<\/i>; Amershi et al. (2019), <i>Software Engineering for Machine Learning: A Case Study<\/i>.<\/p>","sourceStart":1,"skin":"genai","lens":"Include the detector in your decision: may its label ever cancel a protective action? Your decision must hold even if the label is wrong.","minutes":3,"tier":"core","concept":"decision with evidence, limit and owner","answerKey":"hold or revert pending the verified reading, with an owner","commonError":"Students fill every box with an opinion. Sample the reasoning: which fact is given, which evidence is requested, and who owns the decision.","added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"CHALLENGE","title":"iSCARB checkpoint: revise, verify, own","phase":"CHECK","takeaway":"Agreement is not independence.","bullets":[["Think","Both readings and the AI detector depend on one transmitter."],["Pair","Three agreeing sources, one measurement: explain what changes."],["Record","Limit the claim, request an independently verified reading and name who accepts the revised scope."]],"question":"Revise one sentence, explain the change to a partner, and keep your response. This is required classroom practice, not a new graded submission.","answer":"The two readings share one cause, so agreement cannot establish independence. A defensible revision withholds an unqualified approval. It requests an independently verified pressure reading matched to the logs. Name the observation that could change that decision and a human reviewer. When AI is used, its draft is not completed verification evidence. The detector's 0.91 adds no independent evidence either: it reads the same transmitter. Remove it from the evidence for this claim, or give it an independent input, and say so in the revision. Other decisions with limits can be defensible if their assumptions are explicit. Saying plainly what changed in your reasoning is part of the answer, not a weakness in it.","sourceRange":"","notes":"Use this short checkpoint to practise revising a decision without adding a new task. It applies the shared-transmitter case. Do not add a grade or a deadline; the assignment instructions in the LMS remain the authority.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The new information is that both readings, and the AI detector’s score, come from one transmitter. Three sources that agree are still only one measurement, so their agreement is not independent evidence. A defensible revision narrows the claim, requests an independently verified reading matched to the logs, names the observation that would change the decision, and names who accepts the revised scope.<\/p>","sourceStart":1,"aiTag":true,"minutes":1,"tier":"core","concept":"revising under new evidence","answerKey":"agreement from one transmitter is not independence","commonError":"Students keep their first answer and add the detector as a third vote. Ask what all three readings share: one transmitter.","twist":true,"added":true,"sourceLabel":"Course addition · not from the textbook · applies the chapter to the case"},{"id":"END","title":"Dependable Systems","phase":"CHECK","takeaway":"","bullets":[],"question":"","answer":"","sourceRange":"","notes":"Finish with self-check, required source review and the after-class assignment.","nodes":[],"full":"<p><\/p>","sourceStart":1,"minutes":2,"tier":"core"}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. Which evidence separates a real pressure excursion from a sensing fault, and does the AI label count?","pair":"Name one assumption and one given fact you need to support your answer.","write":"Write your claim and its evidence. Mark any test you only propose as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given facts. Ask which missing fact would change your claim. Decide whether the AI detector's label is an observation or an inference.","answer":"An answer with limits separates the given facts from the needed evidence. A source explanation supports a mechanism. It does not prove the fictional plant passed a test. The detector's label is an inference, not an observation. Until you know its inputs and its validated performance on this plant, record it as a hypothesis, not as evidence.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same card; nobody is marked on field length or a timer.","ai":["think"],"minutes":3,"tier":"core","concept":"evidence versus inference","answerKey":"the detector's label is a hypothesis, not evidence","rubric":{"criteria":[{"name":"Names the mechanism","levels":[[2,"Strong","Names the chapter mechanism that decides the case and says how it applies."],[1,"Partial","Names a mechanism but does not connect it to the case facts."],[0,"Missing","No chapter mechanism, or the wrong one."]]},{"name":"Uses only the given facts","levels":[[2,"Strong","Every statement rests on a given fact or is marked as an assumption."],[1,"Partial","Mostly given facts, but one invented or unmarked assumption."],[0,"Missing","Relies on facts the case does not give."]]},{"name":"Evidence another person can check","levels":[[2,"Strong","Names evidence a second engineer could inspect, and marks proposed tests as proposed."],[1,"Partial","Names evidence, but it is vague or its status is unclear."],[0,"Missing","Opinion or confidence instead of evidence."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"Claim: we cannot yet tell a real excursion from a sensor fault. Evidence: the alarm log and the switch-over log are given; an independently verified pressure reading is proposed. The AI label is a hypothesis until its inputs are known.","why":"Names the mechanism (failure cause), keeps to the given facts and proposes a checkable observation."},"weak":{"text":"It is a sensor fault because the AI said 0.91 and the software was just upgraded.","why":"Treats an inference as evidence; the upgrade is a hypothesis presented as a fact."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms: a physically separate second transmitter, or the AI detector as a diverse check. Which one would you choose?","pair":"Ask your partner to argue for the mechanism you rejected. Name one trade-off and one thing both mechanisms share.","write":"Write why your mechanism supports your claim, and what you are still unsure of.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism affects your claim. Then name a shared cause, a mismatch or a limit outside its evidence.","answer":"Tie the chosen mechanism to the required property. Say what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. The detector is diverse in algorithm but may not be diverse in input. A second, independently powered transmitter is diverse in sensing. It costs installation and validation.","no":2,"at":"CHECK2","seconds":180,"ai":["think"],"minutes":3.5,"tier":"core","concept":"diversity in input, not only algorithm","answerKey":"a second transmitter is diverse in sensing; the detector may not be","rubric":{"criteria":[{"name":"Links the mechanism to the property","levels":[[2,"Strong","Explains how the chosen mechanism affects the property at stake."],[1,"Partial","Names the mechanism without the link to the property."],[0,"Missing","No mechanism, or no property."]]},{"name":"Names a shared cause or limit","levels":[[2,"Strong","Names a specific shared cause, mismatch or limit that could defeat the mechanism."],[1,"Partial","Mentions a limit in general terms only."],[0,"Missing","Treats the mechanism as always enough."]]},{"name":"States the trade-off","levels":[[2,"Strong","Says what the alternative improves and what it costs."],[1,"Partial","Gives one side of the trade-off only."],[0,"Missing","No comparison with the alternative."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"A second, independently powered transmitter, because reliability of the reading needs a different sensing path. Its limit: it still needs calibration and validation. The detector is cheaper but may read the same input.","why":"Links the mechanism to the property, names the shared-input limit and states the cost."},"weak":{"text":"Use the AI detector: it is a different algorithm, so it is diverse.","why":"Confuses algorithm diversity with input diversity; no limit and no trade-off."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":true},{"title":"Change the constraint; revise and own","think":"Two nominally separate readings use the same transmitter and power supply. The vendor's notes show the AI detector scores the signal from that same transmitter. Does your first decision still hold?","pair":"Explain what changes in your claim, your evidence or its scope.","write":"Record the new evidence and your revised decision with its limits. Say plainly what your first card got wrong. Name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your first answer. Name the changed assumption, the next evidence and the condition that would change your decision.","answer":"The new fact changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The AI detector's agreement is a third reading of the same transmitter. It cannot be counted as independent confirmation.","note":"Classroom version only. The assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"CHALLENGE","seconds":180,"ai":["think"],"minutes":3,"tier":"core","concept":"revising after the twist","answerKey":"three readings of one transmitter count as one","rubric":{"criteria":[{"name":"Says what the new fact changes","levels":[[2,"Strong","Names the assumption the new fact breaks and what it leaves intact."],[1,"Partial","Notes the new fact without saying which assumption it breaks."],[0,"Missing","Ignores or restates the new fact."]]},{"name":"Revises with a reason","levels":[[2,"Strong","Keeps, changes or replaces the decision for a reason from the new fact. Says what the first answer got wrong."],[1,"Partial","Changes the decision without a clear reason, or hides the first answer."],[0,"Missing","Repeats the first answer unchanged."]]},{"name":"Names the owner and who is told","levels":[[2,"Strong","Names the role that decides and the people who must be informed."],[1,"Partial","Names one of the two."],[0,"Missing","Names neither the owner nor who is told."]]}],"marks":"2 marks per criterion, 6 in total. Not graded in class. The same reasoning earns the assignment points.","strong":{"text":"My first card counted the two readings as independent; they share one transmitter and one power supply. Revise: hold the release and request a reading from a separate instrument. The plant manager decides; the next shift and the utility are told.","why":"Names the broken assumption, revises with a reason, admits the first error, names owner and audience."},"weak":{"text":"Keep my answer: three sources agree, so it is a sensor fault.","why":"Ignores the shared transmitter; names nobody."},"other":"Other answers are accepted when they use a chapter mechanism and rest on the given facts. They must also name evidence someone else can check. A different decision with those three is as strong as the model answer."},"transfer":false}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["R08"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["R08","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["CHALLENGE"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Redundancy, diversity and shared causes","range":"26–31"},{"title":"Formal methods and their scope","range":"40–43"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["START","MAP"]},{"title":"Dependability and failure","start":3,"end":6,"units":["X01","X02","X07"]},{"title":"Dependability properties","start":7,"end":13,"units":["X01","X02A"]},{"title":"Cost and criticality","start":14,"end":18,"units":["X04"]},{"title":"Sociotechnical systems and regulation","start":19,"end":25,"units":["X03"]},{"title":"Redundancy and diversity","start":26,"end":31,"units":["R08"]},{"title":"Dependable processes","start":32,"end":39,"units":["X05","R18"]},{"title":"Formal methods","start":40,"end":47,"units":["X06","X06A","X06B"]}],"sourceCount":47,"original":"sources/Ch10-Original.pdf","textbook":null,"bookPages":0,"quiz":[{"q":"Which dependability property does Sommerville define as a judgment rather than a probability?","options":["Availability","Reliability","Safety"],"answer":2,"why":"Availability and reliability are defined as probabilities that can be measured. Safety, security and resilience are judgments that must be argued from evidence.","concept":"probability versus judgment properties","answerKey":"safety is a judgment","beyondCase":true},{"q":"An operator follows a misleading interface instruction and causes an outage. What should be investigated?","options":["Only the operator’s training, because the instruction was followed","People, interface, procedures and technology","Only the interface, because the software displayed the instruction"],"answer":1,"why":"A sociotechnical account follows interacting technical and organizational causes.","concept":"sociotechnical investigation","answerKey":"people, interface, procedures and technology"},{"q":"Two replicas run the same defective algorithm. What is the main limitation?","options":["The second replica necessarily reduces availability","Agreement between replicas demonstrates algorithm correctness","A common software fault can affect both"],"answer":2,"why":"Redundancy does not establish independence or remove a shared software fault.","concept":"common software fault in replicas","answerKey":"a shared fault affects both"},{"q":"Which is inspectable process evidence?","options":["A versioned review record with findings and closure","An unsigned assurance summary that does not identify the version","A dashboard reporting “all checks passed” without the underlying record"],"answer":0,"why":"Evidence should allow another person to inspect what was reviewed and resolved.","concept":"inspectable process evidence","answerKey":"a versioned review record","beyondCase":true},{"q":"What does formal verification establish within its assumptions?","options":["That all hazards are absent","That the model conforms to a specified property","That every environmental assumption is correct"],"answer":1,"why":"Specification and model assumptions still require justification.","concept":"scope of formal verification","answerKey":"conformance of the model to a property","beyondCase":true}],"alignment":[{"objective":"Distinguish the five properties using one example.","evidence":"Explain and demonstrate: Distinguish the five properties using one example.","field":"FIT + source application"},{"objective":"Trace one failure through people, process and technology.","evidence":"Explain and demonstrate: Trace one failure through people, process and technology.","field":"FIT + transfer question"},{"objective":"Explain redundancy, diversity and common-cause failure.","evidence":"Explain and demonstrate: Explain redundancy, diversity and common-cause failure.","field":"BOUND + source application"},{"objective":"Identify evidence from a dependable process.","evidence":"Explain and demonstrate: Identify evidence from a dependable process.","field":"ACT + EVIDENCE"},{"objective":"Explain what formal verification assumes and what it cannot establish.","evidence":"Explain and demonstrate: Explain what formal verification assumes and what it cannot establish.","field":"REFIT + EVIDENCE"}],"artifact":"Build a dependability decision with a source concept, a common-cause challenge and a bounded assurance argument.","bridge":"Build a dependability decision with a source concept, a common-cause challenge and a bounded assurance argument. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"R08","workload":"Consider alarm burden, handover and the authority needed for a bounded operating decision.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ"},"roadmap":{"question":"When is trust in a system justified?","connection":"Properties define the promise; failure mechanisms guide controls; process evidence and formal methods bound the claim.","inClass":"Distinguish properties; trace failure; justify a control.","deliverable":"A dependability claim with evidence and limits.","success":"Explain why the evidence supports this particular claim.","branches":[{"verb":"Define the promise","label":"Dependability properties","detail":"Five properties · cost and criticality","target":"X01","units":["X01","X04"],"caseLens":"Which dependability property is threatened by the recurring alarms and failover?"},{"verb":"Explain what can go wrong","label":"Failure in context","detail":"Fault → error → failure · people and process","target":"X07","units":["X02","X07","X03","CHECK1"],"caseLens":"Is the signal a real pressure event, an internal error, or a visible service failure?"},{"verb":"Limit failure","label":"Protection mechanisms","detail":"Avoid / detect / tolerate · redundancy and diversity","target":"X02A","units":["X02A","R08"],"caseLens":"Would redundancy and diversity really separate the sensing paths?"},{"verb":"Build inspectable evidence","label":"Dependable processes","detail":"Process properties · accountable development","target":"X05","units":["X05","R18","CHECK2"],"caseLens":"What process evidence would justify continuing the plant?"},{"verb":"State what is proved","label":"Formal methods","detail":"Verification / refinement · model assumptions","target":"X06","units":["X06","X06A","X06B","APPLY","CHALLENGE"],"caseLens":"What can a model prove—and what still needs real sensor and operational evidence?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"Tonight an AI says “sensor fault, 0.91.” Would you bet a city’s water on it?","aiAssignment":{"title":"The dose checker that agrees with itself","scenario":"A hospital adds an AI dose-check assistant to its medication cabinets. Before a nurse dispenses a drug, the assistant flags doses it predicts are unusual. The pharmacy's rule engine also checks each dose against the drug library. Management wants to report that dispensing is now “highly dependable”.","facts":["Pilot: three months on two wards; no harmful dose reached a patient.","Nurses overrode 41% of AI flags, most marked “known false alarm”.","The AI assistant and the rule engine both passed the vendor’s acceptance tests."],"question":"Which dependability claim, if any, can the hospital make—and what evidence would support it?","stress":"An audit finds that the AI assistant and the rule engine both read the same drug-library file. That file lists one high-risk drug in the wrong unit. Both checks agreed that a tenfold overdose was normal.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition, something you would see, that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage).","rubric":{"criteria":[{"name":"FIT","levels":[[1,"Strong","Names the chapter concept that decides the case and shows why it fits these facts."],[0.75,"Adequate","Names the right concept, with only a partial link to the facts."],[0.5,"Developing","Names a concept but does not connect it to the case."],[0,"Missing","No chapter concept, or the wrong one."]]},{"name":"BOUND","levels":[[1,"Strong","States an observable condition that would end the claim."],[0.75,"Adequate","Names a condition, but nobody could easily observe it."],[0.5,"Developing","Gives a vague limit, such as “if it fails”."],[0,"Missing","Gives no limit."]]},{"name":"ACT + EVIDENCE","levels":[[1,"Strong","One concrete action with an owner, and evidence another engineer could inspect even if the AI is wrong."],[0.75,"Adequate","A concrete action, but the evidence is weak or its status is unclear."],[0.5,"Developing","General advice, or evidence that relies on the AI's own output."],[0,"Missing","No action and no evidence."]]},{"name":"REFIT","levels":[[1,"Strong","Uses the new information, names the assumption it broke and justifies retain, revise or replace."],[0.75,"Adequate","Uses the new information but does not name the broken assumption."],[0.5,"Developing","Keeps or changes the answer without a reason."],[0,"Missing","Ignores the new information."]]},{"name":"OWNER + AI USE","levels":[[1,"Strong","Names the role that accepts the risk and who must be told. Declares any AI help and how it was checked."],[0.75,"Adequate","Names a role, but not who must be told, or the AI declaration is incomplete."],[0.5,"Developing","Names “the team” or “the system” as owner."],[0,"Missing","No owner and no AI declaration."]]}],"marks":"5 points · 1 per criterion","strong":{"text":"Claim: dispensing is not shown to be highly dependable. Both checks read the same drug library, so they are not independent. The claim ends if a library error reaches a dispensed dose. Action: the pharmacy lead adds a second, separately maintained unit check. Evidence: a test log with a planted wrong-unit entry, proposed. After the audit I revise: the two checks share one cause.","why":"Names common cause and independence, gives an observable limit, an owner and checkable evidence, and revises with a reason."},"weak":{"text":"The system is dependable because no patient was harmed in three months and both checks passed the vendor tests.","why":"Treats absence of harm and vendor tests as proof; no limit, no owner, ignores the shared library."},"other":"they use a chapter concept, rest on the given facts and name evidence someone else can check. A different verdict that meets these conditions earns the same marks as the strong example."}},"cs2023":[["SE-Reliability","Software Reliability","Dependent vs independent failure domains; redundancy and fault tolerance—the chapter’s common-cause lesson."],["SE-FormalMethods","Formal Methods","Model checking and what a proof does and does not establish."],["SE-Validation","Software Verification and Validation","Domain-specific V&V challenges, including safety-critical systems."],["SEP","Society, Ethics, and the Profession","Named human ownership of residual risk; disclosure of AI assistance."]],"lectureMinutes":50,"budgetShare":0.85,"timeRule":"If the lecture runs over time, drop optional slides first, in reverse order, then the optional extras. Never drop a think point (checkpoint, station or Your call) and never drop the assumption-change slide. Station and vote minutes are separate from slide minutes: a checkpoint slide keeps 1 minute to show its question, and its station adds 3 minutes. Say which optional slide was dropped and point students to its full explanation.","glossary":[{"term":"claim","short":"a statement you say is true and can defend with evidence","ar":"ادعاء"},{"term":"dependability","short":"the user's degree of trust that the system will do what they expect","ar":"الاعتمادية"},{"term":"availability","short":"the probability that the system is up and can deliver useful service","ar":"التوافر"},{"term":"reliability","short":"the probability that the system delivers correct service","ar":"الموثوقية"},{"term":"safety","short":"a judgment of how likely the system is to cause harm","ar":"السلامة"},{"term":"security","short":"a judgment of how well the system resists intrusion","ar":"الأمن"},{"term":"resilience","short":"a judgment of how well critical services continue during disruption","ar":"المرونة"},{"term":"fault","short":"a defect or cause that may stay dormant","ar":"عيب"},{"term":"error","short":"an incorrect internal state created by an activated fault","ar":"خطأ"},{"term":"failure","short":"delivered service that deviates from what is required","ar":"فشل"},{"term":"redundancy","short":"extra copies or capacity so that a backup exists if one part fails","ar":"التكرار"},{"term":"diversity","short":"the same function provided in different ways so copies do not fail the same way","ar":"التنوع"},{"term":"common cause","short":"one shared cause that can make every copy fail together","ar":"سبب مشترك"},{"term":"sociotechnical system","short":"equipment, software, people, procedures and organisation working together","ar":"نظام اجتماعي تقني"},{"term":"formal methods","short":"development approaches based on mathematical representation and analysis","ar":"الطرق الصورية"},{"term":"model checking","short":"a tool that explores every reachable state of a model against a stated property","ar":"فحص النماذج"},{"term":"counterexample","short":"a trace of the model that breaks the stated property","ar":"مثال مضاد"}],"transfer":{"title":"Transfer case · the textbook's two flight-control architectures","text":"The textbook contrasts two certified aircraft. Airbus flight control uses redundant and diverse software. The Boeing 777 flight control has no software diversity. Both aircraft are certified as safe. This is a different system from the desalination plant.","source":"Source slide 30 (problems with redundancy and diversity)","fictional":false,"question":"Without software diversity, what does the Boeing 777 design rely on for dependability?","answer":"Simplicity and extensive verification and validation. The textbook notes that diversity adds complexity and new interactions. Both routes are accepted by regulators. Each needs its own evidence.","concept":"simplicity versus diversity as dependability strategies","answerKey":"simplicity with extensive V&V","at":"R08"},"studyList":[{"topic":"Why dependability matters and what failure costs","sources":[3,4,14,16],"note":"Be able to explain the four reasons failures matter and why higher dependability costs rise steeply."},{"topic":"The five principal properties and the other properties","sources":[8,9,10,11],"note":"Which are probabilities and which are judgments; how the properties depend on each other."},{"topic":"Causes of failure and the six ways to achieve dependability","sources":[5,12,13],"note":"Hardware, software and operational causes; avoid, detect, tolerate, protect, configure, recover."},{"topic":"The sociotechnical stack, regulation and compliance","sources":[18,20,21,22,23,24,25],"note":"Name the seven layers and explain why certification covers the whole system, not only the software."},{"topic":"Redundancy, diversity and their problems","sources":[27,28,29,30],"note":"Required reading. Define both terms, give one example each and state why complexity can cancel the benefit."},{"topic":"Dependable processes: attributes, activities and agility","sources":[32,33,34,35,36,37,38],"note":"The five attributes and the process activities; what agile methods must keep for critical systems."},{"topic":"Formal methods: activities, approaches, classes of error and acceptance","sources":[40,41,42,43,44,45],"note":"Required reading for 40–43. Know the four activities, the two approaches and the five reasons for limited adoption."}],"activities":[{"id":"VOTE2","label":"Class vote · Act 2","at":"CHECK1","minutes":3,"tier":"core"},{"id":"VOTE4","label":"Class vote · Act 4","at":"CHECK2","minutes":3,"tier":"core"}],"coverage":[{"cls":"no","reason":"Title slide of the source pack","n":1,"title":"Chapter pendable process activities"},{"cls":"full","unit":"X05","n":36,"title":"Dependable process activities"},{"cls":"full","unit":"X05","n":37,"title":"Dependable processes and agility"},{"cls":"full","unit":"X05","n":38,"title":"Dependable processes and agility"},{"cls":"slide","unit":"R18","n":39,"title":"Formal methods and dependability"},{"cls":"slide","unit":"X06","kind":"list","items":["Formal specification","Specification analysis and proof","Transformational development","Program verification"],"n":40,"title":"Formal specification"},{"cls":"slide","unit":"X06A","kind":"list","items":["Verification-based approaches: representations are proved equivalent","Refinement-based approaches: a representation is systematically transformed into a lower-level one"],"n":41,"title":"Formal approaches"},{"cls":"slide","reason":"TODO","kind":"prose","items":[" The principal benefits of formal methods are in reducing","the number of faults in systems."," Consequently, their main area of applicability is in","dependable systems engineering. There have been","several successful projects where formal methods have","been used in this area."," In this area, the use of formal methods is most likely to","be cost-effective because high system failure costs must","be avoided."],"unit":"X06","n":42,"title":"Use of formal methods"},{"cls":"slide","reason":"TODO","kind":"list","items":["Specification and design errors and omissions","Inconsistencies between a specification and a program"],"unit":"X06B","n":43,"title":"Classes of error"},{"cls":"slide","unit":"X06","n":44,"title":"Benefits of formal specification"},{"cls":"slide","reason":"TODO","unit":"X06B","n":45,"title":"Acceptance of formal methods"},{"cls":"no","reason":"Summary slide; its points are taught on the slides above","n":46,"title":"Key points"},{"cls":"no","reason":"Summary slide; its points are taught on the slides above","n":47,"title":"Key points"}]}</script><script src="runtime/source-figures.js?v=20261004-andor"></s
