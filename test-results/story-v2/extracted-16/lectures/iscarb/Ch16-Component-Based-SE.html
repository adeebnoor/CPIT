</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261005-lab2"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 16</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch16-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":16,"title":"Component-Based Software Engineering","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch16-Component-Based-SE.html","assignment":7,"points":5,"objectives":["Describe component characteristics and interfaces.","Compare development for and with reuse.","Choose sequential, hierarchical or additive composition.","Diagnose interface incompatibility and specify an adapter.","Read an OCL precondition/postcondition and design a test."],"sections":["16.1 Components and component models","16.2 CBSE processes","16.3 Component composition"],"case":{"headline":"The interfaces match. Their meanings may not.","text":"A fictional data component returns a numeric temperature but its unit is undocumented. A consumer interprets it as Celsius. Normal values appear plausible, but no contract or boundary test establishes the conversion.","question":"Which assumption must be explicit before composition?","mutation":"The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning. The AI forecasting component, trained on Celsius readings, accepts the Fahrenheit values without error and returns confident but wrong forecasts.","lens":"Downstream, the consumer feeds the readings into a vendor’s AI forecasting component. Its documentation says “temperature” without a unit; it was trained on Celsius data. Hold that question: after the contract slides, one slide asks you to write the contract for it."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Component-Based Software Engineering","phase":"START","takeaway":"Component-Based Software Engineering","full":"<p>Component-Based Software Engineering<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"Components are units of composition","fig":null,"sourceRange":"3–10","bullets":[["Independent unit","A component can be deployed and composed through its interfaces."],["Hidden implementation","Clients need its contract, not its internal code."],["Standards and support","Component models and middleware enable integration."],["Process","Requirements may evolve around available reusable components."]],"question":"Why is every object class not automatically a reusable component?","answer":"A class is usually bound into one program at compile time, and using it needs knowledge of its code. A component is independently deployable, language-independent, conforms to a component model and exposes its dependencies through its interfaces.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A component is deployed independently and used only through the interfaces it publishes.","full":"<p>Component-based software engineering (CBSE) emerged in the late 1990s because object-oriented development had not delivered the reuse it promised. Single object classes were too detailed and specific, were often bound into an application at compile time, and needed detailed knowledge of their code. Components are higher-level abstractions, defined by their interfaces, with all implementation details hidden. The essentials of CBSE are <b>independent components<\/b> completely specified by their interfaces, <b>component standards<\/b> embodied in a component model, <b>middleware<\/b> that supports integration, and a <b>development process<\/b> that lets requirements evolve around the components available.<\/p><p>Two definitions frame the idea. Councill and Heineman: a component is “a software element that conforms to a standard component model and can be independently deployed and composed without modification according to a composition standard.” Szyperski: “a unit of composition with contractually-specified interfaces and explicit context dependencies only,” deployable independently and composed by third parties. Unlike object classes, components are independently deployable, do not define types, are language-independent and follow a component model. Competing standards—EJB, COM and .NET, CORBA’s CCM—limited the impact of CBSE, and services, covered in Chapter 18, are gradually replacing embedded components.<\/p>","sourceStart":3,"notes":"Ask why object classes did not deliver reuse; push for compile-time binding and the need to know the code. Then connect Szyperski’s “explicit context dependencies only” to the undocumented temperature unit in our case."},{"id":"X02A","title":"Five characteristics of reusable components","fig":null,"sourceRange":"11–17","bullets":[["Public boundary","All external interactions use defined interfaces."],["Explicit context","State required services instead of depending on hidden neighbors."],["Reuse evidence","Documentation and standards help another team assess the component."]],"question":"Can “independent” mean that a component needs no external service?","answer":"No. Dependencies may exist, but they must be explicitly specified so another implementation can provide the required service.","rows":[["Composable","Interactions use public interfaces and available metadata."],["Deployable","A self-contained executable unit for its component platform."],["Documented","Specify interface syntax and, ideally, semantics."],["Independent","External requirements are explicit, not hidden dependencies."],["Standardized","Conforms to the chosen component model."]],"heads":null,"extra":"","phase":"LEARN","takeaway":"A reusable component is composable, deployable, documented, independent and standardized.","full":"<p>Sommerville combines the two definitions into five characteristics. A component is <b>composable<\/b> when all external interactions take place through public interfaces and it gives access to information about itself, such as its methods and attributes. It is <b>deployable<\/b> when it is self-contained and can run as a stand-alone entity on a component platform—usually as a binary that does not need compiling first. It is <b>documented<\/b> when potential users can decide whether it meets their needs: the syntax and, ideally, the semantics of every interface are specified. It is <b>independent<\/b> when it can be composed and deployed without other specific components; any services it needs are set out in a “requires” interface. It is <b>standardized<\/b> when it conforms to a component model, which may define interfaces, metadata, documentation, composition and deployment.<\/p><p>Thinking of a component as a service provider highlights two points: you can use it without knowing its source code, and its internal state is never exposed, because every interaction goes through parameterized operations in its interface. In our case, “documented” is the characteristic that failed: the syntax of the temperature value was specified, but its meaning was not.<\/p>","sourceStart":11,"notes":"Ask pairs which of the five characteristics the temperature component fails. “Documented” is the best answer: syntax without semantics. Independence is a trap—a component may have dependencies as long as they are explicit."},{"id":"X03","title":"Provides and requires are two sides of a contract","fig":"ch16_interfaces","sourceRange":"11–17","bullets":[["Provides","Services the component offers to others."],["Requires","Services it needs from its environment."],["Compatibility","A provider must meet the consumer’s required contract."],["Encapsulation","Internal state and implementation remain hidden."]],"question":"Why is matching an operation name insufficient for composition?","answer":"Parameter types, units, preconditions, postconditions, error behavior and timing assumptions may still differ.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6a4a7ae477bad9fa.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"The provides interface is the component’s API; the requires interface names what it needs to run.","full":"<p>Every component has two related interfaces. The <b>provides<\/b> interface defines the services the component offers: it is the component’s API, the methods a user can call. In a UML component diagram it is a circle at the end of a line from the component. The <b>requires<\/b> interface specifies the services that other components must supply for this one to operate correctly; if they are not available, the component will not work. It is drawn as a semicircle, and the two symbols fit together like a ball and socket. A requires interface does not compromise independence, because it states which service is needed, not how it is provided.<\/p><p>The chapter’s data collector component shows both. Its provides interface includes addSensor, removeSensor, startSensor, stopSensor, testSensor, initialize, report and listAll. Its requires interface—sensorManagement and sensorData—is deliberately generic: sensor-specific commands travel as a string parameter, so adaptors can connect the collector to different types of sensor. Matching names and types still leaves the semantics—units, ranges, pre- and postconditions, errors—to be established.<\/p>","sourceStart":11,"notes":"Draw the ball and socket for the temperature provider and the forecaster. Ask what the socket must state that a numeric type cannot: the unit and the valid range. Keep the data collector in view; it returns on the adaptor slide."},{"id":"X04","title":"A component model defines integration standards","fig":"ch16_modelelements","sourceRange":"18–22","bullets":[["Interfaces","Specify operations, parameters, exceptions and definition language."],["Usage","Define naming, metadata access and configuration."],["Deployment","Define packaging, documentation and evolution rules."],["Historical examples","EJB, .NET and web-service models are the source’s examples."]],"question":"What must be known before deploying a binary component?","answer":"The supported model/platform, provided and required interfaces, configuration, packaged dependencies and relevant version/evolution rules.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/acd2fa717aea514a.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"A component model sets standards for interfaces, usage information and deployment.","full":"<p>A component model is a definition of standards for component implementation, documentation and deployment. It serves component developers, who need their components to interoperate, and the providers of the middleware that runs them. Weinreich and Sametinger’s basic elements fall into three groups:<\/p><ul><li><b>Interfaces<\/b>—how interfaces are defined and what they contain: operation names, parameters and exceptions, the interface definition language, and any specific interfaces every component must implement.<\/li><li><b>Usage information<\/b>—a globally unique name or handle (in EJB, a hierarchical name rooted in an Internet domain name; for services, a URI), access to meta-data about the component’s interfaces and attributes, and a way to customize the component for a particular deployment.<\/li><li><b>Deployment and use<\/b>—how to package the component with all supporting software not provided by the infrastructure or named in a requires interface, rules for when and how components may be replaced, and the documentation to be produced.<\/li><\/ul><p>For service components, the most important model is the web-service model; for embedded components, the chapter names EJB and Microsoft’s .NET. A model standardizes the form of an interface; it does not by itself say what a value means.<\/p>","sourceStart":18,"notes":"Ask which element of a component model could carry the temperature unit. Interface definitions and documentation can—but only if someone writes it down. The model standardizes form, not meaning."},{"id":"MIDDLEWARE","title":"Middleware supplies shared component services","fig":"ch16_middleware","sourceRange":"18–22","bullets":[["Platform services","Addressing, communication, interface and exception support."],["Support services","Examples include security, transactions, concurrency and persistence."],["Container","Mediates access and exposes the model’s services."],["Trade-off","A simple component may not need every service in a large container."]],"question":"Why should transaction handling not be reimplemented independently in every component?","answer":"A consistent shared implementation can reduce duplicated effort and incompatibilities. Its behavior and integration constraints still need verification.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/655ca33c2c431092.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Middleware gives components shared platform and support services through a container.","full":"<p>A component model implementation provides middleware services, much as an operating system provides generic services to applications. <b>Platform services<\/b> let components communicate and interoperate in a distributed environment: addressing, interface definition, exception management and component communications. They must be available in every component-based system. <b>Support services<\/b> are common services that many components need: component management, transaction management, resource management, concurrency, persistence and security. Providing them once reduces development cost and avoids incompatibilities between components.<\/p><p>To use these services, a component is deployed in a <b>container<\/b>: an implementation of the support services plus the interfaces a component must provide to integrate with it. Other components then reach the component through the container, not directly. Containers are large and complex, and a simple component may not need all of their facilities. Web services take a different approach: common services are standardized and implemented as libraries, so a service uses only what it needs. Object-oriented frameworks such as Spring provide comparable services that are often more efficient.<\/p>","sourceStart":18,"notes":"Ask why authentication belongs in a shared support service rather than in every component. Then ask what a shared service cannot fix: the meaning of the data that components exchange."},{"id":"CHECK1","title":"Checkpoint · state the component obligation","fig":null,"sourceRange":"3–22","bullets":[["Think","A data component returns a numeric temperature with no unit."],["Pair","Identify which facts a client must know beyond its type."],["Record","Write the contract claim and its evidence requirement."]],"question":"Which missing detail can make two numeric parameters incompatible?","answer":"Their units, allowed range or meaning. Matching a numeric type does not establish semantic compatibility.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"A numeric type is only syntax; the contract must state the unit, range and meaning.","full":"<p>The interface tells a client that the component returns a number. The client also needs its <b>unit<\/b> (Celsius or Fahrenheit), its <b>valid range<\/b>, its <b>precision<\/b> and what happens when a reading is missing or invalid. Sommerville describes this as the gap between syntactic and semantic compatibility: the interface definition gives operation names and parameter types, but you depend on documentation to decide whether interfaces are semantically compatible. A good contract claim names the unit and the range. Its evidence requirement is a boundary test that would fail under the wrong assumption—for example, a reading of 95 is plausible in Fahrenheit but impossible as an air temperature in Celsius.<\/p>","sourceStart":3,"notes":"Give 90 seconds alone, then pairs. Collect claims that name a unit and a range. Push for an evidence requirement that could actually fail, such as the reading of 95."},{"id":"X05","title":"Development for reuse is not development with reuse","fig":"ch16_cbseprocess","sourceRange":"23–39","bullets":[["For reuse","Generalize, document and validate components for future applications."],["With reuse","Discover, evaluate, adapt and integrate available components."],["Interleave","Available components can change requirements and architecture."],["Support","Acquisition, management and certification serve both processes."]],"question":"Who has to discover candidate components before detailed design is settled?","answer":"The team developing with reuse. The team developing for reuse already knows the component it is generalizing, though it still assesses demand and cost.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/267c35ba26f02115.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Development for reuse builds generic components; development with reuse finds and fits them.","full":"<p>CBSE has two main processes. <b>Development for reuse<\/b> produces components or services that other applications will reuse, usually by generalizing existing components. You know which components you are working with and have their source code. <b>Development with reuse<\/b> builds new applications from existing components and services. You do not know in advance what is available, so you must discover components and design the system to use them well, often without their source code.<\/p><p>Three supporting processes serve both. <b>Component acquisition<\/b> finds components, locally or from an external source. <b>Component management<\/b> catalogues and stores components and makes them available, usually in a repository that also records how they are used. <b>Component certification<\/b> has someone other than the developer check that a component meets its specification; because it is expensive, many companies leave quality checking to the developers. The early vision of a thriving component marketplace was not realized: most reuse happens within organizations committed to it, or through open-source repositories.<\/p>","sourceStart":23,"notes":"Ask which process our forecasting team is in: development with reuse—they did not write the temperature component and may not have its source. Ask who in the organization should certify it."},{"id":"X06","title":"Generalize around stable domain abstractions","fig":null,"sourceRange":"23–33","bullets":[["Stable abstraction","Prefer domain concepts that change slowly and recur."],["Generalization","Remove specific methods; make names, dependencies and errors reusable."],["Documentation","Expose assumptions and supported configurations."],["Cost","Future reuse must justify generalization, validation and maintenance."]],"question":"Why should every application-specific module not be generalized immediately?","answer":"Some have little realistic reuse potential. Generalization and documentation cost time, and overly broad interfaces can increase complexity.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"Generalize a component only when it models a stable abstraction and future reuse repays the cost.","full":"<p>A component written for one application usually has to be generalized before it can be reused. Two questions decide whether to invest. Is the component likely to be reused? It probably is if it implements a <b>stable domain abstraction<\/b>—a fundamental element of the domain that changes slowly, sometimes called a business object: accounts and statements in banking; patients, treatments and nurses in a hospital. Will future savings justify the costs of documentation, validation and generalization?<\/p><p>Typical changes for reusability are: removing application-specific methods, making names more general, adding methods for more complete coverage, making exception handling consistent, adding a configuration interface, and integrating required components to increase independence. Exceptions are a hard case. A component should publish the exceptions it can raise, but publishing all of them bloats the interface, so a pragmatic approach handles common technical exceptions locally, documents them, and passes business-related exceptions to the caller. There is also a trade-off between reusability and understandability: a more general interface fits more situations but is harder to learn, so a simpler, specific component is sometimes more cost-effective. Legacy systems can be reused too, by writing a wrapper that defines provides and requires interfaces for them.<\/p>","sourceStart":23,"notes":"Ask whether a temperature reading is a stable domain abstraction. It is—which is why its unit belongs in the published interface rather than in someone’s memory. Raise the reusability–understandability trade-off before students propose very general interfaces."},{"id":"VALIDATE","title":"Validate in the new context: the Ariane lesson","fig":"ch16_withreuse","sourceRange":"34–39","bullets":[["Discover and evaluate","Assess functions, interfaces and non-functional needs."],["Test harness","Use relevant cases and expected results, not only supplier claims."],["Source case","Software from Ariane 4 was reused for Ariane 5."],["Changed context","A value range that was safe before was no longer safe."]],"question":"(1) What does a supplier’s passed test not necessarily establish? (2) What question should precede “it worked reliably in the previous system”?","answer":"(1) That the component meets this application’s contract, workload and environment. The tested conditions may differ. (2) Which assumptions about inputs, ranges, activated functionality and failure handling remain valid in the new system? The source case is historical, not a new experiment.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/336b7a7881505be5.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Prior success is evidence for its earlier context—not every new one.","full":"<p>CBSE with reuse differs from original development in four ways. User requirements are first written in outline, and stakeholders are encouraged to be flexible. Requirements are refined early according to the components available. After the architecture is designed, a further search and design refinement follows, because apparently usable components may prove unsuitable. Development then becomes composition, often with adaptors. Identifying components has three stages: <b>search<\/b>, <b>selection<\/b> and <b>validation<\/b>. Validation means developing test cases, or extending those supplied, and a test harness to run them. The main difficulty is that the specification may be too informal to derive a complete set of tests. You may also have to check that functionality you do not need cannot interfere with your application.<\/p><p>The chapter’s example is the Ariane 5 launcher. Its designers reused the inertial reference software from Ariane 4 without change, including functions Ariane 5 did not need. On the first launch in 1996, converting a numeric value to an integer overflowed and raised an unhandled exception. The runtime system shut down the inertial reference system, the launcher could not be controlled, and the rocket and its payload were destroyed. On Ariane 4, whose engines were less powerful, the value could never grow large enough to overflow. The general lesson: reused software embeds assumptions about its original environment, and those assumptions are rarely documented.<\/p>","sourceStart":34,"notes":"Ask what assumption the temperature component embeds that nobody wrote down: its unit. The Ariane lesson has the same shape—an undocumented range assumption. Treat Ariane as a historical textbook case, not a new analysis."},{"id":"B01","title":"Three composition forms; three call relationships","fig":"ch16_composition","sourceRange":"40–43","bullets":[["Sequential","An external caller invokes A, then uses its result to call B."],["Hierarchical","A directly calls B to obtain a required service."],["Additive","One composed interface exposes independent services from A and B."],["Glue code","Reconcile invocation order, data and interface differences when necessary."]],"question":"If A and B never call one another but an application calls them in order, which form is this?","answer":"Sequential composition. The external application coordinates the calls and may transform A’s output for B.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/2039319212ce1e2a.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"Sequential, hierarchical and additive composition differ in who calls whom.","full":"<p>Component composition integrates components with each other, and with specially written glue code, to create a system or a new component. For two components A and B:<\/p><ul><li><b>Sequential<\/b>—the external application calls A and then uses A’s results to call B. A and B do not call each other; the composition joins their provides interfaces. Glue code calls them in the right order and transforms A’s output into the form B expects.<\/li><li><b>Hierarchical<\/b>—A calls B directly, so B’s provides interface must be compatible with A’s requires interface. If they match, no extra code may be needed; if not, conversion code is required. Services have no requires interface, so this form is not used with web services.<\/li><li><b>Additive<\/b>—A and B are put together to create a new component whose provides and requires interfaces combine theirs. They are called separately, in any order, and do not call each other.<\/li><\/ul><p>One system may use all three forms. Components written for the system can be designed to fit together, but components developed independently for reuse usually bring interface incompatibilities.<\/p>","sourceStart":40,"notes":"Ask which form joins the temperature provider and the forecaster: sequential, through the consuming application. Then ask where the glue code sits—this sets up the adaptor slides."},{"id":"CHECK2","title":"Checkpoint · explain the adapter","fig":null,"sourceRange":"40–50","bullets":[["Think","The consumer expects one unit and the provider expects another."],["Pair","Define conversion, invalid inputs and the postcondition."],["Record","Add the adapter mechanism and a counterexample test."]],"question":"Why is multiplying by a conversion constant not a complete adapter contract?","answer":"Range, rounding, invalid inputs, provider failures and the returned state must also satisfy the consumer’s contract.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"A conversion formula is not a contract: range, invalid input and failures count too.","full":"<p>An adapter from Fahrenheit to Celsius needs more than the formula (°F − 32) × 5/9. Its contract states the <b>precondition<\/b> (the provider’s documented unit and a plausible input range), the <b>postcondition<\/b> (a Celsius value with stated rounding, labelled with its unit) and the behavior for <b>invalid or missing readings<\/b> and <b>provider failures<\/b>. A counterexample test uses values that expose a wrong assumption: 95 °F must become 35 °C, and a reading outside the plausible range must be rejected rather than passed on.<\/p>","sourceStart":40,"notes":"Ask pairs to write one counterexample test before they write the formula. Accept adapters that reject out-of-range input; challenge any that silently convert it."},{"id":"R09","title":"Adapters reconcile explicit incompatibilities","fig":"ch16_adaptor","sourceRange":"44–50","bullets":[["Parameters","Types, number, representation or units differ."],["Operations","Names differ or a required operation is missing."],["Adaptation","Translate calls/results or provide a justified missing service."],["Limit","An adapter cannot silently invent unspecified semantics."]],"question":"How can the data collector use several sensor interfaces?","answer":"An adapter interprets the collector’s generic command and invokes the particular sensor operation, then returns the expected representation.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/b8feb8a84c04a27e.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"An adaptor converts one interface into another; it cannot supply meaning nobody specified.","full":"<p>Components developed independently often have incompatible interfaces. The chapter names three kinds. <b>Parameter incompatibility<\/b>: operations have the same name, but their parameter types or number of parameters differ. <b>Operation incompatibility<\/b>: the operation names differ. <b>Operation incompleteness<\/b>: one component’s provides interface is a subset of the other’s requires interface, or the reverse. In every case, the solution is an <b>adaptor<\/b> that reconciles the two interfaces.<\/p><p>In the emergency-services example, addressFinder returns the location for a phone number, and mapper displays a map around a post code. An adaptor called postCodeStripper extracts the post code so that the two can be composed sequentially: <code>addressFinder.location(phonenumber)<\/code>, then <code>postCodeStripper.getPostCode(address)<\/code>, then <code>mapper.displayMap(postCode, 10000)<\/code>. In hierarchical composition, an adaptor links the data collector’s generic requires interface to a particular sensor: it parses a command such as sensorData(\"collect\") and calls the sensor’s getdata operation. A separate adaptor is written for each type of sensor. An adaptor can translate only what is documented; if a unit or rule is unstated, it cannot know it.<\/p>","sourceStart":44,"notes":"Ask which incompatibility the temperature case is: a parameter incompatibility of meaning, not of type. Stress the limit—the adaptor can convert units only once someone documents them."},{"id":"D16","title":"OCL states obligations before and after an operation","fig":null,"sourceRange":"51–55","bullets":[["Precondition","What must hold before the operation."],["Postcondition","What must hold after it."],["Invariant","A condition that must remain true for the modeled object."],["@pre","Refers to the value before the operation."]],"question":"What does size = size@pre + 1 require after addItem?","answer":"The resulting size is one greater than the pre-operation size. Other postconditions are still needed to say which item and metadata were stored.","rows":[["addItem pre","No existing photograph with the same identifier."],["addItem post","Size increases by one; retrieve(pid) returns the added photo."],["delete pre","The photograph exists."],["delete post","Photo disappears; size decreases; the source retains its catalog entry."]],"heads":null,"extra":"The textbook’s Photo Library also requires libSize() > 0, because it assumes that creating a library adds one item. That is an assumption of the example, not a rule for every library.","phase":"LEARN","takeaway":"Pre- and postconditions make an interface’s meaning precise enough to test.","full":"<p>An informal description often leaves semantic questions open. The Photo Library documentation says that addItem “adds a photograph to the library and associates the photograph identifier and catalog descriptor with the photograph.” It does not say what happens if the identifier is already in use, or whether deleting a photo also deletes its catalog entry. The best way to resolve such ambiguity is a formal description.<\/p><p>The <b>Object Constraint Language<\/b> (OCL), part of UML, expresses <b>invariants<\/b> (always true), <b>preconditions<\/b> (true before an operation) and <b>postconditions<\/b> (true after it). Adding <code>@pre<\/code> to a name refers to its value before the operation, so <code>age = age@pre + 1<\/code> means that age has increased by one. For addItem, the preconditions require that no photo already has the identifier and that the library exists. The postconditions state that the size grows by one and that retrieve(pid) and catEntry(pid) return what was added. For delete, the photo must exist beforehand; afterwards it cannot be retrieved and the size falls by one, but its catalog entry remains, so the catalog can record, for example, why the photo was deleted. The approach derives from Meyer’s Design by Contract.<\/p>","sourceStart":51,"notes":"Ask pairs to write the precondition that would have protected the forecaster: the unit and the range of its input. Then ask which clause tells a client that the catalog entry survives deletion—students often assume it is removed."},{"id":"D16B","title":"Composition changes emergent qualities","fig":"ch16_datacollect","sourceRange":"56–59","bullets":[["Separation","Separate reporting and data management can improve adaptability."],["Integration","A combined product can reduce communication overhead in the source example."],["Trade-off","Functionality, performance, dependability and evolution can conflict."],["Evidence","Assess the implemented composition, not only isolated components."]],"question":"Why can two individually acceptable components form an unacceptable system?","answer":"Their interaction can introduce latency, incompatible state assumptions or incorrect data interpretation. Those are properties of the composition.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1ee3d9d0236ec757.jpg","caption":"Sommerville Ch.16 · preserved source illustration","takeaway":"A composition trades adaptability against performance; assess the assembled system.","full":"<p>Composition decisions can set functional and non-functional requirements, fast delivery and future evolution against each other. Three questions guide the choice: which composition best delivers the functional requirements; which makes the composite easier to adapt when requirements change; and what the emergent properties of the composed system will be, such as performance and dependability. Those properties can be assessed only once the complete system is implemented.<\/p><p>The chapter compares two compositions of a data collection and reporting system. In (a), separate data collection, data management and report generator components keep concerns apart: the data manager or the reporting component can be replaced independently, so the design is more adaptable. In (b), a database with built-in reporting has fewer components, so it avoids communication overheads and is likely to be faster and more reliable; the database’s integrity rules also constrain the reports. The general principle is separation of concerns, with each component playing one clearly defined role—but one multifunctional component can be cheaper, and multiple components can cost dependability or performance.<\/p>","sourceStart":56,"notes":"Ask which composition our forecasting pipeline resembles, and which emergent property could fail only in the assembled system. A plausible but wrong forecast is one; no single-component test shows it."},{"id":"AISYS","phase":"LEARN","skin":"genai","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source concepts to an AI component","sourceStart":1,"banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · WRITE THE CONTRACT","caption":"A model will accept almost any number you give it. The contract has to say which numbers mean what."},"title":"Write the contract for an AI component","takeaway":"An AI component still needs a contract—and a quality requirement no single call can check.","nodes":[["pre:","unit = 'Celsius' and -40 <= t and t <= 60"],["post:","result.unit = 'Celsius' and result.modelVersion = approvedVersion"],["quality (not OCL):","mean forecast error ≤ stated bound on held-out data"]],"bullets":[["Precondition","Which input would the model accept silently but wrongly?"],["Postcondition","What can each single call guarantee?"],["Quality requirement","What can only be shown over many calls?"]],"question":"Which clause would have caught the Fahrenheit problem, and which requirement cannot be written as an OCL postcondition?","answer":"The precondition: stating unit = 'Celsius' with a plausible range, checked at the adapter, rejects Fahrenheit values that a model trained on Celsius would otherwise accept and turn into confident but wrong forecasts—though a value plausible in both units still needs the unit declared, not inferred. OCL pre- and postconditions constrain each individual call, so the forecast-error bound cannot be one: no single call satisfies or violates it. It belongs in a separate quality requirement verified on a held-out evaluation set and re-checked when the input distribution or model version changes. Recording the approved model version in the postcondition, or as an invariant on the component, makes a version change a contract change that needs re-validation.","full":"<p>This slide is course-added. It applies the chapter’s contract and composition ideas to an AI component, using OCL-style clauses.<\/p><h3>How the slide uses the five objectives<\/h3><p>Component characteristics: an AI component must be documented, including its expected inputs and training assumptions, before another team can assess it. Development with reuse: requirements may need to adapt to what the model supports. Composition: the forecaster is composed sequentially after the data component, so its assumptions meet the provider’s outputs. Adapters: unit conversion must be explicit and specified, never inferred by the model. OCL: preconditions, postconditions and invariants express per-call obligations; aggregate accuracy needs a separate quality requirement.<\/p><p><b>Training distribution.<\/b> The range and kind of inputs a model learned from. Outside it, a model usually still produces an answer, often with high confidence, which is why the precondition must be enforced outside the model.<\/p><p><b>Aggregate quality requirement.<\/b> In OCL, pre- and postconditions constrain each individual operation call. A promise about behaviour over many calls—such as a mean error bound on held-out data—cannot be expressed that way. State it as a separate quality requirement, verified by evaluation rather than by a runtime assertion on one result.<\/p><p><b>Version as part of the contract.<\/b> A new model version can keep the same signature and change behaviour, so the approved version belongs in the contract, like any other semantic assumption.<\/p><p class=\"small\">The case is course-created. Optional further reading: Amershi et al. (2019), <i>Software Engineering for Machine Learning: A Case Study<\/i>.<\/p>","notes":"Allow about 6 minutes. Format: write the contract. Pairs write one precondition and one postcondition for the forecaster before revealing the clauses on the slide. New terms, at most two: training distribution and aggregate quality requirement. Everything else in Full explanation is optional depth and is not assessed."},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Matching types is not matching meaning.","bullets":[["New information","The provider uses Fahrenheit; the AI forecaster silently accepts it."],["Reassess","No contract stated the unit, so nothing rejected it."],["Revise","Add a unit precondition and an explicit adapter; re-validate forecasts."],["Own","Name who owns the contract and who informs forecast users."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. For the forecaster, state the unit and range as a precondition at the adapter, and re-validate forecasts produced since the mismatch began before anyone relies on them.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Accept revisions that add a unit precondition at the adapter, re-validate forecasts made since the mismatch began, and name a contract owner. Ask who tells forecast users that earlier forecasts may be wrong."},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. Which assumption must be explicit before composition? What would the AI forecasting component need stated to reject a wrong unit?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the given facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. A model accepts almost any number; unless a precondition states the unit and a plausible range, nothing rejects a value in the wrong unit.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, an adapter that converts units explicitly, or relying on the AI component to cope with whatever it receives.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. An explicit adapter with a stated unit contract can be tested at its boundary; a model ‘coping’ is untestable behaviour that may simply produce confident wrong output.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"The provider documents Fahrenheit rather than Celsius; matching numeric types did not establish compatible meaning. The AI forecasting component, trained on Celsius readings, accepts the Fahrenheit values without error and returns confident but wrong forecasts.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. The forecasts inherited the unit error silently; the model’s confidence is not evidence that its input meant what it assumed.","note":"Classroom version only: the assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["B01"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["B01","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"Composition types","range":"40–43"},{"title":"Interface semantics and OCL","range":"51–55"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"Components, standards and interfaces","start":3,"end":17,"units":["X01","X02A","X03","CHECK1"]},{"title":"Component models and middleware","start":18,"end":22,"units":["X04","MIDDLEWARE","CHECK1"]},{"title":"Development for reuse","start":23,"end":33,"units":["X05","X06"]},{"title":"Development with reuse and validation","start":34,"end":39,"units":["X05","VALIDATE"]},{"title":"Composition, glue and adapters","start":40,"end":50,"units":["B01","CHECK2","R09"]},{"title":"Interface semantics, OCL and trade-offs","start":51,"end":59,"units":["D16","D16B"]}],"sourceCount":59,"original":"sources/Ch16-Original.pptx","textbook":"sources/Ch16-Textbook.pdf","bookPages":26,"quiz":[{"q":"What does a component’s requires interface specify?","options":["The services the component offers to other components","The services other components must provide for it to work","The internal data structures the component uses"],"answer":1,"why":"The provides interface is the component’s API; the requires interface states the services it needs, without saying how they are provided."},{"q":"Which activity is typical of development for reuse?","options":["Generalizing an existing component so that other applications can use it","Searching repositories for components that match outline requirements","Changing requirements to fit the components that are available"],"answer":0,"why":"Development for reuse generalizes and documents components; searching and adjusting requirements belong to development with reuse."},{"q":"Component A calls component B directly to obtain a service it needs. This is:","options":["Sequential composition","Additive composition","Hierarchical composition"],"answer":2,"why":"In hierarchical composition, B’s provides interface must be compatible with the requires interface of A, which calls it."},{"q":"Two components agree on operation names and parameter types. What is still unknown?","options":["Whether their interfaces are syntactically compatible","Whether the values mean the same thing, such as units and ranges","Whether a component model defines their interfaces"],"answer":1,"why":"Names and types establish syntactic compatibility; semantic compatibility depends on documentation or a formal contract."},{"q":"In OCL, what does libSize() = libSize()@pre + 1 state?","options":["The library size has increased by one after the operation","The library must contain exactly one item before the operation","The operation may be retried once if it fails"],"answer":0,"why":"@pre refers to a value before the operation, so this postcondition states that exactly one entry was added."}],"alignment":[{"objective":"Describe component characteristics and interfaces.","evidence":"Explain and demonstrate: Describe component characteristics and interfaces.","field":"FIT"},{"objective":"Compare development for and with reuse.","evidence":"Explain and demonstrate: Compare development for and with reuse.","field":"source application + BOUND"},{"objective":"Choose sequential, hierarchical or additive composition.","evidence":"Explain and demonstrate: Choose sequential, hierarchical or additive composition.","field":"CONTRACT"},{"objective":"Diagnose interface incompatibility and specify an adapter.","evidence":"Explain and demonstrate: Diagnose interface incompatibility and specify an adapter.","field":"transfer question + lab record"},{"objective":"Read an OCL precondition/postcondition and design a test.","evidence":"Explain and demonstrate: Read an OCL precondition/postcondition and design a test.","field":"lab test cases + lab record + REFIT"}],"artifact":"Build a provides/requires contract, composition/adapter annotation and explicit semantic tests.","bridge":"Build a provides/requires contract, composition/adapter annotation and explicit semantic tests. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"B01","workload":"Consider the diagnostic and maintenance burden when integration errors cross component/vendor boundaries.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","R08":"VALIDATE"},"roadmap":{"question":"When do reusable components really fit together?","connection":"Interfaces state obligations; models supply shared support; CBSE finds or creates components; composition must preserve meaning.","inClass":"Read contracts; diagnose a mismatch; justify an adapter.","deliverable":"An interface contract and duration-adapter test log.","success":"Explain expected vs actual behavior, including invalid inputs.","branches":[{"verb":"Specify the boundary","label":"Components and interfaces","detail":"Five characteristics · provides / requires","target":"X01","units":["X01","X02A","X03","CHECK1"],"caseLens":"Which provided or required interface must state the temperature meaning?"},{"verb":"Support interoperability","label":"Component models","detail":"Standards · middleware · common services","target":"X04","units":["X04","MIDDLEWARE"],"caseLens":"Can the component model and middleware help interoperability without defining the unit?"},{"verb":"Develop for or with reuse","label":"CBSE processes","detail":"Generalize · discover · select · validate","target":"X05","units":["X05","X06","VALIDATE"],"caseLens":"Should we adapt an existing component or change the requirements?"},{"verb":"Connect the behavior","label":"Component composition","detail":"Sequential · hierarchical · additive · adapters","target":"B01","units":["B01","CHECK2","R09"],"caseLens":"Where should the Fahrenheit↔Celsius adapter sit in the composition?"},{"verb":"Check semantic obligations","label":"Contracts and composition limits","detail":"OCL pre/postconditions · emergent properties","target":"D16","units":["D16","D16B","AISYS","APPLY"],"caseLens":"Which contract and test establish semantic compatibility, including invalid inputs?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"The AI read 95 °F as Celsius—and forecast with total confidence.","aiAssignment":{"title":"Composing OCR with an AI summariser","scenario":"A clinic composes two components: an OCR component that reads scanned lab reports, and an AI summariser that writes a short summary for the doctor. The OCR interface returns text lines, each with a confidence value; the summariser accepts plain text.","facts":["Both components passed their suppliers’ tests.","The adapter between them joins all lines and drops the confidence values.","Neither interface states which languages or number formats are supported."],"question":"Which assumption must be explicit in the composition, and what should the adapter guarantee?","stress":"Arabic-Indic digits in one report are read with low confidence, so a potassium value of 5.8 becomes 3.8. The adapter passes the line on, and the summariser states the wrong value as fact.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023":[["SE-Design","Software Design","Documenting contracts with pre- and postconditions and invariants; input that does not match the contract should produce an error."],["SE-FormalMethods","Formal Methods","Formal specification of interfaces."],["SE-Refactoring","Refactoring and Code Evolution","Implicit interfaces (Hyrum’s Law): behaviour consumers rely on without a contract."],["SE-Validation","Software Verification and Validation","Integration testing of composed components."]]}</script><script src="runtime/source-figures.js?v=20261004-andor"></script><script src="runtime/national-content.js?v=20260928-campus-v3"></script><script src="runtime/labs.js?v=20261003-extra-v1"></script><script src="runtime/story-v3.js?v=20261005-lab2"></script><script src="runtime/classroom-v3.js?v=20261005-autostress" defer></script></body></html>
