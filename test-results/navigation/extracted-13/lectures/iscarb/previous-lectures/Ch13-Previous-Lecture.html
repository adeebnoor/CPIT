ill press: ownership, the stress tests, workload and the AI gate. Question 3 wants a design change, not sympathy &mdash; the same test Rule 14 itself applies. Question 4 is deliberately the exact sentence from the flow: AI prepares, never owns, a human signs &mdash; if the room can say that sentence cold, Rule 15 landed.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks &mdash; the mark follows the level.", "badge": {"c": "", "t": "READINESS", "s": "the gate is at Rule 20"}, "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "violet", "lab": "L1 &nbsp; ASSERTING", "lead": "A verdict with nothing behind it.", "txt": "States a verdict. Names no threat, no artifact, no owner. Right or wrong, it cannot be audited."}, {"c": "teal", "lab": "L2 &nbsp; REASONING", "lead": "The threat, cited &mdash; but nothing to inspect.", "txt": "Names the weak-password vulnerability and cites the page. Still no artifact a stranger could inspect."}, {"c": "sand", "lab": "L3 &nbsp; JUSTIFYING", "lead": "A dated, owned risk assessment entry, and a stated way to be wrong.", "txt": "Names a dated, owned risk assessment entry, states what would falsify the claim, and bounds the residual risk."}, {"c": "green", "lab": "L4 &nbsp; ACCOUNTABLE", "lead": "L3, and it survives the constraint changing.", "txt": "All of L3, and the verdict survives a changed constraint &mdash; or the student explains exactly why it changes, and who re-signs."}]}, {"t": "levels"}, {"t": "wide", "c": "mag", "lab": "READINESS IS A GATE, NOT A LEVEL", "lead": "A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.", "txt": "Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight &mdash; LO1, 5 marks, {{assignmentDue}} &mdash; and its evidence policy is the same one: cite the source page, or mark the claim <i>unmeasured</i> with the measurement you would need."}], "hueOk": "Four levels on one rail, each with its own colour, is the scale itself &mdash; a two-colour version stops reading as an ordered ladder.", "timebox": "90 sec", "cut": true, "task": "Pick the level you think you are at, then read the line under it: it says what your card actually carries.", "notes": "The picker is self-assessment; the line under it is read from the boxes the student actually filled and cannot be talked up. Point at the gap between the two &mdash; it is always a specific empty box, which is why this is a teaching instrument rather than a mark. The semester grade weights belong to the Week 01 kickoff and repeating them here wastes ninety seconds &mdash; this slide answers the only question that matters tonight: what separates a weak answer from a defensible one in THIS chapter. Make each student name their own level out loud; most say L2 and are right, and the honesty is the point. Keep formal scoring off the live slide, as the peer-review rule requires. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constraint will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State threat + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constraint changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the risk assessment"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed control"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE &mdash; PICK ONE", "picker": {"g": "mutation", "options": ["The patient is a head of state", "The regulator mandates breach disclosure in 24h", "Budget halves: open-source auth only", "The password checker is now AI-driven"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses &mdash; and why"}}, {"t": "principle", "txt": "A strong design either survives mutation &mdash; or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the project security engineer.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses &mdash; stronger than a verdict that magically survives everything. Refusing to revise under a changed constraint is not robustness; it is not having reasoned in the first place.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the security claim without trusting your explanation, or the AI or tool that prepared it? Is the risk assessment, the password checker log, the access audit trail and the penetration test report all on file?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the vulnerability, threat type, missing control, or unmet operational reality that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session &mdash; two questions only, which is precisely why the formal rubric stays off the live slide. Students who cannot answer Q1 about someone else&rsquo;s card usually discover the same gap in their own. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 2, 5. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line. Keep the instruments visible in sequence; use vertical scrolling for expansion.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, challenge and sign, with a named threat behind it and a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use a threat and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the project security engineer.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "X07", "answer": "Illustrative causal chain for tonight: the weak password system (user IDs identical to names, dictionary-word passwords allowed) is the VULNERABILITY; the attacker guessing the celebrity's credentials is the THREAT; the impersonation of the authorised user is the ATTACK; the celebrity's record being copied to a tabloid is the INTERCEPTION; the loss of reputation and legal action is the EXPOSURE; the password checker that should have been run is the CONTROL. The security policy alone does not prove this chain. Verify the risk assessment report before presenting it as the actual incident.", "rule": "X07 - The words you will swap by mistake", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Distinguish vulnerability, threat and attack, and say which control strategy addresses each one.", "title": "Vulnerability, threat, attack &mdash; and which control catches each", "sub": "Three words for three different things, and three control strategies students report interchangeably. Get these wrong and every later sentence is wrong with them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "vocabulary, not a source page"}, "blocks": [{"t": "compare", "head": ["Term", "What it is", "Where you would look for it", "Tonight&rsquo;s Mentcare"], "rows": [{"c": "teal", "cells": ["Vulnerability", "A weakness that may be exploited.", "Code review, configuration audit, password policy review.", "User IDs identical to names; dictionary-word passwords allowed."]}, {"c": "sand", "cells": ["Threat", "Circumstances with potential to cause loss or harm.", "Threat identification step of the risk assessment.", "An attacker guesses the celebrity&rsquo;s credentials."]}, {"c": "mag", "cells": ["Attack", "An exploitation of a vulnerability, generally deliberate.", "Incident report, access logs, audit trail.", "The impersonation of the authorised user using guessed credentials."]}]}, {"t": "compare", "head": ["Control strategy", "The question it answers", "When it acts", "Used tonight?"], "rows": [{"c": "teal", "cells": ["Vulnerability avoidance", "Can the vulnerability be designed out?", "Before run time", "Partial &mdash; but the password checker was never run."]}, {"c": "teal", "cells": ["Attack detection & elimination", "Can the attack be caught before exposure?", "At run time", "Failed &mdash; no anomaly detection on guessed-password access."]}, {"c": "sand", "cells": ["Exposure limitation & recovery", "Can the loss be minimised after a successful attack?", "After the attack", "Partial &mdash; the audit log exists, but the record was already leaked."]}]}], "hueOk": "Three terms and three strategies each carry their own colour so the student can find the same row again on the comparison; one colour would make both tables read as undifferentiated lists.", "timebox": "2 min", "cut": true, "task": "Write tonight&rsquo;s incident as one sentence naming the vulnerability, the threat and the attack in that order &mdash; then name the control strategy that would have caught it.", "say": "You will lose marks all semester for swapping these three words. Two minutes now saves that.", "notes": "<b>The sentence to make them write:</b> most students write &ldquo;the system was insecure and the record was leaked&rdquo; and stop &mdash; that names none of the three terms correctly. The useful sentence names all three in order &mdash; <i>this vulnerability</i>, reached by <i>this threat</i>, realised as <i>this attack</i> &mdash; and then names the control strategy that would have caught it. Two minutes, and it is worth the two even though nothing here is new to a strong student. Do not read the tables aloud; that is what they are for. Instead ask one student to say tonight&rsquo;s incident as the three-part sentence, and correct only the ordering. The second table is the one to point at when a student later writes &ldquo;we should detect the breach&rdquo;: detection is the second strategy, but tonight&rsquo;s failure was avoidance &mdash; the password checker was never run. This is a designated cut point: if behind, say the three-part sentence once and move on. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R14", "rule": "RULE 14 - Practitioner workload", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name a workload cost their security design creates for a practitioner, and the design change that reduces it.", "title": "Engineering changes human work", "sub": "A secure design can still fail operationally if it creates unsustainable workload.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "PASSWORD FATIGUE", "lead": "How many passwords per shift, and what gets written down?", "txt": "A policy that requires strong passwords and frequent rotation trains users to write them down. The celebrity&rsquo;s password was a dictionary word because the celebrity could not remember a strong one. That is not a discipline problem &mdash; it is a workload variable."}, {"c": "sand", "lab": "ALERT BURDEN", "txt": "Who reviews the access logs, the password checker reports, the SIEM alerts &mdash; and do they have the hours the process assumes?"}, {"c": "mag", "lab": "DELIVERY SPEED", "txt": "What schedule pressure is the team absorbing, and what does it push them to skip? A password checker that is &ldquo;too slow to run in CI&rdquo; is a schedule choice, not a technical one."}, {"c": "violet", "ic": "spark", "lab": "WHO WRITES IT NOW", "lead": "Generated code moves the load; it does not remove it.", "txt": "Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing more that they did not write. The password checker is exactly the kind of code a model writes plausibly and a reviewer under-scrutinises."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT, THIS IS THE MECHANISM &mdash; NOT A FOOTNOTE", "lead": "Blaming the celebrity ends the investigation. Workload as a design input continues it.", "txt": "The celebrity&rsquo;s password was a dictionary word because the policy required a strong password that the celebrity could not remember. That is password fatigue, rotation frequency and cognitive load acting as a system variable. The source says operational security is primarily a human and social issue (p.9) and that users sometimes take insecure actions to make it easier to do their jobs. Blaming the celebrity ends the investigation; treating workload as a design input continues it.", "field": {"id": "workload", "core": false, "rows": 2, "ph": "One workload cost your security design creates for a real practitioner, and the concrete design change that reduces it", "ex": "<i>Shape only:</i> &ldquo;My design requires password rotation every 30 days. With a generator tool the team now files four times as many reset requests, so the help desk becomes the bottleneck. Design change: passwords below a stated strength band get a standing pre-approval for self-service reset, and the help desk sees a weekly batch instead of a queue.&rdquo;"}}, {"t": "principle", "txt": "Trade-offs include people, process, evidence and time &mdash; not only code."}], "timebox": "90 sec", "task": "Name one workload cost your preferred security design creates for a real practitioner, and the design change that reduces it.", "notes": "The rule with no equivalent in the textbook, and where ISCARB differs from a standard security lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change &mdash; password rotation policy, alert rationalisation, a second pair of eyes on the security review. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b> Every student in the room is already using generated code, and almost none of them has been asked what it did to the review load rather than to the writing load. Two things to say. First, the honest framing: the tool did not remove the work, it moved it &mdash; from writing, which is visible and estimated, to reviewing, which is neither. Second, connect it to the crisis: the celebrity used a dictionary-word password because the policy was unworkable, and a reviewer who approves generated security code without reading it is the same failure with a keyboard. If a student answers &ldquo;it just makes us faster&rdquo;, ask who reviews the faster output and how many hours they have.", "appendix": true, "route": "toolkit"}, {"k": "X08", "answer": "Illustrative target, not a measured result or a value from the chapter: Monitor the number of weak passwords in the system. Target: zero weak passwords after each daily checker run, checked daily with a weekly summary to the security engineer. If the target is missed (more than 5 weak passwords in any daily run), alert the system administrator, force-reset all weak passwords within 24 hours, and re-run the checker before allowing the affected accounts to log in. The target and fallback require approval for the actual system.", "rule": "X08 - The same ideas, the other vocabulary", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Say the security idea they have just used in the vocabulary a services team would use for it.", "title": "You already know these. You may not know their other names.", "sub": "Left column: what this chapter calls it. Right column: what the same argument is called where most of you will work. Same idea, different room.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "not in the chapter &mdash; the chapter predates the vocabulary"}, "blocks": [{"t": "compare", "head": ["In this chapter", "Where most of you will work", "What the second one adds"], "rows": [{"c": "teal", "cells": ["Security, as a property", "A security SLA &mdash; a stated bound on confidentiality/integrity/availability over a stated window", "A bound and a period, so the argument stops being about whether it is secure and starts being about whether the bound was met"]}, {"c": "teal", "cells": ["Vulnerability (a weakness)", "A CVE &mdash; a Common Vulnerabilities and Exposures entry", "A globally unique identifier so the same weakness is findable across teams and tools"]}, {"c": "sand", "cells": ["A monitor with a trigger value and an owner (Rule 10)", "A SIEM alert, with a runbook", "The rule that an alert nobody acts on is deleted, not tuned"]}, {"c": "sand", "cells": ["Asset, attack, control, exposure, threat, vulnerability (X02)", "A threat model &mdash; STRIDE or PASTA", "A structured method that names the same six things and adds priorities"]}, {"c": "mag", "cells": ["A misuse case (X06)", "An abuse case &mdash; the same idea, used in UML", "A diagram a developer can read alongside the use cases, not a separate document"]}, {"c": "violet", "cells": ["Layered protection architecture (B01)", "Defense in depth &mdash; the same three layers, the same principle", "It moves the defence from a single control to a chain of controls, each catching what the previous missed"]}]}, {"t": "wide", "c": "violet", "lab": "ONE LINE, IN THE OTHER VOCABULARY", "field": {"id": "vocab_own", "core": false, "rows": 1, "ph": "Take the monitor you wrote in Rule 10 and state it as a target, a window, and what happens when it is missed"}}], "hueOk": "Colours carry over from X02 and B01 so the student recognises which family each row belongs to; the row is a translation, and the colour is what says of what.", "timebox": "90 sec", "cut": true, "task": "Read the middle column. Then restate your own Rule 10 monitor in it.", "say": "Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.", "notes": "Ninety seconds, and resist expanding it &mdash; the point is recognition, not instruction. Two things worth saying. First, the honest history: this chapter was written before the vocabulary in the middle column existed as a discipline, so the gap is chronological rather than a disagreement, and the concepts map almost one to one. Second, the direction of the translation matters: a student who learns only the middle column can run a SIEM dashboard and cannot argue a security case to a regulator, while a student who has both can do both, which is the actual advantage this degree gives them. If someone asks which vocabulary is right, the answer is the room you are in &mdash; a regulator will not accept a CVE ID and a service team will not accept a misuse case, and knowing which is which is the skill. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R15", "answer": "<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>", "rule": "RULE 15 - AI assist + human sign-off", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.", "title": "AI prepares evidence; humans own assurance", "sub": "AI is permitted for preparation, never for unowned approval.", "badge": {"c": "mag", "t": "AI MOMENT", "s": "assist, not assurance"}, "blocks": [{"t": "aiflow"}, {"t": "aigate"}], "timebox": "90 sec", "task": "Run the gate on the way you actually used AI this week &mdash; on a real output, not a hypothetical. <b style=\"color:var(--mag)\">You are the project security engineer.</b>", "notes": "The gate is the rule, not the three stations above it &mdash; make every student run it on something they really did this week, not on a hypothetical. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second &mdash; which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. It means the artifact you file is the test you ran and what it showed, never the prompt or the answer. A student who cannot say which of the two middle questions their own use passed has not yet understood what they filed. The remaining trap is yes / no / no: an output that becomes evidence and is neither re-derivable nor testable is exactly the unverifiable claim this course exists to refuse. Note what is deliberately absent: vendor benchmark numbers. If a student cites an accuracy figure or a mean-time-to-detect, ask which study. That is the break-even discipline from X04 applied to AI, and if you let it slide the session&rsquo;s whole argument about evidence collapses in its final ten minutes.", "appendix": true, "route": "toolkit"}], "appendixUnits": ["READING", "PREP", "C01", "SRC00", "SRC01", "SRC02", "SRC03", "SRC04", "SRC05", "R01", "R02R03", "R08", "R10", "R12", "J02", "R02", "R03", "R04", "R05", "H01", "QA1", "QA2", "R06", "R07", "QA3", "R13", "QA4", "R16", "R17", "R19", "J01", "R20", "X07", "R14", "X08", "R15"], "mainUnits": ["TITLE", "START", "X01", "X02", "X02A", "X03", "CHECK1", "X04", "X05", "X06", "R11", "CHECK2", "R09", "B01", "X09", "R18", "APPLY", "END"], "path": {"chapter": 13, "assignment": 4, "exit": ["Distinguish assets, threats, attacks and vulnerabilities.", "Translate a policy into testable requirements.", "Build a misuse case and a control.", "Explain layered protection and secure defaults.", "Design a negative test and state its coverage limit."], "sourceFile": "sources/Ch13-Original.pptx", "build": "20260921-visual-v3"}, "study": {"readings": [["Misuse cases and requirements", 40, 43], ["Secure design principles", 44, 47]], "technical": "A file-access policy says “student        the failure trace were filled but JAH-2 still read "not supported",
       which made both the Rule 20 map and the bar gauge lie low. */
    else if(n==='@matrix'){v=''; for(var k in S.mx) if(S.mx[k]){v='y'; break;}}
    else if(n==='@trace') v=(S.trace&&S.trace.length)?'y':'';

    else v=S.f[n.slice(2)]||'';
    if(!String(v).trim()) return false;
  }

}

/* Practice items in the style of the national knowledge unit. Course-written, never
   real exam questions — the note under the block says so and CLAIM-01 guards it. */
function firstOpenQuizItem(){
  var QT=LECTURE.jahtest;

  for(var j=0;j<QT.items.length;j++) if(S.quiz[j]===undefined||S.quiz[j]===null) return j;

function renderQuiz(){

     '<span class="qz-nav"><button data-qnav="-1">Prev</button><button data-qnav="1">Next</button></span></div>';

  for(var w=0;w<ws.length;w++) ws[w].innerHTML=h;

/* ---------- distributed retrieval ------------------------------------------
   The end-of-session check is a block of five items in the last ten minutes.
   That is massed practice, and massed practice is the weakest way to use the
   same five questions. A `recall` block pulls ONE of them back into the middle
   of the hour, and shares S.quiz with the final block — so the item is not
   asked twice, it is asked EARLIER. The author moves a question in time
   without writing a new one, and any subject with a jahtest gets this free. */
function rRecall(b){
  if(!LECTURE.jahtest) return '';
  return '<div class="rc" data-rc="'+(b.i||0)+'"></div>';
}
function renderRecall(){

/* ---------- v12 retrieval loop: 60 seconds at the close of every phase ------
   Retrieval practice is the most reliably documented effect in learning
   research, and until now the hour retrieved exactly once, at J02. A `qa`
   block closes each phase: a ring timer the back row can read, four
   questions answered FROM MEMORY first, a reveal per row, and an honest
   self-score. Nothing is saved — the drill is the moment, not an artifact. */
var QA_C=326.7;                                  /* ring circumference, r=52  */
function rQa(b){
  var items=b.items||[];
  var h='<div class="qa">'+
    '<div class="qa-side">'+
     '<button class="qa-ring" data-qa-ring="1" aria-label="Start the sixty-second retrieval timer">'+
      '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><circle class="qa-rbg" cx="60" cy="60" r="52"></circle><circle class="qa-rfg" cx="60" cy="60" r="52"></circle></svg>'+
      '<b class="qa-secs">60</b></button>'+
     '<div class="qa-meta"><span class="qa-tag">'+(b.tag||'')+'</span>'+
      '<span class="qa-hint qa-h1">Press the ring, then answer out loud from memory</span>'+
      '<span class="qa-hint qa-h2">Time &mdash; now reveal and score honestly</span></div>'+
     '<div class="qa-score" role="status"><span class="qa-slab">RECALLED</span><b class="qa-sval">0/'+items.length+'</b></div>'+
    '</div><div class="qa-list">';
  for(var i=0;i<items.length;i++){
    h+='<div class="qa-row"><span class="qa-n">'+(i+1)+'</span><div class="qa-body">'+
       '<div class="qa-q">'+items[i].q+'</div>'+
       '<div class="qa-a">'+items[i].a+'</div>'+
       '<div class="qa-judge"><button class="qa-hit" data-qa-judge="hit">Recalled it</button>'+
       '<button class="qa-miss" data-qa-judge="miss">Missed it</button></div></div>'+
       '<button class="qa-tog" data-qa-tog="1" aria-expanded="false">Reveal</button></div>';
  }
  return h+'</div></div>';
}
function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
      var live=document.getElementById('tLive');
      if(live) live.textContent='The retrieval minute is over — reveal and compare.';
    }
  },1000);
  btn.setAttribute('data-running',String(id));
}
function qaScore(box){
  var rows=box.querySelectorAll('.qa-row'),hit=0,marked=0;
  for(var i=0;i<rows.length;i++){
    if(rows[i].classList.contains('picked-hit')){hit++;marked++;}
    else if(rows[i].classList.contains('picked-miss')) marked++;
  }
  var sc=box.querySelector('.qa-score');
  if(!sc) return;
  sc.setAttribute('data-hit',(rows.length&&hit===rows.length)?'all':'part');
  sc.querySelector('.qa-sval').textContent=hit+'/'+rows.length;
}

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(typeof ref!=='string') return '';
  if(ref==='@marks') return Object.keys(S.marks||{}).filter(function(k){return Array.isArray(S.marks[k])&&S.marks[k].length;}).join(' ');
  if(ref==='@gates'){var passed=GATE_DEFS.filter(function(g){return S.gates&&S.gates[g[0]];}).length;return passed?String(passed):'';}
  if(ref==='@signed'){var signed=Object.keys(S.sign||{}).filter(function(k){return S.sign[k];}).length;return signed?String(signed):'';}
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function policyThreshold(config,key){
  var policy=LECTURE.thresholds||{},name=(config&&config.minKey)||key;
  var value=config&&Number.isFinite(config.min)?config.min:policy[name];
  if(!Number.isFinite(value)||value<0)throw new Error('Invalid LECTURE.thresholds entry: '+name);
  return value;
}
function coachState(b){
  var w=b.watch||[], filled=0, thin=false, min=policyThreshold(b,'coachDeep'), deep=b.deep;
  for(var i=0;i<w.length;i++){
    var v=String(probe(w[i])||'').trim();
    /* only the boxes named in `deep` are held to a length — a NAME box is
       legitimately three words and must not be nagged for it */
    if(v){ filled++; if(w[i].indexOf('f:')===0 && (!deep||deep.indexOf(w[i])>=0) && v.length<min) thin=true; }
  }
  if(filled<policyThreshold(null,'coachMinFilled')) return 'empty';
  if(filled<w.length||thin) return 'thin';
  return 'ok';
}
function renderCoach(){
  var ws=document.querySelectorAll('[data-coach]');
  for(var i=0;i<ws.length;i++){
    var b=COACH[ws[i].getAttribute('data-coach')]; if(!b) continue;
    var st=coachState(b), lab=st==='ok'?'Committed':(st==='empty'?'Stuck?':'Nearly');
    ws[i].setAttribute('data-st',st);
    ws[i].innerHTML='<div class="coach-label">'+lab+'</div><div class="ct">'+T(b[st]||'')+'</div>';
  }
}
var COACH=[];
function rCoach(b){ COACH.push(b); return '<div class="coach" data-coach="'+(COACH.length-1)+'"></div>'; }

/* ---------- think · pair · share ----------
   Two minutes of peer talk before a pivotal decision. The toggle is not a score;
   it is the student telling the room they actually compared, which is what makes
   the instructor's "hands up if your partner disagreed" question answerable. */
function rPair(b){

    '<div class="st a"><div class="n">1 &middot; Think'+(b.t1?' &middot; '+b.t1:'')+'</div><div class="p">'+T(b.think)+'</div></div>'+
    '<div class="st b"><div class="n">2 &middot; Pair'+(b.t2?' &middot; '+b.t2:'')+'</div><div class="p">'+T(b.pair)+'</div></div>'+
    '<div class="st c"><div class="n">3 &middot; Share'+(b.t3?' &middot; '+b.t3:'')+'</div><div class="p">'+T(b.share)+'</div></div>'+
    '<button class="done" data-pair="'+id+'" data-on="0">Compared<br>with a peer</button></div>';
}
function renderPair(){
  var bs=document.querySelectorAll('[data-pair]');
  for(var i=0;i<bs.length;i++){
    var on=!!(S.pair&&S.pair[bs[i].getAttribute('data-pair')]);

/* ---------- sign and lock ---------------------------------------------------
   "Do not edit these boxes after the reveal" was an instruction with nothing
   behind it. A signature is the mechanism: the student commits, the values are
   snapshotted with a time, the inputs go read-only, and a later edit is refused
   in words rather than silently allowed. This is the chapter's own thesis
   applied to the chapter — an unsigned claim and a claim you can quietly revise
   after seeing the answer are the same thing. */
var SIGN=[];
function rSign(b){
  SIGN.push(b);
  return '<div class="signbar" data-sign="'+b.id+'" data-on="0">'+
    '<div class="st"></div><button data-signbtn="'+b.id+'">'+T(b.label||'Sign this')+'</button></div>'+
    '<div class="lockmsg" data-lockmsg="'+b.id+'"></div>';
}
function signedFields(){                      /* every ref frozen by any signature */
  var s={};
  for(var i=0;i<SIGN.length;i++){
    if(!(S.sign&&S.sign[SIGN[i].id])) continue;
    for(var j=0;j<(SIGN[i].fields||[]).length;j++) s[SIGN[i].fields[j]]=SIGN[i].id;
  }
  return s;
}
function renderSign(){
  var bs=document.querySelectorAll('[data-sign]');
  for(var i=0;i<bs.length;i++){
    var id=bs[i].getAttribute('data-sign'), b=null;
    for(var k=0;k<SIGN.length;k++) if(SIGN[k].id===id) b=SIGN[k];
    if(!b) continue;
    var rec=S.sign&&S.sign[id], on=!!rec, n=0, tot=(b.fields||[]).length;
    for(var f=0;f<tot;f++) if(String(probe(b.fields[f])||'').trim()) n++;
    bs[i].setAttribute('data-on',on?'1':'0');
    bs[i].querySelector('.st').innerHTML = on
      ? '<b>Signed at '+rec.at+'.</b> '+T(b.done||'These boxes are now read-only. Anything you learn from the reveal goes in a new box, not over this one.')
      : (n<tot ? T(b.before||'Fill every box, then sign.')+' <b>'+n+' of '+tot+'</b>'
               : '<b>'+T(b.ready||'Ready to sign.')+'</b> '+T(b.warn||'Signing freezes these boxes for the rest of the hour.'));
    var btn=bs[i].querySelector('button');
    btn.textContent = on ? 'Signed ✓' : T(b.label||'Sign this');
    btn.disabled = on || n<tot;
    btn.style.opacity = (!on&&n<tot) ? '.45' : '1';
  }
  /* lock the inputs themselves */
  var locked=signedFields();
  var ts=document.querySelectorAll('[data-f]');
  for(var t=0;t<ts.length;t++){
    var isLocked=!!locked['f:'+ts[t].getAttribute('data-f')];
    ts[t].readOnly=isLocked;
    ts[t].toggleAttribute('data-locked',isLocked);
    ts[t].setAttribute('aria-readonly',String(isLocked));
  }
  var ps=document.querySelectorAll('[data-pick]');
  for(var p=0;p<ps.length;p++){
    var lk=!!locked['p:'+ps[p].getAttribute('data-pick')], pk=ps[p].querySelectorAll('.pick');
    for(var q=0;q<pk.length;q++){pk[q].setAttribute('data-locked',lk?'1':'0');pk[q].setAttribute('aria-disabled',String(lk));}
  }
}
function refuse(id){
  var ms=document.querySelectorAll('[data-lockmsg="'+id+'"]');
  for(var i=0;i<ms.length;i++){
    ms[i].setAttribute('role','status');
    ms[i].textContent='Locked: signed answers cannot be edited. If the reveal changed your thinking, record it in a later box so your revision stays visible.';
    (function(e){setTimeout(function(){e.textContent='';},4200);})(ms[i]);
  }
}

/* ---------- self-assessed level vs. the level the artifact supports ----------

/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    var m=s.match(/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */
function uncitedPages(){
  var C=LECTURE.coverage; if(!C||!C.span) return [];
  var hits=srcPages(), out=[], run=null;
  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }

}

/* ---------- hidden model answer / instructor key ---------------------------
   Every question-bearing unit gets the same open/close affordance. The author
   defines u.answer for a model response. Learning objectives and spoken teaching
   cues are never relabelled as answers. noAnswer suppresses a pre-reveal key. */
function hasQuestion(u){
  if(!u||u.k==='TITLE'||u.k==='END'||u.noAnswer===true) return false;
  if(typeof u.answer==='string'&&u.answer.trim())return true;
  if(u.question===true)return true;
  var probe=' '+(u.task||'')+' '+JSON.stringify(u.blocks||[])+' ';
  return /\?|\bchoose\b|\bclassify\b|\bdecide\b|\bname\b|\bwhich\b|\bwhat\b|\bwhy\b|\bhow\b/i.test(strip(probe));
}

  return T(u.answer||'State a bounded claim, identify supporting evidence and name an observation that would reverse the claim. Compare your response with the source and discuss the reasoning with the instructor.');

/* ---------- v7 auto-fit: a slide fills the stage exactly, never scrolls -----
   Content that would overflow is measured, then the .fit wrapper is scaled
   down just enough to fit. Re-run whenever content can change size: reader
   zoom (+/-), navigation to a conditional slide, or a late-loading figure. */
function fitSlide(sl){
  sl=sl||deck.querySelector('.slide.on'); if(!sl) return;
  var fit=sl.querySelector('.fit'); if(!fit) return;
  fit.style.transform='none';
  var cs=getComputedStyle(sl);
  var avail=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!(avail>0)) return;
  var h=fit.scrollHeight;
  if(h>avail+1){
    var f=avail/h;
    if(f<.55) f=.55;                     /* legibility floor — nothing unreadable */
    fit.style.transform='scale('+f+')';
    fit.style.transformOrigin='top center';
  }
}

},true);


/* ---------- author sanity check ---------------------------------------------
   Runtime guardrails for cloned/adapted lectures. Warnings never block class.
   Run ISCARB_SANITY() from DevTools at any time to re-check the current deck. */
function sanity(){
  var issues=[], declaredF={}, declaredP={}, usedImg={}, names=LECTURE.fieldNames||{};
  function walk(x){
    if(!x) return;
    if(Array.isArray(x)){ for(var i=0;i<x.length;i++) walk(x[i]); return; }
    if(typeof x!=='object') return;
    if(x.field&&x.field.id) declaredF[x.field.id]=1;
    if(x.picker&&x.picker.g) declaredP[x.picker.g]=1;
    if(x.t==='levels')declaredP.level=1;
    if(x.img&&typeof x.img==='string') usedImg[x.img]=1;
    if(x.t==='raw'&&typeof x.html==='string'){
      var re=/data-pick=["']([^"']+)["']/g,m;
      while((m=re.exec(x.html))) declaredP[m[1]]=1;
    }
    for(var k in x) if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]);
  }
  walk(LECTURE.units||[]);

  var fs=document.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var id=fs[i].getAttribute('data-f');
    if(!declaredF[id]&&!names['f:'+id]) issues.push('data-f "'+id+'" has no field declaration or fieldNames alias');
  }

  var cm=LECTURE.caseMap||[];
  for(var c=0;c<cm.length;c++){
    var parts=cm[c].parts||[];
    for(var p=0;p<parts.length;p++){
      var ref=parts[p][1]||'';
      if(ref.indexOf('p:')===0&&!declaredP[ref.slice(2)])
        issues.push('caseMap picker "'+ref+'" is not present in lecture blocks');
      if(ref.indexOf('f:')===0&&!declaredF[ref.slice(2)]&&!names[ref])
        issues.push('caseMap field "'+ref+'" is not present in lecture blocks');
    }
  }

  var exported={};
  cm.forEach(function(section){section.parts.forEach(function(part){exported[part[1]]=true;});});
  document.querySelectorAll('[data-f]').forEach(function(el){var ref='f:'+el.getAttribute('data-f');if(!exported[ref])issues.push('Unexported answer field: '+ref);});
  document.querySelectorAll('[data-pick]').forEach(function(el){var ref='p:'+el.getAttribute('data-pick');if(!exported[ref])issues.push('Unexported choice: '+ref);});
  LECTURE.units.forEach(function(u){if(u.showIf&&u.showIf.thin&&u.showIf.minKey&&!Object.prototype.hasOwnProperty.call(LECTURE.thresholds,u.showIf.minKey))issues.push('Unknown threshold key in '+u.k);});
  for(var img in usedImg)
    if(!Object.prototype.hasOwnProperty.call(FIG,img)) issues.push('figure key "'+img+'" is used but missing from FIG');

  var keys={};
  for(var u=0;u<(LECTURE.units||[]).length;u++){
    var uk=LECTURE.units[u].k;
    if(keys[uk]) issues.push('duplicate unit key "'+uk+'"');
    keys[uk]=1;
  }

  var unresolved=(document.getElementById('deck').innerHTML.match(/\{\{\s*[^}]+\s*\}\}/g)||[]);
  if(unresolved.length) issues.push('unresolved context token(s): '+unresolved.join(', '));

  var report={ok:issues.length===0,issues:issues,fields:Object.keys(declaredF).length,
    pickers:Object.keys(declaredP).length,figures:Object.keys(usedImg).length,units:(LECTURE.units||[]).length};
  try{
    if(window.console){
      if(report.ok){ if(typeof console.info==='function') console.info('[ISCARB sanity] OK',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] OK',report); }
      else { if(typeof console.warn==='function') console.warn('[ISCARB sanity] '+issues.length+' issue(s)',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] '+issues.length+' issue(s)',report); }
    }
  }catch(e){}
  window.ISCARB_SANITY_REPORT=report;
  return report;
}

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;
}
/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=policyThreshold(c,'thinDefault');
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}
  return true;
}
function go(i,force){

    var d=(i>cur)?1:-1, j=i;

    if(j<0||j>=U.length) return;

  var live=document.getElementById('tLive');

function resolve(ref){
  if(ref==='@preparation'){
    var prep=LECTURE.preparation,gaps=uncitedPages();
    return strip(T(prep.source))+'\nReading: '+(gaps.length?'pages '+fmtRanges(gaps)+' were not cited during this lecture.':'No uncited pages; review sections marked touched.')+
      '\nDue: '+strip(T(prep.due))+'. Review the ledger at '+prep.ledger+' and bring the decision card.';
  }
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' -> '):'';
  if(ref==='@matrix'){var n=['','Known / managed','Known / unmanaged','Unknown / monitor'],o=[];
    for(var k in S.mx){if(S.mx[k])o.push(k.replace('x',' x ')+' = '+n[S.mx[k]]);} return o.join('; ');}
  if(ref==='@gates'){var c=0,p=[];for(var i=0;i<GATE_DEFS.length;i++){if(S.gates[GATE_DEFS[i][0]]){c++;p.push(GATE_DEFS[i][1]);}}
    return c+' of '+GATE_DEFS.length+' gates passed'+(p.length?' ('+p.join(', ')+')':'');}
  if(ref==='@jahtest'){var QT=LECTURE.jahtest; if(!QT) return '';
    var r=0,d=0,miss=[];
    for(var i=0;i<QT.items.length;i++){var c=S.quiz?S.quiz[i]:undefined;
      if(c!==undefined&&c!==null){d++; if(c===QT.items[i].a) r++; else miss.push('item '+(i+1)+' ('+QT.items[i].lo+')');}}
    if(!d) return '';
    return r+' correct of '+d+' answered'+(miss.length?'\nMissed: '+miss.join('; '):'');}
  if(ref==='@signed'){var o=[];
    for(var i=0;i<SIGN.length;i++){var r=S.sign&&S.sign[SIGN[i].id];
      if(r) o.push((SIGN[i].label||SIGN[i].id)+' — signed '+r.at);}
    return o.join('\n');}
  if(ref==='@coverage'){var rr=coverageRows(); if(!rr.length) return '';
    var o=[],op=[];
    for(var i=0;i<rr.length;i++){
      o.push(rr[i].s.k+' '+rr[i].s.t+': '+rr[i].st+(rr[i].units.length?' ('+rr[i].units.join(', ')+')':''));
      if(rr[i].st==='open') op.push(rr[i].s.k+(rr[i].s.why?' — '+rr[i].s.why:''));
    }
    return o.join('\n')+(op.length?'\nOut of scope for this hour: '+op.join('; '):'');}
  if(ref==='@clo'){var R=LECTURE.readiness||[],o=[];
    for(var i=0;i<R.length;i++) o.push(R[i].clo+': '+(cloOk(R[i])?'supported':'not supported'));
    return o.join('; ');}
  if(ref==='@marks'){var o=[];for(var k in (S.marks||{})){if(S.marks[k]&&S.marks[k].length)o.push(k+': '+S.marks[k].length+' region(s) marked');}return o.join('; ');}
  if(ref==='@aigate'){var a=S.ai||{};if(!a.q1)return '';
    var v='';
    if(a.q1==='n') v='PERMITTED — preparation only';
    else if(!a.q2||(a.q2==='n'&&!a.q2b)||!a.q3) return '';
    else if(a.q2==='y'&&a.q3==='y') v='PERMITTED as prepared evidence';
    else if(a.q2==='n'&&a.q2b==='y'&&a.q3==='y') v='PERMITTED, CONDITIONALLY — the TEST is the evidence, not the output';
    else v='NOT PERMITTED — rework before it enters the chain';
    return 'Evidence chain: '+(a.q1==='y'?'yes':'no')+
      ' · Re-derivable: '+(a.q2||'-')+
      ' · Testable: '+(a.q2b||'-')+
      ' · Named signer: '+(a.q3||'-')+
      '\nGate verdict: '+v;}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){
  var L=LECTURE, o=[];
  var line=function(x){o.push(x===undefined?'':x);};
  line('# '+strip(T(L.title))+' — course file extract');
  line('');
  line('Course: '+strip(T(L.course))+'  |  Source: '+strip(T(L.source)));
  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');
  line('lecture and rendered by the same engine that teaches it.');
  line('');
  line('Cut points ('+L.units.filter(function(u){return u.cut;}).length+'): '+L.units.filter(function(u){return u.cut;}).map(function(u){return u.k;}).join(', '));
  line('Scaffolding thresholds: '+JSON.stringify(L.thresholds));
  line('');
  line('## 1. Session outcomes, by unit');
  line('');
  line('| Unit | Rule | The student will be able to | Activity | Timebox |');
  line('|---|---|---|---|---|');
  for(var i=0;i<L.units.length;i++){
    var u=L.units[i]; if(!u.rule||!u.learn) continue;
    line('| '+u.k+' | '+strip(T(u.rule))+' | '+strip(T(u.learn))+' | '+strip(T(u.task||'—'))+' | '+(u.timebox||'—')+' |');
  }
  line('');
  line('## 2. Course and programme outcome map');
  line('');
  line('| CLO | PLO | Domain | Outcome | Evidence the student produces | Where |');
  line('|---|---|---|---|---|---|');
  for(var r=0;r<(L.readiness||[]).length;r++){
    var R=L.readiness[r], NAMES=L.fieldNames||{}, ev=[];
    for(var n=0;n<(R.needs||[]).length;n++) ev.push(NAMES[R.needs[n]]||R.needs[n]);
    line('| '+R.clo+' | '+(R.plo||'—')+' | '+(R.d||'')+' | '+strip(T(R.txt))+' | '+ev.join(', ')+' | '+strip(R.where||'')+' |');
  }
  line('');
  line('Assessment evidence is the artifact itself: the decision card the student');
  line('exports, whose sections are listed in §5. The closing unit reads the map');
  line('above off that artifact rather than off self-report.');
  line('');
  line('## 3. Source coverage');
  line('');
  var rows=coverageRows();
  if(rows.length){
    line('| Section | Pages | Status | Reached by |');
    line('|---|---|---|---|');
    for(var c=0;c<rows.length;c++){
      var R2=rows[c];
      line('| '+R2.s.k+' '+strip(R2.s.t)+' | '+R2.s.pp[0]+'–'+R2.s.pp[1]+' | '+R2.st+' | '+(R2.units.join(', ')||'—')+' |');
      if(R2.st==='open'&&R2.s.why) line('| | | out of scope | '+strip(R2.s.why)+' |');
    }
    var g=uncitedPages();
    if(g.length){ line(''); line('Pages within the source span that this session never cites: '+
      strip(fmtRanges(g))+'. Counted from the page citation on every card.'); }
  } else line('No coverage ledger declared.');
  line('');
  if(L.jahiziah){
    line('## 4. National alignment');
    line('');
    line(strip(T(L.jahiziah.gku))+' → '+strip(T(L.jahiziah.sku)));
    line('');
    line('| # | Outcome | Status | Where |');
    line('|---|---|---|---|');
    for(var j=0;j<(L.jahiziah.outcomes||[]).length;j++){
      var O=L.jahiziah.outcomes[j];
      line('| '+O.n+' | '+strip(T(O.txt))+' | '+O.s+' | '+strip(T(O.where||''))+' |');
    }
    line('');
    line('This states coverage only. It is not the national examination and');
    line('predicts nothing about any student\'s result on it.');
    line('');
  }
  line('## 5. The artifact each student leaves holding');
  line('');
  for(var m=0;m<(L.caseMap||[]).length;m++) line('- '+strip(T(L.caseMap[m].t)));
  line('');
  line('## 6. Accessibility and data');
  line('');
  line('- Runs as one HTML file with no install, no account and no network.');
  line('- Nothing a student types leaves their browser; there is no server to hold it.');
  line('- Full keyboard navigation; ? lists the keys. Text size adjustable 80–140%.');
  line('- Every status is carried by a word as well as a colour.');
  line('');
  line('Generated '+new Date().toISOString().slice(0,10)+' by the ISCARB lecture engine.');
  return o.join('\n');
}
function strip(x){
  if(x==null||x==='') return '';
  var s=String(x);
  var d=document.createElement('div'); d.innerHTML=s;
  s=(d.textContent||d.innerText||s).replace(/\s+/g,' ').trim();
  return s.replace(/\|/g,'\\|').trim();
}

/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}

   One button (or Q) auto-advances at a readable pace with a visible progress
   line on the bar — built for self-review, screen recording and sharing.

var QV={on:false,driving:false,total:0,left:0,last:0,raf:0};
function qvDwell(i){
  var u=U[i]; if(!u) return 7000;
  if(u.k==='TITLE') return 5000;
  if(u.k==='END') return 6500;
  var b=JSON.stringify(u.blocks||[]);

}

  b.setAttribute('data-on',QV.on?'1':'0');

}
function qvStep(ts){
  if(!QV.on) return;
  if(document.hidden){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  var ae=document.activeElement;
  if(ae&&/^(textarea|input)$/i.test(ae.tagName)){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  QV.left-=(ts-QV.last); QV.last=ts; qvPaint();
  if(QV.left<=0){
    if(cur>=U.length-1||!visibleInDirection(1)){ qvStop(); note('Quick view finished.'); return; }
    QV.driving=true; go(cur+1); QV.driving=false;
    QV.total=QV.left=qvDwell(cur); qvPaint();
  }
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStart(){
  QV.on=true; QV.total=QV.left=qvDwell(cur); QV.last=performance.now();
  qvLabel(); qvPaint();
  note('Quick view on — the deck turns itself. Q or Esc stops it.');
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStop(){
  if(!QV.on) return;

}

(function(){

function transformTables(root){

  var rows=Array.from(table.rows),heads=[];if(rows[0]&&rows[0].querySelector('th'))heads=Array.from(rows.shift().cells).map(function(c){return c.textContent.trim()});
  var replacement=el('div','v3-table');replacement.setAttribute('role','list');

 var prev=el('button','','‹'),label=el('span','v3-page-label'),next=el('button','','›');

function countPages(width,contentWidth,gap){return Math.max(1,Math.ceil((contentWidth+gap-1)/(width+gap)));}
function persist(state){if(initializing||state.index===undefined||state.index!==cur)return;try{localStorage.setItem(KEY+'-visual-location-v3',JSON.stringify({key:U[state.index].k,mode:state.mode,page:state.page}));}catch(e){}}
function measure(state){
 var flow=flowOf(state);if(!flow)return;
 var width=state.window.clientWidth||1000,gap=40;flow.style.setProperty('--page-width',width+'px');flow.style.width=width+'px';
 flow.style.setProperty('--page-height',(state.window.clientHeight||480)+'px');
 state.stride=width+gap;state.pages=countPages(width,flow.scrollWidth||width,gap);state.page=Math.min(Math.max(0,state.page),state.pages-1);

 state.pageLabel.textContent='Page '+(state.page+1)+' / '+state.pages;state.pagePrev.disabled=state.page===0;state.pageNext.disabled=state.page>=state.pages-1;
 state.modeButton.textContent=state.mode==='overview'?'Details':'Visual overview';state.modeButton.setAttribute('aria-label',state.mode==='overview'?'Show full explanation':'Return to visual overview');
 if(state.index!==undefined){var u=U[state.index],total=U.filter(function(x){return x.route===u.route}).length,pos=U.filter(function(x,i){return i<=state.index&&x.route===u.route}).length;

}
function show(state){

function setPage(state,page){if(!state)return;state.page=Math.max(0,Math.min(page,state.pages-1));show(state);var live=document.getElementById('tLive');if(live)live.textContent='Page '+(state.page+1)+' of '+state.pages;}

function diagram(nodes,kind){

function copySvg(svg,suffix){
 var copy=svg.cloneNode(true),ids={};copy.querySelectorAll('[id]').forEach(function(n){ids[n.id]=n.id+'-'+suffix;n.id=ids[n.id]});

}
function buildSummary(state){
 var u=U[state.index],spec=story.units[u.k],out=state.summary;if(!out)return;out.replaceChildren();
 if(u.k==='READING'){
  var intro=el('p','','Before the assignment and next discussion. Calendar dates are in Blackboard.');out.append(intro);

  });var actions=el('div','lp-actions'),check=el('button','lp-btn','Check the five objectives');check.dataset.jump='PREP';actions.append(check);out.append(actions);return;
 }
 if(u.k==='TITLE'||u.k==='START'){

  c.append(el('h2','',u.k==='TITLE'?plain(LECTURE.title):opening.headline));c.append(el('p','',u.k==='TITLE'?opening.headline:opening.case));
  if(u.k==='START')c.append(el('p','v3-decision',opening.question));
  var route=el('div','v3-mini-route');(u.k==='TITLE'?['See the problem','Explain the mechanism','Test your thinking','Defend a decision']:opening.nodes).forEach(function(t){route.append(el('span','',t))});c.append(route);
  if(u.k==='TITLE'){var a=el('div','lp-actions'),start=el('button','lp-btn','Start the case');start.dataset.jump='START';a.append(start);c.append(a)}
  if((state.window.clientWidth&&state.window.clientWidth<560)||(state.window.clientHeight&&state.window.clientHeight<480)){c.classList.add('v3-case-pages')}out.append(c);return;
 }
 if(!spec)return;
 var image=typeof FIG!=='undefined'&&FIG[spec.visual],native=null;
 if(!image&&['props','layers','rd'].includes(spec.visual))native=state.details.querySelector('.figwrap svg');
 var windowHeight=state.window.clientHeight||480,width=state.window.clientWidth||1000;
 // Split the diagram into labelled pages on compact screens instead of shrinking it.
 var maxNodes=width<560?Math.max(1,Math.min(3,Math.floor((windowHeight-110)/78))):5;
 var chunks=[];if(image||native)chunks=[spec.nodes];else for(var i=0;i<spec.nodes.length;i+=maxNodes)chunks.push(spec.nodes.slice(i,i+maxNodes));
 chunks.forEach(function(nodes,part){
  var page=el('section','v3-summary'),picture=el('div','v3-picture');
  if(image){picture.classList.add('has-source');var img=el('img');img.src=image;img.alt=plain(u.title)+'. '+spec.nodes.map(function(n){return n.join(': ')}).join('; ');picture.append(img)}

  page.append(picture,el('p','v3-takeaway',spec.takeaway+(chunks.length>1?' ('+(part+1)+'/'+chunks.length+')':'')));out.append(page);
  if(windowHeight<230){page.classList.add('v3-compact-summary');}
 });
}
function prepareSlide(u,i){
 var slide=deck.querySelector('[data-i="'+i+'"]'),fitEl=slide.querySelector('.fit'),area=slide.querySelector('.area'),top=slide.querySelector('.top');

[['prevBtn','Previous page or concept'],['nextBtn','Next page or concept']].forEach(function(item){var button=document.getElementById(item[0]);button.setAttribute('aria-label',item[1]);button.title=item[1];});
