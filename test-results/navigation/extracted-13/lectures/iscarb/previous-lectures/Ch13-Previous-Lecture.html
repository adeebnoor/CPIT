ecuting system may no longer be the system that was developed. Students who miss this write assignments full of security claims that ignore the dependency.", "appendix": false, "_iscarbRule": "X01 - Security and dependability", "route": "core", "showIf": null, "sourceRange": "3–19", "answer": "Security — a system property that reflects the system’s ability to protect itself from accidental or deliberate external attack. If a system is networked and insecure then statements about its reliability and safety are unreliable, because intrusion can change the executing system and/or its data. Confidentiality — information may be disclosed or made accessible to people not authorised. Integrity — information may be damaged or corrupted, making it unusual or unreliable. Availability — access normally available may not be possible. Tonight’s leak is a confidentiality failure. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Distinguish asset, attack, control, exposure, threat and vulnerability, and apply each one to tonight&rsquo;s leak.", "title": "Assets, threats, vulnerabilities and attacks", "sub": "The chapter&rsquo;s terminology is the vocabulary of every later sentence tonight. Get these wrong and every later sentence is wrong with them.", "blocks": [{"t": "compare", "head": ["Term", "What it is", "Tonight&rsquo;s Mentcare system"], "rows": [{"c": "teal", "cells": ["Asset", "Something of value which has to be protected.", "The celebrity&rsquo;s patient record."]}, {"c": "sand", "cells": ["Vulnerability", "A weakness that may be exploited to cause loss or harm.", "The weak password system &mdash; user IDs identical to names, dictionary-word passwords allowed."]}, {"c": "violet", "cells": ["Threat", "Circumstances with potential to cause loss or harm.", "An attacker guesses the celebrity&rsquo;s credentials and gains access."]}, {"c": "mag", "cells": ["Attack", "An exploitation of a system&rsquo;s vulnerability, generally deliberate.", "The impersonation of the authorised user using guessed credentials."]}, {"c": "sand", "cells": ["Exposure", "Possible loss or harm from a security breach.", "Loss of reputation; financial loss from legal action; future patients avoiding the clinic."]}, {"c": "green", "cells": ["Control", "A protective measure that reduces a vulnerability.", "A password checker that disallows proper names and dictionary words."]}]}, {"t": "wide", "c": "sand", "lab": "CLASSIFY TONIGHT&rsquo;S BREACH", "picker": {"g": "cause", "options": ["Asset", "Vulnerability", "Threat", "Attack", "Exposure", "Control"]}, "field": {"id": "cause_defeat", "core": false, "rows": 2, "ph": "Which term names the missing piece in tonight&rsquo;s security process &mdash; and what artifact would prove it existed?"}}, {"t": "principle", "c": "mag", "txt": "The control existed in the policy. It was never run. That is the gap &mdash; not the vocabulary, but the missing artifact."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Assets, threats, vulnerabilities and attacks. Two minutes. The room usually gets asset, vulnerability and attack right because they map to common usage. The trap is exposure vs threat &mdash; exposure is the loss that results, threat is the circumstance with potential to cause it. The celebrity&rsquo;s reputation loss is the exposure; the attacker guessing the password is the threat. Do not correct anyone; ask which column &ldquo;loss of reputation&rdquo; belongs in, and let the room reach it.", "appendix": false, "_iscarbRule": "X02 - Security terminology", "route": "core", "showIf": null, "sourceRange": "3–19", "answer": "The control existed in the policy. It was never run. That is the gap — not the vocabulary, but the missing artifact. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02A", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Distinguish the three security levels and the four threat types, and place tonight&rsquo;s breach in each.", "title": "Security levels and threat types", "sub": "The chapter distinguishes three security levels (infrastructure, application, operational) and four threat types (interception, interruption, modification, fabrication). Tonight&rsquo;s breach is one of each.", "blocks": [{"t": "figure", "img": "ch13_layers", "cap": "p.6 · system layers where security may be compromised", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "SYSTEM LAYERS", "lead": "Security may be compromised at any layer.", "txt": "Security can be compromised at the infrastructure layer (networks and shared services), the application layer (individual systems), or the operational layer (human use). Each layer needs its own controls &mdash; a breach at one layer must be caught by the next."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · INFRASTRUCTURE SECURITY", "lead": "Maintaining security of all systems and networks.", "txt": "Concerned with maintaining the security of all systems and networks that provide an infrastructure and a set of shared services to the organization. A systems management problem.", "src": "P1 · p.5"}, {"c": "sand", "lab": "2 · APPLICATION SECURITY", "lead": "Security of individual application systems.", "txt": "Concerned with the security of individual application systems or related groups of systems. A software engineering problem where the system is designed to resist attacks. <b>This is the focus of the chapter and of tonight.</b>", "src": "P1 · p.5 · p.7"}, {"c": "violet", "lab": "3 · OPERATIONAL SECURITY", "lead": "Secure operation and use of the organization&rsquo;s systems.", "txt": "Concerned with the secure operation and use of the organization&rsquo;s systems. Primarily a human and social issue &mdash; ensuring people do not take actions that may compromise security. Trade-off between security and effectiveness.", "src": "P1 · p.5 · p.9"}]}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "INTERCEPTION", "lead": "Attacker gains access to an asset.", "txt": "A threat that allows an attacker to gain access to an asset. Example: an attacker gains access to the records of an individual patient. <b>Tonight&rsquo;s breach.</b>", "src": "P1 · p.15"}, {"c": "sand", "lab": "INTERRUPTION", "lead": "Attacker makes part of the system unavailable.", "txt": "A threat that allows an attacker to make part of the system unavailable. Example: a denial of service attack on a database server so that database connections become impossible.", "src": "P1 · p.15"}, {"c": "violet", "lab": "MODIFICATION", "lead": "Attacker tampers with a system asset.", "txt": "A threat that allows an attacker to tamper with a system asset. Example: an attacker alters or destroys a patient record.", "src": "P1 · p.16"}, {"c": "mag", "lab": "FABRICATION", "lead": "Attacker inserts false information.", "txt": "A threat that allows an attacker to insert false information into a system. Example: false transactions added to a banking system that transfer money to the perpetrator&rsquo;s account.", "src": "P1 · p.16"}]}, {"t": "principle", "txt": "Three security levels, four threat types. Tonight&rsquo;s breach is an application-security interception threat &mdash; the most common kind."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Security levels and threat types. Two minutes. The room usually classifies the breach as an application-security issue because the password system is application code. The deeper answer is that it is also an operational-security failure: the password checker existed but nobody ran it. That is a human and social failure, not a code failure. The breach is an interception threat &mdash; the attacker gained access to the record without altering it. Do not correct anyone; ask which security level the missing control belongs to.", "appendix": false, "_iscarbRule": "X02A - Security levels and threat types", "route": "core", "showIf": null, "sourceRange": "3–19", "answer": "Security can be compromised at the infrastructure layer (networks and shared services), the application layer (individual systems), or the operational layer (human use). Each layer needs its own controls — a breach at one layer must be caught by the next. Concerned with maintaining the security of all systems and networks that provide an infrastructure and a set of shared services to the organization. A systems management problem. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X03", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain why security is a business issue, what a security policy contains, and the three risk assessments.", "title": "Organizational policies and risk assessment", "sub": "Security is expensive. Decisions are made in a cost-effective way: there is no point spending more than the value of an asset to keep it secure. The risk-based approach drives the entire engineering process.", "blocks": [{"t": "figure", "img": "ch13_riskproc", "cap": "p.33 · preliminary risk assessment process", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "THE PROCESS", "lead": "Eight steps from asset identification to requirements.", "txt": "The preliminary risk assessment process: asset identification, asset value assessment, exposure assessment, threat identification, attack assessment, control identification, feasibility assessment, security requirements definition. Each step feeds the next."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · SECURITY POLICY", "lead": "General information access strategies across the organization.", "txt": "Security policies should set out general information access strategies that apply across the organization. Not long technical documents &mdash; they inform everyone about security. From a security engineering perspective, the policy defines the security goals; the engineering process implements them.", "src": "P1 · p.22"}, {"c": "sand", "lab": "2 · WHAT THE POLICY CONTAINS", "lead": "Assets, protection levels, responsibilities, existing procedures.", "txt": "The assets that must be protected (not cost-effective to apply stringent security to all assets). The level of protection required for different asset types. The responsibilities of users, managers and the organization. Existing security procedures and technologies that should be maintained.", "src": "P1 · p.23-24"}, {"c": "violet", "lab": "3 · RISK-BASED APPROACH", "lead": "Three risk assessments across the lifecycle.", "txt": "<b>Preliminary risk assessment</b> &mdash; identify generic risks, decide if adequate security is achievable at reasonable cost. <b>Design risk assessment</b> &mdash; during development, informed by technical design. <b>Operational risk assessment</b> &mdash; focuses on use and human behavior, continues after installation.", "src": "P1 · p.25-28"}]}, {"t": "wide", "c": "sand", "lab": "THE RISK ASSESSMENT TONIGHT NEVER FINISHED", "lead": "The policy existed. The preliminary assessment identified the weak-password threat. The control was specified. Nobody ran it.", "txt": "Tonight&rsquo;s gap is not a missing policy &mdash; the policy required strong passwords. It is not a missing preliminary assessment &mdash; the weak-password threat was identified and the password checker was specified as the control. The gap is in the operational risk assessment: the control existed in the policy but was never run in operation. The process that would have caught this is the operational assessment that asks &ldquo;is the control actually being executed?&rdquo; &mdash; and that assessment was never done.", "field": {"id": "risk_assess", "core": false, "rows": 2, "ph": "For your verdict: which of the three risk assessments was skipped, and what artifact would it have produced?"}}, {"t": "principle", "txt": "A policy without an operational assessment is a wish. The engineering decision is not writing the policy &mdash; it is checking that the policy is being followed."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Organizational policies and risk assessment. Two minutes. The room usually says the preliminary assessment was skipped because the password checker was never specified. The deeper answer is that the preliminary assessment was done &mdash; the checker was specified &mdash; but the operational assessment was never run. The operational assessment asks whether controls in the policy are actually being executed in operation. That is the missing artifact. Do not correct anyone; ask which assessment checks that a control is being run, and whether it was done.", "appendix": false, "_iscarbRule": "X03 - Security and organizations", "route": "core", "showIf": null, "sourceRange": "20–28", "answer": "The preliminary risk assessment process: asset identification, asset value assessment, exposure assessment, threat identification, attack assessment, control identification, feasibility assessment, security requirements definition. Each step feeds the next. Security policies should set out general information access strategies that apply across the organization. Not long technical documents — they inform everyone about security. From a security engineering perspective, the policy defines the security goals; the engineering process implements them. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A database is an asset, a weak password is a vulnerability. What are the threat, attack and control?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "A threat is possible unauthorized access. An attack is an attempt to exploit the weak password. A control is a protection such as suitable authentication, with evidence that it is configured and tested.", "timebox": "60 sec", "appendix": false}, {"k": "X04", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the eight steps of the security risk assessment process, and identify where each one sits in the lifecycle.", "title": "The security risk-assessment process", "sub": "The chapter&rsquo;s process turns a system into a set of security requirements. The eight steps run from asset identification to requirements definition, and tonight&rsquo;s gap is at step 7.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · ASSET IDENTIFICATION", "lead": "Identify the key system assets to protect.", "txt": "Identify the key system assets (or services) that have to be protected. For Mentcare: the information system, the patient database, individual patient records.", "src": "P1 · p.34"}, {"c": "teal", "lab": "2 · ASSET VALUE ASSESSMENT", "lead": "Estimate the value of the identified assets.", "txt": "Estimate the value of the identified assets. For Mentcare: the information system is High value (required for all clinical consultations, potentially safety-critical); an individual record is normally Low but High for high-profile patients.", "src": "P1 · p.34 · p.36"}, {"c": "teal", "lab": "3 · EXPOSURE ASSESSMENT", "lead": "Assess the potential losses for each asset.", "txt": "Assess the potential losses associated with each asset. For Mentcare: financial loss from cancelled clinics, restoration costs, possible patient harm, loss of reputation.", "src": "P1 · p.34 · p.36"}, {"c": "teal", "lab": "4 · THREAT IDENTIFICATION", "lead": "Identify the most probable threats to the assets.", "txt": "Identify the most probable threats to the system assets. For Mentcare: an unauthorised user gains access as system user and accesses confidential information &mdash; probability High.", "src": "P1 · p.34 · p.37"}]}, {"t": "cards", "cols": 4, "items": [{"c": "sand", "lab": "5 · ATTACK ASSESSMENT", "lead": "Decompose threats into possible attacks.", "txt": "Decompose threats into possible attacks on the system and the ways these may occur. For Mentcare: password guessing, network interception of data transfer, spoof server.", "src": "P1 · p.35"}, {"c": "sand", "lab": "6 · CONTROL IDENTIFICATION", "lead": "Propose controls to protect each asset.", "txt": "Propose the controls that may be put in place to protect an asset. For Mentcare: biometric authentication, logging all changes to patient information, password checker.", "src": "P1 · p.35 · p.37"}, {"c": "mag", "lab": "7 · FEASIBILITY ASSESSMENT", "lead": "Assess technical feasibility and cost of controls.", "txt": "Assess the technical feasibility and cost of the controls. For Mentcare: biometric auth is high-cost with possible user resistance; logging is simple and transparent; password checker is low-cost and effective. <b>Tonight&rsquo;s gap: the password checker was assessed as feasible but never deployed.</b>", "src": "P1 · p.35 · p.37"}, {"c": "violet", "lab": "8 · SECURITY REQUIREMENTS", "lead": "Define the system security requirements.", "txt": "Define system security requirements. These can be infrastructure or application system requirements. For Mentcare: &ldquo;A password checker shall be made available and shall be run daily. Weak passwords shall be reported to system administrators.&rdquo; (p.53)", "src": "P1 · p.35 · p.53"}]}, {"t": "principle", "c": "mag", "txt": "The eight steps are not optional. A requirement written without steps 1-7 is a wish; a control assessed as feasible but never deployed is a process failure at step 7."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: The security risk-assessment process. Two minutes. The eight steps are the spine of the chapter. The room usually focuses on step 8 (the requirement was written) but the deeper answer is that step 7 (feasibility) was done &mdash; the checker was assessed as low-cost and effective &mdash; but the operational follow-through was missing. The requirement existed on paper; the control did not exist in operation. That is the gap, and the verdict is what closes it.", "appendix": false, "_iscarbRule": "X04 - The security risk assessment process", "route": "core", "showIf": null, "sourceRange": "20–28", "answer": "Identify the key system assets (or services) that have to be protected. For Mentcare: the information system, the patient database, individual patient records. Estimate the value of the identified assets. For Mentcare: the information system is High value (required for all clinical consultations, potentially safety-critical); an individual record is normally Low but High for high-profile patients. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X05", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Read the chapter&rsquo;s four security requirements for Mentcare, and identify which one tonight reached.", "title": "Testable security requirements", "sub": "The source p.38 gives four security requirements for the Mentcare system. Tonight&rsquo;s incident reached the control behind the fifth requirement that the team never wrote.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE FOUR REQUIREMENTS (p.38)", "lead": "What the chapter specifies.", "txt": "<b>1.</b> Patient information shall be downloaded at the start of a clinic session to a secure area on the system client. <b>2.</b> All patient information on the system client shall be encrypted. <b>3.</b> Patient information shall be uploaded to the database after a clinic session has finished and deleted from the client computer. <b>4.</b> A log on a separate computer from the database server must be maintained of all changes made to the system database.", "src": "P1 · p.38"}, {"c": "mag", "lab": "THE FIFTH REQUIREMENT (p.53)", "lead": "What the team should have written but did not run.", "txt": "<b>5.</b> A password checker shall be made available and shall be run daily. Weak passwords shall be reported to system administrators. Access to the system shall only be allowed by approved client computers. All client computers shall have a single, approved web browser installed by system administrators.", "src": "P1 · p.53"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT REACHED THE GAP BETWEEN THE POLICY AND THE OPERATION", "lead": "The policy required strong passwords. The requirement was written. The checker was never run.", "txt": "The chapter&rsquo;s design risk assessment (p.50-53) identifies the weak-password vulnerability and derives requirement 5: a password checker that runs daily and reports weak passwords. The team&rsquo;s security policy included this requirement. The checker existed in the codebase. It was never run in operation. Tonight&rsquo;s leak is the direct consequence: the celebrity&rsquo;s dictionary-word password was never flagged, never reset, and was guessed by an attacker. The gap is not in the requirements &mdash; it is in the operational follow-through.", "field": {"id": "req_gap", "core": false, "rows": 2, "ph": "For your verdict: which requirement was written but never enforced, and what operational artifact would have caught it?"}}, {"t": "principle", "c": "mag", "txt": "A requirement that is written but not enforced is not a requirement. It is a sentence in a document."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Testable security requirements. Two minutes. This is the slide where the chapter&rsquo;s own case meets tonight&rsquo;s crisis &mdash; both are the Mentcare system. The room should reach the conclusion on its own: the password checker requirement existed (p.53), the checker existed in the codebase, but it was never run in operation. The verdict is what closes the gap: run the checker daily, report weak passwords, and reset them before they are guessed. That is the gap, and the verdict is what closes it.", "appendix": false, "_iscarbRule": "X05 - Security requirements for the Mentcare system", "route": "core", "showIf": null, "sourceRange": "29–43", "answer": "1. Patient information shall be downloaded at the start of a clinic session to a secure area on the system client. 2. All patient information on the system client shall be encrypted. 3. Patient information shall be uploaded to the database after a clinic session has finished and deleted from the client computer. 4. A log on a separate computer from the database server must be maintained of all changes made to the system database. 5. A password checker shall be made available and shall be run daily. Weak passwords shall be reported to system administrators. Access to the system shall only be allowed by approved client computers. All client computers shall have a single, approved web browser installed by system administrators. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X06", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Read a misuse case, distinguish it from a use case, and derive requirements from its mitigations.", "title": "Misuse cases", "sub": "A misuse case is an instance of a threat to a system. Like a use case but from the attacker&rsquo;s perspective &mdash; it defines the attack, the assets at risk, and the mitigations and requirements that follow.", "blocks": [{"t": "figure", "img": "ch13_misuse", "cap": "p.40 · misuse cases", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "MISUSE CASES", "lead": "The attacker&rsquo;s use case &mdash; for each threat type.", "txt": "A misuse case is an instance of a threat to a system. Interception: attacker gains access to an asset. Interruption: attacker makes part of the system unavailable. Modification: a system asset is tampered with. Fabrication: false information is added."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE USE CASE (p.41)", "lead": "What the receptionist does.", "txt": "<b>Transfer data:</b> A receptionist may transfer data from the Mentcare system to a general patient record database maintained by a health authority. The information transferred may be updated personal information or a summary of diagnosis and treatment. The receptionist must have appropriate security permissions.", "src": "P1 · p.41"}, {"c": "mag", "lab": "THE MISUSE CASE (p.42-43)", "lead": "What the attacker does to the same transfer.", "txt": "<b>Intercept transfer:</b> An attacker intercepts the data transfer between the receptionist&rsquo;s PC and the server and takes a copy of the data. <b>Attacks:</b> a network monitor is added and packets are intercepted; a spoof server is set up between the receptionist and the database. <b>Mitigations:</b> locked networking equipment, accredited engineers, encrypted transfers, certificate-based communication. <b>Requirement:</b> all communications must use SSL/https.", "src": "P1 · p.42-43"}]}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "INTERCEPTION MISUSE", "txt": "Attacker gains access to an asset during transfer."}, {"c": "sand", "lab": "INTERRUPTION MISUSE", "txt": "Attacker makes part of the system unavailable."}, {"c": "violet", "lab": "MODIFICATION MISUSE", "txt": "Attacker tampers with a system asset."}, {"c": "mag", "lab": "FABRICATION MISUSE", "txt": "Attacker inserts false information into a system."}]}, {"t": "wide", "c": "sand", "lab": "TONIGHT&rsquo;S MISUSE CASE", "lead": "The celebrity&rsquo;s record was not intercepted during transfer &mdash; it was accessed directly via a guessed password.", "field": {"id": "misuse_case", "core": false, "rows": 2, "ph": "Write tonight&rsquo;s misuse case in the chapter&rsquo;s format: actors, description, data (assets), attacks, mitigations, requirements."}}, {"t": "principle", "txt": "A misuse case is not a description of an attack. It is the bridge from a threat to a security requirement &mdash; actors, attack, assets, mitigations, requirements, in that order."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Misuse cases. Two minutes. The chapter&rsquo;s misuse case (p.42-43) is for the interception-during-transfer threat. Tonight&rsquo;s breach is a different misuse case: direct access via guessed password. Make every student write tonight&rsquo;s misuse case in the chapter&rsquo;s format &mdash; that is the bridge from threat terminology to a security requirement. The format is: actors (attacker, authorised user), description (attacker impersonates authorised user), data/assets (celebrity record), attacks (password guessing), mitigations (password checker, MFA, account lockout), requirements (daily password checker, lockout after N failed attempts). An empty misuse case is the gap staying open.", "appendix": false, "_iscarbRule": "X06 - Misuse cases", "route": "core", "showIf": null, "sourceRange": "29–43", "answer": "A misuse case is an instance of a threat to a system. Interception: attacker gains access to an asset. Interruption: attacker makes part of the system unavailable. Modification: a system asset is tampered with. Fabrication: false information is added. Transfer data: A receptionist may transfer data from the Mentcare system to a general patient record database maintained by a health authority. The information transferred may be updated personal information or a summary of diagnosis and treatment. The receptionist must have appropriate security permissions. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R11", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Reuse one threat-control-boundary chain in a different domain, and say what transfers and what breaks.", "title": "Design risk assessment", "sub": "Use the same threat-control-boundary chain twice &mdash; and the second time in a different domain.", "blocks": [{"t": "figure", "img": "ch13_distributed", "cap": "p.58 · distributed assets in equity trading", "right": [{"t": "cards", "cols": 1, "items": [{"c": "violet", "lab": "DISTRIBUTED ASSETS", "lead": "Distributing assets means an attack on one system does not lose all service.", "txt": "Distributing assets across platforms means attacks on one system do not necessarily lead to complete loss of service. Each platform has separate protection features and may differ so they do not share a common vulnerability. Particularly important if the risk of denial of service attacks is high."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MICRO-CASE &mdash; ISCARB SCAFFOLD", "txt": "The Mentcare system allowed user IDs identical to names and dictionary-word passwords. A celebrity record was leaked. Which vulnerability was exploited, which control should have caught it, and which design guideline was violated?", "field": {"id": "micro", "core": false, "rows": 3, "ph": "The vulnerability, the control, and the violated guideline"}}, {"c": "mag", "lab": "TRANSFER &mdash; THE BANKING FABRICATION CASE", "txt": "A banking system allows user IDs identical to email addresses and does not validate transaction recipients. An attacker inserts false transactions transferring money to their own account. Run the same chain: which vulnerability, which control, which guideline &mdash; and does your Mentcare reasoning survive the change of domain?", "field": {"id": "transfer", "core": false, "rows": 3, "ph": "The vulnerability, the control, the guideline, and what transfers or breaks between the two domains"}}]}, {"t": "wide", "c": "violet", "ic": "pin", "tag": "{{flag}} &nbsp;{{localTag}}", "lab": "WHY BOTH CASES ARE LOCAL", "lead": "The evidence has a named destination &mdash; and that is what takes &ldquo;accept the loss&rdquo; off the menu.", "txt": "Healthcare records and banking systems are both regulated public services in {{country}}. {{accreditor}} links the field to {{bodies}}. That makes security engineering a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording."}, {"t": "principle", "txt": "Mechanism -&gt; Evidence -&gt; Decision boundary"}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Design risk assessment. Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about healthcare has learned a case, not a capability. The banking fabrication case is the chapter&rsquo;s own example of a fabrication threat (p.16), so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "44–63", "answer": "Distributing assets across platforms means attacks on one system do not necessarily lead to complete loss of service. Each platform has separate protection features and may differ so they do not share a common vulnerability. Particularly important if the risk of denial of service attacks is high. The Mentcare system allowed user IDs identical to names and dictionary-word passwords. A celebrity record was leaked. Which vulnerability was exploited, which control should have caught it, and which design guideline was violated? Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "All functional tests pass. Does that show unauthorized users cannot access another tenant’s data?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "No. Add a negative authorization test across distinct users and tenants, check server-side enforcement, and inspect the resulting logs. Passing expected-use tests does not exercise every misuse case.", "timebox": "60 sec", "appendix": false}, {"k": "R09", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Name the ten design guidelines and identify which one tonight&rsquo;s system violated.", "title": "Ten secure design guidelines", "sub": "The chapter&rsquo;s ten design guidelines encapsulate good practice in secure systems design. They raise awareness and serve as a review checklist during validation.", "blocks": [{"t": "figure", "img": "ch13_vulncots", "cap": "p.52 · vulnerabilities from technology choices", "right": [{"t": "cards", "cols": 1, "items": [{"c": "sand", "lab": "COTS VULNERABILITIES", "lead": "Technology choices introduce vulnerabilities.", "txt": "The chapter&rsquo;s design risk assessment identifies vulnerabilities from COTS choices: name/password authentication (weak passwords), client-server with web browser clients (browser vulnerabilities), editable web forms (input validation). Each vulnerability drives a security requirement."}]}]}, {"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 · EXPLICIT POLICY", "lead": "Base security decisions on an explicit security policy.", "txt": "Define a security policy for the organization that sets out the fundamental security requirements that should apply to all organizational systems.", "src": "P1 · p.60-61"}, {"c": "teal", "lab": "2 · NO SINGLE POINT OF FAILURE", "lead": "Avoid a single point of failure.", "txt": "Ensure that a security failure can only result when there is more than one failure in security procedures. Example: password AND question-based authentication.", "src": "P1 · p.61"}, {"c": "teal", "lab": "3 · FAIL SECURELY", "lead": "When systems fail, sensitive information must not be accessible.", "txt": "When systems fail, for whatever reason, ensure that sensitive information cannot be accessed by unauthorized users even although normal security procedures are unavailable.", "src": "P1 · p.61"}, {"c": "teal", "lab": "4 · BALANCE SECURITY & USABILITY", "lead": "Avoid security that makes the system unusable.", "txt": "Try to avoid security procedures that make the system difficult to use. Sometimes you have to accept weaker security to make the system more usable.", "src": "P1 · p.62"}, {"c": "teal", "lab": "5 · LOG USER ACTIONS", "lead": "Maintain a log of user actions.", "txt": "Maintain a log of user actions that can be analyzed to discover who did what. If users know about such a log, they are less likely to behave in an irresponsible way.", "src": "P1 · p.62"}]}, {"t": "cards", "cols": 5, "items": [{"c": "sand", "lab": "6 · REDUNDANCY & DIVERSITY", "lead": "Keep multiple copies and use diverse infrastructure.", "txt": "Keep multiple copies of data and use diverse infrastructure so that an infrastructure vulnerability cannot be the single point of failure.", "src": "P1 · p.62"}, {"c": "sand", "lab": "7 · SPECIFY INPUT FORMATS", "lead": "Check all inputs against a specification.", "txt": "If input formats are known then you can check that all inputs are within range so that unexpected inputs don&rsquo;t cause problems.", "src": "P1 · p.63"}, {"c": "mag", "lab": "8 · COMPARTMENTALISE ASSETS", "lead": "Organise so users only access what they need.", "txt": "Organize the system so that assets are in separate areas and users only have access to the information that they need rather than all system information. <b>Tonight&rsquo;s gap: the celebrity&rsquo;s record was in the same compartment as every other record.</b>", "src": "P1 · p.63"}, {"c": "sand", "lab": "9 · DESIGN FOR DEPLOYMENT", "lead": "Design to avoid deployment problems.", "txt": "Design the system to avoid deployment problems &mdash; the password checker that could not be deployed was a deployment failure.", "src": "P1 · p.63"}, {"c": "sand", "lab": "10 · DESIGN FOR RECOVERABILITY", "lead": "Design to simplify recovery after an attack.", "txt": "Design the system to simplify recoverability after a successful attack.", "src": "P1 · p.63"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S VIOLATIONS", "lead": "At least three of the ten guidelines were violated tonight.", "txt": "<b>Guideline 2 (no single point of failure):</b> the password was the only authentication factor &mdash; one failure (a guessed password) was enough. <b>Guideline 5 (log user actions):</b> the access log existed but was not reviewed &mdash; the breach was not detected until the tabloid published. <b>Guideline 8 (compartmentalise assets):</b> the celebrity&rsquo;s record was in the same compartment as every other record &mdash; one guessed password gave access to all of them. <b>Guideline 9 (design for deployment):</b> the password checker existed in the codebase but was never deployed &mdash; a deployment failure the design did not anticipate.", "field": {"id": "guideline_violation", "core": false, "rows": 2, "ph": "For your verdict: which guidelines were violated, and what design change enforces each one?"}}, {"t": "principle", "txt": "The ten guidelines are not a checklist to tick. They are ten questions to ask of every design decision &mdash; and tonight&rsquo;s design failed at least three of them."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Ten secure design guidelines. Two minutes. The ten guidelines are the chapter&rsquo;s design checklist. The room usually picks guideline 2 (no single point of failure) because the password was the only factor. The deeper answer is guideline 8 (compartmentalise assets): the celebrity&rsquo;s record should have been in a separate compartment with additional authentication, so that a guessed password on a normal user account did not give access to it. That is what &ldquo;high-profile patient&rdquo; means in the asset value assessment (p.36). Do not correct anyone; ask which guideline would have protected the high-profile record even after the password was guessed.", "appendix": false, "_iscarbRule": "RULE 09 - Design guidelines for secure systems", "route": "core", "showIf": null, "sourceRange": "44–63", "answer": "The chapter’s design risk assessment identifies vulnerabilities from COTS choices: name/password authentication (weak passwords), client-server with web browser clients (browser vulnerabilities), editable web forms (input validation). Each vulnerability drives a security requirement. Define a security policy for the organization that sets out the fundamental security requirements that should apply to all organizational systems. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "B01", "rule": "", "phase": "LEARN", "accent": "violet", "learn": "Explain the three layers of protection and why a breach at one layer should be caught by the next.", "title": "Layered protection", "sub": "The chapter organises protection at platform level, application level and record level. Each layer adds controls so that a breach at one layer is caught by the next.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "architecture pattern, drawn from multiple source pages"}, "blocks": [{"t": "figure", "img": "ch13_layered", "cap": "p.56 · layered protection architecture", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "LAYERED ARCHITECTURE", "lead": "Platform, application, record &mdash; defense in depth.", "txt": "A layered protection architecture organises controls at platform level (top-level controls on the platform), application level (specific protection built into the application), and record level (protection invoked when specific information is accessed). Each layer catches what the previous missed."}]}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · PLATFORM-LEVEL", "lead": "Top-level controls on the platform.", "txt": "Top-level controls on the platform on which a system runs. Example: operating system hardening, network firewalls, approved client computers only. The outermost layer &mdash; if breached, the application layer should still hold.", "src": "P1 · p.55"}, {"c": "sand", "lab": "2 · APPLICATION-LEVEL", "lead": "Specific protection built into the application.", "txt": "Specific protection mechanisms built into the application itself. Example: password checker, session management, input validation, audit logging. <b>Tonight&rsquo;s gap is here.</b>", "src": "P1 · p.55"}, {"c": "violet", "lab": "3 · RECORD-LEVEL", "lead": "Protection invoked when specific information is accessed.", "txt": "Protection that is invoked when access to specific information is requested. Example: encryption of individual patient records, role-based access control on individual fields. The innermost layer &mdash; if the application layer is breached, the record layer should still hold.", "src": "P1 · p.55"}]}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "WHAT TONIGHT CAUGHT", "txt": "Nothing at platform level &mdash; the attacker accessed the system through the application layer."}, {"c": "mag", "lab": "WHAT TONIGHT MISSED", "txt": "The application-level control (password checker) was never run &mdash; the breach passed straight through."}, {"c": "violet", "lab": "WHAT WOULD HAVE SAVED IT", "txt": "Record-level encryption of the celebrity&rsquo;s patient record &mdash; even if accessed, the data would be unreadable without the key."}]}, {"t": "principle", "c": "mag", "txt": "Defense in depth is not three controls. It is the property that a breach at one layer is caught by the next. Tonight&rsquo;s system had one layer &mdash; and it was not running."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Layered protection. Ninety seconds. The slide exists because students confuse layered protection with redundant controls. Layered protection is not three copies of the same control &mdash; it is three different controls at three different layers, so that a breach at one is caught by the next. Tonight&rsquo;s system had the application-level control (password checker) but never ran it, and had no record-level encryption. A breach at the application layer passed straight through to the record. That is the opposite of defense in depth.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "44–63", "answer": "A layered protection architecture organises controls at platform level (top-level controls on the platform), application level (specific protection built into the application), and record level (protection invoked when specific information is accessed). Each layer catches what the previous missed. Top-level controls on the platform on which a system runs. Example: operating system hardening, network firewalls, approved client computers only. The outermost layer — if breached, the application layer should still hold. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X09", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain why security vulnerabilities are language-specific, and how the eight dependable programming guidelines reduce them.", "title": "Secure programming", "sub": "Vulnerabilities are often language-specific. The eight dependable programming guidelines from Ch.11 apply here too &mdash; the same code that is reliable is also more secure.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "LANGUAGE-SPECIFIC VULNERABILITIES", "lead": "Different languages, different vulnerabilities.", "txt": "Vulnerabilities are often language-specific. Array bound checking is automatic in Java so this is not a vulnerability that can be exploited in Java programs. However, millions of programs are written in C and C++ as these allow for the development of more efficient software &mdash; so simply avoiding these languages is not a realistic option.", "src": "P1 · p.65"}, {"c": "sand", "lab": "SECURITY AND RELIABILITY", "lead": "Reliability improvements also improve security.", "txt": "Security vulnerabilities are closely related to program reliability. Programs without array bound checking can crash so actions taken to improve program reliability can also improve system security. The eight dependable programming guidelines from Ch.11 (visibility, input checks, exception handlers, etc.) reduce both faults and security vulnerabilities.", "src": "P1 · p.65-66"}]}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · VISIBILITY", "lead": "Limit what each component can see.", "txt": "Program components should only access data they need. A component that cannot see the celebrity&rsquo;s record cannot leak it."}, {"c": "teal", "lab": "2 · INPUT VALIDITY", "lead": "Check all inputs against a specification.", "txt": "Specifications rarely define what to do if an input is inconsistent. Always check inputs &mdash; range, size, representation, reasonableness. Buffer overflow attacks exploit unchecked inputs."}, {"c": "teal", "lab": "3 · EXCEPTION HANDLERS", "lead": "Provide a handler for all exceptions.", "txt": "An unhandled exception may expose sensitive information in an error message. Fail securely &mdash; the handler should not leak state."}, {"c": "mag", "lab": "6 · ARRAY BOUNDS", "lead": "Check array bounds &mdash; always.", "txt": "In C, you can address memory outside an array declaration. This is the bounded-buffer vulnerability &mdash; attackers write executable code into memory by deliberately writing beyond the top of an array. <b>Tonight&rsquo;s system was COTS web technology, so this vulnerability is less relevant &mdash; but if the password checker had been written in C, this would be the first thing to audit.</b>"}]}, {"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "4 · ERROR-PRONE CONSTRUCTS", "lead": "Minimise goto, pointers, dynamic memory.", "txt": "These constructs are where security vulnerabilities live. Pointers referring to wrong memory areas can corrupt data; aliasing can make programs hard to audit."}, {"c": "teal", "lab": "5 · RESTART", "lead": "Provide restart capabilities.", "txt": "For systems with long transactions, provide a restart that does not leave sensitive data in memory. After a restart, the celebrity&rsquo;s record should not still be in the cache."}, {"c": "teal", "lab": "7 · TIMEOUTS", "lead": "Include timeouts on all external calls.", "txt": "In a distributed system, failure of a remote computer can be silent. Timeouts on authentication calls prevent denial-of-service by slow response."}, {"c": "teal", "lab": "8 · NAMED CONSTANTS", "lead": "Name all constants that represent real-world values.", "txt": "A magic number in a security check is a vulnerability waiting to happen. Name the threshold so it is auditable and changeable in one place."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S VULNERABILITY, REVISITED", "lead": "The weak-password vulnerability is not a programming vulnerability &mdash; it is a design and operational vulnerability.", "txt": "The chapter&rsquo;s eight guidelines are about code-level vulnerabilities: buffer overflow, unchecked inputs, unhandled exceptions, dangling pointers. Tonight&rsquo;s breach was not a code-level vulnerability &mdash; the password system worked as designed. The vulnerability was in the design (allowing dictionary-word passwords) and in the operation (never running the checker). The eight guidelines would not have caught tonight&rsquo;s breach. That is the lesson: secure programming is necessary but not sufficient. You also need secure design (the ten guidelines from R09) and secure operation (the operational risk assessment from X03).", "field": {"id": "prog_vuln", "core": false, "rows": 2, "ph": "For your verdict: which of the eight guidelines, if followed, would have made tonight&rsquo;s breach less likely &mdash; and which would not have helped?"}}, {"t": "principle", "txt": "Secure programming is necessary but not sufficient. The eight guidelines reduce code-level vulnerabilities; the ten design guidelines reduce design-level vulnerabilities; the operational assessment reduces operational vulnerabilities. All three are needed."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Secure programming. Two minutes. This slide is the bridge from the chapter&rsquo;s section 6 (secure programming) to tonight&rsquo;s crisis. The room usually picks input validity (guideline 2) because password strength is an input check. The deeper answer is that the password checker IS an input validity check &mdash; but it was never run. So the guideline was followed in the design but not in the operation. That connects back to X03 (operational risk assessment) and forward to R18 (security testing). A student who says &ldquo;we should follow the eight guidelines&rdquo; has not answered; push for which guideline, and whether it was followed in design, in operation, or both.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "64–72", "answer": "Vulnerabilities are often language-specific. Array bound checking is automatic in Java so this is not a vulnerability that can be exploited in Java programs. However, millions of programs are written in C and C++ as these allow for the development of more efficient software — so simply avoiding these languages is not a realistic option. Security vulnerabilities are closely related to program reliability. Programs without array bound checking can crash so actions taken to improve program reliability can also improve system security. The eight dependable programming guidelines from Ch.11 (visibility, input checks, exception handlers, etc.) reduce both faults and security vulnerabilities. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R18", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Name the four security validation approaches, the security checklist, and why security testing is hard.", "title": "Security testing and assurance", "sub": "A strong process removes operational ambiguity before the day it is needed &mdash; and knows where its tests stop.", "blocks": [{"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.13 &mdash; the four validation approaches", "items": [{"c": "teal", "lab": "1 · EXPERIENCE-BASED TESTING", "lead": "Review against known attack types.", "txt": "The system is reviewed and analysed against the types of attack that are known to the validation team. The team&rsquo;s experience is the limit &mdash; attacks they have not seen, they will not test for.", "src": "P1 · p.69"}, {"c": "teal", "lab": "2 · PENETRATION TESTING", "lead": "A team tries to breach the system.", "txt": "A team is established whose goal is to breach the security of the system by simulating attacks on the system. Also called pen testing or ethical hacking. The most realistic validation &mdash; but only as good as the pen test team&rsquo;s creativity.", "src": "P1 · p.69"}, {"c": "green", "lab": "3 · TOOL-BASED ANALYSIS", "lead": "Security tools analyse the system in operation.", "txt": "Various security tools such as password checkers are used to analyse the system in operation. Includes static analysers, vulnerability scanners, SIEM dashboards. Repeatable and automatable &mdash; but only finds the vulnerabilities the tool was built to find.", "src": "P1 · p.69"}, {"c": "teal", "lab": "4 · FORMAL VERIFICATION", "lead": "Verify against a formal security specification.", "txt": "The system is verified against a formal security specification. The strongest validation &mdash; but only as strong as the specification, and the specification is rarely complete for security (because attackers probe defenses the spec did not anticipate).", "src": "P1 · p.69"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "not in the chapter &mdash; your context", "items": [{"t": "wide", "c": "mag", "lab": "WHY SECURITY TESTING IS HARD", "lead": "Security requirements are &ldquo;shall not&rdquo; requirements. You cannot test for everything that should not happen.", "txt": "<b>Problem 1:</b> security requirements are &ldquo;shall not&rdquo; requirements &mdash; they specify what should not happen. It is not usually possible to define them as simple constraints that can be checked by the system. <b>Problem 2:</b> the people attacking a system are intelligent and look for vulnerabilities. They can experiment to discover weaknesses and loopholes that the validation team did not think to test. <b>The consequence:</b> security validation is never complete. The four approaches are complementary, not alternatives &mdash; you need all four, and even then you cannot prove the system is secure. You can only prove the system resists the attacks you have thought of."}]}}, {"t": "principle", "txt": "The line is not testing against not-testing. It is &ldquo;the attacks you have thought of&rdquo; against &ldquo;the attacks you have not&rdquo;."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Security testing and assurance. Penetration testing is the approach that survives security certification best, because it is the only one that simulates an intelligent adversary. Say that &mdash; it is the one thing on this slide students can use in their project next week. <b>Then spend a full minute on the magenta card.</b> The crisis that opened the hour was a breach the team did not test for, and the room has spent seventy minutes arguing about the system without once asking which validation approach would have caught it. That is the most common mistake in industry as well as in the classroom: the breach gets attributed to the control that failed rather than to the validation approach that did not simulate the attack. Three answers to look for &mdash; a penetration test that simulates password guessing, a tool-based password checker that runs in CI, and an experience-based review that asks &ldquo;what attacks do we know about that this system is vulnerable to?&rdquo;. A student who says &ldquo;we would have tested more&rdquo; has not answered; push for which of the four approaches.", "appendix": false, "_iscarbRule": "RULE 18 - Security testing and validation", "route": "core", "showIf": null, "sourceRange": "64–72", "answer": "The system is reviewed and analysed against the types of attack that are known to the validation team. The team’s experience is the limit — attacks they have not seen, they will not test for. A team is established whose goal is to breach the security of the system by simulating attacks on the system. Also called pen testing or ethical hacking. The most realistic validation — but only as good as the pen test team’s creativity. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "A celebrity sports star&rsquo;s patient record was leaked from the Mentcare system to a tabloid at 22:14 on a holiday weekend."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is the security risk assessment report for the Mentcare system, signed by the project security engineer, with the \"weak password\" threat and its control (password checker) marked. It distinguishes a real gap in the security process from a single incident. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "READING", "title": "Required self-study · pages, purpose and deadline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Required self-study · before the assignment and next chapter discussion.</b> Read the two selections below, attempt the five-question check, and use one assigned source slide to support the assignment artifact. Blackboard provides the calendar deadline.</p><p><b>Time budget:</b> initially 15–25 minutes including the check; record actual time. These replace unfocused source browsing. The original source ledger remains available for clarification and unfinished classroom topics.</p></div><div class=\"lp-reading-row\"><h3>Misuse cases and requirements</h3><p>Original source slides 40–43</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"40\">Slide 40</button><button class=\"lp-btn\" data-source-slide=\"41\">Slide 41</button><button class=\"lp-btn\" data-source-slide=\"42\">Slide 42</button><button class=\"lp-btn\" data-source-slide=\"43\">Slide 43</button></div></div><div class=\"lp-reading-row\"><h3>Secure design principles</h3><p>Original source slides 44–47</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"44\">Slide 44</button><button class=\"lp-btn\" data-source-slide=\"45\">Slide 45</button><button class=\"lp-btn\" data-source-slide=\"46\">Slide 46</button><button class=\"lp-btn\" data-source-slide=\"47\">Slide 47</button></div></div><p class=\"lp-study-note\"><b>Observable work:</b> identify the source slide and explain how its concept changes or supports your artifact. A citation or a checked box alone is insufficient. In the next class, be ready to explain a related example in your own words.</p><p class=\"lp-study-note\"><b>Assessment scope:</b> all five chapter objectives, the classroom route and these named selections. Full source examples support this scope; archived administrative/title slides and optional toolkit activities are not extra assessed requirements. The instructor must announce any further assigned source topic in Blackboard before assessing it.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"PREP\">Attempt the five-objective check</button><button class=\"lp-btn\" data-jump=\"C01\">Full source map</button></div>"}], "noAnswer": true, "appendix": true}, {"k": "PREP", "title": "Check all five objectives", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<p class=\"lp-study-note\">One question per chapter objective, in the same order as the five objectives. Attempt all five before opening feedback. Retry after reviewing an error. This public practice is not a secure test; the instructor uses a changed example during class.</p><form id=\"prepQuiz\" class=\"lp-prep\"><fieldset><legend>LO 1 · Which is a vulnerability?</legend><label><input type=\"radio\" name=\"prep-0\" value=\"0\">A valuable student record</label><label><input type=\"radio\" name=\"prep-0\" value=\"1\">A possible unauthorized disclosure</label><label><input type=\"radio\" name=\"prep-0\" value=\"2\">A missing server-side ownership check</label><p hidden data-prep-feedback id=\"prep-feedback-0\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 2 · A useful security requirement should identify:</legend><label><input type=\"radio\" name=\"prep-1\" value=\"0\">Protected action, authorized actor and observable enforcement</label><label><input type=\"radio\" name=\"prep-1\" value=\"1\">Only the product brand</label><label><input type=\"radio\" name=\"prep-1\" value=\"2\">Only an aspiration to be secure</label><p hidden data-prep-feedback id=\"prep-feedback-1\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 3 · What does a misuse case describe?</legend><label><input type=\"radio\" name=\"prep-2\" value=\"0\">Only expected successful behavior</label><label><input type=\"radio\" name=\"prep-2\" value=\"1\">An unwanted interaction or abuse to address</label><label><input type=\"radio\" name=\"prep-2\" value=\"2\">A list of all database columns</label><p hidden data-prep-feedback id=\"prep-feedback-2\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 4 · Which is consistent with secure defaults?</legend><label><input type=\"radio\" name=\"prep-3\" value=\"0\">Grant access when the policy service times out</label><label><input type=\"radio\" name=\"prep-3\" value=\"1\">Rely only on hiding a button</label><label><input type=\"radio\" name=\"prep-3\" value=\"2\">Deny unauthorized access and handle failure explicitly</label><p hidden data-prep-feedback id=\"prep-feedback-3\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 5 · A cross-user request is rejected in one endpoint. What follows?</legend><label><input type=\"radio\" name=\"prep-4\" value=\"0\">That path is supported by evidence; other paths remain to be checked</label><label><input type=\"radio\" name=\"prep-4\" value=\"1\">Every endpoint is secure</label><label><input type=\"radio\" name=\"prep-4\" value=\"2\">Logging sensitive tokens is now safe</label><p hidden data-prep-feedback id=\"prep-feedback-4\" class=\"prep-feedback\"></p></fieldset><button type=\"button\" class=\"lp-btn\" id=\"checkPrep\">Check my five answers</button><div id=\"prepStatus\" role=\"status\" aria-live=\"polite\">Attempt first. Feedback is initially hidden.</div></form>"}], "noAnswer": true, "appendix": true}, {"k": "C01", "title": "Source coverage and study checklist", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>72 supplied slides indexed.</b> Every original topic has a classroom location and a source review location. This map records material availability, not time actually taught or student mastery.</p><p>Five chapter objectives connect to supplied syllabus CLO 2, 5. Original concepts remain required even when detailed examples are completed after class.</p></div><div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Original topic</th><th>Source slides</th><th>Classroom location</th><th>Full source</th></tr></thead><tbody><tr><td>Opening and source outline</td><td>1–2</td><td><button class=\"lp-btn\" data-jump=\"START\">Your route through this chapter</button></td><td><button class=\"lp-btn\" data-jump=\"SRC00\">Read source</button></td></tr><tr><td>Security concepts, levels and threats</td><td>3–19</td><td><button class=\"lp-btn\" data-jump=\"X01\">Security and dependability</button> · <button class=\"lp-btn\" data-jump=\"X02\">Assets, threats, vulnerabilities and attacks</button> · <button class=\"lp-btn\" data-jump=\"X02A\">Security levels and threat types</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Policies and risk assessment</td><td>20–28</td><td><button class=\"lp-btn\" data-jump=\"X03\">Organizational policies and risk assessment</button> · <button class=\"lp-btn\" data-jump=\"X04\">The security risk-assessment process</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Requirements and misuse cases</td><td>29–43</td><td><button class=\"lp-btn\" data-jump=\"X05\">Testable security requirements</button> · <button class=\"lp-btn\" data-jump=\"X06\">Misuse cases</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Secure design and architecture</td><td>44–63</td><td><button class=\"lp-btn\" data-jump=\"R11\">Design risk assessment</button> · <button class=\"lp-btn\" data-jump=\"R09\">Ten secure design guidelines</button> · <button class=\"lp-btn\" data-jump=\"B01\">Layered protection</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr><tr><td>Programming, testing and assurance</td><td>64–72</td><td><button class=\"lp-btn\" data-jump=\"X09\">Secure programming</button> · <button class=\"lp-btn\" data-jump=\"R18\">Security testing and assurance</button></td><td><button class=\"lp-btn\" data-jump=\"SRC05\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch13-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 13 – Security Engineering</summary><div class=\"lp-source-text\"></div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\nSecurity and dependability\nSecurity and organizations\nSecurity requirements\nSecure systems design\nSecurity testing and assurance</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "Security concepts, levels and threats", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–19. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch13-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · Security engineering</summary><div class=\"lp-source-text\">Security engineering\nTools, techniques and methods to support the development and maintenance of systems that can resist malicious attacks that are intended to damage a computer-based system or its data.\nA sub-field of the broader field of computer security.</div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · Security dimensions</summary><div class=\"lp-source-text\">Security dimensions\nConfidentiality \nInformation in a system may be disclosed or made accessible to people or programs that are not authorized to have access to that information.  \nIntegrity \nInformation in a system may be damaged or corrupted making it unusual or unreliable. \nAvailability \nAccess to a system or its data that is normally available may not be possible.  \n</div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · Security levels</summary><div class=\"lp-source-text\">Security levels\nInfrastructure security, which is concerned with maintaining the security of all systems and networks that provide an infrastructure and a set of shared services to the organization. \nApplication security, which is concerned with the security of individual application systems or related groups of systems.\nOperational security, which is concerned with the secure operation and use of the organization’s systems.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · System layers where security may be compromised </summary><div class=\"lp-source-text\">System layers where security may be compromised </div></details><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · Application/infrastructure security</summary><div class=\"lp-source-text\">Application/infrastructure security\nApplication security is a software engineering problem where the system is designed to resist attacks.\nInfrastructure security is a systems management problem where the infrastructure is configured to resist attacks.\nThe focus of this chapter is application security rather than infrastructure security.</div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · System security management</summary><div class=\"lp-source-text\">System security management\nUser and permission management\nAdding and removing users from the system and setting up appropriate permissions for users\nSoftware deployment and maintenance\nInstalling application software and middleware and configuring these systems so that vulnerabilities are avoided.\nAttack monitoring, detection and recovery\nMonitoring the system for unauthorized access, design strategies for resisting attacks and develop backup and recovery strategies.</div></details><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · Operational security</summary><div class=\"lp-source-text\">Operational security\nPrimarily a human and social issue\nConcerned with ensuring the people do not take actions that may compromise system security\nE.g. Tell others passwords, leave computers logged on\nUsers sometimes take insecure actions to make it easier for them to do their jobs\nThere is therefore a trade-off between system security and system effectiveness.</div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · Security and dependability</summary><div class=\"lp-source-text\">Security and dependability</div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · Security</summary><div class=\"lp-source-text\">Security\nThe security of a system is a system property that reflects the system’s ability to protect itself from accidental or deliberate external attack.\nSecurity is essential as most systems are networked so that external access to the system through the Internet is possible.\nSecurity is an essential pre-requisite for availability, reliability and safety.</div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Fundamental security</summary><div class=\"lp-source-text\">Fundamental security\nIf a system is a networked system and is insecure then statements about its reliability and its safety are unreliable.\nThese statements depend on the executing system and the developed system being the same. However, intrusion can change the executing system and/or its data.\nTherefore, the reliability and safety assurance is no longer valid.</div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · Security terminology </summary><div class=\"lp-source-text\">Security terminology </div><div class=\"lp-tablewrap\"><table><tr><td>Term</td><td>Definition</td></tr><tr><td>Asset</td><td>Something of value which has to be protected. The asset may be the software system itself or data used by that system.</td></tr><tr><td>Attack</td><td>An exploitation of a system’s vulnerability. Generally, this is from outside the system and is a deliberate attempt to cause some damage.</td></tr><tr><td>Control</td><td>A protective measure that reduces a system’s vulnerability. Encryption is an example of a control that reduces a vulnerability of a weak access control system</td></tr><tr><td>Exposure</td><td>Possible loss or harm to a computing system. This can be loss or damage to data, or can be a loss of time and effort if recovery is necessary after a security breach.</td></tr><tr><td>Threat</td><td>Circumstances that have potential to cause loss or harm. You can think of these as a system vulnerability that is subjected to an attack.</td></tr><tr><td>Vulnerability</td><td>A weakness in a computer-based system that may be exploited to cause loss or harm.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Examples of security terminology (Mentcare) </summary><div class=\"lp-source-text\">Examples of security terminology (Mentcare) </div><div class=\"lp-tablewrap\"><table><tr><td>Term</td><td>Example</td></tr><tr><td>Asset</td><td>The records of each patient that is receiving or has received treatment.</td></tr><tr><td>Exposure</td><td>Potential financial loss from future patients who do not seek treatment because they do not trust the clinic to maintain their data. Financial loss from legal action by the sports star. Loss of reputation.</td></tr><tr><td>Vulnerability</td><td>A weak password system which makes it easy for users to set guessable passwords. User ids that are the same as names.</td></tr><tr><td>Attack</td><td>An impersonation of an authorized user.</td></tr><tr><td>Threat</td><td>An unauthorized user will gain access to the system by guessing the credentials (login name and password) of an authorized user.</td></tr><tr><td>Control</td><td>A password checking system that disallows user passwords that are proper names or words that are normally included in a dictionary.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Threat types</summary><div class=\"lp-source-text\">Threat types\nInterception threats that allow an attacker to gain access to an asset. \nA possible threat to the Mentcare system might be a situation where an attacker gains access to the records of an individual patient.\nInterruption threats that allow an attacker to make part of the system unavailable. \nA possible threat might be a denial of service attack on a system database server so that database connections become impossible.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · Threat types</summary><div class=\"lp-source-text\">Threat types\nModification threats that allow an attacker to tamper with a system asset. \nIn the Mentcare system, a modification threat would be where an attacker alters or destroys a patient record.\nFabrication threats that allow an attacker to insert false information into a system. \nThis is perhaps not a credible threat in the Mentcare system but would be a threat in a banking system, where false transactions might be added to the system that transfer money to the perpetrator’s bank account. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · Security assurance</summary><div class=\"lp-source-text\">Security assurance\nVulnerability avoidance\nThe system is designed so that vulnerabilities do not occur. For example, if there is no external network connection then external attack is impossible\nAttack detection and elimination\nThe system is designed so that attacks on vulnerabilities are detected and neutralised before they result in an exposure. For example, virus checkers find and remove viruses before they infect a system\nExposure limitation and recovery\nThe system is designed so that the adverse consequences of a successful attack are minimised. For example, a backup policy allows damaged information to be restored</div></details><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · Security and dependability</summary><div class=\"lp-source-text\">Security and dependability\nSecurity and reliability \nIf a system is attacked and the system or its data are corrupted as a consequence of that attack, then this may induce system failures that compromise the reliability of the system. \nSecurity and availability \nA common attack on a web-based system is a denial of service attack, where a web server is flooded with service requests from a range of different sources. The aim of this attack is to make the system unavailable. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · Security and dependability</summary><div class=\"lp-source-text\">Security and dependability\nSecurity and safety \nAn attack that corrupts the system or its data means that assumptions about safety may not hold. Safety checks rely on analysing the source code of safety critical software and assume the executing code is a completely accurate translation of that source code. If this is not the case, safety-related failures may be induced and the safety case made for the software is invalid. \nSecurity and resilience  \nResilience is a system characteristic that reflects its ability to resist and recover from damaging events. The most probable damaging event on networked software systems is a cyberattack of some kind so most of the work now done in resilience is aimed at deterring, detecting and recovering from such attacks.\n</div></details>"}], "noAnswer": true, "sourceRange": "3–19", "appendix": true}, {"k": "SRC02", "title": "Policies and risk assessment", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 20–28. The source retains historical examples and word
