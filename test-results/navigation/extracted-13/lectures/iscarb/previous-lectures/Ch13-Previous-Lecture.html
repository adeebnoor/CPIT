ing. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch13-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Security and organizations</summary><div class=\"lp-source-text\">Security and organizations</div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · Security is a business issue</summary><div class=\"lp-source-text\">Security is a business issue\nSecurity is expensive and it is important that security decisions are made in a cost-effective way\nThere is no point in spending more than the value of an asset to keep that asset secure.\nOrganizations use a risk-based approach to support security decision making and should have a defined security policy based on security risk analysis\nSecurity risk analysis is a business rather than a technical process\n</div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · Organizational security policies</summary><div class=\"lp-source-text\">Organizational security policies\nSecurity policies should set out general information access strategies that should apply across the organization. \nThe point of security policies is to inform everyone in an organization about security so these should not be long and detailed technical documents. \nFrom a security engineering perspective, the security policy defines, in broad terms, the security goals of the organization. \nThe security engineering process is concerned with implementing these goals. \n\n</div></details><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · Security policies</summary><div class=\"lp-source-text\">Security policies\nThe assets that must be protected \nIt is not cost-effective to apply stringent security procedures to all organizational assets. Many assets are not confidential and can be made freely available. \nThe level of protection that is required for different types of asset \nFor sensitive personal information, a high level of security is required; for other information, the consequences of loss may be minor so a lower level of security is adequate. </div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · Security policies</summary><div class=\"lp-source-text\">Security policies\nThe responsibilities of individual users, managers and the organization \nThe security policy should set out what is expected of users e.g. strong passwords, log out of computers, office security, etc.\nExisting security procedures and technologies that should be maintained \nFor reasons of practicality and cost, it may be essential to continue to use existing approaches to security even where these have known limitations.  \n</div></details><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · Security risk assessment and management</summary><div class=\"lp-source-text\">Security risk assessment and management\nRisk assessment and management is concerned with assessing the possible losses that might ensue from attacks on the system and balancing these losses against the costs of security procedures that may reduce these losses.\nRisk management should be driven by an organisational security policy.\nRisk management involves\nPreliminary risk assessment\nLife cycle risk assessment\nOperational risk assessment</div></details><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Preliminary risk assessment</summary><div class=\"lp-source-text\">Preliminary risk assessment\nThe aim of this initial risk assessment is to identify generic risks that are applicable to the system and to decide if an adequate level of security can be achieved at a reasonable cost. \nThe risk assessment should focus on the identification and analysis of high-level risks to the system. \nThe outcomes of the risk assessment process are used to help identify security requirements.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · Design risk assessment</summary><div class=\"lp-source-text\">Design risk assessment\nThis risk assessment takes place during the system development life cycle and is informed by the technical system design and implementation decisions. \nThe results of the assessment may lead to changes to the security requirements and the addition of new requirements. \nKnown and potential vulnerabilities are identified, and this knowledge is used to inform decision making about the system functionality and how it is to be implemented, tested, and deployed. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · Operational risk assessment</summary><div class=\"lp-source-text\">Operational risk assessment\nThis risk assessment process focuses on the use of the system and the possible risks that can arise from human behavior. \nOperational risk assessment should continue after a system has been installed to take account of how the system is used. \nOrganizational changes may mean that the system is used in different ways from those originally planned. These changes lead to new security requirements that have to be implemented as the system evolves. \n</div></details>"}], "noAnswer": true, "sourceRange": "20–28", "appendix": true}, {"k": "SRC03", "title": "Requirements and misuse cases", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 29–43. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch13-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · Security requirements</summary><div class=\"lp-source-text\">Security requirements</div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · Security specification</summary><div class=\"lp-source-text\">Security specification\nSecurity specification has something in common with safety requirements specification – in both cases, your concern is to avoid something bad happening.\nFour major differences\nSafety problems are accidental – the software is not operating in a hostile environment. In security, you must assume that attackers have knowledge of system weaknesses\nWhen safety failures occur, you can look for the root cause or weakness that led to the failure. When failure results from a deliberate attack, the attacker may conceal the cause of the failure.\nShutting down a system can avoid a safety-related failure. Causing a shut down may be the aim of an attack.\nSafety-related events are not generated from an intelligent adversary. An attacker can probe defenses over time to discover weaknesses.</div></details><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · Types of security requirement</summary><div class=\"lp-source-text\">Types of security requirement\nIdentification requirements.\nAuthentication requirements.\nAuthorisation requirements.\nImmunity requirements.\nIntegrity requirements.\nIntrusion detection requirements.\nNon-repudiation requirements.\nPrivacy requirements.\nSecurity auditing requirements.\nSystem maintenance security requirements.</div></details><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · Security requirement classification</summary><div class=\"lp-source-text\">Security requirement classification\nRisk avoidance requirements set out the risks that should be avoided by designing the system so that these risks simply cannot arise.\nRisk detection requirements define mechanisms that identify the risk if it arises and neutralise the risk before losses occur.\nRisk mitigation requirements set out how the system should be designed so that it can recover from and restore system assets after some loss has occurred.  \n</div></details><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · The preliminary risk assessment process for security requirements </summary><div class=\"lp-source-text\">The preliminary risk assessment process for security requirements </div></details><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · Security risk assessment</summary><div class=\"lp-source-text\">Security risk assessment\nAsset identification\nIdentify the key system assets (or services) that have to be protected.\nAsset value assessment\nEstimate the value of the identified assets.\nExposure assessment\nAssess the potential losses associated with each asset.\nThreat identification\nIdentify the most probable threats to the system assets</div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · Security risk assessment</summary><div class=\"lp-source-text\">Security risk assessment\nAttack assessment\nDecompose threats into possible attacks on the system and the ways that these may occur.\nControl identification\nPropose the controls that may be put in place to protect an asset.\nFeasibility assessment\nAssess the technical feasibility and cost of the controls.\nSecurity requirements definition\nDefine system security requirements. These can be infrastructure or application system requirements.</div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · Asset analysis in a preliminary risk assessment report for the Mentcare system</summary><div class=\"lp-source-text\">Asset analysis in a preliminary risk assessment report for the Mentcare system</div><div class=\"lp-tablewrap\"><table><tr><td>Asset</td><td>Value</td><td>Exposure</td></tr><tr><td>The information system</td><td>High. Required to support all clinical consultations. Potentially safety-critical.</td><td>High. Financial loss as clinics may have to be canceled. Costs of restoring system. Possible patient harm if treatment cannot be prescribed.</td></tr><tr><td>The patient database</td><td>High. Required to support all clinical consultations. Potentially safety-critical.</td><td>High. Financial loss as clinics may have to be canceled. Costs of restoring system. Possible patient harm if treatment cannot be prescribed.</td></tr><tr><td>An individual patient record</td><td>Normally low although may be high for specific high-profile patients.</td><td>Low direct losses but possible loss of reputation.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · Threat and control analysis in a preliminary risk assessment report </summary><div class=\"lp-source-text\">Threat and control analysis in a preliminary risk assessment report </div><div class=\"lp-tablewrap\"><table><tr><td>Threat</td><td>Probability</td><td>Control</td><td>Feasibility</td></tr><tr><td>An unauthorized user gains access as system manager and makes system unavailable</td><td>Low</td><td>Only allow system management from specific locations that are physically secure.</td><td>Low cost of implementation but care must be taken with key distribution and to ensure that keys are available in the event of an emergency. </td></tr><tr><td>An unauthorized user gains access as system user and accesses confidential information</td><td>High</td><td>Require all users to authenticate themselves using a biometric mechanism.<br>Log all changes to patient information to track system usage.</td><td>Technically feasible but high-cost solution. Possible user resistance.<br>Simple and transparent to implement and also supports recovery.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Security requirements for the Mentcare system</summary><div class=\"lp-source-text\">Security requirements for the Mentcare system\nPatient information shall be downloaded at the start of a clinic session to a secure area on the system client that is used by clinical staff.\nAll patient information on the system client shall be encrypted.\nPatient information shall be uploaded to the database after a clinic session has finished and deleted from the client computer.\nA log on a separate computer from the database server must be maintained of all changes made to the system database.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · Misuse cases</summary><div class=\"lp-source-text\">Misuse cases\nMisuse cases are instances of threats to a system\nInterception threats\nAttacker gains access to an asset\nInterruption threats\nAttacker makes part of a system unavailable\nModification threats\nA system asset if tampered with\nFabrication threats\nFalse information is added to a system</div></details><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · Misuse cases</summary><div class=\"lp-source-text\">Misuse cases</div></details><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · Mentcare use case – Transfer data</summary><div class=\"lp-source-text\">Mentcare use case – Transfer data</div><div class=\"lp-tablewrap\"><table><tr><td>Mentcare system: Transfer data</td><td></td></tr><tr><td>Actors</td><td>Medical receptionist, Patient records system (PRS)</td></tr><tr><td>Description</td><td>A receptionist may transfer data from the Mentcare system to a general patient record database that is maintained by a health authority. The information transferred may either be updated personal information (address, phone number, etc.) or a summary of the patient’s diagnosis and treatment.</td></tr><tr><td>Data</td><td>Patient’s personal information, treatment summary.</td></tr><tr><td>Stimulus</td><td>User command issued by medical receptionist.</td></tr><tr><td>Response</td><td>Confirmation that PRS has been updated.</td></tr><tr><td>Comments</td><td>The receptionist must have appropriate security permissions to access the patient information and the PRS.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Mentcare misuse case: Intercept transfer</summary><div class=\"lp-source-text\">Mentcare misuse case: Intercept transfer</div><div class=\"lp-tablewrap\"><table><tr><td>Mentcare system: Intercept transfer (Misuse case)</td><td></td></tr><tr><td>Actors</td><td>Medical receptionist, Patient records system (PRS), Attacker</td></tr><tr><td>Description</td><td>A receptionist transfers data from his or her PC to the Mentcare system on the server. An attacker intercepts the data transfer and takes a copy of that data.</td></tr><tr><td>Data (assets)</td><td>Patient’s personal information, treatment summary</td></tr><tr><td>Attacks</td><td>A network monitor is added to the system and packets from the receptionist to the server are intercepted.<br>A spoof server is set up between the receptionist and the database server so that receptionist believes they are interacting with the real system.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · Misuse case: Intercept transfer</summary><div class=\"lp-source-text\">Misuse case: Intercept transfer</div><div class=\"lp-tablewrap\"><table><tr><td>Mentcare system: Intercept transfer (Misuse case)</td><td></td></tr><tr><td>Mitigations</td><td>All networking equipment must be maintained in a locked room. Engineers accessing the equipment must be accredited.<br>All data transfers between the client and server must be encrypted.<br>Certificate-based client-server communication must be used<br> </td></tr><tr><td>Requirements</td><td>All communications between the client and the server must use the Secure Socket Layer (SSL). The https protocol uses certificate based authentication and encryption.</td></tr></table></div></details>"}], "noAnswer": true, "sourceRange": "29–43", "appendix": true}, {"k": "SRC04", "title": "Secure design and architecture", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 44–63. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch13-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · Secure systems design</summary><div class=\"lp-source-text\">Secure systems design</div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · Secure systems design</summary><div class=\"lp-source-text\">Secure systems design\nSecurity should be designed into a system – it is very difficult to make an insecure system secure after it has been designed or implemented\nArchitectural design\nhow do architectural design decisions affect the security of a system?\nGood practice\nwhat is accepted good practice when designing secure systems?</div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · Design compromises</summary><div class=\"lp-source-text\">Design compromises\nAdding security features to a system to enhance its security affects other attributes of the system\nPerformance\nAdditional security checks slow down a system so its response time or throughput may be affected\nUsability\nSecurity measures may require users to remember information or require additional interactions to complete a transaction. This makes the system less usable and can frustrate system users.</div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · Design risk assessment</summary><div class=\"lp-source-text\">Design risk assessment\nRisk assessment while the system is being developed and after it has been deployed\nMore information is available - system platform, middleware and the system architecture and data organisation.\nVulnerabilities that arise from design choices may therefore be identified.</div></details><details class=\"lp-source-section\" id=\"source-slide-48\"><summary>Slide 48 · Design and risk assessment</summary><div class=\"lp-source-text\">Design and risk assessment</div></details><details class=\"lp-source-section\" id=\"source-slide-49\"><summary>Slide 49 · Protection requirements</summary><div class=\"lp-source-text\">Protection requirements\nProtection requirements may be generated when knowledge of information representation and system distribution\nSeparating patient and treatment information limits the amount of information (personal patient data) that needs to be protected\nMaintaining copies of records on a local client protects against denial of service attacks on the server\nBut these may need to be encrypted</div></details><details class=\"lp-source-section\" id=\"source-slide-50\"><summary>Slide 50 · Design risk assessment</summary><div class=\"lp-source-text\">Design risk assessment</div></details><details class=\"lp-source-section\" id=\"source-slide-51\"><summary>Slide 51 · Design decisions from use of COTS</summary><div class=\"lp-source-text\">Design decisions from use of COTS\nSystem users authenticated using a name/password combination.\nThe system architecture is client-server with clients accessing the system through a standard web browser.\nInformation is presented as an editable web form.</div></details><details class=\"lp-source-section\" id=\"source-slide-52\"><summary>Slide 52 · Vulnerabilities associated with technology choices </summary><div class=\"lp-source-text\">Vulnerabilities associated with technology choices </div></details><details class=\"lp-source-section\" id=\"source-slide-53\"><summary>Slide 53 · Security requirements</summary><div class=\"lp-source-text\">Security requirements\nA password checker shall be made available and shall be run daily. Weak passwords shall be reported to system administrators.\nAccess to the system shall only be allowed by approved client computers.\nAll client computers shall have a single, approved web browser installed by system administrators.</div></details><details class=\"lp-source-section\" id=\"source-slide-54\"><summary>Slide 54 · Architectural design</summary><div class=\"lp-source-text\">Architectural design\nTwo fundamental issues have to be considered when designing an architecture for security.\nProtection\nHow should the system be organised so that critical assets can be protected against external attack?\nDistribution\nHow should system assets be distributed so that the effects of a successful attack are minimized?\nThese are potentially conflicting\nIf assets are distributed, then they are more expensive to protect. If assets are protected, then usability and performance requirements may be compromised.</div></details><details class=\"lp-source-section\" id=\"source-slide-55\"><summary>Slide 55 · Protection</summary><div class=\"lp-source-text\">Protection\nPlatform-level protection\nTop-level controls on the platform on which a system runs.\nApplication-level protection\nSpecific protection mechanisms built into the application itself e.g. additional password protection.\nRecord-level protection\nProtection that is invoked when access to specific information is requested\nThese lead to a layered protection architecture</div></details><details class=\"lp-source-section\" id=\"source-slide-56\"><summary>Slide 56 · A layered protection architecture </summary><div class=\"lp-source-text\">A layered protection architecture </div></details><details class=\"lp-source-section\" id=\"source-slide-57\"><summary>Slide 57 · Distribution</summary><div class=\"lp-source-text\">Distribution\nDistributing assets means that attacks on one system do not necessarily lead to complete loss of system service\nEach platform has separate protection features and may be different from other platforms so that they do not share a common vulnerability\nDistribution is particularly important if the risk of denial of service attacks is high</div></details><details class=\"lp-source-section\" id=\"source-slide-58\"><summary>Slide 58 · Distributed assets in an equity trading system </summary><div class=\"lp-source-text\">Distributed assets in an equity trading system </div></details><details class=\"lp-source-section\" id=\"source-slide-59\"><summary>Slide 59 · Design guidelines for security engineering</summary><div class=\"lp-source-text\">Design guidelines for security engineering\nDesign guidelines encapsulate good practice in secure systems design\nDesign guidelines serve two purposes:\nThey raise awareness of security issues in a software engineering team. Security is considered when design decisions are made.\nThey can be used as the basis of a review checklist that is applied during the system validation process. \nDesign guidelines here are applicable during software specification and design</div></details><details class=\"lp-source-section\" id=\"source-slide-60\"><summary>Slide 60 · Design guidelines for secure systems engineering </summary><div class=\"lp-source-text\">Design guidelines for secure systems engineering </div><div class=\"lp-tablewrap\"><table><tr><td>Security guidelines</td><td></td></tr><tr><td>Base security decisions on an explicit security policy</td><td></td></tr><tr><td>Avoid a single point of failure</td><td> </td></tr><tr><td>Fail securely</td><td> </td></tr><tr><td>Balance security and usability</td><td> </td></tr><tr><td>Log user actions</td><td> </td></tr><tr><td>Use redundancy and diversity to reduce risk</td><td> </td></tr><tr><td>Specify the format of all system inputs</td><td> </td></tr><tr><td>Compartmentalize your assets</td><td> </td></tr><tr><td>Design for deployment</td><td> </td></tr><tr><td>Design for recoverability</td><td> </td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-61\"><summary>Slide 61 · Design guidelines 1-3</summary><div class=\"lp-source-text\">Design guidelines 1-3\nBase decisions on an explicit security policy\nDefine a security policy for the organization that sets out the fundamental security requirements that should apply to all organizational systems.\nAvoid a single point of failure\nEnsure that a security failure can only result when there is more than one failure in security procedures. For example, have password and question-based authentication.\nFail securely\nWhen systems fail, for whatever reason, ensure that sensitive information cannot be accessed by unauthorized users even although normal security procedures are unavailable.</div></details><details class=\"lp-source-section\" id=\"source-slide-62\"><summary>Slide 62 · Design guidelines 4-6</summary><div class=\"lp-source-text\">Design guidelines 4-6\nBalance security and usability\nTry to avoid security procedures that make the system difficult to use. Sometimes you have to accept weaker security to make the system more usable.\nLog user actions\nMaintain a log of user actions that can be analyzed to discover who did what. If users know about such a log, they are less likely to behave in an irresponsible way.\nUse redundancy and diversity to reduce risk\nKeep multiple copies of data and use diverse infrastructure so that an infrastructure vulnerability cannot be the single point of failure.</div></details><details class=\"lp-source-section\" id=\"source-slide-63\"><summary>Slide 63 · Design guidelines 7-10</summary><div class=\"lp-source-text\">Design guidelines 7-10\nSpecify the format of all system inputs\nIf input formats are known then you can check that all inputs are within range so that unexpected inputs don’t cause problems.\nCompartmentalize your assets\nOrganize the system so that assets are in separate areas and users only have access to the information that they need rather than all system information.\nDesign for deployment\nDesign the system to avoid deployment problems\nDesign for recoverability\nDesign the system to simplify recoverability after a successful attack.</div></details>"}], "noAnswer": true, "sourceRange": "44–63", "appendix": true}, {"k": "SRC05", "title": "Programming, testing and assurance", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 64–72. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch13-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-64\"><summary>Slide 64 · Secure systems programming</summary><div class=\"lp-source-text\">Secure systems programming\n</div></details><details class=\"lp-source-section\" id=\"source-slide-65\"><summary>Slide 65 · Aspects of secure systems programming</summary><div class=\"lp-source-text\">Aspects of secure systems programming\nVulnerabilities are often language-specific. \nArray bound checking is automatic in languages like Java so this is not a vulnerability that can be exploited in Java programs. \nHowever, millions of programs are written in C and C++ as these allow for the development of more efficient software so simply avoiding the use of these languages is not a realistic option.\nSecurity vulnerabilities are closely related to program reliability. \nPrograms without array bound checking can crash so actions taken to improve program reliability can also improve system security. \n</div></details><details class=\"lp-source-section\" id=\"source-slide-66\"><summary>Slide 66 · Dependable programming guidelines</summary><div class=\"lp-source-text\">Dependable programming guidelines</div><div class=\"lp-tablewrap\"><table><tr><td>Dependable programming guidelines<br><br>1.\tLimit the visibility of information in a program<br>2.\tCheck all inputs for validity<br>3.\tProvide a handler for all exceptions<br>4.\tMinimize the use of error-prone constructs<br>5.\tProvide restart capabilities<br>6.\tCheck array bounds<br>7.\tInclude timeouts when calling external components<br>8.\tName all constants that represent real-world values<br></td><td></td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-67\"><summary>Slide 67 · Security testing and assurance</summary><div class=\"lp-source-text\">Security testing and assurance</div></details><details class=\"lp-source-section\" id=\"source-slide-68\"><summary>Slide 68 · Security testing</summary><div class=\"lp-source-text\">Security testing\nTesting the extent to which the system can protect itself from external attacks.\nProblems with security testing\nSecurity requirements are ‘shall not’ requirements i.e. they specify what should not happen. It is not usually possible to define security requirements as simple constraints that can be checked by the system.\nThe people attacking a system are intelligent and look for vulnerabilities. They can experiment to discover weaknesses and loopholes in the system.</div></details><details class=\"lp-source-section\" id=\"source-slide-69\"><summary>Slide 69 · Security validation</summary><div class=\"lp-source-text\">Security validation\nExperience-based testing\nThe system is reviewed and analysed against the types of attack that are known to the validation team.\nPenetration testing\nA team is established whose goal is to breach the security of the system by simulating attacks on the system.\nTool-based analysis\nVarious security tools such as password checkers are used to analyse the system in operation.\nFormal verification\nThe system is verified against a formal security specification.</div></details><details class=\"lp-source-section\" id=\"source-slide-70\"><summary>Slide 70 · Examples of entries in a security checklist </summary><div class=\"lp-source-text\">Examples of entries in a security checklist \nSecurity checklist\n1. Do all files that are created in the application have appropriate access permissions? The wrong access permissions may lead to these files being accessed by unauthorized users.\n2. Does the system automatically terminate user sessions after a period of inactivity? Sessions that are left active may allow unauthorized access through an unattended computer.\n3. If the system is written in a programming language without array bound checking, are there situations where buffer overflow may be exploited? Buffer overflow may allow attackers to send code strings to the system and then execute them.\n4. If passwords are set, does the system check that passwords are ‘strong’? Strong passwords consist of mixed letters, numbers, and punctuation, and are not normal dictionary entries. They are more difficult to break than simple passwords.\n5. Are inputs from the system’s environment always checked against an input specification? Incorrect processing of badly formed inputs is a common cause of security vulnerabilities.</div></details><details class=\"lp-source-section\" id=\"source-slide-71\"><summary>Slide 71 · Key points</summary><div class=\"lp-source-text\">Key points\nSecurity engineering is concerned with how to develop systems that can resist malicious attacks\nSecurity threats can be threats to confidentiality, integrity or availability of a system or its data\nSecurity risk management is concerned with assessing possible losses from attacks and deriving security requirements to minimise losses\nTo specify security requirements, you should identify the assets that are to be protected and define how security techniques and technology should be used to protect these assets.</div></details><details class=\"lp-source-section\" id=\"source-slide-72\"><summary>Slide 72 · Key points</summary><div class=\"lp-source-text\">Key points\nKey issues when designing a secure systems architecture include organizing the system structure to protect key assets and distributing the system assets to minimize the losses from a successful attack.\nSecurity design guidelines sensitize system designers to security issues that they may not have considered. They provide a basis for creating security review checklists.\nSecurity validation is difficult because security requirements state what should not happen in a system, rather than what should. Furthermore, system attackers are intelligent and may have more time to probe for weaknesses than is available for security testing. </div></details>"}], "noAnswer": true, "sourceRange": "64–72", "appendix": true}, {"k": "R01", "answer": "One defensible request is the security risk assessment report for the Mentcare system, signed by the project security engineer, with the \"weak password\" threat and its control (password checker) marked. It distinguishes a real gap in the security process from a single incident. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming operation.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence a security decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "A celebrity sports star&rsquo;s patient record was leaked from the Mentcare system to a tabloid at 22:14 on a holiday weekend.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Continue, revert, or hold the system and ask for security evidence?", "txt": "The leak was traced to a guessed password. The system allowed user IDs identical to names, and the celebrity&rsquo;s password was a dictionary word. The security policy required strong passwords but the password checker was never run. Do you continue, revert, or hold the system and ask for the risk assessment?"}, {"c": "mag", "lab": "UNKNOWN", "lead": "The security policy says this cannot happen. Tonight it happened.", "txt": "The security policy was written for normal operation &mdash; and a tabloid paying for a celebrity record is not normal operation. The password checker existed in the policy. It was never run. That is the gap."}]}, {"t": "principle", "txt": "Security matters because most systems are networked and external access through the Internet is possible. Security is an essential prerequisite for availability, reliability and safety. The goal tonight is not certainty &mdash; it is a defensible boundary with a named threat behind it.", "src": "P1 · p.11"}], "timebox": "90 sec", "task": "Name the one piece of security evidence you would demand before letting the system run another hour.", "say": "You are the project security engineer on call. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching and is not a report of a real incident. Every rule tonight returns to this system. The classic mistake in a case lecture is explaining the terminology before the students feel the pressure of the decision.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers &mdash; and what you must prove", "sub": "Seven sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "SECURITY DEFINED", "txt": "What does &ldquo;secure&rdquo; mean?", "src": "P1 · p.3"}, {"c": "sand", "lab": "TERMINOLOGY", "txt": "Asset, attack, control, exposure, threat, vulnerability?", "src": "P1 · p.13"}, {"c": "teal", "lab": "THREAT TYPES", "txt": "What can an attacker do?", "src": "P1 · p.15"}, {"c": "sand", "lab": "RISK ASSESSMENT", "txt": "How do we decide what to protect?", "src": "P1 · p.25"}, {"c": "teal", "lab": "SECURE DESIGN", "txt": "How do we build it in?", "src": "P1 · p.44"}, {"c": "sand", "lab": "SECURITY TESTING", "txt": "How do we know it holds?", "src": "P1 · p.67"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish asset, attack, control, exposure, threat and vulnerability, and classify threats by type."}, {"c": "teal", "lab": "2", "txt": "Trace a security breach through the eight-step risk assessment process to the missing control."}, {"c": "teal", "lab": "3", "txt": "Specify security requirements using misuse cases and the risk avoidance/detection/mitigation classification."}, {"c": "mag", "lab": "4", "txt": "Build a bounded security verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the threat, asset value or control feasibility changes."}]}], "timebox": "90 sec", "task": "Note which of the six sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total, no more. This slide exists so nobody leaves tonight unsure what was in the chapter and what was not. Both the condensed and the full versions (R02, R03) remain in ISCARB Depth for anyone who wants the two-slide version back.", "appendix": true, "route": "toolkit"}, {"k": "R08", "answer": "The chapter's Mentcare preliminary risk assessment (p.36-37) identifies: Asset = patient database (High value, High exposure). Threat = unauthorised user gains access as system user and accesses confidential information (probability High). Control = require all users to authenticate using biometric mechanism; log all changes to patient information. Feasibility = biometric is technically feasible but high-cost with possible user resistance; logging is simple and transparent. The lesson for tonight: the risk assessment identified the threat and proposed controls. The team chose logging (low-cost) over biometric (high-cost) and never added the password checker. The risk assessment was adequate; the operational follow-through was not.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "Read the chapter&rsquo;s own risk assessment and identify the control that was proposed but not deployed.", "title": "The chapter&rsquo;s own risk assessment &mdash; and what was not deployed", "sub": "The source p.36-37 gives a worked preliminary risk assessment for Mentcare. Tonight&rsquo;s incident is the threat it identified &mdash; with the control it proposed but the team did not deploy.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE ASSET (p.36)", "lead": "Patient database: High value, High exposure.", "txt": "<b>Asset:</b> the patient database. <b>Value:</b> High &mdash; required to support all clinical consultations, potentially safety-critical. <b>Exposure:</b> High &mdash; financial loss as clinics may have to be cancelled, costs of restoring system, possible patient harm if treatment cannot be prescribed.", "src": "P1 · p.36"}, {"c": "mag", "lab": "THE THREAT & CONTROL (p.37)", "lead": "Unauthorised user gains access &mdash; probability High.", "txt": "<b>Threat:</b> an unauthorised user gains access as system user and accesses confidential information. <b>Probability:</b> High. <b>Control:</b> require all users to authenticate using a biometric mechanism; log all changes to patient information. <b>Feasibility:</b> biometric is technically feasible but high-cost with possible user resistance; logging is simple and transparent to implement.", "src": "P1 · p.37"}]}, {"t": "wide", "c": "violet", "lab": "THE QUESTION FOR TONIGHT", "lead": "The risk assessment identified the threat. The team chose logging over biometric. Nobody added the password checker.", "field": {"id": "airbus_lesson", "core": false, "rows": 3, "ph": "The risk assessment was adequate. What operational artifact would have ensured the controls it proposed were actually deployed?"}}, {"t": "principle", "txt": "A risk assessment that proposes controls is not a security process. A security process is one that deploys them."}], "timebox": "3 min", "task": "Name the control the risk assessment proposed but the team did not deploy, and the operational artifact that would have caught the gap.", "notes": "Three minutes. The point is not that the risk assessment was wrong &mdash; it was adequate. It identified the threat (probability High) and proposed controls (biometric, logging). The team chose logging (low-cost) over biometric (high-cost) and stopped there. The password checker &mdash; a third control that the chapter derives later in the design risk assessment (p.53) &mdash; was never proposed in the preliminary assessment and never deployed. The lesson: a preliminary assessment is not complete. The design assessment adds controls the preliminary assessment missed, and the operational assessment verifies they are deployed. A student who says &ldquo;the risk assessment was wrong&rdquo; has not read it; a student who says &ldquo;the risk assessment was adequate but the operational follow-through was missing&rdquo; has answered the right question.", "appendix": true, "_iscarbRule": "RULE 08 - 60-second source case", "route": "toolkit"}, {"k": "R10", "loadOk": "The 3x3 matrix and two fields describe one security-risk triage record. Students classify three risks and specify one monitor and one identification tool. Shorten the activity at this cut point; never squeeze the content into a fixed height.", "answer": "Place, for example, the weak-password vulnerability (probability High, exposure High, Intolerable), the missing password checker (probability certain, exposure High, Intolerable), and the missing operational assessment (probability certain, exposure Medium, ALARP) in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity (number of weak passwords detected by the daily checker run), observation window (daily, with weekly summary), trigger value (more than 5 weak passwords in any daily run), named owner (system administrator) and fallback action (force-reset all weak passwords within 24 hours). A penetration test or a password-strength audit tool can identify the weak-password vulnerability; retain the test report as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it on a security matrix.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure how many weak passwords exist&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact you can hand to a reviewer &mdash; e.g. the security policy requires strong passwords; the password checker exists in the codebase."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Not everything unknown matters &mdash; only what could change the verdict. Tonight&rsquo;s gap: how many weak passwords exist in the system right now?"}, {"c": "violet", "lab": "MONITORED", "txt": "An unknown with a measured quantity, observation window, trigger value, named owner and fallback action. The unknown becomes a risk on a schedule."}]}]}, {"t": "wide", "c": "sand", "lab": "PLACE TONIGHT&rsquo;S RISKS ON THE MATRIX", "picker": {"g": "risk3", "options": ["Weak passwords in system", "Password checker never run", "No operational assessment", "No record-level encryption"]}, "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a security vulnerability with a penetration test or a password-strength audit, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; Jahiziah GKU 3, SLO 3", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "One tool or method you would use to identify a security vulnerability in this system &mdash; and which framework step it belongs to"}}, {"t": "principle", "txt": "Approval = evidence state + uncertainty statement + monitoring plan."}], "timebox": "3 min", "task": "Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger. <b style=\"color:var(--mag)\">You are the project security engineer.</b>", "notes": "This unit now carries the one Jahiziah outcome the department mapped to this course and found uncovered: applying a risk management framework and naming a tool that identifies a security vulnerability. Make every student write something in that field &mdash; an empty box here is the gap staying open. Do not accept a monitored risk without a trigger value and a named owner &mdash; a monitor with no trigger is a decision to look away slowly. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the engineer who claims, the engineer who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "Security claims fail not because nobody identified the threat &mdash; but because the control has no owner able to defend it.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · OWNER", "lead": "The project security engineer who decides.", "txt": "Names the verdict and the threat. Owns the consequence. The on-call security engineer tonight &mdash; not the developer, not the regulator, not the AI."}, {"c": "sand", "lab": "2 · EVIDENCE OWNER", "lead": "The engineer who maintains the risk assessment and the audit log.", "txt": "Maintains the inspectable artifact: the risk assessment report, the password checker logs, the access audit trail, the penetration test report. Cannot be the same person as the owner."}, {"c": "mag", "lab": "3 · SIGN-OFF", "lead": "The authority who accepts the residual risk.", "txt": "The hospital&rsquo;s information security committee or the regulator&rsquo;s reviewer. Accepts the bounded residual risk on the evidence the owner and evidence owner produced."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S GAP", "lead": "A celebrity record leaked, a password checker that existed but was never run, no operational assessment &mdash; one developer signing off their own security policy.", "txt": "The system went live with one developer&rsquo;s signature on a security policy that required strong passwords. That is owner, evidence owner and sign-off collapsed into a single person &mdash; which is why the control could not be audited when the breach arrived. The fix is not more testing; it is the separation above.", "field": {"id": "accountability", "core": false, "rows": 2, "ph": "For your verdict: who is the owner, who is the evidence owner, and who signs off?"}}, {"t": "principle", "txt": "Owner &ne; evidence owner &ne; sign-off. Three roles, three people."}], "timebox": "2 min", "task": "For the verdict you signed at Rule 07: name the owner, the evidence owner, and the sign-off authority.", "notes": "Two minutes. The accountability trio is the rule most assignments miss &mdash; not because students cannot name the roles, but because the same person fills all three on their project. Make every student name three different people tonight; if they cannot, the verdict is not yet dependable.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about a system in the section of the source that answers it.", "title": "What Chapter 13 trains you to do", "sub": "Six questions the system cannot answer tonight. Each one is a section of the chapter &mdash; and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "SECURITY DEFINED", "txt": "What does &ldquo;secure&rdquo; mean?", "src": "P1 · p.3"}, {"c": "sand", "lab": "TERMINOLOGY", "txt": "Asset, attack, control, exposure, threat, vulnerability?", "src": "P1 · p.13"}, {"c": "teal", "lab": "THREAT TYPES", "txt": "What can an attacker do?", "src": "P1 · p.15"}, {"c": "sand", "lab": "RISK ASSESSMENT", "txt": "How do we decide what to protect?", "src": "P1 · p.25"}, {"c": "teal", "lab": "SECURE DESIGN", "txt": "How do we build it in?", "src": "P1 · p.44"}, {"c": "sand", "lab": "SECURITY TESTING", "txt": "How do we know it holds?", "src": "P1 · p.67"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Ninety seconds, two answers, no more. Most students pick secure design because it sounds hardest; the chapter&rsquo;s own answer is risk assessment. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition &mdash; and every one of these is something you will do to the system in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish asset, attack, control, exposure, threat and vulnerability, and classify threats by type."}, {"c": "teal", "lab": "2", "txt": "Trace a security breach through the eight-step risk assessment process to the missing control."}, {"c": "teal", "lab": "3", "txt": "Specify security requirements using misuse cases and the risk avoidance/detection/mitigation classification."}, {"c": "mag", "lab": "4", "txt": "Build a bounded security verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the threat, asset value or control feasibility changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone &mdash; the artifact every other outcome feeds. Colouring all five differently made them read as five unrelated topics.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: the security risk assessment is accepted without a control for the weak-password threat. JUDGMENT then fails because the team cannot show which threat tonight reached or what control would have stopped it.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing a breach from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Separate security from reliability.", "src": "Rule 05 · X01"}, {"c": "mag", "lab": "", "txt": "Accept, revise or reject the security case.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Name a control, not an intention.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the breach up the risk assessment.", "src": "X02"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A celebrity bears what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them, so the eye pairs each card with its capability. Recolouring them breaks the pairing, which is the only reason the diagram is there.", "task": "Which capability fails first when a team trusts a security policy without a risk assessment?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE &mdash; an attractive security policy fails not because nobody analysed it but because nobody made the risk assessment inspectable. Do not give the answer; let two students argue it for thirty seconds.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: Threat probability is the promise to the patient. It holds only if the weak-password threat was identified in the risk assessment AND a control (password checker) was specified and run. The prediction is bounded by the missing control, not by the policy.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which threat reached tonight?", "picker": {"g": "predict", "options": ["Interception", "Interruption", "Modification", "Fabrication"]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. weak password, no checker run, celebrity target"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment gateway, not from tonight:</i> &ldquo;This holds only if the retry queue drains faster than new requests arrive. If it does not, the queue is the thing that fails, not the payment service &mdash; and nobody has measured the drain rate under holiday load.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unmeasured</b>."}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the six terminology names &mdash; you have not met them yet. Start from the room. A celebrity record was leaked at 22:14 because an attacker guessed a dictionary-word password. Ask what the security policy promised, and which promise broke first tonight. Then say which threat that promise belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;. If you cannot finish it, the box that is actually empty is CONSTRAINT: name what stops you choosing differently tonight.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move; splitting them across two slides would let a student predict without deriving, which is the failure this rule exists to prevent.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes; one colour makes it read as four parallel boxes rather than four steps.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color:var(--mag)\">You are the project security engineer.</b>", "notes": "Three minutes. The DERIVE box is the one students skip &mdash; walk the room and refuse an empty one. This whole rule collapses if you reveal the source figure first; the reveal is the next slide and not a second earlier.", "appendix": true, "route": "toolkit"}, {"k": "H01", "noAnswer": true, "rule": "HELPER - while DERIVE needs development", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a blank derivation into a question they can answer, by starting from the situation rather than the vocabulary.", "showIf": {"thin": ["f:p_derive"], "minKey": "coachDeep"}, "title": "Three questions instead of the answer", "sub": "This slide is here because your derivation box is still blank, or holds a single clause. It does not contain the answer &mdash; the reveal is the next slide and it is worth more to you if you commit first.", "badge": {"c": "", "t": "SCAFFOLD", "s": "appears only if you need it"}, "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 &nbsp; WHAT WAS PROMISED", "lead": "Which promise to the celebrity broke first tonight?", "txt": "A system promises a patient confidentiality, integrity and availability. Say which of those three promises tonight&rsquo;s leak threatens first &mdash; and you have named the threat type without needing its textbook name."}, {"c": "sand", "lab": "2 &nbsp; WHO IS AWAKE", "lead": "A security feature that depends on a checker being run behaves differently when nobody runs it.", "txt": "It is 22:14 on a holiday weekend. The password checker existed in the policy. Nobody ran it. Ask what that tells you about how the breach will be <i>noticed</i>, not about how it starts. A control that depends on a human running it behaves differently when the human is absent."}, {"c": "mag", "lab": "3 &nbsp; WHAT WOULD CHANGE YOUR MIND", "lead": "Finish the sentence &ldquo;I would drop this if I saw &hellip;&rdquo;.", "txt": "Finish this sentence: &ldquo;I would drop this prediction if I saw &hellip;&rdquo;. Whatever you put after &ldquo;if I saw&rdquo; is your constraint, and the reason it holds is your derivation. Write that sentence in the boxes on the previous slide."}]}, {"t": "principle", "c": "mag", "txt": "A blank box is not a gap in knowledge. It is usually a question asked at the wrong altitude."}], "timebox": "90 sec", "task": "Answer any one of the three out loud, then press &larr; and finish DERIVE properly. This slide stops appearing once DERIVE meets the shared scaffolding threshold; the instructor still checks the reasoning.", "notes": "You will usually not see this slide at all &mdash; it renders while DERIVE falls below the same scaffolding threshold used by the R05 coach, so it is the engine noticing that the room is stuck rather than you deciding in advance that it will be. Do not read all three questions aloud. Pick the one that matches what you saw while walking the room: question 1 for students who cannot start, question 2 for students who have written a threat name with no reasoning under it, question 3 for students who wrote a confident sentence with nothing that could falsify it. Ninety seconds, then send them back. If you are behind, skip it and walk the room instead &mdash; the questions work spoken.", "appendix": true, "route": "toolkit"}, {"k": "QA1", "noAnswer": true, "rule": "RETRIEVAL LOOP - Understand", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the phase&rsquo;s load-bearing moves from memory: the evidence request, the chapter&rsquo;s six questions, the outcome currency and the four parts of the prediction gate.", "title": "Sixty seconds on Understand", "sub": "Before the source expansion opens: four questions, memory first. Reveal only to check, then score yourself honestly.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 01 &middot; 02 &middot; 03 &middot; 05", "items": [{"q": "A celebrity record was leaked at 22:14 because an attacker guessed a dictionary-word password. Name the one evidence request that separates a real gap in the security process from a single incident.", "a": "A signed security risk assessment report for the Mentcare system, with the weak-password threat and its control (password checker) marked by the project security engineer. Until it exists the decision stays bounded: hold or revert, with a named owner and a condition for resuming operation."}, {"q": "Chapter 13 trains you to answer six questions about any secure system. Say any four.", "a": "What does &ldquo;secure&rdquo; mean (security defined)? What are asset, attack, control, exposure, threat, vulnerability (terminology)? What can an attacker do (threat types)? How do we decide what to protect (risk assessment)? How do we build it in (secure design)? How do we know it holds (security testing)?"}, {"q": "All five outcomes of this hour end in the same currency. What is it?", "a": "Evidence, not recognition &mdash; and outcome 4 is the one the others feed: a bounded security verdict with inspectable evidence and a structured argument."}, {"q": "The prediction gate makes you commit to four things before the reveal. Name all four.", "a": "PREDICT the threat type &middot; state the CONSTRAINT &middot; DERIVE it from first principles &middot; NAME the principle used &mdash; then sign, so the reveal costs something."}]}], "timebox": "60 sec", "task": "Cover the answers. Say all four out loud from memory before you reveal anything &mdash; then score yourself honestly.", "notes": "Sixty seconds on the ring, and hold the discipline that makes retrieval work: the answer must come from memory, spoken or written, before any reveal. The four questions are the phase&rsquo;s load-bearing moves, not a quiz &mdash; a miss on question 1 means Rule 01 needs one more pass before the source expansion assumes it. The self-score is private and deliberately blunt: two honest misses beat four nodding yeses, and saying that once out loud is what makes the scoring honest.", "appendix": true, "route": "toolkit"}, {"k": "QA2", "noAnswer": true, "rule": "RETRIEVAL LOOP - Source", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the security/reliability dependency, the six terminology terms, the four threat types and the three security levels.", "title": "Sixty seconds on the source foundations", "sub": "Checkpoint before the rest of Chapter 13: four questions from the first source cluster &mdash; memory first, reveal second.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "X01 &middot; X02 &middot; X02A &middot; X07", "items": [{"q": "Security is a prerequisite for reliability and safety. Say why.", "a": "If a system is networked and insecure then statements about its reliability and safety are unreliable (p.12). Intrusion can change the executing system and/or its data, so the executing system may no longer be the system that was developed. Reliability and safety assurance assume they are the same &mdash; intrusion breaks that assumption."}, {"q": "Name the six security terminology terms and say which is \"a protective measure that reduces a vulnerability\".", "a": "<b>Asset</b> (something of value), <b>vulnerability</b> (a weakness), <b>threat</b> (circumstances with potential to cause loss), <b>attack</b> (exploitation of a vulnerability), <b>exposure</b> (possible loss or harm), <b>control</b> (a protective measure that reduces a vulnerability)."}, {"q": "Name the four threat types and say which one tonight&rsquo;s breach is.", "a": "<b>Interception</b> (attacker gains access to an asset), <b>interruption</b> (attacker makes part of the system unavailable), <b>modification</b> (attacker tampers with an asset), <b>fabrication</b> (attacker inserts false information). Tonight&rsquo;s breach is interception &mdash; the attacker copied the record without altering it."}, {"q": "What are the three security levels, and which is the focus of this chapter?", "a": "<b>Infrastructure security</b> (systems and networks), <b>application security</b> (individual application systems &mdash; the focus of this chapter), <b>operational security</b> (secure operation and use, primarily a human issue)."}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop, now over the first source cluster. Question 1 is the one that pays all semester &mdash; the security/reliability dependency is the reason a security breach invalidates the safety case. If the room misses question 1, do not reteach it here: name it, and let the principle line on X01 do the work on the next pass. Sixty seconds, then move.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: a release causes a celebrity record leak because the password checker was never run. CRISIS: a tabloid publishes the celebrity&rsquo;s record. MAP: password system, user IDs, authentication logic, clinic staff, regulator. TRADE-OFF: revert loses the new feature but the leak stops; continue risks another leak. EVIDENCE: risk assessment report, password checker logs, the missing operational assessment. VERDICT: revert under a named owner, monitor recovery, define the evidence needed before redeployment.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source threats into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies threats; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "A celebrity record leaked to a tabloid via a guessed password at 22:14."}, {"c": "teal", "lab": "2 MAP", "txt": "Password system, user IDs, authentication logic, clinic staff, regulator."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Revert loses the new feature but the leak stops; continue risks another leak."}, {"c": "violet", "lab": "4 EVIDENCE", "txt": "Risk assessment report, password checker logs, the missing operational assessment."}, {"c": "green", "lab": "5 VERDICT", "txt": "Continue, hold, revert &mdash; bounded, with a monitor."}]}, {"t": "principle", "txt": "Predict -&gt; Constraint -&gt; Derive -&gt; Name"}], "timebox": "2 min", "hueOk": "CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide and in every later reference. This is the one place the palette is a vocabulary.", "task": "Run tonight&rsquo;s case through the five steps in one sentence each.", "notes": "Two minutes. The slide exists so the room can hear the flow once before they have to live in it. The most common mistake is to stop at EVIDENCE without a VERDICT &mdash; an evidence list with no decision attached is exactly the unbounded claim Rule 04 refuses.", "appendix": true, "route": "toolkit"}, {"k": "R07", "loadOk": "The decision card has six named slots plus an evidence policy line and an inspectable artifact preview. Students fill all six from tonight's system and cite a source page on each. Use vertical scrolling for the artifact preview; do not split slots across slides.", "answer": "Example verdict: REVERT the system to manual clinic operation tonight under the project security engineer. EVIDENCE: the security policy required strong passwords (Ch.13 p.53); the password checker existed in the codebase but was never run; the operational risk assessment that would have caught this was never done. COUNTER-EVIDENCE: a celebrity record was leaked to a tabloid at 22:14; the attacker guessed a dictionary-word password. UNCERTAINTY: we do not know how many other weak passwords exist in the system; we do not know if other controls (biometric auth, logging) were also skipped. VERDICT: revert, with redeployment conditional on (a) password checker running daily, (b) all weak passwords reset, (c) operational risk assessment completed and signed.", "rule": "RULE 07 - Decision card", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Build the artifact a stranger could audit: claim, evidence, warrant, counter-evidence, uncertainty, verdict.", "title": "Your minimum inspectable artifact", "sub": "The decision card is what Assignment 1 asks for. Six slots, one signature, one evidence policy. Everything else tonight feeds this.", "blocks": [{"t": "wide", "c": "mag", "lab": "CLAIM", "lead": "State the verdict in one sentence.", "field": {"id": "dc_claim", "core": true, "rows": 2, "ph": "Continue, hold, or revert the system tonight"}}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE", "field": {"id": "dc_evidence", "core": true, "rows": 3, "ph": "What supports the claim? Cite a source page (Ch.13 p.X) or a risk assessment entry"}}, {"c": "teal", "lab": "WARRANT", "field": {"id": "dc_warrant", "core": true, "rows": 3, "ph": "Why does the evidence support the claim? Name the threat type or the control"}}, {"c": "sand", "lab": "COUNTER-EVIDENCE", "field": {"id": "dc_counter", "core": true, "rows": 3, "ph": "What would the other side cite against this verdict?"}}, {"c": "mag", "lab": "UNCERTAINTY", "field": {"id": "dc_uncert", "core": true, "rows": 3, "ph": "What is unmeasured, assumed, or could change overnight?"}}, {"c": "green", "lab": "VERDICT", "field": {"id": "dc_verdict", "core": true, "rows": 2, "ph": "The bounded decision, the owner, the monitor, the condition to revisit"}}]}, {"t": "sign", "id": "r07_card", "fields": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_uncert", "f:dc_verdict"], "label": "I sign this verdict", "before": "Sign once all six slots carry something inspectable.", "ready": "Ready to sign.", "warn": "Signing freezes the six slots for the rest of the hour. The defense at Rule 17 changes them in a <i>later</i> box.", "done": "Read-only from here. The card you defend at Rule 17 is the one you signed here."}, {"t": "principle", "txt": "A defensible verdict names what supports it, what would reverse it, what is uncertain, and who owns it."}], "timebox": "4 min", "hueOk": "CLAIM, EVIDENCE, WARRANT, COUNTER-EVIDENCE, UNCERTAINTY, VERDICT each carry their own colour so a student can locate the same slot on the card, the rubric and the defense slide. The card is the only artifact graded tonight.", "task": "Fill all six slots from tonight&rsquo;s system, then sign. The card is what Assignment 1 asks for. <b style=\"color:var(--mag)\">You are the project security engineer.</b>", "notes": "Four minutes. Walk the room. The slot students skip is COUNTER-EVIDENCE: they cannot name what would reverse their own verdict, which means the verdict is not yet defensible. The signature freezes the six boxes; that is what makes Rule 17 a real defense rather than a second draft.", "appendix": true, "route": "toolkit"}, {"k": "QA3", "noAnswer": true, "rule": "RETRIEVAL LOOP - Practise", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the six card slots, the layered architecture, the falsification standard and the anatomy of a monitor.", "title": "Sixty seconds on the decision flow", "sub": "Application checkpoint: recall the artifact you have built so far before transfer and defense continue.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 07 &middot; 09 &middot; 10 &middot; B01", "items": [{"q": "The decision card has six slots. Name them in order.", "a": "CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &middot; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it."}, {"q": "A layered protection architecture has three layers. Name them and say which one failed tonight.", "a": "<b>Platform-level</b> (top-level controls on the platform), <b>application-level</b> (specific protection built into the application &mdash; failed tonight: the password checker was never run), <b>record-level</b> (protection invoked when specific information is accessed)."}, {"q": "What must a claim state so the evidence can prove it wrong?", "a": "The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending."}, {"q": "Turn &ldquo;we are not sure how many weak passwords exist&rdquo; into a monitor.", "a": "A measured quantity (number of weak passwords detected by the daily checker run), an observation window (daily, with weekly summary), a trigger value (more than 5 weak passwords in any daily run), a named owner (system administrator) and a fallback action (force-reset all weak passwords within 24 hours) &mdash; the unknown becomes a monitored risk, and the 3&times;3 grid was only its evaluate step."}]}], "timebox": "60 sec", "task": "Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.", "notes": "The practise loop points at the artifact, not at trivia: every question here is a slot or a standard the decision card must carry. Question 2 is the one to watch &mdash; a layered architecture that does not actually run its application-layer control is the false security that B01 exists to refuse. If a student cannot name all six slots, the card they will defend at Rule 17 is missing walls; send them to C for ninety seconds, not to the slides.", "appendix": true, "route": "toolkit"}, {"k": "R13", "rule": "RULE 13 - Stress test your verdict", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Stress a verdict against four security-engineering stress tests, and say which one it fails.", "title": "What change would break your solution?", "sub": "A strong verdict is one that survives the four questions below. Most do not survive the second.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 &nbsp; THREAT COVERAGE", "lead": "Does the control cover all four threat types?", "txt": "A control that stops interception may not stop modification. The stress test asks: walk the four threat types (interception, interruption, modification, fabrication) and for each ask which control addresses it."}, {"c": "mag", "lab": "2 &nbsp; LAYER COVERAGE", "lead": "Does the control run at every layer?", "txt": "A control that exists at the application layer but is never run is no control. The stress test asks: at which of the three layers (platform, application, record) does the control actually execute, and which layers are uncovered?"}, {"c": "sand", "lab": "3 &nbsp; OPERATIONAL REALITY", "lead": "Is the control actually being executed?", "txt": "A control in the policy that is not in the operation is a sentence, not a control. The stress test asks: who runs it, when did they last run it, and what artifact proves it ran?"}, {"c": "violet", "lab": "4 &nbsp; DESIGN GUIDELINES", "lead": "Which of the ten guidelines does the design violate?", "txt": "The ten guidelines are the chapter&rsquo;s design checklist. The stress test asks: which guideline is the bug class behind tonight&rsquo;s breach?"}]}, {"t": "wide", "c": "mag", "lab": "PICK THE ONE YOUR VERDICT FAILS", "field": {"id": "stress", "core": true, "rows": 2, "ph": "Which stress test does your verdict fail, and what would you change to survive it?"}}, {"t": "principle", "txt": "A verdict that survives all four stress tests is either remarkable or uncommitted &mdash; usually the second."}], "timebox": "3 min", "task": "Pick the stress test your verdict fails and write what you would change to survive it.", "notes": "Three minutes. The point is to fail one of the four on purpose &mdash; almost every verdict fails layer coverage or operational reality, and the honest student names which. A verdict that survives all four has usually not committed to a control at all.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> (project security engineer) decides the verdict and names the threat. The <b>evidence owner</b> maintains the risk assessment and audit logs. The <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What are the four stress tests a security verdict must survive?", "a": "<b>Threat coverage</b> &mdash; does the control cover all four threat types? <b>Layer coverage</b> &mdash; does it run at every layer? <b>Operational reality</b> &mdash; is it actually being executed? <b>Design guidelines</b> &mdash; which of the ten does the design violate?"}, {"q": "Your design requires password rotation every 30 days. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. self-service reset for weak passwords, a weekly batch instead of a queue, a password manager. Sympathy is not an answer."}, {"q": "Where may AI sit in the security assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts misuse cases, suggests controls, generates test cases. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense, so it rehearses the four moves the defense w
