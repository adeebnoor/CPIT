<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fault tree with an AND gate, OR gates and a common cause</title>
<desc id="d">Top event: unsafe actuation reaches the plant. An AND gate requires both protection paths to fail: the software limiter fails to block AND the hardware interlock fails to block. Each path fails through an OR gate. The event "shared controller supply lost" appears under both paths, so the two AND inputs are not independent and their probabilities may not simply be multiplied.</desc>
<defs>
  <style>
    .box{fill:#ffffff;stroke:#1f3b57;stroke-width:1.6}
    .top{fill:#fdecea;stroke:#a3261b;stroke-width:2}
    .cc{fill:#fff4dc;stroke:#b26a00;stroke-width:2;stroke-dasharray:6 4}
    .gate{fill:#d8eef8;stroke:#1f3b57;stroke-width:1.6}
    .and{fill:#e4e0f7;stroke:#3b2a8c;stroke-width:2}
    .ln{stroke:#1f3b57;stroke-width:1.6;fill:none}
    .lncc{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .t{font-size:18px;fill:#13212e;text-anchor:middle}
    .tb{font-size:18px;fill:#13212e;text-anchor:middle;font-weight:700}
    .g{font-size:14px;font-weight:700;text-anchor:middle;fill:#13212e}
    .note{font-size:17px;fill:#7a4a00}
    .key{font-size:15px;fill:#33475b}
  </style>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- top event -->
<rect class="top" x="330" y="18" width="300" height="56" rx="6"/>
<text class="tb" x="480" y="42">Unsafe actuation reaches</text>
<text class="tb" x="480" y="62">the plant (hazard)</text>
<line class="ln" x1="480" y1="74" x2="480" y2="96"/>

<!-- AND gate: flat bottom, round top -->
<path class="and" d="M455 140 L455 118 A25 25 0 0 1 505 118 L505 140 Z"/>
<text class="g" x="480" y="133">AND</text>
<line class="ln" x1="480" y1="140" x2="480" y2="160"/>
<line class="ln" x1="250" y1="160" x2="710" y2="160"/>
<line class="ln" x1="250" y1="160" x2="250" y2="182"/>
<line class="ln" x1="710" y1="160" x2="710" y2="182"/>
<text class="key" x="525" y="122">both paths must fail</text>

<!-- AND inputs -->
<rect class="box" x="120" y="182" width="260" height="56" rx="6"/>
<text class="t" x="250" y="206">Software limiter</text>
<text class="t" x="250" y="226">fails to block</text>
<rect class="box" x="580" y="182" width="260" height="56" rx="6"/>
<text class="t" x="710" y="206">Hardware interlock</text>
<text class="t" x="710" y="226">fails to block</text>
<line class="ln" x1="250" y1="238" x2="250" y2="258"/>
<line class="ln" x1="710" y1="238" x2="710" y2="258"/>

<!-- OR gates: shield shape -->
<path class="gate" d="M226 300 Q250 288 274 300 Q274 270 250 258 Q226 270 226 300 Z"/>
<text class="g" x="250" y="292">OR</text>
<path class="gate" d="M686 300 Q710 288 734 300 Q734 270 710 258 Q686 270 686 300 Z"/>
<text class="g" x="710" y="292">OR</text>
<text class="key" x="160" y="284" text-anchor="end">any one</text>
<text class="key" x="160" y="300" text-anchor="end">is enough</text>

<!-- left leaves -->
<line class="ln" x1="250" y1="296" x2="250" y2="320"/>
<line class="ln" x1="95" y1="320" x2="330" y2="320"/>
<line class="ln" x1="95" y1="320" x2="95" y2="342"/>
<line class="ln" x1="250" y1="320" x2="250" y2="342"/>
<rect class="box" x="30" y="342" width="130" height="56" rx="6"/>
<text class="t" x="95" y="366">Limit table</text>
<text class="t" x="95" y="386">corrupted</text>
<rect class="box" x="185" y="342" width="130" height="56" rx="6"/>
<text class="t" x="250" y="366">Check</text>
<text class="t" x="250" y="386">bypassed</text>

<!-- right leaves -->
<line class="ln" x1="710" y1="296" x2="710" y2="320"/>
<line class="ln" x1="630" y1="320" x2="865" y2="320"/>
<line class="ln" x1="865" y1="320" x2="865" y2="342"/>
<line class="ln" x1="710" y1="320" x2="710" y2="342"/>
<rect class="box" x="645" y="342" width="130" height="56" rx="6"/>
<text class="t" x="710" y="366">Interlock</text>
<text class="t" x="710" y="386">sensor fault</text>
<rect class="box" x="800" y="342" width="130" height="56" rx="6"/>
<text class="t" x="865" y="366">Interlock</text>
<text class="t" x="865" y="386">stuck open</text>

<!-- common cause: one event feeding both OR gates -->
<line class="lncc" x1="330" y1="320" x2="330" y2="420"/>
<line class="lncc" x1="630" y1="320" x2="630" y2="420"/>
<line class="lncc" x1="330" y1="420" x2="630" y2="420"/>
<line class="lncc" x1="480" y1="420" x2="480" y2="440"/>
<rect class="cc" x="370" y="440" width="220" height="56" rx="6"/>
<text class="tb" x="480" y="464">Shared controller</text>
<text class="tb" x="480" y="484">supply lost</text>

<text class="note" x="480" y="530" text-anchor="middle" font-weight="700">Common cause: the same event sits under both inputs of the AND gate.</text>
<text class="note" x="480" y="554" text-anchor="middle">The two paths are not independent, so P(limiter fails) × P(interlock fails) is not valid.</text>
<text class="key" x="480" y="584" text-anchor="middle">Teaching diagram in Sommerville's fault-tree notation (Ch.12). Source slide 27 (insulin pump) uses OR gates only.</text>
</svg>
