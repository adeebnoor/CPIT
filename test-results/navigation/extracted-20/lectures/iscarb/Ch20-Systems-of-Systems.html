</style><link rel="stylesheet" href="runtime/national-alignment.css?v=20260928-campus-v3"><link rel="stylesheet" href="runtime/stage-v4.css?v=20261005-lab2"></head><body><a class="skip" href="#chapter-main">Skip to lecture</a><div id="app"><nav class="topbar" aria-label="Chapter learning paths"><a class="brand" href="https://adeebnoor.github.io/CPIT/iscarb.html">iSCARB<small>CPIT-455 · CH 20</small></a><div class="topnav"><button id="mapBtn" class="map-shortcut" data-jump="MAP">Chapter map</button><button data-open="UNITS">Slides</button><button data-open="TOOLS">Study &amp; tools</button></div></nav><main id="chapter-main" class="chapter-main"></main><footer class="footerbar"><div class="footer-left"><span id="topic-location"></span><button id="viewBtn" aria-pressed="false">Reading view</button></div><div class="footer-right"><span id="progress" class="progress"></span><button id="helpBtn" aria-label="Help">?</button><button id="prevBtn" class="arrow" aria-label="Previous slide">‹</button><button id="nextBtn" class="arrow" aria-label="Next slide">›</button></div></footer></div><div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">Close ×</button></header><div id="modal-body" class="modal-body"></div></section></div><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div><noscript><p>JavaScript is required for the classroom interactions. <a href="sources/Ch20-Study.html">The complete source review remains available here.</a></p></noscript><script id="lecture-data" type="application/json">{"chapter":20,"title":"Systems of Systems","course":"CPIT-455","release":"20260921-classroom-v3","version":"20260927-showcase-v3","presentationMode":"single-canvas","filename":"Ch20-Systems-of-Systems.html","assignment":9,"points":5,"objectives":["Recognize operational and managerial independence.","Classify SoS and explain three kinds of complexity.","Explain why reductionist assumptions can fail.","Plan interfaces, staged deployment and cross-system tests.","Compare data-feed, container and trading architectures."],"sections":["20.1 System complexity","20.2 SoS classification","20.3 Reductionism and complex systems","20.4 SoS engineering","20.5 SoS architecture"],"case":{"headline":"Several owners connect. Who controls the shared promise?","text":"A fictional multi-agency dashboard combines independently managed data feeds. The principal system can validate and display received data but cannot dictate every provider’s update schedule.","question":"What useful service can be promised without pretending to control every owner?","mutation":"One participating feed changes to a slower update schedule while keeping the same interface shape. The same agency also changed its AI model version: the feed’s shape is unchanged, but incidents are now classified differently.","lens":"One agency now produces its feed with an AI model that summarises and classifies field reports. The dashboard owner cannot inspect or version that model. Hold that question: after the architecture patterns, one slide asks three owners to negotiate it."},"brand":"assets/v3/9aec8723d3bdd871.jpg","slides":[{"id":"TITLE","title":"Systems of Systems","phase":"START","takeaway":"Systems of Systems","full":"<p>Systems of Systems<\/p>","sourceStart":1},{"id":"MAP","title":"The chapter at a glance","phase":"LEARN","takeaway":"The chapter at a glance","full":"<p>The chapter at a glance<\/p>","sourceStart":1},{"id":"START","title":"Start with the problem","phase":"SEE","takeaway":"Start with the problem","full":"<p>Start with the problem<\/p>","sourceStart":1},{"id":"X01","title":"A system of systems contains independent participants","fig":null,"sourceRange":"3–8","bullets":[["Operational independence","Constituents remain useful as systems in their own right."],["Managerial independence","Constituent owners retain decision authority."],["Evolution / emergence","Independent changes and interactions affect shared behavior."],["Other characteristics","Geographic distribution, heterogeneity and large data volumes."]],"question":"Why can a small integration still be a system of systems?","answer":"The distinguishing feature is independent management, not code size alone. Even a few externally managed services may create SoS constraints.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"A system of systems has two or more independently managed parts; size is not the test.","full":"<p>Sommerville’s distinction is sociotechnical rather than technical: “A system of systems is a system that contains two or more independently managed elements.” There is no single manager for all the parts, and different parts follow different management and control policies. The definition says nothing about size: a relatively small system that uses services from different providers is a system of systems. The chapter’s examples include a cloud management system spanning private and public clouds, an online banking system that checks applicants with credit reference agencies, an emergency information system integrating police, ambulance, fire and coast guard data, and the iLearn digital learning environment.<\/p><p>Maier identified five essential characteristics: <b>operational independence<\/b> (parts are useful systems in their own right and evolve independently); <b>managerial independence<\/b> (parts are owned and managed by different organizations, or different parts of one—the key distinguishing factor); <b>evolutionary development<\/b> (the SoS evolves over time rather than in one project); <b>emergence<\/b> (characteristics that appear only after the SoS is created); and <b>geographical distribution<\/b>, which makes an externally managed network part of the SoS. Sommerville adds two: software SoS are <b>data-intensive<\/b>, often holding far more data than code, and <b>heterogeneous<\/b>, built with different languages and methods.<\/p>","sourceStart":3,"notes":"Ask whether a dashboard that pulls three agency feeds is a system of systems. It is—because three owners manage the feeds, not because of its size. Keep the list of owners on the board for the rest of the lecture."},{"id":"X02","title":"Three different kinds of complexity","fig":"ch20_complexity","sourceRange":"9–14","bullets":[["Technical","Relationships among system elements and their runtime behavior."],["Managerial","Who can operate, change and coordinate the constituent systems."],["Governance","Policies and decision-making structures constraining those managers."],["Interaction","A policy change can also alter operational and technical dependencies."]],"question":"Is inability to force another owner’s deployment merely a software defect?","answer":"No. It is a management/governance constraint that technical design must accommodate.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/09d19e989499209f.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"SoS complexity is technical, managerial and governance; a change in one spreads to the others.","full":"<p>A system’s complexity depends on the number and types of relationships between its elements. Static relationships, such as “uses,” can be analyzed from the code or a model; dynamic relationships, such as “calls,” depend on runtime inputs and are harder to analyze. Large systems also need complex production and management processes, which are complex systems in their own right and a main reason why projects run late and over budget.<\/p><p>Three types of complexity matter for sociotechnical systems. <b>Technical complexity<\/b> comes from the relationships between the system’s components. <b>Managerial complexity<\/b> comes from the relationships between the system and its managers—what they can change—and between the managers of different parts; it is an operational matter. <b>Governance complexity<\/b> comes from the laws, regulations and policies that affect the system and from the decision-making processes of the organizations responsible for it. The chapter’s example: allowing staff to use their own mobile devices is a governance decision. It makes management harder, because the devices must be configured securely, and raises technical complexity, because there is no longer one platform. Each SoS characteristic adds to one or more types; geographical distribution adds to all three.<\/p>","sourceStart":9,"notes":"Ask which type of complexity stops the dashboard owner forcing an agency to update faster: managerial or governance, not technical. Then ask what technical design can do about a constraint it cannot remove."},{"id":"X02A","title":"Keep the two classification vocabularies aligned","fig":"ch20_classification","sourceRange":"15–20","bullets":[["Organizational","One organization provides an ultimate governance structure."],["Federated","Owners agree to a voluntary joint governance body."],["Coalition","Participants collaborate without formal shared governance."],["Criterion","Classify authority and coordination, not only network connections."]],"question":"Which classification fits an agreed joint governing body whose decisions participants implement?","answer":"The author’s federated SoS, corresponding to Maier’s collaborative category. A coalition without that formal body is different.","rows":null,"heads":null,"extra":"Sommerville’s names map to Maier’s: organizational ↔ directed; federated ↔ collaborative; coalition ↔ virtual. The chapter explains why its names describe governance more clearly.","phase":"LEARN","figure":"assets/v3/cc11430e2482e8ab.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Classify a system of systems by its governance: organizational, federated or coalition.","full":"<p>Maier classified systems of systems by their governance and management complexity. <b>Directed<\/b> SoS are owned by one organization, whose ultimate governing body can set priorities and resolve disputes: some managerial complexity but no governance complexity—for example, a military command-and-control system. <b>Collaborative<\/b> SoS have no central authority, but the owners recognize the benefits of joint governance and set up a voluntary governance body—for example, bus, rail and air providers linking their systems to give passengers up-to-date information. <b>Virtual<\/b> SoS have no central governance; participants may not agree on the overall purpose and may join or leave, and interoperability depends on published interfaces that may change—for example, algorithmic stock trading.<\/p><p>Sommerville prefers more descriptive names: <b>organizational<\/b> (Maier’s directed), <b>federated<\/b> (collaborative) and <b>coalition<\/b> (virtual). In a federated SoS, owners treat the governance body’s decisions as binding and implement them in their own policies. In a coalition there is no formal governance, but owners collaborate informally—for example, by not changing a data format without notice. Classifying a SoS shows whether the governance it needs exists. Setting up governance across organizations is political and slow, so it should start early; moving towards organizational governance usually reduces complexity. The chapter’s iLearn system is a coalition, and its designers recommended making it federated.<\/p>","sourceStart":15,"notes":"Ask pairs to classify our dashboard. With no joint body, it is a coalition—so nothing obliges an agency to announce a model change. Ask what it would take to make it federated."},{"id":"X03","title":"Reductionist assumptions can break at system boundaries","fig":"ch20_reality","sourceRange":"21–26","bullets":[["Control","There may be no single authority able to change every constituent."],["Decisions","Organizational interests can compete with purely technical criteria."],["Boundaries","The problem and participating systems may be renegotiated."],["Implication","Local correctness alone does not establish the whole-system outcome."]],"question":"Why is a correct interface specification not a guarantee of a stable SoS?","answer":"Owners can evolve systems independently, and participation or meaning may change. Cross-system behavior and governance assumptions need ongoing review.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/a19c188bb406ead3.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Reductionism assumes one owner, rational decisions and clear boundaries; a SoS has none.","full":"<p>Reductionism assumes that a system is made of parts and that the behavior of the whole can be understood and predicted from the parts and their relationships. It underlies all engineering, including top-down design, object-oriented design and agile methods, which simply decompose a system incrementally. It works best when there are relatively few relationships between parts and they can be modeled scientifically—true of mechanical systems, less true of software, with its many static and dynamic relationships.<\/p><p>Its assumptions fail for systems of systems in three areas. <b>Ownership and control<\/b>: reductionism assumes a controlling authority that can resolve disputes; a SoS has several governing bodies. <b>Decision making<\/b>: reductionism assumes decisions are made rationally on technical criteria; in a SoS they are often driven by political motives. <b>Problem definition<\/b>: reductionism assumes a definable problem with clear boundaries; a SoS often addresses a wicked problem whose boundaries are constantly renegotiated. Software makes this worse: its relationships follow no physical laws, nothing physical limits where boundaries are drawn, and linking systems from different owners is easy. Reductionist methods remain useful for the constituent systems, but they cannot by themselves engineer the whole SoS.<\/p>","sourceStart":21,"notes":"Ask for one example of each failed assumption in our dashboard: no single owner, agency priorities that are political, and a boundary that moves when a new agency joins."},{"id":"CHECK1","title":"Checkpoint · bound the shared promise","fig":null,"sourceRange":"3–26","bullets":[["Think","Three owners publish data to one incident dashboard."],["Pair","Separate what the dashboard controls from what it merely receives."],["Record","State a useful claim with participation and freshness assumptions."]],"question":"Can the dashboard owner promise that every provider will always update on time?","answer":"Not without the corresponding authority/agreement and evidence. It can promise its own bounded display, validation and fallback behavior.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"Promise what the dashboard controls; label what it only receives.","full":"<p>The dashboard owner controls its own validation, display, timeouts and labels. It does not control when each agency updates its feed or how the agency produces the data. A useful, honest claim is therefore bounded—for example, “the dashboard shows each item with its source and timestamp, and marks feeds older than a stated limit as stale.” Anything beyond that, such as every provider updating on time, needs an agreement between owners and evidence that it is being kept.<\/p>","sourceStart":3,"notes":"Ask each pair to underline the words in their claim that depend on another owner. Every underlined word needs an agreement or a label."},{"id":"X04","title":"Five engineering activities; governance alongside","fig":"ch20_soseng","sourceRange":"27–32","bullets":[["Conceptual design","Identify useful capabilities, existing systems and constraints."],["Selection / architecture","Choose participants and organize their interaction together."],["Interfaces","Reconcile the different services and representations."],["Integration / deployment","Introduce useful capabilities while coordinating management policies."]],"question":"Why should governance discussions start before the final integration test?","answer":"Authority, participation, change handling and acceptance affect which integrations are feasible and can take longer to agree than an interface takes to implement.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/9dd47ad69147bc4e.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"SoS engineering integrates existing systems in five activities, with governance set in parallel.","full":"<p>SoS engineering integrates existing systems to create new capabilities. It is not top-down design: a SoS appears when an organization sees that it can add value by linking existing systems—for example, a city integrating its traffic management system with a national pollution-monitoring system so that it can change traffic light sequences at pollution hot spots. Its problems resemble those of integrating application systems (Chapter 15): no control over functionality and performance, incompatible assumptions, different evolution timetables and lack of support from owners.<\/p><p>Five general activities are involved. <b>Conceptual design<\/b> creates a high-level vision, essential requirements and constraints, informed by knowledge of existing systems. <b>System selection<\/b> chooses the participating systems; politics and governance often matter more than commercial criteria—an organization may refuse to work with a competitor, or insist that its own system is used. <b>Architectural design<\/b> proceeds in parallel with selection. <b>Interface development<\/b> lets incompatible systems interoperate, sometimes with a unified user interface. <b>Integration and deployment<\/b> make the systems work together and put them into operation. Alongside these, <b>governance and management policies<\/b> must be set. Across organizations this can be slow and may require them to change their own policies, so it should start early.<\/p>","sourceStart":27,"notes":"Ask which activity the dashboard team would be tempted to skip. Usually governance, because it looks like meetings rather than engineering. Point out that it takes longer than any interface."},{"id":"X05","title":"An interface must reconcile more than syntax","fig":"ch20_serviceiface","sourceRange":"33–36","bullets":[["Service boundary","Expose the needed capability of an existing system."],["Adaptation","Translate specialized APIs or interactions without assuming internal control."],["User interface","Unification may help, but workflow and usage differences can make it costly."],["Contract","State data meaning, timing, failures and change responsibility."]],"question":"Why might a single unified user interface be the wrong choice?","answer":"Different interaction models, dominant local workflows or open-ended participant additions may make unification impractical or slow the main task.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/6f43909f3370e740.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Wrap each system as services behind a principal system; unify the UI only when it pays.","full":"<p>Constituent systems were built for their own purposes. Some offer service interfaces; more commonly they have a specialized API or can be used only through their user interface. The recommended approach is to implement <b>service-based interfaces<\/b>: examine each system’s functionality, define services that reflect it, and implement them by calling the system’s API or by mimicking user interaction. A <b>principal<\/b> or coordinating system then acts as a service broker, directing service calls between systems so that each need not know which system provides a service. Coalitions, whose members are peers, tend to interact directly instead.<\/p><p>A <b>unified user interface<\/b> makes the SoS easier to learn and reduces user error, but whether it is cost-effective depends on three factors. The <b>interaction assumptions<\/b> of the systems: process-driven and user-driven interaction models are practically impossible to unify. The <b>mode of use<\/b>: if users work mostly in one system—as air traffic controllers do with radar—a unified interface would slow down the main task. The <b>openness<\/b> of the SoS: if new systems or organizations can join, their interfaces cannot be anticipated. In practice, budget and time are the limiting factor, because UI development is one of the most expensive engineering activities.<\/p>","sourceStart":33,"notes":"Ask what a service interface to an agency feed must state beyond its fields: what the values mean, how fresh they are, and who announces changes. That list is the contract our case is missing."},{"id":"DEPLOY","title":"Deliver useful intermediate forms","fig":"ch20_ilearn","sourceRange":"37–39","bullets":[["Staged value","An incomplete SoS should still perform useful bounded work."],["Existing operation","Constituents may already be deployed and cannot all be frozen."],["Increment","Add a coherent capability with explicit acceptance conditions."],["People","Plan training, equipment and operational transition as well as code."]],"question":"What makes a staged release more than an unfinished system?","answer":"A defined useful capability, explicit missing participation, acceptance evidence and a safe path to later stages.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/e6e451bd15d86744.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"In a SoS, integration and deployment merge into stages that each deliver something useful.","full":"<p>Normally a system is integrated from controlled components, validated and then released for deployment. In a SoS this may not be possible: some constituents are already deployed and in use, and the integration team cannot control changes to them. Integration and deployment therefore become one process. Following the principle that an incomplete SoS should still be useful, integration starts with systems that are already deployed and adds new systems as coherent additions to the overall capability.<\/p><p>The chapter’s iLearn plan has three stages. The first provides authentication, basic learning functionality and integration with school administration systems. The second adds an integrated storage system and specialized subject tools, such as history archives, science simulations and programming environments. The third adds user configuration and lets users add new systems, so that versions can be created for different age groups. Deployment may also require equipment installation and user training; when an existing system is being replaced, there may be no space, power or user time to install new equipment alongside it, and these nontechnical issues can delay adoption.<\/p>","sourceStart":37,"notes":"Ask what the dashboard’s first useful stage could be with only one agency feed. Push for a stage with its own acceptance condition, not a partial copy of the final system."},{"id":"X06","title":"Test the interactions that owners do not control alone","fig":null,"sourceRange":"40–43","bullets":[["No complete specification","Acceptance may require close stakeholder participation."],["Independent change","A constituent update can invalidate a previous result."],["Constraints","Fixes may need mediation rather than a constituent-code change."],["Regression","Automate repeatable cross-system checks where feasible."]],"question":"Which record makes a cross-system result repeatable?","answer":"Participant and interface versions, inputs, relevant data/time assumptions, expected result and observed behavior. Record changes that cannot be controlled.","rows":null,"heads":null,"extra":"","phase":"LEARN","takeaway":"SoS testing lacks a full specification and stable constituents, so borrow agile practices.","full":"<p>System testing is the most time-consuming and expensive part of integration, and a SoS makes it harder for three reasons. There may be no detailed requirements specification to test against, because the SoS’s functionality is defined by the systems it includes. The constituent systems may change during testing, so tests may not be repeatable. And if problems are found, it may not be possible to require a constituent system to change; intermediate software may have to be introduced instead.<\/p><p>Sommerville suggests borrowing two techniques from agile methods. First, agile acceptance does not rely on a complete specification: stakeholders are closely engaged and have the authority to decide when the system is acceptable, so a range of SoS stakeholders should take part in testing. Second, agile methods use automated testing extensively, which makes it much easier to rerun tests and discover whether an unexpected change in a constituent system has caused problems for the SoS as a whole.<\/p>","sourceStart":40,"notes":"Ask what a regression test for the dashboard should record so that it can be repeated after an agency changes its feed: the feed version, the input, the expected display and the time assumptions."},{"id":"CHECK2","title":"Checkpoint · useful value with one participant missing","fig":null,"sourceRange":"27–43","bullets":[["Think","One data provider becomes slow or unavailable."],["Pair","Define what remains useful and what the user must see as unknown."],["Record","Add the chosen interface/fallback mechanism and its trade-off."]],"question":"Why is displaying old data as current a different problem from showing “unavailable”?","answer":"It presents unsupported certainty. A bounded service must preserve freshness/uncertainty information so users can interpret the result.","rows":null,"heads":null,"extra":"","phase":"CHECK","takeaway":"When a feed fails, stay useful: show what is missing or stale rather than hide it.","full":"<p>If one provider becomes slow or unavailable, the dashboard can still show the other feeds. A timeout stops the slow feed from delaying the whole display, as the chapter recommends for the data-feed pattern. The harder decision is what to show for the missing feed. Showing its last values as if they were current presents unsupported certainty; showing “unavailable,” or the last values with their age clearly marked, keeps the result interpretable. A good card names the mechanism—a timeout and a freshness label—and its trade-off: users see a less complete picture, but not a misleading one.<\/p>","sourceStart":27,"notes":"Ask pairs to sketch the screen for a stale feed. Accept any design that makes the age of the data visible without a click."},{"id":"X09","title":"Architecture principles and frameworks","fig":null,"sourceRange":"44–47","bullets":[["Value and control","Deliver useful incomplete forms; be realistic about authority."],["Interfaces and incentives","Support evolution and give owners reasons to participate."],["Multiple views","Business, data/application and technology views describe different concerns."],["Management effort","Creating and maintaining consistent models takes time."]],"question":"(1) Why is an incentive to maintain a data feed an architectural concern? (2) When can a framework remain useful despite its limitations?","answer":"(1) The capability depends on continued participation. An elegant interface cannot sustain the service when an independent owner has no reason to maintain it. (2) As a checklist and shared vocabulary for architectural concerns, provided the team does not assume it solves independent ownership or uncertain boundaries.","rows":null,"heads":null,"extra":"The chapter’s seven principles—Maier’s four and Sillitto’s three: deliver value when incomplete; be realistic about control; focus on interfaces; provide collaboration incentives; design as nodes and a web; specify behavior as services exchanged between nodes; understand and manage vulnerabilities.","phase":"LEARN","takeaway":"Principles include people and incentives; frameworks offer views, not authority.","full":"<p>Architectural design selects the systems to include, assesses how they will interoperate and designs mechanisms to support interaction, including data management, redundancy and communications. Maier gives four principles: design systems so that they <b>deliver value when incomplete<\/b>, with stable intermediate forms; <b>be realistic about what can be controlled<\/b>, since overcontrol provokes resistance from owners; <b>focus on the interfaces<\/b>, keeping them loose enough for systems to evolve; and <b>provide collaboration incentives<\/b>—financial, access (“you share your data and I’ll share mine”) or community. Sillitto adds three: design the SoS as <b>nodes and a web<\/b>, where nodes are sociotechnical systems and the web includes social communication between the people who run them; <b>specify behavior as services exchanged<\/b> between nodes; and <b>understand and manage vulnerabilities<\/b>. Sometimes the best solution is not more software but a change to the rules and policies that govern the system.<\/p><p>Architecture frameworks such as MODAF and TOGAF—whose Architecture Development Method covers business, data, application and technology architectures—describe an architecture through several views. They were designed for organizational SoS with a single governance authority. Their models take a long time to develop and are expensive to keep consistent, and they are fundamentally reductionist. Sommerville treats them as a useful checklist rather than a complete method for SoS architecture.<\/p>","sourceStart":44,"notes":"Ask which of the seven principles would have helped with the AI model change. Collaboration incentives and interfaces: an agency that gains something from announcing changes is more likely to announce them.","figure":"assets/v3/b83804ee6ccbfdb0.jpg","caption":"Sommerville Ch.20 · preserved source illustration"},{"id":"X08","title":"Pattern 1 · systems as data feeds","fig":"ch20_datafeeds","sourceRange":"48–53","bullets":[["Principal system","Queries information held by other systems."],["Unifying interface","Can translate a common query to provider-specific formats."],["Failure behavior","Bound waiting and show missing or stale inputs."],["Governance","Agree how interface and data-format changes are communicated."]],"question":"What should a slow provider not be allowed to do to the whole dashboard?","answer":"Cause an unbounded wait or silently replace unknown data with a misleading value. Define timeout and explicit partial-result behavior.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/1c08c1faae4be113.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"A principal system queries data feeds; bound waits with timeouts and govern format changes.","full":"<p>In the <b>systems as data feeds<\/b> pattern, a principal system needs data of different types and queries other systems to get it. The data providers generally do not interact with each other. The pattern is often seen in organizational or federated systems where some governance exists. The chapter’s example is UK vehicle licensing: the licensing system checks an “insured vehicles” system, run as a federation by insurance companies, and a system of MOT roadworthiness certificates. The pattern suits situations where entities can be identified uniquely—by registration number or GPS coordinates, for example—and queries are relatively simple.<\/p><p>A variant adds a <b>unifying interface<\/b> when several systems provide similar but not identical data: an intermediate layer translates the principal system’s general query into each provider’s specific query. iLearn uses one to query three different school administration systems. The main problems are interface problems when feeds are unavailable or slow, so timeouts should ensure that one failed feed does not compromise the response time of the whole system. Governance should ensure that the format of provided data is not changed without the agreement of all system owners.<\/p>","sourceStart":48,"notes":"Ask what our case adds to the textbook’s governance rule: the meaning of the data can change even when its format does not. That is the gap the AI slide explores."},{"id":"CONTAINER","title":"Pattern 2 · systems in a virtual container","fig":"ch20_container","sourceRange":"54–59","bullets":[["Common services","A principal system offers facilities such as sign-in, storage or configuration."],["Adapters","Approved systems integrate through interfaces to those common services."],["Unapproved systems","May remain reachable without shared-service integration."],["Not an OS container","This is a SoS integration pattern, not necessarily process isolation."]],"question":"Does adding a link to a tool mean it participates in common sign-in and storage?","answer":"No. Those integrations need compatible interfaces and configuration. Mere inclusion in the user interface does not establish them.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/3ee6a1792825a363.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"A container system shares common services with approved systems through separate interfaces.","full":"<p>In the <b>systems in a container<\/b> pattern, one system acts as a virtual container providing common services, such as authentication and storage; other systems are conceptually placed inside it so that users can reach their functionality. Included systems may be chosen from an approved list and need not know they are in a container. The pattern is most often seen in federated systems or coalitions. Nothing is placed in a real container: each approved system has its own interface that translates between the container’s common services and the system’s requirements. Unapproved systems can also be included, but they cannot use the common services.<\/p><p>iLearn is the chapter’s example, with three common services: single sign-in to all approved systems, storage of user data that moves seamlessly to and from approved systems, and configuration to include or remove systems. A physics version includes Office 365, Moodle, a simulator and a lab data analyzer as approved systems; YouTube and a science encyclopedia are unapproved, so users log in separately and move their own data. The pattern has two problems: a separate interface is needed for each approved system, which limits their number, and the container’s owners have no influence on the included systems, which may change or be withdrawn at any time. Its main benefit is incremental development: early versions can use unapproved systems, with interfaces added later.<\/p>","sourceStart":54,"notes":"Ask what happens to single sign-in when an unapproved tool is added as a link: nothing, because it is not integrated. Then ask what the container owner can do if an approved system is withdrawn."},{"id":"TRADING","title":"Pattern 3 · trading between participants","fig":"ch20_trading","sourceRange":"60–63","bullets":[["Exchange","Participants offer and request services or items rather than only publish data."],["No principal system","Each system publishes its own interface; shared standards may not exist."],["Independence","Participants retain local interests, policies and evolution."],["Choice","Real SoS may combine trading, containers and data feeds."]],"question":"Why is trading not just a faster one-way data feed?","answer":"In a trading SoS there is no principal system: participants exchange information with one another, one-to-one or one-to-many, and each publishes its own interface. In the data-feed pattern, a principal system queries providers that do not interact with each other.","rows":null,"heads":null,"extra":"","phase":"LEARN","figure":"assets/v3/aafbde3e7bf09b87.jpg","caption":"Sommerville Ch.20 · preserved source illustration","takeaway":"Trading systems exchange information with no principal system and often no governance.","full":"<p>In a <b>trading<\/b> SoS there is no single principal system: processing may take place in any constituent system, and the systems trade information among themselves in one-to-one or one-to-many interactions. Each system publishes its own interface, but there may be no interface standards that all systems follow. Trading systems may be federated systems or coalitions. Examples are algorithmic stock trading, where brokers’ systems buy and sell automatically, set prices and negotiate with each other, and travel aggregators that compare prices and let users book directly.<\/p><p>The major problem is the lack of a governance mechanism: any system may change at any time, and a change that contradicts other systems’ assumptions can stop trading. Owners who want to keep trading may make informal arrangements to avoid this; in other cases the change is deliberate—an airline may make its system unavailable to an aggregator to force customers to book directly. As with all architectural patterns, real systems of systems usually combine several patterns.<\/p>","sourceStart":60,"notes":"Ask whether our dashboard is a trading system. It is not—it has a principal system—but ask what would change if the agencies started exchanging data with each other directly."},{"id":"AISYS","phase":"LEARN","skin":"genai","sourceRange":"","sourceLabel":"Course-added synthesis · extends the source concepts to an AI component","sourceStart":1,"banner":{"src":"assets/v3/genai-banner.jpg","alt":"Stylised glowing brain beside the words GEN AI","label":"AI SEGMENT · ROLE-PLAY","caption":"Every owner can change their own model. Nobody owns the meaning of the whole."},"title":"Role-play: three owners, one AI-produced feed","takeaway":"When a participant’s AI changes, the interface can stay the same while the promise does not.","nodes":[["Agency A · feed owner","“Our new model is better; the format is unchanged.”"],["Dashboard owner","“What did ‘high severity’ mean last week?”"],["Public user","“Can I trust today’s map?”"]],"bullets":[["Round 1","Each role states what it needs from the others."],["Round 2","Agree one thing each owner will record or announce."],["Verdict","What can the dashboard still promise—and label?"]],"question":"What can the dashboard owner promise about Agency A’s AI-produced feed without controlling Agency A?","answer":"Not that the classifications are correct—it cannot inspect or version the model. It can promise to show each item with its source, timestamp and the producer’s declared model version; to flag detected shifts, such as a sudden change in the share of ‘high severity’ incidents; and to label affected data as unverified. It can seek an agreement that participants announce model changes as interface changes, with a trial period. The promise is bounded by what the dashboard observes; governance covers the rest.","full":"<p>This slide is course-added. It asks three owners in the opening case to negotiate what an AI-produced feed can promise.<\/p><h3>How the slide uses the five objectives<\/h3><p>Independence: each owner can change its own model without asking anyone. Complexity: model policy is managerial and governance complexity, not only technical. Reductionism: each model being locally better does not make the whole dashboard more trustworthy. Interfaces and testing: declared model versions and cross-system checks on content, not only shape. Architectures: an AI summary is still a data feed; AI agents negotiating on behalf of owners would resemble the trading pattern.<\/p><p><b>Semantic drift.<\/b> The meaning of data changes while its format stays the same—for example, a new model classifying the same report differently. Schema validation cannot detect it.<\/p><p><b>Model version as interface.<\/b> Treating a participant’s model version as part of the interface agreement, so a change is announced, versioned and tested like any other interface change.<\/p><p><b>Bounded promise.<\/b> In a system of systems, the principal system can promise only what it can observe and control; it labels the rest.<\/p><p class=\"small\">The case is course-created.<\/p>","notes":"Allow about 6 minutes. Format: role-play. Assign three students or groups to the roles; one minute per round, then take the verdict from the rest of the class. New terms, at most two: semantic drift and model version as interface. Everything else in Full explanation is optional depth and is not assessed."},{"id":"APPLY","title":"Revise, verify and own the decision","phase":"DECIDE","takeaway":"Same interface, different promise.","bullets":[["New information","A slower schedule and a new AI model version—same interface shape."],["Reassess","Freshness and meaning both changed without a schema change."],["Revise","Label freshness and model version; mark changed data as unverified."],["Own","Name who negotiates with the agency and informs the public."]],"question":"Record the revised decision and the next evidence. Do not hide the initial uncertainty.","answer":"A defensible revision responds to the changed assumption, keeps missing evidence visible and names a responsible role. For the AI-produced feed, show its declared model version and flag data produced since the change as unverified until the agency confirms how its classifications changed.","nodes":[["1 · New information",""],["2 · Reassess",""],["3 · Revise",""],["4 · Own",""]],"full":"<p>One participating feed changes to a slower update schedule while keeping the same interface shape.<\/p><p><b>Reassess.<\/b> Explain the effect of the changed constraint.<\/p><p><b>Evidence.<\/b> Name the observation that would defeat the revised claim.<\/p><p><b>Ownership.<\/b> State who reviews and accepts the bounded scope.<\/p>","sourceStart":1,"aiTag":true,"notes":"Accept revisions that label freshness and model version and mark data produced since the change as unverified. Ask who negotiates an announcement agreement with the agency and who tells the public what changed."},{"id":"END","title":"Before the assignment","phase":"TRANSFER","full":"<p><\/p>","sourceStart":1}],"stations":[{"title":"State a claim and its evidence","think":"Devices down. What useful service can be promised without pretending to control every owner? What can be promised about a feed produced by another owner’s AI model?","pair":"Identify one assumption and one fact you would need to justify the claim.","write":"Add a claim and evidence; mark requested tests as proposed.","fields":["claim","evidence"],"hint":"Name the service or property first. Use a source definition and the given observations. Ask which missing denominator, contract or condition would change the claim.","answer":"A bounded answer distinguishes the given facts from the needed evidence. A source explanation supports a mechanism; it does not prove the fictional deployment has passed a test. The dashboard can promise what it observes—source, timestamp, declared model version—not the correctness of classifications made by a model it cannot inspect.","no":1,"at":"CHECK1","seconds":180,"note":"Think without devices, then pair. Choosing when not to use technology is part of using it well. Use the same artifact; do not award a level from field length or a timer.","ai":["think"]},{"title":"Choose a mechanism; expose its limits","think":"Compare two mechanisms from this chapter for the opening case—for example, validating feed shape only, or also monitoring each feed’s content for sudden shifts and labelling it.","pair":"Ask your partner to argue for the mechanism you rejected. Identify a trade-off and a shared dependency or contract assumption.","write":"Add the warrant and uncertainty to the same card.","fields":["warrant","uncertainty"],"hint":"Explain why the mechanism could affect this claim, then identify a plausible common cause, incompatibility or boundary outside its evidence.","answer":"Tie the chosen mechanism to the required property and state what the alternative improves or sacrifices. Evidence of a shared dependency or mismatched assumption can defeat an apparently stronger design. Shape validation cannot see a change in meaning; monitoring distributions (for example, the share of ‘high severity’) can flag a shift but not prove which classification is right.","no":2,"at":"CHECK2","seconds":180,"ai":["think"]},{"title":"Change the constraint; revise and own","think":"One participating feed changes to a slower update schedule while keeping the same interface shape. The same agency also changed its AI model version: the feed’s shape is unchanged, but incidents are now classified differently.","pair":"Explain what changes in the claim, evidence or acceptable scope.","write":"Record counter-evidence and the revised bounded verdict; say plainly what your first card got wrong; name the responsible role and who must be told.","fields":["counter","revision"],"hint":"Do not simply repeat your initial answer. Name the changed assumption, evidence needed next and the condition under which your decision changes.","answer":"The new information changes the stated assumption, so the original evidence cannot be widened silently. Retain, restrict or revise the decision with a reason, a new verification requirement and a named owner. Freshness and meaning both changed with no schema change; the dashboard must label what it cannot vouch for and agree with the agency how model changes are announced.","note":"Classroom version only: the assessed assignment has its own new evidence, revealed after you commit.","no":3,"at":"APPLY","seconds":180,"ai":["think"]}],"rules":[{"no":1,"title":"Professional/ethical title + ill-structured crisis","targets":["TITLE","PREDICT"],"evidence":"A source-grounded fictional crisis starts a bounded engineering decision."},{"no":2,"title":"Domain Spine","targets":["MAP","COVERAGE"],"evidence":"Source sections and full original review remain visible."},{"no":3,"title":"Exactly five measurable CLOs","targets":["MAP","QUIZ"],"evidence":"One consistent set of five chapter objectives has practice opportunities."},{"no":4,"title":"Six H-Stack capabilities","targets":["HSTACK"],"evidence":"Six capabilities connect to the same artifact, not six extra tasks."},{"no":5,"title":"Predict → Constraint → Derive → Name","targets":["PREDICT","CHECK1"],"evidence":"A tentative answer is recorded before explanation and revised separately."},{"no":6,"title":"Mechanism from first principles","targets":["DEPLOY"],"evidence":"The named mechanism explains how behavior changes."},{"no":7,"title":"Architecture / implementation structure","targets":["DEPLOY","BRIDGE"],"evidence":"An implementation annotation connects mechanism, interfaces and evidence."},{"no":8,"title":"Alternatives + trade-off","targets":["CHECK2","BRIDGE"],"evidence":"Station 2 compares alternatives and their limits."},{"no":9,"title":"Measurement + falsification","targets":["CHECK1","EVIDENCE"],"evidence":"A test or calculation needs defined observations and reversal conditions."},{"no":10,"title":"Known / Unknown / Monitor design review","targets":["MONITOR"],"evidence":"A monitor needs a quantity/event, window, trigger, owner and action."},{"no":11,"title":"Saudi-aligned engineering context","targets":["LOCAL"],"evidence":"Local constraints need actual institutional evidence before real use."},{"no":12,"title":"Accountability annotations","targets":["CARD","LOCAL"],"evidence":"The decision and review roles are named; no automated sign-off."},{"no":13,"title":"Trend / contemporary practice","targets":["PRACTICE"],"evidence":"Connect the source to a versioned workflow actually used by the student."},{"no":14,"title":"Practitioner wellbeing as a system variable","targets":["WELLBEING"],"evidence":"Workload, handover and realistic response capacity enter the design."},{"no":15,"title":"Critical AI literacy + permissibility gate","targets":["AI"],"evidence":"Disclose assistance and independently check evidence-chain claims."},{"no":16,"title":"Portfolio task launch","targets":["PORTFOLIO"],"evidence":"The classroom artifact transfers to the separate existing assignment."},{"no":17,"title":"Constraint mutation / adaptation","targets":["APPLY"],"evidence":"Station 3 changes an assumption and requires a defended revision."},{"no":18,"title":"Evidence policy / proof of capability","targets":["EVIDENCE"],"evidence":"Differentiate source, fictional data, calculation, proposal and executed test."},{"no":19,"title":"Four-level capability rubric","targets":["RUBRIC"],"evidence":"Four descriptors support human review, not automatic grading."},{"no":20,"title":"Bounded assurance case + professional decision","targets":["CARD","PORTFOLIO"],"evidence":"A bounded claim, evidence, reasoning, counter-evidence, uncertainty and verdict remain together."}],"readings":[{"title":"SoS classification and independence","range":"15–20"},{"title":"Data feeds and architecture patterns","range":"48–53"}],"groups":[{"title":"Opening and source outline","start":1,"end":2,"units":["MAP"]},{"title":"SoS characteristics and complexity","start":3,"end":14,"units":["X01","X02","CHECK1"]},{"title":"Classification and reductionism","start":15,"end":26,"units":["X02A","X03","CHECK1"]},{"title":"Engineering, interfaces and deployment","start":27,"end":39,"units":["X04","X05","DEPLOY","CHECK2"]},{"title":"Testing and architecture principles","start":40,"end":47,"units":["X06","CHECK2","X09"]},{"title":"Data feeds, containers and trading","start":48,"end":63,"units":["X08","CONTAINER","TRADING"]}],"sourceCount":63,"original":"sources/Ch20-Original.pptx","textbook":"sources/Ch20-Textbook.pdf","bookPages":30,"quiz":[{"q":"In Sommerville’s definition, what makes a system a system of systems?","options":["It contains two or more independently managed elements","It has more than a set number of components","It is spread across several data centres"],"answer":0,"why":"A system of systems contains two or more independently managed elements; size or distribution alone does not make one."},{"q":"Owners join a voluntary governance body and implement its decisions in their own policies. Which class of SoS is this?","options":["Organizational (Maier: directed)","Federated (Maier: collaborative)","Coalition (Maier: virtual)"],"answer":1,"why":"Federated systems depend on a voluntary governance body of all owners; coalitions have no formal governance, and organizational SoS are governed within one organization."},{"q":"Which reductionist assumption fails in a system of systems?","options":["That a system is made of parts with relationships","That interfaces between parts can be described","That one owner controls the system and resolves disputes"],"answer":2,"why":"Reductionism assumes a single controlling authority, rational technical decisions and clear boundaries; a SoS has several owners, and decisions are often political."},{"q":"Why is testing a system of systems difficult?","options":["Constituent systems may change during testing, so tests may not be repeatable","Automated tests cannot be used when systems are distributed","Every constituent system must be frozen until testing ends"],"answer":0,"why":"There may be no detailed specification, constituents may change during testing, and problems may need intermediate software rather than changes to a constituent."},{"q":"In which SoS pattern is there no principal system, with each participant publishing its own interface?","options":["Systems as data feeds","Trading systems","Systems in a container"],"answer":1,"why":"In a trading SoS, processing can happen in any system and participants exchange information directly; data feeds and containers both have a principal system."}],"alignment":[{"objective":"Recognize operational and managerial independence.","evidence":"Explain and demonstrate: Recognize operational and managerial independence.","field":"FIT"},{"objective":"Classify SoS and explain three kinds of complexity.","evidence":"Explain and demonstrate: Classify SoS and explain three kinds of complexity.","field":"transfer question + BOUND"},{"objective":"Explain why reductionist assumptions can fail.","evidence":"Explain and demonstrate: Explain why reductionist assumptions can fail.","field":"source application + FIT"},{"objective":"Plan interfaces, staged deployment and cross-system tests.","evidence":"Explain and demonstrate: Plan interfaces, staged deployment and cross-system tests.","field":"INTEGRATE + EVIDENCE"},{"objective":"Compare data-feed, container and trading architectures.","evidence":"Explain and demonstrate: Compare data-feed, container and trading architectures.","field":"ACT + REFIT"}],"artifact":"Build an authority/participation map, interface/freshness contract and staged acceptance plan.","bridge":"Build an authority/participation map, interface/freshness contract and staged acceptance plan. Annotate the point where the source mechanism changes behavior, its input/output assumptions and the evidence needed to check it.","mechanism":"DEPLOY","workload":"Consider cross-owner coordination and escalation when no person has complete system authority.","practice":"Source mechanism → actual tool/version → inspected artifact → limitations.","aliases":{"C01":"COVERAGE","PREP":"QUIZ","J01":"READINESS","J02":"QUIZ","X10":"X09"},"roadmap":{"question":"What can independent system owners promise together?","connection":"Independence creates complexity; classification exposes authority; engineering and architecture coordinate useful, bounded cooperation.","inClass":"Map owners, interactions and staged service commitments.","deliverable":"An authority map and staged acceptance plan.","success":"Explain what remains outside the shared decision-maker’s control.","branches":[{"verb":"Understand the relationships","label":"System complexity","detail":"Technical · managerial · governance","target":"X02","units":["X01","X02"],"caseLens":"Which participants remain independently useful and independently managed?"},{"verb":"Locate authority","label":"SoS classification","detail":"Organizational · federated · coalition","target":"X02A","units":["X02A","CHECK1"],"caseLens":"What authority does the dashboard owner actually have over each feed?"},{"verb":"Question the assumptions","label":"Reductionism and complex systems","detail":"Independence · emergence · limits of decomposition","target":"X03","units":["X03"],"caseLens":"Why can local correctness fail to guarantee the shared dashboard promise?"},{"verb":"Coordinate change","label":"Systems of systems engineering","detail":"Interfaces · staged deployment · cross-system tests","target":"X04","units":["X04","X05","DEPLOY","X06","CHECK2"],"caseLens":"How do owners coordinate interfaces, staged changes, and cross-system tests?"},{"verb":"Structure cooperation","label":"Systems of systems architecture","detail":"Data feeds · virtual container · trading","target":"X09","units":["X09","X08","CONTAINER","TRADING","AISYS","APPLY"],"caseLens":"Which architecture pattern can keep service useful when a feed slows or changes?"}]},"disclosure":"The AI extension was drafted with AI assistance and reviewed by the instructor. Declare your own AI use the same way.","hook":"Same data format. New AI model. Different meaning. Who noticed?","aiAssignment":{"title":"City dispatch with three owners’ AI","scenario":"A city dashboard coordinates ambulances from three independent owners: two public hospitals and a private ambulance company. Each owner runs its own AI system to rank incoming calls by urgency and publishes its ranked queue to the dashboard.","facts":["The dashboard can read each queue but cannot change any owner’s model.","All three owners use the same interface format.","There is no agreement on how model changes are announced."],"question":"What can the city dashboard promise about urgency across owners, and what must be agreed between them?","stress":"The private company updates its AI to weight calls from contract customers more heavily. The interface is unchanged, so the dashboard shows those calls as more urgent than equivalent calls from others.","hints":{"fit":"Name the chapter concept that decides this, and why it fits the case.","bound":"An observable condition—what you would see—that ends the claim.","act":"One concrete engineering action: a check, a change, a test or a restriction.","evidence":"What another engineer could inspect that stays valid even if the AI is wrong."},"words":"180–260","framing":"Changing your mind with specific counter-evidence is rewarded; a lucky first answer is not. Link your ACT to a recognised practice where it helps—for example a NIST AI RMF function (Govern, Map, Measure, Manage)."},"cs2023":[["SE-Teamwork","Teamwork","Interfacing with stakeholders outside the team."],["SE-Refactoring","Refactoring and Code Evolution","Compatibility with consumers you cannot see or control."],["SE-Design","Software Design","Identifying component boundaries and dependencies."],["SEP","Society, Ethics, and the Profession","Public impact and accountability across independent owners."]]}</script><script src="runtime/source-figures.js?v=20261004-andor"></script><script src="runtime/national-content.js?v=20260928-campus-v3"></script><script src="runtime/labs.js?v=20261003-extra-v1"></script><script src="runtime/story-v3.js?v=20261005-lab2"></script><script src="runtime/classroom-v3.js?v=20261005-lab2" defer></script></body></html>
