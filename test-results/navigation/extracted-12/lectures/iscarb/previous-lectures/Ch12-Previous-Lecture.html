 student actually filled and cannot be talked up. Point at the gap between the two &mdash; it is always a specific empty box, which is why this is a teaching instrument rather than a mark. The semester grade weights belong to the Week 01 kickoff and repeating them here wastes ninety seconds &mdash; this slide answers the only question that matters tonight: what separates a weak answer from a defensible one in THIS chapter. Make each student name their own level out loud; most say L2 and are right, and the honesty is the point. Keep formal scoring off the live slide, as the peer-review rule requires. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R17", "rule": "RULE 17 - Constraint mutation", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Defend a verdict under a changed constraint, or explain precisely why it changes and who re-signs.", "title": "The live engineering defense", "sub": "You will not only present a verdict; the constraint will change live.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "teal", "lab": "1 PRESENT", "txt": "State hazard + evidence"}, {"c": "mag", "lab": "2 MUTATE", "txt": "Constraint changes live"}, {"c": "sand", "lab": "3 REASON", "txt": "Re-run the hazard analysis"}, {"c": "violet", "lab": "4 DEFEND", "txt": "Show the changed fault tree"}, {"c": "green", "lab": "5 VERDICT", "txt": "Revise only if needed"}]}, {"t": "wide", "c": "sand", "lab": "MUTATE TONIGHT&rsquo;S CASE &mdash; PICK ONE", "picker": {"g": "mutation", "options": ["The pump moves to a paediatric ICU", "The regulator halves the intolerable threshold", "Budget halves: one engineer only", "The dose module is now AI-generated"]}, "field": {"id": "mutation_defend", "core": true, "rows": 2, "ph": "Which part of your verdict survives, and which part collapses &mdash; and why"}}, {"t": "principle", "txt": "A strong design either survives mutation &mdash; or explains exactly why it changes."}], "timebox": "4 min", "hueOk": "PRESENT, MUTATE, REASON, DEFEND, VERDICT is the five-step defense, coloured to match the Rule 06 flow it re-runs under pressure.", "task": "Pick one mutation and state which part of your verdict survives and which collapses. <b style=\"color:var(--mag)\">You are the project safety engineer.</b>", "notes": "Four minutes, and the unit that turns a case into a capability. Reward the student who says a part collapses &mdash; stronger than a verdict that magically survives everything. Refusing to revise under a changed constraint is not robustness; it is not having reasoned in the first place.", "appendix": true, "route": "toolkit"}, {"k": "R19", "rule": "RULE 19 - Quick card", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Test a peer's claim for inspectability and falsifiability in two questions.", "title": "Peer-review quick card", "sub": "Use two questions in class; keep formal scoring outside the live slide.", "blocks": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "1 &nbsp; IS THE EVIDENCE INDEPENDENTLY INSPECTABLE?", "txt": "Could another team verify the safety claim without trusting your explanation, or the AI or tool that prepared it? Is the hazard log, fault tree, safety requirement and test result all on file?", "field": {"id": "peer1", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}, {"c": "mag", "lab": "2 &nbsp; WHAT WOULD MAKE THE CLAIM FAIL?", "txt": "Name the hazard, missing fault tree branch, missing safety requirement, or unmet operational profile that would reverse the verdict.", "field": {"id": "peer2", "core": false, "rows": 2, "ph": "Your partner&rsquo;s card &mdash; your answer"}}]}, {"t": "principle", "txt": "Inspectability + falsifiability before formal scoring."}], "timebox": "3 min", "cut": true, "task": "Exchange one decision card with a peer; answer Q1 and Q2 only.", "notes": "Three minutes, strict. Do not let this become a general critique session &mdash; two questions only, which is precisely why the formal rubric stays off the live slide. Students who cannot answer Q1 about someone else&rsquo;s card usually discover the same gap in their own. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "J01", "title": "Learning outcomes and readiness alignment", "phase": "LEARN", "route": "toolkit", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Five chapter objectives</b> support syllabus CLO 4. Knowledge is checked through explanation; skills through the chapter artifact; responsibility through evidence limits, AI disclosure and human review.</p><p>NCAAA / Jaheziah: this is a teaching alignment view. The supplied files do not establish an approved current national item-weight or departmental mapping. Course-written practice questions are not official exam items or a prediction of national-test performance.</p></div>"}], "noAnswer": true, "appendix": true}, {"k": "R20", "loadOk": "The four self-assessed gates and five evidence-based outcome rows are two linked readiness instruments. Students close one gap and write one take-home line. Keep the instruments visible in sequence; use vertical scrolling for expansion.", "answer": "Example: In this chapter, engineering means making a bounded decision that another person can inspect, challenge and sign, with a named hazard behind it and a named owner for the consequences. To close a readiness gap, add the specific missing artifact or reasoning to the corresponding field, then reassess the four gates; do not mark a gate passed merely because the model answer sounds convincing.", "rule": "RULE 20 - Take-home decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Read their own readiness off the artifact they produced, and name the next piece of work.", "title": "Are you ready to engineer?", "sub": "The gates are self-assessed. Filled fields indicate that a response exists; the instructor must judge whether its reasoning is sound.", "badge": {"c": "", "t": "READINESS CHECK", "s": "click each gate you can honestly pass"}, "blocks": [{"t": "gates"}, {"t": "clomap"}, {"t": "principle", "txt": "A decision is not ready until evidence, counter-evidence, uncertainty, and ownership are visible."}, {"t": "wide", "c": "sand", "lab": "TAKE-HOME DECISION", "field": {"id": "takehome", "core": false, "rows": 1, "ph": "In this chapter, engineering means ... (use a hazard and ownership)"}}], "timebox": "3 min", "task": "Close the gap on one unsupported outcome, pass the gates you can honestly pass, then write: &ldquo;In this chapter, engineering means ...&rdquo; <b style=\"color:var(--mag)\">You are the project safety engineer.</b>", "notes": "No automatic check certifies mastery. Review the chapter outcomes and the actual quality of evidence.", "appendix": true, "route": "toolkit"}, {"k": "X07", "answer": "Illustrative causal hypothesis for tonight: the absence of a daily cumulative dose check in the safety case is the HAZARD; the pump&rsquo;s controller believing the dose delivered so far today was below the daily maximum is the unsafe CONDITION; the overdose delivered to the child between 03:00 and 06:30 is the ACCIDENT; the child&rsquo;s hypoglycemic crisis is the DAMAGE. The safety case alone does not prove this chain. Verify the fault tree and dose logs before presenting it as the actual incident.", "rule": "X07 - The words you will swap by mistake", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Distinguish hazard, accident and damage, and say which safety strategy addresses each one.", "title": "Hazard, accident, damage &mdash; and which strategy catches each", "sub": "Three words for three different things, and three strategies students report interchangeably. Get these wrong and every later sentence is wrong with them.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "vocabulary, not a source page"}, "blocks": [{"t": "compare", "head": ["Term", "What it is", "Where you would look for it", "Tonight&rsquo;s pump"], "rows": [{"c": "teal", "cells": ["Hazard", "A condition with the potential to cause an accident.", "Hazard log, fault tree, hazard identification review.", "Missing daily cumulative dose check in the safety case."]}, {"c": "sand", "cells": ["Accident", "An unplanned event causing death, injury or damage.", "Incident report, hospital records, regulator&rsquo;s file.", "The overdose delivered to the child between 03:00 and 06:30."]}, {"c": "mag", "cells": ["Damage", "The loss resulting from the accident.", "Medical records, harm assessment, restitution record.", "The child&rsquo;s hypoglycemic crisis and overnight admission."]}]}, {"t": "compare", "head": ["Strategy", "The question it answers", "When it acts", "Used tonight?"], "rows": [{"c": "teal", "cells": ["Hazard avoidance", "Can the hazard be designed out?", "Before run time", "Partial &mdash; maxOverride on the hardware override."]}, {"c": "teal", "cells": ["Hazard detection & removal", "Can the hazard be caught before accident?", "At run time", "Failed &mdash; the alarm did not sound (SR5 broken)."]}, {"c": "sand", "cells": ["Damage limitation", "Can the harm be minimised if accident occurs?", "After accident", "Partial &mdash; the parents found the child, called 911."]}, {"c": "sand", "cells": ["Process assurance", "Was the development process dependable?", "Throughout development", "Unknown &mdash; the hazard log was not produced."]}]}, {"t": "conceptflow", "items": [["HAZARD", "Condition exists"], ["ACCIDENT", "Event occurs"], ["DAMAGE", "Loss results"]]}, {"t": "principle", "c": "mag", "txt": "A hazard nobody reaches causes nothing. An accident with no hazard behind it does not exist."}], "hueOk": "Three terms and three strategies each carry their own colour so the student can find the same row again on the comparison; one colour would make both tables read as undifferentiated lists.", "timebox": "2 min", "cut": true, "task": "Write tonight&rsquo;s incident as one sentence naming the hazard, the accident and the damage in that order.", "say": "You will lose marks all semester for swapping these three words. Two minutes now saves that.", "notes": "<b>The sentence to make them write:</b> most students write &ldquo;the pump was unsafe and the child was injured&rdquo; and stop &mdash; that names none of the three terms correctly. The useful sentence names all three in order &mdash; <i>this hazard</i>, reached under <i>these conditions</i>, caused <i>this accident</i>, which produced <i>this damage</i> &mdash; and that is also the shape of a defensible incident report. Two minutes, and it is worth the two even though nothing here is new to a strong student &mdash; the weak half of the room has been using these three words as synonyms since first year, and the cost only shows up in the assignment. Do not read the tables aloud; that is what they are for. Instead ask one student to say tonight&rsquo;s incident as the three-part sentence, and correct only the ordering. The second table is the one to point at when a student later writes &ldquo;the system was unreliable&rdquo; about an incident where the system ran to spec: safety and reliability are different promises, and the right-hand column already says which strategy tonight actually needed. This is a designated cut point: if behind, say the three-part sentence once and move on. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R14", "rule": "RULE 14 - Practitioner workload", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Name a workload cost their safety design creates for a practitioner, and the design change that reduces it.", "title": "Engineering changes human work", "sub": "A safe design can still fail operationally if it creates unsustainable workload.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "ALARM BURDEN", "lead": "How many alarms per shift, and what gets silenced?", "txt": "A pump that alarms on every marginal reading trains nurses to silence the alarm rather than read it. SR5 says the alarm &ldquo;shall be sounded&rdquo; &mdash; it does not say how often. Tonight&rsquo;s alarm did not sound; on a quieter night it might have sounded 200 times and been silenced anyway."}, {"c": "sand", "lab": "HAZARD LOG WORKLOAD", "txt": "Who maintains the hazard log, who reviews it, who signs off &mdash; and do they have the hours the process assumes?"}, {"c": "mag", "lab": "DELIVERY SPEED", "txt": "What schedule pressure is the team absorbing, and what does it push them to skip? A safety case signed off on 400 tests is a schedule choice, not a technical one."}, {"c": "violet", "ic": "spark", "lab": "WHO WRITES IT NOW", "lead": "Generated code moves the load; it does not remove it.", "txt": "Writing hours fall, reviewing hours rise &mdash; on the same people, now reviewing more that they did not write. The dose-calculation module is exactly the kind of code a model writes plausibly and a reviewer under-scrutinises."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT, THIS IS THE MECHANISM &mdash; NOT A FOOTNOTE", "lead": "Blaming the developer ends the investigation. Workload as a design input continues it.", "txt": "The safety case was signed off on 400 tests because there was not time for 4,000. The hazard log was not maintained because there was not a named owner with hours for it. The alarm was not heard because the room has learned to silence it. Each of these is a workload variable, not a discipline problem. The source says process assurance is essential for safety-critical systems (p.37) and that personal responsibility is important because failures may lead to legal actions (p.38). Blaming the developer ends the investigation; treating workload as a design input continues it.", "field": {"id": "workload", "core": false, "rows": 2, "ph": "One workload cost your safety design creates for a real practitioner, and the concrete design change that reduces it", "ex": "<i>Shape only:</i> &ldquo;My design adds a hazard log entry per anomaly. With generated drafts the team now files four times as many, so the reviewer becomes the bottleneck. Design change: anomalies below a stated risk band get a standing pre-approval, and the reviewer sees a weekly batch instead of a queue.&rdquo;"}}, {"t": "principle", "txt": "Trade-offs include people, process, evidence and time &mdash; not only code."}], "timebox": "90 sec", "task": "Name one workload cost your preferred safety design creates for a real practitioner, and the design change that reduces it.", "notes": "The rule with no equivalent in the textbook, and where ISCARB differs from a standard safety lecture. Do not let it become a wellbeing aside: the test is whether a student names a concrete design change &mdash; alarm rationalisation, a hazard log owner with named hours, a second pair of eyes on the safety review. If they only express sympathy, push again. <b>The violet card is the one to spend time on.</b> Every student in the room is already using generated code, and almost none of them has been asked what it did to the review load rather than to the writing load. Two things to say. First, the honest framing: the tool did not remove the work, it moved it &mdash; from writing, which is visible and estimated, to reviewing, which is neither. Second, connect it to the crisis: the safety case was signed off on 400 tests because there was not time for more, and a reviewer who signs without reading the fault tree is the same failure with a keyboard. If a student answers &ldquo;it just makes us faster&rdquo;, ask who reviews the faster output and how many hours they have.", "appendix": true, "route": "toolkit"}, {"k": "X08", "answer": "Illustrative target, not a measured result or a value from the chapter: Monitor the daily cumulative dose against the daily maximum. Target: cumulative dose below 80% of daily max at any time, checked continuously with a per-shift summary. If the target is missed, sound the audible alarm (SR5), suspend delivery (SR6), alert the on-call bioengineer, and revert to manual monitoring. The target and fallback require approval for the actual system.", "rule": "X08 - The same ideas, the other vocabulary", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Say the safety idea they have just used in the vocabulary a services team would use for it.", "title": "You already know these. You may not know their other names.", "sub": "Left column: what this chapter calls it. Right column: what the same argument is called where most of you will work. Same idea, different room.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "not in the chapter &mdash; the chapter predates the vocabulary"}, "blocks": [{"t": "compare", "head": ["In this chapter", "Where most of you will work", "What the second one adds"], "rows": [{"c": "teal", "cells": ["Safety, as a property", "A safety SLA &mdash; a stated bound on harm over a stated window", "A bound and a period, so the argument stops being about whether it is safe and starts being about whether the bound was met"]}, {"c": "teal", "cells": ["Hazard (a condition with the potential to cause an accident)", "A risk &mdash; the likelihood and impact of an event", "It makes the hazard a quantity you can put on a matrix and a dashboard"]}, {"c": "sand", "cells": ["A monitor with a trigger value and an owner (Rule 10)", "An actionable alert, with a runbook", "The rule that an alert nobody acts on is deleted, not tuned"]}, {"c": "sand", "cells": ["Hazard, accident, damage (X07)", "The incident, and the post-incident review that follows it", "A written review with an owner and follow-up actions &mdash; the artifact this course keeps asking for"]}, {"c": "mag", "cells": ["A safety case with a structured argument (B01)", "An SRE error budget and a postmortem culture", "It moves the defence from the document to the operating practice &mdash; but the document is still where the regulator reads it"]}, {"c": "violet", "cells": ["Fault tree analysis (X05)", "A blameless postmortem with a 5-whys root cause", "A written review with an owner and follow-up actions &mdash; the fault tree is the formal version of the same discipline"]}]}, {"t": "wide", "c": "violet", "lab": "ONE LINE, IN THE OTHER VOCABULARY", "field": {"id": "vocab_own", "core": false, "rows": 1, "ph": "Take the monitor you wrote in Rule 10 and state it as a target, a window, and what happens when it is missed"}}], "hueOk": "Colours carry over from X07 and B01 so the student recognises which family each row belongs to; the row is a translation, and the colour is what says of what.", "timebox": "90 sec", "cut": true, "task": "Read the middle column. Then restate your own Rule 10 monitor in it.", "say": "Nothing here is new. It is the same six arguments with the names they are given in the room you are about to walk into.", "notes": "Ninety seconds, and resist expanding it &mdash; the point is recognition, not instruction. Two things worth saying. First, the honest history: this chapter was written before the vocabulary in the middle column existed as a discipline, so the gap is chronological rather than a disagreement, and the concepts map almost one to one. Second, the direction of the translation matters: a student who learns only the middle column can run a dashboard and cannot argue a safety case, while a student who has both can do both, which is the actual advantage this degree gives them. If someone asks which vocabulary is right, the answer is the room you are in &mdash; a regulator will not accept an error budget and a service team will not accept a hazard log, and knowing which is which is the skill. This is a designated cut point: if behind, assign this activity as follow-up. The source ledger is at C01.", "appendix": true, "route": "toolkit"}, {"k": "R15", "answer": "<b>Read the four questions as evidence-chain use / independent re-derivation / independent testing / named sign-off.</b><ul><li>No / not applicable / not applicable / not applicable: permitted for preparation only; it does not enter the evidence chain.</li><li>Yes / No / No / Yes: not permitted; the output cannot be independently checked.</li><li>Yes / No / Yes / Yes: permitted conditionally; record the test and its result as evidence, not the generated output alone.</li><li>Yes / Yes / not needed / Yes: permitted as prepared evidence, with independent re-derivation and named sign-off.</li><li>If evidence-chain use is Yes and named sign-off is No: not permitted, regardless of the checking method.</li></ul>", "rule": "RULE 15 - AI assist + human sign-off", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Run a permissibility gate on a real AI output, tell re-derivation from testability, and accept the verdict.", "title": "AI prepares evidence; humans own assurance", "sub": "AI is permitted for preparation, never for unowned approval.", "badge": {"c": "mag", "t": "AI MOMENT", "s": "assist, not assurance"}, "blocks": [{"t": "aiflow"}, {"t": "aigate"}], "timebox": "90 sec", "task": "Run the gate on the way you actually used AI this week &mdash; on a real output, not a hypothetical. <b style=\"color:var(--mag)\">You are the project safety engineer.</b>", "notes": "The gate is the rule, not the three stations above it &mdash; make every student run it on something they really did this week, not on a hypothetical. <b>The two middle questions are the whole slide.</b> Re-deriving and testing are different acts, and a generative output almost never survives the first and very often survives the second &mdash; which is why the gate has a third verdict. Yes / no / yes / yes returns <i>permitted, conditionally: the test is the evidence, not the output</i>, and that sentence is the one to write on the board. It means the artifact you file is the test you ran and what it showed, never the prompt or the answer. A student who cannot say which of the two middle questions their own use passed has not yet understood what they filed. The remaining trap is yes / no / no: an output that becomes evidence and is neither re-derivable nor testable is exactly the unverifiable claim this course exists to refuse. Note what is deliberately absent: vendor benchmark numbers. If a student cites an accuracy figure or a mean-time-to-failure, ask which study. That is the break-even discipline from X04 applied to AI, and if you let it slide the session&rsquo;s whole argument about evidence collapses in its final ten minutes.", "appendix": true, "route": "toolkit"}], "appendixUnits": ["READING", "PREP", "C01", "SRC00", "SRC01", "SRC02", "SRC03", "SRC04", "SRC05", "SRC06", "R01", "R02R03", "R08", "R10", "R12", "J02", "R02", "R03", "R04", "R05", "H01", "QA1", "QA2", "R06", "R07", "QA3", "R11", "R13", "QA4", "R16", "R17", "R19", "J01", "R20", "X07", "R14", "X08", "R15"], "mainUnits": ["TITLE", "START", "X01", "X02", "X02A", "X03", "CHECK1", "X04", "X05", "X06", "X09", "CHECK2", "R09", "R18", "D12", "B01", "X10", "APPLY", "END"], "path": {"chapter": 12, "assignment": 3, "exit": ["Separate hazard, accident and risk.", "Explain avoidance, detection/removal and damage limitation.", "Read a fault tree and identify its assumptions.", "Link a safety requirement to a verification method.", "Explain a safety case and the limits of formal/static analysis."], "sourceFile": "sources/Ch12-Original.pptx", "build": "20260921-visual-v3"}, "study": {"readings": [["Fault-tree reasoning and reduction", 25, 30], ["Static analysis", 50, 53]], "technical": "For a hazard with two AND-connected causes, explain why multiplying their probabilities may be invalid. Identify one possible common cause; no probability calculation is required.", "oral": "A static analyzer reports no warnings. Which safety claim would still require different evidence?", "quiz": [["An exposed moving mechanism could injure a person. Before an injury occurs, this is best described as:", ["An accident already observed", "A hazardous situation", "A guaranteed software fault"], 1, "A hazard is a condition with potential for harm; an accident is the harmful event."], ["Physically preventing a dangerous state is closest to:", ["Hazard avoidance", "Damage limitation after an accident", "Ignoring the hazard"], 0, "Avoidance removes or prevents the hazardous condition."], ["When may independent-branch probabilities be multiplied at an AND gate?", ["Always, because of the symbol", "Never under any model", "When the probabilistic model and independence are justified"], 2, "Logical structure does not itself establish statistical independence."], ["Which link is necessary in a safety trace?", ["Hazard → testable safety requirement → suitable verification", "Requirement → attractive interface only", "Warning count → guaranteed safety"], 0, "The verification activity must address the actual requirement and hazard."], ["A clean static-analysis report supports:", ["System safety under every condition", "Only the checked properties within the tool’s scope", "A complete safety case without other evidence"], 1, "Safety cases combine claims, arguments, evidence and justified assumptions."]]}, "caseMap": [{"title": "Classroom application", "parts": [["Claim and evidence", "f:path_claim"], ["Limit and challenge", "f:path_limit"], ["Owner and next step", "f:path_owner"]]}], "visualStory": {"units": {"X01": {"takeaway": "Safety asks whether the system can cause unacceptable harm.", "nodes": [["Hazard", "Potential for harm"], ["Accident", "Harm occurs"], ["Control", "Reduce the risk"]], "visual": "flow"}, "X02": {"takeaway": "Correctly implementing an unsafe requirement does not make a system safe.", "nodes": [["Specification", "Unsafe obligation"], ["Implementation", "Follows it correctly"], ["System", "Can still cause harm"]], "visual": "flow"}, "X02A": {"takeaway": "Separate the danger, the event and the consequence.", "nodes": [["Hazard", "Potential danger"], ["Risk", "Likelihood and consequence"], ["Safety", "Acceptable risk argument"]], "visual": "compare"}, "X03": {"takeaway": "Start with a hazard and trace it to a verifiable requirement.", "nodes": [["Identify", "What can harm?"], ["Assess", "How serious?"], ["Analyze", "How could it happen?"], ["Reduce", "What must change?"]], "visual": "flow"}, "X04": {"takeaway": "Risk acceptance needs an explicit criterion and a responsible decision.", "nodes": [["Unacceptable", "Reduce or avoid"], ["Tolerable", "Justify controls"], ["Acceptable", "Keep the evidence"]], "visual": "ch12_risktri"}, "X05": {"takeaway": "A fault tree describes logic; probability calculations need extra assumptions.", "nodes": [["Top event", "Harmful outcome"], ["OR gate", "Any branch sufficient"], ["AND gate", "Branches jointly needed"]], "visual": "ch12_faulttree"}, "X06": {"takeaway": "A safety requirement must identify the control and how to verify it.", "nodes": [["Hazard", "Excess dose"], ["Control", "Bound the dose"], ["Verification", "Exercise the boundary"]], "visual": "flow"}, "X09": {"takeaway": "Track the safety argument as requirements and implementations change.", "nodes": [["Hazard record", "Identified concern"], ["Design control", "Linked requirement"], ["Verification", "Versioned evidence"]], "visual": "flow"}, "R09": {"takeaway": "A hazard log is useful when each unresolved risk has an owner and next action.", "nodes": [["Hazard", "Describe it"], ["Owner", "Accountable reviewer"], ["Status", "Evidence and closure"]], "visual": "flow"}, "R18": {"takeaway": "Model checking explores the model, including states humans may overlook.", "nodes": [["Model", "States and transitions"], ["Property", "What must hold"], ["Result", "Proof or counterexample"]], "visual": "ch12_modelcheck"}, "D12": {"takeaway": "A clean analysis report does not establish complete system safety.", "nodes": [["Code", "What was analyzed"], ["Rules", "Defects sought"], ["Limits", "What remains unchecked"]], "visual": "flow"}, "B01": {"takeaway": "Connect the safety claim to evidence through an explicit argument.", "nodes": [["Claim", "What is safe?"], ["Argument", "Why does evidence support it?"], ["Evidence", "What was checked?"]], "visual": "ch12_structarg"}, "X10": {"takeaway": "An argument must cover the relevant paths and name its assumptions.", "nodes": [["Path analysis", "Inspect each branch"], ["Safety condition", "Show why it holds"], ["Assumptions", "State what remains external"]], "visual": "ch12_safetyarg"}}, "opening": {"headline": "The program followed its rules. A patient was harmed.", "case": "In this fictional case, a pump exceeds its dose limit and the expected audible alarm does not sound.", "question": "Which hazard-control link failed?", "nodes": ["Hazard", "Requirement", "Control", "Verification"]}, "version": "20260921-visual-v3"}};

/* ---------- v12 retrieval loop: 60 seconds at the close of every phase ------

var QA_C=326.7;                                  /* ring circumference, r=52  */
function rQa(b){

    '<div class="qa-side">'+
     '<button class="qa-ring" data-qa-ring="1" aria-label="Start the sixty-second retrieval timer">'+

  }

}
function qaRing(btn){
  var box=btn.closest('.qa'),fg=btn.querySelector('.qa-rfg'),num=btn.querySelector('.qa-secs');
  if(btn.getAttribute('data-running')){          /* running -> reset the ring */
    clearInterval(+btn.getAttribute('data-running'));
    btn.removeAttribute('data-running');
    fg.style.transition='none'; fg.style.strokeDashoffset='0';
    num.textContent='60'; box.classList.remove('over');
    return;
  }
  fg.style.transition='none'; fg.style.strokeDashoffset='0';
  void fg.getBoundingClientRect();               /* commit the reset position */
  fg.style.transition='stroke-dashoffset 1s linear';
  box.classList.remove('over');
  var left=60;
  var id=setInterval(function(){
    left--;
    fg.style.strokeDashoffset=(QA_C*(1-left/60)).toFixed(1);
    num.textContent=Math.max(0,left);
    if(left<=0){
      clearInterval(id); btn.removeAttribute('data-running');
      box.classList.add('over');
      var live=document.getElementById('tLive');
      if(live) live.textContent='The retrieval minute is over — reveal and compare.';

/* ---------- coach: a compensatory path, never the answer -------------------
   A coach block watches the inputs on its own slide and replies to what the
   student has actually written. It never contains the model answer — the reveal
   is still the next unit — it asks the question that unsticks a blank box. Three
   states so the author writes three lines: empty, thin, ok. */
function probe(ref){
  if(typeof ref!=='string') return '';
  if(ref==='@marks') return Object.keys(S.marks||{}).filter(function(k){return Array.isArray(S.marks[k])&&S.marks[k].length;}).join(' ');
  if(ref==='@gates'){var passed=GATE_DEFS.filter(function(g){return S.gates&&S.gates[g[0]];}).length;return passed?String(passed):'';}
  if(ref==='@signed'){var signed=Object.keys(S.sign||{}).filter(function(k){return S.sign[k];}).length;return signed?String(signed):'';}
  if(ref==='@trace') return (S.trace&&S.trace.length)?S.trace.join(' '):'';
  if(ref==='@matrix'){var n=0;for(var k in S.mx) if(S.mx[k]) n++; return n?String(n):'';}
  if(ref.indexOf('p:')===0) return S.pick[ref.slice(2)]||'';
  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';
  return '';
}
function policyThreshold(config,key){
  var policy=LECTURE.thresholds||{},name=(config&&config.minKey)||key;
  var value=config&&Number.isFinite(config.min)?config.min:policy[name];
  if(!Number.isFinite(value)||value<0)throw new Error('Invalid LECTURE.thresholds entry: '+name);
  return value;
}
function coachState(b){
  var w=b.watch||[], filled=0, thin=false, min=policyThreshold(b,'coachDeep'), deep=b.deep;
  for(var i=0;i<w.length;i++){
    var v=String(probe(w[i])||'').trim();
    /* only the boxes named in `deep` are held to a length — a NAME box is
       legitimately three words and must not be nagged for it */
    if(v){ filled++; if(w[i].indexOf('f:')===0 && (!deep||deep.indexOf(w[i])>=0) && v.length<min) thin=true; }
  }
  if(filled<policyThreshold(null,'coachMinFilled')) return 'empty';
  if(filled<w.length||thin) return 'thin';
  return 'ok';
}
function renderCoach(){
  var ws=document.querySelectorAll('[data-coach]');
  for(var i=0;i<ws.length;i++){
    var b=COACH[ws[i].getAttribute('data-coach')]; if(!b) continue;
    var st=coachState(b), lab=st==='ok'?'Committed':(st==='empty'?'Stuck?':'Nearly');
    ws[i].setAttribute('data-st',st);
    ws[i].innerHTML='<div class="coach-label">'+lab+'</div><div class="ct">'+T(b[st]||'')+'</div>';
  }
}

function rCoach(b){ COACH.push(b); return '<div class="coach" data-coach="'+(COACH.length-1)+'"></div>'; }

/* ---------- think · pair · share ----------

/* ---------- coverage ledger -------------------------------------------------
   THE PROBLEM THIS SOLVES, FOR EVERY SUBJECT, NOT JUST THIS ONE.
   A lecture built by choosing what earns a slide will always leave part of its
   source untaught. That is legitimate. What is not legitimate is nobody knowing
   which part — the author forgets, the next adopter cannot tell, and the
   department cannot evidence scope.

   So the lecture declares the source's own contents once, and the engine works
   out what was reached FROM THE PAGE CITATIONS ALREADY ON THE CARDS. Coverage is
   therefore derived from evidence the author had to produce anyway, not from a
   second list that drifts. A section nobody reached is printed in magenta with
   the author's written reason beside it, and COV-01 blocks a build where that
   reason is missing.

   Same discipline as the readiness map: read from the artifact, cannot be
   talked up, and an honest gap is a finding rather than a failure. */
function srcPages(){
  /* every page number this lecture actually cites, with the unit that cites it */
  var hits={};
  function add(p,k){ if(p>0){ (hits[p]=hits[p]||[]).push(k); } }
  function scanCard(it,k){
    var s=(it.src||'')+' '+(it.cap||'');
    var m=s.match(/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/g)||[];
    for(var i=0;i<m.length;i++){
      var r=/p\.\s*(\d+)\s*(?:[-–]\s*(\d+))?/.exec(m[i]);
      var a=+r[1], b=r[2]?+r[2]:a;
      for(var p=a;p<=b&&p-a<40;p++) add(p,k);
    }
  }
  function walk(bs,k){
    for(var i=0;i<(bs||[]).length;i++){
      var b=bs[i]; if(!b) continue;
      if(b.src||b.cap) scanCard(b,k);
      for(var j=0;j<(b.items||[]).length;j++) scanCard(b.items[j],k);
      if(b.right) walk(b.right,k);
    }
  }
  for(var u=0;u<LECTURE.units.length;u++) walk(LECTURE.units[u].blocks,LECTURE.units[u].k);
  return hits;
}
function coverageRows(){
  var C=LECTURE.coverage; if(!C||!C.sections) return [];
  var hits=srcPages(), out=[];
  for(var i=0;i<C.sections.length;i++){
    var s=C.sections[i], units={}, n=0;
    for(var p=(s.pp?s.pp[0]:0); p<=(s.pp?s.pp[1]:-1); p++){
      if(!hits[p]) continue;
      n++;
      for(var q=0;q<hits[p].length;q++) units[hits[p][q]]=1;
    }
    var keys=[]; for(var k in units) keys.push(k);
    var st = n===0 ? 'open' : (n===1||keys.length===1 ? 'touched' : 'taught');
    out.push({s:s, st:st, units:keys, pages:n});
  }
  return out;
}
/* The part that needs NO authored metadata at all, and is therefore the actual
   guarantee: given only the source's page span, every page inside it that no
   card cites is a page this hour never reached. True for any subject, any
   source, with nothing for the author to keep in sync — and it is the honest
   answer to "which concepts are missing?" when nobody can see the pages: name
   the pages, do not invent titles for them. */

  var C=LECTURE.coverage; if(!C||!C.span) return [];

  for(var p=C.span[0]; p<=C.span[1]; p++){
    if(hits[p]){ if(run){ out.push(run); run=null; } }
    else { if(run) run[1]=p; else run=[p,p]; }

}

/* ---------- hidden model answer / instructor key ---------------------------
   Every question-bearing unit gets the same open/close affordance. The author
   defines u.answer for a model response. Learning objectives and spoken teaching
   cues are never relabelled as answers. noAnswer suppresses a pre-reveal key. */
function hasQuestion(u){
  if(!u||u.k==='TITLE'||u.k==='END'||u.noAnswer===true) return false;
  if(typeof u.answer==='string'&&u.answer.trim())return true;
  if(u.question===true)return true;
  var probe=' '+(u.task||'')+' '+JSON.stringify(u.blocks||[])+' ';
  return /\?|\bchoose\b|\bclassify\b|\bdecide\b|\bname\b|\bwhich\b|\bwhat\b|\bwhy\b|\bhow\b/i.test(strip(probe));
}
function answerKey(u){
  return T(u.answer||'State a bounded claim, identify supporting evidence and name an observation that would reverse the claim. Compare your response with the source and discuss the reasoning with the instructor.');
}
function rAnswer(u){
  if(!hasQuestion(u)) return '';
  var id='ans-'+u.k, hasFields=/"field"\s*:|"picker"\s*:/.test(JSON.stringify(u.blocks||[]));
  return '<div class="answer-wrap">'+(hasFields?'<span class="attempt-hint">Try your own answer, then compare.</span>':'')+
    '<button class="answer-toggle" data-answer-toggle="'+id+'" aria-controls="'+id+'" aria-expanded="false"'+(hasFields?' data-soft="1"':'')+'>Answer</button>'+
    '<div class="answer-box" id="'+id+'" data-answer-box="'+id+'" hidden><b>EXAMPLE EXPLANATION</b><br>'+answerKey(u)+'</div></div>';
}

  var cs=getComputedStyle(sl);
  var avail=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(!(avail>0)) return;
  var h=fit.scrollHeight;
  if(h>avail+1){
    var f=avail/h;
    if(f<.55) f=.55;                     /* legibility floor — nothing unreadable */
    fit.style.transform='scale('+f+')';
    fit.style.transformOrigin='top center';
  }
}

/* ---------- author sanity check ---------------------------------------------
   Runtime guardrails for cloned/adapted lectures. Warnings never block class.
   Run ISCARB_SANITY() from DevTools at any time to re-check the current deck. */
function sanity(){
  var issues=[], declaredF={}, declaredP={}, usedImg={}, names=LECTURE.fieldNames||{};
  function walk(x){
    if(!x) return;
    if(Array.isArray(x)){ for(var i=0;i<x.length;i++) walk(x[i]); return; }
    if(typeof x!=='object') return;
    if(x.field&&x.field.id) declaredF[x.field.id]=1;
    if(x.picker&&x.picker.g) declaredP[x.picker.g]=1;
    if(x.t==='levels')declaredP.level=1;
    if(x.img&&typeof x.img==='string') usedImg[x.img]=1;
    if(x.t==='raw'&&typeof x.html==='string'){
      var re=/data-pick=["']([^"']+)["']/g,m;
      while((m=re.exec(x.html))) declaredP[m[1]]=1;
    }
    for(var k in x) if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]);
  }
  walk(LECTURE.units||[]);

  var fs=document.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var id=fs[i].getAttribute('data-f');
    if(!declaredF[id]&&!names['f:'+id]) issues.push('data-f "'+id+'" has no field declaration or fieldNames alias');
  }

  var cm=LECTURE.caseMap||[];
  for(var c=0;c<cm.length;c++){
    var parts=cm[c].parts||[];
    for(var p=0;p<parts.length;p++){
      var ref=parts[p][1]||'';
      if(ref.indexOf('p:')===0&&!declaredP[ref.slice(2)])
        issues.push('caseMap picker "'+ref+'" is not present in lecture blocks');
      if(ref.indexOf('f:')===0&&!declaredF[ref.slice(2)]&&!names[ref])
        issues.push('caseMap field "'+ref+'" is not present in lecture blocks');
    }
  }

  var exported={};
  cm.forEach(function(section){section.parts.forEach(function(part){exported[part[1]]=true;});});
  document.querySelectorAll('[data-f]').forEach(function(el){var ref='f:'+el.getAttribute('data-f');if(!exported[ref])issues.push('Unexported answer field: '+ref);});
  document.querySelectorAll('[data-pick]').forEach(function(el){var ref='p:'+el.getAttribute('data-pick');if(!exported[ref])issues.push('Unexported choice: '+ref);});
  LECTURE.units.forEach(function(u){if(u.showIf&&u.showIf.thin&&u.showIf.minKey&&!Object.prototype.hasOwnProperty.call(LECTURE.thresholds,u.showIf.minKey))issues.push('Unknown threshold key in '+u.k);});
  for(var img in usedImg)
    if(!Object.prototype.hasOwnProperty.call(FIG,img)) issues.push('figure key "'+img+'" is used but missing from FIG');

  var keys={};
  for(var u=0;u<(LECTURE.units||[]).length;u++){
    var uk=LECTURE.units[u].k;
    if(keys[uk]) issues.push('duplicate unit key "'+uk+'"');
    keys[uk]=1;
  }

  var unresolved=(document.getElementById('deck').innerHTML.match(/\{\{\s*[^}]+\s*\}\}/g)||[]);
  if(unresolved.length) issues.push('unresolved context token(s): '+unresolved.join(', '));

  var report={ok:issues.length===0,issues:issues,fields:Object.keys(declaredF).length,
    pickers:Object.keys(declaredP).length,figures:Object.keys(usedImg).length,units:(LECTURE.units||[]).length};
  try{
    if(window.console){
      if(report.ok){ if(typeof console.info==='function') console.info('[ISCARB sanity] OK',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] OK',report); }
      else { if(typeof console.warn==='function') console.warn('[ISCARB sanity] '+issues.length+' issue(s)',report); else if(typeof console.log==='function') console.log('[ISCARB sanity] '+issues.length+' issue(s)',report); }
    }
  }catch(e){}
  window.ISCARB_SANITY_REPORT=report;
  return report;
}

function parseTb(t){
  if(!t) return 0;
  var s=0,m=t.match(/(\d+)\s*min/g),sec=t.match(/(\d+)(-(\d+))?\s*sec/);
  if(m) for(var i=0;i<m.length;i++) s+=parseInt(m[i],10)*60;
  if(sec) s+=parseInt(sec[3]||sec[1],10);
  return s;
}
/* ---------- conditional branching -------------------------------------------
   A unit may declare showIf and then exists only for the students who need it:
     showIf:{empty:['f:p_derive']}   -> shown while ANY listed input is still blank
     showIf:{filled:['f:x']}         -> shown only once ALL listed inputs exist
   Evaluated at navigation time, so the same file is a different path for two
   students in the same room. Units with no showIf are always shown. */
function vis(u){
  var c=u.showIf; if(!c) return true;
  var i,v;
  /* `thin` is `empty` with a floor: a box holding "yes" is not an answer, and a
     student who writes one should meet the helper exactly like one who wrote
     nothing. Without this the condition is trivially gamed. */
  if(c.thin){var m=policyThreshold(c,'thinDefault');
    for(i=0;i<c.thin.length;i++){v=String(probe(c.thin[i])||'').trim(); if(v.length<m) return true;}
    return false;}
  if(c.empty){for(i=0;i<c.empty.length;i++) if(!String(probe(c.empty[i])||'').trim()) return true; return false;}
  if(c.filled){for(i=0;i<c.filled.length;i++) if(!String(probe(c.filled[i])||'').trim()) return false; return true;}
  return true;
}

  if(ref.indexOf('f:')===0) return S.f[ref.slice(2)]||'';

/* ---------- the course-file report ------------------------------------------
   What a quality or accreditation file actually asks for, assembled from what
   the lecture already declares: the outcome each unit serves, the mapping from
   unit to course and programme outcome, the activity, the evidence a reviewer
   could inspect, the source coverage, and the national alignment. None of it is
   re-typed — a report that disagrees with the lecture is worse than no report,
   so every line is read from the same object the engine renders. */
function reportText(){

  line('Institution: '+strip(T(CTX.institution||'—'))+'  |  Contact: '+strip(T(CTX.contact||'—')));
  line('Generated from the lecture file itself. Every row below is declared in the');

/* The end of a timebox has to be noticeable from the back of a hall without
   being startling, and without a sound file the deck would have to carry. Three
   short tones from the oscillator the browser already has, plus a visual flash
   for a room where sound is off or a student who cannot hear it. */
function timeUp(){
  var b=document.getElementById('bar');
  b.classList.remove('over'); void b.offsetWidth; b.classList.add('over');
  setTimeout(function(){b.classList.remove('over');},2400);
  var live=document.getElementById('tLive');
  if(live) live.textContent='Time is up for this task.';
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ac=new AC();
    [0,.18,.36].forEach(function(d){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=784;
      g.gain.setValueAtTime(.0001,ac.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.14);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1400);
  }catch(e){}
}

/* ---------- v12 quick view: the deck turns itself ---------------------------
   One button (or Q) auto-advances at a readable pace with a visible progress
   line on the bar — built for self-review, screen recording and sharing.
   Any manual navigation cancels it (the guard sits inside go()); it holds
   still while the tab is hidden or the student is typing, and it follows

var QV={on:false,driving:false,total:0,left:0,last:0,raf:0};
function qvDwell(i){
  var u=U[i]; if(!u) return 7000;
  if(u.k==='TITLE') return 5000;
  if(u.k==='END') return 6500;

  b.setAttribute('data-on',QV.on?'1':'0');

function qvStep(ts){
  if(!QV.on) return;
  if(document.hidden){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  var ae=document.activeElement;
  if(ae&&/^(textarea|input)$/i.test(ae.tagName)){ QV.last=ts; QV.raf=requestAnimationFrame(qvStep); return; }
  QV.left-=(ts-QV.last); QV.last=ts; qvPaint();
  if(QV.left<=0){
    if(cur>=U.length-1||!visibleInDirection(1)){ qvStop(); note('Quick view finished.'); return; }
    QV.driving=true; go(cur+1); QV.driving=false;
    QV.total=QV.left=qvDwell(cur); qvPaint();
  }
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStart(){
  QV.on=true; QV.total=QV.left=qvDwell(cur); QV.last=performance.now();
  qvLabel(); qvPaint();
  note('Quick view on — the deck turns itself. Q or Esc stops it.');
  QV.raf=requestAnimationFrame(qvStep);
}
function qvStop(){
  if(!QV.on) return;

}
