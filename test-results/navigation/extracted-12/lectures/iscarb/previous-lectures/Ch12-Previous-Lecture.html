hm error\nArithmetic error</div></details><details class=\"lp-source-section\" id=\"source-slide-29\"><summary>Slide 29 · Risk reduction</summary><div class=\"lp-source-text\">Risk reduction\nThe aim of this process is to identify dependability requirements that specify how the risks should be managed and ensure that accidents/incidents do not arise.\nRisk reduction strategies\nHazard avoidance;\nHazard detection and removal;\nDamage limitation.</div></details><details class=\"lp-source-section\" id=\"source-slide-30\"><summary>Slide 30 · Strategy use</summary><div class=\"lp-source-text\">Strategy use\nNormally, in critical systems, a mix of risk reduction strategies are used.\nIn a chemical plant control system, the system will include sensors to detect and correct excess pressure in the reactor.\nHowever, it will also include an independent protection system that opens a relief valve if dangerously high pressure is detected.</div></details><details class=\"lp-source-section\" id=\"source-slide-31\"><summary>Slide 31 · Insulin pump - software risks</summary><div class=\"lp-source-text\">Insulin pump - software risks\nArithmetic error\nA computation causes the value of a variable to overflow or underflow;\nMaybe include an exception handler for each type of arithmetic error.\nAlgorithmic error\nCompare dose to be delivered with previous dose or safe maximum doses. Reduce dose if too high.</div></details><details class=\"lp-source-section\" id=\"source-slide-32\"><summary>Slide 32 · Examples of safety requirements </summary><div class=\"lp-source-text\">Examples of safety requirements \nSR1: The system shall not deliver a single dose of insulin that is greater than a specified maximum dose for a system user.\nSR2: The system shall not deliver a daily cumulative dose of insulin that is greater than a specified maximum daily dose for a system user.\nSR3: The system shall include a hardware diagnostic facility that shall be executed at least four times per hour.\nSR4: The system shall include an exception handler for all of the exceptions that are identified in Table 3.\nSR5: The audible alarm shall be sounded when any hardware or software anomaly is discovered and a diagnostic message, as defined in Table 4, shall be displayed.\nSR6: In the event of an alarm, insulin delivery shall be suspended until the user has reset the system and cleared the alarm.\n</div></details>"}], "noAnswer": true, "sourceRange": "25–32", "appendix": true}, {"k": "SRC04", "title": "Safety processes, logs and reviews", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 33–43. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch12-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-33\"><summary>Slide 33 · Safety engineering processes</summary><div class=\"lp-source-text\">Safety engineering processes</div></details><details class=\"lp-source-section\" id=\"source-slide-34\"><summary>Slide 34 · Safety engineering processes</summary><div class=\"lp-source-text\">Safety engineering processes\nSafety engineering processes are based on reliability engineering processes\nPlan-based approach with reviews and checks at each stage in the process\nGeneral goal of fault avoidance and fault detection\nMust also include safety reviews and explicit identification and tracking of hazards</div></details><details class=\"lp-source-section\" id=\"source-slide-35\"><summary>Slide 35 · Regulation</summary><div class=\"lp-source-text\">Regulation\nRegulators may require evidence that safety engineering processes have been used in system development\nFor example:\nThe specification of the system that has been developed and records of the checks made on that specification.\nEvidence of the verification and validation processes that have been carried out and the results of the system verification and validation.\nEvidence that the organizations developing the system have defined and dependable software processes that include safety assurance reviews. There must also be records that show that these processes have been properly enacted. \n\n</div></details><details class=\"lp-source-section\" id=\"source-slide-36\"><summary>Slide 36 · Agile methods and safety</summary><div class=\"lp-source-text\">Agile methods and safety\nAgile methods are not usually used for safety-critical systems engineering\nExtensive process and product documentation is needed for system regulation. Contradicts the focus in agile methods on the software itself.\nA detailed safety analysis of a complete system specification is important. Contradicts the interleaved development of a system specification and program.\nSome agile techniques such as test-driven development may be used</div></details><details class=\"lp-source-section\" id=\"source-slide-37\"><summary>Slide 37 · Safety assurance processes</summary><div class=\"lp-source-text\">Safety assurance processes\nProcess assurance involves defining a dependable process and ensuring that this process is followed during the system development.\nProcess assurance focuses on:\nDo we have the right processes? Are the processes appropriate for the level of dependability required. Should include requirements management, change management, reviews and inspections, etc.\nAre we doing the processes right? Have these processes been followed by the development team.\nProcess assurance generates documentation\nAgile processes therefore are rarely used for critical systems.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-38\"><summary>Slide 38 · Processes for safety assurance</summary><div class=\"lp-source-text\">Processes for safety assurance\nProcess assurance is important for safety-critical systems development:\nAccidents are rare events so testing may not find all problems;\nSafety requirements are sometimes ‘shall not’ requirements so cannot be demonstrated through testing.\nSafety assurance activities may be included in the software process that record the analyses that have been carried out and the people responsible for these.\nPersonal responsibility is important as system failures may lead to subsequent legal actions.</div></details><details class=\"lp-source-section\" id=\"source-slide-39\"><summary>Slide 39 · Safety related process activities</summary><div class=\"lp-source-text\">Safety related process activities\nCreation of a hazard logging and monitoring system.\nAppointment of project safety engineers who have explicit responsibility for system safety.\nExtensive use of safety reviews.\nCreation of a safety certification system where the safety of critical components is formally certified.\nDetailed configuration management (see Chapter 25).</div></details><details class=\"lp-source-section\" id=\"source-slide-40\"><summary>Slide 40 · Hazard analysis</summary><div class=\"lp-source-text\">Hazard analysis\nHazard analysis involves identifying hazards and their root causes.\nThere should be clear traceability from identified hazards through their analysis to the actions taken during the process to ensure that these hazards have been covered.\nA hazard log may be used to track hazards throughout the process.</div></details><details class=\"lp-source-section\" id=\"source-slide-41\"><summary>Slide 41 · A simplified hazard log entry </summary><div class=\"lp-source-text\">A simplified hazard log entry </div><div class=\"lp-tablewrap\"><table><tr><td>Hazard Log \tPage 4: Printed 20.02.2012</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>System: Insulin Pump System\u000bSafety Engineer: James Brown</td><td></td><td></td><td></td><td>File: InsulinPump/Safety/HazardLog\u000bLog version: 1/3</td><td></td><td></td></tr><tr><td>Identified Hazard</td><td>Insulin overdose delivered to patient</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>Identified by</td><td>Jane Williams</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>Criticality class</td><td>1</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>Identified risk</td><td>High</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td> Fault tree identified</td><td>YES</td><td>Date</td><td>24.01.07</td><td></td><td>Location</td><td>Hazard Log, Page 5</td></tr><tr><td>Fault tree creators</td><td>Jane Williams and Bill Smith</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>Fault tree checked</td><td>YES</td><td>Date</td><td>28.01.07</td><td></td><td>Checker</td><td>James Brown</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-42\"><summary>Slide 42 · Hazard log (2)</summary><div class=\"lp-source-text\">Hazard log (2)</div><div class=\"lp-tablewrap\"><table><tr><td> System safety design requirements</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>1. \tThe system shall include self-testing software that will test the sensor system, the clock, and the insulin delivery system.</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>2. \tThe self-checking software shall be executed once per minute.</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3.\tIn the event of the self-checking software discovering a fault in any of the system components, an audible warning shall be issued and the pump display shall indicate the name of the component where the fault has been discovered. The delivery of insulin shall be suspended.</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4.\tThe system shall incorporate an override system that allows the system user to modify the computed dose of insulin that is to be delivered by the system.</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td> 5.\tThe amount of override shall be no greater than a pre-set value (maxOverride), which is set when the system is configured by medical staff.</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-43\"><summary>Slide 43 · Safety reviews</summary><div class=\"lp-source-text\">Safety reviews\nDriven by the hazard register.\nFor each identified hazrd, the review team should assess the system and judge whether or not the system can cope with that hazard in a safe way.</div></details>"}], "noAnswer": true, "sourceRange": "33–43", "appendix": true}, {"k": "SRC05", "title": "Formal methods and static analysis", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 44–53. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch12-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-44\"><summary>Slide 44 · Formal verification</summary><div class=\"lp-source-text\">Formal verification\nFormal methods can be used when a mathematical specification of the system is produced.\nThey are the ultimate static verification technique that may be used at different stages in the development process:\nA formal specification may be developed and mathematically analyzed for consistency. This helps discover specification errors and omissions.\nFormal arguments that a program conforms to its mathematical specification may be developed. This is effective in discovering programming and design errors.</div></details><details class=\"lp-source-section\" id=\"source-slide-45\"><summary>Slide 45 · Arguments for formal methods</summary><div class=\"lp-source-text\">Arguments for formal methods\nProducing a mathematical specification requires a detailed analysis of the requirements and this is likely to uncover errors.\nConcurrent systems can be analysed to discover race conditions that might lead to deadlock. Testing for such problems is very difficult.\nThey can detect implementation errors before testing when the program is analyzed alongside the specification.</div></details><details class=\"lp-source-section\" id=\"source-slide-46\"><summary>Slide 46 · Arguments against formal methods</summary><div class=\"lp-source-text\">Arguments against formal methods\nRequire specialized notations that cannot be understood by domain experts.\nVery expensive to develop a specification and even more expensive to show that a program meets that specification.\nProofs may contain errors.\nIt may be possible to reach the same level of confidence in a program more cheaply using other V &amp; V techniques.</div></details><details class=\"lp-source-section\" id=\"source-slide-47\"><summary>Slide 47 · Formal methods cannot guarantee safety</summary><div class=\"lp-source-text\">Formal methods cannot guarantee safety\nThe specification may not reflect the real requirements of system users. Users rarely understand formal notations so they cannot directly read the formal specification to find errors and omissions. \nThe proof may contain errors. Program proofs are large and complex, so, like large and complex programs, they usually contain errors. \nThe proof may make incorrect assumptions about the way that the system is used. If the system is not used as anticipated, then the system’s behavior lies outside the scope of the proof. </div></details><details class=\"lp-source-section\" id=\"source-slide-48\"><summary>Slide 48 · Model checking</summary><div class=\"lp-source-text\">Model checking\nInvolves creating an extended finite state model of a system and, using a specialized system (a model checker), checking that model for errors.\nThe model checker explores all possible paths through the model and checks that a user-specified property is valid for each path.  \nModel checking is particularly valuable for verifying concurrent systems, which are hard to test.\nAlthough model checking is computationally very expensive, it is now practical to use it in the verification of small to medium sized critical systems. </div></details><details class=\"lp-source-section\" id=\"source-slide-49\"><summary>Slide 49 · Model checking </summary><div class=\"lp-source-text\">Model checking </div></details><details class=\"lp-source-section\" id=\"source-slide-50\"><summary>Slide 50 · Static program analysis</summary><div class=\"lp-source-text\">Static program analysis\nStatic analysers are software tools for source text processing.\nThey parse the program text and try to discover potentially erroneous conditions and bring these to the attention of the V &amp; V team.\nThey are very effective as an aid to inspections - they are a supplement to but not a replacement for inspections.</div></details><details class=\"lp-source-section\" id=\"source-slide-51\"><summary>Slide 51 · Automated static analysis checks </summary><div class=\"lp-source-text\">Automated static analysis checks </div><div class=\"lp-tablewrap\"><table><tr><td>Fault class</td><td>Static analysis check</td></tr><tr><td>Data faults</td><td>Variables used before initialization<br>Variables declared but never used<br>Variables assigned twice but never used between assignments<br>Possible array bound violations <br>Undeclared variables</td></tr><tr><td>Control faults</td><td>Unreachable code<br>Unconditional branches into loops</td></tr><tr><td>Input/output faults</td><td>Variables output twice with no intervening assignment</td></tr><tr><td>Interface faults</td><td>Parameter-type mismatches<br>Parameter number mismatches<br>Non-usage of the results of functions<br>Uncalled functions and procedures</td></tr><tr><td>Storage management faults</td><td>Unassigned pointers<br>Pointer arithmetic<br>Memory leaks</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-52\"><summary>Slide 52 · Levels of static analysis</summary><div class=\"lp-source-text\">Levels of static analysis\nCharacteristic error checking\nThe static analyzer can check for patterns in the code that are characteristic of errors made by programmers using a particular language.\nUser-defined error checking\nUsers of a programming language define error patterns, thus extending the types of error that can be detected. This allows specific rules that apply to a program to be checked.\nAssertion checking\nDevelopers include formal assertions in their program and relationships that must hold. The static analyzer symbolically executes the code and highlights potential problems.</div></details><details class=\"lp-source-section\" id=\"source-slide-53\"><summary>Slide 53 · Use of static analysis</summary><div class=\"lp-source-text\">Use of static analysis\nParticularly valuable when a language such as C is used which has weak typing and hence many errors are undetected by the compiler.\nParticularly valuable for security checking – the static analyzer can discover areas of vulnerability such as buffer overflows or unchecked inputs.\nStatic analysis is now routinely used in the development of many safety and security critical systems.</div></details>"}], "noAnswer": true, "sourceRange": "44–53", "appendix": true}, {"k": "SRC06", "title": "Safety cases and structured arguments", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 54–70. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch12-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-54\"><summary>Slide 54 · Safety cases</summary><div class=\"lp-source-text\">Safety cases</div></details><details class=\"lp-source-section\" id=\"source-slide-55\"><summary>Slide 55 · Safety and dependability cases</summary><div class=\"lp-source-text\">Safety and dependability cases\nSafety and dependability cases are structured documents that set out detailed arguments and evidence that a required level of safety or dependability has been achieved.\nThey are normally required by regulators before a system can be certified for operational use. The regulator’s responsibility is to check that a system is as safe or dependable as is practical.\nRegulators and developers work together and negotiate what needs to be included in a system safety/dependability case.</div></details><details class=\"lp-source-section\" id=\"source-slide-56\"><summary>Slide 56 · The system safety case</summary><div class=\"lp-source-text\">The system safety case\nA safety case is:\nA documented body of evidence that provides a convincing and valid argument that a system is adequately safe for a given application in a given environment.\nArguments in a safety case can be based on formal proof, design rationale, safety proofs, etc. Process factors may also be included.\nA software safety case is usually part of a wider system safety case that takes hardware and operational issues into account.</div></details><details class=\"lp-source-section\" id=\"source-slide-57\"><summary>Slide 57 · The contents of a software safety case</summary><div class=\"lp-source-text\">The contents of a software safety case</div><div class=\"lp-tablewrap\"><table><tr><td>Chapter</td><td>Description</td></tr><tr><td>System description</td><td>An overview of the system and a description of its critical components. </td></tr><tr><td>Safety requirements</td><td>The safety requirements abstracted from the system requirements specification. Details of other relevant system requirements may also be included.</td></tr><tr><td>Hazard and risk analysis</td><td>Documents describing the hazards and risks that have been identified and the measures taken to reduce risk. Hazard analyses and hazard logs.</td></tr><tr><td>Design analysis</td><td>A set of structured arguments (see Section 15.5.1) that justify why the design is safe. </td></tr><tr><td>Verification and validation </td><td>A description of the V &amp; V procedures used and, where appropriate, the test plans for the system. Summaries of the test results showing defects that have been detected and corrected. If formal methods have been used, a formal system specification and any analyses of that specification. Records of static analyses of the source code.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-58\"><summary>Slide 58 · Chapter 12 Safety Engineering</summary><div class=\"lp-source-text\"></div><div class=\"lp-tablewrap\"><table><tr><td>Chapter</td><td>Description</td></tr><tr><td>Review reports<br></td><td>Records of all design and safety reviews.<br></td></tr><tr><td>Team competences</td><td>Evidence of the competence of all of the team involved in safety-related systems development and validation.</td></tr><tr><td>Process QA</td><td>Records of the quality assurance processes (see Chapter 24) carried out during system development.</td></tr><tr><td>Change management processes</td><td>Records of all changes proposed, actions taken and, where appropriate, justification of the safety of these changes. Information about configuration management procedures and configuration management logs. </td></tr><tr><td>Associated safety cases</td><td>References to other safety cases that may impact the safety case.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-59\"><summary>Slide 59 · Structured arguments</summary><div class=\"lp-source-text\">Structured arguments\nSafety cases should be based around structured arguments that present evidence to justify the assertions made in these arguments.\nThe argument justifies why a claim about system safety and security is justified by the available evidence.</div></details><details class=\"lp-source-section\" id=\"source-slide-60\"><summary>Slide 60 · Structured arguments </summary><div class=\"lp-source-text\">Structured arguments </div></details><details class=\"lp-source-section\" id=\"source-slide-61\"><summary>Slide 61 · Insulin pump safety argument</summary><div class=\"lp-source-text\">Insulin pump safety argument\nArguments are based on claims and evidence.\nInsulin pump safety:\nClaim: The maximum single dose of insulin to be delivered (CurrentDose) will not exceed MaxDose.\nEvidence: Safety argument for insulin pump (discussed later)\nEvidence: Test data for insulin pump. The value of currentDose was correctly computed in 400 tests\nEvidence: Static analysis report for insulin pump software revealed no anomalies that affected the value of CurrentDose\nArgument: The evidence presented demonstrates that the maximum dose of insulin that can be computed = MaxDose.</div></details><details class=\"lp-source-section\" id=\"source-slide-62\"><summary>Slide 62 · Structured safety arguments</summary><div class=\"lp-source-text\">Structured safety arguments\nStructured arguments that demonstrate that a system meets its safety obligations.\nIt is not necessary to demonstrate that the program works as intended; the aim is simply to demonstrate safety.\nGenerally based on a claim hierarchy. \nYou start at the leaves of the hierarchy and demonstrate safety. This implies the higher-level claims are true.</div></details><details class=\"lp-source-section\" id=\"source-slide-63\"><summary>Slide 63 · A safety claim hierarchy for the insulin pump </summary><div class=\"lp-source-text\">A safety claim hierarchy for the insulin pump </div></details><details class=\"lp-source-section\" id=\"source-slide-64\"><summary>Slide 64 · Software safety arguments</summary><div class=\"lp-source-text\">Software safety arguments\nSafety arguments are intended to show that the system cannot reach in unsafe state.\nThese are weaker than correctness arguments which must show that the system code conforms to its specification.\nThey are generally based on proof by contradiction\nAssume that an unsafe state can be reached;\nShow that this is contradicted by the program code.\nA graphical model of the safety argument may be developed.</div></details><details class=\"lp-source-section\" id=\"source-slide-65\"><summary>Slide 65 · Construction of a safety argument</summary><div class=\"lp-source-text\">Construction of a safety argument\nEstablish the safe exit conditions for a component or a program.\nStarting from the END of the code, work backwards until you have identified all paths that lead to the exit of the code.\nAssume that the exit condition is false.\nShow that, for each path leading to the exit that the assignments made in that path contradict the assumption of an unsafe exit from the component.</div></details><details class=\"lp-source-section\" id=\"source-slide-66\"><summary>Slide 66 · Insulin dose computation with safety checks </summary><div class=\"lp-source-text\">Insulin dose computation with safety checks \n-- The insulin dose to be delivered is a function of blood sugar level, \n-- the previous dose delivered and the time of delivery of the previous dose\n\ncurrentDose = computeInsulin () ;\n\n// Safety check—adjust currentDose if necessary. \n// if statement 1\nif (previousDose == 0)\n{\n\tif (currentDose &gt; maxDose/2)\n\tcurrentDose = maxDose/2 ;\n}\nelse\n\tif (currentDose &gt; (previousDose * 2) )\n\t\tcurrentDose = previousDose * 2 ;\n// if statement 2\nif ( currentDose &lt; minimumDose )\n\tcurrentDose = 0 ;\nelse if ( currentDose &gt; maxDose )\n\tcurrentDose = maxDose ;\nadministerInsulin (currentDose) ;\n\n</div></details><details class=\"lp-source-section\" id=\"source-slide-67\"><summary>Slide 67 · Informal safety argument based on demonstrating contradictions </summary><div class=\"lp-source-text\">Informal safety argument based on demonstrating contradictions </div></details><details class=\"lp-source-section\" id=\"source-slide-68\"><summary>Slide 68 · Program paths</summary><div class=\"lp-source-text\">Program paths\nNeither branch of if-statement 2 is executed\nCan only happen if CurrentDose is &gt;= minimumDose and &lt;= maxDose.\nthen branch of if-statement 2 is executed\ncurrentDose = 0.\nelse branch of if-statement 2 is executed\ncurrentDose = maxDose.\nIn all cases, the post conditions contradict the unsafe condition that the dose administered is greater than maxDose.</div></details><details class=\"lp-source-section\" id=\"source-slide-69\"><summary>Slide 69 · Key points</summary><div class=\"lp-source-text\">Key points\nSafety-critical systems are systems whose failure can lead to human injury or death.\nA hazard-driven approach is used to understand the safety requirements for safety-critical systems. You identify potential hazards and decompose these (using methods such as fault tree analysis) to discover their root causes. You then specify requirements to avoid or recover from these problems.\nIt is important to have a well-defined, certified process for safety-critical systems development. This should include the identification and monitoring of potential hazards.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-70\"><summary>Slide 70 · Key points</summary><div class=\"lp-source-text\">Key points\nStatic analysis is an approach to V &amp; V that examines the source code of a system, looking for errors and anomalies. It allows all parts of a program to be checked, not just those parts that are exercised by system tests.\nModel checking is a formal approach to static analysis that exhaustively checks all states in a system for potential errors.\nSafety and dependability cases collect the evidence that demonstrates a system is safe and dependable. Safety cases are required when an external regulator must certify the system before it is used.\n</div></details>"}], "noAnswer": true, "sourceRange": "54–70", "appendix": true}, {"k": "R01", "answer": "One defensible request is the fault tree for the insulin overdose hazard, signed by the project safety engineer, with the branch that tonight&rsquo;s incident reached marked. It distinguishes a real gap in the safety case from a single operator-reported incident. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming automatic operation.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "State what evidence a safety decision needs before it is signed, rather than waiting for a certainty that will not arrive.", "title": "You sign before you know", "sub": "A 7-year-old patient was found unresponsive at 06:30. The pump had delivered a daily cumulative dose exceeding the maximum &mdash; and the audible alarm required by SR5 had not sounded.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "DECISION", "lead": "Continue, revert, or hold the pump and ask for safety evidence?", "txt": "The safety case claimed the maximum single dose would never exceed MaxDose. Tonight it did. Do you continue, revert, or hold the deployment and ask for the fault tree?"}, {"c": "mag", "lab": "UNKNOWN", "lead": "The safety case says this is impossible. Tonight it happened.", "txt": "The safety case was signed off on a structured argument plus 400 tests. None of the tests exercised the daily cumulative dose path under the conditions that arose tonight &mdash; and the alarm that should have sounded did not."}]}, {"t": "principle", "txt": "Safety matters because failures can cause human injury or death. The goal tonight is not certainty &mdash; it is a defensible boundary with a named hazard behind it.", "src": "P1 · p.4"}], "timebox": "90 sec", "task": "Name the one piece of safety evidence you would demand before letting the pump run another hour on automatic.", "say": "You are the project safety engineer on call. In seventy-five minutes you will sign something.", "notes": "Read it slowly and explain nothing. Say once that the scenario is constructed for teaching and is not a report of a real incident. Every rule tonight returns to this pump. The classic mistake in a case lecture is explaining the terminology before the students feel the pressure of the decision.", "appendix": true, "_iscarbRule": "RULE 01 - Decide under uncertainty", "route": "toolkit"}, {"k": "R02R03", "rule": "RULE 02+03 - Scope and outcomes (condensed)", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "State what this chapter covers and what you must prove, before any topic slide.", "title": "What this chapter covers &mdash; and what you must prove", "sub": "Seven sections in the source, five outcomes you are accountable for. Everything else tonight sits inside one of these.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "SAFETY DEFINED", "txt": "What does &lsquo;safe&rsquo; actually mean?", "src": "P1 · p.3"}, {"c": "sand", "lab": "SAFETY vs RELIABILITY", "txt": "Why can a reliable system still be unsafe?", "src": "P1 · p.5"}, {"c": "teal", "lab": "HAZARDS & RISK", "txt": "How do we name what could go wrong?", "src": "P1 · p.10"}, {"c": "sand", "lab": "HAZARD ANALYSIS", "txt": "How do we find the root cause?", "src": "P1 · p.25"}, {"c": "teal", "lab": "SAFETY PROCESS", "txt": "What process makes a system safe?", "src": "P1 · p.33"}, {"c": "sand", "lab": "SAFETY CASES", "txt": "How do we argue the system is safe?", "src": "P1 · p.54"}]}, {"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish safety from reliability, and primary from secondary safety-critical systems."}, {"c": "teal", "lab": "2", "txt": "Trace a hazard through fault tree analysis to its root causes."}, {"c": "teal", "lab": "3", "txt": "Specify and justify safety requirements using hazard-driven analysis."}, {"c": "mag", "lab": "4", "txt": "Build a bounded safety verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the hazard, environment or demand pattern changes."}]}], "timebox": "90 sec", "task": "Note which of the six sections you expect to matter most for tonight&rsquo;s case.", "notes": "Ninety seconds total, no more. This slide exists so nobody leaves tonight unsure what was in the chapter and what was not. Both the condensed and the full versions (R02, R03) remain in ISCARB Depth for anyone who wants the two-slide version back.", "appendix": true, "route": "toolkit"}, {"k": "R08", "answer": "The chapter's insulin pump safety argument (p.61) is: Claim: the maximum single dose of insulin to be delivered (CurrentDose) will not exceed MaxDose. Evidence: (1) safety argument for the insulin pump, (2) test data showing CurrentDose was correctly computed in 400 tests, (3) static analysis report revealing no anomalies affecting CurrentDose. Argument: the evidence demonstrates the maximum computable dose = MaxDose. The lesson for tonight: the argument is valid for the single-dose hazard (SR1) and irrelevant for the daily cumulative hazard (SR2). The safety case proved the wrong property.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "mag", "learn": "Read a published safety argument and identify the claim it proves &mdash; and the claim it does not.", "title": "The chapter&rsquo;s own safety argument &mdash; and what it does not prove", "sub": "The source p.61 gives a worked safety argument for the insulin pump. Tonight&rsquo;s incident contradicts its conclusion &mdash; or does it?", "blocks": [{"t": "figure", "img": "ch12_hierarchy", "cap": "p.63 · safety claim hierarchy for insulin pump", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "CLAIM HIERARCHY", "lead": "Top-level safety claim, decomposed into sub-claims supported by evidence.", "txt": "A safety claim hierarchy decomposes the top-level claim (\"the pump is safe\") into sub-claims, each supported by evidence at the leaves. You start at the leaves and demonstrate safety, which implies the higher-level claims are true."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE CLAIM", "lead": "The maximum single dose will not exceed MaxDose.", "txt": "<b>Claim:</b> The maximum single dose of insulin to be delivered (CurrentDose) will not exceed MaxDose. <b>Evidence:</b> (1) the safety argument for the insulin pump, (2) test data showing CurrentDose was correctly computed in 400 tests, (3) static analysis report revealing no anomalies that affected the value of CurrentDose. <b>Argument:</b> the evidence presented demonstrates that the maximum dose of insulin that can be computed = MaxDose.", "src": "P1 · p.61"}, {"c": "mag", "lab": "WHAT IT DOES NOT PROVE", "lead": "The argument is about CurrentDose, not the daily cumulative.", "txt": "The argument proves that a single computed dose cannot exceed MaxDose. It says nothing about the daily cumulative dose. Tonight&rsquo;s incident is on the daily cumulative path &mdash; each individual dose was below MaxDose (the argument holds), but the cumulative dose across the night exceeded the daily maximum (the argument is silent). The safety case proved the wrong property.", "src": "P1 · p.61 · p.32 SR2"}]}, {"t": "wide", "c": "violet", "lab": "THE QUESTION FOR TONIGHT", "lead": "The argument is valid. The conclusion does not cover tonight&rsquo;s incident. Both can be true.", "field": {"id": "airbus_lesson", "core": false, "rows": 3, "ph": "What claim would the safety case need to add to cover tonight&rsquo;s incident, and what evidence would support it?"}}, {"t": "principle", "txt": "A valid argument for the wrong claim is not a safety case. It is a defensible answer to a question nobody asked."}], "timebox": "3 min", "task": "Name the claim the chapter&rsquo;s safety argument proves, and the claim it does not &mdash; and which one tonight reached.", "notes": "Three minutes. The point is not that the safety argument is wrong &mdash; it is valid. The point is that it is silent on the daily cumulative path. A student who says &ldquo;the argument is wrong&rdquo; has not read it. A student who says &ldquo;the argument is right but does not cover tonight&rsquo;s hazard&rdquo; has answered the right question. The lesson generalises: a safety case is a structured argument, and an argument proves exactly what its claim says &mdash; no more.", "appendix": true, "_iscarbRule": "RULE 08 - 60-second source case", "route": "toolkit"}, {"k": "R10", "loadOk": "The 3x3 matrix and two fields describe one safety-risk triage record. Students classify three risks and specify one monitor and one identification tool. Shorten the activity at this cut point; never squeeze the content into a fixed height.", "answer": "Place, for example, the daily cumulative overdose (probability Medium, severity High, Intolerable), the missing SR5 alarm path (probability unknown, severity High, ALARP), and the unattended overnight operation (probability High, severity High, Intolerable) in the matrix; justify each likelihood and impact instead of treating the cells as measured probabilities. For one monitor, specify the measured quantity (daily cumulative dose), observation window (continuous, with a per-shift summary), trigger value (cumulative dose above 80% of daily maximum), named owner (on-call bioengineer) and fallback action (alarm + suspend + revert to manual). A fault tree analysis can identify the daily cumulative overdose hazard; retain the tree as evidence.", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Convert an unknown into a monitored risk with a trigger value and a named owner, and place it on a safety matrix.", "title": "Make uncertainty operational", "sub": "Do not write &ldquo;we are not sure about the daily cumulative path&rdquo; and stop.", "cut": true, "blocks": [{"t": "figure", "matrixLeft": true, "right": [{"t": "cards", "cols": 1, "items": [{"c": "green", "lab": "KNOWN", "txt": "Facts already supported by an artifact you can hand to a reviewer &mdash; e.g. the safety case&rsquo;s structured argument for SR1 (the single-dose hazard)."}, {"c": "mag", "lab": "UNKNOWN", "txt": "A decision-sensitive gap. Not everything unknown matters &mdash; only what could change the verdict. Tonight&rsquo;s gap: the daily cumulative path has no claim, no fault tree, no SR2."}, {"c": "violet", "lab": "MONITORED", "txt": "An unknown with a measured quantity, observation window, trigger value, named owner and fallback action. The unknown becomes a risk on a schedule."}]}]}, {"t": "wide", "c": "sand", "lab": "PLACE TONIGHT&rsquo;S RISKS ON THE MATRIX", "picker": {"g": "risk3", "options": ["Daily cumulative overdose", "Missing SR5 alarm path", "Unattended overnight operation", "Lab soak test only"]}, "field": {"id": "monitor", "core": false, "rows": 2, "ph": "The risk I will watch rather than fix, its trigger value, and who acts"}}, {"t": "wide", "c": "mag", "lab": "THE FRAMEWORK STEP YOU ARE STANDING IN", "lead": "Identify &rarr; analyse &rarr; evaluate &rarr; treat &rarr; monitor. The grid above is <i>evaluate</i>.", "txt": "A risk management framework is this loop with owners and records attached; the 3&times;3 triage above is its evaluate step. Naming the step matters because the tools differ: you identify a safety hazard with a hazard log or a fault tree, and you evaluate it with a matrix like this one.", "src": "Course addition &middot; Jahiziah GKU 3, outcome 2", "field": {"id": "vuln_tool", "core": false, "rows": 2, "ph": "One tool or method you would use to identify a safety hazard in this pump &mdash; and which framework step it belongs to"}}, {"t": "principle", "txt": "Approval = evidence state + uncertainty statement + monitoring plan."}], "timebox": "3 min", "task": "Place at least three of tonight&rsquo;s risks, then turn one unknown into a measurable monitor with a trigger. <b style=\"color:var(--mag)\">You are the project safety engineer.</b>", "notes": "This unit now carries the one Jahiziah outcome the department mapped to this course and found uncovered: applying a risk management framework and naming a tool that identifies a safety hazard. Make every student write something in that field &mdash; an empty box here is the gap staying open. Do not accept a monitored risk without a trigger value and a named owner &mdash; a monitor with no trigger is a decision to look away slowly. This is a designated cut point: if behind, shorten to 90 seconds or assign the monitor as follow-up. The source ledger is at C01.", "appendix": true, "_iscarbRule": "RULE 10 - Known, unknown, monitor", "route": "toolkit"}, {"k": "R12", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "sand", "golden": true, "learn": "Separate the engineer who claims, the engineer who verifies and the authority who signs.", "title": "A dependable answer names who owns what", "sub": "Safety claims fail not because nobody identified the hazard &mdash; but because the hazard log has no owner able to defend it.", "blocks": [{"t": "svg", "kind": "accountability"}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · OWNER", "lead": "The project safety engineer who decides.", "txt": "Names the verdict and the hazard. Owns the consequence. The on-call safety engineer tonight &mdash; not the developer, not the regulator, not the AI."}, {"c": "sand", "lab": "2 · EVIDENCE OWNER", "lead": "The engineer who maintains the hazard log.", "txt": "Maintains the inspectable artifact: the hazard log, the fault trees, the safety requirements, the test results. Cannot be the same person as the owner."}, {"c": "mag", "lab": "3 · SIGN-OFF", "lead": "The authority who accepts the residual risk.", "txt": "The hospital&rsquo;s medical device committee or the regulator&rsquo;s reviewer. Accepts the bounded residual risk on the evidence the owner and evidence owner produced."}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S GAP", "lead": "A 7-year-old in hospital, no fault tree for the daily cumulative path, no SR2, no hazard log entry &mdash; one developer signing off their own safety case.", "txt": "The pump update went live with one developer&rsquo;s signature on a safety case that proved CurrentDose &le; MaxDose. That is owner, evidence owner and sign-off collapsed into a single person &mdash; which is why the hazard could not be audited when the accident arrived. The fix is not more testing; it is the separation above.", "field": {"id": "accountability", "core": false, "rows": 2, "ph": "For your verdict: who is the owner, who is the evidence owner, and who signs off?"}}, {"t": "principle", "txt": "Owner &ne; evidence owner &ne; sign-off. Three roles, three people."}], "timebox": "2 min", "task": "For the verdict you signed at Rule 07: name the owner, the evidence owner, and the sign-off authority.", "notes": "Two minutes. The accountability trio is the rule most assignments miss &mdash; not because students cannot name the roles, but because the same person fills all three on their project. Make every student name three different people tonight; if they cannot, the verdict is not yet dependable.", "appendix": true, "_iscarbRule": "RULE 12 - Owner, evidence, sign-off", "route": "toolkit"}, {"k": "J02", "rule": "", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Answer knowledge-unit items unaided, and use a wrong answer to locate the unit to reread.", "title": "Chapter practice questions", "sub": "Try first, then read the explanation. These are course-written practice items, not official national-test questions.", "badge": {"c": "", "t": "PRACTICE ONLY", "s": "course-written · not real test items"}, "blocks": [{"t": "jahtest"}], "timebox": "4 min", "task": "Answer independently and revisit the relevant source topic for each error.", "notes": "Use for individual review after class. Do not infer national test performance from this score.", "appendix": true, "_iscarbRule": "JAHIZIAH - Knowledge unit check", "route": "toolkit"}, {"k": "R02", "rule": "RULE 02 - Domain spine", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Locate any question about a system in the section of the source that answers it.", "title": "What Chapter 12 trains you to do", "sub": "Six questions the pump cannot answer tonight. Each one is a section of the chapter &mdash; and a gap in your evidence.", "blocks": [{"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "SAFETY DEFINED", "txt": "What does &ldquo;safe&rdquo; mean?", "src": "P1 · p.3"}, {"c": "sand", "lab": "SAFETY vs RELIABILITY", "txt": "Why can a reliable system still be unsafe?", "src": "P1 · p.5"}, {"c": "teal", "lab": "HAZARDS & RISK", "txt": "How do we name what could go wrong?", "src": "P1 · p.10"}, {"c": "sand", "lab": "HAZARD ANALYSIS", "txt": "How do we find the root cause?", "src": "P1 · p.25"}, {"c": "teal", "lab": "SAFETY PROCESS", "txt": "What process makes a system safe?", "src": "P1 · p.33"}, {"c": "sand", "lab": "SAFETY CASES", "txt": "How do we argue the system is safe?", "src": "P1 · p.54"}]}], "timebox": "60-90 sec", "task": "Pick the topic you think will change your engineering judgment the most.", "notes": "Ninety seconds, two answers, no more. Most students pick safety cases because it sounds hardest; the chapter&rsquo;s own answer is hazard analysis. Plant that without resolving it.", "appendix": true, "route": "toolkit"}, {"k": "R03", "rule": "RULE 03 - Observable outcomes", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Say which outcome a piece of their own work is evidence for.", "title": "Five outcomes you must prove", "sub": "Every outcome ends in evidence, not recognition &mdash; and every one of these is something you will do to the pump in the next seventy minutes.", "blocks": [{"t": "rows", "items": [{"c": "teal", "lab": "1", "txt": "Distinguish safety from reliability, and primary from secondary safety-critical systems."}, {"c": "teal", "lab": "2", "txt": "Trace a hazard through fault tree analysis to its root causes."}, {"c": "teal", "lab": "3", "txt": "Specify and justify safety requirements using hazard-driven analysis."}, {"c": "mag", "lab": "4", "txt": "Build a bounded safety verdict with inspectable, owned evidence and a structured argument."}, {"c": "teal", "lab": "5", "txt": "Defend the verdict when the hazard, environment or demand pattern changes."}]}], "timebox": "60-90 sec", "hueOk": "One accent, and magenta on outcome 4 alone &mdash; the artifact every other outcome feeds. Colouring all five differently made them read as five unrelated topics.", "task": "Choose the outcome you expect to find hardest tonight and state why.", "notes": "Sixty seconds. Outcome 5 is the one nobody picks and the one the live defense will punish. Say so.", "appendix": true, "route": "toolkit"}, {"k": "R04", "answer": "EVIDENCE fails first: the safety case is accepted without a fault tree. JUDGMENT then fails because the team cannot show which hazard tonight reached or what would have prevented it.", "rule": "RULE 04 - Engineer, not note-taker", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Distinguish analysing a failure from evidencing a judgment about it.", "title": "Six engineering capabilities", "sub": "Your grade follows the quality of your reasoning and evidence, not your recall.", "blocks": [{"t": "svg", "kind": "capabilities"}, {"t": "cards", "cols": 6, "items": [{"c": "teal", "lab": "", "txt": "Separate safety from reliability.", "src": "Rule 05 · X01"}, {"c": "mag", "lab": "", "txt": "Accept, revise or reject the safety case.", "src": "Rule 20"}, {"c": "sand", "lab": "", "txt": "Name a hazard, not an intention.", "src": "Rule 07 · 09"}, {"c": "violet", "lab": "", "txt": "Trace the hazard up the fault tree.", "src": "X02"}, {"c": "mag", "lab": "", "txt": "Known, unknown, monitored.", "src": "Rule 10"}, {"c": "green", "lab": "", "txt": "A child bears what you sign.", "src": "Rule 12"}]}], "timebox": "60-90 sec", "hueOk": "The six cards colour-match the six circles on the rail directly above them, so the eye pairs each card with its capability. Recolouring them breaks the pairing, which is the only reason the diagram is there.", "task": "Which capability fails first when a team trusts a safety case without a fault tree?", "notes": "The room usually says ANALYZE. The better answer is EVIDENCE &mdash; an attractive safety case fails not because nobody analysed it but because nobody made the fault tree inspectable. Do not give the answer; let two students argue it for thirty seconds.", "appendix": true, "route": "toolkit"}, {"k": "R05", "noAnswer": true, "answer": "Example of the shape: Hazard severity is the promise to the patient. It holds only if the fault tree covers the daily cumulative dose path, AND nobody has built that branch. The prediction is bounded by the missing branch, not by the safety case.", "rule": "RULE 05 - Prediction gate", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Expose an assumption before terminology hides it: predict, bound the answer, derive it, and name the principle used.", "title": "Do the reasoning before the reveal", "sub": "Prediction forces you to expose assumptions before terminology makes the answer feel obvious.", "blocks": [{"t": "chain", "cols": 4, "items": [{"c": "teal", "lab": "PREDICT", "txt": "Which hazard did tonight reach?", "picker": {"g": "predict", "options": ["Overdose", "Underdose", "Power", "Alarm fail"]}}, {"c": "mag", "lab": "CONSTRAINT", "field": {"id": "p_constraint", "core": false, "rows": 3, "ph": "What limits the answer? e.g. daily cumulative dose path, alarm silence, no fault tree"}}, {"c": "sand", "lab": "DERIVE", "field": {"id": "p_derive", "core": true, "rows": 3, "ph": "Why, from first principles? What must be true for your prediction to hold?", "ex": "<i>Shape only &mdash; from a payment gateway, not from tonight:</i> &ldquo;This holds only if the retry queue drains faster than new requests arrive. If it does not, the queue is the thing that fails, not the payment service &mdash; and nobody has measured the drain rate under holiday load.&rdquo; Notice the form: <b>this holds only if X</b>, then <b>and X is unmeasured</b>."}}, {"c": "violet", "lab": "NAME", "field": {"id": "p_name", "core": false, "rows": 3, "ph": "What principle did you use? Name it."}}]}, {"t": "coach", "watch": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "deep": ["f:p_constraint", "f:p_derive"], "minKey": "coachDeep", "empty": "Do not start from the seven terminology names &mdash; you have not met them yet. Start from the room. A 7-year-old is unresponsive at 06:30 because the pump delivered a daily cumulative dose above the maximum, and the alarm did not sound. Ask what the safety case promised, and which promise broke first tonight. Then say which hazard that promise belongs to.", "thin": "Nearly. DERIVE is the box that is graded and one clause is not a derivation &mdash; finish the sentence &ldquo;this holds only if &hellip;&rdquo;. If you cannot finish it, the box that is actually empty is CONSTRAINT: name what stops you choosing differently tonight.", "ok": "Committed. Sign it below, then the reveal cannot quietly rewrite what you thought."}, {"t": "sign", "id": "r05_predict", "fields": ["p:predict", "f:p_constraint", "f:p_derive", "f:p_name"], "label": "I sign this prediction", "before": "Sign only once all four are answered &mdash; the signature is what makes the next slide cost you something.", "ready": "Ready to sign.", "warn": "Signing freezes these four for the rest of the hour. That is the point.", "done": "Read-only from here. Whatever the reveal changes goes in a <i>later</i> box, where it reads as a revision rather than hiding as a correction."}], "loadOk": "The four boxes plus the signature are one prediction gate, answered as one move; splitting them across two slides would let a student predict without deriving, which is the failure this rule exists to prevent.", "timebox": "3 min", "hueOk": "PREDICT, CONSTRAINT, DERIVE, NAME is an ordered chain with arrows between the boxes; one colour makes it read as four parallel boxes rather than four steps.", "task": "Answer all four, then sign. You will be shown the source answer immediately afterwards. <b style=\"color:var(--mag)\">You are the project safety engineer.</b>", "notes": "Three minutes. The DERIVE box is the one students skip &mdash; walk the room and refuse an empty one. This whole rule collapses if you reveal the source figure first; the reveal is the next slide and not a second earlier.", "appendix": true, "route": "toolkit"}, {"k": "H01", "noAnswer": true, "rule": "HELPER - while DERIVE needs development", "phase": "ISCARB TOOLKIT", "accent": "violet", "learn": "Turn a blank derivation into a question they can answer, by starting from the situation rather than the vocabulary.", "showIf": {"thin": ["f:p_derive"], "minKey": "coachDeep"}, "title": "Three questions instead of the answer", "sub": "This slide is here because your derivation box is still blank, or holds a single clause. It does not contain the answer &mdash; the reveal is the next slide and it is worth more to you if you commit first.", "badge": {"c": "", "t": "SCAFFOLD", "s": "appears only if you need it"}, "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 &nbsp; WHAT WAS PROMISED", "lead": "Which promise to the child broke first tonight?", "txt": "A pump promises a child the correct dose, a safe maximum, and an alarm when something is wrong. Say which of those three promises tonight&rsquo;s incident threatens first &mdash; and you have named the hazard without needing its textbook name."}, {"c": "sand", "lab": "2 &nbsp; WHO IS AWAKE", "lead": "A safety feature that depends on an alarm behaves differently when the alarm is silent.", "txt": "It is 06:30. The child&rsquo;s parents found her unresponsive. The alarm required by SR5 did not sound. Ask what that tells you about how the failure will be <i>noticed</i>, not about how it starts. A safety feature that depends on an alarm behaves differently when the alarm is silent."}, {"c": "mag", "lab": "3 &nbsp; WHAT WOULD CHANGE YOUR MIND", "lead": "Finish the sentence &ldquo;I would drop this if I saw &hellip;&rdquo;.", "txt": "Finish this sentence: &ldquo;I would drop this prediction if I saw &hellip;&rdquo;. Whatever you put after &ldquo;if I saw&rdquo; is your constraint, and the reason it holds is your derivation. Write that sentence in the boxes on the previous slide."}]}, {"t": "principle", "c": "mag", "txt": "A blank box is not a gap in knowledge. It is usually a question asked at the wrong altitude."}], "timebox": "90 sec", "task": "Answer any one of the three out loud, then press &larr; and finish DERIVE properly. This slide stops appearing once DERIVE meets the shared scaffolding threshold; the instructor still checks the reasoning.", "notes": "You will usually not see this slide at all &mdash; it renders while DERIVE falls below the same scaffolding threshold used by the R05 coach, so it is the engine noticing that the room is stuck rather than you deciding in advance that it will be. Do not read all three questions aloud. Pick the one that matches what you saw while walking the room: question 1 for students who cannot start, question 2 for students who have written a hazard name with no reasoning under it, question 3 for students who wrote a confident sentence with nothing that could falsify it. Ninety seconds, then send them back. If you are behind, skip it and walk the room instead &mdash; the questions work spoken.", "appendix": true, "route": "toolkit"}, {"k": "QA1", "noAnswer": true, "rule": "RETRIEVAL LOOP - Understand", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the phase&rsquo;s load-bearing moves from memory: the evidence request, the chapter&rsquo;s six questions, the outcome currency and the four parts of the prediction gate.", "title": "Sixty seconds on Understand", "sub": "Before the source expansion opens: four questions, memory first. Reveal only to check, then score yourself honestly.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 01 &middot; 02 &middot; 03 &middot; 05", "items": [{"q": "A 7-year-old is unresponsive at 06:30 with a daily cumulative dose above the maximum and no alarm. Name the one evidence request that separates a real gap in the safety case from a single operator-reported incident.", "a": "A signed fault tree for the insulin overdose hazard, with the branch tonight reached marked by the project safety engineer. Until it exists the decision stays bounded: hold or revert, with a named owner and a condition for resuming automatic operation."}, {"q": "Chapter 12 trains you to answer six questions about any safe system. Say any four.", "a": "What does &ldquo;safe&rdquo; mean (safety defined)? Why can a reliable system still be unsafe (safety vs reliability)? How do we name what could go wrong (hazards and risk)? How do we find the root cause (hazard analysis)? What process makes a system safe (safety process)? How do we argue the system is safe (safety cases)?"}, {"q": "All five outcomes of this hour end in the same currency. What is it?", "a": "Evidence, not recognition &mdash; and outcome 4 is the one the others feed: a bounded safety verdict with inspectable evidence and a structured argument."}, {"q": "The prediction gate makes you commit to four things before the reveal. Name all four.", "a": "PREDICT the hazard &middot; state the CONSTRAINT &middot; DERIVE it from first principles &middot; NAME the principle used &mdash; then sign, so the reveal costs something."}]}], "timebox": "60 sec", "task": "Cover the answers. Say all four out loud from memory before you reveal anything &mdash; then score yourself honestly.", "notes": "Sixty seconds on the ring, and hold the discipline that makes retrieval work: the answer must come from memory, spoken or written, before any reveal. The four questions are the phase&rsquo;s load-bearing moves, not a quiz &mdash; a miss on question 1 means Rule 01 needs one more pass before the source expansion assumes it. The self-score is private and deliberately blunt: two honest misses beat four nodding yeses, and saying that once out loud is what makes the scoring honest.", "appendix": true, "route": "toolkit"}, {"k": "QA2", "noAnswer": true, "rule": "RETRIEVAL LOOP - Source", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the safety/reliability split, the four ways reliable systems are unsafe, the hazard chain and the three safety strategies.", "title": "Sixty seconds on the source foundations", "sub": "Checkpoint before the rest of Chapter 12: four questions from the first source cluster &mdash; memory first, reveal second.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "X01 &middot; X02 &middot; X02A &middot; X07", "items": [{"q": "Safety and reliability are related but distinct. Say the difference, and why a reliable system can still be unsafe.", "a": "<b>Reliability</b> is concerned with conformance to spec and delivery of service. <b>Safety</b> is concerned with ensuring the system cannot cause damage, irrespective of whether it conforms to its spec. Reliable systems can be unsafe through dormant faults, specification errors, hardware-generated spurious inputs, or context-sensitive commands (p.5-6)."}, {"q": "What are the three safety achievement strategies, and where does each one act?", "a": "<b>Hazard avoidance</b> &mdash; design so the hazard cannot arise (before run time). <b>Hazard detection and removal</b> &mdash; catch the hazard before it causes an accident (at run time). <b>Damage limitation</b> &mdash; minimise the harm if an accident occurs (after accident)."}, {"q": "Say tonight&rsquo;s incident as the three-part sentence: hazard, accident, damage.", "a": "The missing daily cumulative dose check is the <b>hazard</b> &mdash; a condition with the potential to cause an accident. The overdose delivered to the child between 03:00 and 06:30 is the <b>accident</b>. The child&rsquo;s hypoglycemic crisis and overnight admission is the <b>damage</b>."}, {"q": "Why are accidents in complex systems inevitable, and what is the design response?", "a": "Accidents rarely have a single cause (p.13). Designing so a single point of failure does not cause an accident is fundamental, but anticipating all problem combinations &mdash; especially in software-controlled systems &mdash; is impossible. The design response is defence in depth: avoidance + detection + limitation, so each layer catches what the others miss."}]}], "timebox": "60 sec", "task": "Answer from memory, reveal, then write the one you missed at the top of your notes.", "notes": "Same discipline as the opening retrieval loop, now over the first source cluster. Question 3 is the one that pays all semester &mdash; the three-part sentence is the shape of a defensible incident report, and the notes on X07 carry the correction script if a student orders it wrong. If the room misses question 1, do not reteach it here: name it, and let the principle line on X01 do the work on the next pass. Sixty seconds, then move.", "appendix": true, "route": "toolkit"}, {"k": "R06", "answer": "Example: a release causes an overdose because the daily cumulative check is missing. CRISIS: a child is unresponsive at 06:30. MAP: dose-calculation module, infusion hardware, ICU nurses, hospital procedure, regulator. TRADE-OFF: revert loses the new feature but the child is safe; continue risks another overdose. EVIDENCE: fault tree, dose logs, the missing SR2 in the safety case. VERDICT: revert under a named owner, monitor recovery, define the evidence needed before redeployment.", "rule": "RULE 06 - ISCARB engineering flow", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Turn a set of source hazards into a five-step engineering decision.", "title": "The five-step engineering flow", "sub": "The source supplies hazards; the flow turns them into a decision. In UNDERSTAND we mapped the crisis. Now we decide.", "blocks": [{"t": "cards", "cols": 5, "items": [{"c": "mag", "lab": "1 CRISIS", "txt": "A child unresponsive at 06:30 with a daily cumulative overdose and no alarm."}, {"c": "teal", "lab": "2 MAP", "txt": "Dose module, infusion hardware, ICU nurses, hospital procedure, regulator."}, {"c": "sand", "lab": "3 TRADE-OFF", "txt": "Revert loses the new feature but the child is safe; continue risks another overdose."}, {"c": "violet", "lab": "4 EVIDENCE", "txt": "Fault tree, dose logs, the missing SR2 in the safety case."}, {"c": "green", "lab": "5 VERDICT", "txt": "Continue, hold, revert &mdash; bounded, with a monitor."}]}, {"t": "principle", "txt": "Predict -&gt; Constraint -&gt; Derive -&gt; Name"}], "timebox": "2 min", "hueOk": "CRISIS, MAP, TRADE-OFF, EVIDENCE, VERDICT are the five steps of the ISCARB flow, and the same five colours identify them on the closing slide and in every later reference. This is the one place the palette is a vocabulary.", "task": "Run tonight&rsquo;s case through the five steps in one sentence each.", "notes": "Two minutes. The slide exists so the room can hear the flow once before they have to live in it. The most common mistake is to stop at EVIDENCE without a VERDICT &mdash; an evidence list with no decision attached is exactly the unbounded claim Rule 04 refuses.", "appendix": true, "route": "toolkit"}, {"k": "R07", "loadOk": "The decision card has six named slots plus an evidence policy line and an inspectable artifact preview. Students fill all six from tonight's pump and cite a source page on each. Use vertical scrolling for the artifact preview; do not split slots across slides.", "answer": "Example verdict: REVERT the pump update tonight under the project safety engineer. EVIDENCE: the safety case enforced SR1 but never wrote SR2 (Ch.12 p.32); tonight's incident reached the daily cumulative path SR2 would have bounded. COUNTER-EVIDENCE: a 7-year-old is in hospital with a hypoglycemic crisis; SR5 did not fire. UNCERTAINTY: the fault tree was drawn for the single-dose hazard only; the daily cumulative branch was never built. VERDICT: revert, with redeployment conditional on (a) SR2 written and enforced, (b) fault tree extended to the daily cumulative path, (c) SR5 tested under that path.", "rule": "RULE 07 - Decision card", "phase": "ISCARB TOOLKIT", "accent": "teal", "golden": true, "learn": "Build the artifact a stranger could audit: claim, evidence, warrant, counter-evidence, uncertainty, verdict.", "title": "Your minimum inspectable artifact", "sub": "The decision card is what Assignment 1 asks for. Six slots, one signature, one evidence policy. Everything else tonight feeds this.", "blocks": [{"t": "wide", "c": "mag", "lab": "CLAIM", "lead": "State the verdict in one sentence.", "field": {"id": "dc_claim", "core": true, "rows": 2, "ph": "Continue, hold, or revert the pump update tonight"}}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "EVIDENCE", "field": {"id": "dc_evidence", "core": true, "rows": 3, "ph": "What supports the claim? Cite a source page (Ch.12 p.X) or a hazard log entry"}}, {"c": "teal", "lab": "WARRANT", "field": {"id": "dc_warrant", "core": true, "rows": 3, "ph": "Why does the evidence support the claim? Name the hazard or the SR"}}, {"c": "sand", "lab": "COUNTER-EVIDENCE", "field": {"id": "dc_counter", "core": true, "rows": 3, "ph": "What would the other side cite against this verdict?"}}, {"c": "mag", "lab": "UNCERTAINTY", "field": {"id": "dc_uncert", "core": true, "rows": 3, "ph": "What is unmeasured, assumed, or could change overnight?"}}, {"c": "green", "lab": "VERDICT", "field": {"id": "dc_verdict", "core": true, "rows": 2, "ph": "The bounded decision, the owner, the monitor, the condition to revisit"}}]}, {"t": "sign", "id": "r07_card", "fields": ["f:dc_claim", "f:dc_evidence", "f:dc_warrant", "f:dc_counter", "f:dc_uncert", "f:dc_verdict"], "label": "I sign this verdict", "before": "Sign once all six slots carry something inspectable.", "ready": "Ready to sign.", "warn": "Signing freezes the six slots for the rest of the hour. The defense at Rule 17 changes them in a <i>later</i> box.", "done": "Read-only from here. The card you defend at Rule 17 is the one you signed here."}, {"t": "principle", "txt": "A defensible verdict names what supports it, what would reverse it, what is uncertain, and who owns it."}], "timebox": "4 min", "hueOk": "CLAIM, EVIDENCE, WARRANT, COUNTER-EVIDENCE, UNCERTAINTY, VERDICT each carry their own colour so a student can locate the same slot on the card, the rubric and the defense slide. The card is the only artifact graded tonight.", "task": "Fill all six slots from tonight&rsquo;s pump, then sign. The card is what Assignment 1 asks for. <b style=\"color:var(--mag)\">You are the project safety engineer.</b>", "notes": "Four minutes. Walk the room. The slot students skip is COUNTER-EVIDENCE: they cannot name what would reverse their own verdict, which means the verdict is not yet defensible. The signature freezes the six boxes; that is what makes Rule 17 a real defense rather than a second draft.", "appendix": true, "route": "toolkit"}, {"k": "QA3", "noAnswer": true, "rule": "RETRIEVAL LOOP - Practise", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Reproduce the six card slots, the safety case structure, the falsification standard and the anatomy of a monitor.", "title": "Sixty seconds on the decision flow", "sub": "Application checkpoint: recall the artifact you have built so far before transfer and defense continue.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 07 &middot; 09 &middot; 10 &middot; B01", "items": [{"q": "The decision card has six slots. Name them in order.", "a": "CLAIM &middot; EVIDENCE &middot; WARRANT &middot; COUNTER-EVIDENCE &middot; UNCERTAINTY &middot; VERDICT &mdash; one artifact a stranger could audit without hearing you explain it."}, {"q": "A safety case that proves CurrentDose &le; MaxDose has made which mistake?", "a": "It has proved the right property for the single-dose hazard (SR1) and stayed silent on the daily cumulative hazard (SR2). A valid argument for the wrong claim is not a safety case &mdash; it is a defensible answer to a question nobody asked."}, {"q": "What must a claim state so the evidence can prove it wrong?", "a": "The observation that would reverse the verdict &mdash; counter-evidence named before it is needed. Inspectability + falsifiability = a decision worth defending."}, {"q": "Turn &ldquo;we are not sure about the daily cumulative path&rdquo; into a monitor.", "a": "A measured quantity (daily cumulative dose), an observation window (continuous, with per-shift summary), a trigger value (above 80% of daily max), a named owner (on-call bioengineer) and a fallback action (alarm + suspend + revert to manual) &mdash; the unknown becomes a monitored risk, and the 3&times;3 grid was only its evaluate step."}]}], "timebox": "60 sec", "task": "Recall first, reveal second &mdash; then open your decision card (C) and check it carries all six slots.", "notes": "The practise loop points at the artifact, not at trivia: every question here is a slot or a standard the decision card must carry. Question 2 is the one to watch &mdash; a safety case that proves the wrong property is the false security that B01 exists to refuse. If a student cannot name all six slots, the card they will defend at Rule 17 is missing walls; send them to C for ninety seconds, not to the slides.", "appendix": true, "route": "toolkit"}, {"k": "R11", "rule": "RULE 11 - Micro-case -> local case", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Reuse one hazard-evidence-boundary chain in a different domain, and say what transfers and what breaks.", "title": "Scaffold first, then transfer", "sub": "Use the same hazard-evidence-boundary chain twice &mdash; and the second time in a different domain.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "MICRO-CASE &mdash; ISCARB SCAFFOLD", "txt": "The insulin pump&rsquo;s safety case argued CurrentDose &le; MaxDose (SR1) but never argued the daily cumulative dose (SR2). A 7-year-old was overdosed. Which hazard was missing from the hazard log, and which safety requirement would have closed it?", "field": {"id": "micro", "core": false, "rows": 3, "ph": "The missing hazard and the requirement that would close it"}}, {"c": "mag", "lab": "TRANSFER &mdash; THE WEEK 02 AUTOMOBILE BRAKING CASE", "txt": "An autonomous vehicle&rsquo;s braking system was certified safe against the single-pedestrian hazard. A multi-pedestrian incident occurred. Run the same chain: which hazard was missing from the safety case, and does your pump reasoning survive the change of domain?", "field": {"id": "transfer", "core": false, "rows": 3, "ph": "The missing hazard, and what transfers or breaks between the two domains"}}]}, {"t": "wide", "c": "violet", "ic": "pin", "tag": "{{flag}} &nbsp;{{localTag}}", "lab": "WHY BOTH CASES ARE LOCAL", "lead": "The evidence has a named destination &mdash; and that is what takes &ldquo;accept the failure cost&rdquo; off the menu.", "txt": "Hospital medical devices and automobile control systems are both regulated public safety in {{country}}. {{accreditor}} links the field to {{bodies}}. That makes safety engineering a national-professional competence, not a generic topic. <b>Local-context gate:</b> the context must change the decision, not only the wording."}, {"t": "principle", "txt": "Mechanism -&gt; Evidence -&gt; Decision boundary"}], "timebox": "1 min + 3 min", "task": "Solve the micro-case, then reuse the same reasoning chain on the Week 02 automobile braking case, and name which of {{bodiesShort}} receives your evidence. <b style=\"color:var(--mag)\">You are the project safety engineer.</b>", "notes": "Four minutes, the longest block. Deliberately a different domain from tonight&rsquo;s crisis: a student who can only reason about pumps has learned a case, not a capability. The automobile braking case is the chapter&rsquo;s own example of a primary safety-critical system (p.8), so the mechanism is familiar and only the transfer is new. Grade the transfer argument, not the answer.", "appendix": true, "route": "toolkit"}, {"k": "R13", "rule": "RULE 13 - Stress test your verdict", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Stress a verdict against four safety-engineering stress tests, and say which one it fails.", "title": "What change would break your solution?", "sub": "A strong verdict is one that survives the four questions below. Most do not survive the second.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 &nbsp; HAZARD COVERAGE", "lead": "Does the safety case cover all the hazards in the log?", "txt": "A safety case that proves SR1 but not SR2 has a coverage gap. The stress test asks: walk the hazard log, and for each entry ask which claim in the safety case addresses it."}, {"c": "mag", "lab": "2 &nbsp; CLAIM-EVIDENCE FIT", "lead": "Does the evidence actually imply the claim?", "txt": "400 tests on CurrentDose imply CurrentDose is correct in those 400 cases. They do not imply the daily cumulative is bounded. The stress test asks: which claim does the evidence support, and is that the claim the safety case makes?"}, {"c": "sand", "lab": "3 &nbsp; FAULT TREE COMPLETENESS", "lead": "Is there a branch nobody drew?", "txt": "The chapter&rsquo;s fault tree has three branches for the incorrect-dose hazard. Tonight reached a fourth. The stress test asks: what branch did nobody draw, and would drawing it change the verdict?"}, {"c": "violet", "lab": "4 &nbsp; PROCESS ASSURANCE", "lead": "Was the hazard log maintained, and by whom?", "txt": "A safety case without a hazard log is an argument without a spine. The stress test asks: who maintained the log, when was it last reviewed, and what entries are missing?"}]}, {"t": "wide", "c": "mag", "lab": "PICK THE ONE YOUR VERDICT FAILS", "field": {"id": "stress", "core": true, "rows": 2, "ph": "Which stress test does your verdict fail, and what would you change to survive it?"}}, {"t": "principle", "txt": "A verdict that survives all four stress tests is either remarkable or uncommitted &mdash; usually the second."}], "timebox": "3 min", "task": "Pick the stress test your verdict fails and write what you would change to survive it.", "notes": "Three minutes. The point is to fail one of the four on purpose &mdash; almost every verdict fails claim-evidence fit or fault tree completeness, and the honest student names which. A verdict that survives all four has usually not committed to a hazard at all.", "appendix": true, "route": "toolkit"}, {"k": "QA4", "noAnswer": true, "rule": "RETRIEVAL LOOP - Master", "phase": "ISCARB TOOLKIT", "accent": "sand", "learn": "Recall the accountability trio, the breaking variable, the workload question and where AI may sit in the assurance flow.", "title": "Sixty seconds on mastery", "sub": "Before the defense phase grades you: the four moves mastery is made of. Memory first.", "badge": {"c": "", "t": "RETRIEVAL", "s": "60 seconds &middot; recall, then reveal"}, "blocks": [{"t": "qa", "tag": "RULES 12 &middot; 13 &middot; 14 &middot; 15", "items": [{"q": "Three names, three roles, none of them the same person. Which roles?", "a": "The <b>owner</b> (project safety engineer) decides the verdict and names the hazard. The <b>evidence owner</b> maintains the hazard log and fault trees. The <b>sign-off</b> accepts the residual risk. If the three collapse into one person, the claim cannot be audited."}, {"q": "What are the four stress tests a safety verdict must survive?", "a": "<b>Hazard coverage</b> &mdash; does the safety case address every hazard in the log? <b>Claim-evidence fit</b> &mdash; does the evidence actually imply the claim? <b>Fault tree completeness</b> &mdash; is there a branch nobody drew? <b>Process assurance</b> &mdash; was the hazard log maintained, and by whom?"}, {"q": "Your safety case adds a hazard log entry per anomaly. Which question does Rule 14 ask &mdash; and what shape of answer does it want?", "a": "What workload cost does my design create, and what concrete design change reduces it &mdash; e.g. standing pre-approval below a stated risk band, a weekly batch instead of a queue, alarm rationalisation. Sympathy is not an answer."}, {"q": "Where may AI sit in the safety assurance flow, and where may it never sit?", "a": "AI prepares &mdash; drafts hazard log entries, suggests fault tree branches, generates test cases. It never owns the decision: a human signs. And the artifact you file is the test you ran, never the prompt or the answer."}]}], "timebox": "60 sec", "task": "Recall all four from memory. The fourth is the one the regulator will ask you first, five years from now.", "notes": "The mastery loop is the last retrieval before the room is graded on defense, so it rehearses the four moves the defense will press: ownership, the stress tests, workload and the AI gate. Question 3 wants a design change, not sympathy &mdash; the same test Rule 14 itself applies. Question 4 is deliberately the exact sentence from the flow: AI prepares, never owns, a human signs &mdash; if the room can say that sentence cold, Rule 15 landed.", "appendix": true, "route": "toolkit"}, {"k": "R16", "rule": "RULE 16 - Grade the decision", "phase": "ISCARB TOOLKIT", "accent": "teal", "learn": "Place their own artifact on a capability ladder, and read the gap between what they claimed and what it carries.", "title": "What a strong answer looks like here", "sub": "Four capability levels for tonight&rsquo;s verdict. These are levels, not marks &mdash; the mark follows the level.", "badge": {"c": "", "t": "READINESS", "s": "the gate is at Rule 20"}, "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "violet", "lab": "L1 &nbsp; ASSERTING", "lead": "A verdict with nothing behind it.", "txt": "States a verdict. Names no hazard, no artifact, no owner. Right or wrong, it cannot be audited."}, {"c": "teal", "lab": "L2 &nbsp; REASONING", "lead": "The hazard, cited &mdash; but nothing to inspect.", "txt": "Names the daily cumulative overdose hazard and cites the page. Still no artifact a stranger could inspect."}, {"c": "sand", "lab": "L3 &nbsp; JUSTIFYING", "lead": "A dated, owned hazard log entry, and a stated way to be wrong.", "txt": "Names a dated, owned hazard log entry, states what would falsify the claim, and bounds the residual risk."}, {"c": "green", "lab": "L4 &nbsp; ACCOUNTABLE", "lead": "L3, and it survives the constraint changing.", "txt": "All of L3, and the verdict survives a changed constraint &mdash; or the student explains exactly why it changes, and who re-signs."}]}, {"t": "levels"}, {"t": "wide", "c": "mag", "lab": "READINESS IS A GATE, NOT A LEVEL", "lead": "A level rates the reasoning. Readiness asks only whether the evidence is <i>visible</i>.", "txt": "Rule 20 checks it with four gates, and an open gate blocks the signature at any level. <b>Assignment 1</b> is the card you built tonight &mdash; LO1, 5 marks, {{assignmentDue}} &mdash; and its evidence policy is the same one: cite the source page, or mark the claim <i>unmeasured</i> with the measurement you would need."}], "hueOk": "Four levels on one rail, each with its own colour, is the scale itself &mdash; a two-colour version stops reading as an ordered ladder.", "timebox": "90 sec", "cut": true, "task": "Pick the level you think you are at, then read the line under it: it says what your card actually carries.", "notes": "The picker is self-assessment; the line under it is read from the boxes the
