hat would defeat this classification &mdash; and whether it exists"}}, {"t": "principle", "c": "mag", "txt": "The pump ran to spec at 06:30. The safety case said it was safe. Both can be true &mdash; and the child can still be in the hospital."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Safety versus reliability. Most of the room will say Spurious input because a sensor fault is the easiest story. The deeper answer is Specification error &mdash; the safety case may have argued the maximum single dose (SR1) without arguing the maximum daily cumulative dose (SR2). Do not correct anyone &mdash; ask which branch of the fault tree separates the two, and whether it exists. Usually it does not, and that absence is the real finding.", "appendix": false, "_iscarbRule": "X02 - Unsafe reliable systems", "route": "core", "showIf": null, "sourceRange": "3–14", "answer": "There may be dormant faults in a system that are undetected for many years and only rarely arise. The daily cumulative dose check may have been dormant through every test and surfaced tonight. If the system specification is incorrect then the system can behave as specified but still cause an accident. The safety case may have argued the wrong property. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X02A", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain the three safety achievement strategies and the six hazard terminology terms, and apply them to tonight&rsquo;s pump.", "title": "Safety terminology and achievement", "sub": "The chapter gives three strategies for safety achievement and six terms for the hazard chain. Together they are the vocabulary tonight&rsquo;s safety case must use.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · HAZARD AVOIDANCE", "lead": "Design so the hazard cannot arise.", "txt": "The system is designed so that some classes of hazard simply cannot arise. Example: the pump&rsquo;s hardware override limited to a preset maxOverride.", "src": "P1 · p.11"}, {"c": "sand", "lab": "2 · HAZARD DETECTION & REMOVAL", "lead": "Catch the hazard before it causes an accident.", "txt": "The system is designed so that hazards are detected and removed before they result in an accident. Example: SR3 self-test four times per hour, SR5 audible alarm, SR6 suspend delivery on alarm.", "src": "P1 · p.11"}, {"c": "violet", "lab": "3 · DAMAGE LIMITATION", "lead": "Minimise the harm if an accident occurs.", "txt": "The system includes protection features that minimise the damage that may result from an accident. Example: an independent protection system that opens a relief valve in a chemical reactor.", "src": "P1 · p.11"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE SIX TERMS", "lead": "Hazard, accident, damage, severity, probability, risk.", "txt": "<b>Hazard</b> &mdash; a condition with the potential to cause an accident. <b>Accident</b> &mdash; an unplanned event causing death, injury or damage. <b>Damage</b> &mdash; the loss resulting. <b>Hazard severity</b> &mdash; the worst possible damage. <b>Hazard probability</b> &mdash; the probability of events creating the hazard. <b>Risk</b> &mdash; the probability the system causes an accident.", "src": "P1 · p.12"}, {"c": "mag", "lab": "NORMAL ACCIDENTS", "lead": "Single-point failures are designed out. Accidents still happen.", "txt": "Accidents in complex systems rarely have a single cause. Designing so a single point of failure does not cause an accident is fundamental. But anticipating all problem combinations is impossible &mdash; so achieving complete safety is impossible. Accidents are inevitable.", "src": "P1 · p.13"}]}, {"t": "principle", "txt": "Safety is a lifecycle strategy: avoid -> detect -> limit. None of the three is enough on its own."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Safety terminology and achievement. This slide is a visual compression of source pp.11-13. Keep the source verbs visible: avoid, detect, limit. The grouping of normal accidents under the second card is only for classroom readability; the original idea stands on its own.", "appendix": false, "_iscarbRule": "X02A - Safety achievement and hazard terminology", "route": "core", "showIf": null, "sourceRange": "3–14", "answer": "The system is designed so that some classes of hazard simply cannot arise. Example: the pump’s hardware override limited to a preset maxOverride. The system is designed so that hazards are detected and removed before they result in an accident. Example: SR3 self-test four times per hour, SR5 audible alarm, SR6 suspend delivery on alarm. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X03", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Name the four steps of hazard-driven analysis and identify where each one sits in the safety requirements process.", "title": "Hazard-driven analysis", "sub": "Safety requirements engineering is hazard-driven. The four steps turn a system into a set of protection requirements that ensure failures do not cause injury or death.", "blocks": [{"t": "cards", "cols": 4, "items": [{"c": "teal", "lab": "1 · HAZARD IDENTIFICATION", "lead": "Identify hazards that may threaten the system.", "txt": "May be based on hazard types: physical, electrical, biological, service failure. For the insulin pump: overdose, underdose, power failure, electrical interference, poor sensor contact, parts breaking off, infection, allergic reaction.", "src": "P1 · p.18-19"}, {"c": "sand", "lab": "2 · HAZARD ASSESSMENT", "lead": "Estimate risk probability and severity; classify.", "txt": "Risks are categorised as Intolerable (must never arise), ALARP (as low as reasonably practical), or Acceptable (no extra cost needed). The insulin overdose is classified High risk, Intolerable.", "src": "P1 · p.20-24"}, {"c": "violet", "lab": "3 · HAZARD ANALYSIS", "lead": "Discover the root causes of risks.", "txt": "Inductive (bottom-up): start from a proposed failure and assess hazards. Deductive (top-down): start from a hazard and deduce causes. Fault tree analysis is the canonical deductive technique.", "src": "P1 · p.25-26"}, {"c": "mag", "lab": "4 · SAFETY REQUIREMENTS SPEC", "lead": "Specify requirements to manage the risks.", "txt": "Risk reduction strategies drive the requirements: hazard avoidance, hazard detection and removal, damage limitation. The result is a set of &lsquo;shall not&rsquo; requirements like SR1-SR6.", "src": "P1 · p.29-32"}]}, {"t": "wide", "c": "sand", "lab": "THE STEP TONIGHT&rsquo;S SAFETY CASE SKIPPED", "lead": "The four steps are not optional &mdash; a safety case that skips one is not a safety case.", "txt": "Tonight&rsquo;s safety case argued the maximum single dose (SR1) but never specified a maximum daily cumulative dose (SR2). That is step 4 incomplete on the overdose hazard &mdash; the requirement was never written. The fault is not in the code; it is in the safety requirements specification.", "field": {"id": "hazard_step", "core": false, "rows": 2, "ph": "Which step did tonight&rsquo;s safety case skip, and what requirement would close the gap?"}}, {"t": "principle", "txt": "Hazard identification &rarr; assessment &rarr; analysis &rarr; specification. Skipping a step is not a shortcut; it is a hole in the safety case."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Hazard-driven analysis. Two minutes. The room usually says step 3 (analysis) because the fault tree is missing. The deeper answer is step 4 (specification): SR2 exists in the chapter as an example, but the team never wrote it into their own safety case. Skipping the spec step is what made the safety case convincing but wrong. Do not correct anyone; ask which step produces the SR1-SR6 requirements, and whether SR2 is in the team&rsquo;s file.", "appendix": false, "_iscarbRule": "X03 - Hazard-driven analysis", "route": "core", "showIf": null, "sourceRange": "15–24", "answer": "May be based on hazard types: physical, electrical, biological, service failure. For the insulin pump: overdose, underdose, power failure, electrical interference, poor sensor contact, parts breaking off, infection, allergic reaction. Risks are categorised as Intolerable (must never arise), ALARP (as low as reasonably practical), or Acceptable (no extra cost needed). The insulin overdose is classified High risk, Intolerable. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK1", "title": "Check 1 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A program always implements an unsafe requirement correctly. Is it safe?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "No. Correct implementation of the specification does not establish that the specification is safe in its operating environment. Review hazards and system-level requirements.", "timebox": "60 sec", "appendix": false}, {"k": "X04", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Read the chapter&rsquo;s insulin pump risk classification table, and place tonight&rsquo;s overdose in it.", "title": "Hazard assessment and risk acceptance", "sub": "The source p.24 gives a worked risk classification for the insulin pump&rsquo;s nine identified hazards. Tonight&rsquo;s overdose is hazard #1 in that table.", "blocks": [{"t": "figure", "img": "ch12_risktri", "cap": "p.21 · the risk triangle", "right": [{"t": "cards", "cols": 1, "items": [{"c": "mag", "lab": "RISK TRIANGLE", "lead": "Intolerable at the top, ALARP in the middle, Acceptable at the bottom.", "txt": "Risks are categorised as Intolerable (must never arise), ALARP (as low as reasonably practical — minimise probability given cost and schedule), or Acceptable (no extra cost needed). The boundaries between regions are pushed upwards with time: society is less willing to accept risk."}]}]}, {"t": "compare", "head": ["#", "Hazard", "Probability", "Severity", "Risk", "Acceptability"], "rows": [{"c": "mag", "cells": ["1", "Insulin overdose computation", "Medium", "High", "High", "Intolerable"]}, {"c": "teal", "cells": ["2", "Insulin underdose computation", "Medium", "Low", "Low", "Acceptable"]}, {"c": "sand", "cells": ["3", "Failure of hardware monitoring system", "Medium", "Medium", "Low", "ALARP"]}, {"c": "teal", "cells": ["4", "Power failure", "High", "Low", "Low", "Acceptable"]}, {"c": "mag", "cells": ["5", "Machine incorrectly fitted", "High", "High", "High", "Intolerable"]}, {"c": "sand", "cells": ["6", "Machine breaks in patient", "Low", "High", "Medium", "ALARP"]}, {"c": "sand", "cells": ["7", "Machine causes infection", "Medium", "Medium", "Medium", "ALARP"]}, {"c": "sand", "cells": ["8", "Electrical interference", "Low", "High", "Medium", "ALARP"]}, {"c": "teal", "cells": ["9", "Allergic reaction", "Low", "Low", "Low", "Acceptable"]}]}, {"t": "wide", "c": "mag", "lab": "HAZARD #1 IS TONIGHT&rsquo;S HAZARD &mdash; AND IT IS CLASSIFIED INTOLERABLE", "lead": "Intolerable means must never arise or result in an accident. The safety case did not make it impossible.", "txt": "The chapter classifies insulin overdose as Intolerable (p.24). Intolerable hazards must be designed out &mdash; not monitored, not reduced, not accepted. The safety case accepted SR1 (maximum single dose) and treated it as sufficient. It was not: SR2 (maximum daily cumulative dose) is also required, and the team never wrote it. An intolerable hazard with one of two safety requirements missing is a safety case that cannot hold.", "field": {"id": "risk_class", "core": false, "rows": 2, "ph": "For your verdict: is hazard #1 tolerable, ALARP, or intolerable &mdash; and what does that oblige the safety case to do?"}}, {"t": "principle", "c": "mag", "txt": "Intolerable hazards are not monitored. They are designed out &mdash; or the system does not deploy."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Hazard assessment and risk acceptance. Two minutes. The table is the slide that makes the verdict concrete &mdash; the room cannot argue with hazard #1 being Intolerable because the chapter itself says so. The trap is the student who says &ldquo;we will add more testing&rdquo;. Testing cannot make an Intolerable hazard tolerable; only a design change (writing SR2 and enforcing it) can. Make the room name the requirement, not the test.", "appendix": false, "_iscarbRule": "X04 - Risk classification and the insulin pump table", "route": "core", "showIf": null, "sourceRange": "15–24", "answer": "Risks are categorised as Intolerable (must never arise), ALARP (as low as reasonably practical — minimise probability given cost and schedule), or Acceptable (no extra cost needed). The boundaries between regions are pushed upwards with time: society is less willing to accept risk. The chapter classifies insulin overdose as Intolerable (p.24). Intolerable hazards must be designed out — not monitored, not reduced, not accepted. The safety case accepted SR1 (maximum single dose) and treated it as sufficient. It was not: SR2 (maximum daily cumulative dose) is also required, and the team never wrote it. An intolerable hazard with one of two safety requirements missing is a safety case that cannot hold. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X05", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Read a fault tree, distinguish deductive from inductive analysis, and identify the root causes the tree exposes.", "title": "Fault trees and causal assumptions", "sub": "A deductive, top-down technique. The hazard goes at the root; the system states that could lead to it branch below, linked by &lsquo;and&rsquo; or &lsquo;or&rsquo;.", "blocks": [{"t": "figure", "img": "ch12_faulttree", "cap": "p.27 · software fault tree for insulin pump", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "THE FAULT TREE", "lead": "Hazard at root, three branches, root causes at the leaves.", "txt": "The chapter&rsquo;s fault tree (p.27-28) places \"Incorrect insulin dose\" at the root and identifies three conditions: incorrect measurement of blood sugar, failure of delivery system, dose delivered at wrong time. The root causes related to software: algorithm error, arithmetic error."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE TECHNIQUE", "lead": "Hazard at root, causes branching below.", "txt": "Put the risk or hazard at the root of the tree and identify the system states that could lead to that hazard. Where appropriate, link these with &lsquo;and&rsquo; or &lsquo;or&rsquo; conditions. A goal should be to minimise the number of single causes of system failure.", "src": "P1 · p.26"}, {"c": "sand", "lab": "TONIGHT&rsquo;S TREE", "lead": "Three conditions lead to incorrect dose.", "txt": "The chapter&rsquo;s fault tree for the insulin pump (p.28) identifies three conditions that can lead to delivery of an incorrect dose: incorrect measurement of blood sugar level, failure of delivery system, dose delivered at wrong time. The root causes related to software: algorithm error, arithmetic error.", "src": "P1 · p.28"}]}, {"t": "cards", "cols": 2, "items": [{"c": "violet", "lab": "INDUCTIVE (BOTTOM-UP)", "lead": "Start from a proposed failure, assess hazards.", "txt": "Inductive techniques start with a proposed system failure and assess the hazards that could arise from that failure. Useful when you have a known component failure mode and want to know what it could cause."}, {"c": "mag", "lab": "DEDUCTIVE (TOP-DOWN)", "lead": "Start from a hazard, deduce causes.", "txt": "Deductive techniques start with a hazard and deduce what the causes of this could be. Fault tree analysis is the canonical deductive technique. Useful when you have a known hazard (the overdose) and want to know what could reach it."}]}, {"t": "wide", "c": "sand", "lab": "WHICH BRANCH DID TONIGHT REACH?", "lead": "The fault tree has three branches. Tonight reached a fourth &mdash; the one nobody drew.", "field": {"id": "fault_branch", "core": false, "rows": 2, "ph": "Which branch of the fault tree did tonight&rsquo;s incident reach &mdash; or is it a branch nobody drew?"}}, {"t": "principle", "txt": "A fault tree with a missing branch is not a fault tree. It is a drawing of the branches you already thought of."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Fault trees and causal assumptions. Two minutes. The room usually picks &lsquo;algorithm error&rsquo; from the chapter&rsquo;s tree. The deeper answer is that tonight reached a branch the chapter&rsquo;s own tree does not have: the daily cumulative dose path. The tree was drawn for the single-dose hazard (SR1) and never extended to the daily cumulative hazard (SR2). That is the gap. A student who says &ldquo;the tree is incomplete&rdquo; has answered the right question; a student who picks an existing branch has not.", "appendix": false, "_iscarbRule": "X05 - Fault tree analysis", "route": "core", "showIf": null, "sourceRange": "25–32", "answer": "The chapter’s fault tree (p.27-28) places \"Incorrect insulin dose\" at the root and identifies three conditions: incorrect measurement of blood sugar, failure of delivery system, dose delivered at wrong time. The root causes related to software: algorithm error, arithmetic error. Put the risk or hazard at the root of the tree and identify the system states that could lead to that hazard. Where appropriate, link these with ‘and’ or ‘or’ conditions. A goal should be to minimise the number of single causes of system failure. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X06", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Read the chapter&rsquo;s six safety requirements for the insulin pump, and identify which one tonight reached.", "title": "Safety requirements and risk reduction", "sub": "The source p.32 gives six safety requirements for the insulin pump. Tonight&rsquo;s incident reached a gap between SR1 and SR2.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "SR1", "lead": "Max single dose.", "txt": "The system shall not deliver a single dose of insulin that is greater than a specified maximum dose for a system user.", "src": "P1 · p.32"}, {"c": "mag", "lab": "SR2", "lead": "Max daily cumulative dose.", "txt": "The system shall not deliver a daily cumulative dose of insulin that is greater than a specified maximum daily dose for a system user.", "src": "P1 · p.32"}, {"c": "teal", "lab": "SR3", "lead": "Hardware diagnostics on schedule.", "txt": "The system shall include a hardware diagnostic facility that shall be executed at least four times per hour.", "src": "P1 · p.32"}, {"c": "teal", "lab": "SR4", "lead": "Exception handlers for all cases.", "txt": "The system shall include an exception handler for all of the exceptions that are identified in Table 3.", "src": "P1 · p.32"}, {"c": "mag", "lab": "SR5", "lead": "Audible alarm on anomaly.", "txt": "The audible alarm shall be sounded when any hardware or software anomaly is discovered and a diagnostic message, as defined in Table 4, shall be displayed.", "src": "P1 · p.32"}, {"c": "teal", "lab": "SR6", "lead": "Suspend delivery on alarm.", "txt": "In the event of an alarm, insulin delivery shall be suspended until the user has reset the system and cleared the alarm.", "src": "P1 · p.32"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT REACHED THE GAP BETWEEN SR1 AND SR2", "lead": "The safety case enforced SR1. It never wrote SR2. Tonight the cumulative dose exceeded the daily maximum &mdash; and SR5 did not fire.", "txt": "SR1 bounds the single dose. SR2 bounds the daily cumulative dose. Tonight&rsquo;s incident is the daily cumulative path: each individual dose was below the single-dose maximum (SR1 held), but the cumulative dose across the night exceeded the daily maximum (SR2 was never written). Worse, SR5 should have sounded when the anomaly arose &mdash; and it did not. That is two requirements broken in one incident.", "field": {"id": "sr_gap", "core": false, "rows": 2, "ph": "For your verdict: which SR was missing, which SR failed at run time, and what design change closes both?"}}, {"t": "principle", "c": "mag", "txt": "A safety case that enforces SR1 but never writes SR2 is a safety case for a different pump."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Safety requirements and risk reduction. Two minutes. This is the slide where the chapter&rsquo;s own case meets tonight&rsquo;s crisis &mdash; both are insulin pumps. The room should reach the conclusion on its own: SR2 was never written into the team&rsquo;s safety case, and SR5 failed at run time because the anomaly it should have caught was on the daily cumulative path the safety case did not model. The verdict is what closes both: write SR2, add a daily cumulative check, and test the alarm under that path. That is the gap, and the verdict is what closes it.", "appendix": false, "_iscarbRule": "X06 - Safety requirements SR1 to SR6", "route": "core", "showIf": null, "sourceRange": "25–32", "answer": "The system shall not deliver a single dose of insulin that is greater than a specified maximum dose for a system user. The system shall not deliver a daily cumulative dose of insulin that is greater than a specified maximum daily dose for a system user. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X09", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Explain why safety-critical systems use plan-based processes, what process assurance produces, and why agile is rarely used.", "title": "Safety engineering processes", "sub": "Safety engineering processes are based on reliability engineering processes. They are plan-based, with reviews and checks at each stage, and they generate documentation that agile methods minimise.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "1 · PLAN-BASED PROCESS", "lead": "Reviews and checks at each stage.", "txt": "Safety engineering processes are based on reliability engineering processes: plan-based approach with reviews and checks at each stage. General goal of fault avoidance and fault detection. Must also include safety reviews and explicit identification and tracking of hazards.", "src": "P1 · p.34"}, {"c": "sand", "lab": "2 · REGULATION & EVIDENCE", "lead": "The regulator requires evidence the process was followed.", "txt": "Regulators may require evidence that safety engineering processes have been used: the specification and records of checks made; evidence of V&amp;V processes and their results; evidence that organisations have defined and dependable software processes that include safety assurance reviews &mdash; with records that these processes were properly enacted.", "src": "P1 · p.35"}, {"c": "violet", "lab": "3 · WHY NOT AGILE", "lead": "Documentation and up-front analysis conflict with agile.", "txt": "Agile methods are not usually used for safety-critical systems engineering. Extensive process and product documentation is needed for system regulation &mdash; contradicts agile&rsquo;s focus on the software itself. A detailed safety analysis of a complete system specification is important &mdash; contradicts the interleaved development of spec and program. Some agile techniques such as test-driven development may still be used.", "src": "P1 · p.36"}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "PROCESS ASSURANCE", "lead": "Two questions: right processes? done right?", "txt": "<b>Do we have the right processes?</b> Are the processes appropriate for the level of dependability required &mdash; should include requirements management, change management, reviews and inspections. <b>Are we doing the processes right?</b> Have these processes been followed by the development team. Process assurance generates documentation &mdash; which is why agile processes are rarely used for critical systems.", "src": "P1 · p.37"}, {"c": "sand", "lab": "SAFETY-RELATED PROCESS ACTIVITIES", "lead": "Five activities a dependable process must include.", "txt": "<b>1.</b> Creation of a hazard logging and monitoring system. <b>2.</b> Appointment of project safety engineers with explicit responsibility for system safety. <b>3.</b> Extensive use of safety reviews. <b>4.</b> Creation of a safety certification system where the safety of critical components is formally certified. <b>5.</b> Detailed configuration management. Accidents are rare events so testing may not find all problems; safety requirements are sometimes &lsquo;shall not&rsquo; requirements that cannot be demonstrated through testing.", "src": "P1 · p.38-39"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S PROCESS GAP", "lead": "The safety case was signed off without a hazard log entry for the daily cumulative overdose. That is a process failure, not a code failure.", "txt": "Of the five safety-related process activities, the team skipped at least three: (1) the hazard logging system never received the daily cumulative overdose as an entry; (2) no project safety engineer was appointed with explicit responsibility for the daily cumulative path; (3) the safety reviews were driven by the existing hazard register &mdash; which did not contain the missing hazard. Process assurance is not bureaucracy: it is the difference between a hazard that is caught in review and a hazard that arrives in a child at 06:30.", "field": {"id": "process_gap", "core": false, "rows": 2, "ph": "For your verdict: which of the five process activities did the team skip, and what would the activity have produced?"}}, {"t": "principle", "txt": "A safety case without a process is a document. A process without a hazard log is a calendar. Neither is safety."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Safety engineering processes. Two minutes. This slide is the bridge from technical safety (X01-X06) to process safety (the chapter&rsquo;s section 5). The room usually focuses on the missing SR2 and the broken SR5; this slide asks the deeper question: what process would have caught the missing SR2 before the code was written? The answer is the hazard log &mdash; activity #1. If the daily cumulative overdose had been entered as a hazard, the fault tree (activity: hazard analysis) would have followed, the SR2 requirement (activity: safety requirements spec) would have followed, and the safety review (activity #3) would have asked whether SR2 was enforced. Skipping the process is not skipping paperwork; it is skipping the chain that catches the hazard.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "33–43", "answer": "Safety engineering processes are based on reliability engineering processes: plan-based approach with reviews and checks at each stage. General goal of fault avoidance and fault detection. Must also include safety reviews and explicit identification and tracking of hazards. Regulators may require evidence that safety engineering processes have been used: the specification and records of checks made; evidence of V&V processes and their results; evidence that organisations have defined and dependable software processes that include safety assurance reviews — with records that these processes were properly enacted. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "CHECK2", "title": "Check 2 · recall before revealing", "phase": "CHECK", "route": "core", "blocks": [{"t": "wide", "c": "sand", "lab": "60-SECOND PAUSE", "txt": "A fault tree has an AND gate. May you multiply branch probabilities?"}], "task": "Think individually for 30 seconds, compare with a partner, then reveal the explanation.", "answer": "Only with an explicit probabilistic model and justified independence (or a suitable dependence model). The logical gate alone does not justify multiplying estimates. Check shared causes.", "timebox": "60 sec", "appendix": false}, {"k": "R09", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Explain the hazard log, the safety review process, and the role of the project safety engineer.", "title": "Hazard logs and safety reviews", "sub": "A document tracking hazards throughout the safety engineering process. Records identified hazards, their criticality, fault trees, and the safety design requirements derived from them.", "blocks": [{"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE HAZARD LOG", "lead": "One entry per hazard, tracked through the process.", "txt": "The chapter&rsquo;s example entry (p.41) records: identified hazard (insulin overdose), identified by (Jane Williams), criticality class (1), identified risk (High), fault tree identified (YES, dated), fault tree creators, fault tree checked (YES, dated, by James Brown). The log is the audit trail from hazard to safety requirement to verification.", "src": "P1 · p.41-42"}, {"c": "sand", "lab": "THE SAFETY REVIEW", "lead": "Driven by the hazard register.", "txt": "For each identified hazard, the review team assesses the system and judges whether the system can cope with that hazard in a safe way. The review is not a code review &mdash; it is a hazard-by-hazard walkthrough of the safety case.", "src": "P1 · p.43"}]}, {"t": "wide", "c": "mag", "lab": "TONIGHT&rsquo;S HAZARD LOG", "lead": "If the daily cumulative overdose was never entered in the log, the safety review never saw it.", "txt": "The hazard log is the spine of the safety case. If a hazard is not in the log, it has no fault tree, no safety requirement, no review. Tonight&rsquo;s hazard &mdash; daily cumulative overdose &mdash; was never entered. That is why SR2 was never written, why the fault tree was never extended, and why the safety review never asked the question that would have caught it. The gap is not in the code; it is in the log.", "field": {"id": "hazard_log", "core": false, "rows": 2, "ph": "For your verdict: which hazard is missing from tonight&rsquo;s hazard log, and what entry would close the gap?"}}, {"t": "principle", "txt": "A hazard not in the log is a hazard the safety review cannot see. A hazard the review cannot see is a hazard the safety case does not cover."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Hazard logs and safety reviews. Two minutes. The hazard log is the slide that connects the abstract hazard terminology to the concrete document the regulator reads. Make every student write the missing entry: hazard name (daily cumulative overdose), criticality class (1), identified risk (High, Intolerable), fault tree (none &mdash; to be produced), safety requirement (SR2 &mdash; to be written), review (to be scheduled). An entry in the log forces a fault tree, which forces a requirement, which forces a test. That is the chain.", "appendix": false, "_iscarbRule": "RULE 09 - Hazard log and safety reviews", "route": "core", "showIf": null, "sourceRange": "33–43", "answer": "The chapter’s example entry (p.41) records: identified hazard (insulin overdose), identified by (Jane Williams), criticality class (1), identified risk (High), fault tree identified (YES, dated), fault tree creators, fault tree checked (YES, dated, by James Brown). The log is the audit trail from hazard to safety requirement to verification. For each identified hazard, the review team assesses the system and judges whether the system can cope with that hazard in a safe way. The review is not a code review — it is a hazard-by-hazard walkthrough of the safety case. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "R18", "rule": "", "phase": "LEARN", "accent": "teal", "learn": "Name the V&V techniques that survive safety certification, and the limits formal methods cannot escape.", "title": "Formal verification and model checking", "sub": "A strong process removes operational ambiguity before the day it is needed &mdash; and knows where its proofs stop.", "blocks": [{"t": "figure", "img": "ch12_modelcheck", "cap": "p.49 · model checking", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "MODEL CHECKING", "lead": "Exhaustively explore all states of a finite model.", "txt": "Model checking creates an extended finite state model of a system and uses a model checker to exhaustively explore all paths, checking a user-specified property on each. Particularly valuable for verifying concurrent systems which are hard to test."}]}]}, {"t": "zones", "book": {"ic": "book", "tag": "FROM THE BOOK", "sub": "Sommerville Ch.12 &mdash; the V&V techniques", "items": [{"c": "teal", "lab": "FORMAL METHODS", "lead": "Mathematical proof that a program conforms to its spec.", "txt": "The ultimate static verification technique. A formal specification may be developed and mathematically analyzed for consistency. Formal arguments that a program conforms to its mathematical specification may be developed. Effective in discovering programming and design errors.", "src": "P1 · p.44-45"}, {"c": "teal", "lab": "MODEL CHECKING", "lead": "Exhaustively explore all states of a finite model.", "txt": "Creates an extended finite state model of a system and, using a model checker, checks that model for errors. The model checker explores all possible paths through the model and checks that a user-specified property is valid for each path. Particularly valuable for verifying concurrent systems.", "src": "P1 · p.48"}, {"c": "green", "lab": "STATIC ANALYSIS", "lead": "Examine source code without running it.", "txt": "Software tools for source text processing. They parse the program text and try to discover potentially erroneous conditions. Very effective as an aid to inspections &mdash; a supplement to, but not a replacement for, inspections. Now routinely used in safety and security critical systems.", "src": "P1 · p.50-53"}]}, "course": {"ic": "pin", "tag": "FROM YOUR COURSE", "sub": "not in the chapter &mdash; your context", "items": [{"t": "wide", "c": "mag", "lab": "BACK TO THE SAFETY CASE &mdash; THE PART NOBODY CALLED A DESIGN DECISION", "lead": "The safety case proved CurrentDose &le; MaxDose with 400 tests + static analysis. It never proved the daily cumulative bound. The V&V was right; the claim was wrong.", "txt": "The thing that put you in the room was a <i>safety case</i>: a structured argument signed off on the wrong property. Three questions the process owes an answer to, none about the V&V itself. <b>Which claim</b> did the safety case prove &mdash; and is that the claim that covers tonight? <b>Which branch</b> of the fault tree was never drawn &mdash; and would formal methods have found it? <b>How much</b> does one safety case cover &mdash; could it have been split, with the single-dose argument certified first and the daily cumulative argument certified later? A defined process answers these in advance; an improvised one discovers them at 06:30."}]}}, {"t": "principle", "txt": "The line is not formal against informal. It is &lsquo;covers the claim&rsquo; against &lsquo;covers a different claim&rsquo;."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Formal verification and model checking. Static analysis is the technique that survives safety certification best, because it produces the artifact as a by-product rather than as extra work. Say that &mdash; it is the one thing on this slide students can use in their project next week. <b>Then spend a full minute on the magenta card.</b> The crisis that opened the hour was a safety case, and the room has spent seventy minutes arguing about the pump without once asking about the claim the safety case actually proved. That is the most common mistake in industry as well as in the classroom: the failure gets attributed to the V&V that missed it rather than to the claim that was never made. Three answers to look for &mdash; a safety case claim matched to the right hazard, a fault tree branch that was never drawn, and a safety case split that would have certified the single-dose argument first and the daily cumulative argument later. A student who says &ldquo;we would have tested more&rdquo; has not answered; push for which of the three.", "appendix": false, "_iscarbRule": "RULE 18 - Formal verification and static analysis", "route": "core", "showIf": null, "sourceRange": "44–53", "answer": "Model checking creates an extended finite state model of a system and uses a model checker to exhaustively explore all paths, checking a user-specified property on each. Particularly valuable for verifying concurrent systems which are hard to test. The ultimate static verification technique. A formal specification may be developed and mathematically analyzed for consistency. Formal arguments that a program conforms to its mathematical specification may be developed. Effective in discovering programming and design errors. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "D12", "title": "Static analysis and its limits", "sub": "Required source concepts with a short worked explanation.", "blocks": [{"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "Characteristic checks", "txt": "Tools detect patterns such as uninitialized variables, unreachable code, inconsistent parameters and memory leaks.", "src": "P1 · pp.50–53"}, {"c": "teal", "lab": "Custom rules and assertions", "txt": "User-defined rules extend checks. Assertion checking uses specified relationships to find possible violations.", "src": "P1 · pp.50–53"}, {"c": "teal", "lab": "Evidence boundary", "txt": "A warning identifies a possible defect; absence of warnings does not establish system safety. Combine analysis with inspections, tests and a hazard argument.", "src": "P1 · pp.50–53"}]}], "task": "Why is a clean static-analysis report insufficient for safety?", "answer": "The analyzer checks a model and selected defect classes. Requirements, physical hazards, omitted behavior and operating assumptions may remain outside those checks.", "sourceRange": "50–53", "noAnswer": false, "route": "core", "appendix": false, "phase": "LEARN", "rule": "", "showIf": null, "timebox": "", "notes": "Teaching focus: Static analysis and its limits. "}, {"k": "B01", "rule": "", "phase": "LEARN", "accent": "violet", "learn": "Explain what a safety case is, what it contains, and why a structured argument is the form it takes.", "title": "The structure of a safety case", "sub": "A safety case is a documented body of evidence that provides a convincing and valid argument that a system is adequately safe for a given application in a given environment.", "badge": {"c": "violet", "t": "COURSE ADDITION", "s": "document structure, not a single source page"}, "blocks": [{"t": "figure", "img": "ch12_structarg", "cap": "p.60 · structured arguments", "right": [{"t": "cards", "cols": 1, "items": [{"c": "teal", "lab": "STRUCTURED ARGUMENT", "lead": "A claim supported by evidence, connected by an argument.", "txt": "A safety case argument is based on a claim and evidence. The argument justifies why the claim is supported by the evidence. The structure makes the reasoning inspectable: a reviewer can challenge any link in the chain."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "WHAT IT IS", "lead": "A structured argument, not a test report.", "txt": "A documented body of evidence that provides a convincing and valid argument that a system is adequately safe for a given application in a given environment. Arguments can be based on formal proof, design rationale, safety proofs, etc. Process factors may also be included. A software safety case is usually part of a wider system safety case.", "src": "P1 · p.56"}, {"c": "violet", "lab": "WHAT IT CONTAINS", "lead": "Eight chapters &mdash; from system description to associated safety cases.", "txt": "System description, safety requirements, hazard and risk analysis, design analysis (structured arguments), V&amp;V procedures and results, review reports, team competences, process QA records, change management processes, associated safety cases.", "src": "P1 · p.57-58"}]}, {"t": "cards", "cols": 3, "items": [{"c": "sand", "lab": "STRUCTURED ARGUMENT", "txt": "A claim hierarchy. You start at the leaves (low-level claims supported by evidence) and demonstrate safety. This implies the higher-level claims are true."}, {"c": "sand", "lab": "CLAIM + EVIDENCE", "txt": "Arguments are based on claims and evidence. Claim: CurrentDose &le; MaxDose. Evidence: test data, static analysis. Argument: the evidence demonstrates the claim."}, {"c": "mag", "lab": "SAFETY, NOT CORRECTNESS", "txt": "Safety arguments show the system cannot reach an unsafe state. They are weaker than correctness arguments (which must show conformance to spec). The aim is to demonstrate safety, not correctness."}]}, {"t": "principle", "c": "mag", "txt": "A safety case is not a pile of evidence. It is an argument that the evidence implies the system is safe."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: The structure of a safety case. Ninety seconds. The slide exists because students confuse a safety case with a test report. A test report says &ldquo;we ran 400 tests and they passed&rdquo;. A safety case says &ldquo;here is the claim, here is the evidence, here is why the evidence implies the claim, and here is what the claim does not cover&rdquo;. Tonight&rsquo;s gap is in the third part: the team had a claim (SR1) and evidence (400 tests), but never wrote the claim for the daily cumulative path (SR2). The argument was valid for what it claimed; it just did not claim enough.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "54–70", "answer": "A safety case argument is based on a claim and evidence. The argument justifies why the claim is supported by the evidence. The structure makes the reasoning inspectable: a reviewer can challenge any link in the chain. A documented body of evidence that provides a convincing and valid argument that a system is adequately safe for a given application in a given environment. Arguments can be based on formal proof, design rationale, safety proofs, etc. Process factors may also be included. A software safety case is usually part of a wider system safety case. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "X10", "rule": "", "phase": "LEARN", "accent": "sand", "learn": "Construct an informal safety argument by proof-by-contradiction on the program paths, and read the chapter&rsquo;s insulin dose code.", "title": "Constructing a safety argument", "sub": "Safety arguments are weaker than correctness arguments: they show the system cannot reach an unsafe state, not that the code conforms to its spec. The chapter&rsquo;s method is proof by contradiction.", "blocks": [{"t": "figure", "img": "ch12_safetyarg", "cap": "p.67 · informal safety argument for insulin pump", "right": [{"t": "cards", "cols": 1, "items": [{"c": "sand", "lab": "INFORMAL ARGUMENT", "lead": "Proof by contradiction: assume unsafe, show contradiction on every path.", "txt": "The chapter&rsquo;s informal safety argument (p.67-68) for the insulin dose computation. Assume the unsafe exit condition (dose > maxDose) and show, for each program path, that the assignments made contradict the assumption. Weaker than a correctness proof, but sufficient for safety."}]}]}, {"t": "cards", "cols": 2, "items": [{"c": "teal", "lab": "THE METHOD", "lead": "Assume unsafe, show contradiction on every path.", "txt": "<b>Safety arguments show the system cannot reach an unsafe state.</b> They are weaker than correctness arguments which must show the system code conforms to its specification. They are generally based on proof by contradiction: (1) assume an unsafe state can be reached; (2) show this is contradicted by the program code. A graphical model of the safety argument may be developed.", "src": "P1 · p.64"}, {"c": "violet", "lab": "THE CONSTRUCTION STEPS", "lead": "Start from the END, work backwards.", "txt": "<b>1.</b> Establish the safe exit conditions for a component or program. <b>2.</b> Starting from the END of the code, work backwards until you have identified all paths that lead to the exit. <b>3.</b> Assume the exit condition is false (unsafe). <b>4.</b> Show that, for each path leading to the exit, the assignments made in that path contradict the assumption of an unsafe exit.", "src": "P1 · p.65"}]}, {"t": "cards", "cols": 2, "items": [{"c": "sand", "lab": "THE INSULIN DOSE CODE", "lead": "The chapter&rsquo;s own example (p.66).", "txt": "<pre style=\"font-family:var(--mono);font-size:11px;line-height:1.4;color:var(--ink);background:var(--panel2);padding:8px;border-radius:6px;overflow:auto;margin:0\">currentDose = computeInsulin();\\n// Safety check &mdash; adjust currentDose if necessary.\\n// if statement 1\\nif (previousDose == 0) {\\n  if (currentDose &gt; maxDose/2)\\n    currentDose = maxDose/2;\\n} else\\n  if (currentDose &gt; (previousDose * 2))\\n    currentDose = previousDose * 2;\\n// if statement 2\\nif (currentDose &lt; minimumDose)\\n  currentDose = 0;\\nelse if (currentDose &gt; maxDose)\\n  currentDose = maxDose;\\nadministerInsulin(currentDose);</pre>", "src": "P1 · p.66"}, {"c": "mag", "lab": "THE THREE PROGRAM PATHS", "lead": "In all cases, post-conditions contradict the unsafe condition.", "txt": "<b>Neither branch of if-statement 2 is executed:</b> can only happen if CurrentDose is &ge; minimumDose AND &le; maxDose. <b>Then branch of if-statement 2 is executed:</b> currentDose = 0. <b>Else branch of if-statement 2 is executed:</b> currentDose = maxDose. In all cases, the post-conditions contradict the unsafe condition that the dose administered is greater than maxDose.", "src": "P1 · p.68"}]}, {"t": "wide", "c": "mag", "lab": "WHY THIS ARGUMENT DID NOT COVER TONIGHT", "lead": "The argument proves a single dose cannot exceed maxDose. It says nothing about the daily cumulative dose.", "txt": "The chapter&rsquo;s safety argument proves: for every program path through the insulin dose computation, the administered single dose is &le; maxDose. That is a valid argument for SR1. It is silent on SR2 &mdash; the daily cumulative dose. Tonight&rsquo;s incident is exactly the path the argument did not cover: each individual dose was &le; maxDose (so the argument holds), but the cumulative dose across the night exceeded the daily maximum (the argument is silent). The lesson: a safety argument is only as strong as the unsafe state it assumes. Assume the wrong unsafe state and the proof is valid for the wrong property.", "field": {"id": "safety_arg_gap", "core": false, "rows": 2, "ph": "For your verdict: what unsafe state should the safety argument have assumed, and what program paths would the proof need to cover?"}}, {"t": "principle", "c": "mag", "txt": "A safety argument proves what its assumed unsafe state says. Assume the wrong unsafe state and the proof is valid for the wrong property."}], "timebox": "", "task": "Self-check: explain the main distinction on this page, then name an assumption you would verify in the opening case.", "notes": "Teaching focus: Constructing a safety argument. Three minutes. This is the slide where the chapter&rsquo;s own method meets tonight&rsquo;s gap. The chapter&rsquo;s safety argument is correct for SR1 &mdash; the single-dose path. Tonight&rsquo;s incident is on SR2 &mdash; the daily cumulative path. The argument never assumed that unsafe state, so the proof never covered those paths. The lesson generalises: when you read a safety argument, ask first &ldquo;what unsafe state did it assume?&rdquo; &mdash; because that is the property being proved, no more. A student who says &ldquo;the argument is wrong&rdquo; has not read it; a student who says &ldquo;the argument is right but assumed the wrong unsafe state&rdquo; has answered the right question.", "appendix": false, "route": "core", "showIf": null, "sourceRange": "54–70", "answer": "The chapter’s informal safety argument (p.67-68) for the insulin dose computation. Assume the unsafe exit condition (dose > maxDose) and show, for each program path, that the assignments made contradict the assumption. Weaker than a correctness proof, but sufficient for safety. Safety arguments show the system cannot reach an unsafe state. They are weaker than correctness arguments which must show the system code conforms to its specification. They are generally based on proof by contradiction: (1) assume an unsafe state can be reached; (2) show this is contradicted by the program code. A graphical model of the safety argument may be developed. Apply this only after checking the operating conditions and dependencies in the case; a source description is not evidence that the proposed system has passed a test.", "noAnswer": false}, {"k": "APPLY", "title": "Apply it · defend one bounded decision", "phase": "APPLY", "route": "core", "appendix": false, "blocks": [{"t": "wide", "c": "sand", "lab": "TEACHING CASE", "txt": "A 7-year-old patient was found unresponsive at 06:30. The pump had delivered a daily cumulative dose exceeding the maximum &mdash; and the audible alarm required by SR5 had not sounded."}, {"t": "cards", "cols": 3, "items": [{"c": "teal", "lab": "CLAIM + EVIDENCE", "txt": "State a proposed action. Name the observed fact or source concept that supports it. Do not invent a completed test.", "field": {"id": "path_claim", "rows": 3, "ph": "Proposed action and supporting evidence…"}}, {"c": "sand", "lab": "LIMIT + CHALLENGE", "txt": "Name an assumption and an observation that would reverse the decision.", "field": {"id": "path_limit", "rows": 3, "ph": "The claim holds only if… It changes when…"}}, {"c": "green", "lab": "OWNER + NEXT STEP", "txt": "Name who checks the evidence and what must happen next.", "field": {"id": "path_owner", "rows": 3, "ph": "The reviewer and the next verification step…"}}]}, {"t": "raw", "html": "<div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"R07\">Full six-field Decision Card</button><button class=\"lp-btn\" data-jump=\"R15\">AI verification gate</button></div><p style=\"font:16px/1.6 system-ui\">If AI helped, name its contribution, check the claims yourself and retain human responsibility. This is practice; the separate assignment records your response to new evidence.</p>"}], "task": "Work for four minutes, explain to a partner, then revise one sentence. The instructor samples reasoning, not the number of filled boxes.", "answer": "One defensible request is the fault tree for the insulin overdose hazard, signed by the project safety engineer, with the branch that tonight&rsquo;s incident reached marked. It distinguishes a real gap in the safety case from a single operator-reported incident. Pending that evidence, state a bounded hold or revert decision, its owner and the condition for resuming automatic operation. This is one defensible approach, not the only acceptable decision. Separate facts from requested evidence and name the claim’s limit.", "timebox": "6 min"}, {"k": "END", "phase": "CHECK", "task": "", "notes": "Finish with self-check, required source review and the after-class assignment.", "appendix": false, "route": "core"}, {"k": "READING", "title": "Required self-study · pages, purpose and deadline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>Required self-study · before the assignment and next chapter discussion.</b> Read the two selections below, attempt the five-question check, and use one assigned source slide to support the assignment artifact. Blackboard provides the calendar deadline.</p><p><b>Time budget:</b> initially 15–25 minutes including the check; record actual time. These replace unfocused source browsing. The original source ledger remains available for clarification and unfinished classroom topics.</p></div><div class=\"lp-reading-row\"><h3>Fault-tree reasoning and reduction</h3><p>Original source slides 25–30</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"25\">Slide 25</button><button class=\"lp-btn\" data-source-slide=\"26\">Slide 26</button><button class=\"lp-btn\" data-source-slide=\"27\">Slide 27</button><button class=\"lp-btn\" data-source-slide=\"28\">Slide 28</button><button class=\"lp-btn\" data-source-slide=\"29\">Slide 29</button><button class=\"lp-btn\" data-source-slide=\"30\">Slide 30</button></div></div><div class=\"lp-reading-row\"><h3>Static analysis</h3><p>Original source slides 50–53</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-source-slide=\"50\">Slide 50</button><button class=\"lp-btn\" data-source-slide=\"51\">Slide 51</button><button class=\"lp-btn\" data-source-slide=\"52\">Slide 52</button><button class=\"lp-btn\" data-source-slide=\"53\">Slide 53</button></div></div><p class=\"lp-study-note\"><b>Observable work:</b> identify the source slide and explain how its concept changes or supports your artifact. A citation or a checked box alone is insufficient. In the next class, be ready to explain a related example in your own words.</p><p class=\"lp-study-note\"><b>Assessment scope:</b> all five chapter objectives, the classroom route and these named selections. Full source examples support this scope; archived administrative/title slides and optional toolkit activities are not extra assessed requirements. The instructor must announce any further assigned source topic in Blackboard before assessing it.</p><div class=\"lp-actions\"><button class=\"lp-btn\" data-jump=\"PREP\">Attempt the five-objective check</button><button class=\"lp-btn\" data-jump=\"C01\">Full source map</button></div>"}], "noAnswer": true, "appendix": true}, {"k": "PREP", "title": "Check all five objectives", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<p class=\"lp-study-note\">One question per chapter objective, in the same order as the five objectives. Attempt all five before opening feedback. Retry after reviewing an error. This public practice is not a secure test; the instructor uses a changed example during class.</p><form id=\"prepQuiz\" class=\"lp-prep\"><fieldset><legend>LO 1 · An exposed moving mechanism could injure a person. Before an injury occurs, this is best described as:</legend><label><input type=\"radio\" name=\"prep-0\" value=\"0\">An accident already observed</label><label><input type=\"radio\" name=\"prep-0\" value=\"1\">A hazardous situation</label><label><input type=\"radio\" name=\"prep-0\" value=\"2\">A guaranteed software fault</label><p hidden data-prep-feedback id=\"prep-feedback-0\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 2 · Physically preventing a dangerous state is closest to:</legend><label><input type=\"radio\" name=\"prep-1\" value=\"0\">Hazard avoidance</label><label><input type=\"radio\" name=\"prep-1\" value=\"1\">Damage limitation after an accident</label><label><input type=\"radio\" name=\"prep-1\" value=\"2\">Ignoring the hazard</label><p hidden data-prep-feedback id=\"prep-feedback-1\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 3 · When may independent-branch probabilities be multiplied at an AND gate?</legend><label><input type=\"radio\" name=\"prep-2\" value=\"0\">Always, because of the symbol</label><label><input type=\"radio\" name=\"prep-2\" value=\"1\">Never under any model</label><label><input type=\"radio\" name=\"prep-2\" value=\"2\">When the probabilistic model and independence are justified</label><p hidden data-prep-feedback id=\"prep-feedback-2\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 4 · Which link is necessary in a safety trace?</legend><label><input type=\"radio\" name=\"prep-3\" value=\"0\">Hazard → testable safety requirement → suitable verification</label><label><input type=\"radio\" name=\"prep-3\" value=\"1\">Requirement → attractive interface only</label><label><input type=\"radio\" name=\"prep-3\" value=\"2\">Warning count → guaranteed safety</label><p hidden data-prep-feedback id=\"prep-feedback-3\" class=\"prep-feedback\"></p></fieldset><fieldset><legend>LO 5 · A clean static-analysis report supports:</legend><label><input type=\"radio\" name=\"prep-4\" value=\"0\">System safety under every condition</label><label><input type=\"radio\" name=\"prep-4\" value=\"1\">Only the checked properties within the tool’s scope</label><label><input type=\"radio\" name=\"prep-4\" value=\"2\">A complete safety case without other evidence</label><p hidden data-prep-feedback id=\"prep-feedback-4\" class=\"prep-feedback\"></p></fieldset><button type=\"button\" class=\"lp-btn\" id=\"checkPrep\">Check my five answers</button><div id=\"prepStatus\" role=\"status\" aria-live=\"polite\">Attempt first. Feedback is initially hidden.</div></form>"}], "noAnswer": true, "appendix": true}, {"k": "C01", "title": "Source coverage and study checklist", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p><b>70 supplied slides indexed.</b> Every original topic has a classroom location and a source review location. This map records material availability, not time actually taught or student mastery.</p><p>Five chapter objectives connect to supplied syllabus CLO 4. Original concepts remain required even when detailed examples are completed after class.</p></div><div class=\"lp-tablewrap\"><table class=\"lp-table\"><thead><tr><th>Original topic</th><th>Source slides</th><th>Classroom location</th><th>Full source</th></tr></thead><tbody><tr><td>Opening and source outline</td><td>1–2</td><td><button class=\"lp-btn\" data-jump=\"START\">Your route through this chapter</button></td><td><button class=\"lp-btn\" data-jump=\"SRC00\">Read source</button></td></tr><tr><td>Safety, criticality and accidents</td><td>3–14</td><td><button class=\"lp-btn\" data-jump=\"X01\">Safety and safety-critical systems</button> · <button class=\"lp-btn\" data-jump=\"X02\">Safety versus reliability</button> · <button class=\"lp-btn\" data-jump=\"X02A\">Safety terminology and achievement</button></td><td><button class=\"lp-btn\" data-jump=\"SRC01\">Read source</button></td></tr><tr><td>Hazard-driven requirements and risk</td><td>15–24</td><td><button class=\"lp-btn\" data-jump=\"X03\">Hazard-driven analysis</button> · <button class=\"lp-btn\" data-jump=\"X04\">Hazard assessment and risk acceptance</button></td><td><button class=\"lp-btn\" data-jump=\"SRC02\">Read source</button></td></tr><tr><td>Fault trees and risk reduction</td><td>25–32</td><td><button class=\"lp-btn\" data-jump=\"X05\">Fault trees and causal assumptions</button> · <button class=\"lp-btn\" data-jump=\"X06\">Safety requirements and risk reduction</button></td><td><button class=\"lp-btn\" data-jump=\"SRC03\">Read source</button></td></tr><tr><td>Safety processes, logs and reviews</td><td>33–43</td><td><button class=\"lp-btn\" data-jump=\"X09\">Safety engineering processes</button> · <button class=\"lp-btn\" data-jump=\"R09\">Hazard logs and safety reviews</button></td><td><button class=\"lp-btn\" data-jump=\"SRC04\">Read source</button></td></tr><tr><td>Formal methods and static analysis</td><td>44–53</td><td><button class=\"lp-btn\" data-jump=\"R18\">Formal verification and model checking</button> · <button class=\"lp-btn\" data-jump=\"D12\">Static analysis and its limits</button></td><td><button class=\"lp-btn\" data-jump=\"SRC05\">Read source</button></td></tr><tr><td>Safety cases and structured arguments</td><td>54–70</td><td><button class=\"lp-btn\" data-jump=\"B01\">The structure of a safety case</button> · <button class=\"lp-btn\" data-jump=\"X10\">Constructing a safety argument</button></td><td><button class=\"lp-btn\" data-jump=\"SRC06\">Read source</button></td></tr></tbody></table></div>"}], "noAnswer": true, "appendix": true}, {"k": "SRC00", "title": "Opening and source outline", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 1–2. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch12-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-1\"><summary>Slide 1 · Chapter 12 – Safety Engineering</summary><div class=\"lp-source-text\"></div></details><details class=\"lp-source-section\" id=\"source-slide-2\"><summary>Slide 2 · Topics covered</summary><div class=\"lp-source-text\">Topics covered\nSafety-critical systems\nSafety requirements\nSafety engineering processes\nSafety cases</div></details>"}], "noAnswer": true, "sourceRange": "1–2", "appendix": true}, {"k": "SRC01", "title": "Safety, criticality and accidents", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 3–14. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch12-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-3\"><summary>Slide 3 · Safety</summary><div class=\"lp-source-text\">Safety\nSafety is a property of a system that reflects the system’s ability to operate, normally or abnormally, without danger of causing human injury or death and without damage to the system’s environment.\nIt is important to consider software safety as most devices whose failure is critical now incorporate software-based control systems. </div></details><details class=\"lp-source-section\" id=\"source-slide-4\"><summary>Slide 4 · Software in safety-critical systems</summary><div class=\"lp-source-text\">Software in safety-critical systems\nThe system may be software-controlled so that the decisions made by the software and subsequent actions are safety-critical. Therefore, the software behaviour is directly related to the overall safety of the system. \nSoftware is extensively used for checking and monitoring other safety-critical components in a system. For example, all aircraft engine components are monitored by software looking for early indications of component failure. This software is safety-critical because, if it fails, other components may fail and cause an accident. </div></details><details class=\"lp-source-section\" id=\"source-slide-5\"><summary>Slide 5 · Safety and reliability</summary><div class=\"lp-source-text\">Safety and reliability\nSafety and reliability are related but distinct\nIn general, reliability and availability are necessary but not sufficient conditions for system safety \nReliability is concerned with conformance to a given specification and delivery of service\nSafety is concerned with ensuring system cannot cause damage irrespective of whether or not it conforms to its specification.\nSystem reliability is essential for safety but is not enough\nReliable systems can be unsafe</div></details><details class=\"lp-source-section\" id=\"source-slide-6\"><summary>Slide 6 · Unsafe reliable systems</summary><div class=\"lp-source-text\">Unsafe reliable systems\nThere may be dormant faults in a system that are undetected for many years and only rarely arise.\nSpecification errors\nIf the system specification is incorrect then the system can behave as specified but still cause an accident.\nHardware failures generating spurious inputs\nHard to anticipate in the specification.\nContext-sensitive commands i.e. issuing the right command at the wrong time\nOften the result of operator error.</div></details><details class=\"lp-source-section\" id=\"source-slide-7\"><summary>Slide 7 · Safety-critical systems</summary><div class=\"lp-source-text\">Safety-critical systems</div></details><details class=\"lp-source-section\" id=\"source-slide-8\"><summary>Slide 8 · Safety critical systems</summary><div class=\"lp-source-text\">Safety critical systems\nSystems where it is essential that system operation is always safe i.e. the system should never cause damage to people or the system’s environment\nExamples\nControl and monitoring systems in aircraft\nProcess control systems in chemical manufacture\nAutomobile control systems such as braking and engine management systems</div></details><details class=\"lp-source-section\" id=\"source-slide-9\"><summary>Slide 9 · Safety criticality</summary><div class=\"lp-source-text\">Safety criticality\nPrimary safety-critical systems\nEmbedded software systems whose failure can cause the associated hardware to fail and directly threaten people. Example is the insulin pump control system.\nSecondary safety-critical systems\nSystems whose failure results in faults in other (socio-technical) systems, which can then have safety consequences. \nFor example, the Mentcare system is safety-critical as failure may lead to inappropriate treatment being prescribed.\nInfrastructure control systems are also secondary safety-critical systems.</div></details><details class=\"lp-source-section\" id=\"source-slide-10\"><summary>Slide 10 · Hazards</summary><div class=\"lp-source-text\">Hazards\nSituations or events that can lead to an accident\nStuck valve in reactor control system\nIncorrect computation by software in navigation system\nFailure to detect possible allergy in medication prescribing system\nHazards do not inevitably result in accidents – accident prevention actions can be taken.</div></details><details class=\"lp-source-section\" id=\"source-slide-11\"><summary>Slide 11 · Safety achievement</summary><div class=\"lp-source-text\">Safety achievement\nHazard avoidance\nThe system is designed so that some classes of hazard simply cannot arise.     \nHazard detection and removal\nThe system is designed so that hazards are detected and removed before they result in an accident.\nDamage limitation\nThe system includes protection features that minimise the damage that may result from an accident.</div></details><details class=\"lp-source-section\" id=\"source-slide-12\"><summary>Slide 12 · Safety terminology </summary><div class=\"lp-source-text\">Safety terminology </div><div class=\"lp-tablewrap\"><table><tr><td>Term</td><td>Definition</td></tr><tr><td>Accident (or mishap)</td><td>An unplanned event or sequence of events which results in human death or injury, damage to property, or to the environment. An overdose of insulin is an example of an accident.</td></tr><tr><td>Hazard</td><td>A condition with the potential for causing or contributing to an accident. A failure of the sensor that measures blood glucose is an example of a hazard.</td></tr><tr><td>Damage</td><td>A measure of the loss resulting from a mishap. Damage can range from many people being killed as a result of an accident to minor injury or property damage. Damage resulting from an overdose of insulin could be serious injury or the death of the user of the insulin pump.</td></tr><tr><td>Hazard severity</td><td>An assessment of the worst possible damage that could result from a particular hazard. Hazard severity can range from catastrophic, where many people are killed, to minor, where only minor damage results. When an individual death is a possibility, a reasonable assessment of hazard severity is ‘very high’.</td></tr><tr><td>Hazard probability</td><td>The probability of the events occurring which create a hazard. Probability values tend to be arbitrary but range from ‘probable’ (say 1/100 chance of a hazard occurring) to ‘implausible’ (no conceivable situations are likely in which the hazard could occur). The probability of a sensor failure in the insulin pump that results in an overdose is probably low.</td></tr><tr><td>Risk</td><td>This is a measure of the probability that the system will cause an accident. The risk is assessed by considering the hazard probability, the hazard severity, and the probability that the hazard will lead to an accident.  The risk of an insulin overdose is probably medium to low.</td></tr></table></div></details><details class=\"lp-source-section\" id=\"source-slide-13\"><summary>Slide 13 · Normal accidents</summary><div class=\"lp-source-text\">Normal accidents\nAccidents in complex systems rarely have a single cause as these systems are designed to be resilient to a single point of failure\nDesigning systems so that a single point of failure does not cause an accident is a fundamental principle of safe systems design.\nAlmost all accidents are a result of combinations of malfunctions rather than single failures.\nIt is probably the case that anticipating all problem combinations, especially, in software controlled systems is impossible so achieving complete safety is impossible. Accidents are inevitable.</div></details><details class=\"lp-source-section\" id=\"source-slide-14\"><summary>Slide 14 · Software safety benefits</summary><div class=\"lp-source-text\">Software safety benefits\nAlthough software failures can be safety-critical, the use of software control systems contributes to increased system safety\nSoftware monitoring and control allows a wider range of conditions to be monitored and controlled than is possible using electro-mechanical safety systems.\nSoftware control allows safety strategies to be adopted that reduce the amount of time people spend in hazardous environments.\nSoftware can detect and correct safety-critical operator errors.</div></details>"}], "noAnswer": true, "sourceRange": "3–14", "appendix": true}, {"k": "SRC02", "title": "Hazard-driven requirements and risk", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 15–24. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch12-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-15\"><summary>Slide 15 · Safety requirements</summary><div class=\"lp-source-text\">Safety requirements</div></details><details class=\"lp-source-section\" id=\"source-slide-16\"><summary>Slide 16 · Safety specification</summary><div class=\"lp-source-text\">Safety specification\nThe goal of safety requirements engineering is to identify protection requirements that ensure that system failures do not cause injury or death or environmental damage.\nSafety requirements may be ‘shall not’ requirements i.e. they define situations and events that should never occur.\nFunctional safety requirements define:\nChecking and recovery features that should be included in a system\nFeatures that provide protection against system failures and external attacks</div></details><details class=\"lp-source-section\" id=\"source-slide-17\"><summary>Slide 17 · Hazard-driven analysis</summary><div class=\"lp-source-text\">Hazard-driven analysis\nHazard identification\nHazard assessment\nHazard analysis\nSafety requirements specification\n</div></details><details class=\"lp-source-section\" id=\"source-slide-18\"><summary>Slide 18 · Hazard identification</summary><div class=\"lp-source-text\">Hazard identification\nIdentify the hazards that may threaten the system.\nHazard identification may be based on different types of hazard:\nPhysical hazards\nElectrical hazards\nBiological hazards\nService failure hazards\nEtc.</div></details><details class=\"lp-source-section\" id=\"source-slide-19\"><summary>Slide 19 · Insulin pump risks</summary><div class=\"lp-source-text\">Insulin pump risks\nInsulin overdose (service failure).\nInsulin underdose (service failure).\nPower failure due to exhausted battery (electrical).\nElectrical interference with other medical equipment (electrical).\nPoor sensor and actuator contact (physical).\nParts of machine break off in body (physical).\nInfection caused by introduction of machine (biological).\nAllergic reaction to materials or insulin (biological).</div></details><details class=\"lp-source-section\" id=\"source-slide-20\"><summary>Slide 20 · Hazard assessment</summary><div class=\"lp-source-text\">Hazard assessment\nThe process is concerned with understanding the likelihood that a risk will arise and the potential consequences if an accident or incident should occur.\nRisks may be categorised as:\nIntolerable. Must never arise or result in an accident\nAs low as reasonably practical(ALARP). Must minimise the possibility of risk given cost and schedule constraints\nAcceptable. The consequences of the risk are acceptable and no extra costs should be incurred to reduce hazard probability</div></details><details class=\"lp-source-section\" id=\"source-slide-21\"><summary>Slide 21 · The risk triangle </summary><div class=\"lp-source-text\">The risk triangle </div></details><details class=\"lp-source-section\" id=\"source-slide-22\"><summary>Slide 22 · Social acceptability of risk</summary><div class=\"lp-source-text\">Social acceptability of risk\nThe acceptability of a risk is determined by human, social and political considerations.\nIn most societies, the boundaries between the regions are pushed upwards with time i.e. society is less willing to accept risk\nFor example, the costs of cleaning up pollution may be less than the costs of preventing it but this may not be socially acceptable.\nRisk assessment is subjective\nRisks are identified as probable, unlikely, etc. This depends on who is making the assessment.\n</div></details><details class=\"lp-source-section\" id=\"source-slide-23\"><summary>Slide 23 · Hazard assessment</summary><div class=\"lp-source-text\">Hazard assessment\nEstimate the risk probability and the risk severity.\nIt is not normally possible to do this precisely so relative values are used such as ‘unlikely’, ‘rare’, ‘very high’, etc.\nThe aim must be to exclude risks that are likely to arise or that have high severity.</div></details><details class=\"lp-source-section\" id=\"source-slide-24\"><summary>Slide 24 · Risk classification for the insulin pump </summary><div class=\"lp-source-text\">Risk classification for the insulin pump </div><div class=\"lp-tablewrap\"><table><tr><td>Identified hazard</td><td>Hazard probability</td><td>Accident severity</td><td>Estimated risk</td><td>Acceptability</td></tr><tr><td>1.Insulin overdose computation</td><td>Medium</td><td>High</td><td>High</td><td>Intolerable</td></tr><tr><td>2. Insulin underdose computation</td><td>Medium</td><td>Low</td><td>Low</td><td>Acceptable</td></tr><tr><td>3. Failure of hardware monitoring system</td><td>Medium</td><td>Medium</td><td>Low</td><td>ALARP</td></tr><tr><td>4. Power failure</td><td>High</td><td>Low</td><td>Low</td><td>Acceptable</td></tr><tr><td>5. Machine incorrectly fitted</td><td>High</td><td>High</td><td>High</td><td>Intolerable</td></tr><tr><td>6. Machine breaks in patient</td><td>Low</td><td>High</td><td>Medium</td><td>ALARP</td></tr><tr><td>7. Machine causes infection</td><td>Medium</td><td>Medium</td><td>Medium</td><td>ALARP</td></tr><tr><td>8. Electrical interference</td><td>Low</td><td>High</td><td>Medium</td><td>ALARP</td></tr><tr><td>9. Allergic reaction</td><td>Low</td><td>Low</td><td>Low</td><td>Acceptable</td></tr></table></div></details>"}], "noAnswer": true, "sourceRange": "15–24", "appendix": true}, {"k": "SRC03", "title": "Fault trees and risk reduction", "phase": "LEARN", "route": "study", "blocks": [{"t": "raw", "html": "<div class=\"lp-callout\"><p>Original supplied source slides 25–32. The source retains historical examples and wording. Use the classroom explanation for contextual qualifications. Source review is part of the chapter.</p><p><a href=\"sources/Ch12-Original.pptx\" download>Download the original source pack</a> for full slide layout and vector diagrams.</p></div><details class=\"lp-source-section\" id=\"source-slide-25\"><summary>Slide 25 · Hazard analysis</summary><div class=\"lp-source-text\">Hazard analysis\nConcerned with discovering the root causes of risks in a particular system.\nTechniques have been mostly derived from safety-critical systems and can be\nInductive, bottom-up techniques. Start with a proposed system failure and assess the hazards that could arise from that failure;\nDeductive, top-down techniques. Start with a hazard and deduce what the causes of this could be.</div></details><details class=\"lp-source-section\" id=\"source-slide-26\"><summary>Slide 26 · Fault-tree analysis</summary><div class=\"lp-source-text\">Fault-tree analysis\nA deductive top-down technique.\nPut the risk or hazard at the root of the tree and identify the system states that could lead to that hazard.\nWhere appropriate, link these with ‘and’ or ‘or’ conditions.\nA goal should be to minimise the number of single causes of system failure.</div></details><details class=\"lp-source-section\" id=\"source-slide-27\"><summary>Slide 27 · An example of a software fault tree </summary><div class=\"lp-source-text\">An example of a software fault tree </div></details><details class=\"lp-source-section\" id=\"source-slide-28\"><summary>Slide 28 · Fault tree analysis</summary><div class=\"lp-source-text\">Fault tree analysis\nThree possible conditions that can lead to delivery of incorrect dose of insulin\nIncorrect measurement of blood sugar level\nFailure of delivery system\nDose delivered at wrong time\nBy analysis of the fault tree, root causes of these hazards related to software are:\nAlgorit
