services:
  - type: web
    name: iscarb-lecture-studio
    runtime: docker
    plan: free
    rootDir: iscarb-studio
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ISCARB_WORKERS
        value: "2"
