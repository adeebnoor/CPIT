services:
  - type: web
    name: iscarb-lecture-studio
    runtime: docker
    plan: free
    branch: main
    rootDir: iscarb-studio
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ISCARB_WORKERS
        value: "2"
      - key: ISCARB_RELEASE_VERSION
        value: "4.8.1"
