name: ISCARB Hero Salvage v713

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iscarb-hero-salvage-v713.yml'

permissions:
  contents: read

jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Reconstruct and inspect supplied hero chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import base64, hashlib, io
          root=Path('iscarb-studio')
          chunks=sorted(root.glob('hero_original_v713.jpg.b64.*'))
          print('CHUNKS',[(p.name,p.stat().st_size) for p in chunks])
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          candidates={}
          # Strategy A: one continuous base64 stream, stripping all whitespace.
          s=''.join(''.join(p.read_text().split()) for p in chunks)
          try:
              candidates['continuous']=base64.b64decode(s + '='*(-len(s)%4), validate=False)
          except Exception as e:
              print('continuous decode fail',repr(e))
          # Strategy B: each chunk was independently encoded.
          parts=[]
          for p in chunks:
              t=''.join(p.read_text().split())
              try:
                  parts.append(base64.b64decode(t + '='*(-len(t)%4), validate=False))
              except Exception as e:
                  print('part decode fail',p.name,repr(e))
          if parts:
              candidates['per_chunk']=b''.join(parts)
          for name,b in candidates.items():
              print(name,'BYTES',len(b),'SHA',hashlib.sha256(b).hexdigest(),'SOI',b[:2],'EOI',b[-2:])
              Path(name+'.raw.jpg').write_bytes(b)
              try:
                  im=Image.open(io.BytesIO(b)); im.load(); print(name,'OPEN',im.format,im.size,im.mode)
                  rgb=im.convert('RGB')
                  rgb.save(name+'.recovered.jpg','JPEG',quality=96,subsampling=0,optimize=True,progressive=True)
                  print(name,'RECOVERED',Path(name+'.recovered.jpg').stat().st_size,hashlib.sha256(Path(name+'.recovered.jpg').read_bytes()).hexdigest())
              except Exception as e:
                  print(name,'OPEN_FAIL',repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hero-v713-salvage
          path: |
            *.raw.jpg
            *.recovered.jpg
          if-no-files-found: warn
