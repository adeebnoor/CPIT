name: Apply CIMT v4.4 Complete RC

on:
  push:
    branches: ["fix/cimt-source-first-20260829"]
    paths:
      - '.github/workflows/apply-v44-chunks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cimt-source-first-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify exact validated package
        run: |
          cat .github/rc/cimt_rc_final.part{00..10} > /tmp/cimt_rc_final.b64
          base64 -d /tmp/cimt_rc_final.b64 > /tmp/v44_patch.tar.gz
          echo '8f95ab10e3b6259515e610e21af1d32931c783b4966e726f65730447f2928df8  /tmp/v44_patch.tar.gz' | sha256sum -c -
          tar -tzf /tmp/v44_patch.tar.gz
          tar -xzf /tmp/v44_patch.tar.gz
      - name: Remove transfer and diagnostic residue before validation
        run: |
          rm -rf .github/rc
          rm -f .github/v44_patch.tar.gz
          rm -f .github/workflows/apply-v44-chunks.yml
          rm -f .github/workflows/apply-v44-chapter-completeness.yml
          rm -f .github/workflows/export-cimt-validation-snapshot.yml
          rm -f .github/workflows/cimt-multi-lecture-blueprint-probe.yml
          rm -f .github/workflows/iscarb-pull-user-job.yml
          find iscarb-studio -type d -name '__pycache__' -prune -exec rm -rf {} +
          find iscarb-studio -type f -name '*.pyc' -delete
      - name: Install runtime dependencies
        run: python -m pip install -r iscarb-studio/requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q iscarb-studio/app iscarb-studio/tests
      - name: Run full regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s iscarb-studio/tests -p 'test_*.py' -v
      - name: Verify release hygiene
        run: |
          find iscarb-studio -type d -name '__pycache__' -prune -exec rm -rf {} +
          find iscarb-studio -type f -name '*.pyc' -delete
          test ! -d .github/rc
          test ! -f .github/v44_patch.tar.gz
          test ! -f .github/workflows/apply-v44-chunks.yml
          test ! -f .github/workflows/apply-v44-chapter-completeness.yml
          test ! -f .github/workflows/export-cimt-validation-snapshot.yml
          test ! -f .github/workflows/cimt-multi-lecture-blueprint-probe.yml
          test ! -f .github/workflows/iscarb-pull-user-job.yml
          if find iscarb-studio -type f \( -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then exit 1; fi
          git status --short
      - name: Commit validated release candidate
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Enforce complete chapter coverage and CIMT active-learning flow'
            git push origin HEAD:fix/cimt-source-first-20260829
          fi
