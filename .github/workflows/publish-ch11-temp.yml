name: Publish Chapter 11 temporary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ch11-temp.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download reviewed release bundle
        env:
          SHARE_URL: https://firestorage.ai/en/f/9BW_aE3fDATR
          EXPECTED_SHA256: 3771bd591f23c257afd40bd4a99ad2ff2a778a682e7bd8e6d0949364e97f4f7d
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null
          cat > /tmp/download_bundle.py <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          url=os.environ['SHARE_URL']
          out='/tmp/ch11_publish_bundle.zip'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              page.goto(url, wait_until='networkidle', timeout=120000)
              button=page.get_by_text('Download', exact=True)
              if button.count()==0:
                  button=page.get_by_role('button', name='Download')
              with page.expect_download(timeout=120000) as info:
                  button.first.click()
              info.value.save_as(out)
              browser.close()
          print(out)
          PY
          python /tmp/download_bundle.py
          echo "$EXPECTED_SHA256  /tmp/ch11_publish_bundle.zip" | sha256sum -c -
      - name: Install reviewed files atomically
        run: |
          rm -rf /tmp/ch11-release
          mkdir -p /tmp/ch11-release
          unzip -q /tmp/ch11_publish_bundle.zip -d /tmp/ch11-release
          cp -a /tmp/ch11-release/. .
          python -m json.tool curriculum/publication.json >/dev/null
          python -m py_compile tools/audit_classroom.py tools/build_public_site.py
          python tools/audit_classroom.py
      - name: Commit release and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-ch11-temp.yml
          git add iscarb.html fbr-submission.html iscarb-hub.js curriculum/publication.json tools/audit_classroom.py tools/build_public_site.py lectures/iscarb/Ch11-Reliability-Engineering.html lectures/iscarb/Ch11-FBR-Student-Assignment.html lectures/iscarb/reveal/r11-a2-v1.json
          git commit -m "Publish Chapter 11 and progressive Assignment 2"
          git push origin HEAD:main
