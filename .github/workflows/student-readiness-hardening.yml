# one-off trigger
name: One-off student readiness hardening
on:
  push:
    paths:
      - '.github/workflows/student-readiness-hardening.yml'
permissions:
  contents: write
jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply student readiness refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('fbr-submission.html')
          s=p.read_text()
          quick='''<section class="card"><h2>Quick start · 4 steps</h2><ol><li>Open the weekly task only from the official After-Class link.</li><li>Read the worked example and acknowledge the learning contract.</li><li>Complete FIT → BOUND → ACT → EVIDENCE, then Commit Part A.</li><li>Read STRESS, complete the boundary check + REFIT, export PDF, and submit it through the course LMS.</li></ol><p><b>Expected time:</b> 25–40 minutes.</p><p><b>Official submission:</b> the course LMS only. Saving or exporting in this browser is <b>not</b> a submission.</p></section>\n'''
          marker='<section class="card worked">'
          if 'Quick start · 4 steps' not in s:
              if s.count(marker)!=1: raise SystemExit('worked-card marker mismatch')
              s=s.replace(marker,quick+marker,1)

          old='<li><b>Recommended LMS format:</b> PDF using the assignment\'s Print / PDF option.</li>'
          new=old+'<li><b>Recommended PDF filename:</b> <code id="pdfFilenameRule">CPIT455_W10_STUDENTID_FBR.pdf</code>.</li><li><b>Deadline:</b> use the due date posted in the course LMS. This public page does not override the LMS deadline.</li><li><b>Browser / device recovery:</b> work on one device when possible. Browser drafts do not sync across devices; recovery is not guaranteed if browser data is cleared. Download the editable .md evidence copy before clearing or changing devices.</li>'
          if 'id="pdfFilenameRule"' not in s:
              if s.count(old)!=1: raise SystemExit('LMS-format marker mismatch')
              s=s.replace(old,new,1)

          faq='''<section class="card"><h2>FAQ · Before you submit</h2><p><b>Where do I submit?</b> Only in the course LMS. A browser save, local draft, copied text, or downloaded file is not a submission by itself.</p><p><b>Can I change Part A after Commit?</b> No. Commit freezes FIT, BOUND, ACT, and EVIDENCE before STRESS is shown.</p><p><b>Can I use AI?</b> Only within the published AI policy, and you must declare your use in the LMS submission comment.</p><p><b>What if the browser or device fails?</b> Do not switch devices mid-attempt unless necessary. Local drafts are device/browser-specific. If recovery fails before export, contact the instructor rather than recreating a post-STRESS Part A.</p></section>\n'''
          gmarker='<section class="card governance">'
          if 'FAQ · Before you submit' not in s:
              if s.count(gmarker)!=1: raise SystemExit('governance marker mismatch')
              s=s.replace(gmarker,faq+gmarker,1)

          if 'pdfFilenameRule_dynamic' not in s:
              inj='''<script id="pdfFilenameRule_dynamic">(()=>{const c=new URLSearchParams(location.search).get('chapter')==='11'?'11':'10';const e=document.getElementById('pdfFilenameRule');if(e)e.textContent='CPIT455_W'+c+'_STUDENTID_FBR.pdf';})();</script>\n'''
              if '</body>' not in s: raise SystemExit('body close missing')
              s=s.replace('</body>',inj+'</body>',1)

          s=s.replace('?v=20260912-studentux1','?v=20260912-ready1')
          p.write_text(s)

          configs=[
              ('lectures/iscarb/Ch10-FBR-Student-Assignment.html','10'),
              ('lectures/iscarb/Ch11-FBR-Student-Assignment.html','11'),
          ]
          for fn,w in configs:
              p=Path(fn); s=p.read_text()
              rec='<div class="hint"><b>Recommended for LMS:</b> use Print / PDF. The .md download is your editable evidence copy and backup.</div>'
              if '<b>Official submission:</b> LMS only.' not in s:
                  if s.count(rec)!=1: raise SystemExit(f'{fn}: export hint marker mismatch')
                  rep='<div class="hint"><b>Official submission:</b> LMS only. Saving, copying, or exporting in this browser does not count as submission.</div><div class="hint"><b>Recommended for LMS:</b> use Print / PDF. Suggested filename: <code>CPIT455_W'+w+'_STUDENTID_FBR.pdf</code>. The .md download is your editable evidence copy and backup.</div>'
                  s=s.replace(rec,rep,1)

              old="function fname(){return'CPIT455_W"+w+"_'+($('sid').value||'STUDENTID').replace(/[^a-zA-Z0-9_-]/g,'_')+'_FBR.md'}function download(){"
              new="function fname(){return'CPIT455_W"+w+"_'+($('sid').value||'STUDENTID').replace(/[^a-zA-Z0-9_-]/g,'_')+'_FBR.md'}function pdfname(){return'CPIT455_W"+w+"_'+($('sid').value||'STUDENTID').replace(/[^a-zA-Z0-9_-]/g,'_')+'_FBR.pdf'}function download(){"
              if 'function pdfname()' not in s:
                  if s.count(old)!=1: raise SystemExit(f'{fn}: fname marker mismatch')
                  s=s.replace(old,new,1)

              oldpdf="$('pdf').onclick=()=>{if(!ensureB())return;save(false);printSheet();window.print()}"
              newpdf="$('pdf').onclick=()=>{if(!ensureB())return;save(false);printSheet();let oldTitle=document.title;document.title=pdfname().replace(/\\.pdf$/,'');if($('done'))$('done').textContent='Print view ready. Save as PDF, then submit through the LMS.';window.print();setTimeout(()=>document.title=oldTitle,800)}"
              if oldpdf in s:
                  s=s.replace(oldpdf,newpdf,1)
              elif "document.title=pdfname()" not in s:
                  raise SystemExit(f'{fn}: pdf handler marker mismatch')

              s=s.replace("'Ready to export. Recommended LMS format: PDF.'","'Ready to export. Use Print / PDF, then submit that PDF through the LMS. Browser save is not submission.'")
              p.write_text(s)

          p=Path('iscarb.html'); s=p.read_text()
          s=s.replace('fbr-submission.html?chapter=10"','fbr-submission.html?chapter=10&v=20260912-ready1"')
          s=s.replace('fbr-submission.html?chapter=11"','fbr-submission.html?chapter=11&v=20260912-ready1"')
          p.write_text(s)
          PY
      - name: Static and JavaScript checks
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          files=['lectures/iscarb/Ch10-FBR-Student-Assignment.html','lectures/iscarb/Ch11-FBR-Student-Assignment.html']
          for f in files:
              s=pathlib.Path(f).read_text()
              assert 'BOUNDARY CHECK → REFIT' in s
              assert 'Official submission:</b> LMS only' in s
              assert 'function pdfname()' in s
              assert "if(!b.boundaryState)" in s
              assert "if(!b.refit)" in s
              assert "if(!S.exportedAt)" in s
              assert 'No reset is available after commitment.' in s
              assert 'await reveal()' in s
              m=re.search(r'<script>(.*)</script>',s,re.S)
              if not m: raise SystemExit('no script '+f)
              out='/tmp/'+pathlib.Path(f).stem+'.js'
              pathlib.Path(out).write_text(m.group(1))
          entry=pathlib.Path('fbr-submission.html').read_text()
          for x in ['Quick start · 4 steps','Expected time:</b> 25–40 minutes','Official submission:</b> the course LMS only','pdfFilenameRule','FAQ · Before you submit','AI use: None / Language-editing / Brainstorming / Other: ____','60–120 second micro-viva']:
              assert x in entry, x
          PY
          node --check /tmp/Ch10-FBR-Student-Assignment.js
          node --check /tmp/Ch11-FBR-Student-Assignment.js
      - name: Browser end-to-end checks
        shell: bash
        run: |
          npm install --no-save puppeteer-core@24.16.0 >/tmp/npm.log 2>&1
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          echo $! >/tmp/http.pid
          sleep 1
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const base='http://127.0.0.1:8765/';
          async function runChapter(browser,ch){
            const p=await browser.newPage();
            await p.goto(base+'iscarb.html',{waitUntil:'domcontentloaded'});
            const link=`a.student[href*="chapter=${ch}"]`;
            await p.waitForSelector(link);
            await Promise.all([p.waitForNavigation({waitUntil:'domcontentloaded'}),p.click(link)]);
            if(!p.url().includes(`chapter=${ch}`)) throw new Error('wrong entry chapter '+ch);
            const body=await p.evaluate(()=>document.body.innerText);
            for(const t of ['Quick start · 4 steps','25–40 minutes','course LMS only','FAQ · Before you submit']) if(!body.includes(t)) throw new Error('missing '+t);
            const idInput='input[type="text"]';
            await p.waitForSelector(idInput);
            await p.type(idInput,'TEST123');
            const cb='input[type="checkbox"]';
            await p.click(cb);
            const btn='button';
            await p.waitForFunction(()=>{const b=document.querySelector('button');return b&&!b.disabled});
            await Promise.all([p.waitForNavigation({waitUntil:'domcontentloaded'}),p.click(btn)]);
            if(!p.url().includes(`Ch${ch}-FBR-Student-Assignment.html`)) throw new Error('assignment not opened '+ch+' '+p.url());
            await p.waitForSelector('#fit');
            if(await p.$('input[name="boundaryState"]')) throw new Error('STRESS controls visible before commit '+ch);
            await p.type('#student','Test Student');
            if(await p.$('#section')) await p.type('#section','A');
            const ans='This is a substantive professional reasoning statement with observable engineering conditions.';
            for(const id of ['fit','bound','act','evidence']) await p.type('#'+id,ans);
            await p.click('#lock');
            await p.waitForSelector('input[name="boundaryState"]',{timeout:10000});
            const locked=await p.evaluate(()=>['fit','bound','act','evidence'].every(id=>document.getElementById(id).readOnly));
            if(!locked) throw new Error('Part A not locked '+ch);
            const before=await p.evaluate(()=>({download:document.getElementById('download').disabled,pdf:document.getElementById('pdf').disabled,erase:document.getElementById('erase').disabled}));
            if(!before.download||!before.pdf||!before.erase) throw new Error('export enabled too early '+ch+JSON.stringify(before));
            await p.click('input[name="boundaryState"][value="CROSSED"]');
            await p.click('input[name="refit"][value="REVISE"]');
            await p.type('#refitwhy','The new evidence materially changes the applicability boundary, so the professional action must be revised and defended.');
            await p.type('#revised','Revise the professional artifact with a new measurable control, explicit owner, monitoring evidence, and a documented review trigger.');
            await p.waitForFunction(()=>!document.getElementById('download').disabled && !document.getElementById('pdf').disabled);
            await p.evaluate(()=>download());
            await p.waitForFunction(()=>!document.getElementById('erase').disabled);
            await p.evaluate(()=>{window.print=()=>{window.__printTitle=document.title;window.__printed=true;}});
            await p.click('#pdf');
            const pr=await p.evaluate(()=>({printed:window.__printed,title:window.__printTitle,printText:document.getElementById('print').innerText}));
            if(!pr.printed) throw new Error('print not invoked '+ch);
            if(!pr.title.includes(`CPIT455_W${ch}_TEST123_FBR`)) throw new Error('wrong print title '+ch+' '+pr.title);
            if(!pr.printText.includes('Boundary status')) throw new Error('boundary status missing from print '+ch);
            const out=`/tmp/ch${ch}.pdf`;
            await p.pdf({path:out,printBackground:true});
            if(fs.statSync(out).size<1000) throw new Error('PDF too small '+ch);
            console.log('Chapter '+ch+' E2E PASS');
            await p.close();
          }
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            await runChapter(browser,'10');
            await runChapter(browser,'11');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          kill "$(cat /tmp/http.pid)" || true
      - name: Commit readiness changes
        shell: bash
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add fbr-submission.html iscarb.html lectures/iscarb/Ch10-FBR-Student-Assignment.html lectures/iscarb/Ch11-FBR-Student-Assignment.html
          git diff --cached --quiet && exit 0
          git commit -m 'Harden student FBR submission readiness for Chapters 10 and 11'
          git push
