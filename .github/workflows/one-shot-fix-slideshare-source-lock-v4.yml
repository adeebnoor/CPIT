name: One-shot Fix SlideShare Source Lock v4

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-fix-slideshare-source-lock-v4.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reuse verified v3 patch logic with corrected title-only threshold
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          workflow=Path('.github/workflows/one-shot-fix-slideshare-source-lock-v3.yml')
          doc=yaml.safe_load(workflow.read_text(encoding='utf-8'))
          wanted={
              'Patch source lock with deterministic string slicing',
              'Enforce P1 completeness after normal semantic repair',
              'Add permanent SlideShare source-lock tests',
          }
          for step in doc['jobs']['repair']['steps']:
              if step.get('name') not in wanted:
                  continue
              script=step['run'].replace('len(blob.split()) < 24','len(blob.split()) < 12')
              print('RUN',step['name'])
              subprocess.run(['bash','-lc',script],check=True)
          PY

      - name: Run full regression suite
        working-directory: iscarb-studio
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app tests
          python -m unittest discover -s tests -v

      - name: Hygiene
        run: |
          set -euo pipefail
          find iscarb-studio -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          ! git status --short | grep -E '\.pyc$|__pycache__' || exit 1

      - name: Commit only after green suite and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          rm -f .github/workflows/one-shot-slideshare-ch2-qa.yml \
                .github/workflows/one-shot-fetch-ch2-job.yml \
                .github/workflows/one-shot-fix-slideshare-source-lock.yml \
                .github/workflows/one-shot-fix-slideshare-source-lock-v3.yml \
                .github/workflows/one-shot-fix-slideshare-source-lock-v4.yml
          git add -A
          git commit -m 'Fix SlideShare source lock and enforce P1 completeness'
          git push origin HEAD:main
