name: Apply quota repair completeness patch

on:
  push:
    branches: ["fix/quota-repair-completeness-20260829"]
    paths:
      - '.github/workflows/apply-quota-repair-completeness.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quota-repair-completeness-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch quota degradation path and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('iscarb-studio/app/main.py')
          text=p.read_text(encoding='utf-8')
          marker='\n\ndef _compile(job_id: str, bundle: SourceBundle, model: str, repair_rounds: int) -> None:\n'
          helper='''\n\ndef _major_coverage_gaps(blueprint, profile) -> tuple[list[str], list[str]]:\n    """Return major P1 checkpoint ids that are missing or first taught after Unit 15."""\n    ledger = {entry.coverage_id: entry for entry in blueprint.coverage_ledger}\n    major = [row for row in profile.coverage_items if row.importance == "major"]\n    missing = [row.id for row in major if row.id not in ledger]\n    late = [\n        row.id for row in major\n        if row.id in ledger and ledger[row.id].first_taught_unit > 15\n    ]\n    return missing, late\n\n\ndef _ensure_quota_safe_completeness(blueprint, profile, bundle, source_text: str, reason: str):\n    """Guarantee atomic P1 completeness when semantic repair/audit loses quota.\n\n    A complete semantic Blueprint is preserved.  An incomplete semantic Blueprint\n    is replaced by the tested deterministic source-bounded draft.  In both cases\n    the result remains non-releasable because semantic assurance is unavailable.\n    """\n    missing, late = _major_coverage_gaps(blueprint, profile)\n    replaced = bool(missing or late)\n    if replaced:\n        blueprint = build_deterministic_blueprint(profile)\n        blueprint = apply_90_minute_timebox(blueprint, profile, bundle)\n    checks = deterministic_gate(blueprint, profile, source_text)\n    checks.update(session_scope_gate(blueprint, profile, bundle))\n    audit = _deterministic_fallback_audit(checks, reason)\n    return blueprint, checks, audit, replaced, missing, late\n'''
          if '_ensure_quota_safe_completeness' not in text:
              assert marker in text
              text=text.replace(marker,helper+marker,1)

          old='''            except Exception as exc:\n                if _is_quota_error(exc):\n                    job.blueprint = blueprint\n                    job.audit = audit\n                    _update(job, "blocked", 100, "BLOCKED — blueprint preserved. Presenter Preview and exports remain available; repair waits for Gemini quota.")\n                    return\n                raise\n'''
          new='''            except Exception as exc:\n                if _is_quota_error(exc):\n                    blueprint, checks, audit, replaced, missing, late = _ensure_quota_safe_completeness(\n                        blueprint, profile, bundle, source_text, str(exc)\n                    )\n                    job.blueprint = blueprint\n                    job.deterministic_checks = checks\n                    job.audit = audit\n                    job.error = None\n                    save_job(job)\n                    if replaced:\n                        gap_text = ", ".join(missing + late)\n                        _update(job, "blocked", 100, f"BLOCKED — Gemini quota unavailable during repair. The incomplete semantic draft was replaced by a complete source-checkpoint draft covering every major P1 checkpoint by Unit 15. Readiness is UNVERIFIED and RELEASE is forbidden until semantic audit succeeds. Recovered: {gap_text}")\n                    else:\n                        _update(job, "blocked", 100, "BLOCKED — Gemini quota unavailable during repair. The source-complete semantic draft was preserved; readiness remains UNVERIFIED and RELEASE is forbidden until semantic audit succeeds.")\n                    return\n                raise\n'''
          assert old in text, 'repair quota block changed unexpectedly'
          text=text.replace(old,new,1)

          old2='''        job.blueprint = blueprint\n        if not semantic_available:\n            _update(job, "blocked", 100, "BLOCKED — blueprint preserved and local gates completed; semantic audit is unavailable because Gemini quota is exhausted. Preview and exports remain available, but no RELEASE is issued.")\n        else:\n'''
          new2='''        job.blueprint = blueprint\n        if not semantic_available:\n            blueprint, checks, audit, replaced, missing, late = _ensure_quota_safe_completeness(\n                blueprint, profile, bundle, source_text, "Gemini quota exhausted before semantic release assurance completed."\n            )\n            job.blueprint = blueprint\n            job.deterministic_checks = checks\n            job.audit = audit\n            job.error = None\n            save_job(job)\n            if replaced:\n                _update(job, "blocked", 100, "BLOCKED — semantic assurance is unavailable because Gemini quota is exhausted. A complete source-checkpoint draft now covers every major P1 checkpoint by Unit 15; readiness is UNVERIFIED and no RELEASE is issued.")\n            else:\n                _update(job, "blocked", 100, "BLOCKED — source-complete blueprint preserved and local gates completed; semantic audit is unavailable because Gemini quota is exhausted. Preview and exports remain available, but no RELEASE is issued.")\n        else:\n'''
          assert old2 in text, 'final semantic-unavailable block changed unexpectedly'
          text=text.replace(old2,new2,1)
          p.write_text(text,encoding='utf-8')

          t=Path('iscarb-studio/tests/test_v44_chapter_completeness.py')
          tests=t.read_text(encoding='utf-8')
          tests=tests.replace('from app import prompts\n','from app import prompts\nfrom app.main import _ensure_quota_safe_completeness, _major_coverage_gaps\n',1)
          insert='''\n    def test_quota_during_repair_replaces_incomplete_semantic_draft_with_complete_blocked_draft(self):\n        profile = self._profile(2)\n        path = self.lecture_dir / 'CPIT455-class2-NooR.pdf'\n        bundle = SourceBundle(items=[SourceItem('primary','P1',path.name,path,path.name)], lecture_focus='', session_minutes=90)\n        incomplete = build_deterministic_blueprint(profile).model_copy(deep=True)\n        major_ids = [x.id for x in profile.coverage_items if x.importance == 'major']\n        incomplete.coverage_ledger = [x for x in incomplete.coverage_ledger if x.coverage_id not in set(major_ids[:4])]\n        missing, late = _major_coverage_gaps(incomplete, profile)\n        self.assertTrue(missing)\n        self.assertFalse(late)\n        repaired, checks, audit, replaced, original_missing, original_late = _ensure_quota_safe_completeness(\n            incomplete, profile, bundle, bundle.combined_local_text(), 'RESOURCE_EXHAUSTED quota exceeded'\n        )\n        self.assertTrue(replaced)\n        self.assertEqual(set(original_missing), set(missing))\n        self.assertEqual(original_late, [])\n        self.assertEqual(_major_coverage_gaps(repaired, profile), ([], []))\n        self.assertEqual(len(repaired.units), 20)\n        self.assertEqual(sum(u.planned_minutes for u in repaired.units), 90)\n        self.assertEqual(repaired.readiness_alignment, [])\n        self.assertFalse(audit.overall_pass)\n        self.assertIsInstance(checks, dict)\n\n    def test_quota_during_repair_preserves_already_complete_semantic_draft(self):\n        profile = self._profile(2)\n        path = self.lecture_dir / 'CPIT455-class2-NooR.pdf'\n        bundle = SourceBundle(items=[SourceItem('primary','P1',path.name,path,path.name)], lecture_focus='', session_minutes=90)\n        complete = build_deterministic_blueprint(profile)\n        result, checks, audit, replaced, missing, late = _ensure_quota_safe_completeness(\n            complete, profile, bundle, bundle.combined_local_text(), 'quota exhausted'\n        )\n        self.assertFalse(replaced)\n        self.assertIs(result, complete)\n        self.assertEqual((missing, late), ([], []))\n        self.assertFalse(audit.overall_pass)\n        self.assertIsInstance(checks, dict)\n'''
          anchor='\n    def test_all_archived_chapters_render_20_slide_outputs(self):\n'
          assert anchor in tests
          tests=tests.replace(anchor,insert+anchor,1)
          t.write_text(tests,encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install -r iscarb-studio/requirements.txt
      - name: Compile
        run: PYTHONDONTWRITEBYTECODE=1 python -m compileall -q iscarb-studio/app iscarb-studio/tests
      - name: Run quota/completeness regression
        working-directory: iscarb-studio
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest -v tests.test_v44_chapter_completeness
      - name: Run complete suite
        working-directory: iscarb-studio
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Commit only after all gates pass
        run: |
          find iscarb-studio -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find iscarb-studio -type f -name '*.pyc' -delete || true
          rm -f .github/workflows/apply-quota-repair-completeness.yml
          git config user.name "Prof. Adeeb Noor"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Guarantee complete P1 fallback when repair quota expires"
          git push origin HEAD:fix/quota-repair-completeness-20260829
