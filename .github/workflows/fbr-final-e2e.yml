name: One-off final FBR end-to-end test
on:
  push:
    paths:
      - '.github/workflows/fbr-final-e2e.yml'
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          which google-chrome || which chromium || which chromium-browser
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Start local static site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/fbr-http.log 2>&1 &
          echo $! >/tmp/fbr-http.pid
          sleep 2
          curl -fsS http://127.0.0.1:8000/iscarb.html >/dev/null
      - name: Run student journey and in-class tests
        run: |
          cat > fbr-e2e.cjs <<'JS'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const cp = require('child_process');
          function assert(x,msg){ if(!x) throw new Error(msg); }
          async function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
          function browserPath(){ for(const p of ['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser']) if(fs.existsSync(p)) return p; throw new Error('No Chrome/Chromium executable found'); }
          async function testChapter(browser,ch){
            const page=await browser.newPage(); await page.setViewport({width:1440,height:1000}); const base='http://127.0.0.1:8000/';
            await page.goto(base+'iscarb.html',{waitUntil:'domcontentloaded'});
            const afterHref=await page.$eval(`a.student[href*="chapter=${ch}"]`,a=>a.getAttribute('href')); assert(afterHref,`Ch${ch}: After-Class link missing`);
            await page.goto(base+afterHref,{waitUntil:'domcontentloaded'});
            assert(await page.$eval('#openBtn',b=>b.disabled),`Ch${ch}: Open button should start disabled`);
            await page.type('#sid',`E2E${ch}0001`); await page.click('#ack'); assert(!(await page.$eval('#openBtn',b=>b.disabled)),`Ch${ch}: gate did not enable`);
            await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded'}),page.click('#openBtn')]);
            assert(page.url().includes(`Ch${ch}-FBR-Student-Assignment.html`),`Ch${ch}: assignment did not open`);
            assert((await page.$eval('#sid',e=>e.value))===`E2E${ch}0001`,`Ch${ch}: ID not carried`);
            assert((await page.$eval('#partB',e=>e.innerText.trim()))==='',`Ch${ch}: Part B visible before Commit`);
            const vals={fit:'This mechanism is fit for the stated professional use because it directly governs the decision and its consequences.',bound:'This decision remains fit only while the observable operating conditions remain within the stated limits; reopen it when that condition changes.',act:'Issue a concrete professional action with an accountable owner, a defined operating condition, and an explicit review trigger.',evidence:'Use timestamped logs, measurements, test results, and an accountable owner record as inspectable evidence for this decision.'};
            for(const [id,text] of Object.entries(vals)) await page.type('#'+id,text);
            await page.click('#lock'); await page.waitForSelector('input[name=boundaryState]',{timeout:8000});
            assert(await page.$$eval('#fit,#bound,#act,#evidence',els=>els.every(e=>e.readOnly)),`Ch${ch}: Part A not locked`);
            assert(await page.$$eval('#lock,#save,#clear',els=>els.every(e=>e.disabled)),`Ch${ch}: lock controls still active`);
            assert((await page.$eval('#partB .stress',e=>e.innerText.trim())).length>30,`Ch${ch}: STRESS missing`);
            assert(await page.$$eval('#pdf,#download,#copy',els=>els.every(e=>e.disabled)),`Ch${ch}: export enabled too early`);
            await page.click('input[name=boundaryState][value="CROSSED"]'); await page.click('input[name=refit][value="REVISE"]');
            await page.type('#refitwhy','The new evidence changes the applicability condition I committed, so the original action must be revised rather than changed merely because new information appeared.');
            await page.type('#revised','Revise the professional artifact to address the changed boundary, preserve traceable evidence, and define the next review trigger and accountable owner.');
            await wait(700); assert(await page.$$eval('#pdf,#download,#copy',els=>els.every(e=>!e.disabled)),`Ch${ch}: export did not enable`);
            await page.evaluate(()=>printSheet()); const printText=await page.$eval('#print',e=>e.innerText);
            for(const token of ['FIT','BOUND','ACT','EVIDENCE','STRESS','Boundary status','REFIT','Final Artifact']) assert(printText.includes(token),`Ch${ch}: print sheet missing ${token}`);
            const pdf=`/tmp/CPIT455_W${ch}_E2E${ch}0001_FBR.pdf`; await page.emulateMediaType('print'); await page.pdf({path:pdf,format:'A4',printBackground:true,margin:{top:'10mm',right:'10mm',bottom:'10mm',left:'10mm'}});
            assert(fs.statSync(pdf).size>10000,`Ch${ch}: PDF too small`); cp.execFileSync('pdftotext',[pdf,pdf+'.txt']); const txt=fs.readFileSync(pdf+'.txt','utf8');
            for(const token of ['FIT','BOUND','ACT','EVIDENCE','STRESS','Boundary status','REFIT','Final Artifact']) assert(txt.includes(token),`Ch${ch}: PDF missing ${token}`);
            const info=cp.execFileSync('pdfinfo',[pdf],{encoding:'utf8'}),pages=(info.match(/^Pages:\s+(\d+)/m)||[])[1]; assert(Number(pages)>=1&&Number(pages)<=4,`Ch${ch}: bad PDF page count ${pages}`);
            console.log(`PASS Ch${ch} After-Class: gate -> lock -> STRESS -> export gate -> PDF (${pages} pages, ${fs.statSync(pdf).size} bytes)`); await page.close();
          }
          async function testInClass(browser,ch){
            const page=await browser.newPage(); await page.setViewport({width:1920,height:1080}); const base='http://127.0.0.1:8000/';
            await page.goto(base+'iscarb.html',{waitUntil:'domcontentloaded'}); const href=await page.$eval(`article[data-n="${ch}"] a.faculty`,a=>a.getAttribute('href')); assert(href,`Ch${ch}: In-Class link missing`);
            await page.goto(base+href,{waitUntil:'domcontentloaded'}); await page.waitForFunction(()=>location.pathname.endsWith('/Faculty-Presenter.html'),{timeout:5000}); assert(page.url().includes(`chapter=${ch}`),`Ch${ch}: presenter query missing`);
            await page.waitForFunction(()=>{const f=document.getElementById('lecture');return f&&f.contentDocument&&f.contentDocument.querySelectorAll('#stage .slide').length>0;},{timeout:8000});
            await page.waitForFunction(()=>window.__facultyFocus&&window.__facultyFocus.indexes&&window.__facultyFocus.indexes.length>1,{timeout:8000});
            const state=await page.evaluate(()=>{const f=document.getElementById('lecture'),d=f.contentDocument,w=f.contentWindow;return{slides:d.querySelectorAll('#stage .slide').length,text:d.body.innerText,title:document.title,focus:window.__facultyFocus?.indexes?.length||0,cur:w.cur,status:document.getElementById('status').innerText};});
            assert(state.slides>=10,`Ch${ch}: presenter iframe has too few slides (${state.slides})`); assert(state.focus>=2,`Ch${ch}: faculty focus not built`); assert(state.text.toLowerCase().includes(ch==='10'?'dependable':'reliability'),`Ch${ch}: expected chapter text absent in iframe`);
            console.log(`PASS Ch${ch} In-Class: hub -> Faculty-Presenter -> iframe loaded (${state.slides} raw slides, ${state.focus} focus slides, ${state.status})`); await page.close();
          }
          (async()=>{const browser=await puppeteer.launch({headless:true,executablePath:browserPath(),args:['--no-sandbox','--disable-setuid-sandbox']});try{await testChapter(browser,'10');await testChapter(browser,'11');await testInClass(browser,'10');await testInClass(browser,'11');console.log('ALL FINAL E2E TESTS PASSED');}finally{await browser.close();}})().catch(e=>{console.error('E2E FAILURE:',e.stack||e);process.exit(1)});
          JS
          node fbr-e2e.cjs
      - name: Show PDF summaries
        if: always()
        run: |
          for f in /tmp/CPIT455_W*_FBR.pdf; do [ -f "$f" ] || continue; echo "--- $f ---"; pdfinfo "$f" | grep -E 'Pages|Page size|File size' || true; done
