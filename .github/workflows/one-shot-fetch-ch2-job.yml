name: One-shot Capture Ch2 Live Job

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-fetch-ch2-job.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://iscarb-lecture-studio.onrender.com
      JOB_ID: a65a4845981e47cc913078bb9cc7413a
    steps:
      - name: Fetch job and all available outputs
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          base=os.environ['BASE_URL'].rstrip('/'); jid=os.environ['JOB_ID']; out=pathlib.Path('/tmp/ch2-before'); out.mkdir()
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'ISCARB-Ch2-capture/1.0'})
              with urllib.request.urlopen(req,timeout=180) as r: return r.read()
          job=get('/api/jobs/'+jid); (out/'job.json').write_bytes(job)
          j=json.loads(job); print('STATUS',j.get('status'),'MESSAGE',j.get('message'))
          for name,path in {
            'presenter.html':f'/api/jobs/{jid}/presenter',
            'presenter.pptx':f'/api/jobs/{jid}/export/pptx',
            'presenter.pdf':f'/api/jobs/{jid}/export/presenter-pdf',
            'reading-pack.pdf':f'/api/jobs/{jid}/export/pdf',
            'instructor-guide.docx':f'/api/jobs/{jid}/export/docx',
            'student-pack.docx':f'/api/jobs/{jid}/export/student',
            'blueprint.json':f'/api/jobs/{jid}/export/json',
          }.items():
              try:
                  data=get(path); (out/name).write_bytes(data); print(name,len(data))
              except Exception as e: print('SKIP',name,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ch2-before-fix-live-output
          path: /tmp/ch2-before/*
          if-no-files-found: error
