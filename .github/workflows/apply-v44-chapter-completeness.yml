name: Apply ISCARB v4.4 Chapter Completeness Patch

on:
  push:
    branches: ["fix/cimt-source-first-20260829"]
    paths:
      - '.github/workflows/apply-v44-chapter-completeness.yml'
      - '.github/v44parts/**'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cimt-source-first-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify validated v4.4 payload
        run: |
          cat \
            .github/v44parts/p00 .github/v44parts/p01 .github/v44parts/p02 \
            .github/v44parts/p03 .github/v44parts/p04 .github/v44parts/p05 \
            .github/v44parts/p06 .github/v44parts/p07 .github/v44parts/p08 \
            .github/v44parts/p09 .github/v44parts/p10 \
            | base64 -d > /tmp/v44_patch.tar.gz
          echo "8f95ab10e3b6259515e610e21af1d32931c783b4966e726f65730447f2928df8  /tmp/v44_patch.tar.gz" | sha256sum -c -
          tar -tzf /tmp/v44_patch.tar.gz

      - name: Apply chapter-completeness release candidate
        run: |
          tar -xzf /tmp/v44_patch.tar.gz
          rm -rf .github/v44parts .github/rc
          rm -f .github/v44_patch.tar.gz
          rm -f .github/workflows/apply-v44-chapter-completeness.yml
          rm -f .github/workflows/export-cimt-validation-snapshot.yml
          rm -f .github/workflows/cimt-multi-lecture-blueprint-probe.yml

      - name: Install runtime dependencies
        run: python -m pip install -r iscarb-studio/requirements.txt

      - name: Compile active application
        run: PYTHONDONTWRITEBYTECODE=1 python -m compileall -q iscarb-studio/app iscarb-studio/tests

      - name: Run chapter-completeness and presenter regressions
        working-directory: iscarb-studio
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest -v \
            tests.test_v44_chapter_completeness \
            tests.test_v43_archived_cimt \
            tests.test_v43_cimt_native \
            tests.test_v43_cimt_source_first \
            tests.test_v43_real_blueprint_regression

      - name: Run complete regression suite
        working-directory: iscarb-studio
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v

      - name: Repository hygiene and diff checks
        run: |
          find iscarb-studio -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find iscarb-studio -type f -name '*.pyc' -delete || true
          if find iscarb-studio -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) | grep -q .; then
            echo 'Python runtime residue remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit only after every gate passes
        run: |
          git config user.name "Prof. Adeeb Noor"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce atomic chapter completeness and active CIMT learning choreography"
          git push origin HEAD:fix/cimt-source-first-20260829
