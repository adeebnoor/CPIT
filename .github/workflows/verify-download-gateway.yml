name: Verify tracked download gateway

on:
  push:
    paths:
      - '.github/workflows/verify-download-gateway.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify logging API and public gateway
        shell: bash
        run: |
          set -euo pipefail
          API='https://xcirpzxpcpbxpowjbpiq.supabase.co/functions/v1/cpit455-download-log'
          BODY='{"email":"cpit455-gateway-test@stu.kau.edu.sa","chapter":"10","resource_type":"lecture"}'
          RESP=$(curl -fsS -X POST "$API" -H 'Origin: https://adeebnoor.github.io' -H 'Content-Type: application/json' --data "$BODY")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true'

          URL='https://adeebnoor.github.io/CPIT/download.html?chapter=10&type=lecture'
          for i in $(seq 1 24); do
            PAGE=$(curl -fsS "$URL" || true)
            if echo "$PAGE" | grep -q 'University email registration'; then
              echo 'PUBLIC GATEWAY PASS'
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo 'Public gateway did not become available in time' >&2
              exit 1
            fi
            sleep 5
          done

          LECTURE=$(curl -fsS 'https://adeebnoor.github.io/CPIT/lectures/iscarb/Ch10-Dependable-Systems.html')
          echo "$LECTURE" | grep -q '../../download.html?chapter=10&type=lecture'
          HUB=$(curl -fsS 'https://adeebnoor.github.io/CPIT/iscarb.html')
          echo "$HUB" | grep -q 'download.html?chapter=10&type=assignment'
          echo 'END-TO-END DOWNLOAD GATEWAY: PASS'
