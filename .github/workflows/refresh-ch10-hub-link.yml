name: Refresh Chapter 10 hub cache key

on:
  push:
    paths:
      - '.github/workflows/refresh-ch10-hub-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point Chapter 10 hub link to final reviewed presenter
        shell: python
        run: |
          from pathlib import Path
          p=Path('iscarb.html')
          s=p.read_text(encoding='utf-8')
          old='lectures/iscarb/InClass-Presenter.html?chapter=10&v=20260912-release1'
          new='lectures/iscarb/InClass-Presenter.html?chapter=10&v=20260913-final100'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one old Ch10 hub link, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit hub link
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'InClass-Presenter.html?chapter=10&v=20260913-final100' iscarb.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iscarb.html
          git commit -m "Refresh Chapter 10 final presenter link"
          git push origin HEAD:main
