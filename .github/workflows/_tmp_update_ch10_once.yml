name: Update Chapter 10 lecture once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_tmp_update_ch10_once.yml

permissions:
  contents: write

jobs:
  update-lecture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, verify, and install attached lecture
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='61hlT7EwBkCo'
          ZIP_NAME='Ch10-Dependable-Systems_2026_NooR.zip'
          HTML_NAME='Ch10-Dependable-Systems_2026_NooR.html'
          TARGET='lectures/iscarb/Ch10-Dependable-Systems.html'
          EXPECTED_HTML_SHA='fbe2d01ae329c3c0827b8ac4ae55e06b6aba4fe13f9487f7a7343f2e51be1ca9'

          curl -fsSL "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/files.json
          FILE_ID=$(python3 -c "import json; d=json.load(open('/tmp/files.json', encoding='utf-8')); print(next(x['fileId'] for x in d.get('files', []) if x.get('fileName') == '$ZIP_NAME'))")
          curl -fsSL -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          DOWNLOAD_URL=$(python3 -c "import json; print(json.load(open('/tmp/download.json', encoding='utf-8'))['downloadUrl'])")
          curl -fL "$DOWNLOAD_URL" -o /tmp/ch10.zip
          unzip -p /tmp/ch10.zip "$HTML_NAME" > "$TARGET.new"
          ACTUAL_HTML_SHA=$(sha256sum "$TARGET.new" | awk '{print $1}')
          test "$ACTUAL_HTML_SHA" = "$EXPECTED_HTML_SHA"
          test -s "$TARGET.new"
          grep -q "var LECTURE=" "$TARGET.new"
          grep -q "title:'Dependable Systems'" "$TARGET.new"
          mv "$TARGET.new" "$TARGET"

      - name: Commit lecture replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lectures/iscarb/Ch10-Dependable-Systems.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Lecture already matches the supplied file.'
          else
            git commit -m 'Replace Chapter 10 lecture with supplied 2026 version'
            git push origin HEAD:main
          fi
