name: Clean CIMT Repair Branch

on:
  push:
    branches: ["fix/cimt-source-first-20260829"]
    paths:
      - '.github/workflows/cleanup-cimt-branch.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cimt-source-first-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove tracked runtime caches
        run: |
          git rm -r -f --ignore-unmatch iscarb-studio/app/__pycache__ iscarb-studio/tests/__pycache__
      - name: Install dependencies and retest without bytecode writes
        run: |
          python -m pip install -r iscarb-studio/requirements.txt
          cd iscarb-studio
          python -m unittest discover -s tests -v
      - name: Commit clean branch
        run: |
          rm -f .github/workflows/cleanup-cimt-branch.yml
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add -A
          git commit -m 'Remove tracked Python runtime caches'
          git push origin HEAD:fix/cimt-source-first-20260829
