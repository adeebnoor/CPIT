name: iSCARB mind-map review
on:
  push:
    branches: [iscarb-mindmap-20260921]
    paths: ['.github/workflows/mindmap-review.yml', 'tools/apply_mindmap_v1.py', 'tools/check_mindmap_v1.py', 'tools/mindmap-v1/**']
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mindmap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name == 'push' && github.ref == 'refs/heads/iscarb-mindmap-20260921'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the baseline and apply the explicit learning-map edits
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','57c792e6508e345177acc0da964f3d89aee3d17b','HEAD'],text=True).splitlines()
          allowed={'.github/workflows/mindmap-review.yml','tools/apply_mindmap_v1.py','tools/check_mindmap_v1.py','tools/mindmap-v1/maps.json','tools/mindmap-v1/render.js','tools/mindmap-v1/layout.css'}
          assert set(changed)<=allowed,'Concurrent source changes require review'
          PY
          python tools/apply_mindmap_v1.py
          python tools/audit_classroom.py
          node tools/check-fbr-release.mjs
          python tools/build_public_site.py
      - name: Install isolated test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false jsdom@30.0.1
      - name: Preserve classroom, source and assessment behaviors
        run: |
          mkdir -p test-results/mindmap
          set -o pipefail
          {
            node tools/check-course-interactions.cjs
            node tools/check-assignment-v5.cjs
            node tools/learning-path-tests/check-path.cjs
            node tools/learning-path-tests/check-visual.cjs
            node tools/learning-path-tests/check-assignments.cjs
            node tools/learning-path-tests/check-labs.cjs
            node tools/learning-path-tests/check-hub.cjs
          } 2>&1 | tee test-results/mindmap/dom.log
      - name: Exercise the staged student journey and real offline packages
        run: |
          python -m http.server 8765 --directory _site >/tmp/mindmap-http.log 2>&1 &
          sleep 2
          set -o pipefail
          COURSE_BASE_URL=http://127.0.0.1:8765/ python tools/check_mindmap_v1.py 2>&1 | tee test-results/mindmap/map.log
          COURSE_BASE_URL=http://127.0.0.1:8765/ python tools/check_navigation_v1.py 2>&1 | tee test-results/mindmap/navigation.log
          COURSE_BASE_URL=http://127.0.0.1:8765/ python tools/classroom-v3-tests/check-classroom-http.py 2>&1 | tee test-results/mindmap/classroom.log
      - name: Commit only the files that passed all gates to the review branch
        run: |
          python - <<'PY'
          import json,pathlib,hashlib,subprocess
          m=json.loads(pathlib.Path('mindmap-change-manifest.json').read_text())
          for name,digest in m['changed'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          for name,digest in m['preserved_assessments'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          pathlib.Path('curriculum/mindmap-review.json').write_text(json.dumps(m,indent=2)+'\n')
          subprocess.run(['git','add','--',*m['changed'],'curriculum/mindmap-review.json'],check=True)
          PY
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git commit -m 'Add source-aligned chapter mind maps, student roadmaps and a simpler teaching interface across nine chapters'
          git push origin HEAD:refs/heads/iscarb-mindmap-20260921
          git rev-parse HEAD > test-results/mindmap/REVIEWED_COMMIT.txt
      - name: Preserve review evidence without copied packages or QA archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindmap-staging-proof
          path: |
            test-results/mindmap/*.png
            test-results/mindmap/*.json
            test-results/mindmap/*.log
            test-results/mindmap/*.txt
            test-results/navigation/navigation-proof.json
            test-results/classroom-v3/http-results.json
            curriculum/mindmap-review.json
          retention-days: 14
  live:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the exact map, lecture and guide bytes on the live site
        run: |
          mkdir -p test-results/mindmap
          python tools/audit_classroom.py
          python - <<'PY'
          import json,pathlib,hashlib,urllib.request,time
          m=json.loads(pathlib.Path('curriculum/mindmap-review.json').read_text())
          names={n:h for n,h in m['changed'].items() if n.endswith(('.html','.js','.css'))}
          records=[]
          for attempt in range(24):
              records=[]
              for name,digest in names.items():
                  try:
                      req=urllib.request.Request('https://adeebnoor.github.io/CPIT/'+name+'?mindmap-verify='+str(int(time.time())),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as r:data=r.read()
                      records.append({'file':name,'sha256':hashlib.sha256(data).hexdigest(),'match':hashlib.sha256(data).hexdigest()==digest})
                  except Exception as e:records.append({'file':name,'match':False,'error':str(e)})
              if all(x['match'] for x in records):break
              print('Waiting for publication:',[x['file'] for x in records if not x['match']],flush=True);time.sleep(10)
          assert all(x['match'] for x in records),records
          pathlib.Path('test-results/mindmap/live-bytes.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Install clean browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Follow the actual public entry links and newly downloaded ZIPs
        env:
          COURSE_BASE_URL: https://adeebnoor.github.io/CPIT/
        run: |
          set -o pipefail
          python tools/check_mindmap_v1.py 2>&1 | tee test-results/mindmap/live-map.log
          python tools/check_navigation_v1.py 2>&1 | tee test-results/mindmap/live-navigation.log
          git rev-parse HEAD > test-results/mindmap/VERIFIED_COMMIT.txt
      - name: Preserve live map and navigation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindmap-live-proof
          path: |
            test-results/mindmap/*.png
            test-results/mindmap/*.json
            test-results/mindmap/*.log
            test-results/mindmap/*.txt
            test-results/navigation/navigation-proof.json
          retention-days: 14
