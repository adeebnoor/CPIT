name: iSCARB mind-map review
on:
  push:
    branches: [iscarb-mindmap-20260921]
    paths: ['.github/workflows/mindmap-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export the exact reviewed course baseline
        run: |
          mkdir -p /tmp/mindmap-review
          git archive --format=tar 57c792e6508e345177acc0da964f3d89aee3d17b > /tmp/mindmap-review/baseline.tar
          echo 57c792e6508e345177acc0da964f3d89aee3d17b > /tmp/mindmap-review/BASE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mindmap-baseline
          path: /tmp/mindmap-review/
          retention-days: 2
