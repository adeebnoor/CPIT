name: ISCARB Production End-to-End

on:
  push:
    branches: ["main"]
    paths:
      - 'iscarb-studio/**'
      - 'render.yaml'
      - '.github/workflows/iscarb-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iscarb-production-smoke
  cancel-in-progress: true

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test client
        run: python -m pip install requests pypdf
      - name: Wait for Render deployment and test live production end to end
        env:
          BASE_URL: https://iscarb-lecture-studio.onrender.com
          EXPECTED_VERSION: 4.3.0
          SECURITY_SOURCE: https://www.slideshare.net/slideshow/ch14-5148075/5148075
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import time
          import zipfile
          import requests
          from pypdf import PdfReader

          BASE=os.environ['BASE_URL'].rstrip('/')
          EXPECTED=os.environ['EXPECTED_VERSION']
          SOURCE=os.environ['SECURITY_SOURCE']
          S=requests.Session()
          S.headers.update({'User-Agent':'ISCARB-production-e2e/4.3'})

          def get(path, **kw):
              return S.get(BASE+path, timeout=90, **kw)

          print('Waiting for Render to serve expected version', EXPECTED)
          last=''
          for _ in range(72):
              try:
                  r=get('/api/health')
                  last=f'{r.status_code} {r.text[:500]}'
                  if r.ok:
                      h=r.json()
                      print('health', h.get('version'), h.get('pipeline'))
                      if h.get('version') == EXPECTED:
                          break
              except Exception as e:
                  last=repr(e)
              time.sleep(15)
          else:
              raise AssertionError('Render never served expected version. Last response: '+last)

          h=get('/api/health').json()
          assert h['version']==EXPECTED
          assert h['capacity_retry_attempts_per_model']==3
          assert h['capacity_failover'] is True
          assert h['source_library_verified'] is True
          assert h['verified_source_count']==8
          assert h['deterministic_gate']=='v14-provenance-presenter-on-v13'
          assert h['presenter_renderer']=='cimt-native-v4.3-preview-pptx-pdf'
          assert h['presenter_exact_units']==20
          assert h['session_minutes']==90
          assert h['cross_discipline_visual_residue_guard'] is True

          home=get('/')
          assert home.status_code==200, home.text[:1000]
          html=home.text
          required=[
              'v4.3.0', 'Gate v14', 'CIMT-native Presenter',
              'Original Source Library', 'Upgrade My Lecture',
              'Visual Presenter', 'Faculty Reading Pack', 'Instructor Guide',
              'Student Activity Pack', 'Blueprint & Readiness',
          ]
          for needle in required:
              assert needle in html, f'homepage missing {needle!r}'

          starter=get('/starter-kit')
          assert starter.status_code==200
          assert 'ISCARB Faculty Starter Kit' in starter.text
          assert get('/api/jobs/not-a-real-job/presenter').status_code==404
          assert get('/api/jobs/not-a-real-job/export/pptx').status_code==404

          successful_job=None
          final_job=None
          for compile_attempt in range(1,4):
              print(f'Production Gemini compile attempt {compile_attempt}: {SOURCE}')
              r=S.post(BASE+'/api/compile', data={
                  'primary_url': SOURCE,
                  'supporting_urls':'',
                  'lecture_focus':'',
                  'model':'auto',
                  'repair_rounds':'0',
              }, timeout=120)
              assert r.status_code==200, f'compile submit failed {r.status_code}: {r.text[:1000]}'
              job_id=r.json()['job_id']
              deadline=time.time()+1100
              while time.time()<deadline:
                  jr=get('/api/jobs/'+job_id)
                  assert jr.status_code==200, jr.text[:1000]
                  j=jr.json(); final_job=j
                  print('status', j.get('status'), j.get('progress'), (j.get('message') or '')[:160])
                  if j.get('status') in {'ready','blocked','error'}:
                      if j.get('blueprint'):
                          successful_job=(job_id,j); break
                      text=((j.get('error') or '')+' '+(j.get('message') or '')).lower()
                      if any(x in text for x in ['quota','resource_exhausted','free_tier_requests']):
                          raise AssertionError('Production Gemini quota exhausted before Blueprint creation: '+text[:1500])
                      if any(x in text for x in ['503','unavailable','high demand','temporarily overloaded','service unavailable']):
                          print('Transient model capacity; retrying whole job.')
                          break
                      raise AssertionError('Compile ended without Blueprint: '+json.dumps(j)[:4000])
                  time.sleep(8)
              if successful_job: break
              time.sleep(45*compile_attempt)

          assert successful_job is not None, 'No production job produced a Blueprint. Last='+json.dumps(final_job)[:5000]
          job_id,j=successful_job
          bp=j['blueprint']
          assert bp['session_minutes']==90
          assert len(bp['units'])==20
          assert [u['number'] for u in bp['units']]==list(range(1,21))
          assert len(bp['clos'])==5
          assert bp.get('source_manifest')
          assert j['status'] in {'ready','blocked'}
          checks=j.get('deterministic_checks') or {}
          for key in ('v14_exactly_20_presenter_jobs','v14_exactly_90_live_minutes','v14_no_authored_hard_truncation_tokens'):
              assert checks.get(key) is True, (key, checks.get(key))

          preview=get('/api/jobs/'+job_id+'/presenter')
          assert preview.status_code==200
          assert 'CIMT-native Presenter' in preview.text
          assert len(preview.content)>5000
          # Dashboard-era slide chrome must not return in the learner Presenter.
          for banned in ('WHY THIS MATTERS','VISUAL LECTURE ENGINE V2'):
              assert banned not in preview.text.upper(), banned

          endpoints={
              'pptx':('/api/jobs/'+job_id+'/export/pptx','pptx'),
              'presenter_pdf':('/api/jobs/'+job_id+'/export/presenter-pdf','presenter_pdf'),
              'reading_pdf':('/api/jobs/'+job_id+'/export/pdf','pdf'),
              'instructor_docx':('/api/jobs/'+job_id+'/export/docx','docx'),
              'student_docx':('/api/jobs/'+job_id+'/export/student','docx'),
              'blueprint_json':('/api/jobs/'+job_id+'/export/json','json'),
          }
          for name,(path,kind) in endpoints.items():
              rr=get(path)
              assert rr.status_code==200, f'{name} HTTP {rr.status_code}'
              data=rr.content
              assert len(data)>500, (name,len(data))
              if kind=='pptx':
                  assert data.startswith(b'PK')
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      slides=[x for x in z.namelist() if x.startswith('ppt/slides/slide') and x.endswith('.xml')]
                      assert len(slides)==20
                      text=' '.join(z.read(x).decode('utf-8','ignore') for x in slides)
                      assert 'WHY THIS MATTERS' not in text.upper()
                      assert '...' not in text and '…' not in text
              elif kind=='presenter_pdf':
                  assert data.startswith(b'%PDF')
                  reader=PdfReader(io.BytesIO(data))
                  assert len(reader.pages)==20
                  text=' '.join((p.extract_text() or '') for p in reader.pages)
                  assert '...' not in text and '…' not in text
              elif kind=='pdf':
                  assert data.startswith(b'%PDF')
              elif kind=='docx':
                  assert data.startswith(b'PK')
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      assert 'word/document.xml' in z.namelist()
              elif kind=='json':
                  exported=rr.json(); assert exported['session_minutes']==90; assert len(exported['units'])==20
              print(name, 'OK', len(data), rr.headers.get('content-type'))

          print('PRODUCTION E2E PASS', job_id, j['status'])
          PY
