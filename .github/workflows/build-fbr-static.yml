name: Validate approved classroom publication
on:
  workflow_dispatch:
  push:
    paths:
      - 'curriculum/**'
      - 'tools/build_classroom.py'
      - 'tools/build-fbr-static.mjs'
      - 'tools/audit_classroom.py'
      - 'lectures/iscarb/**'
      - '.github/workflows/build-fbr-static.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate without regenerating instructor content
        run: python tools/build_classroom.py
      - name: Verify validation never modifies the approved lecture
        run: git diff --exit-code -- lectures/iscarb
