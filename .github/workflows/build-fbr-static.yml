name: Validate classroom generation
on:
  workflow_dispatch:
  push:
    paths:
      - 'curriculum/**'
      - 'tools/build_classroom.py'
      - 'tools/build-fbr-static.mjs'
      - '.github/workflows/build-fbr-static.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate classroom editions
        run: python tools/build_classroom.py
      - name: Verify committed generated pages match their source
        run: git diff --exit-code -- lectures/iscarb
      - name: Check chapter-specific content and answer coverage
        run: python tools/audit_classroom.py
