name: Finalize CIMT v4.3 visual and deployment rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-cimt-v43.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prefer more information-bearing original lecture visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('iscarb-studio/app/source_visuals.py')
          s=p.read_text(encoding='utf-8')
          old='SOURCE_VISUAL_PRIORITY = {6, 7, 8, 9, 12, 13}'
          new='SOURCE_VISUAL_PRIORITY = {2, 4, 5, 6, 7, 8, 9, 10, 12, 13, 14}'
          if old not in s and new not in s:
              raise SystemExit('SOURCE_VISUAL_PRIORITY sentinel not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Make production deployment verification truthful
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/iscarb-render-deploy.yml')
          s=p.read_text(encoding='utf-8')
          old="          print('::warning::Production did not advance to expected version during this verification window. Last='+last[:1000])"
          new="          raise SystemExit('Production did not advance to expected version during this verification window. Last='+last[:1000])"
          if old not in s and new not in s:
              raise SystemExit('deployment verifier sentinel not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Validate Python
        run: python -m py_compile iscarb-studio/app/cimt_native_v43.py iscarb-studio/app/source_visuals.py
      - name: Commit finalization and remove helper
        run: |
          rm -f .github/workflows/finalize-cimt-v43.yml
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add -A
          git commit -m 'Use richer CIMT source visuals and enforce live deployment'
          git push origin HEAD:main
