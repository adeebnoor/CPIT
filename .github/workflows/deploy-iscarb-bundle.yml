name: Deploy ISCARB lecture bundle

on:
  push:
    paths:
      - '.github/workflows/deploy-iscarb-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve firestorage download endpoint
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://firestorage.ai'
          SHARE='https://firestorage.ai/ja/f/dKI0mTGsDUyS'
          mkdir -p /tmp/iscarb
          curl -A 'Mozilla/5.0' -LfsS "$SHARE" -o /tmp/iscarb/share.html
          CHUNK=$(grep -oE '/_next/static/chunks/app/\(files\)/ja/f/page-[A-Za-z0-9]+\.js' /tmp/iscarb/share.html | head -1)
          echo "chunk=$CHUNK"
          curl -A 'Mozilla/5.0' -LfsS "$BASE$CHUNK" -o /tmp/iscarb/page.js
          echo '--- API-ish strings ---'
          grep -oE '.{0,120}(api|download|shareId|publicId|presign|signed|object|folder).{0,180}' /tmp/iscarb/page.js | head -120 || true
          echo '--- URL-ish strings ---'
          grep -oE 'https?[^"'"'"' ]+|/api/[^"'"'"' ]+|/[A-Za-z0-9_./?=-]*download[A-Za-z0-9_./?=&-]*' /tmp/iscarb/page.js | sort -u | head -120 || true
          exit 1
