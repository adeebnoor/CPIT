name: One-shot Capture Live Ch2 279f

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fetch-live-ch2-279f.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://iscarb-lecture-studio.onrender.com
      JOB_ID: 279f576ec8584bcfae4af6b750279eeb
    steps:
      - name: Fetch all existing outputs
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          base=os.environ['BASE_URL'].rstrip('/'); jid=os.environ['JOB_ID']
          out=pathlib.Path('/tmp/ch2-live-279f'); out.mkdir(parents=True,exist_ok=True)
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'ISCARB-Ch2-capture/1.0'})
              with urllib.request.urlopen(req,timeout=240) as r: return r.read()
          endpoints={
            'job.json':f'/api/jobs/{jid}',
            'presenter.html':f'/api/jobs/{jid}/presenter',
            'presenter.pptx':f'/api/jobs/{jid}/export/pptx',
            'presenter.pdf':f'/api/jobs/{jid}/export/presenter-pdf',
            'reading.pdf':f'/api/jobs/{jid}/export/pdf',
            'instructor.docx':f'/api/jobs/{jid}/export/docx',
            'student.docx':f'/api/jobs/{jid}/export/student',
            'blueprint.json':f'/api/jobs/{jid}/export/json',
          }
          for name,path in endpoints.items():
              data=get(path); (out/name).write_bytes(data); print(name,len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ch2-live-279f-visual-audit
          path: /tmp/ch2-live-279f/*
          if-no-files-found: error
