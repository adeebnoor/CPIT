name: Deploy visual lecture rebuild

on:
  push:
    paths:
      - '.github/workflows/deploy-visual-lectures-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build visual lecture files
        run: |
          cat .tmp/build_visual_part00.py .tmp/build_visual_part01.py .tmp/build_visual_part02.py .tmp/build_visual_part03.py > /tmp/build_visual_lectures.py
          python /tmp/build_visual_lectures.py
      - name: Commit visual lectures
        run: |
          git config user.name "Prof. Adeeb Noor"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add lectures/iscarb/Ch12-Safety-Engineering.html lectures/iscarb/Ch13-Security-Engineering.html lectures/iscarb/Ch14-Resilience-Engineering.html lectures/iscarb/Ch15-Software-Reuse.html lectures/iscarb/Ch16-Component-Based-Software-Engineering.html lectures/iscarb/Ch17-Distributed-Software-Engineering.html lectures/iscarb/Ch20-Systems-of-Systems.html
          if git diff --cached --quiet; then
            echo "No lecture changes to commit"
          else
            git commit -m "Restore rich visual lecture style for Chapters 12-20"
            git push origin HEAD:main
          fi
