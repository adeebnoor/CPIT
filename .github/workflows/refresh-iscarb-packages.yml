name: Refresh iSCARB offline packages
# visual-sync-v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lectures/iscarb/runtime/classroom-v3.js'
      - 'lectures/iscarb/Ch*-*.html'
      - 'lectures/iscarb/runtime/readable.css'
      - 'lectures/iscarb/runtime/national-alignment.css'
      - 'lectures/iscarb/runtime/national-content.js'
      - 'lectures/iscarb/runtime/source-figures.js'
      - 'lectures/iscarb/runtime/assignment-readable.css'
      - '.github/workflows/refresh-iscarb-packages.yml'
permissions:
  contents: write
concurrency:
  group: iscarb-package-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild packages from reviewed source
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('curriculum/publication.json')
          d=json.loads(p.read_text())
          for name in [
            'lectures/iscarb/runtime/classroom-v3.js',
            'lectures/iscarb/runtime/classroom-v3.css',
            'lectures/iscarb/runtime/readable.css',
            'lectures/iscarb/runtime/assignment-readable.css'
          ]:
            if pathlib.Path(name).is_file():
              d['delivery_asset_sha256'][name]=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python tools/prepare_readable_release.py
          python tools/check_paper_fidelity.py
          python tools/audit_classroom.py
      - name: Commit generated package bytes and manifest hashes
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add curriculum/publication.json lectures/iscarb/packages/*.zip
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m 'Refresh iSCARB offline packages after runtime visual improvement'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
