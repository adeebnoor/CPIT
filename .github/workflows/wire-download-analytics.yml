name: Wire tracked course downloads

on:
  push:
    paths:
      - '.github/workflows/wire-download-analytics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route every course download through email logging
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          chapters = ['10','11','12','13','14','15','16','17','20']

          # Hub: both lecture and assignment downloads go through the central gate.
          p=Path('iscarb.html')
          s=p.read_text(encoding='utf-8')
          for ch in chapters:
              s=re.sub(rf'<a class="download" href="lectures/iscarb/Ch{ch}[^\"]*" download="CPIT455_Ch{ch}_Lecture\.html">↓ Download Lecture</a>',
                       f'<a class="download" href="download.html?chapter={ch}&type=lecture">↓ Download Lecture</a>', s)
              s=re.sub(rf'<a class="download" href="lectures/iscarb/Ch{ch}-FBR-Student-Assignment\.html" download="CPIT455_W{ch}_FBR_Assignment\.html">↓ Download Assignment</a>',
                       f'<a class="download" href="download.html?chapter={ch}&type=assignment">↓ Download Assignment</a>', s)
          p.write_text(s,encoding='utf-8')

          # Presenter: same tracked gate for the Download button.
          p=Path('lectures/iscarb/InClass-Presenter.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"function downloadLecture\(\)\{.*?\}document\.getElementById\('download'\)\.onclick=downloadLecture;",
                   "function downloadLecture(){location.href='../../download.html?chapter='+encodeURIComponent(ch)+'&type=lecture'}document.getElementById('download').onclick=downloadLecture;",
                   s, flags=re.S)
          p.write_text(s,encoding='utf-8')

          # Direct lecture pages: floating Download button also uses the tracked gate.
          lecture_files = {
            '10':'Ch10-Dependable-Systems.html',
            '11':'Ch11-Reliability-Engineering.html',
            '12':'Ch12-Safety-Engineering.html',
            '13':'Ch13-Security-Engineering.html',
            '14':'Ch14-Resilience-Engineering.html',
            '15':'Ch15-Software-Reuse.html',
            '16':'Ch16-Component-Based-Software-Engineering.html',
            '17':'Ch17-Distributed-Software-Engineering.html',
            '20':'Ch20-Systems-of-Systems.html'
          }
          for ch,name in lecture_files.items():
              p=Path('lectures/iscarb')/name
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<a id="lectureDownloadBtn"[^>]*>↓ Download Lecture</a>',
                       f'<a id="lectureDownloadBtn" href="../../download.html?chapter={ch}&type=lecture" aria-label="Download Chapter {ch} lecture">↓ Download Lecture</a>', s)
              p.write_text(s,encoding='utf-8')

          # Hard validation.
          hub=Path('iscarb.html').read_text(encoding='utf-8')
          presenter=Path('lectures/iscarb/InClass-Presenter.html').read_text(encoding='utf-8')
          for ch in chapters:
              assert f'download.html?chapter={ch}&type=lecture' in hub
              assert f'download.html?chapter={ch}&type=assignment' in hub
              assert f"chapter='+encodeURIComponent(ch)+'&type=lecture" in presenter
          for ch,name in lecture_files.items():
              s=(Path('lectures/iscarb')/name).read_text(encoding='utf-8')
              assert f'../../download.html?chapter={ch}&type=lecture' in s
          print('VALIDATION PASS: tracked email download route wired for all 9 lecture and assignment links')
          PY
      - name: Commit tracked download routing
        run: |
          git config user.name "Prof. Adeeb Noor"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add iscarb.html lectures/iscarb/InClass-Presenter.html lectures/iscarb/Ch10-Dependable-Systems.html lectures/iscarb/Ch11-Reliability-Engineering.html lectures/iscarb/Ch12-Safety-Engineering.html lectures/iscarb/Ch13-Security-Engineering.html lectures/iscarb/Ch14-Resilience-Engineering.html lectures/iscarb/Ch15-Software-Reuse.html lectures/iscarb/Ch16-Component-Based-Software-Engineering.html lectures/iscarb/Ch17-Distributed-Software-Engineering.html lectures/iscarb/Ch20-Systems-of-Systems.html
          if git diff --cached --quiet; then
            echo "Tracked download routing already present"
          else
            git commit -m "Route CPIT-455 downloads through university email logging"
            git push origin HEAD:main
          fi
