name: ISCARB Live CIMT Current Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iscarb-live-cimt-current.yml'

permissions:
  contents: read

concurrency:
  group: iscarb-live-cimt-current
  cancel-in-progress: false

jobs:
  live-cimt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://iscarb-lecture-studio.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inspection and current renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r iscarb-studio/requirements.txt
          pip install requests pypdf python-pptx pymupdf Pillow

      - name: Verify live public routes before compilation
        run: |
          python - <<'PY'
          import json, pathlib, requests
          base='https://iscarb-lecture-studio.onrender.com'
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-live-CIMT-QA/3.0'})
          health=s.get(base+'/api/health',timeout=45); health.raise_for_status(); h=health.json()
          home=s.get(base+'/',timeout=45); home.raise_for_status()
          starter=s.get(base+'/starter-kit',timeout=45); starter.raise_for_status()
          html=home.text
          for needle in ('Source Library','Upgrade My Lecture','Outputs','Guides'):
              assert needle in html, needle
          assert len(starter.content)>1000
          assert h.get('ok') is True
          print('LIVE ROUTES PASS', h.get('version'), h.get('pipeline'))
          pathlib.Path('/tmp/health.json').write_text(json.dumps(h,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Compile the archived CIMT Dependable Systems lecture on live production
        run: |
          python - <<'PY'
          import json, pathlib, time, requests
          base='https://iscarb-lecture-studio.onrender.com'
          src=pathlib.Path('lectures/cimt/CPIT455-class2-NooR.pdf')
          assert src.exists() and src.stat().st_size>100000
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-live-CIMT-QA/3.0'})
          with src.open('rb') as f:
              r=s.post(base+'/api/compile',files={'primary_lecture':(src.name,f,'application/pdf')},data={
                  'primary_url':'',
                  'supporting_urls':'',
                  'lecture_focus':'Preserve the original CIMT technical depth, diagrams, tables, red emphasis and source-native visual teaching style while compiling the full 20-unit ISCARB experience. Do not turn the presenter into a dashboard or generic cards.',
                  'model':'auto',
                  'repair_rounds':'2'
              },timeout=120)
          print('COMPILE',r.status_code,r.text[:2000]); r.raise_for_status()
          job_id=r.json()['job_id']; pathlib.Path('/tmp/job_id.txt').write_text(job_id)
          deadline=time.time()+2100; job=None
          while time.time()<deadline:
              jr=s.get(base+'/api/jobs/'+job_id,timeout=60); jr.raise_for_status(); job=jr.json()
              print('STATE',job.get('status'),job.get('progress'),(job.get('message') or '')[:240],flush=True)
              if job.get('status') in {'ready','blocked','error'}: break
              time.sleep(8)
          assert job is not None
          pathlib.Path('/tmp/job.json').write_text(json.dumps(job,ensure_ascii=False,indent=2),encoding='utf-8')
          assert job.get('blueprint'), json.dumps(job,ensure_ascii=False)[:6000]
          bp=job['blueprint']
          assert len(bp.get('units',[]))==20
          assert len(bp.get('clos',[]))==5
          assert bp.get('session_minutes')==90
          assert job.get('status') in {'ready','blocked'}
          print('FINAL',job.get('status'),'units',len(bp['units']),'clos',len(bp['clos']))
          PY

      - name: Download every live output and inventory live v4.2 visual defects
        run: |
          python - <<'PY'
          import json, pathlib, requests
          from pypdf import PdfReader
          from pptx import Presentation
          from pptx.enum.shapes import MSO_SHAPE_TYPE
          base='https://iscarb-lecture-studio.onrender.com'; job_id=pathlib.Path('/tmp/job_id.txt').read_text().strip()
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-live-CIMT-QA/3.0'})
          out=pathlib.Path('/tmp/iscarb-live-cimt'); out.mkdir(exist_ok=True)
          endpoints={
            'live-presenter.html':f'/api/jobs/{job_id}/presenter',
            'live-presenter.pptx':f'/api/jobs/{job_id}/export/pptx',
            'live-presenter.pdf':f'/api/jobs/{job_id}/export/presenter-pdf',
            'reading-pack.pdf':f'/api/jobs/{job_id}/export/pdf',
            'instructor-guide.docx':f'/api/jobs/{job_id}/export/docx',
            'student-pack.docx':f'/api/jobs/{job_id}/export/student',
            'blueprint.json':f'/api/jobs/{job_id}/export/json',
          }
          for name,path in endpoints.items():
              r=s.get(base+path,timeout=180); print(name,r.status_code,len(r.content)); r.raise_for_status(); (out/name).write_bytes(r.content)

          prs=Presentation(out/'live-presenter.pptx')
          assert len(prs.slides)==20
          assert len(PdfReader(str(out/'live-presenter.pdf')).pages)==20
          assert len(PdfReader(str(out/'reading-pack.pdf')).pages)>=1
          ppt_text=' '.join(shape.text for sl in prs.slides for shape in sl.shapes if hasattr(shape,'text_frame'))
          upper=ppt_text.upper()
          picture_count=sum(1 for sl in prs.slides for sh in sl.shapes if sh.shape_type == MSO_SHAPE_TYPE.PICTURE)
          bp=json.loads((out/'blueprint.json').read_text(encoding='utf-8'))
          source_anchored=sum(1 for u in bp['units'] if '[P1]' in str(u.get('source_anchor','')).upper())
          job=json.loads(pathlib.Path('/tmp/job.json').read_text(encoding='utf-8'))
          checks=job.get('deterministic_checks') or {}
          failed=[k for k,v in checks.items() if v is False]
          live_summary={
              'live_version':json.loads(pathlib.Path('/tmp/health.json').read_text()).get('version'),
              'job_id':job_id,
              'status':job.get('status'),
              'picture_shapes':picture_count,
              'source_anchored_units':source_anchored,
              'deterministic_failed_checks':failed,
              'presenter_slides':20,
              'presenter_pdf_pages':20,
              'all_exports_downloaded':True,
              'cross_discipline_security_residue':('SECURITY ENGINEERING' in upper),
              'visible_hard_ellipsis':('...' in ppt_text or '…' in ppt_text),
          }
          (out/'live-qa-summary.json').write_text(json.dumps(live_summary,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'health.json').write_bytes(pathlib.Path('/tmp/health.json').read_bytes())
          (out/'job.json').write_bytes(pathlib.Path('/tmp/job.json').read_bytes())
          print('LIVE OUTPUT INVENTORY',json.dumps(live_summary,indent=2))
          PY

      - name: Re-render the exact live Gemini blueprint through latest v4.3 CIMT-native Presenter
        working-directory: iscarb-studio
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from pypdf import PdfReader
          from pptx import Presentation
          from pptx.enum.shapes import MSO_SHAPE_TYPE
          from app.models import Blueprint
          from app.cimt_native_v43 import export_cimt_presenter_pptx_v43, export_cimt_presenter_pdf_v43, render_cimt_presenter_preview_v43

          repo=Path('..').resolve()
          out=Path('/tmp/iscarb-live-cimt')
          source=repo/'lectures/cimt/CPIT455-class2-NooR.pdf'
          bp=Blueprint.model_validate_json((out/'blueprint.json').read_text(encoding='utf-8'))

          # Bind the downloaded live blueprint to the exact archived source PDF so
          # v4.3 can select and preserve the same information-bearing CIMT pages.
          upload=Path('data/uploads/_live_blueprint_v43')
          upload.mkdir(parents=True,exist_ok=True)
          shutil.copy2(source,upload/'P1__CPIT455-class2-NooR.pdf')
          bp.source_manifest=['[P1] PRIMARY: CPIT455-class2-NooR.pdf']+[x for x in bp.source_manifest if '[P1]' not in x.upper()]
          try:
              ppt=export_cimt_presenter_pptx_v43(bp,out/'latest-v43-presenter.pptx')
              pdf=export_cimt_presenter_pdf_v43(bp,out/'latest-v43-presenter.pdf')
              (out/'latest-v43-preview.html').write_text(render_cimt_presenter_preview_v43(bp,'QA'),encoding='utf-8')
              prs=Presentation(ppt); assert len(prs.slides)==20
              assert len(PdfReader(str(pdf)).pages)==20
              text=' '.join(sh.text for sl in prs.slides for sh in sl.shapes if hasattr(sh,'text_frame'))
              up=text.upper()
              assert 'SECURITY ENGINEERING' not in up
              assert 'PLATFORM PROTECTION' not in up
              assert '...' not in text and '…' not in text
              pictures=sum(1 for sl in prs.slides for sh in sl.shapes if sh.shape_type==MSO_SHAPE_TYPE.PICTURE)
              summary={
                  'renderer':'v4.3.0 CIMT-native',
                  'same_live_blueprint':True,
                  'slides':20,
                  'pdf_pages':20,
                  'picture_shapes':pictures,
                  'cross_discipline_security_residue':False,
                  'visible_hard_ellipsis':False,
                  'visual_contract':'white CIMT canvas; green serif hierarchy; gold corner rules; red emphasis; source-native P1 figures when information-bearing; varied visual archetypes',
              }
              (out/'latest-v43-qa-summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
              print('LATEST V4.3 SAME-BLUEPRINT QA PASS',json.dumps(summary,indent=2))
          finally:
              shutil.rmtree(upload,ignore_errors=True)
          PY

      - name: Render live and v4.3 presenters to comparison contact sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw
          out=Path('/tmp/iscarb-live-cimt')
          def contact(src: Path, dest: Path, prefix: str):
              doc=fitz.open(src); thumbs=[]
              for i,page in enumerate(doc):
                  pix=page.get_pixmap(matrix=fitz.Matrix(1.15,1.15),alpha=False)
                  im=Image.frombytes('RGB',[pix.width,pix.height],pix.samples); im.thumbnail((480,270))
                  c=Image.new('RGB',(500,305),'white'); c.paste(im,((500-im.width)//2,5)); ImageDraw.Draw(c).text((10,283),f'{prefix} {i+1:02d}',fill='black'); thumbs.append(c)
              assert len(thumbs)==20
              sheet=Image.new('RGB',(2000,1525),(238,238,238))
              for i,im in enumerate(thumbs): sheet.paste(im,((i%4)*500,(i//4)*305))
              sheet.save(dest)
          contact(out/'live-presenter.pdf',out/'live-presenter-contact.png','LIVE')
          contact(out/'latest-v43-presenter.pdf',out/'latest-v43-presenter-contact.png','V4.3')
          a=Image.open(out/'live-presenter-contact.png'); b=Image.open(out/'latest-v43-presenter-contact.png')
          side=Image.new('RGB',(a.width+b.width,max(a.height,b.height)),(255,255,255)); side.paste(a,(0,0)); side.paste(b,(a.width,0)); side.save(out/'live-vs-latest-v43.png')
          print('COMPARISON',out/'live-vs-latest-v43.png',side.size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: iscarb-live-cimt-current-production
          path: /tmp/iscarb-live-cimt/*
          if-no-files-found: error
