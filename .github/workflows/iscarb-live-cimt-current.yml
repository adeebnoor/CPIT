name: ISCARB Live CIMT Current Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iscarb-live-cimt-current.yml'

permissions:
  contents: read

concurrency:
  group: iscarb-live-cimt-current
  cancel-in-progress: false

jobs:
  live-cimt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://iscarb-lecture-studio.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production QA dependencies
        run: python -m pip install requests pypdf python-pptx

      - name: Verify live v4.3 public contract
        run: |
          python - <<'PY'
          import json, pathlib, requests
          base='https://iscarb-lecture-studio.onrender.com'
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-live-CIMT-QA/4.3'})
          health=s.get(base+'/api/health',timeout=45); health.raise_for_status(); h=health.json()
          assert h.get('ok') is True
          assert h.get('version') == '4.3.0', h.get('version')
          assert h.get('pipeline') == 'faculty-studio-v4.3.0-cimt-native-presenter-gate-v14'
          assert h.get('deterministic_gate') == 'v14-provenance-presenter-on-v13'
          assert h.get('presenter_exact_units') == 20
          assert h.get('session_minutes') == 90
          assert h.get('gemini_api_key_configured') is True
          assert h.get('source_library_verified') is True
          assert h.get('verified_source_count') == 8
          assert h.get('cross_discipline_visual_residue_guard') is True
          assert h.get('hero_static_dependency') is False

          home=s.get(base+'/',timeout=45); home.raise_for_status(); html=home.text
          for needle in ('v4.3.0','Gate v14','Source Library','Upgrade My Lecture','Outputs','Guides'):
              assert needle in html, f'homepage missing {needle!r}'
          starter=s.get(base+'/starter-kit',timeout=45); starter.raise_for_status()
          assert len(starter.content) > 1000
          for path in ('/openapi.json','/docs','/redoc'):
              r=s.get(base+path,timeout=45); assert r.status_code == 200, (path,r.status_code)
          assert s.get(base+'/api/jobs/not-a-real-job',timeout=45).status_code == 404
          assert s.get(base+'/api/jobs/not-a-real-job/presenter',timeout=45).status_code == 404
          assert s.get(base+'/api/jobs/not-a-real-job/export/pptx',timeout=45).status_code == 404
          pathlib.Path('/tmp/health.json').write_text(json.dumps(h,ensure_ascii=False,indent=2),encoding='utf-8')
          print('LIVE PUBLIC CONTRACT PASS',h['version'],h['pipeline'])
          PY

      - name: Compile archived CIMT Dependable Systems on live production
        run: |
          python - <<'PY'
          import json, pathlib, time, requests
          base='https://iscarb-lecture-studio.onrender.com'
          src=pathlib.Path('lectures/cimt/CPIT455-class2-NooR.pdf')
          assert src.exists() and src.stat().st_size > 100000, src
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-live-CIMT-QA/4.3'})
          with src.open('rb') as f:
              r=s.post(base+'/api/compile',files={'primary_lecture':(src.name,f,'application/pdf')},data={
                  'primary_url':'',
                  'supporting_urls':'',
                  'lecture_focus':'Preserve the original CIMT technical depth, diagrams, tables, red emphasis and source-native teaching logic. Cover every major P1 checkpoint by Unit 15. Keep Saudi context, accountability, future implications and AI audit integrated as pedagogy rather than replacement technical topics.',
                  'model':'auto',
                  'repair_rounds':'2'
              },timeout=120)
          print('COMPILE SUBMIT',r.status_code,r.text[:1200]); r.raise_for_status()
          job_id=r.json()['job_id']; pathlib.Path('/tmp/job_id.txt').write_text(job_id)
          deadline=time.time()+1800; job=None
          while time.time() < deadline:
              jr=s.get(base+'/api/jobs/'+job_id,timeout=60); jr.raise_for_status(); job=jr.json()
              print('STATE',job.get('status'),job.get('progress'),(job.get('message') or '')[:220],flush=True)
              if job.get('status') in {'ready','blocked','error'}:
                  break
              time.sleep(8)
          assert job is not None
          pathlib.Path('/tmp/job.json').write_text(json.dumps(job,ensure_ascii=False,indent=2),encoding='utf-8')
          assert job.get('blueprint'), json.dumps(job,ensure_ascii=False)[:6000]
          assert job.get('status') in {'ready','blocked'}, job.get('status')
          bp=job['blueprint']
          assert bp.get('session_minutes') == 90
          assert len(bp.get('units',[])) == 20
          assert [u.get('number') for u in bp['units']] == list(range(1,21))
          assert len(bp.get('clos',[])) == 5
          assert bp.get('source_manifest')
          checks=job.get('deterministic_checks') or {}
          for key in ('v14_exactly_20_presenter_jobs','v14_exactly_90_live_minutes','v14_no_authored_hard_truncation_tokens'):
              assert checks.get(key) is True, (key,checks.get(key))
          ledger=bp.get('coverage_ledger') or []
          major=[x for x in ledger if str(x.get('importance','')).lower() == 'major']
          assert major, 'No major P1 coverage ledger entries were produced'
          uncovered=[x for x in major if not x.get('unit_numbers') and not x.get('first_taught_unit')]
          assert not uncovered, uncovered[:8]
          late=[x for x in major if isinstance(x.get('first_taught_unit'),int) and x['first_taught_unit'] > 15]
          assert not late, late[:8]
          print('LIVE COMPILE CONTRACT PASS',job_id,job['status'],'major-ledger',len(major))
          PY

      - name: Validate every live output surface
        run: |
          python - <<'PY'
          import io, json, pathlib, zipfile, requests
          from pypdf import PdfReader
          from pptx import Presentation
          from pptx.enum.shapes import MSO_SHAPE_TYPE

          base='https://iscarb-lecture-studio.onrender.com'
          job_id=pathlib.Path('/tmp/job_id.txt').read_text().strip()
          job=json.loads(pathlib.Path('/tmp/job.json').read_text(encoding='utf-8'))
          health=json.loads(pathlib.Path('/tmp/health.json').read_text(encoding='utf-8'))
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-live-CIMT-QA/4.3'})
          out=pathlib.Path('/tmp/iscarb-live-cimt-v43'); out.mkdir(exist_ok=True)

          endpoints={
            'presenter.html':f'/api/jobs/{job_id}/presenter',
            'presenter.pptx':f'/api/jobs/{job_id}/export/pptx',
            'presenter.pdf':f'/api/jobs/{job_id}/export/presenter-pdf',
            'reading-pack.pdf':f'/api/jobs/{job_id}/export/pdf',
            'instructor-guide.docx':f'/api/jobs/{job_id}/export/docx',
            'student-pack.docx':f'/api/jobs/{job_id}/export/student',
            'blueprint.json':f'/api/jobs/{job_id}/export/json',
          }
          for name,path in endpoints.items():
              r=s.get(base+path,timeout=180)
              print(name,r.status_code,len(r.content),r.headers.get('content-type'))
              r.raise_for_status(); assert len(r.content)>500
              (out/name).write_bytes(r.content)

          preview=(out/'presenter.html').read_text(encoding='utf-8')
          assert len(preview) > 5000
          assert 'CIMT-native Presenter' in preview
          for banned in ('WHY THIS MATTERS','VISUAL LECTURE ENGINE V2'):
              assert banned not in preview.upper(), banned

          prs=Presentation(out/'presenter.pptx'); assert len(prs.slides)==20
          ppt_text=' '.join(sh.text for sl in prs.slides for sh in sl.shapes if hasattr(sh,'text_frame'))
          assert 'WHY THIS MATTERS' not in ppt_text.upper()
          assert 'VISUAL LECTURE ENGINE V2' not in ppt_text.upper()
          assert '...' not in ppt_text and '…' not in ppt_text
          picture_count=sum(1 for sl in prs.slides for sh in sl.shapes if sh.shape_type == MSO_SHAPE_TYPE.PICTURE)

          presenter_pdf=PdfReader(str(out/'presenter.pdf')); assert len(presenter_pdf.pages)==20
          presenter_text=' '.join((p.extract_text() or '') for p in presenter_pdf.pages)
          assert '...' not in presenter_text and '…' not in presenter_text
          reading=PdfReader(str(out/'reading-pack.pdf')); assert len(reading.pages)>=1

          for name in ('instructor-guide.docx','student-pack.docx'):
              with zipfile.ZipFile(out/name) as z:
                  assert 'word/document.xml' in z.namelist()

          bp=json.loads((out/'blueprint.json').read_text(encoding='utf-8'))
          assert bp.get('session_minutes')==90
          assert len(bp.get('units',[]))==20
          assert len(bp.get('clos',[]))==5

          fallback_signals=' '.join(str(job.get(k) or '') for k in ('message','error')).lower()
          quota_safe=('quota' in fallback_signals or 'resource_exhausted' in fallback_signals)
          summary={
              'production_version':health.get('version'),
              'pipeline':health.get('pipeline'),
              'job_id':job_id,
              'job_status':job.get('status'),
              'gemini_api_key_configured':health.get('gemini_api_key_configured'),
              'quota_safe_fallback_signal':quota_safe,
              'units':len(bp.get('units',[])),
              'session_minutes':bp.get('session_minutes'),
              'clos':len(bp.get('clos',[])),
              'presenter_slides':len(prs.slides),
              'presenter_pdf_pages':len(presenter_pdf.pages),
              'reading_pack_pages':len(reading.pages),
              'picture_shapes':picture_count,
              'all_seven_output_surfaces_valid':True,
              'visible_hard_ellipsis':False,
              'dashboard_residue':False,
          }
          (out/'health.json').write_text(json.dumps(health,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'job.json').write_text(json.dumps(job,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'live-qa-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('LIVE PRODUCTION E2E PASS',json.dumps(summary,indent=2))
          PY

      - name: Upload inspectable live production evidence
        uses: actions/upload-artifact@v4
        with:
          name: iscarb-live-cimt-v43-production
          path: /tmp/iscarb-live-cimt-v43/*
          if-no-files-found: error
