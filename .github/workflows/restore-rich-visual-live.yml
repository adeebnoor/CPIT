name: Restore rich visual lectures live

on:
  push:
    paths:
      - '.github/workflows/restore-rich-visual-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore old visual Ch10/11 routing and visual versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          presenter = Path('lectures/iscarb/InClass-Presenter.html')
          p = presenter.read_text(encoding='utf-8')
          repl = {
            "Ch10-Dependable-Systems-Final100.html?v=20260913-final100":"Ch10-Dependable-Systems.html?v=20260913-visual",
            "Ch11-Reliability-Engineering-Final100.html?v=20260913-final100":"Ch11-Reliability-Engineering.html?v=20260913-visual",
            "Ch12-Safety-Engineering.html?v=20260913-final100":"Ch12-Safety-Engineering.html?v=20260913-visual",
            "Ch13-Security-Engineering.html?v=20260913-final100":"Ch13-Security-Engineering.html?v=20260913-visual",
            "Ch14-Resilience-Engineering.html?v=20260913-final100":"Ch14-Resilience-Engineering.html?v=20260913-visual",
            "Ch15-Software-Reuse.html?v=20260913-final100":"Ch15-Software-Reuse.html?v=20260913-visual",
            "Ch16-Component-Based-Software-Engineering.html?v=20260913-final100":"Ch16-Component-Based-Software-Engineering.html?v=20260913-visual",
            "Ch17-Distributed-Software-Engineering.html?v=20260913-final100":"Ch17-Distributed-Software-Engineering.html?v=20260913-visual",
            "Ch20-Systems-of-Systems.html?v=20260913-final100":"Ch20-Systems-of-Systems.html?v=20260913-visual",
          }
          for a,b in repl.items():
              p = p.replace(a,b)
          presenter.write_text(p, encoding='utf-8')

          hub = Path('iscarb.html')
          h = hub.read_text(encoding='utf-8').replace('v=20260913-final100','v=20260913-visual')
          hub.write_text(h, encoding='utf-8')

          # Compatibility aliases so stale Final100 links also show the restored rich visual Ch10/11 versions.
          Path('lectures/iscarb/Ch10-Dependable-Systems-Final100.html').write_text(
              Path('lectures/iscarb/Ch10-Dependable-Systems.html').read_text(encoding='utf-8'), encoding='utf-8')
          Path('lectures/iscarb/Ch11-Reliability-Engineering-Final100.html').write_text(
              Path('lectures/iscarb/Ch11-Reliability-Engineering.html').read_text(encoding='utf-8'), encoding='utf-8')
          PY
      - name: Verify mappings
        shell: bash
        run: |
          grep -q "Ch10-Dependable-Systems.html?v=20260913-visual" lectures/iscarb/InClass-Presenter.html
          grep -q "Ch11-Reliability-Engineering.html?v=20260913-visual" lectures/iscarb/InClass-Presenter.html
          for ch in 10 11 12 13 14 15 16 17 20; do
            grep -q "chapter=${ch}&v=20260913-visual" iscarb.html
          done
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Prof. Adeeb Noor"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add iscarb.html lectures/iscarb/InClass-Presenter.html \
            lectures/iscarb/Ch10-Dependable-Systems-Final100.html \
            lectures/iscarb/Ch11-Reliability-Engineering-Final100.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Restore rich visual Ch10/11 and route all lectures to visual versions"
            git push origin HEAD:main
          fi
