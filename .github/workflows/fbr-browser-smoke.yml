name: ISCARB Course Interaction Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iscarb.html'
      - 'iscarb-hub.*'
      - 'student-guide.html'
      - 'course-resources.html'
      - 'download.html'
      - 'fbr-submission.html'
      - 'lectures/iscarb/**'
      - 'curriculum/publication.json'
      - 'tools/check-course-interactions.cjs'
      - '.github/workflows/fbr-browser-smoke.yml'

permissions:
  contents: read

jobs:
  course-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM test environment
        run: npm install --no-save --package-lock=false jsdom@30.0.1
      - name: Check current course interactions and withdrawn routes
        run: node tools/check-course-interactions.cjs
