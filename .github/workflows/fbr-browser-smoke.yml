name: ISCARB Course Interaction Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iscarb.html'
      - 'iscarb-hub.*'
      - 'student-guide.html'
      - 'course-resources.html'
      - 'instructor-guide.html'
      - 'curriculum/learning-path/**'
      - 'tools/learning-path-tests/**'
      - 'download.html'
      - 'fbr-submission.html'
      - 'lectures/iscarb/**'
      - 'curriculum/publication.json'
      - 'tools/check-course-interactions.cjs'
      - 'tools/check-assignment-v5.cjs'
      - '.github/workflows/fbr-browser-smoke.yml'

permissions:
  contents: read

jobs:
  course-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM test environment
        run: npm install --no-save --package-lock=false jsdom@30.0.1
      - name: Check current course interactions and invalid routes
        run: node tools/check-course-interactions.cjs
      - name: Check reviewed assignment commitment, recovery and exports
        run: node tools/check-assignment-v5.cjs
      - name: Check all nine learning paths and complete source ledgers
        run: node tools/learning-path-tests/check-path.cjs
      - name: Check visual pagination interactions and offline recovery
        run: node tools/learning-path-tests/check-visual.cjs
      - name: Check progressive assignments and chapter-specific exports
        run: node tools/learning-path-tests/check-assignments.cjs
      - name: Check executable contract and retry teaching models
        run: node tools/learning-path-tests/check-labs.cjs
      - name: Check nine-chapter hub and gateways
        run: node tools/learning-path-tests/check-hub.cjs
