name: One-shot Sommerville Ch2 After Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sommerville-ch2-after-deploy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: https://iscarb-lecture-studio.onrender.com
      SOURCE_URL: https://www.slideshare.net/slideshow/ian-sommerville-software-engineering-tenth-edition-pearson-education-limited-2016/287925972
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pypdf python-pptx
      - name: Compile exact source and capture all evidence
        run: |
          python - <<'PY'
          import json, os, pathlib, re, time, requests
          from pypdf import PdfReader
          from pptx import Presentation

          base=os.environ['BASE_URL'].rstrip('/')
          src=os.environ['SOURCE_URL']
          out=pathlib.Path('/tmp/ch2-after-deploy'); out.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-Ch2-After-Deploy-Audit/1.0'})

          h=s.get(base+'/api/health',timeout=90); h.raise_for_status(); health=h.json()
          (out/'health.json').write_text(json.dumps(health,indent=2),encoding='utf-8')
          print('HEALTH',json.dumps(health,sort_keys=True))
          assert str(health.get('version','')).startswith('4.3'), health

          r=s.post(base+'/api/compile',data={
            'primary_url':src,
            'supporting_urls':'',
            'lecture_focus':'Preserve the complete Chapter 2 Software Processes scope. Cover software process models, process activities, coping with change, and process improvement; retain source diagrams/tables where information-bearing; use CIMT learn-by-doing choreography without replacing source technical content. Make readiness evidence learner-visible only where an authentic student action/artifact demonstrates it.',
            'model':'auto',
            'repair_rounds':'2'
          },timeout=150)
          print('SUBMIT',r.status_code,r.text[:1000]); r.raise_for_status()
          job_id=r.json()['job_id']; print('JOB_ID',job_id)
          deadline=time.time()+1800; job=None
          while time.time()<deadline:
            rr=s.get(f'{base}/api/jobs/{job_id}',timeout=90); rr.raise_for_status(); job=rr.json()
            print('STATE',job.get('status'),job.get('progress'),(job.get('message') or '')[:500],flush=True)
            if job.get('status') in {'ready','blocked','error'}: break
            time.sleep(8)
          assert job and job.get('blueprint'), json.dumps(job)[:6000]
          (out/'job.json').write_text(json.dumps(job,indent=2),encoding='utf-8')
          assert job.get('status') in {'ready','blocked'}, job.get('status')

          bp=job['blueprint']; profile=job.get('source_profile') or {}
          units=bp.get('units') or []
          assert len(units)==20, len(units)
          assert bp.get('session_minutes')==90, bp.get('session_minutes')
          assert len(bp.get('clos') or [])==5

          families=' '.join(str(x.get('name') or '') for x in (profile.get('topic_families') or [])).lower()
          expected=['software process models','process activities','coping with change','process improvement']
          absent_families=[x for x in expected if x not in families]

          majors=[x for x in profile.get('coverage_items',[]) if str(x.get('importance','')).lower()=='major']
          ledger={x.get('coverage_id'):x for x in (bp.get('coverage_ledger') or []) if x.get('coverage_id')}
          missing=[x.get('id') for x in majors if x.get('id') not in ledger]
          late=[x.get('id') for x in majors if x.get('id') in ledger and int(ledger[x.get('id')].get('first_taught_unit') or 99)>15]
          polluted=[]
          for x in profile.get('coverage_items',[]):
            blob=(str(x.get('label') or '')+' '+str(x.get('source_anchor') or '')).lower()
            m=re.search(r'\bslide\s+(\d+)\b',blob)
            if 'recommended' in blob or (m and int(m.group(1))>58): polluted.append({'id':x.get('id'),'label':x.get('label'),'anchor':x.get('source_anchor')})

          unit_text=' '.join((str(u.get('title') or '')+' '+' '.join(map(str,u.get('core_content') or []))) for u in units).lower()
          required=['waterfall','incremental development','integration and configuration','requirements engineering','validation','software evolution','prototyp','incremental delivery','process improvement','capability maturity']
          absent_concepts=[x for x in required if x not in unit_text]

          readiness=bp.get('readiness_alignment') or []
          readiness_rows=[]
          for row in readiness:
            readiness_rows.append({
              'sku':row.get('sku'),'slo':row.get('slo'),'gku':row.get('gku'),'klo':row.get('klo'),
              'evidence_units':row.get('evidence_units'),'clo_ids':row.get('clo_ids'),
              'atomicity_evidence':row.get('atomicity_evidence'),'rationale':row.get('rationale')
            })

          endpoints={
            'presenter.html':f'/api/jobs/{job_id}/presenter',
            'presenter.pptx':f'/api/jobs/{job_id}/export/pptx',
            'presenter.pdf':f'/api/jobs/{job_id}/export/presenter-pdf',
            'reading.pdf':f'/api/jobs/{job_id}/export/pdf',
            'instructor.docx':f'/api/jobs/{job_id}/export/docx',
            'student.docx':f'/api/jobs/{job_id}/export/student',
            'blueprint.json':f'/api/jobs/{job_id}/export/json',
          }
          sizes={}
          for name,path in endpoints.items():
            x=s.get(base+path,timeout=240); print('EXPORT',name,x.status_code,len(x.content)); x.raise_for_status(); assert len(x.content)>500
            (out/name).write_bytes(x.content); sizes[name]=len(x.content)

          prs=Presentation(out/'presenter.pptx')
          pdf=PdfReader(str(out/'presenter.pdf'))
          assert len(prs.slides)==20
          assert len(pdf.pages)==20

          presenter_text='\n'.join((p.extract_text() or '') for p in pdf.pages)
          readiness_visible=bool(re.search(r'\b(readiness|SKU\s*\d|SLO\s*\d|ETEC)\b',presenter_text,re.I))
          ai_visible=bool(re.search(r'AI MAY ASSIST|HUMAN SIGN[- ]?OFF|MUST NOT BE TRUSTED AUTONOMOUSLY',presenter_text,re.I))
          falsification_visible=bool(re.search(r'falsif|abandon.*decision|evidence.*abandon',presenter_text,re.I))
          peer_visible=bool(re.search(r'peer critique|critique your peer|peer review',presenter_text,re.I))

          summary={
            'job_id':job_id,'status':job.get('status'),'message':job.get('message'),'health':health,
            'units':20,'minutes':90,'clos':5,
            'topic_families_absent':absent_families,
            'major_checkpoints':len(majors),'missing_major':missing,'late_major':late,
            'source_pollution_after_slide_58_or_recommended':polluted,
            'source_specific_absent':absent_concepts,
            'readiness_alignment_count':len(readiness),'readiness_alignment':readiness_rows,
            'readiness_visible_in_presenter':readiness_visible,
            'ai_audit_visible_in_presenter':ai_visible,
            'falsification_visible_in_presenter':falsification_visible,
            'peer_critique_visible_in_presenter':peer_visible,
            'presenter_pdf_pages':len(pdf.pages),'presenter_pptx_slides':len(prs.slides),'sizes':sizes
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print('SUMMARY',json.dumps(summary,indent=2))

          assert not absent_families, absent_families
          assert majors, 'no major source checkpoints'
          assert not missing, missing
          assert not late, late
          assert not polluted, polluted
          assert not absent_concepts, absent_concepts
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sommerville-ch2-after-deploy-evidence
          path: /tmp/ch2-after-deploy/*
          if-no-files-found: error
