name: One-shot Semantic Boundary v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-semantic-boundary-v6.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply app and regression patch
        run: |
          echo ' ' | tr -d ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Run full regression suite
        working-directory: iscarb-studio
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
      - name: Hygiene and commit tested repair
        run: |
          set -euo pipefail
          find iscarb-studio -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          ! git status --short | grep -E '\.pyc$|__pycache__' || exit 1
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          rm -f .github/workflows/one-shot-sommerville-ch2-after-deploy.yml \
                .github/workflows/one-shot-fetch-live-ch2-279f.yml \
                .github/workflows/one-shot-fix-semantic-slide-boundary.yml \
                .github/workflows/one-shot-semantic-boundary-v6.yml
          git add -A
          git commit -m 'Honor semantic source boundaries during SlideShare reconciliation'
          git push origin HEAD:main
