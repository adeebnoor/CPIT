name: ISCARB Diagnose Loading v715
on:
  push:
    paths:
      - '.github/workflows/iscarb-diagnose-loading-v715.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Audit parser resources and browser pending requests
        run: |
          set -euxo pipefail
          python -m pip install --quiet selenium requests beautifulsoup4 pillow
          python - <<'PY'
          import json,time,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin,urlparse
          BASE='https://iscarb-lecture-studio.onrender.com/'
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0 ISCARB-loading-diagnostic'
          t=time.time();r=s.get(BASE,timeout=15);print('HTML',r.status_code,len(r.content),round(time.time()-t,3),r.headers.get('content-type'))
          soup=BeautifulSoup(r.text,'html.parser')
          urls=[]
          for tag,attr in [('link','href'),('script','src'),('img','src'),('iframe','src'),('video','src'),('audio','src'),('source','src')]:
              for el in soup.find_all(tag):
                  u=el.get(attr)
                  if u and not u.startswith(('data:','javascript:','#')):
                      urls.append((tag,urljoin(BASE,u)))
          print('PARSER_RESOURCES',len(urls))
          for tag,u in urls:
              try:
                  t=time.time();rr=s.get(u,timeout=12,stream=True);body=rr.content
                  print('RESOURCE',tag,rr.status_code,len(body),round(time.time()-t,3),rr.headers.get('content-type'),u)
              except Exception as e: print('RESOURCE_ERR',tag,u,repr(e))
          PY
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.desired_capabilities import DesiredCapabilities
          opts=Options()
          opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-background-networking');opts.add_argument('--disable-sync');opts.add_argument('--disable-default-apps');opts.add_argument('--no-first-run');opts.add_argument('--disable-component-update')
          opts.add_argument('--window-size=1648,920')
          opts.set_capability('pageLoadStrategy','none')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=opts)
          d.get('https://iscarb-lecture-studio.onrender.com/')
          for sec in (2,5,10,15):
              time.sleep(sec-(0 if sec==2 else prev))
              prev=sec
              try:
                  state=d.execute_script('return document.readyState')
                  info=d.execute_script('''return (()=>{const a=document.querySelector('.heroArt'),cs=a?getComputedStyle(a):null,r=a?a.getBoundingClientRect():null;return {state:document.readyState,bg:cs&&cs.backgroundImage,rect:r&&[r.x,r.y,r.width,r.height],bodyH:document.body.scrollHeight,resources:performance.getEntriesByType('resource').map(x=>({name:x.name,initiatorType:x.initiatorType,duration:x.duration,transferSize:x.transferSize,responseEnd:x.responseEnd}))}})()''')
                  print('SNAPSHOT',sec,json.dumps(info))
              except Exception as e: print('SNAPSHOT_ERR',sec,repr(e))
          logs=d.get_log('performance')
          sent={};finished=set();failed={}
          for entry in logs:
              try:
                  m=json.loads(entry['message'])['message'];method=m['method'];p=m.get('params',{})
                  if method=='Network.requestWillBeSent':
                      sent[p['requestId']]={'url':p['request']['url'],'type':p.get('type'),'ts':p.get('timestamp')}
                  elif method=='Network.loadingFinished': finished.add(p['requestId'])
                  elif method=='Network.loadingFailed': failed[p['requestId']]=p
              except Exception: pass
          print('NETWORK_COUNTS',{'sent':len(sent),'finished':len(finished),'failed':len(failed)})
          for rid,v in sent.items():
              if rid not in finished:
                  print('PENDING_OR_FAILED',rid,v,'FAIL',failed.get(rid))
          print('BROWSER_LOGS')
          for x in d.get_log('browser'): print(x)
          d.save_screenshot('/tmp/selenium-live.png')
          from PIL import Image
          im=Image.open('/tmp/selenium-live.png').convert('RGB');crop=im.crop((780,180,1535,625));px=list(crop.getdata())
          orange=sum(1 for rr,g,b in px if rr>115 and 45<g<190 and b<105 and rr>g*1.15)
          magenta=sum(1 for rr,g,b in px if rr>145 and b>65 and g<105 and rr>g*1.5)
          bright=sum(1 for rr,g,b in px if max(rr,g,b)>120)
          print('PIXELS',{'orange':orange,'magenta':magenta,'bright':bright,'size':im.size})
          d.quit()
          PY
