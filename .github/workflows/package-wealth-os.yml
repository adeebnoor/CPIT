name: Package Wealth OS handoff

on:
  push:
    paths:
      - '.github/workflows/package-wealth-os.yml'
      - 'wealth-os/**'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create frontend archive
        run: zip -r wealth-os-frontend.zip wealth-os
      - name: Upload frontend archive
        uses: actions/upload-artifact@v4
        with:
          name: wealth-os-frontend
          path: wealth-os-frontend.zip
          retention-days: 7
