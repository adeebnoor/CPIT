name: One-off FBR boundary refinement
on:
  push:
    paths:
      - '.github/workflows/fbr-boundary-refinement.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Chapter 10 and 11 FBR boundary reasoning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[Path('lectures/iscarb/Ch10-FBR-Student-Assignment.html'),Path('lectures/iscarb/Ch11-FBR-Student-Assignment.html')]
          for p in files:
              s=p.read_text()
              reps=[
                ('<div class="hint"><b>BOUND ≠ EVIDENCE.</b> BOUND says when you must reopen the decision; EVIDENCE is what you inspect to know whether that condition is true.</div>',
                 '<div class="hint"><b>Write a real boundary — do not try to guess the hidden STRESS.</b> BOUND says when you must reopen the decision; EVIDENCE is what you inspect to know whether that condition is true.</div>'),
                ("function bData(){let o={refit:(document.querySelector('input[name=refit]:checked')||{}).value||''};B.forEach(x=>o[x]=$(x)?.value||'');return o}",
                 "function bData(){let o={boundaryState:(document.querySelector('input[name=boundaryState]:checked')||{}).value||'',refit:(document.querySelector('input[name=refit]:checked')||{}).value||''};B.forEach(x=>o[x]=$(x)?.value||'');return o}"),
                ("function valB(){let b=bData();if(!b.refit)return'Choose RETAIN, REVISE, or REPLACE.';",
                 "function valB(){let b=bData();if(!b.boundaryState)return'Classify the boundary as INTACT, UNDER PRESSURE, or CROSSED.';if(!b.refit)return'Choose RETAIN, REVISE, or REPLACE.';"),
                ('<section class="card refit"><div class="lab">B2 · REFIT</div><div class="choice"><label><input type="radio" name="refit" value="RETAIN">RETAIN</label><label><input type="radio" name="refit" value="REVISE">REVISE</label><label><input type="radio" name="refit" value="REPLACE">REPLACE</label></div><textarea id="refitwhy" placeholder="Did STRESS cross your boundary? Justify Retain / Revise / Replace."></textarea></section>',
                 '<section class="card refit"><div class="lab">B2 · BOUNDARY CHECK → REFIT</div><div>First judge what STRESS did to the boundary you committed. New information does <b>not</b> automatically require a new decision.</div><div class="choice"><label><input type="radio" name="boundaryState" value="INTACT">INTACT · fit still holds</label><label><input type="radio" name="boundaryState" value="PRESSURED">UNDER PRESSURE · margin/confidence weakened</label><label><input type="radio" name="boundaryState" value="CROSSED">CROSSED · applicability condition failed</label></div><div class="hint">This boundary check is not separately graded; it makes your REFIT reasoning inspectable. It does not mechanically determine RETAIN, REVISE, or REPLACE.</div><div class="choice"><label><input type="radio" name="refit" value="RETAIN">RETAIN</label><label><input type="radio" name="refit" value="REVISE">REVISE</label><label><input type="radio" name="refit" value="REPLACE">REPLACE</label></div><textarea id="refitwhy" placeholder="Explain the boundary status, then justify Retain / Revise / Replace. Do not change merely because STRESS appeared."></textarea></section>'),
                ("document.querySelectorAll('input[name=refit]').forEach(x=>x.addEventListener('change',()=>{schedule();exportState()}));if(S.refit)",
                 "document.querySelectorAll('input[name=boundaryState],input[name=refit]').forEach(x=>x.addEventListener('change',()=>{schedule();exportState()}));if(S.boundaryState){let q=document.querySelector('input[name=boundaryState][value=\"'+S.boundaryState+'\"]');if(q)q.checked=true}if(S.refit)"),
                ("return{...meta(),partA:S.lockedPartA||aData(),stress:S.stress,refit:b.refit,refitwhy:b.refitwhy,revised:b.revised,commitId:S.commitId,lockAt:S.lockAt,revealedAt:S.revealedAt}",
                 "return{...meta(),partA:S.lockedPartA||aData(),stress:S.stress,boundaryState:b.boundaryState,refit:b.refit,refitwhy:b.refitwhy,revised:b.revised,commitId:S.commitId,lockAt:S.lockAt,revealedAt:S.revealedAt}"),
                (r"## STRESS\n${s}\n\n## REFIT — ${d.refit||''}",
                 r"## STRESS\n${s}\n\n## Boundary status — ${d.boundaryState||''}\n\n## REFIT — ${d.refit||''}"),
                ('<h2>REFIT · ${esc(d.refit)}</h2>',
                 '<h2>Boundary status · ${esc(d.boundaryState||\'\')}</h2><h2>REFIT · ${esc(d.refit)}</h2>')
              ]
              for old,new in reps:
                  n=s.count(old)
                  if n!=1:
                      raise SystemExit(f'{p}: expected 1 match, found {n} for {old[:80]}')
                  s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          for f in ['lectures/iscarb/Ch10-FBR-Student-Assignment.html','lectures/iscarb/Ch11-FBR-Student-Assignment.html']:
              s=pathlib.Path(f).read_text(); m=re.search(r'<script>(.*)</script>',s,re.S)
              if not m: raise SystemExit(f'no script in {f}')
              pathlib.Path('/tmp/'+pathlib.Path(f).stem+'.js').write_text(m.group(1))
          PY
          node --check /tmp/Ch10-FBR-Student-Assignment.js
          node --check /tmp/Ch11-FBR-Student-Assignment.js
          grep -q 'BOUNDARY CHECK → REFIT' lectures/iscarb/Ch10-FBR-Student-Assignment.html
          grep -q 'BOUNDARY CHECK → REFIT' lectures/iscarb/Ch11-FBR-Student-Assignment.html
      - name: Commit refined assignments
        shell: bash
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add lectures/iscarb/Ch10-FBR-Student-Assignment.html lectures/iscarb/Ch11-FBR-Student-Assignment.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refine FBR boundary judgment in Chapters 10 and 11'
          git push
