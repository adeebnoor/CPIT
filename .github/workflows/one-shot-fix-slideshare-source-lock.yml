name: One-shot Fix SlideShare Source Lock

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-fix-slideshare-source-lock.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source profiling and final completeness safety
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('iscarb-studio/app/source_profile_fallback.py')
          s=p.read_text(encoding='utf-8')

          marker='def _doc_chunks(path: Path) -> list[tuple[int, str, str]]:\n'
          assert marker in s
          helpers=r'''def _embedded_slide_number(text: str) -> int | None:
              m = re.match(r"^\s*SLIDE\s+(\d+)\s*:", str(text or ""), flags=re.I)
              return int(m.group(1)) if m else None


          def _declared_slide_count(text: str) -> int | None:
              """Return the publisher/player-declared deck size before recommendation chrome."""
              head = re.split(r"\bRecommended\b", str(text or ""), maxsplit=1, flags=re.I)[0]
              patterns = (
                  r"\b1\s*/\s*(\d{1,4})\b",
                  r"\b(\d{1,4})\s+slides\b",
              )
              for pattern in patterns:
                  m = re.search(pattern, head, flags=re.I)
                  if m:
                      value = int(m.group(1))
                      if 2 <= value <= 500:
                          return value
              return None


          def _anchor_slides(anchor: str) -> set[int]:
              """Extract explicit P1 slide coordinates from semantic or deterministic anchors."""
              text = str(anchor or "")
              found: set[int] = set()
              for m in re.finditer(r"\bSLIDES?\s+(\d+)(?:\s*[-–—]\s*(\d+))?", text, flags=re.I):
                  start = int(m.group(1)); end = int(m.group(2) or start)
                  if end < start:
                      start, end = end, start
                  if end - start <= 200:
                      found.update(range(start, end + 1))
              return found


          '''
          helpers='\n'.join(line[10:] if line.startswith('          ') else line for line in helpers.splitlines())+'\n'
          s=s.replace(marker,helpers+marker,1)

          old='''def _doc_chunks(path: Path) -> list[tuple[int, str, str]]:
              # DOCX/TXT/MD have no reliable slide/page coordinate after extraction. Keep
              # deterministic numbered sections so every extracted source segment remains traceable.
              text = extract_source_text(path, limit=500_000)
              paras = [_clean(x, 520) for x in re.split(r"\\n{1,}", text) if _clean(x, 520)]
              out: list[tuple[int, str, str]] = []
              for i, para in enumerate(paras[:80], 1):
                  words = para.split()
                  label = _clean(" ".join(words[:12]), 110)
                  out.append((i, label, para))
              return out
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          new='''def _doc_chunks(path: Path) -> list[tuple[int, str, str]]:
              # DOCX/TXT/MD have no reliable page coordinate after extraction. Public
              # presentation pages may, however, embed authoritative `SLIDE n:` labels.
              # Respect the declared deck size so SlideShare `Recommended` cards cannot
              # become fake P1 checkpoints after the actual lecture ends.
              text = extract_source_text(path, limit=500_000)
              declared_slides = _declared_slide_count(text)
              paras = [_clean(x, 520) for x in re.split(r"\\n{1,}", text) if _clean(x, 520)]
              out: list[tuple[int, str, str]] = []
              for i, para in enumerate(paras[:160], 1):
                  if re.match(r"^recommended\\b", para, flags=re.I):
                      break
                  words = para.split()
                  label = _clean(" ".join(words[:12]), 110)
                  slide_no = _embedded_slide_number(label) or _embedded_slide_number(para)
                  if declared_slides and slide_no and slide_no > declared_slides:
                      continue
                  out.append((i, label, para))
              return out[:80]
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          assert old in s
          s=s.replace(old,new,1)

          old_support='''        "example", "ex;", "remember", "cautionary tale", "how to show this",
              )
              if page_no == 1 or any(m in low for m in support_markers):
                  return "supporting"
              blob = " ".join(lines[:18]).lower()
          '''
          old_support='\n'.join(line[10:] if line.startswith('          ') else line for line in old_support.splitlines())+'\n'
          new_support='''        "example", "ex;", "remember", "cautionary tale", "how to show this",
                  "topics covered", "key points",
              )
              slide_no = _embedded_slide_number(label)
              if page_no == 1 or slide_no == 1 or any(m in low for m in support_markers):
                  return "supporting"
              blob = " ".join(lines[:18]).lower()
              # URL materializers often flatten a title-only slide to one short paragraph.
              # Do not promote those navigation/title slides merely because their title
              # contains a technical word such as `process` or `testing`.
              if slide_no and len(blob.split()) < 24:
                  return "supporting"
          '''
          new_support='\n'.join(line[10:] if line.startswith('          ') else line for line in new_support.splitlines())+'\n'
          assert old_support in s
          s=s.replace(old_support,new_support,1)

          old_anchor='''        clean_label = _clean(label, 120) or f"Source {coordinate.title()} {idx}"
                  anchor = f"[P1] {coordinate} {idx}"
          '''
          old_anchor='\n'.join(line[10:] if line.startswith('          ') else line for line in old_anchor.splitlines())+'\n'
          new_anchor='''        clean_label = _clean(label, 120) or f"Source {coordinate.title()} {idx}"
                  embedded_slide = _embedded_slide_number(clean_label)
                  anchor = f"[P1] SLIDE {embedded_slide}" if embedded_slide else f"[P1] {coordinate} {idx}"
          '''
          new_anchor='\n'.join(line[10:] if line.startswith('          ') else line for line in new_anchor.splitlines())+'\n'
          assert old_anchor in s
          s=s.replace(old_anchor,new_anchor,1)

          old_reconcile='''    existing = {re.sub(r"[^a-z0-9]+", " ", x.label.lower()).strip() for x in ai_profile.coverage_items}
              merged = list(ai_profile.coverage_items)
              for item in deterministic.coverage_items:
                  if item.importance != "major":
                      continue
                  key = re.sub(r"[^a-z0-9]+", " ", item.label.lower()).strip()
                  if key and key not in existing:
                      merged.append(item)
                      existing.add(key)
          '''
          old_reconcile='\n'.join(line[10:] if line.startswith('          ') else line for line in old_reconcile.splitlines())+'\n'
          new_reconcile='''    existing = {re.sub(r"[^a-z0-9]+", " ", x.label.lower()).strip() for x in ai_profile.coverage_items}
              semantic_slides: set[int] = set()
              for row in ai_profile.coverage_items:
                  semantic_slides.update(_anchor_slides(row.source_anchor))
              merged = list(ai_profile.coverage_items)
              for item in deterministic.coverage_items:
                  if item.importance != "major":
                      continue
                  item_slides = _anchor_slides(item.source_anchor)
                  if item_slides and item_slides.issubset(semantic_slides):
                      continue
                  key = re.sub(r"[^a-z0-9]+", " ", item.label.lower()).strip()
                  if key and key not in existing:
                      merged.append(item)
                      existing.add(key)
                      semantic_slides.update(item_slides)
          '''
          new_reconcile='\n'.join(line[10:] if line.startswith('          ') else line for line in new_reconcile.splitlines())+'\n'
          assert old_reconcile in s
          s=s.replace(old_reconcile,new_reconcile,1)
          p.write_text(s,encoding='utf-8')

          p=Path('iscarb-studio/app/main.py'); s=p.read_text(encoding='utf-8')
          old='''        else:
              _update(job, "blocked", 100, "BLOCKED — Precision Gate found unresolved content issues. Preview and exports remain available for faculty review.")
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          new='''        else:
              # Major P1 completeness is non-negotiable even when Gemini remained
              # available through all repair rounds. Never preserve a semantically
              # polished but chapter-incomplete draft as the faculty review artifact.
              missing, late = _major_coverage_gaps(blueprint, profile)
              if missing or late:
                  gap_text = ", ".join(missing + late)
                  blueprint = build_deterministic_blueprint(profile)
                  blueprint = apply_90_minute_timebox(blueprint, profile, bundle)
                  checks = deterministic_gate(blueprint, profile, source_text)
                  checks.update(session_scope_gate(blueprint, profile, bundle))
                  audit = _deterministic_fallback_audit(
                      checks,
                      "Semantic repair rounds ended with unresolved major P1 coverage gaps; a deterministic source-complete review draft was substituted.",
                  )
                  job.blueprint = blueprint
                  job.deterministic_checks = checks
                  job.audit = audit
                  job.error = None
                  save_job(job)
                  _update(job, "blocked", 100, "BLOCKED — semantic repair exhausted with unresolved major P1 coverage gaps. The incomplete draft was replaced by a source-complete review draft covering every major P1 checkpoint by Unit 15. Readiness is UNVERIFIED; no RELEASE is issued. Recovered: " + gap_text)
              else:
                  _update(job, "blocked", 100, "BLOCKED — Precision Gate found unresolved content issues. Preview and exports remain available for faculty review.")
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Add permanent SlideShare regression tests
        run: |
          cat > iscarb-studio/tests/test_slideshare_source_lock.py <<'PY'
          import tempfile
          import unittest
          from pathlib import Path

          from app.models import CoverageItem, SourceProfile, TopicFamily
          from app.source_bundle import SourceBundle, SourceItem
          from app.source_profile_fallback import build_deterministic_source_profile, reconcile_source_profile


          class SlideShareSourceLockTests(unittest.TestCase):
              def _bundle(self):
                  td=tempfile.TemporaryDirectory(); self.addCleanup(td.cleanup)
                  p=Path(td.name)/'slideshare.txt'
                  p.write_text('''1 / 58\nSLIDE 1: Chapter 2 Software Processes\nSLIDE 3: The software process A structured set of activities required to develop a software system specification design implementation validation evolution process model abstract representation perspective\nSLIDE 7: Software process models waterfall incremental development integration and configuration plan-driven agile large systems combine elements from all models\nSLIDE 20: Process activities Real software processes are inter-leaved sequences of technical collaborative and managerial activities specification development validation evolution waterfall sequence incremental interleaving\nSLIDE 56: Key points Software processes are activities involved in producing a software system and general models include waterfall incremental and reuse-oriented development\nRecommended\nSLIDE 59: Ch2 SW Processes.pdf unrelated recommendation card software process models\nSLIDE 60: Another recommended presentation software process models\n''',encoding='utf-8')
                  return SourceBundle(items=[SourceItem('primary','P1','slideshare',p,'slideshare')],lecture_focus='',session_minutes=90)

              def _ai_profile(self):
                  return SourceProfile(
                      lecture_title='Chapter 2 Software Processes',course_or_level='SE',weekly_focus='Software Processes',
                      topic_families=[TopicFamily(name='Software process',source_anchor='[P1] SLIDE 3',why_important='core')],
                      coverage_items=[CoverageItem(id='COV-01',label='Software process definition and activities',knowledge_type='PROCESS',importance='major',source_anchor='[P1] SLIDE 3',why_important='core')],
                      technical_boundaries=[],source_warnings=[],session_minutes=90,scope_fit='FIT',in_scope_families=['Software process'],deferred_topics=[],source_conflicts=[],source_manifest=[])

              def test_declared_slide_count_excludes_recommendation_cards(self):
                  profile=build_deterministic_source_profile(self._bundle())
                  anchors=' '.join(x.source_anchor for x in profile.coverage_items)
                  labels=' '.join(x.label for x in profile.coverage_items)
                  self.assertNotIn('SLIDE 59',anchors)
                  self.assertNotIn('recommended presentation',labels.lower())

              def test_semantic_slide_anchor_suppresses_duplicate_raw_checkpoint(self):
                  profile=reconcile_source_profile(self._ai_profile(),self._bundle())
                  slide3=[x for x in profile.coverage_items if x.source_anchor=='[P1] SLIDE 3']
                  self.assertEqual(len(slide3),1)

              def test_uncovered_real_content_slide_is_reconciled_but_key_points_are_not_forced(self):
                  profile=reconcile_source_profile(self._ai_profile(),self._bundle())
                  majors=[x for x in profile.coverage_items if x.importance=='major']
                  anchors={x.source_anchor for x in majors}
                  self.assertIn('[P1] SLIDE 20',anchors)
                  self.assertNotIn('[P1] SLIDE 56',anchors)
                  self.assertFalse(any('SLIDE 59' in x.source_anchor for x in majors))


          if __name__=='__main__': unittest.main()
          PY

      - name: Install dependencies and run full regression suite
        working-directory: iscarb-studio
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app tests
          python -m unittest discover -s tests -v

      - name: Repository hygiene and diff check
        run: |
          set -euo pipefail
          find iscarb-studio -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          ! git status --short | grep -E '\.pyc$|__pycache__' || exit 1

      - name: Commit tested repair and remove temporary QA workflows
        run: |
          set -euo pipefail
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          rm -f .github/workflows/one-shot-slideshare-ch2-qa.yml .github/workflows/one-shot-fetch-ch2-job.yml .github/workflows/one-shot-fix-slideshare-source-lock.yml
          git add -A
          git commit -m 'Fix SlideShare source lock and enforce P1 completeness'
          git push origin HEAD:main
