name: Export Current CIMT Renderer

on:
  push:
    branches: ["fix/cimt-source-first-20260829"]
    paths:
      - '.github/workflows/export-current-cimt-renderer.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-cimt-renderer
          path: iscarb-studio/app/cimt_native_v43.py
          if-no-files-found: error
