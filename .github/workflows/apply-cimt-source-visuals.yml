name: Apply CIMT source visual priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cimt-source-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand information-bearing P1 visual usage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('iscarb-studio/app/source_visuals.py')
          s=p.read_text(encoding='utf-8')
          old='SOURCE_VISUAL_PRIORITY = {6, 7, 8, 9, 12, 13}'
          new='SOURCE_VISUAL_PRIORITY = {2, 4, 5, 6, 7, 8, 9, 10, 12, 13, 14}'
          if old not in s and new not in s:
              raise SystemExit('SOURCE_VISUAL_PRIORITY sentinel missing')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python -m py_compile iscarb-studio/app/source_visuals.py iscarb-studio/app/cimt_native_v43.py
      - name: Commit source visual policy
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add iscarb-studio/app/source_visuals.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prefer richer original CIMT lecture visuals'
          git push origin HEAD:main
