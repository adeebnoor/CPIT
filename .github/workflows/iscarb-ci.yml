name: ISCARB Faculty Studio CI

on:
  push:
    paths:
      - 'iscarb-studio/**'
      - '.github/workflows/iscarb-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r iscarb-studio/requirements.txt
      - name: Compile active application and tests
        run: python -m compileall -q iscarb-studio/app iscarb-studio/tests
      - name: Run active v4.3 regression suite
        env:
          PYTHONPATH: iscarb-studio
        run: python -m unittest discover -s iscarb-studio/tests -v
      - name: Smoke active v4.3 runtime and public services
        env:
          PYTHONPATH: iscarb-studio
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.start_v430 import app

          client = TestClient(app)
          home = client.get('/')
          assert home.status_code == 200, home.text
          assert 'ISCARB Faculty Studio · CIMT+ Computing' in home.text
          assert 'v4.3.0' in home.text

          health = client.get('/api/health')
          assert health.status_code == 200
          h = health.json()
          assert h['version'] == '4.3.0', h
          assert h['presenter_exact_units'] == 20
          assert h['session_minutes'] == 90
          assert h['deterministic_gate'].startswith('v14')
          assert h['visual_lecture_engine'] == 'CIMT+ v4.3'
          assert h['hero_delivery'] == 'css-native-no-asset'
          assert h['hero_static_dependency'] is False
          assert h['capacity_retry_attempts_per_model'] == 3
          assert h['capacity_failover'] is True
          assert h['source_library_verified'] is True
          assert h['verified_source_count'] == 8
          assert h['source_visual_primary'] == 'uploaded-p1-pdf'
          assert set(h['navigation_qa']) == {'home','sources','upgrade','outputs','guides','about'}

          for path in ('/starter-kit', '/openapi.json', '/docs', '/redoc'):
              r = client.get(path)
              assert r.status_code == 200, (path, r.status_code)
          assert client.post('/api/compile', data={}).status_code == 400
          assert client.get('/api/jobs/not-a-real-job').status_code == 404
          assert client.get('/api/jobs/not-a-real-job/presenter').status_code == 404
          assert client.get('/api/jobs/not-a-real-job/export/pptx').status_code == 404
          print('Active ISCARB v4.3 runtime smoke PASS')
          PY
      - name: Capacity retry — recover after transient 503s
        env:
          PYTHONPATH: iscarb-studio
        run: |
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from pydantic import BaseModel
          from app.gemini_service import GeminiService, MAX_TRANSIENT_ATTEMPTS

          class TinyResult(BaseModel):
              ok: bool
          class DummyConfig:
              def __init__(self, **kwargs): self.kwargs = kwargs
          class FakeTypes:
              GenerateContentConfig = DummyConfig
              ThinkingConfig = DummyConfig
          class FakeModels:
              def __init__(self): self.calls = 0
              def generate_content(self, **kwargs):
                  self.calls += 1
                  if self.calls < 3:
                      raise RuntimeError('503 UNAVAILABLE high demand')
                  return SimpleNamespace(text='{"ok": true}')

          fake = FakeModels()
          service = object.__new__(GeminiService)
          service.model = 'test-model'
          service.api_key = 'ci'
          service._types = FakeTypes
          service.client = SimpleNamespace(models=fake)
          service._uploaded = {}
          service.active_model = ''
          service._backoff = lambda attempt: None
          source = Path('/tmp/iscarb-capacity-source.txt')
          source.write_text('Dependable systems source text', encoding='utf-8')
          item = SimpleNamespace(label='P1', source_id='P1', path=source)
          bundle = SimpleNamespace(items=[item], manifest_text=lambda: '[P1] PRIMARY: capacity-test')
          result = service._generate_structured(bundle=bundle, prompt='Return ok true.', schema=TinyResult, preferred_model='test-model', thinking_level='minimal')
          assert result.ok is True
          assert fake.calls == 3
          assert MAX_TRANSIENT_ATTEMPTS == 3
          print('Capacity retry PASS: recovered on attempt 3')
          PY
