name: ISCARB Browser Proof v716
on:
  push:
    paths:
      - '.github/workflows/iscarb-browser-proof-v716.yml'
      - 'iscarb-studio/app/home_v670.py'
      - 'iscarb-studio/app/static/site_v701_i18n.js'
      - 'iscarb-studio/app/static/studio_v440.js'
      - 'iscarb-studio/smoke_prod.py'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Chromium proof dependencies
        run: |
          set -euxo pipefail
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      - name: Wake production service
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/iscarb_health.json -w '%{http_code}' --max-time 20 https://iscarb-lecture-studio.onrender.com/api/health || true)
            if [ "$code" = "200" ]; then
              cat /tmp/iscarb_health.json
              exit 0
            fi
            sleep 2
          done
          echo 'Production health endpoint did not become ready'
          cat /tmp/iscarb_health.json || true
          exit 1

      - name: Prove settled homepage and visible hero in real Chromium
        run: |
          set -euxo pipefail
          python - <<'PY'
          import asyncio, json, time
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright

          BASE = 'https://iscarb-lecture-studio.onrender.com/'
          OUT = Path('/tmp/iscarb_browser_proof')
          OUT.mkdir(parents=True, exist_ok=True)

          async def prove(stale=False):
              label = 'stale' if stale else 'clean'
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox', '--disable-dev-shm-usage', '--disable-background-networking',
                            '--disable-sync', '--disable-default-apps', '--no-first-run', '--disable-component-update'],
                  )
                  context = await browser.new_context(viewport={'width': 1648, 'height': 920}, device_scale_factor=1)
                  if stale:
                      await context.add_init_script("localStorage.setItem('iscarb.job.v44','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa')")
                  page = await context.new_page()
                  requests, responses, page_errors = [], [], []
                  page.on('request', lambda r: requests.append(r.url))
                  page.on('response', lambda r: responses.append((r.url, r.status, r.headers.get('content-type', ''))))
                  page.on('pageerror', lambda e: page_errors.append(str(e)))

                  started = time.monotonic()
                  nav = await page.goto(BASE, wait_until='domcontentloaded', timeout=45000)
                  dom_seconds = time.monotonic() - started
                  assert nav and nav.status == 200, f'{label}: navigation failed'
                  await page.wait_for_function("document.readyState === 'complete'", timeout=30000)
                  await page.wait_for_timeout(2000)

                  ready_state = await page.evaluate('document.readyState')
                  hero = page.locator('.heroArt')
                  await hero.wait_for(state='visible', timeout=15000)
                  hero_bg = await hero.evaluate("e => getComputedStyle(e).backgroundImage")
                  hero_box = await hero.bounding_box()
                  assert hero_box, f'{label}: hero has no visible box'

                  body_text = await page.locator('body').inner_text()
                  transient = [s for s in ['⏳ Loading...', 'Loading history…', 'Loading details…'] if s in body_text]
                  api_job_requests = [u for u in requests if '/api/jobs/' in u]
                  hero_responses = [x for x in responses if 'hero_user_web.jpg' in x[0]]

                  screenshot = OUT / f'{label}.png'
                  await page.screenshot(path=str(screenshot), full_page=True)
                  html = await page.content()
                  (OUT / f'{label}.html').write_text(html, encoding='utf-8')

                  image = Image.open(screenshot).convert('RGB')
                  x0 = max(0, int(hero_box['x']))
                  y0 = max(0, int(hero_box['y']))
                  x1 = min(image.width, int(hero_box['x'] + hero_box['width']))
                  y1 = min(image.height, int(hero_box['y'] + hero_box['height']))
                  crop = image.crop((x0, y0, x1, y1))
                  crop.save(OUT / f'{label}_hero.png')
                  pixels = list(crop.getdata())
                  orange = sum(1 for r,g,b in pixels if r > 115 and 45 < g < 190 and b < 105 and r > g * 1.15)
                  magenta = sum(1 for r,g,b in pixels if r > 145 and b > 65 and g < 105 and r > g * 1.5)
                  bright = sum(1 for r,g,b in pixels if max(r,g,b) > 120)
                  avg_luma = sum(0.2126*r + 0.7152*g + 0.0722*b for r,g,b in pixels) / max(1, len(pixels))

                  result = {
                      'stale': stale,
                      'dom_seconds': round(dom_seconds, 3),
                      'readyState': ready_state,
                      'title': await page.title(),
                      'heroBackground': hero_bg,
                      'heroBox': hero_box,
                      'heroResponses': hero_responses,
                      'transientStates': transient,
                      'apiJobRequests': api_job_requests,
                      'pageErrors': page_errors,
                      'orangePixels': orange,
                      'magentaPixels': magenta,
                      'brightPixels': bright,
                      'avgLuma': round(avg_luma, 2),
                  }
                  (OUT / f'{label}_result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
                  print('BROWSER_RESULT', json.dumps(result), flush=True)

                  assert ready_state == 'complete', result
                  assert dom_seconds < 10, result
                  assert 'hero_user_web.jpg?v=7.1.6' in hero_bg, result
                  assert hero_responses and any(status == 200 and ctype.startswith('image/') for _, status, ctype in hero_responses), result
                  assert not transient, result
                  assert not page_errors, result
                  assert orange > 5000 and magenta > 300 and bright > 15000 and avg_luma > 20, result
                  if stale:
                      assert not api_job_requests, 'Saved job triggered API polling on initial load: ' + repr(api_job_requests)

                  await browser.close()
                  return result

          async def main():
              clean = await prove(False)
              stale = await prove(True)
              (OUT / 'results.json').write_text(json.dumps({'clean': clean, 'stale': stale}, indent=2), encoding='utf-8')
              print('V716_REAL_CHROMIUM_VISUAL_PASS')

          asyncio.run(main())
          PY

      - name: Upload Chromium screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscarb-browser-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/iscarb_browser_proof/
          if-no-files-found: error
          retention-days: 14
