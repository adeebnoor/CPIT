name: ISCARB Browser Proof v716
on:
  push:
    paths:
      - '.github/workflows/iscarb-browser-proof-v716.yml'
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Prove DOM ready, no auto resume request, and visible hero in Chrome
        run: |
          set -euxo pipefail
          python -m pip install --quiet playwright pillow
          python - <<'PY'
          import asyncio,json,time
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright
          BASE='https://iscarb-lecture-studio.onrender.com/'
          async def one(stale=False):
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage','--disable-background-networking','--disable-sync','--disable-default-apps','--no-first-run','--disable-component-update'])
                  context=await browser.new_context(viewport={'width':1648,'height':920})
                  if stale:
                      await context.add_init_script("localStorage.setItem('iscarb.job.v44','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa')")
                  page=await context.new_page()
                  requests=[]
                  page.on('request',lambda r: requests.append(r.url))
                  errs=[]
                  page.on('pageerror',lambda e: errs.append(str(e)))
                  t=time.monotonic()
                  await page.goto(BASE,wait_until='domcontentloaded',timeout=20000)
                  dom_dt=time.monotonic()-t
                  await page.wait_for_timeout(3500)
                  state=await page.evaluate('document.readyState')
                  ui=await page.locator('.version').inner_text()
                  bg=await page.locator('.heroArt').evaluate("e=>getComputedStyle(e).backgroundImage")
                  status_visible=await page.locator('#status').is_visible()
                  state_text=await page.locator('#state').inner_text() if status_visible else ''
                  api_job=[u for u in requests if '/api/jobs/' in u]
                  path=Path('/tmp/stale.png' if stale else '/tmp/clean.png')
                  await page.screenshot(path=str(path),full_page=False)
                  await browser.close()
                  im=Image.open(path).convert('RGB')
                  crop=im.crop((780,180,1535,625)); px=list(crop.getdata())
                  orange=sum(1 for r,g,b in px if r>115 and 45<g<190 and b<105 and r>g*1.15)
                  magenta=sum(1 for r,g,b in px if r>145 and b>65 and g<105 and r>g*1.5)
                  bright=sum(1 for r,g,b in px if max(r,g,b)>120)
                  result={'stale':stale,'dom_seconds':round(dom_dt,3),'readyState':state,'ui':ui,'bg':bg,'status_visible':status_visible,'state_text':state_text,'api_job_requests':api_job,'page_errors':errs,'orange':orange,'magenta':magenta,'bright':bright}
                  print('BROWSER_RESULT',json.dumps(result),flush=True)
                  assert dom_dt<10, result
                  assert state in ('interactive','complete'), result
                  assert '7.1.6' in ui, result
                  assert 'hero_user_web.jpg?v=7.1.6' in bg, result
                  assert orange>5000 and magenta>300 and bright>15000, result
                  if stale:
                      assert not api_job, 'Saved job triggered API polling on initial load: '+repr(api_job)
                      assert state_text=='PAUSED', result
                  return result
          async def main():
              await one(False)
              await one(True)
              print('V716_REAL_BROWSER_PASS')
          asyncio.run(main())
          PY
