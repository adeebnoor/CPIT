name: ISCARB Browser Proof v716
on:
  push:
    paths:
      - '.github/workflows/iscarb-browser-proof-v716.yml'
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chromium proof dependencies
        run: |
          set -euxo pipefail
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
      - name: Wake production service
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/iscarb_health.json -w '%{http_code}' --max-time 20 https://iscarb-lecture-studio.onrender.com/api/health || true)
            if [ "$code" = "200" ]; then
              cat /tmp/iscarb_health.json
              exit 0
            fi
            sleep 2
          done
          echo 'Production health endpoint did not become ready'
          cat /tmp/iscarb_health.json || true
          exit 1
      - name: Prove DOM ready, terminal load state, and visible hero in Chromium
        run: |
          set -euxo pipefail
          python - <<'PY'
          import asyncio,json,time,traceback
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright
          BASE='https://iscarb-lecture-studio.onrender.com/'
          OUT=Path('/tmp/iscarb_browser_proof')
          OUT.mkdir(parents=True,exist_ok=True)
          async def one(stale=False):
              label='stale' if stale else 'clean'
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--disable-background-networking','--disable-sync','--disable-default-apps','--no-first-run','--disable-component-update'])
                  context=await browser.new_context(viewport={'width':1648,'height':920},device_scale_factor=1)
                  if stale:
                      await context.add_init_script("localStorage.setItem('iscarb.job.v44','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa')")
                  page=await context.new_page()
                  requests=[]; responses=[]; errs=[]
                  page.on('request',lambda r: requests.append(r.url))
                  page.on('response',lambda r: responses.append((r.url,r.status,r.headers.get('content-type',''))))
                  page.on('pageerror',lambda e: errs.append(str(e)))
                  result={'stale':stale}
                  try:
                      t=time.monotonic()
                      nav=await page.goto(BASE,wait_until='domcontentloaded',timeout=45000)
                      dom_dt=time.monotonic()-t
                      result.update({'navigationStatus':nav.status if nav else None,'finalUrl':page.url,'dom_seconds':round(dom_dt,3),'title':await page.title()})
                      await page.screenshot(path=str(OUT/f'{label}_landing.png'),full_page=True)
                      (OUT/f'{label}_landing.html').write_text(await page.content(),encoding='utf-8')
                      result['bodyExcerpt']=(await page.locator('body').inner_text())[:1200]
                      (OUT/f'{label}_diagnostic.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
                      assert nav and nav.status==200, result
                      await page.wait_for_selector('.heroArt',state='visible',timeout=60000)
                      await page.wait_for_function("document.readyState === 'complete'",timeout=30000)
                      await page.wait_for_timeout(3500)
                      state=await page.evaluate('document.readyState')
                      ui=await page.locator('.version').inner_text()
                      hero=page.locator('.heroArt')
                      bg=await hero.evaluate("e=>getComputedStyle(e).backgroundImage")
                      status_visible=await page.locator('#status').is_visible()
                      state_text=await page.locator('#state').inner_text() if status_visible else ''
                      body_text=await page.locator('body').inner_text()
                      transient=[s for s in ['⏳ Loading...','Loading history…','Loading details…'] if s in body_text]
                      api_job=[u for u in requests if '/api/jobs/' in u]
                      hero_resp=[x for x in responses if 'hero_user_web.jpg' in x[0]]
                      box=await hero.bounding_box()
                      path=OUT/f'{label}.png'
                      await page.screenshot(path=str(path),full_page=True)
                      im=Image.open(path).convert('RGB')
                      if not box:
                          raise AssertionError('Hero has no bounding box')
                      x0=max(0,int(box['x'])); y0=max(0,int(box['y']))
                      x1=min(im.width,int(box['x']+box['width'])); y1=min(im.height,int(box['y']+box['height']))
                      crop=im.crop((x0,y0,x1,y1)); crop.save(OUT/f'{label}_hero.png')
                      px=list(crop.getdata())
                      orange=sum(1 for r,g,b in px if r>115 and 45<g<190 and b<105 and r>g*1.15)
                      magenta=sum(1 for r,g,b in px if r>145 and b>65 and g<105 and r>g*1.5)
                      bright=sum(1 for r,g,b in px if max(r,g,b)>120)
                      avg_luma=sum((0.2126*r+0.7152*g+0.0722*b) for r,g,b in px)/max(1,len(px))
                      result.update({'readyState':state,'ui':ui,'bg':bg,'status_visible':status_visible,'state_text':state_text,'transientStates':transient,'api_job_requests':api_job,'page_errors':errs,'heroResponses':hero_resp,'heroBox':box,'orange':orange,'magenta':magenta,'bright':bright,'avgLuma':round(avg_luma,2)})
                      (OUT/f'{label}_diagnostic.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
                      print('BROWSER_RESULT',json.dumps(result),flush=True)
                      assert dom_dt<10, result
                      assert state=='complete', result
                      assert '7.1.6' in ui, result
                      assert 'hero_user_web.jpg?v=7.1.6' in bg, result
                      assert hero_resp and any(status==200 and ctype.startswith('image/') for _,status,ctype in hero_resp), result
                      assert not transient, result
                      assert orange>5000 and magenta>300 and bright>15000 and avg_luma>35, result
                      assert not errs, result
                      if stale:
                          assert not api_job, 'Saved job triggered API polling on initial load: '+repr(api_job)
                          assert state_text=='PAUSED', result
                      return result
                  except Exception as exc:
                      result['error']=repr(exc)
                      result['traceback']=traceback.format_exc()
                      try:
                          await page.screenshot(path=str(OUT/f'{label}_failure.png'),full_page=True)
                          (OUT/f'{label}_failure.html').write_text(await page.content(),encoding='utf-8')
                          result['bodyExcerpt']=(await page.locator('body').inner_text())[:2000]
                      except Exception as diag_exc:
                          result['diagnosticError']=repr(diag_exc)
                      (OUT/f'{label}_diagnostic.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
                      raise
                  finally:
                      await browser.close()
          async def main():
              clean=await one(False)
              stale=await one(True)
              (OUT/'results.json').write_text(json.dumps({'clean':clean,'stale':stale},indent=2),encoding='utf-8')
              print('V716_REAL_CHROMIUM_VISUAL_PASS')
          asyncio.run(main())
          PY
      - name: Upload Chromium screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscarb-browser-proof-${{ github.run_id }}
          path: /tmp/iscarb_browser_proof/
          if-no-files-found: error
          retention-days: 14
