name: ISCARB Week1 Authoritative P1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iscarb-week1-authoritative-p1.yml'

permissions:
  contents: read

jobs:
  week1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install production proof tools
        run: |
          set -euxo pipefail
          python -m pip install --quiet requests playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils
          mkdir -p /tmp/week1_authoritative

      - name: Recover exact authoritative P1 from short-lived share
        run: |
          python - <<'PY'
          import asyncio, hashlib, re, requests
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright
          SHARE='https://firestorage.ai/ja/f/nzVd-opE587r'
          EXPECTED='0ab1247275f0097017e558489ec5bb511e57cfa3dab138a3ab64bf12d0d42363'
          OUT=Path('/tmp/week1_authoritative/CPIT455_Elite_Kickoff.pptx')

          def accept(data):
              if data[:2] != b'PK': return False
              if hashlib.sha256(data).hexdigest() != EXPECTED: return False
              OUT.write_bytes(data); return True

          s=requests.Session(); r=s.get(SHARE,timeout=30); r.raise_for_status()
          Path('/tmp/week1_authoritative/share.html').write_text(r.text,encoding='utf-8')
          hrefs=re.findall(r'''(?:href|src)=["']([^"']+)["']''',r.text,re.I)
          for href in hrefs:
              u=urljoin(SHARE,href)
              if any(k in u.lower() for k in ('download','.pptx','file')):
                  try:
                      rr=s.get(u,timeout=30,allow_redirects=True)
                      if accept(rr.content): raise SystemExit(0)
                  except SystemExit: raise
                  except Exception: pass

          async def browser_fallback():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await b.new_page()
                  await page.goto(SHARE,wait_until='networkidle',timeout=60000)
                  # Try direct anchors first.
                  for a in await page.locator('a[href]').all():
                      try:
                          href=await a.get_attribute('href')
                          if not href: continue
                          u=urljoin(SHARE,href)
                          if any(k in u.lower() for k in ('download','.pptx','file')):
                              rr=await page.request.get(u,timeout=30000)
                              if rr.ok and accept(await rr.body()):
                                  await b.close(); return True
                      except Exception: pass
                  # Then attempt a normal user download from the file card / download control.
                  targets=[]
                  for txt in ['CPIT455_Elite_Kickoff.pptx','ダウンロード','Download','download']:
                      targets.append(page.get_by_text(txt,exact=False).first)
                  for target in targets:
                      try:
                          if await target.count() and await target.is_visible():
                              async with page.expect_download(timeout=12000) as di:
                                  await target.click()
                              d=await di.value
                              data=Path(await d.path()).read_bytes()
                              if accept(data): await b.close(); return True
                      except Exception: pass
                  # One last pass over buttons.
                  for btn in await page.locator('button').all():
                      try:
                          txt=(await btn.inner_text()).lower()
                          if 'download' in txt or 'ダウンロード' in txt:
                              async with page.expect_download(timeout=12000) as di:
                                  await btn.click()
                              data=Path(await (await di.value).path()).read_bytes()
                              if accept(data): await b.close(); return True
                      except Exception: pass
                  await page.screenshot(path='/tmp/week1_authoritative/share_page.png',full_page=True)
                  await b.close(); return False
          ok=asyncio.run(browser_fallback())
          if not ok: raise SystemExit('Could not recover exact authoritative P1 from share')
          PY

      - name: Compile exact uploaded P1 through live ISCARB
        run: |
          python - <<'PY'
          import json,time,zipfile,requests
          from io import BytesIO
          from pathlib import Path
          base='https://iscarb-lecture-studio.onrender.com'
          h=requests.get(base+'/api/health',timeout=30).json()
          assert h.get('release_ui')=='7.2.2' and h.get('clean_release') is True,h
          src=Path('/tmp/week1_authoritative/CPIT455_Elite_Kickoff.pptx')
          with src.open('rb') as f:
              r=requests.post(base+'/api/compile',files={'primary_lecture':(src.name,f,'application/vnd.openxmlformats-officedocument.presentationml.presentation')},data={'primary_url':'','supporting_urls':'','lecture_focus':'CPIT-455 Week 1 — Elite Kickoff: engineering decisions, ISCARB flow, professional standards, AI literacy, assessment, roadmap and logistics','model':'source-only','repair_rounds':'0','free_tier_confirmed':'false'},timeout=60)
          r.raise_for_status(); jid=r.json()['job_id']
          for _ in range(120):
              job=requests.get(f'{base}/api/jobs/{jid}',timeout=30).json()
              if job.get('status') in {'ready','blocked','error'}: break
              time.sleep(2)
          assert job.get('status') in {'ready','blocked'} and not job.get('error'),job
          bp=job['blueprint']; assert len(bp['units'])==20
          blob=json.dumps(bp).lower()
          # Preserve the P1's real identity and remove known bad residues.
          for must in ['iscarb','ai','grade','roadmap']:
              assert must in blob,must
          for bad in ['second amendment','down syndrome','slideshare','a team must make a consequential decision','review required','gold standard mechanism']:
              assert bad not in blob,bad
          assert sum('think–pair–share' in u['student_action'].lower() for u in bp['units'])==5
          assert sum('core in-class case' in u['student_action'].lower() for u in bp['units'])==2
          assert sum('post-class artifact' in u['student_action'].lower() for u in bp['units'])==4
          out=Path('/tmp/week1_authoritative')
          for fmt,name in [('pptx','week1_elite_iscarb.pptx'),('presenter-pdf','week1_elite_iscarb.pdf'),('pdf','week1_elite_faculty_pack.pdf'),('docx','week1_elite_instructor_guide.docx'),('student','week1_elite_student_pack.docx'),('json','week1_elite_blueprint.json')]:
              rr=requests.get(f'{base}/api/jobs/{jid}/export/{fmt}',timeout=180); rr.raise_for_status(); (out/name).write_bytes(rr.content)
          with zipfile.ZipFile(BytesIO((out/'week1_elite_iscarb.pptx').read_bytes())) as z:
              assert 'ppt/presentation.xml' in z.namelist()
              slides=[n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              assert 22<=len(slides)<=30,len(slides)
          (out/'job.json').write_text(json.dumps(job,indent=2),encoding='utf-8')
          (out/'job_id.txt').write_text(jid)
          PY

      - name: Render PowerPoint and visually police output
        run: |
          set -euxo pipefail
          cd /tmp/week1_authoritative
          mkdir -p rendered lo
          timeout 120s libreoffice --headless -env:UserInstallation='file:///tmp/week1_authoritative/lo' --convert-to pdf --outdir rendered week1_elite_iscarb.pptx
          pdftoppm -png -r 110 rendered/week1_elite_iscarb.pdf rendered/slide >/dev/null 2>&1
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageStat
          from pathlib import Path
          imgs=sorted(Path('/tmp/week1_authoritative/rendered').glob('slide-*.png'))
          assert 22<=len(imgs)<=30,len(imgs)
          thumbs=[]
          for p in imgs:
              im=Image.open(p).convert('RGB'); assert max(ImageStat.Stat(im).var)>2,p
              im.thumbnail((480,270)); thumbs.append((p.name,im.copy()))
          cols=4; rows=(len(thumbs)+3)//4
          sheet=Image.new('RGB',(cols*500,rows*300),'white'); d=ImageDraw.Draw(sheet)
          for i,(name,im) in enumerate(thumbs):
              x=(i%4)*500;y=(i//4)*300;sheet.paste(im,(x,y+24));d.text((x+4,y+4),name,fill='black')
          sheet.save('/tmp/week1_authoritative/week1_elite_contact_sheet.jpg',quality=92)
          PY

      - name: Chromium presenter proof
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
              jid=Path('/tmp/week1_authoritative/job_id.txt').read_text().strip()
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await b.new_page(viewport={'width':1600,'height':1000}); errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  page.on('console',lambda m: errors.append(m.text) if m.type=='error' else None)
                  r=await page.goto(f'https://iscarb-lecture-studio.onrender.com/api/jobs/{jid}/presenter',wait_until='networkidle',timeout=60000); assert r and r.status==200
                  text=(await page.locator('body').inner_text()).lower()
                  for bad in ['review required','gold standard mechanism','second amendment','down syndrome','your task']:
                      assert bad not in text,bad
                  assert not errors,errors
                  await page.screenshot(path='/tmp/week1_authoritative/week1_elite_presenter.png',full_page=True)
                  await b.close()
          asyncio.run(main())
          PY

      - name: Upload authoritative week-one evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscarb-week1-authoritative-${{ github.run_id }}
          path: /tmp/week1_authoritative/
          if-no-files-found: warn
          retention-days: 14
