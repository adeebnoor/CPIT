name: Verify iSCARB offline downloads
on:
  push:
    paths: ['.github/workflows/offline-download-repair.yml']
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iscarb-offline-live-check
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and assignment integrity
        run: python tools/audit_classroom.py
      - name: Wait for the corrected download links on the public course
        run: |
          mkdir -p test-results/offline-downloads
          python - <<'PY'
          import hashlib,time,urllib.request,json
          from pathlib import Path
          expected={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in ['iscarb.html','student-guide.html']}
          records=[]
          for attempt in range(30):
              records=[]
              for name,digest in expected.items():
                  try:
                      req=urllib.request.Request('https://adeebnoor.github.io/CPIT/'+name+'?verify-offline='+str(int(time.time())),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as r:data=r.read()
                      actual=hashlib.sha256(data).hexdigest()
                      records.append({'file':name,'expected':digest,'actual':actual,'match':actual==digest})
                  except Exception as e:records.append({'file':name,'match':False,'error':str(e)})
              if all(x['match'] for x in records):break
              time.sleep(5)
          assert all(x['match'] for x in records),records
          Path('test-results/offline-downloads/live-hub-verification.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Install clean test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise public download buttons, then the extracted local files with networking disabled
        env:
          COURSE_BASE_URL: https://adeebnoor.github.io/CPIT/
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/check_offline_downloads.py');s=p.read_text()
          old="await page.evaluate('iscarb.go(3)')\n    await page.screenshot"
          new="await page.evaluate('iscarb.go(3)')\n    await loaded_images(page)\n    await page.wait_for_timeout(150)\n    await page.screenshot"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          set -o pipefail
          python -u tools/check_offline_downloads.py 2>&1 | tee test-results/offline-downloads/live.log
          git rev-parse HEAD > test-results/offline-downloads/VERIFIED_COMMIT.txt
      - name: Preserve live download and offline browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscarb-live-offline-download-proof
          path: test-results/offline-downloads/
          retention-days: 14
