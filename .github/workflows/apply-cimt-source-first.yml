name: Apply CIMT Source-First Repair

on:
  push:
    branches: ["fix/cimt-source-first-20260829"]
    paths:
      - '.github/workflows/apply-cimt-source-first.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cimt-source-first-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble and verify patch
        run: |
          cat tools/.cimt_patch/part* > /tmp/cimt-source-first.patch
          echo '05c0d46501d074aa4a39e5e3bd9a1f651b1e066d05698a084341ac852f260247  /tmp/cimt-source-first.patch' | sha256sum -c -
          git apply --check /tmp/cimt-source-first.patch
          git apply /tmp/cimt-source-first.patch
      - name: Install runtime and test dependencies
        run: python -m pip install -r iscarb-studio/requirements.txt
      - name: Compile and run full regression suite
        working-directory: iscarb-studio
        run: |
          python -m compileall app tests
          python -m unittest discover -s tests -v
      - name: Remove temporary repair tooling
        run: |
          rm -rf tools/.cimt_patch
          rm -f .github/workflows/apply-cimt-source-first.yml
          rm -f .github/workflows/export-current-cimt-renderer.yml
          rm -f .github/workflows/iscarb-pull-user-job.yml
      - name: Commit validated repair to feature branch
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add -A
          git commit -m 'Make CIMT presenter source-first and content-driven'
          git push origin HEAD:fix/cimt-source-first-20260829
