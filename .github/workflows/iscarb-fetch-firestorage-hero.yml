name: ISCARB Fetch Firestorage Hero
on:
  push:
    paths:
      - '.github/workflows/iscarb-fetch-firestorage-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Firestorage download endpoint
        env:
          SHARE_URL: https://firestorage.ai/ja/f/6NWUusWQ8b4R
          EXPECTED_SHA256: 8967fa14fe910e5831531a6b74c64bcd650c965ad691697dd2d705d450b6e50d
        run: |
          pip install requests
          python - <<'PY'
          import os,re,requests,hashlib,json
          from pathlib import Path
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          share=os.environ['SHARE_URL']; expected=os.environ['EXPECTED_SHA256']
          page=s.get(share,timeout=30).text
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          target=None
          for src in scripts:
              u=urljoin(share,src)
              txt=s.get(u,timeout=30).text
              if '/files/${e.fileId}/download' in txt or '/files/${i.fileId}/download' in txt:
                  target=txt; print('CLIENT_SCRIPT',u,'LEN',len(txt)); break
          if not target: raise SystemExit('download client script not found')
          needles=['let f=','const f=','shareEndpoint','/files?maxResults=1000','/files/${e.fileId}/download','function q(','window.location.pathname','api.firestorage.ai/prod/file']
          for needle in needles:
              start=0
              while True:
                  p=target.find(needle,start)
                  if p<0: break
                  print('\n===',needle,'AT',p,'===\n',target[max(0,p-1800):p+3000])
                  start=p+len(needle)
          # Find all production file API literals and nearby content.
          for m in re.finditer(r'https://api\.firestorage\.ai/prod/file[^"\']*',target):
              p=m.start(); print('\n=== API_LITERAL ===\n',target[max(0,p-1800):p+3000])
          PY
