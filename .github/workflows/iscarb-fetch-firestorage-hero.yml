name: ISCARB Fetch Firestorage Hero
on:
  push:
    paths:
      - '.github/workflows/iscarb-fetch-firestorage-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch share internals
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/tj_hCE8kvR_i' -o /tmp/share.html
          echo '--- SHARE HTML START ---'
          cat /tmp/share.html
          echo '--- SHARE HTML END ---'
          python - <<'PY'
          from pathlib import Path
          import re,html as H,requests
          page=Path('/tmp/share.html').read_text(errors='ignore')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          print('SCRIPTS',srcs)
          for i,s in enumerate(srcs):
              u=H.unescape(s)
              if u.startswith('/'): u='https://firestorage.ai'+u
              try:
                  r=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
                  print('SCRIPT',i,r.status_code,r.url,len(r.content),r.headers.get('content-type'))
                  txt=r.text
                  if any(k in txt.lower() for k in ['download','presign','signed','object','file','share']):
                      print('--- SCRIPT MATCH',i,'---')
                      print(txt[:200000])
                      print('--- END SCRIPT',i,'---')
              except Exception as e: print('SCRIPT_ERR',i,repr(e))
          PY
