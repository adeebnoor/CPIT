name: ISCARB v721 Diagnose Presenter
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iscarb-v721-diagnose-review.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct presenter and inspect hooks
        run: |
          cd iscarb-studio
          python - <<'PY'
          import base64,lzma
          from pathlib import Path
          payload=''.join(p.read_text().strip() for p in sorted(Path('.').glob('presenter_v67_prod.xz.b64.*')))
          src=lzma.decompress(base64.b64decode(payload)).decode('utf-8'); lines=src.splitlines()
          for needle in ['def _labeled','def _items','def _ppt_semantic','def _pdf_semantic']:
              hits=[i for i,l in enumerate(lines) if needle in l]
              print('\n###',needle,hits)
              for i in hits:
                  for j in range(max(0,i-4),min(len(lines),i+40)): print(f'{j+1:04d}: {lines[j]}')
                  print('---')
          PY
