name: ISCARB v721 Diagnose Presenter
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iscarb-v721-diagnose-review.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct presenter and inspect relevant code
        run: |
          cd iscarb-studio
          python - <<'PY'
          import base64,lzma
          from pathlib import Path
          chunks=sorted(Path('.').glob('presenter_v67_prod.xz.b64.*'))
          payload=''.join(p.read_text().strip() for p in chunks)
          src=lzma.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('/tmp/presenter.py').write_text(src)
          lines=src.splitlines()
          needles=['YOUR TASK','student_action','enrichment_content','AI MAY PREPARE EVIDENCE','SOURCE EXPANSION']
          for needle in needles:
              print('\n###',needle)
              hits=[i for i,l in enumerate(lines) if needle.lower() in l.lower()]
              print('hits',hits)
              for i in hits[:12]:
                  for j in range(max(0,i-8),min(len(lines),i+12)):
                      print(f'{j+1:04d}: {lines[j]}')
                  print('---')
          PY
