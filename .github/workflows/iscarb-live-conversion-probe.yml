name: ISCARB Live Lecture Conversion Probe

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/iscarb-live-conversion-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install requests pypdf
      - name: Convert a real lecture and verify every output
        env:
          BASE_URL: https://iscarb-lecture-studio.onrender.com
          SECURITY_SOURCE: https://www.slideshare.net/slideshow/ch14-5148075/5148075
        run: |
          python - <<'PY'
          import io, json, os, time, zipfile
          import requests
          from pypdf import PdfReader

          BASE=os.environ['BASE_URL'].rstrip('/')
          SOURCE=os.environ['SECURITY_SOURCE']
          S=requests.Session()
          S.headers.update({'User-Agent':'ISCARB-live-conversion-probe/1.0'})

          def get(path, **kw):
              return S.get(BASE+path, timeout=120, **kw)

          h=get('/api/health')
          assert h.status_code==200, h.text[:1000]
          health=h.json()
          print('PRODUCTION_HEALTH', json.dumps({
              'version':health.get('version'),
              'pipeline':health.get('pipeline'),
              'gemini':health.get('gemini_api_key_configured'),
              'session_minutes':health.get('session_minutes'),
          }))
          assert health.get('gemini_api_key_configured') is True
          assert health.get('session_minutes')==90

          winner=None
          last=None
          for attempt in range(1,4):
              print('COMPILE_ATTEMPT', attempt, SOURCE)
              r=S.post(BASE+'/api/compile', data={
                  'primary_url':SOURCE,
                  'supporting_urls':'',
                  'lecture_focus':'',
                  'model':'auto',
                  'repair_rounds':'0',
              }, timeout=120)
              assert r.status_code==200, f'compile HTTP {r.status_code}: {r.text[:1200]}'
              job_id=r.json()['job_id']
              print('JOB_ID', job_id)
              deadline=time.time()+900
              while time.time()<deadline:
                  jr=get('/api/jobs/'+job_id)
                  assert jr.status_code==200, jr.text[:1000]
                  j=jr.json(); last=j
                  print('JOB', j.get('status'), j.get('progress'), (j.get('message') or '')[:180])
                  if j.get('status') in {'ready','blocked','error'}:
                      if j.get('blueprint'):
                          winner=(job_id,j)
                          break
                      text=((j.get('error') or '')+' '+(j.get('message') or '')).lower()
                      if any(x in text for x in ['503','unavailable','high demand','temporarily overloaded','service unavailable']):
                          print('TRANSIENT_CAPACITY_RETRY')
                          break
                      raise AssertionError('Compile ended without blueprint: '+json.dumps(j)[:5000])
                  time.sleep(8)
              if winner:
                  break
              time.sleep(30*attempt)

          assert winner is not None, 'No lecture conversion produced a blueprint. Last='+json.dumps(last)[:5000]
          job_id,j=winner
          bp=j['blueprint']
          assert bp['session_minutes']==90
          assert len(bp['units'])==20, len(bp['units'])
          assert [u['number'] for u in bp['units']]==list(range(1,21))
          assert len(bp['clos'])==5
          assert bp.get('source_manifest')
          print('BLUEPRINT_OK', 'units=20', 'clos=5', 'status='+j['status'])

          preview=get('/api/jobs/'+job_id+'/presenter')
          assert preview.status_code==200, preview.text[:1000]
          assert len(preview.content)>5000
          print('PRESENTER_OK', len(preview.content))

          endpoints={
              'pptx':('/api/jobs/'+job_id+'/export/pptx','pptx'),
              'presenter_pdf':('/api/jobs/'+job_id+'/export/presenter-pdf','presenter_pdf'),
              'reading_pdf':('/api/jobs/'+job_id+'/export/pdf','pdf'),
              'instructor_docx':('/api/jobs/'+job_id+'/export/docx','docx'),
              'student_docx':('/api/jobs/'+job_id+'/export/student','docx'),
              'blueprint_json':('/api/jobs/'+job_id+'/export/json','json'),
          }
          for name,(path,kind) in endpoints.items():
              rr=get(path)
              assert rr.status_code==200, f'{name} HTTP {rr.status_code}: {rr.text[:600]}'
              data=rr.content
              assert len(data)>500, (name,len(data))
              if kind=='pptx':
                  assert data.startswith(b'PK')
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      slides=[x for x in z.namelist() if x.startswith('ppt/slides/slide') and x.endswith('.xml')]
                      assert len(slides)==20, len(slides)
              elif kind=='presenter_pdf':
                  assert data.startswith(b'%PDF')
                  assert len(PdfReader(io.BytesIO(data)).pages)==20
              elif kind=='pdf':
                  assert data.startswith(b'%PDF')
              elif kind=='docx':
                  assert data.startswith(b'PK')
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      assert 'word/document.xml' in z.namelist()
              elif kind=='json':
                  x=rr.json(); assert x['session_minutes']==90 and len(x['units'])==20
              print('EXPORT_OK', name, len(data), rr.headers.get('content-type'))

          print('LIVE_LECTURE_CONVERSION_PASS', job_id, 'version='+str(health.get('version')), 'status='+j['status'])
          PY
