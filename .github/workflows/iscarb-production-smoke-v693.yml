name: ISCARB v6.9.3 Production Smoke

on:
  push:
    paths:
      - 'iscarb-studio/**'
      - 'lectures/cimt/CPIT455-class2-NooR.pdf'
      - 'lectures/cimt/CPIT455-class3-NooR.pdf'
      - 'lectures/cimt/CPIT455-class5-NooR.pdf'
      - '.github/workflows/iscarb-production-smoke-v693.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r iscarb-studio/requirements.txt
      - name: Compile production patch chain
        run: python -m compileall -q iscarb-studio/app iscarb-studio/smoke_prod.py iscarb-studio/e2e_prod.py iscarb-studio/profile_security_preview.py
      - name: Run exact production presenter smoke
        working-directory: iscarb-studio
        run: python smoke_prod.py
      - name: Run real lecture source-only E2E
        working-directory: iscarb-studio
        run: python e2e_prod.py
      - name: Profile Security preview
        working-directory: iscarb-studio
        run: python profile_security_preview.py
