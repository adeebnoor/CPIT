name: ISCARB Hero Live Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iscarb-hero-live-check.yml'
      - 'iscarb-studio/app/home_v670.py'
      - 'iscarb-studio/app/patch_v711_hero.py'
      - 'iscarb-studio/app/static/hero_v670.jpg'

permissions:
  contents: read

jobs:
  hero-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Validate original live camel raster
        env:
          BASE: https://iscarb-lecture-studio.onrender.com
        run: |
          python - <<'PY'
          import hashlib, io, os, time
          import requests
          from PIL import Image, ImageStat

          base=os.environ['BASE'].rstrip('/')
          h=None
          for _ in range(90):
              try:
                  h=requests.get(base+'/',timeout=30)
                  if h.status_code==200 and 'hero_v670.jpg?v=7.1.2' in h.text and '7.1.2' in h.text:
                      break
              except requests.RequestException:
                  pass
              time.sleep(2)
          assert h is not None and h.status_code==200
          assert 'hero_v670.jpg?v=7.1.2' in h.text, 'v7.1.2 original hero reference is not live'
          assert 'hero_v671.svg' not in h.text, 'vector redraw is still referenced'
          assert 'hero_v672.webp' not in h.text, 'deprecated WebP is still referenced'

          r=requests.get(base+'/static/hero_v670.jpg?v=7.1.2-live-proof',timeout=60)
          assert r.status_code==200,r.status_code
          assert len(r.content)>7000,len(r.content)
          assert r.content[:2]==b'\xff\xd8' and r.content[-2:]==b'\xff\xd9'
          img=Image.open(io.BytesIO(r.content)).convert('RGB')
          stat=ImageStat.Stat(img.resize((80,30)))
          extrema=img.getextrema()
          print('ORIGINAL HERO',img.size,'bytes',len(r.content),'sha256',hashlib.sha256(r.content).hexdigest(),'mean',tuple(round(v,2) for v in stat.mean),'extrema',extrema)
          assert img.width >= 600 and img.height >= 200,img.size
          assert any(lo < hi for lo,hi in extrema),extrema
          img.save('live_original_camel_hero.jpg',quality=95)
          open('home.html','w',encoding='utf-8').write(h.text)

          health=requests.get(base+'/api/health',timeout=60)
          assert health.status_code==200
          hd=health.json()
          assert hd.get('approved_hero_asset')=='hero_v670.jpg',hd
          assert hd.get('hero_original_raster') is True,hd
          assert hd.get('hero_redraw') is False,hd
          print('ISCARB HERO LIVE PASS — original repository raster, no redraw')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-original-camel-hero-proof
          path: |
            live_original_camel_hero.jpg
            home.html
