name: ISCARB Render Deploy

on:
  push:
    branches: [main]
    paths:
      - 'iscarb-studio/**'
      - '.github/workflows/iscarb-render-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iscarb-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve expected production contract
        id: version
        shell: bash
        run: |
          expected_build=$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('iscarb-studio/run.py').read_text(encoding='utf-8')
          m=re.search(r'ISCARB_BUILD_ID",\s*"([^"]+)"', text)
          if not m: raise SystemExit('Cannot resolve ISCARB_BUILD_ID from run.py')
          print(m.group(1))
          PY
          )
          echo "expected_build=$expected_build" >> "$GITHUB_OUTPUT"
      - name: Trigger explicit Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST "$RENDER_DEPLOY_HOOK_URL" >/tmp/render-response.txt
          elif [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            curl --fail --silent --show-error -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Content-Type: application/json' \
              --data '{"clearCache":"do_not_clear"}' >/tmp/render-response.txt
          else
            echo '::error::No Render deploy credential is configured. Add RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY + RENDER_SERVICE_ID.'
            exit 1
          fi
      - name: Verify production version and clean contract
        env:
          EXPECTED_BUILD: ${{ steps.version.outputs.expected_build }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          expected=os.environ['EXPECTED_BUILD']; url='https://iscarb-lecture-studio.onrender.com/api/health'; last=''
          for _ in range(90):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ISCARB-deploy-verifier/2.1','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read().decode())
                  last=str(data); print('production',data.get('version'),data.get('release_ui'),'expected runtime',expected)
                  if (data.get('release_ui')==expected
                      and data.get('clean_release') is True
                      and data.get('dense_p1_decomposition') is True
                      and data.get('public_web_image_fallback') is False
                      and data.get('ai_era_dependability') is True
                      and data.get('micro_example_before_context_case') is True
                      and data.get('source_expansion_decision_box') is True):
                      raise SystemExit(0)
              except SystemExit: raise
              except Exception as e: last=repr(e)
              time.sleep(10)
          raise SystemExit('Production did not advance to v7.2.1 clean runtime. Last='+last[:1000])
          PY