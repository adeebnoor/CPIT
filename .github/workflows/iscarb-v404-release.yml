name: ISCARB v4.1.0 CIMT+ Computing Release Acceptance

on:
  push:
    branches: ["main"]
    paths:
      - 'iscarb-studio/**'
      - 'render.yaml'
      - '.github/workflows/iscarb-v404-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iscarb-v410-release
  cancel-in-progress: true

jobs:
  release-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Verify live CIMT+ across diverse computing lectures
        env:
          BASE_URL: https://iscarb-lecture-studio.onrender.com
          EXPECTED_VERSION: 4.1.0
        run: |
          python - <<'PY'
          import io, json, os, time, zipfile
          import requests

          base=os.environ['BASE_URL'].rstrip('/')
          expected=os.environ['EXPECTED_VERSION']
          sources=[
              ('Security Engineering','https://www.slideshare.net/slideshow/ch14-5148075/5148075'),
              ('Reliability Engineering','https://www.slideshare.net/slideshow/ch11-reliability-engineering/43151516'),
              ('Distributed Software Engineering','https://www.slideshare.net/slideshow/ch17-distributed-software-engineering/43151527'),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-v410-computing-acceptance/1.0'})
          def get(path,timeout=90): return s.get(base+path,timeout=timeout)

          last=''
          for _ in range(120):
              try:
                  r=get('/api/health',30); last=f'{r.status_code} {r.text[:700]}'
                  if r.ok:
                      h=r.json(); print('health',h.get('version'),h.get('pipeline'))
                      if h.get('version')==expected: break
              except Exception as e: last=repr(e)
              time.sleep(10)
          else: raise AssertionError('Render did not reach v4.1.0. Last='+last)

          h=get('/api/health').json()
          assert h['version']==expected
          assert h['deterministic_gate'].startswith('v12')
          assert h['session_minutes']==90 and h['full_primary_coverage'] is True
          assert h['visual_lecture_engine']=='CIMT+'
          assert h['presenter_renderer']=='source-native-v4.1-preview-and-pptx'
          home=get('/'); assert home.ok and 'v4.1.0' in home.text and 'CIMT+ Computing' in home.text

          all_types=set(); results=[]
          for label,source in sources:
              r=s.post(base+'/api/compile',data={
                  'primary_url':source,'supporting_urls':'','lecture_focus':'',
                  'model':'auto','repair_rounds':'2'
              },timeout=120)
              assert r.status_code==200, r.text[:1600]
              job_id=r.json()['job_id']; print('\nJOB',label,job_id)
              deadline=time.time()+1400; job=None
              while time.time()<deadline:
                  jr=get('/api/jobs/'+job_id); assert jr.ok, jr.text[:1200]
                  job=jr.json(); print(label,'state',job.get('status'),job.get('progress'))
                  if job.get('status') in {'ready','blocked','error'}: break
                  time.sleep(8)
              assert job and job.get('blueprint'), json.dumps(job,ensure_ascii=False)[:5000]
              bp=job['blueprint']; profile=job.get('source_profile') or {}
              assert bp['session_minutes']==90 and len(bp['units'])==20 and len(bp['clos'])==5
              assert [u['number'] for u in bp['units']]==list(range(1,21)) and bp['deferred_topics']==[]

              cov=profile.get('coverage_items') or []
              major=[x for x in cov if x.get('importance')=='major']
              ledger=bp.get('coverage_ledger') or []
              byid={x.get('coverage_id'):x for x in ledger}
              print(label,'coverage major/profile/ledger',len(major),len(cov),len(ledger))
              assert major, label+' produced no atomic major P1 coverage items'
              missing=[x['id'] for x in major if x['id'] not in byid]
              assert not missing, label+' missing major coverage '+str(missing)
              assert all(byid[x['id']]['label'].strip()==x['label'].strip() for x in major)
              assert all(byid[x['id']]['knowledge_type']==x['knowledge_type'] for x in major)
              assert all(byid[x['id']]['first_taught_unit']<=15 for x in major)
              assert all('[P1]' in x.get('source_anchor','').upper() for x in major)

              assert all(u.get('knowledge_types') for u in bp['units'])
              assert all(u.get('visual_plan') for u in bp['units'])
              visual_types={u['visual_plan']['visual_type'] for u in bp['units']}
              knowledge_types={k for u in bp['units'] for k in u.get('knowledge_types',[])}
              all_types |= knowledge_types
              print(label,'knowledge types',sorted(knowledge_types))
              print(label,'visual types',sorted(visual_types))
              assert len(visual_types)>=6
              assert all(u['visual_plan'].get('teaching_purpose','').strip() for u in bp['units'])
              assert all(u['visual_plan'].get('citation','').strip() for u in bp['units'])

              failed=[k for k,v in (job.get('deterministic_checks') or {}).items() if not v]
              print(label,'deterministic failures',failed)
              assert not failed, label+' deterministic failures: '+', '.join(failed)
              assert job.get('audit',{}).get('overall_pass') is True
              assert job['status']=='ready', label+' expected READY, got '+str(job['status'])

              endpoints={
                  'preview':('/api/jobs/'+job_id+'/presenter','html'),
                  'pptx':('/api/jobs/'+job_id+'/export/pptx','zip'),
                  'blueprint_json':('/api/jobs/'+job_id+'/export/json','json'),
              }
              if label=='Security Engineering':
                  endpoints.update({
                      'presenter_pdf':('/api/jobs/'+job_id+'/export/presenter-pdf','pdf'),
                      'reading_pdf':('/api/jobs/'+job_id+'/export/pdf','pdf'),
                      'instructor_docx':('/api/jobs/'+job_id+'/export/docx','zip'),
                      'student_docx':('/api/jobs/'+job_id+'/export/student','zip'),
                  })
              for name,(path,kind) in endpoints.items():
                  rr=get(path); assert rr.ok, f'{label} {name}: {rr.status_code}'
                  data=rr.content
                  if kind=='html': assert len(data)>5000
                  elif kind=='pdf': assert data.startswith(b'%PDF') and len(data)>8000
                  elif kind=='zip':
                      assert data.startswith(b'PK') and len(data)>8000
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          names=z.namelist()
                          if name=='pptx':
                              slides=[x for x in names if x.startswith('ppt/slides/slide') and x.endswith('.xml')]
                              assert len(slides)==20
                          else: assert 'word/document.xml' in names
                  else:
                      ex=rr.json(); assert ex['session_minutes']==90 and len(ex['units'])==20
                  print(label,name,'PASS',len(data))
              results.append((label,job_id,len(major),len(ledger),sorted(knowledge_types),sorted(visual_types)))

          assert len(all_types)>=3, 'Cross-computing run did not demonstrate enough representation diversity: '+str(all_types)
          print('\nCIMT+ CROSS-COMPUTING TYPES',sorted(all_types))
          print('CIMT+ v4.1.0 PRODUCTION ACCEPTANCE PASS')
          for row in results: print('RESULT',row)
          PY
