name: ISCARB v4.3 Cross-Computing Release Acceptance

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/iscarb-v404-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# Reuse the legacy concurrency key intentionally so this update cancels the
# obsolete v4.2 acceptance run that waited for an impossible old version.
concurrency:
  group: iscarb-v420-release
  cancel-in-progress: true

jobs:
  cross-computing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r iscarb-studio/requirements.txt
          pip install requests pypdf
      - name: Wait for v4.3 and exercise three computing subjects through Output Lab
        env:
          BASE_URL: https://iscarb-lecture-studio.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          import sys
          sys.path.insert(0,'iscarb-studio')
          from tests.v43_fixture import make_blueprint

          base=os.environ['BASE_URL'].rstrip('/')
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-v43-cross-computing/1.0'})
          last=''
          for _ in range(50):
              try:
                  r=s.get(base+'/api/health',timeout=30); last=r.text[:500]
                  if r.ok and r.json().get('version')=='4.3.0': break
              except Exception as e: last=repr(e)
              time.sleep(10)
          else: raise AssertionError('Production did not reach v4.3.0: '+last)

          h=s.get(base+'/api/health',timeout=30).json()
          assert h['deterministic_gate']=='v14-provenance-presenter-on-v13'
          assert h['presenter_renderer']=='cimt-native-v4.3-preview-pptx-pdf'
          assert h['presenter_exact_units']==20 and h['session_minutes']==90

          subjects=[
              ('Chapter 10 — Dependable Systems', ['SECURITY ENGINEERING','PLATFORM PROTECTION']),
              ('Chapter 11 — Reliability Engineering', ['SECURITY ENGINEERING','PLATFORM PROTECTION']),
              ('Chapter 17 — Distributed Software Engineering', ['SECURITY ENGINEERING','PLATFORM PROTECTION']),
          ]
          for title,banned in subjects:
              bp=make_blueprint(); bp.lecture_title=title
              raw=bp.model_dump_json(by_alias=True).encode()
              rr=s.post(base+'/api/render-blueprint',files={'blueprint_file':('bp.json',raw,'application/json')},timeout=90)
              assert rr.ok, rr.text[:1000]
              job=rr.json()['job_id']
              preview=s.get(f'{base}/api/jobs/{job}/presenter',timeout=90)
              assert preview.ok and 'CIMT-native Presenter' in preview.text
              up=preview.text.upper()
              for token in banned: assert token not in up, (title,token)
              ppt=s.get(f'{base}/api/jobs/{job}/export/pptx',timeout=120); assert ppt.ok and ppt.content.startswith(b'PK')
              with zipfile.ZipFile(io.BytesIO(ppt.content)) as z:
                  slides=[x for x in z.namelist() if x.startswith('ppt/slides/slide') and x.endswith('.xml')]
                  assert len(slides)==20
                  text=' '.join(z.read(x).decode('utf-8','ignore') for x in slides).upper()
                  for token in banned: assert token not in text, (title,token)
              pdf=s.get(f'{base}/api/jobs/{job}/export/presenter-pdf',timeout=120); assert pdf.ok
              assert len(PdfReader(io.BytesIO(pdf.content)).pages)==20
              print('PASS',title,job)
          print('ISCARB v4.3 CROSS-COMPUTING ACCEPTANCE PASS')
          PY
