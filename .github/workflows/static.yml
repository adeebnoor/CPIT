name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check approved lecture, preserved figures and withdrawn content
        run: python tools/audit_classroom.py
      - name: Check publication catalog and script syntax
        run: node tools/check-fbr-release.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage the validated public site
        run: python tools/build_public_site.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
