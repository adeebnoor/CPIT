# Deploy only the public static archive to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html cimt.html imam.html iscarb.html iscarb-students.html fbr-submission.html style.css _site/
          cp -R slides lectures _site/
          mkdir -p _site/iscarb-studio/app/static
          cp iscarb-studio/app/static/hero_user_original.png _site/iscarb-studio/app/static/hero_user_original.png
          python tools/sanitize_static_site.py _site

          # Wealth OS has moved to its standalone Vercel project. Keep the
          # repository redirect page in the Pages artifact instead of making
          # the entire CPIT deployment depend on the retired Supabase v28 build.
          rm -rf _site/wealth-os
          cp -R wealth-os _site/wealth-os
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
