# Deploy only the public static archive to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html cimt.html imam.html iscarb.html iscarb-students.html style.css _site/
          cp -R slides lectures _site/

          # Preserve the original Saudi heritage visual used by the ISCARB hero.
          # The HTML references this exact repository path, so publish the same
          # directory structure into the Pages artifact rather than replacing
          # the visual with a generic asset.
          mkdir -p _site/iscarb-studio/app/static
          cp iscarb-studio/app/static/hero_user_original.png \
             _site/iscarb-studio/app/static/hero_user_original.png

          python tools/sanitize_static_site.py _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
