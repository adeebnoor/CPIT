# Deploy only the public static archive to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html cimt.html imam.html iscarb.html iscarb-students.html style.css _site/
          cp -R slides lectures _site/

          mkdir -p _site/iscarb-studio/app/static
          cp iscarb-studio/app/static/hero_user_original.png \
             _site/iscarb-studio/app/static/hero_user_original.png

          python tools/sanitize_static_site.py _site

          # Publish verified Wealth OS v28 standalone artifact.
          rm -rf _site/wealth-os
          mkdir -p _site/wealth-os
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 \
            'https://hwuintdzmozamnmgtfly.supabase.co/functions/v1/wealth-os-v28?pages-build=28' \
            -o _site/wealth-os/index.html

          # Verify the source artifact before applying the diagnostic route patch.
          echo "b2315d8bfc3e913de5558283173610a2fac9c26de00a191a749d4bd81449d343  _site/wealth-os/index.html" | sha256sum -c -

          # Diagnostic is advisory only: route it to a dedicated non-blocking endpoint.
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/wealth-os/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'wealth-api/diagnostic'
          new = 'wealth-diagnostic-api/check'
          if old not in s:
              raise SystemExit('Expected diagnostic route not found in Wealth OS artifact')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

          # Deployment gates.
          grep -q 'id="salary" class="page"' _site/wealth-os/index.html
          grep -q 'id="dashboardSalary"' _site/wealth-os/index.html
          grep -q 'id="salaryPageGross"' _site/wealth-os/index.html
          grep -q 'id="planScenario"' _site/wealth-os/index.html
          grep -q 'id="planMonthlyRows"' _site/wealth-os/index.html
          grep -q 'wealth-plan-api' _site/wealth-os/index.html
          grep -q 'wealth-diagnostic-api/check' _site/wealth-os/index.html
          if grep -q 'wealth-api/diagnostic' _site/wealth-os/index.html; then
            echo 'ERROR: legacy blocking diagnostic route still present' >&2
            exit 1
          fi
          if grep -q '<input id="planSearch"' _site/wealth-os/index.html; then
            echo 'ERROR: legacy v27 plan UI detected' >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
