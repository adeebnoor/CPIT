# Deploy only the public static archive to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html cimt.html imam.html iscarb.html iscarb-students.html fbr-submission.html download.html download-stats.html student-guide.html course-resources.html methodology.html style.css iscarb-theme.css iscarb-theme.js _site/
          cp -R slides lectures _site/
          mkdir -p _site/iscarb-studio/app/static
          cp iscarb-studio/app/static/hero_user_original.png _site/iscarb-studio/app/static/hero_user_original.png

          # Keep the public grading model synchronized even if some source pages
          # have already been updated. Replacements are intentionally idempotent.
          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  return True
              return False

          replace_if_present('_site/iscarb.html',
              '.quick{display:grid;grid-template-columns:repeat(4,1fr);',
              '.quick{display:grid;grid-template-columns:repeat(3,1fr);')
          replace_if_present('_site/iscarb.html',
              '<div class="q"><b>30%</b><span>Midterm</span></div><div class="q"><b>30%</b><span>Final</span></div><div class="q"><b>20%</b><span>Assignments & Lab</span></div><div class="q"><b>20%</b><span>Group Project</span></div>',
              '<div class="q"><b>30%</b><span>Midterm Exam</span></div><div class="q"><b>30%</b><span>Final Exam</span></div><div class="q"><b>40%</b><span>Assignments & Discussions · 36 + 4</span></div>')

          replace_if_present('_site/course-resources.html',
              '.weights{display:grid;grid-template-columns:repeat(4,1fr);',
              '.weights{display:grid;grid-template-columns:repeat(3,1fr);')
          replace_if_present('_site/course-resources.html',
              '<div class="weights"><div class="weight"><b>30%</b><span>Midterm</span></div><div class="weight"><b>30%</b><span>Final</span></div><div class="weight"><b>20%</b><span>Assignments & Lab</span></div><div class="weight"><b>20%</b><span>Group Project</span></div></div>',
              '<div class="weights"><div class="weight"><b>30%</b><span>Midterm Exam</span></div><div class="weight"><b>30%</b><span>Final Exam</span></div><div class="weight"><b>40%</b><span>Assignments & Discussions</span></div></div><div class="card" style="margin-top:10px"><h3>40% continuous assessment breakdown</h3><p><b>36 points:</b> 9 weekly assignments × 4 points each.<br><b>4 points:</b> participation and discussions.</p></div>')
          replace_if_present('_site/course-resources.html',
              'Current-semester weights are taken from the Fall 2026/27 KICKOFF deck. The LMS is the operational authority for deadlines and any later announced change.',
              'Current instructor-approved distribution: 30% Midterm Exam, 30% Final Exam, and 40% Assignments & Discussions (36 points from nine 4-point assignments + 4 participation points). This supersedes the earlier assessment percentages shown in the supplied KICKOFF deck. The LMS remains the operational authority for deadlines.')
          replace_if_present('_site/course-resources.html',
              'the supplied syllabus PDF is labelled Fall 2024, while the supplied KICKOFF deck is Fall 2026/27. The current-semester assessment weights, roadmap and logistics shown here therefore come from the KICKOFF source; the official CLO wording and course coverage come from the syllabus source.',
              'the supplied syllabus PDF is labelled Fall 2024, while the supplied KICKOFF deck is Fall 2026/27. CLO wording and course coverage come from the syllabus; the roadmap and logistics come from KICKOFF. The grading distribution shown on this page follows the instructor-approved current model and supersedes the older KICKOFF percentages.')

          replace_if_present('_site/student-guide.html',
              '<div class="grid2"><article class="card"><h3>Assignments & Lab · 20%</h3><p>ISCARB Decision Cards and related lab evidence sit inside the current 20% Assignments & Lab component.</p></article><article class="card"><h3>Group Project · 20%</h3><p>The project culminates in a live Engineering Defense where a constraint may change and the team must re-run its reasoning rather than recite a fixed presentation.</p></article></div>',
              '<div class="grid2"><article class="card"><h3>Midterm Exam · 30%</h3><p>Assesses engineering decisions under course constraints.</p></article><article class="card"><h3>Final Exam · 30%</h3><p>Assesses advanced reasoning and bounded engineering judgment.</p></article><article class="card"><h3>Assignments & Discussions · 40%</h3><p><b>36 points:</b> nine weekly FBR assignments × 4 points. <b>4 points:</b> participation and discussions.</p></article></div>')
          PY

          python tools/sanitize_static_site.py _site

          # Apply one shared ISCARB identity to every public HTML page. Relative
          # paths are computed per page so this also works for nested lecture/FBR files.
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('_site')
          for p in root.rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              rel = os.path.relpath(root, p.parent).replace('\\','/')
              prefix = '' if rel == '.' else rel.rstrip('/') + '/'
              css = prefix + 'iscarb-theme.css'
              js = prefix + 'iscarb-theme.js'
              if css not in s:
                  tag = f'<link rel="stylesheet" href="{css}">'
                  if '</head>' in s:
                      s = s.replace('</head>', tag + '</head>', 1)
                  else:
                      s = tag + s
              if js not in s:
                  tag = f'<script src="{js}" defer></script>'
                  if '</body>' in s:
                      s = s.replace('</body>', tag + '</body>', 1)
                  else:
                      s += tag
              p.write_text(s, encoding='utf-8')
          PY

          # Fail deployment if the public theme/navigation layer is incomplete.
          test -f _site/student-guide.html
          test -f _site/course-resources.html
          test -f _site/methodology.html
          test -f _site/iscarb-theme.css
          test -f _site/iscarb-theme.js
          test -f _site/iscarb-studio/app/static/hero_user_original.png
          grep -q '40%' _site/iscarb.html
          grep -q 'Assignments & Discussions' _site/iscarb.html
          grep -q 'iscarb-theme.css' _site/iscarb.html
          grep -q '../../iscarb-theme.js' _site/lectures/iscarb/InClass-Presenter.html
          grep -q '../../iscarb-theme.js' _site/lectures/iscarb/Ch10-FBR-Student-Assignment.html
          grep -q 'Interactive System for Case-based Analysis' _site/methodology.html

          # Wealth OS has moved to its standalone Vercel project. Keep the
          # repository redirect page in the Pages artifact instead of making
          # the entire CPIT deployment depend on the retired Supabase v28 build.
          rm -rf _site/wealth-os
          cp -R wealth-os _site/wealth-os
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
