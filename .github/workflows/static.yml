# Deploy only the public static archive to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html cimt.html imam.html iscarb.html iscarb-students.html style.css _site/
          cp -R slides lectures _site/
          mkdir -p _site/iscarb-studio/app/static
          cp iscarb-studio/app/static/hero_user_original.png _site/iscarb-studio/app/static/hero_user_original.png
          python tools/sanitize_static_site.py _site
          rm -rf _site/wealth-os
          mkdir -p _site/wealth-os
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 \
            'https://hwuintdzmozamnmgtfly.supabase.co/functions/v1/wealth-os-v28?pages-build=28' \
            -o _site/wealth-os/index.html
          echo "b2315d8bfc3e913de5558283173610a2fac9c26de00a191a749d4bd81449d343  _site/wealth-os/index.html" | sha256sum -c -

          # Replace only the advisory diagnostic call. Everything else remains byte-identical to v28.
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/wealth-os/index.html')
          s=p.read_text(encoding='utf-8')
          old="const x=await api('diagnostic');"
          new="const r=await fetch('https://hwuintdzmozamnmgtfly.supabase.co/functions/v1/wealth-diagnostic-api/check',{headers:{authorization:'Bearer '+token,'content-type':'application/json'}});const x=await r.json();"
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one diagnostic call, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          # Deployment gates: core pages plus non-blocking diagnostic route.
          grep -q 'id="salary" class="page"' _site/wealth-os/index.html
          grep -q 'id="dashboardSalary"' _site/wealth-os/index.html
          grep -q 'id="salaryPageGross"' _site/wealth-os/index.html
          grep -q 'id="planScenario"' _site/wealth-os/index.html
          grep -q 'id="planMonthlyRows"' _site/wealth-os/index.html
          grep -q 'wealth-plan-api' _site/wealth-os/index.html
          grep -q 'wealth-diagnostic-api/check' _site/wealth-os/index.html
          if grep -q "const x=await api('diagnostic');" _site/wealth-os/index.html; then
            echo 'ERROR: blocking diagnostic call still present' >&2
            exit 1
          fi
          if grep -q '<input id="planSearch"' _site/wealth-os/index.html; then
            echo 'ERROR: legacy v27 plan UI detected' >&2
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
