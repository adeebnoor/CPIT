# Deploy only the public static archive to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html cimt.html imam.html iscarb.html iscarb-students.html fbr-submission.html download.html download-stats.html student-guide.html course-resources.html methodology.html style.css iscarb-theme.css iscarb-theme.js _site/
          cp -R slides lectures _site/
          mkdir -p _site/iscarb-studio/app/static
          cp iscarb-studio/app/static/hero_user_original.png _site/iscarb-studio/app/static/hero_user_original.png

          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  return True
              return False

          replace_if_present('_site/iscarb.html', '.quick{display:grid;grid-template-columns:repeat(4,1fr);', '.quick{display:grid;grid-template-columns:repeat(3,1fr);')
          replace_if_present('_site/iscarb.html', '<div class="q"><b>30%</b><span>Midterm</span></div><div class="q"><b>30%</b><span>Final</span></div><div class="q"><b>20%</b><span>Assignments & Lab</span></div><div class="q"><b>20%</b><span>Group Project</span></div>', '<div class="q"><b>30%</b><span>Midterm Exam</span></div><div class="q"><b>30%</b><span>Final Exam</span></div><div class="q"><b>40%</b><span>Assignments & Discussions · 36 + 4</span></div>')

          replace_if_present('_site/course-resources.html', '.weights{display:grid;grid-template-columns:repeat(4,1fr);', '.weights{display:grid;grid-template-columns:repeat(3,1fr);')
          replace_if_present('_site/course-resources.html', '<div class="weights"><div class="weight"><b>30%</b><span>Midterm</span></div><div class="weight"><b>30%</b><span>Final</span></div><div class="weight"><b>20%</b><span>Assignments & Lab</span></div><div class="weight"><b>20%</b><span>Group Project</span></div></div>', '<div class="weights"><div class="weight"><b>30%</b><span>Midterm Exam</span></div><div class="weight"><b>30%</b><span>Final Exam</span></div><div class="weight"><b>40%</b><span>Assignments & Discussions</span></div></div><div class="card" style="margin-top:10px"><h3>40% continuous assessment breakdown</h3><p><b>36 points:</b> 9 weekly assignments × 4 points each.<br><b>4 points:</b> participation and discussions.</p></div>')
          replace_if_present('_site/course-resources.html', 'Current-semester weights are taken from the Fall 2026/27 KICKOFF deck. The LMS is the operational authority for deadlines and any later announced change.', 'Current instructor-approved distribution: 30% Midterm Exam, 30% Final Exam, and 40% Assignments & Discussions (36 points from nine 4-point assignments + 4 participation points). This supersedes the earlier assessment percentages shown in the supplied KICKOFF deck. The LMS remains the operational authority for deadlines.')
          replace_if_present('_site/course-resources.html', 'the supplied syllabus PDF is labelled Fall 2024, while the supplied KICKOFF deck is Fall 2026/27. The current-semester assessment weights, roadmap and logistics shown here therefore come from the KICKOFF source; the official CLO wording and course coverage come from the syllabus source.', 'the supplied syllabus PDF is labelled Fall 2024, while the supplied KICKOFF deck is Fall 2026/27. CLO wording and course coverage come from the syllabus; the roadmap and logistics come from KICKOFF. The grading distribution shown on this page follows the instructor-approved current model and supersedes the older KICKOFF percentages.')

          replace_if_present('_site/student-guide.html', '<div class="grid2"><article class="card"><h3>Assignments & Lab · 20%</h3><p>ISCARB Decision Cards and related lab evidence sit inside the current 20% Assignments & Lab component.</p></article><article class="card"><h3>Group Project · 20%</h3><p>The project culminates in a live Engineering Defense where a constraint may change and the team must re-run its reasoning rather than recite a fixed presentation.</p></article></div>', '<div class="grid2"><article class="card"><h3>Midterm Exam · 30%</h3><p>Assesses engineering decisions under course constraints.</p></article><article class="card"><h3>Final Exam · 30%</h3><p>Assesses advanced reasoning and bounded engineering judgment.</p></article><article class="card"><h3>Assignments & Discussions · 40%</h3><p><b>36 points:</b> nine weekly FBR assignments × 4 points. <b>4 points:</b> participation and discussions.</p></article></div>')
          PY

          python tools/sanitize_static_site.py _site

          python - <<'PY'
          from pathlib import Path

          targets = [
              'lectures/iscarb/Ch12-Safety-Engineering.html',
              'lectures/iscarb/Ch13-Security-Engineering.html',
              'lectures/iscarb/Ch14-Resilience-Engineering.html',
              'lectures/iscarb/Ch15-Software-Reuse.html',
              'lectures/iscarb/Ch16-Component-Based-Software-Engineering.html',
              'lectures/iscarb/Ch17-Distributed-Software-Engineering.html',
              'lectures/iscarb/Ch20-Systems-of-Systems.html',
          ]
          shim = r'''<script id="iscarb-static-presenter-bridge">
          (()=>{try{
            if(typeof show!=='function') return;
            const ss=[...document.querySelectorAll('#stage .slide')];
            if(!Array.isArray(window.U)) window.U=ss.map((s,i)=>({k:'STATIC-'+String(i+1).padStart(2,'0'),title:s.dataset.title||('Slide '+(i+1))}));
            if(typeof window.go!=='function') window.go=(i)=>show(i);
            try{Object.defineProperty(window,'cur',{configurable:true,get:()=>idx,set:v=>{idx=v;}})}catch(e){window.cur=0}
            if(typeof window.tog!=='function') window.tog=(name)=>{if(name==='notes')document.getElementById('notes')?.click()};
            window.__ISCARB_STATIC_BRIDGE__=true;
          }catch(e){console.error('ISCARB static presenter bridge',e)}})();
          </script>'''
          for rel in targets:
              p=Path('_site')/rel
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if '__ISCARB_STATIC_BRIDGE__' not in s:
                  s=s.replace('</body>',shim+'</body>',1)
                  p.write_text(s,encoding='utf-8')

          p=Path('_site/lectures/iscarb/InClass-Presenter.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('?v=20260913-visual', '?v=20260913-navfix3')
          p.write_text(s,encoding='utf-8')

          # Force fresh presenter URLs from the Lecture Hub as well.
          p=Path('_site/iscarb.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('InClass-Presenter.html?chapter=10&v=20260913-visual','InClass-Presenter.html?chapter=10&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=11&v=20260913-visual','InClass-Presenter.html?chapter=11&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=12&v=20260913-visual','InClass-Presenter.html?chapter=12&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=13&v=20260913-visual','InClass-Presenter.html?chapter=13&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=14&v=20260913-visual','InClass-Presenter.html?chapter=14&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=15&v=20260913-visual','InClass-Presenter.html?chapter=15&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=16&v=20260913-visual','InClass-Presenter.html?chapter=16&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=17&v=20260913-visual','InClass-Presenter.html?chapter=17&v=20260913-navfix3')
          s=s.replace('InClass-Presenter.html?chapter=20&v=20260913-visual','InClass-Presenter.html?chapter=20&v=20260913-navfix3')
          p.write_text(s,encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('_site')
          version = '20260913-navfix3'
          for p in root.rglob('*.html'):
              if p == root / 'index.html':
                  continue
              s = p.read_text(encoding='utf-8')
              rel = os.path.relpath(root, p.parent).replace('\\','/')
              prefix = '' if rel == '.' else rel.rstrip('/') + '/'
              css = prefix + f'iscarb-theme.css?v={version}'
              js = prefix + f'iscarb-theme.js?v={version}'
              if 'iscarb-theme.css' not in s:
                  tag = f'<link rel="stylesheet" href="{css}">'
                  s = s.replace('</head>', tag + '</head>', 1) if '</head>' in s else tag + s
              if 'iscarb-theme.js' not in s:
                  tag = f'<script src="{js}" defer></script>'
                  s = s.replace('</body>', tag + '</body>', 1) if '</body>' in s else s + tag
              p.write_text(s, encoding='utf-8')
          PY

          test -f _site/student-guide.html
          test -f _site/course-resources.html
          test -f _site/methodology.html
          test -f _site/iscarb-theme.css
          test -f _site/iscarb-theme.js
          test -f _site/iscarb-studio/app/static/hero_user_original.png
          grep -q '40%' _site/iscarb.html
          grep -q 'iscarb-theme.css?v=20260913-navfix3' _site/iscarb.html
          grep -q 'iscarb-theme.js?v=20260913-navfix3' _site/lectures/iscarb/InClass-Presenter.html
          grep -q '__ISCARB_STATIC_BRIDGE__' _site/lectures/iscarb/Ch12-Safety-Engineering.html
          grep -q 'chapter=12&v=20260913-navfix3' _site/iscarb.html
          grep -q '20260913-navfix3' _site/lectures/iscarb/InClass-Presenter.html
          grep -q 'Interactive System for Case-based Analysis' _site/methodology.html
          ! grep -q 'iscarb-theme.css' _site/index.html
          ! grep -q 'iscarb-theme.js' _site/index.html
          grep -q 'methodology.html' _site/index.html

          rm -rf _site/wealth-os
          cp -R wealth-os _site/wealth-os
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
