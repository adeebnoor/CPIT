name: ISCARB Pull User-Reported Job

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/iscarb-pull-user-job.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact user-reported Blueprint
        env:
          BASE_URL: https://iscarb-lecture-studio.onrender.com
          JOB_ID: 520b5964dbd940aabbb87c5b1e833089
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['BASE_URL'].rstrip('/')
          job=os.environ['JOB_ID']
          req=urllib.request.Request(f'{base}/api/jobs/{job}',headers={'User-Agent':'ISCARB-user-output-repro/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r:
              data=json.loads(r.read().decode('utf-8'))
          print('status=',data.get('status'),'title=',(data.get('blueprint') or {}).get('lecture_title'))
          bp=data.get('blueprint')
          if not bp:
              raise SystemExit('Job exists but Blueprint is unavailable')
          with open('/tmp/software-processes-user-blueprint.json','w',encoding='utf-8') as f:
              json.dump(bp,f,ensure_ascii=False,indent=2)
          print('units=',len(bp.get('units') or []),'minutes=',bp.get('session_minutes'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: software-processes-user-blueprint
          path: /tmp/software-processes-user-blueprint.json
          if-no-files-found: error
