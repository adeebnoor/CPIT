name: Import ISCARB HTML lectures

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-iscarb-html.yml'

permissions:
  contents: write

jobs:
  import-lectures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Download staged lecture HTML files
        env:
          FIRESTORAGE_SHARE: https://firestorage.ai/ja/f/ryBqw6duFhdQ
        run: |
          python - <<'PY'
          import os, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          SHARE = os.environ['FIRESTORAGE_SHARE']
          TARGETS = [
              ('Ch10-Dependable-Systems.html', Path('lectures/iscarb/Ch10-Dependable-Systems.html')),
              ('Ch11-Reliability-Engineering.html', Path('lectures/iscarb/Ch11-Reliability-Engineering.html')),
          ]
          for _, target in TARGETS:
              target.parent.mkdir(parents=True, exist_ok=True)

          def save_response(request_ctx, href, target):
              r = request_ctx.get(href, timeout=30000)
              if not r.ok:
                  return False
              body = r.body()
              if len(body) < 50000:
                  return False
              target.write_bytes(body)
              return True

          def click_for_download(page, locator, target):
              try:
                  with page.expect_download(timeout=10000) as di:
                      locator.click(timeout=10000)
                  d = di.value
                  d.save_as(str(target))
                  return target.exists() and target.stat().st_size > 50000
              except Exception:
                  return False

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True, locale='ja-JP')
              page = context.new_page()
              print('Opening share:', SHARE)
              page.goto(SHARE, wait_until='domcontentloaded', timeout=60000)
              try:
                  page.wait_for_load_state('networkidle', timeout=30000)
              except PlaywrightTimeoutError:
                  pass
              time.sleep(2)
              print('TITLE:', page.title())
              print('URL:', page.url)

              for fname, target in TARGETS:
                  if target.exists():
                      target.unlink()
                  print('\nLooking for', fname)
                  success = False

                  # 1) Direct links containing the filename in href/text.
                  for a in page.locator('a').all():
                      try:
                          txt = (a.inner_text(timeout=1000) or '').strip()
                          href = a.get_attribute('href') or ''
                      except Exception:
                          continue
                      if fname.lower() in (txt + ' ' + href).lower():
                          if href and not href.startswith('javascript:'):
                              full = urljoin(page.url, href)
                              print('Candidate direct href:', full)
                              try:
                                  if save_response(context.request, full, target):
                                      success = True
                                      break
                              except Exception as e:
                                  print('Direct fetch failed:', e)
                          if click_for_download(page, a, target):
                              success = True
                              break

                  # 2) Locate filename text and search nearby for a download control.
                  if not success:
                      name_loc = page.get_by_text(fname, exact=False)
                      if name_loc.count():
                          node = name_loc.first
                          for depth in range(0, 7):
                              container = node if depth == 0 else node.locator('xpath=' + '/..' * depth)
                              try:
                                  controls = container.locator('a,button,[role="button"]')
                                  for i in range(controls.count()):
                                      c = controls.nth(i)
                                      try:
                                          txt = (c.inner_text(timeout=500) or '')
                                          aria = c.get_attribute('aria-label') or ''
                                          title = c.get_attribute('title') or ''
                                      except Exception:
                                          continue
                                      label = (txt + ' ' + aria + ' ' + title).lower()
                                      if re.search(r'download|ダウンロード|受け取|保存|save', label):
                                          print('Nearby download control:', label[:120])
                                          if click_for_download(page, c, target):
                                              success = True
                                              break
                                  if success:
                                      break
                              except Exception:
                                  continue

                  # 3) Click the file row/card, then look for a global download action.
                  if not success:
                      name_loc = page.get_by_text(fname, exact=False)
                      if name_loc.count():
                          try:
                              name_loc.first.click(timeout=5000)
                              time.sleep(1)
                          except Exception:
                              pass
                          controls = page.locator('a,button,[role="button"]')
                          for i in range(controls.count()):
                              c = controls.nth(i)
                              try:
                                  if not c.is_visible():
                                      continue
                                  txt = (c.inner_text(timeout=500) or '')
                                  aria = c.get_attribute('aria-label') or ''
                                  title = c.get_attribute('title') or ''
                              except Exception:
                                  continue
                              label = (txt + ' ' + aria + ' ' + title).lower()
                              if re.search(r'download|ダウンロード|受け取|保存|save', label):
                                  print('Global download control:', label[:120])
                                  if click_for_download(page, c, target):
                                      success = True
                                      break

                  if not success:
                      print('Visible page text excerpt:')
                      try:
                          print(page.locator('body').inner_text()[:12000])
                      except Exception:
                          pass
                      raise RuntimeError(f'Could not download {fname}')

                  size = target.stat().st_size
                  print('Saved', target, size, 'bytes')
                  if size < 100000:
                      raise RuntimeError(f'{fname} is unexpectedly small: {size}')

              browser.close()

          # Basic integrity checks before committing.
          for fname, target in TARGETS:
              data = target.read_text(encoding='utf-8', errors='strict')
              if '<title>ISCARB Lecture Engine</title>' not in data:
                  raise RuntimeError(f'{fname}: expected ISCARB title missing')
              if '<style>' not in data or '<script' not in data:
                  raise RuntimeError(f'{fname}: HTML appears incomplete')
              print('Validated', fname, len(data), 'characters')
          PY

      - name: Commit lecture HTML files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lectures/iscarb/Ch10-Dependable-Systems.html lectures/iscarb/Ch11-Reliability-Engineering.html
          if git diff --cached --quiet; then
            echo 'No lecture changes to commit.'
          else
            git commit -m 'Publish ISCARB chapter 10 and 11 HTML lectures'
            git push
          fi
