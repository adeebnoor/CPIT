name: Deploy ISCARB After-Class bundle

on:
  push:
    paths:
      - '.github/workflows/deploy-afterclass-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download After-Class bundle with browser
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/afterclass /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > /tmp/pw/download.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({acceptDownloads:true});
            await page.goto('https://firestorage.ai/ja/f/evChhBXLUPtw',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(6000);
            const name='iscarb_afterclass_ch12_20.zip';
            let target = page.getByText(name,{exact:false}).first();
            if(!(await target.count())) target = page.locator('a,button').filter({hasText:/download|ダウンロード/i}).first();
            if(!(await target.count())) throw new Error('No downloadable After-Class bundle control found');
            const [download] = await Promise.all([page.waitForEvent('download',{timeout:30000}),target.click()]);
            await download.saveAs('/tmp/afterclass/bundle.zip');
            await browser.close();
            if(!fs.existsSync('/tmp/afterclass/bundle.zip')) throw new Error('bundle.zip not saved');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/pw/download.js
          unzip -t /tmp/afterclass/bundle.zip
      - name: Install progressively harder After-Class assignments
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/afterclass/extract && mkdir -p /tmp/afterclass/extract
          unzip -q /tmp/afterclass/bundle.zip -d /tmp/afterclass/extract
          mkdir -p lectures/iscarb/reveal
          cp /tmp/afterclass/extract/fbr-submission.html fbr-submission.html
          cp /tmp/afterclass/extract/iscarb.html iscarb.html
          for ch in 12 13 14 15 16 17 20; do
            cp "/tmp/afterclass/extract/lectures/iscarb/Ch${ch}-FBR-Student-Assignment.html" "lectures/iscarb/Ch${ch}-FBR-Student-Assignment.html"
          done
          cp /tmp/afterclass/extract/lectures/iscarb/reveal/*.json lectures/iscarb/reveal/
          for ch in 12 13 14 15 16 17 20; do
            test -s "lectures/iscarb/Ch${ch}-FBR-Student-Assignment.html"
            grep -q "CPIT455_W${ch}_" "lectures/iscarb/Ch${ch}-FBR-Student-Assignment.html"
            grep -q "chapter:'${ch}'" "lectures/iscarb/Ch${ch}-FBR-Student-Assignment.html"
            grep -q "fbr-submission.html?chapter=${ch}" iscarb.html
          done
          grep -q "9 / 9 · Capstone" fbr-submission.html
          grep -q "Ch20-FBR-Student-Assignment.html" fbr-submission.html
      - name: Commit After-Class rollout
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fbr-submission.html iscarb.html lectures/iscarb/Ch12-FBR-Student-Assignment.html lectures/iscarb/Ch13-FBR-Student-Assignment.html lectures/iscarb/Ch14-FBR-Student-Assignment.html lectures/iscarb/Ch15-FBR-Student-Assignment.html lectures/iscarb/Ch16-FBR-Student-Assignment.html lectures/iscarb/Ch17-FBR-Student-Assignment.html lectures/iscarb/Ch20-FBR-Student-Assignment.html lectures/iscarb/reveal/r12-9f3a7c2d.json lectures/iscarb/reveal/r13-b61e4a90.json lectures/iscarb/reveal/r14-2d7c5e81.json lectures/iscarb/reveal/r15-7ab41d63.json lectures/iscarb/reveal/r16-4ce98b17.json lectures/iscarb/reveal/r17-d85f2a46.json lectures/iscarb/reveal/r20-f31c8d72.json
          git diff --cached --stat
          git commit -m 'Publish progressively harder After-Class FBR tasks for Chapters 12-20'
          git push origin HEAD:main
