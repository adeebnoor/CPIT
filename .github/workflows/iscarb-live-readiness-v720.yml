name: ISCARB Live Readiness v720

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iscarb-live-readiness-v720.yml'

permissions:
  contents: read

jobs:
  clean-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install browser and rendering tools
        run: |
          set -euxo pipefail
          python -m pip install --quiet requests playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils

      - name: Wait for v7.2 clean production contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          import time, requests
          url='https://iscarb-lecture-studio.onrender.com/api/health'
          for _ in range(90):
              try:
                  r=requests.get(url,timeout=20,headers={'Cache-Control':'no-cache'})
                  if r.ok:
                      h=r.json(); print('health',h.get('build_commit'),h.get('version'),h.get('release_ui'),h.get('clean_release'))
                      if (h.get('release_ui')=='7.2.0' and h.get('clean_release') is True
                          and h.get('dense_p1_decomposition') is True
                          and h.get('generic_it_scope') is True
                          and h.get('software_engineering_dependency') is False
                          and h.get('public_web_image_fallback') is False
                          and h.get('approved_hero_asset')=='hero_user_original.png'):
                          raise SystemExit(0)
              except SystemExit: raise
              except Exception as e: print('wait',repr(e))
              time.sleep(5)
          raise SystemExit('ISCARB v7.2 clean contract never became live')
          PY

      - name: Browser-audit clean homepage and links
        run: |
          set -euxo pipefail
          mkdir -p /tmp/iscarb_v720
          python - <<'PY'
          import asyncio, json, requests
          from pathlib import Path
          from playwright.async_api import async_playwright
          BASE='https://iscarb-lecture-studio.onrender.com'
          async def main():
              errors=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await browser.new_page(viewport={'width':1600,'height':1100})
                  page.on('console',lambda msg: errors.append('console:'+msg.text) if msg.type=='error' else None)
                  page.on('pageerror',lambda exc: errors.append('page:'+str(exc)))
                  r=await page.goto(BASE,wait_until='networkidle',timeout=60000)
                  assert r and r.status==200
                  await page.wait_for_timeout(1200)
                  body=(await page.locator('body').inner_text()).lower()
                  html=(await page.content()).lower()
                  assert '7.2.0' in body
                  assert 'one engine for it' in body
                  assert 'source library' not in body
                  assert 'original source library' not in body
                  assert 'sign in' not in body
                  assert 'your content is secure and used only for academic enhancement' not in body
                  for retired in ['cpit455-class','adeebnoor.github.io/cpit/cimt.html','slideshare.net/slideshow/ch10','software engineering template']:
                      assert retired not in html, retired
                  assert not errors, errors
                  links=await page.locator('a[href]').evaluate_all("els=>els.map(a=>({text:(a.innerText||'').trim(),href:a.getAttribute('href')}))")
                  bad=[]
                  for item in links:
                      href=(item.get('href') or '').strip()
                      if not href or href.startswith('#'):
                          continue
                      if href.startswith('http://') or href.startswith('https://'):
                          bad.append(item)
                          continue
                      if href.startswith('/'):
                          rr=requests.get(BASE+href,timeout=30,allow_redirects=True)
                          if rr.status_code>=400: bad.append({**item,'status':rr.status_code})
                  assert not bad, bad
                  hero=await page.locator('.heroArt').bounding_box(); assert hero and hero['width']>500 and hero['height']>250
                  await page.screenshot(path='/tmp/iscarb_v720/home_full.png',full_page=True)
                  Path('/tmp/iscarb_v720/home_links.json').write_text(json.dumps(links,indent=2),encoding='utf-8')
                  print('CLEAN_HOME_BROWSER_PASS',len(links),'links')
                  await browser.close()
          asyncio.run(main())
          PY

      - name: Compile real MIT database lecture and reject ugly output text
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,time,zipfile,requests,re
          from io import BytesIO
          from pathlib import Path
          base='https://iscarb-lecture-studio.onrender.com'
          p1='https://ocw.mit.edu/courses/6-830-database-systems-fall-2010/10b223dc3daf6fda4001272799b153a0_MIT6_830F10_lec10.pdf'
          data={
              'primary_url':p1,
              'supporting_urls':'',
              'lecture_focus':'Database Systems — Transactions and Locking',
              'model':'source-only',
              'repair_rounds':'0',
              'free_tier_confirmed':'false',
          }
          r=requests.post(base+'/api/compile',data=data,timeout=60); print('compile',r.status_code,r.text[:400]); r.raise_for_status()
          jid=r.json()['job_id']; Path('/tmp/iscarb_v720/job_id.txt').write_text(jid)
          deadline=time.time()+240
          while time.time()<deadline:
              s=requests.get(f'{base}/api/jobs/{jid}',timeout=30); s.raise_for_status(); job=s.json()
              print('job',job.get('status'),job.get('progress'),job.get('message'))
              if job.get('status') in {'ready','blocked','error'}: break
              time.sleep(2)
          else: raise SystemExit('Database lecture job timed out')
          assert job.get('status') in {'ready','blocked'} and not job.get('error'), job
          bp=job['blueprint']; units=bp['units']
          assert len(units)==20 and sorted(u['number'] for u in units)==list(range(1,21))
          assert 'database systems' in bp.get('lecture_title','').lower() and 'transaction' in bp.get('lecture_title','').lower()

          u1=units[0]; opening=' '.join(u1.get('core_content',[])).strip()
          assert opening and opening==bp.get('central_engineering_crisis','').strip(), (opening,bp.get('central_engineering_crisis'))
          assert 'review required' not in opening.lower()
          assert any(x in opening.lower() for x in ['parallel schedule','deadlock','does not','not serializ','wrong'])

          u2=units[1]; spine=[str(x).strip() for x in u2.get('core_content',[]) if str(x).strip()]
          assert 5 <= len(spine) <= 8, spine
          spine_blob=' | '.join(spine).lower()
          assert sum(t in spine_blob for t in ['transaction','locking','deadlock','phantom','predicate','range','escrow','serializ','concurrency','recovery']) >= 5, spine

          technical=units[5:15]
          titles=[u.get('title','').strip() for u in technical]
          assert len(set(t.lower() for t in titles)) >= 8, titles
          visible=' '.join([
              bp.get('central_engineering_crisis',''), *bp.get('source_topic_families',[]),
              *[u.get('title','') for u in units],
              *[x for u in units for x in u.get('core_content',[])],
          ]).lower()
          bad_phrases=[
              'gold standard mechanism','t1: update','t1 commits','big a granule','ever, what to do with',
              'mit opencourseware','terms of use','review required','second amendment','down syndrome',
              'wikipedia.org','wikimedia.org','a team must make a consequential decision'
          ]
          for bad in bad_phrases:
              assert bad not in visible, (bad,titles,spine)

          Path('/tmp/iscarb_v720/job.json').write_text(json.dumps(job,indent=2),encoding='utf-8')
          prev=requests.get(f'{base}/api/jobs/{jid}/presenter',timeout=90); prev.raise_for_status()
          Path('/tmp/iscarb_v720/presenter.html').write_bytes(prev.content)
          ptext=prev.text.lower()
          for bad in bad_phrases:
              assert bad not in ptext, ('presenter',bad)

          ppt=requests.get(f'{base}/api/jobs/{jid}/export/pptx',timeout=120); ppt.raise_for_status()
          Path('/tmp/iscarb_v720/database_transactions.pptx').write_bytes(ppt.content)
          assert ppt.content[:2]==b'PK'
          with zipfile.ZipFile(BytesIO(ppt.content)) as z:
              names=z.namelist(); assert 'ppt/presentation.xml' in names
              slides=[n for n in names if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              assert 22 <= len(slides) <= 30, len(slides)
              allxml=' '.join(z.read(n).decode('utf-8','ignore').lower() for n in names if n.endswith('.xml') or n.endswith('.rels'))
              for bad in bad_phrases:
                  assert bad not in allxml, ('pptx',bad)
          Path('/tmp/iscarb_v720/summary.json').write_text(json.dumps({
              'job_id':jid,'status':job['status'],'lecture_title':bp.get('lecture_title'),
              'opening':opening,'spine':spine,'technical_titles':titles,
              'core_units':len(units),'physical_slides':len(slides),'pptx_bytes':len(ppt.content),'p1':p1
          },indent=2),encoding='utf-8')
          print('CLEAN_DATABASE_STRUCTURAL_PASS',len(slides),spine,titles)
          PY

      - name: Render PowerPoint and build visual contact sheet
        run: |
          set -euxo pipefail
          cd /tmp/iscarb_v720
          mkdir -p lo_profile rendered
          timeout 120s libreoffice --headless -env:UserInstallation=file:///tmp/iscarb_v720/lo_profile --convert-to pdf --outdir rendered database_transactions.pptx
          test -s rendered/database_transactions.pdf
          pdftoppm -png -r 96 rendered/database_transactions.pdf rendered/slide >/dev/null 2>&1
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageStat
          from pathlib import Path
          imgs=sorted(Path('/tmp/iscarb_v720/rendered').glob('slide-*.png'))
          assert 22 <= len(imgs) <= 30, len(imgs)
          thumbs=[]
          for p in imgs:
              im=Image.open(p).convert('RGB')
              stat=ImageStat.Stat(im)
              # Reject completely blank/corrupt slides, without dictating design colour.
              assert max(stat.var)>2.0, (p.name,stat.var)
              im.thumbnail((480,270)); thumbs.append((p.name,im.copy()))
          cols=4; rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*500,rows*300),'white'); d=ImageDraw.Draw(sheet)
          for i,(name,im) in enumerate(thumbs):
              x=(i%cols)*500; y=(i//cols)*300
              sheet.paste(im,(x,y+24)); d.text((x+4,y+4),name,fill='black')
          sheet.save('/tmp/iscarb_v720/pptx_contact_sheet.jpg',quality=90)
          print('PPTX_VISUAL_RENDER_PASS',len(imgs))
          PY

      - name: Capture live presenter in Chromium
        run: |
          set -euxo pipefail
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          jid=Path('/tmp/iscarb_v720/job_id.txt').read_text().strip()
          url=f'https://iscarb-lecture-studio.onrender.com/api/jobs/{jid}/presenter'
          bad=['gold standard mechanism','t1: update','t1 commits','big a granule','ever, what to do with','mit opencourseware','terms of use','review required','second amendment','down syndrome']
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await b.new_page(viewport={'width':1600,'height':1000})
                  errors=[]; page.on('console',lambda msg: errors.append(msg.text) if msg.type=='error' else None); page.on('pageerror',lambda e: errors.append(str(e)))
                  r=await page.goto(url,wait_until='networkidle',timeout=60000); assert r and r.status==200
                  await page.wait_for_timeout(1000); assert await page.evaluate('document.readyState')=='complete'
                  text=(await page.locator('body').inner_text()).lower()
                  assert 'transaction' in text or 'locking' in text
                  for x in bad: assert x not in text, x
                  assert not errors, errors
                  await page.screenshot(path='/tmp/iscarb_v720/presenter_full.png',full_page=True)
                  print('PRESENTER_CHROMIUM_PASS',await page.title())
                  await b.close()
          asyncio.run(main())
          PY

      - name: Upload v7.2 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscarb-v720-live-readiness-${{ github.run_id }}
          path: /tmp/iscarb_v720/
          if-no-files-found: error
          retention-days: 14
