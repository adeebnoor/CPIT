name: One-shot Inspect Live Chapter 2 Job

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-inspect-ch2-live-job.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact live job profile
        env:
          URL: https://iscarb-lecture-studio.onrender.com/api/jobs/e62276d06592433f80b308f8846bbc40
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(os.environ['URL'],headers={'User-Agent':'ISCARB-inspect/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r: job=json.load(r)
          p=job.get('source_profile') or {}
          print('STATUS',job.get('status'))
          print('MESSAGE',job.get('message'))
          print('WARNINGS',json.dumps(p.get('source_warnings') or [],ensure_ascii=False,indent=2))
          print('MANIFEST',json.dumps(p.get('source_manifest') or [],ensure_ascii=False,indent=2))
          rows=[]
          for x in p.get('coverage_items') or []:
              rows.append({'id':x.get('id'),'importance':x.get('importance'),'label':x.get('label'),'anchor':x.get('source_anchor')})
          print('COVERAGE_COUNT',len(rows))
          print('COVERAGE',json.dumps(rows,ensure_ascii=False,indent=2))
          bp=job.get('blueprint') or {}
          print('LEDGER_COUNT',len(bp.get('coverage_ledger') or []))
          print('LEDGER_IDS',[x.get('coverage_id') for x in (bp.get('coverage_ledger') or [])])
          print('READINESS',json.dumps(bp.get('readiness_alignment') or [],ensure_ascii=False,indent=2))
          PY
