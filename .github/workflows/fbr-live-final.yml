name: One-off live FBR verification
on:
  push:
    paths:
      - '.github/workflows/fbr-live-final.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Run live browser verification
        run: |
          cat > live-e2e.cjs <<'JS'
          const puppeteer=require('puppeteer-core'),fs=require('fs'),cp=require('child_process');
          const BASE='https://adeebnoor.github.io/CPIT/';
          const assert=(x,m)=>{if(!x)throw new Error(m)}; const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function ch(browser,ch){const p=await browser.newPage();await p.setViewport({width:1440,height:1000});await p.goto(BASE+'iscarb.html?e2e='+Date.now(),{waitUntil:'domcontentloaded'});let h=await p.$eval(`a.student[href*="chapter=${ch}"]`,a=>a.href);await p.goto(h,{waitUntil:'domcontentloaded'});assert(await p.$eval('#openBtn',b=>b.disabled),`Ch${ch} gate starts enabled`);await p.type('#sid',`LIVETEST${ch}`);await p.click('#ack');assert(!(await p.$eval('#openBtn',b=>b.disabled)),`Ch${ch} gate failed`);await Promise.all([p.waitForNavigation({waitUntil:'domcontentloaded'}),p.click('#openBtn')]);assert(p.url().includes(`Ch${ch}-FBR-Student-Assignment.html`),`Ch${ch} assignment navigation failed`);assert((await p.$eval('#partB',e=>e.innerText.trim()))==='',`Ch${ch} STRESS visible before commit`);for(const [id,t] of Object.entries({fit:'A suitable engineering mechanism is selected because it directly fits the stated professional decision and its consequences.',bound:'The decision remains fit only while the stated observable operating condition remains true; reopen it when that condition changes.',act:'Issue a concrete professional action with an accountable owner, explicit operating condition, and review trigger.',evidence:'Use timestamped logs, measurements, tests, and an accountable owner record as inspectable evidence for the decision.'}))await p.type('#'+id,t);await p.click('#lock');await p.waitForSelector('input[name=boundaryState]',{timeout:10000});assert(await p.$$eval('#fit,#bound,#act,#evidence',e=>e.every(x=>x.readOnly)),`Ch${ch} Part A not locked`);assert((await p.$eval('#partB .stress',e=>e.innerText)).length>30,`Ch${ch} STRESS missing`);assert(await p.$$eval('#pdf,#download,#copy',e=>e.every(x=>x.disabled)),`Ch${ch} export enabled early`);await p.click('input[name=boundaryState][value="CROSSED"]');await p.click('input[name=refit][value="REVISE"]');await p.type('#refitwhy','The new evidence crosses the applicability condition I committed, so the action requires a justified revision rather than a reflexive change.');await p.type('#revised','Revise the professional artifact to address the changed boundary, retain inspectable evidence, and define the next review trigger and accountable owner.');await wait(600);assert(await p.$$eval('#pdf,#download,#copy',e=>e.every(x=>!x.disabled)),`Ch${ch} export stayed disabled`);await p.evaluate(()=>printSheet());const pdf=`/tmp/live-ch${ch}.pdf`;await p.emulateMediaType('print');await p.pdf({path:pdf,format:'A4',printBackground:true});cp.execFileSync('pdftotext',[pdf,pdf+'.txt']);let txt=fs.readFileSync(pdf+'.txt','utf8');for(const t of ['FIT','BOUND','ACT','EVIDENCE','STRESS','Boundary status','REFIT','Final Artifact'])assert(txt.includes(t),`Ch${ch} live PDF missing ${t}`);console.log(`LIVE PASS Ch${ch} After-Class (${fs.statSync(pdf).size} bytes)`);await p.close();}
          async function incl(browser,ch){const p=await browser.newPage();await p.setViewport({width:1920,height:1080});await p.goto(BASE+'iscarb.html?e2e='+Date.now(),{waitUntil:'domcontentloaded'});let h=await p.$eval(`article[data-n="${ch}"] a.faculty`,a=>a.href);await p.goto(h,{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>location.pathname.endsWith('/Faculty-Presenter.html'),{timeout:10000});await p.waitForFunction(()=>{let f=document.getElementById('lecture');return f&&f.contentDocument&&f.contentDocument.querySelectorAll('#stage .slide').length>0},{timeout:10000});await p.waitForFunction(()=>window.__facultyFocus?.indexes?.length>1,{timeout:10000});let s=await p.evaluate(()=>{let f=document.getElementById('lecture');return{slides:f.contentDocument.querySelectorAll('#stage .slide').length,focus:window.__facultyFocus.indexes.length,status:document.getElementById('status').innerText,text:f.contentDocument.body.innerText}});assert(s.slides>=10&&s.focus>=2,`Ch${ch} live presenter incomplete`);assert(s.text.toLowerCase().includes(ch==='10'?'dependable':'reliability'),`Ch${ch} live chapter text missing`);console.log(`LIVE PASS Ch${ch} In-Class (${s.slides} raw / ${s.focus} focus; ${s.status})`);await p.close();}
          (async()=>{const b=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});try{await ch(b,'10');await ch(b,'11');await incl(b,'10');await incl(b,'11');console.log('ALL LIVE TESTS PASSED')}finally{await b.close()}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node live-e2e.cjs
