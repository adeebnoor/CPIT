name: One-shot SlideShare Ch2 Software Processes QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-slideshare-ch2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ch2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://iscarb-lecture-studio.onrender.com
      SOURCE_URL: https://www.slideshare.net/slideshow/ian-sommerville-software-engineering-tenth-edition-pearson-education-limited-2016/287925972
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install requests pypdf python-pptx

      - name: Compile Chapter 2 on live production and verify source completeness
        run: |
          python - <<'PY'
          import json, os, pathlib, time, requests
          base=os.environ['BASE_URL'].rstrip('/'); source=os.environ['SOURCE_URL']
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-Ch2-live-QA/4.3'})
          h=s.get(base+'/api/health',timeout=60); h.raise_for_status(); health=h.json()
          assert health.get('version')=='4.3.0', health
          assert health.get('pipeline')=='faculty-studio-v4.3.0-cimt-native-presenter-gate-v14', health
          r=s.post(base+'/api/compile',data={
              'primary_url':source,
              'supporting_urls':'',
              'lecture_focus':'Preserve the complete Chapter 2 Software Processes technical scope and original teaching logic. Cover every major P1 checkpoint by Unit 15. Use CIMT source-native visuals and learn-by-doing choreography; do not replace source topics with framework labels.',
              'model':'auto',
              'repair_rounds':'1',
          },timeout=120)
          print('COMPILE SUBMIT',r.status_code,r.text[:1200]); r.raise_for_status()
          job_id=r.json()['job_id']; pathlib.Path('/tmp/job_id.txt').write_text(job_id)
          deadline=time.time()+2100; job=None
          while time.time()<deadline:
              jr=s.get(base+'/api/jobs/'+job_id,timeout=60); jr.raise_for_status(); job=jr.json()
              print('STATE',job.get('status'),job.get('progress'),(job.get('message') or '')[:240],flush=True)
              if job.get('status') in {'ready','blocked','error'}:
                  break
              time.sleep(8)
          assert job and job.get('blueprint'), json.dumps(job,ensure_ascii=False)[:6000]
          assert job.get('status') in {'ready','blocked'}, job.get('status')
          bp=job['blueprint']; profile=job.get('source_profile') or {}
          assert bp.get('session_minutes')==90
          assert len(bp.get('units') or [])==20
          assert [u.get('number') for u in bp['units']]==list(range(1,21))
          assert len(bp.get('clos') or [])==5
          assert bp.get('source_manifest')

          majors=[x for x in profile.get('coverage_items',[]) if str(x.get('importance','')).lower()=='major']
          assert majors, 'No major P1 checkpoints found'
          ledger={x.get('coverage_id'):x for x in (bp.get('coverage_ledger') or []) if x.get('coverage_id')}
          missing=[x.get('id') for x in majors if x.get('id') not in ledger]
          late=[x.get('id') for x in majors if x.get('id') in ledger and int(ledger[x.get('id')].get('first_taught_unit') or 99)>15]
          assert not missing, ('missing major P1 checkpoints',missing)
          assert not late, ('major P1 checkpoints first taught after Unit 15',late)

          text=' '.join(' '.join(map(str,u.get('core_content') or []))+' '+str(u.get('title') or '') for u in bp['units']).lower()
          signatures={
              'waterfall':'waterfall',
              'incremental development':'incremental',
              'integration/configuration':'integration',
              'requirements engineering':'requirements',
              'design/implementation':'design',
              'validation/testing':'validation',
              'software evolution':'evolution',
              'prototyping':'prototyp',
              'incremental delivery':'delivery',
              'process improvement':'process improvement',
              'measurement/metrics':'measure',
              'maturity model':'matur',
          }
          absent=[name for name,needle in signatures.items() if needle not in text]
          assert not absent, ('expected Chapter 2 technical signatures absent from learner core',absent)

          checks=job.get('deterministic_checks') or {}
          for key in ('v14_exactly_20_presenter_jobs','v14_exactly_90_live_minutes','v14_no_authored_hard_truncation_tokens'):
              assert checks.get(key) is True,(key,checks.get(key))

          pathlib.Path('/tmp/health.json').write_text(json.dumps(health,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('/tmp/job.json').write_text(json.dumps(job,ensure_ascii=False,indent=2),encoding='utf-8')
          summary={
              'job_id':job_id,'status':job.get('status'),'title':bp.get('lecture_title'),
              'units':20,'minutes':90,'clos':5,'major_p1_checkpoints':len(majors),
              'missing_major':missing,'late_major':late,'absent_technical_signatures':absent,
              'deterministic_failed':[k for k,v in checks.items() if v is False],
          }
          pathlib.Path('/tmp/compile-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CH2 SOURCE COMPLETENESS PASS',json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Download and structurally validate every output
        run: |
          python - <<'PY'
          import json, os, pathlib, zipfile, requests
          from pypdf import PdfReader
          from pptx import Presentation
          from pptx.enum.shapes import MSO_SHAPE_TYPE
          base=os.environ['BASE_URL'].rstrip('/'); job_id=pathlib.Path('/tmp/job_id.txt').read_text().strip()
          s=requests.Session(); s.headers.update({'User-Agent':'ISCARB-Ch2-live-QA/4.3'})
          out=pathlib.Path('/tmp/ch2-live-output'); out.mkdir(exist_ok=True)
          endpoints={
            'presenter.html':f'/api/jobs/{job_id}/presenter',
            'presenter.pptx':f'/api/jobs/{job_id}/export/pptx',
            'presenter.pdf':f'/api/jobs/{job_id}/export/presenter-pdf',
            'reading-pack.pdf':f'/api/jobs/{job_id}/export/pdf',
            'instructor-guide.docx':f'/api/jobs/{job_id}/export/docx',
            'student-pack.docx':f'/api/jobs/{job_id}/export/student',
            'blueprint.json':f'/api/jobs/{job_id}/export/json',
          }
          sizes={}
          for name,path in endpoints.items():
              r=s.get(base+path,timeout=180); print(name,r.status_code,len(r.content),r.headers.get('content-type'))
              r.raise_for_status(); assert len(r.content)>500; (out/name).write_bytes(r.content); sizes[name]=len(r.content)

          preview=(out/'presenter.html').read_text(encoding='utf-8'); assert len(preview)>5000
          for banned in ('WHY THIS MATTERS','VISUAL LECTURE ENGINE V2'):
              assert banned not in preview.upper(), banned

          prs=Presentation(out/'presenter.pptx'); assert len(prs.slides)==20
          ppt_text=' '.join(sh.text for sl in prs.slides for sh in sl.shapes if hasattr(sh,'text_frame'))
          assert '...' not in ppt_text and '…' not in ppt_text
          pictures=sum(1 for sl in prs.slides for sh in sl.shapes if sh.shape_type==MSO_SHAPE_TYPE.PICTURE)
          slide_chars=[sum(len(sh.text.strip()) for sh in sl.shapes if hasattr(sh,'text') and sh.text) for sl in prs.slides]
          assert min(slide_chars)>20, ('near-empty PPTX slide',slide_chars)

          pp=PdfReader(str(out/'presenter.pdf')); assert len(pp.pages)==20
          page_chars=[len((p.extract_text() or '').strip()) for p in pp.pages]
          assert min(page_chars)>20, ('near-empty Presenter PDF page',page_chars)
          rp=PdfReader(str(out/'reading-pack.pdf')); assert len(rp.pages)>=1
          for name in ('instructor-guide.docx','student-pack.docx'):
              with zipfile.ZipFile(out/name) as z: assert 'word/document.xml' in z.namelist()
          exported=json.loads((out/'blueprint.json').read_text(encoding='utf-8'))
          assert exported.get('session_minutes')==90 and len(exported.get('units') or [])==20

          summary=json.loads(pathlib.Path('/tmp/compile-summary.json').read_text())
          summary.update({'presenter_slides':20,'presenter_pdf_pages':20,'reading_pack_pages':len(rp.pages),
                          'ppt_picture_shapes':pictures,'ppt_slide_text_chars':slide_chars,'pdf_page_text_chars':page_chars,
                          'export_sizes':sizes,'all_seven_outputs_valid':True})
          (out/'qa-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'job.json').write_bytes(pathlib.Path('/tmp/job.json').read_bytes())
          (out/'health.json').write_bytes(pathlib.Path('/tmp/health.json').read_bytes())
          print('CH2 ALL OUTPUTS PASS',json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload Chapter 2 live QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: slideshare-ch2-software-processes-live-qa
          path: /tmp/ch2-live-output/*
          if-no-files-found: error
