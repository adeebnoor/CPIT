name: Review nine-chapter classroom release
on:
  push:
    paths: ['.github/workflows/course-classroom-review.yml', 'tools/apply_classroom_review_fixes.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: classroom-release-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Download the explicit public course package through its visible control
        run: |
          mkdir -p test-results
          python - <<'PY'
          import asyncio, re, hashlib
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def run():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  page=await b.new_page()
                  await page.goto('https://firestorage.ai/ja/f/Y32HURpe59h3',wait_until='networkidle')
                  await page.get_by_text('ISCARB_Course_20260921_Reviewed.zip',exact=False).first.wait_for(timeout=90000)
                  print((await page.locator('body').inner_text())[:10000])
                  await page.screenshot(path='test-results/package-share.png',full_page=True)
                  controls=page.get_by_role('button',name=re.compile('ダウンロード|download',re.I))
                  chosen=None
                  for control in await controls.all():
                      text=await control.inner_text()
                      if await control.is_visible() and await control.is_enabled() and not re.search('まとめ|一括|all',text,re.I):
                          chosen=control;break
                  if chosen is None:raise RuntimeError('No ordinary file download control found')
                  async with page.expect_download(timeout=180000) as pending:await chosen.click()
                  download=await pending.value
                  await download.save_as('/tmp/classroom-release.zip')
                  digest=hashlib.sha256(Path('/tmp/classroom-release.zip').read_bytes()).hexdigest()
                  print('Downloaded',download.suggested_filename,digest)
                  assert digest=='59de19e8b42fbda156238f33352daf9c5dd7f907409a9e853359ee2c611417ca','Release digest mismatch'
                  await b.close()
          asyncio.run(run())
          PY
      - name: Apply only the checked course payload
        run: |
          python - <<'PY'
          import json,zipfile,pathlib,hashlib,subprocess
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/classroom-release.zip') as z:
              m=json.loads(z.read('RELEASE-MANIFEST.json'))
              assert m['base_commit']=='67d536f9af68075a5ecf407920aba84ffa9adf20'
              changed=subprocess.check_output(['git','diff','--name-only',m['base_commit'],'HEAD'],text=True).splitlines()
              assert set(changed)<={'.github/workflows/course-classroom-review.yml','tools/apply_classroom_review_fixes.py'},'Concurrent source changes require review'
              assert sum(x.file_size for x in z.infolist())<200_000_000
              assert set(z.namelist())=={'RELEASE-MANIFEST.json'}|{'payload/'+n for n in m['files']}
              for name,digest in m['files'].items():
                  dest=(root/name).resolve()
                  assert dest.is_relative_to(root) and not name.startswith(('.git/','.github/'))
                  assert name.startswith(('lectures/iscarb/','curriculum/','tools/')) or name in ['iscarb.html','student-guide.html','instructor-guide.html','course-resources.html','methodology.html','download.html','iSCARB-Teaching-Template.md']
                  content=z.read('payload/'+name)
                  assert hashlib.sha256(content).hexdigest()==digest,name
                  dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(content)
              pathlib.Path('/tmp/classroom-manifest.json').write_text(json.dumps(m))
          print('Applied',len(m['files']),'explicitly checked course files')
          PY
          python tools/apply_classroom_review_fixes.py
      - name: Check source fidelity and release structure
        run: |
          python tools/audit_classroom.py
          node tools/check-fbr-release.mjs
          python tools/build_public_site.py
      - name: Run preserved assignment, gateway and classroom checks
        run: |
          npm install --no-save --package-lock=false jsdom@30.0.1
          set -o pipefail
          {
            node tools/check-course-interactions.cjs
            node tools/check-assignment-v5.cjs
            node tools/learning-path-tests/check-path.cjs
            node tools/learning-path-tests/check-visual.cjs
            node tools/learning-path-tests/check-assignments.cjs
            node tools/learning-path-tests/check-labs.cjs
            node tools/learning-path-tests/check-hub.cjs
          } 2>&1 | tee test-results/dom-review.log
      - name: Verify the staged release with real HTTP and Chromium
        run: |
          python -m http.server 8765 --directory _site > /tmp/course-http.log 2>&1 &
          sleep 2
          set -o pipefail
          COURSE_BASE_URL=http://127.0.0.1:8765/ python tools/classroom-v3-tests/check-classroom-http.py 2>&1 | tee test-results/http-review.log
      - name: Commit only after all checks pass, without changing the live branch
        run: |
          git switch -c iscarb-classroom-reviewed-20260921
          python - <<'PY'
          import json,subprocess,hashlib,pathlib
          m=json.load(open('/tmp/classroom-manifest.json'))
          for name,digest in m['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','add','--',*m['files']],check=True)
          PY
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git commit -m 'Unify nine source-preserving iSCARB chapters with visible stations and aligned assignments'
          git push origin HEAD:refs/heads/iscarb-classroom-reviewed-20260921
          git rev-parse HEAD | tee test-results/REVIEWED_COMMIT.txt
          echo 'All gates passed. The reviewed commit is on the staging branch; main has not been advanced.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain browser proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-release-browser-proof
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain isolated DOM tools for a failed review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-dom-diagnostics
          path: node_modules/
          if-no-files-found: ignore
          retention-days: 1
