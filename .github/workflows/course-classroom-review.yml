name: Verify published iSCARB classroom release
on:
  push:
    paths: ['.github/workflows/course-classroom-review.yml']
  workflow_run:
    workflows: ['Deploy static content to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classroom-live-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed sources locally
        run: python tools/audit_classroom.py
      - name: Wait for the exact reviewed lecture bytes on Pages
        run: |
          mkdir -p test-results
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          p=json.loads(Path('curriculum/publication.json').read_text())
          base='https://adeebnoor.github.io/CPIT/'
          manifest={c['path']:c['source_sha256'] for c in p['lectures']}
          for name,digest in p['delivery_asset_sha256'].items():
              if name.startswith('lectures/iscarb/runtime/'):
                  manifest[name]=digest
          last=[]
          for attempt in range(18):
              last=[];records=[]
              for name,digest in manifest.items():
                  try:
                      req=urllib.request.Request(base+name+'?verify='+str(int(time.time())),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as r:data=r.read();status=r.status
                      actual=hashlib.sha256(data).hexdigest()
                      records.append({'path':name,'http':status,'expected':digest,'actual':actual,'bytes':len(data),'match':actual==digest})
                      if actual!=digest:last.append(name)
                  except Exception as e:last.append(name+': '+str(e))
              if not last:
                  Path('test-results/live-byte-verification.json').write_text(json.dumps({'release':p['release'],'base':base,'verified':records},indent=2));break
              print('Waiting for Pages cache:',last,flush=True);time.sleep(10)
          assert not last,last
          for page in ['iscarb.html','student-guide.html','instructor-guide.html','course-resources.html','methodology.html','download.html']:
              with urllib.request.urlopen(base+page,timeout=20) as r:assert r.status==200,page
          print('PASS: all nine lectures and shared runtime match the approved bytes on the live site.')
          PY
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise the live course with isolated QA drafts
        env:
          COURSE_BASE_URL: https://adeebnoor.github.io/CPIT/
        run: |
          set -o pipefail
          python tools/classroom-v3-tests/check-classroom-http.py 2>&1 | tee test-results/live-http-review.log
      - name: Record the deployed revision
        run: |
          git rev-parse HEAD > test-results/VERIFIED_COMMIT.txt
          echo 'Live verification passed: exact lecture/runtime bytes, 360 desktop/mobile slide checks, station timers, draft reload, JSON export/import, rule links, 45 practice items and nine delayed-reveal assignments.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-live-browser-proof
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
